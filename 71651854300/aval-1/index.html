<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMS - Sistema de Gestão de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>📦 Sistema de Gestão de Estoque (IMS)</h1>
            <p>Controle seus produtos, finanças e inventário em tempo real.</p>
        </header>

        <!-- Painel de Resumo / Cards -->
        <section class="summary-cards">
            <div class="card summary-card">
                <h3>Total de Produtos</h3>
                <p id="total-items">0</p>
            </div>
            <div class="card summary-card">
                <h3>Valor Total em Estoque</h3>
                <p id="total-value">R$ 0,00</p>
            </div>
        </section>

        <!-- Formulário de Cadastro -->
        <section class="card">
            <h2>Adicionar Novo Produto</h2>
            <form id="product-form">
                <div class="input-group">
                    <label for="name">Nome do Produto</label>
                    <input type="text" id="name" required placeholder="Ex: Camiseta Básica">
                </div>
                <div class="input-group">
                    <label for="category">Categoria</label>
                    <input type="text" id="category" required placeholder="Ex: Vestuário">
                </div>
                <div class="input-group">
                    <label for="quantity">Quantidade</label>
                    <input type="number" id="quantity" min="0" required placeholder="Ex: 10">
                </div>
                <div class="input-group">
                    <label for="price">Preço Unitário (R$)</label>
                    <input type="number" id="price" step="0.01" min="0" required placeholder="Ex: 49.90">
                </div>
                <button type="submit" class="btn-primary">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Lista de Produtos, Filtro e Exportação -->
        <section class="card">
            <div class="table-header">
                <h2>Inventário Atual</h2>
                <div class="table-actions">
                    <input type="text" id="search" placeholder="🔍 Buscar produto...">
                    <button id="btn-export" class="btn-export">Exportar CSV</button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Qtd.</th>
                            <th>Preço Unitário</th>
                            <th>Valor Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="product-list">
                        <!-- Os produtos entram aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
