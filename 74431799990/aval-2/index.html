<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>✅ Gerenciador de Tarefas</h1>
        <p>Organize suas tarefas de forma simples</p>
    </header>

    <main>

        <!-- Cadastro -->
        <section class="card">

            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <div class="campo">

                    <label for="tarefa">
                        Tarefa
                    </label>

                    <input
                        type="text"
                        id="tarefa"
                        placeholder="Digite uma tarefa..."
                        required
                    >

                </div>

                <div class="campo">

                    <label for="prioridade">
                        Prioridade
                    </label>

                    <select id="prioridade">

                        <option value="baixa">
                            Baixa
                        </option>

                        <option value="media" selected>
                            Média
                        </option>

                        <option value="alta">
                            Alta
                        </option>

                    </select>

                </div>

                <button type="submit">
                    Adicionar tarefa
                </button>

            </form>

        </section>


        <!-- Resumo -->
        <section class="resumo">

            <div class="resumo-card">

                <span>Total</span>

                <strong id="totalTarefas">
                    0
                </strong>

            </div>

            <div class="resumo-card">

                <span>Pendentes</span>

                <strong id="tarefasPendentes">
                    0
                </strong>

            </div>

            <div class="resumo-card">

                <span>Concluídas</span>

                <strong id="tarefasConcluidas">
                    0
                </strong>

            </div>

        </section>


        <!-- Filtros -->
        <section class="card">

            <div class="filtros">

                <button
                    class="filtro ativo"
                    data-filtro="todas">
                    Todas
                </button>

                <button
                    class="filtro"
                    data-filtro="pendentes">
                    Pendentes
                </button>

                <button
                    class="filtro"
                    data-filtro="concluidas">
                    Concluídas
                </button>

            </div>

        </section>


        <!-- Lista -->
        <section class="card">

            <h2>Minhas tarefas</h2>

            <div id="listaTarefas">

            </div>

            <p
                id="mensagemVazia"
                class="mensagem-vazia">

                Nenhuma tarefa cadastrada.

            </p>

        </section>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
