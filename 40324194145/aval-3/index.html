<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  
<div class="container">

    <header>
        <h1>Calculadora de IMC</h1>
        <p>Gerencie pessoas e acompanhe seus resultados.</p>
    </header>

    <section class="card">
        <h2 id="titulo-formulario">Cadastrar pessoa</h2>

        <form id="form-pessoa">

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite o nome" required>
            </div>

            <div class="campo">
                <label for="idade">Idade</label>
                <input type="number" id="idade" placeholder="Ex: 18" min="1" max="120" required>
            </div>

            <div class="campo">
                <label for="altura">Altura (metros)</label>
                <input type="number" id="altura" placeholder="Ex: 1.70" step="0.01" required>
            </div>

            <div class="campo">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" placeholder="Ex: 65" step="0.1" required>
            </div>

            <div class="botoes">
                <button type="submit" id="btn-salvar">Cadastrar pessoa</button>
                <button type="button" id="btn-cancelar" class="btn-cancelar" hidden>Cancelar</button>
            </div>

        </form>

        <p id="mensagem"></p>
    </section>

    <section class="resumo">
        <div class="resumo-card">
            <span>Total de pessoas</span>
            <strong id="total-pessoas">0</strong>
        </div>

        <div class="resumo-card">
            <span>Média de IMC</span>
            <strong id="media-imc">0.00</strong>
        </div>
    </section>

    <section class="card">
        <div class="cabecalho-tabela">
            <h2>Pessoas cadastradas</h2>
            <input type="search" id="pesquisa" placeholder="Pesquisar nome...">
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Altura</th>
                        <th>Peso</th>
                        <th>IMC</th>
                        <th>Classificação</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabela-pessoas"></tbody>
            </table>
        </div>

        <p id="vazio">Nenhuma pessoa cadastrada.</p>
    </section>

    <footer>
        <p>Calculadora de IMC | Projeto de programação</p>
    </footer>

</div>

  <script src="script.js"></script>
  
</body>
</html>
