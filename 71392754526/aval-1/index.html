
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Sistema de Estoque</h1>
        <p>Cadastro e gerenciamento de produtos</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formCadastro">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao"
                       placeholder="Nome do produto" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade"
                       min="0" step="1" placeholder="Ex.: 10" required>

                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor"
                       min="0.01" step="0.01"
                       placeholder="Ex.: 25.90" required>

                <button type="submit">Cadastrar produto</button>
            </form>
            <p id="mensagem" role="status"></p>
        </section>

        <section class="card">
            <h2>Alterar valor ou quantidade</h2>

            <label for="codigoAlterar">Código do produto:</label>
            <input type="number" id="codigoAlterar"
                   min="1" step="1" placeholder="Digite o código">

            <label for="novoValor">Novo valor (R$):</label>
            <input type="number" id="novoValor"
                   min="0.01" step="0.01" placeholder="Novo preço">

            <button type="button" id="btnValor">
                Alterar valor
            </button>

            <label for="novaQuantidade">Nova quantidade:</label>
            <input type="number" id="novaQuantidade"
                   min="0" step="1" placeholder="Nova quantidade">

            <button type="button" id="btnQuantidade">
                Alterar quantidade
            </button>
        </section>

        <section class="card">
            <h2>Produtos cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>

            <p id="totalProdutos">Total de produtos: 0</p>
        </section>
    </main>

    <footer>
        <p>Sistema de Estoque de Produtos</p>
    </footer>
<script src="script.js"></script></body>
</html>
