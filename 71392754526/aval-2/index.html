
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas tarefas e acompanhe seu progresso</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar nova tarefa</h2>

            <form id="formTarefa">
                <label for="titulo">Título da tarefa:</label>
                <input type="text" id="titulo"
                    placeholder="Digite o título" required>

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade" required>
                    <option value="">Selecione</option>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit">Cadastrar tarefa</button>
            </form>

            <p id="mensagem" role="status"></p>
        </section>

        <section class="card">
            <h2>Concluir ou alterar tarefa</h2>

            <label for="codigo">Código da tarefa:</label>
            <input type="number" id="codigo" min="1"
                step="1" placeholder="Digite o código">

            <button type="button" id="btnConcluir">
                Marcar como concluída
            </button>

            <label for="novaPrioridade">Nova prioridade:</label>
            <select id="novaPrioridade">
                <option value="">Selecione</option>
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button type="button" id="btnPrioridade">
                Alterar prioridade
            </button>
        </section>

        <section class="card">
            <h2>Lista de tarefas</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="listaTarefas"></tbody>
                </table>
            </div>

            <p id="totalTarefas">Total de tarefas: 0</p>
        </section>
    </main>

    <footer>
        <p>Sistema de Gerenciamento de Tarefas</p>
    </footer>
<script src="script.js"></script></body>
</html>
