<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="post">
  <div class="post-header">
    <img src="https://unsplash.com" alt="Perfil" class="avatar">
    <span class="username">desenvolvedor_br</span>
  </div>

  <img src="https://unsplash.com" alt="Postagem" class="post-image" id="post-img">

  <div class="post-actions">
    <div class="left-actions">
      <button id="btn-like" class="action-btn">🤍</button>
      <button id="btn-comment-focus" class="action-btn">💬</button>
    </div>
    <button id="btn-save" class="action-btn">🔖</button>
  </div>

  <div class="post-info">
    <p class="likes"><strong id="like-count">124</strong> curtidas</p>
    <p class="caption"><strong>desenvolvedor_br</strong> Criando uma interface inspirada no Instagram usando HTML, CSS e JS! 🚀💻</p>
    
    <div id="comments-list" class="comments-list">
      <p><strong>ana.tech</strong> Ficou muito bom!</p>
    </div>
  </div>

  <form id="comment-form" class="comment-box">
    <input type="text" id="comment-input" placeholder="Adicione um comentário..." required>
    <button type="submit">Publicar</button>
  </form>
</div>$0
  <script src="script.js"></script>
  
</body>
</html>
