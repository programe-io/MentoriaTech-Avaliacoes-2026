
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Ficha de Anamnese</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>
                <body>

                <header>
                    <h1>Ficha de Anamnese</h1>
                        <p>Cadastro e histórico de saúde do paciente</p>
                        </header>

                        <main>
                            <form id="formAnamnese">

                                    <h2>Dados pessoais</h2>

                                            <label>Nome completo</label>
                                                    <input type="text" id="nome" required>

                                                            <div class="linha">
                                                                        <div>
                                                                                        <label>Data de nascimento</label>
                                                                                                        <input type="date" id="nascimento" required>
                                                                                                                    </div>
                                                                                                                                <div>
                                                                                                                                                <label>Telefone</label>
                                                                                                                                                                <input type="tel" id="telefone">
                                                                                                                                                                            </div>
                                                                                                                                                                                    </div>

                                                                                                                                                                                            <label>Sexo (opcional)</label>
                                                                                                                                                                                                    <select id="sexo">
                                                                                                                                                                                                                <option value="">Selecione</option>
                                                                                                                                                                                                                            <option>Feminino</option>
                                                                                                                                                                                                                                        <option>Masculino</option>
                                                                                                                                                                                                                                                    <option>Prefiro não informar</option>
                                                                                                                                                                                                                                                            </select>

                                                                                                                                                                                                                                                                    <h2>Histórico de saúde</h2>

                                                                                                                                                                                                                                                                            <label>Queixa principal</label>
                                                                                                                                                                                                                                                                                    <textarea id="queixa" required></textarea>

                                                                                                                                                                                                                                                                                            <label>Possui alguma alergia?</label>
                                                                                                                                                                                                                                                                                                    <select id="alergia">
                                                                                                                                                                                                                                                                                                                <option>Não informado</option>
                                                                                                                                                                                                                                                                                                                            <option>Sim</option>
                                                                                                                                                                                                                                                                                                                                        <option>Não</option>
                                                                                                                                                                                                                                                                                                                                                </select>

                                                                                                                                                                                                                                                                                                                                                        <label>Quais alergias?</label>
                                                                                                                                                                                                                                                                                                                                                                <input type="text" id="quaisAlergias">

                                                                                                                                                                                                                                                                                                                                                                        <label>Utiliza medicamentos?</label>
                                                                                                                                                                                                                                                                                                                                                                                <select id="medicamento">
                                                                                                                                                                                                                                                                                                                                                                                            <option>Não informado</option>
                                                                                                                                                                                                                                                                                                                                                                                                        <option>Sim</option>
                                                                                                                                                                                                                                                                                                                                                                                                                    <option>Não</option>
                                                                                                                                                                                                                                                                                                                                                                                                                            </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                    <label>Quais medicamentos?</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="quaisMedicamentos">

                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label>Possui alguma doença?</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <select id="doenca">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option>Não informado</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option>Sim</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option>Não</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Qual doença?</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="text" id="qualDoenca">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Observações adicionais</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <textarea id="observacoes"></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button type="submit">Salvar cadastro</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="reset" class="limpar">Limpar formulário</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <section class="cadastros">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h2>Pacientes cadastrados</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="listaPacientes"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>Projeto escolar - Sistema de Ficha de Anamnese</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
