
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechStore - Tecnologia</title>

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- Cabeçalho -->
    <header>
        <div class="logo">TECHSTORE</div>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#produtos">Produtos</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <!-- Página inicial -->
    <section class="hero" id="inicio">

        <h1>O futuro começa aqui!</h1>

        <p>
            Encontre os melhores produtos
            de tecnologia em um só lugar.
        </p>

        <a href="#produtos" class="btn">
            Explorar produtos
        </a>

    </section>

    <!-- Produtos -->
    <section class="produtos" id="produtos">

        <h2>Nossos produtos</h2>

        <div class="container">

            <!-- Produto 1 -->
            <div class="card">

                <img
                    src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500"
                    alt="Notebook"
                >

                <h3>Notebook Gamer</h3>

                <p class="preco">R$ 3.999,90</p>

                <button onclick="comprar('Notebook Gamer')">
                    Comprar
                </button>

            </div>

            <!-- Produto 2 -->
            <div class="card">

                <img
                    src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
                    alt="Headset"
                >

                <h3>Headset Pro</h3>

                <p class="preco">R$ 299,90</p>

                <button onclick="comprar('Headset Pro')">
                    Comprar
                </button>

            </div>

            <!-- Produto 3 -->
            <div class="card">

                <img
                    src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
                    alt="Smartwatch"
                >

                <h3>Smartwatch</h3>

                <p class="preco">R$ 499,90</p>

                <button onclick="comprar('Smartwatch')">
                    Comprar
                </button>

            </div>

        </div>

    </section>

    <!-- Rodapé -->
    <footer id="contato">

        <p>
            © 2026 TechStore -
            Todos os direitos reservados.
        </p>

    </footer>

    <!-- Arquivo JavaScript -->
    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
