<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed</title>
  <link rel="stylesheet" href="style.css">
  <!-- Ícones via FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

  <main class="feed-container">
    
    <!-- Caixa de Criação de Post -->
    <section class="card create-post">
      <div class="create-post-header">
        <img src="https://i.pravatar.cc/100?img=12" alt="Sua Foto" class="avatar">
        <textarea placeholder="No que você está pensando hoje?" rows="2"></textarea>
      </div>
      <div class="create-post-footer">
        <div class="post-actions-left">
          <button class="btn-action"><i class="fa-regular fa-image"></i> Foto</button>
          <button class="btn-action"><i class="fa-solid fa-paperclip"></i> Anexo</button>
        </div>
        <button class="btn-submit">Publicar</button>
      </div>
    </section>

    <!-- Post 1 (Com Imagem) -->
    <article class="card post">
      <header class="post-header">
        <img src="blob:https://web.whatsapp.com/c20ee20d-5cf8-432a-81ee-ef120ad10010" alt="Foto de Nadielle" class="avatar">
        <div class="post-info">
          <h3 class="author-name">Nadielle</h3>
          <span class="post-time">Há 2 horas</span>
        </div>
        <button class="btn-more"><i class="fa-solid fa-ellipsis"></i></button>
      </header>

      <div class="post-content">
        <p>Finalizando o novo design da interface do nosso projeto! 🚀 O que acharam dessa paleta de cores?</p>
        <img src="https://picsum.photos/600/350?random=1" alt="Imagem da publicação" class="post-image">
      </div>

      <footer class="post-footer">
        <button class="interaction-btn"><i class="fa-regular fa-heart"></i> 24</button>
        <button class="interaction-btn"><i class="fa-regular fa-comment"></i> 5</button>
        <button class="interaction-btn"><i class="fa-regular fa-share-from-square"></i> Compartilhar</button>
      </footer>
    </article>

    <!-- Post 2 (Apenas Texto) -->
    <article class="card post">
      <header class="post-header">
        <img src="https://i.pravatar.cc/100?img=60" alt="Foto de Carlos Eduardo" class="avatar">
        <div class="post-info">
          <h3 class="author-name">Marcos</h3>
          <span class="post-time">Há 5 horas</span>
        </div>
        <button class="btn-more"><i class="fa-solid fa-ellipsis"></i></button>
      </header>

      <div class="post-content">
        <p>A melhor forma de prever o futuro é inventá-lo. Foco nos estudos de HTML e CSS hoje! 💻✨</p>
      </div>

      <footer class="post-footer">
        <button class="interaction-btn liked"><i class="fa-solid fa-heart"></i> 42</button>
        <button class="interaction-btn"><i class="fa-regular fa-comment"></i> 12</button>
        <button class="interaction-btn"><i class="fa-regular fa-share-from-square"></i> Compartilhar</button>
      </footer>
    </article>

  </main>

</body>
</html>
