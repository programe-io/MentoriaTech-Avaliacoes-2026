<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Controle de produtos</p>
    </header>

    <main>

        <!-- PAINEL -->
        <section class="painel">

            <div class="card">
                <h3>Produtos</h3>
                <strong id="totalProdutos">0</strong>
            </div>

            <div class="card">
                <h3>Itens em estoque</h3>
                <strong id="totalItens">0</strong>
            </div>

            <div class="card">
                <h3>Estoque baixo</h3>
                <strong id="estoqueBaixo">0</strong>
            </div>

        </section>


        <!-- CADASTRO -->

        <section class="formulario">

            <h2>Cadastrar produto</h2>

            <form id="formProduto">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do produto"
                    required
                >

                <input
                    type="number"
                    id="quantidade"
                    placeholder="Quantidade"
                    min="0"
                    required
                >

                <input
                    type="number"
                    id="preco"
                    placeholder="Preço"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">
                    Adicionar
                </button>

            </form>

        </section>


        <!-- PESQUISA -->

        <section class="pesquisa">

            <input
                type="text"
                id="pesquisa"
                placeholder="🔎 Pesquisar produto..."
            >

        </section>


        <!-- ESTOQUE -->

        <section class="estoque">

            <h2>Lista de produtos</h2>

            <div class="tabela">

                <table>

                    <thead>

                        <tr>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>

                    </thead>

                    <tbody id="listaProdutos">
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <footer>
        Sistema de Estoque © 2026
    </footer>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
