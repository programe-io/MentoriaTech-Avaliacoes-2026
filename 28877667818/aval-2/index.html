
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>SocialNet</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#publicar">Publicar</a>
            <a href="#perfil">Perfil</a>
        </nav>
    </header>

    <main>
        <section class="criar-post" id="publicar">
            <h2>Criar publicação</h2>

            <input type="text" id="nome" placeholder="Seu nome">

            <textarea id="texto" placeholder="O que você está pensando?"></textarea>

            <button onclick="publicar()">Publicar</button>
        </section>

        <section class="feed">
            <h2>Feed de notícias</h2>

            <div id="publicacoes">

                <div class="post">
                    <h3>Maria Silva</h3>
                    <p class="data">04/11/2026</p>
                    <p>Olá pessoal! Bem-vindos à minha rede social! ❤️</p>

                    <div class="acoes">
                        <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                        <button onclick="comentar(this)">💬 Comentar</button>
                    </div>

                    <div class="comentarios"></div>
                </div>

                <div class="post">
                    <h3>João Santos</h3>
                    <p class="data">04/11/2026</p>
                    <p>Hoje é um ótimo dia para aprender algo novo! 🚀</p>

                    <div class="acoes">
                        <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                        <button onclick="comentar(this)">💬 Comentar</button>
                    </div>

                    <div class="comentarios"></div>
                </div>

            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 SocialNet - Minha Rede Social</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
