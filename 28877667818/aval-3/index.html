
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Simples</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Instagram</h1>
        <input type="text" placeholder="Pesquisar">
        <div class="menu">
            <a href="#">🏠</a>
            <a href="#publicar">➕</a>
            <a href="#perfil">👤</a>
        </div>
    </header>

    <main>

        <section class="stories">
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=1">
                <p>Seu story</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=2">
                <p>Maria</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=3">
                <p>João</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=4">
                <p>Ana</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=5">
                <p>Pedro</p>
            </div>
        </section>

        <section class="criar" id="publicar">
            <h2>Criar publicação</h2>

            <input type="text" id="usuario" placeholder="Seu nome de usuário">

            <input type="text" id="imagem" placeholder="Link da imagem">

            <textarea id="legenda" placeholder="Escreva uma legenda..."></textarea>

            <button onclick="publicar()">Compartilhar</button>
        </section>

        <section id="feed">

            <article class="post">
                <div class="usuario">
                    <img src="https://i.pravatar.cc/100?img=2">
                    <strong>maria_silva</strong>
                </div>

                <img class="foto" src="https://picsum.photos/id/1011/600/500">

                <div class="acoes">
                    <button onclick="curtir(this)">❤️ <span>25</span></button>
                    <button onclick="comentar(this)">💬</button>
                    <button onclick="alert('Publicação salva!')">🔖</button>
                </div>

                <p><strong>maria_silva</strong> Aproveitando o dia! 🌸</p>

                <div class="comentarios"></div>
            </article>

            <article class="post">
                <div class="usuario">
                    <img src="https://i.pravatar.cc/100?img=3">
                    <strong>joao_santos</strong>
                </div>

                <img class="foto" src="https://picsum.photos/id/1039/600/500">

                <div class="acoes">
                    <button onclick="curtir(this)">❤️ <span>40</span></button>
                    <button onclick="comentar(this)">💬</button>
                    <button onclick="alert('Publicação salva!')">🔖</button>
                </div>

                <p><strong>joao_santos</strong> Que lugar incrível! 😍</p>

                <div class="comentarios"></div>
            </article>

        </section>

    </main>

    <footer>
        <p>Instagram Simples - Projeto HTML, CSS e JavaScript</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
