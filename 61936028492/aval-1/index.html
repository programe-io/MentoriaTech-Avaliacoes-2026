<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PixelVerse - Blog de Jogos</title>
                <style>
                        :root { --bg: #09090e; --card: #1a1a24; --purple: #9d4edd; --cyan: #00f5d4; --text: #f0f0f5; --muted: #8e8e9f; }
                                * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
                                        body { background: var(--bg); color: var(--text); padding-bottom: 2rem; }
                                                header { background: #13131a; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a3a; position: sticky; top: 0; z-index: 10; }
                                                        .logo { font-size: 1.4rem; font-weight: 800; color: var(--text); text-decoration: none; }
                                                                .logo span { color: var(--purple); }
                                                                        .actions { display: flex; gap: 10px; }
                                                                                input, select, textarea { background: #13131a; border: 1px solid #2a2a3a; color: var(--text); padding: 0.5rem 0.8rem; border-radius: 6px; }
                                                                                        button { background: var(--purple); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
                                                                                                button:hover { opacity: 0.9; }
                                                                                                        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
                                                                                                                .filters { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
                                                                                                                        .filter-btn { background: var(--card); color: var(--muted); }
                                                                                                                                .filter-btn.active { background: var(--purple); color: #fff; }
                                                                                                                                        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
                                                                                                                                                .card { background: var(--card); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #2a2a3a; }
                                                                                                                                                        .card img { width: 100%; height: 160px; object-fit: cover; }
                                                                                                                                                                .card-body { padding: 1rem; display: flex; flex-direction: column; flex: 1; gap: 0.5rem; }
                                                                                                                                                                        .badge { font-size: 0.75rem; color: var(--cyan); font-weight: 700; text-transform: uppercase; }
                                                                                                                                                                                .card h3 { font-size: 1.1rem; }
                                                                                                                                                                                        .card p { font-size: 0.85rem; color: var(--muted); flex: 1; }
                                                                                                                                                                                                .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #2a2a3a; }
                                                                                                                                                                                                        .btn-outline { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); }
                                                                                                                                                                                                                .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; padding: 1rem; z-index: 20; }
                                                                                                                                                                                                                        .modal.active { display: flex; }
                                                                                                                                                                                                                                .modal-box { background: var(--card); padding: 1.5rem; border-radius: 10px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
                                                                                                                                                                                                                                        .modal-header { display: flex; justify-content: space-between; align-items: center; }
                                                                                                                                                                                                                                                .comment { background: #13131a; padding: 0.6rem; border-radius: 6px; font-size: 0.85rem; border-left: 3px solid var(--cyan); margin-top: 0.5rem; }
                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                    <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
                                                                                                                                                                                                                                                    <body>
                                                                                                                                                                                                                                                        <header>
                                                                                                                                                                                                                                                                <a href="#" class="logo">🎮 Pixel<span>Verse</span></a>
                                                                                                                                                                                                                                                                        <div class="actions">
                                                                                                                                                                                                                                                                                    <input type="text" id="search" placeholder="Buscar...">
                                                                                                                                                                                                                                                                                                <button onclick="toggleModal('newModal', true)">+ Post</button>
                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                            </header>

                                                                                                                                                                                                                                                                                                                <div class="container">
                                                                                                                                                                                                                                                                                                                        <div class="filters" id="filters">
                                                                                                                                                                                                                                                                                                                                    <button class="filter-btn active" data-cat="all">Todos</button>
                                                                                                                                                                                                                                                                                                                                                <button class="filter-btn" data-cat="Review">Reviews</button>
                                                                                                                                                                                                                                                                                                                                                            <button class="filter-btn" data-cat="Notícias">Notícias</button>
                                                                                                                                                                                                                                                                                                                                                                        <button class="filter-btn" data-cat="Indie">Indies</button>
                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                        <div class="grid" id="grid"></div>
                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                <!-- Modal Novo Post -->
                                                                                                                                                                                                                                                                                                                                                                                                    <div class="modal" id="newModal">
                                                                                                                                                                                                                                                                                                                                                                                                            <form class="modal-box" id="postForm">
                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="modal-header"><h3>Novo Artigo</h3><button type="button" onclick="toggleModal('newModal', false)">X</button></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="text" id="title" placeholder="Título" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <select id="cat"><option>Review</option><option>Notícias</option><option>Indie</option></select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="url" id="img" placeholder="URL da Imagem" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="text" id="excerpt" placeholder="Resumo curto" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <textarea id="content" rows="4" placeholder="Conteúdo completo" required></textarea>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button type="submit">Publicar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Modal Leitura -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="modal" id="readModal">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="modal-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="modal-header"><h3 id="rTitle"></h3><button onclick="toggleModal('readModal', false)">X</button></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <img id="rImg" style="width:100%; height:200px; object-fit:cover; border-radius:6px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p id="rContent" style="line-height:1.6; font-size:0.95rem;"></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <hr style="border-color:#2a2a3a">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h4>Comentários</h4>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div style="display:flex; gap:8px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="text" id="cInput" placeholder="Comentar..." style="flex:1">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="addComment()">Enviar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="cList"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let posts = JSON.parse(localStorage.getItem('pv_posts')) || [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                { id: 1, title: "GTA VI: O que esperar da nova geração?", cat: "Notícias", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600", excerpt: "Física avançada e mundo aberto vivo em Vice City.", content: "A Rockstar reformulou sua engine para entregar densidade populacional realista e interações dinâmicas inéditas.", likes: 42, comments: ["Hype a mil!"] },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            { id: 2, title: "Cyberpunk 2077: Phantom Liberty vale a pena?", cat: "Review", img: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=600", excerpt: "A expansão que redimiu Night City.", content: "Com uma trama de espionagem densa e árvores de habilidades refeitas, o jogo atingiu seu potencial máximo.", likes: 85, comments: ["Melhor DLC!"] },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        { id: 3, title: "Os melhores jogos indie de 2026", cat: "Indie", img: "https://images.unsplash.com/photo-1612287233002-b1d2e293816a?w=600", excerpt: "Criatividade superando orçamentos milionários.", content: "Estúdios independentes dominaram o ano com roguelikes inovadores e narrativas emocionantes.", likes: 61, comments: [] }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let activeCat = 'all', currentId = null;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const save = () => localStorage.setItem('pv_posts', JSON.stringify(posts));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const toggleModal = (id, show) => document.getElementById(id).classList.toggle('active', show);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function render() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const q = document.getElementById('search').value.toLowerCase();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const filtered = posts.filter(p => (activeCat === 'all' || p.cat === activeCat) && (p.title.toLowerCase().includes(q) || p.excerpt.toLowerCase().includes(q)));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('grid').innerHTML = filtered.map(p => `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <img src="${p.img}" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600'">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="card-body">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span class="badge">${p.cat}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h3>${p.title}</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>${p.excerpt}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="card-footer">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="btn-outline" onclick="openRead(${p.id})">Ler</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span style="cursor:pointer; font-size:0.9rem" onclick="like(${p.id})">❤️ ${p.likes} | 💬 ${p.comments.length}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `).join('');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function like(id) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        posts.find(p => p.id === id).likes++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    save(); render();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function openRead(id) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                currentId = id;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const p = posts.find(p => p.id === id);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('rTitle').textContent = p.title;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('rImg').src = p.img;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('rContent').textContent = p.content;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('cList').innerHTML = p.comments.map(c => `<div class="comment">${c}</div>`).join('');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        toggleModal('readModal', true);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function addComment() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const val = document.getElementById('cInput').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!val) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            posts.find(p => p.id === currentId).comments.push(val);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('cInput').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    save(); openRead(currentId); render();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('postForm').onsubmit = e => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                e.preventDefault();
