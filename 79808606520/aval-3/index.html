<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clone Instagram - Feed</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://tailwindcss.com"></script>
  <!-- Boxicons para os ícones (corações, balões, etc.) -->
  <link href="https://unpkg.com" rel="stylesheet">
</head>
<body class="bg-gray-50 p-4 max-w-lg mx-auto">

  <!-- ================= STORIES ================= -->
  <section class="bg-white border rounded-lg p-4 mb-4">
    <div class="flex gap-4 overflow-x-auto">
      
      <!-- Item do Story -->
      <div class="flex flex-col items-center flex-none">
        <div class="w-16 h-16 rounded-full bg-gray-300"></div>
        <span class="text-xs mt-1">seu_story</span>
      </div>

    </div>
  </section>

  <!-- ================= CARD DE POSTAGEM ================= -->
  <article class="bg-white border rounded-lg mb-4">
    
    <!-- Header (Topo do Post) -->
    <div class="flex justify-between items-center p-4">
      <div class="flex items-center gap-3">
        <!-- Foto de Perfil -->
        <div class="w-10 h-10 rounded-full bg-gray-300"></div>
        <!-- Nome do Usuário -->
        <span class="font-semibold text-sm">usuario</span>
      </div>
      <!-- Botão de Opções (...) -->
      <i class="bx bx-dots-horizontal text-xl cursor-pointer"></i>
    </div>

    <!-- Image (Imagem do Post) -->
    <div>
      <img src="https://placeholder.com" class="w-full h-auto object-cover" alt="Post">
    </div>

    <!-- Ações e Curtidas (Rodapé do Post) -->
    <div class="p-4">
      <!-- Botões de Interação -->
      <div class="flex justify-between mb-2">
        <div class="flex gap-4">
          <i class="bx bx-heart text-2xl cursor-pointer hover:text-red-500"></i>
          <i class="bx bx-message-rounded text-2xl cursor-pointer hover:text-gray-500"></i>
        </div>
        <i class="bx bx-bookmark text-2xl cursor-pointer hover:text-gray-500"></i>
      </div>

      <!-- Texto de Curtidas -->
      <span class="text-sm font-semibold">1.234 curtidas</span>
    </div>

  </article>

</body>
</html>
<!-- SIDEBAR (Visível apenas em telas grandes) -->
<aside class="hidden lg:block w-80">
    <div class="flex items-center gap-3 mb-4">
        <!-- Avatar/Foto de perfil -->
        <div class="w-12 h-12 rounded-full bg-gray-300"></div>
        
        <!-- Informações do Usuário -->
        <div>
            <p class="font-semibold text-sm">seu_usuario</p>
            <p class="text-xs text-gray-500">Seu nome</p>
        </div>
    </div>
</aside>

<!-- MENU MOBILE (Visível apenas em telas pequenas) -->
<nav class="md:hidden fixed bottom-0 w-full bg-white border-t">
    <div class="flex justify-around py-3">
        <i class="bx bx-home"></i>
        <i class="bx bx-search"></i>
        <i class="bx bx-plus"></i>
        <i class="bx bx-heart"></i>
    </div>
</nav>
