
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <header>
            <h1>📋 Gerenciador de Tarefas</h1>
            <p>Organize suas atividades de maneira simples.</p>
        </header>

        <section class="resumo">
            <div class="card">
                <span>Total</span>
                <strong id="total">0</strong>
            </div>

            <div class="card">
                <span>Pendentes</span>
                <strong id="pendentes">0</strong>
            </div>

            <div class="card">
                <span>Concluídas</span>
                <strong id="concluidas">0</strong>
            </div>
        </section>

        <section class="formulario">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">
                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título da tarefa"
                    minlength="5"
                    maxlength="100"
                    required
                >

                <select id="prioridade" required>
                    <option value="">Selecione a prioridade</option>
                    <option value="1">Baixa</option>
                    <option value="2">Média</option>
                    <option value="3">Alta</option>
                </select>

                <button type="submit">Cadastrar tarefa</button>
            </form>
        </section>

        <section class="filtros">
            <h2>Minhas tarefas</h2>

            <input
                type="search"
                id="pesquisa"
                placeholder="Pesquisar por título ou código..."
            >

            <div class="filtros-linha">
                <select id="filtroStatus">
                    <option value="todas">Todas as tarefas</option>
                    <option value="pendentes">Pendentes</option>
                    <option value="concluidas">Concluídas</option>
                </select>

                <select id="filtroPrioridade">
                    <option value="todas">Todas as prioridades</option>
                    <option value="1">Baixa</option>
                    <option value="2">Média</option>
                    <option value="3">Alta</option>
                </select>
            </div>

            <ul id="listaTarefas"></ul>

            <button id="limparConcluidas" class="btn-limpar">
                Excluir tarefas concluídas
            </button>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
