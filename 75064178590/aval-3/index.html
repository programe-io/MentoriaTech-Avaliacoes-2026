<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Pomodoro</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="pomodoro-container">
    <!-- Seleção de Modos -->
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="work">Foco</button>
      <button class="mode-btn" data-mode="shortBreak">Pausa Curta</button>
      <button class="mode-btn" data-mode="longBreak">Pausa Longa</button>
    </div>

    <!-- Exibição do Tempo -->
    <div class="timer-display">
      <span id="time">25:00</span>
    </div>

    <!-- Controles -->
    <div class="controls">
      <button id="startBtn">Iniciar</button>
      <button id="resetBtn">Reiniciar</button>
    </div>

    <!-- Contador de Ciclos -->
    <div class="cycles-info">
      <span>Ciclos concluídos: <strong id="cycleCount">0</strong></span>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
