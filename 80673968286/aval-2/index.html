
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>MiniFeed</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>mini.feed</h1>
                                    <nav>
                                                <a href="#">Início</a>
                                                            <a href="#">Explorar</a>
                                                                        <a href="#">Perfil</a>
                                                                                </nav>
                                                                                    </header>

                                                                                        <main>
                                                                                                <section class="create-post">
                                                                                                            <h2>O que está acontecendo?</h2>
                                                                                                                        <textarea id="postInput" placeholder="Escreva alguma coisa..."></textarea>
                                                                                                                                    <button id="publishBtn">Publicar +</button>
                                                                                                                                            </section>

                                                                                                                                                    <section class="feed" id="feed">

                                                                                                                                                                <article class="post">
                                                                                                                                                                                <div class="user">
                                                                                                                                                                                                    <div class="avatar">G</div>
                                                                                                                                                                                                                        <div>
                                                                                                                                                                                                                                                <strong>goober123</strong>
                                                                                                                                                                                                                                                                        <small>Há 5 minutos</small>
                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                            <p>Finalmente terminei meu desenho!! :D</p>

                                                                                                                                                                                                                                                                                                                                            <div class="post-actions">
                                                                                                                                                                                                                                                                                                                                                                <button class="like-btn">♡ Curtir</button>
                                                                                                                                                                                                                                                                                                                                                                                    <button>♡ Comentar</button>
                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                </article>

                                                                                                                                                                                                                                                                                                                                                                                                                        </section>
                                                                                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
