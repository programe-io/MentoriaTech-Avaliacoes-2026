
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Calculadora de IMC</h1>

        <form id="formulario">
            <input type="text" id="nome" placeholder="Nome da pessoa" required>
            <input type="number" id="peso" placeholder="Peso (kg)" min="0.1" step="any" required>
            <input type="number" id="altura" placeholder="Altura (m)" min="0.1" step="any" required>

            <button type="submit">Calcular IMC</button>
        </form>

        <h2>Dados das pessoas</h2>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Peso (kg)</th>
                        <th>Altura (m)</th>
                        <th>IMC</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="tabela"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
