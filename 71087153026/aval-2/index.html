<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="painel-tarefas">
    
    <form id="form-tarefa">
      <input type="text" id="input-titulo" placeholder="Digite o título da tarefa (mín. 5 caracteres)" required>
      <select id="select-prioridade" required>
        <option value="" disabled selected>Selecione a prioridade</option>
        <option value="1">Alta</option>
        <option value="2">Média</option>
        <option value="3">Baixa</option>
      </select>
      <button type="submit">Cadastrar</button>
    </form>

    <div id="lista-tarefas">
      <div class="tarefa prioridade-alta">
        <input type="checkbox" id="t1">
        <label for="t1" class="titulo">Estudar JavaScript Avançado</label>
        <span class="badge-prioridade">Alta</span>
      </div>

      <div class="tarefa concluida prioridade-baixa">
        <input type="checkbox" id="t2" checked>
        <label for="t2" class="titulo">Organizar os arquivos de código</label>
        <span class="badge-prioridade">Baixa</span>
      </div>
    </div>

  </div>

<script src="script.js"></script></body>
</html>
