<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Mini Feed</title>
        <!-- Ligação entre HTML e CSS -->
          <link rel="stylesheet" href="style.css">
          <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
          <body>

            <!-- 4. Cabeçalho e navegação -->
              <header class="cabecalho">
                  <div class="container-header">
                        <h1>Mini Feed</h1>
                              <nav>
                                      <ul class="menu">
                                                <li><a href="#">Início</a></li>
                                                          <li><a href="#">Explorar</a></li>
                                                                    <li><a href="#">Perfil</a></li>
                                                                            </ul>
                                                                                  </nav>
                                                                                      </div>
                                                                                        </header>

                                                                                          <!-- 3. Estrutura semântica principal -->
                                                                                            <main class="container-principal">
                                                                                                
                                                                                                    <!-- 5. Área de nova publicação -->
                                                                                                        <section class="nova-publicacao">
                                                                                                              <form id="form-post">
                                                                                                                      <input type="text" id="autor-post" placeholder="kettelin lopes e silva dos santos..." required>
                                                                                                                              <textarea id="texto-post" rows="3" placeholder="No que você está pensando?" required></textarea>
                                                                                                                                      <div class="acoes-form">
                                                                                                                                                <button type="submit" class="btn-publicar">Publicar</button>
                                                                                                                                                        </div>
                                                                                                                                                              </form>
                                                                                                                                                                  </section>

                                                                                                                                                                      <!-- 6. Estrutura das postagens do feed -->
                                                                                                                                                                          <section id="feed" class="lista-postagens">
                                                                                                                                                                                
                                                                                                                                                                                      <!-- Postagem inicial de exemplo -->
                                                                                                                                                                                            <article class="post">
                                                                                                                                                                                                    <header class="post-cabecalho">
                                                                                                                                                                                                              <div class="avatar">A</div>
                                                                                                                                                                                                                        <div>
                                                                                                                                                                                                                                    <h2 class="post-autor">Ana Silva</h2>
                                                                                                                                                                                                                                                <span class="post-hora">Agora mesmo</span>
                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                  </header>
                                                                                                                                                                                                                                                                          <p class="post-conteudo">
                                                                                                                                                                                                                                                                                    Finalizando o projeto prático de Mini Feed com HTML, CSS e JavaScript! 🚀
                                                                                                                                                                                                                                                                                            </p>
                                                                                                                                                                                                                                                                                                    <footer class="post-rodape">
                                                                                                                                                                                                                                                                                                              <button class="btn-curtir" onclick="alternarCurtida(this)">
                                                                                                                                                                                                                                                                                                                          ❤️ Curtir (<span class="contador">3</span>)
                                                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                                            </footer>
                                                                                                                                                                                                                                                                                                                                                  </article>

                                                                                                                                                                                                                                                                                                                                                      </section>

                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                          <!-- Ligação com JavaScript -->
                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                            </html>
