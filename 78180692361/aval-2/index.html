<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Minefeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>

        <div class="header-content">

            <h1>Minefeed</h1>

            <nav>
                <a href="#">Inicio</a>
                <a href="#">Perfil</a>
            </nav>

        </div>

    </header>

    <main> 

        <section class="new-post">

            <div class="user">

                <div class="avatar">
                    K
                </div>

                <div>
                    <strong>Kevin</strong>
                    <span>O que Voce esta pensado</span>
                </div>

                <button>Publicar</button>


            </div>



        </section>

        <article class="post">

            <div class="post-header">

                <div class="user">

                    <div class="avatar">
                        T
                    </div>

                    <div>
                        <strong>Tiago</strong>

            </div>

                Hoje eu joguei o meu jogo favorito, muito top
            </div>

            <img src="https://store-images.s-microsoft.com/image/apps.3950.13746026679809493.65dbd3b0-3c0b-4772-911a-106ded0ba210.c3f479ad-16e1-4e41-a23d-4a402fed0e75?q=90&w=177&h=265" alt="Manhunt">

            <div class="post-actions">
                <button>Curtir</button>
                <button>comentar</button>
            </div>

        </article>



        
    
    </main>

    <footer>
        <p>Minefeed - Todos Direitos Reservados - 2026</p>
    </footer>
