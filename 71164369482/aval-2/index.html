
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📋 Gerenciador de Tarefas</h1>
        <p>Organize suas atividades e acompanhe seu progresso.</p>
    </header>

    <main>

        <section class="resumo">
            <div class="card">
                <h3>Total de tarefas</h3>
                <p id="total">0</p>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <p id="concluidas">0</p>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <p id="pendentes">0</p>
            </div>
        </section>

        <section class="formulario">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <input
                    type="text"
                    id="codigo"
                    placeholder="Código da tarefa"
                    required
                >

                <input
                    type="text"
                    id="titulo"
                    placeholder="Título da tarefa"
                    minlength="5"
                    required
                >

                <label for="prioridade">Prioridade:</label>

                <select id="prioridade" required>
                    <option value="1">1 - Alta</option>
                    <option value="2" selected>2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit">+ Adicionar tarefa</button>

            </form>
        </section>

        <section class="tarefas">
            <h2>Minhas tarefas</h2>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar tarefa..."
            >

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaTarefas"></tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>Sistema de Gerenciamento de Tarefas</p>
        <p>Desenvolvido com HTML, CSS e JavaScript</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
