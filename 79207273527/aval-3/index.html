<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<header class="topo">
  <div class="max-w-6xl mx-auto flex items-center justify-between gap-4 p-4">
    <a href="#inicio" class="logo">Instagram</a>

    <input id="pesquisa"
      type="search"
      class="hidden md:block"
      placeholder="Pesquisar">

    <div class="flex items-center gap-4">
      <a href="#inicio" title="Início">⌂</a>
      <button id="ver-salvos" title="Publicações salvas">🔖</button>
      <div class="avatar">AP</div>
    </div>
  </div>
</header>

<div id="inicio" class="max-w-6xl mx-auto flex gap-8 p-4 md:p-7">

  <main class="flex-1 min-w-0">

    <section class="stories">
      <button class="story" data-titulo="Seu story"
        data-imagem="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=900">

        <div class="anel">
          <div class="avatar">AP</div>
        </div>

        <small>Seu story</small>
      </button>

      <button class="story" data-titulo="Montanhas"
        data-imagem="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=900">

        <div class="anel">
          <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=150"
               alt="Montanhas">
        </div>

        <small>Montanhas</small>
      </button>

      <button class="story" data-titulo="Florestas"
        data-imagem="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=900">

        <div class="anel">
          <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=150"
               alt="Floresta">
        </div>

        <small>Florestas</small>
      </button>

      <button class="story" data-titulo="Viagens"
        data-imagem="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900">

        <div class="anel">
          <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=150"
               alt="Paisagem natural">
        </div>

        <small>Viagens</small>
      </button>
    </section>

    <div id="feed"></div>

    <p id="vazio" hidden>Nenhuma publicação encontrada.</p>

  </main>

  <aside class="hidden md:block w-72 shrink-0">

    <div class="flex items-center gap-4 mb-8">
      <div class="avatar grande">AP</div>

      <div>
        <strong>antonio.pedro</strong>
        <p class="text-sm text-gray-500">Antonio Pedro</p>
      </div>
    </div>

    <h3 class="font-bold text-gray-500 mb-5">
      Sugestões para você
    </h3>

    <div class="sugestao">
      <div class="avatar">🌎</div>
      <div class="flex-1">
        <strong>explore.world</strong>
        <p>Viagens</p>
      </div>
      <button class="seguir">Seguir</button>
    </div>

    <div class="sugestao">
      <div class="avatar">🏔️</div>
      <div class="flex-1">
        <strong>mountain.life</strong>
        <p>Natureza</p>
      </div>
      <button class="seguir">Seguir</button>
    </div>

    <div class="sugestao">
      <div class="avatar">📷</div>
      <div class="flex-1">
        <strong>photo.daily</strong>
        <p>Fotografia</p>
      </div>
      <button class="seguir">Seguir</button>
    </div>

    <footer>
      Explore • Antonio Pedro
      <p>Projeto educacional de desenvolvimento web.</p>
      <p>Sem vínculo com o Instagram.</p>
    </footer>

  </aside>

</div>

<dialog id="modal-story">
  <div class="modal-topo">
    <strong id="story-titulo"></strong>
    <button id="fechar-story">✕</button>
  </div>

  <img id="story-imagem" alt="Paisagem do story">
</dialog>
  <script src="script.js"></script>
  
</body>
</html>
