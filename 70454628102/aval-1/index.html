        <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Produtos</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <h1>Gerenciador de Produtos</h1>

  <section class="form">
    <h2>Cadastrar Produto</h2>
    <label>Descrição: <input type="text" id="descricao" placeholder="Mínimo 5 caracteres"></label>
    <label>Quantidade: <input type="number" id="quantidade" min="1"></label>
    <label>Valor: <input type="number" id="valor" min="0.01" step="0.01"></label>
    <button onclick="cadastrar()">Cadastrar</button>
  </section>

  <section class="form">
    <h2>Atualizar</h2>
    <label>Código: <input type="number" id="codigo" min="1"></label>
    <label>Novo Valor: <input type="number" id="novoValor" min="0.01" step="0.01"></label>
    <label>Nova Quantidade: <input type="number" id="novaQuantidade" min="1"></label>
    <button onclick="atualizar()">Atualizar</button>
  </section>

  <section>
    <h2>Lista de Produtos</h2>
    <table id="tabela">
      <thead>
        <tr>
          <th>Código</th>
          <th>Descrição</th>
          <th>Quantidade</th>
          <th>Valor</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button onclick="renderizar()">Atualizar Lista</button>
  </section>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
