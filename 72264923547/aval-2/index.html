<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Estoque</title>

<style>
* {
    box-sizing: border-box;
\}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 20px;
    color: #1e293b;
\}

.container {
    max-width: 1100px;
    margin: auto;
\}

header {
    background: #172554;
    color: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 20px;
\}

header h1 {
    margin: 0 0 8px;
\}

.resumo {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
\}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #00000010;
\}

.card h3 {
    margin: 0 0 10px;
    color: #64748b;
    font-size: 14px;
\}

.card strong {
    font-size: 25px;
    color: #2563eb;
\}

.painel {
    background: white;
    padding: 22px;
    border-radius: 10px;
    margin-bottom: 20px;
\}

input {
    width: 100%;
    padding: 12px;
    margin: 7px 0 15px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
\}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: white;
    background: #2563eb;
    margin: 3px;
\}

button:hover {
    opacity: 0.85;
\}

.excluir {
    background: #dc2626;
\}

.editar {
    background: #0f766e;
\}

.pesquisa {
    max-width: 400px;
\}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
\}

th, td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #e2e8f0;
\}

th {
    background: #e2e8f0;
\}

.baixo {
    color: #dc2626;
    font-weight: bold;
\}

.normal {
    color: #15803d;
    font-weight: bold;
\}

.tabela {
    overflow-x: auto;
\}

#mensagem {
    font-weight: bold;
    margin-top: 10px;
\}

@media(max-width: 600px) {
    body {
        padding: 10px;
    \}

    th, td {
        padding: 9px;
        font-size: 13px;
    \}
\}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

<header>
    <h1>📦 Controle de Estoque</h1>
    <p>Sistema de gerenciamento de produtos</p>
</header>

<section class="resumo">
    <div class="card">
        <h3>Total de produtos</h3>
        <strong id="totalProdutos">0</strong>
    </div>

    <div class="card">
        <h3>Unidades em estoque</h3>
        <strong id="totalUnidades">0</strong>
    </div>

    <div class="card">
        <h3>Produtos com estoque baixo</h3>
        <strong id="estoqueBaixo">0</strong>
    </div>

    <div class="card">
        <h3>Valor total do estoque</h3>
        <strong id="valorEstoque">R\$ 0,00</strong>
    </div>
</section>

<section class="painel">
    <h2 id="tituloFormulario">Cadastrar produto</h2>

    <form id="formulario">

        <label for="codigo">Código:</label>
        <input type="text" id="codigo"
               placeholder="Ex: PROD001" required>

        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao"
               placeholder="Nome do produto" required>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade"
               min="0" placeholder="Quantidade" required>

        <label for="valor">Valor unitário (R\$):</label>
        <input type="number" id="valor"
               min="0" step="0.01"
               placeholder="0,00" required>

        <button type="submit" id="botaoSalvar">
            Cadastrar produto
        </button>

        <button type="button" id="cancelarEdicao"
                style="display:none;background:#64748b">
            Cancelar edição
        </button>
    </form>

    <div id="mensagem"></div>
</section>

<section class="painel">
    <h2>Produtos cadastrados</h2>

    <input class="pesquisa" type="text" id="pesquisa"
           placeholder="Pesquisar por código ou descrição...">

    <div class="tabela">
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor unitário</th>
                    <th>Total</th>
                    <th>Situação</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaProdutos"></tbody>
        </table>
    </div>
</section>

</div>

<script>
let produtos = JSON.parse(
    localStorage.getItem("estoqueProdutos")
) || [];

let codigoEdicao = null;

const formulario = document.querySelector("#formulario");
const lista = document.querySelector("#listaProdutos");
const mensagem = document.querySelector("#mensagem");

function salvarDados() {
    localStorage.setItem(
        "estoqueProdutos",
        JSON.stringify(produtos)
    );
\}

function formatarDinheiro(valor) {
    return valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    \});
\}

function atualizarResumo() {
    const unidades = produtos.reduce(
        (soma, produto) => soma + produto.quantidade, 0
    );

    const baixos = produtos.filter(
        produto => produto.quantidade < 5
    ).length;

    const valor = produtos.reduce(
        (soma, produto) =>
            soma + produto.quantidade * produto.valor, 0
    );

    document.querySelector("#totalProdutos").textContent =
        produtos.length;

    document.querySelector("#totalUnidades").textContent =
        unidades;

    document.querySelector("#estoqueBaixo").textContent =
        baixos;

    document.querySelector("#valorEstoque").textContent =
        formatarDinheiro(valor);
\}

function renderizarProdutos(filtro = "") {
    lista.innerHTML = "";

    const encontrados = produtos.filter(produto =>
        produto.codigo.toLowerCase().includes(filtro.toLowerCase()) ||
        produto.descricao.toLowerCase().includes(filtro.toLowerCase())
    );

    encontrados.forEach(produto => {
        const linha = document.createElement("tr");

        const situacao = produto.quantidade < 5
            ? "Estoque baixo"
            : "Normal";

        const classe = produto.quantidade < 5
            ? "baixo"
            : "normal";

        linha.innerHTML = `
            <td>\${produto.codigo\}</td>
            <td>\${produto.descricao\}</td>
            <td>\${produto.quantidade\}</td>
            <td>\${formatarDinheiro(produto.valor)\}</td>
            <td>\${formatarDinheiro(produto.quantidade * produto.valor)\}</td>
            <td class="\${classe\}">\${situacao\}</td>
            <td>
                <button class="editar"
                    onclick="editarProduto('\${produto.codigo\}')">
                    Editar
                </button>
                <button class="excluir"
                    onclick="excluirProduto('\${produto.codigo\}')">
                    Excluir
                </button>
            </td>
        `;

        lista.appendChild(linha);
    \});

    atualizarResumo();
\}

formulario.addEventListener("submit", function(event) {
    event.preventDefault();

    const codigo = document.querySelector("#codigo").value.trim();
    const descricao = document.querySelector("#descricao").value.trim();
    const quantidade = Number(document.querySelector("#quantidade").value);
    const valor = Number(document.querySelector("#valor").value);

    if (!codigo || !descricao ||
        !Number.isFinite(quantidade) ||
        !Number.isFinite(valor) ||
        quantidade < 0 || valor < 0) {
        mensagem.style.color = "red";
        mensagem.textContent = "Preencha os campos corretamente.";
        return;
    \}

    if (codigoEdicao === null) {
        const existe = produtos.find(
            produto => produto.codigo.toLowerCase() === codigo.toLowerCase()
        );

        if (existe) {
            mensagem.style.color = "red";
            mensagem.textContent = "Este código já está cadastrado!";
            return;
        \}

        produtos.push({
            codigo,
            descricao,
            quantidade,
            valor
        \});

        mensagem.style.color = "green";
        mensagem.textContent = "Produto cadastrado com sucesso!";
    \} else {
        const produto = produtos.find(
            item => item.codigo === codigoEdicao
        );

        const codigoExiste = produtos.some(
            item => item.codigo.toLowerCase() === codigo.toLowerCase()
                && item.codigo !== codigoEdicao
        );

        if (codigoExiste) {
            mensagem.style.color = "red";
            mensagem.textContent = "Este código já pertence a outro produto.";
            return;
        \}

        produto.codigo = codigo;
        produto.descricao = descricao;
        produto.quantidade = quantidade;
        produto.valor = valor;

        mensagem.style.color = "green";
        mensagem.textContent = "Produto atualizado com sucesso!";
    \}

    salvarDados();
    formulario.reset();
    cancelarEdicao();
    renderizarProdutos(document.querySelector("#pesquisa").value);
\});

function editarProduto(codigo) {
    const produto = produtos.find(
        item => item.codigo === codigo
    );

    if (!produto) return;

    codigoEdicao = codigo;

    document.querySelector("#codigo").value = produto.codigo;
    document.querySelector("#descricao").value = produto.descricao;
    document.querySelector("#quantidade").value = produto.quantidade;
    document.querySelector("#valor").value = produto.valor;

    document.querySelector("#tituloFormulario").textContent =
        "Editar produto";

    document.querySelector("#botaoSalvar").textContent =
        "Salvar alterações";

    document.querySelector("#cancelarEdicao").style.display =
        "inline-block";

    window.scrollTo({ top: 0, behavior: "smooth" \});
\}

function cancelarEdicao() {
    codigoEdicao = null;
    formulario.reset();

    document.querySelector("#tituloFormulario").textContent =
        "Cadastrar produto";

    document.querySelector("#botaoSalvar").textContent =
        "Cadastrar produto";

    document.querySelector("#cancelarEdicao").style.display =
        "none";
\}

document.querySelector("#cancelarEdicao").addEventListener(
    "click", cancelarEdicao
);

function excluirProduto(codigo) {
    if (!confirm("Deseja realmente excluir este produto?")) {
        return;
    \}

    produtos = produtos.filter(
        produto => produto.codigo !== codigo
    );

    salvarDados();
    renderizarProdutos(document.querySelector("#pesquisa").value);

    mensagem.style.color = "green";
    mensagem.textContent = "Produto excluído com sucesso!";
\}

document.querySelector("#pesquisa").addEventListener(
    "input", function() {
        renderizarProdutos(this.value);
    \}
);

renderizarProdutos();
</script>

<script src="script.js"></script></body>
</html>$0
