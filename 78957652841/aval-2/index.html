
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Meu Feed</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>Meu Feed ✨</h1>
                                    <p>Compartilhe seus melhores momentos!</p>
                                        </header>

                                            <main>

                                                    <section class="criar-post">
                                                                <h2>Nova publicação</h2>
                                                                            <input type="text" id="usuario" placeholder="Seu nome">
                                                                                        <textarea id="legenda" placeholder="O que você está pensando?"></textarea>
                                                                                                    <input type="text" id="imagem" placeholder="Link de uma imagem">
                                                                                                                <button onclick="publicar()">Publicar</button>
                                                                                                                        </section>

                                                                                                                                <section id="feed">
                                                                                                                                            <article class="post">
                                                                                                                                                            <h3>Maria 🌷</h3>
                                                                                                                                                                            <img src="https://picsum.photos/id/1011/600/400" alt="Paisagem natural">
                                                                                                                                                                                            <p>Um dia lindo para aproveitar a vida! ☀️</p>
                                                                                                                                                                                                            <button onclick="curtir(this)">❤️ Curtir</button>
                                                                                                                                                                                                                            <span>0 curtidas</span>
                                                                                                                                                                                                                                            <div class="comentarios">
                                                                                                                                                                                                                                                                <input type="text" placeholder="Escreva um comentário...">
                                                                                                                                                                                                                                                                                    <button onclick="comentar(this)">Enviar</button>
                                                                                                                                                                                                                                                                                                        <div class="lista-comentarios"></div>
                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                    </article>
                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                    </html>
