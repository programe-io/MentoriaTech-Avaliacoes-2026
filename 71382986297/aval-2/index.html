
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas tarefas de maneira simples!</p>

        <form id="formTarefa">
            <input type="text" id="titulo" placeholder="Digite o título da tarefa" required>

            <select id="prioridade">
                <option value="1">Prioridade 1 - Baixa</option>
                <option value="2">Prioridade 2 - Média</option>
                <option value="3">Prioridade 3 - Alta</option>
            </select>

            <button type="submit">Cadastrar Tarefa</button>
        </form>

        <h2>Minhas Tarefas</h2>

        <div id="mensagem"></div>

        <ul id="listaTarefas"></ul>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
