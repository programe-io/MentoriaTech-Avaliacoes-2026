
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Gerencie seus produtos e controle seu estoque.</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Nome do produto"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        placeholder="Ex.: 10"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input
                        type="number"
                        id="valor"
                        min="0"
                        step="0.01"
                        placeholder="Ex.: 99.90"
                        required
                    >
                </div>

                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section class="card">
            <h2>Atualizar produto</h2>

            <form id="formAtualizar">
                <div class="campo">
                    <label for="codigoAtualizar">Código do produto</label>
                    <input
                        type="number"
                        id="codigoAtualizar"
                        min="1"
                        placeholder="Código"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">Novo valor (R$)</label>
                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        placeholder="Opcional"
                    >
                </div>

                <div class="campo">
                    <label for="novaQuantidade">Adicionar quantidade</label>
                    <input
                        type="number"
                        id="novaQuantidade"
                        min="1"
                        placeholder="Opcional"
                    >
                </div>

                <button type="submit" class="btn-secundario">
                    Atualizar produto
                </button>
            </form>
        </section>

        <section class="card">
            <h2>Lista de produtos</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="4">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Sistema de Cadastro de Produtos</p>
    </footer>

<script src="script.js"></script></body>
</html>
