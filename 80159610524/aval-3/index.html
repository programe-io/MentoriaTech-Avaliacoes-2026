<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="instagram-feed">
  <!-- Card da Publicação -->
  <div class="post-card">
    <!-- Cabeçalho do Post -->
    <div class="post-header">
      <img src="https://picsum.photos" alt="Foto de perfil" class="profile-pic">
      <div class="user-info">
        <span class="username">user_adventure</span>
        <span class="location">Preá, Ceará</span>
      </div>
      <button class="more-options">•••</button>
    </div>

    <!-- Imagem do Post -->
    <div class="post-image-container">
      <img src="https://picsum.photos" alt="Imagem da publicação" class="post-image">
    </div>

    <!-- Barra de Ações -->
    <div class="post-actions">
      <div class="left-actions">
        <button class="action-btn" id="likeBtn">
          <svg class="heart-icon" viewBox="0 0 24 24" width="24" height="24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </button>
        <button class="action-btn">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
        <button class="action-btn">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <polyline points="22 2 11 13"></polyline>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <button class="action-btn bookmark-btn">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
    </div>

    <!-- Conteúdo de Texto e Curtidas -->
    <div class="post-content">
      <p class="likes-count"><span id="likesNumber">1.240</span> curtidas</p>
      <p class="caption">
        <span class="username">user_adventure</span> Conectando com a natureza na melhor vibe possível! 🌊✨
      </p>
      <p class="view-comments">Ver todos os 42 comentários</p>
      <p class="post-time">HÁ 2 HORAS</p>
    </div>

    <!-- Área de Comentário -->
    <div class="comment-box">
      <input type="text" placeholder="Adicione um comentário..." class="comment-input">
      <button class="post-comment-btn">Publicar</button>
    </div>
  </div>
</div>$0
  <script src="script.js"></script>
  
</body>
</html>
