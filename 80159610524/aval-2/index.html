<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="feed-container">
  <!-- Criar Novo Post -->
  <div class="new-post-card">
    <div class="user-info">
      <img src="https://unsplash.com" alt="Sua foto" class="avatar">
      <span class="username">Você</span>
    </div>
    <textarea id="post-input" placeholder="O que você está pensando agora?"></textarea>
    <div class="card-footer">
      <button id="publish-btn" onclick="criarPost()">Publicar</button>
    </div>
  </div>

  <!-- Container dos Posts -->
  <div id="posts-wrapper">
    <!-- Exemplo de Post Fixo -->
    <div class="post-card">
      <div class="post-header">
        <img src="https://unsplash.com" alt="Avatar" class="avatar">
        <div>
          <span class="username">Aline Silva</span>
          <span class="post-time">Há 10 minutos</span>
        </div>
      </div>
      <div class="post-content">
        <p>Acabei de finalizar meu primeiro projeto utilizando HTML, CSS e JavaScript puro! Muito feliz com o resultado. 🚀💻</p>
      </div>
      <div class="post-actions">
        <button class="action-btn active" onclick="alternarCurtida(this)">
          ❤️ <span class="like-count">12</span> Curtidas
        </button>
      </div>
    </div>
  </div>
</div>$0
  <script src="script.js"></script>
  
</body>
</html>
