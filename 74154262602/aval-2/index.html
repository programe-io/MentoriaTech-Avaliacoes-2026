
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .tarefa {
            background: #f8f9fa;
            padding: 15px;
            margin-top: 12px;
            border-radius: 5px;
            border-left: 5px solid #007bff;
        }

        .concluida {
            border-left-color: green;
            opacity: 0.7;
        }

        .acoes {
            display: flex;
            gap: 10px;
        }

        .acoes button {
            flex: 1;
        }

        .concluir {
            background: green;
        }

        .alterar {
            background: orange;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Gerenciador de Tarefas</h1>

    <h3>Cadastrar nova tarefa</h3>

    <input type="text" id="titulo"
        placeholder="Digite o título da tarefa">

    <select id="prioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="cadastrarTarefa()">
        Cadastrar Tarefa
    </button>

    <h3>Lista de Tarefas</h3>

    <div id="listaTarefas"></div>

</div>

<script>

    let tarefas = [];
    let proximoCodigo = 1;

    // Cadastrar tarefa
    function cadastrarTarefa() {

        let titulo = document.getElementById("titulo").value.trim();
        let prioridade = Number(
            document.getElementById("prioridade").value
        );

        if (titulo.length < 5) {
            alert("O título deve ter no mínimo 5 caracteres!");
            return;
        }

        if (prioridade < 1 || prioridade > 3) {
            alert("A prioridade deve ser entre 1 e 3!");
            return;
        }

        let tarefa = {
            codigo: proximoCodigo++,
            titulo: titulo,
            prioridade: prioridade,
            concluida: false
        };

        tarefas.push(tarefa);

        document.getElementById("titulo").value = "";

        listarTarefas();

        alert("Tarefa cadastrada com sucesso!");
    }

    // Listar tarefas
    function listarTarefas() {

        let lista = document.getElementById("listaTarefas");

        lista.innerHTML = "";

        if (tarefas.length === 0) {
            lista.innerHTML = "<p>Nenhuma tarefa cadastrada.</p>";
            return;
        }

        tarefas.forEach(tarefa => {

            let status = tarefa.concluida
                ? "Concluída"
                : "Pendente";

            let div = document.createElement("div");

            div.className = tarefa.concluida
                ? "tarefa concluida"
                : "tarefa";

            let titulo = document.createElement("h3");
            titulo.textContent = tarefa.titulo;

            let codigo = document.createElement("p");
            codigo.textContent = "Código: " + tarefa.codigo;

            let prioridade = document.createElement("p");
            prioridade.textContent =
                "Prioridade: " + tarefa.prioridade;

            let statusTexto = document.createElement("p");
            statusTexto.textContent = "Status: " + status;

            let acoes = document.createElement("div");
            acoes.className = "acoes";

            let btnConcluir = document.createElement("button");
            btnConcluir.textContent = "Concluir";
            btnConcluir.className = "concluir";
            btnConcluir.disabled = tarefa.concluida;

            btnConcluir.onclick = function() {
                concluirTarefa(tarefa.codigo);
            };

            let btnAlterar = document.createElement("button");
            btnAlterar.textContent = "Alterar prioridade";
            btnAlterar.className = "alterar";

            btnAlterar.onclick = function() {
                alterarPrioridade(tarefa.codigo);
            };

            acoes.appendChild(btnConcluir);
            acoes.appendChild(btnAlterar);

            div.appendChild(titulo);
            div.appendChild(codigo);
            div.appendChild(prioridade);
            div.appendChild(statusTexto);
            div.appendChild(acoes);

            lista.appendChild(div);

        });
    }

    // Concluir tarefa
    function concluirTarefa(codigo) {

        let tarefa = tarefas.find(t => t.codigo === codigo);

        if (tarefa) {
            tarefa.concluida = true;
            listarTarefas();
        }
    }

    // Alterar prioridade
    function alterarPrioridade(codigo) {

        let tarefa = tarefas.find(t => t.codigo === codigo);

        if (!tarefa) {
            return;
        }

        let novaPrioridade = Number(
            prompt("Digite a nova prioridade (1, 2 ou 3):")
        );

        if (![1, 2, 3].includes(novaPrioridade)) {
            alert("Prioridade inválida! Digite 1, 2 ou 3.");
            return;
        }

        tarefa.prioridade = novaPrioridade;

        listarTarefas();

        alert("Prioridade alterada com sucesso!");
    }

    listarTarefas();

</script>

<script src="script.js"></script></body>
</html>
