<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Tarefas</title>

    <link rel="stylesheet" href="css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <section class="todo-app">

            <header class="header">
                <div>
                    <h1>Minhas Tarefas</h1>
                    <p>Organize suas atividades de forma simples.</p>
                </div>

                <div class="task-counter">
                    <span id="taskCount">0</span>
                    <small>tarefas</small>
                </div>
            </header>

            <form id="taskForm" class="task-form">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Digite uma nova tarefa..."
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Adicionar
                </button>

            </form>

            <div class="filters">

                <button class="filter active" data-filter="all">
                    Todas
                </button>

                <button class="filter" data-filter="pending">
                    Pendentes
                </button>

                <button class="filter" data-filter="completed">
                    Concluídas
                </button>

            </div>

            <ul id="taskList" class="task-list"></ul>

            <div id="emptyMessage" class="empty-message">
                <div class="empty-icon">✓</div>
                <h2>Nenhuma tarefa</h2>
                <p>Adicione uma tarefa para começar.</p>
            </div>

            <footer class="footer">
                <button id="clearCompleted">
                    Limpar concluídas
                </button>

                <button id="clearAll" class="danger">
                    Excluir todas
                </button>
            </footer>

        </section>

    </main>

    <script src="js/script.js"></script>

<script src="script.js"></script></body>
</html>
