<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Festival de Pipas 2D - Premium</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- HUD Moderno -->
    <div id="ui">
        <div class="hud-card">
            <span class="label">PONTOS</span>
            <span id="score" class="value">0</span>
        </div>
        <div class="hud-card">
            <span class="label">VIDAS</span>
            <span id="lives" class="value text-danger">3</span>
        </div>
        <div class="hud-card">
            <span class="label">LINHA</span>
            <span id="lineType" class="value text-normal">Comum</span>
        </div>
    </div>

    <!-- Modal de Início e Game Over -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <h1 id="modalTitle">Pipa Combat 2D</h1>
            <p id="modalDesc">Voe com maestria! Use as <b>Setas do Teclado</b> ou <b>Arraste o Dedo/Mouse</b> para controlar sua pipa.</p>
            
            <div id="gameOverStats" class="game-over-stats">
                <div class="divider"></div>
                <p>Sua linha foi cortada!</p>
                <h2 class="final-score">Pontuação: <span id="finalScore">0</span></h2>
            </div>
            
            <button id="startBtn">Subir Pipa</button>
        </div>
    </div>

    <!-- Tela do Jogo -->
    <canvas id="gameCanvas"></canvas>

    <script src="game.js"></script>
<script src="script.js"></script></body>
</html>
