<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>🎮 Aventura do Conhecimento</title>
                <link rel="stylesheet" href="estilo.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <div class="container">
                            <header>
                                        <h1>🎮 Aventura do Conhecimento</h1>
                                                    <p>Teste seus saberes sobre a Web e a Internet!</p>
                                                            </header>

                                                                    <main>
                                                                                <div class="caixa-jogo">
                                                                                                <h2>🌐 Bem-vindo, Aventureiro!</h2>
                                                                                                                <p>Você está prestes a descobrir como funciona a internet!</p>
                                                                                                                                <button id="btnInicio" class="btn">🚀 Começar Jogo</button>
                                                                                                                                            </div>

                                                                                                                                                        <div id="perguntas" class="caixa-jogo escondido">
                                                                                                                                                                        <h3 id="numero-pergunta">Pergunta 1</h3>
                                                                                                                                                                                        <p id="texto-pergunta"></p>
                                                                                                                                                                                                        <div id="respostas"></div>
                                                                                                                                                                                                                        <p id="feedback" class="feedback"></p>
                                                                                                                                                                                                                                        <button id="btnProximo" class="btn escondido">Próxima →</button>
                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                <div id="resultado" class="caixa-jogo escondido">
                                                                                                                                                                                                                                                                                <h2>🏆 Fim de Jogo!</h2>
                                                                                                                                                                                                                                                                                                <p>Você acertou <span id="pontuacao">0</span> de 3 perguntas!</p>
                                                                                                                                                                                                                                                                                                                <button id="btnReiniciar" class="btn">🔄 Jogar Novamente</button>
                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                                                                                            <footer>
                                                                                                                                                                                                                                                                                                                                                        <p>Feito por: Seu Nome — Mentoria Tech 2026</p>
                                                                                                                                                                                                                                                                                                                                                                </footer>
                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                        </html>
