
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Vulcão de Lava</title>
<style>
body {
    background: #160707;
    color: white;
    text-align: center;
    font-family: Arial;
}

h1 {
    color: #ff4500;
    text-shadow: 0 0 15px orange;
}

.vulcao {
    font-size: 130px;
    margin-top: 40px;
    animation: tremer 1s infinite;
}

.lava {
    width: 200px;
    height: 20px;
    background: linear-gradient(
        90deg, red, orange, yellow, red
    );
    border-radius: 50%;
    margin: auto;
    box-shadow: 0 0 30px orangered;
    animation: brilhar 1s infinite alternate;
}

button {
    background: orangered;
    color: white;
    border: none;
    padding: 15px 25px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
}

@keyframes tremer {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(5px); }
}

@keyframes brilhar {
    from { box-shadow: 0 0 10px red; }
    to { box-shadow: 0 0 40px yellow; }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

<h1>🌋 Mundo da Lava</h1>

<p>A lava é uma rocha derretida que sai dos vulcões!</p>

<div class="vulcao">🌋</div>
<div class="lava"></div>

<p id="mensagem">O vulcão está dormindo...</p>

<button onclick="erupcao()">Entrar em erupção!</button>

<script>
function erupcao() {
    document.getElementById("mensagem").innerHTML =
    "🔥 ERUPÇÃO! A lava está saindo do vulcão! 🌋";

    document.body.style.background = "#420900";
}
</script>

<script src="script.js"></script></body>
</html>
