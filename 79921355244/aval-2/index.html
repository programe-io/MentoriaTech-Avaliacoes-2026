
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>🎮 Mundo das Brincadeiras</title>

<style>
body {
    background: linear-gradient(135deg, #7b2ff7, #f107a3);
    font-family: Arial;
    text-align: center;
    color: white;
}

h1 {
    font-size: 35px;
}

.jogo {
    background: white;
    color: #333;
    margin: 20px auto;
    padding: 20px;
    border-radius: 20px;
    max-width: 350px;
}

button {
    background: #ff9800;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #ff5722;
    transform: scale(1.05);
}

#resultado {
    font-size: 22px;
    color: #e91e63;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>

<body>

<h1>🎉 MUNDO DAS BRINCADEIRAS 🎉</h1>
<p>Escolha uma brincadeira e divirta-se!</p>

<div class="jogo">
    <h2>🪨 Pedra, Papel e Tesoura</h2>
    <button onclick="jogar('Pedra')">🪨</button>
    <button onclick="jogar('Papel')">📄</button>
    <button onclick="jogar('Tesoura')">✂️</button>
    <p id="resultado">Faça sua escolha!</p>
</div>

<div class="jogo">
    <h2>🎲 Jogo de Dados</h2>
    <button onclick="dado()">Jogar dado</button>
    <p id="dado">🎲</p>
</div>

<div class="jogo">
    <h2>🔢 Adivinhe o Número</h2>
    <p>Escolha um número de 1 a 5:</p>
    <input id="numero" type="number" min="1" max="5">
    <button onclick="adivinhar()">Tentar</button>
    <p id="resposta">Boa sorte!</p>
</div>

<script>
function jogar(escolha) {
    let opcoes = ["Pedra", "Papel", "Tesoura"];
    let computador = opcoes[
        Math.floor(Math.random() * 3)
    ];

    let resultado;

    if (escolha === computador) {
        resultado = "Empate! 😐";
    } else if (
        (escolha === "Pedra" && computador === "Tesoura") ||
        (escolha === "Papel" && computador === "Pedra") ||
        (escolha === "Tesoura" && computador === "Papel")
    ) {
        resultado = "Você venceu! 🏆";
    } else {
        resultado = "Você perdeu! 😅";
    }

    document.getElementById("resultado").innerText =
        "Você: " + escolha +
        " | Computador: " + computador +
        " | " + resultado;
}

function dado() {
    let numero = Math.floor(Math.random() * 6) + 1;

    document.getElementById("dado").innerText =
        "🎲 Você tirou " + numero + "!";
}

function adivinhar() {
    let sorteado = Math.floor(Math.random() * 5) + 1;
    let escolha = Number(document.getElementById("numero").value);

    if (escolha < 1 || escolha > 5 || !Number.isInteger(escolha)) {
        document.getElementById("resposta").innerText =
            "Digite um número de 1 a 5!";
    } else if (escolha === sorteado) {
        document.getElementById("resposta").innerText =
            "🎉 ACERTOU! Você é muito bom!";
    } else {
        document.getElementById("resposta").innerText =
            "Errou! O número era " + sorteado;
    }
}
</script>

<script src="script.js"></script></body>
</html>
