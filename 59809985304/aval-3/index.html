<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clone Instagram</title>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Ícones Boxicons -->
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet" />

  <!-- Classes reutilizáveis -->
  <style>
    .bg-muted { background-color: #f3f4f6; }
    .bg-card { background-color: #ffffff; }
    .border-border { border-color: #e5e7eb; }
    .text-muted { color: #6b7280; }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-muted text-gray-900 pb-16 md:pb-0">

  <!-- Topo / Cabeçalho -->
  <header class="sticky top-0 z-40 bg-white border-b border-border">
    <div class="max-w-5xl mx-auto px-4">
      <div class="flex items-center justify-between h-14">
        <h1 class="font-semibold text-lg">Instagram</h1>
        
        <input
          type="text"
          placeholder="Pesquisar"
          class="hidden md:block bg-muted px-4 py-1.5 rounded-lg text-sm border border-transparent focus:border-border focus:outline-none"
        />

        <div class="flex items-center gap-4">
          <i class="bx bx-home text-2xl cursor-pointer"></i>
          <i class="bx bx-heart text-2xl cursor-pointer"></i>
        </div>
      </div>
    </div>
  </header>

  <!-- Contentor Principal -->
  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex gap-8 justify-center">

      <!-- Feed Principal -->
      <div class="flex-1 max-w-lg">

        <!-- Barra de Stories -->
        <section class="bg-card border border-border rounded-lg p-4 mb-4">
          <div class="flex gap-4 overflow-x-auto">
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
              <div class="w-16 h-16 rounded-full bg-gray-300 border-2 border-pink-500 p-0.5"></div>
              <span class="text-xs mt-1 text-muted">seu_story</span>
            </div>
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
              <div class="w-16 h-16 rounded-full bg-gray-300 border-2 border-pink-500 p-0.5"></div>
              <span class="text-xs mt-1 text-muted">maria_dev</span>
            </div>
          </div>
        </section>

        <!-- Cartão de Publicação (Post) -->
        <article class="bg-card border border-border rounded-lg mb-4">
          <!-- Cabeçalho do Post -->
          <div class="flex justify-between items-center p-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-gray-300"></div>
              <div>
                <span class="font-semibold text-sm block">tailwind_fan</span>
                <span class="text-xs text-muted">São Paulo, Brasil</span>
              </div>
            </div>
            <i class="bx bx-dots-horizontal text-xl cursor-pointer"></i>
          </div>

          <!-- Imagem da Publicação -->
          <img
            src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&auto=format&fit=crop&q=80"
            alt="Imagem da publicação"
            class="w-full object-cover max-h-[450px]"
          />

          <!-- Ações e Curtidas -->
          <div class="p-4">
            <div class="flex justify-between mb-2">
              <div class="flex gap-4 text-2xl">
                <i class="bx bx-heart cursor-pointer hover:text-red-500 transition-colors"></i>
                <i class="bx bx-message-rounded cursor-pointer hover:text-muted transition-colors"></i>
              </div>
              <i class="bx bx-bookmark text-2xl cursor-pointer hover:text-muted transition-colors"></i>
            </div>
            <p class="text-sm font-semibold">1.234 curtidas</p>
          </div>
        </article>

      </div>

      <!-- Barra Lateral (Sidebar) -->
      <aside class="hidden lg:block w-80">
        <!-- Utilizador Atual -->
        <div class="flex items-center justify-between mb-6">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-gray-300"></div>
            <div>
              <p class="font-semibold text-sm">seu_usuario</p>
              <p class="text-xs text-muted">Seu nome</p>
            </div>
          </div>
          <button class="text-xs font-semibold text-blue-500 hover:text-blue-700">Trocar</button>
        </div>

        <!-- Sugestões -->
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-semibold text-muted">Sugestões para você</span>
          <button class="text-xs font-semibold text-gray-800 hover:underline">Ver tudo</button>
        </div>

        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-gray-300"></div>
            <div>
              <p class="font-semibold text-xs">dev_maria</p>
              <p class="text-[11px] text-muted">Sugerido para você</p>
            </div>
          </div>
          <button class="text-xs font-semibold text-blue-500 hover:text-blue-700">Seguir</button>
        </div>

        <!-- Rodapé da Sidebar -->
        <div class="mt-8 text-xs text-muted leading-relaxed">
          <p>Sobre · Ajuda · Imprensa · API · Carreiras · Privacidade · Termos · Localizações · Idioma</p>
          <p class="mt-4 uppercase text-[10px]">© 2024 Instagram Clone Aula Tailwind</p>
        </div>
      </aside>

    </div>
  </main>

  <!-- Navegação Inferior (Menu Mobile) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-card border-t border-border z-50">
    <div class="flex items-center justify-around h-14 px-4">
      <button class="p-2 text-2xl hover:text-muted transition-colors" aria-label="Home">
        <i class="bx bx-home"></i>
      </button>
      <button class="p-2 text-2xl hover:text-muted transition-colors" aria-label="Search">
        <i class="bx bx-search"></i>
      </button>
      <button class="p-2 text-2xl hover:text-muted transition-colors" aria-label="New post">
        <i class="bx bx-plus"></i>
      </button>
      <button class="p-2 text-2xl hover:text-muted transition-colors" aria-label="Activity">
        <i class="bx bx-heart"></i>
      </button>
      <button class="p-2 text-2xl hover:text-muted transition-colors" aria-label="Profile">
        <i class="bx bx-user"></i>
      </button>
    </div>
  </nav>

</body>
</html>
