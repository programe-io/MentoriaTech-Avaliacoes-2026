
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Gerenciamento de estoque</p>
    </header>

    <main>
        <section class="cadastro">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">
                <label for="descricao">Descrição do produto:</label>
                <input type="text" id="descricao"
                       placeholder="Ex: Cadeira Gamer" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade"
                       min="1" placeholder="Digite a quantidade" required>

                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor"
                       min="0" step="0.01"
                       placeholder="Ex: 699.00" required>

                <button type="submit">Cadastrar Produto</button>
            </form>
        </section>

        <section class="produtos">
            <h2>Lista de Produtos</h2>

            <button type="button" id="btnListar">
                Listar Produtos
            </button>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                        <!-- Os produtos aparecerão aqui -->
                    </tbody>
                </table>
            </div>
        </section>

        <section class="atualizar">
            <h2>Atualizar Valor</h2>

            <form id="formValor">
                <label for="codigoValor">Código do produto:</label>
                <input type="number" id="codigoValor"
                       min="1" required>

                <label for="novoValor">Novo valor (R$):</label>
                <input type="number" id="novoValor"
                       min="0" step="0.01" required>

                <button type="submit">Atualizar Valor</button>
            </form>
        </section>

        <section class="atualizar">
            <h2>Adicionar Quantidade</h2>

            <form id="formQuantidade">
                <label for="codigoQuantidade">Código do produto:</label>
                <input type="number" id="codigoQuantidade"
                       min="1" required>

                <label for="novaQuantidade">Quantidade a adicionar:</label>
                <input type="number" id="novaQuantidade"
                       min="1" required>

                <button type="submit">Adicionar Estoque</button>
            </form>
        </section>

        <p id="mensagem"></p>
    </main>

    <footer>
        <p>Sistema de Cadastro e Controle de Produtos</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
