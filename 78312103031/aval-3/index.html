
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Corinthians</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body class="bg-black text-white">

<div class="max-w-md mx-auto min-h-screen border-x border-gray-800">

    <!-- Cabeçalho -->
    <header class="flex justify-between items-center p-4 border-b border-gray-800">
        <h1 class="text-2xl font-bold italic">Instagram</h1>
        <div class="flex gap-5 text-2xl">
            <span>♡</span>
            <span>✉</span>
        </div>
    </header>

    <!-- Perfil -->
    <section class="p-4 flex items-center gap-4">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/5c/Sport_Club_Corinthians_Paulista_crest.svg"
        class="w-16 h-16 rounded-full bg-white p-1">

        <div>
            <h2 class="font-bold">corinthians.news</h2>
            <p class="text-sm text-gray-400">O maior do Brasil! 🖤🤍</p>
        </div>
    </section>

    <!-- Stories -->
    <section class="flex gap-5 overflow-x-auto p-4 border-b border-gray-800">

        <div class="text-center">
            <div class="story">
                <span>+</span>
            </div>
            <p class="text-xs mt-2">Seu story</p>
        </div>

        <div class="text-center">
            <div class="story">
                <img src="https://upload.wikimedia.org/wikipedia/en/5/5c/Sport_Club_Corinthians_Paulista_crest.svg">
            </div>
            <p class="text-xs mt-2">Timão 🖤</p>
        </div>

        <div class="text-center">
            <div class="story">
                <img src="https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=200">
            </div>
            <p class="text-xs mt-2">Fiel torcida</p>
        </div>

        <div class="text-center">
            <div class="story">
                <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=200">
            </div>
            <p class="text-xs mt-2">Futebol</p>
        </div>

    </section>

    <!-- Publicação -->
    <article class="mt-4">

        <div class="flex items-center gap-3 p-3">
            <img class="w-10 h-10 rounded-full bg-white p-1"
            src="https://upload.wikimedia.org/wikipedia/en/5/5c/Sport_Club_Corinthians_Paulista_crest.svg">

            <div>
                <h3 class="font-bold text-sm">corinthians.news</h3>
                <p class="text-xs text-gray-400">São Paulo, Brasil</p>
            </div>
            <span class="ml-auto">•••</span>
        </div>

        <img class="w-full post-image"
        src="https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=900"
        alt="Campo de futebol">

        <div class="p-3">
            <div class="flex gap-4 text-2xl">
                <button onclick="curtir(this)">♡</button>
                <button>♧</button>
                <button>➤</button>
                <span class="ml-auto">♧</span>
            </div>

            <p class="font-bold text-sm mt-3">
                <span id="likes">12.580</span> curtidas
            </p>

            <p class="text-sm mt-2">
                <strong>corinthians.news</strong>
                Ser Corinthians é muito mais que torcer, é sentir!
                🖤🤍 Vai, Corinthians!
            </p>

            <p class="text-gray-500 text-xs mt-2">
                Ver todos os 248 comentários
            </p>

            <input
            class="w-full bg-transparent mt-3 outline-none text-sm"
            placeholder="Adicione um comentário...">
        </div>

    </article>

    <!-- Menu inferior -->
    <nav class="fixed bottom-0 max-w-md w-full bg-black border-t border-gray-800 flex justify-around p-4 text-2xl">
        <span>⌂</span>
        <span>⌕</span>
        <span>＋</span>
        <span>♡</span>
        <span>👤</span>
    </nav>

</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
