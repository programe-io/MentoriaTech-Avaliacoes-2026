<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, inicial-scale=1.0">
    <title>Aula 04-exemplo 08</title>
</head>
<body>
    <table border="1px">
      <thead>
        <tr>
            <th>Nome</th>
            <th>Peso</th>
            <th>Altura</th>
            <th>IMC</th>
           </tr>
          <thead>

          <tbody>
            <tr>
                <td>João 1</td>
                <td>72.0</td>
                <td>1.65</td>
                <td>26.4</td>
                <td classe="situacao">Sobrepeso</td>
              </tr>

              <tr>
                <td>João 2</td>
                <td>65.0</td>
                <td>1.68</td>
                <td>18.2</td>
                <td classe="situacao">Normal</td>
               </tr>
              </tbody>
            </table>

<script>
    const situacoes = document.getElementsByClassName("situacao");

    for(let situacoes){
        const texto = situcao.textContent;

        if(texto === "Normal"){
            situacao.style.color = "green";
        }
        else if(texto === "Sobrepeso"){
            situacao.style.color = "red";
        }
    }  
    </script>

   </body>
   </html>
