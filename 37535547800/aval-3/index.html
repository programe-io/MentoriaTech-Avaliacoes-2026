<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Espaço de Saúde | IMC</title>

  <link rel="stylesheet" href="Mentoria.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

  <main class="pagina">

    <header class="cabecalho">
      <span class="icone">♡</span>

      <div>
        <h1>Meu Espaço de Saúde</h1>
        <p>Organize os dados e acompanhe o IMC de cada pessoa.</p>
      </div>
    </header>


    <section class="cadastro">

      <div class="titulo-secao">
        <h2>Adicionar pessoa</h2>
        <p>Preencha os dados abaixo para calcular o IMC.</p>
      </div>

      <form id="imcForm">

        <div class="campo">
          <label for="nome">Nome</label>
          <input
            type="text"
            id="nome"
            placeholder="Digite o nome"
            required
          >
        </div>

        <div class="campo">
          <label for="peso">Peso (kg)</label>
          <input
            type="number"
            id="peso"
            step="0.1"
            min="1"
            placeholder="Ex.: 60"
            required
          >
        </div>

        <div class="campo">
          <label for="altura">Altura (m)</label>
          <input
            type="number"
            id="altura"
            step="0.01"
            min="0.5"
            placeholder="Ex.: 1.65"
            required
          >
        </div>

        <button type="submit" class="botao">
          + Adicionar
        </button>

      </form>

    </section>


    <section class="resultado">

      <div class="titulo-secao">
        <h2>Pessoas cadastradas</h2>
        <p>Confira os dados e o resultado do cálculo.</p>
      </div>

      <div class="tabela-container">

        <table id="tabelaIMC">

          <thead>
            <tr>
              <th>Nome</th>
              <th>Peso</th>
              <th>Altura</th>
              <th>IMC</th>
              <th>Situação</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="tabelaCorpo">
            <!-- Os dados cadastrados aparecerão aqui -->
          </tbody>

        </table>

      </div>

    </section>


  </main>

  <script src="Mentoria.js"></script>

<script src="script.js"></script></body>
</html>
