<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="Gerenciador de tarefas.css">

<link href="style.css" rel="stylesheet"></head>

<body>

    <header>

        <h1>Gerenciador de Tarefas</h1>

        <p>Organize suas tarefas de forma simples.</p>

    </header>


    <main>

        <section>

            <h2>Cadastrar nova tarefa</h2>

            <form id="formTarefa">

                <label for="codigo">
                    Código:
                </label>

                <input
                    type="number"
                    id="codigo"
                    required
                >


                <label for="titulo">
                    Título:
                </label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título da tarefa"
                    required
                >


                <label for="prioridade">
                    Prioridade:
                </label>

                <input
                    type="number"
                    id="prioridade"
                    min="1"
                    max="3"
                    placeholder="Digite 1, 2 ou 3"
                    required
                >


                <button type="submit">
                    Cadastrar tarefa
                </button>

            </form>

        </section>


        <section>

            <h2>Tarefas cadastradas</h2>

            <div id="listaTarefas">

            </div>

        </section>


        <section>

            <h2>Alterar prioridade</h2>

            <label for="codigoAlterar">
                Código da tarefa:
            </label>

            <input
                type="number"
                id="codigoAlterar"
                placeholder="Digite o código"
            >


            <label for="novaPrioridade">
                Nova prioridade:
            </label>

            <input
                type="number"
                id="novaPrioridade"
                min="1"
                max="3"
                placeholder="Digite 1, 2 ou 3"
            >


            <button onclick="alterarPrioridade()">
                Alterar prioridade
            </button>

        </section>

    </main>


    <footer>

        <p>Gerenciador de Tarefas</p>

    </footer>


    <script src="Gerenciador de tarefas.js"></script>

<script src="script.js"></script></body>

</html>
