<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Gradiente</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body id="gradient-bg">
    <div class="container">
        <h1>Gradient Master</h1>
        <div class="controls">
            <input type="color" id="color1" value="#ff9a9e">
            <input type="color" id="color2" value="#fecfef">
        </div>
        <div class="code-box">
            <p id="css-output">background: linear-gradient(to right, #ff9a9e, #fecfef);</p>
            <button id="copy-btn">Copiar CSS</button>
        </div>
    </div>
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
