<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Produtos</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <div class="app-container">
        <!-- Cabeçalho -->
        <header class="app-header">
            <h1><i class="fa-solid fa-boxes-stacked"></i> Sistema de Controle de Estoque</h1>
            <p>Gerencie seus produtos, preços e quantidade em estoque</p>
        </header>

        <!-- Grid Principal -->
        <main class="main-grid">
            
            <!-- Formulário: Novo Produto -->
            <section class="card">
                <h2><i class="fa-solid fa-plus-circle"></i> Cadastrar Produto</h2>
                <form id="formCadastrar" onsubmit="event.preventDefault();">
                    <div class="input-group">
                        <label for="cadDescricao">Descrição (min. 5 letras)</label>
                        <input type="text" id="cadDescricao" placeholder="Ex: Cadeira Gamer" required>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="cadQtd">Quantidade</label>
                            <input type="number" id="cadQtd" min="1" placeholder="Ex: 10" required>
                        </div>
                        <div class="input-group">
                            <label for="cadValor">Valor (R$)</label>
                            <input type="number" id="cadValor" step="0.01" min="0" placeholder="Ex: 699.00" required>
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="executarCadastro()">
                        <i class="fa-solid fa-check"></i> Cadastrar
                    </button>
                </form>
            </section>

            <!-- Formulários de Atualização -->
            <section class="card-group">
                <!-- Atualizar Valor -->
                <div class="card">
                    <h2><i class="fa-solid fa-tag"></i> Atualizar Valor</h2>
                    <form id="formAtualizarValor" onsubmit="event.preventDefault();">
                        <div class="input-row">
                            <div class="input-group">
                                <label for="valCod">Código</label>
                                <input type="number" id="valCod" min="1" placeholder="Ex: 1" required>
                            </div>
                            <div class="input-group">
                                <label for="valNovo">Novo Valor (R$)</label>
                                <input type="number" id="valNovo" step="0.01" min="0" placeholder="Ex: 97.00" required>
                            </div>
                        </div>
                        <button type="button" class="btn btn-warning" onclick="executarAtualizacaoValor()">
                            <i class="fa-solid fa-pen-to-square"></i> Alterar Valor
                        </button>
                    </form>
                </div>

                <!-- Atualizar Quantidade -->
                <div class="card">
                    <h2><i class="fa-solid fa-cubes"></i> Adicionar Estoque</h2>
                    <form id="formAtualizarQtd" onsubmit="event.preventDefault();">
                        <div class="input-row">
                            <div class="input-group">
                                <label for="qtdCod">Código</label>
                                <input type="number" id="qtdCod" min="1" placeholder="Ex: 1" required>
                            </div>
                            <div class="input-group">
                                <label for="qtdAdicionar">Adicionar Qtd.</label>
                                <input type="number" id="qtdAdicionar" min="1" placeholder="Ex: 5" required>
                            </div>
                        </div>
                        <button type="button" class="btn btn-info" onclick="executarAtualizacaoQuantidade()">
                            <i class="fa-solid fa-plus"></i> Incrementar Estoque
                        </button>
                    </form>
                </div>
            </section>

            <!-- Tabela / Lista de Produtos -->
            <section class="card full-width">
                <div class="card-header-actions">
                    <h2><i class="fa-solid fa-list-check"></i> Lista de Produtos</h2>
                    <span id="badgeTotal" class="badge">0 itens</span>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descrição</th>
                                <th>Quantidade</th>
                                <th>Valor Unitário</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaProdutosBody">
                            <tr>
                                <td colspan="5" class="empty-message">Nenhum produto cadastrado no momento.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <!-- Inclua o arquivo do seu código JavaScript aqui -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
