
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Pessoas</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <header>
            <h1>Cadastro de Pessoas</h1>
            <p>Cadastre pessoas e acompanhe os dados registrados.</p>
        </header>

        <section class="formulario">

            <h2>Adicionar Pessoa</h2>

            <form id="form-pessoa">

                <div class="campo">
                    <label for="input-nome">Nome completo</label>
                    <input
                        type="text"
                        id="input-nome"
                        placeholder="Digite o nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="input-idade">Idade</label>
                    <input
                        type="number"
                        id="input-idade"
                        placeholder="Digite a idade"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="input-altura">Altura (metros)</label>
                    <input
                        type="number"
                        id="input-altura"
                        placeholder="Ex: 1.70"
                        step="0.01"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="input-peso">Peso (kg)</label>
                    <input
                        type="number"
                        id="input-peso"
                        placeholder="Ex: 65"
                        step="0.1"
                        required
                    >
                </div>

                <p id="erro" class="erro" hidden></p>

                <button type="submit" class="btn-adicionar">
                    Cadastrar Pessoa
                </button>

            </form>

        </section>

        <section class="tabela-section">

            <h2>Pessoas Cadastradas</h2>

            <div class="tabela-responsiva">

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-pessoas">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

<script src="script.js"></script></body>
</html>
