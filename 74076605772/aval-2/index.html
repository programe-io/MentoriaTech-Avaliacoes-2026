
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Controle de Estoque</h1>
        <p>Gerencie seus produtos</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar Produto</h2>
            <form id="form">
                <input id="descricao" placeholder="Nome do produto" required>
                <input id="quantidade" type="number" min="1" placeholder="Quantidade" required>
                <input id="valor" type="number" min="0" step="0.01" placeholder="Valor" required>
                <button type="submit">Cadastrar</button>
            </form>
            <p id="mensagem"></p>
        </section>

        <section class="card">
            <h2>Produtos cadastrados</h2>
            <div id="produtos"></div>
        </section>
    </main>
<script src="script.js"></script></body>
</html>
