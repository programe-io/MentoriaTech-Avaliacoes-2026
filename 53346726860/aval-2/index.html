<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse — Mini Feed</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header class="topbar">
        <div class="logo">
            <span class="logo-mark">P</span>
            <div>
                <strong>pulse</strong>
                <small>mini feed</small>
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            online
        </div>
    </header>


    <main class="container">

        <!-- Caixa de postagem -->
        <section class="composer">

            <div class="composer-top">
                <div class="avatar">U</div>

                <div>
                    <h2>O que está acontecendo?</h2>
                    <p>Compartilhe alguma coisa com o pessoal.</p>
                </div>
            </div>

            <input
                id="name"
                type="text"
                placeholder="Seu nome"
                maxlength="30"
            >

            <textarea
                id="comment"
                placeholder="Escreva algo..."
                maxlength="500"
            ></textarea>

            <div class="composer-bottom">

                <label class="file-button">
                    <input type="file" id="imageUpload" accept="image/*">
                    <span>＋ imagem</span>
                </label>

                <button onclick="postComment()" class="post-button">
                    Publicar
                    <span>→</span>
                </button>

            </div>

            <div id="fileName" class="file-name"></div>

        </section>


        <!-- Feed -->
        <section class="feed">

            <div class="feed-header">
                <div>
                    <span class="section-label">LIVE FEED</span>
                    <h1>Publicações</h1>
                </div>

                <span id="postCount" class="post-count">0 posts</span>
            </div>

            <div id="posts"></div>

        </section>

    </main>


    <footer>
        <span>pulse</span>
        <span>•</span>
        <span>dados salvos neste navegador</span>
    </footer>


<script>

function getPosts() {
    return JSON.parse(localStorage.getItem("posts") || "[]");
}

function savePosts(posts) {
    localStorage.setItem("posts", JSON.stringify(posts));
}


function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}


function getInitial(name) {
    return name.trim().charAt(0).toUpperCase() || "A";
}


function formatDate(timestamp) {

    const date = new Date(timestamp);

    return date.toLocaleString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
    });

}


function render() {

    const container = document.getElementById("posts");
    const postCount = document.getElementById("postCount");

    container.innerHTML = "";

    let posts = getPosts();

    posts.sort((a, b) => b.id - a.id);

    postCount.textContent =
        `${posts.length} ${posts.length === 1 ? "post" : "posts"}`;


    if (posts.length === 0) {

        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">＋</div>
                <h3>Nada por aqui ainda</h3>
                <p>Seja a primeira pessoa a publicar alguma coisa.</p>
            </div>
        `;

        return;
    }


    posts.forEach(post => {

        const div = document.createElement("article");

        div.className = "post";


        div.innerHTML = `

            <div class="post-head">

                <div class="avatar">
                    ${escapeHTML(getInitial(post.name))}
                </div>

                <div class="user-info">

                    <strong>
                        ${escapeHTML(post.name)}
                    </strong>

                    <span>
                        ${formatDate(post.id)}
                    </span>

                </div>

                <div class="post-id">
                    #${String(post.id).slice(-4)}
                </div>

            </div>


            <div class="post-content">

                ${
                    post.text
                    ? `<p>${escapeHTML(post.text)}</p>`
                    : ""
                }

                ${
                    post.image
                    ? `
                        <div class="post-image">
                            <img src="${post.image}" alt="Imagem da publicação">
                        </div>
                    `
                    : ""
                }

            </div>


            <div class="post-actions">

                <button class="like">
                    <span class="heart">♡</span>
                    <span>${post.likes}</span>
                </button>

            </div>

        `;


        const likeButton = div.querySelector(".like");


        likeButton.onclick = () => {

            post.likes++;

            savePosts(posts);

            render();

        };


        container.appendChild(div);

    });

}


function postComment() {

    const nameInput = document.getElementById("name");
    const textInput = document.getElementById("comment");
    const fileInput = document.getElementById("imageUpload");

    const name = nameInput.value.trim() || "Anônimo";
    const text = textInput.value.trim();
    const file = fileInput.files[0];


    if (!text && !file) {

        textInput.focus();

        return;

    }


    const posts = getPosts();


    if (file) {

        const reader = new FileReader();


        reader.onload = function(e) {

            posts.push({

                id: Date.now(),

                name: name,

                text: text,

                image: e.target.result,

                likes: 0

            });


            savePosts(posts);

            clearForm();

            render();

        };


        reader.readAsDataURL(file);

    }

    else {

        posts.push({

            id: Date.now(),

            name: name,

            text: text,

            image: null,

            likes: 0

        });


        savePosts(posts);

        clearForm();

        render();

    }

}


function clearForm() {

    document.getElementById("comment").value = "";
    document.getElementById("imageUpload").value = "";
    document.getElementById("fileName").textContent = "";

}


document.getElementById("imageUpload").addEventListener(
    "change",
    function () {

        const fileName = document.getElementById("fileName");

        if (this.files[0]) {

            fileName.textContent =
                "Imagem selecionada: " + this.files[0].name;

        }

        else {

            fileName.textContent = "";

        }

    }
);


render();

</script>

</body>
</html>
