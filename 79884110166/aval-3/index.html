<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram - Aula 11</title>
    <!-- CDN do Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
    <!-- CDN dos Boxicons (para os ícones funcionarem) -->
    <link href="https://unpkg.com" rel="stylesheet">
    
    <style>
        .bg-muted { background-color: #f3f4f6; }
        .bg-card { background-color: #ffffff; }
        .border-border { border-color: #e5e7eb; }
        .text-muted { color: #6b7280; }
    </style>
</head>
<body class="bg-muted">

    <!-- Construir o topo com logo, busca e navegação -->
    <header class="sticky top-0 bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                
                <h1 class="font-semibold text-lg">Instagram</h1>

                <input 
                    type="text" 
                    placeholder="Pesquisar" 
                    class="hidden md:block bg-gray-100 px-4 py-2 rounded-lg text-sm" 
                />

                    <i class="bx bx-home text-xl"></i>
                    <i class="bx bx-heart text-xl"></i>
                </div>

            </div>
        </div>
    </header>

    <!-- Criar o container do conteúdo (Próximo passo: Página 5) -->
    <main class="max-w-5xl mx-auto px-4 mt-4">
        <!-- O conteúdo dos stories e posts entrará aqui -->
    </main>

</body>
</html>
<!-- Cabeçalho (Topo) -->
<header>
  <div class="div">
    <h1 class="font-semibold text-lg">Instagram</h1>

    <input 
      type="text" 
      placeholder="Pesquisar" 
      class="hidden md:block bg-gray-100 px-4 py-2 rounded-lg text-sm" 
    />

    <div class="flex gap-4">
      <i class="bx bx-home text-xl"></i>
      <i class="bx bx-heart text-xl"></i>
    </div>
  </div>
</header>

<!-- Container do Conteúdo Principal -->
<main class="max-w-5xl mx-auto px-4 py-6">
  <div class="flex gap-8">
    
    <!-- Feed -->
    <div class="flex-1 max-w-lg mx-auto">
      <!-- O conteúdo dos posts e stories entrará aqui -->
    </div>

    <!-- Sidebar -->
    <aside class="hidden lg:block w-80">
      <!-- O conteúdo da barra lateral entrará aqui -->
    </aside>

  </div>
</main>
<!-- ========================================== -->
<!-- 1. CRIAR UM CARD DE POSTAGEM               -->
<!-- ========================================== -->
<article class="bg-white border rounded-lg mb-4">
    
    <!-- Header -->
    <div class="flex justify-between items-center p-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gray-300"></div>
            <span class="font-semibold text-sm">usuario</span>
        </div>
        <i class="bx bx-dots-horizontal"></i>
    </div>

    <!-- Imagem -->
    <img src="https://via.placeholder.com/500" class="w-full" />

    <!-- Ações -->
    <div class="p-4">
        <div class="flex justify-between mb-2">
            <div class="flex gap-4">
                <i class="bx bx-heart"></i>
                <i class="bx bx-message-rounded"></i>
            </div>
            <i class="bx bx-bookmark"></i>
        </div>

        <p class="text-sm font-semibold">1.234 curtidas</p>
    </div>

</article>


<!-- ========================================== -->
<!-- 2. NA SIDEBAR, CRIAR SUGESTÕES DE USUÁRIOS -->
<!-- ========================================== -->
<aside class="hidden lg:block w-80">

    <div class="flex items-center gap-3 mb-4">
        <div class="w-12 h-12 rounded-full bg-gray-300"></div>
        <div>
            <p class="font-semibold text-sm">seu_usuario</p>
            <p class="text-xs text-gray-500">Seu nome</p>
        </div>
    </div>

</aside>
<!-- Na Sidebar, criar sugestões de usuários -->
<aside class="hidden lg:block w-80">

    <div class="flex items-center gap-3 mb-4">
        <div class="w-12 h-12 rounded-full bg-gray-300"></div>
        <div>
            <p class="font-semibold text-sm">seu_usuario</p>
            <p class="text-xs text-gray-500">Seu nome</p>
        </div>
    </div>

</aside>

<!-- Menu Mobile, criar navegação inferior para mobile -->
<nav class="md:hidden fixed bottom-0 w-full bg-white border-t">

    <div class="flex justify-around py-3">
        <i class="bx bx-home"></i>
        <i class="bx bx-search"></i>
        <i class="bx bx-plus"></i>
        <i class="bx bx-heart"></i>
    </div>

</nav>
