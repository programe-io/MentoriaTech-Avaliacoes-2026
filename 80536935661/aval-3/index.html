
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>

    <!-- Conexão com o CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <h2>Instagram</h2>
            <span>☰</span>
        </header>

        <!-- Stories -->
        <section class="stories">

            <div class="story">
                <div class="add">+</div>
                <p>Você</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=12">
                <p>Joao</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=12">
                <p>Joao</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=12">
                <p>Joao</p>
            </div>

        </section>

        <!-- Publicação -->
        <article class="post">

            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=12">

                <div class="profile">
                    <strong>frojho_dev</strong>
                    <p>Parnaíba, PI</p>
                </div>

                <span>•••</span>
            </div>

            <div class="post-image"></div>

            <div class="actions">
                <span>♡</span>
                <span>◯</span>
                <span>➤</span>
                <span class="save">♧</span>
            </div>

            <div class="content">
                <p class="likes">1.234 curtidas</p>

                <p class="caption">
                    <strong>frojho_dev</strong>
                    Aprendendo layout responsivo com CSS!
                    O segredo é começar pelo mobile e ir evoluindo.
                    <br>
                    #WebDev
                </p>

                <p class="comments">
                    Ver todos os 42 comentários
                </p>

                <p class="time">HÁ 2 HORAS</p>
            </div>

        </article>

        <!-- Segunda publicação -->
        <article class="post">

            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=12">

                <div class="profile">
                    <strong>frojho_dev</strong>
                    <p>Parnaíba, PI</p>
                </div>

                <span>•••</span>
            </div>

            <div class="post-image"></div>

        </article>

        <!-- Menu inferior -->
        <nav>
            <span>⌂</span>
            <span>⌕</span>
            <span>＋</span>
            <span>♡</span>
            <span>♙</span>
        </nav>

    </div>

</body>
</html>
