
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #090979, #00d4ff);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            background: rgba(255,255,255,0.12);
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 35px;
        }

        p {
            font-size: 17px;
            margin-bottom: 25px;
        }

        button {
            background: #ffffff;
            color: #090979;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            background: #00d4ff;
            color: white;
        }

        #mensagem {
            margin-top: 25px;
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">
        <h1>Bem-vindo!</h1>

        <p>
            Este é meu primeiro site criado com HTML,
            CSS e JavaScript.
        </p>

        <button onclick="mostrarMensagem()">
            Clique aqui
        </button>

        <div id="mensagem"></div>
    </div>

    <script>
        function mostrarMensagem() {
            document.getElementById("mensagem").innerHTML =
                "🎉 Parabéns! Seu site está funcionando!";
        }
    </script>

<script src="script.js"></script></body>
</html>
