
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber World</title>

    <style>
        body {
            background: #080816;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }

        header {
            padding: 30px;
            background: #15152e;
            box-shadow: 0 0 20px #00ffff;
        }

        h1 {
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff;
        }

        .card {
            margin: 70px auto;
            padding: 30px;
            width: 80%;
            max-width: 350px;
            background: #17172e;
            border: 2px solid #00ffff;
            border-radius: 20px;
            box-shadow: 0 0 20px #00ffff;
        }

        button {
            background: #00ffff;
            color: black;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #ff00ff;
            color: white;
            box-shadow: 0 0 20px #ff00ff;
        }

        footer {
            padding: 20px;
            color: gray;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>CYBER WORLD</h1>
        <p>El futuro comienza aquí</p>
    </header>

    <div class="card">
        <h2>¡Bienvenido! 🚀</h2>
        <p>Explora un mundo lleno de tecnología.</p>

        <button onclick="saludar()">
            Entrar
        </button>

        <p id="resultado"></p>
    </div>

    <footer>
        © 2026 Cyber World
    </footer>

    <script>
        function saludar() {
            document.getElementById("resultado").innerHTML =
                "🔥 ¡Bienvenido al mundo Cyber!";
        }
    </script>

<script src="script.js"></script></body>
</html>
