
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Alunos</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Portal do Estudante</h1>
        <p>Área de cadastro de alunos</p>
    </header>

    <main>

        <section>
            <h2>Cadastro de Novo Aluno</h2>

            <form>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" 
                placeholder="Digite seu nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email"
                placeholder="Digite seu e-mail" required>

                <label for="idade">Idade:</label>
                <input type="number" id="idade"
                placeholder="Digite sua idade">

                <label for="curso">Escolha seu curso:</label>

                <select id="curso">
                    <option>Informática</option>
                    <option>Administração</option>
                    <option>Enfermagem</option>
                    <option>Desenvolvimento de Sistemas</option>
                </select>

                <button type="submit">Cadastrar Aluno</button>

            </form>
        </section>

        <section>
            <h2>Sobre o Portal</h2>

            <p>
                Este portal foi desenvolvido para facilitar
                o cadastro e a organização dos estudantes.
            </p>
        </section>

    </main>

    <footer>
        <p>© 2026 Portal do Estudante - Todos os direitos reservados.</p>
    </footer>

<script src="script.js"></script></body>
</html>
