<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📊 Controle de IMC</h1>
        <p class="subtitulo">Índice de Massa Corporal</p>

        <!-- Formulário -->
        <div class="card">
            <h2>Dados do Paciente</h2>
            <form id="formIMC">
                <div class="input-group">
                    <label for="nome">Nome do Paciente:</label>
                    <input type="text" id="nome" placeholder="Digite o nome completo" required>
                </div>

                <div class="input-group">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso" step="0.1" min="1" max="300" placeholder="Ex: 75.5" required>
                </div>

                <div class="input-group">
                    <label for="altura">Altura (m):</label>
                    <input type="number" id="altura" step="0.01" min="0.5" max="2.5" placeholder="Ex: 1.75" required>
                </div>

                <button type="submit" class="btn btn-primary">Calcular IMC</button>
            </form>
        </div>

        <!-- Resultado -->
        <div id="resultado" class="card resultado oculto">
            <h2>📋 Resultado</h2>
            <div id="conteudoResultado"></div>
        </div>

        <!-- Tabela de Referência -->
        <div class="card tabela">
            <h3>📖 Tabela de Referência do IMC</h3>
            <table>
                <thead>
                    <tr>
                        <th>IMC</th>
                        <th>Classificação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Menos de 18,5</td><td>Abaixo do peso</td></tr>
                    <tr><td>18,5 a 24,9</td><td>Peso ideal</td></tr>
                    <tr><td>25,0 a 29,9</td><td>Sobrepeso</td></tr>
                    <tr><td>30,0 a 34,9</td><td>Obesidade Grau I</td></tr>
                    <tr><td>35,0 a 39,9</td><td>Obesidade Grau II</td></tr>
                    <tr><td>40,0 ou mais</td><td>Obesidade Grau III</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
