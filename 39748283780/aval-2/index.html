<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📝 Gerenciador de Tarefas</h1>

        <!-- Formulário de Cadastro -->
        <div class="form-section">
            <h2>Cadastrar Nova Tarefa</h2>
            <form id="formTarefa">
                <div class="input-group">
                    <label for="titulo">Título da Tarefa:</label>
                    <input type="text" id="titulo" placeholder="Mínimo 5 caracteres" required>
                </div>

                <div class="input-group">
                    <label for="prioridade">Prioridade:</label>
                    <select id="prioridade" required>
                        <option value="1">🔴 Alta (1)</option>
                        <option value="2">🟡 Média (2)</option>
                        <option value="3">🟢 Baixa (3)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Cadastrar Tarefa</button>
            </form>
            <div id="mensagem" class="mensagem"></div>
        </div>

        <!-- Lista de Tarefas -->
        <div class="list-section">
            <h2>Lista de Tarefas</h2>
            <div id="listaTarefas" class="lista-tarefas">
                <p class="sem-tarefas">Nenhuma tarefa cadastrada ainda.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
