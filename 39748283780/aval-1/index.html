<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>📦 Controle de Estoque</h1>
        </header>

        <!-- Formulário de Cadastro -->
        <section class="form-container">
            <h2>Cadastrar Novo Produto</h2>
            <form id="product-form">
                <div class="form-group">
                    <label for="code">Código:</label>
                    <input type="text" id="code" required placeholder="Ex: P001">
                </div>
                <div class="form-group">
                    <label for="description">Descrição:</label>
                    <input type="text" id="description" required placeholder="Ex: Teclado Mecânico">
                </div>
                <div class="form-group">
                    <label for="quantity">Quantidade:</label>
                    <input type="number" id="quantity" min="0" required placeholder="Ex: 10">
                </div>
                <div class="form-group">
                    <label for="price">Valor (R$):</label>
                    <input type="number" id="price" min="0" step="0.01" required placeholder="Ex: 199.90">
                </div>
                <button type="submit" class="btn-submit">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Lista de Produtos -->
        <section class="list-container">
            <h2>Produtos Cadastrados</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor (R$)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="product-list">
                        <!-- Os produtos cadastrados entram aqui via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
