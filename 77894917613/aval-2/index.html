<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MiniFeed</title>
        <link rel="stylesheet" href="style.css">
    <link href="style.css" rel="stylesheet"></head>


    <body>
        
        <header>


            <div class="header-content">


                <h1>MiniFeed</h1>


                <nav>
        
                 <a href="#">Inicio</a>
                 <a href="#">Perfil</a>


                </nav>


            </div>




        </header>




        <main>




            <section class="new-post">


                <div class="user">
            
                    <div class="avatar">
                     I  
                    </div>
                    
                    <div>
                       <strong>henry</strong>
                       <span>O que você ta pensando?</span>
                    </div>


                </div>
 
          
                <button>Publicar</button>




            </section>


        
            <article class="post">


                <div class="post-header">


                    <div class="transformers">
                     I  
                    </div>
                    <div>
                       <strong>Henry</strong>
                       <span>ha 10 minuntos</span>
                    </div>




                    <div class="post-text">
                      hoje eu vi um filme dos transformers
                      muito top,estou bem feliz:D
                    </div>
                    <img src="https://thumb.wikimedia.org/wikipedia/pt/thumb/1/1a/Age_of_Extinction.jpg/250px-Age_of_Extinction.jpg?utm_source=pt.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" alt="imagem do filme">
         
                    <div class="post-actions">


                      <button>Curtir</button>
                      <button>Comentar</button>
                      <button>Favoritar</button>
                      <button>Compartilhar</button>


                    </div>




                </div>


            </article>


        </main>


        <footer>
            <p>"minifeed- todos os direitos reservados-2026</p>
        </footer>
    </body>


</html>
