
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Clone</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fafafa;
    color: #262626;
}

header {
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    position: sticky;
    top: 0;
}

.logo {
    font-family: cursive;
    font-size: 27px;
    font-weight: bold;
}

.search {
    padding: 9px;
    border: none;
    background: #efefef;
    border-radius: 8px;
}

.container {
    max-width: 600px;
    margin: 25px auto;
}

.stories {
    display: flex;
    gap: 15px;
    background: white;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow-x: auto;
}

.story {
    text-align: center;
    font-size: 12px;
}

.story img {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 3px solid #e1306c;
    padding: 2px;
    object-fit: cover;
}

.post {
    background: white;
    border: 1px solid #ddd;
    margin-top: 25px;
    border-radius: 8px;
    overflow: hidden;
}

.post-header {
    display: flex;
    align-items: center;
    padding: 12px;
    gap: 10px;
}

.post-header img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
}

.post-image {
    width: 100%;
    display: block;
}

.actions {
    padding: 12px;
    font-size: 25px;
}

.actions span {
    cursor: pointer;
    margin-right: 12px;
}

.actions .liked {
    color: red;
}

.likes {
    padding: 0 12px;
    font-weight: bold;
}

.caption {
    padding: 10px 12px;
}

.comment {
    padding: 10px 12px;
    color: gray;
}

.add-comment {
    display: flex;
    border-top: 1px solid #eee;
}

.add-comment input {
    flex: 1;
    padding: 13px;
    border: none;
    outline: none;
}

.add-comment button {
    border: none;
    color: #0095f6;
    background: white;
    padding: 10px;
    cursor: pointer;
    font-weight: bold;
}

nav {
    display: flex;
    justify-content: space-around;
    padding: 15px;
    background: white;
    border-top: 1px solid #ddd;
    position: fixed;
    bottom: 0;
    width: 100%;
    font-size: 23px;
}

@media(max-width: 600px) {
    .search {
        display: none;
    }

    .container {
        margin: 10px auto 70px;
    }

    .post {
        border-radius: 0;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <div class="logo">Instagram</div>
    <input class="search" type="text" placeholder="Pesquisar">
    <div>♡　✉</div>
</header>

<div class="container">

    <!-- STORIES -->
    <div class="stories">
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=1">
            <p>Seu story</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=2">
            <p>mariana</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=3">
            <p>pedro</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=4">
            <p>juliana</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=5">
            <p>lucas</p>
        </div>
    </div>

    <!-- POSTAGEM 1 -->
    <div class="post">

        <div class="post-header">
            <img src="https://i.pravatar.cc/100?img=12">
            <strong>mariana_oficial</strong>
        </div>

        <img class="post-image"
        src="https://picsum.photos/id/1011/600/500">

        <div class="actions">
            <span onclick="curtir(this)">♡</span>
            <span onclick="comentar(this)">♧</span>
            <span>➤</span>
        </div>

        <div class="likes">120 curtidas</div>

        <div class="caption">
            <strong>mariana_oficial</strong>
            Aproveitando o dia! ☀️❤️
        </div>

        <div class="comment">Ver todos os comentários</div>

        <div class="add-comment">
            <input type="text" placeholder="Adicione um comentário...">
            <button onclick="publicarComentario(this)">Publicar</button>
        </div>

    </div>

    <!-- POSTAGEM 2 -->
    <div class="post">

        <div class="post-header">
            <img src="https://i.pravatar.cc/100?img=15">
            <strong>pedro_fotos</strong>
        </div>

        <img class="post-image"
        src="https://picsum.photos/id/1039/600/500">

        <div class="actions">
            <span onclick="curtir(this)">♡</span>
            <span onclick="comentar(this)">♧</span>
            <span>➤</span>
        </div>

        <div class="likes">85 curtidas</div>

        <div class="caption">
            <strong>pedro_fotos</strong>
            Que lugar incrível! 🌎
        </div>

        <div class="comment">Ver todos os comentários</div>

        <div class="add-comment">
            <input type="text" placeholder="Adicione um comentário...">
            <button onclick="publicarComentario(this)">Publicar</button>
        </div>

    </div>

</div>

<!-- MENU INFERIOR -->
<nav>
    <span>⌂</span>
    <span>⌕</span>
    <span>＋</span>
    <span>♡</span>
    <span>👤</span>
</nav>

<script>

function curtir(elemento) {
    elemento.classList.toggle("liked");

    if (elemento.innerHTML === "♡") {
        elemento.innerHTML = "♥";
    } else {
        elemento.innerHTML = "♡";
    }
}

function comentar(elemento) {
    const input = elemento.closest(".post")
        .querySelector(".add-comment input");

    input.focus();
}

function publicarComentario(botao) {
    const post = botao.closest(".post");
    const input = post.querySelector("input");
    const texto = input.value.trim();

    if (texto === "") {
        alert("Digite um comentário!");
        return;
    }

    const comentario = document.createElement("p");
    comentario.className = "caption";
    comentario.textContent = "Você: " + texto;

    post.insertBefore(comentario, post.querySelector(".add-comment"));

    input.value = "";
}

</script>

<script src="script.js"></script></body>
</html>
