
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Instagram</h1>
        <input type="text" placeholder="Pesquisar">
        <div class="header-icons">
            <span>🏠</span>
            <span>💬</span>
            <span>❤️</span>
            <span>👤</span>
        </div>
    </header>

    <main>

        <section class="stories">
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=1">
                <p>Seu story</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=2">
                <p>Maria</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=3">
                <p>João</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=4">
                <p>Ana</p>
            </div>
        </section>

        <section class="new-post">
            <h3>Criar publicação</h3>
            <input type="text" id="username" placeholder="Seu nome">
            <input type="text" id="imageUrl" placeholder="URL da imagem">
            <input type="text" id="caption" placeholder="Escreva uma legenda">
            <button onclick="createPost()">Publicar</button>
        </section>

        <section id="feed">

            <article class="post">
                <div class="post-header">
                    <img src="https://i.pravatar.cc/100?img=5">
                    <strong>carolina</strong>
                </div>

                <img class="post-image"
                     src="https://picsum.photos/id/1011/600/500">

                <div class="post-actions">
                    <button onclick="likePost(this)">🤍</button>
                    <button>💬</button>
                    <button>📤</button>
                </div>

                <p class="likes">0 curtidas</p>
                <p><strong>carolina</strong> Aproveitando o dia! ☀️</p>
            </article>

        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
