
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrida Turbo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131c;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #ff3c3c;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .container {
            padding: 30px 15px;
        }

        .pista {
            width: 280px;
            height: 400px;
            margin: 20px auto;
            background: #353535;
            border-left: 8px solid white;
            border-right: 8px solid white;
            position: relative;
            overflow: hidden;
        }

        .linha {
            position: absolute;
            left: 50%;
            height: 100%;
            border-left: 5px dashed white;
        }

        .carro {
            position: absolute;
            bottom: 20px;
            left: 105px;
            width: 60px;
            height: 100px;
            background: #ff3030;
            border-radius: 12px 12px 6px 6px;
            box-shadow: 0 0 15px #ff3030;
        }

        .vidro {
            position: absolute;
            top: 20px;
            left: 10px;
            width: 40px;
            height: 25px;
            background: #7deaff;
            border-radius: 5px;
        }

        button {
            padding: 14px 25px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            background: #ff3c3c;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #cc2020;
        }

        footer {
            padding: 20px;
            color: #aaa;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>🏎️ CORRIDA TURBO</h1>
        <p>Prepare-se para acelerar!</p>
    </header>

    <div class="container">
        <h2>Minha primeira corrida</h2>
        <p>Use os botões para movimentar seu carro.</p>

        <div class="pista">
            <div class="linha"></div>

            <div class="carro" id="carro">
                <div class="vidro"></div>
            </div>
        </div>

        <button onclick="mover(-30)">⬅️ Esquerda</button>
        <button onclick="mover(30)">Direita ➡️</button>
        <br>
        <button onclick="reiniciar()">🔄 Reiniciar</button>
    </div>

    <footer>
        Criado com HTML, CSS e JavaScript
    </footer>

    <script>
        const carro = document.getElementById("carro");
        let posicao = 105;

        function mover(direcao) {
            posicao += direcao;

            if (posicao < 0) posicao = 0;
            if (posicao > 210) posicao = 210;

            carro.style.left = posicao + "px";
        }

        function reiniciar() {
            posicao = 105;
            carro.style.left = posicao + "px";
        }
    </script>

<script src="script.js"></script></body>
</html>
