  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1, h2 {
            color: #2c3e50;
        }

        .section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #a64bc2;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 5px;
            margin-top: 5px;
        }

        button:hover {
            background-color: #ac0466;
        }

        .btn-secundario {
            background-color: #2c3e50;
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn-secundario:hover {
            background-color: #1a252f;
        }

        .lista-tarefas {
            list-style-type: none;
            padding: 0;
            margin: 15px 0 0 0;
        }

        .item-tarefa {
            padding: 12px 8px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 15px;
            line-height: 1.5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .concluida {
            text-decoration: line-through;
            color: #888;
        }

        .mensagem-erro {
            color: #d9534f;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <!-- Seção de Cadastro -->
        <div class="section">
            <h2>Nova Tarefa</h2>
            <div class="input-group">
                <label for="titulo">Título (mínimo 5 caracteres):</label>
                <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript">
            </div>

            <div class="input-group">
                <label for="prioridade">Prioridade (1 a 3):</label>
                <select id="prioridade">
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>

  <script src="script.js"></script>
  
</body>
</html>
