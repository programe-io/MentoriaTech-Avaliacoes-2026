
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <aside class="sidebar">
        <h1>Instagram</h1>

        <nav>
            <a href="#"><i class="fa-solid fa-house"></i> Início</a>
            <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Pesquisa</a>
            <a href="#"><i class="fa-solid fa-compass"></i> Explorar</a>
            <a href="#"><i class="fa-solid fa-clapperboard"></i> Reels</a>
            <a href="#"><i class="fa-solid fa-paper-plane"></i> Mensagens</a>
            <a href="#"><i class="fa-regular fa-heart"></i> Notificações</a>
            <a href="#" onclick="novaPublicacao()"><i class="fa-solid fa-plus"></i> Criar</a>
            <a href="#"><i class="fa-solid fa-user"></i> Perfil</a>
        </nav>
    </aside>

    <main class="container">

        <section class="stories">
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=12">
                <span>Seu story</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=32">
                <span>mariana</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=11">
                <span>gabriel</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=44">
                <span>ana</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=15">
                <span>lucas</span>
            </div>
        </section>

        <section class="feed" id="feed">

            <article class="post">
                <div class="post-header">
                    <img src="https://i.pravatar.cc/100?img=32">
                    <strong>mariana</strong>
                    <span>• 2 h</span>
                    <i class="fa-solid fa-ellipsis"></i>
                </div>

                <img class="post-image"
                src="https://picsum.photos/id/1011/700/600">

                <div class="actions">
                    <button onclick="curtir(this)">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                    <button onclick="comentar()">
                        <i class="fa-regular fa-comment"></i>
                    </button>
                    <button>
                        <i class="fa-regular fa-paper-plane"></i>
                    </button>
                    <button class="save">
                        <i class="fa-regular fa-bookmark"></i>
                    </button>
                </div>

                <div class="description">
                    <strong class="likes">1.250 curtidas</strong>
                    <p><strong>mariana</strong> Aproveitando cada momento! ✨</p>
                    <p class="comments">Ver todos os 24 comentários</p>
                    <input type="text" placeholder="Adicione um comentário...">
                </div>
            </article>

            <article class="post">
                <div class="post-header">
                    <img src="https://i.pravatar.cc/100?img=11">
                    <strong>gabriel</strong>
                    <span>• 5 h</span>
                    <i class="fa-solid fa-ellipsis"></i>
                </div>

                <img class="post-image"
                src="https://picsum.photos/id/1015/700/600">

                <div class="actions">
                    <button onclick="curtir(this)">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                    <button onclick="comentar()">
                        <i class="fa-regular fa-comment"></i>
                    </button>
                    <button>
                        <i class="fa-regular fa-paper-plane"></i>
                    </button>
                    <button class="save">
                        <i class="fa-regular fa-bookmark"></i>
                    </button>
                </div>

                <div class="description">
                    <strong class="likes">890 curtidas</strong>
                    <p><strong>gabriel</strong> Que lugar incrível! 🌎</p>
                    <p class="comments">Ver todos os 12 comentários</p>
                    <input type="text" placeholder="Adicione um comentário...">
                </div>
            </article>

        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
