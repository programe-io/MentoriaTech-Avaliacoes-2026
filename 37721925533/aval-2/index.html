<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .campo { margin-bottom: 10px; }
        label { display: block; font-weight: bold; }
        button { margin-top: 5px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { padding: 8px; margin-bottom: 5px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .concluida { text-decoration: line-through; color: gray; }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h2>Gerenciador de Tarefas</h2>

    <!-- FORMULÁRIO PARA CADASTRAR -->
    <div class="campo">
        <label>Título da Tarefa:</label>
        <input type="text" id="tituloInput" placeholder="Mínimo 5 caracteres">
    </div>
    <div class="campo">
        <label>Prioridade:</label>
        <select id="prioridadeInput">
            <option value="1">1 (Alta)</option>
            <option value="2">2 (Média)</option>
            <option value="3">3 (Baixa)</option>
        </select>
    </div>
    <button onclick="adicionar()">Cadastrar Tarefa</button>

    <h3>Lista de Tarefas</h3>
    <ul id="listaTarefas"></ul>

    <!-- SCRIPT COM A LÓGICA DO JAVASCRIPT -->
    <script>
        let tarefas = [];
        let proximoCodigo = 1;

        function adicionar() {
            let titulo = document.getElementById("tituloInput").value;
            let prioridade = parseInt(document.getElementById("prioridadeInput").value);

            // Validações das regras
            if (titulo.length < 5) {
                alert("Erro: O título deve ter no mínimo 5 caracteres.");
                return;
            }

            let novaTarefa = {
                codigo: proximoCodigo,
                titulo: titulo,
                prioridade: prioridade,
                concluida: false
            };

            tarefas.push(novaTarefa);
            proximoCodigo++;
            
            // Limpa o campo de texto e atualiza a tela
            document.getElementById("tituloInput").value = "";
            atualizarTela();
        }

        function alternarConclusao(codigo) {
            for (let i = 0; i < tarefas.length; i++) {
                if (tarefas[i].codigo === codigo) {
                    // Inverte o status atual (se estava falso vira verdadeiro, e vice-versa)
                    tarefas[i].concluida = !tarefas[i].concluida;
                    break;
                }
            }
            atualizarTela();
        }

        function mudarPrioridade(codigo) {
            let novaPrioridade = prompt("Digite a nova prioridade (1, 2 ou 3):");
            let n = parseInt(novaPrioridade);

            if (n >= 1 && n <= 3) {
                for (let i = 0; i < tarefas.length; i++) {
                    if (tarefas[i].codigo === codigo) {
                        tarefas[i].prioridade = n;
                        break;
                    }
                }
                atualizarTela();
            } else {
                alert("Prioridade inválida! Escolha entre 1 e 3.");
            }
        }

        // Função que desenha a lista na tela de forma simples
        function atualizarTela() {
            let lista = document.getElementById("listaTarefas");
            lista.innerHTML = ""; // Limpa a lista atual

            if (tarefas.length === 0) {
                lista.innerHTML = "<li>Nenhuma tarefa cadastrada.</li>";
                return;
            }

            for (let i = 0; i < tarefas.length; i++) {
                let t = tarefas[i];
                let classeEstilo = t.concluida ? "class='concluida'" : "";
                
                lista.innerHTML += `
                    <li>
                        <span ${classeEstilo}>
                            [Cód: ${t.codigo}] <strong>${t.titulo}</strong> (Prio: ${t.prioridade})
                        </span>
                        <div>
                            <button onclick="alternarConclusao(${t.codigo})">
                                ${t.concluida ? 'Desmarcar' : 'Concluir'}
                            </button>
                            <button onclick="mudarPrioridade(${t.codigo})">Mudar Prio</button>
                        </div>
                    </li>
                `;
            }
        }

        // Executa uma vez ao abrir a página para mostrar que está vazia
        atualizarTela();
    </script>
<script src="script.js"></script></body>
</html>
