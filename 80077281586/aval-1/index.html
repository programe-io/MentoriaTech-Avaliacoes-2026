<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultura & Ciência Canábica | Blog</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <!-- Modal de Verificação de Idade (+18) -->
    <div id="age-gate" class="age-gate">
        <div class="age-box">
            <h2>Aviso de Conteúdo (+18)</h2>
            <p>Este blog contém material educativo e informativo sobre cannabis destinado exclusivamente a maiores de 18 anos.</p>
            <div class="age-buttons">
                <button id="btn-yes" class="btn-primary">Tenho 18 anos ou mais</button>
                <button id="btn-no" class="btn-secondary">Sou menor de idade</button>
            </div>
        </div>
    </div>

    <!-- Cabeçalho -->
    <header class="navbar">
        <div class="container nav-content">
            <a href="#" class="brand">🌿 Folha<span>&</span>Ciência</a>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" title="Alternar tema">🌙</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Artigo em Destaque (Hero) -->
        <section id="featured-post" class="featured-section">
            <!-- Preenchido via JavaScript -->
        </section>

        <!-- Barra de Controle: Categorias e Busca -->
        <section class="controls-bar">
            <div class="tabs" id="category-tabs">
                <button class="tab active" data-cat="todos">Todos</button>
                <button class="tab" data-cat="medicinal">Medicinal</button>
                <button class="tab" data-cat="cultura">História & Cultura</button>
                <button class="tab" data-cat="reducao">Redução de Danos</button>
                <button class="tab" data-cat="direito">Direito & Leis</button>
            </div>
            <input type="search" id="search-box" placeholder="Pesquisar por tema ou palavra-chave...">
        </section>

        <!-- Grade de Postagens -->
        <section id="articles-container" class="articles-grid">
            <!-- Preenchido via JavaScript -->
        </section>
    </main>

    <!-- Modal de Leitura do Artigo -->
    <div id="reader-modal" class="reader-modal hidden">
        <div class="reader-content">
            <button id="close-reader" class="close-reader">&times;</button>
            <div id="reader-meta" class="reader-meta"></div>
            <h1 id="reader-title"></h1>
            <div id="reader-text" class="reader-text"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>Folha & Ciência © 2026 — Conteúdo estritamente informativo e educacional.</p>
        </div>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
