<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseFeed | Rede Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="app-layout">
        <!-- Cabeçalho e Abas -->
        <header class="feed-header">
            <h1>Página Inicial</h1>
            <div class="feed-tabs">
                <button class="tab-btn active" data-filter="all">Para você</button>
                <button class="tab-btn" data-filter="liked">Curtidos</button>
            </div>
        </header>

        <!-- Caixa para Criar Nova Publicação -->
        <section class="composer-box">
            <img src="https://pravatar.cc" alt="Seu avatar" class="avatar">
            <div class="composer-input-area">
                <textarea id="post-textarea" rows="3" maxlength="280" placeholder="O que está acontecendo?"></textarea>
                <div class="composer-footer">
                    <span id="char-counter" class="char-counter">280</span>
                    <button id="publish-btn" class="publish-btn" disabled>Publicar</button>
                </div>
            </div>
        </section>

        <!-- Lista de Publicações -->
        <main id="feed-stream" class="feed-stream">
            <!-- Os posts serão inseridos aqui pelo JavaScript -->
        </main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
