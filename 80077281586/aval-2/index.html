<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaClone | Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <!-- Cabeçalho Fixo -->
    <header class="top-nav">
        <div class="nav-container">
            <h1 class="logo">InstaClone</h1>
            <input type="text" class="search-bar" placeholder="Pesquisar">
            <div class="nav-icons">
                <span title="Início">🏠</span>
                <span title="Mensagens">✈️</span>
                <span title="Nova publicação">➕</span>
                <span title="Notificações">❤️</span>
                <img src="https://pravatar.cc" alt="Meu Perfil" class="nav-avatar">
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- Barra de Stories -->
        <section class="stories-container" id="stories-list">
            <!-- Stories gerados via JavaScript -->
        </section>

        <!-- Feed de Publicações -->
        <section class="feed-container" id="feed-posts">
            <!-- Posts gerados via JavaScript -->
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
