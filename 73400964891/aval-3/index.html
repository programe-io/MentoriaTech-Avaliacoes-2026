<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <h1>Ficha de Anamnese - IMC</h1>

        <div class="card">
            <h2>Cadastro de Paciente</h2>

            <form id="formPessoa">
                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" maxlength="50" required>
                </div>

                <div class="campo">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" min="1" max="120" required>
                </div>

                <div class="campo">
                    <label for="altura">Altura (metros):</label>
                    <input type="number" id="altura" min="0.5" max="2.5" step="0.01" required>
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso" min="1" max="500" step="0.1" required>
                </div>

                <div id="erro"></div>

                <div class="botoes">
                    <button type="submit">Salvar Paciente</button>
                    <button type="button" id="btnCancelar">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Pacientes Cadastrados</h2>

            <div class="tabelaResponsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaPessoas"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
