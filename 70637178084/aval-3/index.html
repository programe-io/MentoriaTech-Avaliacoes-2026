<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de IMC</title>
  <link rel="stylesheet" href="style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <header class="header">
      <h1>Controle de IMC</h1>
      <p>Informe os dados do paciente para calcular e avaliar o Índice de Massa Corporal.</p>
    </header>

    <form id="form-imc" class="form-imc" novalidate>
      <div class="campo">
        <label for="nome">Nome do Paciente</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Ex.: Maria Silva"
          required
        />
      </div>

      <div class="grid-2">
        <div class="campo">
          <label for="peso">Peso (kg)</label>
          <input
            type="text"
            inputmode="decimal"
            id="peso"
            name="peso"
            placeholder="Ex.: 70,5"
            required
          />
        </div>

        <div class="campo">
          <label for="altura">Altura (m)</label>
          <input
            type="text"
            inputmode="decimal"
            id="altura"
            name="altura"
            placeholder="Ex.: 1,70"
            required
          />
        </div>
      </div>

      <div class="acoes">
        <button type="submit" class="btn-calcular">Calcular IMC</button>
        <button type="button" id="btn-limpar" class="btn-limpar">Limpar</button>
      </div>
    </form>

    <p id="mensagem-erro" class="mensagem-erro oculto" role="alert"></p>

    <section id="resultado" class="resultado oculto" aria-live="polite">
      <div class="resultado-topo">
        <div>
          <h2 id="res-nome"></h2>
          <p id="res-medidas" class="subinfo"></p>
        </div>
        <div class="imc-destaque">
          <span id="res-imc" class="imc-valor"></span>
          <span class="imc-unidade">kg/m²</span>
        </div>
      </div>

      <span id="res-badge" class="badge"></span>
      <p id="res-observacao" class="observacao"></p>

      <div class="detalhes">
        <div>
          <span>Faixa de peso saudável</span>
          <strong id="res-faixa-peso"></strong>
        </div>
        <div>
          <span>Referência adulta (OMS)</span>
          <strong>IMC entre 18,5 e 24,9</strong>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
