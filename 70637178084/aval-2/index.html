
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input, select, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            border: none;
            background: #2563eb;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .concluir {
            background: #16a34a;
        }

        .alterar {
            background: #f59e0b;
        }

        .excluir {
            background: #dc2626;
        }

        .tarefa {
            background: #f8fafc;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 10px;
            border-radius: 7px;
        }

        .concluida {
            text-decoration: line-through;
            color: gray;
        }

        .status {
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Gerenciador de Tarefas</h1>

    <h3>Cadastrar nova tarefa</h3>

    <input
        type="text"
        id="titulo"
        placeholder="Digite o título da tarefa"
    >

    <select id="prioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="cadastrarTarefa()">
        Cadastrar tarefa
    </button>

    <h3>Lista de tarefas</h3>

    <div id="listaTarefas"></div>

</div>

<script>

    let tarefas = [];
    let proximoCodigo = 1;

    // Cadastrar tarefa
    function cadastrarTarefa() {

        let titulo = document.getElementById("titulo").value.trim();
        let prioridade = Number(
            document.getElementById("prioridade").value
        );

        if (titulo.length < 5) {
            alert("O título deve ter no mínimo 5 caracteres!");
            return;
        }

        if (prioridade < 1 || prioridade > 3) {
            alert("A prioridade deve ser entre 1 e 3!");
            return;
        }

        let tarefa = {
            codigo: proximoCodigo,
            titulo: titulo,
            prioridade: prioridade,
            concluida: false
        };

        tarefas.push(tarefa);
        proximoCodigo++;

        document.getElementById("titulo").value = "";

        listarTarefas();

        alert("Tarefa cadastrada com sucesso!");
    }

    // Listar tarefas
    function listarTarefas() {

        let lista = document.getElementById("listaTarefas");

        lista.innerHTML = "";

        if (tarefas.length === 0) {
            lista.innerHTML = "<p>Nenhuma tarefa cadastrada.</p>";
            return;
        }

        tarefas.forEach(tarefa => {

            let div = document.createElement("div");
            div.className = "tarefa";

            let titulo = document.createElement("strong");
            titulo.textContent = tarefa.codigo + " - " + tarefa.titulo;

            if (tarefa.concluida) {
                titulo.classList.add("concluida");
            }

            let info = document.createElement("p");
            info.textContent =
                "Prioridade: " + tarefa.prioridade +
                " | Status: " +
                (tarefa.concluida ? "Concluída" : "Pendente");

            let concluir = document.createElement("button");
            concluir.textContent = "Concluir";
            concluir.className = "concluir";
            concluir.onclick = () => concluirTarefa(tarefa.codigo);
            concluir.disabled = tarefa.concluida;

            let alterar = document.createElement("button");
            alterar.textContent = "Alterar prioridade";
            alterar.className = "alterar";
            alterar.onclick = () => alterarPrioridade(tarefa.codigo);

            div.appendChild(titulo);
            div.appendChild(info);
            div.appendChild(concluir);
            div.appendChild(alterar);

            lista.appendChild(div);
        });
    }

    // Marcar tarefa como concluída
    function concluirTarefa(codigo) {

        let tarefa = tarefas.find(t => t.codigo === codigo);

        if (!tarefa) {
            alert("Tarefa não encontrada!");
            return;
        }

        tarefa.concluida = true;

        listarTarefas();
    }

    // Alterar prioridade
    function alterarPrioridade(codigo) {

        let tarefa = tarefas.find(t => t.codigo === codigo);

        if (!tarefa) {
            alert("Tarefa não encontrada!");
            return;
        }

        let novaPrioridade = Number(
            prompt("Digite a nova prioridade (1 - Alta, 2 - Média, 3 - Baixa):")
        );

        if (![1, 2, 3].includes(novaPrioridade)) {
            alert("Prioridade inválida! Digite 1, 2 ou 3.");
            return;
        }

        tarefa.prioridade = novaPrioridade;

        listarTarefas();

        alert("Prioridade alterada com sucesso!");
    }

    // Exibir lista inicial
    listarTarefas();

</script>

<script src="script.js"></script></body>
</html>
