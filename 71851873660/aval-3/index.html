<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Completa</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="app-calculadora">
    <!-- Corpo Principal da Calculadora -->
    <section class="calculadora">
      <div class="visor-container">
        <div id="expressao-anterior"></div>
        <input type="text" id="visor" readonly placeholder="0">
      </div>

      <div class="teclado">
        <button type="button" id="btn-limpar" class="funcao">AC</button>
        <button type="button" id="btn-apagar" class="funcao">⌫</button>
        <button type="button" class="operador" data-valor="%">%</button>
        <button type="button" class="operador" data-valor="/">÷</button>

        <button type="button" class="numero" data-valor="7">7</button>
        <button type="button" class="numero" data-valor="8">8</button>
        <button type="button" class="numero" data-valor="9">9</button>
        <button type="button" class="operador" data-valor="*">×</button>

        <button type="button" class="numero" data-valor="4">4</button>
        <button type="button" class="numero" data-valor="5">5</button>
        <button type="button" class="numero" data-valor="6">6</button>
        <button type="button" class="operador" data-valor="-">−</button>

        <button type="button" class="numero" data-valor="1">1</button>
        <button type="button" class="numero" data-valor="2">2</button>
        <button type="button" class="numero" data-valor="3">3</button>
        <button type="button" class="operador" data-valor="+">+</button>

        <button type="button" id="btn-sinal" class="funcao">+/-</button>
        <button type="button" class="numero" data-valor="0">0</button>
        <button type="button" class="numero" data-valor=".">,</button>
        <button type="button" id="btn-igual">=</button>
      </div>
    </section>

    <!-- Painel de Histórico -->
    <aside class="historico">
      <div class="historico-topo">
        <h2>Histórico</h2>
        <button type="button" id="btn-limpar-historico">Limpar</button>
      </div>
      <ul id="lista-historico">
        <li class="vazio">Nenhum cálculo realizado</li>
      </ul>
    </aside>
  </main>

<script src="script.js"></script></body>
</html>
