
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h1>Ficha de Anamnese</h1>

    <form id="formPessoa">
        <input id="nome" placeholder="Nome" required>
        <input id="idade" type="number" placeholder="Idade" required>
        <input id="altura" type="number" step="0.01" placeholder="Altura (m)" required>
        <input id="peso" type="number" step="0.1" placeholder="Peso (kg)" required>

        <p id="erro" hidden></p>
        <button type="submit">Salvar Paciente</button>
    </form>

    <h2>Pacientes Cadastrados</h2>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Altura</th>
                <th>Peso</th>
                <th>IMC</th>
                <th>Classificação</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
