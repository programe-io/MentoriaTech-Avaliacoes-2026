
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Controle de Estoque</h1>
        <p>Gerencie seus produtos de maneira simples</p>
    </header>

    <main>

        <section class="cadastro">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <label>Código do produto:</label>
                <input type="text" id="codigo"
                    placeholder="Digite o código" required>

                <label>Descrição:</label>
                <input type="text" id="descricao"
                    placeholder="Nome do produto" required>

                <label>Quantidade:</label>
                <input type="number" id="quantidade"
                    min="0" step="1" placeholder="Quantidade" required>

                <label>Valor (R$):</label>
                <input type="number" id="valor"
                    min="0" step="0.01" placeholder="Valor" required>

                <button type="submit">Cadastrar Produto</button>

            </form>
        </section>

        <section class="estoque">

            <h2>Produtos Cadastrados</h2>

            <div class="tabela-container">
                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>

                </table>
            </div>

            <p id="mensagem"></p>

        </section>

    </main>

    <footer>
        <p>Sistema de Controle de Estoque - Projeto JavaScript</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
