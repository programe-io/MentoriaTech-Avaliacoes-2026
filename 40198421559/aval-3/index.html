<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Calculadora de IMC</title>
        <link rel="stylesheet" href="style.css">
        </head>
        <body>
          <main class="container">
              <h1>Calculadora de IMC</h1>

                  <section class="card">
                        <h2>Nova pessoa</h2>
                              <form id="form-pessoa" novalidate>
                                      <div class="campos">
                                                <label>
                                                            Nome
                                                                        <input type="text" id="nome" placeholder="Ex.: Maria Silva" required>
                                                                                  </label>
                                                                                            <label>
                                                                                                        Idade (anos)
                                                                                                                    <input type="number" id="idade" placeholder="Ex.: 30" min="0" max="130" step="1" required>
                                                                                                                              </label>
                                                                                                                                        <label>
                                                                                                                                                    Altura (m)
                                                                                                                                                                <input type="number" id="altura" placeholder="Ex.: 1.75" min="0.5" max="2.5" step="0.01" required>
                                                                                                                                                                          </label>
                                                                                                                                                                                    <label>
                                                                                                                                                                                                Peso (kg)
                                                                                                                                                                                                            <input type="number" id="peso" placeholder="Ex.: 70" min="1" max="500" step="0.1" required>
                                                                                                                                                                                                                      </label>
                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                      <p id="erro" class="erro" role="alert" hidden></p>
                                                                                                                                                                                                                                              <button type="submit" class="botao">Salvar</button>
                                                                                                                                                                                                                                                    </form>
                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                            <section class="card">
                                                                                                                                                                                                                                                                  <h2>Pessoas cadastradas</h2>
                                                                                                                                                                                                                                                                        <div class="tabela-wrapper">
  <script src="script.js"></script>
  
</body>
</html>
