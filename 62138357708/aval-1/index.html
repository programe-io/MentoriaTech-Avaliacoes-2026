<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estoque 13 - 2A TDS</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#fff0f0;
}

.container{
    max-width:1000px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    border-top:6px solid #c0392b;
    box-shadow:0 5px 18px #dfc2c2;
}

h1,h3{
    color:#a52828;
}

h1{text-align:center}

.form{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

input{
    padding:12px;
    border:1px solid #e2c5c5;
    border-radius:5px;
}

button{
    padding:9px 12px;
    border:0;
    border-radius:5px;
    color:white;
    cursor:pointer;
    margin:2px;
}

.add{
    width:100%;
    margin-top:10px;
    background:#c0392b;
    font-weight:bold;
}

.edit{
    background:#d68910;
}

.del{
    background:#922b21;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border:1px solid #ddd;
    text-align:center;
}

th{
    background:#c0392b;
    color:white;
}

tr:hover{
    background:#fff5f5;
}

@media(max-width:700px){
    .form{grid-template-columns:1fr}
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

<h1>🔴 Controle de Estoque - 2A TDS</h1>

<h3>Novo Produto</h3>

<div class="form">

<input id="codigo" placeholder="Código">
<input id="descricao" placeholder="Descrição">
<input id="quantidade" type="number" min="0" placeholder="Quantidade">
<input id="valor" type="number" min="0" step=".01" placeholder="Valor">

</div>

<button class="add" onclick="add()">
➕ Cadastrar Produto
</button>

<h3>Produtos em Estoque</h3>

<table>

<thead>
<tr>
<th>Código</th>
<th>Descrição</th>
<th>Quantidade</th>
<th>Valor</th>
<th>Ações</th>
</tr>
</thead>

<tbody id="lista"></tbody>

</table>

</div>

<script>

const ID_ESTOQUE = "ESTOQUE_13";

let produtos = JSON.parse(
    localStorage.getItem(ID_ESTOQUE) || "[]"
);

function salvar(){

    localStorage.setItem(
        ID_ESTOQUE,
        JSON.stringify(produtos)
    );
}

function add(){

    const c = codigo.value.trim();
    const d = descricao.value.trim();
    const q = Number(quantidade.value);
    const v = Number(valor.value);

    if(!c || !d ||
       quantidade.value === "" ||
       valor.value === "" ||
       q < 0 || v < 0){

        alert("Preencha todos os campos corretamente!");
        return;
    }

    produtos.push({c,d,q,v});

    salvar();
    limpar();
    listar();
}

function listar(){

    lista.innerHTML = "";

    if(produtos.length === 0){

        lista.innerHTML =
        '<tr><td colspan="5">Nenhum produto cadastrado.</td></tr>';

        return;
    }

    produtos.forEach((p,i)=>{

        lista.innerHTML += `
        <tr>

        <td>${p.c}</td>
        <td>${p.d}</td>
        <td>${p.q}</td>
        <td>R$ ${p.v.toFixed(2).replace(".",",")}</td>

        <td>

        <button class="edit"
        onclick="alterarValor(${i})">
        💰 Valor
        </button>

        <button class="edit"
        onclick="alterarQuantidade(${i})">
        📦 Quantidade
        </button>

        <button class="del"
        onclick="excluir(${i})">
        🗑️ Excluir
        </button>

        </td>

        </tr>`;
    });
}

function alterarValor(i){

    let v = prompt("Novo valor:");

    if(v === null)return;

    v = Number(v.replace(",","."));

    if(!isNaN(v) && v >= 0){

        produtos[i].v = v;

        salvar();
        listar();
    }
}

function alterarQuantidade(i){

    let q = prompt("Nova quantidade:");

    if(q === null)return;

    q = Number(q);

    if(!isNaN(q) && q >= 0){

        produtos[i].q = q;

        salvar();
        listar();
    }
}

function excluir(i){

    if(confirm("Deseja excluir este produto?")){

        produtos.splice(i,1);

        salvar();
        listar();
    }
}

function limpar(){

    codigo.value="";
    descricao.value="";
    quantidade.value="";
    valor.value="";
}

listar();

</script>

</body>
</html>
