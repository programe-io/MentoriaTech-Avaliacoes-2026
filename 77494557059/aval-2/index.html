
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- Cabeçalho -->
    <header>
        <div class="header-content">

            <h1>MiniFeed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>

        </div>
    </header>

    <!-- Conteúdo principal -->
    <main>

        <!-- Nova publicação -->
        <section class="new-post">

            <div class="user">

                <div class="avatar">C</div>

                <div class="user-info">
                    <strong>Caio</strong>
                    <span>O que você está pensando?</span>
                </div>

            </div>

            <button>Publicar</button>

        </section>

        <!-- Publicação -->
        <article class="post">

            <div class="post-header">

                <div class="avatar">M</div>

                <div class="user-info">
                    <strong>Maria</strong>
                    <span>Há 10 minutos</span>
                </div>

            </div>

            <!-- Texto da publicação -->
            <div class="post-text">
                Hoje eu vi o novo filme do Homem-Aranha,
                top, tô feliz!
            </div>

            <!-- Imagem -->
            
<img
    src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Spider-Man.jpg"
    alt="Homem-Aranha"
    class="post-image"
>


            <!-- Botões -->
            <div class="post-actions">

                <button>Curtir</button>
                <button>Comentar</button>

            </div>

        </article>

    </main>

    <!-- Rodapé -->
    <footer>
        <p>MiniFeed - Todos os Direitos Reservados - 2026</p>
    </footer>

</body>

</html>
