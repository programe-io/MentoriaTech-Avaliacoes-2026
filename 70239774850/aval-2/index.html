<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventiza - Inscrições</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Eventiza</h1>
    <p>Gerenciamento de eventos e participantes</p>
</header>

<main>
    <section class="container">
        <h2>Novo evento</h2>

        <form id="formularioEvento">
            <input type="text" id="nomeEvento"
                placeholder="Nome do evento" required>

            <input type="date" id="dataEvento" required>

            <input type="text" id="localEvento"
                placeholder="Local" required>

            <button type="submit">Cadastrar evento</button>
        </form>
    </section>

    <section class="container">
        <h2>Inscrever participante</h2>

        <form id="formularioParticipante">
            <input type="text" id="nomeParticipante"
                placeholder="Nome do participante" required>

            <input type="email" id="emailParticipante"
                placeholder="E-mail do participante" required>

            <select id="eventoSelecionado" required>
                <option value="">Selecione um evento</option>
            </select>

            <button type="submit">Realizar inscrição</button>
        </form>
    </section>

    <section class="container">
        <h2>Eventos disponíveis</h2>

        <input type="search" id="pesquisa"
            placeholder="Pesquisar evento...">

        <div id="listaEventos"></div>
    </section>
</main>

<footer>
    <p>Eventiza © 2026</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
