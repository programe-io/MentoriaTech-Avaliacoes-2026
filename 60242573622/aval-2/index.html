
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <header>
      <h1>📋 Gerenciador de Tarefas</h1>
      <p>Organize suas atividades de forma simples e eficiente.</p>
    </header>

    <section class="dashboard">
      <div class="card">
        <h3>Total de Tarefas</h3>
        <span id="total">0</span>
      </div>
      <div class="card">
        <h3>Pendentes</h3>
        <span id="pendentes">0</span>
      </div>
      <div class="card">
        <h3>Concluídas</h3>
        <span id="concluidas">0</span>
      </div>
    </section>

    <section class="formulario">
      <h2 id="tituloFormulario">Cadastrar Nova Tarefa</h2>

      <form id="formTarefa">
        <input type="hidden" id="tarefaId">

        <label for="titulo">Título da tarefa</label>
        <input type="text" id="titulo"
          placeholder="Digite o título da tarefa"
          minlength="5" required>

        <label for="descricao">Descrição</label>
        <textarea id="descricao"
          placeholder="Descreva a atividade"></textarea>

        <label for="prioridade">Prioridade</label>
        <select id="prioridade" required>
          <option value="1">Alta</option>
          <option value="2">Média</option>
          <option value="3">Baixa</option>
        </select>

        <label for="data">Data limite</label>
        <input type="date" id="data">

        <button type="submit" class="btn-salvar">
          Salvar Tarefa
        </button>

        <button type="button" id="cancelarEdicao"
          class="btn-cancelar" hidden>
          Cancelar Edição
        </button>
      </form>
    </section>

    <section class="lista">
      <h2>Minhas Tarefas</h2>

      <div class="filtros">
        <input type="search" id="pesquisa"
          placeholder="Pesquisar tarefa...">

        <select id="filtroStatus">
          <option value="todas">Todas</option>
          <option value="pendentes">Pendentes</option>
          <option value="concluidas">Concluídas</option>
        </select>
      </div>

      <div id="listaTarefas"></div>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
