
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPro - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <div class="logo">Task<span>Pro.</span></div>
    <div class="perfil">Meu painel 👤</div>
</header>

<main>
    <section class="boas-vindas">
        <div>
            <h1>Organize seu dia! 🚀</h1>
            <p>Planeje suas tarefas e acompanhe suas conquistas.</p>
        </div>
        <div class="data" id="dataAtual"></div>
    </section>

    <section class="resumo">
        <div class="card">
            <span>📋 Total de tarefas</span>
            <h2 id="total">0</h2>
        </div>
        <div class="card">
            <span>⏳ Pendentes</span>
            <h2 id="pendentes">0</h2>
        </div>
        <div class="card">
            <span>✅ Concluídas</span>
            <h2 id="concluidas">0</h2>
        </div>
        <div class="card">
            <span>📈 Progresso</span>
            <h2 id="progresso">0%</h2>
        </div>
    </section>

    <section class="progresso-box">
        <h3>Seu progresso geral</h3>
        <div class="barra">
            <div id="barraProgresso"></div>
        </div>
        <p id="mensagem">Vamos começar a organizar suas tarefas!</p>
    </section>

    <section class="criar">
        <h2>➕ Nova tarefa</h2>

        <input id="nome" placeholder="Nome da tarefa">

        <textarea id="descricao"
        placeholder="Descreva como você pode concluir essa tarefa..."></textarea>

        <div class="campos">
            <select id="prioridade">
                <option value="Baixa">Prioridade baixa</option>
                <option value="Média">Prioridade média</option>
                <option value="Alta">Prioridade alta</option>
            </select>

            <input type="date" id="prazo">
        </div>

        <button onclick="adicionarTarefa()">Adicionar tarefa</button>
    </section>

    <section class="tarefas-section">
        <div class="titulo">
            <h2>Minhas tarefas</h2>
            <select id="filtro" onchange="mostrarTarefas()">
                <option value="Todas">Todas</option>
                <option value="Pendente">Pendentes</option>
                <option value="Concluída">Concluídas</option>
            </select>
        </div>

        <div id="listaTarefas"></div>
    </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
