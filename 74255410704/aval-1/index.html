
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockShop - Loja Online</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <div class="logo">Stock<span>Shop</span></div>
    <nav>
        <a href="#">Início</a>
        <a href="#produtos">Produtos</a>
        <a href="#estoque">Estoque</a>
    </nav>
    <button class="cart-button" onclick="abrirCarrinho()">
        🛒 Carrinho <span id="contador">0</span>
    </button>
</header>

<section class="banner">
    <div>
        <h1>Sua loja online</h1>
        <p>Encontre os melhores produtos com qualidade e preço especial.</p>
        <a href="#produtos" class="btn">Comprar agora</a>
    </div>
</section>

<main>
    <div class="titulo" id="produtos">
        <h2>Nossos produtos</h2>
        <p>Escolha seus produtos favoritos</p>
    </div>

    <div class="produtos" id="listaProdutos"></div>

    <section class="estoque" id="estoque">
        <h2>📦 Controle de estoque</h2>
        <div id="listaEstoque"></div>
    </section>
</main>

<div class="fundo" id="fundo" onclick="fecharCarrinho()"></div>

<aside class="carrinho" id="carrinho">
    <div class="carrinho-topo">
        <h2>🛒 Meu carrinho</h2>
        <button onclick="fecharCarrinho()">✕</button>
    </div>

    <div id="itensCarrinho"></div>

    <div class="total">
        <p>Subtotal: <strong id="subtotal">R$ 0,00</strong></p>
        <h2>Total: <span id="total">R$ 0,00</span></h2>
        <button onclick="finalizarCompra()">Finalizar compra</button>
    </div>
</aside>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
