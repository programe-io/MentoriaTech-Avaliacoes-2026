<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  
<div class="app">
  <header>
      <h1>BLACK<span>STOCK</span></h1>
          <p>SISTEMA DE CONTROLE DE ESTOQUE</p>
            </header>

              <section class="resumo">
                  <div class="card">
                        <p>PRODUTOS</p>
                              <h2 id="total">0</h2>
                                  </div>
                                      <div class="card">
                                            <p>VALOR DO ESTOQUE</p>
                                                  <h2 id="valor">R$ 0,00</h2>
                                                      </div>
                                                        </section>

                                                          <section class="painel">
                                                              <h2>Novo produto</h2>
                                                                  <input id="codigo" type="number" placeholder="Código do produto">
                                                                      <input id="nome" type="text" placeholder="Nome do produto">
                                                                          <input id="quantidade" type="number" placeholder="Quantidade">
                                                                              <input id="preco" type="number" step="0.01" placeholder="Preço unitário">
                                                                                  <button onclick="cadastrar()">+ Cadastrar produto</button>
                                                                                    </section>

                                                                                      <section class="painel">
                                                                                          <h2>Estoque</h2>
                                                                                              <input id="busca" type="text" placeholder="Pesquisar produto..." oninput="listar()">
                                                                                                  <div id="lista"></div>
                                                                                                    </section>

                                                                                                      <footer>BLACKSTOCK • ORGANIZAÇÃO E CONTROLE</footer>
                                                                                                      </div>
                                                                                                      
  <script src="script.js"></script>
  
</body>
</html>
