<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Sistema de Senha</title>

                <style>
                        body {
                                    font-family: Arial, sans-serif;
                                                text-align: center;
                                                            margin-top: 100px;
                                                                    }

                                                                            input {
                                                                                        padding: 10px;
                                                                                                    font-size: 16px;
                                                                                                            }

                                                                                                                    button {
                                                                                                                                padding: 10px 20px;
                                                                                                                                            margin-top: 10px;
                                                                                                                                                        cursor: pointer;
                                                                                                                                                                }

                                                                                                                                                                        #mensagem {
                                                                                                                                                                                    margin-top: 20px;
                                                                                                                                                                                                font-size: 18px;
                                                                                                                                                                                                        }
                                                                                                                                                                                                            </style>
                                                                                                                                                                                                            <script src="https://cdn.tailwindcss.com"></script>
</head>

                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                <h1>Sistema de Acesso</h1>

                                                                                                                                                                                                                    <p>Informe sua senha:</p>

                                                                                                                                                                                                                        <input type="password" id="senha" placeholder="Digite sua senha">

                                                                                                                                                                                                                            <br>

                                                                                                                                                                                                                                <button onclick="verificarSenha()">Entrar</button>

                                                                                                                                                                                                                                    <p id="mensagem"></p>

                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                const senha = "123456";
                                                                                                                                                                                                                                                        let tentativas = 3;

                                                                                                                                                                                                                                                                function verificarSenha() {

                                                                                                                                                                                                                                                                            let confirmaSenha = document.getElementById("senha").value;
                                                                                                                                                                                                                                                                                        let mensagem = document.getElementById("mensagem");

                                                                                                                                                                                                                                                                                                    if (tentativas <= 0) {
                                                                                                                                                                                                                                                                                                                    mensagem.innerHTML = "Acesso bloqueado!!!";
                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                            if (confirmaSenha === senha) {
                                                                                                                                                                                                                                                                                                                                                                            mensagem.innerHTML = "Acesso Permitido!!!";
                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                        tentativas--;

                                                                                                                                                                                                                                                                                                                                                                                                                        mensagem.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                            `Senha Incorreta, Restam ${tentativas} tentativas.`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (tentativas === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                mensagem.innerHTML = "Acesso bloqueado!!!";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("senha").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
