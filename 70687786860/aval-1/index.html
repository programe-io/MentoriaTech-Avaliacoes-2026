
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Gerenciamento de estoque</p>
    </header>

    <main>

        <!-- Formulário de cadastro -->
        <section class="container">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="descricao">Descrição do produto:</label>
                    <input
                        type="text"
                        id="descricao"
                        name="descricao"
                        placeholder="Ex.: Cadeira Gamer"
                        required
                        minlength="5"
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade:</label>
                    <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        placeholder="Digite a quantidade"
                        min="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$):</label>
                    <input
                        type="number"
                        id="valor"
                        name="valor"
                        placeholder="Ex.: 699.00"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit">Cadastrar Produto</button>

            </form>
        </section>

        <!-- Lista de produtos -->
        <section class="container">
            <h2>Produtos Cadastrados</h2>

            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor (R$)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="5">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Atualizar produto -->
        <section class="container">
            <h2>Atualizar Produto</h2>

            <form id="formAtualizarValor">

                <h3>Atualizar valor</h3>

                <div class="campo">
                    <label for="codigoValor">Código do produto:</label>
                    <input
                        type="number"
                        id="codigoValor"
                        min="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">Novo valor (R$):</label>
                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit">Atualizar Valor</button>

            </form>

            <hr>

            <form id="formAtualizarQuantidade">

                <h3>Adicionar quantidade ao estoque</h3>

                <div class="campo">
                    <label for="codigoQuantidade">Código do produto:</label>
                    <input
                        type="number"
                        id="codigoQuantidade"
                        min="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="novaQuantidade">Quantidade a adicionar:</label>
                    <input
                        type="number"
                        id="novaQuantidade"
                        min="1"
                        required
                    >
                </div>

                <button type="submit">Adicionar ao Estoque</button>

            </form>
        </section>

        <!-- Mensagens do sistema -->
        <div id="mensagem" role="status" aria-live="polite"></div>

    </main>

    <footer>
        <p>Sistema de Cadastro de Produtos</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
