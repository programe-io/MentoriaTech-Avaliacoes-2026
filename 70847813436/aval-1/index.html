```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>
        <p>Cadastre e gerencie seus produtos.</p>

        <form id="formProduto">
            <label for="descricao">Descrição do produto:</label>
            <input type="text" id="descricao" placeholder="Ex.: Cadeira Gamer" required>

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" min="1" placeholder="Digite a quantidade" required>

            <label for="valor">Valor (R$):</label>
            <input type="number" id="valor" min="0" step="0.01" placeholder="Digite o valor" required>

            <button type="submit">Cadastrar Produto</button>
        </form>

        <h2>Produtos Cadastrados</h2>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>
                <tbody id="listaProdutos">
                    <!-- Produtos serão adicionados aqui -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
