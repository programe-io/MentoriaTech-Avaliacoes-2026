<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>Primeira Avaliação - Mentoria Técnica</title>

        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

        <body>

          <div class="container">
              
                  <div class="header">
                        <h1>🎓 Mentoria Técnica</h1>
                              <p>Primeira Avaliação do Mentorando</p>
                                  </div>

                                      <form id="avaliacaoForm">

                                            <div class="campo">
                                                    <label>Nome do aluno</label>
                                                            <input type="text" id="nome" placeholder="Digite seu nome" required>
                                                                  </div>

                                                                        <div class="campo">
                                                                                <label>Área de interesse</label>
                                                                                        <select id="area" required>
                                                                                                  <option value="">Selecione uma opção</option>
                                                                                                            <option>Programação</option>
                                                                                                                      <option>Design</option>
                                                                                                                                <option>Hardware</option>
                                                                                                                                          <option>Redes</option>
                                                                                                                                                    <option>Banco de Dados</option>
                                                                                                                                                              <option>Outra</option>
                                                                                                                                                                      </select>
                                                                                                                                                                            </div>

                                                                                                                                                                                  <div class="campo">
                                                                                                                                                                                          <label>Como você avalia seu conhecimento técnico atual?</label>

                                                                                                                                                                                                  <div class="opcoes">
                                                                                                                                                                                                            <label><input type="radio" name="conhecimento" value="Iniciante"> Iniciante</label>
                                                                                                                                                                                                                      <label><input type="radio" name="conhecimento" value="Básico"> Básico</label>
                                                                                                                                                                                                                                <label><input type="radio" name="conhecimento" value="Intermediário"> Intermediário</label>
                                                                                                                                                                                                                                          <label><input type="radio" name="conhecimento" value="Avançado"> Avançado</label>
                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                              <div class="campo">
                                                                                                                                                                                                                                                                      <label>Quais tecnologias você já conhece?</label>

                                                                                                                                                                                                                                                                              <div class="checkbox">
                                                                                                                                                                                                                                                                                        <label><input type="checkbox" value="HTML"> HTML</label>
                                                                                                                                                                                                                                                                                                  <label><input type="checkbox" value="CSS"> CSS</label>
                                                                                                                                                                                                                                                                                                            <label><input type="checkbox" value="JavaScript"> JavaScript</label>
                                                                                                                                                                                                                                                                                                                      <label><input type="checkbox" value="Python"> Python</label>
                                                                                                                                                                                                                                                                                                                                <label><input type="checkbox" value="Banco de Dados"> Banco de Dados</label>
                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                    <div class="campo">
                                                                                                                                                                                                                                                                                                                                                            <label>Qual sua maior dificuldade atualmente?</label>
                                                                                                                                                                                                                                                                                                                                                                    <textarea id="dificuldade" placeholder="Descreva suas dificuldades..."></textarea>
                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                <div class="campo">
                                                                                                                                                                                                                                                                                                                                                                                        <label>Qual é seu objetivo com a mentoria?</label>
                                                                                                                                                                                                                                                                                                                                                                                                <textarea id="objetivo" placeholder="Digite seu objetivo..."></textarea>
                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                            <div class="campo">
                                                                                                                                                                                                                                                                                                                                                                                                                    <label>Avalie sua motivação para aprender</label>

                                                                                                                                                                                                                                                                                                                                                                                                                            <select id="motivacao">
                                                                                                                                                                                                                                                                                                                                                                                                                                      <option value="1">⭐ 1 - Muito baixa</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="2">⭐⭐ 2 - Baixa</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                          <option value="3">⭐⭐⭐ 3 - Média</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="4">⭐⭐⭐⭐ 4 - Alta</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <option value="5">⭐⭐⭐⭐⭐ 5 - Muito alta</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <button type="submit">Enviar Avaliação 🚀</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div id="mensagem"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </html>
