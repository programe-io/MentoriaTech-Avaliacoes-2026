<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ALTERE: texto que aparece na aba do navegador -->
    <title>Mini Feed</title>
    <!-- Esta linha conecta o HTML ao arquivo de estilos -->
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- CABEÇALHO: título e menu de navegação -->
    <header>
        <div class="header-content">
            <!-- ALTERE: nome da sua rede social -->
            <h1>Insta da Bluey</h1>
            <nav>
                <a href="#">Inicio</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>

        <!-- NOVA PUBLICAÇÃO: área do usuário logado -->
        <section class="new-post">
            <div class="user">
                <!-- ALTERE: a letra do avatar e o seu nome -->
                <div class="avatar">B</div>
                <div>
                    <strong>Bluey</strong>
                    <span>Mostrando nossa família!</span>
                </div>
            </div>
            <button>Publicar</button>
        </section>

        <!-- POSTAGEM: cada <article> é uma publicação do feed -->
        <article class="post">
            <div class="post-header">
                <div class="avatar">B</div>
                <div>
                    <strong>Bluey</strong>
                    <span>Há 10 minutos</span>
                </div>
            </div>

            <!-- ALTERE: o texto da postagem -->
            <p class="post-text"></Canvas>Curtindo um dia de praia.</p>

            <!--
                ALTERE: para usar a sua imagem,
                1. coloque o arquivo na pasta "imagens"
                2. troque o src pelo nome do arquivo
                3. descreva a imagem no alt
            -->
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLIHIFy6U4hlbKfbO5--2Wb_b9OEGbrsZXsHPwP-qj8a79v6gpqYnXuL1a&s=10" alt="Ilustração de exemplo com montanhas e um sol">

            <div class="post-actions">
                <button>👍like</button>
                <button>🗨️Comentar</button>
            </div>
        </article>

        <!-- Para criar outra postagem, copie um <article> inteiro e cole aqui -->
        <article class="post">
            <div class="post-header">
                <div class="avatar">B</div>
                <div>
                    <strong>Bluey</strong>
                    <span>Há 2 dias</span>
                </div>
            </div>

            <p class="post-text">Tarde com a família Hiller.</p>

            <img src="https://www.bluey.tv/wp-content/uploads/2025/01/Screenshot-2025-01-31-at-14.54.08-1024x678.png" alt="Ilustração de exemplo com montanhas e um sol">

            <div class="post-actions">
                <button>👍like</button>
                <button>🗨️Comentar</button>
            </div>
        </article>

    </main>

    <!-- RODAPÉ: ALTERE com o nome do seu projeto -->
    <footer>
        <p>Continuem nos acompanhando!🫶</p>
    </footer>

</body>
</html>
