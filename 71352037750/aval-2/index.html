<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerenciador de tarefas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
<main>
  <header>
    <div>
      <h1>Minhas tarefas</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="progress"><strong id="pct">0%</strong><div class="bar"><i id="bar"></i></div></div>
  </header>

  <form id="form" autocomplete="off">
    <input type="text" id="titulo" placeholder="O que precisa ser feito?" maxlength="120" required aria-label="Descrição da tarefa">
    <select id="prio" aria-label="Prioridade">
      <option value="alta">Prioridade alta</option>
      <option value="media" selected>Prioridade média</option>
      <option value="baixa">Prioridade baixa</option>
    </select>
    <input type="date" id="prazo" aria-label="Prazo">
    <button class="add" type="submit">Adicionar tarefa</button>
  </form>

  <section>
    <div class="head"><h2>A concluir<span class="count" id="c1">0</span></h2></div>
    <ul id="pendentes"></ul>
  </section>

  <section class="done">
    <div class="head"><h2>Resolvidas<span class="count" id="c2">0</span></h2><button class="link" id="limpar" type="button">Limpar resolvidas</button></div>
    <ul id="resolvidas"></ul>
  </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
