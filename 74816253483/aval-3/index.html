<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - Seu Assistente Inteligente</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Container do Chat -->
    <div class="chat-container">
        
        <!-- Cabeçalho -->
        <header class="chat-header">
            <div class="ai-info">
                <div class="ai-avatar">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div>
                    <h2>NexusAI</h2>
                    <span class="status">Online • Pronto para ajudar</span>
                </div>
            </div>
            <button id="clear-chat" title="Limpar Conversa"><i class="fa-solid fa-trash-can"></i></button>
        </header>

        <!-- Corpo das Mensagens -->
        <div class="chat-body" id="chat-body">
            <div class="message ai-message">
                <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="message-content">
                    <p>Olá! Eu sou o NexusAI, seu assistente virtual. Como posso ajudar você hoje?</p>
                </div>
            </div>
        </div>

        <!-- Área de Entrada / Digitação -->
        <footer class="chat-footer">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Digite sua pergunta aqui..." autocomplete="off">
                <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
            <p class="disclaimer">NexusAI pode gerar respostas simuladas para fins educacionais e de avaliação.</p>
        </footer>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
