<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- ============================= -->
    <!-- CABEÇALHO -->
    <!-- ============================= -->

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Controle seus produtos de forma simples</p>
    </header>


    <!-- ============================= -->
    <!-- CONTEÚDO PRINCIPAL -->
    <!-- ============================= -->

    <main>

        <!-- ============================= -->
        <!-- CADASTRO DE PRODUTO -->
        <!-- ============================= -->

        <section class="card">

            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <!-- Código -->
                <div class="campo">
                    <label for="codigo">Código</label>

                    <input
                        type="text"
                        id="codigo"
                        placeholder="Ex: 001"
                        required
                    >
                </div>


                <!-- Descrição -->
                <div class="campo">
                    <label for="descricao">Descrição</label>

                    <input
                        type="text"
                        id="descricao"
                        placeholder="Nome do produto"
                        required
                    >
                </div>


                <!-- Quantidade e valor -->
                <div class="linha">

                    <!-- Quantidade -->
                    <div class="campo">

                        <label for="quantidade">
                            Quantidade
                        </label>

                        <input
                            type="number"
                            id="quantidade"
                            placeholder="0"
                            min="0"
                            required
                        >

                    </div>


                    <!-- Valor -->
                    <div class="campo">

                        <label for="valor">
                            Valor
                        </label>

                        <input
                            type="number"
                            id="valor"
                            placeholder="0.00"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>

                </div>


                <!-- Botão cadastrar -->
                <button type="submit">
                    Cadastrar Produto
                </button>

            </form>

        </section>


        <!-- ============================= -->
        <!-- LISTA DE PRODUTOS -->
        <!-- ============================= -->

        <section class="card">

            <div class="titulo-lista">

                <div>

                    <h2>Produtos Cadastrados</h2>

                    <p>
                        Veja todos os produtos do estoque
                    </p>

                </div>


                <!-- Contador -->
                <span class="contador">
                    0 produtos
                </span>

            </div>


            <!-- Tabela -->
            <div class="tabela-container">

                <table>

                    <thead>

                        <tr>

                            <th>Código</th>

                            <th>Descrição</th>

                            <th>Quantidade</th>

                            <th>Valor</th>

                            <th>Ações</th>

                        </tr>

                    </thead>


                    <!--
                        O JavaScript vai colocar
                        os produtos aqui.
                    -->

                    <tbody id="listaProdutos">

                        <tr>

                            <td
                                colspan="5"
                                class="vazio"
                            >
                                Nenhum produto cadastrado.
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- ============================= -->
    <!-- RODAPÉ -->
    <!-- ============================= -->

    <footer>

        <p>
            Sistema de Estoque © 2026
        </p>

    </footer>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <!--
        IMPORTANTE:
        O script fica no final do body.
    -->

    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
