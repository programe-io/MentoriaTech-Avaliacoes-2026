<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exemplo com nav, img e aside</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Menu de navegação -->
    <nav>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </nav>

    <!-- Conteúdo principal -->
    <main>
        <h1>Bem-vindo</h1>
        
        <!-- Imagem -->
        <img src="https://via.placeholder.com/300" alt="Imagem exemplo">

        <p>Este é um exemplo simples usando HTML semântico.</p>
    </main>

    <!-- Conteúdo lateral -->
    <aside>
        <h3>Dicas</h3>
        <p>Você pode usar o aside para informações extras, links ou anúncios.</p>
    </aside>

<script src="script.js"></script></body>
</html>
