<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mini Feed</title>
                <link rel="stylesheet" href="estilo.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <!-- Cabeçalho -->
                        <header class="cabecalho">
                                <h1>📱 Meu Feed</h1>
                                    </header>

                                        <!-- Menu de Navegação -->
                                            <nav class="menu">
                                                    <a href="#">Início</a>
                                                            <a href="#">Explorar</a>
                                                                    <a href="#">Perfil</a>
                                                                        </nav>

                                                                            <main class="container">
                                                                                    <!-- Área para Nova Publicação -->
                                                                                            <section class="nova-publicacao">
                                                                                                        <textarea placeholder="O que você está pensando?"></textarea>
                                                                                                                    <button class="btn-publicar">Publicar</button>
                                                                                                                            </section>

                                                                                                                                    <!-- Postagem 1 -->
                                                                                                                                            <article class="postagem">
                                                                                                                                                        <div class="cabecalho-post">
                                                                                                                                                                        <strong>Maria Silva</strong>
                                                                                                                                                                                        <span class="data">26/11/2026</span>
                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                <p>Hoje é um ótimo dia para ser feliz! ✨ Aproveite cada momento.</p>
                                                                                                                                                                                                                            <img src="https://picsum.photos/id/1015/600/300" alt="Paisagem bonita">
                                                                                                                                                                                                                                        <div class="botoes-acao">
                                                                                                                                                                                                                                                        <button>❤️ Curtir</button>
                                                                                                                                                                                                                                                                        <button>💬 Comentar</button>
                                                                                                                                                                                                                                                                                        <button>↗️ Compartilhar</button>
                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                            </article>

                                                                                                                                                                                                                                                                                                                    <!-- Postagem 2 -->
                                                                                                                                                                                                                                                                                                                            <article class="postagem">
                                                                                                                                                                                                                                                                                                                                        <div class="cabecalho-post">
                                                                                                                                                                                                                                                                                                                                                        <strong>Jaciara </strong>
                                                                                                                                                                                                                                                                                                                                                                        <span class="data">25/11/2026</span>
                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                <p>Estude muito e nunca desista dos seus sonhos! 📚💪</p>
                                                                                                                                                                                                                                                                                                                                                                                                            <img src="https://picsum.photos/id/24/600/300" alt="Livro e leitura">
                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="botoes-acao">
                                                                                                                                                                                                                                                                                                                                                                                                                                        <button>❤️ Curtir</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button>💬 Comentar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button>↗️ Compartilhar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </article>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Rodapé -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <footer class="rodape">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>&copy; 2026 Mini Feed — Maria jaciara .</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
