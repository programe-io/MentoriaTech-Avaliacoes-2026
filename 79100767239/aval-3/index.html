<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Instagram Clone</title>
                <!-- Tailwind CSS via CDN -->
                    <script src="https://cdn.tailwindcss.com"></script>
                        <!-- Ícones Font Awesome -->
                            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
                                <link rel="stylesheet" href="estilo.css">
                                <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
                                <body class="bg-gray-50 text-gray-900">

                                    <!-- Cabeçalho Fixo -->
                                        <header class="sticky top-0 bg-white border-b border-gray-200 z-50">
                                                <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
                                                            <!-- Logo -->
                                                                        <h1 class="text-2xl font-semibold">Instagram</h1>
                                                                                    
                                                                                                <!-- Barra de Pesquisa (oculta em telas pequenas) -->
                                                                                                            <div class="hidden md:flex items-center bg-gray-100 rounded-md px-4 py-2">
                                                                                                                            <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i>
                                                                                                                                            <input type="text" placeholder="Pesquisar" class="bg-transparent outline-none text-sm w-48">
                                                                                                                                                        </div>

                                                                                                                                                                    <!-- Ícones do Cabeçalho -->
                                                                                                                                                                                <div class="flex items-center gap-5 text-2xl">
                                                                                                                                                                                                <i class="fa-solid fa-house cursor-pointer hover:text-gray-600"></i>
                                                                                                                                                                                                                <i class="fa-regular fa-paper-plane cursor-pointer hover:text-gray-600"></i>
                                                                                                                                                                                                                                <i class="fa-regular fa-square-plus cursor-pointer hover:text-gray-600"></i>
                                                                                                                                                                                                                                                <i class="fa-heart fa-regular cursor-pointer hover:text-gray-600"></i>
                                                                                                                                                                                                                                                                <img src="https://picsum.photos/id/64/40/40" alt="Perfil" class="w-8 h-8 rounded-full cursor-pointer border-2 border-transparent hover:border-gray-300">
                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                        </header>

                                                                                                                                                                                                                                                                                            <main class="max-w-5xl mx-auto px-4 py-4">
                                                                                                                                                                                                                                                                                                    <!-- Área de Stories -->
                                                                                                                                                                                                                                                                                                            <section class="bg-white border border-gray-200 rounded-lg p-4 mb-6 overflow-x-auto">
                                                                                                                                                                                                                                                                                                                        <div class="flex gap-5" id="stories">
                                                                                                                                                                                                                                                                                                                                        <!-- Meu Story -->
                                                                                                                                                                                                                                                                                                                                                        <div class="flex flex-col items-center gap-1 flex-shrink-0">
                                                                                                                                                                                                                                                                                                                                                                            <div class="relative">
                                                                                                                                                                                                                                                                                                                                                                                                    <img src="https://picsum.photos/id/64/80/80" alt="Seu Perfil" class="w-16 h-16 rounded-full object-cover border-2 border-gray-200">
                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="absolute bottom-0 right-0 bg-blue-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs border-2 border-white">
                                                                                                                                                                                                                                                                                                                                                                                                                                                        +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span class="text-xs">Seu story</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- Os demais stories são inseridos pelo JavaScript -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Feed de Postagens -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <section class="space-y-6" id="feed">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- As postagens serão inseridas pelo JavaScript -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- Navegação Inferior (apenas em mobile) -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-3 md:hidden z-50">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="flex justify-around items-center text-2xl">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <i class="fa-solid fa-house"></i>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <i class="fa-solid fa-magnifying-glass"></i>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <i class="fa-regular fa-square-plus"></i>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <i class="fa-regular fa-heart"></i>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <img src="https://picsum.photos/id/64/32/32" alt="Perfil" class="w-7 h-7 rounded-full">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </nav>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
