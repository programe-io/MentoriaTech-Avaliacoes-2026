<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja Web com Imagens</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        nav {
            background: #2c3e50;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Banner de Destaque */
        .banner-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .flex-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .coluna {
            flex: 1;
            min-width: 300px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* Estilização das Imagens dos Produtos */
        .product-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            margin-right: 15px;
            object-fit: cover;
            vertical-align: middle;
        }

        h2 {
            color: #2980b9;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        ul, ol { list-style: none; }

        li {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f9f9f9;
        }

        .check { color: #27ae60; font-weight: bold; margin-right: 10px; }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav>
        <a href="#">Início</a>
        <a href="#">Coleção</a>
        <a href="#">Sobre</a>
    </nav>

    <main>
        <header>
            <h1>Olá, clientes</h1>
            <p>Confira as tendências da semana</p>
        </header>

        <img src="http://googleusercontent.com/image_collection/image_retrieval/3787461809901234937_0" alt="Banner de Moda" class="banner-img">

        <div class="flex-container">
            
            <div class="coluna">
                <h2>📦 Disponíveis</h2>
                <ol>
                    <li>
                        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=100" alt="Camisa" class="product-img">
                        Camisa Slim
                    </li>
                    <li>
                        <img src="https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=100" alt="Bermuda" class="product-img">
                        Bermuda Sarja
                    </li>
                    <li>
                        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=100" alt="Tênis" class="product-img">
                        Tênis Esportivo
                    </li>
                </ol>
            </div>

            <div class="coluna">
                <h2>🛒 Escolhidos</h2>
                <ul>
                    <li><span class="check">✓</span> Camisa Slim</li>
                    <li><span class="check">✓</span> Bermuda Sarja</li>
                    <li><span class="check">✓</span> Tênis Esportivo</li>
                </ul>
            </div>

        </div>
    </main>

</body>
</html>
