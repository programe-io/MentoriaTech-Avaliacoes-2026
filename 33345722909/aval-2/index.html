<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>

<link href="style.css" rel="stylesheet"></head>

<body>

    
    <header>
        <h1>MiniFeed</h1>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#explorar">Explorar</a>
            <a href="#perfil">Meu perfil</a>
        </nav>

        <form>
            <input type="search" placeholder="Pesquisar...">
            <button type="submit">Buscar</button>
        </form>
    </header>

    <main id="inicio">

        
        <section aria-labelledby="titulo-stories">
            <h2 id="titulo-stories">Stories</h2>

            <div class="stories">
                <article class="story">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTENZwPCOikZ-JlLAHR50OraucLAWgNgVS50tkHozMmKQ14BANrRKmcLbfW&s=10"
                         alt="Foto de perfil de Neymar">
                    <p>Neymar</p>
                </article>

                <article class="story">
                    <img src="https://images3.memedroid.com/images/UPLOADED178/61533e247bcac.jpeg"
                         alt="Foto de perfil de Agnaldo">
                    <p>Agnaldo</p>
                </article>

                <article class="story">
                    <img src="https://static.wikia.nocookie.net/anicrossbr/images/d/d7/Magna_profile.png/revision/latest/scale-to-width-down/331?cb=20160826211007&path-prefix=pt-br"
                         alt="Foto de perfil de Magna">
                    <p>Magna</p>
                </article>

            </div>
        </section>

        
        <section aria-labelledby="titulo-feed">
            <h2 id="titulo-feed">Publicações</h2>

            
            <article class="post">

                <header class="post-header">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTENZwPCOikZ-JlLAHR50OraucLAWgNgVS50tkHozMmKQ14BANrRKmcLbfW&s=10"
                         alt="Foto de Neymar">
                    <h3>Neymar Jr</h3>
                </header>

                <img class="post-image"
                     src="https://ogimg.infoglobo.com.br/in/25120387-87e-f29/FT1086A/60930131_AaJX-Rio-de-Janeiro-RJ-20082016OlimpiadasRio-2016Final-do-futeRASIL-MEDALHA-DO.jpg"
                     alt="Vitória da olipíadas">

                <div class="post-actions">
                    <button type="button" aria-label="Curtir publicação">
                        ♡ Curtir
                    </button>
                    <button type="button">
                        Comentar
                    </button>
                    <button type="button">
                        Compartilhar
                    </button>
                </div>

                <p><strong>99k curtidas</strong></p>

                <p>
                    <strong>Neymar Jr</strong>
                    Nostalgia
                </p>

                <p class="date">Há 2 horas</p>

                <form>
                    <label for="comentario1">Adicione um comentário:</label>
                    <input id="comentario1"
                           type="text"
                           placeholder="Escreva um comentário...">
                    <button type="submit">Publicar</button>
                </form>

            </article>

            

        </section>

    </main>

    
    <footer>
        <p>&copy; 2026 MiniFeed - Projeto de estudo</p>
    </footer>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
