
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Produtos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header class="topo">
        <div class="container">
            <h1>📦 Sistema de Produtos</h1>
            <p>Gerencie seu estoque de forma simples.</p>
        </div>
    </header>

    <main class="container">
        <section class="painel">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex.: Cadeira Gamer"
                        minlength="5"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        step="1"
                        placeholder="Ex.: 12"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input
                        type="number"
                        id="valor"
                        min="0"
                        step="0.01"
                        placeholder="Ex.: 690.00"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-principal">
                    Cadastrar produto
                </button>
            </form>

            <p id="mensagem" class="mensagem" role="status"
               aria-live="polite"></p>
        </section>

        <section class="painel">
            <div class="cabecalho-lista">
                <div>
                    <h2>Lista de produtos</h2>
                    <p>Produtos cadastrados no sistema</p>
                </div>

                <span id="totalProdutos" class="contador">
                    0 produtos
                </span>
            </div>

            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="5" class="vazio">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Sistema de Produtos &copy; 2026</p>
    </footer>
<script src="script.js"></script></body>
</html>
