
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha de Anamnese</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="logo">🩺</div>
        <h1>Ficha de Anamnese</h1>
        <p>Cadastro e avaliação do paciente</p>
    </header>

    <main>

        <form id="formAnamnese">

            <!-- DADOS PESSOAIS -->

            <section class="form-section">

                <h2>1. Dados pessoais</h2>

                <div class="grid">

                    <div class="campo">
                        <label>Nome completo *</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="campo">
                        <label>Data de nascimento *</label>
                        <input type="date" id="nascimento" required>
                    </div>

                    <div class="campo">
                        <label>CPF</label>
                        <input type="text" id="cpf"
                            placeholder="000.000.000-00">
                    </div>

                    <div class="campo">
                        <label>Telefone *</label>
                        <input type="tel" id="telefone"
                            placeholder="(00) 00000-0000" required>
                    </div>

                    <div class="campo">
                        <label>E-mail</label>
                        <input type="email" id="email">
                    </div>

                    <div class="campo">
                        <label>Sexo</label>
                        <select id="sexo">
                            <option value="">Selecione</option>
                            <option>Feminino</option>
                            <option>Masculino</option>
                            <option>Outro</option>
                            <option>Prefiro não informar</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label>Profissão</label>
                        <input type="text" id="profissao">
                    </div>

                    <div class="campo">
                        <label>Estado civil</label>
                        <select id="estadoCivil">
                            <option value="">Selecione</option>
                            <option>Solteiro(a)</option>
                            <option>Casado(a)</option>
                            <option>Divorciado(a)</option>
                            <option>Viúvo(a)</option>
                            <option>Outro</option>
                        </select>
                    </div>

                    <div class="campo completo">
                        <label>Endereço</label>
                        <input type="text" id="endereco">
                    </div>

                </div>

            </section>

            <!-- HISTÓRICO MÉDICO -->

            <section class="form-section">

                <h2>2. Histórico de saúde</h2>

                <div class="campo">
                    <label>Possui alguma doença ou condição de saúde?</label>
                    <textarea id="doencas"
                        placeholder="Descreva, se houver..."></textarea>
                </div>

                <div class="campo">
                    <label>Faz uso de medicamentos?</label>
                    <textarea id="medicamentos"
                        placeholder="Informe os medicamentos e doses, se souber..."></textarea>
                </div>

                <div class="campo">
                    <label>Possui alergias?</label>
                    <textarea id="alergias"
                        placeholder="Informe medicamentos, alimentos ou outras alergias..."></textarea>
                </div>

                <div class="campo">
                    <label>Já realizou alguma cirurgia?</label>
                    <textarea id="cirurgias"
                        placeholder="Descreva, se houver..."></textarea>
                </div>

                <div class="campo">
                    <label>Possui histórico de doenças na família?</label>
                    <textarea id="familia"
                        placeholder="Descreva o histórico familiar..."></textarea>
                </div>

            </section>

            <!-- HÁBITOS DE VIDA -->

            <section class="form-section">

                <h2>3. Hábitos de vida</h2>

                <div class="grid">

                    <div class="campo">
                        <label>Pratica atividade física?</label>
                        <select id="atividade">
                            <option value="">Selecione</option>
                            <option>Sim</option>
                            <option>Não</option>
                            <option>Às vezes</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label>Fuma?</label>
                        <select id="fuma">
                            <option value="">Selecione</option>
                            <option>Sim</option>
                            <option>Não</option>
                            <option>Ex-fumante</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label>Consome bebidas alcoólicas?</label>
                        <select id="alcool">
                            <option value="">Selecione</option>
                            <option>Sim</option>
                            <option>Não</option>
                            <option>Socialmente</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label>Como é sua alimentação?</label>
                        <select id="alimentacao">
                            <option value="">Selecione</option>
                            <option>Saudável</option>
                            <option>Regular</option>
                            <option>Irregular</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label>Quantas horas dorme por dia?</label>
                        <input type="number" id="sono"
                            min="0" max="24">
                    </div>

                </div>

            </section>

            <!-- AVALIAÇÃO -->

            <section class="form-section">

                <h2>4. Avaliação e queixa principal</h2>

                <div class="campo">
                    <label>Qual é a principal queixa do paciente?</label>
                    <textarea id="queixa"
                        placeholder="Descreva o motivo da consulta..."></textarea>
                </div>

                <div class="campo">
                    <label>Quando começaram os sintomas?</label>
                    <input type="text" id="sintomas"
                        placeholder="Informe o tempo de início...">
                </div>

                <div class="campo">
                    <label>Observações do profissional</label>
                    <textarea id="observacoes"
                        placeholder="Registre observações relevantes..."></textarea>
                </div>

            </section>

            <!-- RESPONSÁVEL -->

            <section class="form-section">

                <h2>5. Identificação do profissional</h2>

                <div class="campo">
                    <label>Nome do profissional *</label>
                    <input type="text" id="profissional" required>
                </div>

                <div class="campo">
                    <label>Registro profissional</label>
                    <input type="text" id="registro">
                </div>

            </section>

            <div class="botoes">

                <button type="submit" class="btn-salvar">
                    Salvar anamnese
                </button>

                <button type="reset" class="btn-limpar">
                    Limpar formulário
                </button>

                <button type="button" class="btn-imprimir"
                    onclick="window.print()">
                    Imprimir ficha
                </button>

            </div>

        </form>

        <section class="registros">

            <h2>Pacientes cadastrados</h2>

            <input type="text" id="pesquisa"
                placeholder="Pesquisar paciente pelo nome...">

            <div id="listaPacientes"></div>

        </section>

    </main>

    <footer>
        <p>Sistema de Ficha de Anamnese © 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
