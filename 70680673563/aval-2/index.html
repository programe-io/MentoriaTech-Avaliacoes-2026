<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gerenciador de Tarefas</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

                <body>

                    <div class="container">

                            <header>
                                        <div>
                                                        <h1>✓ Gerenciador de Tarefas</h1>
                                                                        <p>Organize suas atividades</p>
                                                                                    </div>

                                                                                                <div class="contador">
                                                                                                                <span id="totalTarefas">0</span>
                                                                                                                                tarefas
                                                                                                                                            </div>
                                                                                                                                                    </header>

                                                                                                                                                            <section class="formulario">

                                                                                                                                                                        <h2>Nova tarefa</h2>

                                                                                                                                                                                    <div class="entrada">

                                                                                                                                                                                                    <input
                                                                                                                                                                                                                        type="text"
                                                                                                                                                                                                                                            id="tarefaInput"
                                                                                                                                                                                                                                                                placeholder="Digite uma nova tarefa..."
                                                                                                                                                                                                                                                                                >

                                                                                                                                                                                                                                                                                                <select id="prioridade">
                                                                                                                                                                                                                                                                                                                    <option value="baixa">Baixa</option>
                                                                                                                                                                                                                                                                                                                                        <option value="media" selected>Média</option>
                                                                                                                                                                                                                                                                                                                                                            <option value="alta">Alta</option>
                                                                                                                                                                                                                                                                                                                                                                            </select>

                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="adicionarTarefa()">
                                                                                                                                                                                                                                                                                                                                                                                                                + Adicionar
                                                                                                                                                                                                                                                                                                                                                                                                                                </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                            <section class="estatisticas">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span>Total</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong id="total">0</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <span>Pendentes</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <strong id="pendentes">0</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span>Concluídas</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong id="concluidas">0</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <section class="filtros">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="filtrar('todas')" class="filtro ativo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Todas
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="filtrar('pendentes')" class="filtro">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Pendentes
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="filtrar('concluidas')" class="filtro">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Concluídas
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <section class="lista">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h2>Minhas tarefas</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="listaTarefas"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="mensagemVazia" class="vazio">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div>📋</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h3>Nenhuma tarefa encontrada</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>Adicione uma tarefa para começar.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
