
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok - Descubra vídeos</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topbar">
    <h1 class="logo">TikTok<span>♪</span></h1>

    <div class="pesquisa">
        <input type="text" id="pesquisa"
               placeholder="Pesquisar vídeos e usuários...">
        <button onclick="pesquisarVideos()">🔍</button>
    </div>

    <button class="upload" onclick="mostrarUpload()">
        + Publicar
    </button>
</header>

<div class="layout">

    <aside class="sidebar">
        <a href="#" onclick="mostrarTodos()">🏠 Para você</a>
        <a href="#" onclick="mostrarTodos()">👥 Seguindo</a>
        <a href="#" onclick="mostrarTodos()">🔥 Explorar</a>
        <a href="#" onclick="mostrarPerfil()">👤 Perfil</a>
        <a href="#" onclick="mostrarFavoritos()">❤️ Curtidos</a>

        <hr>

        <h3>Descubra</h3>
        <p>#viral</p>
        <p>#humor</p>
        <p>#musica</p>
        <p>#tecnologia</p>
    </aside>

    <main class="feed">
        <h2 id="tituloFeed">Para você</h2>
        <div id="listaVideos"></div>
    </main>

</div>

<!-- MODAL DE COMENTÁRIOS -->

<div class="modal" id="modalComentarios">
    <div class="modal-content">
        <button class="fechar" onclick="fecharModal()">✖</button>
        <h2>Comentários</h2>

        <div id="listaComentarios"></div>

        <div class="novo-comentario">
            <input id="comentarioInput"
                   placeholder="Adicionar comentário...">
            <button onclick="enviarComentario()">Enviar</button>
        </div>
    </div>
</div>

<footer>
    <p>Projeto demonstrativo inspirado no TikTok.</p>
    <p>© 2026 - Rede social de vídeos</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
