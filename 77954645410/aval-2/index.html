<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hexa Puzzle Masters: Evolution</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <div class="game-wrapper">
        <div class="game-header">
            <div class="brand">
                <h1>HEXA<span class="neon-glow">EVO</span></h1>
            </div>
            <div class="scoreboard">
                <div class="score-card best">
                    <i class="fas fa-crown"></i>
                    <div class="data">
                        <small>RECORDE</small>
                        <span id="high-score">0</span>
                    </div>
                </div>
                <div class="score-card current">
                    <i class="fas fa-bolt"></i>
                    <div class="data">
                        <small>SCORE</small>
                        <span id="score">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="board-container">
            <div id="board"></div>
        </div>

        <div class="dock-container">
            <div id="pieces-container"></div>
        </div>

        <div class="game-footer">
            <button id="reset-btn" class="action-btn"><i class="fas fa-redo-alt"></i> RECOMEÇAR</button>
        </div>
    </div>

    <div id="game-overlay" class="overlay hidden">
        <div class="modal-card">
            <div class="modal-icon"><i class="fas fa-gamepad"></i></div>
            <h2 id="overlay-title">Fim da Linha!</h2>
            <p>Sua pontuação final nesta partida:</p>
            <div class="score-badge">
                <span id="final-score">0</span> <small>pts</small>
            </div>
            <button id="overlay-btn" class="pulse-btn">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
