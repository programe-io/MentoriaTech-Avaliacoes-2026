<body>
    <div id="game-container">
        <div id="score-board">Pontos: <span id="score">0</span></div>
        
        <div id="game-over-screen" class="hidden">
            <h2>Game Over</h2>
            <button onclick="restartGame()">Jogar Novamente</button>
        </div>
        
        <div id="scene">
            <div id="helix-tower"></div>
            <div id="ball"></div>
        </div>

        <div id="controls">
            <button id="btn-left" class="control-btn">◀ Girar</button>
            <button id="btn-right" class="control-btn">Girar ▶</button>
        </div>
    </div>

    <script src="script.js"></script>
