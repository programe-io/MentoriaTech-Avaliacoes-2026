
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Controle de IMC</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <div class="container">

                            <header>
                                        <h1>⚕️ Controle de IMC</h1>
                                                    <p>Sistema de avaliação do Índice de Massa Corporal</p>
                                                            </header>

                                                                    <section class="formulario">
                                                                                <h2>Dados do Paciente</h2>

                                                                                            <label for="nome">Nome do paciente:</label>
                                                                                                        <input type="text" id="nome" placeholder="Digite seu nome">

                                                                                                                    <label for="peso">Peso (kg):</label>
                                                                                                                                <input type="number" id="peso" placeholder="Ex: 70" step="0.1">

                                                                                                                                            <label for="altura">Altura (metros):</label>
                                                                                                                                                        <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01">

                                                                                                                                                                    <button onclick="calcularIMC()">Calcular IMC</button>

                                                                                                                                                                                <button class="limpar" onclick="limparCampos()">Limpar</button>
                                                                                                                                                                                        </section>

                                                                                                                                                                                                <section class="resultado" id="resultado">
                                                                                                                                                                                                            <h2>Resultado do IMC</h2>
                                                                                                                                                                                                                        <p>Preencha os dados para calcular seu IMC.</p>
                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                        <script src="script.js"></script>

                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                        </html>
