<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>AURA - Moda & Estilo</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <nav class="navbar">
    <div class="logo">AURA</div>
    <div class="cart-btn" onclick="toggleCart()">🛒 Carrinho (<span id="cart-count">0</span>)</div>
  </nav>

  <main class="grid-products">
    <div class="product-card">
      <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300" alt="Camiseta Minimalista">
      <h3>Camiseta ONOff Basic</h3>
      <p class="price">R$ 129,90</p>
      <button onclick="addToCart('Camiseta ONOff Basic', 129.90)">Adicionar ao Carrinho</button>
    </div>
  </main>

  <aside id="cart-sidebar" class="cart-sidebar">
    <h2>Seu Carrinho</h2>
    <ul id="cart-items"></ul>
    <p class="total">Total: R$ <span id="cart-total">0.00</span></p>
  </aside>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
