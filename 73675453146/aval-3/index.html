<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Burger Express</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h2>🍔 Burger Express</h2>
  </header>

  <div class="menu-container">
    <div class="menu-item">
      <div class="info">
        <h4>Smash Double Bacon</h4>
        <p>Dois hambúrgueres 90g, queijo cheddar e bacon crocante.</p>
        <span class="price">R$ 32,00</span>
      </div>
      <button onclick="addItem('Smash Double Bacon', 32.00)">+</button>
    </div>
  </div>

  <div class="checkout-bar">
    <span>Itens: <strong id="item-count">0</strong></span>
    <button onclick="finishOrder()">Finalizar Pedido (R$ <span id="total-val">0.00</span>)</button>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
