<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gray-100 text-slate-900">

    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex items-center justify-between h-14 md:h-16">

                <h1 class="text-xl font-semibold">Instagram</h1>

                <button class="md-hidden">
                    <i class="bx bx-menu"></i>
                </button>
                
                <div class="hidden md:flex items-center">
                    <div relative>
                        <input type="text" class="w-64 h-9
                        bg-gray-100 pr-4 pl-4 rounded-lg text-sm">
                    </div>
                </div>

                <div class="hidden md:flex items-center gap-5">

                     <button class="flex items-center">
                  <i class="bx bx-home text-2xl"></i>
                </button>

                <button class="flex items-center">
                  <i class="bx bx-search text-2xl"></i>
                </button>

                <button class="flex items-center">
                  <i class="bx bx-plus text-2xl"></i>
                </button>

                <button class="flex items-center">
                  <i class="bx bx-heart text-2xl"></i>
                </button>

                <button class="w-7 h-7 rounded-full bg-gradient-to-br 
                                from-pink-500 via-red-500 to-yellow-500 ">
                 
                </button>
                    

                </div>

            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-4 pb-20 md:px-8 md:py-8">
        <div class="flex gap-8">

            <div class="flex-1 max-w-lg mx-auto md:mx-0">


                <section class="bg-white border border-gray-200
                rounded-lg p-4 mb-4">

                    <div class="flex gap-4 overflow-x-auto">

                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gray-100 
                            md:w-20 md:h-20">
                                <div class="w-full h-full rounded-full p-0.5 bg-gradient-to-br 
                                from-pink-500 via-red-500 to-yellow-500">
                                    <div class="w-full h-full rounded-full bg-gray-100 
                                flex items-center justify-center">

                                        <img class="w-full h-full object-cover rounded-full"
                                            src="https://i.pinimg.com/originals/94/dd/75/94dd75cfbdb0abbb70e782a774d371cd.jpg">
                                    </div>
                                </div>
                            </div>

                            <span class="text-xs mt-1 w-16 text-center md:20">_mateussilva_l</span>

                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gray-100
                            md:w-20 md:h-20">
                                <div class="w-full h-full rounded-full p-0.5 bg-gradient-to-br 
                                from-pink-500 via-red-500 to-yellow-500">
                                    <div class="w-full h-full rounded-full bg-gray-100 
                                flex items-center justify-center">

                                        <img class="w-full h-full object-cover rounded-full"
                                            src="https://i.pinimg.com/originals/05/6f/c3/056fc387b46cbaa178483bc2e0772acd.jpg">
                                    </div>
                                </div>
                            </div>
                            <span class="text-xs mt-1 w-16 text-center md:w-20">Paulo.vitor.314</span>
                        </div>

                    </div>

                </section>

                <article class="bg-white border border-gray-200 rounded-lg mb-4">

                    <header class="flex items-center justify-between p-3">

                        <div class="flex items-center gap-3">

                            <div class="w-13 h-13 rounded-full p-0.5 bg-gray-100">
                                <div class="w-full h-full rounded-full p-0.5 bg-gradient-to-br 
                                from-pink-500 via-red-500 to-yellow-500">
                                    <div class="w-full h-full rounded-full bg-gray-100 
                                flex items-center justify-center">

                                        <img class="w-full h-full object-cover rounded-full"
                                            src="https://i.pinimg.com/originals/05/6f/c3/056fc387b46cbaa178483bc2e0772acd.jpg">
                                    </div>
                                </div>
                            </div>

                            <div>
                                <p class="text-sm font-semibold">paulo.vitor.314</p>
                                <p class="text-xs text-gray-500">Parnaiba, pi</p>
                            </div>

                        </div>

                        <button>
                            <i class="bx bx-dots-horizontal-rounded"> </i>
                        </button>

                    </header>

                    <div class="bg-gray-100 relative">

                        <img class="w-full h-full object-cover"
                        src="https://static.jojowiki.com/images/thumb/2/21/latest/20191015213038/KQ_Bites_the_Dust.gif/265px-KQ_Bites_the_Dust.gif"
                         alt="imagem do meu projeto">

                    </div>

                    <div class="p-3">

                        <div class="flex items-center justify-between mb-3">


                            <div class=" flex items-center gap-4">

                                <button>
                                    <i  class="bx bx-heart text-2xl"></i>
                                </button>

                                <button>
                                    <i  class="bx bx-message-circle-reply text-2xl"></i>
                                </button>

                                <button>
                                    <i  class="bx bx-send text-2xl"></i>
                                </button>

                            </div>

                            <button>
                                <i class="bx bx-bookmark text-2xl"></i>
                            </button>

                        </div>

                        <p class="font-semibold text-sm mb-2">
                        4k curtidas
                    </p>

                    <p class="tect-sm">

                        <span class="font-semibold">Bizarre</span>
                        <span class="text-slate-900/90">
                            Aceita uma moeda?
                            💣💥
                            #JBA

                        </span>

                    </p>

                    <button class="tect-sm text-gray-500 mt-1">
                        Ver todos os 410 comentarios
                    </button>

                    <p class="text-xs text-gray-500 mt-2 uppercase">
                        Ha 4 horas
                    </p>

                    </div>

                </article>


            </div>

            <nav class="fixed bottom-0 left-0 right-0 bg-white
            border-t border-gray-200 z-50">

            <div class="flex items-center justify-around px-4">

                <button class="p-2">
                  <i class="bx bx-home text-2xl"></i>
                </button>

                <button class="p-2">
                  <i class="bx bx-search text-2xl"></i>
                </button>

                <button class="p-2">
                  <i class="bx bx-plus text-2xl"></i>
                </button>

                <button class="p-2">
                  <i class="bx bx-heart text-2xl"></i>
                </button>

                <button class="p-2">
                  <i class="bx bx-user text-2xl"></i>
                </button>

            </div>
            

            </nav>

        </div>


    </main>

</body>

</html>
