
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram | @jadson</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 65px;
    border-bottom: 1px solid #262626;
    display: flex;
    align-items: center;
    justify-content: space-around;
    position: sticky;
    top: 0;
    background: #000;
    z-index: 10;
}

.logo {
    font-family: cursive;
    font-size: 27px;
    font-weight: bold;
}

.search {
    background: #262626;
    border: none;
    border-radius: 8px;
    padding: 12px;
    color: white;
    width: 250px;
}

.icons {
    display: flex;
    gap: 22px;
    font-size: 23px;
    cursor: pointer;
}

.container {
    max-width: 950px;
    margin: 45px auto;
    padding: 0 20px;
}

.profile {
    display: flex;
    align-items: center;
    gap: 90px;
    margin-bottom: 45px;
}

.avatar {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 3px solid #ff3b91;
    padding: 4px;
    object-fit: cover;
}

.info {
    flex: 1;
}

.username {
    font-size: 25px;
    font-weight: 400;
    margin-bottom: 20px;
}

.buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}

button {
    border: none;
    padding: 9px 22px;
    border-radius: 7px;
    background: #363636;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #505050;
}

.follow {
    background: #0095f6;
}

.follow:hover {
    background: #1877d2;
}

.stats {
    display: flex;
    gap: 35px;
    margin-bottom: 20px;
}

.bio {
    line-height: 1.6;
    font-size: 14px;
}

.stories {
    display: flex;
    gap: 35px;
    margin: 40px 0;
}

.story {
    text-align: center;
    cursor: pointer;
}

.story img {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    padding: 3px;
    border: 2px solid #a855f7;
    object-fit: cover;
}

.story p {
    font-size: 12px;
    margin-top: 8px;
}

.tabs {
    border-top: 1px solid #333;
    display: flex;
    justify-content: center;
    gap: 65px;
    padding: 18px;
    color: #aaa;
}

.tabs span {
    cursor: pointer;
    letter-spacing: 1px;
}

.tabs .active {
    color: white;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
}

.post {
    aspect-ratio: 1;
    position: relative;
    cursor: pointer;
    overflow: hidden;
}

.post img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: .3s;
}

.post:hover img {
    transform: scale(1.06);
    opacity: .7;
}

.like-count {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 25px;
    opacity: 0;
    transition: .3s;
}

.post:hover .like-count {
    opacity: 1;
}

footer {
    text-align: center;
    color: #777;
    padding: 35px;
    font-size: 12px;
}

@media(max-width: 650px) {
    header {
        justify-content: space-between;
        padding: 0 15px;
    }

    .search {
        display: none;
    }

    .container {
        margin-top: 25px;
        padding: 0 5px;
    }

    .profile {
        gap: 20px;
    }

    .avatar {
        width: 90px;
        height: 90px;
    }

    .username {
        font-size: 19px;
    }

    .stats {
        gap: 12px;
        font-size: 12px;
    }

    .bio {
        font-size: 12px;
    }

    .stories {
        gap: 18px;
        overflow-x: auto;
    }

    .story img {
        width: 65px;
        height: 65px;
    }

    .tabs {
        gap: 40px;
    }

    .gallery {
        gap: 2px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <div class="logo">Instagram</div>
    <input class="search" placeholder="Pesquisar">
    <div class="icons">
        <span>⌂</span>
        <span>♡</span>
        <span>✉</span>
        <span>＋</span>
    </div>
</header>

<div class="container">

    <section class="profile">

        <img class="avatar"
        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300"
        alt="Foto de perfil">

        <div class="info">

            <div class="username">jadson ✨</div>

            <div class="buttons">
                <button class="follow" id="followBtn"
                onclick="followUser()">Seguir</button>
                <button onclick="alert('Mensagem enviada!')">
                    Mensagem
                </button>
            </div>

            <div class="stats">
                <span><b>24</b> publicações</span>
                <span><b id="followers">1.2 mil</b> seguidores</span>
                <span><b>850</b> seguindo</span>
            </div>

            <div class="bio">
                <b>Jadson</b><br>
                📍 Brasil 🇧🇷<br>
                ✨ Vivendo e criando momentos.<br>
                🚀 Seja bem-vindo ao meu perfil!
            </div>

        </div>
    </section>

    <section class="stories">

        <div class="story" onclick="openStory('Destaques')">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=200">
            <p>Destaques</p>
        </div>

        <div class="story" onclick="openStory('Viagens')">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=200">
            <p>Viagens</p>
        </div>

        <div class="story" onclick="openStory('Amigos')">
            <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=200">
            <p>Amigos</p>
        </div>

        <div class="story" onclick="openStory('Momentos')">
            <img src="https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=200">
            <p>Momentos</p>
        </div>

    </section>

    <nav class="tabs">
        <span class="active">▦</span>
        <span>▤</span>
        <span>♙</span>
    </nav>

    <section class="gallery" id="gallery">

        <div class="post" ondblclick="like(this)">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=600">
            <div class="like-count">❤️</div>
        </div>

        <div class="post" ondblclick="like(this)">
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600">
            <div class="like-count">❤️</div>
        </div>

        <div class="post" ondblclick="like(this)">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600">
            <div class="like-count">❤️</div>
        </div>

        <div class="post" ondblclick="like(this)">
            <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=600">
            <div class="like-count">❤️</div>
        </div>

        <div class="post" ondblclick="like(this)">
            <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=600">
            <div class="like-count">❤️</div>
        </div>

        <div class="post" ondblclick="like(this)">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600">
            <div class="like-count">❤️</div>
        </div>

    </section>

</div>

<footer>
    Instagram 2026 © | Perfil de demonstração @jadson
</footer>

<script>

let followers = 1200;
let following = false;

function followUser() {
    const btn = document.getElementById("followBtn");
    const count = document.getElementById("followers");

    following = !following;

    if (following) {
        followers++;
        btn.innerText = "Seguindo";
        btn.style.background = "#363636";
    } else {
        followers--;
        btn.innerText = "Seguir";
        btn.style.background = "#0095f6";
    }

    count.innerText = followers.toLocaleString("pt-BR");
}

function like(post) {
    const heart = post.querySelector(".like-count");
    heart.style.opacity = "1";

    setTimeout(() => {
        heart.style.opacity = "0";
    }, 900);
}

function openStory(name) {
    alert("Você abriu os stories: " + name);
}

</script>

<script src="script.js"></script></body>
</html>
