<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo 🎯</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="quiz-container">
        <header>
            <h1>🎯 Quiz Interativo</h1>
            <div class="info-cabecalho">
                <span id="contador-perguntas">1 / 5</span>
                <div class="caixa-pontos">
                    <strong>Pontos:</strong>
                    <span id="pontos">0</span>
                </div>
            </div>
        </header>

        <div class="barra-progresso">
            <div id="progresso"></div>
        </div>

        <main>
            <h2 id="pergunta">Pergunta carregando...</h2>
            
            <div id="opcoes" class="grid-opcoes">
                <!-- Respostas geradas pelo JS -->
            </div>

            <button id="btn-acao" class="escondido">Próxima ➡️</button>
        </main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
