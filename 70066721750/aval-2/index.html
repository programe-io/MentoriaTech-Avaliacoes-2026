
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1, h2 {
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Sistema de Estoque</h1>

    <h2>Cadastrar Produto</h2>

    <input type="number" id="codigo" placeholder="Código do produto">
    <input type="text" id="descricao" placeholder="Descrição do produto">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor do produto" step="0.01">

    <button onclick="cadastrarProduto()">Cadastrar Produto</button>

    <h2>Produtos Cadastrados</h2>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
            </tr>
        </thead>

        <tbody id="listaProdutos">
        </tbody>
    </table>

    <h2>Alterar Valor</h2>

    <input type="number" id="codigoValor" placeholder="Código do produto">
    <input type="number" id="novoValor" placeholder="Novo valor" step="0.01">

    <button onclick="alterarValor()">Alterar Valor</button>

    <h2>Alterar Quantidade</h2>

    <input type="number" id="codigoQuantidade" placeholder="Código do produto">
    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

</div>

<script>

    // Vetor para armazenar os produtos
    let produtos = [];

    // Função para cadastrar produto
    function cadastrarProduto() {

        let codigo = Number(document.getElementById("codigo").value);
        let descricao = document.getElementById("descricao").value;
        let quantidade = Number(document.getElementById("quantidade").value);
        let valor = Number(document.getElementById("valor").value);

        if (!codigo || !descricao.trim() ||
            document.getElementById("quantidade").value === "" ||
            document.getElementById("valor").value === "" ||
            quantidade < 0 || valor < 0) {
            alert("Preencha todos os campos corretamente!");
            return;
        }

        // Verifica se o código já existe
        let existe = produtos.find(p => p.codigo === codigo);

        if (existe) {
            alert("Este código já está cadastrado!");
            return;
        }

        let produto = {
            codigo: codigo,
            descricao: descricao,
            quantidade: quantidade,
            valor: valor
        };

        produtos.push(produto);

        alert("Produto cadastrado com sucesso!");

        listarProdutos();

        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";
    }

    // Função para listar produtos
    function listarProdutos() {

        let tabela = document.getElementById("listaProdutos");

        tabela.innerHTML = "";

        produtos.forEach(produto => {

            let linha = tabela.insertRow();

            linha.insertCell(0).textContent = produto.codigo;
            linha.insertCell(1).textContent = produto.descricao;
            linha.insertCell(2).textContent = produto.quantidade;
            linha.insertCell(3).textContent =
                produto.valor.toLocaleString("pt-BR", {
                    style: "currency",
                    currency: "BRL"
                });

        });
    }

    // Função para alterar valor
    function alterarValor() {

        let codigo = Number(document.getElementById("codigoValor").value);
        let novoValor = Number(document.getElementById("novoValor").value);

        if (document.getElementById("codigoValor").value === "" ||
            document.getElementById("novoValor").value === "" ||
            novoValor < 0) {
            alert("Informe o código e o novo valor corretamente!");
            return;
        }

        let produto = produtos.find(p => p.codigo === codigo);

        if (produto) {

            produto.valor = novoValor;

            alert("Valor alterado com sucesso!");

            listarProdutos();

        } else {

            alert("Produto não encontrado!");

        }
    }

    // Função para alterar quantidade
    function alterarQuantidade() {

        let codigo = Number(document.getElementById("codigoQuantidade").value);
        let novaQuantidade = Number(document.getElementById("novaQuantidade").value);

        if (document.getElementById("codigoQuantidade").value === "" ||
            document.getElementById("novaQuantidade").value === "" ||
            novaQuantidade < 0 ||
            !Number.isInteger(novaQuantidade)) {
            alert("Informe o código e uma quantidade válida!");
            return;
        }

        let produto = produtos.find(p => p.codigo === codigo);

        if (produto) {

            produto.quantidade = novaQuantidade;

            alert("Quantidade alterada com sucesso!");

            listarProdutos();

        } else {

            alert("Produto não encontrado!");

        }
    }

</script>

</body>
</html>
