```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed - Homem-Aranha</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            margin: 0;
        }

        header {
            background: #d90429;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        .feed {
            width: 90%;
            max-width: 600px;
            margin: 20px auto;
        }

        .post {
            background: white;
            border-radius: 12px;
            margin-bottom: 20px;
            padding: 15px;
            box-shadow: 0 3px 8px #aaa;
        }

        .post h2 {
            color: #d90429;
        }

        .post img {
            width: 100%;
            border-radius: 10px;
        }

        button {
            border: none;
            padding: 10px 15px;
            margin: 8px 5px 0 0;
            border-radius: 8px;
            cursor: pointer;
            background: #d90429;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background: #a60320;
        }

        .curtidas {
            font-weight: bold;
            margin-top: 10px;
        }

        input {
            width: 70%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .comentario {
            margin-top: 10px;
            background: #f1f1f1;
            padding: 8px;
            border-radius: 8px;
        }

        .nova-postagem {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <h1>🕷️ MiniFeed do Homem-Aranha 🕷️</h1>
    <p>Com grandes poderes vêm grandes responsabilidades!</p>
</header>

<div class="feed">

    <!-- Nova postagem -->
    <div class="nova-postagem">
        <h2>📢 Nova postagem</h2>

        <input 
            type="text" 
            id="textoPost" 
            placeholder="O que o Homem-Aranha está fazendo?"
        >

        <button onclick="publicar()">Publicar</button>
    </div>

    <!-- Postagem 1 -->
    <div class="post">
        <h2>🕷️ Homem-Aranha</h2>

        <p>Hoje é dia de proteger a cidade!</p>

        <img 
            src="https://images.unsplash.com/photo-1635805737707-575885ab0820?auto=format&fit=crop&w=800&q=80"
            alt="Imagem relacionada ao Homem-Aranha"
        >

        <div class="curtidas">
            ❤️ <span id="likes1">0</span> curtidas
        </div>

        <button onclick="curtir(1)">❤️ Curtir</button>

        <button onclick="compartilhar()">
            🔄 Compartilhar
        </button>

        <br>

        <input 
            type="text" 
            id="comentario1" 
            placeholder="Escreva um comentário..."
        >

        <button onclick="comentar(1)">💬 Comentar</button>

        <div id="comentarios1"></div>
    </div>

    <!-- Postagem 2 -->
    <div class="post">
        <h2>🕸️ Patrulhando Nova York</h2>

        <p>Mais uma noite cuidando da cidade.</p>

        <img 
            src="https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=800&q=80"
            alt="Cidade à noite"
        >

        <div class="curtidas">
            ❤️ <span id="likes2">0</span> curtidas
        </div>

        <button onclick="curtir(2)">❤️ Curtir</button>

        <button onclick="compartilhar()">
            🔄 Compartilhar
        </button>

        <br>

        <input 
            type="text" 
            id="comentario2" 
            placeholder="Escreva um comentário..."
        >

        <button onclick="comentar(2)">💬 Comentar</button>

        <div id="comentarios2"></div>
    </div>

    <!-- Área das novas postagens -->
    <div id="novasPostagens"></div>

</div>

<script>

    // Sistema de curtidas
    let likes = {
        1: 0,
        2: 0
    };

    function curtir(post) {
        likes[post]++;

        document.getElementById("likes" + post).textContent = likes[post];
    }

    // Sistema de comentários
    function comentar(post) {

        let campo = document.getElementById("comentario" + post);
        let texto = campo.value;

        if (texto.trim() === "") {
            alert("Digite um comentário!");
            return;
        }

        let novoComentario = document.createElement("div");

        novoComentario.className = "comentario";

        novoComentario.textContent = "🕷️ Você: " + texto;

        document
            .getElementById("comentarios" + post)
            .appendChild(novoComentario);

        campo.value = "";
    }

    // Compartilhar
    function compartilhar() {
        alert("🕷️ Postagem compartilhada com sucesso!");
    }

    // Criar nova postagem
    function publicar() {

        let texto = document.getElementById("textoPost").value;

        if (texto.trim() === "") {
            alert("Digite alguma coisa antes de publicar!");
            return;
        }

        let post = document.createElement("div");

        post.className = "post";

        post.innerHTML = `
            <h2>🕷️ Nova postagem</h2>
            <p>${texto}</p>

            <div class="curtidas">
                ❤️ 0 curtidas
            </div>

            <button onclick="alert('❤️ Curtida adicionada!')">
                ❤️ Curtir
            </button>

            <button onclick="compartilhar()">
                🔄 Compartilhar
            </button>
        `;

        document
            .getElementById("novasPostagens")
            .prepend(post);

        document.getElementById("textoPost").value = "";
    }

</script>

<script src="script.js"></script></body>
</html>
```
