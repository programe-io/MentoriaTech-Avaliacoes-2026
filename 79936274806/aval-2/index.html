<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <title>Homem-Aranha 🕷️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #080808;
        color: white;
    }

    header {
        background: linear-gradient(90deg, #b00000, #e00000, #8b0000);
        padding: 25px;
        text-align: center;
        box-shadow: 0 4px 15px black;
    }

    header h1 {
        font-size: 50px;
        text-shadow: 4px 4px 5px black;
    }

    nav {
        margin-top: 15px;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        margin: 0 15px;
    }

    nav a:hover {
        color: #ffd700;
    }

    .hero {
        min-height: 500px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;

        background:
            linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.8)),
            url("https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Spider-Man_%2846%29.jpg/800px-Spider-Man_%2846%29.jpg");

        background-size: cover;
        background-position: center;
    }

    .hero-content {
        max-width: 800px;
        padding: 30px;
    }

    .hero h2 {
        font-size: 60px;
        color: #ff1a1a;
        text-shadow: 4px 4px black;
    }

    .hero p {
        font-size: 22px;
        margin: 20px 0;
    }

    button {
        background: #e00000;
        color: white;
        border: 2px solid white;
        border-radius: 10px;
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: white;
        color: #e00000;
        transform: scale(1.05);
    }

    section {
        padding: 50px 20px;
        text-align: center;
    }

    section h2 {
        color: #ff2222;
        font-size: 35px;
        margin-bottom: 30px;
    }

    .galeria {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 25px;
        max-width: 1100px;
        margin: auto;
    }

    .foto {
        background: #151515;
        border: 3px solid #d00000;
        border-radius: 15px;
        overflow: hidden;
        transition: .3s;
    }

    .foto:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 10px 30px #e00000;
    }

    .foto img {
        width: 100%;
        height: 350px;
        object-fit: cover;
        display: block;
    }

    .foto h3 {
        padding: 15px;
        color: white;
    }

    .poderes {
        background: #101010;
    }

    .cards {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
    }

    .card {
        width: 220px;
        padding: 25px;
        background: #1c1c1c;
        border: 2px solid #e00000;
        border-radius: 15px;
    }

    .card h3 {
        color: #ff3333;
        margin-bottom: 10px;
    }

    #mensagem {
        margin-top: 20px;
        font-size: 24px;
        color: #ffd700;
        min-height: 30px;
    }

    footer {
        background: #050505;
        text-align: center;
        padding: 25px;
        color: #aaa;
    }

    @media (max-width: 600px) {
        header h1 {
            font-size: 35px;
        }

        .hero h2 {
            font-size: 40px;
        }

        .hero p {
            font-size: 18px;
        }
    }
</style>

  <script src="script.js"></script>
  
</body>
</html>
