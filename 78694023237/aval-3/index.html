
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZapWeb</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="app">

  <!-- Lateral de conversas -->
  <aside class="sidebar">

    <header class="sidebar-header">
      <h1>ZapWeb</h1>
      <button title="Nova conversa" id="newChat">＋</button>
    </header>

    <div class="search-box">
      <input type="text" id="search" placeholder="🔍 Pesquisar conversa">
    </div>

    <div class="contact-list" id="contactList"></div>

  </aside>

  <!-- Área principal do chat -->
  <main class="chat-area" id="chatArea">

    <div class="welcome" id="welcome">
      <div class="welcome-icon">💬</div>
      <h2>Bem-vindo ao ZapWeb</h2>
      <p>Escolhe uma conversa para começar a trocar mensagens.</p>
    </div>

    <section class="chat" id="chat" hidden>

      <header class="chat-header">
        <button class="back-btn" id="backBtn">←</button>
        <div class="avatar" id="chatAvatar"></div>
        <div class="header-info">
          <h3 id="chatName"></h3>
          <span id="chatStatus">online</span>
        </div>
        <button class="header-action" title="Pesquisar">🔍</button>
        <button class="header-action" title="Mais opções">⋮</button>
      </header>

      <div class="messages" id="messages"></div>

      <form class="message-form" id="messageForm">
        <button type="button" id="emojiBtn" title="Emoji">😊</button>
        <button type="button" id="attachBtn" title="Anexar">📎</button>
        <input type="file" id="fileInput" hidden>
        <input
          type="text"
          id="messageInput"
          placeholder="Escreve uma mensagem"
          autocomplete="off"
        >
        <button type="submit" class="send-btn" title="Enviar">➤</button>
      </form>

    </section>
  </main>

</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
