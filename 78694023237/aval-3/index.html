<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Clone</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="layout">
    <!-- Menu Lateral -->
    <aside class="sidebar">
      <div class="logo">𝕏</div>
      <nav>
        <button class="nav-btn active">🏠 Página Inicial</button>
        <button class="nav-btn">🔍 Explorar</button>
        <button class="nav-btn">🔔 Notificações</button>
        <button class="nav-btn">👤 Perfil</button>
      </nav>
    </aside>

    <!-- Feed Principal -->
    <main class="feed">
      <header class="feed-header">
        <h2>Página Inicial</h2>
      </header>

      <!-- Caixa de Novo Post -->
      <section class="tweet-box">
        <div class="avatar">🧑🏻</div>
        <form id="tweetForm">
          <textarea id="tweetInput" placeholder="O que está acontecendo?!" maxlength="280" required></textarea>
          <div class="tweet-actions">
            <span id="charCount">280</span>
            <button type="submit" id="postBtn">Postar</button>
          </div>
        </form>
      </section>

      <!-- Lista de Posts -->
      <section id="feedList" class="feed-list"></section>
    </main>

    <!-- Barra Direita (Pesquisa e Tendências) -->
    <aside class="widgets">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar no X">
      </div>

      <div class="trends">
        <h3>O que está acontecendo</h3>
        <div class="trend-item">
          <span>Tecnologia · Assunto do momento</span>
          <strong>JavaScript Puro</strong>
          <small>12,5 mil posts</small>
        </div>
        <div class="trend-item">
          <span>Programação · Tendência</span>
          <strong>Desenvolvimento Web</strong>
          <small>8.420 posts</small>
        </div>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
