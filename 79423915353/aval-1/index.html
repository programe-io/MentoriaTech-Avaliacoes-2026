<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f0f0f0;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
        #resultado {
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>🎮 Jogo de Adivinhação</h1>
    <p>Tente adivinhar o número entre 1 e 100.</p>

    <input type="number" id="palpite" min="1" max="100">
    <button onclick="verificar()">Tentar</button>

    <p id="resultado"></p>

    <script>
        const numeroSecreto = Math.floor(Math.random() * 100) + 1;

        function verificar() {
            const palpite = Number(document.getElementById("palpite").value);
            const resultado = document.getElementById("resultado");

            if (palpite === numeroSecreto) {
                resultado.innerHTML = "🎉 Parabéns! Você acertou!";
                resultado.style.color = "green";
            } else if (palpite < numeroSecreto) {
                resultado.innerHTML = "📈 O número é maior.";
                resultado.style.color = "blue";
            } else {
                resultado.innerHTML = "📉 O número é menor.";
                resultado.style.color = "red";
            }
        }
    </script>

<script src="script.js"></script></body>
</html>
