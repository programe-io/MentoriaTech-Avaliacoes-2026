<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <!-- HEADER / NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/800px-Instagram_logo.svg.png" alt="Instagram" class="logo-img">
            </div>
            <div class="nav-search">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Pesquisar" id="searchInput">
                </div>
            </div>
            <div class="nav-icons">
                <i class="fas fa-home nav-icon active" title="Início"></i>
                <i class="far fa-paper-plane nav-icon" title="Mensagens"></i>
                <i class="far fa-plus-square nav-icon" title="Novo post" id="newPostBtn"></i>
                <i class="far fa-compass nav-icon" title="Explorar"></i>
                <i class="far fa-heart nav-icon" title="Notificações" id="notifBtn"></i>
                <img src="https://i.pravatar.cc/150?img=12" alt="Perfil" class="nav-profile-pic">
            </div>
        </div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <div class="feed-container">

            <!-- STORIES -->
            <section class="stories-section">
                <div class="stories-wrapper">
                    <div class="story" id="addStory">
                        <div class="story-avatar add-story">
                            <img src="https://i.pravatar.cc/150?img=12" alt="Seu story">
                            <div class="add-story-icon"><i class="fas fa-plus"></i></div>
                        </div>
                        <span class="story-username">Seu story</span>
                    </div>
                    <!-- Stories gerados via JS -->
                </div>
            </section>

            <!-- FEED DE POSTS -->
            <section class="feed" id="feed">
                <!-- Posts gerados via JS -->
            </section>

        </div>

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-profile">
                <img src="https://i.pravatar.cc/150?img=12" alt="Perfil" class="sidebar-avatar">
                <div class="sidebar-info">
                    <span class="sidebar-username">luizdavy.dev</span>
                    <span class="sidebar-fullname">Luiz Davy</span>
                </div>
                <button class="sidebar-switch">Mudar</button>
            </div>

            <div class="suggestions-header">
                <span>Sugestões para você</span>
                <a href="#">Ver tudo</a>
            </div>

            <div class="suggestions-list" id="suggestionsList">
                <!-- Sugestões geradas via JS -->
            </div>

            <div class="sidebar-footer">
                <a href="#">Sobre</a> · <a href="#">Ajuda</a> · <a href="#">Imprensa</a> · <a href="#">API</a> · <a href="#">Carreiras</a> · <a href="#">Privacidade</a> · <a href="#">Termos</a>
                <p>© 2026 INSTAGRAM CLONE</p>
            </div>
        </aside>
    </main>

    <!-- MODAL NOVO POST -->
    <div class="modal-overlay" id="newPostModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Criar nova publicação</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="upload-area" id="uploadArea">
                    <i class="far fa-image"></i>
                    <p>Arraste fotos e vídeos aqui</p>
                    <button class="upload-btn" id="uploadBtn">Selecionar do computador</button>
                    <input type="file" id="fileInput" accept="image/*" hidden>
                </div>
                <div class="post-preview" id="postPreview" style="display:none;">
                    <img id="previewImg" src="" alt="Preview">
                    <textarea id="captionInput" placeholder="Escreva uma legenda..."></textarea>
                    <button class="share-btn" id="shareBtn">Compartilhar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL STORY VIEWER -->
    <div class="story-modal" id="storyModal">
        <div class="story-viewer">
            <div class="story-progress-bar">
                <div class="story-progress" id="storyProgress"></div>
            </div>
            <div class="story-header">
                <img id="storyViewerAvatar" src="" alt="">
                <span id="storyViewerUsername"></span>
                <span id="storyViewerTime"></span>
                <button class="story-close" id="closeStory">&times;</button>
            </div>
            <div class="story-content">
                <img id="storyViewerImg" src="" alt="Story">
            </div>
            <div class="story-nav">
                <button class="story-prev" id="storyPrev"><i class="fas fa-chevron-left"></i></button>
                <button class="story-next" id="storyNext"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
