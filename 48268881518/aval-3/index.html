<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gray-100 text-slate-900">

    <!-- Cabeçalho -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <h1 class="text-xl font-semibold">Instagram</h1>
                <button class="text-2xl">
                    <i class="bx bx-menu"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="max-w-5xl mx-auto py-4 pb-20">
        <div class="flex gap-8">

            <!-- Feed -->
            <div class="flex-1 max-w-lg mx-auto">

                <!-- Stories -->
                <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">
                    <div class="flex gap-4 overflow-x-auto">

                        <!-- Seu story -->
                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gray-100">
                                <div class="w-full h-full rounded-full bg-white p-0.5">
                                    <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">
                                        <span class="text-2xl text-gray-500">+</span>
                                    </div>
                                </div>
                            </div>
                            <span class="text-xs mt-1 w-16 text-center">Seu story</span>
                        </div>

                        <!-- Messi -->
                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                <div class="w-full h-full rounded-full bg-white p-0.5">
                                    <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Lionel_Messi.jpg"
                                         class="w-full h-full object-cover rounded-full"
                                         alt="Messi">
                                </div>
                            </div>
                            <span class="text-xs mt-1 w-16 text-center">Messi</span>
                        </div>

                        <!-- Cristiano Ronaldo -->
                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                <div class="w-full h-full rounded-full bg-white p-0.5">
                                    <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Cristiano_Ronaldo_2018.jpg"
                                         class="w-full h-full object-cover rounded-full"
                                         alt="Cristiano Ronaldo">
                                </div>
                            </div>
                            <span class="text-xs mt-1 w-16 text-center">CR7</span>
                        </div>

                        <!-- Nobru -->
                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                <div class="w-full h-full rounded-full bg-white p-0.5">
                                    <img src="https://placehold.co/100x100?text=Nobru"
                                         class="w-full h-full object-cover rounded-full"
                                         alt="Nobru">
                                </div>
                            </div>
                            <span class="text-xs mt-1 w-16 text-center">Nobru</span>
                        </div>

                        <!-- Yuri22 -->
                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                <div class="w-full h-full rounded-full bg-white p-0.5">
                                    <img src="https://placehold.co/100x100?text=Yuri22"
                                         class="w-full h-full object-cover rounded-full"
                                         alt="Yuri22">
                                </div>
                            </div>
                            <span class="text-xs mt-1 w-16 text-center">Yuri22</span>
                        </div>

                    </div>
                </section>

                <!-- Postagem -->
                <article class="bg-white border border-gray-200 rounded-lg mb-4">

                    <!-- Cabeçalho da postagem -->
                    <header class="flex items-center justify-between p-3">
                        <div class="flex items-center gap-3">

                            <div class="w-10 h-10 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/2/2e/Flamengo_braz_logo.svg"
                                     class="w-full h-full object-contain rounded-full border-2 border-white bg-white p-1"
                                     alt="Flamengo">
                            </div>

                            <div>
                                <span class="font-semibold text-sm">marcos</span>
                                <p class="text-xs text-gray-500">Mengão ❤️🖤</p>
                            </div>
                        </div>

                        <button class="text-2xl">
                            <i class="bx bx-dots-horizontal-rounded"></i>
                        </button>
                    </header>

                    <!-- Imagem da postagem -->
                    <img src="https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=800"
                         class="w-full object-cover"
                         alt="Estádio de futebol">

                    <!-- Ações -->
                    <div class="p-3">
                        <div class="flex items-center justify-between text-2xl">
                            <div class="flex gap-3">
                                <i class="bx bx-heart"></i>
                                <i class="bx bx-message-rounded"></i>
                                <i class="bx bx-send"></i>
                            </div>
                            <i class="bx bx-bookmark"></i>
                        </div>

                        <p class="text-sm mt-2">
                            <strong>marcos</strong> Mengão até o fim! ❤️🖤
                        </p>
                    </div>

                </article>

            </div>
        </div>
    </main>

</body>
</html>
