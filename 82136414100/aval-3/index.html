
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoeStore - Loja de Sapatos</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="chat">
    <header class="header">
        <div class="logo">👟</div>
        <div>
            <h2>ShoeStore</h2>
            <p>● Atendimento online</p>
        </div>
    </header>

    <section class="produtos">
        <button class="produto" onclick="escolherProduto('Tênis esportivo')">
            <span>👟</span>
            <strong>Tênis esportivo</strong>
            <small>R$ 149,90</small>
        </button>

        <button class="produto" onclick="escolherProduto('Sapato social')">
            <span>👞</span>
            <strong>Sapato social</strong>
            <small>R$ 199,90</small>
        </button>

        <button class="produto" onclick="escolherProduto('Sandália')">
            <span>🩴</span>
            <strong>Sandália</strong>
            <small>R$ 69,90</small>
        </button>
    </section>

    <main class="mensagens" id="mensagens">
        <div class="msg bot">
            Olá! 👋 Bem-vindo à ShoeStore!

            👟 Temos modelos para todos os estilos.
            Quer conhecer nossos sapatos, consultar preços ou escolher seu tamanho?
        </div>
    </main>

    <section class="botoes">
        <button onclick="respostaRapida('Quais são os preços?')">💰 Preços</button>
        <button onclick="respostaRapida('Quais tamanhos estão disponíveis?')">📏 Tamanhos</button>
        <button onclick="respostaRapida('Quero comprar um sapato')">🛍️ Comprar</button>
    </section>

    <form class="formulario" id="formulario">
        <input
            type="text"
            id="entrada"
            placeholder="Digite sua mensagem..."
            autocomplete="off"
            required
        >
        <button type="submit">Enviar</button>
    </form>

    <footer class="rodape">
        ShoeStore © 2026 — Seu estilo começa pelos pés!
    </footer>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
