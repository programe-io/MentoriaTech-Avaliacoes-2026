
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamisaStore - Atendimento</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="chat">
    <header class="header">
        <div class="logo">👕</div>
        <div>
            <h2>CamisaStore</h2>
            <p>● Atendimento online</p>
        </div>
    </header>

    <section class="produtos">
        <button class="produto" onclick="escolherProduto('Camisa básica')">
            <span>👕</span>
            <strong>Camisa básica</strong>
            <small>R$ 39,90</small>
        </button>

        <button class="produto" onclick="escolherProduto('Camisa polo')">
            <span>👔</span>
            <strong>Camisa polo</strong>
            <small>R$ 59,90</small>
        </button>

        <button class="produto" onclick="escolherProduto('Camisa estampada')">
            <span>🎽</span>
            <strong>Estampada</strong>
            <small>R$ 49,90</small>
        </button>
    </section>

    <main class="mensagens" id="mensagens">
        <div class="msg bot">
            Olá! 👋 Bem-vindo à CamisaStore!

            Estou aqui para ajudar você a encontrar a camisa ideal.
            Quer consultar modelos, tamanhos ou preços?
        </div>
    </main>

    <section class="botoes">
        <button onclick="respostaRapida('Quais são os preços?')">💰 Preços</button>
        <button onclick="respostaRapida('Quais tamanhos vocês têm?')">📏 Tamanhos</button>
        <button onclick="respostaRapida('Quero comprar uma camisa')">🛍️ Comprar</button>
    </section>

    <form class="formulario" id="formulario">
        <input
            type="text"
            id="entrada"
            placeholder="Digite sua mensagem..."
            autocomplete="off"
            required
        >
        <button type="submit">Enviar</button>
    </form>

    <footer class="rodape">
        CamisaStore © 2026
    </footer>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
