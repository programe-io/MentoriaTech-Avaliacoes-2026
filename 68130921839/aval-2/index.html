
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Gerenciador de Tarefas</h1>

        <!-- Cadastro de tarefas -->
        <h3>Cadastrar Nova Tarefa</h3>

        <input
            type="number"
            id="codigo"
            placeholder="Código da tarefa"
        >

        <input
            type="text"
            id="titulo"
            placeholder="Título da tarefa"
        >

        <select id="prioridade">
            <option value="">Selecione a prioridade</option>
            <option value="1">1 - Alta</option>
            <option value="2">2 - Média</option>
            <option value="3">3 - Baixa</option>
        </select>

        <button onclick="cadastrarTarefa()">
            Cadastrar Tarefa
        </button>

        <hr>

        <!-- Alterar tarefas -->
        <h3>Gerenciar Tarefas</h3>

        <input
            type="number"
            id="codigoAlterar"
            placeholder="Digite o código da tarefa"
        >

        <button onclick="concluirTarefa()">
            Marcar como Concluída
        </button>

        <select id="novaPrioridade">
            <option value="">Selecione a nova prioridade</option>
            <option value="1">1 - Alta</option>
            <option value="2">2 - Média</option>
            <option value="3">3 - Baixa</option>
        </select>

        <button onclick="alterarPrioridade()">
            Alterar Prioridade
        </button>

        <hr>

        <!-- Listagem -->
        <h3>Lista de Tarefas</h3>

        <button onclick="listarTarefas()">
            Listar Tarefas
        </button>

        <div id="listaTarefas"></div>

    </div>

    <!-- Arquivo JavaScript -->
    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
