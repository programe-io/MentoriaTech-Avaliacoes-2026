<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeymarFeed ⚽</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #07110b;
    color: white;
}

/* HEADER */
header {
    position: sticky;
    top: 0;
    z-index: 100;

    height: 70px;

    background: #050505;
    border-bottom: 2px solid #19e66b;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7%;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #19e66b;
}

.logo span {
    color: white;
}

header button {
    background: #19e66b;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

/* FEED */
.feed {
    max-width: 650px;
    margin: 30px auto;
    padding: 0 15px;
}

/* PERFIL */
.perfil {
    background: #111;
    border-radius: 18px;
    padding: 20px;

    display: flex;
    align-items: center;
    gap: 15px;

    margin-bottom: 20px;

    border: 1px solid #222;
}

.avatar {
    width: 75px;
    height: 75px;

    border-radius: 50%;
    object-fit: cover;

    border: 3px solid #19e66b;
}

.perfil h2 {
    font-size: 21px;
}

.verificado {
    color: #19e66b;
}

.perfil p {
    color: #888;
    margin-top: 5px;
}

/* NOVO POST */
.novo-post {
    width: 100%;
    padding: 16px;

    border: none;
    border-radius: 15px;

    background: #19e66b;
    color: #001b0c;

    font-weight: bold;
    font-size: 16px;

    cursor: pointer;

    margin-bottom: 20px;
}

.novo-post:hover {
    background: white;
}

/* PUBLICAÇÃO */
.post {
    background: #111;
    border: 1px solid #242424;

    border-radius: 18px;

    overflow: hidden;

    margin-bottom: 25px;

    box-shadow: 0 5px 25px rgba(0,0,0,.3);
}

.post-header {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 15px;
}

.post-header img {
    width: 48px;
    height: 48px;

    object-fit: cover;
    border-radius: 50%;

    border: 2px solid #19e66b;
}

.post-header strong {
    display: block;
}

.post-header small {
    color: #777;
}

.post-text {
    padding: 0 15px 15px;

    color: #ddd;
    line-height: 1.5;
}

/* FOTO */
.post-image {
    width: 100%;
    display: block;

    max-height: 650px;
    object-fit: cover;
}

/* AÇÕES */
.actions {
    display: flex;
    gap: 8px;

    padding: 15px;
}

.action {
    flex: 1;

    padding: 11px 5px;

    border: none;
    border-radius: 20px;

    background: #222;
    color: white;

    cursor: pointer;

    transition: .2s;
}

.action:hover {
    background: #19e66b;
    color: black;
}

.action.liked {
    background: #19e66b;
    color: black;
}

.likes {
    padding: 0 15px 15px;

    color: #999;
    font-size: 14px;
}

/* COMENTÁRIOS */
.comments {
    padding: 0 15px;
}

.comment {
    background: #1d1d1d;

    padding: 10px;

    margin-bottom: 7px;

    border-radius: 10px;

    color: #ddd;
}

.comment strong {
    color: #19e66b;
}

/* FORMULÁRIO */
.comment-form {
    display: flex;
    gap: 8px;

    padding: 15px;

    border-top: 1px solid #222;
}

.comment-form input {
    flex: 1;

    background: #222;

    color: white;

    border: none;
    outline: none;

    padding: 12px 15px;

    border-radius: 20px;
}

.comment-form button {
    border: none;

    background: #19e66b;

    color: black;

    padding: 0 18px;

    border-radius: 20px;

    font-weight: bold;

    cursor: pointer;
}

/* MODAL */
.modal {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.8);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 200;

    padding: 20px;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 450px;

    background: #111;

    border: 1px solid #19e66b;

    border-radius: 20px;

    padding: 25px;
}

.modal-box h2 {
    color: #19e66b;
    margin-bottom: 20px;
}

.modal-box input,
.modal-box textarea {
    width: 100%;

    background: #222;

    border: none;
    outline: none;

    color: white;

    padding: 13px;

    border-radius: 10px;

    margin-bottom: 12px;
}

.modal-box textarea {
    height: 100px;
    resize: none;
}

.modal-buttons {
    display: flex;
    gap: 10px;
}

.modal-buttons button {
    flex: 1;

    padding: 13px;

    border: none;
    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;
}

.publish {
    background: #19e66b;
}

.cancel {
    background: #333;
    color: white;
}

/* FOOTER */
footer {
    text-align: center;

    padding: 30px;

    color: #666;
}

/* CELULAR */
@media(max-width:600px) {

    header {
        padding: 0 15px;
    }

    .logo {
        font-size: 22px;
    }

    .action {
        font-size: 12px;
    }

    .perfil {
        padding: 15px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>

    <div class="logo">
        ⚽ Neymar<span>Feed</span>
    </div>

    <button onclick="seguir()">
        <span id="followText">Seguir</span>
    </button>

</header>


<main class="feed">

    <!-- PERFIL -->
    <section class="perfil">

        <img
            class="avatar"
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Neymar_2018.jpg/500px-Neymar_2018.jpg"
            alt="Neymar">

        <div>
            <h2>
                Neymar Jr
                <span class="verificado">✓</span>
            </h2>

            <p>@neymarjr • Futebol ⚽</p>
        </div>

    </section>


    <!-- NOVO POST -->
    <button class="novo-post" onclick="abrirModal()">
        ➕ Criar publicação
    </button>


    <!-- POST -->
    <article class="post">

        <div class="post-header">

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Neymar_2018.jpg/500px-Neymar_2018.jpg">

            <div>
                <strong>Neymar Jr ✓</strong>
                <small> • Hoje</small>
            </div>

        </div>


        <p class="post-text">
            Futebol é alegria, paixão e dedicação! ⚽🇧🇷💚
        </p>


        <img
            class="post-image"
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Neymar_2018.jpg/500px-Neymar_2018.jpg"
            alt="Neymar Jr">


        <div class="actions">

            <button class="action" onclick="like(this)">
                ❤️ Curtir
            </button>

            <button class="action" onclick="focusComment(this)">
                💬 Comentar
            </button>

            <button class="action" onclick="sharePost()">
                📤 Compartilhar
            </button>

        </div>


        <div class="likes">
            <span class="likeNumber">1.248</span> curtidas
        </div>


        <div class="comments">

            <div class="comment">
                <strong>João:</strong>
                Monstro! 🔥
            </div>

            <div class="comment">
                <strong>Lucas:</strong>
                Craque brasileiro! 🇧🇷
            </div>

        </div>


        <div class="comment-form">

            <input
                type="text"
                placeholder="Escreva um comentário...">

            <button onclick="comment(this)">
                Enviar
            </button>

        </div>

    </article>


    <!-- SEGUNDO POST -->
    <article class="post">

        <div class="post-header">

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Neymar_2018.jpg/500px-Neymar_2018.jpg">

            <div>
                <strong>Neymar Jr ✓</strong>
                <small> • Ontem</small>
            </div>

        </div>


        <p class="post-text">
            Nunca desista dos seus sonhos. 💚💛
        </p>


        <img
            class="post-image"
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Neymar_2018.jpg/500px-Neymar_2018.jpg"
            alt="Neymar">


        <div class="actions">

            <button class="action" onclick="like(this)">
                ❤️ Curtir
            </button>

            <button class="action" onclick="focusComment(this)">
                💬 Comentar
            </button>

            <button class="action" onclick="sharePost()">
                📤 Compartilhar
            </button>

        </div>


        <div class="likes">
            <span class="likeNumber">985</span> curtidas
        </div>


        <div class="comments"></div>


        <div class="comment-form">

            <input
                type="text"
                placeholder="Escreva um comentário...">

            <button onclick="comment(this)">
                Enviar
            </button>

        </div>

    </article>

</main>


<footer>
    NeymarFeed ⚽ • Página demonstrativa
</footer>


<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-box">

        <h2>Nova publicação ⚽</h2>

        <input
            type="text"
            id="name"
            placeholder="Seu nome">

        <textarea
            id="text"
            placeholder="O que você quer publicar?"></textarea>

        <input
            type="text"
            id="image"
            placeholder="URL da imagem (opcional)">

        <div class="modal-buttons">

            <button class="cancel" onclick="closeModal()">
                Cancelar
            </button>

            <button class="publish" onclick="publish()">
                Publicar
            </button>

        </div>

    </div>

</div>


<script>

/* SEGUIR */

function seguir() {

    const button = document.querySelector("header button");
    const text = document.getElementById("followText");

    if (text.innerText === "Seguir") {

        text.innerText = "✓ Seguindo";
        button.style.background = "white";

    } else {

        text.innerText = "Seguir";
        button.style.background = "#19e66b";

    }
}


/* CURTIR */

function like(button) {

    const post = button.closest(".post");

    const number =
        post.querySelector(".likeNumber");

    let likes =
        parseInt(number.innerText.replace(".", ""));

    if (!button.classList.contains("liked")) {

        likes++;

        button.classList.add("liked");

        button.innerHTML = "💚 Curtido";

    } else {

        likes--;

        button.classList.remove("liked");

        button.innerHTML = "❤️ Curtir";
    }

    number.innerText =
        likes.toLocaleString("pt-BR");
}


/* COMENTAR */

function comment(button) {

    const form = button.parentElement;

    const input =
        form.querySelector("input");

    const text = input.value.trim();

    if (text === "") {

        alert("Digite um comentário!");

        return;
    }

    const post =
        button.closest(".post");

    const comments =
        post.querySelector(".comments");

    const newComment =
        document.createElement("div");

    newComment.className = "comment";

    newComment.innerHTML =
        "<strong>Você:</strong> " + text;

    comments.appendChild(newComment);

    input.value = "";
}


/* FOCO NO COMENTÁRIO */

function focusComment(button) {

    const post =
        button.closest(".post");

    post.querySelector(
        ".comment-form input"
    ).focus();
}


/* COMPARTILHAR */

function sharePost() {

    if (navigator.share) {

        navigator.share({
            title: "NeymarFeed",
            text: "Confira este post no NeymarFeed!"
        });

    } else {

        navigator.clipboard.writeText(
            window.location.href
        );

        alert("Link copiado!");
    }
}


/* MODAL */

function abrirModal() {

    document
        .getElementById("modal")
        .classList.add("active");
}


function closeModal() {

    document
        .getElementById("modal")
        .classList.remove("active");
}


/* PUBLICAR */

function publish() {

    const name =
        document.getElementById("name").value.trim();

    const text =
        document.getElementById("text").value.trim();

    const image =
        document.getElementById("image").value.trim();

    if (text === "") {

        alert("Escreva algo antes de publicar!");

        return;
    }

    const post =
        document.createElement("article");

    post.className = "post";

    post.innerHTML = `

        <div class="post-header">

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Neymar_2018.jpg/500px-Neymar_2018.jpg">

            <div>

                <strong>
                    ${name || "Você"}
                </strong>

                <small> • Agora</small>

            </div>

        </div>

        <p class="post-text">
            ${text}
        </p>

        ${
            image
            ? `<img class="post-image" src="${image}">`
            : ""
        }

        <div class="actions">

            <button class="action" onclick="like(this)">
                ❤️ Curtir
            </button>

            <button class="action" onclick="focusComment(this)">
                💬 Comentar
            </button>

            <button class="action" onclick="sharePost()">
                📤 Compartilhar
            </button>

        </div>

        <div class="likes">
            <span class="likeNumber">0</span> curtidas
        </div>

        <div class="comments"></div>

        <div class="comment-form">

            <input
                type="text"
                placeholder="Escreva um comentário...">

            <button onclick="comment(this)">
                Enviar
            </button>

        </div>
    `;

    const feed =
        document.querySelector(".feed");

    const firstPost =
        document.querySelector(".post");

    feed.insertBefore(post, firstPost);

    document.getElementById("name").value = "";
    document.getElementById("text").value = "";
    document.getElementById("image").value = "";

    closeModal();
}

</script>

</body>
</html>
