<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoMax - Venda de Motos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>MotoMax</h1>
        <p>As melhores motos do Brasil</p>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#">Motos</a>
        <a href="#">Promoções</a>
        <a href="#">Contato</a>
    </nav>

    <main>

        <section class="banner">
            <h2>Encontre a moto dos seus sonhos</h2>
            <button onclick="mostrarMensagem()">Ver Ofertas</button>
        </section>

        <section class="motos">

            <article class="card">
                <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=600" alt="Moto Esportiva">
                <h3>Yamaha R3</h3>
                <span>R$ 32.900</span>
                <button onclick="comprar('Yamaha R3')">Comprar</button>
            </article>

            <article class="card">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600" alt="Moto">
                <h3>Honda CB 500F</h3>
                <span>R$ 39.990</span>
                <button onclick="comprar('Honda CB 500F')">Comprar</button>
            </article>

            <article class="card">
                <img src="https://images.unsplash.com/photo-1609630875171-b1321377ee65?w=600" alt="Moto">
                <h3>Kawasaki Ninja 400</h3>
                <span>R$ 35.900</span>
                <button onclick="comprar('Kawasaki Ninja 400')">Comprar</button>
            </article>

            <article class="card">
                <img src="https://images.unsplash.com/photo-1606220838315-056192d5e927?w=600" alt="Moto">
                <h3>BMW G 310 R</h3>
                <span>R$ 34.500</span>
                <button onclick="comprar('BMW G 310 R')">Comprar</button>
            </article>

        </section>

    </main>

    <footer>
        <p>© 2026 MotoMax - Todos os direitos reservados</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
