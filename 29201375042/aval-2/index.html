
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Meu Feed</h1>
    </header>

    <main>
        <section class="nova-publicacao">
            <h2>Nova publicação</h2>
            <textarea id="texto" placeholder="O que você está pensando?"></textarea>
            <button onclick="publicar()">Publicar</button>
        </section>

        <section id="feed">

            <article class="post">
                <h3>João Silva</h3>
                <p>Olá! Este é meu primeiro post no feed!</p>
                <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
            </article>

            <article class="post">
                <h3>Maria Oliveira</h3>
                <p>Hoje é um ótimo dia para aprender algo novo!</p>
                <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
            </article>

        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
