
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #09090f, #172554);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      padding: 40px 25px;
      border: 1px solid #3b82f6;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 35px rgba(59, 130, 246, 0.2);
      animation: aparecer 1s ease;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
      color: #60a5fa;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 25px;
      color: #e5e7eb;
    }

    button {
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #60a5fa;
      transform: scale(1.05);
    }

    #mensagem {
      margin-top: 25px;
      font-size: 18px;
      color: #93c5fd;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
  <main class="container">
    <h1>Bem-vindo!</h1>

    <p>
      Este é o meu site criado com HTML, CSS e JavaScript.
      Um espaço moderno, bonito e feito para você!
    </p>

    <button onclick="mostrarMensagem()">
      Clique aqui
    </button>

    <div id="mensagem"></div>
  </main>

  <script>
    function mostrarMensagem() {
      document.getElementById("mensagem").textContent =
        "Obrigado por visitar meu site! 🚀";
    }
  </script>
<script src="script.js"></script></body>
</html>
