                                .avatar-mais { position: absolute; right: -4px; bottom: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid #0a0f16; display: flex; align-items: center; justify-content: center; }

                                                      .chip svg { width: 16px; height: 16px; }
