```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <h1>📦 Sistema de Estoque</h1>
            <p>Cadastre e gerencie seus produtos</p>
        </header>

        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <div class="campos">
                <div class="campo">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" placeholder="Ex: 001">
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" placeholder="Nome do produto">
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" placeholder="0" min="0">
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input type="number" id="valor" placeholder="0,00" min="0" step="0.01">
                </div>
            </div>

            <button onclick="cadastrarProduto()" class="btn-cadastrar">
                Cadastrar Produto
            </button>
        </section>


        <section class="estoque">

            <div class="titulo-estoque">
                <h2>Produtos Cadastrados</h2>
                <span id="totalProdutos">0 produtos</span>
            </div>

            <div class="tabela-container">

                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Produtos serão adicionados aqui pelo JavaScript -->
                    </tbody>
                </table>

            </div>

            <p id="mensagemVazia" class="mensagem-vazia">
                Nenhum produto cadastrado.
            </p>

        </section>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
```
