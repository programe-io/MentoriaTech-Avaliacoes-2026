<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📋 Gerenciador de Tarefas</h1>
        
        <section class="card-formulario">
            <h2>Nova Tarefa</h2>
            <div class="form-group">
                <label for="titulo">Título da Tarefa:</label>
                <input type="text" id="titulo" placeholder="Mínimo 5 caracteres">
            </div>
            
            <div class="form-group">
                <label for="prioridade">Prioridade:</label>
                <select id="prioridade">
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>
            </div>
            
            <button id="btnCadastrar" class="btn-primary">Adicionar Tarefa ✨</button>
        </section>

        <section class="card-lista">
            <h2>Minhas Tarefas</h2>
            <div id="listaVazia" class="feedback-vazio">Sua lista está vazia por enquanto.</div>
            
            <div class="tabela-container">
                <table id="tabelaTarefas" class="hidden">
                    <thead>
                        <tr>
                            <th>Cód.</th>
                            <th>Tarefa</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela"></tbody>
                </table>
            </div>
        </section>
    </div>
<script src="script.js"></script></body>
</html>
