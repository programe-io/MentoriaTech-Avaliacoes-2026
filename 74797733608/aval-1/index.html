<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <form id="form-produto" onsubmit="event.preventDefault();">
    <div class="form-group">
        <label for="codigo">Código:</label>
        <input type="text" id="codigo" required placeholder="Ex: P001">
    </div>
    <div class="form-group">
        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao" required placeholder="Ex: Arroz 5kg">
    </div>
    <div class="form-group">
        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" min="0" required placeholder="Ex: 50">
    </div>
    <div class="form-group">
        <label for="valor">Valor Unitário (R$):</label>
        <input type="number" id="valor" step="0.01" min="0" required placeholder="Ex: 24.90">
    </div>
    <!-- O onclick chama a função diretamente de forma garantida -->
    <button type="button" class="btn-primary" onclick="cadastrarNovoProduto()">Cadastrar Produto</button>
</form>

  <script src="script.js"></script>
  
</body>
</html>
