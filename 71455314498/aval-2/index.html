<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <aside class="sidebar">
        <h2>Navegação</h2>
        <nav>
            <a href="#" class="active">📦 Visão Geral</a>
            <a href="#">📋 Relatórios</a>
            <a href="#">⚙️ Configurações</a>
        </nav>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1>Gestão de Estoque</h1>
            <div class="user-info">Operador: <strong>Admin</strong></div>
        </header>

        <!-- Seção de Busca e Filtro -->
        <section class="filter-section">
            <input type="text" id="input-busca" placeholder="🔍 Buscar por nome do produto...">
            <label class="checkbox-filter">
                <input type="checkbox" id="check-critico">
                Exibir apenas estoque crítico (≤ 5 un.)
            </label>
        </section>

        <!-- Formulário de Entrada -->
        <section class="card">
            <h2>Novo Registro</h2>
            <form id="form-estoque">
                <div class="form-row">
                    <input type="text" id="prod-nome" placeholder="Produto" required>
                    <input type="text" id="prod-sku" placeholder="SKU / Código" required>
                    <input type="number" id="prod-qtd" placeholder="Qtd Inicial" min="0" required>
                    <input type="number" id="prod-preco" placeholder="Preço (R$)" step="0.01" min="0" required>
                    <button type="submit" class="btn-save">Salvar Produto</button>
                </div>
            </form>
        </section>

        <!-- Tabela -->
        <section class="card">
            <h2>Itens Cadastrados</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>SKU</th>
                            <th>Produto</th>
                            <th>Estoque</th>
                            <th>Preço Unit.</th>
                            <th>Status</th>
                            <th>Movimentação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-itens">
                        <!-- Conteúdo dinâmico via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
