<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Resumo / Cards */
        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            flex: 1;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h3 {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .card p {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Formulario */
        .form-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            width: 100%;
        }

        button {
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #219150;
        }

        /* Tabela */
        .table-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
            color: #2c3e50;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>📦 Controle de Estoque</h1>

        <!-- Cards Informativos -->
        <div class="cards">
            <div class="card">
                <h3>Total de Itens Diferentes</h3>
                <p id="total-itens">0</p>
            </div>
            <div class="card">
                <h3>Quantidade Total em Estoque</h3>
                <p id="total-qtd">0</p>
            </div>
            <div class="card">
                <h3>Valor Total do Estoque</h3>
                <p id="total-valor">R$ 0,00</p>
            </div>
        </div>

        <!-- Formulário de Cadastro -->
        <div class="form-container">
            <h2>Cadastrar Novo Produto</h2>
            <br>
            <form id="form-produto">
                <div class="form-group">
                    <input type="text" id="nome" placeholder="Nome do Produto" required>
                    <input type="text" id="categoria" placeholder="Categoria (ex: Eletrônicos)" required>
                    <input type="number" id="quantidade" placeholder="Quantidade" min="1" required>
                    <input type="number" id="preco" placeholder="Preço Unitário (R$)" step="0.01" min="0" required>
                </div>
                <button type="submit">Adicionar Produto</button>
            </form>
        </div>

        <!-- Tabela de Produtos -->
        <div class="table-container">
            <h2>Produtos em Estoque</h2>
            <br>
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Qtd.</th>
                        <th>Preço Unitário</th>
                        <th>Total Subtotal</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    <!-- Linhas dos produtos serão adicionadas via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        const form = document.getElementById('form-produto');
        const tabelaCorpo = document.getElementById('tabela-corpo');
        const elTotalItens = document.getElementById('total-itens');
        const elTotalQtd = document.getElementById('total-qtd');
        const elTotalValor = document.getElementById('total-valor');

        let estoque = [];

        // Função para formatar moeda
        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // Adicionar Produto
        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const categoria = document.getElementById('categoria').value;
            const quantidade = parseInt(document.getElementById('quantidade').value);
            const preco = parseFloat(document.getElementById('preco').value);

            const produto = {
                id: Date.now(),
                nome,
                categoria,
                quantidade,
                preco
            };

            estoque.push(produto);
            atualizarInterface();
            form.reset();
        });

        // Excluir Produto
        function deletarProduto(id) {
            estoque = estoque.filter(produto => produto.id !== id);
            atualizarInterface();
        }

        // Atualizar Tabela e Indicadores
        function atualizarInterface() {
            // Limpa a tabela
            tabelaCorpo.innerHTML = '';

            let totalQtd = 0;
            let totalValor = 0;

            if (estoque.length === 0) {
                tabelaCorpo.innerHTML = `<tr><td colspan="6" style="text-align:center;">Nenhum produto cadastrado.</td></tr>`;
            } else {
                estoque.forEach(produto => {
                    const subtotal = produto.quantidade * produto.preco;
                    totalQtd += produto.quantidade;
                    totalValor += subtotal;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${produto.nome}</strong></td>
                        <td>${produto.categoria}</td>
                        <td>${produto.quantidade}</td>
                        <td>${formatarMoeda(produto.preco)}</td>
                        <td>${formatarMoeda(subtotal)}</td>
                        <td>
                            <button class="btn-delete" onclick="deletarProduto(${produto.id})">Excluir</button>
                        </td>
                    `;
                    tabelaCorpo.appendChild(tr);
                });
            }

            // Atualiza os Cards
            elTotalItens.innerText = estoque.length;
            elTotalQtd.innerText = totalQtd;
            elTotalValor.innerText = formatarMoeda(totalValor);
        }

        // Inicializa a interface limpa
        atualizarInterface();
    </script>
<script src="script.js"></script></body>
</html>
