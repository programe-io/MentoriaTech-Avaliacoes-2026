<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
    <div class="header-content">
      <h1>BFeed</h1>
      <nav>
        <a href="#">Inicio</a>
        <a href="#">Perfil</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="new-post">
      <div class="user">
        <div class="avatar">I</div>
        <div>
          <strong>Igor</strong>
          <span>O que você está pensando?</span>
        </div>
      </div>
      <button>Publicar</button>
    </section>
    <article class="post">
      <div class="post-header">
        <div class="avatar">W</div>
        <div>
          <strong>William</strong>
          <span>Ha 5 minutos</span>
        </div>
      </div>
      <div class="post-text">Maratonei todos os episodios de SERIE, ABSOLUTE CINEMA!!!</div>
      <img src="https://m.media-amazon.com/images/M/MV5BMjEzMDAxOTUyMV5BMl5BanBnXkFtZTgwNzAxMzYzOTE@._V1_.jpg" alt="">
      <div class="post-actions">
        <button>Curtir</button>
        <button>Comentar</button>
      </div>
    </article>
  </main>
  <footer>
    <p>BFeed - Todos os direitos reservados - 2026</p>
  </footer>
</body>
</html>
