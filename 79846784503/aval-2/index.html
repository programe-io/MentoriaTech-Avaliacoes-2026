
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsNow - Notícias</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="header">
    <div class="logo">News<span>Now</span></div>

    <div class="search">
        <input type="text" id="searchInput"
            placeholder="Pesquisar notícias...">
        <button id="searchBtn">🔍</button>
    </div>
</header>

<nav class="categories">
    <button class="active" data-category="Todas">Todas</button>
    <button data-category="Brasil">Brasil</button>
    <button data-category="Mundo">Mundo</button>
    <button data-category="Tecnologia">Tecnologia</button>
    <button data-category="Esportes">Esportes</button>
    <button data-category="Economia">Economia</button>
</nav>

<main class="container">

    <section class="headline">
        <img src="https://picsum.photos/id/1011/1000/500">
        <div class="headline-info">
            <span>DESTAQUE</span>
            <h1>As principais notícias que movimentam o mundo hoje</h1>
            <p>Confira os acontecimentos mais importantes do dia.</p>
        </div>
    </section>

    <h2 class="section-title">Últimas notícias</h2>

    <section class="news-grid" id="newsGrid"></section>

    <p id="emptyMessage" hidden>Nenhuma notícia encontrada.</p>

</main>

<footer>
    <p>© 2026 NewsNow - Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
