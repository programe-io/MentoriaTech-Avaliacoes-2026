
<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<link href="style.css" rel="stylesheet"></head>
<body>

    <aside class="sidebar">
        <h1 class="logo">Instagram</h1>

        <nav>

            <a href="#">🧭 Explorar</a>
            <a href="#">🎬 Reels</a>
            <a href="#">💬 Mensagens</a>
            <a href="#">❤️ Notificações</a>
            <a href="#">➕ Criar</a>
            <a href="#">👤 Perfil</a>
        </nav>

    <main class="content">

        <section class="stories">
            <div class="story">
                <div class="story-circle"><span>W</span></div>
                <p>wevertow</p>
            </div>

            <div class="story">
                <div class="story-circle"><span>M</span></div>

            </div>

            <div class="story">

            <div class="story">
                <div class="story-circle"><span>MC</span></div>
                <p>mariaclaudia</p>

        <section class="feed">

                    <div class="profile-mini">W</div>

                    class="post-image"
                    src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000"
                    alt="Imagem de Frank Ocean"
                >

                <div class="post-actions">
                    <button class="like-button" aria-label="Curtir">♡</button>
                    <button aria-label="Comentar">💬</button>
                    <button aria-label="Compartilhar">➤</button>
                    <button class="save-button" aria-label="Salvar">♧</button>
                </div>

                <div class="post-info">
                    <strong class="likes">1.248 curtidas</strong>
                    <p><strong>wevertow</strong> Frank Ocean 🎧✨</p>
                    <p class="caption">Uma vibe que não tem explicação. 🌊</p>
                    <small>Ver todos os 32 comentários</small>
                </div>

                <div class="comment-area">
                    <input type="text" placeholder="Adicione um comentário...">
                    <button>Publicar</button>
                </div>
            </article>

        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
