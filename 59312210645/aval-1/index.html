
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Surpresa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #090979, #8000ff, #ff00a6);
            background-size: 300% 300%;
            animation: fundo 8s infinite alternate;
            color: white;
            text-align: center;
        }

        @keyframes fundo {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .container {
            background: rgba(0, 0, 0, 0.35);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px #ff00ff;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 32px;
        }

        p {
            margin-bottom: 25px;
            font-size: 17px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 30px;
            background: #ff00cc;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            background: #9900ff;
        }

        #mensagem {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">
        <h1>✨ Mundo Aleatório ✨</h1>

        <p>Está preparado para uma surpresa?</p>

        <button onclick="surpresa()">
            Clique aqui!
        </button>

        <div id="mensagem"></div>
    </div>

    <script>
        function surpresa() {
            const mensagens = [
                "🚀 Você nasceu para coisas incríveis!",
                "🎮 Hora de jogar e se divertir!",
                "🔥 Nunca desista dos seus sonhos!",
                "🌟 Hoje é um ótimo dia para começar!",
                "💜 Você desbloqueou uma surpresa!",
                "👾 Bem-vindo ao mundo secreto!"
            ];

            const numero = Math.floor(
                Math.random() * mensagens.length
            );

            document.getElementById("mensagem").innerHTML =
                mensagens[numero];
        }
    </script>

<script src="script.js"></script></body>
</html>
