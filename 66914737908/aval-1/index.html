<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Controle de Estoque</h1>

        <div class="grid-layout">
            <!-- Formulário de Cadastro -->
            <div class="card">
                <h2>Cadastrar Produto</h2>
                <form id="form-cadastro">
                    <div class="input-group">
                        <label for="codigo">Código:</label>
                        <input type="text" id="codigo" required>
                    </div>
                    <div class="input-group">
                        <label for="descricao">Descrição:</label>
                        <input type="text" id="descricao" required>
                    </div>
                    <div class="input-group">
                        <label for="quantidade">Quantidade:</label>
                        <input type="number" id="quantidade" min="0" required>
                    </div>
                    <div class="input-group">
                        <label for="valor">Valor (R$):</label>
                        <input type="number" id="valor" step="0.01" min="0" required>
                    </div>
                    <button type="submit" class="btn-primary">Cadastrar</button>
                </form>
            </div>

            <!-- Formulário de Atualização -->
            <div class="card">
                <h2>Atualizar Produto</h2>
                <form id="form-atualizar">
                    <div class="input-group">
                        <label for="codigo-busca">Código do Produto:</label>
                        <input type="text" id="codigo-busca" required>
                    </div>
                    <div class="input-group">
                        <label for="novo-valor">Novo Valor (R$) (Opcional):</label>
                        <input type="number" id="novo-valor" step="0.01" min="0">
                    </div>
                    <div class="input-group">
                        <label for="nova-quantidade">Nova Quantidade (Opcional):</label>
                        <input type="number" id="nova-quantidade" min="0">
                    </div>
                    <button type="submit" class="btn-secondary">Atualizar Produto</button>
                </form>
            </div>
        </div>

        <!-- Lista de Produtos -->
        <div class="card card-tabela">
            <h2>Produtos em Estoque</h2>
            <div class="table-responsive">
                <table id="tabela-estoque">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor (R$)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Inserido via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
