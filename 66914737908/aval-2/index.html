<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

    <!-- Sidebar / Menu Lateral -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-6 flex items-center space-x-3 border-b border-slate-800">
                <i class="fa-solid fa-boxes-stacked text-indigo-500 text-2xl"></i>
                <span class="text-white font-bold text-lg tracking-wide">EstoquePro</span>
            </div>
            <nav class="p-4 space-y-1">
                <a href="#" class="flex items-center space-x-3 px-4 py-3 bg-indigo-600 text-white rounded-lg font-medium"><i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span></a>
                <a href="#produtos" class="flex items-center space-x-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-lg transition"><i class="fa-solid fa-box w-5"></i><span>Produtos</span></a>
                <a href="#movimentacoes" class="flex items-center space-x-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-lg transition"><i class="fa-solid fa-right-left w-5"></i><span>Movimentações</span></a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
            Sistema de Estoque v1.0
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <!-- Header Superior -->
        <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shadow-sm">
            <h1 class="text-xl font-bold text-slate-800">Painel de Controle</h1>
            <div class="flex items-center space-x-4">
                <button onclick="exportarCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                    <i class="fa-solid fa-file-excel"></i><span>Exportar CSV</span>
                </button>
            </div>
        </header>

        <!-- Corpo do Dashboard -->
        <div class="p-8 space-y-6">
            <!-- Cards de Indicadores (KPIs) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-slate-500">Total em Produtos</p>
                        <h3 id="kpiTotalProdutos" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-cubes"></i>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-slate-500">Valor Total em Estoque</p>
                        <h3 id="kpiValorEstoque" class="text-2xl font-bold text-emerald-600 mt-1">R$ 0,00</h3>
                    </div>
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-dollar-sign"></i>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-slate-500">Estoque Baixo / Alerta</p>
                        <h3 id="kpiEstoqueBaixo" class="text-2xl font-bold text-rose-600 mt-1">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                </div>
            </div>

            <!-- Seção de Ações e Tabela -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-4">
                <div class="flex flex-col md:flex-row justify-between gap-4 items-center">
                    <div class="w-full md:w-72 relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-search"></i></span>
                        <input type="text" id="inputBusca" onkeyup="filtrarProdutos()" placeholder="Buscar produto..." class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="flex space-x-3 w-full md:w-auto">
                        <button onclick="abrirModalMovimentacao()" class="flex-1 md:flex-none bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-right-left"></i><span>Movimentar</span>
                        </button>
                        <button onclick="abrirModalProduto()" class="flex-1 md:flex-none bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-plus"></i><span>Novo Produto</span>
                        </button>
                    </div>
                </div>

                <!-- Tabela de Produtos -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                                <th class="py-3 px-4">Código</th>
                                <th class="py-3 px-4">Nome do Produto</th>
                                <th class="py-3 px-4">Categoria</th>
                                <th class="py-3 px-4">Preço Custo</th>
                                <th class="py-3 px-4">Preço Venda</th>
                                <th class="py-3 px-4">Estoque</th>
                                <th class="py-3 px-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaProdutos" class="divide-y divide-slate-100 text-sm">
                            <!-- Preenchido via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Cadastro/Edição de Produto -->
    <div id="modalProduto" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white w-full max-w-lg rounded-xl shadow-xl overflow-hidden p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 id="modalTitulo" class="font-bold text-lg text-slate-800">Cadastrar Novo Produto</h3>
                <button onclick="fecharModalProduto()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="formProduto" onsubmit="salvarProduto(event)" class="space-y-4">
                <input type="hidden" id="produtoId">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Código / SKU</label>
                        <input type="text" id="codigo" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Categoria</label>
                        <input type="text" id="categoria" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nome do Produto</label>
                    <input type="text" id="nome" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Preço Custo (R$)</label>
                        <input type="number" step="0.01" id="precoCusto" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Preço Venda (R$)</label>
                        <input type="number" step="0.01" id="PrecoVenda" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Qtd Inicial</label>
                        <input type="number" id="estoque" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="fecharModalProduto()" class="px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-600 hover:bg-slate-50 transition">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Movimentação (Entrada/Saída) -->
    <div id="modalMovimentacao" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white w-full max-w-md rounded-xl shadow-xl overflow-hidden p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-bold text-lg text-slate-800">Registrar Movimentação</h3>
                <button onclick="fecharModalMovimentacao()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="formMovimentacao" onsubmit="salvarMovimentacao(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Produto</label>
                    <select id="movProdutoId" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <!-- Preenchido via JS -->
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Tipo</label>
                        <select id="movTipo" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="ENTRADA">Entrada (+)</option>
                            <option value="SAIDA">Saída (-)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Quantidade</label>
                        <input type="number" id="movQuantidade" min="1" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="fecharModalMovimentacao()" class="px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-600 hover:bg-slate-50 transition">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-sm font-medium transition">Confirmar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script JS -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
