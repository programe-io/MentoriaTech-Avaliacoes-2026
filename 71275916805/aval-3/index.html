
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha de Anamnese - Controle de IMC</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>🏥 Ficha de Anamnese</h1>
        <p>Sistema de cadastro e controle de IMC</p>
    </header>

    <main>

        <section class="resumo">

            <div class="card-resumo">
                <h3>Pacientes cadastrados</h3>
                <p id="totalPessoas">0</p>
            </div>

            <div class="card-resumo">
                <h3>IMC médio</h3>
                <p id="imcMedio">0,00</p>
            </div>

        </section>

        <section class="card">

            <h2 id="tituloFormulario">Cadastrar paciente</h2>

            <form id="formPessoa">

                <div class="campo">
                    <label for="nome">Nome completo</label>

                    <input
                        type="text"
                        id="nome"
                        maxlength="50"
                        placeholder="Digite o nome do paciente"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>

                    <input
                        type="number"
                        id="idade"
                        min="1"
                        max="120"
                        step="1"
                        placeholder="Ex: 25"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="altura">Altura (metros)</label>

                    <input
                        type="number"
                        id="altura"
                        min="0.5"
                        max="2.5"
                        step="0.01"
                        placeholder="Ex: 1.70"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg)</label>

                    <input
                        type="number"
                        id="peso"
                        min="1"
                        max="500"
                        step="0.1"
                        placeholder="Ex: 70.5"
                        required
                    >
                </div>

                <div class="botoes">

                    <button type="submit" id="btnSalvar">
                        Salvar paciente
                    </button>

                    <button
                        type="button"
                        id="btnCancelar"
                        class="btn-cancelar"
                    >
                        Cancelar
                    </button>

                </div>

                <p id="erro" role="alert"></p>

            </form>

        </section>

        <section class="card">

            <h2>Pacientes cadastrados</h2>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar paciente pelo nome..."
            >

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaPessoas"></tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>Projeto acadêmico - JavaScript</p>
    </footer>

    <script src="app.js"></script>

<script src="script.js"></script></body>
</html>
