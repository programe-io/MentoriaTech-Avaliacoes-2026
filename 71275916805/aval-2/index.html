
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📋 Gerenciador de Tarefas</h1>
        <p>Organize suas atividades e acompanhe seu progresso.</p>
    </header>

    <main>

        <section class="resumo">
            <div class="card">
                <h3>Total de tarefas</h3>
                <p id="totalTarefas">0</p>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <p id="tarefasPendentes">0</p>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <p id="tarefasConcluidas">0</p>
            </div>
        </section>

        <section class="formulario">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título da tarefa"
                    required
                    minlength="5"
                >

                <select id="prioridade" required>
                    <option value="">Selecione a prioridade</option>
                    <option value="1">Alta</option>
                    <option value="2">Média</option>
                    <option value="3">Baixa</option>
                </select>

                <button type="submit">
                    + Cadastrar tarefa
                </button>

            </form>
        </section>

        <section class="tarefas">

            <h2>Minhas tarefas</h2>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar tarefa..."
            >

            <div class="filtros">
                <button class="filtro ativo" data-filtro="todas">
                    Todas
                </button>

                <button class="filtro" data-filtro="pendentes">
                    Pendentes
                </button>

                <button class="filtro" data-filtro="concluidas">
                    Concluídas
                </button>
            </div>

            <div id="listaTarefas"></div>

        </section>

    </main>

    <footer>
        <p>Gerenciador de Tarefas - Projeto JavaScript</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
