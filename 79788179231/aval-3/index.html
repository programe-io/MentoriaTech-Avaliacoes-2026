<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- Boxicons (para os ícones de Home e Heart) -->
    <link href="https://unpkg.com" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Topo / Header -->
    <header class="sticky top-0 bg-white border-b border-gray-200 z-50">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                
                <!-- Logo -->
                <h1 class="font-semibold text-lg">Instagram</h1>
                
                <!-- Campo de Pesquisa -->
                <input 
                    type="text" 
                    placeholder="Pesquisar" 
                    class="hidden md:block bg-gray-100 px-4 py-2 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-gray-300"
                />
                
                <!-- Ícones de Navegação -->
                <div class="flex gap-4">
                    <i class="bx bx-home text-xl cursor-pointer"></i>
                    <i class="bx bx-heart text-xl cursor-pointer"></i>
                </div>
                
            </div>
        </div>
    </header>

    <!-- Container do Conteúdo Principal -->
    <main class="max-w-5xl mx-auto px-4 py-6">
        <div class="flex gap-8">
            
            <!-- Feed -->
            <div class="flex-1 max-w-lg mx-auto">
                <!-- O conteúdo dos Stories e Posts entrará aqui -->
                <div class="border-2 border-dashed border-gray-200 rounded-lg p-4 text-center text-gray-400">
                    Área do Feed (Stories e Posts)
                </div>
            </div>
            
            <!-- Sidebar -->
            <aside class="hidden lg:block w-80">
                <!-- O conteúdo das sugestões entrará aqui -->
                <div class="border-2 border-dashed border-gray-200 rounded-lg p-4 text-center text-gray-400">
                    Área da Sidebar (Sugestões)
                </div>
            </aside>
            
        </div>
    </main>

</body>
</html>
<aside class="hidden lg:block w-80">

      <p class="font-semibold text-sm">seu_usuario</p>
      <p class="text-xs text-gray-500">Seu nome</p>
    </div>
  </div>
</aside>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clone Instagram - Aula 11</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://tailwindcss.com"></script>
  <!-- Boxicons para os ícones (bx, bx-heart, etc.) -->
  <link href="https://unpkg.com" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 pb-16 md:pb-0">

  <!-- Container Principal do Layout -->
  <div class="max-w-4xl mx-auto flex gap-8 pt-8 px-4">
    
    <!-- COLUNA PRINCIPAL: FEED (Onde fica o Card de Postagem) -->
    <main class="flex-1 max-w-[600px]">
      
      <article class="bg-white border border-gray-200 rounded-sm">
        <!-- (Opcional) Espaço simulando o topo e a foto do post -->
        <div class="aspect-square bg-gray-100 flex items-center justify-center text-gray-400">
          [Imagem do Post]
        </div>

        <!-- Bloco de Ações do Slide -->
        <!-- Ações -->
        <div class="p-4">
          <div class="flex justify-between mb-3 text-2xl">
            <div class="flex gap-4">
              <i class="bx bx-heart cursor-pointer hover:text-gray-500"></i>
              <i class="bx bx-message-rounded cursor-pointer hover:text-gray-500"></i>
            </div>
            <i class="bx bx-bookmark cursor-pointer hover:text-gray-500"></i>
          </div>
          
          <p class="text-sm font-semibold">1.234 curtidas</p>
        </div>
      </article>

    </main>

    <!-- COLUNA SECUNDÁRIA: SIDEBAR (Sugestões de Usuários) -->
    <aside class="hidden lg:block w-80">
      <!-- Item de Perfil do Slide -->
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-full bg-gray-300"></div>
          <div>
            <p class="font-semibold text-sm">seu_usuario</p>
            <p class="text-xs text-gray-500">Seu nome</p>
          </div>
        </div>
        <a href="#" class="text-xs font-semibold text-blue-500">Mudar</a>
      </div>

      <!-- Título de Sugestões -->
      <div class="flex justify-between mb-4">
        <span class="text-sm font-semibold text-gray-500">Sugestões para você</span>
        <a href="#" class="text-xs font-semibold text-gray-900">Ver tudo</a>
      </div>

      <!-- Exemplo de Sugestão replicando a estrutura do slide -->
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-gray-300"></div>
          <div>
            <p class="font-semibold text-xs">usuario_sugerido</p>
            <p class="text-[10px] text-gray-500">Seguido(a) por amigos</p>
          </div>
        </div>
        <a href="#" class="text-xs font-semibold text-blue-500">Seguir</a>
      </div>
    </aside>

  </div>

  <!-- MENU MOBILE (Navegação Inferior para Mobile) -->
  <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-200 h-12 flex justify-around items-center text-2xl z-50">
    <i class="bx bx-home-alt-2 cursor-pointer"></i>
    <i class="bx bx-search cursor-pointer"></i>
    <i class="bx bx-plus-square cursor-pointer"></i>
    <i class="bx bx-movie-play cursor-pointer"></i>
    <div class="w-6 h-6 rounded-full bg-gray-300 cursor-pointer"></div>
  </nav>

</body>
</html>
