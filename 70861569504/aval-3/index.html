<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="topo">
    <h1>Ficha Médica</h1>
    <nav class="abas" role="tablist">
      <button class="aba ativa" data-aba="nova" role="tab">Nova ficha</button>
      <button class="aba" data-aba="consultar" role="tab">Consultar fichas <span id="contador">0</span></button>
    </nav>
  </header>

  <main>
    <!-- CRIAR / EDITAR -->
    <section id="nova" class="painel ativo">
      <div id="formFicha">
        <input type="hidden" id="id">
        <h2 id="tituloForm">Nova ficha</h2>

        <fieldset>
          <legend>Dados pessoais</legend>
          <div class="grade">
            <label class="largo">Nome completo
              <input type="text" id="nome" required>
            </label>
            <label>Data de nascimento
              <input type="date" id="nascimento" required>
            </label>
            <label>Sexo
              <select id="sexo" required>
                <option value="">Selecione</option>
                <option>Feminino</option>
                <option>Masculino</option>
                <option>Outro</option>
              </select>
            </label>
            <label>CPF
              <input type="text" id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
            </label>
            <label>Telefone
              <input type="tel" id="telefone" placeholder="(86) 90000-0000">
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Dados clínicos</legend>
          <div class="grade">
            <label>Tipo sanguíneo
              <select id="sangue">
                <option value="">Não sabe</option>
                <option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option>
                <option>AB+</option><option>AB-</option>
                <option>O+</option><option>O-</option>
              </select>
            </label>
            <label>Peso (kg)
              <input type="number" id="peso" step="0.1" min="0">
            </label>
            <label>Altura (cm)
              <input type="number" id="altura" min="0">
            </label>
            <label class="largo">Alergias
              <textarea id="alergias" rows="2" placeholder="Ex.: dipirona, penicilina, látex"></textarea>
            </label>
            <label class="largo">Medicamentos em uso
              <textarea id="medicamentos" rows="2"></textarea>
            </label>
            <label class="largo">Doenças crônicas
              <textarea id="doencas" rows="2" placeholder="Ex.: hipertensão, diabetes"></textarea>
            </label>
            <label class="largo">Histórico e observações
              <textarea id="obs" rows="4"></textarea>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Contato de emergência</legend>
          <div class="grade">
            <label>Nome
              <input type="text" id="emergNome">
            </label>
            <label>Telefone
              <input type="tel" id="emergTel">
            </label>
          </div>
        </fieldset>

        <div class="acoes">
          <button type="button" class="btn primario" id="btnSalvar">Salvar ficha</button>
          <button type="button" class="btn" id="btnCancelar">Limpar formulário</button>
        </div>
      </div>
    </section>

    <!-- CONSULTAR -->
    <section id="consultar" class="painel">
      <div class="busca">
        <input type="search" id="busca" placeholder="Buscar por nome ou CPF">
      </div>
      <div class="consulta">
        <ul id="lista" class="lista"></ul>
        <article id="detalhe" class="detalhe">
          <p class="vazio">Selecione uma ficha para ver os detalhes.</p>
        </article>
      </div>
    </section>
  </main>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
  
</body>
</html>
