<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raiz – Loja de plantas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="topo">
    <h1 class="marca">Raiz</h1>
    <p class="slogan">Plantas para casa, entregues com cuidado.</p>
    <a class="atalho-carrinho" href="#carrinho" aria-label="Ir para o carrinho">
      Carrinho <span id="contador-topo" class="contador">0</span>
    </a>
  </header>

  <main class="layout">

    <section aria-labelledby="titulo-produtos">
      <h2 id="titulo-produtos" class="titulo-secao">Escolha suas plantas</h2>
      <div id="lista-produtos" class="grade-produtos"></div>
    </section>

    <aside id="carrinho" class="carrinho" aria-labelledby="titulo-carrinho">
      <h2 id="titulo-carrinho" class="titulo-secao">Seu carrinho</h2>

      <p id="carrinho-vazio" class="vazio">
        Seu carrinho está vazio. Escolha a quantidade em uma planta e clique em Adicionar.
      </p>

      <ul id="itens-carrinho" class="itens-carrinho"></ul>

      <div class="frete-aviso" id="aviso-frete" hidden></div>

      <dl class="resumo">
        <div class="linha">
          <dt>Subtotal</dt>
          <dd id="subtotal">R$ 0,00</dd>
        </div>
        <div class="linha">
          <dt>Frete</dt>
          <dd id="frete">R$ 0,00</dd>
        </div>
        <div class="linha total">
          <dt>Total</dt>
          <dd id="total">R$ 0,00</dd>
        </div>
      </dl>

      <button id="btn-finalizar" class="btn btn-principal btn-largo" type="button" disabled>Finalizar compra</button>
      <button id="btn-limpar" class="btn-link" type="button" hidden>Esvaziar carrinho</button>
    </aside>

  </main>

  <div id="aviso" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
