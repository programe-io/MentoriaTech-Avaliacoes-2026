<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grão Nobre | Loja de cafés</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <h1>Grão Nobre</h1>
    <p>Cafés e utensílios para o seu coador</p>
  </header>

  <main class="layout">
    <section aria-labelledby="titulo-produtos">
      <h2 id="titulo-produtos">Produtos</h2>
      <div id="lista-produtos" class="produtos"></div>
    </section>

    <aside class="carrinho" aria-labelledby="titulo-carrinho">
      <h2 id="titulo-carrinho">Seu carrinho</h2>
      <ul id="itens-carrinho" class="itens"></ul>

      <dl class="resumo">
        <div>
          <dt>Itens</dt>
          <dd id="total-itens">0</dd>
        </div>
        <div class="total">
          <dt>Total</dt>
          <dd id="total-valor">R$ 0,00</dd>
        </div>
      </dl>

      <button id="btn-finalizar" class="btn btn-principal" disabled>Finalizar compra</button>
      <button id="btn-limpar" class="btn btn-texto" disabled>Esvaziar carrinho</button>
      <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
    </aside>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
