<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotina – Gerenciador de tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="app">

    <header class="cabecalho">
      <div>
        <h1 class="titulo" id="titulo-data">Hoje</h1>
        <p class="subtitulo" id="subtitulo-data"></p>
      </div>

      <div class="anel" id="anel" role="img" aria-label="Progresso do dia">
        <div class="anel-miolo">
          <strong id="anel-numero">0/0</strong>
          <span>feitas</span>
        </div>
      </div>
    </header>

    <nav class="semana" id="semana" aria-label="Dias da semana"></nav>

    <main class="conteudo">

      <section class="painel" aria-labelledby="titulo-lista">
        <h2 id="titulo-lista" class="titulo-secao">Tarefas do dia</h2>
        <p id="msg-vazio" class="vazio" hidden></p>
        <div id="lista-periodos"></div>
      </section>

      <section class="painel" aria-labelledby="titulo-form">
        <h2 id="titulo-form" class="titulo-secao">Nova tarefa de rotina</h2>

        <form id="form-tarefa" class="form" autocomplete="off">
          <label class="campo">
            <span>O que você quer fazer?</span>
            <input id="campo-nome" type="text" maxlength="60" placeholder="Ex.: Beber 2 litros de água" required>
          </label>

          <label class="campo">
            <span>Em que período?</span>
            <select id="campo-periodo">
              <option value="manha">Manhã</option>
              <option value="tarde">Tarde</option>
              <option value="noite">Noite</option>
            </select>
          </label>

          <fieldset class="campo dias">
            <legend>Quais dias repete?</legend>
            <div class="atalhos">
              <button type="button" class="chip-atalho" data-preset="todos">Todos os dias</button>
              <button type="button" class="chip-atalho" data-preset="uteis">Dias úteis</button>
              <button type="button" class="chip-atalho" data-preset="fds">Fim de semana</button>
            </div>
            <div class="chips" id="chips-dias"></div>
          </fieldset>

          <p id="erro-form" class="erro" role="alert" hidden></p>

          <button type="submit" class="btn btn-principal">Adicionar tarefa</button>
        </form>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
