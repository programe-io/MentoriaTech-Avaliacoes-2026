<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Clientes</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- BLOCO 1: CABEÇALHO -->
  <header class="header-bloco">
    <h1>Painel de Clientes</h1>
    <p>Gerencie seus clientes de forma simples</p>
  </header>

  <main class="main-container">
    
    <!-- BLOCO 2: FORMULÁRIO DE CADASTRO -->
    <section class="bloco-formulario">
      <h2>Cadastrar Novo Cliente</h2>
      <form id="formCliente">
        <div class="input-grupo">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" placeholder="Digite o nome" required>
        </div>
        <div class="input-grupo">
          <label for="email">E-mail:</label>
          <input type="email" id="email" placeholder="Digite o e-mail" required>
        </div>
        <div class="input-grupo">
          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
        </div>
        <button type="submit" class="btn-salvar">Adicionar Cliente</button>
      </form>
    </section>

    <!-- BLOCO 3: LISTAGEM DE CLIENTES (CARDS/TABELA) -->
    <section class="bloco-lista">
      <h2>Clientes Cadastrados</h2>
      <div id="listaClientes" class="grid-clientes">
        <!-- Os cards de clientes serão injetados aqui via JavaScript -->
      </div>
    </section>

  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
