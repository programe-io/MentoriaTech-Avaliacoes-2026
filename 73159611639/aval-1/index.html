<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #2c3e50;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
        }
        button {
            padding: 8px 15px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #219150;
        }
        button.btn-update {
            background-color: #2980b9;
        }
        button.btn-update:hover {
            background-color: #2471a3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        .erro {
            color: #c0392b;
            background-color: #fadbd8;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h1>Gerenciamento de Produtos</h1>
    
    <!-- Área para exibir mensagens de erro -->
    <div id="mensagemErro" class="erro"></div>

    <!-- Formulário de Cadastro -->
    <h2>Cadastrar Novo Produto</h2>
    <div class="form-group">
        <input type="text" id="descricao" placeholder="Descrição (mín. 5 letras)">
        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="number" id="valor" step="0.01" placeholder="Valor (R$)">
        <button onclick="acaoCadastrar()">Cadastrar</button>
    </div>

    <!-- Formulário de Atualização -->
    <h2>Atualizar Produto Existente</h2>
    <div class="form-group">
        <input type="number" id="codigoBusca" placeholder="Código do Produto">
        <input type="number" id="novoValor" step="0.01" placeholder="Novo Valor (R$)">
        <button class="btn-update" onclick="acaoAtualizarValor()">Atualizar Valor</button>
        
        <input type="number" id="novaQuantidade" placeholder="Nova Quantidade">
        <button class="btn-update" onclick="acaoAtualizarQuantidade()">Atualizar Qtd</button>
    </div>

    <!-- Tabela de Listagem -->
    <h2>Lista de Produtos</h2>
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor Unitário</th>
            </tr>
        </thead>
        <tbody id="tabelaProdutos">
            <!-- Os produtos serão inseridos aqui pelo JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // Lista (Array) de Produtos
    let produtos = [];

    // --- SUAS FUNÇÕES CORRIGIDAS ---
    function validarProduto(descricao, quantidade, valor) {
        if (descricao.trim().length < 5) {
            throw new Error("Descrição deve ter no mínimo cinco caracteres.");
        }
        if (isNaN(quantidade) || quantidade < 1) {
            throw new Error("Quantidade deve ser maior que zero.");
        }
        if (isNaN(valor) || valor < 0) {
            throw new Error("Valor deve ser maior ou igual a zero.");
        }
    }

    function cadastrarProduto(descricao, quantidade, valor) {
        validarProduto(descricao, quantidade, valor);
        let novoProduto = {
            codigo: produtos.length + 1,
            descricao: descricao,
            quantidade: quantidade,
            valor: valor
        };
        produtos.push(novoProduto);
    }

    function atualizarValor(codigoProduto, novoValor) {
        if (isNaN(novoValor) || novoValor < 0) {
            throw new Error("Valor deve ser maior ou igual a zero.");
        }
        const produto = produtos.find(prod => prod.codigo === codigoProduto);
        if (produto) {
            produto.valor = novoValor;
        } else {
            throw new Error("Produto não encontrado.");
        }
    }

    function atualizarQuantidade(codigoProduto, novaQuantidade) {
        if (isNaN(novaQuantidade) || novaQuantidade < 1) {
            throw new Error("Quantidade deve ser maior que zero.");
        }
        const produto = produtos.find(prod => prod.codigo === codigoProduto);
        if (produto) {
            produto.quantidade = novaQuantidade;
        } else {
            throw new Error("Produto não encontrado.");
        }
    }

    // --- FUNÇÕES DE INTERFACE (HTML/DOM) ---
    function exibirErro(mensagem) {
        const divErro = document.getElementById("mensagemErro");
        divErro.textContent = mensagem;
        divErro.style.display = "block";
    }

    function limparErro() {
        const divErro = document.getElementById("mensagemErro");
        divErro.style.display = "none";
    }

    function renderizarTabela() {
        const tbody = document.getElementById("tabelaProdutos");
        tbody.innerHTML = ""; // Limpa a tabela antes de redesenhar

        produtos.forEach(prod => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${prod.codigo}</td>
                <td>${prod.descricao}</td>
                <td>${prod.quantidade}</td>
                <td>R$ ${prod.valor.toFixed(2)}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function acaoCadastrar() {
        limparErro();
        try {
            const desc = document.getElementById("descricao").value;
            const qtd = parseInt(document.getElementById("quantidade").value);
            const val = parseFloat(document.getElementById("valor").value);

            cadastrarProduto(desc, qtd, val);
            renderizarTabela();

            // Limpa os campos
            document.getElementById("descricao").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("valor").value = "";
        } catch (erro) {
            exibirErro(erro.message);
        }
    }

    function acaoAtualizarValor() {
        limparErro();
        try {
            const codigo = parseInt(document.getElementById("codigoBusca").value);
            const novoVal = parseFloat(document.getElementById("novoValor").value);

            atualizarValor(codigo, novoVal);
            renderizarTabela();
            document.getElementById("novoValor").value = "";
        } catch (erro) {
            exibirErro(erro.message);
        }
    }

    function acaoAtualizarQuantidade() {
        limparErro();
        try {
            const codigo = parseInt(document.getElementById("codigoBusca").value);
            const novaQtd = parseInt(document.getElementById("novaQuantidade").value);

            atualizarQuantidade(codigo, novaQtd);
            renderizarTabela();
            document.getElementById("novaQuantidade").value = "";
        } catch (erro) {
            exibirErro(erro.message);
        }
    }

    // --- DADOS INICIAIS PARA TESTE ---
    cadastrarProduto("Cadeira Gamer", 12, 699.00);
    cadastrarProduto("Mouse Logi", 38, 99.00);
    renderizarTabela();
</script>

<script src="script.js"></script></body>
</html>
