<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Configurações básicas da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <!-- Importa o arquivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Importa o JavaScript após a leitura do HTML -->
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <!-- Cabeçalho do sistema -->
        <header class="cabecalho">
            <h1>📦 Sistema de Estoque</h1>
            <p>Gerenciamento de produtos</p>
        </header>

        <!-- Indicadores com informações do estoque -->
        <section class="resumo">
            <article class="card">
                <p>Produtos cadastrados</p>
                <h2 id="totalProdutos">0</h2>
            </article>

            <article class="card">
                <p>Unidades em estoque</p>
                <h2 id="totalUnidades">0</h2>
            </article>

            <article class="card">
                <p>Valor total do estoque</p>
                <h2 id="valorEstoque">R$ 0,00</h2>
            </article>
        </section>

        <!-- Formulário de cadastro e edição -->
        <section class="painel">
            <h2 id="tituloFormulario">Cadastrar produto</h2>

            <form id="formProduto">

                <div class="form-grid">
                    <div class="campo">
                        <label for="codigo">Código</label>
                        <input
                            type="text"
                            id="codigo"
                            placeholder="Ex.: P001"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="descricao">Descrição</label>
                        <input
                            type="text"
                            id="descricao"
                            placeholder="Nome do produto"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="quantidade">Quantidade</label>
                        <input
                            type="number"
                            id="quantidade"
                            min="0"
                            step="1"
                            placeholder="0"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="valor">Valor unitário (R$)</label>
                        <input
                            type="number"
                            id="valor"
                            min="0"
                            step="0.01"
                            placeholder="0,00"
                            required
                        >
                    </div>
                </div>

                <!-- Botões do formulário -->
                <div class="botoes">
                    <button type="submit" id="btnSalvar">
                        Cadastrar produto
                    </button>

                    <button
                        type="button"
                        id="btnCancelar"
                        class="btn-secundario"
                        hidden
                    >
                        Cancelar
                    </button>
                </div>

                <!-- Exibe mensagens de sucesso ou erro -->
                <p id="mensagem" class="mensagem" aria-live="polite"></p>
            </form>
        </section>

        <!-- Listagem e pesquisa de produtos -->
        <section class="painel">
            <h2>Produtos cadastrados</h2>

            <div class="campo busca">
                <label for="pesquisa">Pesquisar produto</label>
                <input
                    type="search"
                    id="pesquisa"
                    placeholder="Digite o código ou a descrição..."
                >
            </div>

            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor unitário</th>
                            <th>Valor total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <!-- O JavaScript preenche esta área -->
                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
        </section>

        <footer>
            <p>Sistema de Estoque — Projeto acadêmico</p>
        </footer>

    </main>

<script src="script.js"></script></body>
</html>
