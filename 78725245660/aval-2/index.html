
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <h1>Mini<span>Feed</span></h1>
        <p>Compartilhe seus momentos!</p>
    </header>

    <!-- Menu de navegação -->
    <nav class="menu">
        <a href="#">Início</a>
        <a href="#publicar">Publicar</a>
        <a href="#feed">Feed</a>
        <a href="#sobre">Sobre</a>
    </nav>

    <main class="container">

        <!-- Área de nova publicação -->
        <section class="new-post" id="publicar">
            <h2>Nova publicação</h2>

            <input
                type="text"
                id="nome"
                placeholder="Seu nome"
            >

            <textarea
                id="texto"
                placeholder="O que você está pensando?"
            ></textarea>

            <input
                type="text"
                id="imagem"
                placeholder="URL da imagem (opcional)"
            >

            <button onclick="publicarPost()">
                Publicar
            </button>
        </section>

        <!-- Feed de postagens -->
        <section class="feed" id="feed">
            <h2>Últimas publicações</h2>

            <div id="lista-posts">

                <article class="post">
                    <h3>Maria Silva</h3>
                    <p>Hoje foi um dia incrível! ☀️</p>

                    <img
                        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800"
                        alt="Paisagem bonita"
                    >

                    <div class="actions">
                        <button onclick="curtir(this)">
                            ❤️ Curtir <span>0</span>
                        </button>

                        <button onclick="comentar(this)">
                            💬 Comentar
                        </button>
                    </div>
                </article>

                <article class="post">
                    <h3>João Pedro</h3>
                    <p>Um pouco de natureza para alegrar o dia! 🌳</p>

                    <img
                        src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800"
                        alt="Natureza"
                    >

                    <div class="actions">
                        <button onclick="curtir(this)">
                            ❤️ Curtir <span>0</span>
                        </button>

                        <button onclick="comentar(this)">
                            💬 Comentar
                        </button>
                    </div>
                </article>

            </div>
        </section>

    </main>

    <!-- Rodapé -->
    <footer id="sobre">
        <p>© 2026 MiniFeed - Todos os direitos reservados.</p>
        <p>Desenvolvido com ❤️</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
