<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuga do Dragão</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div id="container">
    <h1>🐉 Fuga do Dragão</h1>
    <div id="hud">
      <span>Pontos: <b id="score">0</b></span>
      <span>Recorde: <b id="best">0</b></span>
    </div>

    <div id="stage">
      <canvas id="game" width="800" height="400"></canvas>

      <div id="menu" class="overlay">
        <h2>Escolha seu personagem</h2>
        <div id="skins">
          <button class="skin selected" data-skin="bruxa">🧙 Bruxa</button>
          <button class="skin" data-skin="soldado">🛡️ Soldado</button>
          <button class="skin" data-skin="fada">🧚 Fada</button>
        </div>
        <p class="controls">ESPAÇO = pular &nbsp;|&nbsp; S = correr &nbsp;|&nbsp; D = abaixar</p>
        <p class="tip">Pegue moedas para ganhar velocidade. O dragão só aparece com 100 pontos!</p>
        <button id="start" class="action">Começar (ou ENTER)</button>
      </div>

      <div id="over" class="overlay hidden">
        <h2>Fim de jogo!</h2>
        <p id="reason"></p>
        <p>Pontos: <b id="finalScore">0</b></p>
        <button id="restart" class="action">Jogar novamente</button>
        <button id="back" class="action secondary">Trocar personagem</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
