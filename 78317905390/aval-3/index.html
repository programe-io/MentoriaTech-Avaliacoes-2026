
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trutifruti - Quebra-Cabeça</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🍓 TRUTIFRUTI 🍉</h1>
        <p>Vamos montar um quebra-cabeça delicioso?</p>
    </header>

    <main>
        <section class="jogo">
            <h2>Monte as 4 peças!</h2>

            <div class="tabuleiro" id="tabuleiro">
                <div class="espaco" data-pos="0">?</div>
                <div class="espaco" data-pos="1">?</div>
                <div class="espaco" data-pos="2">?</div>
                <div class="espaco" data-pos="3">?</div>
            </div>

            <h3>Escolha uma peça:</h3>

            <div class="pecas" id="pecas">
                <button class="peca" data-id="2">
                    🍉
                    <span>Melancia</span>
                </button>

                <button class="peca" data-id="0">
                    🍓
                    <span>Morango</span>
                </button>

                <button class="peca" data-id="3">
                    🍊
                    <span>Laranja</span>
                </button>

                <button class="peca" data-id="1">
                    🍌
                    <span>Banana</span>
                </button>
            </div>

            <p id="mensagem">Clique em uma peça e depois no espaço onde deseja encaixá-la!</p>

            <button class="reiniciar" onclick="reiniciarJogo()">
                🔄 Reiniciar jogo
            </button>
        </section>
    </main>

    <footer>
        <p>🍇 Trutifruti - Aprender brincando é mais divertido! 🍍</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
