<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
      <title>Fuja do Dragão</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <main id="wrap">
              <canvas id="game" width="800" height="400"></canvas>

                  <section id="menu" class="overlay">
                        <h1>Fuja do Dragão</h1>
                              <p class="sub">Escolha sua personagem e corra pela floresta!</p>
                                    <div id="cards">
                                            <button class="card selected" data-char="bruxa"><canvas width="110" height="120"></canvas><b>Bruxa</b><small>Pula mais alto</small></button>
                                                    <button class="card" data-char="soldado"><canvas width="110" height="120"></canvas><b>Soldado</b><small>Aguenta mais o dragão</small></button>
                                                            <button class="card" data-char="fada"><canvas width="110" height="120"></canvas><b>Fada</b><small>Flutua no ar</small></button>
                                                                  </div>
                                                                        <button id="play" class="big">Jogar</button>
                                                                              <p class="help"><b>Espaço</b> pula · <b>S</b> corre (gasta moedas) · <b>D</b> abaixa<br>O dragão aparece aos 1000 pontos.</p>
                                                                                  </section>

                                                                                      <section id="over" class="overlay hidden">
                                                                                            <h2 id="overTitle">Fim de jogo</h2>
                                                                                                  <p id="overInfo"></p>
                                                                                                        <button id="again" class="big">Jogar de novo</button>
                                                                                                            </section>
                                                                                                              </main>

                                                                                                                <div id="touch">
                                                                                                                    <button data-k="d" aria-label="Abaixar">▼</button>
                                                                                                                        <button data-k="s" aria-label="Correr">▶</button>
                                                                                                                            <button data-k="jump" aria-label="Pular">▲</button>
                                                                                                                              </div>

                                                                                                                                <script src="game.js"></script>
                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                </html>
