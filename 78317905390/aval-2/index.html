
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrida das Moedas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>🏃 CORRIDA DAS MOEDAS</h1>

    <div class="game-container">

        <div class="hud">
            <span>🪙 Moedas: <b id="coins">0</b></span>
            <span>🏆 Pontos: <b id="score">0</b></span>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div id="menu" class="overlay">
            <h2>CORRIDA DAS MOEDAS</h2>
            <p>Desvie dos obstáculos e pegue as moedas!</p>
            <button onclick="startGame()">JOGAR</button>
        </div>

        <div id="gameOver" class="overlay hidden">
            <h2>FIM DE JOGO!</h2>
            <p>🏆 Pontuação: <b id="finalScore">0</b></p>
            <p>🪙 Moedas coletadas: <b id="finalCoins">0</b></p>
            <button onclick="startGame()">JOGAR NOVAMENTE</button>
        </div>

    </div>

    <div class="instructions">
        <p>⬅️ ➡️ Mover entre as pistas</p>
        <p>⬆️ Pular obstáculos</p>
        <p>⬇️ Deslizar por baixo</p>
    </div>

    <div class="mobile-controls">
        <button onclick="moveLeft()">⬅️</button>
        <button onclick="jump()">⬆️</button>
        <button onclick="slide()">⬇️</button>
        <button onclick="moveRight()">➡️</button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
