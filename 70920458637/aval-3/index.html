<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Estrutura HTML</title>
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Meu Site</h1>
        <span>Bem-vindo ao exemplo de página.</span>
    </header>

    <nav>
        <a href="#">Início</a> |
        <a href="#">Sobre</a> |
        <a href="#">Contato</a>
    </nav>

    <main>
        <div>
            <h2>Conteúdo Principal</h2>
            <p>
                Este é um exemplo de texto dentro de uma
                <span style="color: blue;">tag span</span>.
            </p>

            <img
                src="https://via.placeholder.com/300x200"
                alt="Imagem de exemplo"
                width="300"
            >
        </div>
    </main>

<script src="script.js"></script></body>
</html>
