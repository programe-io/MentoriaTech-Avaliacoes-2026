<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Clone Instagram</title>
                <!-- Importação dos ícones (Boxicons) -->
                    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
                        <!-- Vinculando o arquivo de estilo CSS -->
                            <link rel="stylesheet" href="style.css">
                            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                            <body>

                                <!-- Navegação Inferior / Menu -->
                                    <nav class="navbar-bottom">
                                            <div class="nav-container">
                                                        <button class="nav-btn"><i class='bx bx-home'></i></button>
                                                                    <button class="nav-btn"><i class='bx bx-search'></i></button>
                                                                                <button class="nav-btn"><i class='bx bx-plus-circle'></i></button>
                                                                                            <button class="nav-btn"><i class='bx bx-heart'></i></button>
                                                                                                        <button class="nav-btn"><i class='bx bx-user'></i></button>
                                                                                                                </div>
                                                                                                                    </nav>

                                                                                                                        <!-- Conteúdo Principal / Perfil e Sugestões -->
                                                                                                                            <main class="main-container">
                                                                                                                                    
                                                                                                                                            <!-- Perfil do Usuário -->
                                                                                                                                                    <div class="user-profile-header">
                                                                                                                                                                <div class="user-info">
                                                                                                                                                                                <img class="profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Imagem de perfil">
                                                                                                                                                                                                <div class="user-text">
                                                                                                                                                                                                                    <p class="username">iliana_dev</p>
                                                                                                                                                                                                                                        <p class="user-fullname">Iliana Maria</p>
                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                <button class="switch-btn">Trocar</button>
                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                <!-- Seção de Sugestões -->
                                                                                                                                                                                                                                                                                                        <div class="suggestions-section">
                                                                                                                                                                                                                                                                                                                    <div class="suggestions-header">
                                                                                                                                                                                                                                                                                                                                    <span class="suggestions-title">Sugestões para Você</span>
                                                                                                                                                                                                                                                                                                                                                    <button class="see-all-btn">Ver tudo</button>
                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                            <div class="suggestions-list">
                                                                                                                                                                                                                                                                                                                                                                                            <!-- Sugestão 1 -->
                                                                                                                                                                                                                                                                                                                                                                                                            <div class="suggestion-item">
                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="suggestion-user">
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <img class="suggestion-img" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" alt="Imagem do Amigo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="suggestion-text">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p class="suggestion-name">Ilana</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p class="suggestion-subtitle">Sugerido para Você</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="follow-btn">Seguir</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Rodapé / Links úteis -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <footer class="footer-links">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p class="footer-text">Sobre • Ajuda • Imprensa • API • Carreiras • Privacidade • Termos • Localizações • Idioma</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p class="footer-copy">&copy; 2026 Instagram - Aula Avaliando</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
