<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Minifeed</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <!-- Cabeçalho -->
                        <header>
                                <div class="header-content">
                                            <h1>Minifeed</h1>
                                                        <nav>
                                                                        <a href="#">Início</a>
                                                                                        <a href="#">Perfil</a>
                                                                                                    </nav>
                                                                                                            </div>
                                                                                                                </header>

                                                                                                                    <!-- Conteúdo Principal -->
                                                                                                                        <main>
                                                                                                                                <!-- Caixa de Novo Post -->
                                                                                                                                        <section class="new-post">
                                                                                                                                                    <div class="user">
                                                                                                                                                                    <div class="avatar">I</div>
                                                                                                                                                                                    <div>
                                                                                                                                                                                                        <strong>Ilana</strong>
                                                                                                                                                                                                                            <span>O que você está fazendo?</span>
                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                    <button id="publish-btn">Publicar</button>
                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                    <!-- Feed de Publicações -->
                                                                                                                                                                                                                                                                                            <section class="feed">
                                                                                                                                                                                                                                                                                                        <article class="post">
                                                                                                                                                                                                                                                                                                                        <div class="post-header">
                                                                                                                                                                                                                                                                                                                                            <div class="avatar">F</div>
                                                                                                                                                                                                                                                                                                                                                                <div>
                                                                                                                                                                                                                                                                                                                                                                                        <strong>Fernanda</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                <span>Há 2 horas</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="post-text">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Hoje eu vi o filme do avatar, top demais, estou feliz :D
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <img class="post-img" src="https://via.placeholder.com/600x400" alt="Imagem do Post">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="post-actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="like-btn">Curtir (<span class="like-count">0</span>)</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button class="comment-btn">Comentar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </article>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Rodapé -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>Ilana Maria - Todos os direitos reservados / 2026</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Script JavaScript -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
