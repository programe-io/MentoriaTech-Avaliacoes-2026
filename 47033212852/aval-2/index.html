<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação - Escolinha de Basquete Team-Up</title>
    <style>
        :root {
            --primary-color: #ff6600; /* Laranja Basquete */
            --secondary-color: #1a1a2e; /* Azul Escuro/Preto */
            --light-bg: #f4f4f9;
            --text-color: #333;
        \}

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        \}

        body {
            background-color: var(--light-bg);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        \}

        .container {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            border-top: 8px solid var(--primary-color);
        \}

        .header {
            background-color: var(--secondary-color);
            color: #fff;
            text-align: center;
            padding: 30px 20px;
            position: relative;
        \}

        .header h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        \}

        .header p {
            font-size: 14px;
            color: #ccc;
        \}

        .basketball-icon {
            font-size: 40px;
            margin-bottom: 10px;
        \}

        form {
            padding: 30px 20px;
        \}

        .form-group {
            margin-bottom: 20px;
        \}

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--secondary-color);
        \}

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        \}

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary-color);
            outline: none;
        \}

        /* Estilização das Estrelas de Avaliação */
        .rating-container {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
        \}

        .rating-container input {
            display: none;
        \}

        .rating-container label {
            font-size: 30px;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s ease;
            margin-bottom: 0;
        \}

        .rating-container input:checked ~ label,
        .rating-container label:hover,
        .rating-container label:hover ~ label {
            color: var(--primary-color);
        \}

        textarea {
            resize: vertical;
            min-height: 100px;
        \}

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
        \}

        .btn-submit:hover {
            background-color: #e05500;
        \}

        .btn-submit:active {
            transform: scale(0.98);
        \}

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #777;
            background-color: #fafafa;
            border-top: 1px solid #eee;
        \}
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <!-- Cabeçalho da Página -->
        <div class="header">
            <div class="basketball-icon">🏀</div>
            <h1>Sua Opinião Vale Ouro!</h1>
            <p>Ajude a nossa Escolinha de Basquete a evoluir e enterrar os problemas.</p>
        </div>

        <!-- Formulário de Avaliação -->
        <!-- NOTA: Substitua o '#' no action pelo link do seu servidor ou serviço de formulários (ex: Formspree, Google Forms, etc) -->
        <form action="#" method="POST">
            
            <!-- Campo Nome -->
            <div class="form-group">
                <label for="name">Nome do Aluno ou Responsável:</label>
                <input type="text" id="name" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <!-- Campo E-mail -->
            <div class="form-group">
                <label for="email">E-mail de Contato:</label>
                <input type="email" id="email" name="email" placeholder="seu-email@exemplo.com" required>
            </div>

            <!-- Campo Categoria/Turma -->
            <div class="form-group">
                <label for="turma">Categoria / Turma:</label>
                <select id="turma" name="turma" required>
                    <option value="" disabled selected>Selecione a turma...</option>
                    <option value="sub-11">Sub-11 (Iniciante)</option>
                    <option value="sub-14">Sub-14 (Intermediário)</option>
                    <option value="sub-17">Sub-17 (Avançado)</option>
                    <option value="adulto">Adulto / Livre</option>
                </select>
            </div>

            <!-- Sistema de Notas por Estrelas -->
            <div class="form-group">
                <label>Sua nota geral para a escolinha:</label>
                <div class="rating-container">
                    <input type="radio" id="star5" name="avaliacao" value="5" required><label for="star5">★</label>
                    <input type="radio" id="star4" name="avaliacao" value="4"><label for="star4">★</label>
                    <input type="radio" id="star3" name="avaliacao" value="3"><label for="star3">★</label>
                    <input type="radio" id="star2" name="avaliacao" value="2"><label for="star2">★</label>
                    <input type="radio" id="star1" name="avaliacao" value="1"><label for="star1">★</label>
                </div>
            </div>

            <!-- Campo Feedback de Texto -->
            <div class="form-group">
                <label for="feedback">O que podemos melhorar? (Treinos, estrutura, professores...)</label>
                <textarea id="feedback" name="mensagem" placeholder="Deixe aqui suas críticas, elogios ou sugestões..." required></textarea>
            </div>

            <!-- Botão de Enviar -->
            <button type="submit" class="btn-submit">Enviar Avaliação</button>

        </form>

        <!-- Rodapé -->
        <div class="footer">
            &copy; 2026 Escolinha de Basquete. Todos os direitos reservados.
        </div>
    </div>

<script src="script.js"></script></body>
