OCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação - Escolinha de Basquete</title>
    <style>
        :root {
            --primary-color: #ff6600; /* Laranja Basquete */
            --secondary-color: #1a1a1a; /* Preto/Chumbo */
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        \}

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        \}

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        \}

        .container {
            background-color: var(--card-bg);
            max-width: 500px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border-top: 8px solid var(--primary-color);
        \}

        .header {
            background-color: var(--secondary-color);
            color: #ffffff;
            text-align: center;
            padding: 30px 20px;
            position: relative;
        \}

        .header h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        \}

        .header p {
            font-size: 14px;
            color: #ccc;
        \}

        .ball-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: inline-block;
        \}

        form {
            padding: 30px;
        \}

        .form-group {
            margin-bottom: 20px;
        \}

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        \}

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s ease;
            outline: none;
        \}

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary-color);
        \}

        .stars-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
        \}

        .stars-rating input {
            display: none;
        \}

        .stars-rating label {
            font-size: 30px;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s ease;
            margin-bottom: 0;
        \}

        .stars-rating input:checked ~ label,
        .stars-rating label:hover,
        .stars-rating label:hover ~ label {
            color: #ffcc00;
        \}

        textarea {
            resize: vertical;
            height: 100px;
        \}

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
        \}

        .btn-submit:hover {
            background-color: #e05500;
        \}

        .btn-submit:active {
            transform: scale(0.98);
        \}

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #888;
            background-color: #fafafa;
            border-top: 1px solid #eee;
        \}
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <div class="header">
            <div class="ball-icon">🏀</div>
            <h1>Sua Opinião Vale Ouro!</h1>
            <p>Ajude a nossa escolinha de basquete a melhorar cada vez mais.</p>
        </div>

        <!-- Você pode alterar o "action" se for integrar com algum sistema de envio de e-mails ou banco de dados -->
        <form id="evaluationForm" action="#" method="POST">
            
            <div class="form-group">
                <label for="name">Nome do Aluno (ou Responsável):</label>
                <input type="text" id="name" name="name" placeholder="Ex: João Silva" required>
            </div>

            <div class="form-group">
                <label for="category">Categoria / Turma:</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Selecione a turma...</option>
                    <option value="sub11">Sub-11 (Iniciante)</option>
                    <option value="sub14">Sub-14 (Intermediário)</option>
                    <option value="sub17">Sub-17 (Avançado)</option>
                    <option value="adulto">Adulto / Livre</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sua nota para os treinos e professores:</label>
                <div class="stars-rating">
                    <input type="radio" id="star5" name="rating" value="5" required><label for="star5">★</label>
                    <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                    <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                    <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                    <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
                </div>
            </div>

            <div class="form-group">
                <label for="comments">Deixe seu comentário ou sugestão:</label>
                <textarea id="comments" name="comments" placeholder="Conte-nos o que está achando da estrutura, dos professores e das aulas..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar Avaliação</button>
        </form>

        <div class="footer">
            © 2026 Escolinha de Basquete. Juntos rumo à cesta!
        </div>
    </div>

    <script>
        // Alerta simples para simular o envio (pode ser removido se usar um backend)
        document.getElementById('evaluationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Muito obrigado! Sua avaliação foi enviada com sucesso. 🏀');
            this.reset();
        \});
    </script>

<script src="script.js"></script></body>
