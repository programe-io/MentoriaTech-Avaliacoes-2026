
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: blue;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px;
            margin: 5px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <h1>Sistema de Estoque</h1>

    <h3>Cadastrar Produto</h3>

    <input type="number" id="codigo" placeholder="Código">
    <input type="text" id="descricao" placeholder="Descrição">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor">

    <br>

    <button onclick="cadastrar()">Cadastrar Produto</button>
    <button onclick="listar()">Listar Produtos</button>

    <h3>Alterar Produto</h3>

    <input type="number" id="codigoAlterar" placeholder="Código do produto">
    <input type="number" id="novoValor" placeholder="Novo valor">
    <button onclick="alterarValor()">Alterar Valor</button>

    <br>

    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">
    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    <h3>Produtos Cadastrados</h3>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
            </tr>
        </thead>

        <tbody id="lista">
        </tbody>
    </table>

    <script>

        let produtos = [];

        function cadastrar() {

            let codigo = Number(document.getElementById("codigo").value);
            let descricao = document.getElementById("descricao").value;
            let quantidade = Number(document.getElementById("quantidade").value);
            let valor = Number(document.getElementById("valor").value);

            let produto = {
                codigo: codigo,
                descricao: descricao,
                quantidade: quantidade,
                valor: valor
            };

            produtos.push(produto);

            alert("Produto cadastrado com sucesso!");

            listar();
        }

        function listar() {

            let tabela = document.getElementById("lista");

            tabela.innerHTML = "";

            for (let i = 0; i < produtos.length; i++) {

                tabela.innerHTML += `
                    <tr>
                        <td>${produtos[i].codigo}</td>
                        <td>${produtos[i].descricao}</td>
                        <td>${produtos[i].quantidade}</td>
                        <td>R$ ${produtos[i].valor.toFixed(2)}</td>
                    </tr>
                `;

            }
        }

        function alterarValor() {

            let codigo = Number(document.getElementById("codigoAlterar").value);
            let valor = Number(document.getElementById("novoValor").value);

            for (let i = 0; i < produtos.length; i++) {

                if (produtos[i].codigo == codigo) {

                    produtos[i].valor = valor;

                    alert("Valor alterado com sucesso!");

                    listar();

                    return;
                }
            }

            alert("Produto não encontrado!");
        }

        function alterarQuantidade() {

            let codigo = Number(document.getElementById("codigoAlterar").value);
            let quantidade = Number(document.getElementById("novaQuantidade").value);

            for (let i = 0; i < produtos.length; i++) {

                if (produtos[i].codigo == codigo) {

                    produtos[i].quantidade = quantidade;

                    alert("Quantidade alterada com sucesso!");

                    listar();

                    return;
                }
            }

            alert("Produto não encontrado!");
        }

    </script>

<script src="script.js"></script></body>
</html>
