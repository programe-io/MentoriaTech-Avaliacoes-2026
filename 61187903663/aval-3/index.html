
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- CABEÇALHO -->
    <header class="header">
        <div class="header-container">

            <h1>Instagram</h1>

            <div class="header-icons">
                <i class='bx bx-heart'></i>
                <i class='bx bx-message-rounded'></i>
                <i class='bx bx-menu'></i>
            </div>

        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main">

        <div class="feed">

            <!-- STORIES -->
            <section class="stories">

                <div class="stories-container">

                    <!-- ADICIONAR STORY -->
                    <div class="story">
                        <div class="story-circle add-story">
                            <div class="story-inner add-inner">
                                <span>+</span>
                            </div>
                        </div>
                        <span class="story-name">Seu story</span>
                    </div>

                    <!-- STORIES DOS USUÁRIOS -->
                    <div class="story">
                        <div class="story-circle">
                            <div class="story-inner">
                                <img src="https://i.pravatar.cc/150?img=12" alt="Perfil João">
                            </div>
                        </div>
                        <span class="story-name">joao</span>
                    </div>

                    <div class="story">
                        <div class="story-circle">
                            <div class="story-inner">
                                <img src="https://i.pravatar.cc/150?img=32" alt="Perfil Maria">
                            </div>
                        </div>
                        <span class="story-name">maria</span>
                    </div>

                    <div class="story">
                        <div class="story-circle">
                            <div class="story-inner">
                                <img src="https://i.pravatar.cc/150?img=45" alt="Perfil Pedro">
                            </div>
                        </div>
                        <span class="story-name">pedro</span>
                    </div>

                    <div class="story">
                        <div class="story-circle">
                            <div class="story-inner">
                                <img src="https://i.pravatar.cc/150?img=47" alt="Perfil Ana">
                            </div>
                        </div>
                        <span class="story-name">ana</span>
                    </div>

                    <div class="story">
                        <div class="story-circle">
                            <div class="story-inner">
                                <img src="https://i.pravatar.cc/150?img=11" alt="Perfil Lucas">
                            </div>
                        </div>
                        <span class="story-name">lucas</span>
                    </div>

                    <div class="story">
                        <div class="story-circle">
                            <div class="story-inner">
                                <img src="https://i.pravatar.cc/150?img=25" alt="Perfil Sofia">
                            </div>
                        </div>
                        <span class="story-name">sofia</span>
                    </div>

                </div>

            </section>

            <!-- PUBLICAÇÃO 1 -->
            <article class="post">

                <header class="post-header">

                    <div class="post-user">

                        <div class="post-profile">
                            <img src="https://i.pravatar.cc/150?img=12" alt="João">
                        </div>

                        <div class="user-info">
                            <strong>joao</strong>
                            <span>Teresina, PI</span>
                        </div>

                    </div>

                    <i class='bx bx-dots-horizontal-rounded'></i>

                </header>

                <div class="post-image">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900"
                         alt="Paisagem bonita">
                </div>

                <div class="post-actions">

                    <div class="left-actions">
                        <i class='bx bx-heart like-button'></i>
                        <i class='bx bx-message-rounded'></i>
                        <i class='bx bx-send'></i>
                    </div>

                    <i class='bx bx-bookmark'></i>

                </div>

                <div class="post-description">

                    <strong class="likes">1.250 curtidas</strong>

                    <p>
                        <strong>joao</strong>
                        Aproveitando cada momento! 🌎
                    </p>

                    <span>Ver todos os 35 comentários</span>

                    <small>HÁ 2 HORAS</small>

                </div>

            </article>

            <!-- PUBLICAÇÃO 2 -->
            <article class="post">

                <header class="post-header">

                    <div class="post-user">

                        <div class="post-profile">
                            <img src="https://i.pravatar.cc/150?img=32" alt="Maria">
                        </div>

                        <div class="user-info">
                            <strong>maria</strong>
                            <span>Brasil</span>
                        </div>

                    </div>

                    <i class='bx bx-dots-horizontal-rounded'></i>

                </header>

                <div class="post-image">
                    <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900"
                         alt="Paisagem ao amanhecer">
                </div>

                <div class="post-actions">

                    <div class="left-actions">
                        <i class='bx bx-heart like-button'></i>
                        <i class='bx bx-message-rounded'></i>
                        <i class='bx bx-send'></i>
                    </div>

                    <i class='bx bx-bookmark'></i>

                </div>

                <div class="post-description">

                    <strong class="likes">980 curtidas</strong>

                    <p>
                        <strong>maria</strong>
                        Um dia de cada vez! ❤️
                    </p>

                    <span>Ver todos os 20 comentários</span>

                    <small>HÁ 5 HORAS</small>

                </div>

            </article>

        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
