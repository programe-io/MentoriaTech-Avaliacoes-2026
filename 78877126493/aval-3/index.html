
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaMini</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topbar">
    <a href="#" class="logo">InstaMini</a>
    <input id="search" type="search" placeholder="Pesquisar pessoas...">
    <button id="home-btn" class="icon-btn" aria-label="Início">⌂</button>
  </header>

  <main class="layout">
    <section class="feed">
      <div class="stories panel">
        <div class="story">
          <div class="story-ring"><span>😊</span></div>
          <small>Seu story</small>
        </div>
        <div class="story">
          <div class="story-ring"><span>👩🏻</span></div>
          <small>Ana</small>
        </div>
        <div class="story">
          <div class="story-ring"><span>🧑🏽</span></div>
          <small>Lucas</small>
        </div>
        <div class="story">
          <div class="story-ring"><span>👩🏽</span></div>
          <small>Julia</small>
        </div>
        <div class="story">
          <div class="story-ring"><span>🧔🏻</span></div>
          <small>Pedro</small>
        </div>
      </div>

      <form class="create-post panel" id="post-form">
        <div class="avatar">V</div>
        <input id="post-text" maxlength="300"
          placeholder="Compartilhe algo..." required>
        <button class="publish-btn" type="submit">Publicar</button>
      </form>

      <div id="posts" class="posts"></div>
      <p id="empty" class="empty" hidden>Nenhuma publicação encontrada.</p>
    </section>

    <aside class="suggestions panel">
      <div class="profile-row">
        <div class="avatar">V</div>
        <div>
          <strong>visitante</strong>
          <small>Seu perfil</small>
        </div>
      </div>

      <h4>Sugestões para você</h4>

      <div class="suggestion">
        <div class="avatar purple">A</div>
        <div class="suggestion-info">
          <strong>ana.lifestyle</strong>
          <small>Para você</small>
        </div>
        <button class="follow-btn">Seguir</button>
      </div>

      <div class="suggestion">
        <div class="avatar orange">L</div>
        <div class="suggestion-info">
          <strong>lucas.dev</strong>
          <small>Popular</small>
        </div>
        <button class="follow-btn">Seguir</button>
      </div>

      <p class="footer-note">Sobre · Ajuda · Privacidade</p>
      <p class="footer-note">© <span id="year"></span> InstaMini</p>
    </aside>
  </main>

  <nav class="mobile-nav">
    <a href="#" aria-label="Início">⌂</a>
    <a href="#search" aria-label="Pesquisar">⌕</a>
    <a href="#post-text" aria-label="Criar publicação">＋</a>
    <a href="#posts" aria-label="Publicações">♡</a>
    <a href="#" aria-label="Perfil">☻</a>
  </nav>
<script src="script.js"></script></body>
</html>
