<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }
        .calculadora {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 250px;
        }
        #display {
            width: 100%;
            height: 40px;
            font-size: 1.2rem;
            text-align: right;
            margin-bottom: 10px;
            padding: 5px;
            box-sizing: border-box;
        }
        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        button {
            height: 45px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            background-color: #e0e0e0;
            border-radius: 5px;
        }
        button:hover {
            background-color: #d5d5d5;
        }
        .igual {
            grid-column: span 2;
            background-color: #4CAF50;
            color: white;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="calculadora">
        <input type="text" id="display" disabled>
        <div class="botoes">
            <button onclick="limpar()">C</button>
            <button onclick="inserir('/')">/</button>
            <button onclick="inserir('*')">*</button>
            <button onclick="inserir('-')">-</button>

            <button onclick="inserir('7')">7</button>
            <button onclick="inserir('8')">8</button>
            <button onclick="inserir('9')">9</button>
            <button onclick="inserir('+')">+</button>

            <button onclick="inserir('4')">4</button>
            <button onclick="inserir('5')">5</button>
            <button onclick="inserir('6')">6</button>

            <button onclick="inserir('1')">1</button>
            <button onclick="inserir('2')">2</button>
            <button onclick="inserir('3')">3</button>

            <button onclick="inserir('0')">0</button>
            <button onclick="inserir('.')">.</button>
            <button class="igual" onclick="calcular()">=</button>
        </div>
    </div>

    <script>
        function inserir(valor) {
            document.getElementById('display').value += valor;
        }

        function limpar() {
            document.getElementById('display').value = '';
        }

        function calcular() {
            var resultado = document.getElementById('display').value;
            if (resultado) {
                // eval calcula a expressão matemática em texto
                document.getElementById('display').value = eval(resultado);
            }
        }
    </script>

<script src="script.js"></script></body>
</html>
