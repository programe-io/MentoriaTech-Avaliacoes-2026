<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Completo HTML, CSS e JavaScript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            padding: 40px 20px;
        }
        .titulo-secao {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            color: #1a1a1a;
        }
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.1);
        }
        .card-banner {
            height: 140px;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
        }
        .card-conteudo {
            padding: 24px;
        }
        .card-conteudo h3 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: #1f2937;
        }
        .card-conteudo p {
            font-size: 0.95rem;
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .card-btn {
            display: inline-block;
            padding: 10px 18px;
            background-color: #4f46e5;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .card-btn:hover {
            background-color: #4338ca;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h2 class="titulo-secao">Painel Interativo</h2>

    <div class="grid-cards">
        <div class="card">
            <div class="card-banner"></div>
            <div class="card-conteudo">
                <h3>Contador de Cliques</h3>
                <p>Clique no botão abaixo para incrementar o contador interativo via JavaScript.</p>
                <button class="card-btn" id="btn-contador">Cliques: <span id="contador">0</span></button>
            </div>
        </div>

        <div class="card">
            <div class="card-banner" style="background: linear-gradient(135deg, #059669, #34d399);"></div>
            <div class="card-conteudo">
                <h3>Validação de E-mail</h3>
                <form id="meu-formulario">
                    <p>Digite seu e-mail para validar:</p>
                    <input type="text" id="email" placeholder="seu@email.com" style="padding: 8px; width: 100%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;">
                    <button type="submit" class="card-btn" style="background-color: #059669;">Enviar</button>
                    <span id="erro-msg" style="display: block; margin-top: 8px; font-size: 0.85rem;"></span>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Lógica do Contador
            let cliques = 0;
            const btnContador = document.getElementById("btn-contador");
            const spanContador = document.getElementById("contador");

            btnContador.addEventListener("click", function() {
                cliques++;
                spanContador.textContent = cliques;
            });

            // Lógica de Validação de Formulário
            const formulario = document.getElementById("meu-formulario");
            const campoEmail = document.getElementById("email");
            const mensagemErro = document.getElementById("erro-msg");

            formulario.addEventListener("submit", function(evento) {
                evento.preventDefault();
                const valorEmail = campoEmail.value.trim();
                const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!regexEmail.test(valorEmail)) {
                    mensagemErro.textContent = "Por favor, insira um e-mail válido.";
                    mensagemErro.style.color = "#ff4d4d";
                    campoEmail.style.borderColor = "#ff4d4d";
                } else {
                    mensagemErro.textContent = "Sucesso! E-mail enviado.";
                    mensagemErro.style.color = "#059669";
                    campoEmail.style.borderColor = "#059669";
                }
            });
        });
    </script>
<script src="script.js"></script></body>
</html>
