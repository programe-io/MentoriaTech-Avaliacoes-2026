
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- CABEÇALHO -->
    <header class="header">
        <div class="header-container">
            <h1>Instagram</h1>
            <button class="menu">
                <i class="bx bx-menu"></i>
            </button>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main">

        <div class="feed">

            <!-- STORIES -->
            <section class="stories">

                <div class="stories-list">

                    <!-- ADICIONAR STORY -->
                    <div class="story">
                        <div class="story-circle add-story">
                            <span>+</span>
                        </div>
                        <span class="story-name">Seu story</span>
                    </div>

                    <!-- STORY 1 -->
                    <div class="story">
                        <div class="story-circle gradient">
                            <img src="https://i.pravatar.cc/150?img=12" alt="Perfil João">
                        </div>
                        <span class="story-name">João</span>
                    </div>

                    <!-- STORY 2 -->
                    <div class="story">
                        <div class="story-circle gradient">
                            <img src="https://i.pravatar.cc/150?img=32" alt="Perfil Maria">
                        </div>
                        <span class="story-name">Maria</span>
                    </div>

                    <!-- STORY 3 -->
                    <div class="story">
                        <div class="story-circle gradient">
                            <img src="https://i.pravatar.cc/150?img=15" alt="Perfil Pedro">
                        </div>
                        <span class="story-name">Pedro</span>
                    </div>

                    <!-- STORY 4 -->
                    <div class="story">
                        <div class="story-circle gradient">
                            <img src="https://i.pravatar.cc/150?img=44" alt="Perfil Ana">
                        </div>
                        <span class="story-name">Ana</span>
                    </div>

                    <!-- STORY 5 -->
                    <div class="story">
                        <div class="story-circle gradient">
                            <img src="https://i.pravatar.cc/150?img=25" alt="Perfil Lucas">
                        </div>
                        <span class="story-name">Lucas</span>
                    </div>

                </div>
            </section>

            <!-- POSTAGEM -->
            <article class="post">

                <!-- CABEÇALHO DA POSTAGEM -->
                <div class="post-header">

                    <div class="post-user">
                        <div class="post-avatar">
                            <img src="https://i.pravatar.cc/150?img=12" alt="Foto do usuário">
                        </div>

                        <div>
                            <strong>joao.oficial</strong>
                            <p>São Paulo, Brasil</p>
                        </div>
                    </div>

                    <button class="more">
                        <i class="bx bx-dots-horizontal-rounded"></i>
                    </button>

                </div>

                <!-- IMAGEM DA POSTAGEM -->
                <div class="post-image">
                    <img src="https://picsum.photos/id/1015/800/800" alt="Paisagem">
                </div>

                <!-- AÇÕES DA POSTAGEM -->
                <div class="post-actions">
                    <div class="action-icons">
                        <i class="bx bx-heart"></i>
                        <i class="bx bx-message-rounded"></i>
                        <i class="bx bx-paper-plane"></i>
                    </div>

                    <i class="bx bx-bookmark"></i>
                </div>

                <!-- LEGENDA -->
                <div class="post-description">
                    <strong>joao.oficial</strong>
                    Aproveitando um dia incrível! 🌅
                    <p>Ver todos os 25 comentários</p>
                </div>

            </article>

        </div>

    </main>

</body>
</html>
