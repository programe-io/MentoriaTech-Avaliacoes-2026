<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Simples</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    \}
    .calculadora {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
      width: 250px;
    \}
    .visor {
      width: 100%;
      height: 40px;
      background: #222;
      color: #fff;
      font-size: 20px;
      text-align: right;
      padding: 5px 10px;
      box-sizing: border-box;
      margin-bottom: 15px;
      border-radius: 5px;
    \}
    .botoes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    \}
    button {
      padding: 15px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background: #e0e0e0;
      border-radius: 5px;
      transition: background 0.2s;
    \}
    button:hover {
      background: #d4d4d4;
    \}
    button.operador {
      background: #3498db;
      color: white;
    \}
    button.operador:hover {
      background: #2980b9;
    \}
    button.igual {
      background: #2ecc71;
      color: white;
      grid-column: span 2;
    \}
    button.igual:hover {
      background: #27ae60;
    \}
    button.limpar {
      background: #e74c3c;
      color: white;
      grid-column: span 2;
    \}
    button.limpar:hover {
      background: #c0392b;
    \}
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="calculadora">
    <div id="visor" class="visor">0</div>
    <div class="botoes">
      <button class="limpar" onclick="limparVisor()">C</button>
      <button class="operador" onclick="adicionar('/')">/</button>
      <button class="operador" onclick="adicionar('*')">*</button>
      
      <button onclick="adicionar('7')">7</button>
      <button onclick="adicionar('8')">8</button>
      <button onclick="adicionar('9')">9</button>
      <button class="operador" onclick="adicionar('-')">-</button>
      
      <button onclick="adicionar('4')">4</button>
      <button onclick="adicionar('5')">5</button>
      <button onclick="adicionar('6')">6</button>
      <button class="operador" onclick="adicionar('+')">+</button>
      
      <button onclick="adicionar('1')">1</button>
      <button onclick="adicionar('2')">2</button>
      <button onclick="adicionar('3')">3</button>
      <button class="igual" onclick="calcular()">=</button>
      
      <button onclick="adicionar('0')" style="grid-column: span 2;">0</button>
      <button onclick="adicionar('.')">.</button>
    </div>
  </div>

  <script>
    const visor = document.getElementById('visor');

    // Adiciona caracteres ao visor
    function adicionar(valor) {
      if (visor.textContent === '0' && valor !== '.') {
        visor.textContent = valor;
      \} else {
        visor.textContent += valor;
      \}
    \}

    // Limpa o visor
    function limparVisor() {
      visor.textContent = '0';
    \}

    // Realiza o cálculo matemático usando eval() para simplicidade
    function calcular() {
      try {
        visor.textContent = eval(visor.textContent);
      \} catch (erro) {
        visor.textContent = 'Erro';
      \}
    \}
  </script>

<script src="script.js"></script></body>
</html>$0
