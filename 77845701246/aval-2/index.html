
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>MeuFeed</h1>
        <span>🌐 Minha rede social</span>
    </header>

    <main>
        <section class="feed">

            <div class="new-post">
                <h2>O que você está pensando?</h2>

                <form id="postForm">
                    <textarea
                        id="postText"
                        placeholder="Compartilhe algo..."
                        required
                    ></textarea>

                    <button type="submit">Publicar</button>
                </form>
            </div>

            <div id="posts">

                <article class="post">
                    <div class="user">
                        <div class="avatar">A</div>
                        <div>
                            <h3>Ana Silva</h3>
                            <small>Há 10 minutos</small>
                        </div>
                    </div>

                    <p>Hoje é um ótimo dia para começar algo novo! 💜</p>

                    <div class="post-image image-one">
                        🌸
                    </div>

                    <button class="like-btn">♡ Curtir <span>12</span></button>
                </article>

                <article class="post">
                    <div class="user">
                        <div class="avatar">J</div>
                        <div>
                            <h3>João Pedro</h3>
                            <small>Há 30 minutos</small>
                        </div>
                    </div>

                    <p>Aproveitando cada momento! ☀️</p>

                    <div class="post-image image-two">
                        🌅
                    </div>

                    <button class="like-btn">♡ Curtir <span>8</span></button>
                </article>

            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 - MeuFeed | Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
