<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora online</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .background{
            background-image: url(https://images.template.net/567247/Kawaii-Cute-Background-Template-edit-online.webp);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            text-align: center;
        }
        h1{
            color: rgb(255, 251, 235);
            -webkit-text-stroke: 2px rgb(177, 126, 168);
        }
        .calculadora{
            position: absolute;
            background-image: url(https://illustlive.com/photo/iphone/110.png);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 20px;
            padding: 15px;
            outline: 4px solid rgb(255, 251, 235);
            text-align: center;
        }
        .botao{
            background-color: rgb(255, 251, 253);
            width: 50px;
            height: 50px;
            font-size: 30px;
            font-family: c'Comic Sans MS', cursive;
            cursor: pointer;
            border-color: rgb(78, 52, 74);
            color: rgb(172, 140, 167);
        }
        #resultado{
            background-color: rgb(255, 251, 235);
            width: 207px;
            height: 30px;
            margin: 5px;
            font-size: 30px;
            color:rgb(172, 140, 167);
            text-align: right;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
     <div class="background">
    <h1 class="top">CALCULADORA</h1>
        <div class="calculadora">
            <h1 class="down">calculadora</h1>
            <p id="resultado"></p>
            <table>
                <tr>
                    <td><button class="botao" onclick="clean()">C</button></td>
                    <td><button class="botao" onclick="back()"><</button></td>
                    <td><button class="botao" onclick="insert('/')">/</button></td>
                    <td><button class="botao" onclick="insert('*')">X</button></td>
                </tr>
                <tr>
                    <td><button class="botao" onclick="insert('7')">7</button></td>
                    <td><button class="botao" onclick="insert('9')">8</button></td>
                    <td><button class="botao" onclick="insert('9')">9</button></td>
                    <td><button class="botao" onclick="insert('-')">-</button></td>
                </tr>
                <tr>
                    <td><button class="botao" onclick="insert('4')">4</button></td>
                    <td><button class="botao" onclick="insert('5')">5</button></td>
                    <td><button class="botao" onclick="insert('6')">6</button></td>
                    <td><button class="botao" onclick="insert('+')">+</button></td>
                </tr>
                <tr>
                    <td><button class="botao" onclick="insert('3')">3</button></td>
                    <td><button class="botao" onclick="insert('2')">2</button></td>
                    <td><button class="botao" onclick="insert('1')">1</button></td>
                    <td rowspan="2"><button class="botao" style="height: 106px;" onclick="calcular('')">=</button></td>
                </tr>
                <tr>
                    <td colspan="2"><button class="botao" style="width: 106px;" onclick="insert('0')">0</button></td>
                    <td><button class="botao" onclick="insert('.')">.</button></td>
                </tr>
            </table>
        </div>
     </div>
     <script>
        function insert(num)
        {
            var numero = document.getElementById('resultado').innerHTML;
            document.getElementById('resultado').innerHTML = numero + num;
        }
        function clean()
        {
            document.getElementById('resultado').innerHTML = "";
        }
        function back()
        {
            var resultado = document.getElementById('resultado').innerHTML;
            document.getElementById('resultado').innerHTML = resultado.substring(0, resultado.length -1);
        }
        function calcular()
        {
             var resultado = document.getElementById('resultado').innerHTML;
             if(resultado){
                document.getElementById('resultado').innerHTML =  eval (resultado)
             }
        }
        window.addEventListener('keydown', function(event)
        {
            const tecla = event.key;
            if(/[0-9\/\*\-\+\.]/.test(tecla))
        {
            insert(tecla)
        }
        else if (tecla === 'Enter')
        {
            event.preventDefault();
            calcular();
        }
        else if (tecla === 'Backspace')
        {
            back();
        }
        else if(tecla === 'Delete' || tecla === 'Escape')
        {
            clean();
        }
        });
     </script>
     <footer>
        <h6>by:Helena C.</h6>
        <style>
            h6{
                color: rgb(255, 251, 235);
                background-color: rgb(250, 203, 242);
            }
            
        </style>
     </footer>
</body>
</html>
