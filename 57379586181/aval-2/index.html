<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEV LAB — o laboratório dos devs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="page" id="page-wrap">
    <div class="container">

      <!-- Header -->
      <header class="header">
        <div class="logo" id="logo-btn">
          <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6L4.5 18a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 9V3"/><path d="M7 15h10"/></svg>
          </div>
          <div>
            <span class="logo-title">DEV <span class="grad-text">LAB</span></span>
            <div class="logo-sub">o laboratório dos devs</div>
          </div>
        </div>
        <div class="header-icons">
          <span class="nav-icon active" title="Início"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
          <span class="nav-icon" title="Buscar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <span class="nav-icon" title="Notificações"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
          <span class="nav-icon" title="Mensagens"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
          <img id="header-avatar" class="avatar-img" style="width:36px;height:36px;margin-left:8px;cursor:pointer;" alt="Você">
        </div>
      </header>

      <div class="layout">

        <!-- Coluna central -->
        <main class="feed-col" id="feed-col">
          <div id="stories-bar" class="stories-bar"></div>
          <div id="story-viewer" class="story-viewer"></div>

          <!-- Composer -->
          <div class="composer">
            <div class="composer-inner">
              <img id="composer-avatar" class="avatar-img" style="width:44px;height:44px;" alt="Você">
              <div class="composer-right">
                <textarea id="composer-input" placeholder="Compartilhe uma ideia, uma dúvida ou uma conquista..." rows="2"></textarea>
                <div class="composer-footer">
                  <div class="composer-chips">
                    <span class="composer-chip">#tag</span>
                    <span class="composer-chip">Imagem</span>
                    <span class="composer-chip">Enquete</span>
                  </div>
                  <div class="composer-actions">
                    <span id="char-count">0/280</span>
                    <button id="publish-btn">Publicar</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div id="feed"></div>
        </main>

        <!-- Sidebar -->
        <aside class="sidebar">
          <div class="sidebar-card">
            <h3>Em alta</h3>
            <div id="trending-list"></div>
          </div>
          <div class="sidebar-card">
            <h3>Quem seguir</h3>
            <div id="suggest-list"></div>
          </div>
        </aside>

      </div>

      <footer class="footer">
        DEV LAB © 2026 · o laboratório dos devs · feito com HTML, CSS e JS puro
      </footer>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
<script src="script.js"></script></body>
</html>
