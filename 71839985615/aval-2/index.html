
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Meu Gerenciador de Tarefas</h1>
            <p>Organize suas atividades e aumente sua produtividade.</p>
        </header>

        <section class="dashboard">
            <div class="card">
                <h3>Total</h3>
                <span id="totalTasks">0</span>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <span id="pendingTasks">0</span>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <span id="completedTasks">0</span>
            </div>
        </section>

        <section class="task-form">
            <h2 id="formTitle">Adicionar nova tarefa</h2>

            <form id="taskForm">
                <input type="text" id="taskTitle"
                    placeholder="Nome da tarefa..." required>

                <textarea id="taskDescription"
                    placeholder="Descrição da tarefa..."></textarea>

                <div class="form-row">
                    <select id="taskPriority">
                        <option value="baixa">Prioridade baixa</option>
                        <option value="media" selected>Prioridade média</option>
                        <option value="alta">Prioridade alta</option>
                    </select>

                    <input type="date" id="taskDate">
                </div>

                <button type="submit" id="submitButton">
                    Adicionar tarefa
                </button>

                <button type="button" id="cancelEdit" hidden>
                    Cancelar edição
                </button>
            </form>
        </section>

        <section class="task-area">
            <div class="toolbar">
                <input type="search" id="searchTask"
                    placeholder="Pesquisar tarefa...">

                <select id="filterTasks">
                    <option value="todas">Todas</option>
                    <option value="pendentes">Pendentes</option>
                    <option value="concluidas">Concluídas</option>
                </select>

                <select id="filterPriority">
                    <option value="todas">Todas as prioridades</option>
                    <option value="alta">Alta</option>
                    <option value="media">Média</option>
                    <option value="baixa">Baixa</option>
                </select>
            </div>

            <div id="taskList"></div>

            <p id="emptyMessage">
                Nenhuma tarefa encontrada.
            </p>

            <button id="clearCompleted" class="clear-button">
                Excluir tarefas concluídas
            </button>
        </section>

        <footer>
            <p>Gerenciador de Tarefas © 2026</p>
        </footer>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
