<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produtos</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="pagina">
    <header class="cabecalho">
      <h1>Cadastro de Produtos</h1>
      <p>Exercício de validação, cadastro, listagem e atualização.</p>
    </header>

    <main class="conteudo">
      <section class="caixa">
        <h2>Novo produto</h2>
        <form id="formProduto" class="formulario">
          <label for="descricao">Descrição</label>
          <input id="descricao" placeholder="Mínimo 5 caracteres">

          <label for="quantidade">Quantidade</label>
          <input id="quantidade" type="number">

          <label for="valor">Valor</label>
          <input id="valor" type="number" step="0.01">

          <button type="submit">Cadastrar</button>
        </form>
      </section>

      <section class="caixa">
        <h2>Atualizar produto</h2>
        <div class="formulario">
          <label for="codigo">Código do produto</label>
          <input id="codigo" type="number">

          <label for="novoValor">Novo valor</label>
          <div class="linha">
            <input id="novoValor" type="number" step="0.01">
            <button type="button" id="btnValor">Atualizar valor</button>
          </div>

          <label for="novaQuantidade">Quantidade a somar</label>
          <div class="linha">
            <input id="novaQuantidade" type="number">
            <button type="button" id="btnQuantidade">Atualizar quantidade</button>
          </div>
        </div>
      </section>
    </main>

    <p class="mensagem" id="mensagem"></p>

    <section class="caixa tabela-caixa">
      <h2>Produtos cadastrados</h2>
      <table class="tabela">
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Quantidade</th>
            <th>Valor</th>
          </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
      </table>
      <p class="vazio" id="vazio">Nenhum produto cadastrado.</p>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
