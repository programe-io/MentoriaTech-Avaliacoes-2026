<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beacon Hills Forum - Teen Wolf</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho do Fórum -->
    <header>
        <div class="header-container">
            <h1>Beacon Hills <span>Forum</span></h1>
            <p>O ponto de encontro dos Alfas, Betas e Caçadores.</p>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="forum-container">
        
        <!-- Formulário para Criar Novo Tópico -->
        <section class="new-post-section">
            <h2>Criar Novo Tópico</h2>
            <form id="forum-form">
                <input type="text" id="user-name" placeholder="Seu nome (Ex: Scott McCall)" required>
                <input type="text" id="post-title" placeholder="Título do Tópico" required>
                <textarea id="post-content" placeholder="O que está acontecendo em Beacon Hills?" rows="4" required></textarea>
                <button type="submit">Postar no Fórum</button>
            </form>
        </section>

        <!-- Lista de Postagens -->
        <section class="posts-section">
            <h2>Discussões Recentes</h2>
            <div id="posts-container">
                <!-- Os posts criados via JavaScript aparecerão aqui -->
            </div>
        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
