<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Instagram Clone</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>Instagram</h1>
                                    <input type="text" placeholder="Pesquisar">
                                            <nav>
                                                        <a href="#">🏠</a>
                                                                    <a href="#">💬</a>
                                                                                <a href="#">❤️</a>
                                                                                            <a href="#">👤</a>
                                                                                                    </nav>
                                                                                                        </header>

                                                                                                            <main>

                                                                                                                    <section class="stories">
                                                                                                                                <div class="story">
                                                                                                                                                <img src="https://i.pravatar.cc/100?img=12" alt="Lucas">
                                                                                                                                                                <p>Seu story</p>
                                                                                                                                                                            </div>

                                                                                                                                                                                        <div class="story">
                                                                                                                                                                                                        <img src="https://i.pravatar.cc/100?img=32" alt="Ana">
                                                                                                                                                                                                                        <p>Ana</p>
                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                <div class="story">
                                                                                                                                                                                                                                                                <img src="https://i.pravatar.cc/100?img=15" alt="Pedro">
                                                                                                                                                                                                                                                                                <p>Pedro</p>
                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                        <div class="story">
                                                                                                                                                                                                                                                                                                                        <img src="https://i.pravatar.cc/100?img=25" alt="Maria">
                                                                                                                                                                                                                                                                                                                                        <p>Maria</p>
                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                    <section class="feed">

                                                                                                                                                                                                                                                                                                                                                                                <article class="post">
                                                                                                                                                                                                                                                                                                                                                                                                <div class="user">
                                                                                                                                                                                                                                                                                                                                                                                                                    <img src="https://i.pravatar.cc/100?img=32" alt="Ana">
                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong>ana.oficial</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <img class="post-img"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        src="https://picsum.photos/id/1011/600/500"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        alt="Paisagem de montanhas">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="curtir(this)">♡</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="comentar()">💬</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button>↗</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p class="likes">120 curtidas</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p><strong>ana.oficial</strong> Aproveitando o dia! 🌎</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </article>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <article class="post">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="user">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <img src="https://i.pravatar.cc/100?img=15" alt="Pedro">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <strong>pedro.games</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <img class="post-img"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    src="https://picsum.photos/id/1025/600/500"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alt="Fotografia de cachorro">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="curtir(this)">♡</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="comentar()">💬</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button>↗</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p class="likes">85 curtidas</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p><strong>pedro.games</strong> Meu melhor amigo! ❤️</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </article>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Instagram Clone - Projeto Educacional</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
