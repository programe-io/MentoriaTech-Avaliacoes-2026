<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockFlow — Controle de Estoque</title>
  <link rel="stylesheet" href="style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>📦 — Controle de Estoque</h1>
      </div>
      <div class="header-actions">
        <button class="btn-outline" onclick="exportarCSV()">📥 Exportar CSV</button>
        <button class="btn-outline" onclick="limparTudo()">🗑️ Limpar Estoque</button>
      </div>
    </header>

    <!-- Cards de Resumo -->
    <section class="cards">
      <div class="card">
        <span>Total de Produtos</span>
        <strong id="stat-produtos">0</strong>
      </div>
      <div class="card">
        <span>Unidades em Estoque</span>
        <strong id="stat-unidades">0</strong>
      </div>
      <div class="card">
        <span>Valor Total em Estoque</span>
        <strong id="stat-valor">R$ 0,00</strong>
      </div>
      <div class="card">
        <span>Estoque Baixo / Esgotado</span>
        <strong id="stat-critico" class="text-danger">0</strong>
      </div>
    </section>

    <!-- Formulário de Cadastro / Edição -->
    <section class="panel">
      <h2 id="form-titulo">➕ Cadastrar Novo Produto</h2>
      <form id="produto-form" class="form-grid">
        <input type="hidden" id="produto-id" />

        <div class="field">
          <label for="codigo">Código (SKU)</label>
          <input type="text" id="codigo" placeholder="Ex: PRD-001" required />
        </div>

        <div class="field">
          <label for="nome">Nome do Produto</label>
          <input type="text" id="nome" placeholder="Ex: Teclado Mecânico" required />
        </div>

        <div class="field">
          <label for="categoria">Categoria</label>
          <input type="text" id="categoria" placeholder="Ex: Periféricos" required />
        </div>

        <div class="field">
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" min="0" value="1" required />
        </div>

        <div class="field">
          <label for="minimo">Estoque Mínimo</label>
          <input type="number" id="minimo" min="0" value="5" required />
        </div>

        <div class="field">
          <label for="preco">Preço Unitário (R$)</label>
          <input type="number" id="preco" min="0" step="0.01" placeholder="0.00" required />
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn-primary" id="btn-salvar">Salvar Produto</button>
          <button type="button" class="btn-outline hidden" id="btn-cancelar" onclick="cancelarEdicao()">Cancelar</button>
        </div>
      </form>
      <span class="saved-indicator" id="status-salvo"></span>
    </section>

    <!-- Busca, Filtros e Tabela -->
    <section class="panel">
      <div class="filters">
        <input type="text" id="busca" placeholder="🔍 Buscar por nome ou código..." oninput="renderizarTabela()" />
        <select id="filtro-categoria" onchange="renderizarTabela()">
          <option value="">Todas as categorias</option>
        </select>
        <select id="filtro-status" onchange="renderizarTabela()">
          <option value="">Todos os status</option>
          <option value="ok">Em Estoque</option>
          <option value="low">Estoque Baixo</option>
          <option value="out">Esgotado</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Preço Unit.</th>
              <th>Quantidade</th>
              <th>Subtotal</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
