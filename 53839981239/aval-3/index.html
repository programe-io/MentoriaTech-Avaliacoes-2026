<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            instaRed: '#E1306C',
            instaPurple: '#833AB4',
            instaOrange: '#F56040',
            instaYellow: '#FCAF45'
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="styles.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body class="bg-black text-white antialiased min-h-screen flex flex-col md:flex-row font-sans transition-colors duration-200 selection:bg-rose-500 selection:text-white">

  <!-- BARRA DE NAVEGAÇÃO LATERAL (DESKTOP) -->
  <aside class="hidden md:flex flex-col justify-between w-16 lg:w-64 border-r border-zinc-800 p-4 fixed h-screen bg-black z-30">
    <div class="flex flex-col gap-6">
      <div class="px-2 pt-4">
        <h1 class="font-serif text-2xl font-bold tracking-wider hidden lg:block bg-gradient-to-r from-yellow-400 via-rose-500 to-purple-600 bg-clip-text text-transparent">Instagram</h1>
        <i class="fa-brands fa-instagram text-2xl lg:hidden"></i>
      </div>

      <nav class="flex flex-col gap-2">
        <button onclick="switchTab('feed')" class="flex items-center gap-4 p-3 rounded-lg hover:bg-zinc-900 transition text-left font-semibold">
          <i class="fa-solid fa-house text-xl"></i>
          <span class="hidden lg:inline">Página inicial</span>
        </button>
        <button class="flex items-center gap-4 p-3 rounded-lg hover:bg-zinc-900 transition text-left">
          <i class="fa-solid fa-magnifying-glass text-xl"></i>
          <span class="hidden lg:inline">Pesquisa</span>
        </button>
        <button class="flex items-center gap-4 p-3 rounded-lg hover:bg-zinc-900 transition text-left">
          <i class="fa-regular fa-compass text-xl"></i>
          <span class="hidden lg:inline">Explorar</span>
        </button>
        <button class="flex items-center gap-4 p-3 rounded-lg hover:bg-zinc-900 transition text-left">
          <i class="fa-solid fa-clapperboard text-xl"></i>
          <span class="hidden lg:inline">Reels</span>
        </button>
        <button class="flex items-center gap-4 p-3 rounded-lg hover:bg-zinc-900 transition text-left relative">
          <i class="fa-regular fa-paper-plane text-xl"></i>
          <span class="hidden lg:inline">Mensagens</span>
          <span class="absolute top-2 left-6 lg:left-[11rem] bg-rose-500 text-xs px-1.5 py-0.5 rounded-full font-bold">4</span>
        </button>
        <button class="flex items-center gap-4 p-3 rounded-lg hover:bg-zinc-900 transition text-left">
          <i class="fa-regular fa-heart text-xl"></i>
          <span class="hidden lg:inline">Notificações</span>
        </button>
        <button onclick="openCreateModal()" class="flex items-center gap-4 p-3 rounded-lg hover:bg-zinc-900 transition text-left">
          <i class="fa-regular fa-square-plus text-xl"></i>
          <span class="hidden lg:inline">Criar</span>
        </button>
        <button onclick="switchTab('profile')" class="flex items-center gap-4 p-3 rounded-lg hover:bg-zinc-900 transition text-left">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" class="w-6 h-6 rounded-full object-cover border border-zinc-700">
          <span class="hidden lg:inline font-semibold">Perfil</span>
        </button>
      </nav>
    </div>

    <div class="flex flex-col gap-2">
      <button onclick="toggleTheme()" class="flex items-center gap-4 p-3 rounded-lg hover:bg-zinc-900 transition text-left text-zinc-400 hover:text-white">
        <i class="fa-solid fa-moon text-xl" id="themeIcon"></i>
        <span class="hidden lg:inline">Alternar tema</span>
      </button>
      <button class="flex items-center gap-4 p-3 rounded-lg hover:bg-zinc-900 transition text-left text-zinc-400 hover:text-white">
        <i class="fa-solid fa-bars text-xl"></i>
        <span class="hidden lg:inline">Mais</span>
      </button>
    </div>
  </aside>

  <!-- NAVEGAÇÃO SUPERIOR MOBILE -->
  <header class="md:hidden flex items-center justify-between px-4 py-3 border-b border-zinc-800 sticky top-0 bg-black/90 backdrop-blur z-20">
    <h1 class="font-serif text-xl font-bold tracking-wider bg-gradient-to-r from-yellow-400 via-rose-500 to-purple-600 bg-clip-text text-transparent">Instagram</h1>
    <div class="flex items-center gap-4">
      <button onclick="openCreateModal()"><i class="fa-regular fa-square-plus text-xl"></i></button>
      <button><i class="fa-regular fa-heart text-xl"></i></button>
      <button><i class="fa-regular fa-paper-plane text-xl"></i></button>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 md:ml-16 lg:ml-64 flex justify-center pb-16 md:pb-0">
    
    <!-- ABA: FEED -->
    <div id="tab-feed" class="w-full max-w-xl py-4 px-2 sm:px-0 flex flex-col gap-6">
      
      <!-- CARROSSEL DE STORIES -->
      <section class="flex gap-4 overflow-x-auto p-4 border border-zinc-800 rounded-xl bg-zinc-950/50 scrollbar-none items-center">
        <div class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0" onclick="openCreateModal()">
          <div class="relative">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" class="w-16 h-16 rounded-full object-cover p-0.5 border-2 border-zinc-700">
            <span class="absolute bottom-0 right-0 bg-blue-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold border-2 border-black">+</span>
          </div>
          <span class="text-xs text-zinc-400 truncate w-16 text-center">Seu story</span>
        </div>
        <div id="storiesContainer" class="flex gap-4"></div>
      </section>

      <!-- FEED DE POSTS -->
      <section id="feedPosts" class="flex flex-col gap-6"></section>
    </div>

    <!-- ABA: PERFIL -->
    <div id="tab-profile" class="w-full max-w-4xl py-8 px-4 hidden">
      <!-- CABEÇALHO DO PERFIL -->
      <header class="flex flex-col sm:flex-row items-center sm:items-start gap-8 border-b border-zinc-800 pb-8">
        <div class="relative group cursor-pointer" onclick="openStory('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=80', 'seu_usuario')">
          <div class="w-28 h-28 sm:w-36 sm:h-36 rounded-full p-1 bg-gradient-to-tr from-yellow-500 via-rose-500 to-purple-600">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80" class="w-full h-full object-cover rounded-full border-4 border-black">
          </div>
        </div>
        
        <div class="flex-1 flex flex-col gap-4 text-center sm:text-left">
          <div class="flex flex-col sm:flex-row items-center gap-4">
            <h2 class="text-xl font-semibold">seu_usuario</h2>
            <div class="flex gap-2">
              <button class="px-4 py-1.5 bg-zinc-800 hover:bg-zinc-700 rounded-lg font-semibold text-sm transition">Editar perfil</button>
              <button class="px-4 py-1.5 bg-zinc-800 hover:bg-zinc-700 rounded-lg font-semibold text-sm transition">Ver itens salvos</button>
            </div>
          </div>

          <div class="flex justify-center sm:justify-start gap-8 text-sm">
            <div><strong id="profilePostCount">0</strong> publicações</div>
            <div><strong>1.240</strong> seguidores</div>
            <div><strong>380</strong> seguindo</div>
          </div>

          <div class="text-sm">
            <h1 class="font-bold">Ana Silva</h1>
            <p class="text-zinc-400">Criadora de Conteúdo & Fotógrafa 📸✨<br>São Paulo, SP 📍</p>
          </div>
        </div>
      </header>

      <!-- NAVEGAÇÃO DE GRID DO PERFIL -->
      <div class="flex justify-center gap-12 border-b border-zinc-800 text-xs font-semibold tracking-wider text-zinc-500">
        <button class="flex items-center gap-2 py-4 border-b border-white text-white"><i class="fa-solid fa-table-cells"></i> PUBLICAÇÕES</button>
        <button class="flex items-center gap-2 py-4 hover:text-white"><i class="fa-solid fa-clapperboard"></i> REELS</button>
        <button class="flex items-center gap-2 py-4 hover:text-white"><i class="fa-regular fa-bookmark"></i> SALVOS</button>
      </div>

      <!-- GRID DE FOTOS DO PERFIL -->
      <div id="profileGrid" class="grid grid-cols-3 gap-1 sm:gap-4 py-4"></div>
    </div>

  </main>

  <!-- NAVEGAÇÃO INFERIOR MOBILE -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-black/95 border-t border-zinc-800 flex justify-around py-3 z-20 backdrop-blur">
    <button onclick="switchTab('feed')" class="text-xl"><i class="fa-solid fa-house"></i></button>
    <button class="text-xl"><i class="fa-solid fa-magnifying-glass"></i></button>
    <button onclick="openCreateModal()" class="text-xl"><i class="fa-regular fa-square-plus"></i></button>
    <button class="text-xl"><i class="fa-solid fa-clapperboard"></i></button>
    <button onclick="switchTab('profile')">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" class="w-6 h-6 rounded-full object-cover border border-zinc-700">
    </button>
  </nav>

  <!-- MODAL DE CRIAÇÃO DE POST -->
  <div id="createModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl w-full max-w-lg overflow-hidden flex flex-col animate-scaleUp">
      <div class="flex justify-between items-center px-4 py-3 border-b border-zinc-800 font-semibold">
        <button onclick="closeCreateModal()" class="text-zinc-400 hover:text-white">Cancelar</button>
        <span>Criar nova publicação</span>
        <button onclick="submitNewPost()" class="text-blue-500 font-bold hover:text-blue-400">Compartilhar</button>
      </div>
      <div class="p-4 flex flex-col gap-4">
        <input type="text" id="postImgInput" placeholder="Cole a URL da Imagem aqui..." class="bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-zinc-500">
        <textarea id="postCaptionInput" rows="3" placeholder="Escreva uma legenda..." class="bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-zinc-500 resize-none"></textarea>
      </div>
    </div>
  </div>

  <!-- MODAL VISUALIZADOR DE STORY -->
  <div id="storyModal" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center hidden">
    <button onclick="closeStory()" class="absolute top-4 right-4 text-white text-2xl z-10"><i class="fa-solid fa-xmark"></i></button>
    <div class="relative w-full max-w-sm h-[80vh] bg-zinc-900 rounded-xl overflow-hidden flex flex-col justify-between">
      <!-- Barra de Progresso -->
      <div class="absolute top-0 left-0 right-0 p-3 bg-gradient-to-b from-black/80 to-transparent z-10 flex flex-col gap-2">
        <div class="w-full bg-zinc-700 h-1 rounded-full overflow-hidden">
          <div id="storyProgressBar" class="bg-white h-full w-0 transition-all duration-100 ease-linear"></div>
        </div>
        <div class="flex items-center gap-2">
          <img id="storyUserImg" class="w-8 h-8 rounded-full object-cover">
          <span id="storyUsername" class="text-sm font-semibold"></span>
        </div>
      </div>
      <!-- Imagem do Story -->
      <img id="storyImg" class="w-full h-full object-cover">
    </div>
  </div>

  <!-- MODAL DE DETALHES DO POST (QUANDO CLICADO NO PERFIL) -->
  <div id="postDetailModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
    <button onclick="closePostDetailModal()" class="absolute top-4 right-4 text-white text-2xl"><i class="fa-solid fa-xmark"></i></button>
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl max-w-3xl w-full flex flex-col md:flex-row overflow-hidden max-h-[80vh]">
      <div class="md:w-1/2 bg-black flex items-center justify-center">
        <img id="detailPostImg" class="w-full h-full object-cover max-h-[50vh] md:max-h-full">
      </div>
      <div class="md:w-1/2 p-4 flex flex-col justify-between">
        <div>
          <div class="flex items-center gap-3 border-b border-zinc-800 pb-3">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" class="w-8 h-8 rounded-full object-cover">
            <span class="font-semibold text-sm">seu_usuario</span>
          </div>
          <p id="detailPostCaption" class="text-sm py-4 text-zinc-300"></p>
        </div>
        <button onclick="deleteCurrentPost()" class="w-full py-2 bg-rose-600 hover:bg-rose-700 rounded-lg font-semibold text-sm transition mt-4">Excluir Publicação</button>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
