<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <h1>Gerenciador de Tarefas</h1>

    <!-- Mensagens de Feedback (Sucesso / Erro) -->
    <div id="mensagem" class="mensagem hidden"></div>

    <!-- Formulário de Cadastro -->
    <section class="card">
      <h2>Nova Tarefa</h2>
      <form id="form-tarefa">
        <div class="form-group">
          <label for="titulo">Título (mín. 5 caracteres):</label>
          <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript" required>
        </div>

        <div class="form-group">
          <label for="prioridade">Prioridade:</label>
          <select id="prioridade" required>
            <option value="1">1 - Alta</option>
            <option value="2" selected>2 - Média</option>
            <option value="3">3 - Baixa</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar Tarefa</button>
      </form>
    </section>

    <!-- Listagem de Tarefas -->
    <section class="card">
      <h2>Lista de Tarefas</h2>
      <div id="lista-tarefas" class="lista-tarefas">
        <!-- As tarefas serão renderizadas aqui via JavaScript -->
      </div>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
