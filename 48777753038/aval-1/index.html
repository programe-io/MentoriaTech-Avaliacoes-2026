<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Estoque - 2A TDS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef4f3;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #c8d5d3;
        }

        h1 {
            text-align: center;
            color: #145a52;
            margin-bottom: 30px;
        }

        h3 {
            color: #145a52;
            margin-top: 25px;
        }

        .formulario {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 11px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #16817a;
        }

        .btn-adicionar {
            width: 100%;
            padding: 11px;
            margin-top: 10px;
            background: #16817a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .btn-adicionar:hover {
            background: #0f665f;
        }

        .tabela-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #16817a;
            color: white;
        }

        tr:nth-child(even) {
            background: #f7fafa;
        }

        button {
            padding: 8px 10px;
            margin: 2px;
            border-radius: 5px;
            border: none;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .editar {
            background: #e09f3e;
        }

        .excluir {
            background: #c44536;
        }

        .mensagem-vazia {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .container {
                margin: 10px auto;
                padding: 15px;
            }

            h1 {
                font-size: 24px;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .btn-adicionar {
                margin-top: 5px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1>📋 Controle de Estoque - 2A TDS</h1>

        <h3>Novo Produto</h3>

        <div class="formulario">

            <input
                type="text"
                id="codigo"
                placeholder="Código"
            >

            <input
                type="text"
                id="descricao"
                placeholder="Descrição"
            >

            <input
                type="number"
                id="quantidade"
                placeholder="Quantidade"
                min="0"
            >

            <input
                type="number"
                id="valor"
                placeholder="Valor"
                min="0"
                step="0.01"
            >

        </div>

        <button
            class="btn-adicionar"
            onclick="cadastrarProduto()"
        >
            ➕ Adicionar Produto
        </button>

        <h3>Produtos em Estoque</h3>

        <div class="tabela-container">

            <table>

                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos"></tbody>

            </table>

        </div>

    </div>


    <script>

        // Carrega os produtos salvos no navegador
        let produtos = JSON.parse(
            localStorage.getItem("produtosEstoque")
        ) || [];


        // Salva os produtos no navegador
        function salvarProdutos() {

            localStorage.setItem(
                "produtosEstoque",
                JSON.stringify(produtos)
            );

        }


        // Cadastra um novo produto
        function cadastrarProduto() {

            const codigo =
                document.getElementById("codigo").value.trim();

            const descricao =
                document.getElementById("descricao").value.trim();

            const quantidade =
                Number(document.getElementById("quantidade").value);

            const valor =
                Number(document.getElementById("valor").value);


            if (
                codigo === "" ||
                descricao === "" ||
                quantidade < 0 ||
                valor < 0 ||
                isNaN(quantidade) ||
                isNaN(valor)
            ) {

                alert("Preencha todos os campos corretamente!");

                return;
            }


            const produto = {

                codigo: codigo,

                descricao: descricao,

                quantidade: quantidade,

                valor: valor

            };


            produtos.push(produto);


            salvarProdutos();

            limparCampos();

            listarProdutos();

        }


        // Mostra os produtos na tabela
        function listarProdutos() {

            const lista =
                document.getElementById("listaProdutos");


            lista.innerHTML = "";


            if (produtos.length === 0) {

                lista.innerHTML = `
                    <tr>
                        <td
                            colspan="5"
                            class="mensagem-vazia"
                        >
                            Nenhum produto cadastrado.
                        </td>
                    </tr>
                `;

                return;
            }


            produtos.forEach((produto, index) => {

                lista.innerHTML += `

                    <tr>

                        <td>
                            ${produto.codigo}
                        </td>

                        <td>
                            ${produto.descricao}
                        </td>

                        <td>
                            ${produto.quantidade}
                        </td>

                        <td>
                            R$ ${produto.valor.toFixed(2).replace(".", ",")}
                        </td>

                        <td>

                            <button
                                class="editar"
                                onclick="alterarValor(${index})"
                            >
                                💰 Alterar Valor
                            </button>

                            <button
                                class="editar"
                                onclick="alterarQuantidade(${index})"
                            >
                                📦 Alterar Quantidade
                            </button>

                            <button
                                class="excluir"
                                onclick="excluirProduto(${index})"
                            >
                                🗑️ Excluir
                            </button>

                        </td>

                    </tr>

                `;

            });

        }


        // Altera o valor do produto
        function alterarValor(index) {

            const novoValor =
                prompt(
                    "Informe o novo valor:"
                );


            if (
                novoValor !== null &&
                novoValor.trim() !== "" &&
                Number(novoValor) >= 0
            ) {

                produtos[index].valor =
                    Number(novoValor.replace(",", "."));


                salvarProdutos();

                listarProdutos();

            }

        }


        // Altera a quantidade
        function alterarQuantidade(index) {

            const novaQuantidade =
                prompt(
                    "Informe a nova quantidade:"
                );


            if (
                novaQuantidade !== null &&
                novaQuantidade.trim() !== "" &&
                Number(novaQuantidade) >= 0
            ) {

                produtos[index].quantidade =
                    Number(novaQuantidade);


                salvarProdutos();

                listarProdutos();

            }

        }


        // Exclui um produto
        function excluirProduto(index) {

            const confirmar =
                confirm(
                    "Deseja realmente remover este produto?"
                );


            if (confirmar) {

                produtos.splice(index, 1);

                salvarProdutos();

                listarProdutos();

            }

        }


        // Limpa os campos
        function limparCampos() {

            document.getElementById("codigo").value = "";

            document.getElementById("descricao").value = "";

            document.getElementById("quantidade").value = "";

            document.getElementById("valor").value = "";

        }


        // Exibe os produtos ao abrir a página
        listarProdutos();

    </script>

</body>
</html>
