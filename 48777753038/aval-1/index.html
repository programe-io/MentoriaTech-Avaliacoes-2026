<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Estoque - 2A TDS</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>📋 Controle de Estoque - 2A TDS</h1>

        <h3>Novo Produto</h3>

        <div class="formulario">

            <input
                type="text"
                id="codigo"
                placeholder="Código"
            >

            <input
                type="text"
                id="descricao"
                placeholder="Descrição"
            >

            <input
                type="number"
                id="quantidade"
                placeholder="Quantidade"
                min="0"
            >

            <input
                type="number"
                id="valor"
                placeholder="Valor"
                min="0"
                step="0.01"
            >

        </div>

        <button
            class="btn-adicionar"
            id="btnAdicionar"
        >
            ➕ Adicionar Produto
        </button>

        <h3>Produtos em Estoque</h3>

        <div class="tabela-container">

            <table>

                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos"></tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
