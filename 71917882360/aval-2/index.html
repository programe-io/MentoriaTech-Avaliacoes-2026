<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📝 Gerenciador de Tarefas (To-Do List)</h1>
    </header>

    <main class="container">
        
        <!-- Formulário de Cadastro -->
        <section class="card">
            <h2>Criar Nova Tarefa</h2>
            <form id="form-cadastro">
                <div class="form-group">
                    <label for="titulo">Título da Tarefa:</label>
                    <input type="text" id="titulo" placeholder="Ex: Estudar estruturas de dados em JavaScript" required>
                </div>
                <div class="form-group">
                    <label for="prioridade">Prioridade:</label>
                    <select id="prioridade" required>
                        <option value="BAIXA">Baixa</option>
                        <option value="MÉDIA" selected>Média</option>
                        <option value="ALTA">Alta</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-sucesso">Cadastrar Tarefa</button>
            </form>
        </section>

        <!-- Modificações Rápidas -->
        <section class="card">
            <h2>Alterar Prioridade</h2>
            <form id="form-prioridade" class="form-inline">
                <div class="form-group">
                    <input type="text" id="cod-tarefa" placeholder="Ex: TASK-0001" required>
                </div>
                <div class="form-group">
                    <select id="nova-prioridade" required>
                        <option value="BAIXA">Baixa</option>
                        <option value="MÉDIA">Média</option>
                        <option value="ALTA">Alta</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-alerta">Mudar Prioridade</button>
            </form>
        </section>

        <!-- Tabela de Tarefas -->
        <section class="card">
            <h2>Lista de Tarefas</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-tarefas">
                        <!-- Gerado via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
