<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Sistema de Controle de Estoque</h1>
    </header>

    <main class="container">
        
        <!-- Formulário de Cadastro -->
        <section class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-cadastro">
                <div class="form-group">
                    <label for="descricao">Descrição:</label>
                    <input type="text" id="descricao" placeholder="Ex: Notebook Gamer" required>
                </div>
                <div class="form-group row">
                    <div>
                        <label for="quantidade">Quantidade:</label>
                        <input type="number" id="quantidade" min="0" placeholder="0" required>
                    </div>
                    <div>
                        <label for="valor">Valor Unitário (R$):</label>
                        <input type="number" id="valor" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-sucesso">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Formulário de Atualizações -->
        <section class="card-grid">
            <div class="card">
                <h2>Atualizar Valor</h2>
                <form id="form-valor">
                    <div class="form-group">
                        <label for="cod-valor">Código do Produto:</label>
                        <input type="text" id="cod-valor" placeholder="PROD-0001" required>
                    </div>
                    <div class="form-group">
                        <label for="novo-valor">Novo Valor (R$):</label>
                        <input type="number" id="novo-valor" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>
                    <button type="submit" class="btn btn-alerta">Alterar Valor</button>
                </form>
            </div>

            <div class="card">
                <h2>Movimentar Estoque</h2>
                <form id="form-estoque">
                    <div class="form-group">
                        <label for="cod-estoque">Código do Produto:</label>
                        <input type="text" id="cod-estoque" placeholder="PROD-0001" required>
                    </div>
                    <div class="form-group">
                        <label for="qtd-movimento">Quantidade (Use negativo para saídas):</label>
                        <input type="number" id="qtd-movimento" placeholder="Ex: 5 ou -3" required>
                    </div>
                    <button type="submit" class="btn btn-info">Somar/Subtrair</button>
                </form>
            </div>
        </section>

        <!-- Lista de Produtos -->
        <section class="card">
            <h2>Produtos em Estoque</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor Unitário</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos">
                        <!-- Os produtos cadastrados via JS aparecerão aqui -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script href="script.js" src="script.js"></script>
<script src="script.js"></script></body>
</html>
