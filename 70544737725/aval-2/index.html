<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="todo-wrapper">
        <h1>Minhas Tarefas</h1>
        
        <!-- Área de Entrada de Nova Tarefa -->
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Digite uma nova tarefa..." required maxLength="60">
            <button type="submit" id="btn-adicionar">Adicionar</button>
        </form>

        <!-- Lista de Tarefas -->
        <ul id="lista-tarefas">
            <!-- As tarefas inseridas via JS aparecerão aqui dinamicamente -->
        </ul>

        <!-- Contador e Filtro básico -->
        <div class="footer-status">
            <span id="contador-tarefas">0 tarefas pendentes</span>
        </div>
    </div>
<script src="script.js"></script></body>
</html>
