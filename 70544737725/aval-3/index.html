<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação de Classes e Estilos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Modificador de Estilos Dinâmico</h1>

        <!-- Elemento Alvo que será modificado -->
        <div id="cartao-preview" class="cartao-base">
            <h2 id="texto-cartao">Texto de Exemplo</h2>
            <p>Este cartão muda de aparência dinamicamente usando JavaScript.</p>
        </div>

        <!-- Painel de Controles -->
        <div class="painel-controles">
            <h3>Controles via Alternância de Classes:</h3>
            <div class="grupo-botoes">
                <button id="btn-classe-tema">Alternar Modo Noturno</button>
                <button id="btn-classe-borda">Alternar Borda Arredondada</button>
                <button id="btn-classe-sombra">Alternar Sombra Ativa</button>
            </div>

            <h3>Controles via Estilos Diretos (Inline Styles):</h3>
            <div class="grupo-inputs">
                <div class="campo">
                    <label for="seletor-cor">Cor do Fundo:</label>
                    <input type="color" id="seletor-cor" value="#ffffff">
                </div>
                <div class="campo">
                    <label for="controle-fonte">Tamanho da Fonte:</label>
                    <input type="range" id="controle-fonte" min="16" max="36" value="24">
                </div>
            </div>
        </div>
    </div>
<script src="script.js"></script></body>
</html>
