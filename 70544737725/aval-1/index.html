<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Controle de Estoque</h1>
        
        <!-- Formulário de Cadastro -->
        <form id="form-produto">
            <div class="form-group">
                <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" required placeholder="Ex: Teclado Mecânico">
            </div>
            
            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="0" required placeholder="Ex: 15">
            </div>
            
            <div class="form-group">
                <label for="preco">Preço Unitário (R$):</label>
                <input type="number" id="preco" step="0.01" min="0" required placeholder="Ex: 199.90">
            </div>
            
            <button type="submit">Adicionar ao Estoque</button>
        </form>

        <!-- Tabela de Produtos -->
        <h2>Produtos Cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço Unitário</th>
                    <th>Total</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-estoque">
                <!-- Os produtos inseridos via JS aparecerão aqui -->
            </tbody>
        </table>
    </div>
<script src="script.js"></script></body>
</html>
