<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Projeto Tailwind</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

    <!-- Cabeçalho -->
    <header class="bg-blue-700 text-white p-6 text-center shadow-lg">
        <h1 class="text-3xl font-bold">
            Meu Site com Tailwind
        </h1>

        <p class="mt-2">
            Meu primeiro projeto usando Tailwind CSS
        </p>
    </header>


    <!-- Conteúdo -->
    <main class="max-w-2xl mx-auto p-6">

        <div class="bg-white p-6 mt-8 rounded-lg shadow-lg">

            <h2 class="text-2xl font-bold text-blue-700">
                Bem-vindo!
            </h2>

            <p class="mt-4 text-gray-600">
                Estou aprendendo a criar páginas utilizando
                HTML e Tailwind CSS.
            </p>

            <button
                class="mt-6 bg-blue-700 text-white font-bold px-6 py-2 rounded-lg shadow-lg hover:bg-blue-900">
                Clique aqui
            </button>

        </div>


        <div class="bg-white p-6 mt-6 rounded-lg shadow-lg">

            <h2 class="text-xl font-bold">
                Sobre mim
            </h2>

            <p class="mt-3 text-gray-600">
                Este é um exemplo de card criado apenas usando
                classes do Tailwind CSS.
            </p>

        </div>

    </main>


    <!-- Rodapé -->
    <footer class="bg-gray-900 text-white text-center p-5 mt-10">
        <p>© 2026 - Meu Site</p>
    </footer>

</body>

</html>
