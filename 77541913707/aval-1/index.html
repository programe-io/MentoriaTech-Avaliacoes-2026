<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>

        <!-- NOVA PUBLICAÇÃO -->
        <section class="new-post">

            <div class="user">
                <div class="avatar">G</div>

                <div>
                    <strong>Gabriel</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>

            <button>Publicar</button>

        </section>


        <!-- POSTAGEM 1 -->
        <article class="post">

            <div class="post-header">

                <div class="avatar">G</div>

                <div>
                    <strong>Gabriel</strong>
                    <span>há 10 minutos</span>
                </div>

            </div>

            <div class="post-text">
                <p>
                    Hoje comecei meu projeto de Mini Feed usando HTML e CSS! 🚀
                </p>
            </div>

            <img
                src="https://picsum.photos/700/400"
                alt="Imagem da publicação"
            >

            <div class="post-actions">
                <button>👍 Curtir</button>
                <button>💬 Comentar</button>
            </div>

        </article>


        <!-- POSTAGEM 2 -->
        <article class="post">

            <div class="post-header">

                <div class="avatar">J</div>

                <div>
                    <strong>João</strong>
                    <span>há 30 minutos</span>
                </div>

            </div>

            <div class="post-text">
                <p>
                    Aprendendo programação e criando meu primeiro site! 💻
                </p>
            </div>

            <img
                src="https://picsum.photos/700/401"
                alt="Imagem da publicação"
            >

            <div class="post-actions">
                <button>👍 Curtir</button>
                <button>💬 Comentar</button>
            </div>

        </article>

    </main>


    <footer>
        <p>© 2026 Mini Feed - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
