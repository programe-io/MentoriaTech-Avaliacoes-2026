<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

      <title>AutoTop — Loja de carros</title>

        <style>
            body {
                  margin: 0;
                        font-family: Arial, sans-serif;
                              background: #f2f4f7;
                                    color: #222;
                                        }

                                                                                                                                                                                              font-size: 48px;
                                                                                                                                                                                                  }

                                                                                                                                                                                                      .carro h2 {
                                                                                                                                                                                                            color: #14213d;
                                                                                                                                                                                                                }

                                                                                                                                                                                                                    .preco {

                                                                                                                                                                                                                                                                            background: #fca311;

                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                    <script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

                                                                                                                                                                                                                                                                                                                                                                                    <article class="carro">
