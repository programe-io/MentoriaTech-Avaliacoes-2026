<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Conecta — rede social fictícia</title>

        <style>
            body {
                  margin: 0;
                        font-family: Arial, sans-serif;
                              background: #f0f2f5;
                                    color: #222;
                                        }

                                            header {
                                                  background: #1877f2;
                                                        color: white;
                                                              padding: 16px;
                                                                    text-align: center;
                                                                        }

                                                                            main {
                                                                                  max-width: 600px;
                                                                                        margin: 24px auto;

                                                                                                  }

                                                                                                      .perfil, .publicacao {
                                                                                                            background: white;
                                                                                                                  border-radius: 12px;

                                                                                                                              margin-bottom: 16px;
                                                                                                                                    box-shadow: 0 2px 8px #00000012;
                                                                                                                                        }

                                                                                                                                            .avatar {
                                                                                                                                                  font-size: 42px;
                                                                                                                                                        margin-right: 10px;
                                                                                                                                                            }

                                                                                                                                                                .usuario {
                                                                                                                                                                      display: flex;
                                                                                                                                                                            align-items: center;
                                                                                                                                                                                }

                                                                                                                                                                                    .publicacao p {
                                                                                                                                                                                          line-height: 1.5;
                                                                                                                                                                                              }

                                                                                                                                                                                                  button {
                                                                                                                                                                                                        border: 0;
                                                                                                                                                                                                              border-radius: 8px;
                                                                                                                                                                                                                    padding: 10px 16px;
                                                                                                                                                                                                                          background: #e7f0ff;
                                                                                                                                                                                                                                color: #145dbf;
                                                                                                                                                                                                                                      cursor: pointer;

</head>

                                                                                                                                                                                                                                            <body>
                                                                                                                                                                                                                                              <header>

                                                                                                                                                                                                                                                          <main>

                                                                                                                                                                                                                                                                                    <div>
