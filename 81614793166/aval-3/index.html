<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Navbar Superior -->
    <header class="navbar">
        <div class="nav-wrapper">
            <h1 class="brand-logo">Instagram</h1>
            
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Pesquisar">
            </div>

            <nav class="nav-icons">
                <button class="icon-btn" id="openCreateModal" title="Criar post">➕</button>
                <button class="icon-btn" id="filterSavedBtn" title="Salvos">🔖</button>
                <img src="https://unsplash.com" alt="Perfil" class="nav-avatar">
            </nav>
        </div>
    </header>

    <!-- Layout Principal -->
    <main class="main-container">
        <!-- Coluna Esquerda: Stories + Feed -->
        <div class="feed-column">
            <!-- Barra de Stories -->
            <section class="stories-box" id="storiesContainer">
                <!-- Stories renderizados via JS -->
            </section>

            <!-- Posts do Feed -->
            <section id="postsContainer">
                <!-- Posts renderizados via JS -->
            </section>
        </div>

        <!-- Coluna Direita: Perfil e Sugestões (Desktop) -->
        <aside class="sidebar">
            <div class="user-profile-mini">
                <img src="https://unsplash.com" alt="Seu perfil">
                <div>
                    <strong>seu_usuario</strong>
                    <span>Explorador Digital</span>
                </div>
            </div>

            <div class="suggestions-header">
                <span>Sugestões para você</span>
            </div>

            <div id="suggestionsList" class="suggestions-list">
                <!-- Sugestões via JS -->
            </div>
        </aside>
    </main>

    <!-- Modal para Criar Nova Publicação -->
    <div id="createModal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Criar nova publicação</h3>
                <span class="close-modal" id="closeCreateModal">&times;</span>
            </div>
            <form id="createPostForm" class="modal-body">
                <label class="file-upload-label">
                    <input type="file" id="imageFileInput" accept="image/*" required>
                    <span>📁 Selecionar foto do dispositivo</span>
                </label>
                <img id="imagePreview" class="image-preview hidden" alt="Pré-visualização">
                <input type="text" id="postLocation" placeholder="Adicionar localização (opcional)">
                <textarea id="postCaption" rows="3" placeholder="Escreva uma legenda..." required></textarea>
                <button type="submit" class="btn-primary">Compartilhar</button>
            </form>
        </div>
    </div>

    <!-- Modal Visualizador de Stories -->
    <div id="storyModal" class="story-modal">
        <div class="story-viewer">
            <div class="story-progress-bar">
                <div id="storyProgressFill" class="story-progress-fill"></div>
            </div>
            <div class="story-viewer-header">
                <div class="story-user-info">
                    <img id="storyViewerAvatar" src="" alt="">
                    <strong id="storyViewerUser"></strong>
                </div>
                <span class="close-story" id="closeStoryModal">&times;</span>
            </div>
            <img id="storyViewerImage" src="" alt="Story" class="story-full-img">
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
