<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaSocial | Feed de Viagens</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <h1 class="logo">✈️ RotaSocial</h1>
            <div class="nav-tabs">
                <button class="tab-btn active" data-filter="all">Explorar</button>
                <button class="tab-btn" data-filter="saved">Salvos (<span id="savedCount">0</span>)</button>
            </div>
        </div>
    </header>

    <main class="feed-container">
        <!-- Formulário de Nova Postagem -->
        <section class="create-post-card">
            <h3>Compartilhe sua viagem</h3>
            <form id="postForm">
                <input type="text" id="locationInput" placeholder="📍 Destino (ex: Barra Grande, PI)" required>
                <input type="url" id="imageInput" placeholder="🖼️ URL da foto (opcional - deixaremos uma padrão se vazio)">
                <textarea id="captionInput" rows="2" placeholder="Como foi a experiência? Dê uma dica rápida..." required></textarea>
                <button type="submit" class="btn-publish">Publicar no Feed</button>
            </form>
        </section>

        <!-- Lista de Postagens do Feed -->
        <section id="feedList" class="feed-list">
            <!-- Posts renderizados via JS -->
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
