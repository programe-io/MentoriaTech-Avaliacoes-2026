<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizonte Aberto | Blog de Viagens</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="hero">
        <div class="container">
            <h1>Horizonte Aberto</h1>
            <p>Roteiros, dicas e histórias pelos cantos do mundo.</p>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar destino ou palavra-chave...">
            </div>
        </div>
    </header>

    <main class="container">
        <nav class="filters" id="filterButtons">
            <button class="filter-btn active" data-category="todos">Todos</button>
            <button class="filter-btn" data-category="brasil">Brasil</button>
            <button class="filter-btn" data-category="europa">Europa</button>
            <button class="filter-btn" data-category="asia">Ásia</button>
            <button class="filter-btn" data-category="dicas">Dicas</button>
        </nav>

        <section class="posts-grid" id="postsContainer">
            <!-- Os artigos serão inseridos aqui via JavaScript -->
        </section>
    </main>

    <!-- Modal para leitura do post completo -->
    <div id="postModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <img id="modalImage" src="" alt="Imagem do destino">
            <span id="modalCategory" class="tag"></span>
            <h2 id="modalTitle"></h2>
            <p class="modal-meta" id="modalMeta"></p>
            <div id="modalBody" class="modal-text"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Horizonte Aberto - Blog de Viagens. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
