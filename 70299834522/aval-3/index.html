<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gerenciamento de Estoque</title>
  <style>
    /* ==========================================================================
       ESTILOS (CSS)
       ========================================================================== */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --radius: 8px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--text-color);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .actions {
      margin-bottom: 1.5rem;
    }

    .btn {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .lista-container h2 {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    #lista-estoque {
      list-style: none;
    }

    #lista-estoque li {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 0.8rem 1rem;
      border-radius: var(--radius);
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .badge {
      background-color: var(--primary);
      color: #ffffff;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-right: 0.5rem;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h1>Sistema de Controle de Estoque</h1>

    <section class="actions">
      <button class="btn" onclick="listarProdutos()">Listar Produtos no Console</button>
    </section>

    <section class="lista-container">
      <h2>Produtos Cadastrados</h2>
      <ul id="lista-estoque">
        <!-- Itens inseridos pelo JavaScript -->
      </ul>
    </section>
  </div>

  <script>
    // ==========================================
    // LÓGICA DO SISTEMA (JAVASCRIPT)
    // ==========================================
    const produtos = [];
    let proximoCodigo = 1;

    // 1. Cadastrar produto
    function cadastrarProduto(descricao, quantidade, valor) {
      if (quantidade < 0) {
        throw new Error("A quantidade deve ser maior ou igual a zero.");
      }
      if (valor <= 0) {
        throw new Error("O valor deve ser maior que zero.");
      }

      const novoProduto = {
        codigo: proximoCodigo++,
        descricao: descricao,
        quantidade: quantidade,
        valor: valor
      };

      produtos.push(novoProduto);
      atualizarTela();
      return novoProduto;
    }

    // 2. Listar produtos no Console e na tela
    function listarProdutos() {
      console.log("--- Lista de Estoque ---");
      console.log(produtos);
      atualizarTela();
    }

    // 3. Atualizar valor
    function atualizarValor(codigoProduto, novoValor) {
      if (novoValor <= 0) {
        throw new Error("O valor deve ser maior que zero.");
      }

      const produto = produtos.find((prod) => prod.codigo === codigoProduto);

      if (produto) {
        produto.valor = novoValor;
        atualizarTela();
      } else {
        throw new Error("Produto não encontrado.");
      }
    }

    // 4. Atualizar quantidade
    function atualizarQuantidade(codigoProduto, novaQuantidade) {
      if (novaQuantidade < 0) {
        throw new Error("A quantidade deve ser maior ou igual a zero.");
      }

      const produto = produtos.find((prod) => prod.codigo === codigoProduto);

      if (produto) {
        produto.quantidade = novaQuantidade;
        atualizarTela();
      } else {
        throw new Error("Produto não encontrado.");
      }
    }

    // 5. Atualizar a exibição visual do HTML
    function atualizarTela() {
      const listaEl = document.getElementById("lista-estoque");
      if (!listaEl) return;

      listaEl.innerHTML = "";

      if (produtos.length === 0) {
        listaEl.innerHTML = "<li>Nenhum produto cadastrado.</li>";
        return;
      }

      produtos.forEach((p) => {
        const item = document.createElement("li");
        item.innerHTML = `
          <span><span class="badge">#${p.codigo}</span> ${p.descricao}</span>
          <span>Qtd: <strong>${p.quantidade}</strong> | R$ ${p.valor.toFixed(2)}</span>
        `;
        listaEl.appendChild(item);
      });
    }

    // ==========================================
    // EXECUÇÃO DOS TESTES INICIAIS
    // ==========================================

    // Cadastra os produtos iniciais
    cadastrarProduto("Cadeira Gamer", 12, 699.00);
    cadastrarProduto("Mouse Logi", 38, 99.00);

    // Aplica alterações de teste
    atualizarValor(2, 97.00);
    atualizarQuantidade(1, 10);
  </script>

<script src="script.js"></script></body>
</html>
