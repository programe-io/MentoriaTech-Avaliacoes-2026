<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gerenciamento de Estoque</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
    ul {
      margin-top: 10px;
    }
  </style>
<link href="style.css" rel="stylesheet"></head>
<body>

  <h1>Sistema de Estoque</h1>

  <section>
    <h2>Ações</h2>
    <button onclick="listarProdutos()">Listar Produtos no Console</button>
  </section>

  <section>
    <h2>Lista de Produtos</h2>
    <ul id="lista-estoque">
      <!-- Os produtos cadastrados serão inseridos aqui -->
    </ul>
  </section>

  <script>
    // ==========================================
    // ESTADO DO SISTEMA
    // ==========================================
    const produtos = [];
    let proximoCodigo = 1;

    // ==========================================
    // FUNÇÕES DE LÓGICA DO ESTOQUE
    // ==========================================

    // 1. Cadastrar um novo produto
    function cadastrarProduto(descricao, quantidade, valor) {
      if (quantidade < 0) {
        throw new Error("A quantidade deve ser maior ou igual a zero.");
      }
      if (valor <= 0) {
        throw new Error("O valor deve ser maior que zero.");
      }

      const novoProduto = {
        codigo: proximoCodigo++,
        descricao: descricao,
        quantidade: quantidade,
        valor: valor
      };

      produtos.push(novoProduto);
      atualizarInterfaceHTML();
      return novoProduto;
    }

    // 2. Listar produtos no Console do Navegador
    function listarProdutos() {
      console.log("--- Lista de Estoque ---");
      console.log(produtos);
    }

    // 3. Atualizar o valor de um produto pelo código
    function atualizarValor(codigoProduto, novoValor) {
      if (novoValor <= 0) {
        throw new Error("O valor deve ser maior que zero.");
      }

      const produto = produtos.find((prod) => prod.codigo === codigoProduto);

      if (produto) {
        produto.valor = novoValor;
        atualizarInterfaceHTML();
      } else {
        throw new Error("Produto não encontrado.");
      }
    }

    // 4. Atualizar a quantidade de um produto pelo código
    function atualizarQuantidade(codigoProduto, novaQuantidade) {
      if (novaQuantidade < 0) {
        throw new Error("A quantidade deve ser maior ou igual a zero.");
      }

      const produto = produtos.find((prod) => prod.codigo === codigoProduto);

      if (produto) {
        produto.quantidade = novaQuantidade;
        atualizarInterfaceHTML();
      } else {
        throw new Error("Produto não encontrado.");
      }
    }

    // 5. Função auxiliar para renderizar a lista na tela (HTML)
    function atualizarInterfaceHTML() {
      const listaEl = document.getElementById("lista-estoque");
      if (!listaEl) return;

      listaEl.innerHTML = "";
      produtos.forEach((p) => {
        const item = document.createElement("li");
        item.textContent = `[#${p.codigo}] ${p.descricao} - Qtd: ${p.quantidade} | R$ ${p.valor.toFixed(2)}`;
        listaEl.appendChild(item);
      });
    }

    // ==========================================
    // EXECUÇÃO E TESTES INICIAIS
    // ==========================================

    // Cadastrando produtos para inicializar o sistema
    cadastrarProduto("Cadeira Gamer", 12, 699.00);
    cadastrarProduto("Mouse Logi", 38, 99.00);

    // Alterando valores/quantidades de teste
    atualizarValor(2, 97.00);
    atualizarQuantidade(1, 10);
  </script>

<script src="script.js"></script></body>
</html>
