<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <div class="header-container">
            <div class="search-bar">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar publicações...">
            </div>
            <nav>
                <button class="nav-btn active" data-tab="feed">Feed</button>
                <button class="nav-btn" data-tab="profile">Perfil</button>
            </nav>
        </div>
    </header>

    <main>
        <section id="profileSection" class="profile-card hidden">
            <div class="profile-info">
                <div class="avatar-lg">K</div>
                <div>
                    <h2>Julia Fernandes</h2>
                    <p>@juliafernandes • Desenvolvedora Fullstack</p>
                </div>
            </div>
            <div class="profile-stats">
                <span id="postCount">0</span>
                <label>Posts</label>
            </div>
        </section>

        <section class="composer">
            <div class="composer-user">
                <div class="avatar">K</div>
                <div class="composer-input-area">
                    <textarea id="postText" placeholder="O que está acontecendo?"></textarea>
                    <div id="imagePreviewContainer" class="image-preview hidden">
                        <img id="imagePreview" src="" alt="Preview">
                        <button id="removeImage"><i data-lucide="x"></i></button>
                    </div>
                    <div class="composer-actions">
                        <label class="action-btn">
                            <i data-lucide="image"></i>
                            <span>Foto</span>
                            <input type="file" id="fileInput" accept="image/*" hidden>
                        </label>
                        <button id="publishBtn" disabled>Publicar</button>
                    </div>
                </div>
            </div>
        </section>

        <div id="feed"></div>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
