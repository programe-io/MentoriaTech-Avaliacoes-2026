<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
   <div class="container">
        <h1>Calculadora de IMC</h1>
        <p class="subtitulo">Avaliação do Índice de Massa Corporal</p>

        <form id="formIMC">

            <label for="nome">Nome do paciente:</label>
            <input type="text" id="nome"
                   placeholder="Digite o nome do paciente"
                   required>

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso"
                   placeholder="Ex: 70"
                   step="0.1" min="0.1" required>

            <label for="altura">Altura (m):</label>
            <input type="number" id="altura"
                   placeholder="Ex: 1.75"
                   step="0.01" min="0.1" required>

            <button type="submit">Calcular IMC</button>

        </form>

        <div id="resultado" class="resultado" hidden>
            <h2>Resultado do Paciente</h2>

            <p><strong>Paciente:</strong> <span id="resNome"></span></p>
            <p><strong>IMC:</strong> <span id="resIMC"></span></p>
            <p><strong>Classificação:</strong>
                <span id="classificacao"></span>
            </p>

            <div class="informacao">
                <h3>Informações sobre o IMC</h3>
                <p id="descricao"></p>
            </div>

            <p class="aviso">
                O IMC é uma ferramenta de triagem e não substitui
                uma avaliação individual realizada por um profissional
                de saúde.
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
  <script src="script.js"></script>
  
</body>
</html>
