<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Cadastro e controle de produtos</p>
    </header>

    <main>

        <section class="card">
            <h2>Cadastrar Produto</h2>

            <input type="text" id="descricao" placeholder="Descrição do produto">

            <input type="number" id="quantidade" placeholder="Quantidade" min="1">

            <input type="number" id="valor" placeholder="Valor" min="0" step="0.01">

            <button onclick="cadastrarProduto()">Cadastrar Produto</button>
        </section>

        <section class="card">
            <h2>Atualizar Produto</h2>

            <input type="number" id="codigoAtualizar" placeholder="Código do produto">

            <input type="number" id="novoValor" placeholder="Novo valor" min="0" step="0.01">

            <button onclick="atualizarValor()">Alterar Valor</button>

            <input type="number" id="novaQuantidade" placeholder="Quantidade a adicionar" min="1">

            <button onclick="atualizarQuantidade()">Adicionar Estoque</button>
        </section>

        <section class="card">
            <h2>Produtos Cadastrados</h2>

            <div id="mensagem"></div>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                </tbody>
            </table>
        </section>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
