
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Calculadora de IMC</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <div class="container">
                            <h1>Calculadora de IMC</h1>

                                    <form id="formulario">
                                                <input type="text" id="nome"
                                                                placeholder="Nome da pessoa" required>

                                                                            <input type="number" id="peso"
                                                                                            placeholder="Peso em kg" min="0.1" step="0.1" required>

                                                                                                        <input type="number" id="altura"
                                                                                                                        placeholder="Altura em metros" min="0.1" step="0.01" required>

                                                                                                                                    <button type="submit">Calcular IMC</button>
                                                                                                                                            </form>

                                                                                                                                                    <button id="modoBtn" type="button">
                                                                                                                                                                Alternar modo escuro
                                                                                                                                                                        </button>

                                                                                                                                                                                <h2>Resultados</h2>

                                                                                                                                                                                        <div class="tabela-container">
                                                                                                                                                                                                    <table>
                                                                                                                                                                                                                    <thead>
                                                                                                                                                                                                                                        <tr>
                                                                                                                                                                                                                                                                <th>Nome</th>
                                                                                                                                                                                                                                                                                        <th>Peso</th>
                                                                                                                                                                                                                                                                                                                <th>Altura</th>
                                                                                                                                                                                                                                                                                                                                        <th>IMC</th>
                                                                                                                                                                                                                                                                                                                                                                <th>Status</th>
                                                                                                                                                                                                                                                                                                                                                                                    </tr>
                                                                                                                                                                                                                                                                                                                                                                                                    </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                    <tbody id="resultados"></tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                <p class="aviso">
                                                                                                                                                                                                                                                                                                                                                                                                                                                            O IMC é um indicador geral. Para crianças e adolescentes,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        sua interpretação depende da idade e do sexo, e deve ser
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    feita com orientação de um profissional de saúde.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
