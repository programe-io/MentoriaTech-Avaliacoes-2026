<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batman • Instagram</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="instagram">

        <!-- CABEÇALHO -->
        <header class="topo">
            <h2>Instagram</h2>
            <div class="icones">
                <span>♡</span>
                <span>✉</span>
            </div>
        </header>

        <!-- PERFIL -->
        <section class="perfil">

            <div class="perfil-superior">

                <img class="foto-perfil"
                src="Char_Thumb_Batman_20190116_5c3fc4b40fae42.85141247.avif"
                alt="Batman">

                <div class="estatisticas">
                    <div>
                        <strong>247</strong>
                        <span>Publicações</span>
                    </div>

                    <div>
                        <strong>18,5M</strong>
                        <span>Seguidores</span>
                    </div>

                    <div>
                        <strong>0</strong>
                        <span>Seguindo</span>
                    </div>
                </div>

            </div>

            <!-- BIOGRAFIA -->
            <div class="biografia">
                <strong>Batman 🦇</strong>
                <p>Herói de Gotham City</p>
                <p>Protetor da cidade durante a noite.</p>
                <p>Eu sou a vingança. Eu sou a noite.</p>
                <a href="#">www.wayneenterprises.com</a>
            </div>

            <!-- BOTÕES -->
            <div class="botoes">
                <button class="seguir" onclick="seguir()">Seguir</button>
                <button>Mensagem</button>
                <button>Contato</button>
            </div>

        </section>

        <!-- DESTAQUES -->
        <section class="destaques">

            <div class="destaque">
                <img src="batman-são-paulo-e1623164229482-1024x632.jpeg" alt="Batman">
                <span>Gotham</span>
            </div>
            <div class="destaque">
                <img src="Batman_na_Chuva.webp" alt="Batman">
                <span>Missões</span>
            </div>

            <div class="destaque">
                <img src="Batman_na_Chuva.webp" alt="Batman">
                <span>Arquivo</span>
            </div>

        </section>

        <!-- ABAS -->
        <nav class="abas">
            <span class="ativa">▦</span>
            <span>▣</span>
            <span>♙</span>
        </nav>

        <!-- PUBLICAÇÕES -->
        <section class="feed">

            <article class="post">
                <img src="batman-são-paulo-e1623164229482-1024x632.jpeg" alt="Batman">
            </article>

            <article class="post">
                <img src="42dd07afaf2407d986e1d0552d5d1436.jpg" alt="Batman">
            </article>

            <article class="post">
                <img src="Batman_na_Chuva.webp" alt="Batman">
            </article>

            <article class="post">
                <img src="batman-são-paulo-e1623164229482-1024x632.jpeg" alt="Batman">
            </article>

            <article class="post">
                <img src="batman.jpg" alt="Batman">
            </article>

            <article class="post">
                <img src="imagem.batman.jpg" alt="Batman">
            </article>

        </section>

    </main>

    <script>
        function seguir() {
            const botao = document.querySelector(".seguir");

            if (botao.innerText === "Seguir") {
                botao.innerText = "Seguindo";
            } else {
                botao.innerText = "Seguir";
            }
        }
    </script>

</body>
</html>
