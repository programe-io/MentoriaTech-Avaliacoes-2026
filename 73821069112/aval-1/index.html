<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque & CRUD</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Controle de Estoque</h1>
            <p>Gerenciamento simplificado de produtos em JavaScript</p>
        </header>

        <div class="grid">
            <!-- Painel Lateral: Cadastro -->
            <div class="card">
                <h2>Cadastrar Produto</h2>
                
                <!-- Divs para mensagens de feedback -->
                <div id="form-alert" class="alert alert-danger"></div>
                <div id="form-success" class="alert alert-success"></div>

                <form id="produto-form">
                    <div class="form-group">
                        <label for="descricao">Descrição (mín. 5 caract.)</label>
                        <input type="text" id="descricao" placeholder="Ex: Cadeira Gamer" required>
                    </div>
                    <div class="form-group">
                        <label for="quantidade">Quantidade Inicial</label>
                        <input type="number" id="quantidade" placeholder="Ex: 10" required>
                    </div>
                    <div class="form-group">
                        <label for="valor">Preço Unitário (R$)</label>
                        <input type="number" id="valor" step="0.01" placeholder="Ex: 599.90" required>
                    </div>
                    <button type="submit">Adicionar ao Estoque</button>
                </form>
            </div>

            <!-- Painel Principal: Listagem -->
            <div class="card">
                <h2>Produtos em Estoque</h2>
                <div class="table-container">
                    <table id="produtos-tabela">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descrição</th>
                                <th>Qtd. Estoque</th>
                                <th>Preço Unitário</th>
                                <th style="text-align: right;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-produtos-body">
                            <!-- Inserido dinamicamente via JS -->
                        </tbody>
                    </table>
                    <div id="empty-msg" class="empty-state">Nenhum produto cadastrado no momento.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script carregado no final para garantir a leitura do DOM -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
