  <!DOCTYPE html>

    <title>Projeto Pronto</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; \}
        #botao { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; \}
    </style>
</head>
<body>

    <h1 id="titulo">Olá, Mundo!</h1>
    <button id="botao">Clique Aqui</button>

    <script>
        document.getElementById('botao').onclick = () => {
            document.getElementById('titulo').innerText = 'Pronto!';
        \};
    </script>
</body>$0
