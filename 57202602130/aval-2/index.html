<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Sistema de Estoque</h1>
        <p>Cadastro e controle de produtos</p>
    </header>

    <main>

        <!-- CADASTRO DE PRODUTO -->
        <section class="card">

            <h2>Cadastrar Produto</h2>

            <form id="formCadastro">

                <label for="descricao">
                    Descrição
                </label>

                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex: Cadeira Gamer"
                >

                <label for="quantidade">
                    Quantidade
                </label>

                <input
                    type="number"
                    id="quantidade"
                    placeholder="Ex: 10"
                    min="1"
                >

                <label for="valor">
                    Valor
                </label>

                <input
                    type="number"
                    id="valor"
                    placeholder="Ex: 699.90"
                    min="0"
                    step="0.01"
                >

                <button type="submit">
                    Cadastrar Produto
                </button>

            </form>

            <p id="mensagemCadastro"></p>

        </section>


        <!-- LISTAGEM -->
        <section class="card">

            <h2>Produtos Cadastrados</h2>

            <table>

                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                </tbody>

            </table>

        </section>


        <!-- ATUALIZAR VALOR -->
        <section class="card">

            <h2>Atualizar Valor</h2>

            <form id="formValor">

                <label for="codigoValor">
                    Código do Produto
                </label>

                <input
                    type="number"
                    id="codigoValor"
                    placeholder="Ex: 1"
                    min="1"
                >

                <label for="novoValor">
                    Novo Valor
                </label>

                <input
                    type="number"
                    id="novoValor"
                    placeholder="Ex: 599.90"
                    min="0"
                    step="0.01"
                >

                <button type="submit">
                    Atualizar Valor
                </button>

            </form>

            <p id="mensagemValor"></p>

        </section>


        <!-- ATUALIZAR QUANTIDADE -->
        <section class="card">

            <h2>Adicionar Quantidade</h2>

            <form id="formQuantidade">

                <label for="codigoQuantidade">
                    Código do Produto
                </label>

                <input
                    type="number"
                    id="codigoQuantidade"
                    placeholder="Ex: 1"
                    min="1"
                >

                <label for="novaQuantidade">
                    Quantidade a adicionar
                </label>

                <input
                    type="number"
                    id="novaQuantidade"
                    placeholder="Ex: 5"
                    min="1"
                >

                <button type="submit">
                    Adicionar ao Estoque
                </button>

            </form>

            <p id="mensagemQuantidade"></p>

        </section>

    </main>

    <footer>
        <p>Sistema de Estoque - JavaScript</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
