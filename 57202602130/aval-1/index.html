<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <h1>Sistema de Estoque</h1>

        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: Cadeira Gamer"
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        placeholder="Ex: 10"
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input
                        type="number"
                        id="valor"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 699.90"
                    >
                </div>

                <button type="submit">Cadastrar Produto</button>

            </form>

            <p id="mensagem"></p>
        </section>


        <section class="card">
            <h2>Produtos Cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Produtos serão inseridos pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>


        <section class="card">
            <h2>Atualizar Valor</h2>

            <form id="formValor">

                <div class="campo">
                    <label for="codigoValor">Código do Produto</label>
                    <input
                        type="number"
                        id="codigoValor"
                        min="1"
                        placeholder="Ex: 1"
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">Novo Valor</label>
                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 599.90"
                    >
                </div>

                <button type="submit">Atualizar Valor</button>

            </form>

            <p id="mensagemValor"></p>
        </section>


        <section class="card">
            <h2>Adicionar Quantidade</h2>

            <form id="formQuantidade">

                <div class="campo">
                    <label for="codigoQuantidade">Código do Produto</label>
                    <input
                        type="number"
                        id="codigoQuantidade"
                        min="1"
                        placeholder="Ex: 1"
                    >
                </div>

                <div class="campo">
                    <label for="novaQuantidade">Quantidade a Adicionar</label>
                    <input
                        type="number"
                        id="novaQuantidade"
                        min="1"
                        placeholder="Ex: 5"
                    >
                </div>

                <button type="submit">Adicionar ao Estoque</button>

            </form>

            <p id="mensagemQuantidade"></p>
        </section>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
