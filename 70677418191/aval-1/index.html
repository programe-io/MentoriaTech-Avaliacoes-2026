
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Controle de Produtos</h1>

        <h2>Cadastrar Produto</h2>

        <form id="formProduto">

            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" required>

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" min="1" required>

            <label for="valor">Valor (R$):</label>
            <input type="number" id="valor" min="0" step="0.01" required>

            <button type="submit">Cadastrar Produto</button>

        </form>

        <p id="mensagem"></p>

        <h2>Lista de Produtos</h2>

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                </tr>
            </thead>

            <tbody id="listaProdutos">
            </tbody>
        </table>

        <h2>Atualizar Valor</h2>

        <div class="atualizacao">

            <input type="number" id="codigoValor" placeholder="Código do produto" min="1">

            <input type="number" id="novoValor" placeholder="Novo valor" min="0" step="0.01">

            <button type="button" id="btnValor">Atualizar Valor</button>

        </div>

        <h2>Adicionar ao Estoque</h2>

        <div class="atualizacao">

            <input type="number" id="codigoQuantidade" placeholder="Código do produto" min="1">

            <input type="number" id="novaQuantidade" placeholder="Quantidade" min="1">

            <button type="button" id="btnQuantidade">Adicionar</button>

        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
