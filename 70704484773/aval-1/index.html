<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Produtos</title>

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Gerenciamento de Produtos</h1>
        <p>Cadastre e controle seus produtos em um só lugar.</p>
    </header>

    <main>
        <!-- Cadastro de produtos -->
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="descricao">Descrição do produto</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex.: Cadeira Gamer"
                        minlength="5"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        placeholder="Ex.: 12"
                        min="1"
                        step="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input
                        type="number"
                        id="valor"
                        placeholder="Ex.: 699.00"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Atualização de preço -->
        <section class="card">
            <h2>Atualizar Valor</h2>

            <form id="formValor">
                <div class="campo">
                    <label for="codigoValor">Código do produto</label>
                    <input
                        type="number"
                        id="codigoValor"
                        min="1"
                        placeholder="Ex.: 1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">Novo valor (R$)</label>
                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        placeholder="Ex.: 97.00"
                        required
                    >
                </div>

                <button type="submit">Atualizar Valor</button>
            </form>
        </section>

        <!-- Atualização de estoque -->
        <section class="card">
            <h2>Adicionar ao Estoque</h2>

            <form id="formQuantidade">
                <div class="campo">
                    <label for="codigoQuantidade">Código do produto</label>
                    <input
                        type="number"
                        id="codigoQuantidade"
                        min="1"
                        placeholder="Ex.: 1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="novaQuantidade">Quantidade a adicionar</label>
                    <input
                        type="number"
                        id="novaQuantidade"
                        min="1"
                        step="1"
                        placeholder="Ex.: 3"
                        required
                    >
                </div>

                <button type="submit">Adicionar Quantidade</button>
            </form>
        </section>

        <!-- Lista de produtos -->
        <section class="card">
            <h2>Produtos Cadastrados</h2>

            <div id="mensagem" role="status" aria-live="polite"></div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor unitário</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="4">Nenhum produto cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Sistema de Gerenciamento de Produtos</p>
    </footer>

    <!-- Arquivo JavaScript -->
    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
