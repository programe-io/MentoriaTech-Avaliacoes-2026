<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino de Reflexo para Boxe</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🥊 BOXE REFLEX TRAINER</h1>
        <p>Reaja aos alvos, esquives e golpes antes que o tempo acabe!</p>
    </header>

    <main class="container-jogo">
        <!-- Dashboard de Informações -->
        <div class="hud">
            <div class="hud-box">
                <span class="hud-label">PONTOS</span>
                <span id="pontos" class="hud-valor">0</span>
            </div>
            <div class="hud-box">
                <span class="hud-label">TEMPO</span>
                <span id="tempo" class="hud-valor">30s</span>
            </div>
            <div class="hud-box">
                <span class="hud-label">RECORD "PRO"</span>
                <span id="recorde-pro" class="hud-valor">0</span>
            </div>
        </div>

        <p id="status-jogo">Selecione o modo e clique em INICIAR TREINO!</p>

        <!-- Seletor de Modos -->
        <div class="modos-container">
            <button class="btn-modo active" data-modo="normal">🔥 Normal (Toque/Clique)</button>
            <button class="btn-modo" data-modo="pro">⌨️ Modo PRO (Teclas W A S D)</button>
        </div>

        <!-- Arena do Jogo -->
        <div class="arena-wrapper">
            <div class="arena-boxe" id="arena">
                <!-- Células do Ringue (Alvos) -->
                <div class="celula-boxe" data-index="0" data-key="W">
                    <span class="dica-tecla">W</span>
                    <div class="conteudo-celula"></div>
                </div>
                <div class="celula-boxe" data-index="1" data-key="A">
                    <span class="dica-tecla">A</span>
                    <div class="conteudo-celula"></div>
                </div>
                <div class="celula-boxe" data-index="2" data-key="S">
                    <span class="dica-tecla">S</span>
                    <div class="conteudo-celula"></div>
                </div>
                <div class="celula-boxe" data-index="3" data-key="D">
                    <span class="dica-tecla">D</span>
                    <div class="conteudo-celula"></div>
                </div>
            </div>
        </div>

        <!-- Controles -->
        <div class="controles">
            <button id="btn-iniciar">INICIAR TREINO 🥊</button>
        </div>
    </main>

    <footer>
        <p>Aprimore seus reflexos, esquives e velocidade de reação.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
