<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> MiniFeed</title>
    <link rel="stylesheet"  href="style.css">
    
<link href="style.css" rel="stylesheet"></head>

<body>
  <head>
      <div class="reader-content"> 
        <h1>MiniFeed</h1>
        <nav> 
            <a href="#">Inicial </a>
            <a href="#">Perfil </a>
        </nav>
  </head>

  <main>
    <section class="new-post">
        <div class="user">
            <div class="avatar"> </div>
            <div>
                <strong>Seu nome aqui<strong> 
                <span>O que você esta pensando?</span>

            </div>            
        </div>
        <button>Publicar</button>        
    </section>

    <article class="post">
        <div class="post-header ">
            <div class="avatar"> </div>
                <div>
                    <strong>Seu nome aqui<strong> 
                    <span>- 10min</span>
                </div>            
            </div>

            <div class="post-text">
                Hoje eu vi ...
            </div>   
            <img src="https://static.wixstatic.com/media/800ab4_91f52d8b5ef04312bb9e66c6943c515b~mv2.png/v1/fill/w_824,h_522,fp_0.50_0.50,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/Capa%201%20-%20Thumbnail%20(1).png"alt="imagem do filme">
            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>
        </div>

     
      

    </article>
      
  </main>

 <footer>
     <p>Minifeed-Todos os direitos reservados- 2026</p>
 </footer>


</body>


</html>
