<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Diário Virtual 💗</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>🌸 Meu Diário Virtual</h1>
        <p>Um cantinho especial para guardar meus pensamentos 💕</p>
    </header>

    <main>

        <section class="diario">
            <h2>✍️ Nova entrada</h2>

            <label for="data">Data:</label>
            <input type="date" id="data">

            <label for="titulo">Título:</label>
            <input type="text" id="titulo" placeholder="Como foi o seu dia?">

            <label for="texto">Escreva aqui:</label>
            <textarea id="texto" placeholder="Conte como foi seu dia..."></textarea>

            <button onclick="salvarEntrada()">💗 Salvar entrada</button>
        </section>

        <section class="entradas">
            <h2>📖 Minhas entradas</h2>
            <div id="listaEntradas"></div>
        </section>

    </main>

    <footer>
        <p>Feito com 💕 para guardar momentos especiais.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
