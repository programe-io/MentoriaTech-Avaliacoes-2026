<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram | @wbraquell_borgesz</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff7fa;
    color: #333;
}

.container {
    max-width: 850px;
    margin: 40px auto;
    padding: 25px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 3px 15px #eacbd8;
}

.topo {
    text-align: center;
    color: #c46b91;
    font-size: 25px;
    margin-bottom: 30px;
}

.perfil {
    display: flex;
    align-items: center;
    gap: 35px;
    flex-wrap: wrap;
    justify-content: center;
}

.foto {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 4px solid #e9a9c4;
    background: #f8dce8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
}

.informacoes h2 {
    margin-bottom: 18px;
}

.estatisticas {
    display: flex;
    gap: 25px;
    margin-bottom: 18px;
}

.bio {
    line-height: 1.7;
}

.bio strong {
    color: #c46b91;
}

.destaques {
    display: flex;
    gap: 25px;
    margin: 40px 0;
    justify-content: center;
}

.destaque {
    text-align: center;
    font-size: 13px;
}

.circulo {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #f5d4e2;
    border: 3px solid #d88cac;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    margin-bottom: 8px;
}

.publicacoes {
    border-top: 1px solid #eee;
    padding-top: 20px;
}

.publicacoes h3 {
    text-align: center;
    margin-bottom: 20px;
    color: #c46b91;
}

.grade {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.post {
    aspect-ratio: 1;
    background: linear-gradient(135deg, #f7d6e4, #e9a9c4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    border-radius: 5px;
}

.post:nth-child(2) {
    background: linear-gradient(135deg, #fce5ed, #dba6bb);
}

.post:nth-child(3) {
    background: linear-gradient(135deg, #edc6d7, #f8e6ed);
}

.rodape {
    text-align: center;
    margin-top: 25px;
    color: #c46b91;
    font-size: 13px;
}

@media(max-width: 500px) {
    .container {
        margin: 10px;
        padding: 15px;
    }

    .perfil {
        gap: 15px;
    }

    .estatisticas {
        gap: 12px;
        font-size: 13px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1 class="topo">Instagram</h1>

    <section class="perfil">

        <div class="foto">🌸</div>

        <div class="informacoes">

            <h2>@wbraquell_borgesz</h2>

            <div class="estatisticas">
                <span><strong>12</strong> publicações</span>
                <span><strong>1.250</strong> seguidores</span>
                <span><strong>980</strong> seguindo</span>
            </div>

            <div class="bio">
                <strong>Raquell Borges 🌷</strong><br>
                ✨ Vivendo momentos especiais<br>
                🤍 Fé, amor e gratidão<br>
                🌸 Seja bem-vindo(a)!
            </div>

        </div>
    </section>

    <section class="destaques">

        <div class="destaque">
            <div class="circulo">🤍</div>
            Momentos
        </div>

        <div class="destaque">
            <div class="circulo">🌷</div>
            Eu
        </div>

        <div class="destaque">
            <div class="circulo">🙏</div>
            Fé
        </div>

        <div class="destaque">
            <div class="circulo">💗</div>
            Favoritos
        </div>

    </section>

    <section class="publicacoes">

        <h3>▦ PUBLICAÇÕES</h3>

        <div class="grade">
            <div class="post">🌸</div>
            <div class="post">🤍</div>
            <div class="post">✨</div>
            <div class="post">🌷</div>
            <div class="post">💗</div>
            <div class="post">🦋</div>
        </div>

    </section>

    <footer class="rodape">
        Página demonstrativa inspirada no Instagram 💕
    </footer>

</div>

<script src="script.js"></script></body>
</html>
