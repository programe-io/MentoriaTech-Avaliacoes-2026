
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renderização - Lista de Tarefas</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <header>
            <h1>Lista de Tarefas Diárias</h1>
            <p>Organize suas atividades e acompanhe seu progresso.</p>
        </header>

        <section class="formulario">

            <h2>Adicionar nova tarefa</h2>

            <form id="form-tarefa">

                <input
                    type="text"
                    id="input-titulo"
                    placeholder="Digite uma tarefa..."
                    autocomplete="off"
                >

                <button type="submit">
                    + Adicionar
                </button>

            </form>

        </section>

        <section class="tarefas">

            <h2>Minhas tarefas</h2>

            <ul id="lista-tarefas">
                <!-- As tarefas serão adicionadas pelo JavaScript -->
            </ul>

        </section>

        <footer>
            <p>Projeto desenvolvido com HTML, CSS e JavaScript.</p>
        </footer>

    </main>

<script src="script.js"></script></body>
</html>
