
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Controle de Estoque</h1>
        <p>Cadastre e organize seus produtos</p>
    </header>

    <main>
        <section class="painel">
            <h2>Cadastrar Produto</h2>

            <form id="form-produto">
                <label for="descricao">Descrição do produto:</label>
                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex.: Cadeira gamer"
                    required
                >

                <label for="quantidade">Quantidade:</label>
                <input
                    type="number"
                    id="quantidade"
                    min="1"
                    step="1"
                    required
                >

                <label for="valor">Valor unitário (R$):</label>
                <input
                    type="number"
                    id="valor"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">Cadastrar Produto</button>
            </form>

            <p id="mensagem"></p>
        </section>

        <section class="painel">
            <h2>Produtos Cadastrados</h2>

            <div class="resumo">
                <p>Total de produtos: <strong id="total-produtos">0</strong></p>
                <p>Unidades em estoque: <strong id="total-unidades">0</strong></p>
            </div>

            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="lista-produtos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto CRUD e Estoque — HTML, CSS e JavaScript</p>
    </footer>

<script src="script.js"></script></body>
</html>
