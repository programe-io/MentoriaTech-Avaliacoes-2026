<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Completo</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Meu Site</h1>
    <nav>
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
    </nav>
</header>

<main>
    <section>
        <h2>Seção</h2>
        <article>
            <h3>Artigo</h3>
            <p>Parágrafo com <strong>negrito</strong> e <em>itálico</em>.</p>
            <span>Texto span</span>
        </article>
    </section>

    <aside>
        <h3>Menu Lateral</h3>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
        </ul>
    </aside>

    <figure>
        <img src="https://via.placeholder.com/300" alt="Imagem">
        <figcaption>Legenda da imagem</figcaption>
    </figure>

    <form>
        <label>Nome:</label>
        <input type="text">

        <label>Email:</label>
        <input type="email">

        <button type="button" onclick="mostrar()">Enviar</button>
    </form>

    <table>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
        </tr>
        <tr>
            <td>João</td>
            <td>15</td>
        </tr>
    </table>

    <details>
        <summary>Mais informações</summary>
        <p>Conteúdo oculto.</p>
    </details>

    <audio controls>
        <source src="" type="audio/mpeg">
    </audio>

    <video width="300" controls>
        <source src="" type="video/mp4">
    </video>

<footer>
    <p>Rodapé do site</p>
</footer>
