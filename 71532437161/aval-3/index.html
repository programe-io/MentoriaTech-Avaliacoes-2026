
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header>
            <h1>Controle de IMC</h1>
            <p>Calcule seu Índice de Massa Corporal</p>
        </header>

        <section class="card">

            <h2>Dados do paciente</h2>

            <form id="formulario">

                <div class="campo">
                    <label for="nome">Nome do paciente</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg)</label>
                    <input
                        type="number"
                        id="peso"
                        placeholder="Ex: 75"
                        min="1"
                        step="any"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="altura">Altura (metros)</label>
                    <input
                        type="number"
                        id="altura"
                        placeholder="Ex: 1.75"
                        min="0.1"
                        step="any"
                        required
                    >
                </div>

                <button type="submit">Calcular IMC</button>

            </form>

            <div id="resultado" class="resultado" aria-live="polite">
                <p>Preencha os dados para calcular seu IMC.</p>
            </div>

        </section>

        <footer>
            <p>Projeto Prático - Explorando JavaScript com HTML</p>
        </footer>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
