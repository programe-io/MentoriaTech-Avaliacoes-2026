
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Gerenciamento Escolar</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <h1>Gestão Escolar</h1>
            <p>Sistema de Gerenciamento de Alunos</p>
        </header>

        <section class="resumo">

            <div class="card">
                <h3>Total de alunos</h3>
                <span id="totalAlunos">0</span>
            </div>

            <div class="card">
                <h3>Aprovados</h3>
                <span id="totalAprovados">0</span>
            </div>

            <div class="card">
                <h3>Recuperação</h3>
                <span id="totalRecuperacao">0</span>
            </div>

            <div class="card">
                <h3>Reprovados</h3>
                <span id="totalReprovados">0</span>
            </div>

        </section>

        <section class="cadastro">

            <h2>Cadastrar aluno</h2>

            <form id="formAluno">

                <label for="nome">Nome do aluno:</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome completo"
                    required
                >

                <label for="turma">Turma:</label>

                <input
                    type="text"
                    id="turma"
                    placeholder="Exemplo: 3º Ano A"
                    required
                >

                <label for="nota">Nota:</label>

                <input
                    type="number"
                    id="nota"
                    placeholder="Digite a nota de 0 a 10"
                    min="0"
                    max="10"
                    step="0.1"
                    required
                >

                <button type="submit">
                    Cadastrar aluno
                </button>

            </form>

        </section>

        <section class="alunos">

            <h2>Alunos cadastrados</h2>

            <div id="listaAlunos">

                <p class="vazio">
                    Nenhum aluno cadastrado.
                </p>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
