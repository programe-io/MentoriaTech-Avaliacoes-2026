
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Gerenciamento Escolar</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <header>
            <h1>Sistema de Gerenciamento Escolar</h1>
            <p>Controle de alunos, turmas e notas</p>
        </header>

        <!-- PAINEL DE RESUMO -->

        <section class="resumo">

            <div class="card">
                <h3>Total de alunos</h3>
                <p id="totalAlunos">0</p>
            </div>

            <div class="card">
                <h3>Aprovados</h3>
                <p id="totalAprovados">0</p>
            </div>

            <div class="card">
                <h3>Recuperação</h3>
                <p id="totalRecuperacao">0</p>
            </div>

            <div class="card">
                <h3>Reprovados</h3>
                <p id="totalReprovados">0</p>
            </div>

        </section>

        <!-- CADASTRO DE ALUNOS -->

        <section class="cadastro">

            <h2>Cadastrar aluno</h2>

            <form id="formAluno">

                <label for="nome">Nome do aluno:</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome do aluno"
                    required
                >

                <label for="turma">Turma:</label>

                <input
                    type="text"
                    id="turma"
                    placeholder="Exemplo: 3º Ano A"
                    required
                >

                <label for="nota">Nota:</label>

                <input
                    type="number"
                    id="nota"
                    placeholder="Digite a nota de 0 a 10"
                    min="0"
                    max="10"
                    step="0.1"
                    required
                >

                <button type="submit">
                    Cadastrar aluno
                </button>

            </form>

        </section>

        <!-- LISTA DE ALUNOS -->

        <section class="lista">

            <h2>Alunos cadastrados</h2>

            <div id="listaAlunos">

                <p class="vazio">
                    Nenhum aluno cadastrado.
                </p>

            </div>

        </section>

    </main>

<script src="script.js"></script></body>
</html>
