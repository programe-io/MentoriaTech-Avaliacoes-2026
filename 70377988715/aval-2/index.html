
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookSpace | Biblioteca</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h1>BookSpace</h1>
    <p>Organize seus livros e empréstimos em um só lugar.</p>
  </header>

  <main>
    <section>
      <h2>Cadastrar livro</h2>
      <form id="livroForm">
        <input id="titulo" placeholder="Título do livro" required minlength="2">
        <input id="autor" placeholder="Autor" required>
        <input id="categoria" placeholder="Categoria" required>
        <input id="quantidade" type="number" min="1" value="1" placeholder="Exemplares" required>
        <button type="submit">Cadastrar livro</button>
      </form>
    </section>

    <section>
      <h2>Registrar empréstimo</h2>
      <form id="emprestimoForm">
        <select id="livroEscolhido" required>
          <option value="">Selecione um livro</option>
        </select>
        <input id="leitor" placeholder="Nome do leitor" required>
        <button type="submit">Registrar empréstimo</button>
      </form>
      <p id="mensagem" role="status"></p>
    </section>

    <section>
      <h2>Catálogo de livros</h2>
      <div id="catalogo"></div>
    </section>

    <section>
      <h2>Histórico de empréstimos</h2>
      <div id="historico"></div>
    </section>
  </main>

  <footer>
    <p>BookSpace © 2026</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
