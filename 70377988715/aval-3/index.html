
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Controle de IMC</h1>
        <p>Preencha os dados para calcular seu IMC.</p>

        <form id="imcForm">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" placeholder="Ex: 60" step="any" required>

            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" placeholder="Ex: 1.70" step="any" required>

            <button type="submit">Calcular IMC</button>

        </form>

        <div id="resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
