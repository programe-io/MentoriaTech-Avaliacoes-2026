
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Cadastro e controle de produtos</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formCadastro">
                <label for="descricao">Descrição:</label>
                <input id="descricao" type="text"
                       placeholder="Nome do produto" required>

                <label for="quantidade">Quantidade:</label>
                <input id="quantidade" type="number"
                       min="1" required>

                <label for="valor">Valor (R$):</label>
                <input id="valor" type="number"
                       min="0" step="0.01" required>

                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section class="card">
            <h2>Alterar produto</h2>

            <form id="formValor">
                <label for="codigoValor">Código do produto:</label>
                <input id="codigoValor" type="number"
                       min="1" required>

                <label for="novoValor">Novo valor (R$):</label>
                <input id="novoValor" type="number"
                       min="0" step="0.01" required>

                <button type="submit">Alterar valor</button>
            </form>

            <hr>

            <form id="formQuantidade">
                <label for="codigoQuantidade">Código do produto:</label>
                <input id="codigoQuantidade" type="number"
                       min="1" required>

                <label for="novaQuantidade">Quantidade a adicionar:</label>
                <input id="novaQuantidade" type="number"
                       min="1" required>

                <button type="submit">Adicionar ao estoque</button>
            </form>
        </section>

        <section class="card">
            <h2>Produtos cadastrados</h2>
            <p id="mensagem" role="status"></p>

            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto CRUD e Estoque em JavaScript</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
