
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveTok - Sua rede de vídeos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topo">
    <div class="logo">Live<span>Tok</span></div>

    <input type="text" id="pesquisa"
    placeholder="Pesquisar vídeos...">

    <button class="btn-publicar" onclick="abrirUpload()">
        + Publicar
    </button>
</header>

<aside class="menu">
    <button class="ativo" onclick="filtrar('Todos', this)">🏠 Início</button>
    <button onclick="filtrar('Engraçados', this)">😂 Engraçados</button>
    <button onclick="filtrar('Receitas', this)">🍕 Receitas</button>
    <button onclick="filtrar('Dança', this)">💃 Danças</button>
    <button onclick="filtrar('Música', this)">🎵 Música</button>
    <button onclick="filtrar('Favoritos', this)">❤️ Favoritos</button>
</aside>

<main>
    <section class="titulo">
        <h1>Descubra novos vídeos</h1>
        <p>Divirta-se, aprenda e compartilhe momentos!</p>
    </section>

    <section id="feed" class="feed"></section>
</main>

<div id="modalUpload" class="modal">
    <div class="modal-conteudo">

        <button class="fechar" onclick="fecharUpload()">×</button>

        <h2>Publicar vídeo</h2>

        <input type="text" id="nomeVideo"
        placeholder="Título do vídeo">

        <input type="text" id="nomeUsuario"
        placeholder="Seu nome de usuário">

        <select id="categoriaVideo">
            <option>Engraçados</option>
            <option>Receitas</option>
            <option>Dança</option>
            <option>Música</option>
        </select>

        <input type="file" id="arquivoVideo" accept="video/*">

        <button onclick="publicarVideo()">Publicar agora</button>

    </div>
</div>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
