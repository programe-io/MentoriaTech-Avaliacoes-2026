
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSTA LIVE</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="topo">
    <h1>INSTA LIVE</h1>
    <input type="search" id="pesquisa" placeholder="Pesquisar pessoas...">
    <button id="btnPerfil">Meu perfil</button>
  </header>

  <main>
    <section class="stories-area">
      <h2>Stories</h2>
      <div class="stories" id="stories"></div>
    </section>

    <section class="feed-area">
      <div class="titulo-feed">
        <h2>Publicações</h2>
        <span>Memes e momentos do dia 😂</span>
      </div>
      <div id="feed"></div>
    </section>

    <section class="reels-area">
      <h2>Reels</h2>
      <div id="reels"></div>
    </section>

    <section class="perfil-area" id="perfil">
      <h2>Meu perfil</h2>
      <div class="perfil-card">
        <img
          class="foto-perfil grande"
          src="https://randomuser.me/api/portraits/women/44.jpg"
          alt="Foto de perfil"
          id="fotoPerfil"
        >
        <h3 id="nomePerfil">Meu usuário</h3>
        <p id="bioPerfil">Compartilhando momentos e memes! 💜</p>
        <button id="editarPerfil">Editar perfil</button>

        <div class="estatisticas">
          <span><strong id="totalPosts">0</strong> publicações</span>
          <span><strong>120</strong> seguidores</span>
          <span><strong>80</strong> seguindo</span>
        </div>
      </div>
    </section>
  </main>

  <div class="story-visualizador" id="storyVisualizador" aria-hidden="true">
    <div class="story-caixa">
      <div class="story-progresso">
        <div id="storyBarra"></div>
      </div>

      <div class="story-cabecalho">
        <div class="story-usuario">
          <img id="storyFoto" src="" alt="">
          <strong id="storyNome"></strong>
        </div>
        <button id="fecharStory" aria-label="Fechar story">✕</button>
      </div>

      <img id="storyImagem" class="story-imagem" src="" alt="Story">
      <p id="storyTexto"></p>

      <div class="story-botoes">
        <button id="storyAnterior">❮ Anterior</button>
        <button id="storyProximo">Próximo ❯</button>
      </div>
    </div>
  </div>

  <footer>
    <p>INSTA LIVE © 2026 — Compartilhe bons momentos!</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
