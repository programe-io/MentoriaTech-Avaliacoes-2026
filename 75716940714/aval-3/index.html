<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
 
  <script src="https://cdn.tailwindcss.com"></script>
  
  
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
  
  <title>Loopix</title>
  
 
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="min-h-screen text-gray-900 font-sans">

 
  <header class="sticky top-0 bg-card border-b border-border z-40">
    <div class="max-w-5xl mx-auto px-4">
      <div class="flex items-center justify-between h-16">
       
        <h1 class="font-bold text-xl tracking-wide" style="font-family: 'Comic Sans MS', cursive, sans-serif;">Loopix</h1>
       
        <div class="hidden md:flex bg-gray-100 px-4 py-2 rounded-lg text-sm items-center w-64">
            <i class='bx bx-search text-gray-400 text-lg mr-2'></i>
            <input 
                type="text" 
                placeholder="Pesquisar" 
                class="bg-transparent focus:outline-none w-full" 
            />
        </div>

      
        <div class="flex items-center gap-5">
          <i class='bx bxs-home text-2xl cursor-pointer hover:scale-110 transition-transform'></i>
          <i class='bx bx-message-rounded-dots text-2xl cursor-pointer hover:scale-110 transition-transform hidden md:block'></i>
          <i class='bx bx-plus-square text-2xl cursor-pointer hover:scale-110 transition-transform hidden md:block'></i>
          <i class='bx bx-compass text-2xl cursor-pointer hover:scale-110 transition-transform hidden md:block'></i>
          <i class='bx bx-heart text-2xl cursor-pointer hover:scale-110 transition-transform'></i>
          
        
          <div class="avatar w-7 h-7 cursor-pointer border border-gray-200 hidden md:flex">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuLnZ4kYY35ebhRmdVWpab8K2YY3IrbI7jeVHRCCK2FMod0rBix7QIZ-s&s=10" alt="Perfil" id="header-avatar" />
          </div>
        </div>
      </div>
    </div>
  </header>

  
  <main class="max-w-5xl mx-auto px-4 py-6 pb-20 md:pb-6 flex justify-center lg:justify-between gap-8">
      
   
    <div class="flex-1 max-w-lg w-full">
      
     
      <section class="bg-card border border-border rounded-lg p-4 mb-6">
        <div class="flex gap-4 overflow-x-auto no-scrollbar" id="stories-container">
         
          <div class="flex flex-col items-center cursor-pointer min-w-fit">
            <div class="w-16 h-16 rounded-full bg-gray-300 ring-2 ring-pink-500 ring-offset-2 p-[2px]">
                <div class="avatar w-full h-full rounded-full">
                    <img src="https://i.pravatar.cc/150?img=11" alt="Seu story" id="story-avatar" />
                </div>
            </div>
            <span class="text-xs mt-2 truncate w-16 text-center" id="story-username">seu_usuario</span>
          </div>
          
          
        </div>
      </section>

     
      <div id="feed-container">
       
      </div>

    </div>

    
    <aside class="hidden lg:block w-80 pt-4">
      
     
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-4 cursor-pointer">
          <div class="avatar w-14 h-14">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuLnZ4kYY35ebhRmdVWpab8K2YY3IrbI7jeVHRCCK2FMod0rBix7QIZ-s&s=10" alt="Seu Perfil" id="sidebar-avatar" />
          </div>
          <div class="flex flex-col">
            <span class="font-semibold text-sm hover:underline" id="sidebar-username">seu_usuario</span>
            <span class="text-sm text-muted" id="sidebar-name">Seu Nome</span>
          </div>
        </div>
        <button onclick="openEditProfileModal()" class="text-xs font-bold text-blue-500 hover:text-blue-900 transition-colors">
            Mudar
        </button>
      </div>
     
      <div class="flex justify-between text-sm font-semibold mb-4">
          <span class="text-gray-500">Sugestões para você</span>
          <span class="text-gray-900 hover:text-gray-400 cursor-pointer">Ver tudo</span>
      </div>
      
      <div id="suggestions-container" class="flex flex-col gap-3 mb-8">
          
      </div>

      <div class="mt-8">
        <p class="text-xs text-gray-400 leading-relaxed hover:underline cursor-pointer">
          Sobre • Ajuda • Imprensa • API • Carreiras • Privacidade • Termos • Localizações • Idiomas
        </p>
        <p class="text-xs text-gray-400 mt-4 uppercase">
          © 2026 Instagram Clone from mariano
        </p>
      </div>
    </aside>
      
  </main>

 
  <nav class="md:hidden fixed bottom-0 w-full bg-card border-t border-border z-50">
    <div class="flex justify-around items-center h-12">
      <i class='bx bxs-home text-3xl cursor-pointer'></i>
      <i class='bx bx-search text-3xl cursor-pointer text-gray-400'></i>
      <i class='bx bx-plus-square text-3xl cursor-pointer text-gray-400'></i>
      <i class='bx bx-slideshow text-3xl cursor-pointer text-gray-400'></i>
      <div class="avatar w-7 h-7 cursor-pointer border border-gray-200">
        <img src="https://i.pravatar.cc/150?img=11" alt="Perfil" id="mobile-nav-avatar" />
      </div>
    </div>
  </nav>

  
  <div id="edit-profile-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm modal-content overflow-hidden">
          <div class="border-b border-gray-200 p-4 flex justify-between items-center bg-gray-50">
              <h2 class="font-semibold text-lg">Editar Perfil</h2>
              <i class='bx bx-x text-2xl cursor-pointer hover:text-gray-600' onclick="closeEditProfileModal()"></i>
          </div>
          
          <div class="p-6 flex flex-col gap-4">
             
              <div class="flex flex-col items-center gap-3">
                  <div class="avatar w-24 h-24 ring-4 ring-gray-100">
                      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuLnZ4kYY35ebhRmdVWpab8K2YY3IrbI7jeVHRCCK2FMod0rBix7QIZ-s&s=10" alt="Preview" id="modal-avatar-preview" />
                  </div>
                  <label class="text-sm font-semibold text-blue-500 cursor-pointer hover:text-blue-700">
                      Alterar foto do perfil
                      <input type="file" id="upload-avatar" accept="image/*" class="hidden" onchange="previewImage(event)" />
                  </label>
              </div>

             
              <div class="flex flex-col gap-1">
                  <label class="text-xs font-semibold text-gray-500">Nome de Usuário</label>
                  <input type="text" id="input-username" class="border border-gray-300 rounded-md p-2 text-sm focus:outline-none focus:ring-1 focus:ring-gray-400" />
              </div>
              
              <div class="flex flex-col gap-1">
                  <label class="text-xs font-semibold text-gray-500">Nome Completo</label>
                  <input type="text" id="input-name" class="border border-gray-300 rounded-md p-2 text-sm focus:outline-none focus:ring-1 focus:ring-gray-400" />
              </div>

              <button onclick="saveProfile()" class="mt-4 bg-blue-500 text-white font-semibold rounded-lg p-2 hover:bg-blue-600 transition-colors">
                  Salvar Alterações
              </button>
          </div>
      </div>
  </div>
 <script src="java.js"></script>
  
<script src="script.js"></script></body>
</html>
