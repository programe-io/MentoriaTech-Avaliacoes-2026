
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>💬 Meu Feed Social</h1>
        <p>Compartilhe seus momentos!</p>
    </header>

    <main>

        <section class="criar-post">
            <h2>Nova publicação</h2>

            <input type="text" id="nome"
                   placeholder="Seu nome">

            <textarea id="texto"
                      placeholder="O que você está pensando?"></textarea>

            <button onclick="publicar()">Publicar</button>
        </section>

        <section class="feed">
            <h2>Publicações recentes</h2>

            <div id="publicacoes">

                <article class="post">
                    <h3>Maria</h3>
                    <p>Hoje foi um dia maravilhoso! ❤️</p>

                    <button onclick="curtir(this)">
                        ♡ Curtir
                    </button>

                    <span class="contador">0 curtidas</span>

                    <div class="comentarios"></div>

                    <input type="text"
                           placeholder="Escreva um comentário...">

                    <button onclick="comentar(this)">
                        Comentar
                    </button>
                </article>

            </div>
        </section>

    </main>

    <footer>
        <p>Mini Feed Social - Meu primeiro projeto</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
