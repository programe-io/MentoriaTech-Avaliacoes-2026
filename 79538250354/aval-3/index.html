
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaClone</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <aside class="sidebar">
        <h1>InstaClone</h1>
        <a href="#">🏠 Início</a>
        <a href="#">🔍 Pesquisar</a>
        <a href="#">🎬 Reels</a>
        <a href="#">💬 Mensagens</a>
        <a href="#">❤️ Notificações</a>
        <a href="#">👤 Perfil</a>
        <button onclick="novaPublicacao()">➕ Criar publicação</button>
    </aside>

    <main>
        <h2>Feed</h2>

        <div class="stories">
            <div>👩<p>Ana</p></div>
            <div>👨<p>Pedro</p></div>
            <div>👧<p>Julia</p></div>
            <div>🧑<p>Lucas</p></div>
        </div>

        <div id="feed">

            <div class="post">
                <div class="usuario">
                    <strong>ana_fotos</strong>
                    <span>•••</span>
                </div>

                <img src="https://picsum.photos/600/400?random=5"
                     alt="Paisagem">

                <div class="botoes">
                    <button onclick="curtir(this)">♡</button>
                    <button onclick="focarComentario(this)">💬</button>
                    <button>➤</button>
                </div>

                <p class="likes">0 curtidas</p>
                <p><strong>ana_fotos</strong> Um dia incrível! 🌸</p>

                <input placeholder="Escreva um comentário...">
                <button onclick="comentar(this)">Enviar</button>

                <div class="comentarios"></div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
