<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Gerenciamento de Produtos</h1>

        <!-- Formulário de Cadastro -->
        <section class="card">
            <h2>Cadastrar Produto</h2>
            <form id="form-cadastro">
                <div class="input-group">
                    <label for="descricao">Descrição:</label>
                    <input type="text" id="descricao" placeholder="Ex: Cadeira Gamer" required minlength="5">
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="quantidade">Quantidade:</label>
                        <input type="number" id="quantidade" placeholder="Ex: 10" required min="1">
                    </div>

                    <div class="input-group">
                        <label for="valor">Valor (R$):</label>
                        <input type="number" id="valor" step="0.01" placeholder="Ex: 150.00" required min="0">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Tabela de Produtos -->
        <section class="card">
            <h2>Lista de Produtos</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Qtd</th>
                            <th>Valor (R$)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos">
                        <!-- Os produtos serão inseridos aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
