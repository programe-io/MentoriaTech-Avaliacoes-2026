<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="instagram">

  <header>
    <h1>Instagram</h1>
    <div class="icons">
      <button onclick="criarPost()">＋</button>
      <button onclick="alert('Você não tem mensagens novas!')">✉</button>
    </div>
  </header>

  <div class="stories">
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=11">
      <p>Seu story</p>
    </div>
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=12">
      <p>Carla</p>
    </div>
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=13">
      <p>Pedro</p>
    </div>
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=14">
      <p>Julia</p>
    </div>
  </div>

  <main id="feed">

    <div class="post">
      <div class="perfil">
        <img src="https://i.pravatar.cc/100?img=12">
        <strong>carla.fotos</strong>
      </div>

      <img class="foto"
      src="https://picsum.photos/id/1025/600/450">

      <div class="acoes">
        <button onclick="curtir(this)">♡</button>
        <button onclick="comentar()">💬</button>
        <button>➤</button>
      </div>

      <p class="likes">320 curtidas</p>
      <p class="legenda">
        <strong>carla.fotos</strong>
        Aproveitando a natureza! 🌻
      </p>
    </div>

    <div class="post">
      <div class="perfil">
        <img src="https://i.pravatar.cc/100?img=14">
        <strong>julia.momentos</strong>
      </div>

      <img class="foto"
      src="https://picsum.photos/id/1060/600/450">

      <div class="acoes">
        <button onclick="curtir(this)">♡</button>
        <button onclick="comentar()">💬</button>
        <button>➤</button>
      </div>

      <p class="likes">540 curtidas</p>
      <p class="legenda">
        <strong>julia.momentos</strong>
        Um dia especial! ✨
      </p>
    </div>

  </main>

</div>
  <script src="script.js"></script>
  
</body>
</html>
