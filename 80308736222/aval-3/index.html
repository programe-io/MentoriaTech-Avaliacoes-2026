<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">

  <header>
    <h1>Instagram</h1>
    <input type="text" placeholder="Pesquisar">
    <button>⌂</button>
    <button>♡</button>
    <button onclick="novaPublicacao()">＋</button>
  </header>

  <section class="stories">
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=1">
      <p>Seu story</p>
    </div>
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=2">
      <p>Maria</p>
    </div>
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=3">
      <p>João</p>
    </div>
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=4">
      <p>Ana</p>
    </div>
  </section>

  <main id="feed">

    <div class="post">
      <div class="usuario">
        <img src="https://i.pravatar.cc/100?img=5">
        <strong>maria.oficial</strong>
      </div>

      <img class="foto"
      src="https://picsum.photos/id/1011/600/500">

      <div class="botoes">
        <button onclick="curtir(this)">♡</button>
        <button onclick="comentar()">💬</button>
        <button>➤</button>
      </div>

      <p class="likes">120 curtidas</p>
      <p><strong>maria.oficial</strong> Aproveitando o dia! ❤️</p>
    </div>

    <div class="post">
      <div class="usuario">
        <img src="https://i.pravatar.cc/100?img=6">
        <strong>joao.silva</strong>
      </div>

      <img class="foto"
      src="https://picsum.photos/id/1015/600/500">

      <div class="botoes">
        <button onclick="curtir(this)">♡</button>
        <button onclick="comentar()">💬</button>
        <button>➤</button>
      </div>

      <p class="likes">85 curtidas</p>
      <p><strong>joao.silva</strong> Que lugar incrível!</p>
    </div>

  </main>

</div>
  <script src="script.js"></script>
  
</body>
</html>
