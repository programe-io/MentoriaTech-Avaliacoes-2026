<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="instagram">

  <header>
    <h1>Instagram</h1>
    <input type="text" placeholder="Pesquisar">
    <span>⌂</span>
    <span>♡</span>
    <span>＋</span>
  </header>

  <div class="stories">
    <div><img src="https://i.pravatar.cc/100?img=10"><p>Seu story</p></div>
    <div><img src="https://i.pravatar.cc/100?img=20"><p>Amanda</p></div>
    <div><img src="https://i.pravatar.cc/100?img=30"><p>Lucas</p></div>
    <div><img src="https://i.pravatar.cc/100?img=40"><p>Julia</p></div>
  </div>

  <div class="publicacao">

    <div class="perfil">
      <img src="https://i.pravatar.cc/100?img=20">
      <b>amanda.silva</b>
    </div>

    <img class="imagem"
    src="https://picsum.photos/id/1035/600/500">

    <div class="acoes">
      <button onclick="curtir(this)">♡</button>
      <button onclick="comentar()">💬</button>
      <button>➤</button>
    </div>

    <p id="curtidas">250 curtidas</p>
    <p><b>amanda.silva</b> Vivendo momentos especiais! ✨</p>

  </div>

  <div class="publicacao">

    <div class="perfil">
      <img src="https://i.pravatar.cc/100?img=30">
      <b>lucas.fotos</b>
    </div>

    <img class="imagem"
    src="https://picsum.photos/id/1016/600/500">

    <div class="acoes">
      <button onclick="curtir(this)">♡</button>
      <button onclick="comentar()">💬</button>
      <button>➤</button>
    </div>

    <p>180 curtidas</p>
    <p><b>lucas.fotos</b> Que paisagem maravilhosa! 🌎</p>

  </div>

</div>
  <script src="script.js"></script>
  
</body>
</html>
