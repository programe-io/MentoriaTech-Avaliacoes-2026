<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clone instagram</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gray-100 text-slate-900">

    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex items-center justify-between h-14 md:h-16">

                <h1 class="text-xl font-semibold">Instagram</h1>

                <button class="md:hidden">
                    <i class="bx bx-menu"></i>
                </button>

                <div class="hidden md:flex items-center">
                    <input type="text" placeholder="Pesquisar"
                        class="w-64 h-9 bg-gray-100 pr-4 pl-4 rounded-lg text-sm">
                </div>

                <div class="hidden md:flex items-center gap-5">
                    <button><i class="bx bx-home text-xl"></i></button>
                    <button><i class="bx bx-search text-xl"></i></button>
                    <button><i class="bx bx-plus text-xl"></i></button>
                    <button><i class="bx bx-heart text-xl"></i></button>
                    <button><i class="bx bx-user text-xl"></i></button>
                    <button class="w-7 h-7 rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500"></button>
                </div>

            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-4 pb-20 md:px-8 md:py-8">
        <div class="flex gap-8">

            <div class="flex-1 max-w-lg mx-auto md:mx-0">

                <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">
                    <div class="flex gap-4 overflow-x-auto">

                        <div class="flex flex-col items-center justify-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gray-100 md:w-20 md:h-20">
                                <div class="w-full h-full rounded-full p-0.5 bg-white">
                                    <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">
                                        <span class="text-2xl text-gray-500">+</span>
                                    </div>
                                </div>
                            </div>
                            <span class="text-xs mt-1 w-16 text-center">Você</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <img class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover p-0.5 border-2 border-pink-500"
                                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=900&q=85">
                            <span class="text-xs mt-1">Bruna</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <img class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover p-0.5 border-2 border-pink-500"
                                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=85">
                            <span class="text-xs mt-1">João Pedro</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <img class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover p-0.5 border-2 border-pink-500"
                                src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=900&q=85">
                            <span class="text-xs mt-1">Trans</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <img class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover p-0.5 border-2 border-pink-500"
                                src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=900&q=85">
                            <span class="text-xs mt-1">Carlos</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <img class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover p-0.5 border-2 border-pink-500"
                                src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=85">
                            <span class="text-xs mt-1">Letty</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <img class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover p-0.5 border-2 border-pink-500"
                                src="https://images.unsplash.com/photo-1504593811423-6dd665756598?auto=format&fit=crop&w=900&q=85">
                            <span class="text-xs mt-1">Ana Letty</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <img class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover p-0.5 border-2 border-pink-500"
                                src="https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=900&q=85">
                            <span class="text-xs mt-1">Lira</span>
                        </div>

                    </div>
                </section>

                <div id="publicacoes"></div>

            </div>
        </div>
    </main>

    <script>
        const pessoas = [
            {
                nome: "Bruna",
                foto: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=900&q=85",
                curtidas: "1.585",
                comentarios: "15",
                texto: "Oi, pessoal! 💖 Um novo dia, novas experiências e muitos motivos para sorrir. ✨ #DiaEspecial #BoasEnergias",
                tempo: "há 5 minutos"
            },
            {
                nome: "João Pedro",
                foto: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=85",
                curtidas: "1.722",
                comentarios: "28",
                texto: "Vivendo cada momento e aproveitando as pequenas coisas da vida. 📸🔥 #Momentos",
                tempo: "há 12 minutos"
            },
            {
                nome: "Trans",
                foto: "https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=900&q=85",
                curtidas: "2.104",
                comentarios: "36",
                texto: "Sendo quem eu sou, com orgulho, respeito e liberdade. 🏳️‍⚧️❤️ #Respeito #Orgulho",
                tempo: "há 20 minutos"
            },
            {
                nome: "Carlos",
                foto: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=900&q=85",
                curtidas: "986",
                comentarios: "19",
                texto: "Foco nos objetivos, dedicação no caminho e fé para continuar. 💪🚀 #Determinação #Foco",
                tempo: "há 35 minutos"
            },
            {
                nome: "Letty",
                foto: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=85",
                curtidas: "3.210",
                comentarios: "42",
                texto: "Colecionando lembranças boas e deixando a vida mais leve. 🌷☀️ #Gratidão #BoasVibrações",
                tempo: "há 1 hora"
            },
            {
                nome: "Ana Letty",
                foto: "https://images.unsplash.com/photo-1504593811423-6dd665756598?auto=format&fit=crop&w=900&q=85",
                curtidas: "1.450",
                comentarios: "23",
                texto: "Que nunca faltem motivos para recomeçar e acreditar nos sonhos. 💕🌟 #Sonhos #Positividade",
                tempo: "há 2 horas"
            },
            {
                nome: "Lira",
                foto: "https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=900&q=85",
                curtidas: "2.890",
                comentarios: "31",
                texto: "A vida acontece agora. Aproveite, sorria e siga em frente! 😎🌻 #Lifestyle #Momentos",
                tempo: "há 3 horas"
            }
        ];

        const publicacoes = document.getElementById("publicacoes");

        pessoas.forEach(pessoa => {
            publicacoes.innerHTML += `
                <article class="bg-white border border-gray-200 rounded-lg mb-4">

                    <header class="flex items-center justify-between p-3">

                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                <img class="w-full h-full object-cover rounded-full"
                                    src="${pessoa.foto}">
                            </div>

                            <div>
                                <p class="text-sm font-semibold">${pessoa.nome}</p>
                                <p class="text-xs text-gray-500">Barras, PI</p>
                            </div>
                        </div>

                        <button>
                            <i class="bx bx-dots-horizontal-rounded"></i>
                        </button>

                    </header>

                    <div class="bg-gray-100 relative">
                        <img class="w-full h-full object-cover"
                            src="${pessoa.foto}"
                            alt="Foto de ${pessoa.nome}">
                    </div>

                    <div class="p-3">

                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-4">
                                <button>
                                    <i class="bx bx-heart text-2xl"></i>
                                </button>

                                <button>
                                    <i class="bx bx-message-circle-reply text-2xl"></i>
                                </button>

                                <button>
                                    <i class="bx bx-send text-2xl"></i>
                                </button>
                            </div>

                            <button>
                                <i class="bx bx-bookmark text-2xl"></i>
                            </button>
                        </div>

                        <p class="font-semibold text-sm mb-2">
                            ${pessoa.curtidas} curtidas
                        </p>

                        <p class="text-sm">
                            <span class="font-semibold">${pessoa.nome}</span>
                            <span class="text-slate-900/90">${pessoa.texto}</span>
                        </p>

                        <button class="text-sm text-gray-500 mt-1">
                            Ver todos os ${pessoa.comentarios} comentários
                        </button>

                        <p class="text-xs text-gray-500 mt-2 uppercase">
                            ${pessoa.tempo}
                        </p>

                    </div>
                </article>
            `;
        });
    </script>

</body>
</html>
