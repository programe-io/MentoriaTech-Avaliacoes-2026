<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Cadastro e controle de produtos</p>
    </header>

    <main>

        <!-- CADASTRO -->
        <section class="card">

            <h2>Cadastrar Produto</h2>

            <form id="formulario">

                <div>
                    <label for="codigo">Código</label>
                    <input
                        type="text"
                        id="codigo"
                        placeholder="Digite o código"
                        required
                    >
                </div>

                <div>
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Digite a descrição"
                        required
                    >
                </div>

                <div>
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="0"
                        placeholder="Digite a quantidade"
                        required
                    >
                </div>

                <div>
                    <label for="valor">Valor</label>
                    <input
                        type="number"
                        id="valor"
                        min="0"
                        step="0.01"
                        placeholder="Digite o valor"
                        required
                    >
                </div>

                <button type="submit">
                    Cadastrar Produto
                </button>

            </form>

        </section>


        <!-- ALTERAÇÃO -->
        <section class="card">

            <h2>Alterar Produto</h2>

            <div class="alteracao">

                <div>
                    <label for="codigoAlteracao">
                        Código do Produto
                    </label>

                    <input
                        type="text"
                        id="codigoAlteracao"
                        placeholder="Código"
                    >
                </div>

                <div>
                    <label for="novoValor">
                        Novo Valor
                    </label>

                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        placeholder="Novo valor"
                    >
                </div>

                <button onclick="alterarValor()">
                    Alterar Valor
                </button>

                <div>
                    <label for="novaQuantidade">
                        Nova Quantidade
                    </label>

                    <input
                        type="number"
                        id="novaQuantidade"
                        min="0"
                        placeholder="Nova quantidade"
                    >
                </div>

                <button onclick="alterarQuantidade()">
                    Alterar Quantidade
                </button>

            </div>

        </section>


        <!-- LISTAGEM -->
        <section class="card">

            <div class="titulo">

                <h2>Produtos Cadastrados</h2>

                <span id="contador">
                    0 produtos
                </span>

            </div>

            <div class="tabela">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                    </tbody>

                </table>

            </div>

            <p id="semProdutos">
                Nenhum produto cadastrado.
            </p>

        </section>

    </main>


    <footer>
        <p>Sistema de Estoque - 2026</p>
    </footer>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
