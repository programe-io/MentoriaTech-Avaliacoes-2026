<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes e Séries Grátis</title>
    <style>
        /* Estilização Geral (Visual Dark Mode) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #141414;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container Principal */
        .container {
            max-width: 600px;
            width: 100%;
            background: #1f1f1f;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        /* Títulos e Textos */
        h1 {
            color: #e50914; /* Vermelho estilo Netflix */
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            color: #aaa;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* Lista Personalizada */
        ol {
            padding: 0;
            list-style: none;
            counter-reset: my-counter; /* Cria um contador do zero */
        }

        li {
            counter-increment: my-counter;
            background: #2a2a2a;
            margin-bottom: 12px;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            transition: transform 0.2s, background-color 0.2s;
            cursor: pointer;
        }

        /* Efeito de passar o mouse */
        li:hover {
            background: #383838;
            transform: translateX(5px);
            border-left: 5px solid #e50914;
        }

        /* Estilização dos Números do Ranking */
        li::before {
            content: counter(my-counter);
            font-weight: bold;
            color: #e50914;
            width: 30px;
            font-size: 1.3rem;
            display: inline-block;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>Filmes e Séries</h1>
        <p>As melhores indicações para você assistir:</p>
        
        <ol>
            <li>Bastardos Inglórios</li>
            <li>Nada de Novo no Front</li>
            <li>Truque de Mestre</li>
            <li>007: Cassino Royale</li>
            <li>O Mentalista</li>
            <li>Sobrenatural</li>
            <li>Dexter</li>
            <li>Origem</li>
            <li>La Casa de Papel</li>
            <li>You</li>
        </ol>
    </div>

</body>
</html>
