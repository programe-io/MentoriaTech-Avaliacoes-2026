<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas JS</title>
    
    <!-- Link que faz a mágica do design funcionar buscando o arquivo style.css -->
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h1>📋 Gerenciador de Tarefas</h1>

    <!-- Formulário de Cadastro -->
    <div class="form-group">
        <label for="titulo">Título da Tarefa (mínimo 5 caracteres)</label>
        <input type="text" id="titulo" placeholder="Ex: Estudar algoritmos de JS">
    </div>

    <div class="form-group">
        <label for="prioridade">Prioridade</label>
        <select id="prioridade">
            <option value="1">1 - Alta</option>
            <option value="2" selected>2 - Média</option>
            <option value="3">3 - Baixa</option>
        </select>
    </div>

    <button onclick="salvarTarefa()">Cadastrar Tarefa</button>

    <!-- Listagem de Tarefas -->
    <ul id="listaTarefas" class="lista-tarefas">
        <!-- Inserido dinamicamente pelo JavaScript -->
    </ul>
</div>

<script>
    // ==========================================
    //       LÓGICA DO ALGORITMO JAVASCRIPT
    // ==========================================
    class GerenciadorTarefas {
        constructor() {
            this.tarefas = [];
            this.proximoCodigo = 1;
        }

        // 1. Cadastrar uma nova tarefa
        cadastrarTarefa(titulo, prioridade) {
            // Regra de Validação 1: Mínimo 5 caracteres
            if (!titulo || titulo.trim().length < 5) {
                alert("❌ Erro: O título deve ter no mínimo 5 caracteres.");
                return null;
            }

            // Regra de Validação 2: Prioridade entre 1 e 3
            if (![1, 2, 3].includes(prioridade)) {
                alert("❌ Erro: Prioridade inválida.");
                return null;
            }

            const novaTarefa = {
                codigo: this.proximoCodigo++,
                titulo: titulo.trim(),
                prioridade: prioridade,
                concluida: false
            };

            this.tarefas.push(novaTarefa);
            return novaTarefa;
        }

        // 3. Marcar uma tarefa como concluída
        marcarComoConcluida(codigo) {
            const tarefa = this.tarefas.find(t => t.codigo === codigo);
            if (tarefa) {
                tarefa.concluida = true;
                return true;
            }
            return false;
        }

        // 4. Alterar a prioridade de uma tarefa
        alterarPrioridade(codigo, novaPrioridade) {
            if (![1, 2, 3].includes(novaPrioridade)) return false;
            
            const tarefa = this.tarefas.find(t => t.codigo === codigo);
            if (tarefa) {
                tarefa.prioridade = novaPrioridade;
                return true;
            }
            return false;
        }
    }

    // Instancia o gerenciador globalmente
    const gerenciador = new GerenciadorTarefas();

    // ==========================================
    //         INTERAÇÃO COM A TELA (DOM)
    // ==========================================
    function salvarTarefa() {
        const inputTitulo = document.getElementById('titulo');
        const selectPrioridade = document.getElementById('prioridade');

        const titulo = inputTitulo.value;
        const prioridade = parseInt(selectPrioridade.value);

        const cadastrou = gerenciador.cadastrarTarefa(titulo, prioridade);

        if (cadastrou) {
            // Limpa os campos após o sucesso do cadastro
            inputTitulo.value = '';
            selectPrioridade.value = '2';
            renderizarLista();
        }
    }

    function alternarStatus(codigo) {
        gerenciador.marcarComoConcluida(codigo);
        renderizarLista();
    }

    function mudarPrioridade(codigo) {
        const novaPrio = prompt("Digite a nova prioridade:\n1 - Alta\n2 - Média\n3 - Baixa");
        const valorPrio = parseInt(novaPrio);

        if ([1, 2, 3].includes(valorPrio)) {
            gerenciador.alterarPrioridade(codigo, valorPrio);
            renderizarLista();
        } else if (novaPrio !== null) {
            alert("❌ Valor inválido! Digite apenas 1, 2 ou 3.");
        }
    }

    // 2. Listar as tarefas cadastradas (Renderizar na Tela)
    function renderizarLista() {
        const listaUI = document.getElementById('listaTarefas');
        listaUI.innerHTML = ''; // Limpa a lista antes de reconstruir

        if (gerenciador.tarefas.length === 0) {
            listaUI.innerHTML = '<li style="text-align:center; color:#94a3b8; font-size:14px; padding:20px;">Nenhuma tarefa cadastrada.</li>';
            return;
        }

        gerenciador.tarefas.forEach(tarefa => {
            const li = document.createElement('li');
            li.className = `tarefa-item prio-${tarefa.prioridade} ${tarefa.concluida ? 'concluida' : ''}`;

            const textoPrioridade = tarefa.prioridade === 1 ? "Alta" : tarefa.prioridade === 2 ? "Média" : "Baixa";
            
            // Monta a estrutura HTML de cada tarefa dinamicamente
            li.innerHTML = `
                <div class="tarefa-info">
                    <span class="titulo">${tarefa.titulo}</span>
                    <span class="meta">Cód: ${tarefa.codigo} | Prioridade: ${textoPrioridade}</span>
                </div>
                <div class="tarefa-acoes">
                    ${!tarefa.concluida 
                        ? `<button class="btn-acao btn-concluir" onclick="alternarStatus(${tarefa.codigo})">Concluir</button>
                           <button class="btn-acao btn-prio" onclick="mudarPrioridade(${tarefa.codigo})">Alterar Prio</button>`
                        : '<span class="badge-concluida">✅ Concluída</span>'
                    }
                </div>
            `;

            listaUI.appendChild(li);
        });
    }

    // Inicialização da listagem (começa vazia)
    renderizarLista();
</script>

<script src="script.js"></script></body>
