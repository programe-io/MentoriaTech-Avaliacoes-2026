<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <title>Gerenciador de Tarefas</title>
        <link href="style.css" rel="stylesheet"></head>
        <body>

            <h1>Gerenciador de Tarefas</h1>

                <h2>Cadastrar tarefa</h2>

                    <input id="codigo" placeholder="Código">
                        <input id="titulo" placeholder="Título da tarefa">

                            <select id="prioridade">
                                    <option value="1">Alta</option>
                                            <option value="2">Média</option>
                                                    <option value="3">Baixa</option>
                                                        </select>

                                                            <button onclick="cadastrar()">Cadastrar</button>

                                                                <h2>Lista de tarefas</h2>
                                                                    <div id="lista"></div>

                                                                        <h2>Alterar prioridade</h2>

                                                                            <input id="codigoAlterar" placeholder="Código da tarefa">

                                                                                <select id="novaPrioridade">
                                                                                        <option value="1">Alta</option>
                                                                                                <option value="2">Média</option>
                                                                                                        <option value="3">Baixa</option>
                                                                                                            </select>

                                                                                                                <button onclick="alterarPrioridade()">Alterar prioridade</button>

                                                                                                                <script src="script.js"></script></body>
                                                                                                                </html>
