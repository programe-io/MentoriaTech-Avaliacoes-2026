<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoFeed — Mini Rede Social da Natureza</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-icon">🍃</span>
        <div>
          <strong>EcoFeed</strong>
          <small>Comunidade da Natureza</small>
        </div>
      </div>

      <div class="user-chip">
        <span class="avatar">🌿</span>
        <span id="currentUserName">Marina Silva</span>
      </div>
    </div>
  </header>

  <main class="container feed-layout">
    <aside class="sidebar">
      <div class="card profile-card">
        <div class="avatar avatar-lg">🌿</div>
        <h2 id="profileName">Marina Silva</h2>
        <p class="muted">@marina.trilhas • Observadora de aves e flora</p>
        <div class="profile-stats">
          <div>
            <strong id="statPosts">0</strong>
            <span>Posts</span>
          </div>
          <div>
            <strong id="statLikes">0</strong>
            <span>Curtidas</span>
          </div>
        </div>
      </div>

      <div class="card filter-card">
        <h3>Explorar temas</h3>
        <div class="topic-list" id="topicFilters">
          <button class="topic-btn active" data-topic="Todos">Todos</button>
          <button class="topic-btn" data-topic="Trilhas">Trilhas</button>
          <button class="topic-btn" data-topic="Fauna">Fauna</button>
          <button class="topic-btn" data-topic="Florestas">Florestas</button>
          <button class="topic-btn" data-topic="Águas">Águas</button>
        </div>
      </div>
    </aside>

    <section class="feed-column">
      <!-- Criar nova postagem -->
      <form class="card composer-card" id="postForm">
        <div class="composer-top">
          <div class="avatar">🌿</div>
          <textarea
            id="postText"
            rows="3"
            placeholder="Compartilhe algo que você viu na natureza hoje..."
            required
          ></textarea>
        </div>

        <div class="composer-options">
          <label>
            Tema:
            <select id="postTopic">
              <option value="Trilhas">Trilhas</option>
              <option value="Fauna">Fauna</option>
              <option value="Florestas">Florestas</option>
              <option value="Águas">Águas</option>
            </select>
          </label>

          <label>
            Destaque visual:
            <select id="postVisual">
              <option value="none">Apenas texto</option>
              <option value="forest">🌳 Floresta</option>
              <option value="bird">🦜 Fauna</option>
              <option value="river">🌊 Rios &amp; Mares</option>
              <option value="sprout">🌱 Brotos &amp; Flores</option>
            </select>
          </label>
        </div>

        <div class="composer-footer">
          <span class="hint">Dica: mencione o local ou o que chamou atenção.</span>
          <button type="submit" class="btn-primary">Publicar</button>
        </div>
      </form>

      <!-- Lista de postagens -->
      <div class="feed-list" id="feedList"></div>
      <p class="empty-msg" id="emptyMsg" hidden>
        Nenhuma publicação encontrada para este tema.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
