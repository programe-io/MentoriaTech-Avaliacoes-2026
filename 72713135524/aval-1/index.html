
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Janice Rêgo 💗</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe4ef, #fff0f5);
      color: #8b2252;
      text-align: center;
      padding: 30px 15px;
    }

    .card {
      max-width: 450px;
      margin: auto;
      padding: 30px 20px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 8px 25px #e9a6c455;
    }

    h1 {
      color: #e75495;
      font-size: 34px;
    }

    .heart {
      font-size: 35px;
    }

    .info {
      background: #fff0f7;
      margin: 15px 0;
      padding: 15px;
      border-radius: 15px;
      font-size: 17px;
    }

    .footer {
      margin-top: 25px;
      font-style: italic;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="card">
    <div class="heart">🎀 💗 🎀</div>

    <h1>Janice Rêgo</h1>
    <h2>17 anos ✨</h2>

    <p>Bem-vindos ao meu cantinho! 💕</p>

    <div class="info">
      💁🏽‍♀️ <strong>Sou cacheada</strong>
    </div>

    <div class="info">
      🤎 <strong>Sou morena</strong>
    </div>

    <div class="info">
      😊 <strong>Sou sorridente</strong>
    </div>

    <p class="footer">
      "Minha essência, minha beleza,
      meu sorriso! 🌷"
    </p>

    <div class="heart">♡ ♡ ♡</div>
  </div>
<script src="script.js"></script></body>
</html>
