<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Gerencie seus produtos de forma simples</p>
    </header>

    <main>

        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: Cadeira Gamer"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        placeholder="Ex: 10"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input
                        type="number"
                        id="valor"
                        min="0.01"
                        step="0.01"
                        placeholder="Ex: 699.00"
                        required
                    >
                </div>

                <button type="submit">Cadastrar Produto</button>

            </form>
        </section>


        <section class="card">
            <h2>Atualizar Produto</h2>

            <div class="atualizacao">

                <div class="campo">
                    <label for="codigo">Código do Produto</label>
                    <input
                        type="number"
                        id="codigo"
                        min="1"
                        placeholder="Ex: 1"
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">Novo Valor</label>
                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 599.00"
                    >
                </div>

                <button type="button" id="btnValor">
                    Atualizar Valor
                </button>

                <div class="campo">
                    <label for="novaQuantidade">Adicionar Quantidade</label>
                    <input
                        type="number"
                        id="novaQuantidade"
                        min="1"
                        placeholder="Ex: 5"
                    >
                </div>

                <button type="button" id="btnQuantidade">
                    Atualizar Quantidade
                </button>

            </div>
        </section>


        <section class="card">
            <div class="titulo-lista">
                <div>
                    <h2>Produtos Cadastrados</h2>
                    <p>Lista dos produtos disponíveis no estoque</p>
                </div>

                <span id="totalProdutos">0 produtos</span>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Produtos serão inseridos pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>Sistema de Cadastro de Produtos</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
