<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>

    <div class="logo">🎬 StreamFlix</div>

    <nav>
        <a href="#catalogo">Catálogo</a>
        <a href="#favoritos">Favoritos</a>
    </nav>

    <input type="text" id="search" placeholder="Buscar filme..." onkeyup="buscarFilmes()">

</header>

<main>

    <section class="hero">
        <h1>Filmes, séries e muito mais</h1>
        <p>Escolha seu filme e assista o trailer</p>
    </section>

    <section id="catalogo" class="catalogo">

        <div class="card" data-nome="Interstellar">
            <img src="https://images.unsplash.com/photo-1524985069026-dd778a71c7b4?w=500">
            <h3>Interstellar</h3>
            <button onclick="verTrailer('Interstellar')">Trailer</button>
            <button onclick="favoritar('Interstellar')">⭐</button>
        </div>

        <div class="card" data-nome="Inception">
            <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500">
            <h3>Inception</h3>
            <button onclick="verTrailer('Inception')">Trailer</button>
            <button onclick="favoritar('Inception')">⭐</button>
        </div>

        <div class="card" data-nome="Avatar">
            <img src="https://images.unsplash.com/photo-1497032628192-86f99bcd76bc?w=500">
            <h3>Avatar</h3>
            <button onclick="verTrailer('Avatar')">Trailer</button>
            <button onclick="favoritar('Avatar')">⭐</button>
        </div>

    </section>

    <section id="favoritos" class="favoritos">

        <h2>⭐ Favoritos</h2>
        <div id="listaFavoritos"></div>

    </section>

</main>

<!-- MODAL TRAILER -->
<div id="modal" class="modal">

    <div class="modal-content">

        <span onclick="fecharModal()" class="close">X</span>

        <h2 id="tituloTrailer"></h2>

        <p>🎥 Trailer indisponível (demo do sistema)</p>

    </div>

</div>

<footer>
    <p>© 2026 StreamFlix - Projeto de estudo</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
