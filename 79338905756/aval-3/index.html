
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <aside class="sidebar">
        <h1>Instagram</h1>
        <nav>
            <a href="#">🏠 Início</a>
            <a href="#">🔍 Pesquisar</a>
            <a href="#">🎬 Reels</a>
            <a href="#">✉️ Mensagens</a>
            <a href="#">❤️ Notificações</a>
            <a href="#">➕ Criar publicação</a>
            <a href="#">👤 Perfil</a>
        </nav>
    </aside>

    <main class="container">

        <section class="stories">
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=1">
                <span>Você</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=2">
                <span>Maria</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=3">
                <span>Pedro</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=4">
                <span>Ana</span>
            </div>
        </section>

        <section id="feed">

            <article class="post">
                <div class="post-header">
                    <img src="https://i.pravatar.cc/100?img=5">
                    <strong>joaosilva</strong>
                    <span>•••</span>
                </div>

                <img class="post-image"
                src="https://picsum.photos/id/1015/600/600">

                <div class="actions">
                    <button class="like">♡</button>
                    <button>💬</button>
                    <button>➤</button>
                    <button class="save">♧</button>
                </div>

                <p class="likes">120 curtidas</p>

                <p>
                    <strong>joaosilva</strong>
                    Aproveitando o dia! ☀️
                </p>

                <p class="comments">Ver todos os comentários</p>

                <input
                    type="text"
                    placeholder="Adicione um comentário..."
                    class="comment-input"
                >
            </article>

        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
