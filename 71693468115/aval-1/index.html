<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Controle de Estoque</h1>

        <!-- Formulário para Cadastrar Produto -->
        <section class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-cadastro">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="codigo">Código</label>
                        <input type="text" id="codigo" placeholder="Ex: 001" required>
                    </div>
                    <div class="input-group">
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao" placeholder="Ex: Teclado Mecânico" required>
                    </div>
                    <div class="input-group">
                        <label for="quantidade">Quantidade</label>
                        <input type="number" id="quantidade" min="0" placeholder="Ex: 10" required>
                    </div>
                    <div class="input-group">
                        <label for="valor">Valor Unitário (R$)</label>
                        <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 150.00" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Tabela para Listar e Alterar Produtos -->
        <section class="card">
            <h2>Produtos Cadastrados</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor Unitário</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos">
                        <!-- Os produtos serão inseridos aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
            <p id="mensagem-vazio" class="vazio">Nenhum produto cadastrado no momento.</p>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
