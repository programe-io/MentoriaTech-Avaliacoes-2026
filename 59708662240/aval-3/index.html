<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  
<form id="formLivro" class="formulario">
    <label for="tituloLivro">Título do livro</label>
    <input id="tituloLivro" type="text" required>

    <label for="autorLivro">Autor</label>
    <input id="autorLivro" type="text" required>

    <label for="categoriaLivro">Categoria</label>
    <select id="categoriaLivro" required>
        <option value="Literatura" selected>Literatura</option>
        <option value="Ciências">Ciências</option>
        <option value="História">História</option>
        <option value="Geografia">Geografia</option>
        <option value="Matemática">Matemática</option>
        <option value="Informática">Informática</option>
        <option value="Outros">Outros</option>
    </select>

    <label for="isbnLivro">ISBN (opcional)</label>
    <input id="isbnLivro" type="text">

    <label for="quantidadeLivro">Quantidade</label>
    <input id="quantidadeLivro" type="number" min="1" value="1" required>

    <button type="submit">Cadastrar livro</button>
</form>

<div id="listaLivros"></div>


  <script src="script.js"></script>
  
</body>
</html>
