
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📋 Gerenciador de Tarefas</h1>
        <p>Organize suas atividades de maneira simples!</p>
    </header>

    <main>
        <section class="resumo">
            <div class="card">
                <h3>Total de tarefas</h3>
                <p id="total">0</p>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <p id="concluidas">0</p>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <p id="pendentes">0</p>
            </div>
        </section>

        <section class="formulario">
            <h2>Cadastrar nova tarefa</h2>

            <form id="formTarefa">
                <label for="titulo">Nome da tarefa:</label>
                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o nome da tarefa"
                    minlength="5"
                    required
                >

                <label for="descricao">Descrição:</label>
                <textarea
                    id="descricao"
                    placeholder="Descreva a tarefa"
                ></textarea>

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade" required>
                    <option value="1">1 - Alta</option>
                    <option value="2" selected>2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit" id="botaoCadastrar">
                    Cadastrar tarefa
                </button>
            </form>

            <p id="mensagem"></p>
        </section>

        <section class="lista">
            <h2>Minhas tarefas</h2>

            <input
                type="search"
                id="pesquisa"
                placeholder="Pesquisar tarefa..."
            >

            <div id="listaTarefas"></div>
        </section>
    </main>

    <footer>
        <p>Gerenciador de Tarefas - Projeto de programação</p>
    </footer>

<script src="script.js"></script></body>
</html>
