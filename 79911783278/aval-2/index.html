<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercadinho Natural</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🥑 Mercado Natural</h1>
    <p>Ingredientes fresquinhos para você!</p>
</header>

<nav>
    <a href="#produtos">Produtos</a>
    <a href="#carrinho">Carrinho 🛒</a>
</nav>

<h2 id="produtos">Nossos Ingredientes</h2>

<main class="produtos">

    <div class="produto">
        <img src="https://images.unsplash.com/photo-1543168256-418811576931?w=400" alt="Tomates">
        <h3>Tomate 🍅</h3>
        <p>R$ 5,00 / kg</p>
        <button onclick="adicionar('Tomate', 5)">Adicionar</button>
    </div>

    <div class="produto">
        <img src="https://images.unsplash.com/photo-1587049352851-8d4e89133924?w=400" alt="Cenoura">
        <h3>Cenoura 🥕</h3>
        <p>R$ 4,00 / kg</p>
        <button onclick="adicionar('Cenoura', 4)">Adicionar</button>
    </div>

    <div class="produto">
        <img src="https://images.unsplash.com/photo-1568584711271-6c929fb49e6d?w=400" alt="Batata">
        <h3>Batata 🥔</h3>
        <p>R$ 6,00 / kg</p>
        <button onclick="adicionar('Batata', 6)">Adicionar</button>
    </div>

    <div class="produto">
        <img src="https://images.unsplash.com/photo-1589927986089-35812388d1f4?w=400" alt="Cebola">
        <h3>Cebola 🧅</h3>
        <p>R$ 3,50 / kg</p>
        <button onclick="adicionar('Cebola', 3.5)">Adicionar</button>
    </div>

    <div class="produto">
        <img src="https://images.unsplash.com/photo-1568702846914-96b305d2aaeb?w=400" alt="Maçã">
        <h3>Maçã 🍎</h3>
        <p>R$ 8,00 / kg</p>
        <button onclick="adicionar('Maçã', 8)">Adicionar</button>
    </div>

    <div class="produto">
        <img src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400" alt="Banana">
        <h3>Banana 🍌</h3>
        <p>R$ 4,50 / kg</p>
        <button onclick="adicionar('Banana', 4.5)">Adicionar</button>
    </div>

</main>

<section id="carrinho">
    <h2>🛒 Meu Carrinho</h2>
    <ul id="lista"></ul>
    <h3>Total: R$ <span id="total">0.00</span></h3>
    <button onclick="finalizar()">Finalizar compra</button>
</section>

<script src="script.js"></script>

</body>
</html
  <script src="script.js"></script>
  
</body>
</html>
