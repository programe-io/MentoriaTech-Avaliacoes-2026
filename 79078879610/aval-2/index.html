<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="cabecalho">
  <span class="selo">AC</span>
  <p>O MURAL DA ANA CAROLINA</p>
  <h1>Pequenas vitórias.</h1>
  <p>Um lugar para celebrar cada passo do aprendizado.</p>
</header>

<main class="container">
  <section class="compositor">
    <h2>O que deu certo hoje?</h2>

    <form id="form">
      <label for="mensagem">Conte sua conquista</label>
      <textarea
        id="mensagem"
        rows="3"
        maxlength="240"
        placeholder="Hoje consegui..."
        required
      ></textarea>

      <div class="opcoes">
        <div>
          <label for="categoria">Categoria</label>
          <select id="categoria">
            <option value="estudo">📚 Estudo</option>
            <option value="criatividade">🎨 Criatividade</option>
            <option value="cotidiano">☀️ Dia a dia</option>
          </select>
        </div>

        <span id="contador">0/240</span>
        <button type="submit">Adicionar ao mural +</button>
      </div>
    </form>

    <p id="aviso" role="status"></p>
  </section>

  <div class="titulo-mural">
    <h2>Meu mural</h2>
    <span id="total">0 publicações</span>
  </div>

  <section id="mural" aria-label="Publicações"></section>
</main>

<footer>Ana Carolina • Mini Feed Social</footer>
  <script src="script.js"></script>
  
</body>
</html>
