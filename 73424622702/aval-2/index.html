<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Gerenciador de Tarefas</h1>
    <p class="sub">Prioridade de 1 (alta) a 3 (baixa). O título precisa ter pelo menos 5 caracteres.</p>

    <section class="panel">
      <h2>Cadastrar nova tarefa</h2>
      <form id="formTarefa" novalidate>
        <label class="grande">Título
          <input id="titulo" type="text" placeholder="Ex.: Enviar relatório mensal" autocomplete="off">
        </label>
        <label>Prioridade
          <select id="prioridade">
            <option value="1">1 - Alta</option>
            <option value="2" selected>2 - Média</option>
            <option value="3">3 - Baixa</option>
          </select>
        </label>
        <button type="submit">Cadastrar tarefa</button>
      </form>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
    </section>

    <section class="panel">
      <h2>Tarefas cadastradas</h2>
      <div class="resumo">
        <span>Total: <b id="total">0</b></span>
        <span>Pendentes: <b id="pendentes">0</b></span>
        <span>Concluídas: <b id="concluidas">0</b></span>
      </div>
      <div class="tabela">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Título</th>
              <th>Prioridade</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
