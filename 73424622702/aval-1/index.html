<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Estoque</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Controle de Estoque</h1>
    <p class="sub">Cadastre produtos, acompanhe o estoque e ajuste valor e quantidade. Quantidades de 5 ou menos aparecem em vermelho.</p>

    <section class="panel">
      <h2>Cadastrar novo produto</h2>
      <form id="formProduto" novalidate>
        <label>Código
          <input id="codigo" type="text" placeholder="Ex.: A001" autocomplete="off">
        </label>
        <label>Descrição
          <input id="descricao" type="text" placeholder="Ex.: Caneta azul" autocomplete="off">
        </label>
        <label>Quantidade
          <input id="quantidade" type="number" min="0" step="1" placeholder="0">
        </label>
        <label>Valor (R$)
          <input id="valor" type="number" min="0" step="0.01" placeholder="0,00">
        </label>
        <button type="submit">Cadastrar produto</button>
      </form>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
    </section>

    <section class="panel">
      <h2>Produtos cadastrados</h2>
      <div class="resumo">
        <span>Produtos: <b id="totalItens">0</b></span>
        <span>Unidades em estoque: <b id="totalUnid">0</b></span>
        <span>Valor total do estoque: <b id="totalValor">R$ 0,00</b></span>
      </div>
      <div class="tabela">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Descrição</th>
              <th class="num">Valor (R$)</th>
              <th class="num">Quantidade</th>
              <th class="num">Subtotal</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
