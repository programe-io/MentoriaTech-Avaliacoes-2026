<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Tarefas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="board">

    <!-- SIGNATURE: prancheta com clipe -->
    <header class="clipboard">
      <div class="clipboard__clip" aria-hidden="true"></div>
      <h1 class="clipboard__title">Lista de tarefas</h1>
      <p class="clipboard__sub">cadastre, acompanhe e conclua</p>
    </header>

    <!-- RESUMO -->
    <section class="summary" aria-label="Resumo das tarefas">
      <div class="summary__item">
        <span class="summary__value" id="statTotal">0</span>
        <span class="summary__label">tarefas</span>
      </div>
      <div class="summary__item">
        <span class="summary__value" id="statConcluidas">0</span>
        <span class="summary__label">concluídas</span>
      </div>
      <div class="summary__item">
        <span class="summary__value" id="statPendentes">0</span>
        <span class="summary__label">pendentes</span>
      </div>
    </section>

    <div class="layout">

      <!-- FORMULÁRIO -->
      <section class="panel panel--form" aria-label="Cadastrar nova tarefa">
        <h2 class="panel__title">Nova tarefa</h2>

        <form id="formTarefa" novalidate>
          <div class="field">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" placeholder="Ex.: Revisar relatório mensal" autocomplete="off" required>
            <span class="field__helper">mínimo de 5 caracteres</span>
          </div>

          <div class="field">
            <label for="prioridade">Prioridade</label>
            <select id="prioridade" name="prioridade" required>
              <option value="1">1 — Alta</option>
              <option value="2" selected>2 — Média</option>
              <option value="3">3 — Baixa</option>
            </select>
          </div>

          <p class="field__error" id="formError" role="alert"></p>

          <button type="submit" class="btn btn--primary">Cadastrar tarefa</button>
        </form>
      </section>

      <!-- LISTAGEM -->
      <section class="panel panel--list" aria-label="Tarefas cadastradas">
        <div class="panel__head">
          <h2 class="panel__title">Tarefas cadastradas</h2>
          <div class="filters" role="group" aria-label="Filtrar tarefas">
            <button type="button" class="filter is-active" data-filtro="todas">Todas</button>
            <button type="button" class="filter" data-filtro="pendentes">Pendentes</button>
            <button type="button" class="filter" data-filtro="concluidas">Concluídas</button>
          </div>
        </div>

        <ul class="task-list" id="listaTarefas">
          <!-- itens inseridos via JS -->
        </ul>

        <div class="empty-state" id="estadoVazio">
          <span class="empty-state__stamp">NADA POR AQUI</span>
          <p>Nenhuma tarefa cadastrada ainda.<br>Adicione a primeira ao lado.</p>
        </div>
      </section>

    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
