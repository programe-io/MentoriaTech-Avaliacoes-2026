
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h2>SocialFeed</h2>
        <span>Meu Feed</span>
    </header>

    <main class="container">

        <!-- Criar publicação -->
        <section class="criar-post">
            <h3>Criar publicação</h3>
            <textarea placeholder="No que você está pensando?"></textarea>
            <button>Publicar</button>
        </section>

        <!-- Publicação 1 -->
        <section class="post">
            <div class="usuario">
                <img src="https://i.pravatar.cc/100?img=12">
                <div>
                    <h3>pedro rafael</h3>
                    <small>Há 10 minutos</small>
                </div>
            </div>

            <p>Começando o dia com boas energias! ☀️</p>

            <img class="foto-post"
                 src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800">

            <div class="acoes">
                <button>❤️ Curtir</button>
                <button>💬 Comentar</button>
                <button>↗ Compartilhar</button>
            </div>

            <div class="comentarios">
                <input type="text" placeholder="Escreva um comentário...">
                <button>Enviar</button>
            </div>
        </section>

        <!-- Publicação 2 -->
        <section class="post">
            <div class="usuario">
                <img src="https://i.pravatar.cc/100?img=47">
                <div>
                    <h3>maria luary</h3>
                    <small>Há 1 hora</small>
                </div>
            </div>

            <p>Um pouco dos momentos especiais! ❤️</p>

            <img class="foto-post"
                 src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800">

            <div class="acoes">
                <button>❤️ Curtir</button>
                <button>💬 Comentar</button>
                <button>↗ Compartilhar</button>
            </div>

            <div class="comentarios">
                <input type="text" placeholder="Escreva um comentário...">
                <button>Enviar</button>
            </div>
        </section>

    </main>

</body>
</html>
