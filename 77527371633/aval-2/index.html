<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Ruan</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f3f3f3;
            color: #171717;
            font-family: Arial, sans-serif;
        }

        header {
            height: 55px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .logo {
            color: #d71920;
            font-size: 20px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #222;
            font-weight: bold;
        }

        main {
            width: min(100% - 30px, 620px);
            margin: 25px auto;
        }

        .post {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px #0000000d;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: #d71920;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .name {
            font-size: 14px;
            font-weight: bold;
        }

        .sub {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
        }

        .publish {
            background: #d71920;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            margin-left: auto;
        }

        .post-text {
            margin: 15px 0;
            font-size: 14px;
        }

        .post-image {
            width: 100%;
            max-width: 470px;
            max-height: 620px;
            object-fit: contain;
            display: block;
            margin: 10px auto;
            border-radius: 8px;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .actions button {
            background: #171717;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        @media (max-width: 480px) {
            main {
                width: calc(100% - 20px);
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="logo">MiniFeed</div>

        <nav>
            <a href="#">Início</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main>

        <!-- PUBLICAÇÃO DE ALIFY -->

        <section class="post">

            <div class="user">

                <div class="avatar">A</div>

                <div>
                    <div class="name">Alify</div>
                    <div class="sub">O que você está pensando?</div>
                </div>

                <button class="publish">Publicar</button>

            </div>

        </section>


        <!-- PUBLICAÇÃO 1 DE RUAN -->

        <article class="post">

            <div class="user">

                <div class="avatar">R</div>

                <div>
                    <div class="name">Ruan</div>
                    <div class="sub">Hoje</div>
                </div>

            </div>

            <p class="post-text">
                Hoje fui comprar roupas.
            </p>

            <img
                class="post-image"
                src="https://i.pinimg.com/736x/7c/8d/bf/7c8dbf5bd003b453bcf4dac44215a381.jpg"
                alt="Foto da roupa"
            >

            <div class="actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>


        <!-- PUBLICAÇÃO 2 DE Josué -->

        <article class="post">

            <div class="user">

                <div class="avatar">JF</div>

                <div>
                    <div class="name">Josué França</div>
                    <div class="sub">Há 7 dias</div>
                </div>

            </div>

            <p class="post-text">
                Fui ao shopping com a família.
            </p>

            <img
                class="post-image"
                src="https://i.pinimg.com/736x/03/80/b9/0380b927ca4f169e42173bcb71891ba8.jpg"
                alt="Foto do shopping"
            >

            <div class="actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>


        <!-- PUBLICAÇÃO 3 DE Mariana Reis -->

        <article class="post">

            <div class="user">

                <div class="avatar">MR</div>

                <div>
                    <div class="name">M.Reis</div>
                    <div class="sub">Ontem</div>
                </div>

            </div>

            <p class="post-text">
                Amei minhas novas maquiagens 🤭
            </p>

            <img
                class="post-image"
                src="https://i.pinimg.com/736x/84/be/85/84be85a39c14259ba94db682b9b1d7aa.jpg"
                alt="Foto de Maquiagens"
            >

            <div class="actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>

        <article class="post">

            <div class="user">

                <div class="avatar">KL</div>

                <div>
                    <div class="name">Kauã Leal</div>
                    <div class="sub">Há 2 horas</div>
                </div>

            </div>

            <p class="post-text">
                Um dia comum 😉...
            </p>

            <img
                class="post-image"
                src="https://i.pinimg.com/736x/79/75/d6/7975d6a7776cb5867ae03b037e2f69b4.jpg"
                alt="Foto Estudando"
            >

            <div class="actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

            <article class="post">

            <div class="user">

                <div class="avatar">LK</div>

                <div>
                    <div class="name">Lukinhas</div>
                    <div class="sub">Hoje</div>
                </div>

            </div>

            <p class="post-text">
                Treinei pesado hoje fml 🥵
            </p>

            <img
                class="post-image"
                src="https://i.pinimg.com/1200x/1d/d2/32/1dd232b32939845bf898d021d0d81dc6.jpg"
                alt="Foto do Campo"
            >

            <div class="actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>


    </main>

</body>
</html>
