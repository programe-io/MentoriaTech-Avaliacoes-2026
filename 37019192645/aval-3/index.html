<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Quiz da Turma</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="quiz-container">
        <header>
            <h1>🧠 Super Quiz!</h1>
            <div class="pontuacao-caixa">Pontos: <span id="pontos">0</span></div>
        </header>

        <main id="area-quiz">
            <h2 id="pergunta">Carregando pergunta...</h2>
            
            <div id="caixa-opcoes" class="grid-opcoes">
                <!-- Os botões das respostas vão aparecer aqui magicamente pelo JavaScript -->
            </div>
        </main>

        <div class="controles">
            <!-- Este botão fica escondido até o aluno responder -->
            <button id="btn-proximo" class="escondido">Próxima Pergunta ➔</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
