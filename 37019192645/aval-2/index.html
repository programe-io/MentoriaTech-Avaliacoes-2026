<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcade | Jogo da Velha</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>🎮 Portal Arcade</h1>
        <p>Clássicos direto no seu navegador</p>
    </header>

    <main>
        <section class="container-jogo">
            <h2>Jogo da Velha</h2>
            
            <!-- Mostra de quem é a vez ou quem ganhou -->
            <div id="status-jogo">Vez do jogador: X</div>
            
            <!-- O Tabuleiro -->
            <div class="tabuleiro" id="tabuleiro">
                <div class="celula" data-index="0"></div>
                <div class="celula" data-index="1"></div>
                <div class="celula" data-index="2"></div>
                <div class="celula" data-index="3"></div>
                <div class="celula" data-index="4"></div>
                <div class="celula" data-index="5"></div>
                <div class="celula" data-index="6"></div>
                <div class="celula" data-index="7"></div>
                <div class="celula" data-index="8"></div>
            </div>
            
            <!-- Botão de reiniciar -->
            <button id="btn-reiniciar">Reiniciar Jogo</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Portal Arcade.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
