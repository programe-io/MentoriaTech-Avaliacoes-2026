<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Feed Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="app-bar">
      <span class="app-bar__mark">feed<span class="app-bar__mark-dot">.</span></span>
          <span class="app-bar__tag">mini social</span>
            </header>

              <main class="feed">

                  <!-- POST — Eloisa Brito -->
                      <article class="post" style="--ring-a:#2F9BE0; --ring-b:#F2A93B;">
                            <div class="post__head">
                                    <div class="avatar-ring avatar-ring--initial">
                                              <span class="avatar avatar--initial">E</span>
                                                      </div>
                                                              <div class="post__who">
                                                                        <span class="post__name">Eloisa Brito</span>
                                                                                  <span class="post__meta">@eloisabrito &middot; 2 h</span>
                                                                                          </div>
                                                                                                  <button class="post__more" aria-label="Mais opções">&#8942;</button>
                                                                                                        </div>

                                                                                                              <p class="post__text">
                                                                                                                      Revendo "Como se Fosse a Primeira Vez" pela milésima vez 🌴🎸 —
                                                                                                                              uma das comédias românticas mais fofas que já assisti, choro
                                                                                                                                      até hoje no final.
                                                                                                                                            </p>

                                                                                                                                                  <div class="post__media">
                                                                                                                                                          <!-- Substitua o src abaixo pelo link do pôster de Como se Fosse a Primeira Vez -->
                                                                                                                                                                  <img src="https://i.postimg.cc/nVj1FJt2/poster-como-se-fosse-a-primeira-vez-2004.jpg" alt="Pôster do filme Como se Fosse a Primeira Vez">
                                                                                                                                                                        </div>

                                                                                                                                                                              <div class="post__actions">
                                                                                                                                                                                      <button class="action action--like">
                                                                                                                                                                                                <span class="action__icon">&#9825;</span>
                                                                                                                                                                                                          <span class="action__count">153</span>
                                                                                                                                                                                                                  </button>
                                                                                                                                                                                                                          <button class="action">
                                                                                                                                                                                                                                    <span class="action__icon">&#9998;</span>
                                                                                                                                                                                                                                              <span class="action__count">11</span>
                                                                                                                                                                                                                                                      </button>
                                                                                                                                                                                                                                                              <button class="action">
                                                                                                                                                                                                                                                                        <span class="action__icon">&#8635;</span>
                                                                                                                                                                                                                                                                                  <span class="action__count">7</span>
                                                                                                                                                                                                                                                                                          </button>
                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                    </article>

                                                                                                                                                                                                                                                                                                      </main>

                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                      </html>
