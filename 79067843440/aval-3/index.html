<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil - eloísa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0f16; color: #f5f5f5; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .tela { max-width: 420px; min-height: 100vh; margin: 0 auto; background: #0a0f16; padding-bottom: 80px; }
        svg { fill: none; stroke: #f5f5f5; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

          /* Topo */
            .topo { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; }
              .topo .icones { display: flex; gap: 22px; align-items: center; }
                .topo svg.grande { width: 26px; height: 26px; }

                  /* Info */
                    .info { display: flex; align-items: flex-start; padding: 0 16px; gap: 26px; margin-top: -8px; }
                      .avatar-area { position: relative; width: 84px; height: 84px; flex-shrink: 0; margin-top: 40px; }
                        .avatar { width: 84px; height: 84px; border-radius: 50%; background: linear-gradient(135deg, #a89f9a, #3a2c2c); filter: blur(1.5px); }
                          .nota { position: absolute; top: -34px; left: 6px; z-index: 2; background: #2a313b; color: #aeb6c2; font-size: 11px; line-height: 1.15; padding: 8px 10px; border-radius: 16px; text-align: center; width: 84px; }
                            .avatar-mais { position: absolute; right: -4px; bottom: 4px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid #0a0f16; display: flex; align-items: center; justify-content: center; }
                              .avatar-mais svg { width: 13px; height: 13px; stroke: #000; stroke-width: 3; }
                                .dados { flex: 1; }
                                  .nome { display: flex; align-items: center; gap: 6px; font-size: 22px; font-weight: 700; margin-top: 4px; }
                                    .nome svg { width: 14px; height: 14px; }
                                      .ponto-vermelho { width: 8px; height: 8px; background: #ff3040; border-radius: 50%; margin-left: 2px; }
                                        .arroba { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600; margin: 16px 0 14px; }
                                          .arroba svg { width: 13px; height: 13px; fill: #f5f5f5; stroke: none; }
                                            .numeros { display: flex; justify-content: space-between; margin-top: 0; }
                                              .numeros div { font-size: 15px; line-height: 1.25; }
                                                .numeros b { display: block; font-size: 19px; font-weight: 600; }

                                                  .bio { padding: 12px 16px 0; font-size: 15px; }
                                                    .bio .link { color: #6d9cff; }
                                                      .chip { display: inline-flex; align-items: center; gap: 8px; margin: 14px 16px 0; border: 1px solid #2e3640; border-radius: 22px; padding: 8px 14px; font-size: 14px; color: #c9d0da; }
                                                        .chip svg { width: 16px; height: 16px; }

                                                          /* Botões */
                                                            .botoes { display: flex; gap: 10px; padding: 18px 20px 0; }
                                                              .btn { flex: 1; background: #2a313b; border-radius: 10px; padding: 11px 0; text-align: center; font-size: 15px; font-weight: 600; }

                                                                /* Destaques */
                                                                  .destaques { display: flex; padding: 22px 18px 0; }
                                                                    .dest { width: 84px; text-align: center; font-size: 13px; }
                                                                      .dest .anel { width: 84px; height: 84px; border-radius: 50%; border: 1.5px solid #f5f5f5; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
                                                                        .dest svg { width: 30px; height: 30px; stroke-width: 2.5; }

                                                                          /* Abas */
                                                                            .abas { display: flex; margin-top: 26px; border-bottom: 1px solid #1e252e; }
                                                                              .aba { flex: 1; display: flex; justify-content: center; padding: 14px 0; }
                                                                                .aba svg { width: 28px; height: 28px; }
                                                                                  .aba.ativa { border-bottom: 2px solid #fff; }

                                                                                    /* Grade vazia */
                                                                                      .grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
                                                                                        .cel { aspect-ratio: 3 / 4; background: #1b1f25; }

                                                                                          /* Barra inferior */
                                                                                            .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: #0a0f16; border-top: 1px solid #1e252e; display: flex; align-items: center; justify-content: space-around; padding: 10px 6px 14px; }
                                                                                              .nav svg { width: 28px; height: 28px; }
                                                                                                .nav .item { display: flex; }
                                                                                                  .nav .perfil-ativo { background: #232a33; border-radius: 22px; padding: 6px 20px; }
                                                                                                    .mini-avatar { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; background: linear-gradient(135deg, #a89f9a, #3a2c2c); }
                                                                                                    </style>
