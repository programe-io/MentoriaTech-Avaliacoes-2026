
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header>
            <div>
                <h1>TaskFlow</h1>
                <p>Organize suas tarefas e acompanhe seu progresso.</p>
            </div>
        </header>

        <section class="dashboard">
            <div class="card">
                <h3>Total de tarefas</h3>
                <span id="total">0</span>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <span id="pendentes">0</span>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <span id="concluidas">0</span>
            </div>
        </section>

        <section class="formulario">
            <h2>Adicionar nova tarefa</h2>

            <input type="text" id="titulo" placeholder="Nome da tarefa">

            <textarea id="descricao" placeholder="Descrição da tarefa"></textarea>

            <div class="campos">
                <select id="prioridade">
                    <option value="Baixa">Prioridade baixa</option>
                    <option value="Média">Prioridade média</option>
                    <option value="Alta">Prioridade alta</option>
                </select>

                <input type="date" id="data">
            </div>

            <button id="btnSalvar" onclick="salvarTarefa()">
                Adicionar tarefa
            </button>
        </section>

        <section class="filtros">
            <h2>Minhas tarefas</h2>

            <input type="text" id="busca" placeholder="Pesquisar tarefa...">

            <div class="campos">
                <select id="filtroStatus">
                    <option value="Todas">Todos os status</option>
                    <option value="Pendente">Pendentes</option>
                    <option value="Concluída">Concluídas</option>
                </select>

                <select id="filtroPrioridade">
                    <option value="Todas">Todas as prioridades</option>
                    <option value="Baixa">Baixa</option>
                    <option value="Média">Média</option>
                    <option value="Alta">Alta</option>
                </select>
            </div>
        </section>

        <section id="listaTarefas" class="lista"></section>

        <p id="mensagemVazia" class="vazio">
            Nenhuma tarefa encontrada.
        </p>

        <footer>
            <p>TaskFlow - Gerenciador de Tarefas</p>
        </footer>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
