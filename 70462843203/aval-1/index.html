<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header class="header">
            <div>
                <h1>Gerenciador de Tarefas</h1>
                <p>Organize suas tarefas de forma simples.</p>
            </div>
        </header>

        <section class="form-card">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <div class="campo">
                    <label for="titulo">Título</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título da tarefa"
                    >
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <textarea
                        id="descricao"
                        placeholder="Digite uma descrição"
                    ></textarea>
                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="prioridade">Prioridade</label>

                        <select id="prioridade">
                            <option value="baixa">Baixa</option>
                            <option value="media" selected>Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="prazo">Prazo</label>
                        <input type="date" id="prazo">
                    </div>

                </div>

                <button type="submit" class="btn-primary">
                    Adicionar tarefa
                </button>

                <p id="mensagem"></p>

            </form>
        </section>

        <section class="resumo">

            <div class="resumo-card">
                <span>Total</span>
                <strong id="totalTarefas">0</strong>
            </div>

            <div class="resumo-card">
                <span>Pendentes</span>
                <strong id="tarefasPendentes">0</strong>
            </div>

            <div class="resumo-card">
                <span>Concluídas</span>
                <strong id="tarefasConcluidas">0</strong>
            </div>

            <div class="resumo-card">
                <span>Atrasadas</span>
                <strong id="tarefasAtrasadas">0</strong>
            </div>

        </section>

        <section class="lista-section">

            <div class="lista-header">
                <h2>Minhas tarefas</h2>

                <div class="filtros">

                    <input
                        type="text"
                        id="busca"
                        placeholder="Buscar tarefa..."
                    >

                    <select id="filtroStatus">
                        <option value="todas">Todas</option>
                        <option value="pendente">Pendentes</option>
                        <option value="concluida">Concluídas</option>
                    </select>

                    <select id="filtroPrioridade">
                        <option value="todas">Todas prioridades</option>
                        <option value="alta">Alta</option>
                        <option value="media">Média</option>
                        <option value="baixa">Baixa</option>
                    </select>

                </div>
            </div>

            <div id="listaTarefas" class="lista-tarefas">
                <!-- Tarefas serão inseridas pelo JavaScript -->
            </div>

        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
