
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="cabecalho">
        <div class="container">
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas tarefas e acompanhe seu progresso.</p>
        </div>
    </header>

    <main class="container">

        <!-- Formulário de cadastro -->
        <section class="card cadastro">
            <h2>Nova tarefa</h2>
            <p class="descricao">
                Preencha os campos abaixo para cadastrar uma tarefa.
            </p>

            <form id="taskForm">

                <div class="campo">
                    <label for="codigo">Código da tarefa</label>
                    <input
                        type="text"
                        id="codigo"
                        placeholder="Ex.: TAR001"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título da tarefa"
                        required
                    >
                    <small id="tituloErro" class="erro"></small>
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" required>
                        <option value="">Selecione a prioridade</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                    <small id="prioridadeErro" class="erro"></small>
                </div>

                <button type="submit" class="btn-primary">
                    + Cadastrar tarefa
                </button>

            </form>
        </section>

        <!-- Lista de tarefas -->
        <section class="card tarefas">
            <div class="titulo-lista">
                <div>
                    <h2>Minhas tarefas</h2>
                    <p class="descricao">
                        Acompanhe e gerencie suas atividades.
                    </p>
                </div>

                <span id="contador" class="contador">
                    0 tarefas
                </span>
            </div>

            <div id="listaTarefas" class="lista-tarefas">
                <!-- As tarefas serão inseridas pelo JavaScript -->
            </div>
        </section>

    </main>

    <footer>
        <p>Gerenciador de Tarefas &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
