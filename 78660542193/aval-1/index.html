<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSusto | Blog de Filmes de Terror</title>
    <!-- Fontes temáticas do Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Creepster&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="container header-content">
            <h1 class="logo">Cine<span>Susto</span></h1>
            <p class="subtitle">Críticas, clássicos e pesadelos da sétima arte</p>
        </div>
    </header>

    <main class="container">
        <!-- Barra de Filtros e Pesquisa -->
        <section class="controls">
            <div class="filters" id="category-filters">
                <button class="filter-btn active" data-category="todos">Todos</button>
                <button class="filter-btn" data-category="Slasher">Slasher</button>
                <button class="filter-btn" data-category="Sobrenatural">Sobrenatural</button>
                <button class="filter-btn" data-category="Psicológico">Psicológico</button>
            </div>
            <input type="text" id="search-input" placeholder="Buscar filme ou diretor...">
        </section>

        <!-- Grade de Artigos (Preenchida via JS) -->
        <section class="blog-grid" id="blog-grid">
            <!-- Os cards dos filmes aparecerão aqui -->
        </section>
    </main>

    <!-- Modal para ler a resenha completa -->
    <div id="article-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <img id="modal-img" src="" alt="Capa do filme">
            <span class="badge" id="modal-category"></span>
            <h2 id="modal-title"></h2>
            <p class="meta" id="modal-meta"></p>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CineSusto - Todos os direitos reservados. Não apague as luzes.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
