<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MiniFeed</title>
        <link rel="stylesheet" href="style.css">
    <link href="style.css" rel="stylesheet"></head>

    <body>
        
        <header>

            <div class="header-content">

                <h1>MiniFeed</h1>

                <nav>
        
                 <a href="#">Inicio</a>
                 <a href="#">Perfil</a>

                </nav>

            </div>


        </header>


        <main>


            <section class="new-post">

                <div class="user">
            
                    <div class="avatar">
                     I  
                    </div>
                    
                    <div>
                       <strong>isabelly</strong>
                       <span>O que você pensando?</span>
                    </div>

                </div>
 
          
                <button>Publicar</button>


            </section>

        
            <article class="post">

                <div class="post-header">

                    <div class="avatar">
                     I  
                    </div>
                    <div>
                       <strong>isabelly</strong>
                       <span>ha 10 minuntos</span>
                    </div>


                    <div class="post-text">
                      hoje eu vi um filme da moana
                      top,estou feliz:D
                    </div>
                    <img src="https://images.unsplash.com/photo-1720488012978-3feb99d687ac?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8bW9hbmF8ZW58MHx8MHx8fDA%3D" alt="imagem">

         
                    <div class="post-actions">

                      <button>Curtir</button>
                      <button>Comentar</button>
                      <button>Favoritar</button>
                     <button>Compartilhar</button>

                    </div>


                </div>

            </article>

        </main>

        <footer>
            <p>"minifeed- todos os direitos reservados-2026</p>
        </footer>
    </body>

</html>
