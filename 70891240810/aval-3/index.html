<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Controle de IMC</h1>
        <p>Cadastro e acompanhamento de pacientes</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar Paciente</h2>

            <form id="formPessoa">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" placeholder="Digite sua idade" required>

                <label for="altura">Altura (m):</label>
                <input type="number" id="altura" step="0.01" placeholder="Ex: 1.70" required>

                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" step="0.1" placeholder="Ex: 65" required>

                <p id="erro" hidden></p>

                <button type="submit">Salvar Paciente</button>

            </form>
        </section>

        <section class="tabela">
            <h2>Pacientes Cadastrados</h2>

            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaPessoas">
                        <!-- Os pacientes aparecerão aqui -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto desenvolvido para estudar JavaScript</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>$0
