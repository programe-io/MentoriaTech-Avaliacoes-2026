<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Estoque de Produtos</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <h1>📦 Controle de Estoque</h1>
        <p class="subtitulo">Cadastro e gerenciamento de produtos</p>

        <!-- Cadastro -->
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formCadastro">

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: Cadeira gamer"
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        placeholder="Ex: 10"
                        min="1"
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input
                        type="number"
                        id="valor"
                        placeholder="Ex: 699.90"
                        min="0"
                        step="0.01"
                    >
                </div>

                <button type="submit">Cadastrar Produto</button>

            </form>

            <p id="mensagemCadastro" class="mensagem"></p>
        </section>


        <!-- Atualização -->
        <section class="card">

            <h2>Atualizar Produto</h2>

            <div class="atualizacao">

                <div class="campo">
                    <label for="codigoAtualizacao">Código do Produto</label>
                    <input
                        type="number"
                        id="codigoAtualizacao"
                        placeholder="Ex: 1"
                        min="1"
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">Novo Valor</label>
                    <input
                        type="number"
                        id="novoValor"
                        placeholder="Ex: 799.90"
                        min="0"
                        step="0.01"
                    >
                </div>

                <button type="button" id="btnAtualizarValor">
                    Atualizar Valor
                </button>

            </div>

            <hr>

            <div class="atualizacao">

                <div class="campo">
                    <label for="codigoQuantidade">Código do Produto</label>
                    <input
                        type="number"
                        id="codigoQuantidade"
                        placeholder="Ex: 1"
                        min="1"
                    >
                </div>

                <div class="campo">
                    <label for="novaQuantidade">Quantidade a adicionar</label>
                    <input
                        type="number"
                        id="novaQuantidade"
                        placeholder="Ex: 5"
                        min="1"
                    >
                </div>

                <button type="button" id="btnAtualizarQuantidade">
                    Adicionar Estoque
                </button>

            </div>

            <p id="mensagemAtualizacao" class="mensagem"></p>

        </section>


        <!-- Lista de produtos -->
        <section class="card">

            <div class="titulo-lista">
                <h2>Produtos Cadastrados</h2>
                <span id="totalProdutos">0 produtos</span>
            </div>

            <div id="listaProdutos" class="lista-produtos">
                <p class="vazio">Nenhum produto cadastrado.</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
