<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Gerenciador de Tarefas</h1>

        <!-- Cadastro -->
        <div class="card">

            <h2>Cadastrar Tarefa</h2>

            <form id="formTarefa">

                <label for="titulo">
                    Título da tarefa
                </label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título da tarefa"
                >

                <label for="prioridade">
                    Prioridade
                </label>

                <select id="prioridade">

                    <option value="">
                        Selecione a prioridade
                    </option>

                    <option value="1">
                        1 - Alta
                    </option>

                    <option value="2">
                        2 - Média
                    </option>

                    <option value="3">
                        3 - Baixa
                    </option>

                </select>

                <button type="submit">
                    Cadastrar
                </button>

            </form>

            <p id="mensagemCadastro"></p>

        </div>


        <!-- Alterar prioridade -->
        <div class="card">

            <h2>Alterar Prioridade</h2>

            <label for="codigoPrioridade">
                Código da tarefa
            </label>

            <input
                type="number"
                id="codigoPrioridade"
                placeholder="Digite o código"
            >

            <label for="novaPrioridade">
                Nova prioridade
            </label>

            <select id="novaPrioridade">

                <option value="">
                    Selecione a prioridade
                </option>

                <option value="1">
                    1 - Alta
                </option>

                <option value="2">
                    2 - Média
                </option>

                <option value="3">
                    3 - Baixa
                </option>

            </select>

            <button
                type="button"
                id="btnAlterarPrioridade"
            >
                Alterar Prioridade
            </button>

            <p id="mensagemPrioridade"></p>

        </div>


        <!-- Lista -->
        <div class="card">

            <div class="cabecalho-lista">

                <h2>Tarefas Cadastradas</h2>

                <span id="totalTarefas">
                    0 tarefas
                </span>

            </div>

            <div id="listaTarefas">

                <p class="vazio">
                    Nenhuma tarefa cadastrada.
                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
