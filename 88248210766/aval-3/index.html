<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gray-100">

    <header class="bg-white border-b p-4">
        <h1 class="text-2xl font-bold text-center text-pink-600">
            Instagram
        </h1>
    </header>

    <main class="max-w-md mx-auto p-4">

        <section class="bg-white p-4 rounded-lg shadow mb-5">
            <h2 class="font-bold mb-3">Stories</h2>

            <div class="flex justify-around text-center">
                <div>
                    <div class="story">😊</div>
                    <p class="text-sm">Maria</p>
                </div>

                <div>
                    <div class="story">😍</div>
                    <p class="text-sm">Ana</p>
                </div>

                <div>
                    <div class="story">🥰</div>
                    <p class="text-sm">Julia</p>
                </div>

                <div>
                    <div class="story">😎</div>
                    <p class="text-sm">Pedro</p>
                </div>
            </div>
        </section>

        <section id="feed">

            <article class="bg-white rounded-lg shadow mb-5">
                <div class="p-3 font-bold">
                    @maria
                </div>

                <div class="post-image">
                    🌸
                </div>

                <div class="p-3">
                    <button onclick="curtir(this)">❤️ Curtir</button>
                    <p class="mt-2">
                        <strong>@maria</strong>
                        Um dia lindo para guardar na memória!
                    </p>

                    <p class="text-gray-500 text-sm">10 comentários</p>
                </div>
            </article>

        </section>

        <section class="bg-white p-4 rounded-lg shadow">
            <h2 class="font-bold mb-3">Nova publicação</h2>

            <input
                type="text"
                id="usuario"
                placeholder="Seu nome"
                class="border p-2 w-full rounded mb-2">

            <textarea
                id="legenda"
                placeholder="Escreva uma legenda..."
                class="border p-2 w-full rounded mb-2"></textarea>

            <button
                onclick="publicar()"
                class="bg-pink-600 text-white p-2 rounded w-full">
                Publicar
            </button>
        </section>

    </main>

    <footer class="text-center p-5 text-gray-500">
        Projeto Clone Instagram - 2026
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
