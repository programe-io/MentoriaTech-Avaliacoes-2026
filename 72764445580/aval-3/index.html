<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Adivinhação - Neon Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        p {
            font-size: 0.95rem;
            color: #cfcfcf;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            outline: none;
            text-align: center;
            transition: 0.3s;
        }

        input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }

        #mensagem {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 20px;
            min-height: 30px;
        }

        .stats {
            font-size: 0.9rem;
            color: #aaa;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }

        #btnReiniciar {
            display: none;
            width: 100%;
            margin-top: 15px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }

        #btnReiniciar:hover {
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="game-container">
        <h1>🎯 Adivinhe o Número</h1>
        <p>Tente adivinhar o número secreto entre <strong>1 e 100</strong>!</p>

        <div class="input-group">
            <input type="number" id="palpiteInput" min="1" max="100" placeholder="Digite seu palpite">
            <button id="btnAdivinhar" onclick="verificarPalpite()">Enviar</button>
        </div>

        <div id="mensagem"></div>

        <div class="stats">
            Tentativas restantes: <span id="tentativasRestantes">10</span>
        </div>

        <button id="btnReiniciar" onclick="reiniciarJogo()">Jogar Novamente</button>
    </div>

    <script>
        // Lógica do Jogo em JavaScript
        let numeroSecreto = Math.floor(Math.random() * 100) + 1;
        let tentativas = 10;

        const inputPalpite = document.getElementById('palpiteInput');
        const btnAdivinhar = document.getElementById('btnAdivinhar');
        const mensagem = document.getElementById('mensagem');
        const spanTentativas = document.getElementById('tentativasRestantes');
        const btnReiniciar = document.getElementById('btnReiniciar');

        // Permitir enviar pressionando a tecla "Enter"
        inputPalpite.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarPalpite();
            }
        });

        function verificarPalpite() {
            const palpite = Number(inputPalpite.value);

            // Validação de entrada
            if (!palpite || palpite < 1 || palpite > 100) {
                mensagem.style.color = "#ff4b5c";
                mensagem.textContent = "⚠️ Digite um número válido entre 1 e 100!";
                return;
            }

            tentativas--;
            spanTentativas.textContent = tentativas;

            if (palpite === numeroSecreto) {
                mensagem.style.color = "#38ef7d";
                mensagem.textContent = `🎉 Parabéns! Você acertou o número ${numeroSecreto}!`;
                fimDeJogo();
            } else if (tentativas === 0) {
                mensagem.style.color = "#ff4b5c";
                mensagem.textContent = `❌ Game Over! O número secreto era ${numeroSecreto}.`;
                fimDeJogo();
            } else if (palpite < numeroSecreto) {
                mensagem.style.color = "#00c6ff";
                mensagem.textContent = "📈 O número secreto é **MAIOR** que " + palpite + "!";
            } else {
                mensagem.style.color = "#ffaf7b";
                mensagem.textContent = "📉 O número secreto é **MENOR** que " + palpite + "!";
            }

            inputPalpite.value = "";
            inputPalpite.focus();
        }

        function fimDeJogo() {
            inputPalpite.disabled = true;
            btnAdivinhar.disabled = true;
            btnReiniciar.style.display = "block";
        }

        function reiniciarJogo() {
            numeroSecreto = Math.floor(Math.random() * 100) + 1;
            tentativas = 10;
            spanTentativas.textContent = tentativas;
            mensagem.textContent = "";
            inputPalpite.disabled = false;
            btnAdivinhar.disabled = false;
            btnReiniciar.style.display = "none";
            inputPalpite.value = "";
            inputPalpite.focus();
        }
    </script>
<script src="script.js"></script></body>
</html>
