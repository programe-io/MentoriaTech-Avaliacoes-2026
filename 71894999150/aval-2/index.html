
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Arquivo JavaScript -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header class="cabecalho">
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas tarefas e acompanhe suas prioridades.</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Cadastrar tarefa</h2>

            <form id="formTarefa">
                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex.: Estudar JavaScript"
                        minlength="5"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" required>
                        <option value="">Selecione a prioridade</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-principal">
                    Cadastrar tarefa
                </button>
            </form>

            <p
                id="mensagem"
                class="mensagem"
                role="status"
                aria-live="polite"
            ></p>
        </section>

        <section class="resumo">
            <div class="card resumo-item">
                <span>Total de tarefas</span>
                <strong id="totalTarefas">0</strong>
            </div>

            <div class="card resumo-item">
                <span>Em andamento</span>
                <strong id="totalPendentes">0</strong>
            </div>

            <div class="card resumo-item">
                <span>Concluídas</span>
                <strong id="totalConcluidas">0</strong>
            </div>
        </section>

        <section class="card">
            <div class="cabecalho-lista">
                <h2>Minhas tarefas</h2>

                <div class="campo filtro">
                    <label for="filtroStatus">Filtrar por status</label>
                    <select id="filtroStatus">
                        <option value="todas">Todas</option>
                        <option value="pendentes">Em andamento</option>
                        <option value="concluidas">Concluídas</option>
                    </select>
                </div>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaTarefas">
                        <tr>
                            <td colspan="5" class="vazio">
                                Nenhuma tarefa cadastrada.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto de revisão JavaScript — Gerenciador de Tarefas</p>
    </footer>
     <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
