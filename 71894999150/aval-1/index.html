<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
    <header class="topo">
        <div class="container">
            <h1>Gestão de Produtos</h1>
            <p>Cadastre, consulte e gerencie seu estoque.</p>
        </div>
    </header>

    <main class="container">
        <section class="painel">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" placeholder="Nome do produto" minlength="5" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="1" step="1" placeholder="Ex.: 10" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor unitário (R$)</label>
                    <input type="number" id="valor" min="0" step="0.01" placeholder="Ex.: 19.90" required>
                </div>

                <button type="submit" class="btn btn-principal">
                    Cadastrar produto
                </button>
            </form>

            <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
        </section>

        <section class="painel">
            <div class="cabecalho-lista">
                <div>
                    <h2>Produtos cadastrados</h2>
                    <p>Consulte e atualize seus produtos.</p>
                </div>
                <span id="totalProdutos" class="contador">0 produtos</span>
            </div>

            <div class="busca">
                <label for="buscaCodigo">Buscar por código</label>
                <div class="busca-linha">
                    <input type="number" id="buscaCodigo" min="1" step="1" placeholder="Digite o código">
                    <button type="button" id="btnBuscar" class="btn btn-secundario">
                        Buscar
                    </button>
                    <button type="button" id="btnLimpar" class="btn btn-neutro">
                        Limpar
                    </button>
                </div>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor unitário</th>
                            <th>Total em estoque</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="6" class="vazio">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Sistema de Gestão de Produtos</p>
    </footer>

    <script src="app.js" defer></script>
<script src="script.js"></script></body>

</html>
