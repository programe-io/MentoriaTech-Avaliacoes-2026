<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <div class="app-container">
        <!-- Cabeçalho -->
        <header class="app-header">
            <h1><i class="fa-solid fa-list-check"></i> Gestor de Tarefas</h1>
            <p>Organize e controle o seu fluxo de trabalho de forma simples</p>
        </header>

        <!-- Grid Principal -->
        <main class="main-grid">
            
            <!-- Cadastrar Tarefa -->
            <section class="card">
                <h2><i class="fa-solid fa-plus-circle"></i> Nova Tarefa</h2>
                <form id="formCadastrar" onsubmit="event.preventDefault();">
                    <div class="input-group">
                        <label for="tituloTarefa">Título (min. 5 caracteres)</label>
                        <input type="text" id="tituloTarefa" placeholder="Ex: Cadastrar Clientes" required>
                    </div>
                    <div class="input-group">
                        <label for="prioridadeTarefa">Prioridade (1 a 3)</label>
                        <input type="number" id="prioridadeTarefa" min="1" max="3" placeholder="Ex: 1" required>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="executarCadastro()">
                        <i class="fa-solid fa-check"></i> Cadastrar Tarefa
                    </button>
                </form>
            </section>

            <!-- Ações (Concluir e Alterar Prioridade) -->
            <section class="card-group">
                <!-- Concluir Tarefa -->
                <div class="card">
                    <h2><i class="fa-solid fa-circle-check"></i> Concluir Tarefa</h2>
                    <form id="formConcluir" onsubmit="event.preventDefault();">
                        <div class="input-group">
                            <label for="codigoConcluir">Código da Tarefa</label>
                            <input type="number" id="codigoConcluir" min="1" placeholder="Ex: 1" required>
                        </div>
                        <button type="button" class="btn btn-success" onclick="executarConclusao()">
                            <i class="fa-solid fa-check-double"></i> Marcar como Concluída
                        </button>
                    </form>
                </div>

                <!-- Alterar Prioridade -->
                <div class="card">
                    <h2><i class="fa-solid fa-sliders"></i> Alterar Prioridade</h2>
                    <form id="formPrioridade" onsubmit="event.preventDefault();">
                        <div class="input-row">
                            <div class="input-group">
                                <label for="codigoPrioridade">Código</label>
                                <input type="number" id="codigoPrioridade" min="1" placeholder="Ex: 1" required>
                            </div>
                            <div class="input-group">
                                <label for="novaPrioridade">Nova (1-3)</label>
                                <input type="number" id="novaPrioridade" min="1" max="3" placeholder="Ex: 2" required>
                            </div>
                        </div>
                        <button type="button" class="btn btn-warning" onclick="executarAlterarPrioridade()">
                            <i class="fa-solid fa-pen-to-square"></i> Atualizar Prioridade
                        </button>
                    </form>
                </div>
            </section>

            <!-- Tabela de Tarefas -->
            <section class="card full-width">
                <div class="card-header-actions">
                    <h2><i class="fa-solid fa-table-list"></i> Tarefas Registadas</h2>
                    <span id="badgeTotal" class="badge">0 tarefas</span>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Título</th>
                                <th>Prioridade</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaTarefasBody">
                            <tr>
                                <td colspan="4" class="empty-message">Nenhuma tarefa registada no momento.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <!-- Inclua o seu ficheiro JavaScript corrigido aqui -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
