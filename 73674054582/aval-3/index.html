<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas - To-Do List</title>
    <!-- Link para o CSS externo -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="todo-container">
        <h1>Minhas Tarefas</h1>
        
        <!-- Formulário para adicionar nova tarefa -->
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="O que você precisa fazer hoje?">
            <button id="addTaskBtn">Adicionar</button>
        </div>

        <!-- Filtros de visualização -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="pending">Pendentes</button>
            <button class="filter-btn" data-filter="completed">Concluídas</button>
        </div>

        <!-- Lista de tarefas -->
        <ul id="taskList"></ul>

        <!-- Rodapé com contador -->
        <div class="todo-footer">
            <span id="taskCount">0 tarefas pendentes</span>
            <button id="clearCompletedBtn">Limpar Concluídas</button>
        </div>
    </div>

    <!-- Link para o JavaScript externo -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
