<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel com 3 Ferramentas</title>
    <!-- Link para o CSS externo -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Painel Interativo - 3 em 1</h1>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('imc')">Calculadora IMC</button>
            <button class="tab-btn" onclick="switchTab('jogo')">Jogo da Velha</button>
            <button class="tab-btn" onclick="switchTab('notas')">Bloco de Notas</button>
        </div>
    </header>

    <main class="container">
        <!-- SEÇÃO 1: IMC -->
        <section id="imc" class="tab-content active">
            <h2>Calculadora de IMC</h2>
            <div class="form-group">
                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" placeholder="Ex: 70">
            </div>
            <div class="form-group">
                <label for="altura">Altura (m):</label>
                <input type="number" step="0.01" id="altura" placeholder="Ex: 1.75">
            </div>
            <button id="calcBtn">Calcular IMC</button>
            <div id="imcResult" class="result"></div>
        </section>

        <!-- SEÇÃO 2: JOGO DA VELHA -->
        <section id="jogo" class="tab-content">
            <h2>Jogo da Velha</h2>
            <div id="statusJogo" class="status">Vez do Jogador: X</div>
            <div class="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <button id="restartBtn" style="margin-top: 15px;">Reiniciar Jogo</button>
        </section>

        <!-- SEÇÃO 3: BLOCO DE NOTAS -->
        <section id="notas" class="tab-content">
            <h2>Bloco de Notas Rápido</h2>
            <textarea id="notaInput" placeholder="Digite sua nota aqui..."></textarea>
            <button id="salvarNotaBtn">Salvar Nota</button>
            <div id="listaNotas" class="notas-list"></div>
        </section>
    </main>

    <!-- Link para o JavaScript externo -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
