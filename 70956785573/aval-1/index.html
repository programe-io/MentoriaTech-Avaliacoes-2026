<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Produtos</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fonte Inter do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <!-- Cabeçalho -->
    <header class="header">
      <h1>Sistema de Gestão de Produtos</h1>
      <p>Cadastre, gira o seu stock e atualize preços em tempo real.</p>
    </header>

    <!-- Resumo de Cartões -->
    <section class="stats-grid">
      <div class="card stat-card">
        <span class="stat-title">Total de Produtos</span>
        <span class="stat-value" id="stat-total-produtos">0</span>
      </div>
      <div class="card stat-card">
        <span class="stat-title">Itens em Stock</span>
        <span class="stat-value" id="stat-total-itens">0</span>
      </div>
      <div class="card stat-card">
        <span class="stat-title">Valor Total do Stock</span>
        <span class="stat-value" id="stat-valor-total">R$ 0,00</span>
      </div>
    </section>

    <!-- Conteúdo Principal -->
    <div class="main-content">
      <!-- Formulário de Cadastro -->
      <section class="card form-section">
        <h2>Cadastrar Novo Produto</h2>
        <form id="form-produto">
          <div class="form-group">
            <label for="descricao">Descrição (mínimo 5 carateres)</label>
            <input type="text" id="descricao" placeholder="Ex: Cadeira Gamer" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="quantidade">Quantidade (mínimo 1)</label>
              <input type="number" id="quantidade" min="1" placeholder="Ex: 10" required>
            </div>
            <div class="form-group">
              <label for="valor">Valor Unitário (R$)</label>
              <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 699.00" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
        </form>
        <div id="mensagem-erro" class="alert error" style="display: none;"></div>
      </section>

      <!-- Tabela de Produtos -->
      <section class="card table-section">
        <h2>Lista de Produtos</h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Qtd</th>
                <th>Valor Unit.</th>
                <th>Total</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-produtos-body">
              <!-- Linhas geradas dinamicamente via JS -->
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <!-- Modal para Atualizações (Quantidade ou Valor) -->
  <div id="modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 id="modal-titulo">Atualizar Produto</h3>
      <p id="modal-descricao-produto"></p>
      
      <div class="form-group">
        <label id="modal-label-input" for="modal-input">Novo Valor</label>
        <input type="number" id="modal-input" step="0.01">
      </div>
      <div id="modal-mensagem-erro" class="alert error" style="display: none;"></div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btn-modal-salvar">Salvar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
