
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<main>
    <h1>Ficha de Anamnese</h1>

    <section class="card">
        <h2>Cadastrar Paciente</h2>

        <form id="formPessoa">
            <input type="text" id="nome" placeholder="Nome" maxlength="50" required>
            <input type="number" id="idade" placeholder="Idade" min="1" max="120" required>
            <input type="number" id="altura" placeholder="Altura (m)" min="0.5" max="2.5" step="0.01" required>
            <input type="number" id="peso" placeholder="Peso (kg)" min="1" max="500" step="0.1" required>

            <button type="submit">Salvar</button>
            <button type="reset" class="cancelar">Cancelar</button>
        </form>

        <p id="erro"></p>
    </section>

    <section class="card">
        <h2>Pacientes Cadastrados</h2>

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Altura</th>
                        <th>Peso</th>
                        <th>IMC</th>
                        <th>Classificação</th>
                    </tr>
                </thead>
                <tbody id="tabelaPessoas"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="app.js"></script>
<script src="script.js"></script></body>
</html>
