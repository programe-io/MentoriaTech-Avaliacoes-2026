<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZapChat</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="app">

    <!-- BARRA LATERAL -->
    <aside class="sidebar">

        <header class="sidebar-header">
            <div class="profile">
                <div class="avatar">👩</div>
                <span>Meu Perfil</span>
            </div>

            <div class="header-icons">
                <button onclick="novoChat()">＋</button>
                <button onclick="abrirConfiguracoes()">⚙️</button>
            </div>
        </header>

        <!-- PESQUISA -->
        <div class="search-area">
            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Pesquisar ou iniciar nova conversa"
                oninput="pesquisarConversas()"
            >
        </div>

        <!-- CONVERSAS -->
        <div id="chatList" class="chat-list">

            <div class="chat active" onclick="abrirChat('Ana')">
                <div class="avatar pink">👩🏻</div>
                <div class="chat-info">
                    <div class="chat-top">
                        <strong>Ana</strong>
                        <small>13:45</small>
                    </div>
                    <p id="preview-Ana">Oi! Tudo bem? 😊</p>
                </div>
            </div>

            <div class="chat" onclick="abrirChat('Lucas')">
                <div class="avatar blue">👦🏻</div>
                <div class="chat-info">
                    <div class="chat-top">
                        <strong>Lucas</strong>
                        <small>12:30</small>
                    </div>
                    <p id="preview-Lucas">Você vai hoje?</p>
                </div>
            </div>

            <div class="chat" onclick="abrirChat('Mariana')">
                <div class="avatar purple">👩🏽</div>
                <div class="chat-info">
                    <div class="chat-top">
                        <strong>Mariana</strong>
                        <small>11:18</small>
                    </div>
                    <p id="preview-Mariana">Amei essa foto! ❤️</p>
                </div>
            </div>

            <div class="chat" onclick="abrirChat('João')">
                <div class="avatar green">👨🏻</div>
                <div class="chat-info">
                    <div class="chat-top">
                        <strong>João</strong>
                        <small>Ontem</small>
                    </div>
                    <p id="preview-João">Até amanhã!</p>
                </div>
            </div>

        </div>

    </aside>

    <!-- ÁREA DO CHAT -->
    <main class="conversation">

        <header class="conversation-header">

            <div class="contact">
                <div id="contactAvatar" class="avatar pink">👩🏻</div>

                <div>
                    <h3 id="contactName">Ana</h3>
                    <span id="contactStatus">online</span>
                </div>
            </div>

            <div class="conversation-icons">
                <button onclick="pesquisarMensagem()">🔎</button>
                <button onclick="abrirMenu()">⋮</button>
            </div>

        </header>

        <!-- MENSAGENS -->
        <section id="messages" class="messages">

            <div class="date">HOJE</div>

            <div class="message received">
                <span>Oi! Tudo bem? 😊</span>
                <small>13:40</small>
            </div>

            <div class="message sent">
                <span>Oi, Ana! Tudo ótimo 😄</span>
                <small>13:42 ✓✓</small>
            </div>

            <div class="message received">
                <span>Que bom! O que você está fazendo?</span>
                <small>13:45</small>
            </div>

        </section>

        <!-- ÁREA DE DIGITAÇÃO -->
        <footer class="message-area">

            <button class="emoji-btn" onclick="mostrarEmojis()">😊</button>

            <input
                type="text"
                id="messageInput"
                placeholder="Digite uma mensagem"
                autocomplete="off"
            >

            <button class="attach-btn" onclick="anexarArquivo()">📎</button>

            <button class="send-btn" onclick="enviarMensagem()">➤</button>

        </footer>

    </main>

</div>

<!-- PAINEL DE EMOJIS -->
<div id="emojiPanel" class="emoji-panel">
    <button onclick="adicionarEmoji('😀')">😀</button>
    <button onclick="adicionarEmoji('😂')">😂</button>
    <button onclick="adicionarEmoji('😍')">😍</button>
    <button onclick="adicionarEmoji('🥰')">🥰</button>
    <button onclick="adicionarEmoji('😎')">😎</button>
    <button onclick="adicionarEmoji('😭')">😭</button>
    <button onclick="adicionarEmoji('❤️')">❤️</button>
    <button onclick="adicionarEmoji('👍')">👍</button>
    <button onclick="adicionarEmoji('🔥')">🔥</button>
    <button onclick="adicionarEmoji('🎉')">🎉</button>
</div>

<!-- MENU -->
<div id="menu" class="menu">
    <button onclick="limparConversa()">🗑️ Limpar conversa</button>
    <button onclick="verContato()">👤 Ver contato</button>
</div>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
