<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deixe sua Avaliação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.6rem;
        }

        p.subtitulo {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Estrelas */
        .estrelas {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            gap: 5px;
            margin-bottom: 10px;
        }

        .estrelas input {
            display: none;
        }

        .estrelas label {
            font-size: 2.5rem;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .estrelas label:hover,
        .estrelas label:hover ~ label,
        .estrelas input:checked ~ label {
            color: #ffc107;
            transform: scale(1.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .mensagem {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .mensagem.sucesso {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .mensagem.erro {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>⭐ Deixe sua Avaliação</h1>
        <p class="subtitulo">Sua opinião é muito importante para nós!</p>

        <form id="formAvaliacao">
            <div class="form-group">
                <label for="nome">Seu nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail (opcional)</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label>Nota da avaliação</label>
                <div class="estrelas">
                    <input type="radio" id="star5" name="nota" value="5" required>
                    <label for="star5" title="5 estrelas">★</label>

                    <input type="radio" id="star4" name="nota" value="4">
                    <label for="star4" title="4 estrelas">★</label>

                    <input type="radio" id="star3" name="nota" value="3">
                    <label for="star3" title="3 estrelas">★</label>

                    <input type="radio" id="star2" name="nota" value="2">
                    <label for="star2" title="2 estrelas">★</label>

                    <input type="radio" id="star1" name="nota" value="1">
                    <label for="star1" title="1 estrela">★</label>
                </div>
            </div>

            <div class="form-group">
                <label for="comentario">Comentário</label>
                <textarea id="comentario" name="comentario" placeholder="Conte como foi sua experiência..." required></textarea>
            </div>

            <button type="submit">Enviar Avaliação</button>

            <div id="mensagem" class="mensagem"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('formAvaliacao');
        const mensagem = document.getElementById('mensagem');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            // Coleta os dados do formulário
            const dados = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                nota: document.querySelector('input[name="nota"]:checked')?.value,
                comentario: document.getElementById('comentario').value
            };

            console.log('Avaliação enviada:', dados);

            /* =========================================================
               🔌 CONECTAR AO SEU BACKEND (descomente uma das opções)
               ========================================================= */

            // OPÇÃO 1 - PHP (arquivo salvar.php no mesmo diretório)
            /*
            const resposta = await fetch('salvar.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const resultado = await resposta.json();
            if (resultado.sucesso) { ... }
            */

            // OPÇÃO 2 - Formspree (sem backend próprio)
            /*
            await fetch('https://formspree.io/f/SUA_ID_AQUI', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            */

            // Exibe mensagem de sucesso (simulação)
            mensagem.textContent = '✅ Obrigado! Sua avaliação foi enviada com sucesso.';
            mensagem.className = 'mensagem sucesso';
            form.reset();

            setTimeout(() => {
                mensagem.style.display = 'none';
                mensagem.className = 'mensagem';
            }, 5000);
        });
    </script>
</body>
<
  <script src="script.js"></script>
  
</body>
</html>
