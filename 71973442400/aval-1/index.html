Claro — aqui está o código digitalizado da imagem, pronto para copiar e colar em um arquivo `index.html`:

```
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            width: 120px;
            padding: 8px;
            margin: 5px;
            font-size: 16px;
        }

        button {
            width: 60px;
            padding: 10px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        #resultado {
            font-size: 22px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <h1>Calculadora Simples</h1>

    <div>
        <input type="number" id="num1" placeholder="Número 1">
        <input type="number" id="num2" placeholder="Número 2">
    </div>

    <div>
        <button onclick="selecionarOperacao('+')">+</button>
        <button onclick="selecionarOperacao('-')">−</button>
        <button onclick="selecionarOperacao('*')">×</button>
        <button onclick="selecionarOperacao('/')">÷</button>
    </div>

    <div>
        <button onclick="calcular()">=</button>
        <button onclick="limpar()">Limpar</button>
    </div>

    <div id="resultado">Resultado: </div>

    <script>
        let operacao = '';

        function selecionarOperacao(op) {
            operacao = op;
        }

        function calcular() {
            let n1 = parseFloat(document.getElementById('num1').value);
            let n2 = parseFloat(document.getElementById('num2').value);

            if (isNaN(n1) || isNaN(n2)) {
                alert('Por favor, digite os dois números!');
                return;
            }

            let resultado;

            switch (operacao) {
                case '+':
                    resultado = n1 + n2;
                    break;

                case '-':
                    resultado = n1 - n2;
                    break;

                case '*':
                    resultado = n1 * n2;
                    break;

                case '/':
                    if (n2 === 0) {
                        alert('Não é possível dividir por zero!');
                        return;
                    }
                    resultado = n1 / n2;
                    break;

                default:
                    alert('Selecione uma operação!');
                    return;
            }

            document.getElementById('resultado').innerText =
                'Resultado: ' + resultado;
        }

        function limpar() {
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
            operacao = '';
            document.getElementById('resultado').innerText = 'Resultado: ';
        }
    </script>

</body>
</html>
```

 **Como usar:** crie uma pasta chamada `calculadora`, salve esse código como **`index.html`** e abra o arquivo no navegador.
