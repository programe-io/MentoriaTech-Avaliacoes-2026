<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutStore - As Melhores Camisas de Time</title>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="container header-content">
            <div class="logo">
                <i class="fa-solid fa-shirt"></i>
                <span>FutStore</span>
            </div>
            
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Pesquisar time, liga ou seleção...">
                <button><i class="fa-solid fa-search"></i></button>
            </div>

            <div class="header-actions">
                <button class="cart-btn" id="openCart">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Carrinho</span>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- BANNER DESTAQUE -->
    <section class="hero">
        <div class="hero-content">
            <h1>NOVA COLEÇÃO 2026/27</h1>
            <p>Vista a paixão pelo seu clube com mantas oficiais, alta qualidade e cores vibrantes.</p>
            <a href="#catalogo" class="btn-hero">Ver Catálogo</a>
        </div>
    </section>

    <!-- FILTROS E CATÁLOGO -->
    <main class="container" id="catalogo">
        <div class="section-title">
            <h2>Nossos Produtos</h2>
            <p>Escolha o manto do seu time do coração</p>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="todos">Todos</button>
            <button class="filter-btn" data-filter="nacional">Clubes Nacionais</button>
            <button class="filter-btn" data-filter="internacional">Clubes Internacionais</button>
            <button class="filter-btn" data-filter="selecao">Seleções</button>
        </div>

        <!-- GRADE DE PRODUTOS -->
        <div class="products-grid" id="productsGrid">
            <!-- Os produtos serão injetados via JavaScript -->
        </div>
    </main>

    <!-- MODAL DE DETALHES DO PRODUTO -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <div class="modal-body" id="modalBody">
                <!-- Conteúdo injetado via JS -->
            </div>
        </div>
    </div>

    <!-- MODAL DO CARRINHO -->
    <div class="modal" id="cartModal">
        <div class="modal-content cart-content">
            <div class="cart-header">
                <h3>Seu Carrinho</h3>
                <span class="close-modal" id="closeCart">&times;</span>
            </div>
            <div class="cart-items" id="cartItems">
                <!-- Itens do carrinho -->
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cartTotal">R$ 0,00</span>
                </div>
                <button class="btn-checkout" id="checkoutBtn">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <!-- RODAPÉ -->
    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 FutStore - Todos os direitos reservados.</p>
            <div class="social-links">
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
