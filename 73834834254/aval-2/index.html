<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Twitter - Web Intro</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@400;600&family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="twitter-container">
        <!-- Cabeçalho da Linha do Tempo -->
        <header class="timeline-header">
            <h2>Página Inicial</h2>
            <div class="tabs">
                <div class="tab active">Para você</div>
                <div class="tab">Seguindo</div>
            </div>
        </header>

        <!-- Caixa de Novo Tweet -->
        <div class="tweet-compose">
            <div class="avatar pink-avatar">✨</div>
            <div class="compose-body">
                <textarea id="tweet-input" placeholder="O que está acontecendo sobre a Web?"></textarea>
                <div class="compose-footer">
                    <span class="char-counter">0/280</span>
                    <button id="tweet-btn">Tweetar</button>
                </div>
            </div>
        </div>

        <!-- Feed com as Pessoas Discutindo o Texto -->
        <main id="tweet-feed">
            <!-- Os tweets simulados serão inseridos aqui via JS -->
        </main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
