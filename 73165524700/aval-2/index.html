
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Tarefas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #ccc;
        }

        h1 {
            text-align: center;
            color: #ffffff;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
            border-radius: 5px;
        }

        input, select {
            border: 1px solid #ccc;
        }

        button {
            background: #7e9fe6;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #7397e0;
        }

        .concluir {
            background: #16a34a;
        }

        .alterar {
            background: #3d099e;
        }

        .excluir {
            background: #dc2626;
        }

        .tarefa {
            background: #e4d5d5;
            padding: 15px;
            margin-top: 12px;
            border-radius: 7px;
        }

        .tarefa button {
            margin-top: 7px;
        }

        .mensagem {
            margin-top: 15px;
            font-weight: bold;
        }

        .concluida {
            color: green;
        }

        .pendente {
            color: #d97706;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Sistema de Tarefas</h1>

    <h3>Cadastrar nova tarefa</h3>

    <input type="text" id="titulo"
        placeholder="Digite o título da tarefa">

    <select id="prioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="cadastrarTarefaHTML()">
        Cadastrar tarefa
    </button>

    <p id="mensagem" class="mensagem"></p>

    <hr>

    <h3>Minhas tarefas</h3>

    <div id="listaTarefas"></div>

</div>

<script>
  
  
let tarefas = {};
let geradorCodigo = 0;
 

function validarDADOSTarefa(titulo, prioridade) {

    if (!titulo || titulo.trim().length < 5) {
        throw new Error(
            "O título deve ter no mínimo 5 caracteres."
        );
    }

    if (prioridade < 1 || prioridade > 3) {
        throw new Error(
            "A prioridade deve ser entre 1 e 3."
        );
    }
}


function buscarTarefa(codigoTarefa) {

    const tarefaBuscada = tarefas[codigoTarefa];

    if (!tarefaBuscada) {
        throw new Error("Código de tarefa não encontrado.");
    }

    return tarefaBuscada;
}



function cadastrarTarefa(titulo, prioridade) {

    validarDADOSTarefa(titulo, prioridade);

    const tarefa = {
        codigo: ++geradorCodigo,
        titulo: titulo.trim(),
        prioridade: Number(prioridade),
        status: true
    };

    tarefas[tarefa.codigo] = tarefa;

    return tarefa;
}


function listarTarefas() {
    return tarefas;
}



function concluirTarefa(codigo) {

    let tarefa = buscarTarefa(codigo);

    if (tarefa.status === false) {
        throw new Error("Esta tarefa já está concluída.");
    }

    tarefa.status = false;
}



function alterarPrioridade(codigo, novaPrioridade) {

    let tarefa = buscarTarefa(codigo);

    validarDADOSTarefa(
        tarefa.titulo,
        Number(novaPrioridade)
    );

    tarefa.prioridade = Number(novaPrioridade);
}



function cadastrarTarefaHTML() {

    const titulo = document.getElementById("titulo").value;
    const prioridade = Number(
        document.getElementById("prioridade").value
    );

    try {

        cadastrarTarefa(titulo, prioridade);

        mostrarMensagem("Tarefa cadastrada com sucesso!", "green");

        document.getElementById("titulo").value = "";

        atualizarLista();

    } catch (erro) {

        mostrarMensagem(erro.message, "red");

    }
}



function mostrarMensagem(texto, cor) {

    const mensagem = document.getElementById("mensagem");

    mensagem.textContent = texto;
    mensagem.style.color = cor;
}



function atualizarLista() {

    const lista = document.getElementById("listaTarefas");

    lista.innerHTML = "";

    Object.values(listarTarefas()).forEach(tarefa => {

        const div = document.createElement("div");

        div.className = "tarefa";

        div.innerHTML = `
            <h3>${tarefa.titulo}</h3>

            <p>Código: ${tarefa.codigo}</p>

            <p>Prioridade: ${tarefa.prioridade}
            - ${tarefa.prioridade === 1 ? "Alta" :
                tarefa.prioridade === 2 ? "Média" : "Baixa"}</p>

            <p class="${tarefa.status ? 'pendente' : 'concluida'}">
                Status: ${tarefa.status ? "Pendente" : "Concluída"}
            </p>

            <button class="concluir"
                onclick="concluirTarefaHTML(${tarefa.codigo})">
                Concluir
            </button>

            <button class="alterar"
                onclick="alterarPrioridadeHTML(${tarefa.codigo})">
                Alterar prioridade
            </button>
        `;

        lista.appendChild(div);

    });

}


// Concluir pelo HTML
function concluirTarefaHTML(codigo) {

    try {

        concluirTarefa(codigo);

        mostrarMensagem("Tarefa concluída!", "green");

        atualizarLista();

    } catch (erro) {

        mostrarMensagem(erro.message, "red");

    }

}


// Alterar prioridade pelo HTML
function alterarPrioridadeHTML(codigo) {

    const novaPrioridade = prompt(
        "Digite a nova prioridade:\n1 - Alta\n2 - Média\n3 - Baixa"
    );

    if (novaPrioridade === null) return;

    try {

        alterarPrioridade(codigo, Number(novaPrioridade));

        mostrarMensagem("Prioridade alterada!", "green");

        atualizarLista();

    } catch (erro) {

        mostrarMensagem(erro.message, "red");

    }

}

</script>

<script src="script.js"></script></body>
</html>
