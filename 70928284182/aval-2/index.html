<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Completo com Imagens</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; color: #333; }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            flex: 1; /* Faz o container ocupar o espaço restante entre header e footer */
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        main {
            flex: 3;
            padding: 20px;
        }

        aside {
            flex: 1;
            padding: 20px;
            background-color: #f8f9fa;
            border-left: 1px solid #ddd;
        }

        /* Estilização das Imagens */
        .img-principal {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .img-footer {
            height: 40px; /* Tamanho pequeno para o rodapé */
            filter: grayscale(100%) brightness(200%); /* Deixa a logo do footer branca/clara */
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: auto;
        }

        nav ul { list-style: none; padding: 0; display: flex; justify-content: center; gap: 20px; }
        nav a { color: white; text-decoration: none; }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Meu Web Site</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <main>
            <article>
                <h2>Destaque do Dia</h2>
                <img src="https://via.placeholder.com/800x300" alt="Banner Principal" class="img-principal">
                <p>Este é o corpo do texto onde apresentamos a informação principal ao utilizador.</p>
            </article>
        </main>

        <aside>
            <h3>Mais Lidas</h3>
            <p>Confira os posts mais populares da semana nesta seção lateral.</p>
        </aside>
    </div>

    <footer>
        <div class="footer-content">
            <img src="https://via.placeholder.com/150x50" alt="Logo do Rodapé" class="img-footer">
            <p>&copy; 2024 Todos os direitos reservados.</p>
        </div>
    </footer>

<script src="script.js"></script></body>
</html>
