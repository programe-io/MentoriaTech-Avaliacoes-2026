
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Feed</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #1877f2;
}

.post-box, .post {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    box-shadow: 0 2px 5px #ddd;
}

textarea {
    width: 100%;
    height: 80px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: none;
}

button {
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 8px;
}

.publicar {
    background: #1877f2;
    color: white;
    width: 100%;
}

.curtir {
    background: #eee;
}

.excluir {
    background: #ffdddd;
    color: red;
}

.nome {
    font-weight: bold;
    color: #1877f2;
}

.data {
    color: gray;
    font-size: 12px;
}

</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

<h1>📱 Meu Mini Feed</h1>

<div class="post-box">
    <textarea id="mensagem" placeholder="O que você está pensando?"></textarea>
    <button class="publicar" onclick="publicar()">Publicar</button>
</div>

<div id="feed"></div>

</div>

<script>
function publicar() {
    const campo = document.getElementById("mensagem");
    const texto = campo.value.trim();

    if (texto === "") {
        alert("Digite alguma coisa!");
        return;
    }

    const post = document.createElement("div");
    post.className = "post";

    const nome = document.createElement("div");
    nome.className = "nome";
    nome.textContent = "Usuário";

    const data = document.createElement("div");
    data.className = "data";
    data.textContent = new Date().toLocaleString("pt-BR");

    const conteudo = document.createElement("p");
    conteudo.textContent = texto;

    const curtir = document.createElement("button");
    curtir.className = "curtir";
    curtir.textContent = "❤️ Curtir (0)";

    let curtidas = 0;

    curtir.onclick = function() {
        curtidas++;
        curtir.textContent = "❤️ Curtir (" + curtidas + ")";
    };

    const excluir = document.createElement("button");
    excluir.className = "excluir";
    excluir.textContent = "Excluir";

    excluir.onclick = function() {
        post.remove();
    };

    post.append(nome, data, conteudo, curtir, excluir);

    document.getElementById("feed").prepend(post);

    campo.value = "";
}
</script>

<script src="script.js"></script></body>
</html>
