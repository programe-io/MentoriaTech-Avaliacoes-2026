<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Pesos</title>
    <link rel="stylesheet" href="estilo.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ Sistema de Controle de Pesos</h1>
            <p>Acompanhe sua evolução de peso ao longo do tempo</p>
        </header>

        <div class="form-section">
            <div class="form-group">
                <label for="peso">Peso (kg)</label>
                <input type="number" step="0.1" id="peso" placeholder="Ex: 72.5" required>
            </div>
            <button onclick="adicionarPeso()">📝 Registrar Peso</button>
        </div>

        <div class="list-section">
            <h2>📊 Histórico</h2>
            
            <div class="resumo">
                <div class="card">
                    <span class="valor" id="maior">-</span>
                    <span class="rotulo">Maior Peso</span>
                </div>
                <div class="card">
                    <span class="valor" id="menor">-</span>
                    <span class="rotulo">Menor Peso</span>
                </div>
                <div class="card">
                    <span class="valor" id="media">-</span>
                    <span class="rotulo">Média</span>
                </div>
            </div>

            <ul id="listaPesos">
                <li class="vazio">Nenhum peso registrado ainda.</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
