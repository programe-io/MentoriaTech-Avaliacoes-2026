<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, select, button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .tarefa {
            border: 1px solid #ddd;
            margin-top: 15px;
            padding: 15px;
            border-radius: 5px;
            background-color: #fafafa;
        }

        .concluida {
            background-color: #d4edda;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .botoes button {
            font-size: 14px;
        }

        .btn-concluir {
            background-color: #28a745;
        }

        .btn-prioridade {
            background-color: #ffc107;
            color: black;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Gerenciador de Tarefas</h1>

        <form id="formTarefa">

            <input
                type="text"
                id="titulo"
                placeholder="Digite o título da tarefa"
            >

            <select id="prioridade">
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button type="submit">Cadastrar Tarefa</button>

        </form>

        <h2>Tarefas cadastradas</h2>

        <div id="listaTarefas"></div>

    </div>

    <script>
        // Array que armazenará as tarefas
        const tarefas = [];

        // Código da próxima tarefa
        let proximoCodigo = 1;

        // Formulário
        const form = document.getElementById("formTarefa");

        // Evento de cadastro
        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const titulo = document.getElementById("titulo").value.trim();
            const prioridade = Number(
                document.getElementById("prioridade").value
            );

            // Validação do título
            if (titulo.length < 5) {
                alert("O título deve ter no mínimo 5 caracteres.");
                return;
            }

            // Validação da prioridade
            if (prioridade < 1 || prioridade > 3) {
                alert("A prioridade deve ser um valor entre 1 e 3.");
                return;
            }

            // Criando a tarefa
            const tarefa = {
                codigo: proximoCodigo,
                titulo: titulo,
                prioridade: prioridade,
                concluida: false
            };

            // Adicionando ao array
            tarefas.push(tarefa);

            // Incrementando o código
            proximoCodigo++;

            // Limpando o formulário
            form.reset();

            // Atualizando a lista
            listarTarefas();
        });


        // Função para listar as tarefas
        function listarTarefas() {

            const lista = document.getElementById("listaTarefas");

            lista.innerHTML = "";

            if (tarefas.length === 0) {
                lista.innerHTML = "<p>Nenhuma tarefa cadastrada.</p>";
                return;
            }

            tarefas.forEach(function(tarefa) {

                const div = document.createElement("div");

                div.classList.add("tarefa");

                if (tarefa.concluida) {
                    div.classList.add("concluida");
                }

                div.innerHTML = `
                    <strong>Código:</strong> ${tarefa.codigo}<br>
                    <strong>Título:</strong> ${tarefa.titulo}<br>
                    <strong>Prioridade:</strong> ${tarefa.prioridade}<br>
                    <strong>Status:</strong>
                    ${tarefa.concluida ? "Concluída" : "Pendente"}

                    <div class="botoes">

                        <button
                            class="btn-concluir"
                            onclick="concluirTarefa(${tarefa.codigo})">
                            Concluir
                        </button>

                        <button
                            class="btn-prioridade"
                            onclick="alterarPrioridade(${tarefa.codigo})">
                            Alterar prioridade
                        </button>

                    </div>
                `;

                lista.appendChild(div);
            });
        }


        // Função para concluir uma tarefa
        function concluirTarefa(codigo) {

            const tarefa = tarefas.find(function(tarefa) {
                return tarefa.codigo === codigo;
            });

            if (!tarefa) {
                alert("Tarefa não encontrada.");
                return;
            }

            tarefa.concluida = true;

            listarTarefas();
        }


        // Função para alterar a prioridade
        function alterarPrioridade(codigo) {

            const tarefa = tarefas.find(function(tarefa) {
                return tarefa.codigo === codigo;
            });

            if (!tarefa) {
                alert("Tarefa não encontrada.");
                return;
            }

            const novaPrioridade = Number(
                prompt(
                    "Digite a nova prioridade:\n1 - Alta\n2 - Média\n3 - Baixa"
                )
            );

            // Validação da nova prioridade
            if (novaPrioridade < 1 || novaPrioridade > 3 || isNaN(novaPrioridade)) {
                alert("A prioridade deve ser um valor entre 1 e 3.");
                return;
            }

            tarefa.prioridade = novaPrioridade;

            listarTarefas();
        }


        // Lista inicial
        listarTarefas();
    </script>

<script src="script.js"></script></body>
</html>
