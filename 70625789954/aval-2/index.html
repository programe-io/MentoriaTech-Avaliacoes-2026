<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>⚽ Sistema de Futebol</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <h1>⚽ Sistema de Futebol</h1>
            <p>Cadastro e gerenciamento de jogadores</p>
        </header>

        <section class="cadastro">

            <h2>🏆 Cadastrar Jogador</h2>

            <form id="formJogador">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do jogador"
                    required
                >

                <input
                    type="text"
                    id="time"
                    placeholder="Nome do time"
                    required
                >

                <input
                    type="number"
                    id="gols"
                    placeholder="Quantidade de gols"
                    min="0"
                    required
                >

                <input
                    type="number"
                    id="amarelos"
                    placeholder="Cartões amarelos"
                    min="0"
                    required
                >

                <input
                    type="number"
                    id="vermelhos"
                    placeholder="Cartões vermelhos"
                    min="0"
                    required
                >

                <button type="submit">
                    ⚽ Cadastrar Jogador
                </button>

            </form>

        </section>

        <section class="lista">

            <h2>📋 Jogadores cadastrados</h2>

            <div id="listaJogadores">
                <p>Nenhum jogador cadastrado.</p>
            </div>

        </section>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
