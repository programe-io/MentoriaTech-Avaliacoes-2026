
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Social Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Social<span>Feed</span></h1>
    <nav>
        <a href="#">Início</a>
        <a href="#">Explorar</a>
        <a href="#">Notificações 🔔</a>
        <a href="#">Perfil</a>
    </nav>
</header>

<main class="container">

    <section class="stories">
        <h2>Stories</h2>
        <div class="story-list">
            <div class="story"><img src="https://i.pravatar.cc/100?img=1"><p>Maria</p></div>
            <div class="story"><img src="https://i.pravatar.cc/100?img=2"><p>João</p></div>
            <div class="story"><img src="https://i.pravatar.cc/100?img=3"><p>Ana</p></div>
            <div class="story"><img src="https://i.pravatar.cc/100?img=4"><p>Pedro</p></div>
            <div class="story"><img src="https://i.pravatar.cc/100?img=5"><p>Lucas</p></div>
        </div>
    </section>

    <section class="create">
        <h2>Criar publicação</h2>
        <textarea id="postText" placeholder="O que você está pensando?"></textarea>
        <button onclick="createPost()">Publicar</button>
    </section>

    <section id="feed">

        <article class="post">
            <div class="user">
                <img src="https://i.pravatar.cc/100?img=1">
                <div>
                    <strong>Maria Silva</strong>
                    <small>@maria · agora</small>
                </div>
            </div>

            <p>Olá, pessoal! Bem-vindos ao meu novo feed! ❤️</p>

            <img class="post-image" src="https://picsum.photos/600/350?random=1">

            <div class="actions">
                <button onclick="likePost(this)">❤️ Curtir</button>
                <button onclick="commentPost(this)">💬 Comentar</button>
                <button>↗ Compartilhar</button>
            </div>

            <p class="likes">0 curtidas</p>
            <div class="comments"></div>
        </article>

    </section>

</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
