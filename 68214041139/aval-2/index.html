
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Gerenciador de Tarefas</title>

        <style>
            * {
                  margin: 0;
                        padding: 0;
                              box-sizing: border-box;
                                    font-family: Arial, sans-serif;
                                        }

                                            body {
                                                  background: #f0f2f5;
                                                        color: #333;
                                                              padding: 30px 15px;
                                                                  }

                                                                      .container {
                                                                            max-width: 650px;
                                                                                  margin: auto;
                                                                                        background: white;
                                                                                              padding: 25px;
                                                                                                    border-radius: 16px;
                                                                                                          box-shadow: 0 5px 20px #00000012;
                                                                                                              }

                                                                                                                  h1 {
                                                                                                                        text-align: center;
                                                                                                                              color: #5b4bdb;
                                                                                                                                    margin-bottom: 10px;
                                                                                                                                        }

                                                                                                                                            .subtitle {
                                                                                                                                                  text-align: center;
                                                                                                                                                        color: #777;
                                                                                                                                                              margin-bottom: 25px;
                                                                                                                                                                  }

                                                                                                                                                                      .form {
                                                                                                                                                                            display: flex;
                                                                                                                                                                                  gap: 10px;
                                                                                                                                                                                        margin-bottom: 20px;
                                                                                                                                                                                            }

                                                                                                                                                                                                input {
                                                                                                                                                                                                      flex: 1;
                                                                                                                                                                                                            min-width: 0;
                                                                                                                                                                                                                  padding: 13px;
                                                                                                                                                                                                                        border: 1px solid #ddd;
                                                                                                                                                                                                                              border-radius: 8px;
                                                                                                                                                                                                                                    font-size: 16px;
                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                            button {
                                                                                                                                                                                                                                                  border: none;
                                                                                                                                                                                                                                                        padding: 12px 16px;
                                                                                                                                                                                                                                                              border-radius: 8px;
                                                                                                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                                                                                                          font-size: 14px;
                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                  .add-btn {
                                                                                                                                                                                                                                                                                        background: #5b4bdb;
                                                                                                                                                                                                                                                                                              color: white;
                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                      .add-btn:hover {
                                                                                                                                                                                                                                                                                                            background: #4435b7;
                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                    .stats {
                                                                                                                                                                                                                                                                                                                          display: grid;
                                                                                                                                                                                                                                                                                                                                grid-template-columns: repeat(3, 1fr);
                                                                                                                                                                                                                                                                                                                                      gap: 10px;
                                                                                                                                                                                                                                                                                                                                            margin-bottom: 20px;
                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                    .stat {
                                                                                                                                                                                                                                                                                                                                                          background: #f4f2ff;
                                                                                                                                                                                                                                                                                                                                                                padding: 15px 5px;
                                                                                                                                                                                                                                                                                                                                                                      border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                            text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                    .stat strong {
                                                                                                                                                                                                                                                                                                                                                                                          display: block;
                                                                                                                                                                                                                                                                                                                                                                                                font-size: 24px;
                                                                                                                                                                                                                                                                                                                                                                                                      color: #5b4bdb;
                                                                                                                                                                                                                                                                                                                                                                                                            margin-bottom: 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                    .stat span {
                                                                                                                                                                                                                                                                                                                                                                                                                          font-size: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                color: #666;
                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                        .filters {
                                                                                                                                                                                                                                                                                                                                                                                                                                              display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    flex-wrap: wrap;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          gap: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                margin-bottom: 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .filter-btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              background: #eee;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    color: #444;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .filter-btn.active {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  background: #5b4bdb;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ul {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      list-style: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .task {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                gap: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      padding: 14px 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            border-bottom: 1px solid #eee;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .task input[type="checkbox"] {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          flex: 0 0 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                width: 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      height: 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            accent-color: #5b4bdb;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .task-name {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                flex: 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      overflow-wrap: anywhere;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .task.done .task-name {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    text-decoration: line-through;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          color: #999;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .delete-btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        background: #ffe8e8;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              color: #c62828;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    padding: 9px 11px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .empty {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        padding: 25px 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              color: #888;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .progress-area {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            margin-top: 25px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .progress-text {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                justify-content: space-between;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      gap: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            margin-bottom: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .progress-bar {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      height: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            background: #eee;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        overflow: hidden;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .progress-fill {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      height: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            width: 0%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  background: #5b4bdb;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        transition: width 0.3s;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .clear-btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  background: #f3f3f3;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: #555;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                @media (max-width: 450px) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .container {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              padding: 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .form {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  flex-direction: column;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .add-btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .stat strong {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          font-size: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
