
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        h1 {
            text-align: center;
            color: #263b63;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input, select, button {
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
        }

        input, select {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            cursor: pointer;
            color: white;
            background: #315dcc;
        }

        button:hover {
            opacity: 0.85;
        }

        .tarefa {
            border: 1px solid #ddd;
            border-left: 5px solid #315dcc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .tarefa.concluida {
            border-left-color: #198754;
            background: #f0fff5;
        }

        .tarefa.concluida h3 {
            text-decoration: line-through;
            color: #777;
        }

        .acoes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .acoes button, .acoes select {
            flex: 1;
            min-width: 120px;
        }

        .concluir {
            background: #198754;
        }

        .excluir {
            background: #dc3545;
        }

        .mensagem {
            margin-top: 12px;
            font-weight: bold;
        }

        .alta { color: #dc3545; }
        .media { color: #d28b00; }
        .baixa { color: #198754; }

        .vazio {
            text-align: center;
            color: #777;
            margin-top: 25px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <form id="formTarefa">
            <label for="titulo">Título da tarefa:</label>
            <input
                type="text"
                id="titulo"
                placeholder="Digite o título (mínimo 5 caracteres)"
                required
            >

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade" required>
                <option value="1">1 - Alta</option>
                <option value="2" selected>2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button type="submit">Cadastrar tarefa</button>
        </form>

        <p id="mensagem" class="mensagem" role="status"></p>

        <h2>Tarefas cadastradas</h2>
        <div id="listaTarefas"></div>
    </div>

    <script>
        let tarefas = [];
        let proximoCodigo = 1;

        const formulario = document.getElementById("formTarefa");
        const campoTitulo = document.getElementById("titulo");
        const campoPrioridade = document.getElementById("prioridade");
        const lista = document.getElementById("listaTarefas");
        const mensagem = document.getElementById("mensagem");

        // Cadastrar tarefa
        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const titulo = campoTitulo.value.trim();
            const prioridade = Number(campoPrioridade.value);

            if (titulo.length < 5) {
                mostrarMensagem(
                    "O título deve ter no mínimo 5 caracteres.",
                    true
                );
                return;
            }

            if (!Number.isInteger(prioridade) ||
                prioridade < 1 || prioridade > 3) {
                mostrarMensagem(
                    "A prioridade deve ser 1, 2 ou 3.",
                    true
                );
                return;
            }

            const tarefa = {
                codigo: proximoCodigo++,
                titulo: titulo,
                prioridade: prioridade,
                concluida: false
            };

            tarefas.push(tarefa);
            formulario.reset();
            campoPrioridade.value = "2";

            mostrarMensagem("Tarefa cadastrada com sucesso!");
            listarTarefas();
        });

        // Exibir mensagens
        function mostrarMensagem(texto, erro = false) {
            mensagem.textContent = texto;
            mensagem.style.color = erro ? "#dc3545" : "#198754";
        }

        // Listar tarefas
        function listarTarefas() {
            lista.replaceChildren();

            if (tarefas.length === 0) {
                const vazio = document.createElement("p");
                vazio.className = "vazio";
                vazio.textContent = "Nenhuma tarefa cadastrada.";
                lista.appendChild(vazio);
                return;
            }

            tarefas.forEach(function(tarefa) {
                const card = document.createElement("div");
                card.className = "tarefa" +
                    (tarefa.concluida ? " concluida" : "");

                const titulo = document.createElement("h3");
                titulo.textContent =
                    tarefa.codigo + " - " + tarefa.titulo;

                const status = document.createElement("p");
                status.textContent = "Status: " +
                    (tarefa.concluida ? "Concluída" : "Pendente");

                const prioridadeTexto = document.createElement("p");
                prioridadeTexto.textContent =
                    "Prioridade: " +
                    ["", "Alta", "Média", "Baixa"][tarefa.prioridade];

                prioridadeTexto.className =
                    ["", "alta", "media", "baixa"][tarefa.prioridade];

                const acoes = document.createElement("div");
                acoes.className = "acoes";

                const botaoConcluir = document.createElement("button");
                botaoConcluir.className = "concluir";
                botaoConcluir.textContent = tarefa.concluida
                    ? "Já concluída"
                    : "Concluir tarefa";
                botaoConcluir.disabled = tarefa.concluida;
                botaoConcluir.addEventListener("click", function() {
                    concluirTarefa(tarefa.codigo);
                });

                const seletor = document.createElement("select");
                seletor.setAttribute(
                    "aria-label",
                    "Alterar prioridade da tarefa " + tarefa.codigo
                );

                [
                    { valor: 1, texto: "1 - Alta" },
                    { valor: 2, texto: "2 - Média" },
                    { valor: 3, texto: "3 - Baixa" }
                ].forEach(function(opcao) {
                    const item = document.createElement("option");
                    item.value = opcao.valor;
                    item.textContent = opcao.texto;
                    seletor.appendChild(item);
                });

                seletor.value = String(tarefa.prioridade);

                seletor.addEventListener("change", function() {
                    alterarPrioridade(
                        tarefa.codigo,
                        Number(seletor.value)
                    );
                });

                const botaoExcluir = document.createElement("button");
                botaoExcluir.className = "excluir";
                botaoExcluir.textContent = "Excluir";
                botaoExcluir.addEventListener("click", function() {
                    excluirTarefa(tarefa.codigo);
                });

                acoes.append(botaoConcluir, seletor, botaoExcluir);
                card.append(titulo, prioridadeTexto, status, acoes);
                lista.appendChild(card);
            });
        }

        // Marcar tarefa como concluída
        function concluirTarefa(codigo) {
            const tarefa = tarefas.find(t => t.codigo === codigo);

            if (!tarefa) {
                mostrarMensagem("Tarefa não encontrada.", true);
                return;
            }

            tarefa.concluida = true;
            mostrarMensagem("Tarefa concluída com sucesso!");
            listarTarefas();
        }

        // Alterar prioridade
        function alterarPrioridade(codigo, novaPrioridade) {
            if (!Number.isInteger(novaPrioridade) ||
                novaPrioridade < 1 || novaPrioridade > 3) {
                mostrarMensagem("Prioridade inválida.", true);
                return;
            }

            const tarefa = tarefas.find(t => t.codigo === codigo);

            if (!tarefa) {
                mostrarMensagem("Tarefa não encontrada.", true);
                return;
            }

            tarefa.prioridade = novaPrioridade;
            mostrarMensagem("Prioridade alterada com sucesso!");
            listarTarefas();
        }

        // Excluir tarefa
        function excluirTarefa(codigo) {
            tarefas = tarefas.filter(t => t.codigo !== codigo);
            mostrarMensagem("Tarefa excluída.");
            listarTarefas();
        }

        listarTarefas();
    </script>
<script src="script.js"></script></body>
</html>
