
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <h1>Sistema de Estoque</h1>

    <h2>Cadastrar Produto</h2>

    <label>Descrição:</label>
    <input type="text" id="descricao" placeholder="Nome do produto">
    <br><br>

    <label>Quantidade:</label>
    <input type="number" id="quantidade" min="0">
    <br><br>

    <label>Valor (R$):</label>
    <input type="number" id="valor" min="0" step="0.01">
    <br><br>

    <button onclick="cadastrarProduto()">Cadastrar Produto</button>

    <hr>

    <h2>Produtos Cadastrados</h2>

    <button onclick="listarProdutos()">Listar Produtos</button>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
            </tr>
        </thead>
        <tbody id="listaProdutos"></tbody>
    </table>

    <hr>

    <h2>Alterar Valor</h2>

    <label>Código do produto:</label>
    <input type="number" id="codigoValor">
    <br><br>

    <label>Novo valor (R$):</label>
    <input type="number" id="novoValor" min="0" step="0.01">
    <br><br>

    <button onclick="alterarValor()">Alterar Valor</button>

    <hr>

    <h2>Alterar Quantidade</h2>

    <label>Código do produto:</label>
    <input type="number" id="codigoQuantidade">
    <br><br>

    <label>Quantidade a adicionar:</label>
    <input type="number" id="novaQuantidade" min="0">
    <br><br>

    <button onclick="alterarQuantidade()">Adicionar Quantidade</button>

    <script>
        let produtos = [];
        let proximoCodigo = 1;

        function cadastrarProduto() {
            let descricao = document.getElementById("descricao").value.trim();
            let quantidade = document.getElementById("quantidade").value;
            let valor = document.getElementById("valor").value;

            if (
                descricao.length < 5 ||
                quantidade === "" ||
                valor === "" ||
                Number(quantidade) < 0 ||
                Number(valor) < 0
            ) {
                alert("Preencha os dados corretamente!");
                return;
            }

            let produto = {
                codigo: proximoCodigo++,
                descricao: descricao,
                quantidade: Number(quantidade),
                valor: Number(valor)
            };

            produtos.push(produto);

            alert("Produto cadastrado com sucesso!");

            document.getElementById("descricao").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("valor").value = "";

            listarProdutos();
        }

        function listarProdutos() {
            let lista = document.getElementById("listaProdutos");
            lista.innerHTML = "";

            produtos.forEach(function(produto) {
                lista.innerHTML += `
                    <tr>
                        <td>${produto.codigo}</td>
                        <td>${produto.descricao}</td>
                        <td>${produto.quantidade}</td>
                        <td>R$ ${produto.valor.toFixed(2)}</td>
                    </tr>
                `;
            });
        }

        function alterarValor() {
            let codigo = Number(
                document.getElementById("codigoValor").value
            );

            let novoValor = document.getElementById("novoValor").value;

            let produto = produtos.find(function(p) {
                return p.codigo === codigo;
            });

            if (!produto) {
                alert("Produto não encontrado!");
                return;
            }

            if (novoValor === "" || Number(novoValor) < 0) {
                alert("Informe um valor válido!");
                return;
            }

            produto.valor = Number(novoValor);

            alert("Valor alterado com sucesso!");
            listarProdutos();
        }

        function alterarQuantidade() {
            let codigo = Number(
                document.getElementById("codigoQuantidade").value
            );

            let novaQuantidade =
                document.getElementById("novaQuantidade").value;

            let produto = produtos.find(function(p) {
                return p.codigo === codigo;
            });

            if (!produto) {
                alert("Produto não encontrado!");
                return;
            }

            if (
                novaQuantidade === "" ||
                Number(novaQuantidade) < 0
            ) {
                alert("Informe uma quantidade válida!");
                return;
            }

            produto.quantidade += Number(novaQuantidade);

            alert("Quantidade atualizada com sucesso!");
            listarProdutos();
        }
    </script>
<script src="script.js"></script></body>
</html>
