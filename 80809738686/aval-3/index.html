<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaClone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Barra Superior -->
  <header class="navbar">
    <div class="logo">Instagram</div>
    <div class="nav-icons">
      <i class="far fa-heart"></i>
      <i class="far fa-paper-plane"></i>
    </div>
  </header>

  <main class="container">
    <!-- Seção de Stories -->
    <div class="stories-container">
      <div class="story">
        <div class="story-border"><img src="https://picsum.photos/60/60?random=1" alt="User"></div>
        <span>Seu story</span>
      </div>
      <div class="story">
        <div class="story-border active"><img src="https://picsum.photos/60/60?random=2" alt="User"></div>
        <span>ana_dev</span>
      </div>
      <div class="story">
        <div class="story-border active"><img src="https://picsum.photos/60/60?random=3" alt="User"></div>
        <span>carlos_tech</span>
      </div>
      <div class="story">
        <div class="story-border active"><img src="https://picsum.photos/60/60?random=4" alt="User"></div>
        <span>julia_code</span>
      </div>
    </div>

    <!-- Caixa para Criar Nova Publicação -->
    <section class="create-post-card">
      <h3>Criar nova publicação</h3>
      <input type="text" id="imgUrlInput" placeholder="URL da Imagem (opcional)">
      <textarea id="captionInput" placeholder="Escreva uma legenda..." rows="2"></textarea>
      <button id="postBtn">Compartilhar</button>
    </section>

    <!-- Feed de Publicações -->
    <section id="feed" class="feed">
      <!-- Publicações inseridas via JavaScript -->
    </section>
  </main>

<script src="script.js"></script></body>
</html>
