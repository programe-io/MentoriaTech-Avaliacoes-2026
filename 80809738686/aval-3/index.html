<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevHub - Portal Avançado de Notícias</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Header da Aplicação -->
  <header class="navbar">
    <div class="nav-brand">
      <i class="fas fa-code"></i> Dev<span>Hub</span> <small class="version">v2.0</small>
    </div>
    <div class="nav-controls">
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Buscar por título ou tag...">
      </div>
      <button id="themeToggleBtn" class="btn-icon" title="Alternar Tema">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <div class="app-layout">
    <!-- Barra Lateral (Estatísticas e Criar Post) -->
    <aside class="sidebar">
      <!-- Card de Dashboard / Métricas -->
      <div class="widget metrics-card">
        <h3><i class="fas fa-chart-line"></i> Dashboard</h3>
        <div class="metrics-grid">
          <div class="metric-item">
            <span class="metric-value" id="totalPostsCount">0</span>
            <span class="metric-label">Artigos</span>
          </div>
          <div class="metric-item">
            <span class="metric-value" id="totalLikesCount">0</span>
            <span class="metric-label">Curtidas</span>
          </div>
        </div>
      </div>

      <!-- Formulário de Publicação Avançado -->
      <div class="widget form-widget">
        <h3><i class="fas fa-edit"></i> Publicar Artigo</h3>
        <form id="createPostForm">
          <div class="form-group">
            <label>Título</label>
            <input type="text" id="inputTitle" placeholder="Ex: Guia do TypeScript 5.0" required>
          </div>
          <div class="form-group">
            <label>Categoria</label>
            <select id="selectCategory" required>
              <option value="Frontend">Frontend</option>
              <option value="Backend">Backend</option>
              <option value="DevOps">DevOps</option>
              <option value="IA & Dados">IA & Dados</option>
            </select>
          </div>
          <div class="form-group">
            <label>Autor</label>
            <input type="text" id="inputAuthor" placeholder="Seu nome" required>
          </div>
          <div class="form-group">
            <label>Conteúdo</label>
            <textarea id="textContent" rows="4" placeholder="Escreva o artigo completo aqui..." required></textarea>
          </div>
          <button type="submit" class="btn-primary">
            <i class="fas fa-paper-plane"></i> Publicar Agora
          </button>
        </form>
      </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
      <!-- Filtros de Categorias em Abas -->
      <div class="category-tabs" id="categoryTabs">
        <button class="tab-btn active" data-category="ALL">Todas</button>
        <button class="tab-btn" data-category="Frontend">Frontend</button>
        <button class="tab-btn" data-category="Backend">Backend</button>
        <button class="tab-btn" data-category="DevOps">DevOps</button>
        <button class="tab-btn" data-category="IA & Dados">IA & Dados</button>
      </div>

      <!-- Feed de Artigos -->
      <section class="posts-feed" id="postsFeed">
        <!-- Renderizado dinamicamente via JS -->
      </section>
    </main>
  </div>

  <footer class="app-footer">
    <p>&copy; 2026 DevHub Media Platform — Sistema de Avaliação Avançado</p>
  </footer>

<script src="script.js"></script></body>
</html>
