<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed Social</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Barra de Navegação -->
  <header class="navbar">
    <div class="logo"><i class="fas fa-share-nodes"></i> Connect<span>Social</span></div>
    <div class="user-profile">
      <img src="https://picsum.photos/40/40?random=10" alt="Avatar" class="avatar-small">
      <span>Meu Perfil</span>
    </div>
  </header>

  <main class="feed-container">
    
    <!-- Caixa de Criar Post -->
    <section class="create-post-card">
      <div class="create-post-header">
        <img src="https://picsum.photos/40/40?random=10" alt="Avatar" class="avatar">
        <textarea id="postInput" placeholder="O que está acontecendo agora?" rows="3"></textarea>
      </div>
      <div class="create-post-actions">
        <div class="media-options">
          <button type="button" title="Adicionar Imagem"><i class="far fa-image"></i></button>
          <button type="button" title="Adicionar Emoji"><i class="far fa-smile"></i></button>
        </div>
        <button id="publishBtn" class="btn-publish">Publicar</button>
      </div>
    </section>

    <!-- Lista do Feed de Publicações -->
    <section id="feedList" class="feed-list">
      <!-- Posts serão inseridos aqui via JS -->
    </section>

  </main>

<script src="script.js"></script></body>
</html>
