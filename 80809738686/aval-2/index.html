<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Pro - Plataforma Interativa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">Dev<span>Blog</span></div>
    
    <div class="header-actions">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Pesquisar artigos...">
      </div>
      <button id="themeToggle" class="theme-btn" title="Alternar Tema">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- Filtros de Categoria -->
    <section class="filter-section">
      <button class="filter-btn active" data-category="all">Todos</button>
      <button class="filter-btn" data-category="Frontend">Frontend</button>
      <button class="filter-btn" data-category="Backend">Backend</button>
      <button class="filter-btn" data-category="Carreira">Carreira</button>
    </section>

    <!-- Grid de Posts -->
    <section class="posts-grid" id="postsContainer">
      <!-- Os posts serão gerados dinamicamente via JS -->
    </section>

    <!-- Formulário Avançado de Publicação -->
    <section class="form-card">
      <h2><i class="fas fa-pen-nib"></i> Criar Nova Publicação</h2>
      <form id="postForm">
        <div class="form-group">
          <label for="postTitle">Título do Artigo</label>
          <input type="text" id="postTitle" placeholder="Ex: Guia Completo de React" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="postCategory">Categoria</label>
            <select id="postCategory" required>
              <option value="Frontend">Frontend</option>
              <option value="Backend">Backend</option>
              <option value="Carreira">Carreira</option>
            </select>
          </div>
          <div class="form-group">
            <label for="postAuthor">Autor</label>
            <input type="text" id="postAuthor" placeholder="Seu nome" required>
          </div>
        </div>

        <div class="form-group">
          <label for="postContent">Conteúdo</label>
          <textarea id="postContent" rows="5" placeholder="Escreva o texto completo do post..." required></textarea>
        </div>

        <button type="submit" class="submit-btn"><i class="fas fa-paper-plane"></i> Publicar Artigo</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 - Desenvolvido com HTML5, CSS3 e JS Moderno</p>
  </footer>

<script src="script.js"></script></body>
</html>
