
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 30px 15px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000015;
        }

        h1, h2 {
            color: #244a73;
        }

        h1 {
            text-align: center;
        }

        .formulario {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: bold;
        }

        input {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            width: 100%;
        }

        button {
            padding: 11px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 14px;
            background: #2463a6;
        }

        button:hover {
            opacity: 0.85;
        }

        .botao-cadastrar {
            background: #198754;
            grid-column: 1 / -1;
        }

        .acoes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .acoes form {
            border: 1px solid #ddd;
            border-radius: 7px;
            padding: 15px;
        }

        .acoes input {
            margin-bottom: 10px;
        }

        .mensagem {
            margin: 15px 0;
            font-weight: bold;
        }

        .sucesso {
            color: #198754;
        }

        .erro {
            color: #dc3545;
        }

        .tabela-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #244a73;
            color: white;
        }

        tr:hover {
            background: #f5f8fc;
        }

        .vazio {
            text-align: center;
            color: #777;
        }

        .rodape {
            margin-top: 20px;
            color: #777;
            font-size: 13px;
            text-align: center;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>Cadastro de Produtos</h1>
        <p>Cadastre produtos e gerencie preços e quantidades.</p>

        <h2>Novo produto</h2>

        <form id="formCadastro" class="formulario">
            <div class="campo">
                <label for="descricao">Descrição</label>
                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex.: Botas cano alto"
                    required
                >
            </div>

            <div class="campo">
                <label for="quantidade">Quantidade</label>
                <input
                    type="number"
                    id="quantidade"
                    min="1"
                    step="1"
                    placeholder="Ex.: 20"
                    required
                >
            </div>

            <div class="campo">
                <label for="valor">Valor (R$)</label>
                <input
                    type="number"
                    id="valor"
                    min="0"
                    step="0.01"
                    placeholder="Ex.: 150,00"
                    required
                >
            </div>

            <button class="botao-cadastrar" type="submit">
                Cadastrar produto
            </button>
        </form>

        <h2>Atualizar produto</h2>

        <div class="acoes">
            <form id="formValor">
                <h3>Atualizar valor</h3>

                <label for="codigoValor">Código do produto</label>
                <input
                    type="number"
                    id="codigoValor"
                    min="1"
                    step="1"
                    required
                >

                <label for="novoValor">Novo valor (R$)</label>
                <input
                    type="number"
                    id="novoValor"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">Atualizar valor</button>
            </form>

            <form id="formQuantidade">
                <h3>Atualizar quantidade</h3>

                <label for="codigoQuantidade">Código do produto</label>
                <input
                    type="number"
                    id="codigoQuantidade"
                    min="1"
                    step="1"
                    required
                >

                <label for="novaQuantidade">Nova quantidade</label>
                <input
                    type="number"
                    id="novaQuantidade"
                    min="1"
                    step="1"
                    required
                >

                <button type="submit">Atualizar quantidade</button>
            </form>
        </div>

        <div id="mensagem" class="mensagem" role="status"
             aria-live="polite"></div>

        <h2>Lista de produtos</h2>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor unitário</th>
                        <th>Total em estoque</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                    <tr>
                        <td colspan="5" class="vazio">
                            Nenhum produto cadastrado.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p class="rodape">
            Sistema simples de gerenciamento de produtos.
        </p>
    </div>

    <script>
        // Lista de produtos
        let produtos = [];

        function validarProduto(descricao, quantidade, valor) {
            if (descricao.trim().length < 5) {
                throw new Error(
                    "Descrição deve ter no mínimo 5 caracteres!"
                );
            }

            if (!Number.isInteger(quantidade) || quantidade < 1) {
                throw new Error(
                    "Quantidade deve ser um número inteiro maior que zero!"
                );
            }

            if (!Number.isFinite(valor) || valor < 0) {
                throw new Error(
                    "Valor não pode ser negativo ou inválido!"
                );
            }
        }

        function cadastrarProduto(descricao, quantidade, valor) {
            descricao = descricao.trim();

            validarProduto(descricao, quantidade, valor);

            let novoProduto = {
                codigo: produtos.length
                    ? Math.max(...produtos.map(p => p.codigo)) + 1
                    : 1,
                descricao: descricao,
                quantidade: quantidade,
                valor: valor
            };

            produtos.push(novoProduto);
            listarProdutos();
        }

        function listarProdutos() {
            const tabela = document.getElementById("listaProdutos");

            if (produtos.length === 0) {
                tabela.innerHTML = `
                    <tr>
                        <td colspan="5" class="vazio">
                            Nenhum produto cadastrado.
                        </td>
                    </tr>
                `;
                return;
            }

            tabela.innerHTML = "";

            produtos.forEach(produto => {
                const linha = document.createElement("tr");

                const valores = [
                    produto.codigo,
                    produto.descricao,
                    produto.quantidade,
                    formatarMoeda(produto.valor),
                    formatarMoeda(produto.quantidade * produto.valor)
                ];

                valores.forEach(valor => {
                    const celula = document.createElement("td");
                    celula.textContent = valor;
                    linha.appendChild(celula);
                });

                tabela.appendChild(linha);
            });
        }

        function atualizarValor(codigoProduto, novoValor) {
            if (!Number.isFinite(novoValor) || novoValor < 0) {
                throw new Error("Valor não pode ser negativo!");
            }

            const produto = produtos.find(
                prod => prod.codigo === codigoProduto
            );

            if (!produto) {
                throw new Error("Produto não encontrado.");
            }

            produto.valor = novoValor;
            listarProdutos();
        }

        function atualizarQuantidade(codigoProduto, novaQuantidade) {
            if (!Number.isInteger(novaQuantidade) || novaQuantidade < 1) {
                throw new Error(
                    "Quantidade deve ser um número inteiro maior que zero!"
                );
            }

            const produto = produtos.find(
                prod => prod.codigo === codigoProduto
            );

            if (!produto) {
                throw new Error("Produto não encontrado.");
            }

            produto.quantidade = novaQuantidade;
            listarProdutos();
        }

        function formatarMoeda(valor) {
            return valor.toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL"
            });
        }

        function mostrarMensagem(texto, tipo) {
            const elemento = document.getElementById("mensagem");

            elemento.textContent = texto;
            elemento.className = "mensagem " + tipo;
        }

        // Cadastro
        document.getElementById("formCadastro")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                try {
                    const descricao =
                        document.getElementById("descricao").value;
                    const quantidade =
                        Number(document.getElementById("quantidade").value);
                    const valor =
                        Number(document.getElementById("valor").value);

                    cadastrarProduto(descricao, quantidade, valor);

                    mostrarMensagem(
                        "Produto cadastrado com sucesso!",
                        "sucesso"
                    );

                    this.reset();
                } catch (erro) {
                    mostrarMensagem(erro.message, "erro");
                }
            });

        // Atualização do valor
        document.getElementById("formValor")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                try {
                    const codigo =
                        Number(document.getElementById("codigoValor").value);
                    const valor =
                        Number(document.getElementById("novoValor").value);

                    if (!Number.isInteger(codigo) || codigo < 1) {
                        throw new Error("Informe um código válido.");
                    }

                    atualizarValor(codigo, valor);

                    mostrarMensagem(
                        "Valor atualizado com sucesso!",
                        "sucesso"
                    );

                    this.reset();
                } catch (erro) {
                    mostrarMensagem(erro.message, "erro");
                }
            });

        // Atualização da quantidade
        document.getElementById("formQuantidade")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                try {
                    const codigo = Number(
                        document.getElementById("codigoQuantidade").value
                    );
                    const quantidade = Number(
                        document.getElementById("novaQuantidade").value
                    );

                    if (!Number.isInteger(codigo) || codigo < 1) {
                        throw new Error("Informe um código válido.");
                    }

                    atualizarQuantidade(codigo, quantidade);

                    mostrarMensagem(
                        "Quantidade atualizada com sucesso!",
                        "sucesso"
                    );

                    this.reset();
                } catch (erro) {
                    mostrarMensagem(erro.message, "erro");
                }
            });

        // Exibe a lista inicial
        listarProdutos();
    </script>
<script src="script.js"></script></body>
</html>
