<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Controle de Estoque</title>

                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

                <body>

                <div class="container">

                    <h1>Controle de Estoque</h1>

                        <h2>Cadastrar Produto</h2>

                            <input type="text" id="descricao" placeholder="Descrição do produto">

                                <input type="number" id="quantidade" placeholder="Quantidade">

                                    <input type="number" id="valor" placeholder="Valor">

                                        <button onclick="cadastrarProduto()">Cadastrar Produto</button>

                                            <h2>Lista de Produtos</h2>

                                                <table>
                                                        <thead>
                                                                    <tr>
                                                                                    <th>Código</th>
                                                                                                    <th>Descrição</th>
                                                                                                                    <th>Quantidade</th>
                                                                                                                                    <th>Valor</th>
                                                                                                                                                </tr>
                                                                                                                                                        </thead>

                                                                                                                                                                <tbody id="listaProdutos"></tbody>
                                                                                                                                                                    </table>

                                                                                                                                                                        <h2>Atualizar Produto</h2>

                                                                                                                                                                            <input type="number" id="codigoAtualizar" placeholder="Código do produto">

                                                                                                                                                                                <input type="number" id="novoValor" placeholder="Novo valor">

                                                                                                                                                                                    <button onclick="atualizarValor()">Atualizar Valor</button>

                                                                                                                                                                                        <input type="number" id="novaQuantidade" placeholder="Quantidade para adicionar">

                                                                                                                                                                                            <button onclick="atualizarQuantidade()">Adicionar Estoque</button>

                                                                                                                                                                                            </div>

                                                                                                                                                                                            <script>

                                                                                                                                                                                            let produtos = [];

                                                                                                                                                                                            function validarProduto(descricao, quantidade, valor) {

                                                                                                                                                                                                if (descricao.trim().length < 5) {
                                                                                                                                                                                                        throw new Error("Descrição deve ter no mínimo cinco caracteres");
                                                                                                                                                                                                            }

                                                                                                                                                                                                                if (quantidade < 1 || !Number.isInteger(quantidade)) {
                                                                                                                                                                                                                        throw new Error("Quantidade deve ser maior que zero");
                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                if (valor < 0 || !Number.isFinite(valor)) {
                                                                                                                                                                                                                                        throw new Error("Valor inválido");
                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                            function cadastrarProduto() {

                                                                                                                                                                                                                                                try {

                                                                                                                                                                                                                                                        let descricao = document.getElementById("descricao").value;
                                                                                                                                                                                                                                                                let quantidade = Number(document.getElementById("quantidade").value);
                                                                                                                                                                                                                                                                        let valor = Number(document.getElementById("valor").value);

                                                                                                                                                                                                                                                                                validarProduto(descricao, quantidade, valor);

                                                                                                                                                                                                                                                                                        let novoProduto = {
                                                                                                                                                                                                                                                                                                    codigo: produtos.length + 1,
                                                                                                                                                                                                                                                                                                                descricao: descricao,
                                                                                                                                                                                                                                                                                                                            quantidade: quantidade,
                                                                                                                                                                                                                                                                                                                                        valor: valor
                                                                                                                                                                                                                                                                                                                                                };

                                                                                                                                                                                                                                                                                                                                                        produtos.push(novoProduto);

                                                                                                                                                                                                                                                                                                                                                                listarProdutos();

                                                                                                                                                                                                                                                                                                                                                                        alert("Produto cadastrado com sucesso!");

                                                                                                                                                                                                                                                                                                                                                                            } catch (erro) {
                                                                                                                                                                                                                                                                                                                                                                                    alert(erro.message);
                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                        function listarProdutos() {

                                                                                                                                                                                                                                                                                                                                                                                            let tabela = document.getElementById("listaProdutos");

                                                                                                                                                                                                                                                                                                                                                                                                tabela.innerHTML = "";

                                                                                                                                                                                                                                                                                                                                                                                                    produtos.forEach((produto) => {

                                                                                                                                                                                                                                                                                                                                                                                                            tabela.innerHTML += `
                                                                                                                                                                                                                                                                                                                                                                                                                        <tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                        <td>${produto.codigo}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td>${produto.descricao}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td>${produto.quantidade}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td>R$ ${produto.valor.toFixed(2)}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function atualizarValor() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    try {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let codigo = Number(document.getElementById("codigoAtualizar").value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let novoValor = Number(document.getElementById("novoValor").value);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (novoValor < 0 || !Number.isFinite(novoValor)) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        throw new Error("Valor inválido");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const produto = produtos.find(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    (prod) => prod.codigo === codigo
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (produto) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                produto.valor = novoValor;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            listarProdutos();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        alert("Valor atualizado!");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            throw new Error("Produto não encontrado");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } catch (erro) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                alert(erro.message);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function atualizarQuantidade() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        try {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let codigo = Number(document.getElementById("codigoAtualizar").value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let novaQuantidade = Number(document.getElementById("novaQuantidade").value);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!Number.isInteger(novaQuantidade) || novaQuantidade < 1) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            throw new Error("Quantidade inválida");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const produto = produtos.find(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        (prod) => prod.codigo === codigo
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (produto) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    produto.quantidade += novaQuantidade;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                listarProdutos();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alert("Quantidade atualizada!");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                throw new Error("Produto não encontrado");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } catch (erro) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert(erro.message);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
