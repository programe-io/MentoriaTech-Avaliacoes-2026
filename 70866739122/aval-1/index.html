<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Interativa Tudo-em-Um</title>
    <style>
        /* Estilização Global */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Cartão Principal */
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            color: #7f8c8d;
            font-size: 16px;
            line-height: 1.5;
        }

        /* Botão Interativo */
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 15px;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        /* Área de Mensagem Dinâmica */
        #mensagem {
            margin-top: 20px;
            font-weight: bold;
            color: #27ae60;
            min-height: 24px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="card">
        <h1>Olá! 👋</h1>
        <p>Este é um exemplo de código HTML único, contendo a estrutura, o design e a lógica juntos.</p>
        
        <button class="btn" onclick="mostrarSurpresa()">Clique aqui</button>
        
        <div id="mensagem"></div>
    </div>

    <script>
        // Lógica de Interatividade
        function mostrarSurpresa() {
            const mensagemDiv = document.getElementById('mensagem');
            mensagemDiv.innerHTML = "🎉 Código funcionando com sucesso!";
            
            // Efeito simples de mudança de cor no botão ao clicar
            const botao = document.querySelector('.btn');
            botao.style.backgroundColor = '#27ae60';
        }
    </script>

</body>
</html>
