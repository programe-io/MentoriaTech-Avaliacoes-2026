<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jogo 3D Batalha Celestial entre Anjos e Demônios">
    <title>HEAVEN'S GATE: DOOM 3D</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>GUERRA CELESTIAL 3D</h1>
        <p>Use WASD para mover e o MOUSE para mirar/atirar</p>
    </header>

    <main>
        <div id="game-container">
            <div id="canvas-3d"></div>

            <div id="doom-hud">
                <div class="hud-box">
                    <span class="hud-label">MUNIÇÃO</span>
                    <span id="hud-ammo" class="hud-value">200</span>
                </div>
                <div class="hud-box">
                    <span class="hud-label">SAÚDE</span>
                    <span id="hud-health" class="hud-value">100%</span>
                </div>
                <div id="hud-face-box">
                    <div id="angel-face">😇</div>
                </div>
                <div class="hud-box">
                    <span class="hud-label">ALMAS</span>
                    <span id="hud-score" class="hud-value">0</span>
                </div>
            </div>

            <div id="game-over-screen" class="hidden">
                <h2>VOCÊ CAIU EM BATALHA</h2>
                <p>O submundo dominou os portões...</p>
                <button id="btn-restart">REACENDER A LUZ (R)</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Trabalho Escolar de Desenvolvimento Web 3D. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
<script src="script.js"></script></body>
