<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>MiniFeed</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main>
        <section class="new-post">
            <h2>Nova publicação</h2>
            <textarea id="postInput" placeholder="O que você está pensando?"></textarea>
            <button id="publishBtn">Publicar</button>
        </section>

        <section id="feed">
            <article class="post">
                <div class="post-header">
                    <div class="avatar">M</div>
                    <div>
                        <strong>Davi</strong>
                        <small>Há 10 minutos</small>
                    </div>
                </div>

                <p>Hoje eu vi o filme Homem-Aranha no Aranhaverso. Muito bom!</p>

                <img
                    src="https://image.tmdb.org/t/p/original/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg"
                    alt="Homem-Aranha no Aranhaverso"
                    class="post-image"
                >

                <div class="post-actions">
                    <button class="likeBtn">Curtir</button>
                    <button class="commentBtn">Comentar</button>
                </div>
            </article>
        </section>
    </main>

    <footer>
        <p>© 2026 MiniFeed - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
