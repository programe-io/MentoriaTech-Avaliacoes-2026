
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 350px;
            text-align: center;
        }

        .login {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 40px 30px;
        }

        h1 {
            font-family: cursive;
            font-size: 42px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            background: #fafafa;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #1877f2;
        }

        .facebook {
            color: #385185;
            margin: 25px 0;
            font-weight: bold;
        }

        .senha {
            color: #00376b;
            font-size: 13px;
            text-decoration: none;
        }

        .cadastro {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 20px;
            margin-top: 10px;
        }

        .cadastro a {
            color: #0095f6;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <div class="login">

            <h1>Instagram</h1>

            <form onsubmit="event.preventDefault(); alert('Esta é apenas uma demonstração visual.');">

                <input type="text"
                    placeholder="Nome de usuário, email ou telefone"
                    autocomplete="off"
                    required>

                <input type="password"
                    placeholder="Senha"
                    autocomplete="new-password"
                    required>

                <button type="submit">Entrar</button>

            </form>

            <p class="facebook">Entrar com Facebook</p>

            <a href="https://www.instagram.com/accounts/password/reset/"
               class="senha">
                Esqueceu a senha?
            </a>

        </div>

        <div class="cadastro">
            Não tem uma conta?
            <a href="https://www.instagram.com/accounts/emailsignup/">
                Cadastre-se
            </a>
        </div>

        <footer>
            Página demonstrativa inspirada no Instagram.
        </footer>

    </div>

</body>
</html>
