
v<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha (Snake)</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
        }
        #score-container {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #score {
            color: #4ade80;
        }
        canvas {
            border: 4px solid #4ade80;
            background-color: #111;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.2);
            border-radius: 8px;
        }
        .instructions {
            margin-top: 20px;
            color: #a3a3a3;
            text-align: center;
            font-size: 0.9rem;
        }
        strong {
            color: #4ade80;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Jogo da Cobrinha</h1>
    <div id="score-container">Pontuação: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="instructions">
        Use as <strong>setas do teclado</strong> para mover a cobrinha e começar o jogo!
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 0; // Velocidade no eixo X
        let dy = 0; // Velocidade no eixo Y
        let score = 0;
        let gameInterval;

        function main() {
            if (hasGameEnded()) {
                alert("Game Over! Sua pontuação final foi: " + score);
                resetGame();
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        // Inicia o jogo
        resetGame();

        function clearCanvas() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // A cabeça da cobra fica com um tom de verde diferente
                ctx.fillStyle = index === 0 ? "#22c55e" : "#4ade80";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop(); // Remove o último pedaço se não comeu a comida
            }
        }

        function drawFood() {
            ctx.fillStyle = "#ef4444"; // Comida vermelha
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Evita que a comida apareça em cima da própria cobra
            snake.forEach(part => {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) generateFood();
            });
        }

        function hasGameEnded() {
            // Colisão com as paredes do cenário
            if (snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) {
                return true;
            }
            // Colisão com o próprio corpo (ignora a cabeça no loop)
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        // Captura os comandos do teclado
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const LEFT_KEY = 37;
            const UP_KEY = 38;
            const RIGHT_KEY = 39;
            const DOWN_KEY = 40;

            const keyPressed = event.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            // Previne que a cobra ande na direção oposta instantaneamente (ex: ir para a esquerda enquanto vai para a direita)
            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -1; dy = 0;
            }
            if (keyPressed === UP_KEY && !goingDown) {
                dx = 0; dy = -1;
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = 1; dy = 0;
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0; dy = 1;
            }
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            food = { x: 5, y: 5 };
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            clearInterval(gameInterval);
            gameInterval = setInterval(main, 100); // Executa o jogo a cada 100 milissegundos
        }
    </script>
</body>
</html>
