<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <title>Gerenciador de Tarefas</title>
            <link rel="stylesheet" href="style.css">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
            <body>

            <div class="container">
                <h1>Gerenciador de Tarefas</h1>

                    <h3>Cadastrar Tarefa</h3>

                        <input id="titulo" placeholder="Título da tarefa">

                            <select id="prioridade">
                                    <option value="1">1 - Alta</option>
                                            <option value="2">2 - Média</option>
                                                    <option value="3">3 - Baixa</option>
                                                        </select>

                                                            <button onclick="cadastrar()">Cadastrar Tarefa</button>

                                                                <h3>Alterar Prioridade</h3>

                                                                    <input id="codigo" type="number" placeholder="Código da tarefa">

                                                                        <select id="novaPrioridade">
                                                                                <option value="1">1 - Alta</option>
                                                                                        <option value="2">2 - Média</option>
                                                                                                <option value="3">3 - Baixa</option>
                                                                                                    </select>

                                                                                                        <button onclick="alterarPrioridade()">Alterar Prioridade</button>

                                                                                                            <h3>Lista de Tarefas</h3>

                                                                                                                <div id="lista"></div>
                                                                                                                </div>

                                                                                                                <script src="script.js"></script>
                                                                                                                <script src="script.js"></script></body>
                                                                                                                </html>
