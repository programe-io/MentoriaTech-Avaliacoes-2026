<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Super Mario Odyssey JS - 20 Fases</title>
                <link class="moz-style" rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <div style="position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none;">
                            <header>
                                        <h1>Super Mario Odyssey JS</h1>
                                                    <h3>Subtítulo oculto</h3>
                                                            </header>
                                                                    <nav>
                                                                                <a href="#">Home</a>
                                                                                        </nav>
                                                                                                <aside>
                                                                                                            <p>Conteúdo lateral oculto</p>
                                                                                                                    </aside>
                                                                                                                            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1' height='1'></svg>" alt="Icone Oculto">
                                                                                                                                    <footer>
                                                                                                                                                <p>Rodapé oculto</p>
                                                                                                                                                        </footer>
                                                                                                                                                            </div>

                                                                                                                                                                <main>
                                                                                                                                                                        <article>
                                                                                                                                                                                    <div id="game-container">
                                                                                                                                                                                                    <div id="ui">
                                                                                                                                                                                                                        <div>MARIO<br><span id="score">000000</span></div>
                                                                                                                                                                                                                                            <div>RECORD<br><span id="highscore">000000</span></div>
                                                                                                                                                                                                                                                                <div>MOEDAS<br><span id="coins">000</span></div>
                                                                                                                                                                                                                                                                                    <div>FASE<br><span id="level">1/20</span></div>
                                                                                                                                                                                                                                                                                                        <div>VIDAS<br><span id="lives">3</span></div>
                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                        <div id="main-menu" class="overlay">
                                                                                                                                                                                                                                                                                                                                                            <div class="menu-box">
                                                                                                                                                                                                                                                                                                                                                                                    <h1 class="mario-title">SUPER MARIO</h1>
                                                                                                                                                                                                                                                                                                                                                                                                            <p>20 FASES & BOSSES ESPECIAIS</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                    <button id="btn-start-game">JOGAR</button><br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="btn-open-shop" style="background: #ff9800;">LOJINHA</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="shop-screen" class="overlay hidden">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="menu-box shop-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>LOJA DE HABILIDADES</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Suas Moedas: <span id="shop-coins">0</span> 🪙</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="shop-items"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button id="btn-close-shop" style="background: #555;">FECHAR</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="level-screen" class="overlay hidden">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="menu-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2 id="level-title">FASE 1</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p id="level-desc">Prepare-se...</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button id="btn-start-level">START</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="pause-screen" class="overlay hidden">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="menu-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2>JOGO PAUSADO</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="btn-resume">CONTINUAR</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <canvas id="gameCanvas" width="800" height="400"></canvas>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="mobile-controls">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="d-pad">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="btn-left">◀</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button id="btn-right">▶</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="center-buttons">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button id="btn-pause-mobile">PAUSE</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="btn-ability-mobile" style="background:#ff9800; font-size:12px; width:50px; height:45px;">X</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="action-buttons">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="btn-jump">A</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </article>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="game.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
