
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação de HTML</title>
<link href="style.css" rel="stylesheet"></head>
<body>
    <h1>Avaliação de HTML</h1>

    <h2>1. O que significa HTML?</h2>

    <form>
        <input type="radio" name="q1" id="a">
        <label for="a">A) HyperText Markup Language</label>
        <br>

        <input type="radio" name="q1" id="b">
        <label for="b">B) Home Tool Modern Language</label>
        <br>

        <input type="radio" name="q1" id="c">
        <label for="c">C) HighText Machine Language</label>
        <br>

        <h2>2. Qual tag cria um parágrafo?</h2>

        <input type="radio" name="q2" id="d">
        <label for="d">A) &lt;h1&gt;</label>
        <br>

        <input type="radio" name="q2" id="e">
        <label for="e">B) &lt;p&gt;</label>
        <br>

        <input type="radio" name="q2" id="f">
        <label for="f">C) &lt;img&gt;</label>
        <br>

        <h2>3. Qual tag insere uma imagem?</h2>

        <input type="radio" name="q3" id="g">
        <label for="g">A) &lt;picture-text&gt;</label>
        <br>

        <input type="radio" name="q3" id="h">
        <label for="h">B) &lt;image&gt;</label>
        <br>

        <input type="radio" name="q3" id="i">
        <label for="i">C) &lt;img&gt;</label>
        <br><br>

        <button type="reset">Limpar respostas</button>
    </form>
<script src="script.js"></script></body>
</html>
