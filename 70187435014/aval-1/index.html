
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <h1>📦 SISTEMA DE ESTOQUE</h1>

    <h2>Cadastrar Produto</h2>

    <form>
        <label>Nome do produto:</label><br>
        <input type="text" id="nome" placeholder="Digite o produto">
        <br><br>

        <label>Quantidade:</label><br>
        <input type="number" id="quantidade" placeholder="Quantidade">
        <br><br>

        <label>Preço:</label><br>
        <input type="number" id="preco" placeholder="Preço">
        <br><br>

        <button type="button" onclick="cadastrar()">
            Cadastrar Produto
        </button>
    </form>

    <h2>Lista de Produtos</h2>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
            </tr>
        </thead>

        <tbody id="lista">
        </tbody>
    </table>

    <script>
        function cadastrar() {

            let nome = document.getElementById("nome").value;
            let quantidade = Number(document.getElementById("quantidade").value);
            let preco = Number(document.getElementById("preco").value);

            if (nome === "" || quantidade < 0 ||
                preco < 0 ||
                document.getElementById("quantidade").value === "" ||
                document.getElementById("preco").value === "") {

                alert("Preencha os campos corretamente!");
                return;
            }

            let tabela = document.getElementById("lista");

            let linha = tabela.insertRow();

            linha.insertCell(0).textContent = nome;
            linha.insertCell(1).textContent = quantidade;
            linha.insertCell(2).textContent = "R$ " + preco.toFixed(2);

            document.getElementById("nome").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("preco").value = "";

            alert("Produto cadastrado com sucesso!");
        }
    </script>

<script src="script.js"></script></body>
</html>
