                                            .bio { padding: 12px 16px 0; font-size: 15px; }
                                              .chip { display: inline-flex; align-items: center; gap: 8px; margin: 14px 16px 0; border: 1px solid #2e3640; border-radius: 22px; padding: 8px 14px; font-size: 14px; color: #c9d0da; }
                                                .chip svg { width: 16px; height: 16px; }

                                                  /* Botões */
                                                    .botoes { display: flex; gap: 10px; padding: 18px 16px 0; }
                                                      .btn { flex: 1; background: #2a313b; border-radius: 10px; padding: 11px 0; text-align: center; font-size: 15px; font-weight: 600; }

                                                        /* Destaques */
                                                          .destaques { display: flex; gap: 14px; padding: 22px 16px 0; overflow-x: auto; scrollbar-width: none; }
                                                            .destaques::-webkit-scrollbar { display: none; }
                                                              .dest { flex: 0 0 auto; width: 84px; text-align: center; font-size: 13px; white-space: nowrap; }
                                                                .dest .anel { width: 84px; height: 84px; border-radius: 50%; border: 2px solid #3a424d; padding: 4px; margin-bottom: 6px; }
                                                                  .dest .foto { width: 100%; height: 100%; border-radius: 50%; filter: blur(1.5px); }
                                                                    .dest.novo .anel { border: 1.5px solid #f5f5f5; display: flex; align-items: center; justify-content: center; padding: 0; }
                                                                      .dest.novo svg { width: 30px; height: 30px; stroke-width: 2.5; }
                                                                        .f1 { background: radial-gradient(circle, #f2a6c4 0%, #f5f0f2 70%); }
                                                                          .f2 { background: radial-gradient(circle, #e8b7c1 0%, #f6e4e8 75%); }
                                                                            .f3 { background: linear-gradient(90deg, #cdb4e8 55%, #f4f1f8 55%); }

                                                                              /* Abas */
                                                                                .abas { display: flex; margin-top: 26px; border-bottom: 1px solid #1e252e; }
                                                                                  .aba { flex: 1; display: flex; justify-content: center; padding: 14px 0; }
                                                                                    .aba svg { width: 28px; height: 28px; }

                                                                                              /* Barra inferior */
                                                                                                .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: #0a0f16; border-top: 1px solid #1e252e; display: flex; align-items: center; justify-content: space-around; padding: 10px 6px 14px; }
                                                                                                  .nav svg { width: 28px; height: 28px; }
                                                                                                    .nav .item { position: relative; display: flex; }
                                                                                                      .ponto { position: absolute; right: -4px; bottom: 0; width: 9px; height: 9px; border-radius: 50%; background: #ff3040; }

                                                                                                          .mini-avatar { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; background: linear-gradient(135deg, #3b2f2c, #1a1f2b); }
