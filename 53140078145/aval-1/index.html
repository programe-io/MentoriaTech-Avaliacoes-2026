<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🍽 Cardápio Digital</h1>
    <p>Escolha seu prato favorito</p>
</header>

<section class="filtros">
    <button class="ativo" onclick="filtrar('todos')">Todos</button>
    <button onclick="filtrar('lanche')">Lanches</button>
    <button onclick="filtrar('pizza')">Pizzas</button>
    <button onclick="filtrar('bebida')">Bebidas</button>
</section>

<section class="cardapio">

    <div class="card lanche">
        <img src="https://picsum.photos/300/200?random=1">
        <h2>X-Burguer</h2>
        <p>Pão, hambúrguer, queijo, alface e tomate.</p>
        <span>R$ 25,00</span>
        <button onclick="comprar('X-Burguer')">Pedir</button>
    </div>

    <div class="card pizza">
        <img src="https://picsum.photos/300/200?random=2">
        <h2>Pizza Calabresa</h2>
        <p>Molho, queijo, calabresa e cebola.</p>
        <span>R$ 55,00</span>
        <button onclick="comprar('Pizza Calabresa')">Pedir</button>
    </div>

    <div class="card bebida">
        <img src="https://picsum.photos/300/200?random=3">
        <h2>Refrigerante</h2>
        <p>Lata 350ml.</p>
        <span>R$ 7,00</span>
        <button onclick="comprar('Refrigerante')">Pedir</button>
    </div>

    <div class="card lanche">
        <img src="https://picsum.photos/300/200?random=4">
        <h2>X-Bacon</h2>
        <p>Hambúrguer artesanal com bacon.</p>
        <span>R$ 32,00</span>
        <button onclick="comprar('X-Bacon')">Pedir</button>
    </div>

</section>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
