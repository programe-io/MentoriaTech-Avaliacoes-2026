<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Estoque</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Sistema de Estoque</h1>
    <p>Cadastre e controle seus produtos.</p>

    <form id="formProduto">
      <input type="hidden" id="codigo">

      <label for="nome">Nome do produto</label>
      <input id="nome" type="text" placeholder="Ex.: Teclado" required minlength="3">

      <label for="quantidade">Quantidade</label>
      <input id="quantidade" type="number" min="0" step="1" required>

      <label for="preco">Preço (R$)</label>
      <input id="preco" type="number" min="0.01" step="0.01" required>

      <button type="submit" id="btnSalvar">Cadastrar produto</button>
      <button type="button" id="btnCancelar" hidden>Cancelar edição</button>
    </form>

    <p id="mensagem" role="status"></p>

    <h2>Produtos cadastrados</h2>
    <p id="resumo"></p>

    <div class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="listaProdutos"></tbody>
      </table>
    </div>
  </main>

  <script src="script.js"></script>
  
<footer class="rodape">
  <p>
    © 2026 Sistema de Estoque.
    Todos os direitos reservados.
  </p>
  <p>Desenvolvedor Juan V.</p>
</footer>
<script src="script.js"></script></body>
</html>
