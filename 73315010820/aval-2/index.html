
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>✓ Gerenciador de Tarefas</h1>
        <p>Organize suas atividades de forma simples!</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Nova Tarefa</h2>

            <form id="formTarefa">
                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título (mín. 5 caracteres)"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade">
                        <option value="1">1 - Alta</option>
                        <option value="2" selected>2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit">+ Adicionar</button>
            </form>
        </section>

        <section class="card">
            <h2>Tarefas Cadastradas</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaTarefas"></tbody>
                </table>
            </div>

            <p id="mensagemVazia">Nenhuma tarefa cadastrada.</p>
        </section>
    </main>
    
<footer class="rodape">
    <p>
        &copy; 2026 Gerenciador de Tarefas.
        Todos os direitos reservados JUAN V.
    </p>
    <p>Desenvolvido para fins educacionais.</p>
</footer>

<script src="script.js"></script></body>
</html>
