
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Snake</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>🐍 Jogo Snake</h1>

        <div class="informacoes">
            <h3>Pontuação: <span id="pontuacao">0</span></h3>
            <h3>Recorde: <span id="recorde">0</span></h3>
        </div>

        <canvas id="tabuleiro" width="400" height="400"></canvas>

        <h2 id="mensagem">Pressione iniciar para jogar!</h2>

        <button id="iniciar" onclick="iniciarJogo()">
            Iniciar Jogo
        </button>

        <div class="controles">
            <button onclick="mover('cima')">⬆️</button>

            <div>
                <button onclick="mover('esquerda')">⬅️</button>
                <button onclick="mover('baixo')">⬇️</button>
                <button onclick="mover('direita')">➡️</button>
            </div>
        </div>

        <p>Use as setas do teclado para movimentar a cobrinha.</p>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
