<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>MeuFeed</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Perfil</a>
            <a href="#">Explorar</a>
        </nav>
    </header>

    <main>
        <section class="criar-post">
            <h2>O que está acontecendo?</h2>
            <textarea id="textoPost" placeholder="Escreva sua publicação..."></textarea>
            <button onclick="criarPost()">Publicar</button>
        </section>

        <section id="feed">

            <article class="post">
                <div class="usuario">
                    <img src="https://i.pravatar.cc/100?img=12">
                    <strong>Maria Silva</strong>
                </div>

                <p>Que dia maravilhoso! ❤️</p>

                <img class="foto-post"
                src="https://picsum.photos/600/350?random=1">

                <div class="acoes">
                    <button onclick="curtir(this)">❤️ Curtir</button>
                    <span>0 curtidas</span>
                </div>

                <div class="comentarios">
                    <input type="text" placeholder="Escreva um comentário...">
                    <button onclick="comentar(this)">Enviar</button>
                    <div class="lista-comentarios"></div>
                </div>
            </article>

            <article class="post">
                <div class="usuario">
                    <img src="https://i.pravatar.cc/100?img=15">
                    <strong>João Pedro</strong>
                </div>

                <p>Aproveitando o final de semana! 😎</p>

                <img class="foto-post"
                src="https://picsum.photos/600/350?random=2">

                <div class="acoes">
                    <button onclick="curtir(this)">❤️ Curtir</button>
                    <span>0 curtidas</span>
                </div>

                <div class="comentarios">
                    <input type="text" placeholder="Escreva um comentário...">
                    <button onclick="comentar(this)">Enviar</button>
                    <div class="lista-comentarios"></div>
                </div>
            </article>

        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>$0
