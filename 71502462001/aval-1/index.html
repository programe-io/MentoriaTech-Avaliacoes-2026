<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Estoque</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="app">

    <!-- Barra lateral: resumo geral -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◧</span>
        <span class="brand-name">Estoque</span>
      </div>

      <div class="summary-block">
        <span class="summary-value" id="totalItens">0</span>
        <span class="summary-label">itens cadastrados</span>
      </div>

      <div class="summary-block">
        <span class="summary-value" id="totalUnidades">0</span>
        <span class="summary-label">unidades em estoque</span>
      </div>

      <div class="summary-block alert" id="blocoAlerta">
        <span class="summary-value" id="totalBaixo">0</span>
        <span class="summary-label">com estoque baixo</span>
      </div>

      <div class="summary-block danger" id="blocoEsgotado">
        <span class="summary-value" id="totalEsgotado">0</span>
        <span class="summary-label">esgotados</span>
      </div>

      <nav class="filtro-nav">
        <p class="filtro-titulo">Mostrar</p>
        <button class="filtro-btn active" data-filtro="todos">Todos os itens</button>
        <button class="filtro-btn" data-filtro="baixo">Estoque baixo</button>
        <button class="filtro-btn" data-filtro="esgotado">Esgotados</button>
      </nav>
    </aside>

    <!-- Área principal -->
    <main class="conteudo">

      <header class="topo">
        <div>
          <h1>Painel de estoque</h1>
          <p class="subtitulo">Cadastre produtos e registre entradas e saídas</p>
        </div>
        <div class="busca-wrap">
          <input type="text" id="busca" placeholder="Buscar produto ou SKU...">
        </div>
      </header>

      <section class="painel-cadastro">
        <h2>Novo produto</h2>
        <form id="formProduto" class="form-produto">
          <div class="campo">
            <label for="nome">Nome do produto</label>
            <input type="text" id="nome" required placeholder="Ex: Parafuso sextavado M8">
          </div>
          <div class="campo campo-pequeno">
            <label for="sku">SKU</label>
            <input type="text" id="sku" required placeholder="Ex: PRF-M8-001">
          </div>
          <div class="campo campo-pequeno">
            <label for="quantidade">Quantidade inicial</label>
            <input type="number" id="quantidade" min="0" required placeholder="0">
          </div>
          <div class="campo campo-pequeno">
            <label for="minimo">Estoque mínimo</label>
            <input type="number" id="minimo" min="0" required placeholder="0">
          </div>
          <button type="submit" class="btn-primario">Adicionar produto</button>
        </form>
      </section>

      <section class="painel-lista">
        <table class="tabela-estoque">
          <thead>
            <tr>
              <th>Produto</th>
              <th>SKU</th>
              <th>Quantidade</th>
              <th>Status</th>
              <th>Movimentar</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="corpoTabela">
            <!-- linhas geradas via JS -->
          </tbody>
        </table>

        <p class="vazio" id="mensagemVazia">Nenhum produto cadastrado ainda. Use o formulário acima para começar.</p>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
