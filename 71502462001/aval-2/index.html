<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Tarefas</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="app">

    <header class="cabecalho">
      <div>
        <h1>Minhas tarefas</h1>
        <p class="subtitulo" id="contadorGeral">Nenhuma tarefa ainda</p>
      </div>

      <form id="formTarefa" class="form-tarefa">
        <input type="text" id="titulo" placeholder="O que precisa ser feito?" required>
        <select id="prioridade">
          <option value="baixa">Prioridade baixa</option>
          <option value="media" selected>Prioridade média</option>
          <option value="alta">Prioridade alta</option>
        </select>
        <input type="date" id="prazo">
        <button type="submit" class="btn-add">Adicionar tarefa</button>
      </form>
    </header>

    <main class="quadro">

      <section class="coluna" data-status="afazer">
        <div class="coluna-topo">
          <h2>A fazer</h2>
          <span class="coluna-contador" id="contador-afazer">0</span>
        </div>
        <div class="coluna-corpo" id="lista-afazer"></div>
      </section>

      <section class="coluna" data-status="andamento">
        <div class="coluna-topo">
          <h2>Em andamento</h2>
          <span class="coluna-contador" id="contador-andamento">0</span>
        </div>
        <div class="coluna-corpo" id="lista-andamento"></div>
      </section>

      <section class="coluna" data-status="concluida">
        <div class="coluna-topo">
          <h2>Concluídas</h2>
          <span class="coluna-contador" id="contador-concluida">0</span>
        </div>
        <div class="coluna-corpo" id="lista-concluida"></div>
      </section>

    </main>

  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
