
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mini Feed Social</title>

                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>Mini Feed Social</h1>
                                </header>

                                    <main class="container">

                                            <!-- Criar publicação -->
                                                    <section class="create-post">
                                                                <h2>Nova publicação</h2>

                                                                            <input type="text" id="nome" placeholder="Seu nome">

                                                                                        <textarea id="texto"
                                                                                                        placeholder="O que você está pensando?"></textarea>

                                                                                                                    <button onclick="publicar()">Publicar</button>
                                                                                                                            </section>

                                                                                                                                    <!-- Feed -->
                                                                                                                                            <section id="feed">

                                                                                                                                                        <article class="post">
                                                                                                                                                                        <h3>Maria</h3>
                                                                                                                                                                                        <p>Olá pessoal! Bem-vindos ao meu mini feed! 😊</p>

                                                                                                                                                                                                        <div class="post-actions">
                                                                                                                                                                                                                            <button onclick="curtir(this)">♡ Curtir</button>
                                                                                                                                                                                                                                                <button onclick="mostrarComentario(this)">💬 Comentar</button>
                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                <div class="comentarios"></div>
                                                                                                                                                                                                                                                                                            </article>

                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                            <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                            </html>
