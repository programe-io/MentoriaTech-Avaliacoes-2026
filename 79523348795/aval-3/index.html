
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clone Instagram</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- CSS próprio -->
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="min-h-screen bg-gray-100 text-slate-900">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">

                <h1 class="text-xl font-semibold">
                    Instagram
                </h1>

                <button id="menuButton" class="text-2xl">
                    <i class="bx bx-menu"></i>
                </button>

            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="max-w-5xl mx-auto py-4 pb-20 px-4">

        <div class="flex gap-8">

            <!-- FEED -->
            <div class="flex-1 max-w-lg mx-auto w-full">

                <!-- STORIES -->
                <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">

                    <div id="storiesContainer"
                         class="flex gap-4 overflow-x-auto stories-scroll">

                        <!-- ADICIONAR STORY -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-2 bg-gray-100">

                                <div class="w-full h-full rounded-full bg-white">

                                    <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">

                                        <span class="text-2xl text-gray-500">
                                            +
                                        </span>

                                    </div>
                                </div>
                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                Seu story
                            </span>

                        </div>

                        <!-- STORIES DOS USUÁRIOS -->
                        <div class="story-item">
                            <div class="story-circle">
                                <div class="story-gradient">
                                    <img src="https://i.pravatar.cc/150?img=12" alt="Perfil João">
                                </div>
                            </div>
                            <span>João</span>
                        </div>

                        <div class="story-item">
                            <div class="story-circle">
                                <div class="story-gradient">
                                    <img src="https://i.pravatar.cc/150?img=32" alt="Perfil Maria">
                                </div>
                            </div>
                            <span>Maria</span>
                        </div>

                        <div class="story-item">
                            <div class="story-circle">
                                <div class="story-gradient">
                                    <img src="https://i.pravatar.cc/150?img=15" alt="Perfil Pedro">
                                </div>
                            </div>
                            <span>Pedro</span>
                        </div>

                        <div class="story-item">
                            <div class="story-circle">
                                <div class="story-gradient">
                                    <img src="https://i.pravatar.cc/150?img=44" alt="Perfil Ana">
                                </div>
                            </div>
                            <span>Ana</span>
                        </div>

                        <div class="story-item">
                            <div class="story-circle">
                                <div class="story-gradient">
                                    <img src="https://i.pravatar.cc/150?img=53" alt="Perfil Lucas">
                                </div>
                            </div>
                            <span>Lucas</span>
                        </div>

                    </div>

                </section>

                <!-- POSTAGEM -->
                <article class="bg-white border border-gray-200 rounded-lg mb-4">

                    <!-- CABEÇALHO DA POSTAGEM -->
                    <header class="flex items-center justify-between p-3">

                        <div class="flex items-center gap-3">

                            <div class="w-10 h-10 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <img
                                    src="https://i.pravatar.cc/150?img=12"
                                    alt="Perfil João"
                                    class="w-full h-full object-cover rounded-full"
                                >

                            </div>

                            <div>
                                <h2 class="text-sm font-semibold">
                                    joao.silva
                                </h2>

                                <span class="text-xs text-gray-500">
                                    Teresina, PI
                                </span>
                            </div>

                        </div>

                        <button class="text-xl">
                            <i class="bx bx-dots-horizontal-rounded"></i>
                        </button>

                    </header>

                    <!-- IMAGEM DA POSTAGEM -->
                    <img
                        src="https://picsum.photos/600/600"
                        alt="Imagem da postagem"
                        class="w-full object-cover"
                    >

                    <!-- AÇÕES -->
                    <div class="p-3">

                        <div class="flex items-center gap-4 text-2xl">

                            <button class="likeButton">
                                <i class="bx bx-heart"></i>
                            </button>

                            <button>
                                <i class="bx bx-message-rounded"></i>
                            </button>

                            <button>
                                <i class="bx bx-send"></i>
                            </button>

                            <button class="ml-auto">
                                <i class="bx bx-bookmark"></i>
                            </button>

                        </div>

                        <p class="text-sm font-semibold mt-3">
                            120 curtidas
                        </p>

                        <p class="text-sm mt-2">
                            <strong>joao.silva</strong>
                            Aproveitando o dia!
                        </p>

                    </div>

                </article>

            </div>

        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
