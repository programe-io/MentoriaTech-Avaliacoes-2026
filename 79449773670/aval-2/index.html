
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Mini Feed</h1>
        <p>Compartilhe seus melhores momentos!</p>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#publicar">Publicar</a>
        <a href="#feed">Feed</a>
    </nav>

    <main>
        <section class="publicar" id="publicar">
            <h2>Nova publicação</h2>
            <textarea id="texto" placeholder="O que você está pensando?"></textarea>
            <input type="text" id="imagem" placeholder="Link da imagem (opcional)">
            <button onclick="publicar()">Publicar</button>
        </section>

        <section id="feed">
            <h2>Publicações</h2>

            <article class="post">
                <h3>João Silva</h3>
                <p>Hoje foi um dia incrível! ☀️</p>
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Paisagem bonita">
                <div class="acoes">
                    <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                    <button onclick="comentar()">💬 Comentar</button>
                </div>
            </article>

            <article class="post">
                <h3>Maria Oliveira</h3>
                <p>A natureza sempre nos surpreende! 🌳</p>
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800" alt="Montanhas e lago">
                <div class="acoes">
                    <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                    <button onclick="comentar()">💬 Comentar</button>
                </div>
            </article>
        </section>
    </main>

    <footer>
        <p>© 2026 Mini Feed - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
