
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoWave</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>PhotoWave</h1>
    <input type="text" id="pesquisa" placeholder="Pesquisar pessoas...">
    <nav>
        <a href="#">Início</a>
        <a href="#">Explorar</a>
        <a href="#">Mensagens</a>
        <a href="#">Perfil</a>
    </nav>
</header>

<main>
    <section class="feed">

        <div class="stories">
            <div class="story"><img src="https://i.pravatar.cc/100?img=1"><span>Seu story</span></div>
            <div class="story"><img src="https://i.pravatar.cc/100?img=2"><span>Mariana</span></div>
            <div class="story"><img src="https://i.pravatar.cc/100?img=3"><span>Lucas</span></div>
            <div class="story"><img src="https://i.pravatar.cc/100?img=4"><span>Ana</span></div>
            <div class="story"><img src="https://i.pravatar.cc/100?img=5"><span>Pedro</span></div>
        </div>

        <article class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=12">
                <strong>Mariana Costa</strong>
                <span>•••</span>
            </div>

            <img class="post-image" src="https://picsum.photos/id/1011/700/500">

            <div class="actions">
                <button class="like">♡ Curtir</button>
                <button class="comment">💬 Comentar</button>
                <button class="share">↗ Compartilhar</button>
            </div>

            <p class="likes">120 curtidas</p>
            <p><strong>marianacosta</strong> Aproveitando cada momento! ☀️</p>

            <input class="comment-input" placeholder="Escreva um comentário...">
        </article>

        <article class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=15">
                <strong>Lucas Almeida</strong>
                <span>•••</span>
            </div>

            <img class="post-image" src="https://picsum.photos/id/1039/700/500">

            <div class="actions">
                <button class="like">♡ Curtir</button>
                <button class="comment">💬 Comentar</button>
                <button class="share">↗ Compartilhar</button>
            </div>

            <p class="likes">85 curtidas</p>
            <p><strong>lucasalmeida</strong> Novas aventuras! 🌎</p>

            <input class="comment-input" placeholder="Escreva um comentário...">
        </article>

    </section>

    <aside>
        <h3>Quem seguir</h3>
        <div class="suggestion">
            <img src="https://i.pravatar.cc/100?img=20">
            <span>Gabriel Silva</span>
            <button class="follow">Seguir</button>
        </div>
        <div class="suggestion">
            <img src="https://i.pravatar.cc/100?img=25">
            <span>Julia Santos</span>
            <button class="follow">Seguir</button>
        </div>
        <div class="suggestion">
            <img src="https://i.pravatar.cc/100?img=30">
            <span>Pedro Lima</span>
            <button class="follow">Seguir</button>
        </div>
    </aside>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
