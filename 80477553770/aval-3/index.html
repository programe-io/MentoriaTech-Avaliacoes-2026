<!DOCTYPE html>
<html lang="pt‑BR">
<head>
  <meta charset="UTF‑8">
    <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
      <title>Mini Feed</title>
        <!-- CDN do Tailwind CSS -->
          <script src="https://cdn.tailwindcss.com"></script>
          </head>
          <body class="bg‑slate‑100 font‑sans text‑slate‑800 min‑h‑screen">
            <!-- Cabeçalho -->
              <header class="bg‑white border‑b border‑slate‑200 py‑4 px‑4 shadow‑sm">
                  <div class="max‑w‑xl mx‑auto flex justify‑between items‑center">
                        <h1 class="text‑xl font‑bold text‑indigo‑600">Mini Feed</h1>
                              <nav class="flex gap‑5">
                                      <a href="#" class="font‑medium hover:text‑indigo‑500 transition">Início</a>
                                              <a href="#" class="font‑medium hover:text‑indigo‑500 transition">Perfil</a>
                                                    </nav>
                                                        </div>
                                                          </header>

                                                            <!-- Conteúdo principal -->
                                                              <main class="max‑w‑xl mx‑auto py‑6 px‑4">
                                                                  <!-- Área de nova publicação -->
                                                                      <section class="bg‑white rounded‑xl shadow‑p p‑4 mb‑6 flex justify‑between items‑center">
                                                                            <div class="flex items‑center gap‑3">
                                                                                    <div class="size‑10 bg‑indigo‑500 rounded‑full flex items‑center justify‑center text‑white font‑bold">L</div>
                                                                                            <div>
                                                                                                      <strong class="font‑semibold">Lü</strong>
                                                                                                                <p class="text‑sm text‑slate‑500">O que você está pensando?</p>
                                                                                                                        </div>
                                                                                                                              </div>
                                                                                                                                    <button class="bg‑indigo‑500 text‑white px‑4 py‑2 rounded‑lg hover:bg‑indigo‑600 transition">Publicar</button>
                                                                                                                                        </section>

                                                                                                                                            <!-- Postagem 1 -->
                                                                                                                                                <article class="bg‑white rounded‑xl shadow‑p p‑4 mb‑5">
                                                                                                                                                      <div class="flex items‑center gap‑3 mb‑3">
                                                                                                                                                              <div class="size‑10 bg‑indigo‑500 rounded‑full flex items‑center justify‑center text‑white font‑bold">L</div>
                                                                                                                                                                      <div>
                                                                                                                                                                                <strong class="font‑semibold">Lü</strong>
                                                                                                                                                                                          <p class="text‑sm text‑slate‑500">há 10 minutos</p>
                                                                                                                                                                                                  </div>
                                                                                                                                                                                                        </div>
                                                                                                                                                                                                              <p class="mb‑3">Hoje estou praticando Tailwind CSS para o curso de Desenvolvimento de Sistemas! 💻</p>
                                                                                                                                                                                                                    <img src="https://picsum.photos/600/300" alt="Imagem de prática de código" class="w‑full rounded‑lg mb‑3">
                                                                                                                                                                                                                          <div class="flex gap‑3">
                                                                                                                                                                                                                                  <button class="bg‑slate‑100 px‑3 py‑1 rounded‑md hover:bg‑slate‑200 transition">Curtir</button>
                                                                                                                                                                                                                                          <button class="bg‑slate‑100 px‑3 py‑1 rounded‑md hover:bg‑slate‑200 transition">Comentar</button>
                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                    </article>

                                                                                                                                                                                                                                                        <!-- Postagem 2 -->
                                                                                                                                                                                                                                                            <article class="bg‑white rounded‑xl shadow‑p p‑4 mb‑5">
                                                                                                                                                                                                                                                                  <div class="flex items‑center gap‑3 mb‑3">
                                                                                                                                                                                                                                                                          <div class="size‑10 bg‑sky‑500 rounded‑full flex items‑center justify‑center text‑white font‑bold">A</div>
                                                                                                                                                                                                                                                                                  <div>
                                                                                                                                                                                                                                                                                            <strong class="font‑semibold">Amiga</strong>
                                                                                                                                                                                                                                                                                                      <p class="text‑sm text‑slate‑500">há 25 minutos</p>
                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                          <p class="mb‑3">Também estou estudando para os quizzes da Mentoria TECH! 📚</p>
                                                                                                                                                                                                                                                                                                                                <img src="https://picsum.photos/600/301" alt="Imagem de estudo" class="w‑full rounded‑lg mb‑3">
                                                                                                                                                                                                                                                                                                                                      <div class="flex gap‑3">
                                                                                                                                                                                                                                                                                                                                              <button class="bg‑slate‑100 px‑3 py‑1 rounded‑md hover:bg‑slate‑200 transition">Curtir</button>
                                                                                                                                                                                                                                                                                                                                                      <button class="bg‑slate‑100 px‑3 py‑1 rounded‑md hover:bg‑slate‑200 transition">Comentar</button>
                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                </article>
                                                                                                                                                                                                                                                                                                                                                                  </main>

                                                                                                                                                                                                                                                                                                                                                                    <!-- Rodapé -->
                                                                                                                                                                                                                                                                                                                                                                      <footer class="text‑center py‑6 text‑sm text‑slate‑500">
                                                                                                                                                                                                                                                                                                                                                                          <p>&copy; 2026 Mini Feed — Projeto Mentoria TECH</p>
                                                                                                                                                                                                                                                                                                                                                                            </footer>
                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                            </html>
