<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFC00">
<title>SnapFeed</title>
<link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

<div class="app" id="app">

  <!-- Header -->
  <header class="app-header">
    <button class="icon-btn avatar-btn" id="myAvatar" aria-label="Meu perfil">EU</button>

    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
      <input type="text" placeholder="Pesquisar" aria-label="Pesquisar">
    </div>

    <button class="icon-btn" id="addFriend" aria-label="Adicionar amigo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </header>

  <!-- Conteúdo -->
  <main class="app-main">
    <div class="stories" id="stories"></div>

    <div class="section-title">
      <h2>Conversas</h2>
      <span class="pill">3 novas</span>
    </div>

    <section class="chat-list" id="chatList"></section>
  </main>

  <!-- Tabbar -->
  <nav class="tabbar">
    <button class="tab active" data-tab="map" aria-label="Mapa">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
        <line x1="8" y1="2" x2="8" y2="18"></line>
        <line x1="16" y1="6" x2="16" y2="22"></line>
      </svg>
      <span>Mapa</span>
    </button>

    <button class="tab" data-tab="chat" aria-label="Chat">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"></path>
      </svg>
      <span>Chat</span>
    </button>

    <button class="cam-btn" id="camBtn" aria-label="Câmera">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </button>

    <button class="tab" data-tab="stories" aria-label="Stories">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <polygon points="10 8 16 12 10 16 10 8"></polygon>
      </svg>
      <span>Stories</span>
    </button>

    <button class="tab" data-tab="perfil" aria-label="Perfil">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Perfil</span>
    </button>
  </nav>

  <!-- Visualizador de story -->
  <div class="story-viewer" id="storyViewer">
    <div class="sv-shade"></div>

    <div class="sv-progress" id="svProgress"></div>

    <div class="sv-header">
      <div class="sv-avatar" id="svAvatar">--</div>
      <div>
        <div class="sv-name" id="svName">Nome</div>
        <div class="sv-time" id="svTime">agora</div>
      </div>
      <button class="sv-close" id="svClose" aria-label="Fechar">✕</button>
    </div>

    <div class="sv-body">
      <div class="sv-emoji" id="svEmoji">✨</div>
      <div class="sv-caption" id="svCaption"></div>
    </div>

    <div class="sv-tap prev" id="svPrev"></div>
    <div class="sv-tap next" id="svNext"></div>

    <div class="sv-footer">
      <input class="sv-input" id="svInput" type="text" placeholder="Enviar mensagem">
      <button class="sv-send" id="svSend" aria-label="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2 21l21-9L2 3v7l15 2-15 2z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  'use strict';

  /* ====================== DADOS ====================== */

  const stories = [
    { name: 'Meu Story', initials: 'EU', c1: '#FFFC00', c2: '#FFB800', mine: true,
      bg: 'linear-gradient(160deg,#FFFC00,#FFB800)', emoji: '😎', caption: 'Toque no + para postar', viewed: false },

    { name: 'Marina', initials: 'MA', c1: '#FF6B6B', c2: '#FFD93D', mine: false,
      bg: 'linear-gradient(160deg,#FF6B6B,#FFD93D)', emoji: '🏖️', caption: 'Praia com as melhores 💛', viewed: false },

    { name: 'Lucas', initials: 'LU', c1: '#6C5CE7', c2: '#00D2FF', mine: false,
      bg: 'linear-gradient(160deg,#6C5CE7,#00D2FF)', emoji: '🎧', caption: 'Ouvindo até cair a bateria', viewed: false },

    { name: 'Bia', initials: 'BI', c1: '#FF9A9E', c2: '#FAD0C4', mine: false,
      bg: 'linear-gradient(160deg,#FF9A9E,#FAD0C4)', emoji: '☕', caption: 'Café da tarde ☕', viewed: true },

    { name: 'Rafa', initials: 'RA', c1: '#43CEA2', c2: '#185A9D', mine: false,
      bg: 'linear-gradient(160deg,#43CEA2,#185A9D)', emoji: '🏀', caption: 'Jogo de hoje às 19h!', viewed: false },

    { name: 'Ju', initials: 'JU', c1: '#F7971E', c2: '#FFD200', mine: false,
      bg: 'linear-gradient(160deg,#F7971E,#FFD200)', emoji: '🐶', caption: 'O melhor do dia', viewed: true },

    { name: 'Pedro', initials: 'PE', c1: '#8E2DE2', c2: '#4A00E0', mine: false,
      bg: 'linear-gradient(160deg,#8E2DE2,#4A00E0)', emoji: '🚀', caption: 'Novo projeto no ar', viewed: false },

    { name: 'Cami', initials: 'CA', c1: '#11998E', c2: '#38EF7D', mine: false,
      bg: 'linear-gradient(160deg,#11998E,#38EF7D)', emoji: '🌿', caption: 'Domingo de paz', viewed: true }
  ];

  const chats = [
    { name: 'Marina Lopes', initials: 'ML', c1: '#FF6B6B', c2: '#FFD93D',
      preview: 'Você enviou um snap', bold: false, time: '2m', status: 'snap' },

    { name: 'Lucas Andrade', initials: 'LA', c1: '#6C5CE7', c2: '#00D2FF',
      preview: 'Você tem 2 mensagens novas', bold: true, time: '11m', status: 'unread' },

    { name: 'Bia Ferraz', initials: 'BF', c1: '#FF9A9E', c2: '#FAD0C4',
      preview: 'kkkkkk sério?? 😂', bold: true, time: '38m', status: 'chat' },

    { name: 'Rafa Souza', initials: 'RS', c1: '#43CEA2', c2: '#185A9D',
      preview: 'Bora sim! Te encontro lá', bold: false, time: '1h', status: 'opened' },

    { name: 'Juliana Reis', initials: 'JR', c1: '#F7971E', c2: '#FFD200',
      preview: 'Você tirou um print', bold: false, time: '3h', status: 'snap' },

    { name: 'Pedro Henrique', initials: 'PH', c1: '#8E2DE2', c2: '#4A00E0',
      preview: 'Novo snap de 8 segundos', bold: true, time: '5h', status: 'unread' },

    { name: 'Camila Duarte', initials: 'CD', c1: '#11998E', c2: '#38EF7D',
      preview: 'Amanhã a gente se fala 💚', bold: false, time: '1d', status: 'opened' },

    { name: 'Grupo: Férias 2025', initials: 'F2', c1: '#00B4DB', c2: '#0083B0',
      preview: 'Rafa: já reservei o Airbnb', bold: false, time: '1d', status: 'chat' }
  ];

  /* ====================== ELEMENTOS ====================== */

  const storiesEl  = document.getElementById('stories');
  const chatListEl = document.getElementById('chatList');
  const toastEl    = document.getElementById('toast');

  const viewer     = document.getElementById('storyViewer');
  const svProgress = document.getElementById('svProgress');
  const svAvatar   = document.getElementById('svAvatar');
  const svName     = document.getElementById('svName');
  const svTime     = document.getElementById('svTime');
  const svEmoji    = document.getElementById('svEmoji');
  const svCaption  = document.getElementById('svCaption');

  const STORY_DURATION = 5000; // ms

  let currentStory = -1;
  let toastTimer = null;

  /* ====================== UTIL ====================== */

  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 1900);
  }

  function gradient(c1, c2) {
    return 'linear-gradient(135deg,' + c1 + ' 0%,' + c2 + ' 100%)';
  }

  /* ====================== RENDER: STORIES ====================== */

  function renderStories() {
    let html = '';

    for (let i = 0; i < stories.length; i++) {
      const s = stories[i];
      const ringBg = (s.viewed || s.mine)
        ? '#dcdce0'
        : gradient(s.c1, s.c2);

      const badge = s.mine
        ? '<span class="plus-badge">+</span>'
        : '';

      html +=
        '<button class="story" data-index="' + i + '" aria-label="Story de ' + s.name + '">' +
          '<span class="ring" style="background:' + ringBg + '">' +
            '<span class="avatar" style="background:' + gradient(s.c1, s.c2) + '">' +
              s.initials + badge +
            '</span>' +
          '</span>' +
          '<span class="story-name">' + s.name + '</span>' +
        '</button>';
    }

    storiesEl.innerHTML = html;
  }

  /* ====================== RENDER: CHATS ====================== */

  function renderChats() {
    let html = '';

    for (let i = 0; i < chats.length; i++) {
      const c = chats[i];
      const preview = c.bold ? '<b>' + c.preview + '</b>' : c.preview;

      html +=
        '<button class="chat" data-index="' + i + '">' +
          '<span class="chat-avatar" style="background:' + gradient(c.c1, c.c2) + '">' +
            c.initials +
          '</span>' +
          '<span class="chat-body">' +
            '<span class="chat-name">' + c.name + '</span>' +
            '<span class="chat-preview">' + preview + '</span>' +
          '</span>' +
          '<span class="chat-meta">' +
            '<span class="chat-time">' + c.time + '</span>' +
            '<span class="status ' + c.status + '"></span>' +
          '</span>' +
        '</button>';
    }

    chatListEl.innerHTML = html;
  }

  /* ====================== STORY VIEWER ====================== */

  function openStory(index) {
    currentStory = index;
    viewer.classList.add('open');
    renderStory();
  }

  function renderStory() {
    const s = stories[currentStory];
    if (!s) { closeStory(); return; }

    // marcar como visto
    s.viewed = true;
    renderStories();

    // fundo
    viewer.style.background = s.bg;

    // cabeçalho
    svAvatar.textContent = s.initials;
    svAvatar.style.background = gradient(s.c1, s.c2);
    svName.textContent = s.name;
    svTime.textContent = 'agora';

    // conteúdo
    svEmoji.textContent = s.emoji;
    svCaption.textContent = s.caption;

    // barra de progresso
    let segs = '';
    for (let i = 0; i < stories.length; i++) {
      const width = i < currentStory ? '100%' : '0%';
      segs += '<span class="sv-seg"><i style="width:' + width + '"></i></span>';
    }
    svProgress.innerHTML = segs;

    const bar = svProgress.children[currentStory].firstElementChild;
    bar.style.animation = 'fill ' + STORY_DURATION + 'ms linear forwards';
    bar.addEventListener('animationend', nextStory);
  }

  function nextStory() {
    if (currentStory >= stories.length - 1) {
      closeStory();
    } else {
      currentStory += 1;
      // pula o "meu story" ao navegar
      if (stories[currentStory].mine) {
        currentStory += 1;
      }
      if (currentStory >= stories.length) {
        closeStory();
      } else {
        renderStory();
      }
    }
  }

  function prevStory() {
    if (currentStory <= 0) {
      currentStory = 0;
      renderStory();
    } else {
      currentStory -= 1;
      if (stories[currentStory].mine) {
        currentStory -= 1;
      }
      if (currentStory < 0) currentStory = 0;
      renderStory();
    }
  }

  function closeStory() {
    viewer.classList.remove('open');
    currentStory = -1;
    svProgress.innerHTML = '';
    viewer.style.background = '#000';
  }

  /* ====================== EVENTOS ====================== */

  // Stories
  storiesEl.addEventListener('click', function (e) {
    const btn = e.target.closest('.story');
    if (!btn) return;

    const index = Number(btn.dataset.index);
    if (stories[index].mine) {
      toast('Story adicionado ✨');
      return;
    }
    openStory(index);
  });

  // Chats
  chatListEl.addEventListener('click', function (e) {
    const btn = e.target.closest('.chat');
    if (!btn) return;

    const chat = chats[Number(btn.dataset.index)];
    if (chat) toast('Abrindo conversa com ' + chat.name.split(' ')[0]);
  });

  // Viewer: fechar
  document.getElementById('svClose').addEventListener('click', closeStory);

  // Viewer: navegação por toque
  document.getElementById('svNext').addEventListener('click', nextStory);
  document.getElementById('svPrev').addEventListener('click', prevStory);

  // Viewer: enviar mensagem
  const svInput = document.getElementById('svInput');
  const svSend  = document.getElementById('svSend');

  function sendMessage() {
    const text = svInput.value.trim();
    if (!text) {
      toast('Digite uma mensagem primeiro');
      return;
    }
    svInput.value = '';
    svInput.blur();
    toast('Mensagem enviada 💬');
  }

  svSend.addEventListener('click', sendMessage);
  svInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') sendMessage();
  });

  // Teclado: Esc fecha o viewer
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && viewer.classList.contains('open')) {
      closeStory();
    }
  });

  // Tabbar
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      toast('Aba: ' + tab.dataset.tab);
    });
  });

  // Câmera
  document.getElementById('camBtn').addEventListener('click', function () {
    toast('Câmera pronta para capturar 📸');
  });

  // Adicionar amigo / perfil
  document.getElementById('addFriend').addEventListener('click', function () {
    toast('Adicionar novos amigos');
  });
  document.getElementById('myAvatar').addEventListener('click', function () {
    toast('Meu perfil');
  });

  /* ====================== INICIALIZAÇÃO ====================== */

  renderStories();
  renderChats();

})();
</script>
</body>
</html>
