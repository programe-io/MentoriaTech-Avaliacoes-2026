<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Meu Site</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Cachorro</h1>
        <!-- Corrigido: p retirado de dentro do h1 -->
        <p>Eu gosto de cachorro</p>
    </header>

    <nav>
        <!-- Links de página única ajustados para rolagem interna se necessário -->
        <a href="#sobre">Início</a>
        <a href="#galeria">Galeria</a>
        <a href="#produto">Produto</a>        
    </nav>

    <section id="row">

        <aside>
            <h2 id="sobre">Sobre</h2>
            <h5>Foto</h5>
            
            <!-- Imagem de perfil usando a regra de círculo do :not() -->
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR--0eO1uZ-I_nlcqahZ1b393XxGjZA7B3r6oFW4DwOYQ&s=10" alt="Foto perfil" width="100" height="100">
            
            <h3 id="galeria">Galeria</h3>

            <!-- Imagens da galeria com o alt limitado a duas palavras -->
            <div class="fakeimage">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGiIxr1J45-o--9SWSYnoP43Lg14VoDSbLhq82U9-g2A&s=10" alt="Ração cachorro" width="200" height="150">
            </div> 
                    
            <div class="fakeimage">
                <img src="https://adimax.com.br/wp-content/uploads/2022/05/cuidados-filhote-de-cachorro.jpg" alt="Filhote cachorro" width="200" height="150">
            </div>

            <div class="fakeimage">
                <img src="https://static.nationalgeographicbrasil.com/files/styles/image_3200/public/01-domesticated-dog.webp?w=760&h=507" alt="Cachorro doméstico" width="200" height="150">
            </div>

            <div class="fakeimage">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQm-LndXezAtRFLeecyQpd3wOIaTpNXI2CCwafij98KJQ&s=10" alt="Cachorro fofo" width="200" height="150">
            </div>
            <!-- Removido o </div> extra que estava quebrando o layout do aside -->
        </aside>

        <main>
            <article id="produto">
                <h2>Produto</h2>
                <!-- Uso de spans com a classe text-muted tratada pelo :not() do CSS -->
                <h5>Informações do <span class="text-muted">produto</span></h5>
                
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnoaak_hex6wYYFqGILdSwRh43Fxg9h3NbJBbyqUF3hw&s=10" alt="Foto produto">
                
                <p>Sobre este item: <span>Excelente qualidade</span> e alta durabilidade.</p>
            </article>
        </main>

    </section>

    <footer>
        <p>CopyRight - Todos os Direitos Reservados (Seu Nome - seuemai@provedor.com) - 2026 | Desktop </p>
    </footer>

</body>
</html>
