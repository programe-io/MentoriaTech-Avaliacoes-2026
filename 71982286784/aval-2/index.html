<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Gerenciador de Tarefas</h1>
        <p class="subtitulo">Cadastre e organize suas tarefas</p>

        <section class="card">

            <h2>Cadastrar tarefa</h2>

            <div class="campo">
                <label for="titulo">Título da tarefa</label>
                <input 
                    type="text" 
                    id="titulo" 
                    placeholder="Digite o título da tarefa"
                >
            </div>

            <div class="campo">
                <label for="prioridade">Prioridade</label>

                <select id="prioridade">
                    <option value="1">1 - Baixa</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Alta</option>
                </select>
            </div>

            <button onclick="
                cadastrarTarefa(
                    document.getElementById('titulo').value,
                    Number(document.getElementById('prioridade').value)
                );
                alert('Tarefa cadastrada com sucesso!');
            ">
                Cadastrar tarefa
            </button>

        </section>


        <section class="card">

            <h2>Consultar tarefa</h2>

            <div class="campo">
                <label for="codigo">Código da tarefa</label>

                <input 
                    type="number" 
                    id="codigo" 
                    placeholder="Digite o código"
                >
            </div>

            <button onclick="
                const tarefa = buscarTarefa(
                    Number(document.getElementById('codigo').value)
                );

                alert(
                    'Código: ' + tarefa.codigo +
                    '\nTítulo: ' + tarefa.titulo +
                    '\nPrioridade: ' + tarefa.prioridade +
                    '\nStatus: ' + (tarefa.status ? 'Pendente' : 'Concluída')
                );
            ">
                Consultar
            </button>

        </section>


        <section class="card">

            <h2>Concluir tarefa</h2>

            <div class="campo">
                <label for="codigoConcluir">Código da tarefa</label>

                <input 
                    type="number" 
                    id="codigoConcluir" 
                    placeholder="Digite o código"
                >
            </div>

            <button onclick="
                concluirTarefa(
                    Number(document.getElementById('codigoConcluir').value)
                );

                alert('Tarefa concluída!');
            ">
                Concluir tarefa
            </button>

        </section>


        <section class="card">

            <h2>Alterar prioridade</h2>

            <div class="campo">
                <label for="codigoPrioridade">Código da tarefa</label>

                <input 
                    type="number" 
                    id="codigoPrioridade" 
                    placeholder="Digite o código"
                >
            </div>

            <div class="campo">
                <label for="novaPrioridade">Nova prioridade</label>

                <select id="novaPrioridade">
                    <option value="1">1 - Baixa</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Alta</option>
                </select>
            </div>

            <button onclick="
                alterarPrioridade(
                    Number(document.getElementById('codigoPrioridade').value),
                    Number(document.getElementById('novaPrioridade').value)
                );

                alert('Prioridade alterada!');
            ">
                Alterar prioridade
            </button>

        </section>


        <section class="card">

            <h2>Tarefas cadastradas</h2>

            <button onclick="
                console.log(listarTarefas());
                alert('As tarefas foram exibidas no console.');
            ">
                Listar tarefas
            </button>

        </section>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
