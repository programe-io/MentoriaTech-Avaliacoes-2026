<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .tarefa {
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 10px;
            border-radius: 8px;
        }

        .concluida {
            background-color: #d4edda;
            text-decoration: line-through;
        }

        .alta {
            color: red;
            font-weight: bold;
        }

        .media {
            color: orange;
            font-weight: bold;
        }

        .baixa {
            color: green;
            font-weight: bold;
        }

        .acoes button {
            width: auto;
            margin-right: 5px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>Gerenciador de Tarefas</h1>

    <h2>Cadastrar nova tarefa</h2>

    <label for="titulo">Título:</label>
    <input type="text" id="titulo" placeholder="Digite o título da tarefa">

    <label for="prioridade">Prioridade:</label>
    <select id="prioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="cadastrarTarefa()">Cadastrar tarefa</button>

    <h2>Tarefas cadastradas</h2>

    <div id="listaTarefas"></div>

</div>

<script>

    // Array que armazena as tarefas
    let tarefas = [];

    // Código da próxima tarefa
    let proximoCodigo = 1;


    // Função para cadastrar uma nova tarefa
    function cadastrarTarefa() {

        const titulo = document.getElementById("titulo").value.trim();
        const prioridade = Number(document.getElementById("prioridade").value);

        // Validação do título
        if (titulo.length < 5) {
            alert("O título deve ter no mínimo 5 caracteres.");
            return;
        }

        // Validação da prioridade
        if (prioridade < 1 || prioridade > 3) {
            alert("A prioridade deve estar entre 1 e 3.");
            return;
        }

        // Criando a tarefa
        const tarefa = {
            codigo: proximoCodigo,
            titulo: titulo,
            prioridade: prioridade,
            concluida: false
        };

        // Adicionando ao array
        tarefas.push(tarefa);

        proximoCodigo++;

        // Limpa o campo
        document.getElementById("titulo").value = "";

        // Atualiza a lista
        listarTarefas();
    }


    // Função para listar as tarefas
    function listarTarefas() {

        const lista = document.getElementById("listaTarefas");

        lista.innerHTML = "";

        if (tarefas.length === 0) {
            lista.innerHTML = "<p>Nenhuma tarefa cadastrada.</p>";
            return;
        }

        tarefas.forEach(function(tarefa) {

            let prioridadeTexto = "";

            if (tarefa.prioridade === 1) {
                prioridadeTexto = "Alta";
            } else if (tarefa.prioridade === 2) {
                prioridadeTexto = "Média";
            } else {
                prioridadeTexto = "Baixa";
            }

            const div = document.createElement("div");

            div.className = "tarefa";

            if (tarefa.concluida) {
                div.classList.add("concluida");
            }

            div.innerHTML = `
                <strong>Código:</strong> ${tarefa.codigo}<br>
                <strong>Título:</strong> ${tarefa.titulo}<br>
                <strong>Prioridade:</strong> ${tarefa.prioridade} - ${prioridadeTexto}<br>
                <strong>Status:</strong> 
                ${tarefa.concluida ? "Concluída" : "Pendente"}
                
                <div class="acoes">
                    <button onclick="concluirTarefa(${tarefa.codigo})">
                        ${tarefa.concluida ? "Desmarcar" : "Concluir"}
                    </button>

                    <button onclick="alterarPrioridade(${tarefa.codigo})">
                        Alterar prioridade
                    </button>
                </div>
            `;

            lista.appendChild(div);
        });
    }


    // Função para marcar uma tarefa como concluída
    function concluirTarefa(codigo) {

        const tarefa = tarefas.find(function(tarefa) {
            return tarefa.codigo === codigo;
        });

        if (tarefa) {
            tarefa.concluida = !tarefa.concluida;
            listarTarefas();
        }
    }


    // Função para alterar a prioridade
    function alterarPrioridade(codigo) {

        const tarefa = tarefas.find(function(tarefa) {
            return tarefa.codigo === codigo;
        });

        if (!tarefa) {
            return;
        }

        const novaPrioridade = Number(
            prompt("Digite a nova prioridade (1 = Alta, 2 = Média, 3 = Baixa):")
        );

        if (novaPrioridade < 1 || novaPrioridade > 3 || isNaN(novaPrioridade)) {
            alert("Prioridade inválida! Digite um valor entre 1 e 3.");
            return;
        }

        tarefa.prioridade = novaPrioridade;

        listarTarefas();
    }


    // Mostra a lista inicialmente
    listarTarefas();

</script>

</body>
</html>
