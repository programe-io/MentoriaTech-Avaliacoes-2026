<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Forca | Moderno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="fundo-decorativo"></div>

    <header>
        <h1>Jogo da <span class="gradient-text">Forca</span></h1>
        <p>Descubra a palavra antes que o boneco seja enforcado!</p>
    </header>

    <main class="container-jogo">
        <!-- Categoria e Dica -->
        <div class="info-topo">
            <div class="info-item">
                <span class="info-label">Categoria</span>
                <span class="info-valor" id="categoria">—</span>
            </div>
            <div class="info-item">
                <span class="info-label">Dica</span>
                <span class="info-valor dica" id="dica">—</span>
            </div>
        </div>

        <!-- Placar -->
        <div class="placar">
            <div class="placar-item">
                <span class="placar-label">✅ Vitórias</span>
                <span class="placar-valor" id="vitorias">0</span>
            </div>
            <div class="placar-item">
                <span class="placar-label">🔥 Sequência</span>
                <span class="placar-valor" id="sequencia">0</span>
            </div>
            <div class="placar-item">
                <span class="placar-label">❌ Derrotas</span>
                <span class="placar-valor" id="derrotas">0</span>
            </div>
        </div>

        <!-- Área principal: boneco + palavra -->
        <div class="area-jogo">
            <!-- Boneco SVG -->
            <div class="forca-container">
                <svg viewBox="0 0 200 250" class="forca-svg" aria-hidden="true">
                    <!-- Base / suporte -->
                    <line x1="20" y1="230" x2="120" y2="230" class="linha-base"/>
                    <line x1="60" y1="230" x2="60" y2="20"  class="linha-base"/>
                    <line x1="60" y1="20"  x2="150" y2="20" class="linha-base"/>
                    <line x1="150" y1="20" x2="150" y2="50" class="linha-base"/>

                    <!-- Cabeça -->
                    <circle cx="150" cy="75" r="25" class="parte" data-parte="cabeca"/>
                    <!-- Corpo -->
                    <line x1="150" y1="100" x2="150" y2="165" class="parte" data-parte="corpo"/>
                    <!-- Braço esquerdo -->
                    <line x1="150" y1="120" x2="115" y2="150" class="parte" data-parte="braco-esq"/>
                    <!-- Braço direito -->
                    <line x1="150" y1="120" x2="185" y2="150" class="parte" data-parte="braco-dir"/>
                    <!-- Perna esquerda -->
                    <line x1="150" y1="165" x2="120" y2="210" class="parte" data-parte="perna-esq"/>
                    <!-- Perna direita -->
                    <line x1="150" y1="165" x2="180" y2="210" class="parte" data-parte="perna-dir"/>
                </svg>
                <div class="vidas">
                    <span class="vidas-label">Vidas:</span>
                    <span class="vidas-valor" id="vidas">6</span>
                </div>
            </div>

            <!-- Palavra -->
            <div class="palavra-area">
                <div class="palavra" id="palavra" aria-live="polite"></div>
                <div class="mensagem" id="mensagem"></div>
            </div>
        </div>

        <!-- Teclado virtual -->
        <div class="teclado" id="teclado" role="group" aria-label="Teclado virtual"></div>

        <!-- Ações -->
        <div class="acoes">
            <button id="btn-pular" class="btn-secundario">⏭️ Pular Palavra</button>
            <button id="btn-reiniciar" class="btn-primario">🔄 Nova Partida</button>
        </div>
    </main>

    <footer>
        <p>Use o teclado físico ou clique nas letras · <kbd>Enter</kbd> nova partida</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
