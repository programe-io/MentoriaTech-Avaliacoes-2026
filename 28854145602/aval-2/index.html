
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Mini Social</h1>
        <p>Compartilhe seus momentos!</p>
    </header>

    <main class="container">

        <section class="nova-postagem">
            <h2>Criar publicação</h2>

            <input type="text" id="nome" placeholder="Seu nome">

            <textarea id="texto"
                placeholder="O que você está pensando?"></textarea>

            <button onclick="publicar()">Publicar</button>
        </section>

        <section>
            <h2>Feed de publicações</h2>
            <div id="feed">

                <article class="post">
                    <h3>João Silva</h3>
                    <p>Olá pessoal! Bem-vindos ao meu feed! 😊</p>

                    <button onclick="curtir(this)">
                        ❤️ Curtir <span>0</span>
                    </button>

                    <div class="comentarios"></div>

                    <input type="text"
                        placeholder="Escreva um comentário...">

                    <button onclick="comentar(this)">
                        Comentar
                    </button>
                </article>

            </div>
        </section>

    </main>

    <footer>
        <p>Mini Social - 2026</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
