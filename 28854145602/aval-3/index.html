
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- MENU LATERAL -->
    <aside class="sidebar">
        <h1 class="logo">Instagram</h1>

        <nav>
            <a href="#">🏠 Início</a>
            <a href="#">🔍 Pesquisa</a>
            <a href="#">🧭 Explorar</a>
            <a href="#">🎬 Reels</a>
            <a href="#">💬 Mensagens</a>
            <a href="#">❤️ Notificações</a>
            <a href="#" onclick="abrirModal()">➕ Criar</a>
            <a href="#">👤 Perfil</a>
        </nav>

        <div class="perfil-menu">
            <img src="https://i.pravatar.cc/100?img=12">
            <span>meuperfil</span>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">

        <!-- STORIES -->
        <section class="stories">

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=1">
                <p>Maria</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=2">
                <p>Pedro</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=3">
                <p>Ana</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=4">
                <p>Lucas</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=5">
                <p>Julia</p>
            </div>

        </section>

        <!-- FEED -->
        <section class="feed" id="feed">

            <article class="post">

                <div class="post-header">
                    <img src="https://i.pravatar.cc/100?img=1">
                    <strong>maria_silva</strong>
                    <span>•••</span>
                </div>

                <img class="post-image"
                    src="https://picsum.photos/id/1011/600/600">

                <div class="post-actions">
                    <button onclick="curtir(this)">♡</button>
                    <button onclick="focarComentario(this)">💬</button>
                    <button>↗</button>
                    <button class="salvar">♡</button>
                </div>

                <div class="post-info">
                    <strong class="likes">0 curtidas</strong>

                    <p>
                        <strong>maria_silva</strong>
                        Aproveitando o dia! 🌻
                    </p>

                    <div class="comentarios"></div>

                    <input type="text"
                        placeholder="Adicione um comentário...">

                    <button onclick="comentar(this)">
                        Publicar
                    </button>
                </div>

            </article>

            <article class="post">

                <div class="post-header">
                    <img src="https://i.pravatar.cc/100?img=3">
                    <strong>ana_oficial</strong>
                    <span>•••</span>
                </div>

                <img class="post-image"
                    src="https://picsum.photos/id/1039/600/600">

                <div class="post-actions">
                    <button onclick="curtir(this)">♡</button>
                    <button onclick="focarComentario(this)">💬</button>
                    <button>↗</button>
                    <button class="salvar">♡</button>
                </div>

                <div class="post-info">
                    <strong class="likes">0 curtidas</strong>

                    <p>
                        <strong>ana_oficial</strong>
                        Vivendo bons momentos! ❤️
                    </p>

                    <div class="comentarios"></div>

                    <input type="text"
                        placeholder="Adicione um comentário...">

                    <button onclick="comentar(this)">
                        Publicar
                    </button>
                </div>

            </article>

        </section>

    </main>

    <!-- MODAL DE NOVA PUBLICAÇÃO -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Criar publicação</h2>

            <input type="text" id="usuario"
                placeholder="Seu nome de usuário">

            <input type="text" id="imagem"
                placeholder="URL da imagem">

            <textarea id="legenda"
                placeholder="Escreva uma legenda..."></textarea>

            <button onclick="criarPost()">Compartilhar</button>
            <button onclick="fecharModal()" class="fechar">
                Cancelar
            </button>
        </div>
    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
