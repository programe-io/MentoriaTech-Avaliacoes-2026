<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="cabecalho">
  <div>
    <span class="etiqueta">MINI FEED DO ALLAN LUCAS</span>
    <h1>Resenha do Verdão ⚽</h1>
    <p>Um espaço para compartilhar ideias e falar de futebol.</p>
  </div>
  <span class="avatar">AL</span>
</header>

<main class="container">
  <section class="card">
    <h2>Qual é a resenha de hoje?</h2>

    <form id="formulario">
      <label for="mensagem">Sua publicação</label>

      <textarea
        id="mensagem"
        rows="4"
        maxlength="280"
        placeholder="Compartilhe uma ideia..."
        required
      ></textarea>

      <div class="acoes">
        <span id="contador">0/280</span>
        <button type="submit">Publicar ⚽</button>
      </div>
    </form>

    <p id="status" role="status"></p>
  </section>

  <h2>Na arquibancada</h2>

  <section
    id="feed"
    aria-label="Publicações recentes"
  ></section>
</main>

<footer>
  Allan Lucas • Mini Feed Social • Projeto de estudo
</footer>
  <script src="script.js"></script>
  
</body>
</html>
