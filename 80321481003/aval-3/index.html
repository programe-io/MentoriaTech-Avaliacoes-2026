<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="navbar">
  <div class="nav-container">
    <h1 class="logo">Instagram</h1>
    <input type="text" placeholder="Pesquisar" class="search-bar">
    <div class="nav-icons">
      <span>🏠</span>
      <span>💬</span>
      <span>➕</span>
      <span>🧭</span>
      <span>❤️</span>
      <img src="https://pravatar.cc" alt="Perfil" class="nav-avatar">
    </div>
  </div>
</header>

<main class="feed-container">
  <!-- Barra de Stories -->
  <section class="stories-box">
    <div class="story">
      <div class="story-ring"><img src="https://pravatar.cc" alt="User 1"></div>
      <span>ana_silva</span>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://pravatar.cc" alt="User 2"></div>
      <span>carlos.dev</span>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://pravatar.cc" alt="User 3"></div>
      <span>mari_viaja</span>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://pravatar.cc" alt="User 4"></div>
      <span>lucas_photo</span>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://pravatar.cc" alt="User 5"></div>
      <span>julia.art</span>
    </div>
  </section>

  <!-- Postagem 1 -->
  <article class="post">
    <div class="post-header">
      <img src="https://pravatar.cc" alt="carlos.dev" class="post-avatar">
      <span class="username">carlos.dev</span>
    </div>
    <img src="https://unsplash.com" alt="Setup" class="post-image">
    <div class="post-actions">
      <button class="like-btn" onclick="toggleLike(this)">🤍</button>
      <button>💬</button>
      <button>🚀</button>
    </div>
    <div class="post-info">
      <p class="likes-count">Curtido por <strong>124 pessoas</strong></p>
      <p class="caption"><strong>carlos.dev</strong> Finalizando o projeto de hoje! 💻☕ #programacao #web</p>
      <div class="comments-list"></div>
      <div class="add-comment">
        <input type="text" placeholder="Adicione um comentário..." class="comment-input">
        <button onclick="addComment(this)">Publicar</button>
      </div>
    </div>
  </article>

  <!-- Postagem 2 -->
  <article class="post">
    <div class="post-header">
      <img src="https://pravatar.cc" alt="mari_viaja" class="post-avatar">
      <span class="username">mari_viaja</span>
    </div>
    <img src="https://unsplash.com" alt="Praia" class="post-image">
    <div class="post-actions">
      <button class="like-btn" onclick="toggleLike(this)">🤍</button>
      <button>💬</button>
      <button>🚀</button>
    </div>
    <div class="post-info">
      <p class="likes-count">Curtido por <strong>348 pessoas</strong></p>
      <p class="caption"><strong>mari_viaja</strong> Que vista incrível para recarregar as energias 🌊☀️</p>
      <div class="comments-list"></div>
      <div class="add-comment">
        <input type="text" placeholder="Adicione um comentário..." class="comment-input">
        <button onclick="addComment(this)">Publicar</button>
      </div>
    </div>
  </article>
</main>
  <script src="script.js"></script>
  
</body>
</html>
