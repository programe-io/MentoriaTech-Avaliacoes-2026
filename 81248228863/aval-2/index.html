<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutFeed - Tudo sobre Futebol</title>
    <!-- Conectando o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>⚽ FutFeed</h1>
    </header>

    <div class="container">
        <!-- Placares ao Vivo -->
        <div class="live-scores">
            <div class="match-card">
                <div class="match-status">AO VIVO • 78'</div>
                <div class="team-row"><span>Flamengo</span><span>2</span></div>
                <div class="team-row"><span>Palmeiras</span><span>1</span></div>
            </div>
            <div class="match-card">
                <div class="match-status">AO VIVO • 34'</div>
                <div class="team-row"><span>Real Madrid</span><span>1</span></div>
                <div class="team-row"><span>Barcelona</span><span>1</span></div>
            </div>
            <div class="match-card">
                <div class="match-status finished">ENCERRADO</div>
                <div class="team-row"><span>Corinthians</span><span>3</span></div>
                <div class="team-row"><span>São Paulo</span><span>0</span></div>
            </div>
        </div>

        <!-- Criar Postagem -->
        <div class="post-creator">
            <textarea id="postText" rows="3" placeholder="O que está acontecendo no mundo da bola?"></textarea>
            <div class="creator-footer">
                <select id="postCategory">
                    <option value="Jogos">⚽ Jogos</option>
                    <option value="Mercado">💼 Mercado da Bola</option>
                    <option value="Gols">🔥 Golaços</option>
                </select>
                <button class="btn-post" id="btnPublish">Publicar</button>
            </div>
        </div>

        <!-- Filtros -->
        <div class="filters" id="filterContainer">
            <button class="filter-btn active" data-category="Todos">Todos</button>
            <button class="filter-btn" data-category="Jogos">Jogos</button>
            <button class="filter-btn" data-category="Mercado">Mercado da Bola</button>
            <button class="filter-btn" data-category="Gols">Golaços</button>
        </div>

        <!-- Lista do Feed -->
        <div class="feed" id="feedContainer"></div>
    </div>

    <!-- Conectando o arquivo JavaScript -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
