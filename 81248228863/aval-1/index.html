
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apito Inicial — Blog de Futebol</title>
  <link rel="stylesheet" href="style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <div class="container">
      <h1>⚽ Apito Inicial</h1>
      <p>Análises táticas, bastidores e notícias do futebol</p>
    </div>
  </header>

  <section class="controles container">
    <input
      type="search"
      id="busca"
      placeholder="Buscar notícia ou tema..."
      aria-label="Buscar notícia"
    />
    <div class="filtros" id="filtros">
      <button class="btn-filtro ativo" data-categoria="Todos">Todos</button>
      <button class="btn-filtro" data-categoria="Brasileirão">Brasileirão</button>
      <button class="btn-filtro" data-categoria="Tática">Tática</button>
      <button class="btn-filtro" data-categoria="Mercado">Mercado</button>
    </div>
  </section>

  <main class="container">
    <div id="feed" class="grid-posts"></div>
  </main>

  <div id="modal" class="modal oculto" role="dialog" aria-modal="true">
    <div class="modal-conteudo">
      <button id="fechar-modal" class="fechar" aria-label="Fechar leitura">&times;</button>
      <span id="modal-tag" class="tag"></span>
      <h2 id="modal-titulo"></h2>
      <small id="modal-data"></small>
      <p id="modal-texto"></p>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
