<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaFut - Clone do Instagram</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Barra de Navegação Superior -->
    <nav class="navbar">
        <div class="nav-content">
            <h1 class="logo">InstaFut</h1>
            <button class="btn-new-post" id="openModalBtn" title="Nova Publicação">➕</button>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="container">
        
        <!-- Barra de Stories -->
        <section class="stories-bar" id="storiesContainer"></section>

        <!-- Feed de Publicações -->
        <section class="feed" id="feedContainer"></section>

    </main>

    <!-- Modal para Criar Post -->
    <div class="modal-overlay" id="postModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Criar nova publicação</h3>
                <button class="close-modal" id="closeModalBtn">✖</button>
            </div>
            <div class="modal-body">
                <input type="text" id="imageUrlInput" placeholder="Cole a URL de uma imagem (ex: Unsplash)">
                <textarea id="captionInput" rows="3" placeholder="Escreva uma legenda..."></textarea>
                <button class="btn-publish" id="publishPostBtn">Compartilhar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
