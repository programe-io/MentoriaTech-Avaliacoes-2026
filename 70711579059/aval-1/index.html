
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Minhas Tarefas</h1>
            <p>Organize seu dia e aumente sua produtividade!</p>
        </header>

        <section class="task-form">
            <input
                type="text"
                id="taskInput"
                placeholder="Digite uma nova tarefa..."
            >
            <button id="addButton">Adicionar</button>
        </section>

        <section class="task-info">
            <span id="totalTasks">Total: 0</span>
            <span id="completedTasks">Concluídas: 0</span>
            <span id="pendingTasks">Pendentes: 0</span>
        </section>

        <nav class="filters">
            <button class="filter active" data-filter="all">Todas</button>
            <button class="filter" data-filter="pending">Pendentes</button>
            <button class="filter" data-filter="completed">Concluídas</button>
        </nav>

        <ul id="taskList"></ul>

        <p id="emptyMessage">Nenhuma tarefa cadastrada.</p>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
