<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sabor &amp; Casa — Blog de Receitas</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <div class="container topo-conteudo">
      <div>
        <h1>Sabor &amp; Casa</h1>
        <p class="subtitulo">Receitas práticas para o dia a dia</p>
      </div>
      <button id="btnAbrirForm" class="btn-primario">+ Nova Receita</button>
    </div>
  </header>

  <main class="container">
    <section class="controles">
      <input
        type="search"
        id="campoBusca"
        placeholder="Buscar por receita ou ingrediente..."
        aria-label="Buscar receita"
      />
      <div class="filtros" id="filtrosCategoria">
        <button class="filtro ativo" data-categoria="Todas">Todas</button>
        <button class="filtro" data-categoria="Salgados">Salgados</button>
        <button class="filtro" data-categoria="Doces">Doces</button>
        <button class="filtro" data-categoria="Lanches">Lanches</button>
      </div>
    </section>

    <section id="gradeReceitas" class="grade-receitas"></section>
  </main>

  <!-- Modal de detalhes da receita -->
  <div id="modalReceita" class="modal oculto" role="dialog" aria-modal="true">
    <div class="modal-conteudo">
      <button id="fecharModal" class="fechar" aria-label="Fechar">&times;</button>
      <img id="modalImagem" src="" alt="" />
      <span id="modalCategoria" class="badge"></span>
      <h2 id="modalTitulo"></h2>
      <p id="modalTempo" class="meta"></p>

      <h3>Ingredientes</h3>
      <ul id="modalIngredientes"></ul>

      <h3>Modo de preparo</h3>
      <ol id="modalPreparo"></ol>
    </div>
  </div>

  <!-- Modal para adicionar nova receita -->
  <div id="modalForm" class="modal oculto" role="dialog" aria-modal="true">
    <div class="modal-conteudo">
      <button id="fecharForm" class="fechar" aria-label="Fechar">&times;</button>
      <h2>Adicionar Nova Receita</h2>
      <form id="formReceita">
        <label>
          Título
          <input type="text" id="inputTitulo" required placeholder="Ex: Bolo de Cenoura" />
        </label>
        <label>
          Categoria
          <select id="inputCategoria">
            <option value="Doces">Doces</option>
            <option value="Salgados">Salgados</option>
            <option value="Lanches">Lanches</option>
          </select>
        </label>
        <label>
          Tempo de preparo
          <input type="text" id="inputTempo" required placeholder="Ex: 40 min" />
        </label>
        <label>
          URL da imagem (opcional)
          <input type="url" id="inputImagem" placeholder="https://..." />
        </label>
        <label>
          Ingredientes (um por linha)
          <textarea id="inputIngredientes" rows="4" required placeholder="2 xícaras de farinha&#10;3 ovos"></textarea>
        </label>
        <label>
          Modo de preparo (um passo por linha)
          <textarea id="inputPreparo" rows="4" required placeholder="Misture os ingredientes secos&#10;Asse a 180°C por 35 min"></textarea>
        </label>
        <button type="submit" class="btn-primario">Salvar Receita</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
