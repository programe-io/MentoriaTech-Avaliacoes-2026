<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed de Receitas</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="header">
    <h1>Feed de Receitas</h1>
    <p>Descubra pratos rápidos, filtre por categoria e salve seus favoritos.</p>
  </header>

  <section class="controls">
    <input
      type="text"
      id="searchInput"
      placeholder="Buscar por receita ou ingrediente..."
      aria-label="Buscar por receita ou ingrediente"
    />
    <div class="filters" id="categoryFilters">
      <button class="filter-btn active" data-category="Todas">Todas</button>
      <button class="filter-btn" data-category="Sobremesa">Sobremesa</button>
      <button class="filter-btn" data-category="Salgado">Salgado</button>
      <button class="filter-btn" data-category="Lanche">Lanche</button>
    </div>
  </section>

  <main class="feed" id="recipeFeed"></main>

  <dialog class="modal" id="recipeModal">
    <div class="modal-content" id="modalContent"></div>
  </dialog>

  <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
