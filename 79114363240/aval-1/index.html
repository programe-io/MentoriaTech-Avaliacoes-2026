<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <title>Classificação do Nadador</title>
        <link href="style.css" rel="stylesheet"></head>
        <body>

            <h2>Verificar Categoria do Nadador</h2>
                
                    <label for="idade">Digite a idade do nadador:</label>
                        <input type="number" id="idade" placeholder="Ex: 14">
                            
                                <button onclick="verificarCategoria()">Classificar</button>

                                    <p id="resultado"></p>

                                        <script>
                                                function verificarCategoria() {
                                                            // Pega o valor digitado no campo de texto
                                                                        let idade = document.getElementById("idade").value;
                                                                                    let resultado = document.getElementById("resultado");

                                                                                                // Se o campo estiver vazio, avisa o usuário
                                                                                                            if (idade === "") {
                                                                                                                            resultado.innerText = "Por favor, digite uma idade.";
                                                                                                                                            return;
                                                                                                                                                        }

                                                                                                                                                                    // Transforma o texto digitado em número
                                                                                                                                                                                idade = parseInt(idade);

                                                                                                                                                                                            // Estrutura Condicional (Equivalente ao If/Elif/Else)
                                                                                                                                                                                                        if (idade < 11) {
                                                                                                                                                                                                                        resultado.innerText = "Categoria: Infantil";
                                                                                                                                                                                                                                    } else if (idade <= 17) {
                                                                                                                                                                                                                                                    resultado.innerText = "Categoria: Juvenil";
                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                resultado.innerText = "Categoria: Adulto";
                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                        </html>
