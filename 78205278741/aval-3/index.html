
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titan Fighters 64bit</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="game">
    <h1>TITAN FIGHTERS <span>64BIT</span></h1>

    <section class="hud">
      <div class="fighter-info">
        <strong>GUERREIRO</strong>
        <div class="health"><div id="player-health"></div></div>
      </div>
      <div class="round" id="round">ROUND 1</div>
      <div class="fighter-info enemy-info">
        <strong>TITÃ IRRACIONAL</strong>
        <div class="health"><div id="enemy-health"></div></div>
      </div>
    </section>

    <section class="arena" id="arena">
      <div class="stars">✦　　·　 ✧　 ·　　✦</div>

      <div id="player" class="fighter player">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arm arm-left"></div>
        <div class="arm arm-right"></div>
        <div class="leg leg-left"></div>
        <div class="leg leg-right"></div>
      </div>

      <div id="enemy" class="fighter enemy">
        <div class="hair"></div>
        <div class="head"></div>
        <div class="body"></div>
        <div class="arm arm-left"></div>
        <div class="arm arm-right"></div>
        <div class="leg leg-left"></div>
        <div class="leg leg-right"></div>
      </div>

      <div class="ground"></div>
      <div id="message" class="message">PREPARE-SE!</div>
      <div id="timer" class="timer">99</div>
    </section>

    <section class="controls">
      <button id="start">COMEÇAR LUTA</button>
      <button data-action="punch">SOCO (J)</button>
      <button data-action="kick">CHUTE (K)</button>
      <button data-action="special">ESPECIAL (L)</button>
      <button data-action="defend">DEFENDER (I)</button>
    </section>

    <p class="instructions">
      MOVIMENTO: A / D ou ← / → |
      PULAR: W ou ↑ |
      GOLPES: J, K e L |
      DEFESA: I
    </p>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
