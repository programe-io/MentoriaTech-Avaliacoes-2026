<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: #fafafa;
      font-family: Arial, sans-serif;
    }

    .story-border {
      background: linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
      );
      padding: 3px;
      border-radius: 50%;
    }

    .post-art {
      width: 100%;
      aspect-ratio: 4 / 4.3;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 15% 10%, #ffdc9d 0%, transparent 35%),
        linear-gradient(145deg, #e99bc8, #a42bdf 65%, #5a19be);
      position: relative;
    }

    .wave {
      position: absolute;
      width: 140%;
      height: 65%;
      left: -15%;
      bottom: -8%;
      border-radius: 48% 55% 0 0;
      transform: rotate(13deg);
    }

    .wave-one {
      background: linear-gradient(120deg, #cf3eab, #317b8f);
      bottom: -17%;
      left: -30%;
    }

    .wave-two {
      background: linear-gradient(120deg, #9b46e9, #493469);
      bottom: 13%;
      left: 20%;
      transform: rotate(22deg);
    }

    .wave-three {
      background: linear-gradient(120deg, #192c33, #124564);
      bottom: -39%;
      left: -5%;
      transform: rotate(-10deg);
    }

    .nav-icon {
      cursor: pointer;
      transition: .2s;
    }

    .nav-icon:hover {
      transform: scale(1.12);
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="min-h-screen">

  <!-- HEADER -->
  <header class="fixed top-0 left-0 w-full h-[60px] bg-white border-b border-gray-200 z-50">
    <div class="max-w-[975px] h-full mx-auto px-4 flex items-center justify-between">

      <h1 class="text-2xl font-bold tracking-tight">
        Instagram
      </h1>

      <div class="hidden sm:flex items-center gap-6">
        <i data-lucide="house" class="nav-icon w-6 h-6"></i>
        <i data-lucide="search" class="nav-icon w-6 h-6"></i>
        <i data-lucide="plus-square" class="nav-icon w-6 h-6"></i>
        <i data-lucide="heart" class="nav-icon w-6 h-6"></i>
        <i data-lucide="send" class="nav-icon w-6 h-6"></i>

        <img
          src="https://i.pravatar.cc/100?img=12"
          class="w-7 h-7 rounded-full object-cover"
        />
      </div>

      <div class="flex sm:hidden gap-4">
        <i data-lucide="heart" class="w-6 h-6"></i>
        <i data-lucide="send" class="w-6 h-6"></i>
      </div>

    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-[975px] mx-auto pt-[75px] px-0 sm:px-4">

    <div class="flex justify-center gap-8">

      <!-- FEED -->
      <section class="w-full max-w-[470px]">

        <!-- STORIES -->
        <div class="bg-white sm:border sm:border-gray-200 rounded-sm px-3 py-4 mb-4">

          <div class="flex justify-between gap-3 overflow-x-auto">

            <!-- Story 1 -->
            <div class="flex flex-col items-center min-w-[58px] gap-1">
              <div class="w-[50px] h-[50px] rounded-full border border-gray-300 flex items-center justify-center">
                <i data-lucide="plus" class="w-6 h-6 text-gray-500"></i>
              </div>
              <span class="text-[11px]">Seu story</span>
            </div>

            <!-- Stories -->
            <div class="flex flex-col items-center min-w-[58px] gap-1">
              <div class="story-border">
                <img src="https://i.pravatar.cc/100?img=12"
                  class="w-[48px] h-[48px] rounded-full border-2 border-white object-cover">
              </div>
              <span class="text-[11px]">Laéciofilho</span>
            </div>

            <div class="flex flex-col items-center min-w-[58px] gap-1">
              <div class="story-border">
                <img src="https://i.pravatar.cc/100?img=13"
                  class="w-[48px] h-[48px] rounded-full border-2 border-white object-cover">
              </div>
              <span class="text-[11px]">JoãoPedro</span>
            </div>

            <div class="flex flex-col items-center min-w-[58px] gap-1">
              <div class="story-border">
                <img src="https://i.pravatar.cc/100?img=14"
                  class="w-[48px] h-[48px] rounded-full border-2 border-white object-cover">
              </div>
              <span class="text-[11px]">Willian</span>
            </div>

            <div class="flex flex-col items-center min-w-[58px] gap-1">
              <div class="story-border">
                <img src="https://i.pravatar.cc/100?img=15"
                  class="w-[48px] h-[48px] rounded-full border-2 border-white object-cover">
              </div>
              <span class="text-[11px]">Matheus</span>
            </div>

            <div class="flex flex-col items-center min-w-[58px] gap-1">
              <div class="story-border">
                <img src="https://i.pravatar.cc/100?img=16"
                  class="w-[48px] h-[48px] rounded-full border-2 border-white object-cover">
              </div>
              <span class="text-[11px]">Thayane</span>
            </div>

          </div>
        </div>

        <!-- POST -->
        <article class="bg-white sm:border sm:border-gray-200 mb-6">

          <!-- POST HEADER -->
          <div class="flex items-center justify-between px-3 py-3">

            <div class="flex items-center gap-2">

              <div class="story-border">
                <img src="https://i.pravatar.cc/100?img=12"
                  class="w-8 h-8 rounded-full border-2 border-white object-cover">
              </div>

              <div>
                <h2 class="font-semibold text-xs">joãopedro_</h2>
                <p class="text-[11px] text-gray-500">Caracol, PI</p>
              </div>

            </div>

            <button class="text-xl px-2">•••</button>

          </div>

          <!-- POST IMAGE -->
          <div class="post-art">

            <div class="wave wave-one"></div>
            <div class="wave wave-two"></div>
            <div class="wave wave-three"></div>

          </div>

          <!-- POST ACTIONS -->
          <div class="px-3 pt-3">

            <div class="flex justify-between items-center">

              <div class="flex items-center gap-4">

                <button onclick="likePost(this)">
                  <i data-lucide="heart" class="w-6 h-6"></i>
                </button>

                <button>
                  <i data-lucide="message-circle" class="w-6 h-6"></i>
                </button>

                <button>
                  <i data-lucide="send" class="w-6 h-6"></i>
                </button>

              </div>

              <button onclick="savePost(this)">
                <i data-lucide="bookmark" class="w-6 h-6"></i>
              </button>

            </div>

            <p class="text-sm font-semibold mt-3">
              <span id="likes">1.248</span> curtidas
            </p>

            <p class="text-sm mt-2">
              <strong>joãopedro_</strong>
              Explorando novos ciclos. 🎨✨
            </p>

            <p class="text-xs text-gray-400 mt-2">
              Ver todos os 60 comentários
            </p>

            <div class="flex items-center justify-between border-t mt-3 py-3">
              <input
                type="text"
                placeholder="Adicione um comentário..."
                class="text-xs outline-none w-full"
              />
              <button class="text-blue-400 text-xs font-semibold">
                Publicar
              </button>
            </div>

            <p class="text-[10px] text-gray-400 uppercase pb-3">
              Há 2 horas
            </p>

          </div>

        </article>

      </section>

    </div>

  </main>

  <!-- MOBILE NAVIGATION -->
  <footer class="fixed bottom-0 left-0 w-full bg-white border-t sm:hidden">
    <div class="flex justify-around items-center py-3">
      <i data-lucide="house" class="w-6 h-6"></i>
      <i data-lucide="search" class="w-6 h-6"></i>
      <i data-lucide="plus-square" class="w-6 h-6"></i>
      <i data-lucide="video" class="w-6 h-6"></i>
      <img src="https://i.pravatar.cc/100?img=12"
        class="w-6 h-6 rounded-full">
    </div>
  </footer>

  <script>
    lucide.createIcons();

    function likePost(button) {
      const icon = button.querySelector('svg');
      const likes = document.getElementById('likes');

      const liked = button.dataset.liked === 'true';

      button.dataset.liked = !liked;

      if (!liked) {
        icon.setAttribute('fill', '#ed4956');
        icon.setAttribute('stroke', '#ed4956');
        likes.textContent = '1.249';
      } else {
        icon.setAttribute('fill', 'none');
        icon.setAttribute('stroke', 'currentColor');
        likes.textContent = '1.248';
      }
    }

    function savePost(button) {
      const icon = button.querySelector('svg');
      const saved = button.dataset.saved === 'true';

      button.dataset.saved = !saved;

      icon.setAttribute('fill', saved ? 'none' : 'currentColor');
    }
  </script>

</body>
</html>
