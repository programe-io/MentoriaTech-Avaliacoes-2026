<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Produtos</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h2>Cadastrar Produto</h2>
    
    <div class="form-group">
      <label>Descrição:</label>
      <input type="text" id="descricao" placeholder="Ex: Teclado USB">
    </div>

    <div class="form-group">
      <label>Quantidade:</label>
      <input type="number" id="quantidade" placeholder="Ex: 10">
    </div>

    <div class="form-group">
      <label>Valor (R$):</label>
      <input type="number" step="0.01" id="valor" placeholder="Ex: 50.00">
    </div>

    <button onclick="salvarFormulario()">Cadastrar Produto</button>
    <button onclick="listarProdutos()">Listar Produtos (Console)</button>
  </div>

  <script src="script.js"></script>
  <script>
    // Função auxiliar para pegar os valores da tela e enviar pro seu JS
    function salvarFormulario() {
      let desc = document.getElementById("descricao").value;
      let qtd = Number(document.getElementById("quantidade").value);
      let val = Number(document.getElementById("valor").value);

      cadastrarProduto(desc, qtd, val);
    }
  </script>
<script src="script.js"></script></body>
</html>
