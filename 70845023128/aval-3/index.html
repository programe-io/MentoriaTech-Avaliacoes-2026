<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main>
        <h1>Ficha de Anamnese - Controle de IMC</h1>

        
        <section class="card">
            <h2>Cadastrar Paciente</h2>
            <form id="form-pessoa">
                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o nome do paciente" maxlength="50" required>
                </div>

                <div class="campo">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" name="idade" placeholder="Ex: 30" min="1" max="120" required>
                </div>

                <div class="campo">
                    <label for="altura">Altura (m):</label>
                    <input type="number" id="altura" name="altura" placeholder="Ex: 1.75" min="0.5" max="2.5" step="0.01" required>
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso" name="peso" placeholder="Ex: 70.5" min="1" max="300" step="0.1" required>
                </div>

                <p id="erro" class="erro"></p>

                <div class="botoes">
                    <button type="submit" class="btn-salvar">Salvar</button>
                    <button type="button" id="btn-cancelar" class="btn-cancelar">Cancelar</button>
                </div>
            </form>
        </section>


        <section class="card">
            <h2>Pacientes Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Altura</th>
                        <th>Peso</th>
                        <th>IMC</th>
                        <th>Classificação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-pessoas">
                    
                </tbody>
            </table>
        </section>
    </main>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
