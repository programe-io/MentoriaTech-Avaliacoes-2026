<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Cadastro</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>Sistema de Gestão</h1>
    <p>Cadastre e visualize os registros abaixo</p>
  </header>

  <main class="container">
    <!-- Seção do Formulário -->
    <section>
      <form id="meuFormulario">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" placeholder="Digite o nome..." required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="exemplo@email.com" required>

        <button type="submit">Cadastrar</button>
      </form>
    </section>

    <hr>

    <!-- Seção da Lista de Registros -->
    <section>
      <h2>Registros Cadastrados</h2>
      <ul id="listaNomes">
        <!-- Os itens serão inseridos aqui pelo JavaScript -->
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 - Meu Primeiro Sistema Web</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
