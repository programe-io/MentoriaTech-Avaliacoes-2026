
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Quiz de Futebol</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>

          <div class="container">

              <header>
                    <div class="logo">⚽</div>
                          <h1>QUIZ DE FUTEBOL</h1>
                                <p>Teste seus conhecimentos sobre o mundo da bola!</p>
                                    </header>

                                        <div class="stats">
                                              <div class="stat">
                                                      <span>🏆 Pontos</span>
                                                              <strong id="score">0</strong>
                                                                    </div>

                                                                          <div class="stat">
                                                                                  <span>📋 Pergunta</span>
                                                                                          <strong><span id="current">1</span>/<span id="total">10</span></strong>
                                                                                                </div>
                                                                                                    </div>

                                                                                                        <div class="progress-container">
                                                                                                              <div id="progress" class="progress"></div>
                                                                                                                  </div>

                                                                                                                      <main id="quiz">

                                                                                                                            <div class="category" id="category">FUTEBOL</div>

                                                                                                                                  <h2 id="question">Carregando pergunta...</h2>

                                                                                                                                        <div id="answers" class="answers"></div>

                                                                                                                                              <p id="feedback" class="feedback"></p>

                                                                                                                                                    <button id="nextBtn" class="next-btn" disabled>
                                                                                                                                                            Próxima pergunta ➜
                                                                                                                                                                  </button>

                                                                                                                                                                      </main>

                                                                                                                                                                          <section id="result" class="result hidden">
                                                                                                                                                                                <div class="trophy">🏆</div>

                                                                                                                                                                                      <h2>Quiz finalizado!</h2>

                                                                                                                                                                                            <p>Você terminou o desafio.</p>

                                                                                                                                                                                                  <div class="final-score">
                                                                                                                                                                                                          <span id="finalScore">0</span>
                                                                                                                                                                                                                  <small>pontos</small>
                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                              <p id="resultMessage"></p>

                                                                                                                                                                                                                                    <button id="restartBtn" class="next-btn">
                                                                                                                                                                                                                                            🔄 Jogar novamente
                                                                                                                                                                                                                                                  </button>
                                                                                                                                                                                                                                                      </section>

                                                                                                                                                                                                                                                          <footer>
                                                                                                                                                                                                                                                                <p>⚽ Feito para os apaixonados por futebol</p>
                                                                                                                                                                                                                                                                    </footer>

                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                        </html>
