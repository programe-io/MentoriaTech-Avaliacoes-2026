<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Cadastro de Produtos</h1>

        <section>
            <h2>Cadastrar Produto</h2>

            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" placeholder="Nome do produto">

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" placeholder="Quantidade">

            <label for="valor">Valor:</label>
            <input type="number" id="valor" step="0.01" placeholder="Valor do produto">

            <button onclick="cadastrarProdutoHTML()">
                Cadastrar Produto
            </button>
        </section>

        <section>
            <h2>Produtos cadastrados</h2>

            <button onclick="listarProdutosHTML()">
                Listar Produtos
            </button>

            <div id="listaProdutos"></div>
        </section>

        <section>
            <h2>Atualizar Valor</h2>

            <label for="codigo">Código do produto:</label>
            <input type="number" id="codigo" placeholder="Código">

            <label for="novoValor">Novo valor:</label>
            <input type="number" id="novoValor" step="0.01" placeholder="Novo valor">

            <button onclick="atualizarValorHTML()">
                Atualizar Valor
            </button>
        </section>

    </div>

    <script>

        let produtos = [];

        function validarProdutos(descricao, quantidade, valor) {

            if (descricao.length < 5) {
                throw new Error("Descrição deve ter no mínimo 5 caracteres");
            }

            if (quantidade < 1) {
                throw new Error("Quantidade deve ser maior que zero");
            }

            if (valor < 0) {
                throw new Error("Valor deve ser maior ou igual a zero");
            }
        }

        function cadastrarProduto(descricao, quantidade, valor) {

            validarProdutos(descricao, quantidade, valor);

            let novoProduto = {
                codigo: produtos.length + 1,
                descricao: descricao,
                quantidade: quantidade,
                valor: valor
            };

            produtos.push(novoProduto);
        }

        function listarProdutos() {
            return produtos;
        }

        function atualizarValor(codigoProduto, novoValor) {

            if (novoValor < 0) {
                throw new Error("Valor deve ser maior ou igual a zero");
            }

            const produto = produtos.find(
                produto => produto.codigo === codigoProduto
            );

            if (produto) {
                produto.valor = novoValor;
            } else {
                throw new Error("Produto não encontrado");
            }
        }

        function cadastrarProdutoHTML() {

            try {

                let descricao =
                    document.getElementById("descricao").value;

                let quantidade =
                    Number(document.getElementById("quantidade").value);

                let valor =
                    Number(document.getElementById("valor").value);

                cadastrarProduto(descricao, quantidade, valor);

                alert("Produto cadastrado com sucesso!");

                document.getElementById("descricao").value = "";
                document.getElementById("quantidade").value = "";
                document.getElementById("valor").value = "";

            } catch (erro) {

                alert(erro.message);
            }
        }

        function listarProdutosHTML() {

            let lista =
                document.getElementById("listaProdutos");

            lista.innerHTML = "";

            produtos.forEach(function(produto) {

                lista.innerHTML += `
                    <div class="produto">
                        <p><strong>Código:</strong> ${produto.codigo}</p>
                        <p><strong>Descrição:</strong> ${produto.descricao}</p>
                        <p><strong>Quantidade:</strong> ${produto.quantidade}</p>
                        <p><strong>Valor:</strong> R$ ${produto.valor.toFixed(2)}</p>
                    </div>
                `;

            });
        }

        function atualizarValorHTML() {

            try {

                let codigo =
                    Number(document.getElementById("codigo").value);

                let novoValor =
                    Number(document.getElementById("novoValor").value);

                atualizarValor(codigo, novoValor);

                alert("Valor atualizado com sucesso!");

                document.getElementById("codigo").value = "";
                document.getElementById("novoValor").value = "";

                listarProdutosHTML();

            } catch (erro) {

                alert(erro.message);
            }
        }

    </script>

<script src="script.js"></script></body>
</html>
