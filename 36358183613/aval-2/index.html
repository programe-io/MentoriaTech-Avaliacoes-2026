<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>✅ Gerenciador de Tarefas</h1>
            <div class="resumo">
                <div class="card">
                    <span>Pendentes</span>
                    <strong id="total-pendentes">0</strong>
                </div>
                <div class="card">
                    <span>Concluídas</span>
                    <strong id="total-concluidas">0</strong>
                </div>
            </div>
        </header>

        <section class="form-section">
            <form id="form-tarefa">
                <input type="text" id="titulo" placeholder="O que precisa ser feito?" required>
                <select id="prioridade">
                    <option value="baixa">Prioridade: Baixa</option>
                    <option value="media" selected>Prioridade: Média</option>
                    <option value="alta">Prioridade: Alta</option>
                </select>
                <input type="date" id="prazo">
                <button type="submit" class="btn-add">Adicionar</button>
            </form>
        </section>

        <section class="controles">
            <div class="filtros">
                <button type="button" class="filtro-btn ativo" data-filtro="todas">Todas</button>
                <button type="button" class="filtro-btn" data-filtro="pendentes">Pendentes</button>
                <button type="button" class="filtro-btn" data-filtro="concluidas">Concluídas</button>
            </div>
            <input type="text" id="busca" placeholder="🔍 Buscar tarefa...">
        </section>

        <ul id="lista-tarefas" class="lista-tarefas">
            <!-- As tarefas serão renderizadas aqui via JavaScript -->
        </ul>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
