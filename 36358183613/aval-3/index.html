<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese Digital</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>📋 Ficha de Anamnese</h1>
                <p class="subtitulo">Registro de avaliação inicial do paciente/cliente</p>
            </div>
            <div class="header-acoes no-print">
                <button type="button" id="btn-nova" class="btn-secundario">+ Nova Ficha</button>
                <button type="button" id="btn-imprimir" class="btn-print">🖨️ Imprimir / PDF</button>
            </div>
        </header>

        <form id="form-anamnese">
            <!-- Seção 1: Dados Pessoais -->
            <fieldset>
                <legend>1. Identificação do Paciente</legend>
                <div class="grid-3">
                    <div class="campo">
                        <label for="nome">Nome Completo *</label>
                        <input type="text" id="nome" required placeholder="Ex: Maria Oliveira">
                    </div>
                    <div class="campo">
                        <label for="nascimento">Data de Nascimento *</label>
                        <input type="date" id="nascimento" required>
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone / WhatsApp *</label>
                        <input type="tel" id="telefone" required placeholder="(11) 99999-9999">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="campo">
                        <label for="profissao">Profissão</label>
                        <input type="text" id="profissao" placeholder="Ex: Professora">
                    </div>
                    <div class="campo">
                        <label for="emergencia">Contato de Emergência (Nome e Tel.)</label>
                        <input type="text" id="emergencia" placeholder="Ex: João - (11) 98888-8888">
                    </div>
                </div>
            </fieldset>

            <!-- Seção 2: Medidas e Queixa Principal -->
            <fieldset>
                <legend>2. Queixa Principal e Medidas</legend>
                <div class="campo">
                    <label for="queixa">Queixa Principal / Objetivo do Atendimento *</label>
                    <textarea id="queixa" rows="2" required placeholder="Descreva o motivo principal da consulta..."></textarea>
                </div>
                <div class="grid-4">
                    <div class="campo">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" id="peso" step="0.1" min="1" placeholder="70.5">
                    </div>
                    <div class="campo">
                        <label for="altura">Altura (m)</label>
                        <input type="number" id="altura" step="0.01" min="0.5" max="2.5" placeholder="1.75">
                    </div>
                    <div class="campo">
                        <label for="imc">IMC (Automático)</label>
                        <input type="text" id="imc" readonly placeholder="0.0 - Normal">
                    </div>
                    <div class="campo">
                        <label for="pressao">Pressão Arterial</label>
                        <input type="text" id="pressao" placeholder="120/80 mmHg">
                    </div>
                </div>
            </fieldset>

            <!-- Seção 3: Histórico de Saúde -->
            <fieldset>
                <legend>3. Histórico Clínico</legend>
                <div class="checkbox-grid">
                    <label class="check-item">
                        <input type="checkbox" name="condicoes" value="Hipertensão"> Hipertensão
                    </label>
                    <label class="check-item">
                        <input type="checkbox" name="condicoes" value="Diabetes"> Diabetes
                    </label>
                    <label class="check-item">
                        <input type="checkbox" name="condicoes" value="Problemas Cardíacos"> Problemas Cardíacos
                    </label>
                    <label class="check-item">
                        <input type="checkbox" name="condicoes" value="Asma / Respiratório"> Asma / Respiratório
                    </label>
                    <label class="check-item">
                        <input type="checkbox" name="condicoes" value="Gestante / Lactante"> Gestante / Lactante
                    </label>
                    <label class="check-item">
                        <input type="checkbox" name="condicoes" value="Cirurgia Recente"> Cirurgia Recente
                    </label>
                </div>

                <div class="grid-2" style="margin-top: 15px;">
                    <div class="campo">
                        <label for="alergias">Alergias (Medicamentos, alimentos, substâncias)</label>
                        <input type="text" id="alergias" placeholder="Deixe em branco se não houver">
                    </div>
                    <div class="campo">
                        <label for="medicamentos">Medicamentos em Uso Contínuo</label>
                        <input type="text" id="medicamentos" placeholder="Ex: Losartana 50mg">
                    </div>
                </div>
            </fieldset>

            <!-- Seção 4: Hábitos e Observações -->
            <fieldset>
                <legend>4. Hábitos de Vida e Observações</legend>
                <div class="grid-3">
                    <div class="campo">
                        <label for="atividade">Pratica Atividade Física?</label>
                        <select id="atividade">
                            <option value="Sedentário">Não (Sedentário)</option>
                            <option value="1 a 2x na semana">1 a 2x na semana</option>
                            <option value="3 ou mais vezes">3 ou mais vezes na semana</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="tabagismo">Fumante?</label>
                        <select id="tabagismo">
                            <option value="Não">Não</option>
                            <option value="Sim">Sim</option>
                            <option value="Ex-fumante">Ex-fumante</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="etilismo">Consome Bebida Alcoólica?</label>
                        <select id="etilismo">
                            <option value="Não">Não</option>
                            <option value="Socialmente">Socialmente</option>
                            <option value="Frequentemente">Frequentemente</option>
                        </select>
                    </div>
                </div>
                <div class="campo">
                    <label for="observacoes">Observações Gerais do Profissional</label>
                    <textarea id="observacoes" rows="3" placeholder="Anotações adicionais relevantes para o acompanhamento..."></textarea>
                </div>
            </fieldset>

            <div class="form-footer no-print">
                <button type="submit" class="btn-salvar">💾 Salvar Ficha de Anamnese</button>
            </div>
        </form>

        <!-- Lista de Fichas Salvas -->
        <section class="historico-section no-print">
            <div class="historico-header">
                <h2>📂 Fichas Salvas (<span id="total-fichas">0</span>)</h2>
                <input type="text" id="busca" placeholder="🔍 Buscar por nome ou telefone...">
            </div>
            <div id="lista-fichas" class="lista-fichas">
                <!-- Cards das fichas aparecerão aqui -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
