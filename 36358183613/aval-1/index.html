<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque Simples</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>📦 Controle de Estoque</h1>
            <div class="resumo">
                <div class="card">
                    <span>Total de Itens</span>
                    <strong id="total-itens">0</strong>
                </div>
                <div class="card">
                    <span>Valor em Estoque</span>
                    <strong id="valor-total">R$ 0,00</strong>
                </div>
            </div>
        </header>

        <section class="form-section">
            <h2>Adicionar Novo Produto</h2>
            <form id="form-produto">
                <input type="text" id="nome" placeholder="Nome do produto" required>
                <input type="text" id="categoria" placeholder="Categoria (ex: Eletrônicos)" required>
                <input type="number" id="quantidade" placeholder="Quantidade" min="1" required>
                <input type="number" id="preco" placeholder="Preço Unitário (R$)" step="0.01" min="0.01" required>
                <button type="submit" class="btn-add">Adicionar</button>
            </form>
        </section>

        <section class="lista-section">
            <div class="lista-header">
                <h2>Produtos Cadastrados</h2>
                <input type="text" id="busca" placeholder="🔍 Buscar produto ou categoria...">
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Qtd.</th>
                        <th>Preço Unit.</th>
                        <th>Subtotal</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos">
                    <!-- Os produtos serão inseridos aqui via JavaScript -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
