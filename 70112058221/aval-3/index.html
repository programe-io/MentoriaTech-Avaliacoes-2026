<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta+ | Gerenciamento</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Conecta+</h1>
        <p>Gestão inteligente de eventos escolares</p>
    </header>

    <main>
        <section class="resumo">
            <div class="indicador">
                <h3 id="totalEventos">0</h3>
                <p>Eventos</p>
            </div>
            <div class="indicador">
                <h3 id="totalInscritos">0</h3>
                <p>Inscrições</p>
            </div>
            <div class="indicador">
                <h3 id="totalConcluidos">0</h3>
                <p>Concluídos</p>
            </div>
        </section>

        <section>
            <h2>Cadastrar evento</h2>
            <form id="eventoForm">
                <input id="nomeEvento" placeholder="Nome do evento" required>
                <input id="dataEvento" type="date" required>
                <input id="localEvento" placeholder="Local do evento" required>
                <input id="vagasEvento" type="number" min="1" placeholder="Quantidade de vagas" required>
                <button type="submit" id="botaoEvento">Cadastrar evento</button>
                <button type="button" id="cancelarEdicao" class="secundario" hidden>Cancelar edição</button>
            </form>
        </section>

        <section>
            <h2>Inscrever participante</h2>
            <form id="inscricaoForm">
                <input id="nomeAluno" placeholder="Nome do estudante" required>
                <input id="turmaAluno" placeholder="Turma" required>
                <select id="eventoEscolhido" required>
                    <option value="">Selecione um evento</option>
                </select>
                <button type="submit">Realizar inscrição</button>
            </form>
            <p id="mensagem"></p>
        </section>

        <section>
            <h2>Gerenciar eventos</h2>
            <div id="listaEventos"></div>
        </section>

        <section>
            <h2>Participantes inscritos</h2>
            <div id="listaParticipantes"></div>
        </section>
    </main>

    <footer>Conecta+ © 2026 - Todos os direitos reservados</footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
