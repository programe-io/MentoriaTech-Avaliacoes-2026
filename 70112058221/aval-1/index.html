<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta+ | Eventos Escolares</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Conecta+</h1>
        <p>Conectando estudantes e oportunidades</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar evento</h2>

            <form id="eventoForm">
                <input id="nome" type="text" placeholder="Nome do evento" required>
                <input id="data" type="date" required>
                <input id="horario" type="time" required>
                <input id="local" type="text" placeholder="Local do evento" required>
                <input id="vagas" type="number" placeholder="Quantidade de vagas" min="1" required>

                <button type="submit">Cadastrar evento</button>
            </form>
        </section>

        <section>
            <h2>Eventos cadastrados</h2>
            <div id="listaEventos" class="eventos">
                <p>Nenhum evento cadastrado.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Conecta+ © 2026 - Projeto estudantil</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
