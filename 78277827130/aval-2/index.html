<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> MiniFeed</title>
    <link rel="stylesheet"  href="style.css">
    
<link href="style.css" rel="stylesheet"></head>

<body>
  <head>
      <div class="reader-content"> 
        <h1>MiniFeed</h1>
        <nav> 
            <a href="#">Inicial </a>
            <a href="#">Perfil </a>
        </nav>
  </head>

  <main>
    <section class="new-post">
        <div class="user">
            <div class="avatar"> </div>
            <div>
                <strong>Seu nome aqui<strong> 
                <span>O que você esta pensando?</span>

            </div>            
        </div>
        <button>Publicar</button>        
    </section>

    <article class="post">
        <div class="post-header ">
            <div class="avatar"> </div>
                <div>
                    <strong>Seu nome aqui<strong> 
                    <span>- 10min</span>
                </div>            
            </div>

            <div class="post-text">
                Hoje eu vi ...
            </div>   
            <img src="https://preview.redd.it/link-do-zap-v0-7z1exnuhwjvd1.jpeg?auto=webp&s=53439f23b01dcdd192e163c52faf49eabfea48e0"alt="imagem do filme">
            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>
        </div>

     
      

    </article>
      
  </main>

 <footer>
     <p>Minifeed-Todos os direitos reservados- 2026</p>
 </footer>


</body>


</html>
