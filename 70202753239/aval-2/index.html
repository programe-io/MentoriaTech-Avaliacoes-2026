<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Estoque</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <h1>Sistema de Estoque</h1>
      <p>Gerencie seus produtos de forma simples</p>
    </header>

    <!-- Formulário de Cadastro -->
    <section class="card">
      <h2>Cadastrar Novo Produto</h2>
      <form id="form-produto">
        <div class="form-row">
          <div class="form-group">
            <label for="codigo">Código</label>
            <input type="text" id="codigo" placeholder="Ex: 006" required>
          </div>
          <div class="form-group">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" placeholder="Nome do produto" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="0" placeholder="0" required>
          </div>
          <div class="form-group">
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" min="0" step="0.01" placeholder="0.00" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
      </form>
    </section>

    <!-- Lista de Produtos -->
    <section class="card">
      <div class="lista-header">
        <h2>Produtos Cadastrados</h2>
        <span id="total-produtos">0 produtos</span>
      </div>
      <div class="table-container">
        <table id="tabela-produtos">
          <thead>
            <tr>
              <th>Código</th>
              <th>Descrição</th>
              <th>Quantidade</th>
              <th>Valor</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- Preenchido via JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
