<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Barra de Navegação Superior -->
  <header class="navbar">
    <div class="nav-container">
      <h1 class="brand-logo">Instagram</h1>
      <div class="search-bar">
        <input type="text" id="busca-usuario" placeholder="Pesquisar">
      </div>
      <nav class="nav-actions">
        <button id="btn-abrir-criar" class="icon-btn" title="Nova Publicação">➕</button>
        <button id="btn-filtrar-salvos" class="icon-btn" title="Itens Salvos">🔖</button>
        <img src="https://unsplash.com" alt="Seu perfil" class="nav-avatar">
      </nav>
    </div>
  </header>

  <!-- Layout Principal -->
  <main class="main-wrapper">
    
    <!-- Coluna Central: Stories + Feed -->
    <section class="feed-column">
      
      <!-- Barra de Stories -->
      <div class="stories-box" id="stories-container"></div>

      <!-- Aviso de Filtro Salvos (oculto por padrão) -->
      <div id="aviso-salvos" class="aviso-filtro hidden">
        <span>Exibindo apenas publicações salvas</span>
        <button id="btn-limpar-filtro">Ver todas</button>
      </div>

      <!-- Timeline de Posts -->
      <div id="feed-posts" class="feed-posts"></div>

    </section>

    <!-- Coluna Lateral: Perfil e Sugestões (Desktop) -->
    <aside class="sidebar-column">
      <div class="user-profile-row">
        <img src="https://unsplash.com" alt="Camila Silva" class="avatar-lg">
        <div class="user-info">
          <strong>camila.dev</strong>
          <span>Camila Silva</span>
        </div>
      </div>

      <div class="suggestions-header">
        <span>Sugestões para você</span>
      </div>

      <div id="lista-sugestoes" class="suggestions-list"></div>

      <footer class="sidebar-footer">
        <p>Sobre · Ajuda · Imprensa · API · Carreiras · Privacidade · Termos</p>
        <p style="margin-top: 12px;">&copy; 2026 INSTAGRAM CLONE PROJETO WEB</p>
      </footer>
    </aside>

  </main>

  <!-- Modal Visualizador de Story -->
  <div id="modal-story" class="modal hidden">
    <div class="story-viewer">
      <div class="story-progress-bar">
        <div id="story-progress-fill" class="story-progress-fill"></div>
      </div>
      <div class="story-header">
        <div class="story-user">
          <img id="story-avatar" src="" alt="">
          <span id="story-username"></span>
        </div>
        <button id="fechar-story" class="close-story">&times;</button>
      </div>
      <img id="story-image" src="" alt="Story" class="story-img-full">
    </div>
  </div>

  <!-- Modal Criar Nova Publicação -->
  <div id="modal-criar" class="modal hidden">
    <div class="create-box">
      <div class="create-header">
        <h3>Criar nova publicação</h3>
        <button id="fechar-criar" class="close-btn">&times;</button>
      </div>
      <form id="form-novo-post" class="create-form">
        <label>URL da Imagem</label>
        <input type="url" id="post-img-url" placeholder="https://unsplash.com..." required>
        
        <label>Localização (opcional)</label>
        <input type="text" id="post-local" placeholder="Ex: Teresina, Piauí">

        <label>Legenda</label>
        <textarea id="post-legenda" rows="3" placeholder="Escreva uma legenda..."></textarea>

        <button type="submit" class="btn-share">Compartilhar</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
