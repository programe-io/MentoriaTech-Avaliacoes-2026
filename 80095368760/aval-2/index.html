<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuAuFeed | Rede Social de Cachorros</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <div class="container header-content">
      <h1 class="logo">🐶 AuAu<span>Feed</span></h1>
      <div class="usuario-logado">
        <img src="https://unsplash.com" alt="Avatar do Bob" class="avatar-pequeno">
        <span><strong>@bob_beagle</strong></span>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container feed-container">

    <!-- Caixa de Nova Postagem -->
    <section class="card-criar-post">
      <div class="criar-topo">
        <img src="https://unsplash.com" alt="Avatar do Bob" class="avatar">
        <textarea id="texto-post" rows="3" placeholder="O que o seu doguinho aprontou hoje, @bob_beagle?"></textarea>
      </div>
      
      <div id="box-url-imagem" class="box-url hidden">
        <input type="url" id="url-imagem" placeholder="Cole aqui o link de uma foto (https://...)">
      </div>

      <div class="criar-rodape">
        <button type="button" id="btn-toggle-foto" class="btn-icone">📷 Adicionar Foto</button>
        <button type="button" id="btn-publicar" class="btn-primario">Postar</button>
      </div>
    </section>

    <!-- Abas de Filtro do Feed -->
    <div class="abas-feed">
      <button class="aba-btn ativo" data-filtro="todos">🐾 Explorar Feed</button>
      <button class="aba-btn" data-filtro="curtidos">❤️ Curtidos por mim</button>
    </div>

    <!-- Timeline de Postagens -->
    <section id="timeline" class="timeline"></section>

  </main>

  <!-- Rodapé -->
  <footer class="footer">
    <p>&copy; 2026 AuAuFeed - Projeto prático de Feed Social com HTML, CSS e JS.</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
