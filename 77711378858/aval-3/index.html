<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Marcus Passos Dias">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Clone Instagram</title>
        <link rel="stylesheet" href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <body class="min-h-screen bg-gray-100 text-slate-900">
        <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
            <div class="max-w-5xl mx-auto px-4">
                <div class="flex items-center justify-between h-14">
                    <h1 class="text-xl font-semibold">Instagram</h1>
                    <button><i class="bx bx-menu"></i></button>
                </div>
            </div>
        </header>
        <main class="max-w-5xl mx-auto px-4 py-4 pb-20">
            <div class="flex gap-8">
                <div class="flex-1 max-w-lg max-auto">
                    <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">
                        <div class="flex gap-4 overflow-x-auto ">
                            <div class="flex flex-col items-center flex-shrink-0">
                                <div class="w-16 h-16 rounded-full p-0.5 bg-gray-100">
                                    <div class="w-full h-full rounded-full p-0.5 bg-white">
                                        <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">
                                            <span class="text-2xl text-gray-500">+</span>
                                        </div>
                                    </div>
                                </div>
                                <span class="text-xs mt-1 w-16 text-center">Você</span>
                            </div>
                            <div class="flex flex-col items-center flex-shrink-0">
                                <div class="w-16 h-16 rounded-full p-0.5 bg-gray-100">
                                    <div class="w-full h-full rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                        <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">
                                            <img class="w-full h-full object-cover rounded-full" src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg" >
                                        </div>
                                    </div>
                                </div>
                                <span class="text-xs mt-1 w-16 text-center">João</span>
                            </div>
                        </div>
                    </section>
                    <article class="bg-white border border-gray-200 rounded-lg mb-4">
                        <header class="flex items-center justify-between p-3">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full p-0.5 bg-gray-100">
                                    <div class="w-full h-full rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                        <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">
                                            <img class="w-full h-full object-cover rounded-full" src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg" >
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <p class="text-sm font-semibold">sm1_smth</p>
                                    <p class="text-xs text-gray-500">São Raimundo Nonato - PI</p>
                                </div>
                            </div>
                            <button><i class="bx bx-dots-horizontal-rounded"></i></button>
                        </header>
                        <div class="bg-gray-100 relative">
                            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&fit=crop" alt="" class="w-full h-full object-cover">
                        </div>
                        <div class="p-3">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center gap-4">
                                    <button><i class="text-2xl bx bx-heart"></i></button>
                                    <button><i class="text-2xl bx bx-message-circle-reply"></i></button>
                                    <button><i class="text-2xl bx bx-send"></i></button>
                                </div>
                                <button><i class="text-2xl bx bx-bookmark"></i></button>
                            </div>
                            <p class="font-semibold text-sm mb-2">1.234 curtidas</p>
                            <p class="text-sm">
                                <span class="font-semibold">sm1_smth</span>
                                <span class="text-slate-900/90">
                                    Aprendendo layout responsivo com Tailwind CSS! 
                                    O segredo é começar pelo mobile e ir expandindo. 
                                    #tailwindcss #webdev
                                </span>
                            </p>
                            <button class="text-sm text-gray-500 mt-1">
                                Ver todos os 42 comentários
                            </button>
                            <p class="text-xs text-gray-500 mt-2 uppercase">há 2 horas</p>
                        </div>
                    </article>
                </div>
            </div>
        </main>
    </body>
</html>
