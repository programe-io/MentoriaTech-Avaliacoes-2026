<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, follow">
        <meta content="website" property="og:type">
        <title>Mini Feed Social</title>
        <link rel="stylesheet" href="style.css">
    <link href="style.css" rel="stylesheet"></head>
    <body>
        <header>
            <div class="header-content">
                <h1>Mini Feed</h1>
                <nav>
                    <a href="#">Início</a>
                    <a href="#">Perfil</a>
                </nav>
            </div>
        </header>
        <main>
            <section class="new-post">
                <div class="user">
                    <div class="avatar">M</div>
                    <div>
                        <strong>Marcus</strong>
                        <span>O que você está pensando?</span>
                    </div>
                </div>
                <button type="button">Publicar</button>
            </section>
            <article class='post'>
                <div class="post-header">
                    <div class="avatar">J</div>
                    <div>
                        <strong>João</strong>
                        <span>Há 10 minutos</span>
                    </div>
                </div>
                <div class="post-text">
                    Hoje levei meu gato no vet
                </div>
                <figure>
                    <img src="https://tse1.explicit.bing.net/th/id/OIP.rYkppdr81YsJxQ-GNy_MKQHaEK?r=0&pid=Api" alt="Gato rajado cinza no veterinário">
                </figure>
                <div class="post-action">
                    <button type="button">Curtir</button>
                    <button type="button">Comentar</button>
                </div>
            </article>
        </main>
        <footer>
            <p>&copy; Mini Feed &mdash; Todos os direitos reservados</p>
            <a href="#">Voltar ao topo</a>
        </footer>
    </body>
</html>
