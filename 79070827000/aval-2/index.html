
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaSimple</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    
    <header class="cabecalho">
        <h1>Instagram</h1>

        <nav>
            <a href="#">Início</a>
            <a href="#">Explorar</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main>

        <section class="stories">

            <article>
                <img src="https://i.pravatar.cc/70?img=1" alt="Foto de Ana">
                <p>Ana</p>
            </article>

            <article>
                <img src="https://i.pravatar.cc/70?img=5" alt="Foto de João">
                <p>João</p>
            </article>

            <article>
                <img src="https://i.pravatar.cc/70?img=9" alt="Foto de Maria">
                <p>Maria</p>
            </article>

            <article>
                <img src="https://i.pravatar.cc/70?img=12" alt="Foto de Pedro">
                <p>Pedro</p>
            </article>

        </section>

        <section class="feed">

            <article class="post">

                <header class="usuario">
                    <img src="https://i.pravatar.cc/50?img=1" alt="Foto de Ana">
                    <strong>Ana Silva</strong>
                </header>

                <figure>
                    <img
                        src="https://picsum.photos/id/1015/600/400"
                        alt="Paisagem com montanhas">
                    <figcaption>
                        Aproveitando o dia! 🌄
                    </figcaption>
                </figure>

                <div class="acoes">
                    <button class="curtir">♡ Curtir</button>
                    <button>💬 Comentar</button>
                    <button>↗ Compartilhar</button>
                </div>

                <p class="curtidas">120 curtidas</p>

            </article>

        </section>

        <aside class="sugestoes">
            <h2>Sugestões para você</h2>

            <p>Lucas <button>Seguir</button></p>
            <p>Carla <button>Seguir</button></p>
        </aside>

    </main>

    <footer>
        <p>© 2026 InstaSimple</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
