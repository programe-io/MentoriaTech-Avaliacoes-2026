<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <div class="campo">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" placeholder="Ex: Cadeira Gamer">
            </div>

            <div class="campo">
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" min="1" placeholder="Ex: 10">
            </div>

            <div class="campo">
                <label for="valor">Valor</label>
                <input type="number" id="valor" min="0" step="0.01" placeholder="Ex: 699.00">
            </div>

            <button onclick="cadastrarProdutoTela()">
                Cadastrar Produto
            </button>
        </section>

        <section class="lista">
            <h2>Produtos Cadastrados</h2>

            <div id="mensagem"></div>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaProdutos">
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
