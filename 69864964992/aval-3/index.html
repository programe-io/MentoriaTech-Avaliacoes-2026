<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
  <header class="cabecalho">
    <h1>Área de Entrega - Avaliações</h1>
    <p>Escreva seu código abaixo, visualize o resultado em tempo real e publique sua avaliação.</p>
  </header>

  <main class="editores">
    <div class="caixa-editor">
      <div class="topo-editor">
        <span>HTML</span>
      </div>
      <textarea id="codigo-html" placeholder="Digite seu HTML aqui...">&lt;h2&gt;Olá, Professor!&lt;/h2&gt;
&lt;p&gt;Este é o meu projeto de avaliação.&lt;/p&gt;</textarea>
    </div>

    <div class="caixa-editor">
      <div class="topo-editor">
        <span>CSS</span>
      </div>
      <textarea id="codigo-css" placeholder="Digite seu CSS aqui...">body { font-family: sans-serif; text-align: center; padding: 20px; \}
h2 { color: #10b981; \}</textarea>
    </div>

    <div class="caixa-editor">
      <div class="topo-editor">
        <span>JavaScript</span>
      </div>
      <textarea id="codigo-js" placeholder="Digite seu JS aqui...">console.log("Projeto carregado!");</textarea>
    </div>
  </main>

  <section class="secao-preview">
    <h2>Pré-visualização do Código</h2>
    <iframe id="tela-preview"></iframe>
    <button id="btn-publicar">Publicar Avaliação</button>
    <p id="mensagem-status"></p>
  </section>
</div>$0
  <script src="script.js"></script>
  
</body>
</html>
