<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #132d45;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            color: #222;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: #00b894;
            margin-bottom: 25px;
        }

        .formulario {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        input,
        select,
        button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #00b894;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #009f7f;
        }

        #mensagem {
            margin: 15px 0;
            font-weight: bold;
        }

        .tarefa {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            background: #f8f8f8;
        }

        .tarefa h3 {
            margin-bottom: 8px;
        }

        .concluida {
            background: #dff8ed;
        }

        .concluida h3 {
            text-decoration: line-through;
        }

        .botoes {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .botoes button {
            font-size: 14px;
            padding: 8px 12px;
        }

        .btn-concluir {
            background: #0984e3;
        }

        .btn-prioridade {
            background: #6c5ce7;
        }

        .btn-excluir {
            background: #d63031;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Gerenciador de Tarefas</h1>

        <div class="formulario">

            <input
                type="text"
                id="codigo"
                placeholder="Código da tarefa"
            >

            <input
                type="text"
                id="titulo"
                placeholder="Título da tarefa (mínimo 5 caracteres)"
            >

            <select id="prioridade">
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button onclick="cadastrarTarefa()">
                Cadastrar tarefa
            </button>

        </div>

        <div id="mensagem"></div>

        <h2>Lista de tarefas</h2>

        <br>

        <div id="listaTarefas"></div>

    </div>

    <script>

        // Array que armazenará todas as tarefas
        let tarefas = [];

        // Função para cadastrar uma nova tarefa
        function cadastrarTarefa() {

            const codigo = document.getElementById("codigo").value.trim();
            const titulo = document.getElementById("titulo").value.trim();
            const prioridade = Number(
                document.getElementById("prioridade").value
            );

            // Validação do código
            if (codigo === "") {
                mostrarMensagem(
                    "Digite o código da tarefa.",
                    "red"
                );
                return;
            }

            // Validação do título
            if (titulo.length < 5) {
                mostrarMensagem(
                    "O título deve ter no mínimo 5 caracteres.",
                    "red"
                );
                return;
            }

            // Validação da prioridade
            if (prioridade < 1 || prioridade > 3) {
                mostrarMensagem(
                    "A prioridade deve ser um valor entre 1 e 3.",
                    "red"
                );
                return;
            }

            // Verifica se já existe uma tarefa com o mesmo código
            const codigoExistente = tarefas.some(
                tarefa => tarefa.codigo === codigo
            );

            if (codigoExistente) {
                mostrarMensagem(
                    "Já existe uma tarefa com esse código.",
                    "red"
                );
                return;
            }

            // Criação da tarefa
            const tarefa = {
                codigo: codigo,
                titulo: titulo,
                prioridade: prioridade,
                status: "Pendente"
            };

            // Adiciona a tarefa ao array
            tarefas.push(tarefa);

            mostrarMensagem(
                "Tarefa cadastrada com sucesso!",
                "green"
            );

            // Limpa os campos
            document.getElementById("codigo").value = "";
            document.getElementById("titulo").value = "";
            document.getElementById("prioridade").value = "1";

            // Atualiza a lista
            listarTarefas();
        }


        // Função para listar todas as tarefas
        function listarTarefas() {

            const lista = document.getElementById("listaTarefas");

            lista.innerHTML = "";

            if (tarefas.length === 0) {
                lista.innerHTML = "<p>Nenhuma tarefa cadastrada.</p>";
                return;
            }

            tarefas.forEach((tarefa, indice) => {

                const div = document.createElement("div");

                div.classList.add("tarefa");

                // Se estiver concluída, adiciona uma classe
                if (tarefa.status === "Concluída") {
                    div.classList.add("concluida");
                }

                let nomePrioridade = "";

                if (tarefa.prioridade === 1) {
                    nomePrioridade = "Alta";
                } else if (tarefa.prioridade === 2) {
                    nomePrioridade = "Média";
                } else {
                    nomePrioridade = "Baixa";
                }

                div.innerHTML = `
                    <h3>${tarefa.titulo}</h3>

                    <p>
                        <strong>Código:</strong>
                        ${tarefa.codigo}
                    </p>

                    <p>
                        <strong>Prioridade:</strong>
                        ${tarefa.prioridade} - ${nomePrioridade}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        ${tarefa.status}
                    </p>

                    <div class="botoes">

                        <button
                            class="btn-concluir"
                            onclick="marcarConcluida(${indice})">
                            Marcar como concluída
                        </button>

                        <button
                            class="btn-prioridade"
                            onclick="alterarPrioridade(${indice})">
                            Alterar prioridade
                        </button>

                        <button
                            class="btn-excluir"
                            onclick="excluirTarefa(${indice})">
                            Excluir
                        </button>

                    </div>
                `;

                lista.appendChild(div);
            });
        }


        // Função para marcar uma tarefa como concluída
        function marcarConcluida(indice) {

            tarefas[indice].status = "Concluída";

            mostrarMensagem(
                "Tarefa marcada como concluída!",
                "green"
            );

            listarTarefas();
        }


        // Função para alterar a prioridade
        function alterarPrioridade(indice) {

            let novaPrioridade = prompt(
                "Digite a nova prioridade:\n" +
                "1 - Alta\n" +
                "2 - Média\n" +
                "3 - Baixa"
            );

            novaPrioridade = Number(novaPrioridade);

            // Validação da nova prioridade
            if (
                novaPrioridade < 1 ||
                novaPrioridade > 3 ||
                !Number.isInteger(novaPrioridade)
            ) {
                mostrarMensagem(
                    "A prioridade deve ser um valor entre 1 e 3.",
                    "red"
                );
                return;
            }

            tarefas[indice].prioridade = novaPrioridade;

            mostrarMensagem(
                "Prioridade alterada com sucesso!",
                "green"
            );

            listarTarefas();
        }


        // Função para excluir uma tarefa
        function excluirTarefa(indice) {

            tarefas.splice(indice, 1);

            mostrarMensagem(
                "Tarefa excluída.",
                "green"
            );

            listarTarefas();
        }


        // Função para mostrar mensagens
        function mostrarMensagem(texto, cor) {

            const mensagem = document.getElementById("mensagem");

            mensagem.textContent = texto;
            mensagem.style.color = cor;
        }


        // Exibe a lista inicialmente
        listarTarefas();

    </script>

</body>
</html>
