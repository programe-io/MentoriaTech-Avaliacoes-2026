<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Adivinhe o Número</title>
<link href="style.css" rel="stylesheet"></head>
<body>

<h1>Adivinhe o Número (1 a 100)</h1>

<input type="number" id="palpite">
<button onclick="verificar()">Tentar</button>

<p id="msg"></p>

<script>
let numero = Math.floor(Math.random() * 100) + 1;

function verificar(){
    let palpite = Number(document.getElementById("palpite").value);

    if(palpite > numero){
        msg.innerHTML = "Muito alto!";
    }else if(palpite < numero){
        msg.innerHTML = "Muito baixo!";
    }else{
        msg.innerHTML = "Parabéns! Você acertou!";
    }
}
</script>

<script src="script.js"></script></body>
</html>
