<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas atividades e acompanhe seu progresso.</p>
    </header>

    <main class="container">

        <!-- Cadastro de tarefas -->
        <section class="card">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título da tarefa"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade" required>
                        <option value="">Selecione</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit">
                    Cadastrar tarefa
                </button>

            </form>
        </section>

        <!-- Mensagens -->
        <div id="mensagem" class="mensagem"></div>

        <!-- Alteração e conclusão -->
        <section class="card">
            <h2>Gerenciar tarefa</h2>

            <div class="campo">
                <label for="codigo">Código da tarefa</label>
                <input
                    type="number"
                    id="codigo"
                    placeholder="Digite o código"
                    min="1"
                >
            </div>

            <div class="campo">
                <label for="novaPrioridade">Nova prioridade</label>

                <select id="novaPrioridade">
                    <option value="">Selecione a prioridade</option>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>
            </div>

            <div class="botoes">
                <button id="btnConcluir" type="button">
                    Concluir tarefa
                </button>

                <button id="btnAlterar" type="button" class="secundario">
                    Alterar prioridade
                </button>
            </div>

        </section>

        <!-- Listagem -->
        <section class="card">
            <div class="titulo-lista">
                <h2>Minhas tarefas</h2>
                <span id="contador">0 tarefas</span>
            </div>

            <div id="listaTarefas">
                <p class="vazio">
                    Nenhuma tarefa cadastrada.
                </p>
            </div>
        </section>

    </main>

    <footer>
        <p>Projeto Gerenciador de Tarefas - JavaScript</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
