
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pretty Doll - Kawaii Dress Up</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🎀 Pretty Doll 🎀</h1>
        <p>Monte o look mais fofinho!</p>
    </header>

    <main class="game">

        <section class="boneca-area">
            <h2>Minha Bonequinha 💗</h2>

            <div class="boneca">
                <div id="cabelo">🎀</div>
                <div id="rosto">👧🏻</div>
                <div id="roupa">👗</div>
                <div id="sapato">👠</div>
            </div>

            <div class="mensagem" id="mensagem">
                Escolha um look bem kawaii! ✨
            </div>
        </section>

        <section class="armario">
            <h2>Meu Closet 💕</h2>

            <h3>👗 Roupinhas</h3>
            <div class="opcoes">
                <button onclick="trocar('roupa','👗')">👗</button>
                <button onclick="trocar('roupa','👚')">👚</button>
                <button onclick="trocar('roupa','👘')">👘</button>
                <button onclick="trocar('roupa','🩱')">🩱</button>
                <button onclick="trocar('roupa','👕')">👕</button>
            </div>

            <h3>💇 Cabelos</h3>
            <div class="opcoes">
                <button onclick="trocar('cabelo','🎀')">🎀</button>
                <button onclick="trocar('cabelo','👑')">👑</button>
                <button onclick="trocar('cabelo','🌸')">🌸</button>
                <button onclick="trocar('cabelo','💖')">💖</button>
                <button onclick="trocar('cabelo','🦋')">🦋</button>
            </div>

            <h3>👠 Sapatos</h3>
            <div class="opcoes">
                <button onclick="trocar('sapato','👠')">👠</button>
                <button onclick="trocar('sapato','👟')">👟</button>
                <button onclick="trocar('sapato','🥿')">🥿</button>
                <button onclick="trocar('sapato','🩰')">🩰</button>
            </div>

            <h3>✨ Acessórios</h3>
            <div class="opcoes">
                <button onclick="trocar('rosto','👧🏻')">👧🏻</button>
                <button onclick="trocar('rosto','👸🏻')">👸🏻</button>
                <button onclick="trocar('rosto','🧚🏻‍♀️')">🧚🏻‍♀️</button>
                <button onclick="trocar('rosto','👩🏻')">👩🏻</button>
            </div>

            <div class="acoes">
                <button class="finalizar" onclick="finalizar()">💗 Finalizar look</button>
                <button class="resetar" onclick="resetar()">🔄 Reiniciar</button>
            </div>

        </section>

    </main>

    <footer>
        Feito com amor ♡ Pretty Doll Studio ♡
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
