
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pegue o Quadrado</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>🎯 PEGUE O QUADRADO!</h1>
        <p>Clique no quadrado vermelho antes que o tempo acabe!</p>

        <div class="stats">
            <div class="stat">
                PONTOS
                <span id="score">0</span>
            </div>

            <div class="stat">
                TEMPO
                <span id="time">30</span>
            </div>

            <div class="stat">
                RECORDE
                <span id="record">0</span>
            </div>
        </div>

        <div class="arena" id="arena">
            <button class="target" id="target"></button>
        </div>

        <button class="start" id="start">COMEÇAR JOGO</button>

        <p id="message">Clique em começar para jogar! 🚀</p>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
