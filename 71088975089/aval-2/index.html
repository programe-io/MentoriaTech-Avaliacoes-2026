<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header class="header">
        <div class="container">
            <h1>✓ Gerenciador de Tarefas</h1>
            <p>Organize suas tarefas de forma simples e eficiente.</p>
        </div>
    </header>

    <main class="container">

        <!-- Cadastro -->
        <section class="card">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <div class="form-group">
                    <label for="titulo">Título da tarefa</label>

                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título da tarefa"
                        maxlength="100"
                    >
                </div>

                <div class="form-group">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade">
                        <option value="">Selecione</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    + Cadastrar tarefa
                </button>

            </form>

            <div id="mensagem" class="mensagem"></div>
        </section>

        <!-- Estatísticas -->
        <section class="estatisticas">

            <div class="stat-card">
                <span class="stat-numero" id="totalTarefas">0</span>
                <span>Total</span>
            </div>

            <div class="stat-card">
                <span class="stat-numero" id="tarefasPendentes">0</span>
                <span>Pendentes</span>
            </div>

            <div class="stat-card">
                <span class="stat-numero" id="tarefasConcluidas">0</span>
                <span>Concluídas</span>
            </div>

        </section>

        <!-- Lista -->
        <section class="card">

            <div class="lista-header">
                <div>
                    <h2>Minhas tarefas</h2>
                    <p id="contador">0 tarefas cadastradas</p>
                </div>

                <select id="filtro">
                    <option value="todas">Todas</option>
                    <option value="pendentes">Pendentes</option>
                    <option value="concluidas">Concluídas</option>
                </select>
            </div>

            <div id="listaTarefas" class="lista-tarefas">

                <div class="vazio">
                    <div class="icone-vazio">✓</div>
                    <h3>Nenhuma tarefa cadastrada</h3>
                    <p>Cadastre sua primeira tarefa acima.</p>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>Gerenciador de Tarefas • HTML + CSS + JavaScript</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
