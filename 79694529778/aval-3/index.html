
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram - Marcella</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fafafa;
    color: #262626;
}

header {
    height: 60px;
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.logo {
    font-family: cursive;
    font-size: 30px;
}

.pesquisa {
    padding: 10px;
    border: none;
    background: #efefef;
    border-radius: 8px;
}

.menu {
    display: flex;
    gap: 20px;
    font-size: 24px;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 15px;
}

.perfil {
    display: flex;
    align-items: center;
    gap: 60px;
    padding: 20px 40px 40px;
}

.foto-perfil {
    width: 145px;
    height: 145px;
    border-radius: 50%;
    object-fit: cover;
    padding: 4px;
    border: 3px solid #d62976;
}

.informacoes h2 {
    font-size: 22px;
    font-weight: normal;
}

button {
    padding: 9px 25px;
    border: none;
    border-radius: 7px;
    background: #0095f6;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.estatisticas {
    display: flex;
    gap: 25px;
    margin: 25px 0;
}

.bio {
    font-size: 14px;
    line-height: 1.6;
}

.destaques {
    display: flex;
    gap: 30px;
    padding: 20px 40px;
}

.destaque {
    text-align: center;
    font-size: 12px;
}

.destaque img {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 2px solid #ccc;
    object-fit: cover;
}

.abas {
    display: flex;
    justify-content: center;
    gap: 65px;
    border-top: 1px solid #ddd;
    padding: 20px;
    font-size: 12px;
}

.feed {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
}

.publicacao {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
}

footer {
    text-align: center;
    padding: 30px;
    color: #888;
}

@media(max-width: 600px) {
    .perfil {
        gap: 15px;
        padding: 15px 5px 30px;
    }

    .foto-perfil {
        width: 85px;
        height: 85px;
    }

    .informacoes h2 {
        font-size: 16px;
    }

    .estatisticas {
        gap: 10px;
        font-size: 11px;
    }

    .pesquisa {
        display: none;
    }

    .abas {
        gap: 25px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <h1 class="logo">Instagram</h1>

    <input class="pesquisa"
    type="text" placeholder="Pesquisar">

    <div class="menu">
        <span>⌂</span>
        <span>✉</span>
        <span>＋</span>
        <span>♡</span>
    </div>
</header>

<main class="container">

<section class="perfil">

    <img src="foto-marcella.jpeg"
    class="foto-perfil" alt="Marcella">

    <div class="informacoes">

        <h2>marcella_silva368</h2>

        <br>

        <button id="seguir" onclick="seguir()">
            Seguir
        </button>

        <div class="estatisticas">
            <span><b>1</b> publicação</span>
            <span><b id="seguidores">1.248</b> seguidores</span>
            <span><b>987</b> seguindo</span>
        </div>

        <div class="bio">
            <b>Marcella ✨</b><br>
            Vivendo momentos e colecionando histórias ♡
            <br>📍 Brasil
        </div>

    </div>

</section>

<section class="destaques">

    <div class="destaque">
        <img src="foto-marcella.jpeg" alt="Momentos">
        <p>Momentos</p>
    </div>

    <div class="destaque">
        <img src="foto-marcella.jpeg" alt="Life">
        <p>Life</p>
    </div>

    <div class="destaque">
        <img src="foto-marcella.jpeg" alt="Amigos">
        <p>Amigos</p>
    </div>

</section>

<nav class="abas">
    <span>▦ PUBLICAÇÕES</span>
    <span>▣ REELS</span>
    <span>♙ MARCADOS</span>
</nav>

<section class="feed">

    <img src="foto-marcella.jpeg"
    class="publicacao" alt="Foto do feed">

</section>

</main>

<footer>
    Instagram • @marcella_silva368
</footer>

<script>
let seguindo = false;

function seguir() {

    const botao = document.getElementById("seguir");
    const seguidores = document.getElementById("seguidores");

    seguindo = !seguindo;

    if (seguindo) {
        botao.innerText = "Seguindo";
        seguidores.innerText = "1.249";
    } else {
        botao.innerText = "Seguir";
        seguidores.innerText = "1.248";
    }
}
</script>

<script src="script.js"></script></body>
</html>
