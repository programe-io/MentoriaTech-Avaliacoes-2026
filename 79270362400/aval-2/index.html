
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topbar">
    <h1>Social<span>Feed</span></h1>
    <input type="text" placeholder="Pesquisar...">
    <div class="profile">
        <img src="https://i.pravatar.cc/100?img=12" alt="Perfil">
    </div>
</header>

<main class="container">

    <section class="create-post">
        <h2>Criar publicação</h2>
        <div class="create-content">
            <img src="https://i.pravatar.cc/100?img=12" alt="Minha foto">
            <input type="text" id="postText" placeholder="O que você está pensando?">
        </div>

        <input type="url" id="postImage"
        placeholder="Cole o link da imagem (opcional)">

        <button onclick="createPost()">Publicar</button>
    </section>

    <section id="feed">

        <article class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=5">
                <div>
                    <h3>Mariana Costa</h3>
                    <small>Há 10 minutos</small>
                </div>
            </div>

            <p>Um dia incrível para aproveitar a natureza! 🌿☀️</p>

            <img class="post-image"
            src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900"
            alt="Paisagem">

            <div class="post-actions">
                <button onclick="likePost(this)">❤️ <span>24</span></button>
                <button onclick="focusComment(this)">💬 Comentar</button>
                <button onclick="sharePost()">↗ Compartilhar</button>
            </div>

            <div class="comments">
                <input type="text" placeholder="Escreva um comentário...">
                <button onclick="addComment(this)">Enviar</button>
                <div class="comment-list"></div>
            </div>
        </article>

        <article class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=11">
                <div>
                    <h3>Lucas Oliveira</h3>
                    <small>Há 30 minutos</small>
                </div>
            </div>

            <p>Viajar é colecionar momentos, não coisas! ✈️🌎</p>

            <img class="post-image"
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900"
            alt="Viagem">

            <div class="post-actions">
                <button onclick="likePost(this)">❤️ <span>48</span></button>
                <button onclick="focusComment(this)">💬 Comentar</button>
                <button onclick="sharePost()">↗ Compartilhar</button>
            </div>

            <div class="comments">
                <input type="text" placeholder="Escreva um comentário...">
                <button onclick="addComment(this)">Enviar</button>
                <div class="comment-list"></div>
            </div>
        </article>

        <article class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=20">
                <div>
                    <h3>Ana Souza</h3>
                    <small>Há 1 hora</small>
                </div>
            </div>

            <p>Pequenos momentos, grandes felicidades! ❤️</p>

            <img class="post-image"
            src="https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=900"
            alt="Natureza">

            <div class="post-actions">
                <button onclick="likePost(this)">❤️ <span>36</span></button>
                <button onclick="focusComment(this)">💬 Comentar</button>
                <button onclick="sharePost()">↗ Compartilhar</button>
            </div>

            <div class="comments">
                <input type="text" placeholder="Escreva um comentário...">
                <button onclick="addComment(this)">Enviar</button>
                <div class="comment-list"></div>
            </div>
        </article>

    </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
