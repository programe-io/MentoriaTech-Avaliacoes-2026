<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Completo</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

  <header>
    <h1>Meu Site Completo</h1>
    <nav>
      <ul>
        <li><a href="#sobre">Sobre</a></li>
        <li><a href="#conteudo">Conteúdo</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section id="sobre">
      <h2>Sobre</h2>
      <p>Exemplo de site usando várias tags HTML.</p>
      <article>
        <h3>Artigo</h3>
        <p>Texto dentro de article.</p>
      </article>
    </section>

    <section id="conteudo">
      <h2>Conteúdo</h2>

      <div class="box">
        <span>Exemplo de span dentro de div</span>
      </div>

      <aside>
        <p>Barra lateral (aside)</p>
      </aside>

      <figure>
        <img src="https://via.placeholder.com/150" alt="Imagem exemplo">
        <figcaption>Legenda da imagem</figcaption>
      </figure>

      <details>
        <summary>Clique para abrir</summary>
        <p>Conteúdo escondido aqui.</p>
      </details>

      <progress value="70" max="100"></progress>
      <meter value="0.6">60%</meter>

    </section>

    <section id="contato">
      <h2>Contato</h2>

      <form>
        <label>Nome:</label>
        <input type="text" id="nome">

        <label>Email:</label>
        <input type="email">

        <button type="button" onclick="enviar()">Enviar</button>
      </form>

      <p id="msg"></p>
    </section>

  </main>

  <footer>
    <p>Rodapé do site</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
