<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Controle seus produtos de forma simples e organizada</p>
    </header>

    <main>

        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" placeholder="Ex: 001" required>
                </div>

                <div class="campo">
                    <label for="nome">Nome do produto</label>
                    <input type="text" id="nome" placeholder="Ex: Arroz" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" placeholder="Ex: Alimentos" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="0" required>
                </div>

                <div class="campo">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" min="0" step="0.01" required>
                </div>

                <button type="submit">Adicionar Produto</button>

            </form>
        </section>


        <section class="resumo">

            <div class="card">
                <h3>Total de produtos</h3>
                <p id="totalProdutos">0</p>
            </div>

            <div class="card">
                <h3>Itens em estoque</h3>
                <p id="totalItens">0</p>
            </div>

            <div class="card">
                <h3>Valor do estoque</h3>
                <p id="valorEstoque">R$ 0,00</p>
            </div>

        </section>


        <section class="estoque">

            <h2>Produtos em Estoque</h2>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>Sistema de Estoque © 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
