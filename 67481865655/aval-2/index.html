<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram - Mini Feed</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            color: #262626;
        }

        /* CABEÇALHO */
        header {
            background: white;
            border-bottom: 1px solid #dbdbdb;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            text-align: center;
            font-family: cursive;
            font-size: 30px;
        }

        /* FEED */
        main {
            width: 470px;
            max-width: 95%;
            margin: 25px auto;
        }

        /* PERFIL */
        .perfil {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .foto-perfil {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: auto;
            overflow: hidden;
            border: 3px solid #e1306c;
        }

        .foto-perfil img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .perfil h2 {
            margin-top: 10px;
            font-size: 20px;
        }

        .perfil p {
            color: #777;
            margin-top: 5px;
        }

        /* PUBLICAÇÃO */
        .post {
            background: white;
            border: 1px solid #dbdbdb;
            margin-bottom: 20px;
        }

        /* USUÁRIO */
        .usuario {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
        }

        .usuario-foto {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
        }

        .usuario-foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .usuario strong {
            font-size: 14px;
        }

        .usuario small {
            color: #777;
        }

        /* IMAGEM */
        .imagem-post {
            width: 100%;
            height: 450px;
            object-fit: cover;
            display: block;
        }

        /* BOTÕES */
        .acoes {
            display: flex;
            gap: 18px;
            padding: 10px 12px;
        }

        .acoes button {
            background: none;
            border: none;
            font-size: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        .acoes button:hover {
            transform: scale(1.1);
        }

        .curtido {
            color: red;
        }

        /* CURTIDAS */
        .curtidas {
            padding: 0 12px 8px;
            font-weight: bold;
            font-size: 14px;
        }

        /* LEGENDA */
        .legenda {
            padding: 0 12px 10px;
            font-size: 14px;
        }

        .legenda strong {
            margin-right: 5px;
        }

        /* COMENTÁRIOS */
        .comentarios {
            padding: 0 12px;
        }

        .comentario {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .comentario strong {
            margin-right: 5px;
        }

        /* CAMPO DE COMENTÁRIO */
        .comentar {
            display: flex;
            border-top: 1px solid #eee;
            padding: 10px;
        }

        .comentar input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .comentar button {
            border: none;
            background: none;
            color: #0095f6;
            font-weight: bold;
            cursor: pointer;
        }

        /* RODAPÉ */
        footer {
            text-align: center;
            color: gray;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <h1>Instagram</h1>
    </header>

    <main>

        <!-- PERFIL -->
        <section class="perfil">

            <div class="foto-perfil">
                <img src="https://i.pravatar.cc/150?img=12">
            </div>

            <h2>Kennedy</h2>
            <p>Meu perfil</p>

        </section>


        <!-- PRIMEIRA PUBLICAÇÃO -->
        <article class="post">

            <div class="usuario">

                <div class="usuario-foto">
                    <img src="https://i.pravatar.cc/100?img=12">
                </div>

                <div>
                    <strong>Kennedy</strong>
                    <small> • Agora</small>
                </div>

            </div>


            <!-- FOTO -->
            <img
                class="imagem-post"
                src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=800"
                alt="Publicação">


            <!-- BOTÕES -->
            <div class="acoes">

                <button onclick="curtir(this)">
                    ♡
                </button>

                <button onclick="focarComentario(this)">
                    💬
                </button>

                <button onclick="compartilhar()">
                    ✈️
                </button>

            </div>


            <!-- CURTIDAS -->
            <div class="curtidas">
                <span>0</span> curtidas
            </div>


            <!-- LEGENDA -->
            <div class="legenda">
                <strong>Kennedy</strong>
                uma linda foto!
            </div>


            <!-- COMENTÁRIOS -->
            <div class="comentarios"></div>


            <!-- COMENTAR -->
            <div class="comentar">

                <input
                    type="text"
                    placeholder="Adicione um comentário..."
                >

                <button onclick="comentar(this)">
                    Publicar
                </button>

            </div>

        </article>



        <!-- SEGUNDA PUBLICAÇÃO -->
        <article class="post">

            <div class="usuario">

                <div class="usuario-foto">
                    <img src="https://i.pravatar.cc/100?img=13">
                </div>

                <div>
                    <strong>João</strong>
                    <small> • 10 min</small>
                </div>

            </div>


            <img
                class="imagem-post"
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800"
                alt="Paisagem">


            <div class="acoes">

                <button onclick="curtir(this)">
                    ♡
                </button>

                <button onclick="focarComentario(this)">
                    💬
                </button>

                <button onclick="compartilhar()">
                    ✈️
                </button>

            </div>


            <div class="curtidas">
                <span>0</span> curtidas
            </div>


            <div class="legenda">
                <strong>João</strong>
                Uma linda paisagem! 🌄
            </div>


            <div class="comentarios"></div>


            <div class="comentar">

                <input
                    type="text"
                    placeholder="Adicione um comentário..."
                >

                <button onclick="comentar(this)">
                    Publicar
                </button>

            </div>

        </article>

    </main>


    <footer>
        © 2026 - Mini Instagram
    </footer>
  
  
</body>
</html>
