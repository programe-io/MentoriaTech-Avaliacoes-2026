<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <body>

<header>
    <div class="logo">Instagram</div>

    <input class="search"
    type="search" placeholder="Pesquisar">

    <div class="header-icons">
        <button onclick="openMessages()">✉</button>
        <button onclick="toggleTheme()" id="themeButton">🌙</button>
    </div>
</header>

<div class="container" id="feed">

    <section class="stories">

        <div class="story">
            <div class="circle"><div>＋</div></div>
            Seu story
        </div>

        <div class="story">
            <div class="circle"><div>🌸</div></div>
            Julia
        </div>

        <div class="story">
            <div class="circle"><div>🦋</div></div>
            Maria
        </div>

        <div class="story">
            <div class="circle"><div>✨</div></div>
            Pedro
        </div>

        <div class="story">
            <div class="circle"><div>💜</div></div>
            Ana
        </div>

    </section>

    <section class="post">

        <div class="post-header">
            <span>julia.oficial</span>
            <span>•••</span>
        </div>

        <img class="photo"
        src="https://picsum.photos/id/1011/700/700">

        <div class="actions">
            <button onclick="like(this)">♡</button>
            <button onclick="openMessages()">♧</button>
            <button>➤</button>
            <button class="save">♧</button>
        </div>

        <div class="info">
            <strong>1.250 curtidas</strong>
            <p><strong>julia.oficial</strong> Vivendo momentos especiais! 💗</p>
            <p>Ver todos os comentários</p>
        </div>

    </section>

    <section class="post">

        <div class="post-header">
            <span>maria.silva</span>
            <span>•••</span>
        </div>

        <img class="photo"
        src="https://picsum.photos/id/1015/700/700">

        <div class="actions">
            <button onclick="like(this)">♡</button>
            <button onclick="openMessages()">♧</button>
            <button>➤</button>
            <button class="save">♧</button>
        </div>

        <div class="info">
            <strong>845 curtidas</strong>
            <p><strong>maria.silva</strong> Que lugar maravilhoso! ✨</p>
        </div>

    </section>

</div>

<!-- MENSAGENS -->

<section id="messages">

    <div class="message-list">
        <div class="message-title">Mensagens</div>

        <button class="contact active"
        onclick="selectContact('Julia', this)">
            🌸 Julia
        </button>

        <button class="contact"
        onclick="selectContact('Maria', this)">
            🦋 Maria
        </button>

        <button class="contact"
        onclick="selectContact('Pedro', this)">
            ✨ Pedro
        </button>

        <button class="contact"
        onclick="selectContact('Ana', this)">
            💜 Ana
        </button>
    </div>

    <div class="chat">

        <div class="chat-header" id="chatName">
            Julia
        </div>

        <div class="chat-body" id="chatBody">
            <div class="bubble">
                Oi! Tudo bem? 😊
            </div>
            <div class="bubble mine">
                Oii! Tudo sim! 💗
            </div>
        </div>

        <form class="chat-input" onsubmit="sendMessage(event)">
            <input id="messageInput"
            placeholder="Digite uma mensagem..."
            autocomplete="off">

            <button type="submit">Enviar</button>
        </form>

    </div>

</section>

<nav class="bottom-menu">

    <button onclick="showFeed()">⌂</button>
    <button onclick="showFeed()">⌕</button>
    <button onclick="showFeed()">＋</button>
    <button onclick="showFeed()">🎬</button>
    <button onclick="openMessages()">✉</button>

</nav>

<script>

// TEMA CLARO E ESCURO

function toggleTheme() {

    document.body.classList.toggle("dark");

    const dark = document.body.classList.contains("dark");

    document.getElementById("themeButton").innerHTML =
        dark ? "☀️" : "🌙";

    localStorage.setItem("theme", dark ? "dark" : "light");
}

if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
    document.getElementById("themeButton").innerHTML = "☀️";
}

// CURTIR PUBLICAÇÕES

function like(button) {
    button.innerHTML =
        button.innerHTML === "♡" ? "❤️" : "♡";
}

// ABRIR MENSAGENS

function openMessages() {
    document.getElementById("feed").style.display = "none";
    document.getElementById("messages").style.display = "flex";
}

// VOLTAR AO FEED

function showFeed() {
    document.getElementById("feed").style.display = "block";
    document.getElementById("messages").style.display = "none";
}

// CONVERSAS

let currentContact = "Julia";

let conversations = JSON.parse(
    localStorage.getItem("conversations") || "{}"
);

function selectContact(name, button) {

    currentContact = name;

    document.getElementById("chatName").innerText = name;

    document.querySelectorAll(".contact").forEach(item => {
        item.classList.remove("active");
    });

    button.classList.add("active");

    renderMessages();
}

function renderMessages() {

    const body = document.getElementById("chatBody");

    body.innerHTML = "";

    const messages = conversations[currentContact] || [];

    messages.forEach(message => {

        const bubble = document.createElement("div");

        bubble.className = message.mine
            ? "bubble mine"
            : "bubble";

        bubble.textContent = message.text;

        body.appendChild(bubble);

    });

    body.scrollTop = body.scrollHeight;
}

// ENVIAR MENSAGEM

function sendMessage(event) {

    event.preventDefault();

    const input = document.getElementById("messageInput");

    const text = input.value.trim();

    if (text === "") return;

    if (!conversations[currentContact]) {
        conversations[currentContact] = [];
    }

    conversations[currentContact].push({
        text: text,
        mine: true
    });

    localStorage.setItem(
        "conversations",
        JSON.stringify(conversations)
    );

    input.value = "";

    renderMessages();
}

</script>

</body>
</html>



  
  
</body>
</html>
