<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Minha Avaliação</title>
                <style>
                        body {
                                    font-family: Arial, sans-serif;
                                                text-align: center;
                                                            margin-top: 50px;
                                                                        background-color: #f4f4f9;
                                                                                }
                                                                                        button {
                                                                                                    padding: 10px 20px;
                                                                                                                font-size: 16px;
                                                                                                                            cursor: pointer;
                                                                                                                                        background-color: #007bff;
                                                                                                                                                    color: white;
                                                                                                                                                                border: none;
                                                                                                                                                                            border-radius: 5px;
                                                                                                                                                                                    }
                                                                                                                                                                                            button:hover {
                                                                                                                                                                                                        background-color: #0056b3;
                                                                                                                                                                                                                }
                                                                                                                                                                                                                        h1 {
                                                                                                                                                                                                                                    color: #333;
                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                <script src="https://cdn.tailwindcss.com"></script>
</head>
                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                    <h1>Interação com JavaScript</h1>
                                                                                                                                                                                                                                                        <p>Clique no botão abaixo para testar a função:</p>
                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                <!-- Botão que aciona a função JavaScript -->
                                                                                                                                                                                                                                                                    <button onclick="contarCliques()">Clique Aqui</button>
                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                            <p>Total de cliques: <span id="contador">0</span></p>

                                                                                                                                                                                                                                                                                <!-- Código JavaScript integrado -->
                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                            let Cliques = 0;

                                                                                                                                                                                                                                                                                                    function contarCliques() {
                                                                                                                                                                                                                                                                                                                Cliques++;
                                                                                                                                                                                                                                                                                                                            document.getElementById("contador").innerText = Cliques;
                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                        </html>
