<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ConectaTEC</title>

    <!-- Ligação com o CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="logo">
            ConectaTEC 💜
        </div>

        <nav>
            <a href="#">Início</a>
            <a href="#">Explorar</a>
            <a href="#">Perfil</a>
        </nav>
    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <!-- INTRODUÇÃO -->
        <section class="introducao">

            <h1>Bem-vindo ao ConectaTEC!</h1>

            <p>
                Um mini feed social para compartilhar ideias
                e conhecimentos sobre tecnologia.
            </p>

        </section>


        <!-- CRIAR PUBLICAÇÃO -->
        <section class="criar-post">

            <h2>Criar publicação</h2>

            <textarea id="texto"
                placeholder="No que você está pensando?"
                rows="4"></textarea>

            <button onclick="publicar()">
                Publicar
            </button>

        </section>


        <!-- FEED -->
        <section id="feed">

            <!-- POST 1 -->
            <article class="post">

                <div class="usuario">

                    <div class="foto">
                        T
                    </div>

                    <div>
                        <h3>Talline</h3>
                        <p>Agora mesmo</p>
                    </div>

                </div>


                <p class="conteudo-post">
                    Estou aprendendo a criar sites
                    utilizando HTML e CSS! 💻🚀
                </p>


                <button onclick="curtir(this)" class="curtir">
                    ❤️ Curtir
                </button>

                <button class="comentar">
                    💬 Comentar
                </button>

            </article>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer>

        <h3>ConectaTEC 💜</h3>

        <p>
            Projeto desenvolvido para a Mentoria TEC
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script>

        function publicar() {

            const texto = document.getElementById("texto");

            if (texto.value.trim() === "") {
                alert("Digite algo para publicar!");
                return;
            }

            const feed = document.getElementById("feed");

            const novoPost = document.createElement("article");

            novoPost.className = "post";

            novoPost.innerHTML = `

                <div class="usuario">

                    <div class="foto">
                        V
                    </div>

                    <div>

                        <h3>Você</h3>

                        <p>Agora mesmo</p>

                    </div>

                </div>


                <p class="conteudo-post">

                    ${texto.value}

                </p>


                <button onclick="curtir(this)" class="curtir">

                    ❤️ Curtir

                </button>


                <button class="comentar">

                    💬 Comentar

                </button>

            `;

            feed.prepend(novoPost);

            texto.value = "";

        }


        function curtir(botao) {

            if (botao.innerHTML === "❤️ Curtir") {

                botao.innerHTML = "💜 Curtido";

            } else {

                botao.innerHTML = "❤️ Curtir";

            }

        }

    </script>

</body>

</html>
