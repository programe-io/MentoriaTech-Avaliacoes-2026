<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mini Feed</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>Mini Feed 💗</h1>
                                    <p>Compartilhe seus melhores momentos!</p>
                                        </header>

                                            <main class="container">
                                                    <section class="nova-publicacao">
                                                                <h2>Nova publicação</h2>
                                                                            <input type="text" id="nome" placeholder="Seu nome">
                                                                                        <textarea id="mensagem" placeholder="O que você está pensando?"></textarea>
                                                                                                    <button onclick="publicar()">Publicar</button>
                                                                                                            </section>

                                                                                                                    <section>
                                                                                                                                <h2>Publicações</h2>
                                                                                                                                            <div id="feed">
                                                                                                                                                            <article class="post">
                                                                                                                                                                                <h3>Maria 💕</h3>
                                                                                                                                                                                                    <p>Bem-vindos ao meu Mini Feed!</p>
                                                                                                                                                                                                                        <button onclick="curtir(this)">♡ Curtir (0)</button>
                                                                                                                                                                                                                                        </article>
                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                            </section>
                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                    <footer>
                                                                                                                                                                                                                                                                            <p>Projeto Mini Feed - Mentoria Tech</p>
                                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                    </html>
