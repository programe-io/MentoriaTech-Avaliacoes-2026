<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineTasks - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="estilo.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>⛏ MINETASKS ⛏</h1>
        <p>Seu mundo. Suas missões. Suas conquistas!</p>
    </header>

    <main class="container">

        <section class="panel">
            <h2>🎒 INVENTÁRIO</h2>

            <div class="stats">
                <div class="stat">
                    <strong id="total">0</strong>
                    <span>Missões</span>
                </div>

                <div class="stat">
                    <strong id="completed">0</strong>
                    <span>Concluídas</span>
                </div>

                <div class="stat">
                    <strong id="xp">0</strong>
                    <span>XP</span>
                </div>
            </div>

            <p>Progresso das missões:</p>

            <div class="progress">
                <div class="progress-fill" id="progress"></div>
            </div>

            <small id="level">Nível 1 - Iniciante</small>
        </section>

        <section class="panel">
            <h2>📜 NOVA MISSÃO</h2>

            <input
                type="text"
                id="taskInput"
                placeholder="Ex: Construir minha casa..."
            >

            <select id="priority">
                <option value="Baixa">🟢 Prioridade baixa</option>
                <option value="Média">🟡 Prioridade média</option>
                <option value="Alta">🔴 Prioridade alta</option>
            </select>

            <button class="add-btn" id="addBtn">
                + ADICIONAR MISSÃO
            </button>
        </section>

        <section class="panel">
            <h2>🗺️ MINHAS MISSÕES</h2>

            <div class="filters">
                <button data-filter="Todas">Todas</button>
                <button data-filter="Pendentes">Pendentes</button>
                <button data-filter="Concluídas">Concluídas</button>
            </div>

            <div id="taskList"></div>
        </section>

    </main>

    <footer>
        MINETASKS © 2026
        <p>Continue minerando seus objetivos! 💎</p>
    </footer>

    <script src="config.js"></script>
<script src="script.js"></script></body>
</html>
