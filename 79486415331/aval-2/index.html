
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Social Feed</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    color: #333;
}

header {
    background: #1877f2;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: 25px auto;
    padding: 15px;
}

.create-post, .post {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px #0001;
}

textarea {
    width: 100%;
    height: 90px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    resize: none;
    margin-bottom: 10px;
}

button {
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    background: #1877f2;
    color: white;
}

button:hover {
    opacity: 0.85;
}

.post-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
}

.username {
    font-weight: bold;
    color: #1877f2;
}

.post-content {
    margin: 15px 0;
    line-height: 1.5;
}

.actions {
    display: flex;
    gap: 10px;
    border-top: 1px solid #eee;
    padding-top: 12px;
}

.actions button {
    background: #f0f2f5;
    color: #333;
}

.comment {
    margin-top: 12px;
    padding: 10px;
    background: #f5f5f5;
    border-radius: 8px;
}

</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <h1>🌐 Mini Social Feed</h1>
    <p>Compartilhe seus momentos!</p>
</header>

<div class="container">

    <div class="create-post">
        <h3>Criar publicação</h3>
        <br>
        <textarea id="postText"
        placeholder="O que você está pensando?"></textarea>

        <button onclick="createPost()">
            Publicar
        </button>
    </div>

    <div id="feed"></div>

</div>

<script>

function createPost() {
    const text = document.getElementById("postText");
    const content = text.value.trim();

    if (content === "") {
        alert("Escreva alguma coisa!");
        return;
    }

    const post = {
        user: "Usuário",
        content: content,
        likes: 0,
        date: new Date().toLocaleString("pt-BR")
    };

    renderPost(post);
    text.value = "";
}

function renderPost(post) {
    const feed = document.getElementById("feed");

    const card = document.createElement("div");
    card.className = "post";

    const header = document.createElement("div");
    header.className = "post-header";

    const username = document.createElement("span");
    username.className = "username";
    username.textContent = "👤 " + post.user;

    const date = document.createElement("small");
    date.textContent = post.date;

    header.append(username, date);

    const content = document.createElement("p");
    content.className = "post-content";
    content.textContent = post.content;

    const actions = document.createElement("div");
    actions.className = "actions";

    const likeButton = document.createElement("button");
    likeButton.textContent = "❤️ Curtir (0)";

    let likes = 0;

    likeButton.onclick = function() {
        likes++;
        likeButton.textContent = "❤️ Curtir (" + likes + ")";
    };

    const commentButton = document.createElement("button");
    commentButton.textContent = "💬 Comentar";

    const comments = document.createElement("div");

    commentButton.onclick = function() {
        const comment = prompt("Digite seu comentário:");

        if (comment && comment.trim()) {
            const item = document.createElement("div");
            item.className = "comment";
            item.textContent = "💬 " + comment.trim();
            comments.appendChild(item);
        }
    };

    actions.append(likeButton, commentButton);

    card.append(header, content, actions, comments);
    feed.prepend(card);
}

</script>

<script src="script.js"></script></body>
</html>
