
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <header class="header">
            <div>
                <h1>Minhas Tarefas</h1>
                <p>Organize seu dia e aumente sua produtividade.</p>
            </div>
            <span class="header-icon">✓</span>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span>Total</span>
                <strong id="totalTasks">0</strong>
            </div>
            <div class="stat-card">
                <span>Pendentes</span>
                <strong id="pendingTasks">0</strong>
            </div>
            <div class="stat-card">
                <span>Concluídas</span>
                <strong id="completedTasks">0</strong>
            </div>
        </section>

        <section class="task-form">
            <h2 id="formTitle">Adicionar tarefa</h2>

            <form id="taskForm">
                <input type="hidden" id="taskId">

                <div class="form-group">
                    <label for="taskTitle">Título</label>
                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Digite o nome da tarefa..."
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="taskDescription">Descrição</label>
                    <textarea
                        id="taskDescription"
                        placeholder="Descreva sua tarefa..."
                        rows="3"
                    ></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">Prioridade</label>
                        <select id="taskPriority">
                            <option value="baixa">Baixa</option>
                            <option value="media" selected>Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskDate">Vencimento</label>
                        <input type="date" id="taskDate">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitButton" class="btn-primary">
                        Adicionar tarefa
                    </button>
                    <button type="button" id="cancelEdit" class="btn-secondary hidden">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <section class="task-section">
            <div class="task-toolbar">
                <h2>Lista de tarefas</h2>

                <input
                    type="search"
                    id="searchTask"
                    placeholder="Pesquisar tarefa..."
                >
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="todas">
                    Todas
                </button>
                <button class="filter-btn" data-filter="pendentes">
                    Pendentes
                </button>
                <button class="filter-btn" data-filter="concluidas">
                    Concluídas
                </button>
            </div>

            <div class="sort-container">
                <label for="sortTasks">Ordenar:</label>
                <select id="sortTasks">
                    <option value="recentes">Mais recentes</option>
                    <option value="antigas">Mais antigas</option>
                    <option value="prioridade">Maior prioridade</option>
                    <option value="vencimento">Data de vencimento</option>
                </select>
            </div>

            <div id="taskList" class="task-list"></div>

            <div id="emptyMessage" class="empty-message">
                <span>📋</span>
                <p>Nenhuma tarefa encontrada.</p>
            </div>

            <button id="deleteCompleted" class="btn-danger">
                Excluir tarefas concluídas
            </button>
        </section>

        <footer>
            <p>Gerenciador de Tarefas · Seus dados ficam salvos neste navegador.</p>
        </footer>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
