
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Instagram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <aside class="sidebar">
        <h1 class="logo">Instagram</h1>

        <nav>
            <a href="#">🏠 Início</a>
            <a href="#">🔍 Pesquisa</a>
            <a href="#">🧭 Explorar</a>
            <a href="#">🎬 Reels</a>
            <a href="#">💬 Mensagens</a>
            <a href="#">❤️ Notificações</a>
            <a href="#" id="newPost">➕ Criar publicação</a>
            <a href="#">👤 Perfil</a>
        </nav>
    </aside>

    <main class="container">

        <section class="stories">
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=12">
                <span>Seu story</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=5">
                <span>mariana</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=8">
                <span>pedro</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=9">
                <span>julia</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=15">
                <span>lucas</span>
            </div>
        </section>

        <section class="feed" id="feed">

            <article class="post">
                <div class="post-header">
                    <img src="https://i.pravatar.cc/100?img=5">
                    <strong>mariana.silva</strong>
                    <span>•••</span>
                </div>

                <img class="post-image"
                src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800">

                <div class="post-actions">
                    <button class="like">♡</button>
                    <button class="comment-btn">💬</button>
                    <button>➤</button>
                    <button class="save">♧</button>
                </div>

                <div class="post-info">
                    <strong class="likes">120 curtidas</strong>
                    <p><strong>mariana.silva</strong> Aproveitando a natureza! 🌿</p>
                    <div class="comments"></div>
                    <small>HÁ 2 HORAS</small>
                </div>

                <div class="comment-box">
                    <input type="text" placeholder="Adicione um comentário...">
                    <button class="send-comment">Publicar</button>
                </div>
            </article>

            <article class="post">
                <div class="post-header">
                    <img src="https://i.pravatar.cc/100?img=8">
                    <strong>pedro.dev</strong>
                    <span>•••</span>
                </div>

                <img class="post-image"
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800">

                <div class="post-actions">
                    <button class="like">♡</button>
                    <button class="comment-btn">💬</button>
                    <button>➤</button>
                    <button class="save">♧</button>
                </div>

                <div class="post-info">
                    <strong class="likes">85 curtidas</strong>
                    <p><strong>pedro.dev</strong> Que lugar incrível! 📸</p>
                    <div class="comments"></div>
                    <small>HÁ 5 HORAS</small>
                </div>

                <div class="comment-box">
                    <input type="text" placeholder="Adicione um comentário...">
                    <button class="send-comment">Publicar</button>
                </div>
            </article>

        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
