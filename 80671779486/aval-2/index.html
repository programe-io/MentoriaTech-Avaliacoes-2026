<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Feed Clone</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <!-- Cabeçalho superior -->
  <header class="navbar">
    <div class="nav-conteudo">
      <h1 class="logo">Instagram</h1>
      <button id="btnAbrirModal" class="btn-novo-post">+ Criar</button>
    </div>
  </header>

  <main class="container">
    <!-- Barra de Stories -->
    <section class="stories-container" id="listaStories"></section>

    <!-- Feed de Publicações -->
    <section class="feed" id="listaFeed"></section>
  </main>

  <!-- Modal para nova publicação -->
  <div id="modalPost" class="modal oculto">
    <div class="modal-conteudo">
      <div class="modal-topo">
        <h3>Criar nova publicação</h3>
        <button id="btnFecharModal" class="btn-fechar">&times;</button>
      </div>
      <div class="modal-corpo">
        <label class="upload-label">
          Escolher foto do computador
          <input type="file" id="inputArquivo" accept="image/*" hidden>
        </label>
        <input type="url" id="inputUrl" placeholder="Ou cole a URL da imagem aqui...">
        <textarea id="inputLegenda" rows="3" placeholder="Escreva uma legenda..."></textarea>
        <button id="btnPublicar" class="btn-publicar">Compartilhar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
