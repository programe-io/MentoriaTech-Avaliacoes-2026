<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Completo</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <!-- Barra Superior -->
  <header class="navbar">
    <div class="nav-conteudo">
      <h1 class="logo" onclick="mudarAba('feed')">Instagram</h1>
      <div class="nav-acoes">
        <button id="btnTema" class="btn-icone" title="Alternar Tema">🌓</button>
        <button id="btnAbrirModal" class="btn-icone" title="Criar Publicação">➕</button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container">
    <!-- ABA 1: FEED PRINCIPAL -->
    <section id="aba-feed" class="aba ativa">
      <div class="stories-container" id="listaStories"></div>
      <div class="feed" id="listaFeed"></div>
    </section>

    <!-- ABA 2: EXPLORAR / BUSCA -->
    <section id="aba-explorar" class="aba">
      <div class="barra-busca">
        <input type="text" id="inputBusca" placeholder="Pesquisar usuários ou legendas...">
      </div>
      <div class="grade-fotos" id="gradeExplorar"></div>
    </section>

    <!-- ABA 3: PERFIL -->
    <section id="aba-perfil" class="aba">
      <div class="perfil-cabecalho">
        <img src="https://unsplash.com" alt="Avatar" class="perfil-avatar">
        <div class="perfil-dados">
          <div class="perfil-linha-topo">
            <h2>voce.oficial</h2>
            <button class="btn-editar-perfil" onclick="editarBio()">Editar bio</button>
          </div>
          <div class="perfil-estatisticas">
            <span><strong id="contadorPosts">0</strong> publicações</span>
            <span><strong>1.240</strong> seguidores</span>
            <span><strong id="contadorSeguindo">315</strong> seguindo</span>
          </div>
          <p class="perfil-bio" id="textoBio">Desenvolvedor(a) Web 🚀 | Criando projetos em HTML, CSS & JS</p>
        </div>
      </div>

      <div class="perfil-subabas">
        <button class="subaba-btn ativa" id="btnSubPosts" onclick="alternarSubabaPerfil('posts')">▦ PUBLICAÇÕES</button>
        <button class="subaba-btn" id="btnSubSalvos" onclick="alternarSubabaPerfil('salvos')">🔖 SALVOS</button>
      </div>

      <div class="grade-fotos" id="gradePerfil"></div>
    </section>
  </main>

  <!-- Barra de Navegação Inferior (Estilo Mobile/App) -->
  <nav class="bottom-nav">
    <button class="nav-btn ativa" data-aba="feed" onclick="mudarAba('feed')">🏠</button>
    <button class="nav-btn" data-aba="explorar" onclick="mudarAba('explorar')">🔍</button>
    <button class="nav-btn" onclick="abrirModalCriar()">➕</button>
    <button class="nav-btn" data-aba="perfil" onclick="mudarAba('perfil')">👤</button>
  </nav>

  <!-- Modal: Criar Publicação -->
  <div id="modalPost" class="modal oculto">
    <div class="modal-conteudo">
      <div class="modal-topo">
        <h3>Criar nova publicação</h3>
        <button id="btnFecharModal" class="btn-fechar">&times;</button>
      </div>
      <div class="modal-corpo">
        <img id="previewImagem" class="preview-img oculto" alt="Prévia">
        <label class="upload-label">
          📁 Escolher foto do computador
          <input type="file" id="inputArquivo" accept="image/*" hidden>
        </label>
        <input type="url" id="inputUrl" placeholder="Ou cole a URL da imagem...">
        <textarea id="inputLegenda" rows="3" placeholder="Escreva uma legenda..."></textarea>
        <button id="btnPublicar" class="btn-publicar">Compartilhar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Visualizador de Stories -->
  <div id="modalStory" class="story-viewer oculto">
    <div class="story-card">
      <div class="story-progresso-barra">
        <div id="storyProgresso" class="story-progresso-preenchimento"></div>
      </div>
      <div class="story-viewer-topo">
        <div class="story-viewer-usuario">
          <img id="storyViewerAvatar" src="" alt="">
          <span id="storyViewerNome"></span>
        </div>
        <button onclick="fecharStory()" class="btn-fechar-story">&times;</button>
      </div>
      <img id="storyViewerImagem" src="" alt="Story" class="story-viewer-midia" onclick="proximoStory()">
      <div id="storyViewerTexto" class="story-viewer-legenda"></div>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
