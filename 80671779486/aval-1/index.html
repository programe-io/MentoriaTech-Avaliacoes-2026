<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Feed Pessoal</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <h1>Meu Feed Pessoal</h1>
  </header>

  <main class="container">
    <!-- Caixa para criar nova publicação -->
    <section class="criar-post">
      <textarea id="textoPost" placeholder="O que você está pensando hoje?" rows="3"></textarea>
      <input type="url" id="imagemPost" placeholder="Cole a URL de uma imagem (opcional)">
      <div class="acoes-form">
        <button id="btnPublicar">Publicar</button>
      </div>
    </section>

    <!-- Lista onde os posts aparecem -->
    <section id="listaFeed" class="feed"></section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
