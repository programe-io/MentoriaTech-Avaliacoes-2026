<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese - Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Ficha de Anamnese</h1>
        <p>Sistema de Cadastro e Calculadora de IMC</p>
    </header>

    <main class="container">

        <section class="formulario">
            <h2>Cadastro de Pacientes</h2>

            <form id="formPaciente">

                <div class="campo">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome"
                        placeholder="Digite o nome do paciente"
                        required>
                </div>

                <div class="campo">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade"
                        placeholder="Digite a idade"
                        min="1" required>
                </div>

                <div class="campo">
                    <label for="altura">Altura (metros):</label>
                    <input type="number" id="altura"
                        placeholder="Ex: 1.75"
                        min="0.01" step="0.01" required>
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso"
                        placeholder="Ex: 70.5"
                        min="0.01" step="0.1" required>
                </div>

                <div class="botoes">
                    <button type="submit" class="salvar">
                        Salvar Paciente
                    </button>

                    <button type="reset" class="cancelar">
                        Cancelar
                    </button>
                </div>

            </form>
        </section>

        <section class="resultado">
            <h2>Pacientes Cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                        </tr>
                    </thead>

                    <tbody id="listaPacientes">
                    </tbody>
                </table>
            </div>

            <p id="mensagemVazia">
                Nenhum paciente cadastrado.
            </p>
        </section>

    </main>

    <footer>
        <p>Projeto acadêmico - Ficha de Anamnese e IMC</p>
    </footer>

    <script src="app.js"></script>

<script src="script.js"></script></body>
</html>$0
