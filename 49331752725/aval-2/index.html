<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>MeuFeed</h1>
        <span>🏠 Início</span>
    </header>

    <main>
        <section class="criar-post">
            <h2>Criar publicação</h2>

            <textarea id="textoPost"
                placeholder="O que você está pensando?"></textarea>

            <input type="url" id="imagemPost"
                placeholder="URL da imagem (opcional)">

            <button onclick="publicar()">Publicar</button>
        </section>

        <section id="feed">

            <article class="post">
                <h3>Maria Silva</h3>
                <p>Olá, pessoal! Bem-vindos ao meu feed! 😊</p>
                <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
            </article>

            <article class="post">
                <h3>João Santos</h3>
                <p>Hoje é um ótimo dia para aprender algo novo! 🚀</p>
                <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
            </article>

        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
