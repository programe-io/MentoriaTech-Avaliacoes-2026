<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topo">
        <h1>Instagram</h1>
        <input type="text" placeholder="Pesquisar">
        <div class="perfil-topo">👤</div>
    </header>

    <main class="container">

        <aside class="menu">
            <h2>Instagram</h2>
            <a href="#">🏠 Início</a>
            <a href="#">🔍 Pesquisa</a>
            <a href="#">🧭 Explorar</a>
            <a href="#">🎬 Reels</a>
            <a href="#">✉️ Mensagens</a>
            <a href="#">❤️ Notificações</a>
            <a href="#">➕ Criar publicação</a>
            <a href="#">👤 Perfil</a>
        </aside>

        <section class="conteudo">

            <div class="stories">
                <div class="story">
                    <img src="https://i.pravatar.cc/100?img=1">
                    <span>Seu story</span>
                </div>
                <div class="story">
                    <img src="https://i.pravatar.cc/100?img=2">
                    <span>mariana</span>
                </div>
                <div class="story">
                    <img src="https://i.pravatar.cc/100?img=3">
                    <span>pedro</span>
                </div>
                <div class="story">
                    <img src="https://i.pravatar.cc/100?img=4">
                    <span>julia</span>
                </div>
            </div>

            <div class="criar">
                <input type="text" id="novaLegenda"
                    placeholder="O que você está pensando?">
                <button onclick="publicar()">Publicar</button>
            </div>

            <div id="feed">

                <article class="post">
                    <div class="post-header">
                        <img src="https://i.pravatar.cc/100?img=2">
                        <strong>mariana</strong>
                    </div>

                    <img class="foto-post"
                        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800">

                    <div class="acoes">
                        <button onclick="curtir(this)">♡</button>
                        <button onclick="comentar(this)">💬</button>
                        <button>➤</button>
                    </div>

                    <p class="likes">❤️ <span>120</span> curtidas</p>
                    <p><strong>mariana</strong> Aproveitando o dia! ☀️</p>

                    <div class="comentarios"></div>
                </article>

                <article class="post">
                    <div class="post-header">
                        <img src="https://i.pravatar.cc/100?img=3">
                        <strong>pedro</strong>
                    </div>

                    <img class="foto-post"
                        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800">

                    <div class="acoes">
                        <button onclick="curtir(this)">♡</button>
                        <button onclick="comentar(this)">💬</button>
                        <button>➤</button>
                    </div>

                    <p class="likes">❤️ <span>85</span> curtidas</p>
                    <p><strong>pedro</strong> Que lugar incrível! 🌎</p>

                    <div class="comentarios"></div>
                </article>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>$0
