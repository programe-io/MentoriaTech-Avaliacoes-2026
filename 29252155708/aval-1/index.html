<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Magic Shop Library</title>

    <link rel="stylesheet" href="Geração de estoque.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1> Magic Shop Library</h1>
        <h3>Experiências em diversas Realidades</h3>

        <h2>Cadastro de Produto</h2>

        <div id="mensagem"></div>

        <div class="formulario">

            <label>
                Código:
                <input type="text" id="codigo" placeholder="Código do produto">
            </label>

            <label>
                Descrição:
                <input type="text" id="descricao" placeholder="Nome do produto">
            </label>

            <label>
                Quantidade:
                <input type="number" id="quantidade" min="0" placeholder="Quantidade">
            </label>

            <label>
                Valor:
                <input type="number" id="valor" min="0" step="0.01" placeholder="Valor">
            </label>

        </div>

        <button onclick="cadastrarProduto()" class="btn-cadastrar">
            Cadastrar Produto
        </button>


        <h2>Alterar Produto</h2>

        <div class="acoes">

            <button onclick="alterarValor()" class="btn-valor">
                Alterar Valor
            </button>

            <button onclick="alterarQuantidade()" class="btn-quantidade">
                Alterar Quantidade
            </button>

        </div>


        <h2>Produtos Cadastrados</h2>

        <table>

            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                    <th>Total</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody id="listaProdutos">
            </tbody>

        </table>


        <div class="total">
            Valor total do estoque:
            <span id="valorTotal">R$ 0,00</span>
        </div>

    </div>

    <script src="Geração de estoque.js"></script>

<script src="script.js"></script></body>

</html>
