<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>

    <!-- Ligação com o arquivo CSS -->
    <link rel="stylesheet" href="Gerenciamento de lista.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <h1>Gerenciador de Tarefas</h1>
    <main class="app">
        <header class="cabecalho">
            <div>
                <span class="etiqueta">ORGANIZAÇÃO PESSOAL</span>
                <h1>Gerenciador de Tarefas</h1>
                <p>Planeje o dia com leveza e acompanhe cada conquista.</p>
            </div>
            <div class="marca" aria-hidden="true">✓</div>
        </header>

        <div class="conteudo">
            <section class="painel cadastro" aria-labelledby="titulo-cadastro">
                <div class="titulo-secao">
                    <span class="numero">01</span>
                    <div>
                        <h2 id="titulo-cadastro">Nova tarefa</h2>
                        <p>O que precisa entrar na sua lista?</p>
                    </div>
                </div>

                <label for="titulo">Título</label>
                <input type="text" id="titulo" placeholder="Ex.: Preparar apresentação">

                <label for="prioridade">Prioridade</label>
                <select id="prioridade">
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button class="botao-principal" onclick="cadastrarTarefa()">
                    <span aria-hidden="true">+</span> Adicionar tarefa
                </button>
            </section>

            <section class="painel tarefas" aria-labelledby="titulo-lista">
                <div class="titulo-secao">
                    <span class="numero numero-menta">02</span>
                    <div>
                        <h2 id="titulo-lista">Sua lista</h2>
                        <p>Itens cadastrados aparecem aqui.</p>
                    </div>
                </div>

                <ul id="listaTarefas"></ul>
            </section>
        </div>
    </main>
    <!-- Ligação com o arquivo JavaScript -->
    <script src="Gerenciamento de lista.js"></script>

<script src="script.js"></script></body>
</html>
