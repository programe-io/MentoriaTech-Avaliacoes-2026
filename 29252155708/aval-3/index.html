<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prática: Simulação de Tabela IMC</title>
  <link rel="stylesheet" href="Mentoria.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h1>Tabela para definição do IMC</h1>
    <p class="desc">
      Simulando uma tabela com dados sobre pessoas (nome, peso e altura), 
      calculando o IMC e a Situação com destaque visual para diferentes resultados.
    </p>

    <!-- Formulário para adicionar novos dados -->
    <form id="imcForm" class="form-container">
      <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Seu nome..." required>
      </div>

      <div class="form-group">
        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" step="0.1" min="1" placeholder="Seu peso..." required>
      </div>

      <div class="form-group">
        <label for="altura">Altura (m):</label>
        <input type="number" id="altura" step="0.01" min="0.5" placeholder="Sua altura..." required>
      </div>

      <button type="submit" class="btn-add">Adicionar Pessoa</button>
    </form>

    <!-- Tabela de exibição de dados -->
    <div class="table-responsive">
      <table id="tabelaIMC">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Peso</th>
            <th>Altura</th>
            <th>IMC</th>
            <th>Situação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo">
          <!-- Os dados serão inseridos dinamicamente aqui -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="Mentoria.js"></script>
<script src="script.js"></script></body>
</html>>
