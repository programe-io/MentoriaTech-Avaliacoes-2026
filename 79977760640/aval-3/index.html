<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 font-sans text-gray-900">
    <header class="sticky top-0 z-10 border-b border-gray-200 bg-white">
        <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4 sm:px-6">
            <p class="font-serif text-2xl font-semibold tracking-tight text-gray-900">Instagram</p>
            <button class="rounded-full p-2 text-2xl leading-none hover:bg-gray-100">🔍</button>
        </div>
    </header>

    <main class="mx-auto max-w-5xl px-0 py-6 sm:px-6">
        <article class="mx-auto max-w-lg overflow-hidden border-y border-gray-200 bg-white sm:rounded-lg sm:border">
            <div class="flex items-center justify-between px-4 py-3">
                <div class="flex items-center gap-3">
                    <div class="flex h-9 w-9 items-center justify-center rounded-full bg-gray-900 text-sm font-semibold text-white">F</div>
                    <div>
                        <p class="text-sm font-semibold">FLAMEGO</p>
                        <p class="text-xs text-gray-500">Castelo do Piauí/PI, Brasil</p>
                    </div>
                </div>
                <button class="px-2 text-xl font-bold leading-none">···</button>
            </div>

            <img
                src="https://scontent.fthe9-1.fna.fbcdn.net/v/t1.6435-9/37997851_10159794018703504_187260556925730816_n.jpg?stp=dst-jpg_tt6&cstp=mx960x960&ctp=s960x960&_nc_cat=108&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=127cfc&_nc_ohc=_xmgqqnEnkQQ7kNvwGDU59Q&_nc_oc=Adob9s1TerOsInEa83YP7Ob7g7-cTO1JqPuRpTeIotGaHb-XGasqqfRVAjht5EvWizk&_nc_zt=23&_nc_ht=scontent.fthe9-1.fna&_nc_gid=VSqdnx9_J01ayux05QS4Vw&_nc_ss=7d289&oh=00_AQQTeLXuPy8gmg2BLBg5WD3Dxui1ARJhR5pny93cua0PEA&oe=6B115C8B"
                alt="Partida entre Corinthians e São Paulo"
                class="block aspect-[4/5] w-full bg-gray-100 object-cover"
            >

            <div class="px-4 pb-4 pt-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <button type="button"  class="text-2xl leading-none hover:text-gray-500">♡</button>
                        <button type="button"  class="text-2xl leading-none hover:text-gray-500">○</button>
                        <button type="button"  class="text-2xl leading-none hover:text-gray-500">➤</button>
                    </div>
                </div>
                <p class="mt-3 text-sm font-semibold">Curtido por <span class="font-bold">neymar</span> e outras pessoas</p>
                <p class="mt-2 text-sm"><span class="font-semibold">FLAMENGO</span> SEGUE O LIDER  </p>
                <p class="mt-2 text-xs uppercase tracking-wide text-gray-400">HÁ 2 DIAS</p>
            </div>
        </article>
    </main>
</body>
