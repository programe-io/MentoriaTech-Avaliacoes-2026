<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação de CSS com JavaScript</title>
    <style>
        /* Estilos gerais do arquivo CSS externo/interno */
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }
        h2 {
            color: #333;
        }
        button {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        /* Tabela de Situações (Item 9) */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: #fff;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #e2e2e2;
        }

        /* Classes CSS para serem manipuladas via classList (Itens 6, 7 e 8) */
        .situacao-aprovado {
            background-color: #d4edda;
            color: #155724;
            font-weight: bold;
        }
        .situacao-pendente {
            background-color: #fff3cd;
            color: #856404;
        }
        .situacao-recusado {
            background-color: #f8d7da;
            color: #721c24;
            font-weight: bold;
        }
        
        /* Classe para o modo escuro */
        .modo-escuro {
            background-color: #222;
            color: #fff;
        }
        .modo-escuro h2, .modo-escuro th {
            color: #222;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <h2>Exemplo Prático: Tabela de Situações</h2>
    
    <!-- Botão para demonstrar o método toggle (Item 7) -->
    <button id="btnAlternarModo">Alternar Modo Escuro</button>

    <!-- Caixa de texto para demonstrar estilização direta com .style (Item 2) -->
    <div id="caixaDestaque" style="padding: 15px; margin-bottom: 20px; border: 1px solid #333;">
        Este bloco será estilizado diretamente via propriedade <strong>style</strong> do JavaScript.
    </div>
    <button id="btnEstiloDireto">Aplicar Estilização Direta</button>

    <!-- Tabela de Situações com getElementsByClassName (Item 10 e 11) -->
    <table>
        <thead>
            <tr>
                <th>Aluno</th>
                <th>Nota</th>
                <th>Situação</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana Silva</td>
                <td>8.5</td>
                <td class="coluna-situacao">Aprovado</td>
            </tr>
            <tr>
                <td>Carlos Souza</td>
                <td>5.0</td>
                <td class="coluna-situacao">Pendente</td>
            </tr>
            <tr>
                <td>Mariana Costa</td>
                <td>3.0</td>
                <td class="coluna-situacao">Recusado</td>
            </tr>
            <tr>
                <td>João Pedro</td>
                <td>9.0</td>
                <td class="coluna-situacao">Aprovado</td>
            </tr>
        </tbody>
    </table>

    <script>
        // --- 1. Estilização direta com a propriedade .style (Itens 2, 4 e 5) ---
        const btnEstiloDireto = document.getElementById('btnEstiloDireto');
        const caixaDestaque = document.getElementById('caixaDestaque');

        btnEstiloDireto.addEventListener('click', () => {
            // Aplicando propriedades CSS diretamente (Atua como CSS Inline)
            caixaDestaque.style.backgroundColor = '#007bff';
            caixaDestaque.style.color = '#ffffff';
            caixaDestaque.style.borderRadius = '8px';
        });

        // --- 2. Alternando classes com classList e toggle (Item 6 e 7) ---
        const btnAlternarModo = document.getElementById('btnAlternarModo');
        
        btnAlternarModo.addEventListener('click', () => {
            // O método toggle adiciona a classe se ela não existir, ou remove se já existir
            document.body.classList.toggle('modo-escuro');
        });

        // --- 3. Selecionando vários elementos e aplicando estilos condicionais (Item 10 e 11) ---
        // Seleciona todos os elementos que possuem a classe 'coluna-situacao'
        const celulasSituacao = document.getElementsByClassName('coluna-situacao');

        // Percorrendo a lista de elementos (HTMLCollection convertido em Array para usar forEach)
        Array.from(celulasSituacao).forEach(celula => {
            const texto = celula.textContent.trim().toLowerCase();

            // Aplica classes específicas de forma condicional usando classList.add (Item 7 e 8)
            if (texto === 'aprovado') {
                celula.classList.add('situacao-aprovado');
            } else if (texto === 'pendente') {
                celula.classList.add('situacao-pendente');
            } else if (texto === 'recusado') {
                celula.classList.add('situacao-recusado');
            }
        });
    </script>
<script src="script.js"></script></body>
</html>
