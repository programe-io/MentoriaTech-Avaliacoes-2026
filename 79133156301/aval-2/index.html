<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineFeed</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>
  <header>
    <div class="header-content">
      <h1>MineFeed</h1>
      <nav>
        <a href="#">Início</a>
        <a href="#">Perfil</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="new-post">
      <div class="user">
        <div class="avatar">M</div>
        <div>
          <strong>Maysa</strong>
          <span>O que você está pensando?</span>
          <button>Publicar</button>
        </div>
      </div>
    </section>

    <article class="post">
      <div class="post-header">
        <div class="avatar">J</div>
        <div>
          <strong>Jayza</strong>
          <span>Há 10 minutos</span>
        </div>
      </div>

      <div class="post-text">
        Hoje eu comprei o jogo Resident Evil 4, estou muito feliz!!
      </div>

      <img src="https://gmedia.playstation.com/is/image/SIEPDC/RE4-remake-hero-desktop-02-en-09nov22?$1200px$"
        alt="Resident Evil 4">

      <div class="post-actions">
        <button>Curtir</button>
        <button>Comentar</button>
      </div>
    </article>
  </main>

  <footer>
    <p>MineFeed - Todos os direitos reservados - 2026</p>
  </footer>
</body>

</html>
