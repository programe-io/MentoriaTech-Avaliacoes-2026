<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Relatório de Acompanhamento da Mentoria TEC</title>

                <style>
                        body {
                                    font-family: Verdana, sans-serif;
                                                background-color: #eef2f5;
                                                            margin: 20px;
                                                                    }

                                                                            .container {
                                                                                        max-width: 850px;
                                                                                                    margin: auto;
                                                                                                                background: #ffffff;
                                                                                                                            padding: 30px;
                                                                                                                                        border-radius: 12px;
                                                                                                                                                    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
                                                                                                                                                            }

                                                                                                                                                                    h1 {
                                                                                                                                                                                text-align: center;
                                                                                                                                                                                            color: #0b5d3b;
                                                                                                                                                                                                        margin-bottom: 5px;
                                                                                                                                                                                                                }

                                                                                                                                                                                                                        h3 {
                                                                                                                                                                                                                                    text-align: center;
                                                                                                                                                                                                                                                color: #555;
                                                                                                                                                                                                                                                            margin-bottom: 25px;
                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                            label {
                                                                                                                                                                                                                                                                                        display: block;
                                                                                                                                                                                                                                                                                                    margin-top: 15px;
                                                                                                                                                                                                                                                                                                                font-weight: 600;
                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                input,
                                                                                                                                                                                                                                                                                                                                        textarea {
                                                                                                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                                                                                                                padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                            margin-top: 6px;
                                                                                                                                                                                                                                                                                                                                                                                        border: 1px solid #cfcfcf;
                                                                                                                                                                                                                                                                                                                                                                                                    border-radius: 6px;
                                                                                                                                                                                                                                                                                                                                                                                                                box-sizing: border-box;
                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                textarea {
                                                                                                                                                                                                                                                                                                                                                                                                                                            resize: vertical;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                            button {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-top: 25px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    padding: 12px 24px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                background-color: #0b5d3b;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border-radius: 6px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-size: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            button:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        background-color: #08472d;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h1>Relatório de Acompanhamento da Mentoria TEC</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h3>Turma do 2º Ano – Desenvolvimento de Sistemas</h3>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <form action="#" method="post">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Responsável pela Mentoria:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" name="responsavel" required>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Unidade Escolar:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" name="escola" required>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Cidade:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" name="cidade" required>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Descreva as ações realizadas durante o período:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <textarea name="acoes" rows="5"></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Impactos e avanços observados:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <textarea name="impactos" rows="5"></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Desafios enfrentados durante a execução:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <textarea name="desafios" rows="5"></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Sugestões e observações adicionais:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <textarea name="observacoes" rows="5"></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="submit">Registrar Relatório</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
