<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow & Soul | Blog de Maquiagem</title>
    <style>
        /* Paleta de Cores (Tons de Pele, Rosas e Nudes) */
        :root {
            --nude-dark: #2c1a17;
            --rose-gold: #b3847a;
            --blush-pink: #f2ccc3;
            --soft-cream: #fbf7f4;
            --pure-white: #ffffff;
            --text-color: #4a3b32;
        }

        /* Configurações Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        }

        body {
            background-color: var(--soft-cream);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Cabeçalho */
        header {
            background-color: var(--pure-white);
            text-align: center;
            padding: 3rem 1rem;
            border-bottom: 1px solid var(--blush-pink);
        }

        header h1 {
            font-size: 3rem;
            color: var(--nude-dark);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
        }

        header p {
            font-family: sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--rose-gold);
            margin-top: 0.5rem;
        }

        /* Menu de Navegação */
        nav {
            background-color: var(--pure-white);
            display: flex;
            justify-content: center;
            padding: 1rem;
            border-bottom: 1px solid #ebe5e2;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            font-family: sans-serif;
            color: var(--text-color);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 600;
  
  
</body>
</html>
