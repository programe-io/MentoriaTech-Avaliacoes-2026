<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clone Instagram</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <h1 class="logo">Instagram</h1>
      <input type="text" placeholder="Pesquisar" class="search-bar">
    </div>
  </header>

  <main class="feed-container">
    <!-- Stories (Visual) -->
    <section class="stories">
      <div class="story"><div class="avatar"></div><span>Seu story</span></div>
      <div class="story"><div class="avatar"></div><span>fulano</span></div>
      <div class="story"><div class="avatar"></div><span>ciclano</span></div>
      <div class="story"><div class="avatar"></div><span>react_dev</span></div>
    </section>

    <!-- Post 1 -->
    <article class="post">
      <div class="post-header">
        <div class="avatar small"></div>
        <span class="username">carros raros</span>
      </div>
      <div class="post-image">
        <img src="https://www.embracon.com.br/_next/image?url=https%3A%2F%2Fembra-assets.nyc3.digitaloceanspaces.com%2Fpublic%2Fcarros%2Fcarros-de-luxo-vendidos-no-brasil.png&w=3840&q=75" alt="Post">
      </div>
      <div class="post-actions">
        <button class="like-btn" onclick="toggleLike(this)">❤️</button>
        <span>Curtir</span>
      </div>
      <div class="post-footer">
        <p><strong>carros</strong> Olha esse carro 🚀</p>
      </div>
    </article>

    <!-- Post 2 -->
    <article class="post">
      <div class="post-header">
        <div class="avatar small"></div>
        <span class="username">motos raras</span>
      </div>
      <div class="post-image">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTw31jYEIlqb_Ac3CgVyda0YsTL_gg8S0dSB0hxwsq9rQ&s=10" alt="Post">
      </div>
      <div class="post-actions">
        <button class="like-btn" onclick="toggleLike(this)">❤️</button>
        <span>Curtir</span>
      </div>
      <div class="post-footer">
        <p><strong>motos</strong> que moto!</p>
      </div>
    </article>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
