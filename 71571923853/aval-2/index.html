<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Gerenciador de Tarefas</h1>

    <h3>Cadastrar tarefa</h3>

    <input type="number" id="codigo" placeholder="Código">
    <input type="text" id="titulo" placeholder="Título da tarefa">

    <select id="prioridade">
        <option value="1">Alta</option>
        <option value="2">Média</option>
        <option value="3">Baixa</option>
    </select>

    <button onclick="cadastrar()">Cadastrar</button>

    <h3>Minhas tarefas</h3>

    <button onclick="listar()">Listar tarefas</button>

    <div id="lista"></div>

    <h3>Alterar tarefa</h3>

    <input type="number" id="codigoAlterar" placeholder="Código da tarefa">

    <button onclick="concluir()">Marcar como concluída</button>
    <button onclick="alterarPrioridade()">Alterar prioridade</button>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
