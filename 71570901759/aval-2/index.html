
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Gerenciador de Tarefas</h1>

    <h2>Cadastrar Tarefa</h2>

    <input type="number" id="codigo" placeholder="Código">
    <input type="text" id="titulo" placeholder="Título">

    <select id="prioridade">
        <option value="">Selecione a prioridade</option>
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="cadastrar()">Cadastrar</button>

    <h2>Alterar Tarefa</h2>

    <input type="number" id="codigoAlterar" placeholder="Código da tarefa">

    <button onclick="concluir()">Marcar como concluída</button>

    <select id="novaPrioridade">
        <option value="">Nova prioridade</option>
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="alterarPrioridade()">Alterar Prioridade</button>

    <h2>Tarefas Cadastradas</h2>

    <button onclick="listar()">Listar Tarefas</button>

    <ul id="lista"></ul>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
