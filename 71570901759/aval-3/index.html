<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aprendendo os Números de 1 a 10</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h1>Aprendendo os Números de 1 a 10</h1>
    <div class="score" aria-live="polite">⭐ Pontos: <span id="score">0</span></div>
  </header>

  <nav class="tabs">
    <button id="tab-learn" class="tab active">📖 Aprender</button>
    <button id="tab-play" class="tab">🎮 Brincar</button>
  </nav>

  <main>
    <!-- Modo Aprender -->
    <section id="learn">
      <div class="card">
        <div class="badge" id="number">1</div>
        <div class="word" id="word">um</div>
        <div class="emojis" id="emojis" aria-hidden="true"></div>
        <button id="speak" class="btn btn-speak">🔊 Ouvir</button>
      </div>
      <div class="nav-buttons">
        <button id="prev" class="btn btn-prev">⬅️ Voltar</button>
        <span id="counter" class="counter">1 de 10</span>
        <button id="next" class="btn btn-next">Avançar ➡️</button>
      </div>
    </section>

    <!-- Modo Brincar (perguntas) -->
    <section id="play" hidden>
      <div class="card">
        <p id="question" class="question"></p>
        <div id="q-visual" class="q-visual"></div>
        <div id="options" class="options"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
        <button id="next-question" class="btn btn-next" hidden>Próxima pergunta ➡️</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
