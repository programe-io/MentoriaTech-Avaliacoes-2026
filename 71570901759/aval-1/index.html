
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Sistema de Estoque</h1>

    <h2>Cadastrar Produto</h2>

    <input type="number" id="codigo" placeholder="Código"><br><br>
    <input type="text" id="descricao" placeholder="Descrição"><br><br>
    <input type="number" id="quantidade" placeholder="Quantidade"><br><br>
    <input type="number" id="valor" placeholder="Valor"><br><br>

    <button onclick="cadastrar()">Cadastrar Produto</button>

    <h2>Alterar Produto</h2>

    <input type="number" id="codigoAlterar" placeholder="Código do produto"><br><br>
    <input type="number" id="novoValor" placeholder="Novo valor"><br><br>

    <button onclick="alterarValor()">Alterar Valor</button>

    <br><br>

    <input type="number" id="novaQuantidade" placeholder="Nova quantidade"><br><br>

    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    <h2>Produtos Cadastrados</h2>

    <button onclick="listar()">Listar Produtos</button>

    <ul id="lista"></ul>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
