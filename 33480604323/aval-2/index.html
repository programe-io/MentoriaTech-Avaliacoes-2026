<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Meu Mini Feed</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <div class="container">
                            <!-- Cabeçalho -->
                                    <header>
                                                <h1>MiniFeed</h1>
                                                            <p>Compartilhe o que está acontecendo agora.</p>
                                                                    </header>

                                                                            <!-- Formulário para criar post -->
                                                                                    <section class="post-form-section">
                                                                                                <form id="postForm">
                                                                                                                <input type="text" id="username" placeholder="Seu nome" required autocomplete="off">
                                                                                                                                <textarea id="postContent" placeholder="No que você está pensando?" rows="3" required></textarea>
                                                                                                                                                <button type="submit">Publicar</button>
                                                                                                                                                            </form>
                                                                                                                                                                    </section>

                                                                                                                                                                            <!-- Feed de Publicações -->
                                                                                                                                                                                    <main class="feed" id="feedContainer">
                                                                                                                                                                                                <!-- Os posts gerados via JavaScript aparecerão aqui -->
                                                                                                                                                                                                        </main>
                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                </html>
