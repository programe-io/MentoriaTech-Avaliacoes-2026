<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Quiz de Matemática</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="quiz-container">
        <header>
            <h1>🧮 Math Quiz</h1>
            <div class="header-info">
                <div class="combo-caixa">Combo: x<span id="combo">1</span></div>
                <div class="pontuacao-caixa">Pontos: <span id="pontos">0</span></div>
            </div>
        </header>

        <!-- Barra de Tempo -->
        <div class="barra-tempo-container">
            <div id="barra-tempo" class="barra-tempo"></div>
        </div>

        <main id="area-quiz">
            <div class="pergunta-header">
                <span id="categoria-badge" class="badge">Aritmética</span>
                <span id="tempo-texto">15s</span>
            </div>

            <h2 id="pergunta">Carregando desafio matemático...</h2>
            
            <div id="caixa-opcoes" class="grid-opcoes">
                <!-- Os botões das alternativas serão inseridos via JavaScript -->
            </div>

            <!-- Caixa com explicação passo a passo da solução -->
            <div id="caixa-explicacao" class="explicacao escondido">
                <strong>💡 Resolução:</strong>
                <p id="texto-explicacao"></p>
            </div>
        </main>

        <div class="controles">
            <button id="btn-proximo" class="escondido">Próximo Desafio ➔</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
