<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Dama</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>JOGO DE DAMA</h1>
        <p>Desenvolva sua estratégia e domine o tabuleiro</p>
    </header>

    <main class="container-jogo">
        <div id="status-jogo">Vez das Brancas</div>
        <div class="placar">
            <span>Brancas: <strong id="contagem-brancas">12</strong></span> | 
            <span>Pretas: <strong id="contagem-pretas">12</strong></span>
        </div>
        
        <div id="tabuleiro" class="tabuleiro"></div>

        <button id="btn-reiniciar">Reiniciar Jogo</button>
    </main>

    <footer>
        <p>Desenvolvido com HTML, CSS e JavaScript</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
