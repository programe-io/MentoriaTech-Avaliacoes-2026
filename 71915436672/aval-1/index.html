<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio de Bebidas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Portfólio de Bebidas</h1>
        <p>Conheça nossas bebidas especiais</p>
    </header>

    <section class="container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=500" alt="Suco Natural">
            <h2>Suco Natural</h2>
            <p>Bebida refrescante feita com frutas frescas.</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1517701550927-30cf4ba1f9d5?w=500" alt="Café">
            <h2>Café Especial</h2>
            <p>Aroma intenso e sabor marcante.</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1497534446932-c925b458314e?w=500" alt="Milkshake">
            <h2>Milkshake</h2>
            <p>Cremoso e delicioso para qualquer momento.</p>
        </div>

    </section>

    <div class="botao-area">
        <button onclick="mostrarMensagem()">Saiba Mais</button>
    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
