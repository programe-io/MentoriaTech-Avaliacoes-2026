<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Completo</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header{
            background: #111827;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo{
            color: cyan;
            font-size: 28px;
            font-weight: bold;
        }

        nav a{
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover{
            color: cyan;
        }

        .container{
            display: flex;
            min-height: 80vh;
        }

        aside{
            width: 250px;
            background: #1e293b;
            padding: 20px;
        }

        aside h2{
            color: cyan;
            margin-bottom: 20px;
        }

        aside ul{
            list-style: none;
        }

        aside li{
            margin-bottom: 15px;
        }

        aside a{
            color: white;
            text-decoration: none;
        }

        aside a:hover{
            color: cyan;
        }

        main{
            flex: 1;
            padding: 40px;
        }

        h1{
            color: cyan;
            margin-bottom: 15px;
        }

        h3{
            color: #38bdf8;
            margin-bottom: 10px;
        }

        article{
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
        }

        article img{
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            margin-top: 15px;
        }

        article p{
            margin-top: 10px;
            line-height: 1.6;
        }

        span{
            color: cyan;
            font-weight: bold;
        }

        button{
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: cyan;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover{
            background: white;
        }

        footer{
            background: #111827;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }

        footer p{
            color: #cbd5e1;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="logo">Mentoria Tech</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Projetos</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <div class="container">

        <aside>
            <h2>Menu</h2>

            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Cursos</a></li>
                <li><a href="#">Configurações</a></li>
            </ul>
        </aside>

        <main>

            <h1>Bem-vindo ao Site</h1>

            <p>
                Este é um exemplo com a tag
                <span>SPAN</span>.
            </p>

            <article>

                <h3>Aprendendo HTML</h3>

                <p>
                    O <span>HTML</span> cria a estrutura
                    das páginas web.
                </p>

                <img 
                    src="https://picsum.photos/400"
                    alt="Imagem HTML"
                >

            </article>

            <article>

                <h3>Aprendendo CSS</h3>

                <p>
                    O <span>CSS</span> deixa o site moderno
                    e organizado.
                </p>

                <img 
                    src="https://picsum.photos/401"
                    alt="Imagem CSS"
                >

            </article>

            <button onclick="alert('Você clicou!')">
                Clique Aqui
            </button>

        </main>

    </div>

    <footer>
        <p>
            © 2026 - Desenvolvido por
            <span>Arthur</span>
        </p>
    </footer>

<script src="script.js"></script></body>
</html>
