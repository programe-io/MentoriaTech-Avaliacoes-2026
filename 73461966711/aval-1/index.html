```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div>
            <h1>📦 Sistema de Estoque</h1>
            <p>Controle seus produtos de forma simples</p>
        </div>

        <button id="btnNovoProduto">+ Novo produto</button>
    </header>

    <main>

        <section class="dashboard">

            <div class="card">
                <span>Total de produtos</span>
                <strong id="totalProdutos">0</strong>
            </div>

            <div class="card">
                <span>Quantidade em estoque</span>
                <strong id="totalQuantidade">0</strong>
            </div>

            <div class="card">
                <span>Valor do estoque</span>
                <strong id="valorEstoque">R$ 0,00</strong>
            </div>

            <div class="card alerta">
                <span>Estoque baixo</span>
                <strong id="estoqueBaixo">0</strong>
            </div>

        </section>

        <section class="controles">

            <input
                type="text"
                id="campoBusca"
                placeholder="🔎 Buscar produto..."
            >

            <select id="filtroCategoria">
                <option value="">Todas as categorias</option>
            </select>

            <select id="filtroStatus">
                <option value="">Todos os status</option>
                <option value="normal">Normal</option>
                <option value="baixo">Estoque baixo</option>
                <option value="zerado">Sem estoque</option>
            </select>

        </section>

        <section class="tabela-container">

            <table>

                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                        <th>Fornecedor</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos"></tbody>

            </table>

            <div id="semProdutos" class="sem-produtos">
                Nenhum produto encontrado.
            </div>

        </section>

    </main>

    <!-- MODAL -->

    <div id="modal" class="modal">

        <div class="modal-content">

            <div class="modal-header">
                <h2 id="tituloModal">Novo produto</h2>
                <button id="fecharModal">×</button>
            </div>

            <form id="formProduto">

                <input type="hidden" id="produtoId">

                <div class="campo">
                    <label>Nome do produto</label>
                    <input
                        type="text"
                        id="nome"
                        required
                        minlength="2"
                    >
                </div>

                <div class="campo">
                    <label>Descrição</label>
                    <textarea
                        id="descricao"
                        required
                        minlength="5"
                    ></textarea>
                </div>

                <div class="linha">

                    <div class="campo">
                        <label>Categoria</label>

                        <select id="categoria" required>
                            <option value="">Selecione</option>
                            <option value="Eletrônicos">Eletrônicos</option>
                            <option value="Informática">Informática</option>
                            <option value="Móveis">Móveis</option>
                            <option value="Roupas">Roupas</option>
                            <option value="Alimentos">Alimentos</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label>Quantidade</label>
                        <input
                            type="number"
                            id="quantidade"
                            min="0"
                            required
                        >
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label>Preço (R$)</label>
                        <input
                            type="number"
                            id="preco"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label>Estoque mínimo</label>
                        <input
                            type="number"
                            id="estoqueMinimo"
                            min="0"
                            value="5"
                            required
                        >
                    </div>

                </div>

                <div class="campo">
                    <label>Fornecedor</label>
                    <input
                        type="text"
                        id="fornecedor"
                        required
                    >
                </div>

                <div class="campo">
                    <label>Data de cadastro</label>
                    <input
                        type="date"
                        id="dataCadastro"
                        required
                    >
                </div>

                <div class="botoes-form">

                    <button
                        type="button"
                        class="cancelar"
                        id="cancelar"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="salvar"
                    >
                        Salvar produto
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
