
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            text-align: center;
        }

        header {
            background: #007bff;
            color: white;
            padding: 30px;
        }

        nav {
            background: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        main {
            padding: 50px 20px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        footer {
            background: #222;
            color: white;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Bem-vindo ao Meu Site!</h1>
        <p>Minha primeira página HTML</p>
    </header>

    <nav>
        <a href="#inicio">Início</a>
        <a href="#sobre">Sobre</a>
        <a href="#contato">Contato</a>
    </nav>

    <main id="inicio">
        <h2>Olá, mundo!</h2>

        <p>
            Este é meu primeiro site criado com HTML e CSS.
        </p>

        <button onclick="mostrarMensagem()">
            Clique aqui
        </button>

        <p id="mensagem"></p>
    </main>

    <footer>
        <p>© 2026 - Meu Primeiro Site</p>
    </footer>

    <script>
        function mostrarMensagem() {
            document.getElementById("mensagem").innerHTML =
                "Parabéns! Seu site está funcionando!";
        }
    </script>

<script src="script.js"></script></body>
</html>
