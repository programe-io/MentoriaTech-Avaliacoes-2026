
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <h1>📋 Gerenciador de Tarefas</h1>
        <p>Organize suas atividades de maneira simples!</p>
    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <!-- CADASTRAR TAREFA -->
        <section class="card">

            <h2>Cadastrar Nova Tarefa</h2>

            <label for="descricao">Descrição da tarefa</label>

            <input
                type="text"
                id="descricao"
                placeholder="Digite a descrição da tarefa"
            >

            <label for="prioridade">Prioridade</label>

            <select id="prioridade">

                <option value="">Selecione a prioridade</option>
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>

            </select>

            <button onclick="cadastrarTarefa()">
                + Cadastrar Tarefa
            </button>

        </section>


        <!-- PESQUISAR TAREFA -->
        <section class="card">

            <h2>Pesquisar Tarefa</h2>

            <label for="codigoBusca">Código da tarefa</label>

            <input
                type="number"
                id="codigoBusca"
                placeholder="Digite o código da tarefa"
                min="1"
            >

            <button onclick="buscarTarefa()">
                🔎 Buscar Tarefa
            </button>

            <div id="resultadoBusca"></div>

        </section>


        <!-- ALTERAR PRIORIDADE -->
        <section class="card">

            <h2>Alterar Prioridade</h2>

            <label for="codigoAlterar">Código da tarefa</label>

            <input
                type="number"
                id="codigoAlterar"
                placeholder="Digite o código da tarefa"
                min="1"
            >

            <label for="novaPrioridade">Nova prioridade</label>

            <select id="novaPrioridade">

                <option value="">Selecione a nova prioridade</option>
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>

            </select>

            <button onclick="alterarPrioridade()">
                Alterar Prioridade
            </button>

        </section>


        <!-- LISTA DE TAREFAS -->
        <section class="card">

            <h2>Lista de Tarefas</h2>

            <div id="listaTarefas">

                <p>Nenhuma tarefa cadastrada.</p>

            </div>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer>
        <p>Projeto Gerenciador de Tarefas - JavaScript</p>
    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
