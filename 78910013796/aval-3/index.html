<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <!-- Importação do Tailwind CSS via CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- Biblioteca de ícones Lucide Icons -->
    <script src="https://unpkg.com"></script>
    <style>
        /* Oculta as barras de rolagem nos stories sem quebrar a navegação por toque ou scroll */
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="bg-black text-white font-sans antialiased min-h-screen flex">

    <!-- MENU LATERAL DE NAVEGAÇÃO -->
    <aside class="w-64 border-r border-zinc-800 h-screen fixed left-0 top-0 p-6 flex flex-col justify-between hidden md:flex">
        <div class="flex flex-col gap-8">
            <!-- Logo oficial textual -->
            <h1 class="text-xl font-bold tracking-wider italic my-4 px-2">Instagram</h1>
            
            <!-- Itens de navegação principal -->
            <nav class="flex flex-col gap-4">
                <a href="#" class="flex items-center gap-4 hover:bg-zinc-900 p-3 rounded-lg transition font-medium"><i data-lucide="home"></i> Página inicial</a>
                <a href="#" class="flex items-center gap-4 hover:bg-zinc-900 p-3 rounded-lg transition font-medium"><i data-lucide="search"></i> Pesquisa</a>
                <a href="#" class="flex items-center gap-4 hover:bg-zinc-900 p-3 rounded-lg transition font-medium"><i data-lucide="compass"></i> Explorar</a>
                <a href="#" class="flex items-center gap-4 hover:bg-zinc-900 p-3 rounded-lg transition font-medium"><i data-lucide="film"></i> Reels</a>
                <a href="#" class="flex items-center gap-4 hover:bg-zinc-900 p-3 rounded-lg transition font-medium"><i data-lucide="message-circle"></i> Mensagens</a>
                <a href="#" class="flex items-center gap-4 hover:bg-zinc-900 p-3 rounded-lg transition font-medium"><i data-lucide="heart"></i> Notificações</a>
                <a href="#" class="flex items-center gap-4 hover:bg-zinc-900 p-3 rounded-lg transition font-medium"><i data-lucide="plus-square"></i> Criar</a>
                <a href="#" class="flex items-center gap-4 hover:bg-zinc-900 p-3 rounded-lg transition font-medium">
                    <img src="https://unsplash.com" class="w-6 h-6 rounded-full object-cover" alt="Perfil Logado">
                    Perfil
                </a>
            </nav>
        </div>

        <!-- Opções adicionais de configuração -->
        <a href="#" class="flex items-center gap-4 hover:bg-zinc-900 p-3 rounded-lg transition font-medium"><i data-lucide="menu"></i> Mais</a>
    </aside>

    <!-- ÁREA PRINCIPAL DO FEED -->
    <main class="flex-1 md:ml-64 flex justify-center py-8 px-4">
        <div class="max-w-[600px] w-full flex flex-col gap-6">
            
            <!-- CAROUSEL DE STORIES -->
            <div id="stories-container" class="flex gap-4 p-4 bg-black border border-zinc-800 rounded-lg overflow-x-auto scrollbar-none">
                <!-- Alimentado dinamicamente por JavaScript -->
            </div>

            <!-- TIMELINE DE PUBLICAÇÕES -->
            <div id="feed-container" class="flex flex-col gap-6">
                <!-- Alimentado dinamicamente por JavaScript -->
            </div>

        </div>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
