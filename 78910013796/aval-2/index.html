<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelVerse | Blog de Games</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <div class="header-content">
      <h1>PixelVerse 🕹️</h1>
      <p>O universo dos reviews, detonados e notícias gamer.</p>
      <button id="toggleTheme" class="btn-theme">Alternar Tema 🌓</button>
    </div>
  </header>

  <nav class="nav-filters" id="topNav">
    <div class="container">
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="RPG">RPG</button>
      <button class="filter-btn" data-filter="Ação">Ação</button>
      <button class="filter-btn" data-filter="Indies">Indies</button>
    </div>
  </nav>

  <main class="container main-layout">
    <section class="content-area">
      <!-- Formulário para Criar Novo Post -->
      <div class="card form-card">
        <h3>➕ Publicar Nova Notícia</h3>
        <form id="postForm">
          <input type="text" id="postTitle" placeholder="Título do jogo ou notícia" required>
          <select id="postCategory" required>
            <option value="" disabled selected>Escolha a Categoria</option>
            <option value="RPG">RPG</option>
            <option value="Ação">Ação</option>
            <option value="Indies">Indies</option>
          </select>
          <textarea id="postBody" rows="4" placeholder="Escreva o artigo aqui..." required></textarea>
          <button type="submit" class="btn-primary">Publicar no Feed</button>
        </form>
      </div>

      <!-- Feed de Posts (Gerenciado pelo JS) -->
      <div id="postsFeed" class="posts-list"></div>
    </section>

    <aside class="sidebar">
      <div class="card ranking-card">
        <h3>🏆 GotY 2026 Favorito</h3>
        <p>Vote no seu candidato a Jogo do Ano:</p>
        <div class="poll-options">
          <button class="btn-poll" data-game="game1">GTA VI 🚗 (<span id="votes-game1">0</span>)</button>
          <button class="btn-poll" data-game="game2">Elden Ring DLC ⚔️ (<span id="votes-game2">0</span>)</button>
        </div>
      </div>

      <div class="card newsletter-card">
        <h3>📧 Newsletter Gamer</h3>
        <p>Receba códigos de beta e promoções.</p>
        <input type="email" id="newsEmail" placeholder="Seu melhor e-mail">
        <button id="btnSubscribe" class="btn-primary">Inscrever</button>
        <p id="newsStatus" class="status-msg"></p>
      </div>
    </aside>
  </main>

  <footer>
    <p>&copy; 2026 PixelVerse. Powered by HTML, CSS & JavaScript.</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
