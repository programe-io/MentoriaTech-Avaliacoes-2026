<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📦 Gestão de Estoque</h1>

        <!-- ÁREA MENSAGENS DE ERRO/SUCESSO -->
        <div id="mensagem" class="mensagem hidden"></div>

        <!-- FORMULÁRIO 1: CADASTRO DE PRODUTO -->
        <section class="card">
            <h2>Cadastrar Produto</h2>
            <form id="form-cadastro">
                <div class="form-group">
                    <label for="descricao">Descrição (min. 5 caracteres):</label>
                    <input type="text" id="descricao" placeholder="Ex: Cadeira Gamer" required>
                </div>
                <div class="form-group-inline">
                    <div class="form-group">
                        <label for="quantidade">Quantidade (min. 1):</label>
                        <input type="number" id="quantidade" min="1" placeholder="Ex: 10" required>
                    </div>
                    <div class="form-group">
                        <label for="valor">Valor R$ (min. 0):</label>
                        <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 699.90" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
            </form>
        </section>

        <!-- FORMULÁRIO 2: ATUALIZAÇÕES -->
        <section class="card">
            <h2>Atualizar Estoque</h2>
            <div class="form-group-inline">
                <!-- Alterar Preço -->
                <form id="form-atualizar-valor" class="sub-form">
                    <h3>Alterar Preço</h3>
                    <input type="number" id="codigo-val" placeholder="Cód. Produto" required>
                    <input type="number" id="novo-valor" step="0.01" min="0" placeholder="Novo Valor R$" required>
                    <button type="submit" class="btn btn-secondary">Atualizar Preço</button>
                </form>

                <!-- Somar Quantidade -->
                <form id="form-atualizar-qtd" class="sub-form">
                    <h3>Adicionar Qtd.</h3>
                    <input type="number" id="codigo-qtd" placeholder="Cód. Produto" required>
                    <input type="number" id="nova-qtd" min="1" placeholder="Qtd. a somar" required>
                    <button type="submit" class="btn btn-secondary">Somar Estoque</button>
                </form>
            </div>
        </section>

        <!-- TABELA DE LISTAGEM DE PRODUTOS -->
        <section class="card">
            <h2>Produtos em Estoque</h2>
            <table id="tabela-produtos">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Qtd.</th>
                        <th>Valor Un.</th>
                    </tr>
                </thead>
                <tbody id="lista-corpo">
                    <!-- Inserido dinamicamente via JS -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
