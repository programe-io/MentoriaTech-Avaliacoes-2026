<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📋 Gerenciador de Tarefas</h1>

        <!-- MENSAGENS DE NOTIFICAÇÃO (ERRO/SUCESSO) -->
        <div id="mensagem" class="mensagem hidden"></div>

        <!-- FORMULÁRIO DE CADASTRO -->
        <section class="card">
            <h2>Cadastrar Nova Tarefa</h2>
            <form id="form-cadastro">
                <div class="form-group">
                    <label for="titulo">Título da Tarefa (min. 5 caracteres):</label>
                    <input type="text" id="titulo" placeholder="Ex: Estudar métodos de arrays" required>
                </div>
                <div class="form-group">
                    <label for="prioridade">Prioridade (1 = Alta, 2 = Média, 3 = Baixa):</label>
                    <select id="prioridade" required>
                        <option value="">Selecione...</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar Tarefa</button>
            </form>
        </section>

        <!-- FORMULÁRIOS DE AÇÕES (CONCLUIR E ALTERAR PRIORIDADE) -->
        <section class="card">
            <h2>Gerenciar Tarefa Existente</h2>
            <div class="form-group-inline">
                <!-- Concluir Tarefa -->
                <form id="form-concluir" class="sub-form">
                    <h3>Concluir Tarefa</h3>
                    <input type="number" id="codigo-concluir" placeholder="Cód. da Tarefa" required min="1">
                    <button type="submit" class="btn btn-success">Marcar como Concluída</button>
                </form>

                <!-- Alterar Prioridade -->
                <form id="form-prioridade" class="sub-form">
                    <h3>Alterar Prioridade</h3>
                    <input type="number" id="codigo-prioridade" placeholder="Cód. da Tarefa" required min="1">
                    <select id="nova-prioridade" required>
                        <option value="">Nova Prioridade...</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                    <button type="submit" class="btn btn-secondary">Atualizar Prioridade</button>
                </form>
            </div>
        </section>

        <!-- LISTA / TABELA DE TAREFAS -->
        <section class="card">
            <h2>Lista de Tarefas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Título</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="lista-tarefas">
                    <!-- Linhas inseridas via JS -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
