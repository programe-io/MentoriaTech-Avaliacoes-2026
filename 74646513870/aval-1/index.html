<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Lista de Produtos</title> 
    <style> 
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: Arial, sans-serif; 
        } 
        body { 
            background-color: #f2f2f2; 
            padding: 40px; 
        } 
        .container { 
            max-width: 900px; 
            margin: auto; 
            background-color: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
        } 
        h1 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 30px; 
        } 
        .produtos { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
        } 
        .produto { 
            background-color: #fff; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            padding: 20px; 
            transition: 0.3s; 
        } 
        .produto:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15); 
        } 
        .produto h2 { 
            color: #222; 
            margin-bottom: 15px; 
        } 
        .produto p { 
            margin: 8px 0; 
            color: #555; 
        } 
        .preco { 
            color: #2e7d32; 
            font-size: 20px; 
            font-weight: bold; 
        } 
        .quantidade { 
            color: #1976d2; 
            font-weight: bold; 
        } 
        .codigo { 
            color: #888; 
            font-size: 14px; 
        } 
    </style> 
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head> 
<body> 
    <div class="container"> 
        <h1>Lista de Produtos</h1> 
        <div class="produtos"> 
            <div class="produto"> 
                <span class="codigo">Código: 1</span> 
                <h2>Cadeira gamer</h2> 
                <p class="quantidade">Quantidade: 12</p> 
                <p class="preco">R$ 3,00</p> 
            </div> 
            <div class="produto"> 
                <span class="codigo">Código: 2</span> 
                <h2>Mouse Logitech</h2> 
                <p class="quantidade">Quantidade: 38</p> 
                <p class="preco">R$ 97,00</p> 
            </div> 
        </div> 
    </div> 
<script src="script.js"></script></body> 
</html>
