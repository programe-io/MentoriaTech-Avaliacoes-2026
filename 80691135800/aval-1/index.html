<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox + Bordas + Gradientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- CONTAINER PAI COM FLEXBOX -->
  <div class="flex flex-col md:flex-row gap-6 justify-evenly items-center w-full max-w-4xl">

    <!-- CARD 1 - Borda + Sombra + Gradiente -->
    <div class="bg-gradient-to-b from-blue-500 to-red-500 
                border-2 border-dashed border-white
                rounded-tl-3xl rounded-br-3xl
                shadow-lg shadow-red-500/50
                p-6 w-72 text-white text-center flex-1">
      <h2 class="text-2xl font-bold">Card 1</h2>
      <p class="mt-2">Gradiente azul p/ vermelho</p>
      <div class="bg-white text-blue-500 rounded-full w-16 h-16 flex items-center justify-center mx-auto mt-4 font-bold">
        1
      </div>
    </div>

    <!-- CARD 2 - Borda sólida + Círculo -->
    <div class="bg-white 
                border-4 border-pink-500 
                rounded-2xl
                shadow-xl shadow-pink-500/30
                p-6 w-72 text-center flex-2">
      <h2 class="text-2xl font-bold text-pink-500">Card 2</h2>
      <p class="mt-2 text-gray-600">Borda pink + sombra</p>
      
      <!-- CÍRCULO PERFEITO -->
      <div class="bg-gradient-to-r from-purple-500 to-pink-500 
                  rounded-full w-20 h-20 
                  flex items-center justify-center mx-auto mt-4 text-white font-bold">
        2
      </div>
    </div>

    <!-- CARD 3 - Radial + Dotted -->
    <div class="bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-yellow-300 to-orange-500
                border-2 border-dotted border-black
                rounded-full
                shadow-md shadow-orange-500/50
                p-6 w-72 h-72 text-center flex flex-col justify-center items-center flex-1">
      <h2 class="text-2xl font-bold">Card 3</h2>
      <p>Gradiente radial</p>
    </div>

  </div>

<script src="script.js"></script></body>
</html>
