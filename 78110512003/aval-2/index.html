<!DOCTYPE html>
 <html lang="pt-BR">
  <head>
       <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
                 <title>Meu Site</title>
                      <style>
                               body {
                                            font-family: Arial, sans-serif;
                                                         background-color: #f0f8ff;
                                                                      margin: 0;
                                                                                   padding: 20px;
                                                                                            }
                                                                                                     .container {
                                                                                                                  max-width: 800px;
                                                                                                                               margin: 0 auto;
                                                                                                                                            background: white;
                                                                                                                                                         padding: 30px;
                                                                                                                                                                      border-radius: 10px;
                                                                                                                                                                                   box-shadow: 0 0 10px rgba(0,0,0,0.1);
                                                                                                                                                                                            }
                                                                                                                                                                                                     h1 {
                                                                                                                                                                                                                  color: #2c3e50;
                                                                                                                                                                                                                               text-align: center;
                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                 p {
                                                                                                                                                                                                                                                              color: #34495e;
                                                                                                                                                                                                                                                                           font-size: 18px;
                                                                                                                                                                                                                                                                                        line-height: 1.6;
                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                          button {
                                                                                                                                                                                                                                                                                                                       background-color: #3498db;
                                                                                                                                                                                                                                                                                                                                    color: white;
                                                                                                                                                                                                                                                                                                                                                 padding: 10px 25px;
                                                                                                                                                                                                                                                                                                                                                              border: none;
                                                                                                                                                                                                                                                                                                                                                                           border-radius: 5px;
                                                                                                                                                                                                                                                                                                                                                                                        font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                     cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                  display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                               margin: 20px auto;
                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                 button:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                                              background-color: #2980b9;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                             <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h1>🎉 Bem-vindo ao Meu Site!</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     <p>Olá! Este é o meu primeiro site criado com HTML. Estou aprendendo e é muito divertido!</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <p>HTML é a linguagem que usamos para criar a estrutura das páginas da internet.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="mostrarMensagem()">Clique Aqui!</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         <p id="mensagem" style="text-align: center; color: green; font-weight: bold; display: none;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      🎊 Parabéns! Você conseguiu!
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function mostrarMensagem() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               document.getElementById('mensagem').style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               </html>
