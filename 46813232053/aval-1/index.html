
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .produto {
            background: #f1f1f1;
            padding: 12px;
            margin-top: 10px;
            border-radius: 5px;
        }

        .botoes {
            display: flex;
            gap: 10px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Sistema de Estoque</h1>

    <h3>Cadastrar Produto</h3>

    <input type="number" id="codigo" placeholder="Código do produto">

    <input type="text" id="descricao" placeholder="Descrição do produto">

    <input type="number" id="quantidade" placeholder="Quantidade">

    <input type="number" id="valor" placeholder="Valor do produto">

    <button onclick="cadastrarProduto()">Cadastrar Produto</button>

    <hr>

    <h3>Alterar Produto</h3>

    <input type="number" id="codigoAlterar" placeholder="Código do produto">

    <input type="number" id="novoValor" placeholder="Novo valor">

    <button onclick="alterarValor()">Alterar Valor</button>

    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    <hr>

    <h3>Produtos Cadastrados</h3>

    <button onclick="listarProdutos()">Listar Produtos</button>

    <div id="listaProdutos"></div>

</div>

<script>

    let produtos = [];

    // Cadastrar produto
    function cadastrarProduto() {

        let codigo = Number(document.getElementById("codigo").value);
        let descricao = document.getElementById("descricao").value;
        let quantidade = Number(document.getElementById("quantidade").value);
        let valor = Number(document.getElementById("valor").value);

        if (!codigo || !descricao || quantidade < 0 ||
            document.getElementById("quantidade").value === "" ||
            document.getElementById("valor").value === "" ||
            valor < 0) {
            alert("Preencha todos os campos corretamente!");
            return;
        }

        let existente = produtos.find(p => p.codigo === codigo);

        if (existente) {
            alert("Esse código já está cadastrado!");
            return;
        }

        produtos.push({
            codigo: codigo,
            descricao: descricao,
            quantidade: quantidade,
            valor: valor
        });

        alert("Produto cadastrado com sucesso!");

        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";

        listarProdutos();
    }

    // Listar produtos
    function listarProdutos() {

        let lista = document.getElementById("listaProdutos");

        lista.innerHTML = "";

        if (produtos.length === 0) {
            lista.innerHTML = "<p>Nenhum produto cadastrado.</p>";
            return;
        }

        produtos.forEach(function(p) {

            lista.innerHTML += `
                <div class="produto">
                    <strong>Código:</strong> ${p.codigo}<br>
                    <strong>Descrição:</strong> ${p.descricao}<br>
                    <strong>Quantidade:</strong> ${p.quantidade}<br>
                    <strong>Valor:</strong> R$ ${p.valor.toFixed(2)}
                </div>
            `;

        });
    }

    // Alterar valor
    function alterarValor() {

        let codigo = Number(document.getElementById("codigoAlterar").value);

        let produto = produtos.find(p => p.codigo === codigo);

        if (produto) {

            let valor = document.getElementById("novoValor").value;

            if (valor === "" || Number(valor) < 0) {
                alert("Digite um valor válido!");
                return;
            }

            produto.valor = Number(valor);

            alert("Valor alterado com sucesso!");

            listarProdutos();

        } else {
            alert("Produto não encontrado!");
        }
    }

    // Alterar quantidade
    function alterarQuantidade() {

        let codigo = Number(document.getElementById("codigoAlterar").value);

        let produto = produtos.find(p => p.codigo === codigo);

        if (produto) {

            let quantidade = document.getElementById("novaQuantidade").value;

            if (quantidade === "" || Number(quantidade) < 0) {
                alert("Digite uma quantidade válida!");
                return;
            }

            produto.quantidade = Number(quantidade);

            alert("Quantidade alterada com sucesso!");

            listarProdutos();

        } else {
            alert("Produto não encontrado!");
        }
    }

</script>

<script src="script.js"></script></body>
</html>
