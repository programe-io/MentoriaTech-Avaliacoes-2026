
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f2f5;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        h2 {
            color: #444;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        .tarefa {
            background: #f8fafc;
            padding: 15px;
            margin-top: 12px;
            border-left: 5px solid #2563eb;
            border-radius: 6px;
        }

        .tarefa.concluida {
            border-left-color: #16a34a;
            opacity: 0.7;
        }

        .tarefa p {
            margin: 7px 0;
        }

        .acoes {
            display: flex;
            gap: 8px;
        }

        .acoes button {
            flex: 1;
        }

        .btn-concluir {
            background: #16a34a;
        }

        .btn-concluir:hover {
            background: #15803d;
        }

        .btn-alterar {
            background: #ea580c;
        }

        .btn-alterar:hover {
            background: #c2410c;
        }

        .status {
            font-weight: bold;
        }

        .mensagem {
            text-align: center;
            color: #555;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>📋 Gerenciador de Tarefas</h1>

    <h2>Cadastrar nova tarefa</h2>

    <input
        type="text"
        id="titulo"
        placeholder="Digite o título da tarefa"
    >

    <select id="prioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="cadastrarTarefa()">
        Cadastrar tarefa
    </button>

    <h2>Lista de tarefas</h2>

    <div id="listaTarefas">
        <p class="mensagem">Nenhuma tarefa cadastrada.</p>
    </div>

</div>

<script>

    let tarefas = [];
    let proximoCodigo = 1;

    // Cadastrar tarefa
    function cadastrarTarefa() {

        let titulo = document.getElementById("titulo").value.trim();
        let prioridade = Number(
            document.getElementById("prioridade").value
        );

        if (titulo.length < 5) {
            alert("O título deve ter no mínimo 5 caracteres!");
            return;
        }

        if (!Number.isInteger(prioridade) ||
            prioridade < 1 || prioridade > 3) {
            alert("A prioridade deve ser entre 1 e 3!");
            return;
        }

        let tarefa = {
            codigo: proximoCodigo,
            titulo: titulo,
            prioridade: prioridade,
            concluida: false
        };

        tarefas.push(tarefa);
        proximoCodigo++;

        document.getElementById("titulo").value = "";

        listarTarefas();

        alert("Tarefa cadastrada com sucesso!");
    }

    // Listar tarefas
    function listarTarefas() {

        let lista = document.getElementById("listaTarefas");

        lista.innerHTML = "";

        if (tarefas.length === 0) {
            lista.innerHTML =
                '<p class="mensagem">Nenhuma tarefa cadastrada.</p>';
            return;
        }

        tarefas.forEach(function(tarefa) {

            let status = tarefa.concluida
                ? "Concluída"
                : "Pendente";

            let classe = tarefa.concluida
                ? "tarefa concluida"
                : "tarefa";

            lista.innerHTML += `
                <div class="${classe}">
                    <p><strong>Código:</strong> ${tarefa.codigo}</p>

                    <p><strong>Título:</strong> ${tarefa.titulo}</p>

                    <p><strong>Prioridade:</strong>
                        ${tarefa.prioridade} -
                        ${tarefa.prioridade == 1 ? "Alta" :
                          tarefa.prioridade == 2 ? "Média" : "Baixa"}
                    </p>

                    <p class="status">
                        <strong>Status:</strong> ${status}
                    </p>

                    <div class="acoes">

                        <button
                            class="btn-concluir"
                            onclick="concluirTarefa(${tarefa.codigo})"
                            ${tarefa.concluida ? "disabled" : ""}
                        >
                            Concluir
                        </button>

                        <button
                            class="btn-alterar"
                            onclick="alterarPrioridade(${tarefa.codigo})"
                        >
                            Alterar prioridade
                        </button>

                    </div>
                </div>
            `;
        });
    }

    // Marcar tarefa como concluída
    function concluirTarefa(codigo) {

        let tarefa = tarefas.find(
            t => t.codigo === codigo
        );

        if (!tarefa) {
            alert("Tarefa não encontrada!");
            return;
        }

        tarefa.concluida = true;

        listarTarefas();

        alert("Tarefa concluída com sucesso!");
    }

    // Alterar prioridade
    function alterarPrioridade(codigo) {

        let tarefa = tarefas.find(
            t => t.codigo === codigo
        );

        if (!tarefa) {
            alert("Tarefa não encontrada!");
            return;
        }

        let novaPrioridade = Number(
            prompt("Digite a nova prioridade (1, 2 ou 3):")
        );

        if (!Number.isInteger(novaPrioridade) ||
            novaPrioridade < 1 || novaPrioridade > 3) {
            alert("Prioridade inválida! Digite 1, 2 ou 3.");
            return;
        }

        tarefa.prioridade = novaPrioridade;

        listarTarefas();

        alert("Prioridade alterada com sucesso!");
    }

</script>

<script src="script.js"></script></body>
</html>
