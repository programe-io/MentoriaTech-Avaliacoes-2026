<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto - Gerenciador de Tarefas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h1, h2 { color: #333; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #004085; }
        .search-box {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        ul { list-style: none; padding: 0; }
        li {
            background: white;
            margin-bottom: 10px;
            padding: 10px;
            border-left: 5px solid #ccc;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .prioridade-alta { border-left-color: #dc3545; }
        .prioridade-media { border-left-color: #ffc107; }
        .prioridade-baixa { border-left-color: #28a745; }
        .concluida { text-decoration: line-through; color: #888; opacity: 0.7; }
        .btn-group button { width: auto; margin-left: 5px; font-size: 12px; padding: 5px 10px; }
        .btn-concluir { background-color: #28a745; }
        .btn-prioridade { background-color: #ffc107; color: #222; }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Gerenciador de Tarefas</h1>

    <!-- 5. Validação e 6. Cadastro de Tarefa -->
    <div class="form-group">
        <label for="titulo">Título da Tarefa:</label>
        <input type="text" id="titulo" placeholder="Digite o título da tarefa">
    </div>
    <div class="form-group">
        <label for="prioridade">Prioridade:</label>
        <select id="prioridade">
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
        </select>
    </div>
    <button onclick="cadastrarTarefa()">Cadastrar Tarefa</button>

    <!-- 9. Busca de tarefas com find -->
    <div class="search-box">
        <h2>Buscar Tarefa (Método find)</h2>
        <input type="text" id="buscaId" placeholder="Digite o ID da tarefa para buscar">
        <button onclick="buscarTarefa()" style="margin-top: 10px; background-color: #6c757d;">Buscar</button>
        <div id="resultadoBusca" style="margin-top: 10px; font-weight: bold;"></div>
    </div>

    <!-- 8. Listagem das tarefas cadastradas -->
    <h2>Lista de Tarefas</h2>
    <ul id="listaTarefas"></ul>

    <script>
        // 3. Armazenamento das tarefas com arrays
        let tarefas = [];
        // 7. Geração automática de códigos (ID)
        let proximoId = 1;

        // 4. Organização do algoritmo em funções
        function cadastrarTarefa() {
            const tituloInput = document.getElementById('titulo');
            const prioridadeInput = document.getElementById('prioridade');

            // 5. Validação dos dados da tarefa
            if (tituloInput.value.trim() === '') {
                alert('Por favor, insira um título válido para a tarefa.');
                return;
            }

            // 6. Modelagem de uma tarefa (Objeto)
            const novaTarefa = {
                id: proximoId++,
                titulo: tituloInput.value,
                prioridade: prioridadeInput.value,
                concluida: false
            };

            tarefas.push(novaTarefa);
            tituloInput.value = ''; // Limpa o campo
            renderizarTarefas();
        }

        // 8. Listagem das tarefas
        function renderizarTarefas() {
            const lista = document.getElementById('listaTarefas');
            lista.innerHTML = '';

            tarefas.forEach(tarefa => {
                const li = document.createElement('li');
                li.className = `prioridade-${tarefa.prioridade} ${tarefa.concluida ? 'concluida' : ''}`;
                
                li.innerHTML = `
                    <span>[ID: ${tarefa.id}] <strong>${tarefa.titulo}</strong> (${tarefa.prioridade})</span>
                    <div class="btn-group">
                        <!-- 10. Conclusão de uma tarefa -->
                        <button class="btn-concluir" onclick="concluirTarefa(${tarefa.id})">✓</button>
                        <!-- 11. Alteração da prioridade -->
                        <button class="btn-prioridade" onclick="alterarPrioridade(${tarefa.id})">⇅</button>
                    </div>
                `;
                lista.appendChild(li);
            });
        }

        // 9. Busca de tarefas com find
        function buscarTarefa() {
            const idBusca = parseInt(document.getElementById('buscaId').value);
            const resultadoDiv = document.getElementById('resultadoBusca');

            // Utilizando o método .find() do array
            const tarefaEncontrada = tarefas.find(t => t.id === idBusca);

            if (tarefaEncontrada) {
                resultadoDiv.innerHTML = `Encontrada: "${tarefaEncontrada.titulo}" | Status: ${tarefaEncontrada.concluida ? 'Concluída' : 'Pendente'}`;
                resultadoDiv.style.color = "green";
            } else {
                resultadoDiv.innerHTML = "Tarefa não encontrada.";
                resultadoDiv.style.color = "red";
            }
        }

        // 10. Conclusão de uma tarefa
        function concluirTarefa(id) {
            const tarefa = tarefas.find(t => t.id === id);
            if (tarefa) {
                tarefa.concluida = !tarefa.concluida; // Inverte o estado
                renderizarTarefas();
            }
        }

        // 11. Alteração da prioridade
        function alterarPrioridade(id) {
            const tarefa = tarefas.find(t => t.id === id);
            if (tarefa) {
                if (tarefa.prioridade === 'baixa') tarefa.prioridade = 'media';
                else if (tarefa.prioridade === 'media') tarefa.prioridade = 'alta';
                else tarefa.prioridade = 'baixa';
                
                renderizarTarefas();
            }
        }
    </script>
<script src="script.js"></script></body>
</html>
