
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed - Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>MiniFeed</h1>
        <p>Compartilhe seus momentos!</p>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#publicar">Publicar</a>
        <a href="#feed">Feed</a>
        <a href="#sobre">Sobre</a>
    </nav>

    <main>

        <section class="nova-publicacao" id="publicar">
            <h2>Nova publicação</h2>

            <input type="text" id="nome"
                placeholder="Seu nome">

            <textarea id="texto"
                placeholder="O que você está pensando?"></textarea>

            <input type="url" id="imagem"
                placeholder="URL da imagem (opcional)">

            <button onclick="publicar()">
                Publicar
            </button>
        </section>

        <section class="feed" id="feed">
            <h2>Publicações recentes</h2>

            <div id="postagens">

                <article class="post">
                    <h3>Maria Silva</h3>
                    <p>Que dia lindo para aproveitar a natureza! 🌳</p>
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800"
                        alt="Paisagem natural">

                    <div class="acoes">
                        <button onclick="curtir(this)">
                            ❤️ Curtir <span>0</span>
                        </button>
                        <button onclick="comentar(this)">
                            💬 Comentar
                        </button>
                        <button onclick="compartilhar(this)">
                            🔗 Compartilhar
                        </button>
                    </div>
                </article>

                <article class="post">
                    <h3>João Santos</h3>
                    <p>Mais um dia de aprendizado e conquistas! 📚</p>
                    <img src="https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=800"
                        alt="Livros">

                    <div class="acoes">
                        <button onclick="curtir(this)">
                            ❤️ Curtir <span>0</span>
                        </button>
                        <button onclick="comentar(this)">
                            💬 Comentar
                        </button>
                        <button onclick="compartilhar(this)">
                            🔗 Compartilhar
                        </button>
                    </div>
                </article>

            </div>
        </section>

    </main>

    <footer id="sobre">
        <p>© 2026 MiniFeed - Todos os direitos reservados.</p>
        <p>luan</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
