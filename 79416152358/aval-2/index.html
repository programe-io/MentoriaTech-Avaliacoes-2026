

<!DOCTYPE html>
<html lang="pt-br">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>


<body>


    <header>


        <div class="header-content">


            <h1>MiniFeed</h1>


            <nav>
                <a href="#">Inicio</a>
                <a href="#">Perfil</a>
            </nav>




        </div>


    </header>


    <main>


        <section class="new-post">


            <div class="user">


                <div class="avatar">
                    S
                </div>


                <div>
                  <strong>Siane</strong>
                  <span>o que voce está fazendo?</span>
                </div>


            </div>


            <button>Publicar</button>




        </section>


        <article class="post">


            <div class="post-header">


             <div class="avatar">
                    N
                </div>


                <div>
                  <strong>Nauana</strong>
                  <span>Há 10 minutos</span>
                </div>


            </div>


            <div class="post-text">
                estou indo adotar meu primeiro gato.
            </div>
            <img src="https://blog.matsudapet.com.br/wp-content/uploads/2024/04/maiores-cuidados-gato-filhote.jpg" alt="Imagem de um filhote de gato">


            <div class="post-actions">


                <button>Curtir</button>
                <button>Comentar</button>


            </div>




        </article>






    </main>


    <footer>
        <p>MiniFeed - Todos os Direitos Reservados siane - 2026</p>
    </footer>


    </body>
</html>
