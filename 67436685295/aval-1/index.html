<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📦 Sistema de Estoque</h1>

        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-cadastro">
                <div class="form-group">
                    <label for="descricao">Descrição/Nome:</label>
                    <input type="text" id="descricao" required placeholder="Ex: Teclado Mecânico">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="quantidade">Quantidade:</label>
                        <input type="number" id="quantidade" min="0" required placeholder="0">
                    </div>
                    <div class="form-group">
                        <label for="valor">Valor (R$):</label>
                        <input type="number" id="valor" min="0" step="0.01" required placeholder="0.00">
                    </div>
                </div>
                <button type="submit" class="btn-success">Cadastrar Produto</button>
            </form>
        </div>

        <!-- Gerenciamento (Alterações) -->
        <div class="card grid-2">
            <div>
                <h3>✏️ Alterar Valor</h3>
                <div class="form-group">
                    <label for="cod-valor">Código do Produto:</label>
                    <input type="number" id="cod-valor" placeholder="ID do produto">
                </div>
                <div class="form-group">
                    <label for="novo-valor">Novo Valor (R$):</label>
                    <input type="number" id="novo-valor" min="0" step="0.01" placeholder="0.00">
                </div>
                <button id="btn-alterar-valor" class="btn-primary">Atualizar Valor</button>
            </div>

            <div>
                <h3>🔄 Alterar Quantidade</h3>
                <div class="form-group">
                    <label for="cod-qtd">Código do Produto:</label>
                    <input type="number" id="cod-qtd" placeholder="ID do produto">
                </div>
                <div class="form-group">
                    <label for="nova-qtd">Nova Quantidade:</label>
                    <input type="number" id="nova-qtd" min="0" placeholder="0">
                </div>
                <button id="btn-alterar-qtd" class="btn-primary">Atualizar Qtd</button>
            </div>
        </div>

        <!-- Lista de Produtos -->
        <div class="card">
            <h2>📋 Produtos em Estoque</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor Unitário</th>
                            <th>Valor Total</th>
                        </tr>
                    </thead>
                    <tbody id="lista-produtos">
                        <!-- Inserido dinamicamente via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
