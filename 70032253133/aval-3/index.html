<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header>
  <h1>InstaClone</h1>
</header>

<main>
  <section class="criar-post">
    <h2>Nova publicação</h2>
    <input type="text" id="usuario" placeholder="Seu nome">
    <textarea id="texto" placeholder="O que você está pensando?"></textarea>
    <input type="text" id="imagem" placeholder="URL da imagem">
    <button onclick="publicar()">Publicar</button>
  </section>

  <section class="feed">
    <h2>Feed</h2>
    <div id="postagens"></div>
  </section>
</main>

<footer>
  <p>InstaClone - 2026</p>
</footer>
  <script src="script.js"></script>
  
</body>
</html>
