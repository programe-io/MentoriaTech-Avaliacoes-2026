<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Gerenciador de Tarefas</h1>

    <form id="formTarefa">
      <input type="text" id="inputTarefa" placeholder="Nova tarefa...">
      <select id="selectPrioridade">
        <option value="media">Prioridade Media</option>
        <option value="alta">Prioridade Alta</option>
        <option value="baixa">Prioridade Baixa</option>
      </select>
      <button type="submit">Salvar</button>
    </form>

    <div class="barra-info">
      <span id="resumoTarefas">0 pendentes / 0 concluídas</span>
      <button type="button" id="btnLimparConcluidas">Limpar concluídas</button>
    </div>

    <ul id="listaTarefas"></ul>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
