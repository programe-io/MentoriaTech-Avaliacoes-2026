<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Estoque</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="caixa">
    <h1>Controle de Estoque</h1>
    <p class="subtitulo">Cadastre produtos, ajuste quantidades e veja o status.</p>

    <div class="linha">
      <input type="text" id="produtoInput" placeholder="Nome do produto">
      <input type="number" id="qtdInput" placeholder="Qtd" min="0">
      <button type="button" onclick="adicionarItem()">Adicionar</button>
    </div>

    <div class="linha">
      <input type="text" id="filtroInput" placeholder="Filtrar por nome...">
      <button type="button" onclick="aplicarFiltro()">Filtrar</button>
      <button type="button" onclick="mostrarTudo()">Todos</button>
    </div>

    <p id="aviso" class="aviso"></p>
    <div id="listaProdutos"></div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
