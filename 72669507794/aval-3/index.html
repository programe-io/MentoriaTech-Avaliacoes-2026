<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Ficha de Anamnese</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <h1>Ficha de Anamnese</h1>
    <p class="subtitulo">Registro de pacientes, queixas e acompanhamento.</p>

    <form id="formFicha">
      <div class="campo">
        <label for="nomePaciente">Nome do paciente</label>
        <input type="text" id="nomePaciente" placeholder="Ex: Lucas Silva">
      </div>

      <div class="linha-dupla">
        <div class="campo">
          <label for="idadePaciente">Idade</label>
          <input type="number" id="idadePaciente" min="1" max="120">
        </div>

        <div class="campo">
          <label for="queixaPaciente">Queixa principal</label>
          <input type="text" id="queixaPaciente" placeholder="Ex: Dor nas costas">
        </div>
      </div>

      <div class="campo">
        <label for="historicoPaciente">Historico / observacoes</label>
        <textarea id="historicoPaciente" rows="3" placeholder="Alergias, remedios, rotina..."></textarea>
      </div>

      <p id="msgErro" class="erro" hidden></p>
      <button type="submit">Salvar ficha</button>
    </form>

    <section class="lista-area">
      <h2>Fichas salvas (<span id="contadorFichas">0</span>)</h2>

      <div class="controles">
        <input type="text" id="buscarFicha" placeholder="Buscar paciente ou queixa...">
        <button type="button" data-status="todas" class="filtro-ativo">Todas</button>
        <button type="button" data-status="ativa">Ativas</button>
        <button type="button" data-status="concluida">Concluidas</button>
      </div>

      <div id="containerFichas"></div>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
