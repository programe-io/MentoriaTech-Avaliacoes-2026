<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Controle de Tarefas - 2 Trimestre</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="tela">
    <h1>Minhas Tarefas</h1>
    <p class="descricao">Adicione tarefas, marque como feitas e acompanhe o total.</p>

    <div class="entrada">
      <input type="text" id="novaTarefa" placeholder="Digite uma tarefa...">
      <button type="button" onclick="adicionarTarefa()">Adicionar</button>
    </div>

    <div class="filtros">
      <button type="button" onclick="mudarFiltro('todas')">Todas</button>
      <button type="button" onclick="mudarFiltro('pendentes')">Pendentes</button>
      <button type="button" onclick="mudarFiltro('feitas')">Feitas</button>
    </div>

    <ul id="lista"></ul>
    <p id="resumo"></p>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
