<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📋 Gerenciador de Tarefas</h1>
        <p>Organize suas atividades de maneira simples!</p>
    </header>

    <main>

        <section class="card">
            <h2>➕ Cadastrar Nova Tarefa</h2>

            <input type="number" id="codigo" placeholder="Código de identificação">

            <input type="text" id="titulo" placeholder="Título da tarefa">

            <select id="prioridade">
                <option value="">Selecione a prioridade</option>
                <option value="Alta">Alta</option>
                <option value="Média">Média</option>
                <option value="Baixa">Baixa</option>
            </select>

            <button onclick="cadastrarTarefa()">
                Cadastrar Tarefa
            </button>
        </section>

        <section class="card">
            <h2>🔎 Consultar Tarefa</h2>

            <input type="number" id="consultaCodigo"
                   placeholder="Digite o código da tarefa">

            <button onclick="consultarTarefa()">
                Consultar
            </button>

            <div id="resultadoConsulta"></div>
        </section>

        <section class="card">
            <h2>✅ Concluir Tarefa</h2>

            <input type="number" id="codigoConclusao"
                   placeholder="Código da tarefa">

            <button onclick="concluirTarefa()">
                Marcar como Concluída
            </button>
        </section>

        <section class="card">
            <h2>📝 Lista de Tarefas</h2>

            <button onclick="listarTarefas()">
                Atualizar Lista
            </button>

            <div id="listaTarefas">
                <p>Nenhuma tarefa cadastrada.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 - Gerenciador de Tarefas | Projeto JavaScript</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
