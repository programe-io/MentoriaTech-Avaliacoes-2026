<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuga do Campo Minado</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div id="lobby" class="screen">
        <div class="cover-content">
            <h1>FUGA DO CAMPO MINADO</h1>
            <p class="subtitle">Encontre a saída... se puder.</p>
            <div class="mine-animation">💣</div>
            <p class="blink-text">Pressione QUALQUER TECLA para iniciar</p>
        </div>
    </div>

    <div id="difficulty-screen" class="screen hidden">
        <h2>Selecione a Dificuldade</h2>
        <div class="menu-buttons">
            <button onclick="startGame('facil')">Fácil <span class="desc">Mapa reduzido, poucas bombas</span></button>
            <button onclick="startGame('normal')">Normal <span class="desc">Mapa médio, desafio moderado</span></button>
            <button onclick="startGame('dificil')">Difícil <span class="desc">Mapa grande, bombas estratégicas</span></button>
        </div>
        <div class="controls-info">
            <p><strong>Controles:</strong> E (Cima) | S (Esquerda) | D (Baixo) | F (Direita)</p>
        </div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="game-header">
            <span id="level-indicator">Nível: Fácil</span>
            <button onclick="backToMenu()">Sair</button>
        </div>
        
        <div id="board-container">
            <div id="game-board"></div>
        </div>

        <div id="game-message" class="hidden"></div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
