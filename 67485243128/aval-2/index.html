<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .grid-forms {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #34495e;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .btn-update {
            background-color: #e67e22;
        }

        .btn-update:hover {
            background-color: #d35400;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .empty-msg {
            text-align: center;
            color: #888;
            padding: 20px 0;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h1>Sistema de Controle de Estoque</h1>

    <div class="grid-forms">
        <!-- FORMULÁRIO 1: Cadastrar Produto -->
        <div class="card">
            <h2>Cadastrar Produto</h2>
            <form id="formCadastro">
                <div class="form-group">
                    <label for="cadCodigo">Código</label>
                    <input type="text" id="cadCodigo" required>
                </div>
                <div class="form-group">
                    <label for="cadDescricao">Descrição</label>
                    <input type="text" id="cadDescricao" required>
                </div>
                <div class="form-group">
                    <label for="cadQtd">Quantidade</label>
                    <input type="number" id="cadQtd" min="0" required>
                </div>
                <div class="form-group">
                    <label for="cadValor">Valor (R$)</label>
                    <input type="number" id="cadValor" step="0.01" min="0" required>
                </div>
                <button type="submit">Cadastrar</button>
            </form>
        </div>

        <!-- FORMULÁRIO 2: Alterar Valor -->
        <div class="card">
            <h2>Alterar Valor</h2>
            <form id="formValor">
                <div class="form-group">
                    <label for="valCodigo">Código do Produto</label>
                    <input type="text" id="valCodigo" required>
                </div>
                <div class="form-group">
                    <label for="novoValor">Novo Valor (R$)</label>
                    <input type="number" id="novoValor" step="0.01" min="0" required>
                </div>
                <button type="submit" class="btn-update">Atualizar Valor</button>
            </form>
        </div>

        <!-- FORMULÁRIO 3: Alterar Quantidade -->
        <div class="card">
            <h2>Alterar Quantidade</h2>
            <form id="formQtd">
                <div class="form-group">
                    <label for="qtdCodigo">Código do Produto</label>
                    <input type="text" id="qtdCodigo" required>
                </div>
                <div class="form-group">
                    <label for="novaQtd">Nova Quantidade</label>
                    <input type="number" id="novaQtd" min="0" required>
                </div>
                <button type="submit" class="btn-update">Atualizar Quantidade</button>
            </form>
        </div>
    </div>

    <!-- LISTA DE PRODUTOS -->
    <div class="card">
        <h2>Produtos Cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor Un. (R$)</th>
                    <th>Subtotal (R$)</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                <!-- Conteúdo gerado via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Estrutura de dados para armazenar os produtos
    const estoque = [];

    // Função para atualizar a tabela na tela
    function listarProdutos() {
        const tbody = document.getElementById('tabelaCorpo');
        tbody.innerHTML = '';

        if (estoque.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">Nenhum produto cadastrado no estoque.</td></tr>';
            return;
        }

        estoque.forEach(produto => {
            const tr = document.createElement('tr');
            const subtotal = produto.quantidade * produto.valor;
            tr.innerHTML = `
                <td>${produto.codigo}</td>
                <td>${produto.descricao}</td>
                <td>${produto.quantidade}</td>
                <td>R$ ${produto.valor.toFixed(2)}</td>
                <td>R$ ${subtotal.toFixed(2)}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 1. Cadastrar um novo produto
    document.getElementById('formCadastro').addEventListener('submit', function(e) {
        e.preventDefault();

        const codigo = document.getElementById('cadCodigo').value.trim();
        const descricao = document.getElementById('cadDescricao').value.trim();
        const quantidade = parseInt(document.getElementById('cadQtd').value, 10);
        const valor = parseFloat(document.getElementById('cadValor').value);

        // Verifica duplicidade de código
        const jaExiste = estoque.some(p => p.codigo === codigo);
        if (jaExiste) {
            alert('Erro: Já existe um produto cadastrado com este código!');
            return;
        }

        estoque.push({ codigo, descricao, quantidade, valor });
        listarProdutos();
        this.reset();
    });

    // 2. Alterar o valor de um produto
    document.getElementById('formValor').addEventListener('submit', function(e) {
        e.preventDefault();

        const codigo = document.getElementById('valCodigo').value.trim();
        const novoValor = parseFloat(document.getElementById('novoValor').value);

        const produto = estoque.find(p => p.codigo === codigo);

        if (!produto) {
            alert('Erro: Produto não encontrado!');
            return;
        }

        produto.valor = novoValor;
        listarProdutos();
        alert('Valor atualizado com sucesso!');
        this.reset();
    });

    // 3. Alterar a quantidade de um produto
    document.getElementById('formQtd').addEventListener('submit', function(e) {
        e.preventDefault();

        const codigo = document.getElementById('qtdCodigo').value.trim();
        const novaQtd = parseInt(document.getElementById('novaQtd').value, 10);

        const produto = estoque.find(p => p.codigo === codigo);

        if (!produto) {
            alert('Erro: Produto não encontrado!');
            return;
        }

        produto.quantidade = novaQtd;
        listarProdutos();
        alert('Quantidade atualizada com sucesso!');
        this.reset();
    });

    // Inicializa a tabela vazia ao carregar a página
    listarProdutos();
</script>

<script src="script.js"></script></body>
</html>
