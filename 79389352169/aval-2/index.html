
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Mini<span>Feed</span></h1>
    <p>Compartilhe seus momentos!</p>
</header>

<main>

    <section class="create-post">
        <h2>Criar publicação</h2>

        <input type="text" id="username" placeholder="Seu nome">
        <textarea id="postText" placeholder="O que você está pensando?"></textarea>
        <input type="text" id="imageUrl" placeholder="URL da imagem (opcional)">

        <button id="publishBtn">Publicar</button>
    </section>

    <section class="feed">
        <h2>Feed de publicações</h2>
        <div id="posts">

            <article class="post">
                <div class="post-header">
                    <div class="avatar">J</div>
                    <div>
                        <h3>João Silva</h3>
                        <small>Há 10 minutos</small>
                    </div>
                </div>

                <p class="post-text">Hoje foi dia de aproveitar e curtir a vida! 😎</p>

                <img class="post-image"
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900"
                alt="Paisagem">

                <div class="post-actions">
                    <button class="like-btn">♡ Curtir <span>0</span></button>
                    <button class="comment-toggle">💬 Comentar</button>
                </div>

                <div class="comments">
                    <div class="comment-list"></div>
                    <div class="comment-form">
                        <input type="text" placeholder="Escreva um comentário...">
                        <button class="send-comment">Enviar</button>
                    </div>
                </div>
            </article>

            <article class="post">
                <div class="post-header">
                    <div class="avatar avatar-blue">M</div>
                    <div>
                        <h3>Maria Oliveira</h3>
                        <small>Há 30 minutos</small>
                    </div>
                </div>

                <p class="post-text">Nunca desista dos seus sonhos! 💪🔥</p>

                <img class="post-image"
                src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=900"
                alt="Academia">

                <div class="post-actions">
                    <button class="like-btn">♡ Curtir <span>0</span></button>
                    <button class="comment-toggle">💬 Comentar</button>
                </div>

                <div class="comments">
                    <div class="comment-list"></div>
                    <div class="comment-form">
                        <input type="text" placeholder="Escreva um comentário...">
                        <button class="send-comment">Enviar</button>
                    </div>
                </div>
            </article>

        </div>
    </section>

</main>

<footer>
    <p>© 2026 MiniFeed - Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
