<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Estoque</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="container">
    <header>
      <h1>Gerenciador de Estoque</h1>
      <p>Controle seus produtos de maneira simples.</p>
    </header>

    <section class="card">
      <h2>Cadastrar produto</h2>

      <form id="formProduto">
        <label>Descrição do produto</label>
        <input type="text" id="descricao" placeholder="Nome do produto">

        <label>Quantidade</label>
        <input type="number" id="quantidade" placeholder="Quantidade">

        <label>Valor (R\$)</label>
        <input type="number" id="valor" placeholder="Valor do produto" step="0.01">

        <button type="submit">Cadastrar produto</button>
      </form>

      <p id="mensagem"></p>
    </section>

    <section class="card">
      <h2>Produtos cadastrados</h2>

      <div class="resumo">
        <span>Total de produtos:</span>
        <strong id="totalProdutos">0</strong>
      </div>

      <div id="listaProdutos"></div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>$0
