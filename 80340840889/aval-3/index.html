
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacygram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="app">

    <aside class="sidebar">
        <h1 class="logo">Jacygram</h1>

        <nav>
            <button onclick="mostrarPagina('inicio')">🏠 Início</button>
            <button onclick="mostrarPagina('explorar')">🔎 Explorar</button>
            <button onclick="mostrarPagina('reels')">🎬 Reels</button>
            <button onclick="mostrarPagina('mensagens')">✉️ Mensagens</button>
            <button onclick="mostrarPagina('notificacoes')">❤️ Notificações</button>
            <button onclick="mostrarPagina('perfil')">👤 Perfil</button>
        </nav>

        <div class="sidebar-user">
            <img src="https://i.pravatar.cc/150?img=47">
            <div>
                <strong>jacy.oficial</strong>
                <small>Perfil principal</small>
            </div>
        </div>
    </aside>

    <main class="main">

        <section id="inicio" class="pagina ativa">

            <div class="stories" id="stories"></div>

            <section class="criar">
                <img src="https://i.pravatar.cc/150?img=47">
                <input id="novaLegenda" placeholder="Compartilhe um momento...">
                <button onclick="criarPost()">Publicar</button>
            </section>

            <div id="feed"></div>

        </section>

        <section id="explorar" class="pagina">
            <h2>Explorar 🔎</h2>
            <div class="explorar-grid" id="explorarGrid"></div>
        </section>

        <section id="reels" class="pagina">
            <h2>Reels 🎬</h2>
            <div id="reelsFeed"></div>
        </section>

        <section id="mensagens" class="pagina">
            <h2>Mensagens 💬</h2>
            <div class="mensagens-layout">
                <div class="lista-contatos" id="contatos"></div>

                <div class="conversa">
                    <h3 id="nomeConversa">Escolha um amigo</h3>
                    <div id="chatMensagens"></div>

                    <div class="enviar-mensagem">
                        <input id="textoMensagem"
                               placeholder="Digite uma mensagem...">
                        <button onclick="enviarMensagem()">Enviar</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="notificacoes" class="pagina">
            <h2>Notificações ❤️</h2>
            <div id="notificacoesFeed"></div>
        </section>

        <section id="perfil" class="pagina">
            <div class="perfil">
                <img src="https://i.pravatar.cc/150?img=47">
                <div>
                    <h2>jacy.oficial 👑</h2>
                    <p>Amizade, momentos e muitas histórias ❤️</p>
                    <div class="estatisticas">
                        <span><strong id="totalPosts">0</strong> publicações</span>
                        <span><strong>4</strong> amigos</span>
                        <span><strong>5</strong> integrantes</span>
                    </div>
                </div>
            </div>

            <h3>Publicações</h3>
            <div class="explorar-grid" id="perfilGrid"></div>
        </section>

    </main>

    <aside class="sugestoes">
        <h3>Seus amigos</h3>
        <div id="amigos"></div>

        <h3>Conversas do grupo</h3>
        <p>Jacy, Abner, Jatan, Alvaro e Kaiky ❤️</p>
    </aside>

</div>

<div id="modalStory" class="modal" onclick="fecharStory()">
    <div class="story-content" onclick="event.stopPropagation()">
        <button onclick="fecharStory()">✕</button>
        <img id="storyFoto" src="">
        <h2 id="storyNome"></h2>
        <p id="storyTexto"></p>
    </div>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
