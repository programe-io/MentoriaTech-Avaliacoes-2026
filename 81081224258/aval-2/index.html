
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="feed">
        <h2>Meu Feed</h2>

        <div class="post">
            <div class="user">
                <div class="avatar">JS</div>
                <div class="user-info">
                    <strong>bob marley</strong>
                    <small>Há 10 minutos</small>
                </div>
            </div>

            <p>
                Olá pessoal! Hoje estou compartilhando
                uma novidade incrível. 🚀
            </p>

            <div class="actions">
                <span>❤️ Curtir</span>
                <span>💬 Comentar</span>
                <span>↗ Compartilhar</span>
            </div>
        </div>

        <div class="post">
            <div class="user">
                <div class="avatar avatar-orange">MA</div>
                <div class="user-info">
                    <strong>angelina july</strong>
                    <small>Há 1 hora</small>
                </div>
            </div>

            <p>Aproveitando um dia maravilhoso! ☀️✨</p>

            <img
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800"
                alt="Paisagem natural"
            >

            <div class="actions">
                <span>❤️ Curtir</span>
                <span>💬 Comentar</span>
                <span>↗ Compartilhar</span>
            </div>
        </div>
    </div>

</body>
</html>
