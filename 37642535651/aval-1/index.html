
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <div class="formulario">
            <h2>Novo Produto</h2>

            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" placeholder="Digite a descrição">

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" placeholder="Digite a quantidade">

            <label for="valor">Valor:</label>
            <input type="number" id="valor" step="0.01" placeholder="Digite o valor">

            <button onclick="cadastrarProdutoHTML()">Cadastrar Produto</button>
            <button onclick="listarProdutosHTML()">Listar Produtos</button>
        </div>

        <div class="formulario">
            <h2>Atualizar Produto</h2>

            <label for="codigo">Código do Produto:</label>
            <input type="number" id="codigo" placeholder="Digite o código">

            <label for="novoValor">Novo Valor:</label>
            <input type="number" id="novoValor" step="0.01" placeholder="Digite o novo valor">

            <button onclick="atualizarValorHTML()">Atualizar Valor</button>

            <label for="novaQuantidade">Adicionar Quantidade:</label>
            <input type="number" id="novaQuantidade" placeholder="Digite a quantidade">

            <button onclick="atualizarQuantidadeHTML()">Atualizar Quantidade</button>
        </div>

        <div class="resultado">
            <h2>Produtos Cadastrados</h2>
            <div id="listaProdutos"></div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
