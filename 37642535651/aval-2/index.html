
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Gerenciamento de Tarefas</h1>

        <div class="formulario">
            <h2>Cadastrar Tarefa</h2>

            <label for="titulo">Título da tarefa:</label>
            <input type="text" id="titulo" placeholder="Digite o título da tarefa">

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade">
                <option value="1">1 - Baixa</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Alta</option>
            </select>

            <button onclick="cadastrarTarefaHTML()">
                Cadastrar Tarefa
            </button>
        </div>

        <div class="formulario">
            <h2>Gerenciar Tarefas</h2>

            <label for="codigo">Código da tarefa:</label>
            <input type="number" id="codigo" placeholder="Digite o código">

            <label for="novaPrioridade">Nova prioridade:</label>
            <select id="novaPrioridade">
                <option value="1">1 - Baixa</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Alta</option>
            </select>

            <button onclick="concluirTarefaHTML()">
                Concluir Tarefa
            </button>

            <button onclick="alterarPrioridadeHTML()">
                Alterar Prioridade
            </button>

            <button onclick="listarTarefasHTML()">
                Listar Tarefas
            </button>
        </div>

        <div class="resultado">
            <h2>Lista de Tarefas</h2>
            <div id="listaTarefas"></div>
        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
