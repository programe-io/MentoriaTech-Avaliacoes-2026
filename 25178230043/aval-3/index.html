
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Controle de IMC</h1>
        <p class="descricao">Sistema de cálculo do Índice de Massa Corporal</p>

        <div class="formulario">
            <label for="nome">Nome do paciente</label>
            <input type="text" id="nome" placeholder="Digite o nome">

            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso" placeholder="Ex: 70">

            <label for="altura">Altura (m)</label>
            <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75">

            <button onclick="calcularIMC()">Calcular IMC</button>
        </div>

        <div id="resultado" class="resultado">
            <h2>Resultado</h2>
            <p>Preencha os dados para calcular o IMC.</p>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
