<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Controle de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header class="header">
        <div>
            <h1>Controle de Estoque</h1>
            <p>CRUD de produtos</p>
        </div>
    </header>

    <main class="container">

        <!-- DASHBOARD -->
        <section class="dashboard">

            <div class="card">
                <span>Total de produtos</span>
                <strong id="totalProdutos">0</strong>
            </div>

            <div class="card">
                <span>Itens em estoque</span>
                <strong id="totalEstoque">0</strong>
            </div>

            <div class="card alerta">
                <span>Estoque baixo</span>
                <strong id="estoqueBaixo">0</strong>
            </div>

        </section>

        <!-- FORMULÁRIO -->
        <section class="form-section">

            <h2 id="tituloFormulario">Cadastrar produto</h2>

            <form id="produtoForm">

                <input type="hidden" id="produtoId">

                <div class="form-grid">

                    <div class="campo">
                        <label for="nome">Nome do produto</label>
                        <input
                            type="text"
                            id="nome"
                            placeholder="Ex: Teclado"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="categoria">Categoria</label>
                        <input
                            type="text"
                            id="categoria"
                            placeholder="Ex: Informática"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="preco">Preço</label>
                        <input
                            type="number"
                            id="preco"
                            placeholder="0,00"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="quantidade">Quantidade</label>
                        <input
                            type="number"
                            id="quantidade"
                            placeholder="0"
                            min="0"
                            required
                        >
                    </div>

                </div>

                <div class="botoes">

                    <button type="submit" class="btn btn-primary">
                        Salvar produto
                    </button>

                    <button
                        type="button"
                        id="btnCancelar"
                        class="btn btn-secondary"
                        onclick="cancelarEdicao()"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </section>

        <!-- LISTAGEM -->
        <section class="lista-section">

            <div class="lista-header">
                <h2>Produtos cadastrados</h2>

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar produto..."
                >
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaProdutos">
                    </tbody>

                </table>

            </div>

            <div id="semProdutos" class="sem-produtos">
                Nenhum produto cadastrado.
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 - Sistema de Controle de Estoque</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
