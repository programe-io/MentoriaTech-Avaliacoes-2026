
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaMini</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <div class="logo">InstaMini</div>
    <input class="search" placeholder="Pesquisar">
    <nav>
      <span>⌂</span>
      <span>✉</span>
      <span>＋</span>
      <span>♡</span>
      <span>👤</span>
    </nav>
  </header>

  <div class="container">
    <main>

      <section class="stories">
        <div class="story">
          <img src="https://i.pravatar.cc/100?img=1">
          <p>Seu story</p>
        </div>
        <div class="story">
          <img src="https://i.pravatar.cc/100?img=2">
          <p>mariana</p>
        </div>
        <div class="story">
          <img src="https://i.pravatar.cc/100?img=3">
          <p>pedro</p>
        </div>
        <div class="story">
          <img src="https://i.pravatar.cc/100?img=4">
          <p>juliana</p>
        </div>
        <div class="story">
          <img src="https://i.pravatar.cc/100?img=5">
          <p>lucas</p>
        </div>
      </section>

      <section class="create">
        <h3>Nova publicação</h3>
        <input type="text" id="imageUrl" placeholder="URL da imagem">
        <input type="text" id="caption" placeholder="Escreva uma legenda...">
        <button onclick="createPost()">Publicar</button>
      </section>

      <section id="feed">

        <article class="post">
          <div class="post-header">
            <img src="https://i.pravatar.cc/100?img=12">
            <strong>mariana.silva</strong>
          </div>

          <img class="post-image"
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900">

          <div class="post-actions">
            <span onclick="like(this)">♡</span>
            <span onclick="focusComment(this)">💬</span>
            <span>➤</span>
          </div>

          <div class="post-info">
            <strong class="likes">120 curtidas</strong>
            <p><strong>mariana.silva</strong> Aproveitando o dia! ☀️</p>
            <div class="comments"></div>
          </div>

          <div class="comment-area">
            <input placeholder="Adicione um comentário...">
            <button onclick="comment(this)">Publicar</button>
          </div>
        </article>

        <article class="post">
          <div class="post-header">
            <img src="https://i.pravatar.cc/100?img=15">
            <strong>pedro.dev</strong>
          </div>

          <img class="post-image"
            src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=900">

          <div class="post-actions">
            <span onclick="like(this)">♡</span>
            <span onclick="focusComment(this)">💬</span>
            <span>➤</span>
          </div>

          <div class="post-info">
            <strong class="likes">85 curtidas</strong>
            <p><strong>pedro.dev</strong> Que vista incrível! 🌎</p>
            <div class="comments"></div>
          </div>

          <div class="comment-area">
            <input placeholder="Adicione um comentário...">
            <button onclick="comment(this)">Publicar</button>
          </div>
        </article>

      </section>
    </main>

    <aside class="sidebar">
      <div class="profile">
        <img src="https://i.pravatar.cc/100?img=11">
        <div>
          <strong>seu_usuario</strong>
          <p>Seu perfil</p>
        </div>
      </div>

      <h4>Sugestões para você</h4>

      <div class="suggestion">
        <strong>carolina_</strong>
        <button onclick="follow(this)">Seguir</button>
      </div>

      <div class="suggestion">
        <strong>matheus.dev</strong>
        <button onclick="follow(this)">Seguir</button>
      </div>

      <div class="suggestion">
        <strong>amanda_fotos</strong>
        <button onclick="follow(this)">Seguir</button>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
