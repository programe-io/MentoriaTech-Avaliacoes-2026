<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Feed Social</title>
    <style>
        /* Estilização básica para o Feed */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        \}

        .feed-container {
            max-width: 600px;
            width: 100%;
        \}

        /* Estrutura de cada Post */
        .post {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            padding: 15px;
        \}

        /* Cabeçalho do Post */
        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        \}

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #ccc;
            margin-right: 10px;
        \}

        .user-info .username {
            font-weight: bold;
            display: block;
            color: #050505;
        \}

        .user-info .timestamp {
            font-size: 12px;
            color: #65676b;
        \}

        /* Conteúdo do Post */
        .post-content {
            font-size: 15px;
            color: #050505;
            line-height: 1.4;
            margin-bottom: 12px;
        \}

        .post-image {
            width: 100%;
            border-radius: 6px;
            margin-top: 8px;
        \}

        /* Botões de Interação */
        .post-actions {
            display: flex;
            border-top: 1px solid #e4e6eb;
            padding-top: 10px;
            justify-content: space-around;
        \}

        .action-btn {
            background: none;
            border: none;
            color: #65676b;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 4px;
        \}

        .action-btn:hover {
            background-color: #f2f2f2;
            color: #1877f2;
        \}
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="feed-container">

        <!-- Postagem 1: Apenas Texto -->
        <article class="post">
            <header class="post-header">
                <div class="avatar"></div>
                <div class="user-info">
                    <span class="username">Ana Silva</span>
                    <span class="timestamp">Há 2 horas</span>
                </div>
            </header>
            <div class="post-content">
                <p>Acabei de começar a estudar desenvolvimento web! Muito animada para aprender HTML e CSS. 🚀💻</p>
            </div>
            <footer class="post-actions">
                <button class="action-btn">Curtir</button>
                <button class="action-btn">Comentar</button>
                <button class="action-btn">Compartilhar</button>
            </footer>
        </article>

        <!-- Postagem 2: Texto e Imagem -->
        <article class="post">
            <header class="post-header">
                <div class="avatar"></div>
                <div class="user-info">
                    <span class="username">Carlos Souza</span>
                    <span class="timestamp">Há 5 horas</span>
                </div>
            </header>
            <div class="post-content">
                <p>Olha que vista incrível do escritório hoje de manhã!</p>
                <!-- Substitua o link abaixo pela URL da sua imagem -->
                <img src="https://picsum.photos" alt="Imagem do feed" class="post-image">
            </div>
            <footer class="post-actions">
                <button class="action-btn">Curtir</button>
                <button class="action-btn">Comentar</button>
                <button class="action-btn">Compartilhar</button>
            </footer>
        </article>

    </main>

</body>
</html>
