
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <h1>Jogo da Velha</h1>
        <p class="subtitulo">Desafie um amigo!</p>

        <div id="status" aria-live="polite">
            Vez do jogador X
        </div>

        <div class="tabuleiro" id="tabuleiro">
            <button class="casa" data-index="0" aria-label="Casa 1"></button>
            <button class="casa" data-index="1" aria-label="Casa 2"></button>
            <button class="casa" data-index="2" aria-label="Casa 3"></button>
            <button class="casa" data-index="3" aria-label="Casa 4"></button>
            <button class="casa" data-index="4" aria-label="Casa 5"></button>
            <button class="casa" data-index="5" aria-label="Casa 6"></button>
            <button class="casa" data-index="6" aria-label="Casa 7"></button>
            <button class="casa" data-index="7" aria-label="Casa 8"></button>
            <button class="casa" data-index="8" aria-label="Casa 9"></button>
        </div>

        <button id="reiniciar" class="botao">
            Reiniciar jogo
        </button>

        <p class="rodape">Feito com HTML, CSS e JavaScript</p>
    </main>

<script src="script.js"></script></body>
</html>
