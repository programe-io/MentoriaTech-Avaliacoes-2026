<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Arena</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>⚔️ BATTLE ARENA ⚔️</h1>
        <p>Prepare-se para a batalha!</p>
    </header>

    <main>

        <section class="arena">

            <!-- JOGADOR -->
            <div class="personagem">
                <h2>🧙 HERÓI</h2>

                <div class="avatar">🧙‍♂️</div>

                <div class="barra">
                    <div id="vidaJogador" class="vida jogadorVida"></div>
                </div>

                <p>Vida: <span id="textoVidaJogador">100</span>/100</p>
            </div>

            <div class="versus">
                <span>VS</span>
            </div>

            <!-- INIMIGO -->
            <div class="personagem">
                <h2>👹 INIMIGO</h2>

                <div class="avatar">👹</div>

                <div class="barra">
                    <div id="vidaInimigo" class="vida inimigoVida"></div>
                </div>

                <p>Vida: <span id="textoVidaInimigo">100</span>/100</p>
            </div>

        </section>

        <section class="mensagem">
            <h2 id="mensagem">Escolha seu ataque!</h2>
        </section>

        <section class="ataques">

            <button onclick="atacar('espada')">
                ⚔️ Espada
            </button>

            <button onclick="atacar('magia')">
                🔥 Magia
            </button>

            <button onclick="atacar('especial')">
                💥 Ataque Especial
            </button>

        </section>

        <button class="reiniciar" onclick="reiniciarJogo()">
            🔄 Reiniciar Jogo
        </button>

    </main>

    <footer>
        <p>🎮 Battle Arena © 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
