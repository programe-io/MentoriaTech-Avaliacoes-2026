<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram • Feed</title>
<meta name="description" content="Recriação responsiva de um feed do Instagram com HTML, Tailwind CSS e CSS.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
<script src="script.js" defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body class="text-neutral-900">
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
<symbol id="comment" viewBox="0 0 24 24"><path d="M21 11.5a9 9 0 1 0-5.1 8.1L22 21l-1.7-5.4a9 9 0 0 0 .7-4.1Z"/></symbol>
<symbol id="send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9L2 9 22 2Z M22 2 11 13"/></symbol>
<symbol id="bookmark" viewBox="0 0 24 24"><path d="M5 21V3h14v18l-7-4-7 4Z"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-8 9 8-3 0v11H6V10H3Z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2H5Z"/></symbol>
<symbol id="menu" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></symbol>
</defs></svg>
<header class="site-header bg-white flex items-center justify-between">
<a class="brand font-bold" href="./">Instagram</a>
<label class="search-field"><span class="sr-only">Pesquisar no feed</span><input id="search-input" type="search" aria-label="Pesquisar no feed"></label>
<nav class="desktop-nav flex items-center" aria-label="Navegação principal">
<a href="./" aria-label="Início"><svg><use href="#home"/></svg></a>
<button aria-label="Pesquisar" id="search-button"><svg><use href="#search"/></svg></button>
<button aria-label="Nova publicação" data-notice="Esta é uma demonstração do feed."><svg><use href="#plus"/></svg></button>
<button aria-label="Atividade" data-notice="Você está em dia com suas notificações."><svg><use href="#heart"/></svg></button>
<button aria-label="Perfil" data-notice="Aluno · CETI Dr. João Carvalho"><svg><use href="#user"/></svg></button>
<button class="account-gradient" aria-label="Trocar conta" data-notice="Você está usando a conta CETI_DrJoaoCarvalho."></button>
</nav>
<button class="mobile-menu" aria-label="Abrir menu" aria-expanded="false"><svg><use href="#menu"/></svg></button>
<div class="menu-panel" hidden><button data-notice="Você está usando a conta CETI_DrJoaoCarvalho.">Meu perfil</button><button data-notice="Você está em dia com suas notificações.">Notificações</button><button id="show-saved">Publicações salvas</button></div>
</header>
<main class="layout">
<section class="feed" aria-label="Feed de publicações">
<div class="stories bg-white flex items-center" aria-label="Stories">
<button class="story" data-notice="Adicione uma foto ao seu story."><span class="add-story">+</span><span>Você</span></button>
<button class="story" data-notice="CETI_DrJoaoCarvalho ainda não publicou novos stories."><span class="story-ring"><img src="https://randomuser.me/api/portraits/men/32.jpg" alt="CETI_DrJoaoCarvalho"></span><span>CETI_DrJoaoCarvalho</span></button>
<button class="story" data-notice="CETI_DrJoaoCarvalho ainda não publicou novos stories."><span class="story-ring"><img src="https://randomuser.me/api/portraits/men/32.jpg" alt="CETI_DrJoaoCarvalho"></span><span>CETI_DrJoaoCarvalho</span></button>
<button class="story" data-notice="CETI_DrJoaoCarvalho ainda não publicou novos stories."><span class="story-ring"><img src="https://randomuser.me/api/portraits/men/32.jpg" alt="CETI_DrJoaoCarvalho"></span><span>CETI_DrJoaoCarvalho</span></button>
</div>
<div id="posts"></div>
<p id="empty-state" hidden>Nenhuma publicação encontrada.</p>
</section>
<aside class="suggestions" aria-label="Sugestões para você">
<div class="my-profile flex items-center"><img class="profile-photo" src="https://randomuser.me/api/portraits/men/32.jpg" alt="Jonathan Willian"><div class="profile-name"><strong>CETI_DrJoaoCarvalho</strong><span>Jonathan Willian</span></div><button class="blue" data-notice="Você está usando a conta CETI_DrJoaoCarvalho.">Trocar</button></div>
<div class="suggestion-heading flex justify-between items-center"><strong>Sugestões para voce</strong><button id="see-all">Ver Tudo</button></div>
<div id="suggested-users"></div>
<footer class="sidebar-footer"><p>Sobre · Ajuda · Imprensa · API · Carreiras · Privacidade · Termos · Localizações · Idioma</p><p>© 2026 INSTAGRAM CLONE – AULA TAILWIND</p></footer>
</aside>
</main>
<div id="toast" role="status" hidden></div>
<dialog id="comments-dialog"><form method="dialog"><button class="close-dialog" aria-label="Fechar">×</button></form><h2>Comentários</h2><p class="comment-intro">Converse sobre esta publicação.</p><div id="comment-list"></div><form id="comment-form"><label for="new-comment" class="sr-only">Seu comentário</label><input id="new-comment" placeholder="Adicione um comentário…" required maxlength="500"><button class="blue">Publicar</button></form></dialog>
<script src="script.js"></script></body>
</html>
