<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurona Ranze (@shark.kurona) • Instagram</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <div class="instagram-container">
        <!-- Cabeçalho do Perfil -->
        <header class="profile-header">
            <div class="profile-pic-container">
                <img src="https://static.wikia.nocookie.net/bluelock/images/8/83/Ranze_Kurona_anime_design.png" alt="Kurona Ranze" class="profile-pic">
            </div>
            
            <div class="profile-info">
                <div class="username-row">
                    <h2>kurona_ranze</h2>
                    <button class="btn-follow" id="followBtn">Seguir</button>
                    <button class="btn-message">Mensagem</button>
                    <i class="fa-solid fa-user-plus"></i>
                </div>

                <div class="stats-row">
                    <div><span class="bold">14</span> publicações</div>
                    <div><span class="bold" id="followersCount">894K</span> seguidores</div>
                    <div><span class="bold">245</span> seguindo</div>
                </div>

                <div class="bio-section">
                    <h1>Kurona Ranze 🦈⚽</h1>
                    <p>Planet's Hotline 🪐⚡<br>Bastard München | Blue Lock #4<br>Velocidade e Passes Rápidos. 🔴🔵</p>
                    <a href="https://bluelock.fandom.com/wiki/Ranze_Kurona" target="_blank" class="bio-link"><i class="fa-solid fa-link"></i> bluelock.fandom.com/wiki/Ranze_Kurona</a>
                </div>
            </div>
        </header>

        <!-- Destaques dos Stories -->
        <div class="highlights-section">
            <div class="highlight-item">
                <div class="highlight-circle">
                    <img src="https://static.wikia.nocookie.net/bluelock/images/a/ae/Ranze_Kurona.png" alt="Treino">
                </div>
                <span>Treinos</span>
            </div>
            <div class="highlight-item">
                <div class="highlight-circle">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <span>Neo Egoist</span>
            </div>
            <div class="highlight-item">
                <div class="highlight-circle">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <span>Tricampeão</span>
            </div>
        </div>

        <!-- Abas do Perfil -->
        <div class="profile-tabs">
            <div class="tab active"><i class="fa-solid fa-table-cells"><span>PUBLICAÇÕES</span></i></div>
            <div class="tab"><i class="fa-solid fa-bookmark"><span>SALVOS</span></i></div>
            <div class="tab"><i class="fa-solid fa-id-card"><span>MARCADOS</span></i></div>
        </div>

        <!-- Grade de Publicações (Feed) -->
        <div class="posts-grid">
            <div class="post-item" onclick="openModal(this)">
                <img src="https://static.wikia.nocookie.net/bluelock/images/8/83/Ranze_Kurona_anime_design.png" alt="Post 1">
                <div class="post-overlay">
                    <span><i class="fa-solid fa-heart"></i> 142K</span>
                    <span><i class="fa-solid fa-comment"></i> 3.5K</span>
                </div>
            </div>
            <div class="post-item" onclick="openModal(this)">
                <img src="https://static.wikia.nocookie.net/bluelock/images/a/ae/Ranze_Kurona.png" alt="Post 2">
                <div class="post-overlay">
                    <span><i class="fa-solid fa-heart"></i> 98K</span>
                    <span><i class="fa-solid fa-comment"></i> 1.2K</span>
                </div>
            </div>
            <div class="post-item" onclick="openModal(this)">
                <img src="https://static.wikia.nocookie.net/bluelock/images/8/83/Ranze_Kurona_anime_design.png" alt="Post 3">
                <div class="post-overlay">
                    <span><i class="fa-solid fa-heart"></i> 210K</span>
                    <span><i class="fa-solid fa-comment"></i> 5.8K</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Visualização da Foto -->
    <div class="modal" id="imageModal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
