<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciamento de Tarefas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .formulario {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, select, button {
            padding: 10px;
            font-size: 16px;
        }

        input {
            flex: 1;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
        }

        button:hover {
            background-color: #0056b3;
        }

        .tarefa {
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
        }

        .concluida {
            background-color: #d4edda;
        }

        .botoes {
            margin-top: 10px;
        }

        .botoes button {
            margin-right: 5px;
        }

        #mensagem {
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Gerenciamento de Tarefas</h1>

        <div class="formulario">

            <input
                type="text"
                id="titulo"
                placeholder="Digite o título da tarefa"
            >

            <select id="prioridade">
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button onclick="cadastrarTarefa()">
                Cadastrar
            </button>

        </div>

        <div id="mensagem"></div>

        <h2>Tarefas cadastradas</h2>

        <div id="listaTarefas"></div>

    </div>


    <script>

        // Lista de tarefas
        let tarefas = [];

        // Código da próxima tarefa
        let proximoCodigo = 1;


        // =====================================
        // CADASTRAR TAREFA
        // =====================================

        function cadastrarTarefa() {

            const titulo = document.getElementById("titulo").value.trim();

            const prioridade = Number(
                document.getElementById("prioridade").value
            );


            // Verifica o tamanho do título
            if (titulo.length < 5) {

                mostrarMensagem(
                    "O título deve ter no mínimo 5 caracteres."
                );

                return;
            }


            // Verifica a prioridade
            if (prioridade < 1 || prioridade > 3) {

                mostrarMensagem(
                    "A prioridade deve estar entre 1 e 3."
                );

                return;
            }


            // Cria a tarefa
            const tarefa = {

                codigo: proximoCodigo,

                titulo: titulo,

                prioridade: prioridade,

                concluida: false

            };


            // Adiciona a tarefa
            tarefas.push(tarefa);

            proximoCodigo++;


            // Limpa o campo
            document.getElementById("titulo").value = "";


            mostrarMensagem("Tarefa cadastrada com sucesso!");

            listarTarefas();
        }


        // =====================================
        // LISTAR TAREFAS
        // =====================================

        function listarTarefas() {

            const lista = document.getElementById("listaTarefas");

            lista.innerHTML = "";


            if (tarefas.length === 0) {

                lista.innerHTML = "<p>Nenhuma tarefa cadastrada.</p>";

                return;
            }


            tarefas.forEach(function(tarefa) {

                let prioridadeTexto;


                if (tarefa.prioridade === 1) {

                    prioridadeTexto = "Alta";

                } else if (tarefa.prioridade === 2) {

                    prioridadeTexto = "Média";

                } else {

                    prioridadeTexto = "Baixa";

                }


                const status = tarefa.concluida
                    ? "Concluída"
                    : "Pendente";


                const div = document.createElement("div");

                div.className = "tarefa";


                if (tarefa.concluida) {

                    div.classList.add("concluida");

                }


                div.innerHTML = `

                    <strong>Código:</strong> ${tarefa.codigo}<br>

                    <strong>Título:</strong> ${tarefa.titulo}<br>

                    <strong>Prioridade:</strong> ${prioridadeTexto}<br>

                    <strong>Status:</strong> ${status}

                    <div class="botoes">

                        <button
                            onclick="concluirTarefa(${tarefa.codigo})"
                        >
                            Concluir
                        </button>

                        <button
                            onclick="alterarPrioridade(${tarefa.codigo})"
                        >
                            Alterar Prioridade
                        </button>

                    </div>
                `;


                lista.appendChild(div);

            });
        }


        // =====================================
        // CONCLUIR TAREFA
        // =====================================

        function concluirTarefa(codigo) {

            const tarefa = tarefas.find(
                tarefa => tarefa.codigo === codigo
            );


            if (!tarefa) {

                mostrarMensagem("Tarefa não encontrada.");

                return;
            }


            tarefa.concluida = true;


            mostrarMensagem(
                "Tarefa marcada como concluída!"
            );


            listarTarefas();
        }


        // =====================================
        // ALTERAR PRIORIDADE
        // =====================================

        function alterarPrioridade(codigo) {

            const tarefa = tarefas.find(
                tarefa => tarefa.codigo === codigo
            );


            if (!tarefa) {

                mostrarMensagem("Tarefa não encontrada.");

                return;
            }


            const novaPrioridade = Number(
                prompt(
                    "Digite a nova prioridade:\n" +
                    "1 - Alta\n" +
                    "2 - Média\n" +
                    "3 - Baixa"
                )
            );


            if (
                novaPrioridade < 1 ||
                novaPrioridade > 3 ||
                isNaN(novaPrioridade)
            ) {

                mostrarMensagem(
                    "Prioridade inválida! Digite 1, 2 ou 3."
                );

                return;
            }


            tarefa.prioridade = novaPrioridade;


            mostrarMensagem(
                "Prioridade alterada com sucesso!"
            );


            listarTarefas();
        }


        // =====================================
        // MENSAGEM
        // =====================================

        function mostrarMensagem(texto) {

            const mensagem = document.getElementById("mensagem");

            mensagem.textContent = texto;


            setTimeout(function() {

                mensagem.textContent = "";

            }, 3000);
        }


        // Exibe as tarefas ao abrir a página
        listarTarefas();

    </script>

<script src="script.js"></script></body>
</html>
