<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glow Beauty - Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>💄 Glow Beauty</h1>
        <p>Sistema de Estoque de Cosméticos</p>
    </header>

    <main class="container">

        <section class="cadastro">

            <h2>✨ Cadastrar Produto</h2>

            <div class="formulario">

                <label for="codigo">Código do produto</label>
                <input
                    type="text"
                    id="codigo"
                    placeholder="Ex: BAT001"
                >

                <label for="descricao">Produto</label>
                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex: Batom Matte Rosa"
                >

                <label for="quantidade">Quantidade</label>
                <input
                    type="number"
                    id="quantidade"
                    placeholder="Ex: 20"
                    min="0"
                >

                <label for="valor">Valor (R$)</label>
                <input
                    type="number"
                    id="valor"
                    placeholder="Ex: 29.90"
                    min="0"
                    step="0.01"
                >

                <button onclick="cadastrarProduto()">
                    💗 Cadastrar Produto
                </button>

            </div>

        </section>


        <section class="estoque">

            <h2>🛍️ Produtos em Estoque</h2>

            <div id="listaProdutos">

                <p>Nenhum produto cadastrado.</p>

            </div>

        </section>

    </main>


    <footer>
        <p>💋 Glow Beauty • Sistema de Estoque</p>
    </footer>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
