<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Avançado</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <!-- Formulário de Cadastro -->
        <div class="form-group">
            <input type="text" id="inputTitulo" placeholder="Título da tarefa (mín. 5 caracteres)" />
            <select id="selectPrioridade">
                <option value="1">Baixa (1)</option>
                <option value="2">Média (2)</option>
                <option value="3">Alta (3)</option>
            </select>
            <button onclick="salvarTarefa()">Cadastrar Tarefa</button>
        </div>

        <!-- Filtros de Exibição -->
        <div class="filtros">
            <button class="btn-filtro ativo" onclick="mudarFiltro('todas')">Todas</button>
            <button class="btn-filtro" onclick="mudarFiltro('pendentes')">Pendentes</button>
            <button class="btn-filtro" onclick="mudarFiltro('concluidas')">Concluídas</button>
        </div>

        <!-- Lista de Tarefas -->
        <ul id="listaTarefas"></ul>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
