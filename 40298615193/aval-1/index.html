
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Cadastro de Produtos</h1>

    <section>
        <h2>Cadastrar Produto</h2>

        <input type="text" id="descricao" placeholder="Descrição">
        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="number" id="valor" placeholder="Valor">

        <button onclick="cadastrarPelaTela()">Cadastrar</button>
    </section>

    <section>
        <h2>Atualizar Valor</h2>

        <input type="number" id="codigoValor" placeholder="Código do produto">
        <input type="number" id="novoValor" placeholder="Novo valor">

        <button onclick="atualizarValorPelaTela()">Atualizar Valor</button>
    </section>

    <section>
        <h2>Atualizar Quantidade</h2>

        <input type="number" id="codigoQuantidade" placeholder="Código do produto">
        <input type="number" id="novaQuantidade" placeholder="Quantidade a adicionar">

        <button onclick="atualizarQuantidadePelaTela()">Atualizar Quantidade</button>
    </section>

    <p id="mensagem"></p>

    <h2>Lista de Produtos</h2>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
            </tr>
        </thead>

        <tbody id="listaProdutos"></tbody>
    </table>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
