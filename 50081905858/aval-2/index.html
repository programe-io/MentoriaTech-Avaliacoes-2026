
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
      
    <header>
        <div class="header-content">
            <h1>MiniFeed</h1>   

            <nav>
                <a href="#">Inicio</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>
       <section class="new-post">
            <div class="user">
                <div class="avatar">
                    G
                </div>

                <div>
                     <strong>Wesley</strong>
                     <span>O que voce esta pensando?</span>
                </div>
            </div>

            <button>Publicar</button>
        </section>

       <article class="post">
            <div class="post-header">
                 <div class="avatar">
                    M
                 </div>

                 <div>
                     <strong>Maria</strong>
                     <span>Há 10 minutos</span>
                 </div> 
            </div>

            <div class="post-text">
                Ontem eu assisti o filme Maze Runner,
                top gostei muito do filme.
            </div>

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRTONW5K30Bz4ErqcX4IBKwEgrCRGtISA8pWq7fVhk42g&s=10" alt="imagem do filme">

            <div class="post-actions">
                <button>curtir</button>
                <button>comentar</button>
            </div>
       </article>
    </main>

    <footer>
       <p>MiniFeed - Todos os direitos reservados - 2026</p>
    </footer>

</html>
