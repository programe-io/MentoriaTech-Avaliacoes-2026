
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0002;
        }

        h1, h2 {
            color: #1e293b;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
        }

        .subtitulo {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            border: none;
            padding: 10px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-cadastrar {
            width: 100%;
            background: #2563eb;
            padding: 13px;
            margin-bottom: 25px;
        }

        .btn-concluir {
            background: #16a34a;
        }

        .btn-alterar {
            background: #ea580c;
        }

        .tarefa {
            background: #f8fafc;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 5px solid #2563eb;
            border-radius: 6px;
        }

        .tarefa.concluida {
            border-left-color: #16a34a;
        }

        .tarefa h3 {
            margin-bottom: 10px;
        }

        .tarefa p {
            margin-bottom: 7px;
            color: #475569;
        }

        .acoes {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .vazio {
            color: #64748b;
            text-align: center;
            padding: 15px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Gerenciador de Tarefas</h1>

        <p class="subtitulo">
            Organize suas tarefas de maneira simples!
        </p>

        <h2>Nova tarefa</h2>

        <input
            type="text"
            id="titulo"
            placeholder="Digite o título da tarefa"
        >

        <select id="prioridade">
            <option value="1">1 - Alta</option>
            <option value="2">2 - Média</option>
            <option value="3">3 - Baixa</option>
        </select>

        <button class="btn-cadastrar" onclick="cadastrarTarefa()">
            Cadastrar tarefa
        </button>

        <h2>Minhas tarefas</h2>

        <div id="listaTarefas">
            <p class="vazio">Nenhuma tarefa cadastrada.</p>
        </div>

    </div>

    <script>
        let tarefas = [];
        let proximoCodigo = 1;

        // CADASTRAR TAREFA
        function cadastrarTarefa() {

            let titulo = document.getElementById("titulo").value.trim();

            let prioridade = Number(
                document.getElementById("prioridade").value
            );

            if (titulo.length < 5) {
                alert("O título precisa ter no mínimo 5 caracteres!");
                return;
            }

            if (![1, 2, 3].includes(prioridade)) {
                alert("Prioridade inválida!");
                return;
            }

            let tarefa = {
                codigo: proximoCodigo,
                titulo: titulo,
                prioridade: prioridade,
                concluida: false
            };

            proximoCodigo++;

            tarefas.push(tarefa);

            document.getElementById("titulo").value = "";

            listarTarefas();
        }

        // LISTAR TAREFAS
        function listarTarefas() {

            let lista = document.getElementById("listaTarefas");

            lista.innerHTML = "";

            if (tarefas.length === 0) {
                lista.innerHTML =
                    '<p class="vazio">Nenhuma tarefa cadastrada.</p>';
                return;
            }

            tarefas.forEach(function(tarefa) {

                let prioridadeTexto = "";

                if (tarefa.prioridade === 1) {
                    prioridadeTexto = "Alta";
                } else if (tarefa.prioridade === 2) {
                    prioridadeTexto = "Média";
                } else {
                    prioridadeTexto = "Baixa";
                }

                let status = tarefa.concluida
                    ? "Concluída"
                    : "Pendente";

                let div = document.createElement("div");

                div.className = "tarefa";

                if (tarefa.concluida) {
                    div.classList.add("concluida");
                }

                let tituloElemento = document.createElement("h3");
                tituloElemento.textContent = tarefa.titulo;

                let codigoElemento = document.createElement("p");
                codigoElemento.textContent = "Código: " + tarefa.codigo;

                let prioridadeElemento = document.createElement("p");
                prioridadeElemento.textContent =
                    "Prioridade: " + prioridadeTexto;

                let statusElemento = document.createElement("p");
                statusElemento.textContent = "Status: " + status;

                div.appendChild(tituloElemento);
                div.appendChild(codigoElemento);
                div.appendChild(prioridadeElemento);
                div.appendChild(statusElemento);

                let acoes = document.createElement("div");
                acoes.className = "acoes";

                let btnConcluir = document.createElement("button");
                btnConcluir.textContent = "Concluir";
                btnConcluir.className = "btn-concluir";

                btnConcluir.disabled = tarefa.concluida;

                btnConcluir.onclick = function() {
                    concluirTarefa(tarefa.codigo);
                };

                let btnAlterar = document.createElement("button");
                btnAlterar.textContent = "Alterar prioridade";
                btnAlterar.className = "btn-alterar";

                btnAlterar.onclick = function() {
                    alterarPrioridade(tarefa.codigo);
                };

                acoes.appendChild(btnConcluir);
                acoes.appendChild(btnAlterar);

                div.appendChild(acoes);

                lista.appendChild(div);

            });
        }

        // CONCLUIR TAREFA
        function concluirTarefa(codigo) {

            let tarefa = tarefas.find(function(t) {
                return t.codigo === codigo;
            });

            if (!tarefa) {
                alert("Tarefa não encontrada!");
                return;
            }

            tarefa.concluida = true;

            listarTarefas();
        }

        // ALTERAR PRIORIDADE
        function alterarPrioridade(codigo) {

            let tarefa = tarefas.find(function(t) {
                return t.codigo === codigo;
            });

            if (!tarefa) {
                alert("Tarefa não encontrada!");
                return;
            }

            let novaPrioridade = prompt(
                "Digite a nova prioridade:\n1 - Alta\n2 - Média\n3 - Baixa"
            );

            if (novaPrioridade === null) {
                return;
            }

            novaPrioridade = Number(novaPrioridade);

            if (![1, 2, 3].includes(novaPrioridade)) {
                alert("Digite apenas 1, 2 ou 3!");
                return;
            }

            tarefa.prioridade = novaPrioridade;

            listarTarefas();
        }

    </script>

<script src="script.js"></script></body>
</html>
