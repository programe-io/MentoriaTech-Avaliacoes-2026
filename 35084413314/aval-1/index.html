
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            box-sizing: border-box;
            border-radius: 5px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #0056b3;
        }

        .produto {
            background: #f8f9fa;
            padding: 12px;
            margin-top: 10px;
            border-left: 4px solid #007bff;
            border-radius: 5px;
        }

        .produto button {
            background: #28a745;
        }

        .produto button.excluir {
            background: #dc3545;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>📦 Sistema de Estoque</h1>

    <h3>Cadastrar Produto</h3>

    <input type="number" id="codigo" placeholder="Código do produto">

    <input type="text" id="descricao" placeholder="Descrição do produto">

    <input type="number" id="quantidade" placeholder="Quantidade">

    <input type="number" id="valor" placeholder="Valor do produto" step="0.01">

    <button onclick="cadastrarProduto()">Cadastrar Produto</button>

    <hr>

    <h3>Produtos Cadastrados</h3>

    <div id="listaProdutos"></div>

</div>

<script>

    let produtos = [];

    // Cadastrar produto
    function cadastrarProduto() {

        let codigo = Number(document.getElementById("codigo").value);
        let descricao = document.getElementById("descricao").value;
        let quantidade = Number(document.getElementById("quantidade").value);
        let valor = Number(document.getElementById("valor").value);

        if (!codigo || !descricao || !Number.isInteger(quantidade) ||
            quantidade < 0 || !Number.isFinite(valor) || valor < 0 ||
            document.getElementById("valor").value === "") {

            alert("Preencha todos os campos corretamente!");
            return;
        }

        let existe = produtos.find(p => p.codigo === codigo);

        if (existe) {
            alert("Código já cadastrado!");
            return;
        }

        produtos.push({
            codigo,
            descricao,
            quantidade,
            valor
        });

        alert("Produto cadastrado com sucesso!");

        limparCampos();
        listarProdutos();
    }

    // Listar produtos
    function listarProdutos() {

        let lista = document.getElementById("listaProdutos");

        lista.innerHTML = "";

        if (produtos.length === 0) {
            lista.innerHTML = "<p>Nenhum produto cadastrado.</p>";
            return;
        }

        produtos.forEach((produto, index) => {

            lista.innerHTML += `
                <div class="produto">

                    <strong>Código:</strong> ${produto.codigo}<br>
                    <strong>Descrição:</strong> ${produto.descricao}<br>
                    <strong>Quantidade:</strong> ${produto.quantidade}<br>
                    <strong>Valor:</strong> R$ ${produto.valor.toFixed(2)}

                    <button onclick="alterarValor(${index})">
                        Alterar Valor
                    </button>

                    <button onclick="alterarQuantidade(${index})">
                        Alterar Quantidade
                    </button>

                    <button class="excluir" onclick="excluirProduto(${index})">
                        Excluir Produto
                    </button>

                </div>
            `;

        });
    }

    // Alterar valor
    function alterarValor(index) {

        let novoValor = prompt("Digite o novo valor:");

        if (novoValor === null || novoValor.trim() === "") return;

        novoValor = Number(novoValor);

        if (!Number.isFinite(novoValor) || novoValor < 0) {
            alert("Digite um valor válido!");
            return;
        }

        produtos[index].valor = novoValor;

        alert("Valor alterado com sucesso!");

        listarProdutos();
    }

    // Alterar quantidade
    function alterarQuantidade(index) {

        let novaQuantidade = prompt("Digite a nova quantidade:");

        if (novaQuantidade === null || novaQuantidade.trim() === "") return;

        novaQuantidade = Number(novaQuantidade);

        if (!Number.isInteger(novaQuantidade) || novaQuantidade < 0) {
            alert("Digite uma quantidade válida!");
            return;
        }

        produtos[index].quantidade = novaQuantidade;

        alert("Quantidade alterada com sucesso!");

        listarProdutos();
    }

    // Excluir produto
    function excluirProduto(index) {

        if (confirm("Deseja excluir este produto?")) {

            produtos.splice(index, 1);

            listarProdutos();

            alert("Produto excluído!");
        }
    }

    // Limpar campos
    function limparCampos() {

        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";

    }

</script>

<script src="script.js"></script></body>
</html>
