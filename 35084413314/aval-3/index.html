<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <h1>Controle de IMC</h1>

        <form id="formImc">
            <input type="text" id="nome" placeholder="Nome do Paciente" required>
            <input type="number" id="peso" placeholder="Peso (kg) - Ex: 70.5" step="0.01" required>
            <input type="number" id="altura" placeholder="Altura (m) - Ex: 1.75" step="0.01" required>
            <button type="submit">Calcular e Cadastrar</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Paciente</th>
                    <th>Peso (kg)</th>
                    <th>Altura (m)</th>
                    <th>IMC</th>
                    <th>Classificação</th>
                </tr>
            </thead>
            <tbody id="tabelaPacientes"></tbody>
        </table>
    </main>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
