
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <!-- Conexão com o CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>📦 Sistema de Estoque</h1>

        <h2>Cadastrar Produto</h2>

        <input type="number" id="codigo" placeholder="Código do produto">

        <input type="text" id="descricao" placeholder="Descrição do produto">

        <input type="number" id="quantidade" placeholder="Quantidade">

        <input type="number" id="valor" placeholder="Valor do produto">

        <button class="btn-cadastrar" onclick="cadastrarProduto()">
            Cadastrar Produto
        </button>

        <hr>

        <h2>Gerenciar Estoque</h2>

        <button class="btn-listar" onclick="listarProdutos()">
            Listar Produtos
        </button>

        <input type="number" id="codigoAlterar" placeholder="Código do produto">

        <input type="number" id="novoValor" placeholder="Novo valor">

        <button class="btn-valor" onclick="alterarValor()">
            Alterar Valor
        </button>

        <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

        <button class="btn-quantidade" onclick="alterarQuantidade()">
            Alterar Quantidade
        </button>

        <hr>

        <h2>Produtos Cadastrados</h2>

        <div id="listaProdutos">
            <p>Nenhum produto listado.</p>
        </div>

    </div>

    <!-- Conexão com o JavaScript -->
    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
