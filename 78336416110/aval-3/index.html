<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram</title>
  <style>
    :root {
      --bg: #ffffff;
      --page-bg: #fafafa;
      --text: #000000;
      --muted: #737373;
      --border: #dbdbdb;
      --light-border: #efefef;
      --blue: #0095f6;
      --like: #ff3040;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--page-bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .shell {
      width: 100%;
      max-width: 470px;
      min-height: 100vh;
      background: var(--bg);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding-bottom: 54px;
    }

    .topbar {
      position: sticky;
      top: 0;
      height: 54px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--light-border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .wordmark {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -0.5px;
      user-select: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      position: relative;
    }

    .icon-btn svg {
      width: 24px;
      height: 24px;
    }

    .badge-dot {
      position: absolute;
      top: 1px;
      right: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--like);
    }

    .stories-row {
      display: flex;
      gap: 14px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--light-border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stories-row::-webkit-scrollbar {
      display: none;
    }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 74px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .story-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .story-item:active .story-ring {
      transform: scale(0.95);
    }

    .story-ring.seen {
      background: #c7c7c7;
    }

    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      border: 2.5px solid #fff;
      background: #eee;
    }

    .story-label {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text);
      max-width: 74px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .post {
      border-bottom: 1px solid var(--light-border);
      padding-bottom: 14px;
    }

    .post-header {
      height: 54px;
      padding: 0 12px 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .post-author {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-avatar-wrap {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      padding: 1.5px;
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
    }

    .post-avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      border: 1.5px solid #fff;
    }

    .post-user-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .username-line {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13.5px;
      font-weight: 600;
    }

    .verified-svg {
      width: 14px;
      height: 14px;
      fill: var(--blue);
      flex-shrink: 0;
    }

    .post-sub {
      font-size: 11.5px;
      color: var(--muted);
    }

    .media-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #111;
      overflow: hidden;
      user-select: none;
    }

    .media-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    .heart-burst {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }

    .heart-burst.show {
      opacity: 1;
      transform: scale(1);
    }

    .heart-burst svg {
      width: 88px;
      height: 88px;
      fill: #fff;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.35));
    }

    .post-actions {
      padding: 10px 14px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .left-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .action-svg {
      width: 24px;
      height: 24px;
    }

    .liked-svg {
      fill: var(--like);
      color: var(--like);
    }

    .likes-line {
      padding: 0 14px 4px;
      font-size: 13.5px;
      font-weight: 600;
    }

    .caption-line {
      padding: 0 14px;
      font-size: 13.5px;
      line-height: 1.4;
    }

    .caption-line strong {
      font-weight: 600;
      margin-right: 4px;
    }

    .comment-item {
      padding: 3px 14px 0;
      font-size: 13px;
    }

    .comment-item strong {
      font-weight: 600;
      margin-right: 4px;
    }

    .comment-form {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px 0;
      margin-top: 6px;
      border-top: 1px solid #f5f5f5;
    }

    .comment-form input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 13px;
      background: transparent;
      color: var(--text);
    }

    .comment-form button {
      background: none;
      border: none;
      color: var(--blue);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .time-ago {
      padding: 6px 14px 0;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--muted);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 470px;
      height: 50px;
      background: var(--bg);
      border-top: 1px solid var(--light-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 20;
    }

    .bottom-nav svg {
      width: 24px;
      height: 24px;
    }

    .story-modal {
      position: fixed;
      inset: 0;
      background: #0b0b0b;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
    }

    .story-modal.open {
      display: flex;
    }

    .story-stage {
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 760px;
      position: relative;
      background: #141414;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    @media (min-width: 480px) {
      .story-stage {
        height: 92vh;
        border-radius: 12px;
      }
    }

    .story-photo-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      z-index: 1;
    }

    .story-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.58) 0%,
        rgba(0, 0, 0, 0.08) 38%,
        rgba(0, 0, 0, 0.68) 100%
      );
      z-index: 2;
      pointer-events: none;
    }

    .story-top {
      position: relative;
      z-index: 4;
      padding: 12px 14px;
    }

    .progress-track {
      height: 2.5px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.05s linear;
    }

    .story-head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
    }

    .story-who {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 600;
    }

    .story-who img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .story-who .s-time {
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
    }

    .story-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
    }

    .tap-zones {
      position: absolute;
      inset: 64px 0 70px 0;
      z-index: 3;
      display: flex;
    }

    .tap-left {
      width: 35%;
      height: 100%;
      cursor: pointer;
    }

    .tap-right {
      width: 65%;
      height: 100%;
      cursor: pointer;
    }

    .story-bottom {
      position: relative;
      z-index: 4;
      padding: 14px 16px 20px;
      color: #fff;
      text-align: center;
    }

    .story-caption-text {
      font-size: 15px;
      font-weight: 500;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
    }

    .toast {
      position: fixed;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #262626;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 80;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="wordmark">Instagram</div>
      <div class="top-actions">
        <button class="icon-btn" title="Curtidas" onclick="showToast('Atividade recente')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span class="badge-dot"></span>
        </button>
        <button class="icon-btn" title="Mensagens" onclick="showToast('Direct em dia')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13"/>
            <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="stories-row" id="storiesRow" aria-label="Stories"></section>

    <main id="feedContainer" aria-label="Feed"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button class="icon-btn" title="Início" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/>
        </svg>
      </button>
      <button class="icon-btn" title="Explorar" onclick="showToast('Explorar')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
      </button>
      <button class="icon-btn" title="Reels" onclick="showToast('Reels')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <path d="M10 8l6 4-6 4V8z"/>
        </svg>
      </button>
      <button class="icon-btn" title="Perfil" onclick="showToast('Perfil')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-3.5 3.6-6 8-6s8 2.5 8 6"/>
        </svg>
      </button>
    </nav>
  </div>

  <div class="story-modal" id="storyModal" onclick="closeStoryModal()">
    <div class="story-stage" id="storyStage" onclick="event.stopPropagation()">
      <img class="story-photo-bg" id="storyPhotoBg" src="" alt="" onerror="handleImgError(this, 'story')" />
      <div class="story-scrim"></div>

      <div class="story-top">
        <div class="progress-track">
          <div class="progress-bar" id="storyProgress"></div>
        </div>
        <div class="story-head-row">
          <div class="story-who">
            <img id="storyAvatar" src="" alt="" onerror="handleImgError(this, 'avatar')" />
            <span id="storyUsername"></span>
            <span id="storyBadge"></span>
            <span class="s-time" id="storyTime"></span>
          </div>
          <button class="story-close" aria-label="Fechar" onclick="closeStoryModal()">&times;</button>
        </div>
      </div>

      <div class="tap-zones">
        <div class="tap-left" onclick="prevStory()"></div>
        <div class="tap-right" onclick="nextStory()"></div>
      </div>

      <div class="story-bottom">
        <div class="story-caption-text" id="storyCaptionText"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const VERIFIED_ICON = `
      <svg class="verified-svg" viewBox="0 0 24 24" aria-label="Verificado">
        <path d="M12 2l2.4 2.1 3.2-.4.7 3.1 2.8 1.6-1.2 2.9 1.2 2.9-2.8 1.6-.7 3.1-3.2-.4L12 22l-2.4-2.1-3.2.4-.7-3.1-2.8-1.6 1.2-2.9-1.2-2.9 2.8-1.6.7-3.1 3.2.4L12 2zm-1.1 13.1l5.2-5.2-1.4-1.4-3.8 3.8-1.8-1.8-1.4 1.4 3.2 3.2z"/>
      </svg>
    `;

    function fallbackSvg(bg1, bg2, tag, label) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="${bg1}"/>
              <stop offset="100%" stop-color="${bg2}"/>
            </linearGradient>
          </defs>
          <rect width="800" height="1000" fill="url(#g)"/>
          <circle cx="400" cy="430" r="145" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
          <text x="400" y="456" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="74" font-weight="700">${tag}</text>
          <text x="400" y="640" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">${label}</text>
        </svg>
      `;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    const FALLBACKS = {
      neymar: fallbackSvg("#0284c7", "#0f172a", "NJ", "neymarjr"),
      ramos: fallbackSvg("#b91c1c", "#1e1b4b", "SR", "sergioramos"),
      bh: fallbackSvg("#dc2626", "#18181b", "BH", "brunohenrique")
    };

    function handleImgError(imgEl, playerKey) {
      if (imgEl.dataset.fallbackApplied) return;
      imgEl.dataset.fallbackApplied = "1";
      imgEl.src = FALLBACKS[playerKey] || FALLBACKS.neymar;
    }

    const photos = {
      neymar: "https://www.sportphotogallery.com/content/images/cmsfiles/product/29887/30501-zoom.jpg",
      ramos: "https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcTy3rvuBxnGScDgHaLVgfiSxBBq0JH6pf9ECbVupD5f26dAuti4pU2PgoeEMi1sSIty1FoMW7ZyN6pjwM0",
      bh: "https://encrypted-tbn2.gstatic.com/licensed-image?q=tbn:ANd9GcSQ4O4Y-y9a--etnVMkdp5h8R6DVFH5t3wjctgGPPaiuFl9noRFSqxjCYe10XXOto-C07utoac4FuvYlz8"
    };

    const stories = [
      {
        id: "neymar",
        key: "neymar",
        username: "neymarjr",
        avatar: photos.neymar,
        photo: photos.neymar,
        caption: "Dia de jogo e foco no campo.",
        time: "1h"
      },
      {
        id: "ramos",
        key: "ramos",
        username: "sergioramos",
        avatar: photos.ramos,
        photo: photos.ramos,
        caption: "Foco e disciplina sempre.",
        time: "3h"
      },
      {
        id: "bh",
        key: "bh",
        username: "brunohenrique",
        avatar: photos.bh,
        photo: photos.bh,
        caption: "Comemorando com a torcida.",
        time: "5h"
      }
    ];

    const posts = [
      {
        id: 1,
        key: "neymar",
        username: "neymarjr",
        location: "Em campo",
        avatar: photos.neymar,
        photo: photos.neymar,
        caption: "Bola no pé e foco total.",
        likes: 482190,
        liked: false,
        saved: false,
        time: "há 2 horas",
        comments: [
          { user: "sergioramos", text: "Vamos irmão" },
          { user: "brunohenrique", text: "Craque demais" }
        ]
      },
      {
        id: 2,
        key: "ramos",
        username: "sergioramos",
        location: "Seleção",
        avatar: photos.ramos,
        photo: photos.ramos,
        caption: "Mais um dia de trabalho.",
        likes: 319400,
        liked: false,
        saved: false,
        time: "há 4 horas",
        comments: [
          { user: "neymarjr", text: "Sempre firme" }
        ]
      },
      {
        id: 3,
        key: "bh",
        username: "brunohenrique",
        location: "Maracanã",
        avatar: photos.bh,
        photo: photos.bh,
        caption: "Fé e trabalho até o fim.",
        likes: 274850,
        liked: false,
        saved: false,
        time: "há 6 horas",
        comments: [
          { user: "neymarjr", text: "Pra cima" }
        ]
      }
    ];

    const seenStories = new Set();
    let activeStoryIndex = 0;
    let storyTimer = null;
    let storyProgressVal = 0;

    function renderStories() {
      const row = document.getElementById("storiesRow");
      row.innerHTML = "";

      stories.forEach((s, index) => {
        const div = document.createElement("div");
        div.className = "story-item";
        div.onclick = () => openStoryAt(index);
        div.innerHTML = `
          <div class="story-ring ${seenStories.has(s.id) ? "seen" : ""}">
            <img src="${s.avatar}" alt="${s.username}" onerror="handleImgError(this, '${s.key}')" />
          </div>
          <span class="story-label">${s.username}</span>
        `;
        row.appendChild(div);
      });
    }

    function openStoryAt(index) {
      activeStoryIndex = index;
      const story = stories[activeStoryIndex];
      seenStories.add(story.id);
      renderStories();

      const bgImg = document.getElementById("storyPhotoBg");
      const avImg = document.getElementById("storyAvatar");
      delete bgImg.dataset.fallbackApplied;
      delete avImg.dataset.fallbackApplied;

      bgImg.onerror = () => handleImgError(bgImg, story.key);
      avImg.onerror = () => handleImgError(avImg, story.key);

      bgImg.src = story.photo;
      avImg.src = story.avatar;
      document.getElementById("storyUsername").textContent = story.username;
      document.getElementById("storyBadge").innerHTML = VERIFIED_ICON;
      document.getElementById("storyTime").textContent = story.time;
      document.getElementById("storyCaptionText").textContent = story.caption;
      document.getElementById("storyModal").classList.add("open");

      startProgress();
    }

    function startProgress() {
      clearInterval(storyTimer);
      storyProgressVal = 0;
      const bar = document.getElementById("storyProgress");
      bar.style.width = "0%";

      storyTimer = setInterval(() => {
        storyProgressVal += 1;
        bar.style.width = `${storyProgressVal}%`;
        if (storyProgressVal >= 100) {
          nextStory();
        }
      }, 50);
    }

    function nextStory() {
      if (activeStoryIndex + 1 < stories.length) {
        openStoryAt(activeStoryIndex + 1);
      } else {
        closeStoryModal();
      }
    }

    function prevStory() {
      if (activeStoryIndex - 1 >= 0) {
        openStoryAt(activeStoryIndex - 1);
      } else {
        startProgress();
      }
    }

    function closeStoryModal() {
      clearInterval(storyTimer);
      document.getElementById("storyModal").classList.remove("open");
    }

    function triggerHeartBurst(postId) {
      const post = posts.find((p) => p.id === postId);
      if (post && !post.liked) {
        post.liked = true;
        post.likes += 1;
        renderFeed();
      }
      const burst = document.getElementById(`burst-${postId}`);
      if (burst) {
        burst.classList.add("show");
        setTimeout(() => burst.classList.remove("show"), 650);
      }
    }

    function toggleLike(postId) {
      const post = posts.find((p) => p.id === postId);
      if (!post) return;
      post.liked = !post.liked;
      post.likes += post.liked ? 1 : -1;
      renderFeed();
    }

    function toggleSave(postId) {
      const post = posts.find((p) => p.id === postId);
      if (!post) return;
      post.saved = !post.saved;
      renderFeed();
      showToast(post.saved ? "Salvo nos itens salvos" : "Removido dos salvos");
    }

    function focusComment(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      if (input) input.focus();
    }

    function addComment(event, postId) {
      event.preventDefault();
      const input = document.getElementById(`comment-input-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      const post = posts.find((p) => p.id === postId);
      if (!post) return;

      post.comments.push({ user: "voce", text });
      input.value = "";
      renderFeed();
    }

    function renderFeed() {
      const container = document.getElementById("feedContainer");
      container.innerHTML = "";

      posts.forEach((p) => {
        const heartSvg = p.liked
          ? `<svg class="action-svg liked-svg" viewBox="0 0 24 24" fill="currentColor">
               <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
             </svg>`
          : `<svg class="action-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
               <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
             </svg>`;

        const bookmarkSvg = p.saved
          ? `<svg class="action-svg" viewBox="0 0 24 24" fill="currentColor">
               <path d="M6 2h12a1 1 0 0 1 1 1v19l-7-4-7 4V3a1 1 0 0 1 1-1z"/>
             </svg>`
          : `<svg class="action-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
               <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
             </svg>`;

        const commentsHtml = p.comments
          .map((c) => `<div class="comment-item"><strong>${c.user}</strong>${c.text}</div>`)
          .join("");

        const article = document.createElement("article");
        article.className = "post";
        article.innerHTML = `
          <div class="post-header">
            <div class="post-author">
              <div class="post-avatar-wrap">
                <img src="${p.avatar}" alt="${p.username}" onerror="handleImgError(this, '${p.key}')" />
              </div>
              <div class="post-user-meta">
                <span class="username-line">${p.username} ${VERIFIED_ICON}</span>
                <span class="post-sub">${p.location}</span>
              </div>
            </div>
            <button class="icon-btn" title="Mais opções" onclick="showToast('Link copiado')">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
              </svg>
            </button>
          </div>

          <div class="media-box" ondblclick="triggerHeartBurst(${p.id})">
            <img src="${p.photo}" alt="Publicação de ${p.username}" onerror="handleImgError(this, '${p.key}')" />
            <div class="heart-burst" id="burst-${p.id}">
              <svg viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
              </svg>
            </div>
          </div>

          <div class="post-actions">
            <div class="left-actions">
              <button class="icon-btn" aria-label="Curtir" onclick="toggleLike(${p.id})">${heartSvg}</button>
              <button class="icon-btn" aria-label="Comentar" onclick="focusComment(${p.id})">
                <svg class="action-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                </svg>
              </button>
              <button class="icon-btn" aria-label="Compartilhar" onclick="showToast('Publicação compartilhada')">
                <svg class="action-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 2L11 13"/>
                  <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
              </button>
            </div>
            <button class="icon-btn" aria-label="Salvar" onclick="toggleSave(${p.id})">${bookmarkSvg}</button>
          </div>

          <div class="likes-line">${p.likes.toLocaleString("pt-BR")} curtidas</div>
          <div class="caption-line"><strong>${p.username}</strong>${p.caption}</div>
          ${commentsHtml}
          <div class="time-ago">${p.time}</div>

          <form class="comment-form" onsubmit="addComment(event, ${p.id})">
            <input
              id="comment-input-${p.id}"
              type="text"
              placeholder="Adicione um comentário..."
              autocomplete="off"
            />
            <button type="submit">Publicar</button>
          </form>
        `;
        container.appendChild(article);
      });
    }

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("visible");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove("visible"), 1800);
    }

    renderStories();
    renderFeed();
  </script>
</body>
</html>
