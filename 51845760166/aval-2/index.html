<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskPro - Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <header>
      <h1>TaskPro</h1>
      <button id="btnTema" onclick="alternarTema()" title="Alternar Tema">🌙</button>
    </header>

    <!-- Barra de Progresso -->
    <div class="progresso-container">
      <div class="progresso-info">
        <span id="textoProgresso">0 de 0 concluídas</span>
        <span id="porcentagemProgresso">0%</span>
      </div>
      <div class="barra-fundo">
        <div id="barraPreenchimento" class="barra-preenchimento"></div>
      </div>
    </div>
    
    <!-- Formulário de Adição -->
    <div class="form-tarefa">
      <input type="text" id="inputTarefa" placeholder="O que precisa ser feito?">
      
      <div class="opcoes-extras">
        <select id="selectCategoria" title="Categoria">
          <option value="Estudos">📚 Estudos</option>
          <option value="Trabalho">💼 Trabalho</option>
          <option value="Treino">💪 Treino</option>
          <option value="Pessoal" selected>🏠 Pessoal</option>
        </select>

        <select id="selectPrioridade" title="Nível de prioridade">
          <option value="baixa">🟢 Baixa</option>
          <option value="media" selected>🟡 Média</option>
          <option value="alta">🔴 Alta</option>
        </select>

        <input type="date" id="inputData" title="Data de prazo">
      </div>

      <button class="btn-adicionar" onclick="adicionarTarefa()">+ Adicionar Tarefa</button>
    </div>

    <!-- Pesquisa e Filtros -->
    <div class="controles-lista">
      <input type="text" id="inputBusca" placeholder="🔍 Buscar tarefa..." oninput="renderizarTarefas()">
      
      <div class="filtros">
        <button class="btn-filtro ativo" onclick="filtrarTarefas('todas', this)">Todas</button>
        <button class="btn-filtro" onclick="filtrarTarefas('pendentes', this)">Pendentes</button>
        <button class="btn-filtro" onclick="filtrarTarefas('concluidas', this)">Concluídas</button>
      </div>
    </div>

    <ul id="listaTarefas"></ul>

    <div class="rodape-acoes">
      <button class="btn-limpar" onclick="limparConcluidas()">🧹 Limpar Concluídas</button>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
