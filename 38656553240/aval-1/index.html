<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
  <h1>Sistema de Estoque</h1>

  <div class="menu">
    <button onclick="abrirFormularioCadastro()">
      Cadastrar produto
    </button>

    <button onclick="listarProdutos()">
      Listar produtos
    </button>

    <button onclick="abrirFormularioValor()">
      Atualizar valor
    </button>

    <button onclick="abrirFormularioQuantidade()">
      Adicionar quantidade
    </button>

    <button class="botao-sair" onclick="sairSistema()">
      Sair
    </button>
  </div>

  <div id="mensagem"></div>

  <section id="areaFormulario"></section>

  <section class="produtos">
    <h2>Produtos cadastrados</h2>
    <div id="listaProdutos">
      <p>Nenhum produto cadastrado.</p>
    </div>
  </section>
</div>
  <script src="script.js"></script>
  
</body>
</html>
