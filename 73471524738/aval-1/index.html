<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
  <h1>Gerenciamento de Estoque</h1>

  <section class="card">
    <h2>Cadastrar Produto</h2>
    <div class="form-group">
      <input type="text" id="descricao" placeholder="Descrição (mín. 5 letras)">
      <input type="number" id="quantidade" placeholder="Quantidade">
      <input type="number" id="valor" step="0.01" placeholder="Valor (R$)">
      <button onclick="acaoCadastrar()">Cadastrar</button>
    </div>
  </section>

  <section class="grid-2">
    <div class="card">
      <h2>Atualizar Valor</h2>
      <input type="number" id="codValor" placeholder="Código do produto">
      <input type="number" id="novoValor" step="0.01" placeholder="Novo valor (R$)">
      <button onclick="acaoAtualizarValor()">Salvar Valor</button>
    </div>

    <div class="card">
      <h2>Adicionar Quantidade</h2>
      <input type="number" id="codQtd" placeholder="Código do produto">
      <input type="number" id="novaQtd" placeholder="Qtd a adicionar">
      <button onclick="acaoAtualizarQuantidade()">Adicionar Qtd</button>
    </div>
  </section>

  <p id="mensagem" class="mensagem"></p>

  <section class="card">
    <h2>Produtos Cadastrados</h2>
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Descrição</th>
          <th>Quantidade</th>
          <th>Valor (R$)</th>
        </tr>
      </thead>
      <tbody id="tabela-produtos"></tbody>
    </table>
  </section>
</div>


  <script src="script.js"></script>
  
</body>
</html>
