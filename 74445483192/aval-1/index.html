<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Sistema de Estoque</h1>
        <p>Gerenciamento de produtos</p>
    </header>
    <main>
        <nav class="menu">
            <button onclick="mostrarTela('cadastro')">Cadastrar Produto</button>
            <button onclick="mostrarTela('lista')">Listar Produtos</button>
            <button onclick="mostrarTela('valor')">Alterar Valor</button>
            <button onclick="mostrarTela('alterarQuantidade')">Alterar Quantidade</button>
        </nav>

        <section id="cadastro" class="tela">
            <h2>Cadastrar Novo Produto</h2>
            <form id="formCadastro">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" placeholder="Digite a descrição" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="1" placeholder="Digite a quantidade" required>

                <label for="valor">Valor:</label>
                <input type="number" id="valor" min="0" step="0.01" placeholder="Digite o valor" required>

                <button type="submit" class="btn-principal">Cadastrar Produto</button>
            </form>
        </section>

        <section id="lista" class="tela escondido">
            <h2>Produtos Cadastrados</h2>
            <div id="tabelaProdutos"></div>
        </section>

        <section id="valor" class="tela escondido">
            <h2>Alterar Valor do Produto</h2>
            <form id="formValor">
                <label for="codigoValor">Código do produto:</label>
                <input type="number" id="codigoValor" min="1" placeholder="Digite o código" required>

                <label for="novoValor">Novo valor:</label>
                <input type="number" id="novoValor" min="0" step="0.01" placeholder="Digite o novo valor" required>

                <button type="submit" class="btn-principal">Alterar Valor</button>
            </form>
        </section>

        <section id="alterarQuantidade" class="tela escondido">
            <h2>Alterar Quantidade do Produto</h2>
            <form id="formQuantidade">
                <label for="codigoQuantidade">Código do produto:</label>
                <input type="number" id="codigoQuantidade" min="1" placeholder="Digite o código" required>

                <label for="novaQuantidade">Quantidade a adicionar:</label>
                <input type="number" id="novaQuantidade" min="1" placeholder="Digite a quantidade" required>

                <button type="submit" class="btn-principal">Alterar Quantidade</button>
            </form>
        </section>

        <div id="mensagem"></div>
    </main>
    <footer>
        <p>MENTORIA TECH II | Sistema de Estoque | Jaiane Vieira &copy; 2026</p>
    </footer>
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
