<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet">
</head>
<body>
  <div id="game">
      <div id="hud">
          <span>PONTOS: <b id="score">0</b></span>
              <span>VELOCIDADE: <b id="speed">1</b></span>
                </div>

                  <div id="road">
                      <div class="lane lane1"></div>
                          <div class="lane lane2"></div>

                              <div id="player" class="bike">🏍️</div>
                                  <div id="enemy" class="bike">🏍️</div>
                                    </div>

                                      <div id="message">
                                          <h1>🏁 MOTO RACING</h1>
                                              <p>Desvie das motos e faça muitos pontos!</p>
                                                  <button id="start">COMEÇAR CORRIDA</button>
                                                    </div>

                                                      <div id="controls">
                                                          <button id="left">⬅️</button>
                                                              <button id="right">➡️</button>
                                                                </div>
                                                                </div>
  <script src="script.js"></script>
  
</body>
</html>
