<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Aventura na Cidade</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>
                <body>

                <div id="game">
                    <div id="hud">
                            💰 Dinheiro: <span id="money">0</span>
                                    ⭐ Procurado: <span id="wanted">0</span>
                                            ❤️ Vida: <span id="health">100</span>
                                                </div>

                                                    <div id="message">Encontre a missão!</div>

                                                        <div id="player">🧍</div>

                                                            <div class="building b1">🏢</div>
                                                                <div class="building b2">🏠</div>
                                                                    <div class="building b3">🏪</div>

                                                                        <div id="mission">!</div>
                                                                            <div id="coin">💰</div>
                                                                            </div>

                                                                            <div id="controls">
                                                                                <button data-key="ArrowUp">⬆️</button>
                                                                                    <div>
                                                                                            <button data-key="ArrowLeft">⬅️</button>
                                                                                                    <button data-key="ArrowDown">⬇️</button>
                                                                                                            <button data-key="ArrowRight">➡️</button>
                                                                                                                </div>
                                                                                                                </div>
