
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Ficha de Anamnese</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <div class="container">
                            <h1>Ficha de Anamnese</h1>

                                    <form id="form-pessoa">
                                                <div class="campo">
                                                                <label for="nome">Nome:</label>
                                                                                <input type="text" id="nome" placeholder="Digite o nome">
                                                                                            </div>

                                                                                                        <div class="campo">
                                                                                                                        <label for="idade">Idade:</label>
                                                                                                                                        <input type="number" id="idade" placeholder="Digite a idade">
                                                                                                                                                    </div>

                                                                                                                                                                <div class="campo">
                                                                                                                                                                                <label for="altura">Altura (m):</label>
                                                                                                                                                                                                <input type="number" step="0.01" id="altura" placeholder="Ex: 1.70">
                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                        <div class="campo">
                                                                                                                                                                                                                                        <label for="peso">Peso (kg):</label>
                                                                                                                                                                                                                                                        <input type="number" step="0.1" id="peso" placeholder="Ex: 65">
                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                <p id="erro" hidden></p>

                                                                                                                                                                                                                                                                                            <button type="submit">Salvar pessoa</button>
                                                                                                                                                                                                                                                                                                    </form>

                                                                                                                                                                                                                                                                                                            <h2>Pessoas cadastradas</h2>

                                                                                                                                                                                                                                                                                                                    <div class="tabela-container">
                                                                                                                                                                                                                                                                                                                                <table>
                                                                                                                                                                                                                                                                                                                                                <thead>
                                                                                                                                                                                                                                                                                                                                                                    <tr>
                                                                                                                                                                                                                                                                                                                                                                                            <th>Código</th>
                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Nome</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Idade</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Altura</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Peso</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>IMC</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Classificação</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </thead>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <tbody id="tabela-pessoas">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
