<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <imput id="t" placeholder="Nova tarefa"><button onclick="add()">+</button><ul id="l"></ul><script>
  function add(){
  let i=document.getElementById('t');
  if(! i.value)return;
  l.innerHTML +=`<li>${i.value}<button onclick="this.parentElement.remove()">X</button></li>`;
  i.value='';}
  </script> 
  <script src="script.js"></script>
  
</body>
</html>
