
<!-- Diga ao navegador que este é um documento moderno do tipo HTML5 -->
<!DOCTYPE html>

<!-- Tag principal que envolve todo o site. O "lang" define o idioma como Português do Brasil -->
<html lang="pt-BR">

<head>
  <!-- Define a codificação de caracteres para aceitar acentos (como á, é, ç) corretamente -->
  <meta charset="UTF-8">
  
  <!-- Configura a página para se adaptar bem em telas de celulares e computadores -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Define o título que aparece na aba do navegador -->
  <title>Minha Primeira Página HTML</title>
<link href="style.css" rel="stylesheet"></head>

<body>
  <!-- O "Body" (corpo) guarda tudo o que realmente aparece visualmente na tela do site -->

  <!-- <h1> cria o título principal da página (o texto fica grande e em negrito) -->
  <h1>Bem-vindo ao Meu Primeiro Site!</h1>

  <!-- <p> cria um parágrafo comum para blocos de texto -->
  <p>Este é um parágrafo simples criado em HTML. Ele serve para organizar textos comuns.</p>

  <!-- <a> cria um link. O atributo "href" define para qual endereço o usuário vai ao clicar -->
  <a href="https://google.com" target="_blank">Clique aqui para ir ao Google</a>

  <!-- <button> cria um botão clicável simples na tela -->
  <button>Apenas um Botão</button>

<script src="script.js"></script></body>
</html>
