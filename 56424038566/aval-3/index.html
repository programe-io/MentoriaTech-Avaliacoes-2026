
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON DRINKS</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #080810;
  color: white;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 8%;
  background: #10101c;
  border-bottom: 1px solid #8a2bff;
}

.logo {
  color: #a855ff;
  font-size: 27px;
  font-weight: bold;
  text-shadow: 0 0 15px #a855ff;
}

header a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
}

.hero {
  text-align: center;
  padding: 100px 20px;
  background: radial-gradient(circle, #28104a, #080810 70%);
}

.hero h1 {
  font-size: 48px;
  color: #c084fc;
  text-shadow: 0 0 20px #a855ff;
}

.hero p {
  margin: 20px;
  color: #ccc;
}

button {
  background: #8b2cff;
  color: white;
  border: none;
  padding: 14px 25px;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 0 15px #8b2cff;
}

h2 {
  text-align: center;
  margin: 50px 0 30px;
  color: #a855ff;
}

.produtos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 25px;
  padding: 20px 8%;
}

.card {
  background: #151522;
  padding: 25px;
  border: 1px solid #54208c;
  border-radius: 15px;
  text-align: center;
  transition: .3s;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 0 20px #8b2cff;
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: contain;
}

.card h3 {
  margin: 15px 0;
}

.preco {
  color: #bd83ff;
  font-size: 22px;
  margin-bottom: 15px;
}

footer {
  text-align: center;
  padding: 30px;
  color: #888;
  margin-top: 50px;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
  <div class="logo">NEON DRINKS</div>
  <nav>
    <a href="#">Início</a>
    <a href="#produtos">Produtos</a>
    <a href="#contato">Contato</a>
  </nav>
</header>

<section class="hero">
  <h1>O SABOR DA NOITE!</h1>
  <p>As melhores bebidas em um só lugar.</p>
  <a href="#produtos">
    <button>VER BEBIDAS</button>
  </a>
</section>

<h2 id="produtos">NOSSAS BEBIDAS</h2>

<section class="produtos">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=400" alt="Refrigerante">
    <h3>Refrigerante</h3>
    <p class="preco">R$ 8,00</p>
    <button onclick="comprar('Refrigerante')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?w=400" alt="Suco">
    <h3>Suco Especial</h3>
    <p class="preco">R$ 12,00</p>
    <button onclick="comprar('Suco Especial')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1570197788417-0e82375c9371?w=400" alt="Bebida gelada">
    <h3>Bebida Gelada</h3>
    <p class="preco">R$ 10,00</p>
    <button onclick="comprar('Bebida Gelada')">Comprar</button>
  </div>

</section>

<footer id="contato">
  <p>© 2026 NEON DRINKS - Todos os direitos reservados.</p>
</footer>

<script>
function comprar(produto) {
  alert("Você selecionou: " + produto);
}
</script>

<script src="script.js"></script></body>
</html>
