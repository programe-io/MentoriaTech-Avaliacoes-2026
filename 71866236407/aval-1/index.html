
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            padding: 30px;
            color: #1e293b;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #123047;
        }

        h2 {
            margin: 20px 0 15px;
            color: #123047;
        }

        .formulario {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #16a085;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #117a65;
        }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .editar {
            background: #2563eb;
        }

        .editar:hover {
            background: #1d4ed8;
        }

        .excluir {
            background: #dc2626;
        }

        .excluir:hover {
            background: #b91c1c;
        }

        .resumo {
            background: #e0f2fe;
            padding: 18px;
            margin-top: 25px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #123047;
            color: white;
        }

        .pesquisa {
            margin-top: 20px;
        }

        @media (max-width: 650px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px 5px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>📦 Sistema de Controle de Estoque</h1>

    <h2>Cadastrar Produto</h2>

    <div class="formulario">

        <input type="text" id="codigo"
            placeholder="Código do produto">

        <input type="text" id="descricao"
            placeholder="Descrição do produto">

        <input type="number" id="quantidade"
            placeholder="Quantidade" min="0">

        <input type="number" id="valor"
            placeholder="Valor do produto (R$)" min="0" step="0.01">

    </div>

    <div class="botoes">
        <button onclick="cadastrarProduto()">
            Cadastrar Produto
        </button>
    </div>

    <h2>Produtos Cadastrados</h2>

    <input
        class="pesquisa"
        type="text"
        id="pesquisa"
        placeholder="Pesquisar por código ou descrição..."
        oninput="listarProdutos()"
    >

    <div style="overflow-x:auto">

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                    <th>Total</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaProdutos">
            </tbody>
        </table>

    </div>

    <div class="resumo">
        Valor total do estoque:
        <span id="totalEstoque">R$ 0,00</span>
    </div>

</div>

<script>

    // Array que armazena os produtos
    let produtos = [];

    // Função para cadastrar produto
    function cadastrarProduto() {

        const codigo = document.getElementById("codigo").value.trim();
        const descricao = document.getElementById("descricao").value.trim();
        const quantidade = Number(document.getElementById("quantidade").value);
        const valor = Number(document.getElementById("valor").value);

        // Validar campos
        if (!codigo || !descricao ||
            document.getElementById("quantidade").value === "" ||
            document.getElementById("valor").value === "") {

            alert("Preencha todos os campos!");
            return;
        }

        if (quantidade < 0 || valor < 0 ||
            !Number.isFinite(quantidade) ||
            !Number.isFinite(valor)) {

            alert("Informe valores válidos!");
            return;
        }

        // Verificar se o código já existe
        const existe = produtos.some(
            produto => produto.codigo.toLowerCase() === codigo.toLowerCase()
        );

        if (existe) {
            alert("Já existe um produto com esse código!");
            return;
        }

        // Criar objeto do produto
        const produto = {
            codigo: codigo,
            descricao: descricao,
            quantidade: quantidade,
            valor: valor
        };

        // Adicionar ao array
        produtos.push(produto);

        alert("Produto cadastrado com sucesso!");

        limparCampos();
        listarProdutos();
    }

    // Função para listar produtos
    function listarProdutos() {

        const tabela = document.getElementById("listaProdutos");
        const pesquisa = document.getElementById("pesquisa").value.toLowerCase();

        tabela.innerHTML = "";

        let totalEstoque = 0;

        produtos.forEach((produto, index) => {

            // Filtrar produtos
            if (
                !produto.codigo.toLowerCase().includes(pesquisa) &&
                !produto.descricao.toLowerCase().includes(pesquisa)
            ) {
                return;
            }

            const total = produto.quantidade * produto.valor;

            totalEstoque += total;

            const linha = document.createElement("tr");

            const valores = [
                produto.codigo,
                produto.descricao,
                produto.quantidade,
                formatarMoeda(produto.valor),
                formatarMoeda(total)
            ];

            valores.forEach(valor => {
                const coluna = document.createElement("td");
                coluna.textContent = valor;
                linha.appendChild(coluna);
            });

            const colunaAcoes = document.createElement("td");

            const botaoValor = document.createElement("button");
            botaoValor.textContent = "Valor";
            botaoValor.className = "editar";
            botaoValor.onclick = () => alterarValor(index);

            const botaoQuantidade = document.createElement("button");
            botaoQuantidade.textContent = "Qtd.";
            botaoQuantidade.className = "editar";
            botaoQuantidade.style.marginTop = "5px";
            botaoQuantidade.onclick = () => alterarQuantidade(index);

            colunaAcoes.appendChild(botaoValor);
            colunaAcoes.appendChild(document.createElement("br"));
            colunaAcoes.appendChild(botaoQuantidade);

            linha.appendChild(colunaAcoes);
            tabela.appendChild(linha);

        });

        document.getElementById("totalEstoque").textContent =
            formatarMoeda(totalEstoque);
    }

    // Alterar valor do produto
    function alterarValor(index) {

        const novoValor = prompt(
            "Digite o novo valor do produto:"
        );

        if (novoValor === null || novoValor.trim() === "") {
            return;
        }

        const valor = Number(novoValor);

        if (!Number.isFinite(valor) || valor < 0) {
            alert("Valor inválido!");
            return;
        }

        produtos[index].valor = valor;

        alert("Valor alterado com sucesso!");

        listarProdutos();
    }

    // Alterar quantidade do produto
    function alterarQuantidade(index) {

        const novaQuantidade = prompt(
            "Digite a nova quantidade do produto:"
        );

        if (novaQuantidade === null || novaQuantidade.trim() === "") {
            return;
        }

        const quantidade = Number(novaQuantidade);

        if (!Number.isInteger(quantidade) || quantidade < 0) {
            alert("Quantidade inválida! Digite um número inteiro positivo ou zero.");
            return;
        }

        produtos[index].quantidade = quantidade;

        alert("Quantidade alterada com sucesso!");

        listarProdutos();
    }

    // Limpar formulário
    function limparCampos() {

        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";

    }

    // Formatar valores em reais
    function formatarMoeda(valor) {

        return valor.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });

    }

</script>

<script src="script.js"></script></body>
</html>
