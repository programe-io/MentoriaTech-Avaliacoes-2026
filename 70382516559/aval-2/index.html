
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineList | Catálogo de filmes</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h1>CineList</h1>
    <p>Monte seu catálogo e acompanhe o que já assistiu.</p>
  </header>

  <main>
    <section>
      <h2>Cadastrar filme</h2>
      <form id="filmeForm">
        <input id="titulo" placeholder="Título do filme" required minlength="2">

        <input id="ano" type="number" min="1888" max="2100"
          placeholder="Ano de lançamento" required>

        <select id="genero" required>
          <option value="">Selecione o gênero</option>
          <option>Ação</option>
          <option>Comédia</option>
          <option>Drama</option>
          <option>Ficção científica</option>
          <option>Animação</option>
          <option>Suspense</option>
          <option>Outro</option>
        </select>

        <button type="submit">Adicionar filme</button>
      </form>
    </section>

    <section>
      <h2>Atualizar situação</h2>
      <form id="situacaoForm">
        <select id="filmeEscolhido" required>
          <option value="">Selecione um filme</option>
        </select>

        <select id="situacao" required>
          <option value="">Selecione a situação</option>
          <option value="Quero assistir">Quero assistir</option>
          <option value="Assistido">Assistido</option>
          <option value="Favorito">Favorito</option>
        </select>

        <button type="submit">Salvar situação</button>
      </form>

      <p id="mensagem" role="status"></p>
    </section>

    <section>
      <h2>Meu catálogo</h2>
      <div id="catalogo"></div>
    </section>
  </main>

  <footer>
    <p>CineList © 2026</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
