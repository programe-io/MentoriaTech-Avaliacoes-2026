
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">

    <header>
        <h1>📋 Gerenciador de Tarefas</h1>
        <p>Organize suas atividades e acompanhe seu progresso</p>
    </header>

    <!-- Indicadores -->
    <section class="dashboard">

        <div class="card indicador">
            <h3>Total de Tarefas</h3>
            <span id="totalTarefas">0</span>
        </div>

        <div class="card indicador">
            <h3>Pendentes</h3>
            <span id="tarefasPendentes">0</span>
        </div>

        <div class="card indicador">
            <h3>Concluídas</h3>
            <span id="tarefasConcluidas">0</span>
        </div>

        <div class="card indicador">
            <h3>Prioridade Alta</h3>
            <span id="prioridadeAlta">0</span>
        </div>

    </section>

    <!-- Formulário -->
    <section class="card">

        <h2 id="tituloFormulario">Cadastrar Nova Tarefa</h2>

        <form id="tarefaForm">

            <div class="form-grid">

                <div>
                    <label for="codigo">Código:</label>
                    <input type="text" id="codigo"
                        placeholder="Ex: TAR001" required>
                </div>

                <div>
                    <label for="titulo">Título da Tarefa:</label>
                    <input type="text" id="titulo"
                        placeholder="Digite o título" required>
                </div>

                <div>
                    <label for="prioridade">Prioridade:</label>
                    <select id="prioridade" required>
                        <option value="">Selecione</option>
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>

                <div>
                    <label for="status">Status:</label>
                    <select id="status" required>
                        <option value="Pendente">Pendente</option>
                        <option value="Concluída">Concluída</option>
                    </select>
                </div>

            </div>

            <div class="botoes">
                <button type="submit" id="btnSalvar">
                    Cadastrar Tarefa
                </button>

                <button type="button" id="btnCancelar"
                    class="btn-cancelar" onclick="cancelarEdicao()"
                    hidden>
                    Cancelar
                </button>
            </div>

        </form>

    </section>

    <!-- Lista de tarefas -->
    <section class="card">

        <h2>Lista de Tarefas</h2>

        <div class="filtros">

            <input type="text" id="pesquisa"
                placeholder="🔎 Pesquisar por código ou título">

            <select id="filtroPrioridade">
                <option value="">Todas as prioridades</option>
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>
            </select>

            <select id="filtroStatus">
                <option value="">Todos os status</option>
                <option value="Pendente">Pendente</option>
                <option value="Concluída">Concluída</option>
            </select>

        </div>

        <div class="tabela-container">

            <table>

                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Título</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaTarefas"></tbody>

            </table>

        </div>

        <p id="mensagemVazia" hidden>
            Nenhuma tarefa encontrada.
        </p>

    </section>

    <footer>
        Sistema de Gerenciamento de Tarefas
    </footer>

</div>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
