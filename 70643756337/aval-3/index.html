
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Controle de IMC</h1>
            <p>Acompanhe seu Índice de Massa Corporal</p>
        </header>

        <section class="card">
            <h2>Calcular IMC</h2>

            <form id="imcForm">
                <label>Nome:</label>
                <input type="text" id="nome"
                    placeholder="Digite seu nome" required>

                <label>Peso (kg):</label>
                <input type="number" id="peso"
                    placeholder="Ex: 70" step="0.1"
                    min="1" required>

                <label>Altura (m):</label>
                <input type="number" id="altura"
                    placeholder="Ex: 1.75" step="0.01"
                    min="0.5" required>

                <button type="submit">Calcular IMC</button>
            </form>

            <div id="resultado" class="resultado"></div>
        </section>

        <section class="card">
            <h2>Histórico de IMC</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Peso</th>
                            <th>Altura</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ação</th>
                        </tr>
                    </thead>

                    <tbody id="historico"></tbody>
                </table>
            </div>

            <button class="limpar" onclick="limparHistorico()">
                Limpar histórico
            </button>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
