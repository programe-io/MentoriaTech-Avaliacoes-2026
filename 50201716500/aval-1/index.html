<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Henrique Novais | Blog</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="container">
            <h1>Pedro Henrique Novais</h1>
            <p>Compartilhando ideias, tecnologias e histórias.</p>
        </div>
    </header>

    <div class="container content-wrapper">
        <main class="main-content">
            <h2>Publicações Recentes</h2>
            <div id="posts-container">
                </div>
        </main>

        <aside class="sidebar">
            <div class="card">
                <h3>Sobre Mim</h3>
                <p>Bem-vindo ao meu espaço digital! Aqui escrevo sobre meus aprendizados e projetos.</p>
            </div>

            <div class="card">
                <h3>Nova Publicação</h3>
                <form id="post-form">
                    <div class="form-group">
                        <label for="post-title">Título</label>
                        <input type="text" id="post-title" required placeholder="Digite o título...">
                    </div>
                    <div class="form-group">
                        <label for="post-content">Conteúdo</label>
                        <textarea id="post-content" rows="5" required placeholder="Escreva o seu texto aqui..."></textarea>
                    </div>
                    <button type="submit">Publicar</button>
                </form>
            </div>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 Pedro Henrique Novais. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
