<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        \}

        body {
            background: #f4f4f4;
            color: #333;
        \}

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        \}

        nav {
            margin-top: 10px;
        \}

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        \}

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        \}

        .container h1 {
            font-size: 40px;
            margin-bottom: 20px;
        \}

        .container p {
            font-size: 18px;
            margin-bottom: 30px;
        \}

        .botao {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
        \}

        .botao:hover {
            background: #1d4ed8;
        \}

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 100px;
        \}
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h2>Meu Site</h2>

        <nav>
            <a href="#">Início</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <main class="container">
        <h1>Olá, mundo! 👋</h1>

        <p>
            Bem-vindo ao meu primeiro site criado com HTML e CSS.
        </p>

        <a href="#" class="botao">Clique aqui</a>
    </main>

    <footer>
        <p>© 2026 - Meu Site</p>
    </footer>

<script src="script.js"></script></body>
</html>$0
