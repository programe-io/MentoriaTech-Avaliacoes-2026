
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
    }

    header {
      background: #1877f2;
      color: white;
      padding: 18px;
      text-align: center;
      box-shadow: 0 2px 8px #0001;
    }

    header h1 {
      font-size: 25px;
    }

    .feed {
      width: 100%;
      max-width: 600px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #0000000d;
    }

    .perfil {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
    }

    .info h3 {
      font-size: 15px;
      margin-bottom: 4px;
    }

    .info span {
      font-size: 12px;
      color: #65676b;
    }

    .texto {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .publicacao {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    .estatisticas {
      display: flex;
      justify-content: space-between;
      color: #65676b;
      font-size: 13px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .acoes {
      display: flex;
      gap: 8px;
      padding-top: 12px;
    }

    .acoes button {
      flex: 1;
      border: none;
      background: #f0f2f5;
      padding: 11px 5px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #444;
      transition: background 0.2s;
    }

    .acoes button:hover {
      background: #dfe7f2;
    }

    .criar {
      margin-bottom: 20px;
    }

    .criar textarea {
      width: 100%;
      resize: vertical;
      min-height: 75px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      outline-color: #1877f2;
    }

    .botao-publicar {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1877f2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-publicar:hover {
      background: #1665ce;
    }

    @media (max-width: 480px) {
      .feed {
        margin-top: 15px;
        padding: 0 10px;
      }

      .card {
        padding: 12px;
      }

      .publicacao {
        max-height: 300px;
      }
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

  <header>
    <h1>Meu Feed</h1>
  </header>

  <main class="feed">

    <section class="card criar">
      <h3 style="margin-bottom: 12px;">
        O que você está pensando?
      </h3>

      <textarea placeholder="Escreva uma publicação..."></textarea>

      <button class="botao-publicar">
        Publicar
      </button>
    </section>

    <article class="card">
      <div class="perfil">
        <img
          class="avatar"
          src="https://i.pravatar.cc/100?img=12"
          alt="Foto de Ana"
        >

        <div class="info">
          <h3>Ana Oliveira</h3>
          <span>Há 10 minutos</span>
        </div>
      </div>

      <p class="texto">
        Aproveitando um dia lindo para curtir a natureza! ☀️🌿
      </p>

      <img
        class="publicacao"
        src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800"
        alt="Paisagem natural ao nascer do sol"
      >

      <div class="estatisticas">
        <span>👍 128 curtidas</span>
        <span>24 comentários</span>
      </div>

      <div class="acoes">
        <button>👍 Curtir</button>
        <button>💬 Comentar</button>
        <button>↗ Compartilhar</button>
      </div>
    </article>

    <article class="card">
      <div class="perfil">
        <img
          class="avatar"
          src="https://i.pravatar.cc/100?img=33"
          alt="Foto de Lucas"
        >

        <div class="info">
          <h3>Lucas Santos</h3>
          <span>Há 1 hora</span>
        </div>
      </div>

      <p class="texto">
        Café, música e programação. Meu jeito favorito de
        começar o dia! ☕💻
      </p>

      <div class="estatisticas">
        <span>👍 56 curtidas</span>
        <span>8 comentários</span>
      </div>

      <div class="acoes">
        <button>👍 Curtir</button>
        <button>💬 Comentar</button>
        <button>↗ Compartilhar</button>
      </div>
    </article>

  </main>

</body>
</html>
