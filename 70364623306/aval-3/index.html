
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese - Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header>
            <h1>Ficha de Anamnese</h1>
            <p>Cadastro de pacientes e controle do Índice de Massa Corporal (IMC)</p>
        </header>

        <section class="painel">
            <h2>Cadastro do paciente</h2>

            <form id="formPessoa">

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" placeholder="Digite o nome do paciente">

                <label for="idade">Idade:</label>
                <input type="number" id="idade" placeholder="Ex.: 30">

                <label for="altura">Altura (metros):</label>
                <input type="number" id="altura" step="0.01" placeholder="Ex.: 1.70">

                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" step="0.1" placeholder="Ex.: 65">

                <p id="erro" hidden></p>

                <button type="submit">Salvar paciente</button>

            </form>
        </section>

        <section class="painel">
            <h2>Pacientes cadastrados</h2>

            <div class="contador">
                Total de pacientes: <strong id="totalPessoas">0</strong>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaPessoas"></tbody>
                </table>
            </div>
        </section>

        <footer>
            <p>Projeto desenvolvido com HTML, CSS e JavaScript.</p>
        </footer>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
