
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnoquePTCOM</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Enoque<span>PTCOM</span></h1>
        <input type="search" id="pesquisa" placeholder="Pesquisar...">
        <button id="abrirCriacao">＋ Criar</button>
    </header>

    <nav>
        <button onclick="mostrarInicio()">🏠 Início</button>
        <button onclick="mostrarExplorar()">🔎 Explorar</button>
        <button onclick="mostrarNotificacoes()">❤️ Notificações</button>
        <button onclick="mostrarPerfil()">👤 Perfil</button>
    </nav>

    <main>
        <section class="stories">
            <div class="story" onclick="adicionarStory()">＋ Seu story</div>
            <div class="story">🌸 Mariana</div>
            <div class="story">🔥 João</div>
            <div class="story">💜 Luiza</div>
            <div class="story">⭐ Rafael</div>
        </section>

        <section class="criar-post" id="criacao">
            <h2>Criar publicação</h2>
            <textarea id="legenda" placeholder="O que você está pensando?"></textarea>
            <input type="file" id="foto" accept="image/*">
            <button onclick="publicar()">Publicar</button>
        </section>

        <section id="feed">
            <h2>Feed</h2>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
