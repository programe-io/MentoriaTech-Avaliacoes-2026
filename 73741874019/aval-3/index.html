
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Ficha de Anamnese</h1>
    <p>Cadastro e avaliação do paciente</p>
</header>

<main class="container">

    <form id="formAnamnese">

        <section class="card">
            <h2>1. Dados pessoais</h2>

            <div class="grid">
                <div class="campo">
                    <label>Nome completo</label>
                    <input type="text" name="nome" required>
                </div>

                <div class="campo">
                    <label>Data de nascimento</label>
                    <input type="date" name="nascimento">
                </div>

                <div class="campo">
                    <label>CPF</label>
                    <input type="text" name="cpf">
                </div>

                <div class="campo">
                    <label>Telefone</label>
                    <input type="tel" name="telefone">
                </div>

                <div class="campo">
                    <label>E-mail</label>
                    <input type="email" name="email">
                </div>

                <div class="campo">
                    <label>Profissão</label>
                    <input type="text" name="profissao">
                </div>

                <div class="campo">
                    <label>Sexo</label>
                    <select name="sexo">
                        <option value="">Selecione</option>
                        <option>Feminino</option>
                        <option>Masculino</option>
                        <option>Outro</option>
                        <option>Prefiro não informar</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>2. Queixa principal</h2>
            <label>Qual o principal motivo da consulta?</label>
            <textarea name="queixa" rows="4"></textarea>

            <label>Há quanto tempo apresenta esse problema?</label>
            <input type="text" name="tempoProblema">
        </section>

        <section class="card">
            <h2>3. Histórico de saúde</h2>

            <label>Possui alguma doença diagnosticada?</label>
            <textarea name="doencas" rows="3"></textarea>

            <label>Já realizou alguma cirurgia?</label>
            <textarea name="cirurgias" rows="3"></textarea>

            <label>Possui alergias?</label>
            <textarea name="alergias" rows="3"></textarea>

            <label>Faz uso de medicamentos?</label>
            <textarea name="medicamentos" rows="3"></textarea>
        </section>

        <section class="card">
            <h2>4. Histórico familiar</h2>

            <label>Existem doenças na família?</label>
            <textarea name="historicoFamiliar" rows="3"
            placeholder="Ex.: diabetes, hipertensão, problemas cardíacos..."></textarea>
        </section>

        <section class="card">
            <h2>5. Hábitos de vida</h2>

            <div class="grid">
                <div class="campo">
                    <label>Pratica atividade física?</label>
                    <select name="atividade">
                        <option value="">Selecione</option>
                        <option>Sim</option>
                        <option>Não</option>
                        <option>Às vezes</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Qualidade do sono</label>
                    <select name="sono">
                        <option value="">Selecione</option>
                        <option>Boa</option>
                        <option>Regular</option>
                        <option>Ruim</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Tabagismo</label>
                    <select name="tabagismo">
                        <option value="">Selecione</option>
                        <option>Sim</option>
                        <option>Não</option>
                        <option>Ex-fumante</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Consumo de álcool</label>
                    <select name="alcool">
                        <option value="">Selecione</option>
                        <option>Sim</option>
                        <option>Não</option>
                        <option>Ocasionalmente</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>6. Avaliação e observações</h2>

            <label>Observações profissionais</label>
            <textarea name="observacoes" rows="5"></textarea>

            <label>Conduta / Plano de acompanhamento</label>
            <textarea name="conduta" rows="4"></textarea>
        </section>

        <section class="card">
            <h2>7. Responsável pelo atendimento</h2>

            <div class="grid">
                <div class="campo">
                    <label>Nome do profissional</label>
                    <input type="text" name="profissional">
                </div>

                <div class="campo">
                    <label>Data do atendimento</label>
                    <input type="date" name="dataAtendimento">
                </div>
            </div>

            <label>Assinatura do paciente</label>
            <input type="text" name="assinatura"
                   placeholder="Digite o nome completo">
        </section>

        <div class="botoes">
            <button type="submit" class="salvar">
                Salvar ficha
            </button>

            <button type="button" class="imprimir"
                    onclick="window.print()">
                Imprimir ficha
            </button>

            <button type="reset" class="limpar">
                Limpar formulário
            </button>
        </div>

    </form>

</main>

<footer>
    <p>Projeto Ficha de Anamnese | Sistema de Cadastro de Pacientes</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
