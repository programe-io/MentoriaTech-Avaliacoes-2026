 
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Controle de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Controle de Estoque</h1>
        <p>Cadastro e gerenciamento de produtos</p>
    </header>

    <main>

        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="descricao">Descrição:</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Nome do produto"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade:</label>
                    <input
                        type="number"
                        id="quantidade"
                        placeholder="Quantidade"
                        min="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$):</label>
                    <input
                        type="number"
                        id="valor"
                        placeholder="Preço do produto"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit">
                    Cadastrar Produto
                </button>

            </form>
        </section>

        <section class="card">
            <h2>Atualizar Produto</h2>

            <div class="campo">
                <label for="codigoAtualizar">Código do produto:</label>
                <input
                    type="number"
                    id="codigoAtualizar"
                    placeholder="Digite o código"
                    min="1"
                >
            </div>

            <div class="campo">
                <label for="novoValor">Novo valor (R$):</label>
                <input
                    type="number"
                    id="novoValor"
                    placeholder="Novo preço"
                    min="0"
                    step="0.01"
                >
            </div>

            <button type="button" id="btnAtualizarValor">
                Atualizar Valor
            </button>

            <div class="campo">
                <label for="novaQuantidade">
                    Quantidade a adicionar:
                </label>

                <input
                    type="number"
                    id="novaQuantidade"
                    placeholder="Quantidade"
                    min="1"
                >
            </div>

            <button type="button" id="btnAtualizarQuantidade">
                Adicionar ao Estoque
            </button>
        </section>

        <section class="card">
            <h2>Produtos Cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Produtos inseridos pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>Sistema de Controle de Estoque - JavaScript</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
