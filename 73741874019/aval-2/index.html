
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header class="cabecalho">
        <div>
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas atividades e aumente sua produtividade.</p>
        </div>
    </header>

    <main class="container">

        <!-- Indicadores -->
        <section class="resumo">

            <div class="card-resumo">
                <span>Total de tarefas</span>
                <h2 id="totalTarefas">0</h2>
            </div>

            <div class="card-resumo">
                <span>Pendentes</span>
                <h2 id="tarefasPendentes">0</h2>
            </div>

            <div class="card-resumo">
                <span>Concluídas</span>
                <h2 id="tarefasConcluidas">0</h2>
            </div>

        </section>

        <!-- Formulário -->
        <section class="card">

            <h2 id="tituloFormulario">Adicionar nova tarefa</h2>

            <form id="formTarefa">

                <div class="campo">
                    <label for="descricao">Descrição da tarefa</label>

                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: Estudar JavaScript"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="data">Data de vencimento</label>

                    <input
                        type="date"
                        id="data"
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade">

                        <option value="baixa">Baixa</option>
                        <option value="media" selected>Média</option>
                        <option value="alta">Alta</option>

                    </select>
                </div>

                <div class="botoes-formulario">

                    <button type="submit" id="btnSalvar">
                        Adicionar tarefa
                    </button>

                    <button
                        type="button"
                        id="btnCancelar"
                        class="btn-cancelar"
                        hidden
                    >
                        Cancelar edição
                    </button>

                </div>

            </form>

        </section>

        <!-- Lista de tarefas -->
        <section class="card">

            <div class="topo-lista">

                <h2>Minhas tarefas</h2>

                <input
                    type="search"
                    id="pesquisa"
                    placeholder="Pesquisar tarefa..."
                >

            </div>

            <!-- Filtros -->
            <div class="filtros">

                <button class="filtro ativo" data-filtro="todas">
                    Todas
                </button>

                <button class="filtro" data-filtro="pendentes">
                    Pendentes
                </button>

                <button class="filtro" data-filtro="concluidas">
                    Concluídas
                </button>

            </div>

            <!-- Lista -->
            <div id="listaTarefas" class="lista-tarefas">

                <!-- Tarefas geradas pelo JavaScript -->

            </div>

        </section>

    </main>

    <footer>
        <p>Gerenciador de Tarefas | Projeto JavaScript</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
