
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Gerenciamento de produtos</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <label for="codigo">Código:</label>
                <input type="text" id="codigo" placeholder="Ex: 001" required>

                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" placeholder="Nome do produto" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="0" step="1" required>

                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor" min="0.01" step="0.01" required>

                <button type="submit" id="btnCadastrar">
                    Cadastrar Produto
                </button>

            </form>
        </section>

        <section class="estoque">
            <h2>Produtos Cadastrados</h2>

            <div class="resumo">
                <div>
                    <h3 id="totalProdutos">0</h3>
                    <p>Produtos</p>
                </div>

                <div>
                    <h3 id="totalItens">0</h3>
                    <p>Itens em estoque</p>
                </div>

                <div>
                    <h3 id="valorEstoque">R$ 0,00</h3>
                    <p>Valor total</p>
                </div>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
