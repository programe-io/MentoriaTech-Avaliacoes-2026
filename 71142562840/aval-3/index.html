
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Escolar</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div>
            <h1>📚 Biblioteca Escolar</h1>
            <p>Sistema de gerenciamento de livros e empréstimos</p>
        </div>
    </header>

    <main>

        <!-- PAINEL DE RESUMO -->
        <section class="resumo">

            <div class="card">
                <h3 id="totalLivros">0</h3>
                <p>Livros cadastrados</p>
            </div>

            <div class="card">
                <h3 id="totalDisponiveis">0</h3>
                <p>Exemplares disponíveis</p>
            </div>

            <div class="card">
                <h3 id="totalEmprestados">0</h3>
                <p>Exemplares emprestados</p>
            </div>

        </section>

        <!-- CADASTRO -->
        <section class="painel">

            <h2>Cadastrar Livro</h2>

            <form id="formLivro">

                <div class="campo">
                    <label for="codigo">Código:</label>
                    <input type="text" id="codigo"
                    placeholder="Ex: 001" required>
                </div>

                <div class="campo">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo"
                    placeholder="Nome do livro" required>
                </div>

                <div class="campo">
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor"
                    placeholder="Nome do autor" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" required>
                        <option value="">Selecione</option>
                        <option>Literatura</option>
                        <option>Matemática</option>
                        <option>História</option>
                        <option>Geografia</option>
                        <option>Ciências</option>
                        <option>Tecnologia</option>
                        <option>Outros</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade"
                    min="1" step="1" required>
                </div>

                <button type="submit" id="btnCadastrar">
                    Cadastrar Livro
                </button>

            </form>

        </section>

        <!-- LISTAGEM -->
        <section class="painel">

            <h2>Acervo da Biblioteca</h2>

            <div class="pesquisa">
                <input type="text" id="pesquisa"
                placeholder="Pesquisar por título, autor ou código...">
            </div>

            <div class="tabela-container">

                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Categoria</th>
                            <th>Disponíveis</th>
                            <th>Emprestados</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaLivros"></tbody>
                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>Biblioteca Escolar - Sistema de Gerenciamento</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
