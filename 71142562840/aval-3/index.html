<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC - Painel Clínico</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="app-wrapper">
        <!-- Coluna Esquerda: Formulário -->
        <section class="card form-section">
            <header class="header">
                <span class="badge-topo">Avaliação Antropométrica</span>
                <h1>Controle de IMC</h1>
                <p>Insira os dados do paciente para gerar o diagnóstico.</p>
            </header>

            <form id="form-imc">
                <div class="campo">
                    <label for="nome">Nome Completo do Paciente</label>
                    <input type="text" id="nome" placeholder="Ex: Carlos Eduardo Santos" required>
                </div>

                <div class="linha-dupla">
                    <div class="campo">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" id="peso" step="0.1" min="1" placeholder="Ex: 74.5" required>
                    </div>

                    <div class="campo">
                        <label for="altura">Altura (m)</label>
                        <input type="number" id="altura" step="0.01" min="0.5" placeholder="Ex: 1.78" required>
                    </div>
                </div>

                <div class="acoes">
                    <button type="submit" class="btn-primario">Calcular IMC</button>
                    <button type="button" id="btn-limpar" class="btn-secundario">Limpar</button>
                </div>
            </form>
        </section>

        <!-- Coluna Direita: Resultado -->
        <section class="card result-section">
            <div id="estado-vazio" class="estado-vazio">
                <div class="icone-vazio">📊</div>
                <h3>Aguardando dados</h3>
                <p>Preencha o formulário ao lado e clique em <strong>Calcular IMC</strong> para visualizar o relatório completo do paciente.</p>
            </div>

            <div id="resultado" class="resultado oculto"></div>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
