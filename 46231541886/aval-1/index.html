
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Sistema de Controle de Estoque</h1>
        <p>Gerencie seus produtos de maneira simples</p>
    </header>

    <main>

        <section class="cadastro">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <label for="nome">Nome do produto:</label>
                <input type="text" id="nome" placeholder="Digite o nome" required>

                <label for="preco">Preço:</label>
                <input type="number" id="preco" placeholder="Digite o preço"
                    min="0" step="0.01" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade"
                    placeholder="Digite a quantidade" min="0" step="1" required>

                <button type="submit">Cadastrar Produto</button>

            </form>
        </section>

        <section class="estoque">
            <h2>Produtos Cadastrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                    <!-- Produtos serão adicionados aqui -->
                </tbody>
            </table>
        </section>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
