<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="app">
  <header class="navbar">
    <h1 class="logo">Instagram</h1>
    <span class="badge">Perfil de Kauane</span>
  </header>

  <section class="perfil">
    <img src="https://dicebear.com" alt="Foto de Kauane" class="avatar-grande">
    <div class="perfil-info">
      <h2>kauane_oficial</h2>
      <p class="bio">Kauane ✨ | 16 anos 📍<br>Estudante de programação 💻🚀</p>
      <div class="stats">
        <span><strong>1</strong> post</span>
        <span><strong>420</strong> seguidores</span>
        <span><strong>315</strong> seguindo</span>
      </div>
    </div>
  </section>

  <main class="post">
    <div class="post-header">
      <img src="https://dicebear.com" alt="Avatar" class="avatar-pequeno">
      <strong>kauane_oficial</strong>
    </div>

    <img src="https://unsplash.com" alt="Postagem de programação" class="post-img">

    <div class="post-acoes">
      <button id="btnCurtir" class="btn-icone">🤍</button>
      <span id="contadorCurtidas"><strong>124 curtidas</strong></span>
    </div>

    <div class="post-legenda">
      <p><strong>kauane_oficial</strong> Meu primeiro projeto de clone do Instagram! 💜✨</p>
    </div>

    <div id="listaComentarios" class="comentarios">
      <p><strong>amigo_dev</strong> Ficou incrível, Kauane! 👏</p>
    </div>

    <div class="novo-comentario">
      <input type="text" id="inputComentario" placeholder="Adicione um comentário...">
      <button id="btnComentar">Publicar</button>
    </div>
  </main>
</div>

  <script src="script.js"></script>
  
</body>
</html>
