<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-content">
        <h1>MiniFeed</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Perfil</a>
        </nav>
    </div>
</header>

<main>
    <section class="new-post">
        <div class="avatar">L</div>
        <div>
            <strong>Lara Regina</strong>
            <span>O que você está pensando?</span>
        </div>
        <button>Publicar</button>
    </section>

    <article class="post">
        <div class="post-header">
            <div class="avatar">M</div>
            <div>
                <strong>Maria</strong>
                <span>Há 10 minutos</span>
            </div>
        </div>

        <div class="post-text">
            Hoje eu assisti ao filme da Princesinha Sofia, que lindo! Estou apaixonada! 💜
            <img src=https://i.pinimg.com/originals/8c/cd/58/8ccd5824562ff7ea92ddf7d295edbef3.jpg
        </div>

        <div class="post-actions">
            <button>Curtir</button>
            <button>Comentar</button>
        </div>
    </article>
</main>

<footer>
    <p>MiniFeed - Projeto - Todos os direitos reservados</p>
</footer>
  
  
</body>
</html>
