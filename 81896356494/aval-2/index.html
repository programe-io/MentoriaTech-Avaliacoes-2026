<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Ícones -->
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="styles.css">
  <title>Clone Instagram</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <h1 class="logo">Instagram</h1>
      <input type="text" placeholder="Pesquisar" class="search-input" />
      <div class="header-icons">
        <i class='bx bx-home'></i>
        <i class='bx bx-heart'></i>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="main-container">
    <div class="content-wrapper">
      
      <!-- Feed -->
      <div class="feed">
        
        <!-- Stories -->
        <section class="stories-card">
          <div class="stories-list">
            <div class="story-item">
              <div class="avatar avatar-lg"></div>
              <span class="story-username">seu_story</span>
            </div>
          </div>
        </section>

        <!-- Publicação -->
        <article class="post-article">
          <!-- Header do Post -->
          <div class="post-header">
            <div class="user-info">
              <div class="avatar avatar-md"></div>
              <span class="username">usuario</span>
            </div>
            <i class='bx bx-dots-horizontal icon-btn'></i>
          </div>
          <!-- Imagem -->
          <img src="https://via.placeholder.com/500" class="post-image" alt="Postagem" />
          <!-- Ações -->
          <div class="post-actions">
            <div class="action-buttons">
              <div class="left-actions">
                <i class='bx bx-heart icon-btn'></i>
                <i class='bx bx-message-rounded icon-btn'></i>
              </div>
              <i class='bx bx-bookmark icon-btn'></i>
            </div>
            <p class="likes-count">1.234 curtidas</p>
          </div>
        </article>

      </div>

      <!-- Sidebar (Desktop) -->
      <aside class="sidebar">
        <!-- Perfil do Utilizador -->
        <div class="sidebar-user">
          <div class="user-info">
            <div class="avatar avatar-xl"></div>
            <div class="user-details">
              <p class="username">seu_usuario</p>
              <p class="user-name">Seu Nome</p>
            </div>
          </div>
          <button class="btn-link">Trocar</button>
        </div>

        <!-- Cabeçalho de Sugestões -->
        <div class="suggestions-header">
          <span>Sugestões para você</span>
          <span class="btn-see-all">Ver tudo</span>
        </div>

        <!-- Sugestão -->
        <div class="suggestion-item">
          <div class="user-info">
            <div class="avatar avatar-sm"></div>
            <div class="user-details">
              <p class="username">dev_maria</p>
              <p class="suggestion-text">Sugerido para você</p>
            </div>
          </div>
          <button class="btn-link">Seguir</button>
        </div>

        <!-- Rodapé da Sidebar -->
        <div class="sidebar-footer">
          <p class="footer-links">
            Sobre Ajuda Imprensa API Carreiras Privacidade Termos Localizações Idioma
          </p>
          <p class="footer-copyright">
            © 2024 INSTAGRAM CLONE - AULA TAILWIND
          </p>
        </div>
      </aside>

    </div>
  </main>

  <!-- Navegação Inferior (Mobile) -->
  <nav class="bottom-nav">
    <div class="nav-container">
      <button class="nav-btn" aria-label="Home">
        <i class='bx bx-home icon-btn'></i>
      </button>
      <button class="nav-btn" aria-label="Search">
        <i class='bx bx-search icon-btn'></i>
      </button>
      <button class="nav-btn" aria-label="New post">
        <i class='bx bx-plus icon-btn'></i>
      </button>
      <button class="nav-btn" aria-label="Activity">
        <i class='bx bx-heart icon-btn'></i>
      </button>
      <button class="nav-btn" aria-label="Profile">
        <i class='bx bx-user icon-btn'></i>
      </button>
    </div>
  </nav>

<script src="script.js"></script></body>
</html>
