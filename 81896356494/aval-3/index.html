  <!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Tailwind -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Ícones -->
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
  <title>Clone Instagram</title>
  
  <style>
    .bg-muted { background-color: #f3f4f6; }
    .bg-card { background-color: #ffffff; }
    .border-border { border-color: #e5e7eb; }
    .text-muted { color: #6b7280; }
  </style>
</head>
<body class="min-h-screen bg-gray-100">

  <!-- Header -->
  <header class="sticky top-0 bg-white border-b border-gray-200 z-40">
    <div class="max-w-5xl mx-auto px-4">
      <div class="flex items-center justify-between h-14">
        <h1 class="font-semibold text-lg">Instagram</h1>
        <input
          type="text"
          placeholder="Pesquisar"
          class="hidden md:block bg-gray-100 px-4 py-2 rounded-lg text-sm"
        />
        <div class="flex gap-4">
          <i class='bx bx-home text-xl'></i>
          <i class='bx bx-heart text-xl'></i>
        </div>
      </div>
    </div>
  </header>

  <!-- Container Conteúdo Principal -->
  <main class="max-w-5xl mx-auto px-4 py-4 md:py-8 pb-20 md:pb-8">
    <div class="flex gap-8">
      
      <!-- Feed -->
      <div class="flex-1 max-w-lg mx-auto">
        
        <!-- Stories -->
        <section class="bg-white border rounded-lg p-4 mb-4">
          <div class="flex gap-4 overflow-x-auto">
            <div class="flex flex-col items-center">
              <div class="w-16 h-16 rounded-full bg-gray-300"></div>
              <span class="text-xs mt-1">seu_story</span>
            </div>
          </div>
        </section>

        <!-- Card de Postagem -->
        <article class="bg-white border rounded-lg mb-4">
          <!-- Header do Post -->
          <div class="flex justify-between items-center p-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-gray-300"></div>
              <span class="font-semibold text-sm">usuario</span>
            </div>
            <i class='bx bx-dots-horizontal'></i>
          </div>
          <!-- Imagem -->
          <img src="https://via.placeholder.com/500" class="w-full" alt="Postagem" />
          <!-- Ações -->
          <div class="p-4">
            <div class="flex justify-between mb-2">
              <div class="flex gap-4">
                <i class='bx bx-heart text-xl'></i>
                <i class='bx bx-message-rounded text-xl'></i>
              </div>
              <i class='bx bx-bookmark text-xl'></i>
            </div>
            <p class="text-sm font-semibold">1.234 curtidas</p>
          </div>
        </article>

      </div>

      <!-- Sidebar (Desktop) -->
      <aside class="hidden lg:block w-80">
        <!-- Usuário Principal -->
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-gray-300"></div>
            <div>
              <p class="font-semibold text-sm">seu_usuario</p>
              <p class="text-xs text-gray-500">Seu Nome</p>
            </div>
          </div>
          <button class="text-xs font-semibold text-blue-500 hover:underline">Trocar</button>
        </div>

        <!-- Cabeçalho de Sugestões -->
        <div class="flex justify-between text-xs mb-3 font-semibold text-gray-500">
          <span>Sugestões para você</span>
          <span class="text-black cursor-pointer">Ver tudo</span>
        </div>

</body>
</html>
