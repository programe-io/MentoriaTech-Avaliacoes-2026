<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>📦 Sistema de Controle de Estoque</h1>

        <!-- Formulário de Cadastro / Atualização -->
        <div class="card">
            <h2 id="titulo-form">Cadastrar Novo Produto</h2>
            <form id="form-produto">
                <input type="hidden" id="codigo-edicao">
                
                <div class="input-grupo">
                    <label for="descricao">Descrição do Produto:</label>
                    <input type="text" id="descricao" placeholder="Ex: Caderno Universitário" required>
                </div>

                <div class="input-linha">
                    <div class="input-grupo">
                        <label for="quantidade">Quantidade:</label>
                        <input type="number" id="quantidade" min="0" placeholder="0" required>
                    </div>

                    <div class="input-grupo">
                        <label for="valor">Valor (R$):</label>
                        <input type="number" id="valor" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                </div>

                <div class="botoes-form">
                    <button type="submit" id="btn-salvar" class="btn btn-verde">Cadastrar Produto</button>
                    <button type="button" id="btn-cancelar" class="btn btn-cinza" style="display: none;">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Lista de Produtos -->
        <div class="card">
            <h2>Produtos Cadastrados</h2>
            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor (R$)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo">
                        <!-- Os produtos aparecerão aqui via JavaScript -->
                        <tr>
                            <td colspan="5" class="vazio">Nenhum produto cadastrado no estoque.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
