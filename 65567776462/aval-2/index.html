<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas e Rotina</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>✨ Meu Gerenciador de Rotina</h1>
        <p class="subtitulo">Organize suas tarefas diárias por nível de importância</p>

        <!-- Formulário para Adicionar Tarefa -->
        <div class="card">
            <h2>Nova Tarefa</h2>
            <form id="form-tarefa">
                <div class="input-grupo">
                    <label for="descricao">Descrição da Tarefa:</label>
                    <input type="text" id="descricao" placeholder="Ex: Estudar JavaScript, Reunião às 14h..." required>
                </div>

                <div class="input-grupo">
                    <label for="importancia">Nível de Importância:</label>
                    <select id="importancia" required>
                        <option value="" disabled selected>Selecione a importância...</option>
                        <option value="Alta">🔴 Alta</option>
                        <option value="Media">🟡 Média</option>
                        <option value="Baixa">🟢 Baixa</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-principal">Adicionar Tarefa</button>
            </form>
        </div>

        <!-- Lista de Tarefas Organizadas -->
        <div class="card">
            <h2>Tarefas Pendentes e Rotina</h2>
            <div id="lista-tarefas" class="lista-container">
                <!-- As tarefas aparecerão aqui dinamicamente -->
                <p class="vazio">Nenhuma tarefa cadastrada no momento. Aproveite o dia!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
