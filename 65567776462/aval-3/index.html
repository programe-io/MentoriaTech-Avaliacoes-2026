<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMC Orbital</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="stars"></div>

  <main class="painel">
    <header>
      <span class="tag">// SISTEMA DE BORDO</span>
      <h1>IMC <em>Orbital</em></h1>
    </header>

    <section class="controle">
      <label for="peso">
        <span>PESO</span>
        <output id="pesoOut">70 kg</output>
      </label>
      <input type="range" id="peso" min="30" max="200" step="0.5" value="70">

      <label for="altura">
        <span>ALTURA</span>
        <output id="alturaOut">170 cm</output>
      </label>
      <input type="range" id="altura" min="100" max="220" step="1" value="170">
    </section>

    <section class="medidor">
      <svg viewBox="0 0 300 175" id="gauge" aria-hidden="true">
        <g id="arcos"></g>
        <g id="marcas"></g>
        <g id="ponteiro">
          <polygon points="150,45 145,150 155,150" />
          <circle cx="150" cy="150" r="9" />
        </g>
      </svg>

      <div class="leitura">
        <div class="numero" id="numero">0.0</div>
        <div class="categoria" id="categoria">—</div>
      </div>
    </section>

    <section class="info">
      <div class="card">
        <small>PESO IDEAL</small>
        <strong id="ideal">—</strong>
      </div>
      <div class="card">
        <small>MISSÃO</small>
        <strong id="missao">—</strong>
      </div>
    </section>

    <p class="aviso">O IMC é só uma referência. Para avaliação completa, consulte um profissional de saúde.</p>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
