
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentoria Tech - Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="cabecalho">
    <p>PROJETO EDUCACIONAL</p>
    <h1>Gerenciador de Tarefas</h1>
    <p>Organize suas atividades e acompanhe suas prioridades.</p>
  </header>

  <main class="container">
    <section class="resumos">
      <article class="cartao">
        <span>Total de tarefas</span>
        <strong id="total">0</strong>
      </article>
      <article class="cartao">
        <span>Pendentes</span>
        <strong id="pendentes">0</strong>
      </article>
      <article class="cartao">
        <span>Concluídas</span>
        <strong id="concluidas">0</strong>
      </article>
    </section>

    <section class="painel">
      <h2>Cadastrar tarefa</h2>
      <form id="form-tarefa">
        <div class="campo">
          <label for="titulo">Título da tarefa</label>
          <input id="titulo" type="text" minlength="5"
            placeholder="Ex.: Estudar programação" required>
        </div>

        <div class="campo">
          <label for="prioridade">Prioridade</label>
          <select id="prioridade" required>
            <option value="1">1 - Baixa</option>
            <option value="2">2 - Média</option>
            <option value="3">3 - Alta</option>
          </select>
        </div>

        <button type="submit">Cadastrar tarefa</button>
      </form>
      <p id="mensagem" role="status"></p>
    </section>

    <section class="painel">
      <h2>Minhas tarefas</h2>
      <div class="filtros">
        <label for="filtro">Mostrar:</label>
        <select id="filtro">
          <option value="todas">Todas as tarefas</option>
          <option value="pendentes">Pendentes</option>
          <option value="concluidas">Concluídas</option>
        </select>
      </div>
      <div id="lista-tarefas"></div>
    </section>

    <footer>Mentoria Tech • Projeto educacional</footer>
  </main>
<script src="script.js"></script></body>
</html>
