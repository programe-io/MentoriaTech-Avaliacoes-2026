<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="feed-container">
    <header class="feed-header">
        <h2>Mini Feed Social</h2>
    </header>

    <!-- Área para criar uma nova publicação -->
    <div class="post-box">
        <textarea id="post-input" placeholder="O que você está pensando agora?"></textarea>
        <button id="post-button" onclick="publicarPost()">Publicar</button>
    </div>

    <!-- Linha do tempo onde as mensagens vão aparecer -->
    <div class="timeline" id="timeline">
        <!-- Os posts serão inseridos aqui via JavaScript -->
        <div class="post">
            <div class="post-header">
                <strong>Usuário Exemplo</strong>
                <span class="post-time">Agora mesmo</span>
            </div>
            <p class="post-content">Bem-vindo ao seu novo feed social! Digite algo acima para testar a publicação em tempo real.</p>
        </div>
    </div>
</div>
  <script src="script.js"></script>
  
</body>
</html>
