<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="login-box">
        <!-- Logo do Instagram -->
        <div class="logo">
            <img src="https://wikimedia.org" alt="Instagram">
        </div>
        
        <!-- Formulário de Login -->
        <form id="login-form">
            <div class="input-field">
                <input type="text" id="username" placeholder="Telefone, nome de usuário ou email" required>
            </div>
            <div class="input-field">
                <input type="password" id="password" placeholder="Senha" required>
            </div>
            <button type="submit" id="btn-login" disabled>Entrar</button>
        </form>

        <!-- Divisor OU -->
        <div class="separator">
            <div class="line"></div>
            <div class="or">OU</div>
            <div class="line"></div>
        </div>

        <!-- Login com Facebook / Esqueceu a senha -->
        <div class="facebook-login">
            <a href="#">Entrar com o Facebook</a>
        </div>
        <div class="forgot-password">
            <a href="#">Esqueceu a senha?</a>
        </div>
    </div>

    <!-- Caixa de Cadastro -->
    <div class="signup-box">
        <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
    </div>
</div>


  <script src="script.js"></script>
  
</body>
</html>
