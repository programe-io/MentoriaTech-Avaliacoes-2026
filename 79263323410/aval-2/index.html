<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoFeed - Social</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importando ícones e fontes -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Barra de Navegação Superior -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-brands fa-bitcoin"></i> Crypto<span>Connect</span>
        </div>
        <div class="user-profile">
            <img src="https://i.pravatar.cc/150?img=11" alt="Perfil">
            <span>Satoshi_BR</span>
        </div>
    </header>

    <div class="container">
        <!-- Barra Lateral (Mercado) -->
        <aside class="sidebar">
            <h3>📈 Trending Coins</h3>
            <ul class="trending-list">
                <li><span>Bitcoin (BTC)</span> <span class="green">+5.2%</span></li>
                <li><span>Ethereum (ETH)</span> <span class="green">+2.1%</span></li>
                <li><span>Solana (SOL)</span> <span class="red">-1.4%</span></li>
                <li><span>Cardano (ADA)</span> <span class="green">+0.8%</span></li>
            </ul>
        </aside>

        <!-- Feed Principal -->
        <main class="feed">
            <!-- Caixa de nova postagem -->
            <div class="create-post">
                <textarea id="postInput" placeholder="Quais são suas análises do mercado hoje?"></textarea>
                <div class="post-actions">
                    <button class="icon-btn"><i class="fa-solid fa-chart-line"></i></button>
                    <button class="icon-btn"><i class="fa-solid fa-image"></i></button>
                    <button id="postBtn" class="btn-primary">Publicar</button>
                </div>
            </div>

            <!-- Lista de Postagens -->
            <div id="postsContainer">
                <!-- Os posts serão inseridos aqui pelo JavaScript -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
