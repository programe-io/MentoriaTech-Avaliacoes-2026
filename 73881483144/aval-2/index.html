
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas tarefas com facilidade!</p>

        <form id="formTarefa">
            <label for="titulo">Título da tarefa:</label>
            <input type="text" id="titulo"
                   placeholder="Digite uma tarefa" required>

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade">
                <option value="1">Baixa</option>
                <option value="2">Média</option>
                <option value="3">Alta</option>
            </select>

            <button type="submit">Cadastrar tarefa</button>
        </form>

        <h2>Minhas tarefas</h2>
        <ul id="listaTarefas"></ul>
    </div>

    <script>
        let tarefas = [];
        let geradorCodigo = 0;

        function cadastrarTarefa(titulo, prioridade) {
            if (titulo.trim().length < 5) {
                alert("O título deve ter no mínimo 5 caracteres!");
                return;
            }

            const tarefa = {
                codigo: ++geradorCodigo,
                titulo: titulo.trim(),
                prioridade: Number(prioridade),
                status: true
            };

            tarefas.push(tarefa);
            listarTarefas();
        }

        function listarTarefas() {
            const lista = document.getElementById("listaTarefas");
            lista.innerHTML = "";

            tarefas.forEach(tarefa => {
                const item = document.createElement("li");
                const texto = document.createElement("span");

                texto.textContent =
                    tarefa.titulo + " — Prioridade " + tarefa.prioridade +
                    (tarefa.status ? " — Pendente" : " — Concluída");

                if (!tarefa.status) {
                    texto.classList.add("concluida");
                }

                item.appendChild(texto);

                if (tarefa.status) {
                    const concluir = document.createElement("button");
                    concluir.textContent = "Concluir";
                    concluir.type = "button";

                    concluir.addEventListener("click", () => {
                        tarefa.status = false;
                        listarTarefas();
                    });

                    item.appendChild(concluir);
                }

                const alterar = document.createElement("button");
                alterar.textContent = "Alterar prioridade";
                alterar.type = "button";

                alterar.addEventListener("click", () => {
                    const nova = prompt(
                        "Digite a prioridade: 1 (baixa), 2 (média), 3 (alta)"
                    );

                    if (nova === null) return;

                    if (!["1", "2", "3"].includes(nova)) {
                        alert("Informe uma prioridade entre 1 e 3.");
                        return;
                    }

                    tarefa.prioridade = Number(nova);
                    listarTarefas();
                });

                item.appendChild(alterar);
                lista.appendChild(item);
            });
        }

        document.getElementById("formTarefa")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const titulo = document.getElementById("titulo").value;
                const prioridade = document.getElementById("prioridade").value;

                cadastrarTarefa(titulo, prioridade);
                this.reset();
            });
    </script>

<script src="script.js"></script></body>
</html>
