<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="app-container">
    <header>
      <h1>📝 Gerenciador de Tarefas</h1>
      <p>Organize sua rotina com eficiência</p>
    </header>

    <!-- Barra de Progresso -->
    <section class="progress-section">
      <div class="progress-info">
        <span>Progresso das Tarefas</span>
        <span id="progress-text">0% (0/0)</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
    </section>

    <!-- Form de Nova Tarefa -->
    <section class="task-form-container">
      <form id="task-form">
        <div class="input-group">
          <input type="text" id="task-title" placeholder="O que você precisa fazer?" required>
        </div>
        
        <div class="form-row">
          <div class="input-group">
            <label for="task-category">Categoria</label>
            <input type="text" id="task-category" placeholder="Ex: Trabalho, Estudos, Pessoal">
          </div>

          <div class="input-group">
            <label for="task-priority">Prioridade</label>
            <select id="task-priority">
              <option value="low">Baixa</option>
              <option value="medium" selected>Média</option>
              <option value="high">Alta</option>
            </select>
          </div>

          <div class="input-group">
            <label for="task-due-date">Data Limite</label>
            <input type="date" id="task-due-date">
          </div>
        </div>

        <button type="submit" id="btn-add">Adicionar Tarefa</button>
      </form>
    </section>

    <!-- Controles de Filtro e Busca -->
    <section class="controls-container">
      <input type="text" id="search-input" placeholder="🔍 Buscar tarefa...">

      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="pending">Pendentes</button>
        <button class="filter-btn" data-filter="completed">Concluídas</button>
      </div>
    </section>

    <!-- Lista de Tarefas -->
    <section class="tasks-container">
      <ul id="task-list">
        <!-- Itens inseridos via JS -->
      </ul>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
