<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Controle de Estoque</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <h1>📦 Controle de Estoque</h1>
      <p>Gerencie seus produtos com facilidade</p>
    </header>

    <!-- Cards de Resumo -->
    <section class="kpi-container">
      <div class="card">
        <h3>Total de Itens Cadastrados</h3>
        <p id="total-produtos">0</p>
      </div>
      <div class="card">
        <h3>Quantidade Total no Estoque</h3>
        <p id="total-itens">0</p>
      </div>
      <div class="card">
        <h3>Valor Total do Estoque</h3>
        <p id="valor-total">R$ 0,00</p>
      </div>
    </section>

    <div class="content-grid">
      <!-- Formulário de Cadastro -->
      <section class="form-container">
        <h2>Cadastrar / Editar Produto</h2>
        <form id="product-form">
          <input type="hidden" id="product-id">
          
          <div class="form-group">
            <label for="name">Nome do Produto</label>
            <input type="text" id="name" placeholder="Ex: Teclado Mecânico" required>
          </div>

          <div class="form-group">
            <label for="category">Categoria</label>
            <input type="text" id="category" placeholder="Ex: Periféricos" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="quantity">Quantidade</label>
              <input type="number" id="quantity" min="0" placeholder="0" required>
            </div>

            <div class="form-group">
              <label for="price">Preço Unitário (R$)</label>
              <input type="number" id="price" step="0.01" min="0" placeholder="0,00" required>
            </div>
          </div>

          <button type="submit" id="btn-save">Cadastrar Produto</button>
          <button type="button" id="btn-cancel" class="btn-secondary" style="display: none;">Cancelar</button>
        </form>
      </section>

      <!-- Lista e Filtro de Produtos -->
      <section class="table-container">
        <div class="table-header">
          <h2>Produtos em Estoque</h2>
          <input type="text" id="search" placeholder="🔍 Buscar por nome ou categoria...">
        </div>

        <div class="responsive-table">
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Qtd.</th>
                <th>Preço Un.</th>
                <th>Subtotal</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="inventory-table-body">
              <!-- Inserido dinamicamente via JS -->
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
