
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Meu Gerenciador de Tarefas</h1>

        <form id="taskForm">
            <input id="taskInput" type="text"
                placeholder="Digite uma tarefa..." required>

            <select id="priority">
                <option value="Alta">Alta</option>
                <option value="Média">Média</option>
                <option value="Baixa">Baixa</option>
            </select>

            <button type="submit">Adicionar</button>
        </form>

        <div class="filters">
            <button data-filter="todas">Todas</button>
            <button data-filter="pendentes">Pendentes</button>
            <button data-filter="concluidas">Concluídas</button>
        </div>

        <ul id="taskList"></ul>
        <p id="counter">0 tarefas</p>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
