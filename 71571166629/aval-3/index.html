
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<main class="pagina">

    <header class="topo">
        <h1>✚ Ficha de Anamnese</h1>
        <p>Cadastro e histórico de saúde do paciente</p>
    </header>

    <form id="anamneseForm">

        <section class="bloco">
            <h2>1. Dados pessoais</h2>

            <label>Nome completo
                <input type="text" name="nome" required>
            </label>

            <label>Data de nascimento
                <input type="date" name="nascimento" required>
            </label>

            <label>Telefone
                <input type="tel" name="telefone">
            </label>

            <label>E-mail
                <input type="email" name="email">
            </label>

            <label>Profissão
                <input type="text" name="profissao">
            </label>
        </section>

        <section class="bloco">
            <h2>2. Histórico de saúde</h2>

            <label>
                <input type="checkbox" name="condicoes" value="Diabetes">
                Diabetes
            </label>

            <label>
                <input type="checkbox" name="condicoes" value="Hipertensão">
                Hipertensão
            </label>

            <label>
                <input type="checkbox" name="condicoes" value="Problemas cardíacos">
                Problemas cardíacos
            </label>

            <label>Outras condições
                <textarea name="historico"></textarea>
            </label>
        </section>

        <section class="bloco">
            <h2>3. Medicamentos e alergias</h2>

            <label>Medicamentos utilizados
                <textarea name="medicamentos"></textarea>
            </label>

            <label>Possui alguma alergia?
                <textarea name="alergias"></textarea>
            </label>
        </section>

        <section class="bloco">
            <h2>4. Hábitos e rotina</h2>

            <label>Pratica atividade física?
                <select name="atividade">
                    <option>Sim, regularmente</option>
                    <option>Às vezes</option>
                    <option>Não</option>
                </select>
            </label>

            <label>Como avalia seu sono?
                <select name="sono">
                    <option>Bom</option>
                    <option>Regular</option>
                    <option>Ruim</option>
                </select>
            </label>

            <label>Fuma?
                <select name="fuma">
                    <option>Sim</option>
                    <option>Não</option>
                </select>
            </label>
        </section>

        <section class="bloco">
            <h2>5. Motivo do atendimento</h2>

            <label>Qual o motivo da consulta?
                <textarea name="motivo" required></textarea>
            </label>

            <label>O que espera do atendimento?
                <textarea name="expectativa"></textarea>
            </label>
        </section>

        <section class="bloco">
            <h2>6. Confirmação</h2>

            <label>
                <input type="checkbox" required>
                Confirmo que as informações são verdadeiras.
            </label>

            <label>Nome do paciente
                <input type="text" name="assinatura" required>
            </label>

            <label>Data
                <input type="date" name="data" required>
            </label>
        </section>

        <button type="reset">Limpar formulário</button>
        <button type="button" id="imprimir">Imprimir ficha</button>

    </form>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
