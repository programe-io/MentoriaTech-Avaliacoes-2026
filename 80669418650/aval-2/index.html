
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed - Lucas G.</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topo">
        <div class="logo">Mini<span>Feed</span></div>
        <nav>
            <a href="#inicio">Início</a>
            <a href="#perfil">Perfil</a>
        </nav>
    </header>

    <main class="container" id="inicio">

        <section class="perfil" id="perfil">
            <div class="avatar">L</div>
            <div>
                <h2>Lucas G.</h2>
                <p>Bem-vindo ao meu MiniFeed!</p>
            </div>
        </section>

        <section class="criar-post">
            <h2>Nova publicação</h2>
            <textarea id="textoPost" placeholder="Compartilhe alguma coisa..."></textarea>
            <button onclick="publicar()">Publicar</button>
        </section>

        <section id="feed">

            <article class="post">
                <div class="post-usuario">
                    <div class="avatar rosa">M</div>
                    <div>
                        <h3>Maria</h3>
                        <small>Há 10 minutos</small>
                    </div>
                </div>

                <p>Hoje eu vi um filme muito legal! Foi muito divertido assistir. 😄</p>

                <img class="imagem-post"
                     src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=900"
                     alt="Sala de cinema">

                <div class="acoes">
                    <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                    <button onclick="comentar(this)">💬 Comentar</button>
                </div>
            </article>

            <article class="post">
                <div class="post-usuario">
                    <div class="avatar verde">J</div>
                    <div>
                        <h3>João</h3>
                        <small>Há 25 minutos</small>
                    </div>
                </div>

                <p>Alguém recomenda algum filme ou série para assistir hoje?</p>

                <div class="acoes">
                    <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                    <button onclick="comentar(this)">💬 Comentar</button>
                </div>
            </article>

        </section>

    </main>

    <footer>
        <p>MiniFeed © 2026</p>
        <p>Autor: Lucas G.</p>
    </footer>

    <script>
        function publicar() {
            const campo = document.getElementById("textoPost");
            const texto = campo.value.trim();

            if (texto === "") {
                alert("Digite alguma coisa antes de publicar!");
                return;
            }

            const post = document.createElement("article");
            post.className = "post";

            post.innerHTML = `
                <div class="post-usuario">
                    <div class="avatar">L</div>
                    <div>
                        <h3>Lucas G.</h3>
                        <small>Agora mesmo</small>
                    </div>
                </div>

                <p class="texto-publicacao"></p>

                <div class="acoes">
                    <button class="botao-curtir">❤️ Curtir <span>0</span></button>
                    <button class="botao-comentar">💬 Comentar</button>
                </div>
            `;

            post.querySelector(".texto-publicacao").textContent = texto;

            post.querySelector(".botao-curtir").onclick = function() {
                curtir(this);
            };

            post.querySelector(".botao-comentar").onclick = function() {
                comentar(this);
            };

            document.getElementById("feed").prepend(post);
            campo.value = "";
        }

        function curtir(botao) {
            const contador = botao.querySelector("span");
            let numero = Number(contador.textContent);

            numero++;
            contador.textContent = numero;
            botao.classList.toggle("curtido");
        }

        function comentar(botao) {
            const comentario = prompt("Digite seu comentário:");

            if (comentario && comentario.trim() !== "") {
                const area = botao.closest(".post");
                const novoComentario = document.createElement("p");

                novoComentario.className = "comentario";
                novoComentario.textContent = "💬 " + comentario;

                area.appendChild(novoComentario);
            }
        }
    </script>

</body>
</html>
