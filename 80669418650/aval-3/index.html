<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>MiniFeed - Lucas G.</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-800">

  <!-- Cabeçalho -->
  <header class="bg-gradient-to-r from-purple-700 to-indigo-700 px-6 py-5 shadow-lg">
    <div class="mx-auto flex max-w-4xl items-center justify-between">
      <h1 class="text-3xl font-extrabold text-white">MiniFeed</h1>

      <nav class="flex gap-6">
        <a href="#" class="font-semibold text-white hover:text-purple-200">
          Início
        </a>
        <a href="#" class="font-semibold text-white hover:text-purple-200">
          Perfil
        </a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 py-8">

    <!-- Nova publicação -->
    <section class="mb-6 rounded-2xl bg-white p-6 shadow-md">
      <div class="flex items-center gap-4">

        <div class="flex h-14 w-14 items-center justify-center rounded-full bg-indigo-600 text-xl font-bold text-white">
          L
        </div>

        <div class="flex-1">
          <h2 class="font-bold text-lg">Lucas G.</h2>
          <p class="text-sm text-gray-500">
            Compartilhe alguma coisa...
          </p>
        </div>

        <button class="rounded-xl bg-indigo-600 px-6 py-3 font-semibold text-white transition hover:bg-indigo-700">
          Publicar
        </button>

      </div>
    </section>

    <!-- Publicação -->
    <article class="mb-6 rounded-2xl bg-white p-6 shadow-md">

      <div class="flex items-center gap-3">
        <div class="flex h-12 w-12 items-center justify-center rounded-full bg-purple-600 font-bold text-white">
          M
        </div>

        <div>
          <h2 class="font-bold">Maria</h2>
          <p class="text-sm text-gray-500">Há 10 minutos</p>
        </div>
      </div>

      <p class="mt-5 text-lg">
        Hoje eu vi um filme muito legal! Foi muito divertido assistir. 😄
      </p>

      <div class="mt-4 overflow-hidden rounded-xl">
        <img
          src="https://images.unsplash.com/photo-1635805737707-575885ab0820?auto=format&fit=crop&w=800&q=80"
          alt="Imagem de filme de super-herói"
          class="w-full transition duration-300 hover:scale-105"
        >
      </div>

      <div class="mt-5 flex gap-3">
        <button class="rounded-xl bg-purple-600 px-5 py-2 font-semibold text-white hover:bg-purple-700">
          ❤️ Curtir
        </button>

        <button class="rounded-xl border border-purple-600 px-5 py-2 font-semibold text-purple-600 hover:bg-purple-50">
          💬 Comentar
        </button>
      </div>

    </article>

    <!-- Segunda publicação -->
    <article class="rounded-2xl bg-white p-6 shadow-md">

      <div class="flex items-center gap-3">
        <div class="flex h-12 w-12 items-center justify-center rounded-full bg-purple-600 font-bold text-white">
          J
        </div>

        <div>
          <h2 class="font-bold">João</h2>
          <p class="text-sm text-gray-500">Há 25 minutos</p>
        </div>
      </div>

      <p class="mt-5 text-lg">
        Alguém recomenda algum filme ou série para assistir hoje?
      </p>

      <div class="mt-5 flex gap-3">
        <button class="rounded-xl bg-purple-600 px-5 py-2 font-semibold text-white hover:bg-purple-700">
          ❤️ Curtir
        </button>

        <button class="rounded-xl border border-purple-600 px-5 py-2 font-semibold text-purple-600 hover:bg-purple-50">
          💬 Comentar
        </button>
      </div>

    </article>

  </main>

  <!-- Rodapé -->
  <footer class="mt-10 border-t bg-white py-6 text-center">
    <p class="text-sm text-gray-500">
      MiniFeed © 2026
    </p>

    <p class="mt-1 text-sm font-semibold text-purple-700">
      Autor: Lucas G.
    </p>
  </footer>

</body>
</html>
