
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🌎 Meu Feed Social</h1>
        <p>Compartilhe momentos e conecte pessoas!</p>
    </header>

    <main>
        <section class="criar-post">
            <h2>Criar publicação</h2>
            <input type="text" id="nome" placeholder="Seu nome">
            <textarea id="texto" placeholder="O que você está pensando?"></textarea>
            <input type="text" id="imagem" placeholder="Link da imagem (opcional)">
            <button onclick="publicar()">Publicar</button>
        </section>

        <section id="feed">
            <article class="post">
                <h3>Maria Silva</h3>
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Paisagem natural">
                <p>A vida é feita de momentos especiais! ❤️</p>
                <button class="curtir">❤️ Curtir <span>0</span></button>
                <div class="comentarios">
                    <input type="text" placeholder="Escreva um comentário...">
                    <button class="comentar">Comentar</button>
                    <div class="lista-comentarios"></div>
                </div>
            </article>

            <article class="post">
                <h3>João Pedro</h3>
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600" alt="Paisagem ao pôr do sol">
                <p>Aproveitando as maravilhas da natureza! 🌅</p>
                <button class="curtir">❤️ Curtir <span>0</span></button>
                <div class="comentarios">
                    <input type="text" placeholder="Escreva um comentário...">
                    <button class="comentar">Comentar</button>
                    <div class="lista-comentarios"></div>
                </div>
            </article>
        </section>
    </main>

    <footer>
        <p>© 2026 - Mini Feed Social</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
