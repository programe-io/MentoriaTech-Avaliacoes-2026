
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed - Castelo do Piauí</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>📍 Castelo Feed</h1>
        <p>Compartilhe momentos da nossa cidade!</p>
    </header>

    <main>
        <section class="criar-post">
            <h2>Nova publicação</h2>
            <input type="text" id="nome" placeholder="Seu nome">
            <textarea id="texto" placeholder="O que está acontecendo em Castelo?"></textarea>
            <button id="publicar">Publicar</button>
        </section>

        <section id="feed">
            <h2>Últimas publicações</h2>

            <article class="post">
                <h3>Maria Silva</h3>
                <p>Que cidade bonita é Castelo do Piauí! 💚🌵</p>
                <button class="curtir">❤️ Curtir <span>0</span></button>
            </article>

            <article class="post">
                <h3>João Santos</h3>
                <p>Vamos valorizar as belezas naturais da nossa cidade! 📸</p>
                <button class="curtir">❤️ Curtir <span>0</span></button>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
