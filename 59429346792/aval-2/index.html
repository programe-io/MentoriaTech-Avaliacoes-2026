<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cabeçalho */
        header {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #dbdbdb;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
        }

        .nav-container {
            width: 100%;
            max-width: 470px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            font-family: 'Brush Script MT', cursive;
            color: #262626;
        }

        .nav-icons span {
            font-size: 20px;
            margin-left: 16px;
            cursor: pointer;
        }

        /* Container Principal */
        main {
            width: 100%;
            max-width: 470px;
            margin-top: 16px;
        }

        /* Stories */
        .stories {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            gap: 16px;
            overflow-x: auto;
            margin-bottom: 16px;
        }

        .story {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: #262626;
            cursor: pointer;
        }

        .story-ring {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            margin-bottom: 6px;
        }

        .story-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #ffffff;
            object-fit: cover;
        }

        /* Card de Publicação */
        .post {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .user-info img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-image {
            width: 100%;
            height: auto;
            display: block;
            background-color: #efefef;
        }

        .post-actions {
            padding: 12px 16px 8px;
            display: flex;
            justify-content: space-between;
            font-size: 22px;
        }

        .left-actions span {
            margin-right: 14px;
            cursor: pointer;
        }

        .post-likes {
            padding: 0 16px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .post-caption {
            padding: 0 16px 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .post-caption strong {
            margin-right: 6px;
        }

        .post-time {
            padding: 0 16px 16px;
            font-size: 10px;
            color: #8e8e8e;
            text-transform: uppercase;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">Instagram</div>
            <div class="nav-icons">
                <span>❤️</span>
                <span>✉️</span>
            </div>
        </div>
    </header>

    <main>
        <!-- Barra de Stories -->
        <section class="stories">
            <div class="story">
                <div class="story-ring">
                    <img src="https://picsum.photos" alt="Usuário 1">
                </div>
                <span>seu_story</span>
            </div>
            <div class="story">
                <div class="story-ring">
                    <img src="https://picsum.photos" alt="Usuário 2">
                </div>
                <span>ana.dev</span>
            </div>
            <div class="story">
                <div class="story-ring">
                    <img src="https://picsum.photos" alt="Usuário 3">
                </div>
                <span>carlos_ui</span>
            </div>
            <div class="story">
                <div class="story-ring">
                    <img src="https://picsum.photos" alt="Usuário 4">
                </div>
                <span>viagens_br</span>
            </div>
        </section>

        <!-- Postagem -->
        <article class="post">
            <div class="post-header">
                <div class="user-info">
                    <img src="https://picsum.photos" alt="Avatar">
                    <span>ana.dev</span>
                </div>
                <span>•••</span>
            </div>

            <img class="post-image" src="https://picsum.photos" alt="Foto do post">

            <div class="post-actions">
                <div class="left-actions">
                    <span onclick="curtir(this)">🤍</span>
                    <span>💬</span>
                    <span>🚀</span>
                </div>
                <span>🔖</span>
            </div>

            <div class="post-likes" id="likes-count">1.240 curtidas</div>

            <div class="post-caption">
                <strong>ana.dev</strong>Finalizando mais um projeto de front-end hoje! O que acharam do resultado? 💻✨
            </div>

            <div class="post-time">Há 2 horas</div>
        </article>
    </main>

    <script>
        let curtido = false;
        let totalCurtidas = 1240;

        function curtir(elemento) {
            const contador = document.getElementById('likes-count');
            if (!curtido) {
                elemento.textContent = '❤️';
                totalCurtidas++;
                curtido = true;
            } else {
                elemento.textContent = '🤍';
                totalCurtidas--;
                curtido = false;
            }
            contador.textContent = totalCurtidas.toLocaleString('pt-BR') + ' curtidas';
        }
    </script>

<script src="script.js"></script></body>
</html>
