
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <aside class="sidebar">
        <h1>Instagram</h1>

        <nav>
            <a href="#">🏠 Início</a>
            <a href="#">🔍 Pesquisar</a>
            <a href="#">🎬 Reels</a>
            <a href="#">💬 Mensagens</a>
            <a href="#">❤️ Notificações</a>
            <a href="#">➕ Criar</a>
            <a href="#">👤 Perfil</a>
        </nav>
    </aside>

    <main>
        <section class="stories">
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=12">
                <p>Seu story</p>
            </div>
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=5">
                <p>Mariana</p>
            </div>
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=8">
                <p>Pedro</p>
            </div>
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=9">
                <p>Carolina</p>
            </div>
        </section>

        <section class="feed" id="feed">

            <article class="post">
                <div class="post-header">
                    <img src="https://i.pravatar.cc/100?img=5">
                    <strong>mariana.silva</strong>
                </div>

                <img class="post-image"
                    src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=700">

                <div class="actions">
                    <button class="like">♡</button>
                    <button class="comment-focus">💬</button>
                    <button>➤</button>
                </div>

                <p class="likes">120 curtidas</p>
                <p class="caption">
                    <strong>mariana.silva</strong>
                    Aproveitando cada momento! ❤️
                </p>

                <div class="comments"></div>

                <form class="comment-form">
                    <input type="text" placeholder="Adicione um comentário...">
                    <button type="submit">Publicar</button>
                </form>
            </article>

        </section>

        <section class="create-post">
            <h3>Criar publicação</h3>
            <input type="file" id="imageInput" accept="image/*">
            <input type="text" id="captionInput" placeholder="Escreva uma legenda...">
            <button id="publishButton">Publicar</button>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
