
<!DOCTYPE html>

<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>📰 NewsFeed</h1>
    <nav>
        <a href="#">Início</a>
        <a href="#">Tecnologia</a>
        <a href="#">Esportes</a>
        <a href="#">Entretenimento</a>
    </nav>
</header>

<section class="banner">
    <h2>Fique por dentro do mundo!</h2>
    <p>As principais notícias em um só lugar.</p>
</section>

<main>
    <div class="pesquisa">
        <input type="text" id="busca"
        placeholder="Pesquisar notícias...">
        <button onclick="pesquisar()">Pesquisar</button>
    </div>

    <div class="categorias">
        <button onclick="filtrar('Todas')">Todas</button>
        <button onclick="filtrar('Tecnologia')">Tecnologia</button>
        <button onclick="filtrar('Esportes')">Esportes</button>
        <button onclick="filtrar('Mundo')">Mundo</button>
    </div>

    <section id="feed" class="feed"></section>
</main>

<footer>

</footer>
