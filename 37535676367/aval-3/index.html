
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora GSM</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Calculadora GSM</h1>
        <p>Calcule o peso do material facilmente</p>

        <form action="CalculadoraGSM" method="post">

            <label>Largura (metros)</label>
            <input type="number" step="0.01"
                   name="largura" placeholder="Ex: 1.50" required>

            <label>Comprimento (metros)</label>
            <input type="number" step="0.01"
                   name="comprimento" placeholder="Ex: 100" required>

            <label>Gramatura (GSM)</label>
            <input type="number" step="0.01"
                   name="gsm" placeholder="Ex: 150" required>

            <button type="submit">Calcular peso</button>

        </form>
    </div>

<script src="script.js"></script></body>
</html>
