<!DOCTYPE html>
<html lang="pt-br">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>


<body>


    <header>


        <div class="header-content">


            <h1>MiniFeed</h1>


            <nav>
                <a href="#">Inicio</a>
                <a href="#">Perfil</a>
            </nav>




        </div>


    </header>


    <main>


        <section class="new-post">


            <div class="user">


                <div class="avatar">
                    S
                </div>


                <div>
                  <strong>murilo</strong>
                  <span>na sua opniao qual foi melhor filme do ano?</span>
                </div>


            </div>


            <button>Publicar</button>




        </section>


        <article class="post">


            <div class="post-header">


             <div class="avatar">
                    N
                </div>


                <div>
                  <strong>murilo</strong>
                  <span>Há 10 minutos</span>
                </div>


            </div>


            <div class="post-text">
                na minha opniao o melhor filme foi velozes e furioso
            </div>
            <img src=https://upload.wikimedia.org/wikipedia/pt/8/8f/Fast_and_Furious_Poster.jpg?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original


            <div class="post-actions">


                <button>Curtir</button>
                <button>Comentar</button>


            </div>




        </article>






    </main>


    <footer>
        <p>MiniFeed - Todos os Direitos Reservados murilo - 2026</p>
    </footer>


    </body>
</html>
