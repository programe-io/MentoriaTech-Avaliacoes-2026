
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Controle de Estoque</h1>
        <p>Gerencie seus produtos facilmente</p>
    </header>

    <main>

        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <input type="text" id="descricao" placeholder="Nome do produto">

            <input type="number" id="quantidade" placeholder="Quantidade">

            <input type="number" id="valor" placeholder="Valor do produto">

            <button onclick="cadastrarProduto()">
                Cadastrar Produto
            </button>
        </section>

        <section class="resumo">
            <div class="card">
                <h3>Total de Produtos</h3>
                <p id="totalProdutos">0</p>
            </div>

            <div class="card">
                <h3>Unidades em Estoque</h3>
                <p id="totalUnidades">0</p>
            </div>

            <div class="card">
                <h3>Valor do Estoque</h3>
                <p id="valorEstoque">R$ 0,00</p>
            </div>
        </section>

        <section class="busca">
            <h2>Buscar Produto</h2>
            <input type="number" id="buscarCodigo"
                placeholder="Digite o código">
            <button onclick="buscarProduto()">Buscar</button>
            <p id="resultadoBusca"></p>
        </section>

        <section class="tabela">
            <h2>Lista de Produtos</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                </tbody>
            </table>
        </section>

    </main>

    <footer>
        <p>Sistema de Controle de Estoque © 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
