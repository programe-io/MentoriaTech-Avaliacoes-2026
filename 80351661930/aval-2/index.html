<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clone Instagram - Parte 1</title>

  <!-- Tailwind CSS via CDN, conforme o material da aula -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Ícones Boxicons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <!-- CSS personalizado separado -->
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="min-h-screen bg-gray-100 text-slate-900">

  <!-- Cabeçalho -->
  <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-4">
      <div class="flex items-center justify-between h-14">
        <h1 class="text-xl font-semibold">Instagram</h1>
        <button type="button" class="text-2xl" aria-label="Abrir menu">
          <i class="bx bx-menu"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo principal -->
  <main class="max-w-5xl mx-auto py-4 pb-20 px-4">
    <div class="flex gap-8">
      <!-- Feed -->
      <div class="flex-1 max-w-lg mx-auto">

        <!-- Área dos stories -->
        <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">
          <div class="story-list flex gap-4 overflow-x-auto">

            <!-- Adicionar story -->
            <div class="flex flex-col items-center flex-shrink-0">
              <div class="w-16 h-16 rounded-full p-2 bg-gray-100">
                <div class="w-full h-full rounded-full bg-white">
                  <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">
                    <span class="text-2xl text-gray-500">+</span>
                  </div>
                </div>
              </div>
              <span class="text-xs mt-1 w-16 text-center">Seu story</span>
            </div>

            <!-- Story de contato -->
            <div class="flex flex-col items-center flex-shrink-0">
              <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                <div class="w-full h-full rounded-full bg-white p-0.5">
                  <img
                    src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=160&h=160&fit=crop"
                    alt="Foto de perfil do story de João"
                    class="w-full h-full object-cover rounded-full">
                </div>
              </div>
              <span class="text-xs mt-1 w-16 text-center truncate">João</span>
            </div>

            <div class="flex flex-col items-center flex-shrink-0">
              <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                <div class="w-full h-full rounded-full bg-white p-0.5">
                  <img
                    src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=160&h=160&fit=crop"
                    alt="Foto de perfil do story de Pedro"
                    class="w-full h-full object-cover rounded-full">
                </div>
              </div>
              <span class="text-xs mt-1 w-16 text-center truncate">Pedro</span>
            </div>

            <div class="flex flex-col items-center flex-shrink-0">
              <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                <div class="w-full h-full rounded-full bg-white p-0.5">
                  <img
                    src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=160&h=160&fit=crop"
                    alt="Foto de perfil do story de Ana"
                    class="w-full h-full object-cover rounded-full">
                </div>
              </div>
              <span class="text-xs mt-1 w-16 text-center truncate">Ana</span>
            </div>

            <div class="flex flex-col items-center flex-shrink-0">
              <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                <div class="w-full h-full rounded-full bg-white p-0.5">
                  <img
                    src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=160&h=160&fit=crop"
                    alt="Foto de perfil do story de Lucas"
                    class="w-full h-full object-cover rounded-full">
                </div>
              </div>
              <span class="text-xs mt-1 w-16 text-center truncate">Lucas</span>
            </div>

          </div>
        </section>

        <!-- Início do feed de postagens -->
        <article class="bg-white border border-gray-200 rounded-lg mb-4">
          <header class="flex items-center justify-between p-3">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                <div class="w-full h-full rounded-full bg-white p-0.5">
                  <img
                    src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&h=120&fit=crop"
                    alt="Foto de perfil do autor da publicação"
                    class="w-full h-full object-cover rounded-full">
                </div>
              </div>
              <!-- A parte 1 inicia a montagem do cabeçalho da postagem -->
            </div>
          </header>
        </article>

      </div>
    </div>

      </div>
    </div>
  </main>

</body>
</html>

$0  </main>

</body>
</html>
