<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerUp - Orientação Profissional</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>CareerUp</h1>
        <p>Descubra seu caminho profissional!</p>
    </header>

    <main>
        <section class="card">
            <h2>Vamos conhecer você?</h2>
            <p>Preencha seus dados e escolha uma área de interesse.</p>

            <form id="formulario">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Seu nome" required>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" min="1" max="120" required>

                <label for="area">Área profissional:</label>
                <select id="area" required>
                    <option value="">Escolha uma área</option>
                    <option value="Tecnologia">Tecnologia</option>
                    <option value="Saúde">Saúde</option>
                    <option value="Educação">Educação</option>
                    <option value="Comunicação">Comunicação</option>
                    <option value="Engenharia">Engenharia</option>
                    <option value="Direito">Direito</option>
                </select>

                <button type="submit">Conhecer meu perfil</button>
            </form>

            <div id="resultado" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        <p>CareerUp © 2026 | Projeto Mentoria Tech</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
