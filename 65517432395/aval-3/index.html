<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerUp 3.0 - Meu Futuro</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>CareerUp 3.0</h1>
    <p>Planeje hoje as conquistas do seu amanhã.</p>
</header>

<main class="container">

    <section class="card">
        <h2>Meu perfil profissional</h2>

        <form id="perfilForm">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="area">Área profissional:</label>
            <select id="area" required>
                <option value="">Escolha uma área</option>
                <option value="Tecnologia">Tecnologia</option>
                <option value="Saúde">Saúde</option>
                <option value="Educação">Educação</option>
                <option value="Comunicação">Comunicação</option>
                <option value="Engenharia">Engenharia</option>
                <option value="Direito">Direito</option>
            </select>

            <button type="submit">Salvar meu perfil</button>
        </form>

        <div id="perfilSalvo"></div>
    </section>

    <section class="card">
        <h2>Minhas metas profissionais</h2>

        <form id="metaForm">
            <label for="meta">Qual é seu objetivo?</label>
            <input type="text" id="meta"
                placeholder="Ex: Fazer um curso de programação" required>

            <button type="submit">Adicionar meta</button>
        </form>
    </section>

    <section class="card">
        <h2>Painel de progresso</h2>

        <div class="estatisticas">
            <p>Total de metas: <strong id="total">0</strong></p>
            <p>Concluídas: <strong id="concluidas">0</strong></p>
            <p>Pendentes: <strong id="pendentes">0</strong></p>
            <p>Progresso: <strong id="progresso">0%</strong></p>
        </div>

        <div id="listaMetas"></div>
    </section>

</main>

<footer>
    <p>CareerUp 3.0 © 2026 | Mentoria Tech</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
