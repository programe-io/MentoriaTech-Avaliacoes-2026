<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerUp 2.0</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>CareerUp 2.0</h1>
    <p>Descubra suas áreas de interesse!</p>
</header>

<main>
    <section class="card">
        <h2>Questionário Profissional</h2>
        <p>Escolha as atividades que mais combinam com você.</p>

        <form id="questionario">

            <label for="interesse1">1. Qual atividade você prefere?</label>
            <select id="interesse1" required>
                <option value="">Selecione</option>
                <option value="Tecnologia">Criar aplicativos e sistemas</option>
                <option value="Saúde">Cuidar de pessoas</option>
                <option value="Educação">Ensinar e compartilhar conhecimentos</option>
                <option value="Comunicação">Produzir conteúdos e comunicar</option>
            </select>

            <label for="interesse2">2. Em qual atividade você se destaca?</label>
            <select id="interesse2" required>
                <option value="">Selecione</option>
                <option value="Tecnologia">Resolver problemas tecnológicos</option>
                <option value="Saúde">Ajudar pessoas</option>
                <option value="Educação">Explicar assuntos</option>
                <option value="Comunicação">Expressar ideias</option>
            </select>

            <label for="interesse3">3. Qual ambiente você prefere?</label>
            <select id="interesse3" required>
                <option value="">Selecione</option>
                <option value="Tecnologia">Laboratórios e computadores</option>
                <option value="Saúde">Hospitais e clínicas</option>
                <option value="Educação">Escolas e instituições</option>
                <option value="Comunicação">Estúdios e ambientes criativos</option>
            </select>

            <button type="submit">Descobrir meu perfil</button>
        </form>

        <div id="resultado"></div>
        <div id="profissoes"></div>
    </section>
</main>

<footer>
    <p>CareerUp 2.0 © 2026</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
