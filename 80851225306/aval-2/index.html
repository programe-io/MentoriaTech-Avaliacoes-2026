
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Meu Feed Social</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>Conecta</h1>
                                    <input type="text" placeholder="Pesquisar...">
                                        </header>

                                            <div class="container">

                                                    <aside class="sidebar">
                                                                <h3>Menu</h3>
                                                                            <ul>
                                                                                            <li>🏠 Início</li>
                                                                                                            <li>👤 Meu perfil</li>
                                                                                                                            <li>💬 Mensagens</li>
                                                                                                                                            <li>⚙️ Configurações</li>
                                                                                                                                                        </ul>
                                                                                                                                                                </aside>

                                                                                                                                                                        <main class="feed">

                                                                                                                                                                                    <section class="create-post">
                                                                                                                                                                                                    <textarea placeholder="O que você está pensando?"></textarea>
                                                                                                                                                                                                                    <button type="button">Publicar</button>
                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                            <article class="post">
                                                                                                                                                                                                                                                            <div class="post-header">
                                                                                                                                                                                                                                                                                <img class="avatar"
                                                                                                                                                                                                                                                                                                         src="https://i.pravatar.cc/100?img=12"
                                                                                                                                                                                                                                                                                                                                  alt="Foto de perfil">
                                                                                                                                                                                                                                                                                                                                                      <div>
                                                                                                                                                                                                                                                                                                                                                                              <h3>Maria Silva</h3>
                                                                                                                                                                                                                                                                                                                                                                                                      <span>Há 10 minutos</span>
                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                          <p>Olá, pessoal! Bem-vindos ao meu feed. 😊</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <img class="post-image"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               src="https://picsum.photos/600/350"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alt="Paisagem publicada">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="post-stats">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ❤️ 120 curtidas · 💬 18 comentários
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="post-actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button type="button">❤️ Curtir</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button type="button">💬 Comentar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button type="button">↗ Compartilhar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </article>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </main>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
