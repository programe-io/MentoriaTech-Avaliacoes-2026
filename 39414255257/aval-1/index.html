<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <h1>Sistema de Estoque</h1>

        <section class="resumo">
            <div class="card">
                <h3>Produtos cadastrados</h3>
                <p id="totalProdutos">0</p>
            </div>
            <div class="card">
                <h3>Unidades em estoque</h3>
                <p id="totalUnidades">0</p>
            </div>
            <div class="card">
                <h3>Produtos sem estoque</h3>
                <p id="semEstoque">0</p>
            </div>
        </section>

        <form id="formEstoque">
            <input type="text" id="codigo" placeholder="Código" required>
            <input type="text" id="descricao" placeholder="Descrição do produto" required>
            <input type="number" id="quantidade" placeholder="Quantidade" min="0" step="1" required>
            <button type="submit" id="botaoSalvar">Cadastrar</button>
        </form>

        <input type="text" id="pesquisa" class="pesquisa" placeholder="Pesquisar produto">

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaProdutos"></tbody>
            </table>
        </div>
    </main>
<script src="script.js"></script></body>
</html>
