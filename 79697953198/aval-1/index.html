<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>DevFit: Code & Gain</title>
                <!-- Vinculando o CSS ("Casa") -->
                    <link rel="stylesheet" href="style.css">
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                    <body>

                        <div class="game-container">
                                <!-- LADO ESQUERDO: Status do Atleta -->
                                        <div class="painel-status">
                                                    <h2>🏋️‍♂️ Programador Maromba</h2>
                                                                <div class="avatar" id="avatar">👶 Iniciante</div>
                                                                            
                                                                                        <div class="status-group">
                                                                                                        <p>Nível: <span id="nivel">1</span></p>
                                                                                                                        <p>Força: <span id="forca">0</span> / 100 XP</p>
                                                                                                                                    </div>

                                                                                                                                                <div class="barra-progresso">
                                                                                                                                                                <div id="progresso"></div>
                                                                                                                                                                            </div>
                                                                                                                                                                                        
                                                                                                                                                                                                    <p id="feedback" class="mensagem">Complete o código para treinar!</p>
                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                    <!-- LADO DIREITO: Terminal de Programação -->
                                                                                                                                                                                                                            <div class="painel-codigo">
                                                                                                                                                                                                                                        <h3>🖥️ Terminal de Treino</h3>
                                                                                                                                                                                                                                                    <p class="instrucao">Digite exatamente o código abaixo para fazer uma repetição:</p>
                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                            <div class="codigo-referencia" id="codigo-alvo"></div>

                                                                                                                                                                                                                                                                                        <div class="input-area">
                                                                                                                                                                                                                                                                                                        <span>></span>
                                                                                                                                                                                                                                                                                                                        <input type="text" id="input-codigo" placeholder="Digite o código aqui e aperte Enter..." autocomplete="off" autofocus>
                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                            <p class="dica">Dica: Respeite letras maiúsculas, minúsculas e espaços!</p>
                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                            <!-- Vinculando a Lógica (JavaScript) -->
                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                </html>
