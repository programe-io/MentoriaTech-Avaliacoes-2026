<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avaliação Mentoria TEC Seduc Piauí</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    background: linear-gradient(135deg,#0f9d58,#006633);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:900px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.header{
    background:#006633;
    color:white;
    text-align:center;
    padding:30px;
}

.header h1{
    margin-bottom:10px;
}

.header p{
    opacity:0.9;
}

.form-content{
    padding:30px;
}

.section-title{
    color:#006633;
    margin-bottom:15px;
    font-size:20px;
    border-left:5px solid #0f9d58;
    padding-left:10px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:25px;
}

.full-width{
    grid-column:1 / -1;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#333;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:15px;
    transition:0.3s;
}

input:focus,
textarea:focus{
    border-color:#0f9d58;
    outline:none;
    box-shadow:0 0 8px rgba(15,157,88,0.3);
}

textarea{
    resize:vertical;
    min-height:120px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:30px;
}

.btn{
    padding:12px 30px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.btn-enviar{
    background:#006633;
    color:white;
}

.btn-enviar:hover{
    background:#004d26;
}

.btn-limpar{
    background:#e0e0e0;
}

.btn-limpar:hover{
    background:#cfcfcf;
}

.footer{
    text-align:center;
    padding:15px;
    background:#f5f5f5;
    color:#666;
    font-size:14px;
}

@media(max-width:768px){
    .form-grid{
        grid-template-columns:1fr;
    }
}

</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>📋 Avaliação da Mentoria TEC</h1>
        <p>SEDUC Piauí - 2º Ano de Desenvolvimento</p>
    </div>

    <form>

        <div class="form-content">

            <h2 class="section-title">Informações Gerais</h2>

            <div class="form-grid">

                <div>
                    <label>Nome do Mentor(a)</label>
                    <input type="text" placeholder= "Carina Emanuelly Rocha Silva">
                </div>

                <div>
                    <label>Escola</label>
                    <input type="text" placeholder="CETI Aprigio Pereira Bezerra">
                </div>

                <div>
                    <label>Município</label>
                    <input type="text" placeholder="São Julião">
                </div>

                <div>
                    <label>Data da Avaliação</label>
                    <input type="date">
                </div>

            </div>

            <h2 class="section-title">Desenvolvimento da Mentoria</h2>

            <div class="form-grid">

                <div class="full-width">
                    <label>Principais Atividades Desenvolvidas</label>
                    <textarea placeholder="Realização de mentorias em programação, acompanhamento de projetos tecnológicos, resolução de exercícios de lógica, uso da plataforma Programe.IO, orientação no desenvolvimento de softwares e incentivo à inovação e ao trabalho em equipe."></textarea>
                </div>

                <div class="full-width">
                    <label>Resultados Alcançados</label>
                    <textarea placeholder="Melhoria no aprendizado dos estudantes em programação e tecnologia, maior participação nas atividades propostas, desenvolvimento de projetos práticos, fortalecimento do raciocínio lógico e aprimoramento das habilidades digitais e de trabalho em equipe."></textarea>
                </div>

                <div class="full-width">
                    <label>Dificuldades Encontradas</label>
                    <textarea placeholder="Algumas dificuldades incluíram a adaptação dos estudantes aos conteúdos de programação, diferenças no nível de conhecimento da turma, limitações de acesso à internet ou equipamentos em alguns momentos e desafios para manter a participação e o engajamento de todos os alunos durante as atividades."></textarea>
                </div>

                <div class="full-width">
                    <label>Considerações Finais</label>
                    <textarea placeholder="A mentoria contribuiu significativamente para o desenvolvimento das competências tecnológicas dos estudantes, promovendo aprendizado prático, raciocínio lógico e trabalho em equipe. Apesar dos desafios encontrados, os objetivos propostos foram alcançados, proporcionando uma experiência enriquecedora e incentivando o interesse dos alunos pela área de tecnologia."></textarea>
                </div>

            </div>

            <div class="buttons">
                <button type="submit" class="btn btn-enviar">
                    Enviar Avaliação
                </button>

                <button type="reset" class="btn btn-limpar">
                    Limpar Campos
                </button>
            </div>

        </div>

    </form>

    <div class="footer">
        Sistema de Avaliação • Mentoria TEC Seduc Piauí
    </div>

</div>

</body>
</html>
