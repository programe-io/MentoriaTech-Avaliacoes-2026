
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sistema Comercial</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0;background:#f1f4f8;color:#263445}
header{background:#183b56;color:white;padding:25px 6%;font-size:28px;font-weight:bold}
main{max-width:1200px;margin:35px auto;padding:0 25px}
.card{background:white;padding:28px;border-radius:12px;margin-bottom:25px;box-shadow:0 3px 12px #dce2e9}
h2{color:#183b56;margin-top:0}
input{padding:14px;margin:7px 5px 7px 0;border:1px solid #ccd5df;border-radius:6px;font-size:17px}
button{padding:14px 22px;background:#167d65;color:white;border:0;border-radius:6px;font-size:16px;cursor:pointer}
button:hover{background:#105c4b}
table{width:100%;border-collapse:collapse;margin-top:18px}
th,td{padding:17px;text-align:left;border-bottom:1px solid #e1e6ec;font-size:17px}
th{background:#eaf0f5;color:#183b56}
.resumo{display:flex;gap:20px;flex-wrap:wrap}
.resumo div{background:#e7f4ef;padding:18px;border-radius:8px;flex:1;min-width:180px}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header>▦ Sistema Comercial</header>
<main>
<section class="resumo">
<div><strong>CONTROLE DE ESTOQUE</strong><p>Cadastro e gerenciamento de produtos</p></div>
</section>
<section class="card">
<h2>Cadastrar produto</h2>
<input id="nome" placeholder="Descrição do produto">
<input id="qtd" type="number" placeholder="Quantidade">
<input id="valor" type="number" step="0.01" placeholder="Valor (R$)">
<button onclick="cadastrar()">+ Cadastrar</button>
</section>
<section class="card">
<h2>Produtos cadastrados</h2>
<table>
<thead><tr><th>Código</th><th>Produto</th><th>Quantidade</th><th>Valor unitário</th></tr></thead>
<tbody id="lista"><tr><td colspan="4">Nenhum produto cadastrado.</td></tr></tbody>
</table>
</section>
</main>
<script>
let produtos=[];
function cadastrar(){
let nome=document.getElementById("nome").value.trim();
let qtd=document.getElementById("qtd").value;
let valor=document.getElementById("valor").value;
if(nome.length<5||qtd===""||Number(qtd)<1||valor===""||Number(valor)<0){alert("Confira os dados informados!");return}
produtos.push({codigo:produtos.length+1,nome:nome,qtd:Number(qtd),valor:Number(valor)});
document.getElementById("nome").value="";
document.getElementById("qtd").value="";
document.getElementById("valor").value="";
lista.innerHTML="";
produtos.forEach(p=>lista.innerHTML+=`<tr><td>${p.codigo}</td><td>${p.nome}</td><td>${p.qtd}</td><td>R$ ${p.valor.toFixed(2).replace(".",",")}</td></tr>`);
}
</script>
<script src="script.js"></script></body>
</html>
