
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Cadastro e gerenciamento de produtos</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">
                <input type="text" id="codigo"
                    placeholder="Código do produto" required>

                <input type="text" id="descricao"
                    placeholder="Descrição do produto" required>

                <input type="number" id="quantidade"
                    placeholder="Quantidade" min="0" step="1" required>

                <input type="number" id="valor"
                    placeholder="Valor (R$)" min="0" step="0.01" required>

                <button type="submit">Cadastrar Produto</button>
            </form>
        </section>

        <section class="card">
            <h2>Produtos Cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                    </tbody>
                </table>
            </div>

            <p id="mensagem">Nenhum produto cadastrado.</p>
        </section>

        <section class="card">
            <h2>Alterar Produto</h2>

            <form id="formAlteracao">
                <input type="text" id="codigoAlteracao"
                    placeholder="Código do produto" required>

                <input type="number" id="novoValor"
                    placeholder="Novo valor (R$)"
                    min="0" step="0.01">

                <input type="number" id="novaQuantidade"
                    placeholder="Nova quantidade"
                    min="0" step="1">

                <button type="submit">Atualizar Produto</button>
            </form>

            <small>
                Informe o código e pelo menos um dos novos valores.
            </small>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
