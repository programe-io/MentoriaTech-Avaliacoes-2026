
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <header>
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas atividades e acompanhe seu progresso.</p>
        </header>

        <!-- Estatísticas -->
        <section class="estatisticas">

            <div class="card">
                <h3>Total</h3>
                <span id="total">0</span>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <span id="pendentes">0</span>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <span id="concluidas">0</span>
            </div>

        </section>

        <!-- Cadastro -->
        <section class="formulario">

            <h2>Adicionar nova tarefa</h2>

            <form id="formTarefa">

                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite sua tarefa..."
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade">
                        <option value="1">Alta</option>
                        <option value="2">Média</option>
                        <option value="3">Baixa</option>
                    </select>
                </div>

                <button type="submit" class="btn-adicionar">
                    + Adicionar tarefa
                </button>

            </form>

        </section>

        <!-- Lista de tarefas -->
        <section class="lista">

            <h2>Minhas tarefas</h2>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar tarefa..."
            >

            <div class="filtros">
                <button class="filtro ativo" data-filtro="todas">
                    Todas
                </button>

                <button class="filtro" data-filtro="pendentes">
                    Pendentes
                </button>

                <button class="filtro" data-filtro="concluidas">
                    Concluídas
                </button>
            </div>

            <div id="listaTarefas">

                <p class="mensagem-vazia">
                    Nenhuma tarefa cadastrada.
                </p>

            </div>

        </section>

        <footer>
            <p>Gerenciador de Tarefas | Desenvolvido com HTML, CSS e JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
