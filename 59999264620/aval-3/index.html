<script>

document.querySelectorAll('.like-btn').forEach(btn => {

    btn.addEventListener('click', () => {

        btn.classList.toggle('bx-heart');
        btn.classList.toggle('bxs-heart');

        if(btn.classList.contains('bxs-heart')){
            btn.style.color = '#ed4956';
        }else{
            btn.style.color = '';
        }

    });

});

document.querySelectorAll('.save-btn').forEach(btn => {

    btn.addEventListener('click', () => {

        btn.classList.toggle('bx-bookmark');
        btn.classList.toggle('bxs-bookmark');

    });

});

</script>

<script>
document.querySelectorAll('.like-btn').forEach(btn => {

    btn.addEventListener('click', () => {

        const post = btn.closest('section');
        const likesCount = post.querySelector('.likes-count');

        let likes = parseInt(likesCount.textContent);

        if (!btn.classList.contains('liked')) {

            btn.classList.add('liked');

            likesCount.textContent = (likes + 1) + ' curtidas';

        } else {

            btn.classList.remove('liked');

            likesCount.textContent = (likes - 1) + ' curtidas';

        }

    });

});
</script>
