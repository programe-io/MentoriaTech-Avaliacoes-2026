<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="navbar">
  <div class="nav-container">
    <h1 class="logo">Instagram</h1>
    <input type="text" class="search-bar" placeholder="Pesquisar...">
    <div class="nav-icons">
      <span>🏠</span>
      <span>💬</span>
      <span>➕</span>
      <span>❤️</span>
    </div>
  </div>
</header>

<main class="main-container">
  <!-- Barra de Stories -->
  <section class="stories-bar">
    <div class="story">
      <div class="story-ring"><img src="https://picsum.photos" alt="Perfil"></div>
      <span>Seu story</span>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://picsum.photos" alt="Perfil"></div>
      <span>lucas_dev</span>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://picsum.photos" alt="Perfil"></div>
      <span>mariana.ux</span>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://picsum.photos" alt="Perfil"></div>
      <span>viagens_br</span>
    </div>
  </section>

  <!-- Feed de Publicações -->
  <article class="post">
    <div class="post-header">
      <div class="user-info">
        <img src="https://picsum.photos" alt="Avatar" class="avatar">
        <strong>lucas_dev</strong>
      </div>
      <span class="options">•••</span>
    </div>

    <div class="post-image" id="postImage">
      <img src="https://picsum.photos" alt="Setup de programação">
    </div>

    <div class="post-actions">
      <div class="left-actions">
        <button id="likeBtn" class="action-btn">🤍</button>
        <button id="commentFocusBtn" class="action-btn">💬</button>
        <button class="action-btn">🚀</button>
      </div>
      <button id="saveBtn" class="action-btn">🔖</button>
    </div>

    <div class="post-info">
      <p class="likes-count"><strong id="likeCount">124</strong> curtidas</p>
      <p class="caption"><strong>lucas_dev</strong> Finalizando o projeto de front-end hoje! 💻☕ #html #css #javascript</p>
      
      <div class="comments-list" id="commentsList">
        <p><strong>mariana.ux</strong> Ficou incrível o layout! 👏</p>
      </div>
      <span class="time">HÁ 2 HORAS</span>
    </div>

    <form class="comment-box" id="commentForm">
      <input type="text" id="commentInput" placeholder="Adicione um comentário..." required>
      <button type="submit">Publicar</button>
    </form>
  </article>
</main>
  <script src="script.js"></script>
  
</body>
</html>
