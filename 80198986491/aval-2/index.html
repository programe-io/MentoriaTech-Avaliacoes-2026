<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
  <header class="topo">
    <h1>Mini Feed Social</h1>
  </header>

  <section class="criar-post">
    <input type="text" id="autor" placeholder="Seu nome (ex: Ana Silva)" maxlength="30">
    <textarea id="conteudo" rows="3" placeholder="No que você está pensando?"></textarea>
    <button id="btn-publicar">Publicar</button>
  </section>

  <main id="lista-posts" class="feed">
    <!-- As postagens aparecerão aqui -->
  </main>
</div>
  <script src="script.js"></script>
  
</body>
</html>
