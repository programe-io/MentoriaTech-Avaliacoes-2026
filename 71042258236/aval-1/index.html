<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Estoque</title>
    <!-- Vinculando o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1 class="header-title">Gerenciador de Estoque</h1>

        <!-- Painel Lateral: Cadastro e Edição -->
        <div class="card">
            <h2>Cadastrar Produto</h2>
            <div class="form-group">
                <label for="desc">Descrição</label>
                <input type="text" id="desc" placeholder="Ex: Notebook Gamer">
            </div>
            <div class="form-group">
                <label for="qtd">Quantidade</label>
                <input type="number" id="qtd" min="1" value="1">
            </div>
            <div class="form-group">
                <label for="val">Valor (R$)</label>
                <input type="number" id="val" min="0.01" step="0.01" placeholder="0.00">
            </div>
            <button onclick="uiCadastrar()">Adicionar Produto</button>

            <!-- Sessão de Atualização Rápida -->
            <div class="update-section">
                <h2>Atualizar Produto</h2>
                <div class="form-group">
                    <label for="altId">Código do Produto</label>
                    <input type="number" id="altId" placeholder="Ex: 1">
                </div>
                <div class="form-group">
                    <label for="altQtd">Adicionar Quantidade</label>
                    <input type="number" id="altQtd" placeholder="Deixe vazio se não for alterar">
                </div>
                <div class="form-group">
                    <label for="altVal">Novo Valor (R$)</label>
                    <input type="number" id="altVal" step="0.01" placeholder="Deixe vazio se não for alterar">
                </div>
                <button onclick="uiAtualizar()" style="background-color: #0f172a;">Atualizar Dados</button>
            </div>
        </div>

        <!-- Painel Principal: Lista de Produtos -->
        <div class="card">
            <h2>Produtos em Estoque</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Qtd</th>
                            <th>Valor Unitário</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="lista-produtos-body">
                        <!-- Inserido dinamicamente via JS -->
                    </tbody>
                </table>
                <div id="msg-vazia" class="empty-msg">Nenhum produto cadastrado no momento.</div>
            </div>
        </div>
    </div>

    <!-- Vinculando o arquivo JavaScript externo -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
