<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="styles.css">
<link href="style.css" rel="stylesheet"></head>
<body>
    
    <header>

        <div class="header-content">

            <h1>MiniFeed</h1>

            <nav>
                <a href="#">Inicio</a>
                <a href="#">Perfil</a>
            </nav>

        </div>

    </header>

    <main>

        <section class="new-post">

            <div class="user">
                
                <div class="avatar">
                    J
                </div>

                <div>
                    <strong>Jefferson</strong>
                    <span>Oque você está pensando?</span>
                </div>

            </div>

            <button>Publicar</button>

        </section>

        <article class="post">

            <div class="post-header">

                <div class="user">
                
                <div class="avatar">
                    J
                </div>

                <div>
                    <strong>Jefferson</strong>
                    <span>Há 10 minutos</span>
                </div>

            </div>

            </div>

            <div class="post-text">
                J.
            </div>

            <img src="https://www.bing.com/th/id/OIP.GOvP_jgH51E6sZb1tJoQ6QHaHa?w=193&h=193&c=8&rs=1&qlt=90&o=6&pid=ImgAns&rm=2" alt="Imagem de um post exemplo">

            <div class="post-actions">
                
                <button>Curtir</button>
                <button>Comentar</button>
                
            </div>

        </article>

        <article class="post">

            <div class="post-header">

                <div class="user">
                
                <div class="avatar">
                    J
                </div>

                <div>
                    <strong>Julia</strong>
                    <span>Há 10 minutos</span>
                </div>

            </div>

            </div>

            <div class="post-text">
                Hi.
            </div>

            <img src="https://www.bing.com/th/id/OIP.GOvP_jgH51E6sZb1tJoQ6QHaHa?w=193&h=193&c=8&rs=1&qlt=90&o=6&pid=ImgAns&rm=2" alt="Imagem de um post exemplo">

            <div class="post-actions">
                
                <button>Curtir</button>
                <button>Comentar</button>
                
            </div>

        </article>

    </main>

    <footer>

        <p>MiniFeed by Jefferson - Todos os direitos reservados.</p>

    </footer>

</body>
</html>
