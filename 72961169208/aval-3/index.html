<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <header class="cabecalho">
      <h1>Controle de IMC</h1>
      <p>Cadastre o paciente e acompanhe o índice de massa corporal.</p>
    </header>

    <section class="cartao">
      <h2>Ficha de anamnese</h2>

      <form id="form-pessoa" novalidate>
        <div class="campo">
          <label for="nome">Nome</label>
          <input id="nome" type="text" placeholder="Ex.: Francisco" autocomplete="off">
        </div>

        <div class="linha-campos">
          <div class="campo">
            <label for="idade">Idade</label>
            <input id="idade" type="number" min="1" max="120" step="1" placeholder="30">
          </div>
          <div class="campo">
            <label for="altura">Altura (m)</label>
            <input id="altura" type="text" inputmode="decimal" placeholder="1,70" autocomplete="off">
          </div>
          <div class="campo">
            <label for="peso">Peso (kg)</label>
            <input id="peso" type="text" inputmode="decimal" placeholder="65" autocomplete="off">
          </div>
        </div>

        <p id="erro" class="erro" role="alert" hidden></p>

        <div id="resultado" class="resultado" hidden></div>

        <div class="botoes">
          <button type="button" id="btn-verificar" class="botao secundario">Verificar peso</button>
          <button type="submit" class="botao">Salvar</button>
        </div>
      </form>
    </section>

    <section class="cartao">
      <h2>Pacientes cadastrados</h2>

      <div class="tabela-rolagem">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Idade</th>
              <th>Altura</th>
              <th>Peso</th>
              <th>IMC</th>
              <th>Classificação</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>
      <p id="vazio" class="vazio" hidden>Nenhum paciente cadastrado ainda. Preencha a ficha acima e clique em Salvar.</p>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
