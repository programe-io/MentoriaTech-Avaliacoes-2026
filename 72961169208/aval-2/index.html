<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <header>
      <div class="brand">
        <div class="logo">✓</div>
        <div>
          <h1>Gerenciador de Tarefas</h1>
          <p class="sub">Organize o que precisa ser feito</p>
        </div>
      </div>

      <div class="ferramentas">
        <div class="cores" id="cores" role="group" aria-label="Cor do tema"></div>

        <label class="icon-btn cor-livre" title="Escolher outra cor">
          <input type="color" id="corLivre" aria-label="Escolher outra cor">
          <span>🎨</span>
        </label>

        <button
          class="icon-btn"
          id="tema"
          title="Alternar claro/escuro"
          aria-label="Alternar claro/escuro"
        >◐</button>
      </div>
    </header>

    <section class="resumo">
      <div class="stat progresso">
        <span>Progresso</span>
        <b id="sPct">0%</b>
        <div class="barra">
          <i id="sBarra"></i>
        </div>
      </div>

      <div class="stat">
        <b id="sTotal">0</b>
        <span>Total</span>
      </div>

      <div class="stat">
        <b id="sAndamento">0</b>
        <span>Em execução</span>
      </div>

      <div class="stat">
        <b id="sConcluidas">0</b>
        <span>Concluídas</span>
      </div>
    </section>

    <section class="card">
      <form id="form" autocomplete="off">
        <div class="linha-form">
          <div class="titulo">
            <label class="campo" for="titulo">
              Título
              <span class="contador" id="cont">0 / mín. 5</span>
            </label>

            <input
              type="text"
              id="titulo"
              placeholder="Ex.: Estudar JavaScript"
              maxlength="80"
            >
          </div>

          <div>
            <label class="campo">Prioridade</label>

            <div class="seg" id="segNova">
              <button type="button" data-p="1">
                <i class="dot d1"></i>Alta
              </button>

              <button type="button" data-p="2" class="on">
                <i class="dot d2"></i>Média
              </button>

              <button type="button" data-p="3">
                <i class="dot d3"></i>Baixa
              </button>
            </div>
          </div>

          <button class="btn" type="submit">+ Cadastrar</button>
        </div>

        <div class="erro" id="erro" role="alert"></div>
      </form>
    </section>

    <section class="card">
      <div class="barra-lista">
        <input type="search" id="busca" placeholder="Buscar tarefa…">

        <select id="ordem" aria-label="Ordenar">
          <option value="codigo">Mais antigas primeiro</option>
          <option value="recentes">Mais recentes primeiro</option>
          <option value="prioridade">Por prioridade</option>
        </select>
      </div>

      <div class="chips" id="chips">
        <button class="chip on" data-f="todas">Todas</button>
        <button class="chip" data-f="andamento">Em execução</button>
        <button class="chip" data-f="concluidas">Concluídas</button>
      </div>

      <ul id="lista"></ul>
    </section>
  </main>

  <div id="toast" role="status"></div>

  <script src="script.js" defer></script>
<script src="script.js"></script></body>
</html>
