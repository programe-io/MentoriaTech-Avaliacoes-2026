<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Produtos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
      color: #333;
    }

    h1, h2 {
      color: #2c3e50;
    }

    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      flex: 1;
      min-width: 300px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background-color: #219150;
    }

    .btn-update {
      background-color: #2980b9;
    }

    .btn-update:hover {
      background-color: #1f6391;
    }

    #mensagem-erro {
      color: #c0392b;
      font-weight: bold;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #2c3e50;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <h1>Sistema de Gerenciamento de Produtos</h1>
  <div id="mensagem-erro"></div>

  <div class="container">
    <!-- Formulário de Cadastro -->
    <div class="card">
      <h2>Cadastrar Produto</h2>
      <div class="form-group">
        <label for="descricao">Descrição (Min. 5 caracteres):</label>
        <input type="text" id="descricao" placeholder="Ex: Cadeira Gamer">
      </div>
      <div class="form-group">
        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" placeholder="Ex: 10">
      </div>
      <div class="form-group">
        <label for="valor">Valor (R$):</label>
        <input type="number" id="valor" step="0.01" placeholder="Ex: 699.00">
      </div>
      <button onclick="handleCadastrar()">Cadastrar</button>
    </div>

    <!-- Formulário de Atualização -->
    <div class="card">
      <h2>Atualizar Produto</h2>
      <div class="form-group">
        <label for="codigo-prod">Código do Produto:</label>
        <input type="number" id="codigo-prod" placeholder="Ex: 1">
      </div>
      <div class="form-group">
        <label for="novo-valor">Novo Valor (R$):</label>
        <input type="number" id="novo-valor" step="0.01" placeholder="Ex: 97.00">
        <button class="btn-update" style="margin-top: 5px;" onclick="handleAtualizarValor()">Atualizar Valor</button>
      </div>
      <hr>
      <div class="form-group">
        <label for="add-qtd">Adicionar Quantidade:</label>
        <input type="number" id="add-qtd" placeholder="Ex: 3">
        <button class="btn-update" style="margin-top: 5px;" onclick="handleAtualizarQuantidade()">Adicionar Quantidade</button>
      </div>
    </div>
  </div>

  <!-- Tabela de Produtos -->
  <div class="card" style="margin-top: 20px;">
    <h2>Lista de Produtos</h2>
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Descrição</th>
          <th>Quantidade</th>
          <th>Valor Unitário (R$)</th>
        </tr>
      </thead>
      <tbody id="tabela-produtos">
        <!-- Os produtos serão inseridos aqui via JS -->
      </tbody>
    </table>
  </div>

  <script>
    // --- SEU CÓDIGO JAVASCRIPT ---
    let produtos = [];

    function validarProduto(descricao, quantidade, valor){
      if(descricao.length < 5){
        throw new Error("Descrição deve ter no mínimo 5 caracteres");
      }
      if(quantidade < 1){
        throw new Error("Quantidade deve ser maior que zero");
      }
      if(valor < 0){
        throw new Error("Valor deve ser maior ou igual a zero");
      }
    }

    function cadastrarProduto(descricao, quantidade, valor){
      validarProduto(descricao, quantidade, valor);
      let novoProduto = {
        "codigo": produtos.length + 1,
        "descricao": descricao,
        "quantidade": quantidade,
        "valor": valor
      }
      produtos.push(novoProduto);
    }

    function listarProdutos(){
      console.log(produtos);
      
      // Atualiza a tabela na tela
      const tabela = document.getElementById('tabela-produtos');
      tabela.innerHTML = '';

      produtos.forEach(prod => {
        let linha = `<tr>
          <td>${prod.codigo}</td>
          <td>${prod.descricao}</td>
          <td>${prod.quantidade}</td>
          <td>R$ ${prod.valor.toFixed(2)}</td>
        </tr>`;
        tabela.innerHTML += linha;
      });
    }

    function atualizarValor(codigoProduto, novoValor){
      if(novoValor < 0){
        throw new Error("Valor deve ser maior ou igual a zero");
      }
      const produto = produtos.find(prod => prod.codigo === codigoProduto);
      if(produto){
        produto.valor = novoValor;
      }
      else{
        throw new Error("Produto não encontrado");
      }
    }

    function atualizarQuantidade(codigoProduto, novaQuantidade){
      if(novaQuantidade < 1){
        throw new Error("Quantidade deve ser maior que zero");
      }
      const produto = produtos.find(prod => prod.codigo === codigoProduto);
      if(produto){
        produto.quantidade += novaQuantidade;
      }
      else{
        throw new Error("Produto não encontrado");
      }
    }

    // --- FUNÇÕES AUXILIARES PARA INTERAÇÃO COM A TELA ---

    function limparMensagemErro() {
      document.getElementById('mensagem-erro').innerText = '';
    }

    function exibirErro(msg) {
      document.getElementById('mensagem-erro').innerText = 'Erro: ' + msg;
    }

    function handleCadastrar() {
      limparMensagemErro();
      try {
        const desc = document.getElementById('descricao').value;
        const qtd = parseInt(document.getElementById('quantidade').value) || 0;
        const valor = parseFloat(document.getElementById('valor').value) || 0;

        cadastrarProduto(desc, qtd, valor);
        listarProdutos();

        // Limpa os campos
        document.getElementById('descricao').value = '';
        document.getElementById('quantidade').value = '';
        document.getElementById('valor').value = '';
      } catch (error) {
        exibirErro(error.message);
      }
    }

    function handleAtualizarValor() {
      limparMensagemErro();
      try {
        const codigo = parseInt(document.getElementById('codigo-prod').value);
        const valor = parseFloat(document.getElementById('novo-valor').value);
        
        atualizarValor(codigo, valor);
        listarProdutos();
      } catch (error) {
        exibirErro(error.message);
      }
    }

    function handleAtualizarQuantidade() {
      limparMensagemErro();
      try {
        const codigo = parseInt(document.getElementById('codigo-prod').value);
        const qtd = parseInt(document.getElementById('add-qtd').value);

        atualizarQuantidade(codigo, qtd);
        listarProdutos();
      } catch (error) {
        exibirErro(error.message);
      }
    }

    // --- EXECUÇÃO INICIAL (OS SEUS TESTES) ---
    try {
      listarProdutos();
      cadastrarProduto("Cadeira Gamer", 12, 699.00);
      cadastrarProduto("Mouse Logi", 38, 60.00);
      listarProdutos();
      atualizarValor(2, 97.00);
      listarProdutos();
      atualizarQuantidade(1, 3);
      listarProdutos();
    } catch (e) {
      exibirErro(e.message);
    }

  </script>
<script src="script.js"></script></body>
</html>
