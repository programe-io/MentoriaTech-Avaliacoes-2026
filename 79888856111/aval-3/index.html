<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clone Instagram</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://jsdelivr.net"></script>
  <!-- Boxicons para os ícones (bx bx-home, bx bx-heart) -->
  <link href="https://unpkg.com" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- 1. Topo (Header) -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4">
      <div class="flex items-center justify-between h-14">
        <h1 class="font-semibold text-lg">Instagram</h1>
        
        <input 
          type="text" 
          placeholder="Pesquisar" 
          class="hidden md:block bg-gray-100 px-4 py-2 rounded-lg text-sm outline-none w-64" 
        />
        
        <div class="flex gap-4">
          <i class="bx bx-home text-xl cursor-pointer"></i>
          <i class="bx bx-heart text-xl cursor-pointer"></i>
        </div>
      </div>
    </div>
  </header>

  <!-- 2. Container do Conteúdo Principal -->
  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex gap-8">
      
      <!-- Área do Feed -->
      <div class="flex-1 max-w-lg mx-auto">
        
        <!-- 3. Barra de Stories Horizontal -->
        <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">
          <div class="flex gap-4 overflow-x-auto scrollbar-none">
            
            <!-- Item do Story (Seu Story) -->
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
              <div class="w-16 h-16 rounded-full bg-gray-300 border border-gray-200 flex items-center justify-center">
                <!-- Espaço para a foto de perfil -->
              </div>
              <span class="text-xs mt-1 text-gray-500">seu_story</span>
            </div>

            <!-- Exemplo de outro Story para preencher a barra -->
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
              <div class="w-16 h-16 rounded-full bg-gray-300 border border-gray-200"></div>
              <span class="text-xs mt-1 text-gray-500">usuario_1</span>
            </div>
            
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
              <div class="w-16 h-16 rounded-full bg-gray-300 border border-gray-200"></div>
              <span class="text-xs mt-1 text-gray-500">usuario_2</span>
            </div>

          </div>
        </section>

        <!-- Próximo passo: Os cards de postagens entrarão aqui -->

      </div>
      
      <!-- Barra Lateral (Sidebar) -->
      <aside class="hidden lg:block w-80">
        <!-- Próximo passo: Sugestões de usuários entrarão aqui -->
        <div class="p-4 bg-white border border-gray-200 rounded-lg text-sm text-gray-400">
          Área da Sidebar (Sugestões)
        </div>
      </aside>

    </div>
  </main>

</body>
</html>
<!-- ==================== 1. BARRA DE STORIES ==================== -->
<section>
  <div class="flex flex-col items-center">
    <div class="w-16 h-16 rounded-full bg-gray-300"></div>
    <span class="text-xs mt-1">seu_story</span>
  </div>
</section>


<!-- ==================== 2. CARD DE POSTAGEM ==================== -->
<article class="bg-white border rounded-lg mb-4">
  
  <!-- Header do Card -->
  <div class="flex justify-between items-center p-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-gray-300"></div>
      <span class="font-semibold text-sm">usuario</span>
    </div>
    <i class="bx bx-dots-horizontal"></i>
  </div>

  <!-- Imagem da Publicação -->
  <img src="https://via.placeholder.com/500" class="w-full" />

  <!-- Seção de Ações e Curtidas -->
  <div class="p-4">
    <div class="flex justify-between mb-2">
      <div class="flex gap-4">
        <i class="bx bx-heart"></i>
        <i class="bx bx-message-rounded"></i>
      </div>
      <i class="bx bx-bookmark"></i>
    </div>
    
    <p class="text-sm font-semibold">1.234 curtidas</p>
  </div>

</article>


<!-- ==================== 3. SIDEBAR DE SUGESTÕES ==================== -->
<aside class="hidden lg:block w-80">
  <div class="flex items-center gap-3 mb-4">
    <div class="w-12 h-12 rounded-full bg-gray-300"></div>
    <div>
      <p class="font-semibold text-sm">seu_usuario</p>
    </div>
  </div>
</aside>
<nav class="md:hidden fixed bottom-0 w-full bg-white border-t">
    <div class="flex justify-around py-3">
        <i class='bx bx-home'></i>
        <i class='bx bx-search'></i>
        <i class='bx bx-plus'></i>
        <i class='bx bx-heart'></i>
    </div>
</nav>
