
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eaf0f6;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #23476b;
        }

        .container {
            background-color: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 80%;
        }

        button {
            padding: 10px 15px;
            margin: 8px;
            background-color: #2878b5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #164e7a;
        }

        #lista {
            text-align: left;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <h1>Sistema de Estoque</h1>

    <div class="container">
        <h2>Cadastrar Produto</h2>

        <input type="number" id="codigo" placeholder="Código">
        <input type="text" id="descricao" placeholder="Descrição">
        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="number" id="valor" placeholder="Valor">

        <button onclick="cadastrar()">Cadastrar</button>
    </div>

    <div class="container">
        <h2>Alterar Valor</h2>

        <input type="number" id="codigoValor" placeholder="Código do produto">
        <input type="number" id="novoValor" placeholder="Novo valor">

        <button onclick="alterarValor()">Alterar Valor</button>
    </div>

    <div class="container">
        <h2>Alterar Quantidade</h2>

        <input type="number" id="codigoQuantidade" placeholder="Código do produto">
        <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

        <button onclick="alterarQuantidade()">Alterar Quantidade</button>
    </div>

    <div class="container">
        <h2>Produtos Cadastrados</h2>

        <button onclick="listar()">Listar Produtos</button>

        <div id="lista"></div>
    </div>

    <script>
        let produtos = [];

        function cadastrar() {
            let codigo = Number(document.getElementById("codigo").value);
            let descricao = document.getElementById("descricao").value;
            let quantidade = Number(document.getElementById("quantidade").value);
            let valor = Number(document.getElementById("valor").value);

            if (!codigo || descricao.trim() === "" ||
                document.getElementById("quantidade").value === "" ||
                document.getElementById("valor").value === "" ||
                quantidade < 0 || valor < 0) {
                alert("Preencha todos os campos corretamente!");
                return;
            }

            if (produtos.some(p => p.codigo === codigo)) {
                alert("Código já cadastrado!");
                return;
            }

            produtos.push({codigo, descricao, quantidade, valor});

            alert("Produto cadastrado!");

            document.getElementById("codigo").value = "";
            document.getElementById("descricao").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("valor").value = "";

            listar();
        }

        function listar() {
            let resultado = "";

            if (produtos.length === 0) {
                resultado = "<p>Nenhum produto cadastrado.</p>";
            }

            produtos.forEach(p => {
                resultado += `
                    <hr>
                    <p>
                    <strong>Código:</strong> ${p.codigo}<br>
                    <strong>Descrição:</strong> ${p.descricao}<br>
                    <strong>Quantidade:</strong> ${p.quantidade}<br>
                    <strong>Valor:</strong> R$ ${p.valor.toFixed(2)}
                    </p>
                `;
            });

            document.getElementById("lista").innerHTML = resultado;
        }

        function alterarValor() {
            let codigo = Number(document.getElementById("codigoValor").value);
            let valor = document.getElementById("novoValor").value;

            let produto = produtos.find(p => p.codigo === codigo);

            if (!produto) {
                alert("Produto não encontrado!");
                return;
            }

            if (valor === "" || Number(valor) < 0) {
                alert("Digite um valor válido!");
                return;
            }

            produto.valor = Number(valor);

            alert("Valor alterado!");
            listar();
        }

        function alterarQuantidade() {
            let codigo = Number(document.getElementById("codigoQuantidade").value);
            let quantidade = document.getElementById("novaQuantidade").value;

            let produto = produtos.find(p => p.codigo === codigo);

            if (!produto) {
                alert("Produto não encontrado!");
                return;
            }

            if (quantidade === "" || Number(quantidade) < 0) {
                alert("Digite uma quantidade válida!");
                return;
            }

            produto.quantidade = Number(quantidade);

            alert("Quantidade alterada!");
            listar();
        }
    </script>

<script src="script.js"></script></body>
</html>
