
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1677b8;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 7px;
            background: #1677b8;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #105b8e;
        }

        #resultado {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #eaf5fc;
            border-radius: 10px;
        }

        #resultado h2 {
            color: #1677b8;
            text-align: center;
        }

        .imc {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
        }

        .classificacao {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .informacao {
            line-height: 1.5;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Calculadora de IMC</h1>
    <p style="text-align:center;">
        Sistema de avaliação do Índice de Massa Corporal
    </p>

    <label>Nome do Paciente:</label>
    <input type="text" id="nome" placeholder="Digite o nome do paciente">

    <label>Peso (kg):</label>
    <input type="number" id="peso" placeholder="Ex: 70" step="0.1">

    <label>Altura (m):</label>
    <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01">

    <button onclick="calcularIMC()">Calcular IMC</button>

    <div id="resultado">
        <h2>Resultado do Paciente</h2>

        <p><strong>Nome:</strong> <span id="nomeResultado"></span></p>

        <p class="imc" id="valorIMC"></p>

        <p class="classificacao" id="classificacao"></p>

        <hr>

        <h3>Informações sobre o IMC:</h3>
        <p class="informacao" id="informacao"></p>
    </div>

</div>

<script>

function calcularIMC() {

    let nome = document.getElementById("nome").value.trim();
    let peso = parseFloat(document.getElementById("peso").value);
    let altura = parseFloat(document.getElementById("altura").value);

    if (nome === "" || !Number.isFinite(peso) ||
        !Number.isFinite(altura) || peso <= 0 || altura <= 0) {

        alert("Preencha todos os campos corretamente!");
        return;
    }

    let imc = peso / (altura * altura);

    let classificacao = "";
    let informacao = "";

    if (imc < 18.5) {
        classificacao = "Abaixo do peso";
        informacao = "O paciente apresenta IMC abaixo da faixa considerada adequada. Recomenda-se avaliação profissional.";
    }
    else if (imc < 25) {
        classificacao = "Peso normal";
        informacao = "O paciente está dentro da faixa de IMC considerada adequada para adultos. Mantenha hábitos saudáveis.";
    }
    else if (imc < 30) {
        classificacao = "Sobrepeso";
        informacao = "O paciente apresenta sobrepeso. Recomenda-se atenção à alimentação e à prática de atividades físicas.";
    }
    else if (imc < 35) {
        classificacao = "Obesidade Grau I";
        informacao = "O paciente apresenta obesidade grau I. É recomendado acompanhamento profissional.";
    }
    else if (imc < 40) {
        classificacao = "Obesidade Grau II";
        informacao = "O paciente apresenta obesidade grau II. Recomenda-se acompanhamento médico e nutricional.";
    }
    else {
        classificacao = "Obesidade Grau III";
        informacao = "O paciente apresenta obesidade grau III. É importante buscar acompanhamento especializado.";
    }

    document.getElementById("nomeResultado").textContent = nome;

    document.getElementById("valorIMC").textContent =
        "IMC: " + imc.toFixed(2).replace(".", ",");

    document.getElementById("classificacao").textContent =
        classificacao;

    document.getElementById("informacao").textContent =
        informacao;

    document.getElementById("resultado").style.display = "block";
}

</script>

<script src="script.js"></script></body>
</html>
