<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- MINI FEED SOCIAL -->
<section id="comentarios">
  <div class="section-title">
    <h2>💬 || Mini Feed Social !!</h2>
    <div class="line"></div>
  </div>

  <div class="social-feed">

    <!-- criar publicação -->
    <div class="feed-composer glass-panel">
      <div class="composer-title">
        compartilhe algo sobre jogos!
      </div>

      <input
        id="name"
        class="social-input"
        placeholder="Seu nome ou apelido..."
        maxlength="30"
      >

      <textarea
        id="comment"
        class="social-input"
        placeholder="O que você está jogando? 🎮"
        rows="3"
        maxlength="300"
      ></textarea>

      <div class="composer-bottom">
        <span id="charCount">0/300</span>

        <button class="aero-btn solid" onclick="postComment()">
          Publicar
        </button>
      </div>
    </div>

    <!-- posts -->
    <div id="posts"></div>

  </div>
</section>

  <script src="script.js"></script>
  
</body>
</html>
