<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Projeto: Meu Blog CETI Nonato Valente 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&display=swap" rel="stylesheet">


<style>

body{

margin:0;
font-family:'Fredoka',sans-serif;

background:
linear-gradient(
180deg,
#ffd6f5,
#b5e8ff,
#8bd3ff,
#dfffff
);

}


/* JANELA */

.window{

width:900px;
margin:40px auto;

background:
rgba(255,255,255,0.35);

backdrop-filter:blur(18px);

border-radius:25px;

border:1px solid white;

box-shadow:
0 0 40px #8be7ff;

}



/* BARRA */

.titlebar{

height:35px;

background:
linear-gradient(
#ff9fe5,
#ff5dc8,
#c0008f
);

border-radius:25px 25px 0 0;

color:white;

display:flex;

align-items:center;

padding-left:15px;

font-weight:bold;

}



/* CABEÇALHO */


.header{

text-align:center;

padding:60px;

background:

linear-gradient(
#ffc8ef,
#87dcff
);

}



.header h1{

font-size:45px;

color:white;

text-shadow:

0 0 10px white,
0 0 30px #ff66cc;

}


.slogan{

color:white;

font-size:20px;

}




/* CARDS */


.content{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(250px,1fr));

gap:20px;

padding:25px;

}




.card{

background:

rgba(255,255,255,.45);

border-radius:20px;

padding:20px;

box-shadow:

0 0 20px #8be7ff;


text-align:center;

}



.card img{

width:100%;

border-radius:15px;

transition:.3s;

}


.card img:hover{

transform:scale(1.05);

}





/* BLOG */


.forum{

padding:25px;

}



input,textarea{

width:100%;

padding:10px;

margin-top:10px;

border:none;

border-radius:10px;

}





button{


margin-top:10px;

padding:12px;

border:none;

border-radius:15px;

background:

linear-gradient(
#ff8ddd,
#d0009d
);


color:white;

cursor:pointer;


}



button:hover{

transform:scale(1.05);

}




.post{


background:white;

padding:15px;

margin-top:15px;

border-radius:15px;

}



.username{

font-weight:bold;

color:#c0008f;

}



</style>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>



<body>



<div class="window">


<div class="titlebar">

meu_blog_de_jogos.exe

</div>




<div class="header">


<h1>

MEU BLOG DE JOGOS

</h1>


<div class="slogan">

Projeto: Meu Blog CETI Nonato Valente 2026 🎮

</div>


</div>





<div class="content">



<div class="card">


<h2>

Dolly's Factory

</h2>


<h3>

HZ 58 - Fleecia (Vídeo da Run na imagem)

</h3>



<a href="https://www.youtube.com/watch?v=-WXocUXjFrQ" target="_blank">


<img src="Fleecia_Artwork.png">


</a>



<p>

Fleecia  <3


</p>


</div>






<div class="card">


<h2>

Cookie Run: Kingdom 🍪

</h2>


<p>

Gosto muito desse jogo pela jogabilidade divertida (apesar de que o jogo seja bastante ptw)
<img src="crk.png" alt="" width="200">
</p>


</div>






<div class="card">


</div>



</div>







<div class="forum">


<h2>

Comentários do Blog

</h2>



<input id="name" placeholder="Seu nome">


<textarea id="comment"

placeholder="Escreva sobre seu jogo favorito...">

</textarea>



<button onclick="postComment()">

Publicar

</button>



<div id="posts">

</div>



</div>




</div>





<script>


function getPosts(){

return JSON.parse(
localStorage.getItem("posts") || "[]"
);

}



function savePosts(posts){

localStorage.setItem(
"posts",
JSON.stringify(posts)
);

}





function render(){


let area =
document.getElementById("posts");


area.innerHTML="";



getPosts().forEach(p=>{


let div=document.createElement("div");


div.className="post";



div.innerHTML=`

<div class="username">

${p.name}

</div>


<p>

${p.text}

</p>


`;



area.appendChild(div);


});


}







function postComment(){


let name =
document.getElementById("name").value
||
"Anônimo";


let text =
document.getElementById("comment").value;



if(!text)return;



let posts=getPosts();



posts.push({

name:name,

text:text

});



savePosts(posts);


render();



}



render();


</script>



</body>

</html>
