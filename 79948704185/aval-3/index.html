<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  
<header class="navbar">
  <div class="logo">InstaVibe</div>
    <input id="busca" type="search" placeholder="Pesquisar">
      <div class="nav-icons">
          <button id="inicioBtn" title="Início">⌂</button>
              <button id="novoBtn" title="Nova publicação">＋</button>
                  <button id="explorarBtn" title="Explorar">⌕</button>
                      <button id="perfilBtn" title="Perfil">👤</button>
                        </div>
                        </header>

                        <div class="layout">
                          <main class="principal">
                              <section class="stories" id="stories"></section>

                                  <section class="criar" id="formulario">
                                        <h3>Compartilhe um momento 📸</h3>
                                              <input id="autor" placeholder="Seu nome">
                                                    <input id="imagem" placeholder="URL da imagem (https://...)">
                                                          <textarea id="legenda" placeholder="Escreva uma legenda..."></textarea>
                                                                <button id="publicar">Compartilhar publicação</button>
                                                                      <p id="aviso"></p>
                                                                          </section>

                                                                              <section id="feed"></section>
                                                                                </main>

                                                                                  <aside class="lateral">
                                                                                      <div class="meu-perfil">
                                                                                            <div class="avatar grande">😎</div>
                                                                                                  <div>
                                                                                                          <strong>seu_perfil</strong>
                                                                                                                  <p>Bem-vindo ao InstaVibe!</p>
                                                                                                                        </div>
                                                                                                                            </div>

                                                                                                                                <div class="sugestoes">
                                                                                                                                      <h4>Sugestões para você</h4>
                                                                                                                                            <div class="sugestao">
                                                                                                                                                    <span>🌸</span>
                                                                                                                                                            <div><strong>maria.fotos</strong><small>Fotografia</small></div>
                                                                                                                                                                    <button class="seguir">Seguir</button>
                                                                                                                                                                          </div>
                                                                                                                                                                                <div class="sugestao">
                                                                                                                                                                                        <span>🎮</span>
                                                                                                                                                                                                <div><strong>gamer.br</strong><small>Sugestão para você</small></div>
                                                                                                                                                                                                        <button class="seguir">Seguir</button>
                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                    <div class="sugestao">
                                                                                                                                                                                                                            <span>🌎</span>
                                                                                                                                                                                                                                    <div><strong>mundo.digital</strong><small>Popular</small></div>
                                                                                                                                                                                                                                            <button class="seguir">Seguir</button>
                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                          <button id="alternarTema" class="tema">🌙 Alternar tema</button>
                                                                                                                                                                                                                                                              <p class="rodape">Sobre · Ajuda · Privacidade</p>
                                                                                                                                                                                                                                                                  <p class="rodape">© 2026 INSTAVIBE</p>
                                                                                                                                                                                                                                                                    </aside>
                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                    <nav class="mobile-nav">
                                                                                                                                                                                                                                                                      <button id="mobileInicio">⌂</button>
                                                                                                                                                                                                                                                                        <button id="mobileBusca">⌕</button>
                                                                                                                                                                                                                                                                          <button id="mobileNovo">＋</button>
                                                                                                                                                                                                                                                                            <button id="mobilePerfil">👤</button>
                                                                                                                                                                                                                                                                            </nav>
                                                                                                                                                                                                                                                                            
  <script src="script.js"></script>
  
</body>
</html>
