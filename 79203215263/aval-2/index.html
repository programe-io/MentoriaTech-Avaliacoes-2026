<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header class="cabecalho">
        <div class="container">
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas atividades de forma simples e prática.</p>
        </div>
    </header>

    <main class="container">
        <section class="painel">
            <h2>Cadastrar nova tarefa</h2>

            <form id="form-tarefa">
                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Ex.: Estudar JavaScript"
                        minlength="5"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" name="prioridade" required>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit" class="botao botao-principal">
                    Cadastrar tarefa
                </button>
            </form>

            <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
        </section>

        <section class="secao-tarefas">
            <div class="titulo-lista">
                <h2>Minhas tarefas</h2>
                <span id="contador" class="contador">0 tarefas</span>
            </div>

            <div id="lista-tarefas" class="lista-tarefas">
                <p class="vazio">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Gerenciador de Tarefas | Projeto JavaScript</p>
    </footer>

    <script src="app.js" defer></script>
<script src="script.js"></script></body>
</html>
