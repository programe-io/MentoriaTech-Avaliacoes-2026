<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedStation</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
       
     <header>

        <div class="header-content">

         <h1>FeedStation</h1>
        
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Perfil</a>
        </nav>

        </div>

     </header>
    
    <main>

        <section class="new-post">

            <div class="user">

                <div class="avatar">
                    D
                </div>

               <div>
                 <strong>David</strong>
                 <span>Sobre o que você está refletindo?</span>
                      
               </div>

            </div>

            <button>Publicar</button>

        </section>

        <article class="post">
          
          <div class="post-header">
             
              <div class="avatar">
                    A
                </div>

               <div>
                 <strong>Ana</strong>
                 <span>Há 15 minutos</span>
                      
               </div>
            

          </div>
 
         <div class="post-text">
            Hoje terminei de ler a hora da estrela 
            9/10 :)


         </div>

         <img src="https://s5.static.brasilescola.uol.com.br/be/2022/08/capa-livro-hora-da-estrela.jpg" alt="imagem da hora da estrela (livro)">

        <div class="post-actions">

        <button>Curtir</button>
        <button>Comentar</button>
        <button>Republicar</button>


        </div>



        </article>




    </main>

    <footer> 
   <p>FeedStation - Todos os direitos reservados - 2026</p>
   </footer>

    

</body>
</html>
