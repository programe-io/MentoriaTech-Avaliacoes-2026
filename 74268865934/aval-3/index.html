
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Calculadora de IMC</h1>
        <p class="subtitulo">Descubra seu Índice de Massa Corporal</p>

        <form id="form-imc">

            <label for="nome">Nome:</label>
            <input type="text" id="nome"
                placeholder="Digite seu nome" required>

            <label for="idade">Idade:</label>
            <input type="number" id="idade"
                placeholder="Digite sua idade" min="1" max="120" required>

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso"
                placeholder="Ex: 70" step="0.1" min="2" required>

            <label for="altura">Altura (m):</label>
            <input type="number" id="altura"
                placeholder="Ex: 1.70" step="0.01" min="0.5" required>

            <button type="submit">Calcular IMC</button>

        </form>

        <div id="resultado" class="resultado" hidden>
            <h2>Resultado do IMC</h2>

            <p>Nome: <strong id="resultado-nome"></strong></p>
            <p>Idade: <strong id="resultado-idade"></strong></p>
            <p>Seu IMC é:</p>

            <div id="valor-imc">0.0</div>

            <p>Classificação:</p>
            <div id="classificacao"></div>
        </div>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
