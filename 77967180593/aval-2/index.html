
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ALTERE: texto que aparece na aba do navegador -->
    <title>Mensagens</title>

    <!-- Esta linha conecta o HTML ao arquivo de estilos -->
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>

<body>

    <!-- CABEÇALHO: título e menu de navegação -->
    <header>
        <div class="header-content">

            <!-- ALTERE: nome da sua rede social -->
            <h1 </h1>

            <nav>
                <a href="#">lindos</a>
                <a href="#">gatos</a>
            </nav>

        </div>
    </header>

    <main>

        <!-- NOVA PUBLICAÇÃO: área do usuário logado -->
        <section class="new-post">

            <div class="user">

                <!-- ALTERE: a letra do avatar e o seu nome -->
                <div class="avatar">j</div>

                <div>
                    <strong>jungwon</strong>
                    <span>O que você está pensando?</span>
                </div>

            </div>

            <button>Publicar</button>

        </section>

        <!-- POSTAGEM: cada <article> é uma publicação do feed -->
        <article class="post">

            <div class="post-header">

                <div class="avatar">j</div>

                <div>
                    <strong>joong</strong>
                    <span>Há 10 minutos</span>
                </div>

            </div>

            <!-- ALTERE: o texto da postagem -->
            <p class="post-text">
                ฉันคิดถึงดังก์            
            <!--
                ALTERE: para usar a sua imagem:
                1. Coloque o arquivo na pasta "imagens".
                2. Troque o src pelo nome do arquivo.
                3. Descreva a imagem no alt.
            -->
            <img
                src="https://i.pinimg.com/736x/14/4f/fa/144ffa5a5113cee2e1e3dfac1f937932.jpg"
                alt="Ilustração de exemplo com montanhas e um sol"
            >

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>

        <!-- SEGUNDA POSTAGEM -->
        <article class="post">

            <div class="post-header">

                <div class="avatar">f</div>

                <div>
                    <strong>fourth</strong>
                    <span>Há 10 minutos</span>
                </div>

            </div>

            <p class="post-text">
                ฉันเป็นแฟนของเจมีนี
            </p>

            <img
                src="https://i.pinimg.com/736x/54/51/61/545161a6482eb5e9575b521d5ec87322.jpg"
                alt="Ilustração de exemplo com montanhas e um sol"
            >

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>

        <!-- TERCEIRA POSTAGEM -->
        <article class="post">

            <div class="post-header">

                <div class="avatar">g</div>

                <div>
                    <strong>gemini</strong>
                    <span>Há 10 minutos</span>
                </div>

            </div>
ฉันหล่อแค่ไหน
            <p class="post-text">
                
            </p>

            <img
                src="https://i.pinimg.com/1200x/55/24/b6/5524b6dbb87b8a2e0c4a7fd869546565.jpg"
                alt="https://i.pinimg.com/1200x/55/24/b6/5524b6dbb87b8a2e0c4a7fd869546565.jpg"
            >

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>

    </main>

    <!-- RODAPÉ: ALTERE com o nome do seu projeto -->
    <footer>
        <p>Mini Feed - Todos os direitos reservados</p>
    </footer>

</body>

</html>
