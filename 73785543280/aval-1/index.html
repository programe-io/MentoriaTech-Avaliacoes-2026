



<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas tarefas de maneira simples e eficiente.</p>
    </header>

    <main class="container">

        <section class="formulario">
            <h2>Nova Tarefa</h2>

            <form id="formTarefa">
                <label for="titulo">Título da tarefa</label>
                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título da tarefa"
                    required
                >

                <label for="prioridade">Prioridade</label>
                <select id="prioridade" required>
                    <option value="">Selecione a prioridade</option>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit">Cadastrar Tarefa</button>
            </form>

            <p id="mensagem"></p>
        </section>

        <section class="lista">
            <h2>Minhas Tarefas</h2>

            <div class="resumo">
                <div class="card-resumo">
                    <span>Total</span>
                    <strong id="total">0</strong>
                </div>

                <div class="card-resumo">
                    <span>Pendentes</span>
                    <strong id="pendentes">0</strong>
                </div>

                <div class="card-resumo">
                    <span>Concluídas</span>
                    <strong id="concluidas">0</strong>
                </div>
            </div>

            <div id="listaTarefas">
                <p class="vazio">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>Projeto desenvolvido em JavaScript - Gerenciador de Tarefas</p>
    </footer>

    <script>
        let tarefas = [];
        let geradorDeCodigo = 0;

        const formulario = document.getElementById("formTarefa");
        const mensagem = document.getElementById("mensagem");

        // Validar dados da tarefa
        function validarDadosDaTarefa(titulo, prioridade) {
            if (titulo.trim().length < 5) {
                throw new Error(
                    "O título deve ter no mínimo 5 caracteres!"
                );
            \}

            if (prioridade < 1 || prioridade > 3) {
                throw new Error(
                    "A prioridade deve ser entre 1 e 3!"
                );
            \}
        \}

        // Cadastrar tarefa
        function cadastrarTarefa(titulo, prioridade) {
            validarDadosDaTarefa(titulo, prioridade);

            let tarefa = {
                codigo: ++geradorDeCodigo,
                titulo: titulo.trim(),
                prioridade: Number(prioridade),
                status: true
            \};

            tarefas.push(tarefa);

            return tarefa;
        \}

        // Listar tarefas
        function listarTarefas() {
            return tarefas;
        \}

        // Buscar tarefa pelo código
        function buscarTarefa(codigo) {
            let tarefa = tarefas.find(
                tarefa => tarefa.codigo === codigo
            );

            if (!tarefa) {
                throw new Error("Tarefa não encontrada!");
            \}

            return tarefa;
        \}

        // Concluir tarefa
        function concluirTarefa(codigo) {
            let tarefa = buscarTarefa(codigo);

            if (!tarefa.status) {
                throw new Error(
                    "Esta tarefa já foi concluída!"
                );
            \}

            tarefa.status = false;
        \}

        // Alterar prioridade
        function alterarPrioridade(codigo, novaPrioridade) {
            let tarefa = buscarTarefa(codigo);

            validarDadosDaTarefa(
                tarefa.titulo,
                Number(novaPrioridade)
            );

            tarefa.prioridade = Number(novaPrioridade);
        \}

        // Exibir tarefas na tela
        function exibirTarefas() {
            const lista = document.getElementById("listaTarefas");
            lista.innerHTML = "";

            let tarefasCadastradas = listarTarefas();

            if (tarefasCadastradas.length === 0) {
                lista.innerHTML =
                    '<p class="vazio">Nenhuma tarefa cadastrada.</p>';
            \}

            tarefasCadastradas.forEach(tarefa => {
                let card = document.createElement("div");

                card.className = tarefa.status
                    ? "tarefa"
                    : "tarefa concluida";

                let titulo = document.createElement("h3");
                titulo.textContent = tarefa.titulo;

                let codigo = document.createElement("p");
                codigo.textContent = "Código: " + tarefa.codigo;

                let prioridade = document.createElement("p");
                prioridade.textContent =
                    "Prioridade: " +
                    ["", "Alta", "Média", "Baixa"][tarefa.prioridade];

                let status = document.createElement("p");
                status.textContent = tarefa.status
                    ? "Status: Pendente"
                    : "Status: Concluída";

                let botoes = document.createElement("div");
                botoes.className = "botoes";

                let botaoConcluir = document.createElement("button");
                botaoConcluir.textContent = "Concluir";
                botaoConcluir.disabled = !tarefa.status;
                botaoConcluir.className = "btn-concluir";

                botaoConcluir.onclick = function() {
                    try {
                        concluirTarefa(tarefa.codigo);

                        mensagem.textContent =
                            "Tarefa concluída!";
                        mensagem.className = "sucesso";

                        exibirTarefas();

                    \} catch (erro) {
                        mostrarErro(erro);
                    \}
                \};

                let botaoAlterar = document.createElement("button");
                botaoAlterar.textContent = "Alterar prioridade";
                botaoAlterar.className = "btn-alterar";

                botaoAlterar.onclick = function() {
                    let novaPrioridade = prompt(
                        "Digite a nova prioridade (1, 2 ou 3):"
                    );

                    if (novaPrioridade === null) return;

                    try {
                        alterarPrioridade(
                            tarefa.codigo,
                            Number(novaPrioridade)
                        );

                        mensagem.textContent =
                            "Prioridade alterada com sucesso!";

                        mensagem.className = "sucesso";

                        exibirTarefas();

                    \} catch (erro) {
                        mostrarErro(erro);
                    \}
                \};

                botoes.append(
                    botaoConcluir,
                    botaoAlterar
                );

                card.append(
                    titulo,
                    codigo,
                    prioridade,
                    status,
                    botoes
                );

                lista.appendChild(card);
            \});

            atualizarResumo();
        \}

        // Atualizar contadores
        function atualizarResumo() {
            document.getElementById("total").textContent =
                tarefas.length;

            document.getElementById("pendentes").textContent =
                tarefas.filter(tarefa => tarefa.status).length;

            document.getElementById("concluidas").textContent =
                tarefas.filter(tarefa => !tarefa.status).length;
        \}

        // Exibir mensagens de erro
        function mostrarErro(erro) {
            mensagem.textContent = erro.message;
            mensagem.className = "erro";
        \}

        // Evento de cadastro
        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            let titulo = document.getElementById("titulo").value;

            let prioridade = Number(
                document.getElementById("prioridade").value
            );

            try {
                cadastrarTarefa(titulo, prioridade);

                mensagem.textContent =
                    "Tarefa cadastrada com sucesso!";

                mensagem.className = "sucesso";

                formulario.reset();

                exibirTarefas();

            \} catch (erro) {
                mostrarErro(erro);
            \}
        \});

        atualizarResumo();
    </script>

<script src="script.js"></script></body>
</html>$0
