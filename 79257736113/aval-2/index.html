<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tekken Hub</title>
    <!-- Link para o arquivo CSS separado -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>TEKKEN WORLD</h1>
        <p>Escolha o seu lutador favorito</p>
    </header>

    <main class="container">
        <!-- Cards dos Personagens -->
        <div class="card" onclick="mostrarLutador('Jin Kazama', 'Estilo: Estilo de Karatê Estilo Mishima / Tradicional')">
            <h2>Jin Kazama</h2>
            <p>O neto de Heihachi Mishima.</p>
        </div>

        <div class="card" onclick="mostrarLutador('Kazuya Mishima', 'Estilo: Karatê Mishima')">
            <h2>Kazuya Mishima</h2>
            <p>O portador do Gene do Diabo.</p>
        </div>

        <div class="card" onclick="mostrarLutador('King', 'Estilo: Luta Livre / Pro Wrestling')">
            <h2>King</h2>
            <p>O mascarado de jaguar de grande coração.</p>
        </div>
    </main>

    <!-- Área de Exibição via JavaScript -->
    <section id="info-lutador" class="info-box">
        <h3 id="nome-lutador">Selecione um lutador acima</h3>
        <p id="detalhes-lutador">Clique em um dos cards para ver os detalhes.</p>
    </section>

    <!-- Link para o arquivo JavaScript separado -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
