<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronômetro</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #e3e9e4; color: #14312d; font-family: system-ui, sans-serif;
  }
  .cronometro {
    width: min(92vw, 380px); padding: 32px 24px 24px;
    background: #f3f6f3; border: 1px solid #c5d1cb; border-radius: 24px; text-align: center;
  }
  .tempo {
    font-size: clamp(3rem, 16vw, 4.2rem); font-weight: 600;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .centesimos { font-size: .55em; color: #2a46f0; }
  .botoes { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; margin-top: 24px; }
  button {
    min-height: 52px; font: 600 1rem system-ui, sans-serif; cursor: pointer;
    border: 1px solid #c5d1cb; border-radius: 14px; background: transparent; color: inherit;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid #2a46f0; outline-offset: 3px; }
  #principal { background: #2a46f0; border-color: #2a46f0; color: #fff; }
  #principal.pausar { background: transparent; border-color: #b3261e; color: #b3261e; }
  ol { list-style: none; margin: 20px 0 0; padding: 0; max-height: 200px; overflow-y: auto; text-align: left; }
  li {
    display: flex; justify-content: space-between; padding: 10px 4px;
    border-top: 1px solid #c5d1cb; font-variant-numeric: tabular-nums;
  }
  li span:first-child { color: #5d7470; }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="cronometro">
    <div class="tempo" role="timer">
      <span id="min">00</span>:<span id="seg">00</span><span class="centesimos">.<span id="cent">00</span></span>
    </div>

    <div class="botoes">
      <button id="secundario" disabled>Volta</button>
      <button id="principal">Iniciar</button>
    </div>

    <ol id="voltas"></ol>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const principal = $("principal"), secundario = $("secundario");
  let inicio = 0, acumulado = 0, rodando = false, raf = 0, voltas = [], ultima = 0;

  const pad = n => String(n).padStart(2, "0");
  const formatar = ms =>
    `${pad(Math.floor(ms / 60000))}:${pad(Math.floor(ms / 1000) % 60)}.${pad(Math.floor(ms / 10) % 100)}`;
  const agora = () => acumulado + (rodando ? performance.now() - inicio : 0);

  function desenhar() {
    const ms = agora();
    $("min").textContent = pad(Math.floor(ms / 60000));
    $("seg").textContent = pad(Math.floor(ms / 1000) % 60);
    $("cent").textContent = pad(Math.floor(ms / 10) % 100);
    if (rodando) raf = requestAnimationFrame(desenhar);
  }

  principal.onclick = () => {
    if (rodando) {
      acumulado += performance.now() - inicio;
      rodando = false;
      cancelAnimationFrame(raf);
      principal.textContent = "Continuar";
      principal.classList.remove("pausar");
      secundario.textContent = "Zerar";
    } else {
      inicio = performance.now();
      rodando = true;
      raf = requestAnimationFrame(desenhar);
      principal.textContent = "Pausar";
      principal.classList.add("pausar");
      secundario.textContent = "Volta";
      secundario.disabled = false;
    }
  };

  secundario.onclick = () => {
    if (rodando) {
      const t = agora();
      voltas.push({ parcial: t - ultima, total: t });
      ultima = t;
    } else {
      acumulado = 0; ultima = 0; voltas = [];
      principal.textContent = "Iniciar";
      secundario.textContent = "Volta";
      secundario.disabled = true;
      desenhar();
    }
    $("voltas").innerHTML = voltas
      .map((v, i) => `<li><span>${i + 1}</span><span>${formatar(v.parcial)}</span><span>${formatar(v.total)}</span></li>`)
      .reverse().join("");
  };
</script>
<script src="script.js"></script></body>
</html>
