<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto pesa?</title>
<style>
  :root {
    --bg: #dde6ea; --painel: #f6f9fa; --tinta: #16252d; --suave: #566b75;
    --linha: #b9c8cf; --destaque: #0e7c7b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px 14px;
    background: var(--bg); color: var(--tinta); font-family: system-ui, "Segoe UI", sans-serif;
  }
  .jogo {
    width: min(100%, 440px); background: var(--painel);
    border: 1px solid var(--linha); border-radius: 28px; padding: 24px 22px 22px;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 1.4rem; }
  #placar { color: var(--suave); font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  #rodada { margin: 22px 0 0; color: var(--suave); font-size: .9rem; text-align: center; }
  .emoji { font-size: 5.5rem; line-height: 1.2; text-align: center; }
  h2 { margin: 0; font-size: 1.3rem; text-align: center; min-height: 2.6em; }
  .leitura {
    display: block; margin: 8px 0 4px; text-align: center; font-size: 2.6rem; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--destaque);
  }

  /* Régua de peso (escala logarítmica) */
  .regua { position: relative; height: 44px; }
  .trilho { position: absolute; left: 14px; right: 14px; top: 0; height: 44px; pointer-events: none; z-index: 3; }
  .marca { position: absolute; top: 5px; width: 4px; height: 34px; margin-left: -2px; border-radius: 2px; background: var(--tinta); }
  input[type=range] {
    -webkit-appearance: none; appearance: none; position: relative; z-index: 2;
    width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--linha); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--linha); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%;
    background: var(--destaque); border: 4px solid var(--painel); box-shadow: 0 0 0 1px var(--destaque);
  }
  input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--destaque); border: 4px solid var(--painel); box-shadow: 0 0 0 1px var(--destaque);
  }
  input[type=range]:disabled { cursor: default; }
  input[type=range]:focus-visible { outline: 3px solid var(--destaque); outline-offset: 2px; border-radius: 8px; }
  .escala { position: relative; height: 1.4em; margin: 0 14px; font-size: .8rem; color: var(--suave); }
  .escala span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

  .resultado { min-height: 4.6em; margin: 14px 0 10px; text-align: center; line-height: 1.45; }
  .resultado strong { display: block; font-size: 1.1rem; }
  button {
    width: 100%; min-height: 52px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--destaque); color: #fff; font: 600 1rem system-ui, sans-serif;
  }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }

  #tela-fim { text-align: center; padding-top: 18px; }
  #tela-fim .emoji { font-size: 4rem; }
  .total { font-size: 3.2rem; font-weight: 700; color: var(--destaque); font-variant-numeric: tabular-nums; }
  #tela-fim p { margin: 6px 0 22px; color: var(--suave); }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>
<main class="jogo">
  <header>
    <h1>Quanto pesa?</h1>
    <span id="placar">0 pontos</span>
  </header>

  <section id="tela-jogo">
    <p id="rodada"></p>
    <div class="emoji" id="emoji" aria-hidden="true"></div>
    <h2 id="nome"></h2>
    <output class="leitura" id="leitura" for="chute"></output>

    <div class="regua">
      <div class="trilho"><div class="marca" id="marca" hidden></div></div>
      <input type="range" id="chute" min="0" max="7" step="0.01" value="3.5" aria-label="Seu palpite de peso">
    </div>
    <div class="escala" aria-hidden="true">
      <span style="left:0">1 g</span>
      <span style="left:42.86%">1 kg</span>
      <span style="left:85.71%">1 t</span>
      <span style="left:100%">10 t</span>
    </div>

    <p class="resultado" id="resultado" aria-live="polite"></p>
    <button id="acao">Confirmar palpite</button>
  </section>

  <section id="tela-fim" hidden>
    <div class="emoji" aria-hidden="true">⚖️</div>
    <div class="total" id="total"></div>
    <p id="mensagem"></p>
    <button id="reiniciar">Jogar de novo</button>
  </section>
</main>

<script>
  // Pesos aproximados, em gramas
  const OBJETOS = [
    { n: "Clipe de papel", e: "📎", g: 1 },
    { n: "Moeda de 1 real", e: "🪙", g: 7 },
    { n: "Ovo de galinha", e: "🥚", g: 60 },
    { n: "Maçã", e: "🍎", g: 180 },
    { n: "Celular", e: "📱", g: 190 },
    { n: "Garrafa de água de 500 ml (cheia)", e: "🧴", g: 530 },
    { n: "Notebook", e: "💻", g: 1800 },
    { n: "Tijolo maciço", e: "🧱", g: 2500 },
    { n: "Gato doméstico", e: "🐈", g: 4000 },
    { n: "Melancia", e: "🍉", g: 8000 },
    { n: "Bicicleta", e: "🚲", g: 12000 },
    { n: "Botijão de gás P13 (cheio)", e: "🛢️", g: 26000 },
    { n: "Cachorro labrador", e: "🐕", g: 30000 },
    { n: "Geladeira", e: "🧊", g: 70000 },
    { n: "Moto de 150 cc", e: "🏍️", g: 120000 },
    { n: "Carro popular", e: "🚗", g: 1000000 },
    { n: "Elefante africano", e: "🐘", g: 5000000 }
  ];
  const RODADAS = 5, MAX_ERRO = 1.5; // erro em ordens de grandeza (log10)

  const $ = id => document.getElementById(id);
  const chute = $("chute"), acao = $("acao");
  let fila = [], i = 0, pontos = 0, revelado = false;

  const num = x => x.toLocaleString("pt-BR", { maximumFractionDigits: 2 });
  const fmt = g => g < 1000 ? `${num(g)} g` : g < 1e6 ? `${num(g / 1000)} kg` : `${num(g / 1e6)} t`;
  const arred = x => Number(x.toPrecision(2));
  const valorChute = () => Math.pow(10, Number(chute.value));

  function iniciar() {
    fila = [...OBJETOS].sort(() => Math.random() - 0.5).slice(0, RODADAS);
    i = 0; pontos = 0;
    $("tela-fim").hidden = true; $("tela-jogo").hidden = false;
    carregar();
  }

  function carregar() {
    const o = fila[i];
    revelado = false;
    $("rodada").textContent = `Objeto ${i + 1} de ${RODADAS}`;
    $("emoji").textContent = o.e;
    $("nome").textContent = o.n;
    $("resultado").innerHTML = "Arraste a régua até o peso que você acha.";
    $("marca").hidden = true;
    $("placar").textContent = `${pontos} ponto${pontos === 1 ? "" : "s"}`;
    chute.disabled = false; chute.value = 3.5;
    acao.textContent = "Confirmar palpite";
    atualizarLeitura();
  }

  function atualizarLeitura() { $("leitura").textContent = "≈ " + fmt(arred(valorChute())); }

  function confirmar() {
    const real = fila[i].g, g = valorChute();
    const erro = Math.abs(Math.log10(g / real));
    const pts = Math.round(Math.max(0, 1 - erro / MAX_ERRO) * 100);
    pontos += pts; revelado = true;

    const rotulo = erro < 0.1 ? "Quase exato!" : erro < 0.3 ? "Chegou perto." : erro < 0.7 ? "Ficou longe." : "Passou bem longe.";
    $("resultado").innerHTML =
      `<strong>${rotulo} +${pts} pontos</strong>Você chutou ${fmt(arred(g))}. O peso real é de cerca de ${fmt(real)}.`;
    $("marca").style.left = (Math.log10(real) / 7 * 100) + "%";
    $("marca").hidden = false;
    $("placar").textContent = `${pontos} ponto${pontos === 1 ? "" : "s"}`;
    chute.disabled = true;
    acao.textContent = i < RODADAS - 1 ? "Próximo objeto" : "Ver resultado";
  }

  function fim() {
    const max = RODADAS * 100;
    $("tela-jogo").hidden = true; $("tela-fim").hidden = false;
    $("total").textContent = `${pontos} / ${max}`;
    $("mensagem").textContent =
      pontos >= max * 0.8 ? "Você tem uma balança nas mãos." :
      pontos >= max * 0.5 ? "Bom olho para peso." :
      pontos >= max * 0.2 ? "Dá para melhorar. Tente de novo." :
      "Os pesos ainda te enganam. Tente de novo.";
  }

  chute.addEventListener("input", atualizarLeitura);
  acao.addEventListener("click", () => {
    if (!revelado) return confirmar();
    i++;
    i < RODADAS ? carregar() : fim();
  });
  $("reiniciar").addEventListener("click", iniciar);

  iniciar();
</script>
<script src="script.js"></script></body>
</html>
