



 
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #c4b5fd);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #6d28d9;
        }

        p {
            color: #666;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5b21b6;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f3e8ff;
            color: #4c1d95;
            display: none;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1>💜 Controle de IMC</h1>
        <p>Calculadora de Índice de Massa Corporal</p>

        <input type="text" id="nome" placeholder="Nome do paciente">

        <input type="number" id="peso" placeholder="Peso (kg)" step="0.1">

        <input type="number" id="altura" placeholder="Altura (metros)" step="0.01">

        <button onclick="calcularIMC()">Calcular IMC</button>

        <div id="resultado"></div>

    </div>

    <script>
        function calcularIMC() {

            let nome = document.getElementById("nome").value;
            let peso = parseFloat(document.getElementById("peso").value);
            let altura = parseFloat(document.getElementById("altura").value);

            if (nome.trim() === "" || isNaN(peso) || isNaN(altura) || peso <= 0 || altura <= 0) {
                alert("Preencha todos os campos corretamente!");
                return;
            }

            let imc = peso / (altura * altura);
            let classificacao;

            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            } 
            else if (imc < 25) {
                classificacao = "Peso normal";
            } 
            else if (imc < 30) {
                classificacao = "Sobrepeso";
            } 
            else if (imc < 35) {
                classificacao = "Obesidade grau I";
            } 
            else if (imc < 40) {
                classificacao = "Obesidade grau II";
            } 
            else {
                classificacao = "Obesidade grau III";
            }

            document.getElementById("resultado").style.display = "block";

            document.getElementById("resultado").innerHTML =
                "<h3>Resultado do paciente</h3>" +
                "<p><strong>Nome:</strong> " + nome + "</p>" +
                "<p><strong>IMC:</strong> " + imc.toFixed(2) + "</p>" +
                "<p><strong>Classificação:</strong> " + classificacao + "</p>";
        }
    </script>

</body>
</html>
