
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        .acoes button {
            margin: 3px 0;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Sistema de Controle de Estoque</h1>

    <h2>Cadastrar Produto</h2>

    <input type="number" id="codigo" placeholder="Código do produto">
    <input type="text" id="descricao" placeholder="Descrição do produto">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor do produto" step="0.01">

    <button onclick="cadastrarProduto()">Cadastrar Produto</button>

    <h2>Produtos Cadastrados</h2>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="listaProdutos"></tbody>
    </table>

</div>

<script>

    // Vetor para armazenar os produtos
    let produtos = [];

    // Função para cadastrar produto
    function cadastrarProduto() {

        let codigo = Number(document.getElementById("codigo").value);
        let descricao = document.getElementById("descricao").value;
        let quantidade = Number(document.getElementById("quantidade").value);
        let valor = Number(document.getElementById("valor").value);

        if (!codigo || !descricao.trim() ||
            !Number.isInteger(quantidade) || quantidade < 0 ||
            !Number.isFinite(valor) || valor < 0) {
            alert("Preencha todos os campos corretamente!");
            return;
        }

        // Verificar se o código já existe
        if (produtos.some(p => p.codigo === codigo)) {
            alert("Este código já está cadastrado!");
            return;
        }

        let produto = {
            codigo: codigo,
            descricao: descricao,
            quantidade: quantidade,
            valor: valor
        };

        produtos.push(produto);

        alert("Produto cadastrado com sucesso!");

        limparCampos();
        listarProdutos();
    }

    // Função para listar produtos
    function listarProdutos() {

        let tabela = document.getElementById("listaProdutos");

        tabela.innerHTML = "";

        produtos.forEach(produto => {

            tabela.innerHTML += `
                <tr>
                    <td>${produto.codigo}</td>
                    <td>${produto.descricao}</td>
                    <td>${produto.quantidade}</td>
                    <td>R$ ${produto.valor.toFixed(2)}</td>
                    <td class="acoes">
                        <button onclick="alterarValor(${produto.codigo})">
                            Alterar Valor
                        </button>

                        <button onclick="alterarQuantidade(${produto.codigo})">
                            Alterar Quantidade
                        </button>
                    </td>
                </tr>
            `;

        });
    }

    // Função para alterar o valor do produto
    function alterarValor(codigo) {

        let produto = produtos.find(p => p.codigo === codigo);

        let novoValor = prompt("Digite o novo valor:");

        if (novoValor === null || novoValor.trim() === "") {
            return;
        }

        novoValor = Number(novoValor);

        if (!Number.isFinite(novoValor) || novoValor < 0) {
            alert("Digite um valor válido!");
            return;
        }

        produto.valor = novoValor;

        alert("Valor alterado com sucesso!");

        listarProdutos();
    }

    // Função para alterar a quantidade
    function alterarQuantidade(codigo) {

        let produto = produtos.find(p => p.codigo === codigo);

        let novaQuantidade = prompt("Digite a nova quantidade:");

        if (novaQuantidade === null || novaQuantidade.trim() === "") {
            return;
        }

        novaQuantidade = Number(novaQuantidade);

        if (!Number.isInteger(novaQuantidade) || novaQuantidade < 0) {
            alert("Digite uma quantidade válida!");
            return;
        }

        produto.quantidade = novaQuantidade;

        alert("Quantidade alterada com sucesso!");

        listarProdutos();
    }

    // Limpar os campos
    function limparCampos() {

        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";

    }

</script>

</body>
</html>
