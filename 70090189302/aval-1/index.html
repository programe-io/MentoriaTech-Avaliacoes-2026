
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2e1065, #7e22ce, #c084fc);
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
        }

        .container {
            background: white;
            max-width: 850px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #6b21a8;
            font-size: 30px;
        }

        .subtitulo {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        h2 {
            color: #7e22ce;
            border-bottom: 2px solid #e9d5ff;
            padding-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #d8b4fe;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #7e22ce;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin: 5px 0;
        }

        button:hover {
            background: #581c87;
        }

        .cadastrar {
            width: 100%;
            margin-top: 10px;
        }

        .acoes {
            background: #faf5ff;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #7e22ce;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f3e8ff;
        }

        .tabela {
            overflow-x: auto;
        }

        .rodape {
            text-align: center;
            color: #888;
            margin-top: 25px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px;
            }

            table {
                min-width: 550px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>📦 Controle de Estoque</h1>
    <p class="subtitulo">Sistema de gerenciamento de produtos</p>

    <h2>➕ Cadastrar Produto</h2>

    <input type="number" id="codigo" placeholder="Código do produto">
    <input type="text" id="descricao" placeholder="Descrição do produto">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor do produto (R$)" step="0.01">

    <button class="cadastrar" onclick="cadastrarProduto()">
        Cadastrar Produto
    </button>

    <div class="acoes">

        <h2>✏️ Alterar Produto</h2>

        <input type="number" id="codigoAlterar" placeholder="Código do produto">

        <input type="number" id="novoValor" placeholder="Novo valor (R$)" step="0.01">

        <button onclick="alterarValor()">Alterar Valor</button>

        <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

        <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    </div>

    <h2>📋 Produtos Cadastrados</h2>

    <div class="tabela">
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                </tr>
            </thead>

            <tbody id="listaProdutos">
                <tr>
                    <td colspan="4">Nenhum produto cadastrado.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <p class="rodape">
        Sistema de Estoque | Desenvolvido com HTML, CSS e JavaScript
    </p>

</div>

<script>

    // Lista que armazena os produtos
    let produtos = [];

    // Cadastrar produto
    function cadastrarProduto() {

        let codigo = Number(document.getElementById("codigo").value);
        let descricao = document.getElementById("descricao").value.trim();
        let quantidade = Number(document.getElementById("quantidade").value);
        let valor = Number(document.getElementById("valor").value);

        if (
            document.getElementById("codigo").value === "" ||
            descricao === "" ||
            document.getElementById("quantidade").value === "" ||
            document.getElementById("valor").value === "" ||
            !Number.isInteger(codigo) ||
            !Number.isInteger(quantidade) ||
            codigo <= 0 || quantidade < 0 || valor < 0
        ) {
            alert("Preencha todos os campos corretamente!");
            return;
        }

        let existe = produtos.find(p => p.codigo === codigo);

        if (existe) {
            alert("Esse código já está cadastrado!");
            return;
        }

        let produto = {
            codigo: codigo,
            descricao: descricao,
            quantidade: quantidade,
            valor: valor
        };

        produtos.push(produto);

        alert("Produto cadastrado com sucesso!");

        listarProdutos();

        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";
    }

    // Listar produtos
    function listarProdutos() {

        let tabela = document.getElementById("listaProdutos");

        tabela.innerHTML = "";

        if (produtos.length === 0) {
            tabela.innerHTML =
                '<tr><td colspan="4">Nenhum produto cadastrado.</td></tr>';
            return;
        }

        produtos.forEach(function(produto) {

            tabela.innerHTML += `
                <tr>
                    <td>${produto.codigo}</td>
                    <td>${produto.descricao}</td>
                    <td>${produto.quantidade}</td>
                    <td>R$ ${produto.valor.toFixed(2).replace(".", ",")}</td>
                </tr>
            `;

        });
    }

    // Alterar valor
    function alterarValor() {

        let codigo = Number(document.getElementById("codigoAlterar").value);
        let novoValor = document.getElementById("novoValor").value;

        if (codigo <= 0 || novoValor === "" || Number(novoValor) < 0) {
            alert("Informe um código e um valor válido!");
            return;
        }

        let produto = produtos.find(p => p.codigo === codigo);

        if (produto) {

            produto.valor = Number(novoValor);

            alert("Valor alterado com sucesso!");

            listarProdutos();

        } else {

            alert("Produto não encontrado!");

        }
    }

    // Alterar quantidade
    function alterarQuantidade() {

        let codigo = Number(document.getElementById("codigoAlterar").value);
        let novaQuantidade = document.getElementById("novaQuantidade").value;

        if (
            codigo <= 0 ||
            novaQuantidade === "" ||
            !Number.isInteger(Number(novaQuantidade)) ||
            Number(novaQuantidade) < 0
        ) {
            alert("Informe um código e uma quantidade válida!");
            return;
        }

        let produto = produtos.find(p => p.codigo === codigo);

        if (produto) {

            produto.quantidade = Number(novaQuantidade);

            alert("Quantidade alterada com sucesso!");

            listarProdutos();

        } else {

            alert("Produto não encontrado!");

        }
    }

</script>

</body>
</html>
