
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Instagram</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>InstaMini 📸</h1>
    <input type="text" placeholder="Pesquisar...">
</header>

<div class="container">

    <aside>
        <h3>Menu</h3>
        <p>🏠 Início</p>
        <p>🔍 Pesquisar</p>
        <p>❤️ Curtidas</p>
        <p>👤 Perfil</p>
    </aside>

    <main>
        <section class="stories">
            <div>🔴<br>João</div>
            <div>🟣<br>Maria</div>
            <div>🟡<br>Pedro</div>
            <div>🟢<br>Ana</div>
        </section>

        <section class="publicar">
            <h3>Criar publicação</h3>
            <input type="text" id="nome" placeholder="Seu nome">
            <input type="text" id="foto" placeholder="URL da imagem">
            <textarea id="legenda" placeholder="Escreva uma legenda..."></textarea>
            <button onclick="publicar()">Publicar</button>
        </section>

        <div id="feed">

            <article class="post">
                <h3>João Silva</h3>
                <img src="https://picsum.photos/id/10/600/400">
                <p>Um lugar incrível! 🌳</p>
                <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                <button onclick="comentar(this)">💬 Comentar</button>
                <div class="comentarios"></div>
            </article>

            <article class="post">
                <h3>Maria Souza</h3>
                <img src="https://picsum.photos/id/20/600/400">
                <p>Meu dia está maravilhoso! ☀️</p>
                <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                <button onclick="comentar(this)">💬 Comentar</button>
                <div class="comentarios"></div>
            </article>

        </div>
    </main>

</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
