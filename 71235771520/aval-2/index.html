<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-yellow: #facc15;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        main-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        /* Formulário de Cadastro */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 140px;
            gap: 10px;
            margin-top: 1rem;
        }

        input, select, button {
            background-color: var(--bg-primary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
        }

        .btn-add {
            grid-column: span 2;
            background-color: var(--accent-blue);
            color: #0f172a;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .btn-add:hover {
            opacity: 0.9;
        }

        /* Mensagem de Erro */
        .error-alert {
            background-color: rgba(248, 113, 113, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        /* Lista de Tarefas */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .task-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: border-color 0.2s;
        }

        .task-item.completed {
            opacity: 0.6;
            border-color: transparent;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex-grow: 1;
        }

        .task-code {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .task-title {
            font-size: 0.95rem;
            word-break: break-word;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
        }

        .task-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .prio-select {
            padding: 0.4rem;
            font-size: 0.8rem;
        }

        .btn-status {
            background: transparent;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            cursor: pointer;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .task-item.completed .btn-status {
            border-color: var(--text-sub);
            color: var(--text-sub);
        }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
            padding: 2rem 0;
        }
    </style>
</head>
<body>

    <main-container>
        <header>
            <h1>SISTEMA DE TAREFAS</h1>
        </header>

        <!-- Formulário com Alertas de Validação -->
        <section class="card">
            <div id="errorBox" class="error-alert"></div>

            <form id="createTaskForm">
                <div class="form-grid">
                    <input type="text" id="taskTitle" placeholder="Título da tarefa (mín. 5 caracteres)..." required>
                    
                    <select id="taskPriority" required>
                        <option value="1">1 - Alta</option>
                        <option value="2" selected>2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>

                    <button type="submit" class="btn-add">+ Criar Tarefa</button>
                </div>
            </form>
        </section>

        <!-- Container da Lista -->
        <section>
            <h2>Tarefas Registadas</h2>
            <div id="taskListContainer" class="task-list">
                <!-- Inserido dinamicamente via JS -->
            </div>
        </section>
    </main-container>

    <script>
        /**
         * LÓGICA DO ALGORITMO COM PROGRAMAÇÃO REATIVA / MAP
         */
        
        // Estado da aplicação
        const state = {
            tasks: new Map(), // Uso de Map em vez de Array
            counter: 1001
        };

        // Elementos do DOM
        const form = document.getElementById('createTaskForm');
        const inputTitle = document.getElementById('taskTitle');
        const selectPriority = document.getElementById('taskPriority');
        const errorBox = document.getElementById('errorBox');
        const container = document.getElementById('taskListContainer');

        // Função de Validação[cite: 1]
        function validateInputs(title, priority) {
            const cleanTitle = title.trim();
            const prioNum = Number(priority);

            if (cleanTitle.length < 5) {
                return 'O título da tarefa deve conter no mínimo 5 caracteres.';[cite: 1]
            }

            if (![1, 2, 3].includes(prioNum)) {
                return 'Selecione uma prioridade válida entre 1 (alta) e 3 (baixa).';[cite: 1]
            }

            return null;
        }

        // Adicionar Tarefa[cite: 1]
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const title = inputTitle.value;
            const priority = selectPriority.value;

            const error = validateInputs(title, priority);

            if (error) {
                errorBox.textContent = error;
                errorBox.style.display = 'block';
                return;
            }

            errorBox.style.display = 'none';

            // Criar objeto da tarefa
            const code = state.counter++;
            state.tasks.set(code, {
                codigo: code,
                titulo: title.trim(),
                prioridade: Number(priority),
                concluida: false
            });

            // Limpar formulário
            inputTitle.value = '';
            selectPriority.value = '2';

            render();
        });

        //
  <script src="script.js"></script>
  
</body>
</html>
