```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Sistema de Estoque</h1>

    <h2>Cadastrar um novo produto</h2>
    <input id="codigo" placeholder="Código">
    <input id="descricao" placeholder="Descrição">
    <input id="quantidade" type="number" placeholder="Quantidade">
    <input id="valor" type="number" placeholder="Valor">
    <button onclick="cadastrar()">Cadastrar</button>

    <h2>Listar os produtos cadastrados</h2>
    <button onclick="listar()">Listar produtos</button>
    <ul id="lista"></ul>

    <h2>Alterar o valor de um produto</h2>
    <input id="codigoValor" placeholder="Código do produto">
    <input id="novoValor" type="number" placeholder="Novo valor">
    <button onclick="alterarValor()">Alterar valor</button>

    <h2>Alterar a quantidade de um produto</h2>
    <input id="codigoQuantidade" placeholder="Código do produto">
    <input id="novaQuantidade" type="number" placeholder="Nova quantidade">
    <button onclick="alterarQuantidade()">Alterar quantidade</button>

    <script>
        let produtos = [];

        function cadastrar() {
            let codigo = document.getElementById("codigo").value;
            let descricao = document.getElementById("descricao").value;
            let quantidade = Number(document.getElementById("quantidade").value);
            let valor = Number(document.getElementById("valor").value);

            if (!codigo || !descricao ||
                document.getElementById("quantidade").value === "" ||
                document.getElementById("valor").value === "") {
                alert("Preencha todos os campos!");
                return;
            }

            if (produtos.some(p => p.codigo === codigo)) {
                alert("Esse código já está cadastrado!");
                return;
            }

            produtos.push({ codigo, descricao, quantidade, valor });
            alert("Produto cadastrado com sucesso!");
        }

        function listar() {
            let lista = document.getElementById("lista");
            lista.innerHTML = "";

            produtos.forEach(p => {
                let item = document.createElement("li");
                item.textContent =
                    "Código: " + p.codigo +
                    " | Descrição: " + p.descricao +
                    " | Quantidade: " + p.quantidade +
                    " | Valor: R$ " + p.valor.toFixed(2);
                lista.appendChild(item);
            });

            if (produtos.length === 0) {
                lista.innerHTML = "<li>Nenhum produto cadastrado.</li>";
            }
        }

        function alterarValor() {
            let codigo = document.getElementById("codigoValor").value;
            let valor = document.getElementById("novoValor").value;
            let produto = produtos.find(p => p.codigo === codigo);

            if (!produto) {
                alert("Produto não encontrado!");
                return;
            }

            if (valor === "" || Number(valor) < 0) {
                alert("Digite um valor válido!");
                return;
            }

            produto.valor = Number(valor);
            alert("Valor alterado com sucesso!");
            listar();
        }

        function alterarQuantidade() {
            let codigo = document.getElementById("codigoQuantidade").value;
            let quantidade = document.getElementById("novaQuantidade").value;
            let produto = produtos.find(p => p.codigo === codigo);

            if (!produto) {
                alert("Produto não encontrado!");
                return;
            }

            if (quantidade === "" || Number(quantidade) < 0) {
                alert("Digite uma quantidade válida!");
                return;
            }

            produto.quantidade = Number(quantidade);
            alert("Quantidade alterada com sucesso!");
            listar();
        }
    </script>

<script src="script.js"></script></body>
</html>
