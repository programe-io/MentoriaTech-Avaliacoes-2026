
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed - Maria Eduarda</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <div class="header-content">
        <h1>Mini Feed</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Perfil</a>
        </nav>
    </div>
</header>

<main>

    <section class="new-post">
        <div class="avatar">M</div>

        <input type="text" id="postInput"
        placeholder="Maria Eduarda, o que você está pensando?">

        <button onclick="publicar()">Publicar</button>
    </section>

    <div id="feed">

        <article class="post">
            <div class="post-header">
                <div class="avatar">M</div>
                <div>
                    <strong>Maria Eduarda</strong>
                    <span>Há 10 minutos</span>
                </div>
            </div>

            <p class="post-text">
                Oi, pessoal! Essa é minha primeira publicação! 💜
            </p>

            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800"
            alt="Computador">

            <div class="post-actions">
                <button onclick="curtir(this)">Curtir ❤️</button>
                <button onclick="comentar(this)">Comentar 💬</button>
            </div>
        </article>

        <article class="post">
            <div class="post-header">
                <div class="avatar">M</div>
                <div>
                    <strong>Maria Eduarda</strong>
                    <span>Há 20 minutos</span>
                </div>
            </div>

            <p class="post-text">
                Estudando programação e criando meu próprio projeto! ✨
            </p>

            <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800"
            alt="Pessoa usando computador">

            <div class="post-actions">
                <button onclick="curtir(this)">Curtir ❤️</button>
                <button onclick="comentar(this)">Comentar 💬</button>
            </div>
        </article>

    </div>
</main>

<footer>
    <p>© 2026 Mini Feed - Maria Eduarda</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
