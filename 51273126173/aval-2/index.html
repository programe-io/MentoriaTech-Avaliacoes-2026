
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>🌐 Meu Feed Social</header>

    <div class="container">

        <div class="create-post">
            <h3>O que está acontecendo?</h3>
            <textarea id="postText" placeholder="Compartilhe algo..."></textarea>
            <button class="publish" onclick="createPost()">
                Publicar
            </button>
        </div>

        <div id="feed">

            <div class="post">
                <div class="user">
                    <div class="avatar">JD</div>
                    <div class="user-info">
                        <strong>João Silva</strong>
                        <small>Há 10 minutos</small>
                    </div>
                </div>

                <p>Olá, pessoal! Bem-vindos ao meu novo feed social! 🚀</p>

                <div class="actions">
                    <button onclick="likePost(this)">♡ Curtir <span>0</span></button>
                    <button onclick="focusComment(this)">💬 Comentar</button>
                </div>

                <div class="comments"></div>

                <div class="comment-area">
                    <input type="text" placeholder="Escreva um comentário...">
                    <button onclick="addComment(this)">Enviar</button>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
