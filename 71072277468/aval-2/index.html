<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação de Mentoria Tech</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <header class="cabecalho">
      <span class="badge">Mentoria Tech</span>
      <h1>Avaliação da Sessão</h1>
      <p>Seu feedback ajuda a aprimorar os próximos encontros.</p>
    </header>

    <form id="avaliacaoForm">
      <div class="campo">
        <label for="mentor">Mentor(a)</label>
        <input type="text" id="mentor" name="mentor" placeholder="Nome do mentor ou mentora" required>
      </div>

      <div class="campo">
        <label for="foco">Foco principal da mentoria</label>
        <select id="foco" name="foco" required>
          <option value="">Escolha uma opção...</option>
          <option value="codigo">Revisão de Código / Arquitetura</option>
          <option value="carreira">Plano de Carreira / Transição</option>
          <option value="entrevista">Preparação para Entrevistas</option>
          <option value="projeto">Destravamento de Projeto</option>
        </select>
      </div>

      <div class="campo">
        <label>Nível de satisfação</label>
        <div class="escala">
          <input type="radio" id="nota1" name="nota" value="1" required>
          <label for="nota1">1</label>

          <input type="radio" id="nota2" name="nota" value="2">
          <label for="nota2">2</label>

          <input type="radio" id="nota3" name="nota" value="3">
          <label for="nota3">3</label>

          <input type="radio" id="nota4" name="nota" value="4">
          <label for="nota4">4</label>

          <input type="radio" id="nota5" name="nota" value="5">
          <label for="nota5">5</label>
        </div>
      </div>

      <div class="campo">
        <label for="feedback">O que funcionou bem e o que pode melhorar?</label>
        <textarea id="feedback" name="feedback" rows="4" placeholder="Escreva seus comentários aqui..."></textarea>
      </div>

      <button type="submit" class="btn-enviar">Enviar Avaliação</button>
    </form>
  </main>
<script src="script.js"></script></body>
</html>
