<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação de Mentoria Tech</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      color: #222;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }
    .campo {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    button {
      background-color: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
  </style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Avaliação de Mentoria Tech</h1>
    <form action="/enviar-avaliacao" method="POST">
      <div class="campo">
        <label for="mentor">Nome do(a) mentor(a)</label>
        <input type="text" id="mentor" name="mentor" required>
      </div>

      <div class="campo">
        <label for="trilha">Área / Trilha abordada</label>
        <select id="trilha" name="trilha" required>
          <option value="">Selecione...</option>
          <option value="frontend">Front-end (HTML, CSS, JS, frameworks)</option>
          <option value="backend">Back-end e APIs</option>
          <option value="arquitetura">Arquitetura e System Design</option>
          <option value="carreira">Carreira, portfólio e entrevistas</option>
          <option value="lideranca">Liderança técnica</option>
        </select>
      </div>

      <div class="campo">
        <label for="nota">Nota geral (1 a 5)</label>
        <select id="nota" name="nota" required>
          <option value="5">5 - Excelente</option>
          <option value="4">4 - Muito boa</option>
          <option value="3">3 - Boa</option>
          <option value="2">2 - Regular</option>
          <option value="1">1 - Ruim</option>
        </select>
      </div>

      <div class="campo">
        <label for="pontos_fortes">O que mais ajudou na sessão?</label>
        <textarea id="pontos_fortes" name="pontos_fortes" placeholder="Ex.: revisão de código, clareza nos próximos passos..."></textarea>
      </div>

      <div class="campo">
        <label for="melhorias">Sugestões de melhoria</label>
        <textarea id="melhorias" name="melhorias" placeholder="O que pode melhorar nas próximas mentorias?"></textarea>
      </div>

      <button type="submit">Enviar avaliação</button>
    </form>
  </div>
</body>
</html>
