<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminária Interativa</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <!-- Ícone da Lâmpada/Luminária -->
        <div class="lamp-container">
            <div class="wire"></div>
            <div class="bulb">
                <div class="glow"></div>
            </div>
        </div>

        <!-- Texto Central -->
        <h1 id="status-title">A sala está escura.</h1>
        <p id="status-desc">Clique no interruptor abaixo para acender a luz e mudar a atmosfera.</p>

        <!-- Interruptor Moderno -->
        <label class="switch">
            <input type="checkbox" id="toggle-light">
            <span class="slider"></span>
        </label>
    </div>
<script src="script.js"></script></body>
</html>
