<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Links</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <!-- Foto de Perfil e Nome -->
        <div class="perfil">
            <div class="foto-placeholder"></div>
            <h1>Seu Nome</h1>
            <p>Estudante de Desenvolvimento Web</p>
        </div>

        <!-- Botões de Links -->
        <div class="links">
            <a href="https://github.com" target="_blank" class="botao-link">Meu GitHub</a>
            <a href="https://linkedin.com" target="_blank" class="botao-link">Meu LinkedIn</a>
            <a href="#" class="botao-link">Meu Portfólio</a>
        </div>

        <!-- Interação com JavaScript -->
        <div class="interacao">
            <button id="btn-mensagem">Clique aqui</button>
            <p id="mensagem-oculta" class="escondido">Obrigado por visitar meu projeto! 🚀</p>
        </div>
    </div>

<script src="script.js"></script></body>
</html>
