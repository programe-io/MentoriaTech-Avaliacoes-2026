<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f4f4f9;
    }
    .calculadora {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      width: 260px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    #visor {
      width: 100%;
      height: 50px;
      font-size: 1.5rem;
      text-align: right;
      margin-bottom: 12px;
      padding: 8px;
      box-sizing: border-box;
      border: none;
      border-radius: 6px;
      background: #fff;
    }
    .botoes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    button {
      height: 48px;
      font-size: 1.1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #3a3a3a;
      color: #fff;
    }
    button:hover {
      background: #505050;
    }
    .operador {
      background: #ff9500;
    }
    .operador:hover {
      background: #e08300;
    }
    .limpar {
      background: #d9534f;
      grid-column: span 2;
    }
    .igual {
      background: #28a745;
      grid-column: span 2;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="calculadora">
    <input type="text" id="visor" readonly />
    <div class="botoes">
      <button class="limpar" onclick="limpar()">C</button>
      <button onclick="apagar()">⌫</button>
      <button class="operador" onclick="adicionar('/')">/</button>

      <button onclick="adicionar('7')">7</button>
      <button onclick="adicionar('8')">8</button>
      <button onclick="adicionar('9')">9</button>
      <button class="operador" onclick="adicionar('*')">*</button>

      <button onclick="adicionar('4')">4</button>
      <button onclick="adicionar('5')">5</button>
      <button onclick="adicionar('6')">6</button>
      <button class="operador" onclick="adicionar('-')">-</button>

      <button onclick="adicionar('1')">1</button>
      <button onclick="adicionar('2')">2</button>
      <button onclick="adicionar('3')">3</button>
      <button class="operador" onclick="adicionar('+')">+</button>

      <button onclick="adicionar('0')">0</button>
      <button onclick="adicionar('.')">.</button>
      <button class="igual" onclick="calcular()">=</button>
    </div>
  </div>

  <script>
    const visor = document.getElementById('visor');

    function adicionar(valor) {
      visor.value += valor;
    }

    function limpar() {
      visor.value = '';
    }

    function apagar() {
      visor.value = visor.value.slice(0, -1);
    }

    function calcular() {
      try {
        const expressao = visor.value.trim();
        if (!expressao) return;
        if (!/^[0-9+\-*/.() ]+$/.test(expressao)) {
          visor.value = 'Erro';
          return;
        }
        const resultado = Function('"use strict"; return (' + expressao + ')')();
        visor.value = Number.isFinite(resultado) ? resultado : 'Erro';
      } catch {
        visor.value = 'Erro';
      }
    }
  </script>
<script src="script.js"></script></body>
</html>
