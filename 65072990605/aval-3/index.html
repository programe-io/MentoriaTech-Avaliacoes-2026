<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Jogo de tiro 2D arcade desenvolvido com HTML, CSS e JavaScript."
    >

    <title>Neon Strike</title>

    <link rel="stylesheet" href="css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="game-wrapper">

        <!-- =========================
             HUD
        ========================== -->

        <header class="hud">

            <div class="hud-item">

                <span class="hud-label">
                    PONTOS
                </span>

                <strong id="score">
                    0
                </strong>

            </div>


            <div class="hud-item">

                <span class="hud-label">
                    ONDA
                </span>

                <strong id="wave">
                    1
                </strong>

            </div>


            <div class="hud-item health-container">

                <span class="hud-label">
                    VIDA
                </span>

                <div class="health-bar">

                    <div
                        id="healthBar"
                        class="health-fill"
                    ></div>

                </div>

                <strong id="healthText">
                    100
                </strong>

            </div>


            <div class="hud-item ammo-container">

                <span class="hud-label">
                    MUNIÇÃO
                </span>

                <strong id="ammo">
                    12 / 72
                </strong>

            </div>

        </header>


        <!-- =========================
             ÁREA DO JOGO
        ========================== -->

        <main class="game-container">

            <canvas
                id="gameCanvas"
            ></canvas>


            <!-- =========================
                 CROSSHAIR
            ========================== -->

            <div
                id="crosshair"
                class="crosshair"
            >
                <span></span>
            </div>


            <!-- =========================
                 MENU INICIAL
            ========================== -->

            <section
                id="startScreen"
                class="screen active"
            >

                <div class="screen-content">

                    <div class="game-logo">

                        <span>
                            NEON
                        </span>

                        STRIKE

                    </div>

                    <p>
                        ARENA DE COMBATE
                    </p>

                    <button
                        id="startButton"
                        class="game-button"
                    >
                        INICIAR JOGO
                    </button>

                    <div class="controls">

                        <span>
                            <b>W A S D</b>
                            mover
                        </span>

                        <span>
                            <b>MOUSE</b>
                            mirar
                        </span>

                        <span>
                            <b>CLICK</b>
                            atirar
                        </span>

                        <span>
                            <b>R</b>
                            recarregar
                        </span>

                        <span>
                            <b>ESC</b>
                            pausar
                        </span>

                    </div>

                </div>

            </section>


            <!-- =========================
                 PAUSA
            ========================== -->

            <section
                id="pauseScreen"
                class="screen"
            >

                <div class="screen-content">

                    <h1>
                        PAUSADO
                    </h1>

                    <p>
                        O jogo está pausado.
                    </p>

                    <button
                        id="resumeButton"
                        class="game-button"
                    >
                        CONTINUAR
                    </button>

                    <button
                        id="pauseRestartButton"
                        class="game-button secondary"
                    >
                        REINICIAR
                    </button>

                </div>

            </section>


            <!-- =========================
                 GAME OVER
            ========================== -->

            <section
                id="gameOverScreen"
                class="screen"
            >

                <div class="screen-content">

                    <span class="game-over-label">
                        MISSÃO FINALIZADA
                    </span>

                    <h1>
                        GAME OVER
                    </h1>

                    <div class="final-score">

                        <span>
                            PONTUAÇÃO
                        </span>

                        <strong id="finalScore">
                            0
                        </strong>

                    </div>

                    <div class="final-wave">

                        Onda alcançada:
                        <strong id="finalWave">
                            1
                        </strong>

                    </div>

                    <button
                        id="restartButton"
                        class="game-button"
                    >
                        JOGAR NOVAMENTE
                    </button>

                </div>

            </section>


            <!-- =========================
                 RELOAD INDICATOR
            ========================== -->

            <div
                id="reloadIndicator"
                class="reload-indicator"
            >
                RECARREGANDO...
            </div>


            <!-- =========================
                 DAMAGE EFFECT
            ========================== -->

            <div
                id="damageEffect"
                class="damage-effect"
            ></div>

        </main>


        <!-- =========================
             MOBILE CONTROLS
        ========================== -->

        <div class="mobile-controls">

            <button data-key="w">
                ▲
            </button>

            <div>

                <button data-key="a">
                    ◀
                </button>

                <button data-key="s">
                    ▼
                </button>

                <button data-key="d">
                    ▶
                </button>

            </div>

        </div>


        <footer class="footer">

            <span>
                NEON STRIKE
            </span>

            <span>
                HTML • CSS • JAVASCRIPT
            </span>

        </footer>

    </div>


    <script src="js/game.js"></script>

<script src="script.js"></script></body>

</html>
