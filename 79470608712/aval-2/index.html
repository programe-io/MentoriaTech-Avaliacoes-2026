
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Desafio do Saber</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <main class="container">
              <h1>🧠 Desafio do Saber</h1>
                  <p>Teste seus conhecimentos!</p>

                      <section id="jogo">
                            <div class="info">
                                    <span id="progresso">Pergunta 1 de 5</span>
                                            <span id="pontos">Pontos: 0</span>
                                                  </div>

                                                        <div class="barra">
                                                                <div id="preenchimento"></div>
                                                                      </div>

                                                                            <h2 id="pergunta"></h2>
                                                                                  <div id="alternativas"></div>
                                                                                        <p id="mensagem"></p>

                                                                                              <button id="proxima" hidden>Próxima pergunta</button>
                                                                                                  </section>

                                                                                                      <section id="resultado" hidden>
                                                                                                            <h2>🏆 Fim do jogo!</h2>
                                                                                                                  <p id="pontuacaoFinal"></p>
                                                                                                                        <button onclick="reiniciar()">Jogar novamente</button>
                                                                                                                            </section>
                                                                                                                              </main>

                                                                                                                                <script src="script.js"></script>
                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                </html>
