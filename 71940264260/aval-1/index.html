
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <h2>Cadastrar Produto</h2>

        <input type="text" id="descricao" placeholder="Nome do produto">
        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="number" id="valor" placeholder="Valor">

        <button onclick="cadastrarProduto()">Cadastrar Produto</button>

        <h2>Atualizar Preço</h2>

        <input type="number" id="codigoPreco" placeholder="Código do produto">
        <input type="number" id="novoValor" placeholder="Novo preço">

        <button onclick="atualizarValor()">Atualizar Preço</button>

        <h2>Atualizar Quantidade</h2>

        <input type="number" id="codigoQuantidade" placeholder="Código do produto">
        <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

        <button onclick="atualizarQuantidade()">Atualizar Quantidade</button>

        <h2>Lista de Produtos</h2>

        <button onclick="listarProdutos()">Listar Produtos</button>

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                </tr>
            </thead>

            <tbody id="listaProdutos"></tbody>
        </table>

        <p id="mensagem"></p>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
