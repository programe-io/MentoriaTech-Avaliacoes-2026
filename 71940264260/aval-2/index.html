
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Gerenciamento de Tarefas</h1>

        <section>
            <h2>Cadastrar Tarefa</h2>

            <input type="text" id="titulo"
                placeholder="Digite o título da tarefa">

            <input type="number" id="prioridade"
                placeholder="Prioridade (1 a 5)">

            <button onclick="cadastrarTarefaHTML()">
                Cadastrar Tarefa
            </button>
        </section>

        <section>
            <h2>Concluir Tarefa</h2>

            <input type="number" id="codigoConcluir"
                placeholder="Código da tarefa">

            <button onclick="concluirTarefaHTML()">
                Concluir Tarefa
            </button>
        </section>

        <section>
            <h2>Alterar Prioridade</h2>

            <input type="number" id="codigoAlterar"
                placeholder="Código da tarefa">

            <input type="number" id="novaPrioridade"
                placeholder="Nova prioridade (1 a 5)">

            <button onclick="alterarPrioridadeHTML()">
                Alterar Prioridade
            </button>
        </section>

        <section>
            <h2>Buscar Tarefa</h2>

            <input type="number" id="codigoBuscar"
                placeholder="Código da tarefa">

            <button onclick="buscarTarefaHTML()">
                Buscar Tarefa
            </button>
        </section>

        <section>
            <h2>Lista de Tarefas</h2>

            <button onclick="mostrarTarefas()">
                Listar Tarefas
            </button>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Título</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="listaTarefas"></tbody>
            </table>
        </section>

        <p id="mensagem"></p>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
