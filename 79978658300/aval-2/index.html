<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Link para o CSS compilado -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    
    <header class="header">
        <div class="header-container">
            <div class="brand">
                <i class="fa-solid fa-shapes logo-icon"></i>
                <span class="logo-text">DevSocial</span>
            </div>
            
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar publicações...">
            </div>

            <div class="header-actions">
                <button id="themeToggle" class="icon-btn" title="Alternar Tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <div class="user-avatar-header">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Minha Foto">
                </div>
            </div>
        </div>
    </header>

    
    <div class="main-layout">

        
        <aside class="sidebar left-sidebar">
            <div class="card profile-card">
                <div class="profile-banner"></div>
                <div class="profile-avatar">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Avatar do Utilizador">
                </div>
                <div class="profile-info">
                    <h3>Pessoa</h3>
                    <p>@pessoa_dev</p>
                    <span class="bio">Licenciando em Computação & Desenvolvedor Web 🚀</span>
                </div>
                <div class="profile-stats">
                    <div class="stat-item">
                        <strong id="postCountDisplay">0</strong>
                        <span>Posts</span>
                    </div>
                    <div class="stat-item">
                        <strong>342</strong>
                        <span>Apoiadores</span>
                    </div>
                    <div class="stat-item">
                        <strong>128</strong>
                        <span>A seguir</span>
                    </div>
                </div>
            </div>
        </aside>

        
        <main class="feed-area">

            
            <div class="card create-post-card">
                <div class="create-post-header">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" class="avatar-sm" alt="Sua foto">
                    <textarea id="postInput" placeholder="No que está a pensar hoje?"></textarea>
                </div>
                
                <div id="imagePreviewContainer" class="image-preview-container hidden">
                    <img id="imagePreview" src="" alt="Pré-visualização">
                    <button id="removeImgBtn" class="remove-img-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="create-post-actions">
                    <div class="options">
                        <label class="action-tag" title="Anexar Imagem">
                            <i class="fa-solid fa-image image-icon"></i> Foto
                            <input type="file" id="imageInput" accept="image/*" class="hidden-input">
                        </label>
                        
                        <select id="categorySelect" class="category-select">
                            <option value="Geral">💬 Geral</option>
                            <option value="Tech">💻 Tech</option>
                            <option value="Design">🎨 Design</option>
                            <option value="Estilo de Vida">☕ Estilo de Vida</option>
                        </select>
                    </div>

                    <button id="publishBtn" class="primary-btn">Publicar</button>
                </div>
            </div>

            
            <div class="filters-bar">
                <div class="category-pills">
                    <button class="pill active" data-category="Todas">Todas</button>
                    <button class="pill" data-category="Tech">Tech</button>
                    <button class="pill" data-category="Design">Design</button>
                    <button class="pill" data-category="Estilo de Vida">Estilo de Vida</button>
                </div>
            </div>

            
            <div id="postsList" class="posts-list">
                <!-- Posts injetados dinamicamente via JavaScript -->
            </div>

        </main>

        
        <aside class="sidebar right-sidebar">
            <div class="card widget-card">
                <h3><i class="fa-solid fa-arrow-trend-up"></i> Assuntos em Alta</h3>
                <ul class="trending-list">
                    <li>
                        <span class="tag">#DesenvolvimentoWeb</span>
                        <small>1.4k publicações</small>
                    </li>
                    <li>
                        <span class="tag">#HTML5eCSS3</span>
                        <small>890 publicações</small>
                    </li>
                    <li>
                        <span class="tag">#JavaScriptModerno</span>
                        <small>2.1k publicações</small>
                    </li>
                </ul>
            </div>
        </aside>

    </div>

    
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
