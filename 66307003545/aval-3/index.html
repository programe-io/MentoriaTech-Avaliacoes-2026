
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ficha Médica</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🏥 Sistema Médico</h1>
    <p>Gerenciamento de fichas de pacientes</p>
</header>

<main class="container">

    <section class="formulario">
        <h2 id="tituloFormulario">Cadastrar Paciente</h2>

        <form id="formPaciente">

            <input type="hidden" id="indice">

            <div class="campo">
                <label>Nome completo</label>
                <input type="text" id="nome" required
                placeholder="Nome do paciente">
            </div>

            <div class="linha">
                <div class="campo">
                    <label>Idade</label>
                    <input type="number" id="idade" min="0" required>
                </div>

                <div class="campo">
                    <label>Sexo</label>
                    <select id="sexo" required>
                        <option value="">Selecione</option>
                        <option>Masculino</option>
                        <option>Feminino</option>
                        <option>Outro</option>
                        <option>Não informado</option>
                    </select>
                </div>
            </div>

            <div class="campo">
                <label>CPF</label>
                <input type="text" id="cpf"
                placeholder="000.000.000-00">
            </div>

            <div class="campo">
                <label>Telefone</label>
                <input type="tel" id="telefone"
                placeholder="(00) 00000-0000">
            </div>

            <div class="campo">
                <label>Tipo sanguíneo</label>
                <select id="sangue">
                    <option value="">Selecione</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>Não informado</option>
                </select>
            </div>

            <div class="campo">
                <label>Alergias</label>
                <textarea id="alergias"
                placeholder="Informe as alergias"></textarea>
            </div>

            <div class="campo">
                <label>Histórico médico</label>
                <textarea id="historico"
                placeholder="Histórico de saúde do paciente"></textarea>
            </div>

            <div class="campo">
                <label>Diagnóstico</label>
                <textarea id="diagnostico"
                placeholder="Diagnóstico médico"></textarea>
            </div>

            <div class="campo">
                <label>Observações</label>
                <textarea id="observacoes"
                placeholder="Observações adicionais"></textarea>
            </div>

            <button type="submit" id="btnSalvar">
                Cadastrar Paciente
            </button>

            <button type="button" class="limpar"
            onclick="limparFormulario()">
                Limpar Campos
            </button>

        </form>
    </section>

    <section class="lista">
        <h2>Pacientes Cadastrados</h2>

        <input type="text" id="pesquisa"
        placeholder="🔎 Pesquisar paciente pelo nome...">

        <div class="contador">
            Total de pacientes: <strong id="total">0</strong>
        </div>

        <div id="listaPacientes"></div>
    </section>

</main>

<footer>
    <p>Sistema de Gerenciamento Médico © 2026</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
