```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoas - IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header>
            <h1>Cadastro de Pessoas</h1>
            <p>Cadastre pessoas e acompanhe o cálculo do IMC.</p>
        </header>

        <section class="card">
            <h2>Cadastrar Pessoa</h2>

            <form id="formPessoa">

                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Digite o nome" required>
                </div>

                <div class="campo">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" placeholder="Digite a idade" required>
                </div>

                <div class="campo">
                    <label for="altura">Altura (m):</label>
                    <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75" required>
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso" step="0.1" placeholder="Ex: 70" required>
                </div>

                <p id="erro" class="erro" hidden></p>

                <div class="botoes">
                    <button type="submit" class="btn-cadastrar">
                        Cadastrar
                    </button>

                    <button type="reset" class="btn-limpar">
                        Limpar
                    </button>
                </div>

            </form>
        </section>

        <section class="card">
            <h2>Pessoas Cadastradas</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaPessoas">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
```
