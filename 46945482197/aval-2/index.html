
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Todos os Garotos que Já Amei</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>♡ Lara Jean's Feed ♡</h1>
        <p>Cartas, romances e histórias inesquecíveis...</p>
    </header>

    <main class="feed">

        <section class="post">
            <div class="perfil">
                <div class="avatar">LJ</div>
                <strong>lara.jean</strong>
            </div>

            <img src="https://image.tmdb.org/t/p/original/hKHZhUbIyUAjcSrqJThFGYIR6kI.jpg" alt="Para Todos os Garotos que Já Amei">

            <div class="acoes">
                <button onclick="curtir(this)">♡</button>
                <button>💬</button>
            </div>

            <p class="curtidas">0 curtidas</p>
            <p><strong>lara.jean</strong> Algumas cartas nunca deveriam ter sido enviadas... 💌</p>
            <small>#ParaTodosOsGarotosQueJáAmei</small>
        </section>

        <section class="post">
            <div class="perfil">
                <div class="avatar">PJ</div>
                <strong>peter.kavinsky</strong>
            </div>

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTHnnMsCC-_r71E3xTyWeG_HJvlaDp79KCOj0aZrYeMsTfmmZPDzGxK0_5_&s=10" alt="Romance de Lara Jean e Peter">

            <div class="acoes">
                <button onclick="curtir(this)">♡</button>
                <button>💬</button>
            </div>

            <p class="curtidas">0 curtidas</p>
            <p><strong>peter.kavinsky</strong> Você é minha pessoa favorita. ❤️</p>
            <small>#LaraJean #PeterKavinsky</small>
        </section>

    </main>

    <script>
        function curtir(botao) {
            const post = botao.closest(".post");
            const contador = post.querySelector(".curtidas");

            let curtidas = Number(contador.dataset.total || 0);

            if (botao.classList.contains("curtido")) {
                curtidas--;
                botao.classList.remove("curtido");
                botao.innerHTML = "♡";
            } else {
                curtidas++;
                botao.classList.add("curtido");
                botao.innerHTML = "♥";
            }

            contador.dataset.total = curtidas;
            contador.innerText = curtidas + " curtidas";
        }
    </script>

</body>
</html>
