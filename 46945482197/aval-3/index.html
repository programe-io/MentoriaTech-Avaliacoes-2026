 
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram | Lara Jean</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fafafa;
    font-family: Arial, sans-serif;
    color: #262626;
}

header {
    height: 62px;
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: space-around;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-family: cursive;
    font-size: 29px;
}

.search {
    background: #efefef;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    width: 220px;
}

.icons {
    display: flex;
    gap: 22px;
    font-size: 23px;
    cursor: pointer;
}

main {
    max-width: 470px;
    margin: 25px auto;
}

.stories {
    display: flex;
    gap: 16px;
    background: white;
    border: 1px solid #ddd;
    padding: 16px 12px;
    overflow-x: auto;
    border-radius: 4px;
}

.story {
    text-align: center;
    min-width: 65px;
    font-size: 11px;
}

.story img {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    object-fit: cover;
    padding: 3px;
    border: 2px solid #e1306c;
}

.post {
    background: white;
    border: 1px solid #ddd;
    margin-top: 22px;
    border-radius: 4px;
    overflow: hidden;
}

.post-header {
    display: flex;
    align-items: center;
    padding: 12px;
    gap: 10px;
}

.post-header img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
}

.username {
    font-weight: bold;
    font-size: 14px;
}

.location {
    font-size: 11px;
    color: #777;
    margin-top: 3px;
}

.post-image {
    width: 100%;
    display: block;
    object-fit: cover;
    max-height: 550px;
}

.actions {
    display: flex;
    gap: 17px;
    padding: 12px;
    font-size: 25px;
}

.actions span {
    cursor: pointer;
}

.actions span:last-child {
    margin-left: auto;
}

.likes {
    padding: 0 13px;
    font-weight: bold;
    font-size: 13px;
}

.caption {
    padding: 9px 13px 15px;
    font-size: 13px;
    line-height: 1.5;
}

.comment-area {
    display: flex;
    border-top: 1px solid #eee;
    padding: 12px;
    gap: 8px;
}

.comment-area input {
    flex: 1;
    border: none;
    outline: none;
}

.comment-area button {
    border: none;
    background: none;
    color: #0095f6;
    font-weight: bold;
    cursor: pointer;
}

.comment-list {
    padding: 0 13px 12px;
    font-size: 13px;
}

.comment-list p {
    margin-top: 6px;
}

.bottom-nav {
    display: none;
}

@media(max-width:600px) {
    header {
        justify-content: space-between;
        padding: 0 15px;
    }

    .search {
        display: none;
    }

    main {
        margin: 0 auto 70px;
        width: 100%;
    }

    .stories {
        border-radius: 0;
    }

    .post {
        border-left: none;
        border-right: none;
        margin-top: 12px;
    }

    .bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        background: white;
        width: 100%;
        justify-content: space-around;
        padding: 13px;
        border-top: 1px solid #ddd;
        font-size: 25px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<header>
    <div class="logo">Instagram</div>
    <input class="search" placeholder="Pesquisar">
    <div class="icons">
        <span>⌂</span>
        <span>♡</span>
        <span>✉</span>
    </div>
</header>

<main>

<section class="stories">

<div class="story">
<img src="https://imgix.bustle.com/uploads/image/2021/1/14/d2f39943-01d7-4bbd-837c-a319562ca160-lara_jean_tatb.jpg">
<p>Seu story</p>
</div>

<div class="story">
<img src="https://imgix.bustle.com/uploads/image/2021/1/14/6231a9ec-f174-4531-bd55-8a57a9c0bd6b-lara_jean_peter.jpeg">
<p>Peter</p>
</div>

<div class="story">
<img src="https://media.allure.com/photos/5b7dca9be8d3c57662280467/master/w_1600%2Cc_limit/To%2520All%2520The%2520Boys%2520I%27ve%2520Loved%2520Before%2520Covey%2520Sisters.jpg">
<p>Margot</p>
</div>

<div class="story">
<img src="https://i.pinimg.com/originals/f5/d5/46/f5d546b45f0adc3ab6f5ecb1c4dfe4b2.jpg">
<p>Kitty</p>
</div>



</section>

<div id="feed"></div>

</main>

<nav class="bottom-nav">
<span>⌂</span>
<span>⌕</span>
<span>＋</span>
<span>♡</span>
<span>◉</span>
</nav>

<script>
const posts = [
{
user: "lara.jean",
location: "Portland, Oregon",
image: "https://imgix.bustle.com/uploads/image/2021/1/14/d2f39943-01d7-4bbd-837c-a319562ca160-lara_jean_tatb.jpg",
likes: 2847,
caption: "Às vezes, escrever é a maneira mais fácil de dizer tudo aquilo que sentimos. 💌"
},
{
user: "lara.jean",
location: "Com Peter Kavinsky 💗",
image: "https://imgix.bustle.com/uploads/image/2021/1/14/6231a9ec-f174-4531-bd55-8a57a9c0bd6b-lara_jean_peter.jpeg",
likes: 5321,
caption: "Algumas histórias parecem ter saído diretamente de um livro. ❤️"
},
{
user: "lara.jean",
location: "Noite das lanternas",
image: "https://capricho.abril.com.br/wp-content/uploads/2020/02/paratodososgarotos2.jpg?quality=50&strip=info&resize=1200,630&crop=1",
likes: 4120,
caption: "Uma noite, milhares de luzes e uma memória que quero guardar para sempre. ✨"
},
{
user: "lara.jean",
location: "Com minhas irmãs",
image: "https://media.allure.com/photos/5b7dca9be8d3c57662280467/master/w_1600%2Cc_limit/To%2520All%2520The%2520Boys%2520I%27ve%2520Loved%2520Before%2520Covey%2520Sisters.jpg",
likes: 3760,
caption: "As Covey. Meu lugar favorito é com elas. 💕"
}
];

const avatar = "https://imgix.bustle.com/uploads/image/2021/1/14/d2f39943-01d7-4bbd-837c-a319562ca160-lara_jean_tatb.jpg";

const feed = document.getElementById("feed");

posts.forEach((post, index) => {
    const element = document.createElement("article");
    element.className = "post";

    element.innerHTML = `
        <div class="post-header">
            <img src="${avatar}">
            <div>
                <div class="username">${post.user}</div>
                <div class="location">${post.location}</div>
            </div>
            <span style="margin-left:auto">•••</span>
        </div>

        <img class="post-image" src="${post.image}">

        <div class="actions">
            <span class="like" data-index="${index}">♡</span>
            <span class="comment-button">♧</span>
            <span>➤</span>
            <span>♧</span>
        </div>

        <div class="likes" id="likes-${index}">
            ${post.likes.toLocaleString("pt-BR")} curtidas
        </div>

        <div class="caption">
            <b>${post.user}</b> ${post.caption}
        </div>

        <div class="comment-list" id="comments-${index}"></div>

        <div class="comment-area">
            <input id="input-${index}" placeholder="Adicione um comentário...">
            <button onclick="comment(${index})">Publicar</button>
        </div>
    `;

    feed.appendChild(element);
});

const liked = {};

document.querySelectorAll(".like").forEach(button => {
    button.addEventListener("click", () => {
        const index = button.dataset.index;
        const likes = document.getElementById(`likes-${index}`);
        
        liked[index] = !liked[index];

        button.innerHTML = liked[index] ? "♥" : "♡";
        button.style.color = liked[index] ? "#ed4956" : "#262626";

        posts[index].likes += liked[index] ? 1 : -1;

        likes.textContent =
            posts[index].likes.toLocaleString("pt-BR") + " curtidas";
    });
});

function comment(index) {
    const input = document.getElementById(`input-${index}`);
    const text = input.value.trim();

    if (!text) return;

    const comment = document.createElement("p");
    const strong = document.createElement("b");
    strong.textContent = "voce:";
    comment.appendChild(strong);
    comment.appendChild(document.createTextNode(" " + text));

    document.getElementById(`comments-${index}`).appendChild(comment);
    input.value = "";
}
</script>

</body>
</html>
