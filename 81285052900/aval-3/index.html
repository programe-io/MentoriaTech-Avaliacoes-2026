<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="game-container">
      <header>
          <h1>⚡ NEON RUN</h1>
              <p>DESAFIE SEUS LIMITES</p>
                </header>

                  <div class="score-board">
                      <div>PONTOS <span id="score">0</span></div>
                          <div>RECORDE <span id="best">0</span></div>
                            </div>

                              <div id="game">
                                  <div class="stars">✦　 ·　 ✧　 ·　 ✦</div>

                                      <div id="player">🏃</div>
                                          <div id="obstacle">🧱</div>

                                              <div id="ground"></div>

                                                  <div id="message">
                                                        <h2>NEON RUN</h2>
                                                              <p>Prepare-se para correr!</p>
                                                                    <button id="startBtn">JOGAR AGORA</button>
                                                                        </div>
                                                                          </div>

                                                                            <button id="jumpBtn">⬆ PULAR</button>

                                                                              <p class="instructions">
                                                                                  Use ESPAÇO, SETA PARA CIMA ou toque na tela para pular.
                                                                                      Desvie dos obstáculos e consiga o maior recorde!
                                                                                        </p>
                                                                                        </div>
  <script src="script.js"></script>
  
</body>
</html>
