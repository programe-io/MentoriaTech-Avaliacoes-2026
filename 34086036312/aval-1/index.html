<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Sistema de Estoque</h1>

        <!-- Cadastro -->
        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <input type="text" id="codigo" placeholder="Código do produto">
            <input type="text" id="descricao" placeholder="Descrição do produto">
            <input type="number" id="quantidade" placeholder="Quantidade" min="0">
            <input type="number" id="valor" placeholder="Valor" min="0" step="0.01">

            <button onclick="cadastrarProduto()">Cadastrar Produto</button>
        </section>

        <!-- Alterações -->
        <section class="formulario">
            <h2>Alterar Produto</h2>

            <input type="text" id="codigoAlterar" placeholder="Código do produto">

            <input type="number" id="novoValor"
                   placeholder="Novo valor"
                   min="0"
                   step="0.01">

            <button onclick="alterarValor()">
                Alterar Valor
            </button>

            <input type="number" id="novaQuantidade"
                   placeholder="Nova quantidade"
                   min="0">

            <button onclick="alterarQuantidade()">
                Alterar Quantidade
            </button>
        </section>

        <!-- Lista de produtos -->
        <section class="lista">
            <h2>Produtos Cadastrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                        <th>Ação</th>
                    </tr>
                </thead>

                <tbody id="tabelaProdutos">
                    <!-- Os produtos serão inseridos pelo JavaScript -->
                </tbody>
            </table>
        </section>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>$0
