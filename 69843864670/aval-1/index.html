<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
    <h1>Calculadora de Média Escolar</h1>
    <p>Digite suas notas:</p>
    <input type="number" id="nota1" placeholder="Nota 1" step="0.1">
    <input type="number" id="nota2" placeholder="Nota 2" step="0.1">
    <input type="number" id="nota3" placeholder="Nota 3" step="0.1">
    <button id="calcular">Calcular Média</button>
    <p id="resultado"></p>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
