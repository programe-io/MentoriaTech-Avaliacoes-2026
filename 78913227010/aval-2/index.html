
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insta Clone</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fafafa;
    font-family: Arial, sans-serif;
    color: #262626;
}

header {
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 15px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.nav {
    max-width: 950px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-family: cursive;
    font-size: 30px;
    font-weight: bold;
}

.search {
    padding: 10px;
    border: none;
    background: #efefef;
    border-radius: 8px;
}

.icons {
    font-size: 23px;
    display: flex;
    gap: 18px;
}

.container {
    max-width: 600px;
    margin: 25px auto;
    padding: 0 10px;
}

.stories {
    background: white;
    padding: 18px 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    display: flex;
    justify-content: space-around;
    overflow-x: auto;
    gap: 15px;
}

.story {
    text-align: center;
    font-size: 12px;
    min-width: 65px;
}

.story img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    padding: 3px;
    border: 3px solid #e1306c;
    object-fit: cover;
}

.post {
    background: white;
    margin-top: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
}

.post-header {
    display: flex;
    align-items: center;
    padding: 12px;
    gap: 10px;
}

.post-header img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
}

.username {
    font-weight: bold;
}

.post-photo {
    width: 100%;
    display: block;
    max-height: 550px;
    object-fit: cover;
}

.actions {
    padding: 12px;
    font-size: 25px;
    display: flex;
    gap: 15px;
}

.actions span {
    cursor: pointer;
}

.like {
    color: #ed4956;
}

.caption {
    padding: 0 12px 12px;
    font-size: 14px;
}

.comments {
    padding: 0 12px 12px;
    color: #888;
    font-size: 13px;
}

.comment-input {
    display: flex;
    border-top: 1px solid #eee;
    padding: 12px;
}

.comment-input input {
    border: none;
    outline: none;
    flex: 1;
}

.comment-input button {
    color: #0095f6;
    background: none;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 30px;
    color: #999;
    font-size: 12px;
}

@media(max-width: 500px) {
    .search {
        display: none;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <div class="nav">
        <div class="logo">Instagram</div>
        <input class="search" placeholder="Pesquisar">
        <div class="icons">
            <span>⌂</span>
            <span>✉</span>
            <span>♡</span>
            <span>＋</span>
        </div>
    </div>
</header>

<div class="container">

    <div class="stories">
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=47">
            <p>Seu story</p>
        </div>
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=45">
            <p>clara</p>
        </div>
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=32">
            <p>isadora</p>
        </div>
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=12">
            <p>marlos</p>
        </div>
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=15">
            <p>fielpzs</p>
        </div>
    </div>

    <div id="feed"></div>

</div>

<footer>
    Insta Clone © 2026
</footer>

<script>

const posts = [
    {
        user: "clara",
        avatar: "https://i.pravatar.cc/100?img=45",
        photo: "https://picsum.photos/id/1011/600/600",
        caption: "Vivendo momentos incríveis! ✨❤️",
        likes: 128
    },
    {
        user: "isadora",
        avatar: "https://i.pravatar.cc/100?img=32",
        photo: "https://picsum.photos/id/1027/600/600",
        caption: "A vida fica mais bonita assim 🌸",
        likes: 245
    },
    {
        user: "marlos",
        avatar: "https://i.pravatar.cc/100?img=12",
        photo: "https://picsum.photos/id/1005/600/600",
        caption: "Só agradece! 🙏🔥",
        likes: 89
    },
    {
        user: "fielpzs",
        avatar: "https://i.pravatar.cc/100?img=15",
        photo: "https://picsum.photos/id/1012/600/600",
        caption: "Mais um dia para fazer história! 🚀",
        likes: 356
    }
];

const feed = document.getElementById("feed");

posts.forEach((post, index) => {

    const article = document.createElement("div");
    article.className = "post";

    article.innerHTML = `
        <div class="post-header">
            <img src="${post.avatar}">
            <span class="username">${post.user}</span>
        </div>

        <img class="post-photo" src="${post.photo}">

        <div class="actions">
            <span class="heart" onclick="likePost(${index}, this)">♡</span>
            <span onclick="focusComment(${index})">💬</span>
            <span>➤</span>
        </div>

        <div class="caption">
            <b><span id="likes-${index}">${post.likes}</span> curtidas</b>
            <p><b>${post.user}</b> ${post.caption}</p>
        </div>

        <div class="comments" id="comments-${index}">
            Ver todos os comentários
        </div>

        <div class="comment-input">
            <input id="input-${index}"
            placeholder="Adicione um comentário...">
            <button onclick="addComment(${index})">
                Publicar
            </button>
        </div>
    `;

    feed.appendChild(article);
});

function likePost(index, element) {
    const likes = document.getElementById(`likes-${index}`);

    if(element.classList.contains("like")) {
        element.classList.remove("like");
        element.innerText = "♡";
        likes.innerText = Number(likes.innerText) - 1;
    } else {
        element.classList.add("like");
        element.innerText = "♥";
        likes.innerText = Number(likes.innerText) + 1;
    }
}

function focusComment(index) {
    document.getElementById(`input-${index}`).focus();
}

function addComment(index) {
    const input = document.getElementById(`input-${index}`);
    const comments = document.getElementById(`comments-${index}`);

    if(input.value.trim() === "") return;

    const comment = document.createElement("p");
    comment.innerText = "Você: " + input.value;

    comments.appendChild(comment);
    input.value = "";
}

</script>

<script src="script.js"></script></body>
</html>
