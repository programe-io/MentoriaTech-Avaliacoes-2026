
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Clone</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topbar">
    <div class="logo">facebook</div>
    <input type="text" placeholder="Pesquisar no Facebook">
    <nav>
        <span>🏠</span>
        <span>👥</span>
        <span>🎮</span>
        <span>🔔</span>
        <span>👤</span>
    </nav>
</header>

<div class="layout">

    <aside class="sidebar">
        <h3>Menu</h3>
        <p>👤 Seu perfil</p>
        <p>👥 Amigos</p>
        <p>🕒 Memórias</p>
        <p>💾 Salvos</p>
        <p>👥 Grupos</p>
        <p>📺 Vídeos</p>
        <p>🛒 Marketplace</p>
        <p>🎮 Jogos</p>
    </aside>

    <main>

        <section class="stories">
            <div class="story create">
                <span>＋</span>
                <p>Criar story</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/200?img=45">
                <p>Clara</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/200?img=32">
                <p>Isadora</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/200?img=12">
                <p>Marlos</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/200?img=15">
                <p>fielpzs</p>
            </div>
        </section>

        <section class="create-post">
            <div class="post-input">
                <img src="https://i.pravatar.cc/100?img=47">
                <input id="newPost" placeholder="No que você está pensando?">
            </div>
            <div class="post-options">
                <button>📹 Vídeo ao vivo</button>
                <button>🖼️ Foto/vídeo</button>
                <button>😊 Sentimento</button>
            </div>
            <button class="publish" onclick="createPost()">Publicar</button>
        </section>

        <section id="feed"></section>

    </main>

    <aside class="rightbar">
        <h3>Contatos</h3>
        <p>🟢 Clara</p>
        <p>🟢 Isadora</p>
        <p>🟢 Marlos</p>
        <p>🟢 fielpzs</p>
    </aside>

</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
