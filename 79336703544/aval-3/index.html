<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <aside class="sidebar">
    <h1>Instagram</h1>
    <nav>
      <a><i class='bx bx-home-alt'></i> Início</a>
      <a><i class='bx bx-search'></i> Pesquisa</a>
      <a><i class='bx bx-compass'></i> Explorar</a>
      <a><i class='bx bx-movie-play'></i> Reels</a>
      <a><i class='bx bx-message-rounded'></i> Mensagens</a>
      <a><i class='bx bx-heart'></i> Notificações</a>
      <a id="createBtn"><i class='bx bx-plus-square'></i> Criar</a>
      <a><i class='bx bx-user-circle'></i> Perfil</a>
    </nav>
  </aside>

  <main class="container">
    <section class="feed">

      <div class="stories">
        <img src="https://i.pravatar.cc/150?img=12">
        <img src="https://i.pravatar.cc/150?img=11">
        <img src="https://i.pravatar.cc/150?img=13">
      </div>

      <div id="posts">
        <article class="post">
          <div class="post-header">
            <img src="https://i.pravatar.cc/150?img=11">
            <strong>mariana.silva</strong>
          </div>

          <img class="post-image" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900">

          <div class="post-actions">
            <i class='bx bx-heart'></i>
            <i class='bx bx-message-rounded'></i>
            <i class='bx bx-send'></i>
          </div>

          <strong>1.245 curtidas</strong>
          <p>Mariana: Aproveitando cada momento!</p>
        </article>
      </div>

    </section>

    <aside class="suggestions">
      <strong>seu_usuario</strong>
      <p>Sugestões para você</p>
      <p>ana.lima - Seguir</p>
      <p>carlos.dev - Seguir</p>
    </aside>
  </main>

  <div class="modal" id="modal">
    <input id="imageUrl" placeholder="URL da imagem">
    <textarea id="caption" placeholder="Legenda"></textarea>
    <button id="publishBtn">Publicar</button>
    <button id="closeModal">Fechar</button>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
