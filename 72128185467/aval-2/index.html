!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="style.css" rel="stylesheet"></head>
<body>


    <h1>Gerenciador de Tarefas</h1>


    <section>
        <h2>Cadastrar tarefa</h2>


        <input type="text" id="titulo" placeholder="Título da tarefa">


        <select id="prioridade">
            <option value="1">Prioridade 1</option>
            <option value="2">Prioridade 2</option>
            <option value="3">Prioridade 3</option>
        </select>


        <button id="cadastrar">Cadastrar</button>
    </section>


    <section>
        <h2>Gerenciar tarefas</h2>


        <input type="number" id="codigo" placeholder="Código da tarefa">


        <button id="concluir">Concluir tarefa</button>


        <select id="novaPrioridade">
            <option value="1">Prioridade 1</option>
            <option value="2">Prioridade 2</option>
            <option value="3">Prioridade 3</option>
        </select>


        <button id="alterar">Alterar prioridade</button>
    </section>


    <section>
        <h2>Lista de tarefas</h2>


        <div id="listaTarefas"></div>
    </section>


<script src="script.js"></script></body>
</html>
