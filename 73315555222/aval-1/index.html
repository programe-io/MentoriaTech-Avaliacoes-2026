<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Estoque</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h1>📦 Sistema de Estoque</h1>
    <p>Cadastre, liste e altere seus produtos</p>
  </header>

  <main>
    <!-- FORMULÁRIO DE CADASTRO -->
    <section class="card">
      <h2>Cadastrar Produto</h2>
      <form id="form-produto">
        <div class="grid">
          <input type="text" id="codigo" placeholder="Código (ex: 001)" required />
          <input type="text" id="descricao" placeholder="Descrição do produto" required />
          <input type="number" id="quantidade" placeholder="Quantidade" min="0" required />
          <input type="number" id="valor" placeholder="Valor (R$)" min="0" step="0.01" required />
        </div>
        <button type="submit" class="btn-cadastrar">➕ Cadastrar</button>
      </form>
      <p id="mensagem" class="mensagem"></p>
    </section>

    <!-- LISTA DE PRODUTOS -->
    <section class="card">
      <h2>Produtos Cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Qtd</th>
            <th>Valor</th>
            <th>Subtotal</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>

      <div class="resumo">
        <span>Total de produtos: <strong id="total-itens">0</strong></span>
        <span>Valor em estoque: <strong id="valor-total">R$ 0,00</strong></span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
