<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h1>📋 Sistema de Tarefas</h1>
    <p>Cadastre, liste, conclua e altere prioridades</p>
  </header>

  <main>
    <!-- FORMULÁRIO DE CADASTRO -->
    <section class="card">
      <h2>Cadastrar Tarefa</h2>
      <form id="form-tarefa" novalidate>
        <div class="grid">
          <input type="text" id="codigo" placeholder="Código (ex: T001)" required />
          <input
            type="text"
            id="titulo"
            placeholder="Título (mínimo 5 caracteres)"
            required
          />
          <select id="prioridade" required>
            <option value="">Prioridade...</option>
            <option value="1">1 - Alta</option>
            <option value="2">2 - Média</option>
            <option value="3">3 - Baixa</option>
          </select>
        </div>
        <button type="submit" class="btn-cadastrar">➕ Cadastrar Tarefa</button>
      </form>
      <p id="mensagem" class="mensagem"></p>
    </section>

    <!-- LISTA DE TAREFAS -->
    <section class="card">
      <h2>Tarefas Cadastradas</h2>

      <div class="filtros">
        <label>Filtrar:
          <select id="filtro">
            <option value="todas">Todas</option>
            <option value="pendentes">Pendentes</option>
            <option value="concluidas">Concluídas</option>
          </select>
        </label>
      </div>

      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Título</th>
            <th>Prioridade</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>

      <div class="resumo">
        <span>Total: <strong id="total-tarefas">0</strong></span>
        <span>Pendentes: <strong id="total-pendentes">0</strong></span>
        <span>Concluídas: <strong id="total-concluidas">0</strong></span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
