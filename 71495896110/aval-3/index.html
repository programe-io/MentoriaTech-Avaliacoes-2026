
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <header>
            <h1>Controle de IMC</h1>
            <p>Cadastro e acompanhamento de pacientes</p>
        </header>

        <section class="card">
            <h2>Cadastrar paciente</h2>

            <form id="formPessoa">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome"
                        placeholder="Nome do paciente" required>
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>
                    <input type="number" id="idade"
                        placeholder="Idade" min="1" required>
                </div>

                <div class="campo">
                    <label for="altura">Altura (metros)</label>
                    <input type="number" id="altura"
                        placeholder="Ex: 1.75"
                        step="0.01" min="0.1" required>
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso"
                        placeholder="Ex: 75"
                        step="0.1" min="1" required>
                </div>

                <button type="submit">Salvar paciente</button>

                <p id="mensagemErro"></p>
            </form>
        </section>

        <section class="card">
            <h2>Pacientes cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaPessoas"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
