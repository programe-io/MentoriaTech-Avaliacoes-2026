<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed Social</title>
  <link rel="stylesheet" href="style.css" />
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topbar">
    <h1>Feed Social</h1>
  </header>

  <main class="feed">
    <article class="post">
      <div class="post-header">
        <div class="avatar">A</div>
        <div>
          <h2>Ana Silva</h2>
          <span>Há 15 min</span>
        </div>
      </div>
      <p class="post-text">
        Testando um layout de feed social limpo feito apenas com HTML e CSS.
      </p>
      <div class="post-actions">
        <button type="button">Curtir</button>
        <button type="button">Comentar</button>
        <button type="button">Compartilhar</button>
      </div>
    </article>

    <article class="post">
      <div class="post-header">
        <div class="avatar">R</div>
        <div>
          <h2>Rafael Costa</h2>
          <span>Há 1 hora</span>
        </div>
      </div>
      <p class="post-text">
        CSS Flexbox deixa o alinhamento dos cartões e botões bem simples e responsivo.
      </p>
      <div class="post-actions">
        <button type="button">Curtir</button>
        <button type="button">Comentar</button>
        <button type="button">Compartilhar</button>
      </div>
    </article>
  </main>
</body>
</html>
