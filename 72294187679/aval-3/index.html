<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Clone</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <h1 class="logo">Instagram</h1>
      <input type="search" class="busca" placeholder="Pesquisar" aria-label="Pesquisar" />
      <nav class="acoes-topo" aria-label="Ações">
        <span>Início</span>
        <span>Mensagens</span>
        <span>Explorar</span>
        <span>Perfil</span>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="feed" aria-label="Feed de postagens">
      <div class="stories" aria-label="Stories">
        <div class="story">
          <div class="anel"><img src="https://picsum.photos" alt="Ana" /></div>
          <span>ana.silva</span>
        </div>
        <div class="story">
          <div class="anel"><img src="https://picsum.photos" alt="Lucas" /></div>
          <span>lucas_dev</span>
        </div>
        <div class="story">
          <div class="anel"><img src="https://picsum.photos" alt="Thor" /></div>
          <span>thor.dog</span>
        </div>
        <div class="story">
          <div class="anel"><img src="https://picsum.photos" alt="Marina" /></div>
          <span>marina.foto</span>
        </div>
      </div>

      <article class="post">
        <div class="post-cabecalho">
          <img src="https://picsum.photos" alt="Foto de ana.silva" />
          <strong>ana.silva</strong>
        </div>

        <img class="post-imagem" src="https://picsum.photos" alt="Paisagem com rio e montanhas" />

        <div class="post-rodape">
          <div class="botoes">
            <button type="button">Curtir</button>
            <button type="button">Comentar</button>
            <button type="button">Salvar</button>
          </div>
          <p class="curtidas"><strong>1.248 curtidas</strong></p>
          <p class="legenda"><strong>ana.silva</strong> Fim de tarde perfeito na natureza.</p>
        </div>
      </article>
    </section>

    <aside class="barra-lateral" aria-label="Sugestões">
      <div class="perfil-resumo">
        <img src="https://picsum.photos" alt="Seu perfil" />
        <div>
          <strong>seu.usuario</strong>
          <span>Seu Nome</span>
        </div>
      </div>
      <p class="sugestoes-titulo">Sugestões para você</p>
      <div class="sugestao">
        <span>rafa.design</span>
        <a href="#">Seguir</a>
      </div>
      <div class="sugestao">
        <span>bia.tech</span>
        <a href="#">Seguir</a>
      </div>
    </aside>
  </main>
</body>
</html>
