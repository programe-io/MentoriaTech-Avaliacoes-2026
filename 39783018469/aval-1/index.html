<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Produtos</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>📦 Gerenciador de Produtos</h1>

        <!-- Mensagens de Erro/Sucesso -->
        <div id="mensagem" class="mensagem hidden"></div>

        <div class="grid-layout">
            <!-- Formulário de Cadastro -->
            <section class="card">
                <h2>Cadastrar Produto</h2>
                <form id="form-cadastrar">
                    <div class="form-group">
                        <label for="cad-descricao">Descrição:</label>
                        <input type="text" id="cad-descricao" placeholder="Ex: Cadeira Gamer" required>
                    </div>
                    <div class="form-group">
                        <label for="cad-quantidade">Quantidade:</label>
                        <input type="number" id="cad-quantidade" placeholder="Ex: 10" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="cad-valor">Valor (R$):</label>
                        <input type="number" id="cad-valor" step="0.01" placeholder="Ex: 699.00" min="0" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </form>
            </section>

            <!-- Formulários de Atualização -->
            <section class="card">
                <h2>Atualizar Produto</h2>
                
                <!-- Atualizar Valor -->
                <form id="form-atualizar-valor" class="sub-form">
                    <h3>Alterar Valor</h3>
                    <div class="form-inline">
                        <input type="number" id="alt-val-codigo" placeholder="Cód." required>
                        <input type="number" id="alt-val-novo" step="0.01" placeholder="Novo Valor (R$)" min="0" required>
                        <button type="submit" class="btn btn-secondary">Salvar</button>
                    </div>
                </form>

                <hr>

                <!-- Atualizar Quantidade -->
                <form id="form-atualizar-qtd" class="sub-form">
                    <h3>Alterar Quantidade</h3>
                    <div class="form-inline">
                        <input type="number" id="alt-qtd-codigo" placeholder="Cód." required>
                        <input type="number" id="alt-qtd-nova" placeholder="Nova Qtd." min="1" required>
                        <button type="submit" class="btn btn-secondary">Salvar</button>
                    </div>
                </form>
            </section>
        </div>

        <!-- Tabela de Produtos -->
        <section class="card mt-20">
            <h2>Lista de Produtos</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor Unitário</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos">
                        <tr>
                            <td colspan="5" class="text-center">Nenhum produto cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
