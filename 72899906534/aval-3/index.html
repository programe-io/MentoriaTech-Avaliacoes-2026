<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Damas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>♟ JOGO DE DAMAS</h1>
    <p class="subtitle">Desafie alguém em uma partida!</p>

    <div class="info">
      <div id="turn">Vez das peças vermelhas</div>
      <div id="message">Escolha uma peça para começar.</div>
    </div>

    <div id="board" class="board"></div>

    <div class="buttons">
      <button id="restart">Nova partida</button>
    </div>

    <p class="rules">
      Clique em uma peça e depois na casa para onde deseja movê-la.
      As capturas são obrigatórias. Ao chegar ao outro lado, a peça vira dama.
    </p>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
