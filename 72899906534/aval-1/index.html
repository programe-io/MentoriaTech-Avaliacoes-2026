
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMix | Loja Virtual</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <div class="logo">ShopMix.</div>

    <input
        type="text"
        id="search"
        placeholder="Pesquisar produtos..."
    >

    <button class="cart-button" onclick="toggleCart()">
        🛒 Carrinho (<span id="count">0</span>)
    </button>
</header>

<section class="banner">
    <h1>Bem-vindo à ShopMix!</h1>
    <p>Estilo, qualidade e variedade em um só lugar.</p>

    <button onclick="document.getElementById('loja').scrollIntoView({behavior:'smooth'})">
        Comprar agora
    </button>
</section>

<section class="container" id="loja">
    <h2>Nossos produtos</h2>

    <div class="categories">
        <button onclick="filterProducts('Todos')">Todos</button>
        <button onclick="filterProducts('Eletrônicos')">Eletrônicos</button>
        <button onclick="filterProducts('Moda')">Moda</button>
        <button onclick="filterProducts('Acessórios')">Acessórios</button>
    </div>

    <div class="products" id="products"></div>
</section>

<section class="cart" id="cart">
    <h2>🛒 Meu carrinho</h2>

    <div id="cart-items"></div>

    <div class="total">
        Total: R$ <span id="total">0,00</span>
    </div>

    <button class="finish" onclick="checkout()">
        Finalizar pedido pelo WhatsApp
    </button>
</section>

<footer>
    <h2>ShopMix.</h2>
    <p>Sua loja favorita está aqui!</p>
    <p>© 2026 ShopMix - Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
