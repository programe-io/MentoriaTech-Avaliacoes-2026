
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Controle de IMC</h1>

        <form id="formIMC">

            <label>Nome do paciente:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label>Peso (kg):</label>
            <input type="number" id="peso" placeholder="Ex: 70" step="0.1" min="0.1" required>

            <label>Altura (metros):</label>
            <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01" min="0.1" required>

            <button type="submit">Calcular IMC</button>

        </form>

        <div class="resultado" id="resultado">

            <h2>Resultado do paciente</h2>

            <p><strong>Nome:</strong> <span id="rNome"></span></p>

            <p><strong>Peso:</strong> <span id="rPeso"></span> kg</p>

            <p><strong>Altura:</strong> <span id="rAltura"></span> m</p>

            <p><strong>IMC:</strong> <span id="rIMC"></span></p>

            <p><strong>Classificação:</strong>
                <span id="classificacao"></span>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
