
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <h1>📦 Cadastro de Produtos</h1>
            <p>Gerencie seus produtos facilmente</p>
        </header>

        <main>

            <section class="card">

                <h2>➕ Cadastrar Produto</h2>

                <div class="campo">
                    <label for="descricao">Descrição do produto</label>
                    <input type="text" id="descricao" placeholder="Ex: Camiseta">
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" placeholder="Ex: 10">
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input type="number" id="valor" placeholder="Ex: 49.90" step="0.01">
                </div>

                <button class="btn btn-primary" onclick="cadastrar()">
                    Cadastrar Produto
                </button>

                <button class="btn btn-secondary" onclick="listar()">
                    📋 Listar Produtos
                </button>

            </section>


            <section class="card">

                <h2>💰 Atualizar Valor</h2>

                <div class="campo">
                    <label for="codigo">Código do produto</label>
                    <input type="number" id="codigo" placeholder="Código">
                </div>

                <div class="campo">
                    <label for="novoValor">Novo valor</label>
                    <input type="number" id="novoValor" placeholder="Novo valor" step="0.01">
                </div>

                <button class="btn btn-success" onclick="atualizarValorProduto()">
                    Atualizar Valor
                </button>

            </section>


            <section class="card">

                <h2>📦 Atualizar Quantidade</h2>

                <div class="campo">
                    <label for="codigoQuantidade">Código do produto</label>
                    <input type="number" id="codigoQuantidade" placeholder="Código">
                </div>

                <div class="campo">
                    <label for="novaQuantidade">Nova quantidade</label>
                    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">
                </div>

                <button class="btn btn-warning" onclick="atualizarQuantidadeProduto()">
                    Atualizar Quantidade
                </button>

            </section>


            <section class="card">

                <h2>📋 Lista de Produtos</h2>

                <div id="resultado">
                    <p class="mensagem">
                        Clique em "Listar Produtos" para visualizar.
                    </p>
                </div>

            </section>

        </main>

        <footer>
            <p>© 2026 - Sistema de Produtos</p>
        </footer>

    </div>


    <script src="script.js"></script>

    <script>

        function cadastrar() {

            let descricao = document.getElementById("descricao").value;

            let quantidade = Number(
                document.getElementById("quantidade").value
            );

            let valor = Number(
                document.getElementById("valor").value
            );

            cadastrarProduto(descricao, quantidade, valor);

        }


        function listar() {

            listarProdutos();

        }


        function atualizarValorProduto() {

            let codigo = Number(
                document.getElementById("codigo").value
            );

            let novoValor = Number(
                document.getElementById("novoValor").value
            );

            atualizarValor(codigo, novoValor);

        }


        function atualizarQuantidadeProduto() {

            let codigo = Number(
                document.getElementById("codigoQuantidade").value
            );

            let novaQuantidade = Number(
                document.getElementById("novaQuantidade").value
            );

            atualizarQuantidade(codigo, novaQuantidade);

        }

    </script>

<script src="script.js"></script></body>
</html>
