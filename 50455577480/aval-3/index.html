<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  div class="app-container">
  <!-- Cabeçalho -->
  <header class="navbar">
    <h1 class="logo">InstaClone</h1>
    <div class="nav-icons">
      <span>❤️</span>
      <span>✉️</span>
    </div>
  </header>

  <!-- Barra de Stories -->
  <section class="stories">
    <div class="story">
      <div class="avatar">👩‍💻</div>
      <span>ana.dev</span>
    </div>
    <div class="story">
      <div class="avatar">🚀</div>
      <span>tech_br</span>
    </div>
    <div class="story">
      <div class="avatar">🎨</div>
      <span>design.ui</span>
    </div>
    <div class="story">
      <div class="avatar">📸</div>
      <span>fotos.dia</span>
    </div>
  </section>

  <!-- Feed de Postagens -->
  <main class="feed">
    <article class="post">
      <div class="post-header">
        <div class="post-avatar">👩‍💻</div>
        <strong>ana.dev</strong>
      </div>

      <img src="https://unsplash.com" alt="Notebook com código" class="post-image">

      <div class="post-actions">
        <button id="like-btn" class="action-btn">🤍</button>
        <button class="action-btn">💬</button>
        <button class="action-btn">🚀</button>
      </div>

      <div class="post-info">
        <p><strong id="like-count">124</strong> curtidas</p>
        <p><strong>ana.dev</strong> Finalizando meu projeto de HTML, CSS e JavaScript! 💻✨</p>
        
        <div id="comments-list" class="comments-list"></div>

        <form id="comment-form" class="comment-form">
          <input type="text" id="comment-input" placeholder="Adicione um comentário..." required>
          <button type="submit">Publicar</button>
        </form>
      </div>
    </article>
  </main>
</div>$0
  <script src="script.js"></script>
  
</body>
</html>
