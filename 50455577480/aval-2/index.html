<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página Interativa</title>
    <style>
        /* Estilos para deixar a página bonita */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        \}
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
        \}
        h1 {
            color: #007bff;
            margin-bottom: 10px;
        \}
        p {
            color: #666;
            line-height: 1.6;
        \}
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        \}
        button:hover {
            background-color: #0056b3;
        \}
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Estrutura da Página -->
    <div class="card">
        <h1>Bem-vindo!</h1>
        <p>Este é um exemplo de código que junta HTML para estrutura, CSS para o design e JavaScript para a ação.</p>
        <button id="meuBotao">Clique Aqui</button>
    </div>

    <!-- Script para dar interatividade -->
    <script>
        const botao = document.getElementById('meuBotao');
        botao.addEventListener('click', () => {
            alert('Você interagiu com a página com sucesso!');
        \});
    </script>

</body>
</html>$0
