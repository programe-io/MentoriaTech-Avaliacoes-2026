
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topo">
        <div class="marca">
            <div class="icone">✓</div>
            <div>
                <h1>Estoque de Tarefas</h1>
                <p>Organize suas atividades e acompanhe seu progresso.</p>
            </div>
        </div>
    </header>

    <main class="container">

        <section class="resumo">
            <div class="card">
                <span>Total de tarefas</span>
                <h2 id="totalTarefas">0</h2>
            </div>

            <div class="card">
                <span>Pendentes</span>
                <h2 id="tarefasPendentes">0</h2>
            </div>

            <div class="card">
                <span>Concluídas</span>
                <h2 id="tarefasConcluidas">0</h2>
            </div>
        </section>

        <section class="painel">
            <h2>+ Cadastrar nova tarefa</h2>

            <form id="formTarefa">
                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex.: Cadastrar Clientes"
                        minlength="5"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" required>
                        <option value="1">1 - Baixa</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Alta</option>
                    </select>
                </div>

                <button type="submit" class="btn-principal">
                    Cadastrar tarefa
                </button>
            </form>
        </section>

        <section class="painel">
            <div class="cabecalho-lista">
                <h2>Minhas tarefas</h2>

                <select id="filtro">
                    <option value="todas">Todas as tarefas</option>
                    <option value="pendentes">Pendentes</option>
                    <option value="concluidas">Concluídas</option>
                </select>
            </div>

            <div id="listaTarefas" class="lista-tarefas">
                <p class="vazio">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>

    </main>

    <div id="mensagem" class="mensagem" role="status"
         aria-live="polite"></div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
