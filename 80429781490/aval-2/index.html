<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>

            <nav>
                <a href="#inicio">Início</a>
            </nav>
        </div>
    </header>

    <main id="inicio">

        <section class="new-post">
            <h2>Nova publicação</h2>

            <div class="user">
                <div class="avatar">W</div>
                <strong>Wanderson</strong>
            </div>

            <p>O que você está pensando?</p>

            <textarea placeholder="Digite sua publicação"></textarea>

            <button type="button">Publicar</button>
        </section>

        <section class="feed">
            <article class="post">

                <header class="post-header">
                    <strong>Maria</strong>
                    <span>Há 10 minutos</span>
                </header>

                <div class="post-text">
                    Hoje eu vi o novo filme do Homem-Aranha.
                    Top, tô feliz! :D
                </div>

                <img
                    src="imagens-de-itachi-7paafsfwzyyntokr.jpg"
                    alt="Imagem do Itachi"
                    class="post-image"
                >

                <footer class="post-actions">
                    <button type="button">Curtir</button>
                    <button type="button">Comentar</button>
                </footer>

            </article>
        </section>

    </main>

    <footer class="site-footer">
        <p>Mini Feed - Todos os direitos reservados - 2026</p>
    </footer>

</body>
</html>
