
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chute ao Gol</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <h1>⚽ CHUTE AO GOL</h1>
        <p class="subtitulo">Mostre que você é craque!</p>

        <div class="placar">
            <div>GOLS <strong id="gols">0</strong></div>
            <div>DEFESAS <strong id="defesas">0</strong></div>
            <div>CHUTES <strong id="chutes">10</strong></div>
        </div>

        <div class="campo">
            <canvas id="campo" width="600" height="420"></canvas>

            <div id="mensagem" class="mensagem">
                Prepare-se para chutar!
            </div>
        </div>

        <div class="controles">
            <label for="mira">🎯 Direção do chute</label>
            <input type="range" id="mira" min="0" max="100" value="50">

            <div class="legenda">
                <span>Esquerda</span>
                <span>Direita</span>
            </div>

            <label for="forca">💥 Força do chute</label>
            <input type="range" id="forca" min="1" max="10" value="5">

            <div class="legenda">
                <span>Fraco</span>
                <span>Forte</span>
            </div>

            <button id="chutar" onclick="chutar()">CHUTAR! ⚽</button>

            <button id="reiniciar" onclick="reiniciar()" hidden>
                JOGAR NOVAMENTE
            </button>
        </div>

        <p class="instrucao">
            Escolha a direção, ajuste a força e tente marcar!
        </p>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
