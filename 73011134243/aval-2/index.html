
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>🐍 Jogo da Cobrinha</h1>

        <div class="pontuacao">
            <span>Pontuação: <strong id="pontos">0</strong></span>
            <span>Recorde: <strong id="recorde">0</strong></span>
        </div>

        <div class="area-jogo">
            <canvas id="jogo" width="400" height="400"></canvas>

            <div id="gameOver" class="game-over">
                <h2>Game Over!</h2>
                <p>Fim de jogo!</p>
                <button onclick="reiniciarJogo()">Jogar novamente</button>
            </div>
        </div>

        <p class="instrucoes">
            Use as setas do teclado para movimentar a cobrinha.
        </p>

        <button class="reiniciar" onclick="reiniciarJogo()">
            Reiniciar jogo
        </button>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
