<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniFeed</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="header-content">

            <h1>MiniFeed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>

        </div>
    </header>

    <main>

        <!-- Criar publicação -->
        <section class="new-post">

            <div class="user">

                <div class="avatar">J</div>

                <div>
                    <strong>Jonathan</strong>
                    <span>O que você está pensando?</span>
                </div>

            </div>

            <textarea placeholder="Escreva uma publicação..."></textarea>

            <button>Publicar</button>

        </section>


        <!-- Publicação da Maria -->
        <article class="post">

            <div class="post-header">

                <div class="avatar">M</div>

                <div>
                    <strong>Maria</strong>
                    <span>Há 10 minutos</span>
                </div>

            </div>

            <div class="post-text">

                Hoje eu vi o filme do Homem de ferro
                e estou muito feliz! ❤️

            </div>

            <img
                class="post-image"
                src="https://images.unsplash.com/photo-1635863138275-d9b33299680b?w=900"
                alt="Imagem de personagem de histórias em quadrinhos">

            <div class="post-actions">

                <button>❤️ Curtir</button>
                <button>💬 Comentar</button>
                <button>↗ Compartilhar</button>

            </div>

        </article>

    </main>
