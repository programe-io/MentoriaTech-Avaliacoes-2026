<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <h1>Cadastro de Produtos</h1>
            <p>Controle de estoque e valores dos produtos</p>
        </header>

        <section class="card">

            <h2>Cadastrar Produto</h2>

            <form>

                <div class="campo">
                    <label for="descricao">Descrição do produto</label>

                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: PlayStation 5"
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>

                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        placeholder="Ex: 48"
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>

                    <input
                        type="number"
                        id="valor"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 4199.00"
                    >
                </div>

                <button type="submit">
                    Cadastrar Produto
                </button>

            </form>

        </section>

        <section class="card">

            <h2>Atualizar Valor</h2>

            <form>

                <div class="campo">
                    <label for="codigo">Código do produto</label>

                    <input
                        type="number"
                        id="codigo"
                        min="1"
                        placeholder="Ex: 2"
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">Novo valor</label>

                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 1699.99"
                    >
                </div>

                <button type="submit">
                    Atualizar Valor
                </button>

            </form>

        </section>

        <section class="card">

            <h2>Produtos Cadastrados</h2>

            <div class="tabela">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>1</td>
                            <td>PlayStation 5</td>
                            <td>48</td>
                            <td>R$ 4.199,00</td>
                        </tr>

                        <tr>
                            <td>2</td>
                            <td>PlayStation 4</td>
                            <td>17</td>
                            <td>R$ 1.699,99</td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </div>

<script src="script.js"></script></body>

</html>
