
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            margin: auto;
        }

        input, button {
            padding: 10px;
            margin: 6px;
            width: 85%;
        }

        button {
            background: #287a45;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #lista {
            text-align: left;
            margin-top: 20px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">
    <h1>Sistema de Estoque</h1>

    <h3>Cadastrar produto</h3>

    <input type="number" id="codigo" placeholder="Código">
    <input type="text" id="descricao" placeholder="Descrição">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor">

    <button onclick="cadastrar()">Cadastrar produto</button>

    <h3>Alterar produto</h3>

    <input type="number" id="codigoAlterar" placeholder="Código do produto">
    <input type="number" id="novoValor" placeholder="Novo valor">
    <button onclick="alterarValor()">Alterar valor</button>

    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">
    <button onclick="alterarQuantidade()">Alterar quantidade</button>

    <h3>Produtos cadastrados</h3>

    <button onclick="listar()">Listar produtos</button>

    <div id="lista"></div>
</div>

<script>
    let produtos = [];

    function cadastrar() {
        let codigo = Number(document.getElementById("codigo").value);
        let descricao = document.getElementById("descricao").value;
        let quantidade = Number(document.getElementById("quantidade").value);
        let valor = Number(document.getElementById("valor").value);

        if (!codigo || !descricao || quantidade < 0 || !valor) {
            alert("Preencha os campos corretamente!");
            return;
        }

        produtos.push({codigo, descricao, quantidade, valor});

        alert("Produto cadastrado com sucesso!");
        
        listar();
    }

    function listar() {
        let lista = document.getElementById("lista");
        lista.innerHTML = "";

        produtos.forEach(produto => {
            lista.innerHTML += `
                <p>
                Código: ${produto.codigo}<br>
                Descrição: ${produto.descricao}<br>
                Quantidade: ${produto.quantidade}<br>
                Valor: R$ ${produto.valor.toFixed(2)}
                </p><hr>
            `;
        });
    }

    function alterarValor() {
        let codigo = Number(document.getElementById("codigoAlterar").value);
        let produto = produtos.find(p => p.codigo === codigo);

        if (produto) {
            produto.valor = Number(document.getElementById("novoValor").value);
            alert("Valor alterado com sucesso!");
            listar();
        } else {
            alert("Produto não encontrado!");
        }
    }

    function alterarQuantidade() {
        let codigo = Number(document.getElementById("codigoAlterar").value);
        let produto = produtos.find(p => p.codigo === codigo);

        if (produto) {
            produto.quantidade = Number(document.getElementById("novaQuantidade").value);
            alert("Quantidade alterada com sucesso!");
            listar();
        } else {
            alert("Produto não encontrado!");
        }
    }
</script>

</body>
</html>
