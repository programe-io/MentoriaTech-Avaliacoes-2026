
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <header class="cabecalho">
            <h1>Minhas Tarefas</h1>
            <p>Organize suas atividades e acompanhe seu progresso.</p>
        </header>

        <section class="card">
            <h2>Cadastrar nova tarefa</h2>

            <form id="formTarefa">
                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex.: Cadastrar clientes"
                        minlength="5"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" required>
                        <option value="1">1 - Baixa</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Alta</option>
                    </select>
                </div>

                <button type="submit" class="btn-principal">
                    Cadastrar tarefa
                </button>
            </form>

            <p id="mensagem" role="status"></p>
        </section>

        <section class="lista-section">
            <div class="lista-cabecalho">
                <h2>Lista de tarefas</h2>
                <span id="contador">0 tarefas</span>
            </div>

            <div id="listaTarefas" class="lista-tarefas">
                <p class="vazio">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
