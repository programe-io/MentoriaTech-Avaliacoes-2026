<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Controle de Produtos</h1>
        <p>Cadastre e gerencie seus produtos em um só lugar.</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex.: Cadeira Gamer"
                        minlength="5"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        placeholder="Ex.: 10"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input
                        type="number"
                        id="valor"
                        min="0"
                        step="0.01"
                        placeholder="Ex.: 699.00"
                        required
                    >
                </div>

                <button type="submit">Cadastrar produto</button>
            </form>

            <p id="mensagem" role="status"></p>
        </section>

        <section class="card">
            <h2>Produtos cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="5">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="card">
            <h2>Atualizar produto</h2>

            <form id="formAtualizarValor">
                <h3>Atualizar valor</h3>

                <div class="campo">
                    <label for="codigoValor">Código do produto</label>
                    <input
                        type="number"
                        id="codigoValor"
                        min="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">Novo valor (R$)</label>
                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit">Atualizar valor</button>
            </form>

            <hr>

            <form id="formAtualizarQuantidade">
                <h3>Adicionar ao estoque</h3>

                <div class="campo">
                    <label for="codigoQuantidade">Código do produto</label>
                    <input
                        type="number"
                        id="codigoQuantidade"
                        min="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="novaQuantidade">Quantidade a adicionar</label>
                    <input
                        type="number"
                        id="novaQuantidade"
                        min="1"
                        required
                    >
                </div>

                <button type="submit">Adicionar estoque</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Sistema de Controle de Produtos</p>
    </footer>

<script src="script.js"></script></body>
</html>
