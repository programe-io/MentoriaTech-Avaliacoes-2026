<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>📋 Gerenciador de Tarefas</h1>
            <p>Simulador de Sistema de Gerenciamento (CRUD)</p>
        </header>

        <!-- Formulário de Cadastro -->
        <section class="form-section">
            <h2>Nova Tarefa</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Título da Tarefa</label>
                    <input type="text" id="taskTitle" placeholder="Mínimo de 5 caracteres" required>
                    <span class="error-message" id="titleError"></span>
                </div>
                
                <div class="form-group">
                    <label for="taskPriority">Prioridade</label>
                    <select id="taskPriority" required>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Cadastrar Tarefa</button>
            </form>
        </section>

        <!-- Listagem de Tarefas -->
        <section class="list-section">
            <h2>Suas Tarefas</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="taskList">
                        <!-- Inserido dinamicamente via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
