<!DOCTYPE html>
<html lang="pt-br">
<head>

            <title>Área de Entrega - Avaliações</title>

<link href="style.css" rel="stylesheet"></head>
                <body>

                    <main class="container">

                            <button class="voltar" onclick="voltarInicio()">

                                                                <p>

                                                                                                    avaliação esteja completa.
                                                                                                            </p>

                                                                                                                    <p>
                                                                                                                                Finalize seu trabalho, publique seu código

                                                                                                                                                        para ser avaliada.
                                                                                                                                                                </p>

                                                                                                                                                                                                                                                        <button class="publicar" onclick="publicar()">
                                                                                                                                                                                                                                                                        Publicar código
                                                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                                                                <p id="mensagem"></p>
