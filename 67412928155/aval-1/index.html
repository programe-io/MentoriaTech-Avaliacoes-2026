<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Stock</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📦 Gestão de Stock</h1>

        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-cadastro">
                <div class="form-group">
                    <label for="codigo">Código:</label>
                    <input type="text" id="codigo" required placeholder="Ex: P001">
                </div>
                <div class="form-group">
                    <label for="descricao">Descrição:</label>
                    <input type="text" id="descricao" required placeholder="Ex: Rato Sem Fios">
                </div>
                <div class="form-group">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" min="0" required placeholder="Ex: 10">
                </div>
                <div class="form-group">
                    <label for="valor">Valor (€):</label>
                    <input type="number" id="valor" step="0.01" min="0" required placeholder="Ex: 29.90">
                </div>
                <button type="submit" class="btn-sucesso">Cadastrar Produto</button>
            </form>
        </div>

        <!-- Lista de Produtos -->
        <div class="card">
            <h2>Produtos Cadastrados</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos">
                        <!-- Os produtos serão inseridos aqui via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
