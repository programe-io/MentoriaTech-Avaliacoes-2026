<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <div class="login-container">
      <h2>Acesso ao Sistema</h2>
        <form id="loginForm">
            <div class="input-group">
                  <label for="username">Utilizador:</label>
                        <input type="text" id="username" placeholder="Digite o seu utilizador" required>
                            </div>
                                
                                    <div class="input-group">
                                          <label for="password">Palavra-passe (apenas números):</label>
                                                <input type="password" id="password" placeholder="Digite a palavra-passe" required>
                                                    </div>

                                                        <button type="submit">Entrar</button>
                                                          </form>
                                                            
                                                              <p id="message"></p>
                                                              </div>
                                                              A imagem mostra a Pré-visualização do Código no site go.programe.io com o formulário de Acesso ao Sistema. Estão presentes os campos de entrada para Utilizador ("Digite o seu utilizador") e Palavra-passe ("Digite a palavra-passe"), juntamente com o botão "Entrar".
                                                              
  
  
</body>
</html>
