<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messi Social Feed</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
\}

body {
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  color: #222;
\}

header {
  background: #0756a5;
  color: white;
  padding: 18px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
\}

.container {
  max-width: 550px;
  margin: 25px auto;
  padding: 10px;
\}

.perfil {
  background: white;
  padding: 18px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
\}

.perfil img {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  object-fit: cover;
\}

.post {
  background: white;
  border-radius: 12px;
  margin-bottom: 22px;
  overflow: hidden;
  box-shadow: 0 2px 8px #0001;
\}

.post-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 15px;
\}

.post-header img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
\}

.post-image {
  width: 100%;
  display: block;
  max-height: 500px;
  object-fit: cover;
\}

.post-content {
  padding: 15px;
\}

.acoes {
  display: flex;
  gap: 18px;
  margin-bottom: 12px;
\}

.acoes button {
  border: none;
  background: none;
  font-size: 25px;
  cursor: pointer;
\}

.curtido {
  color: red;
\}

.comentario {
  color: #555;
  margin-top: 12px;
  font-size: 14px;
\}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin-top: 10px;
\}

button.publicar {
  background: #0756a5;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  margin-top: 10px;
  cursor: pointer;
\}

h3 {
  font-size: 16px;
\}

@media(max-width: 600px) {
  .container {
    margin: 10px auto;
  \}
\}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>⚽ MESSI SOCIAL</header>

<div class="container">

  <div class="perfil">
    <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Lionel_Messi,_Player_of_Argentina_national_football_team.JPG">
    <div>
      <h3>Fãs do Messi</h3>
      <p>Bem-vindo ao nosso feed!</p>
    </div>
  </div>

  <div class="post">
    <div class="post-header">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Lionel_Messi,_Player_of_Argentina_national_football_team.JPG">
      <div>
        <h3>Lionel Messi ✓</h3>
        <small>Há 2 horas</small>
      </div>
    </div>

    <img class="post-image"
    src="https://commons.wikimedia.org/wiki/Special:FilePath/Lionel_Messi,_Player_of_Argentina_national_football_team.JPG">

    <div class="post-content">
      <div class="acoes">
        <button onclick="curtir(this)">♡</button>
        <button onclick="focarComentario(this)">💬</button>
        <button onclick="compartilhar()">↗</button>
      </div>

      <p><strong><span class="likes">1250</span> curtidas</strong></p>

      <p><strong>messi10</strong> O futebol é minha paixão! ⚽🐐</p>

      <div class="comentario"></div>

      <input type="text" placeholder="Escreva um comentário..."
      onkeydown="comentar(event, this)">
    </div>
  </div>

  <div class="post">
    <div class="post-header">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Lionel_Messi,_Player_of_Argentina_national_football_team.JPG">
      <div>
        <h3>Messi Fans ✓</h3>
        <small>Há 5 horas</small>
      </div>
    </div>

    <img class="post-image"
    src="https://commons.wikimedia.org/wiki/Special:FilePath/Lionel_Messi_Argentina_v_Egypt_7_July_2026-218.jpg">

    <div class="post-content">
      <div class="acoes">
        <button onclick="curtir(this)">♡</button>
        <button onclick="focarComentario(this)">💬</button>
        <button onclick="compartilhar()">↗</button>
      </div>

      <p><strong><span class="likes">3200</span> curtidas</strong></p>

      <p><strong>messi_fans</strong> O maior de todos os tempos! 🐐🏆</p>

      <div class="comentario"></div>

      <input type="text" placeholder="Escreva um comentário..."
      onkeydown="comentar(event, this)">
    </div>
  </div>

  <!-- Criar publicação -->
  <div class="post-content post">
    <h3>📸 Criar publicação</h3>

    <input id="textoPost" placeholder="O que você está pensando?">

    <input id="imagemPost" placeholder="Cole o link da imagem">

    <button class="publicar" onclick="publicar()">
      Publicar
    </button>
  </div>

  <div id="novosPosts"></div>

</div>

<script>

// Curtir publicação
function curtir(botao) {
  const post = botao.closest(".post");
  const likes = post.querySelector(".likes");

  let total = Number(likes.textContent);

  if (botao.classList.contains("curtido")) {
    botao.classList.remove("curtido");
    botao.textContent = "♡";
    total--;
  \} else {
    botao.classList.add("curtido");
    botao.textContent = "♥";
    total++;
  \}

  likes.textContent = total;
\}

// Focar no comentário
function focarComentario(botao) {
  const post = botao.closest(".post");
  post.querySelector("input").focus();
\}

// Comentar
function comentar(event, input) {
  if (event.key === "Enter" && input.value.trim() !== "") {
    const post = input.closest(".post");
    const area = post.querySelector(".comentario");

    const novoComentario = document.createElement("p");
    novoComentario.textContent = "👤 Você: " + input.value;

    area.appendChild(novoComentario);
    input.value = "";
  \}
\}

// Compartilhar
function compartilhar() {
  if (navigator.share) {
    navigator.share({
      title: "Messi Social",
      text: "Confira esta publicação sobre Messi!"
    \});
  \} else {
    alert("Compartilhe o Messi Social com seus amigos!");
  \}
\}

// Criar nova publicação
function publicar() {
  const texto = document.getElementById("textoPost").value.trim();
  const imagem = document.getElementById("imagemPost").value.trim();

  if (!texto) {
    alert("Digite alguma coisa para publicar!");
    return;
  \}

  const post = document.createElement("div");
  post.className = "post";

  const cabecalho = document.createElement("div");
  cabecalho.className = "post-header";
  cabecalho.textContent = "👤 Você • Agora";

  post.appendChild(cabecalho);

  if (imagem) {
    try {
      const url = new URL(imagem);
      if (!["http:", "https:"].includes(url.protocol)) {
        throw new Error("URL inválida");
      \}

      const img = document.createElement("img");
      img.className = "post-image";
      img.src = url.href;
      img.alt = "Imagem da publicação";
      img.onerror = () => img.remove();

      post.appendChild(img);
    \} catch {
      alert("Digite um link de imagem válido.");
      return;
    \}
  \}

  const conteudo = document.createElement("div");
  conteudo.className = "post-content";

  const textoPost = document.createElement("p");
  textoPost.textContent = texto;

  const acoes = document.createElement("div");
  acoes.className = "acoes";

  const curtirBtn = document.createElement("button");
  curtirBtn.textContent = "♡";
  curtirBtn.onclick = () => curtir(curtirBtn);

  const likes = document.createElement("p");
  likes.innerHTML = '<strong><span class="likes">0</span> curtidas</strong>';

  const comentario = document.createElement("div");
  comentario.className = "comentario";

  const input = document.createElement("input");
  input.placeholder = "Escreva um comentário...";
  input.onkeydown = (event) => comentar(event, input);

  acoes.appendChild(curtirBtn);
  conteudo.append(textoPost, acoes, likes, comentario, input);
  post.appendChild(conteudo);

  document.getElementById("novosPosts").prepend(post);

  document.getElementById("textoPost").value = "";
  document.getElementById("imagemPost").value = "";
\}

</script>

<script src="script.js"></script></body>
</html>$0
