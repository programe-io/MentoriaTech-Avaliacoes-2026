
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <aside class="menu">
        <h1>Instagram</h1>

        <a href="#">🏠 Início</a>
        <a href="#">🔍 Pesquisa</a>
        <a href="#">🧭 Explorar</a>
        <a href="#">🎬 Reels</a>
        <a href="#">✉️ Mensagens</a>
        <a href="#">❤️ Notificações</a>
        <a href="#">➕ Criar publicação</a>
        <a href="#">👤 Perfil</a>
    </aside>

    <main class="principal">

        <section class="stories">
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=12">
                <p>Seu story</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=5">
                <p>Maria</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=8">
                <p>Pedro</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=9">
                <p>Ana</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=15">
                <p>Lucas</p>
            </div>
        </section>

        <section class="criar">
            <h3>Criar publicação</h3>
            <input type="text" id="usuario" placeholder="Seu nome">
            <input type="text" id="imagem" placeholder="Link da imagem">
            <textarea id="legenda" placeholder="Escreva uma legenda..."></textarea>
            <button onclick="publicar()">Compartilhar</button>
        </section>

        <section id="feed">

            <article class="post">
                <div class="post-topo">
                    <img src="https://i.pravatar.cc/100?img=12">
                    <strong>mariana</strong>
                </div>

                <img class="foto-post" src="https://picsum.photos/id/1011/600/500">

                <div class="acoes">
                    <button onclick="curtir(this)">♡ Curtir</button>
                    <button onclick="focarComentario(this)">💬 Comentar</button>
                    <button onclick="compartilhar()">↗ Compartilhar</button>
                </div>

                <p class="likes">0 curtidas</p>
                <p><strong>mariana</strong> Aproveitando o dia! ☀️</p>

                <div class="comentarios"></div>

                <div class="campo-comentario">
                    <input type="text" placeholder="Adicione um comentário...">
                    <button onclick="comentar(this)">Enviar</button>
                </div>
            </article>

        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
