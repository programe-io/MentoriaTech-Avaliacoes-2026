
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Meu Feed Social</h1>
    </header>

    <div class="container">

        <div class="publicar">
            <h3>O que você está pensando?</h3>
            <textarea id="mensagem" placeholder="Escreva uma publicação..."></textarea>
            <br>
            <button onclick="publicar()">Publicar</button>
        </div>

        <div id="feed">
            <div class="post">
                <h3>João</h3>
                <p>Olá, pessoal! Bem-vindos ao meu feed!</p>
                <button class="curtir" onclick="curtir(this)">
                    ❤️ Curtir 0
                </button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
