<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="app-container">
  <h1>📝 Meu Gerenciador de Tarefas</h1>
  
  <!-- Formulário que dispara a sua função cadastrarTarefa -->
  <form id="form-tarefa">
    <input type="text" id="input-titulo" placeholder="Título da tarefa (mín. 5 letras)" required>
    <select id="select-prioridade">
      <option value="1">Alta Prioridade</option>
      <option value="2">Média Prioridade</option>
      <option value="3">Baixa Prioridade</option>
    </select>
    <button type="submit">Adicionar</button>
  </form>

  <div id="mensagem-status"></div>
  <div id="lista-tarefas-cards"></div>
</div>

  <script src="script.js"></script>
  
</body>
</html>
