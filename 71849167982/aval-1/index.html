<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <!-- Interface HTML Básica criada no link -->
<div class="container">
  <h2>📦 Controle de Estoque (CRUD)</h2>
  
  <form id="form-cadastro">
    <input type="text" id="desc" placeholder="Descrição (mín. 5 letras)" required>
    <input type="number" id="qtd" placeholder="Quantidade" required>
    <input type="number" id="val" placeholder="Preço (R$)" step="0.01" required>
    <button type="submit">Cadastrar Produto</button>
  </form>

  <div id="erro-msg" class="erro"></div>

  <table id="tabela-produtos">
    <thead>
      <tr>
        <th>Código</th>
        <th>Descrição</th>
        <th>Quantidade</th>
        <th>Valor</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody><!-- Inserido dinamicamente via JS --></tbody>
  </table>
</div>

  
  
</body>
</html>
