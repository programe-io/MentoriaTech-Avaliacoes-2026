<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Social (Estilo X)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Link para o CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <div class="twitter-container">
        <!-- Navegação Lateral Esquerda -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-brands fa-x-twitter"></i>
            </div>
            <nav class="nav-menu">
                <a href="#" class="active"><i class="fa-solid fa-house"></i> <span>Página Inicial</span></a>
                <a href="#"><i class="fa-solid fa-hashtag"></i> <span>Explorar</span></a>
                <a href="#"><i class="fa-regular fa-bell"></i> <span>Notificações</span></a>
                <a href="#"><i class="fa-regular fa-envelope"></i> <span>Mensagens</span></a>
                <a href="#"><i class="fa-regular fa-user"></i> <span>Perfil</span></a>
            </nav>
        </aside>

        <!-- Feed Principal Central -->
        <main class="main-feed">
            <header class="feed-header">
                <h2>Página Inicial</h2>
            </header>

            <!-- Caixa de Criação de Post -->
            <div class="tweet-box">
                <div class="tweet-box-avatar">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" alt="Avatar">
                </div>
                <div class="tweet-box-input-area">
                    <textarea id="tweetInput" placeholder="O Está acontecendo?!" maxlength="280"></textarea>
                    <div class="tweet-box-footer">
                        <div class="tweet-icons">
                            <i class="fa-regular fa-image" title="Mídia"></i>
                            <i class="fa-solid fa-list" title="Enquete"></i>
                            <i class="fa-regular fa-face-smile" title="Emoji"></i>
                        </div>
                        <div class="tweet-action">
                            <span id="charCount">280</span>
                            <button id="tweetBtn" disabled>Postar</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lista de Tweets / Feed -->
            <div id="feedContainer">
                <!-- Os tweets injetados via JS aparecerão aqui -->
            </div>
        </main>

        <!-- Barra Lateral Direita (Trending / Sugestões) -->
        <aside class="widgets">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Pesquisar no Feed">
            </div>
            
            <div class="widget-card">
                <h3>O que está acontecendo</h3>
                <div class="trending-item">
                    <span class="trend-category">Tecnologia · Assunto do Momento</span>
                    <h4>#JavaScript</h4>
                    <span class="trend-posts">12,5 mil posts</span>
                </div>
                <div class="trending-item">
                    <span class="trend-category">Teresina · Assunto do Momento</span>
                    <h4>Calor de Teresina</h4>
                    <span class="trend-posts">8,2 mil posts</span>
                </div>
            </div>
        </aside>
    </div>

    <!-- Link para o JavaScript -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
