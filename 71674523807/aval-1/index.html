<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque CRUD</title>
    <style>
        :root {
            --primary: #4f46e5;
            --background: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { text-align: center; color: var(--primary); }
        .card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) auto;
            gap: 1rem;
            align-items: end;
        }
        input, button {
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        th { background-color: #f9fafb; }
        .actions input { width: 70px; padding: 0.4rem; font-size: 0.9rem; }
        .actions button { padding: 0.4rem 0.8rem; font-size: 0.9rem; margin-left: 4px; }
        .btn-qty { background-color: #10b981; }
        .btn-val { background-color: #f59e0b; }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h1>📦 Sistema de Estoque</h1>

    <!-- Formulário de Cadastro -->
    <div class="card">
        <h3>Cadastrar Novo Produto</h3>
        <div class="form-group">
            <input type="text" id="desc" placeholder="Descrição do Produto">
            <input type="number" id="qtd" placeholder="Qtd Inicial" min="0">
            <input type="number" id="val" placeholder="Preço (R\$)" step="0.01" min="0.01">
            <button onclick="cadastrar()">Adicionar</button>
        </div>
    </div>

    <!-- Tabela de Listagem -->
    <div class="card">
        <h3>Produtos em Estoque</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Qtd</th>
                    <th>Preço</th>
                    <th>Ações rápidas</th>
                </tr>
            </thead>
            <tbody id="tabela-produtos">
                <!-- Inserido dinamicamente via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8080/api/produtos";

    async function listar() {
        const res = await fetch(API_URL);
        const produtos = await res.json();
        const tbody = document.getElementById("tabela-produtos");
        tbody.innerHTML = "";

        produtos.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td>${p.id}</td>
                    <td><strong>${p.descricao}</strong></td>
                    <td>${p.quantidade} u</td>
                    <td>R$ ${p.valor.toFixed(2)}</td>
                    <td class="actions">
                        <input type="number" id="add-qtd-${p.id}" placeholder="+ Qtd">
                        <button class="btn-qty" onclick="somarEstoque(${p.id})">Somar</button>
                        
                        <input type="number" id="new-val-${p.id}" placeholder="R$ Novo" step="0.01">
                        <button class="btn-val" onclick="mudarPreço(${p.id})">Preço</button>
                    </td>
                </tr>
            `;
        });
    }

    async function cadastrar() {
        const descricao = document.getElementById("desc").value;
        const quantidade = parseInt(document.getElementById("qtd").value);
        const valor = parseFloat(document.getElementById("val").value);

        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ descricao, quantidade, valor })
        });

        if(res.ok) {
            document.getElementById("desc").value = "";
            document.getElementById("qtd").value = "";
            document.getElementById("val").value = "";
            listar();
        } else {
            alert("Erro nas validações dos dados!");
        }
    }

    async function somarEstoque(id) {
        const qtd = document.getElementById(`add-qtd-${id}`).value;
        if(!qtd) return;
        await fetch(`${API_URL}/${id}/quantidade?quantidadeParaAdicionar=${qtd}`, { method: "PUT" });
        listar();
    }

    async function mudarPreço(id) {
        const preco = document.getElementById(`new-val-${id}`).value;
        if(!preco) return;
        await fetch(`${API_URL}/${id}/valor?novoValor=${preco}`, { method: "PUT" });
        listar();
    }

    // Inicializa a lista ao carregar a página
    listar();
</script>
<script src="script.js"></script></body>
</html>
