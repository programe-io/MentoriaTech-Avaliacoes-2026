<!DOCTYPE html>
<html lang="pt-br">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head> 
      <meta charset="UTF-8">  />
      <meta name="viewport" content="width=device-widt,initial-scale=10" />

       
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


      <link href="htts://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"  rel="stylesheet">
       
      <title>clone instagram</title>
</head>

<body class="min-h-screen bg-gray-100">
</body>
</html>

<style> 
      .bg-muted { background-color:  #f3f4f6; }
      .bg-card { background-color: #ffffff; }
      .border-border { border-color: #e5e7eb }
      .text-muted { color: #6b7280 }
</style>

<header class="sticky top=0 bg-white border=b border-gray=200">
     <div class="max-w-5xl mx-auto px-4">
         <div class="flex items-center justify-between h-14">
           
         <h1  class="font-semibold text=lg">instagram</h1>
          
         <input 
             type="text"
             placeholder="pesquisar"
             class="hidden md:block bg-gray-100 px-4 py-2 rounded-lg text-sm"
              

       <div class="flex gap-4">
            <i class="bx bx-home text-xl></i>"
            <i class="bx bx-heart text-></i>"
       </div>

      </div>
     </div>
</header>
      <main class="max-w-5xl mx-auto px-4 py-6">
            <div class="flex gap-8">


                 <div class="flex-1 max-w-lg mx-auto">
                  </div>


                 <aside class="hidden lg:block w-80">
                  </aside>

            </div>
      </main>
<section class="bg-white border rounded-lg p-4 mb-4">
      <div class="flex gap-4 overflow-x-auto">
            <div class="flex flex-col items-center">
            <div class="w-16 h-16 rounded-full bg-gray-300"></div>
            <span class="text-xs mt-1">seu_story</span>
            </div>

      </div>
</section>
<article class="max-w-md mx-auto bg-white border border-gray-200 rounded-lg shadow-sm mb-4"> 
    
    <!-- Header (Usuário) --> 
    <div class="flex justify-between items-center p-4"> 
        <div class="flex items-center gap-3"> 
            <!-- Foto de Perfil -->
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-400 to-purple-600 p-[2px]">
                <div class="w-full h-full bg-gray-300 rounded-full border-2 border-white"></div>
            </div>
            <div class="flex flex-col">
                <span class="font-semibold text-sm text-gray-900 leading-tight">nome_usuario</span> 
                <span class="text-xs text-gray-500">São Paulo, Brazil</span>
            </div>
        </div> 
        <button class="text-gray-600 hover:text-black">
            <i class="bx bx-dots-horizontal text-xl"></i> 
        </button>
    </div> 

    <!-- Imagem do Post -->
    <div class="bg-gray-100 aspect-square flex items-center justify-center overflow-hidden">
        <img src="https://via.placeholder.com/500" class="w-full h-full object-cover" alt="Post" /> 
    </div>

    <!-- Seção de Interação --> 
    <div class="p-4"> 
        <!-- Botões de Ação -->
        <div class="flex justify-between mb-3"> 
            <div class="flex gap-4 text-2xl text-gray-700"> 
                <button class="hover:text-red-500 transition-colors"><i class="bx bx-heart"></i></button> 
                <button class="hover:text-blue-500 transition-colors"><i class="bx bx-message-rounded"></i></button> 
                <button class="hover:text-green-500 transition-colors"><i class="bx bx-share-alt"></i></button> 
            </div> 
            <button class="text-2xl text-gray-700 hover:text-yellow-600 transition-colors">
                <i class="bx bx-bookmark"></i>
            </button> 
        </div> 
        
        <!-- Curtidas -->
        <p class="text-sm font-semibold text-gray-900 mb-2">1.234 curtidas</p> 

        <!-- Legenda -->
        <div class="text-sm text-gray-800 mb-2">
            <span class="font-semibold text-gray-900 mr-2">nome_usuario</span>
            Desenvolvendo novos componentes modernos com Tailwind CSS! 🚀 #webdev #coding
        </div>

        <!-- Links de Comentários e Tempo -->
        <button class="text-sm text-gray-500 mb-1 block hover:underline">Ver todos os 42 comentários</button>
        <span class="text-[10px] text-gray-400 uppercase tracking-wide">Há 2 horas</span>
    </div>

    <!-- Rodapé: Campo de Novo Comentário -->
    <div class="border-t border-gray-100 p-4 flex items-center gap-3">
        <button class="text-xl text-gray-600"><i class="bx bx-smile"></i></button>
        <input 
            type="text" 
            placeholder="Adicione um comentário..." 
            class="flex-1 text-sm bg-transparent border-none outline-none focus:ring-0 text-gray-800 placeholder-gray-400"
        />
        <button class="text-sm font-semibold text-blue-500 hover:text-blue-700 disabled:opacity-50">
            Publicar
        </button>
    </div>

</article>
<aside class="hidden lg:block w-80">

  <div class="flex items-center gap-3 mb-4">
    <div class="w-12 h-12 rounded-full bg-gray-300"></div>
    <div>
      <p class="font-semibold text-sm">seu_usuario</p>
      <p class="text-xs text-gray-500">Seu nome</p>
    </div>
  </div>

</aside>
<nav class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 z-50">
    <div class="flex justify-around items-center py-3">

            <i class='bx bx-home text-2xl'></i>

        <a href="#" class="text-gray-700 hover:text-black transition-colors duration-200">
            <i class='bx bx-search text-2xl'></i>

        <a href="#" class="text-gray-700 hover:text-black transition-colors duration-200">
            <i class='bx bx-plus text-2xl'></i>
        </a>
        <a href="#" class="text-gray-700 hover:text-black transition-colors duration-200">
            <i class='bx bx-heart text-2xl'></i>
        </a>
    </div>
</nav>
