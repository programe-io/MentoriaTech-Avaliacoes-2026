


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header class="header">
            <h1>TaskFlow</h1>
            <p>Organize suas tarefas e aumente sua produtividade.</p>
        </header>

        <section class="task-card">

            <h2>Minhas tarefas</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Digite uma nova tarefa..."
                    autocomplete="off"
                    required
                >
                <button type="submit" id="addButton">
                    Adicionar
                </button>
            </form>

            <div class="statistics">
                <div class="stat">
                    <span id="totalTasks">0</span>
                    <p>Total</p>
                </div>

                <div class="stat">
                    <span id="pendingTasks">0</span>
                    <p>Pendentes</p>
                </div>

                <div class="stat">
                    <span id="completedTasks">0</span>
                    <p>Concluídas</p>
                </div>
            </div>

            <div class="filters">
                <button class="filter active" data-filter="all">
                    Todas
                </button>

                <button class="filter" data-filter="pending">
                    Pendentes
                </button>

                <button class="filter" data-filter="completed">
                    Concluídas
                </button>
            </div>

            <ul id="taskList"></ul>

            <p id="emptyMessage">
                Nenhuma tarefa cadastrada.
            </p>

        </section>

        <footer>
            <p>TaskFlow © 2026 - Gerencie seu tempo.</p>
        </footer>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
