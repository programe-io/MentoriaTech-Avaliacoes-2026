<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>

        <div class="header-content">

            <h1>Avengers</h1>

            <nav>
                <a href="#">Inicio</a>
                <a href="#">Perfil</a>
            </nav>
        </div>

    </header>

    <main>

        <section class="Novo-Post">

            <div class="user">

                <div class="avatar">
                     J
                </div>
                 
                <div>
                    <strong>Neto</strong>
                    <span>O que você está pensando?</span>
                </div>



            </div>

            <button>Publicar</button>


        </section>

        <article class="post">

            <div class="post-header">

                <div class="avatar">
                     M
                </div>
                 
                <div>
                    <strong>Neto</strong>
                    <span>Há 10 minutos</span>
            </div>

       </div>

       <div class="post-text">
           Estou ansioso para o novo filme dos Vingadores:>
       </div>

       <img src="https://thumb.wikimedia.org/wikipedia/pt/thumb/e/ee/Avengers_Doomsday_poster.jpg/250px-Avengers_Doomsday_poster.jpg?utm_source=pt.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" alt="">
        
       <div class="post-actions">

            <button>Curtir</button>
            <button>Comentar</button>

       </div>


        </article>



    </main>

    <footer>
         <p>MiniFeed - Todos os Direitos Reservados - 2026</p>
    </footer>
    
</body>
</html>
