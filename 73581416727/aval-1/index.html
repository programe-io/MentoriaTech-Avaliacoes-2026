<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Resumo / Cards */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            border-left: 5px solid #3498db;
        }

        .card h3 {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .card p {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Formulário */
        .form-group {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #219150;
        }

        /* Busca */
        .search-bar {
            margin-bottom: 15px;
        }

        .search-bar input {
            width: 100%;
        }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .low-stock {
            color: #e74c3c;
            font-weight: bold;
        }

        /* Botões de Ação */
        .btn-action {
            padding: 5px 10px;
            margin-right: 4px;
            font-size: 12px;
        }

        .btn-plus { background-color: #3498db; }
        .btn-plus:hover { background-color: #2980b9; }

        .btn-minus { background-color: #f39c12; }
        .btn-minus:hover { background-color: #d68910; }

        .btn-delete { background-color: #e74c3c; }
        .btn-delete:hover { background-color: #c0392b; }

        @media (max-width: 768px) {
            .form-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h1>📦 Controle de Estoque</h1>

    <!-- Resumo -->
    <div class="dashboard">
        <div class="card">
            <h3>Total de Produtos</h3>
            <p id="total-produtos">0</p>
        </div>
        <div class="card" style="border-left-color: #27ae60;">
            <h3>Itens em Estoque</h3>
            <p id="total-itens">0</p>
        </div>
        <div class="card" style="border-left-color: #f39c12;">
            <h3>Valor Total</h3>
            <p id="valor-total">R$ 0,00</p>
        </div>
    </div>

    <!-- Cadastro -->
    <form id="form-produto" class="form-group">
        <input type="text" id="nome" placeholder="Nome do Produto" required>
        <input type="text" id="categoria" placeholder="Categoria" required>
        <input type="number" id="quantidade" placeholder="Qtd" min="0" required>
        <input type="number" id="preco" placeholder="Preço (R$)" step="0.01" min="0" required>
        <button type="submit">+ Adicionar</button>
    </form>

    <!-- Filtro -->
    <div class="search-bar">
        <input type="text" id="busca" placeholder="🔍 Buscar produto por nome ou categoria...">
    </div>

    <!-- Tabela -->
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Qtd</th>
                <th>Preço Unit.</th>
                <th>Subtotal</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-estoque">
            <!-- Itens inseridos via JS -->
        </tbody>
    </table>
</div>

<script>
    let estoque = JSON.parse(localStorage.getItem('meu_estoque')) || [];

    const form = document.getElementById('form-produto');
    const tabela = document.getElementById('tabela-estoque');
    const buscaInput = document.getElementById('busca');

    function salvarDados() {
        localStorage.setItem('meu_estoque', JSON.stringify(estoque));
    }

    function formatarMoeda(valor) {
        return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function atualizarResumo() {
        const totalProdutos = estoque.length;
        const totalItens = estoque.reduce((acc, item) => acc + item.quantidade, 0);
        const valorTotal = estoque.reduce((acc, item) => acc + (item.quantidade * item.preco), 0);

        document.getElementById('total-produtos').innerText = totalProdutos;
        document.getElementById('total-itens').innerText = totalItens;
        document.getElementById('valor-total').innerText = formatarMoeda(valorTotal);
    }

    function renderizarTabela(filtro = '') {
        tabela.innerHTML = '';

        const itensFiltrados = estoque.filter(item =>
            item.nome.toLowerCase().includes(filtro.toLowerCase()) ||
            item.categoria.toLowerCase().includes(filtro.toLowerCase())
        );

        itensFiltrados.forEach((item) => {
            const indexReal = estoque.indexOf(item);
            const subtotal = item.quantidade * item.preco;
            const alertaEstoque = item.quantidade <= 5 ? 'low-stock' : '';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.nome}</td>
                <td>${item.categoria}</td>
                <td class="${alertaEstoque}">${item.quantidade}</td>
                <td>${formatarMoeda(item.preco)}</td>
                <td>${formatarMoeda(subtotal)}</td>
                <td>
                    <button class="btn-action btn-plus" onclick="alterarQtd(${indexReal}, 1)">+1</button>
                    <button class="btn-action btn-minus" onclick="alterarQtd(${indexReal}, -1)">-1</button>
                    <button class="btn-action btn-delete" onclick="removerProduto(${indexReal})">Excluir</button>
                </td>
            `;
            tabela.appendChild(tr);
        });

        atualizarResumo();
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const nome = document.getElementById('nome').value.trim();
        const categoria = document.getElementById('categoria').value.trim();
        const quantidade = parseInt(document.getElementById('quantidade').value);
        const preco = parseFloat(document.getElementById('preco').value);

        estoque.push({ nome, categoria, quantidade, preco });
        salvarDados();
        renderizarTabela(buscaInput.value);
        form.reset();
    });

    function alterarQtd(index, delta) {
        if (estoque[index].quantidade + delta >= 0) {
            estoque[index].quantidade += delta;
            salvarDados();
            renderizarTabela(buscaInput.value);
        }
    }

    function removerProduto(index) {
        if (confirm(`Deseja realmente excluir "${estoque[index].nome}"?`)) {
            estoque.splice(index, 1);
            salvarDados();
            renderizarTabela(buscaInput.value);
        }
    }

    buscaInput.addEventListener('input', (e) => {
        renderizarTabela(e.target.value);
    });

    // Inicializa a tabela ao carregar a página
    renderizarTabela();
</script>

<script src="script.js"></script></body>
</html>
