<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Calculadora de IMC</h1>
    <p class="subtitle">Descubra seu Índice de Massa Corporal</p>

    <form id="imc-form">
      <div class="input-group">
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" step="0.1" min="1" max="500" placeholder="Ex: 70.5" required>
      </div>

      <div class="input-group">
        <label for="altura">Altura (m ou cm)</label>
        <input type="number" id="altura" step="0.01" min="0.5" max="300" placeholder="Ex: 1.75 ou 175" required>
      </div>

      <button type="submit">Calcular IMC</button>
    </form>

    <div id="resultado" class="resultado oculto">
      <div class="imc-valor">
        <span>Seu IMC é</span>
        <strong id="valor-numero">0.0</strong>
      </div>
      <p id="classificacao" class="classificacao"></p>
    </div>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
