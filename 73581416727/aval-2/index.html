<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <!-- Importando o CSS separado -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>Minhas Tarefas</h1>
            <p id="contador-tarefas">0 tarefas pendentes</p>
        </header>

        <form id="form-tarefa" class="form-grupo">
            <input 
                type="text" 
                id="input-tarefa" 
                placeholder="O que precisa ser feito?" 
                required 
                autocomplete="off"
            >
            <select id="select-prioridade" title="Prioridade">
                <option value="baixa">Baixa</option>
                <option value="media" selected>Média</option>
                <option value="alta">Alta</option>
            </select>
            <button type="submit" class="btn-adicionar">Adicionar</button>
        </form>

        <div class="filtros">
            <button class="btn-filtro ativo" data-filtro="todas">Todas</button>
            <button class="btn-filtro" data-filtro="pendentes">Pendentes</button>
            <button class="btn-filtro" data-filtro="concluidas">Concluídas</button>
        </div>

        <ul id="lista-tarefas" class="lista-tarefas">
            <!-- As tarefas serão inseridas aqui via JavaScript -->
        </ul>

        <div class="acoes-rodape">
            <button id="btn-limpar-concluidas" class="btn-secundario">Limpar Concluídas</button>
        </div>
    </div>

    <!-- Importando o JavaScript separado -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
