
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEZONE - Comunidade Gamer</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🎮 GAMEZONE</h1>
        <p>Sua comunidade gamer!</p>
    </header>

    <nav>
        <a href="#inicio">Início</a>
        <a href="#criar">Publicar</a>
        <a href="#feed">Feed</a>
    </nav>

    <main id="inicio">

        <section class="boas-vindas">
            <h2>Bem-vindo à GAMEZONE!</h2>
            <p>Compartilhe suas jogadas, conquistas e novidades.</p>
        </section>

        <section class="criar-post" id="criar">
            <h2>🚀 Criar publicação</h2>

            <input type="text" id="usuario"
                placeholder="Seu nome gamer">

            <select id="jogo">
                <option value="">Escolha seu jogo</option>
                <option>Free Fire</option>
                <option>Minecraft</option>
                <option>Roblox</option>
                <option>Fortnite</option>
                <option>GTA</option>
                <option>Outro</option>
            </select>

            <textarea id="texto"
                placeholder="Compartilhe sua experiência gamer..."></textarea>

            <input type="text" id="imagem"
                placeholder="Link de uma imagem (opcional)">

            <button onclick="criarPost()">PUBLICAR</button>
        </section>

        <section id="feed">
            <h2>🔥 Feed Gamer</h2>
        </section>

    </main>

    <footer>
        <p>🎮 GAMEZONE © 2026 - Comunidade Gamer</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
