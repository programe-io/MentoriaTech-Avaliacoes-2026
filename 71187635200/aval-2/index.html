
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <h1>Gerenciador de Tarefas</h1>

        <section class="cadastro">
            <label for="nomeTarefa">Nome da tarefa</label>
            <input type="text" id="nomeTarefa" placeholder="Digite uma tarefa">

            <label for="prioridade">Prioridade</label>
            <select id="prioridade">
                <option value="1">Alta</option>
                <option value="2">Média</option>
                <option value="3">Baixa</option>
            </select>

            <div class="botoes">
                <button id="btAdicionar" class="btn-primary">Cadastrar tarefa</button>
                <button id="btStatus" class="btn-success">Concluir / Reabrir</button>
                <button id="btPrioridade" class="btn-secondary">Alterar prioridade</button>
            </div>
        </section>

        <section class="tarefas">
            <h2>Selecionar tarefa</h2>
            <select id="selecionarTarefa">
                <option value="">Nenhuma tarefa cadastrada</option>
            </select>

            <h2>Lista de tarefas</h2>
            <p id="contadorTarefas">Total de tarefas: 0</p>
            <div id="listaTarefas"></div>
        </section>
    </main>
<script src="script.js"></script></body>
</html>
