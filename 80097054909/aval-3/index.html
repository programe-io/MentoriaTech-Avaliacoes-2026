<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body data-theme="light">

    
    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">Instagram</a>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar">
            </div>

            <nav class="nav-icons">
                <a href="#" class="nav-icon active" title="Início"><i class="fa-solid fa-house"></i></a>
                <a href="#" class="nav-icon" title="Mensagens"><i class="fa-regular fa-paper-plane"></i></a>
                <a href="#" class="nav-icon" id="openCreateModalBtn" title="Nova Publicação"><i class="fa-regular fa-square-plus"></i></a>
                <a href="#" class="nav-icon" title="Explorar"><i class="fa-regular fa-compass"></i></a>
                <a href="#" class="nav-icon" title="Notificações"><i class="fa-regular fa-heart"></i></a>
                <button id="themeToggleBtn" class="theme-toggle-btn" title="Alternar Tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </nav>
        </div>
    </header>

    
    <main class="main-layout">

        
        <div class="feed-container">

            
            <section class="stories-card">
                <div class="story-item">
                    <div class="story-ring">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80" class="story-avatar" alt="Ana">
                    </div>
                    <span class="story-username">pessoa</span>
                </div>
                <div class="story-item">
                    <div class="story-ring">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80" class="story-avatar" alt="Carlos">
                    </div>
                    <span class="story-username">pessoa_tech</span>
                </div>
                <div class="story-item">
                    <div class="story-ring">
                        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80" class="story-avatar" alt="Mariana">
                    </div>
                    <span class="story-username">pessoa_dev</span>
                </div>
                <div class="story-item">
                    <div class="story-ring">
                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80" class="story-avatar" alt="Pedro">
                    </div>
                    <span class="story-username">pessoa_art</span>
                </div>
                <div class="story-item">
                    <div class="story-ring">
                        <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150&auto=format&fit=crop&q=80" class="story-avatar" alt="Sofia">
                    </div>
                    <span class="story-username">pessoa_fit</span>
                </div>
            </section>

            
            <div id="postsFeed"></div>

        </div>

        
        <aside class="sidebar">
            <div class="user-profile-widget">
                <div class="user-profile-info">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" class="profile-avatar" alt="Meu Perfil">
                    <div class="profile-text">
                        <span class="profile-username">meu_perfil_dev</span>
                        <span class="profile-fullname">Aluno</span>
                    </div>
                </div>
                <button class="switch-btn">Mudar</button>
            </div>

            <div class="suggestions-header">
                <span class="suggestions-title">Sugestões para si</span>
                <a href="#" class="see-all-btn">Ver tudo</a>
            </div>

            <div class="suggestions-list">
                <div class="suggestion-item">
                    <div class="suggestion-user">
                        <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=100&auto=format&fit=crop&q=80" class="suggestion-avatar" alt="Lucas">
                        <div class="suggestion-info">
                            <span class="suggestion-username">lucas_frontend</span>
                            <span class="suggestion-sub">Seguido por carlos_tech</span>
                        </div>
                    </div>
                    <button class="follow-btn">Seguir</button>
                </div>

                <div class="suggestion-item">
                    <div class="suggestion-user">
                        <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=100&auto=format&fit=crop&q=80" class="suggestion-avatar" alt="Camila">
                        <div class="suggestion-info">
                            <span class="suggestion-username">camila_design</span>
                            <span class="suggestion-sub">Novo no Instagram</span>
                        </div>
                    </div>
                    <button class="follow-btn">Seguir</button>
                </div>
            </div>

            <footer class="sidebar-footer">
                <p>Sobre • Ajuda • Imprensa • API • Empregos • Privacidade • Termos</p>
                <p style="margin-top: 10px;">© 2026 CLONE INSTAGRAM</p>
            </footer>
        </aside>

    </main>

    
    <div id="createPostModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Criar nova publicação</h3>
                <button id="closeModalBtn" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <input type="text" id="newImageInput" placeholder="URL da foto (ex: Unsplash)" class="modal-input">
                <textarea id="newCaptionInput" placeholder="Escreva uma legenda..." class="modal-textarea"></textarea>
                <button id="submitPostBtn" class="primary-btn">Publicar</button>
            </div>
        </div>
    </div>

    
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
