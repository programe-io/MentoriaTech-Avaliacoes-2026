<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  
<div class="container">
  <header>
    <h1>Mentoria <span>Tec</span></h1>
    <p>Área de Entrega - Avaliações</p>
  </header>

  <section class="boas-vindas">
    <h2>Envie seu trabalho!</h2>
    <p>Finalize sua atividade e compartilhe sua solução com o professor.</p>
  </section>

  <section class="avaliacao">
    <h2>Enviar avaliação</h2>

    <label for="aluno">Nome do aluno</label>
    <input type="text" id="aluno" placeholder="Digite seu nome">

    <label for="atividade">Nome da atividade</label>
    <input type="text" id="atividade" placeholder="Digite a atividade">

    <label for="codigo">Código ou link do projeto</label>
    <textarea id="codigo" placeholder="Cole seu código ou link aqui"></textarea>

    <label class="check">
      <input type="checkbox" id="revisado">
      Revisei meu trabalho antes de enviar.
    </label>

    <button id="enviar">Enviar avaliação</button>

    <p id="mensagem" role="status"></p>
  </section>

  <footer>
    © 2026 Mentoria Tec - Todos os direitos reservados.
  </footer>
</div>

  <script src="script.js"></script>
  
</body>
</html>
