<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="app">
    <header>
      <h1>Gerenciador de Tarefas</h1>
      <p class="resumo" id="resumo">Nenhuma tarefa cadastrada</p>
    </header>

    <section aria-labelledby="titulo-form">
      <h2 id="titulo-form">Nova tarefa</h2>
      <div class="form">
        <div class="campo campo-titulo">
          <label for="titulo">Título (mínimo 5 caracteres)</label>
          <input type="text" id="titulo" autocomplete="off">
        </div>
        <div class="campo">
          <label for="prioridade">Prioridade</label>
          <select id="prioridade">
            <option value="1">1 – Alta</option>
            <option value="2" selected>2 – Média</option>
            <option value="3">3 – Baixa</option>
          </select>
        </div>
        <button type="button" id="btn-cadastrar" class="btn-principal">Cadastrar tarefa</button>
      </div>
      <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
    </section>

    <section aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Tarefas</h2>
      <ul id="lista" class="lista"></ul>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
