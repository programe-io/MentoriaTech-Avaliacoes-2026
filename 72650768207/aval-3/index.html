<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Anamnese - Controle de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Ficha de Anamnese</h1>
    <p class="subtitulo">Controle de IMC dos pacientes</p>

    <form id="form-pessoa" novalidate>
      <div class="campo">
        <label for="input-nome">Nome</label>
        <input type="text" id="input-nome" placeholder="Ex.: Francisco" autocomplete="off">
      </div>

      <div class="campo">
        <label for="input-idade">Idade</label>
        <input type="number" id="input-idade" placeholder="Ex.: 30" step="1">
      </div>

      <div class="campo">
        <label for="input-altura">Altura (m)</label>
        <input type="number" id="input-altura" placeholder="Ex.: 1.70" step="0.01">
      </div>

      <div class="campo">
        <label for="input-peso">Peso (kg)</label>
        <input type="number" id="input-peso" placeholder="Ex.: 65" step="0.1">
      </div>

      <button type="submit" class="botao-salvar">Salvar</button>
    </form>

    <p id="erro" class="erro" role="alert" hidden></p>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Idade</th>
          <th>Altura</th>
          <th>Peso</th>
          <th>IMC</th>
          <th>Classificação</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-corpo"></tbody>
    </table>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
