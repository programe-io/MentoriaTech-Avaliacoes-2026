<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <!-- Mensagem de erro para feedback visual -->
        <div id="mensagemErro" class="erro-msg"></div>

        <div class="forms-grid">
            <!-- Form Cadastrar Tarefa -->
            <div class="card-form">
                <h2>Cadastrar Tarefa</h2>
                <form id="formCadastro">
                    <div class="form-group">
                        <label for="titulo">Título (Mín. 5 caracteres)</label>
                        <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript" required>
                    </div>
                    <div class="form-group">
                        <label for="prioridade">Prioridade (1 a 3)</label>
                        <select id="prioridade" required>
                            <option value="1">1 - Alta</option>
                            <option value="2">2 - Média</option>
                            <option value="3">3 - Baixa</option>
                        </select>
                    </div>
                    <button type="submit">Adicionar Tarefa</button>
                </form>
            </div>

            <!-- Forms Alterar Prioridade e Concluir -->
            <div class="forms-column">
                <div class="card-form">
                    <h2>Alterar Prioridade</h2>
                    <form id="formAlterarPrioridade">
                        <div class="form-inline">
                            <div class="form-group flex-1">
                                <label for="codPrioridade">Cód.</label>
                                <input type="number" id="codPrioridade" min="1" required>
                            </div>
                            <div class="form-group flex-2">
                                <label for="novaPrioridade">Nova Prioridade</label>
                                <select id="novaPrioridade" required>
                                    <option value="1">1 - Alta</option>
                                    <option value="2">2 - Média</option>
                                    <option value="3">3 - Baixa</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn-update">Alterar</button>
                    </form>
                </div>

                <div class="card-form">
                    <h2>Concluir Tarefa</h2>
                    <form id="formConcluir">
                        <div class="form-inline">
                            <div class="form-group flex-1">
                                <label for="codConcluir">Cód. da Tarefa</label>
                                <input type="number" id="codConcluir" min="1" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-success">Concluir Tarefa</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Lista de Tarefas -->
        <h2>Lista de Tarefas</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Título</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabelaTarefas">
                    <!-- Preenchido dinamicamente via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
