<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Produtos</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Sistema de Gestão de Produtos</h1>

        <!-- Mensagem de Erro -->
        <div id="mensagemErro" class="erro-msg"></div>

        <div class="forms-grid">
            <!-- Form Cadastrar -->
            <div class="card-form">
                <h2>Cadastrar Produto</h2>
                <form id="formCadastro">
                    <div class="form-group">
                        <label for="descricao">Descrição (Mín. 5 caracteres)</label>
                        <input type="text" id="descricao" required>
                    </div>
                    <div class="form-group">
                        <label for="quantidade">Quantidade (Mín. 1)</label>
                        <input type="number" id="quantidade" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="valor">Valor R$ (Mín. 0)</label>
                        <input type="number" id="valor" step="0.01" min="0" required>
                    </div>
                    <button type="submit">Cadastrar</button>
                </form>
            </div>

            <!-- Forms Atualizar -->
            <div class="forms-column">
                <div class="card-form">
                    <h2>Atualizar Valor</h2>
                    <form id="formAtualizarValor">
                        <div class="form-inline">
                            <div class="form-group flex-1">
                                <label for="codValor">Cód.</label>
                                <input type="number" id="codValor" min="1" required>
                            </div>
                            <div class="form-group flex-2">
                                <label for="novoValor">Novo Valor R$</label>
                                <input type="number" id="novoValor" step="0.01" min="0" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-update">Atualizar Valor</button>
                    </form>
                </div>

                <div class="card-form">
                    <h2>Adicionar Estoque</h2>
                    <form id="formAtualizarQuantidade">
                        <div class="form-inline">
                            <div class="form-group flex-1">
                                <label for="codQtd">Cód.</label>
                                <input type="number" id="codQtd" min="1" required>
                            </div>
                            <div class="form-group flex-2">
                                <label for="addQtd">Adicionar Qtd.</label>
                                <input type="number" id="addQtd" min="1" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-update">Adicionar Qtd.</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabela -->
        <h2>Lista de Produtos</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor Unitário</th>
                        <th>Total em Estoque</th>
                    </tr>
                </thead>
                <tbody id="tabelaProdutos"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
