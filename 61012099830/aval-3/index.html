
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Pessoas - IMC</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <header class="cabecalho">
            <h1>Cadastro de Pessoas</h1>
            <p>Cadastre pessoas e acompanhe seus índices de massa corporal.</p>
        </header>

        <section class="card">

            <h2>Adicionar pessoa</h2>

            <form id="form-pessoa">

                <div class="grupo-campos">

                    <div class="campo">
                        <label for="input-nome">Nome</label>
                        <input
                            type="text"
                            id="input-nome"
                            placeholder="Digite o nome"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="input-idade">Idade</label>
                        <input
                            type="number"
                            id="input-idade"
                            placeholder="Ex: 25"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="input-altura">Altura (m)</label>
                        <input
                            type="number"
                            id="input-altura"
                            placeholder="Ex: 1.75"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="input-peso">Peso (kg)</label>
                        <input
                            type="number"
                            id="input-peso"
                            placeholder="Ex: 70"
                            step="0.1"
                            required
                        >
                    </div>

                </div>

                <p id="erro" class="mensagem-erro" hidden></p>

                <button type="submit" class="btn-adicionar">
                    + Adicionar pessoa
                </button>

            </form>

        </section>

        <section class="card tabela-card">

            <div class="titulo-tabela">
                <div>
                    <h2>Pessoas cadastradas</h2>
                    <p>Lista de pessoas e seus respectivos IMCs.</p>
                </div>
            </div>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-pessoas">
                        <!-- JavaScript adicionará as pessoas aqui -->
                    </tbody>

                </table>

            </div>

        </section>

        <footer>
            <p>Sistema de Cadastro e Cálculo de IMC</p>
        </footer>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
