<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha de Anamnese - Controle de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Ficha de Anamnese</h1>
    <p class="subtitulo">Cadastre o paciente e acompanhe o IMC.</p>

    <form id="form-pessoa" novalidate>
      <label>Nome
        <input type="text" id="nome" placeholder="Ex.: Francisco">
      </label>
      <label>Idade
        <input type="number" id="idade" placeholder="Ex.: 30">
      </label>
      <label>Altura (m)
        <input type="number" id="altura" step="0.01" placeholder="Ex.: 1.70">
      </label>
      <label>Peso (kg)
        <input type="number" id="peso" step="0.1" placeholder="Ex.: 65">
      </label>
      <button type="submit">Salvar</button>
    </form>

    <p id="erro" class="erro" hidden></p>

    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Altura</th>
            <th>Peso</th>
            <th>IMC</th>
            <th>Classificação</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
