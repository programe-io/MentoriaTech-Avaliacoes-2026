<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Você Será Rico?????</title>
  <style>
    #botao {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 20px;
      background-color: white;
      color: white;
      border: none;
      cursor: pointer;
    }
    body {
      background-color: black;
      font-family: Arial, Helvetica, sans-serif;
    
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>
  <button id="botao">SIM!!!!!!!!!!</button>
  <script>
    const botao = document.getElementById("botao");

    botao.addEventListener("mouseover", () => {
      const larguraMax = window.innerWidth - botao.offsetWidth;
      const alturaMax = window.innerHeight - botao.offsetHeight;
      const novaPosicaoX = Math.random() * larguraMax;
      const novaPosicaoY = Math.random() * alturaMax;

      botao.style.left = `${novaPosicaoX}px`;
      botao.style.top = `${novaPosicaoY}px`;
    });
  </script>
<script src="script.js"></script></body>
</html>
<div style="text-align: center;">
    <h1> Você Será Rico??????? </h1>
</div>
