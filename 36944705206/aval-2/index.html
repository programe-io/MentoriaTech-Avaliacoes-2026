<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="app">
    <header>
      <h1>Gerenciador de tarefas</h1>
      <p id="resumo" aria-live="polite"></p>
    </header>

    <form id="form-tarefa" novalidate>
      <label for="titulo">Título</label>
      <input id="titulo" type="text" placeholder="Mínimo de 5 caracteres" autocomplete="off">

      <label for="prioridade">Prioridade</label>
      <select id="prioridade">
        <option value="1">1 – Alta</option>
        <option value="2" selected>2 – Média</option>
        <option value="3">3 – Baixa</option>
      </select>

      <button type="submit">Cadastrar tarefa</button>
    </form>

    <p id="mensagem" role="status" aria-live="polite"></p>

    <ul id="lista" class="lista"></ul>
  </main>
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
