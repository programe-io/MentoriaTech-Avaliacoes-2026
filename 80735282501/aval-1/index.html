<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha (Snake Game)</title>
    <style>
        body {
            background-color: #1e1e24;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .score-container {
            font-size: 1.2rem;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        canvas {
            background-color: #0b0c10;
            border: 4px solid #45f3ff;
            border-radius: 8px;
            box-shadow: 0 0 20px #45f3ff;
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Snake Game</h1>
    <div class="score-container">Pontuação: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="instructions">Use as setas do teclado (← ↑ → ↓) para jogar.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        // Tamanho de cada bloco/quadrado do jogo
        const box = 20;
        
        // Inicialização da cobrinha (começa no meio da tela)
        let snake = [];
        snake[0] = { x: 10 * box, y: 10 * box };

        // Inicialização da comida em uma posição aleatória
        let food = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };

        let score = 0;
        let d = ""; // Direção atual do movimento

        // Ouvinte de eventos do teclado
        document.addEventListener("keydown", direction);

        // Controla a direção evitando que a cobra volte para dentro de si mesma
        function direction(event) {
            if (event.keyCode == 37 && d != "RIGHT") {
                d = "LEFT";
            } else if (event.keyCode == 38 && d != "DOWN") {
                d = "UP";
            } else if (event.keyCode == 39 && d != "LEFT") {
                d = "RIGHT";
            } else if (event.keyCode == 40 && d != "UP") {
                d = "DOWN";
            }
        }

        // Verifica colisão da cabeça com o próprio corpo
        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) {
                    return true;
                }
            }
            return false;
        }

        // Desenha tudo na tela (Função principal do loop)
        function draw() {
            // Limpa o canvas a cada frame
            ctx.fillStyle = "#0b0c10";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenha a cobrinha
            for (let i = 0; i < snake.length; i++) {
                // Cabeça verde claro, corpo verde escuro
                ctx.fillStyle = (i == 0) ? "#45f3ff" : "#00a8cc"; 
                ctx.strokeStyle = "#0b0c10";
                
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            // Desenha a comida (Vermelha)
            ctx.fillStyle = "#ff3838";
            ctx.fillRect(food.x, food.y, box, box);

            // Posição antiga da cabeça
            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            // Calcula o próximo passo baseado na direção
            if (d == "LEFT") snakeX -= box;
            if (d == "UP") snakeY -= box;
            if (d == "RIGHT") snakeX += box;
            if (d == "DOWN") snakeY += box;

            // Se a cobrinha comer a comida
            if (snakeX == food.x && snakeY == food.y) {
                score++;
                scoreElement.innerText = score;
                // Gera uma nova comida
                food = {
                    x: Math.floor(Math.random() * 20) * box,
                    y: Math.floor(Math.random() * 20) * box
                };
                // Não remove a cauda (a cobra cresce)
            } else {
                // Remove o último bloco da cauda para manter o tamanho se não comeu
                snake.pop();
            }

            // Adiciona a nova cabeça no início da lista
            let newHead = {
                x: snakeX,
                y: snakeY
            };

            // Regras de Game Over (Colisão com as paredes ou com o próprio corpo)
            if (snakeX < 0 || snakeX >= canvas.width || 
                snakeY < 0 || snakeY >= canvas.height || 
                collision(newHead, snake)) {
                clearInterval(game);
                alert("Game Over! Sua pontuação final foi: " + score);
                location.reload(); // Recarrega a página para reiniciar o jogo
            }

            snake.unshift(newHead);
        }

        // Executa a função draw a cada 100 milissegundos (Velocidade do jogo)
        let game = setInterval(draw, 100);
    </script>
<script src="script.js"></script></body>
</html>
