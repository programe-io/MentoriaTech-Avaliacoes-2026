<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaliação Online</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background:#f2f2f2;
        margin:0;
        padding:20px;
    }

    .caixa{
        max-width:700px;
        margin:auto;
        background:white;
        padding:30px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
        text-align:center;
        color:#333;
    }

    .pergunta{
        margin-bottom:20px;
    }

    input, textarea{
        width:100%;
        padding:10px;
        margin-top:8px;
        border:1px solid #ccc;
        border-radius:6px;
    }

    button{
        width:100%;
        padding:12px;
        background:#007bff;
        color:white;
        border:none;
        border-radius:6px;
        cursor:pointer;
    }

    button:hover{
        background:#0056b3;
    }
</style>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<div class="caixa">

<h1>Avaliação Escolar</h1>

<form>

<label>Nome do aluno:</label>
<input type="text" required>

<div class="pergunta">
<p>1. O que é HTML?</p>

<label>
<input type="radio" name="q1">
 Linguagem de marcação
</label><br>

<label>
<input type="radio" name="q1">
 Banco de dados
</label><br>

<label>
<input type="radio" name="q1">
 Sistema operacional
</label>

</div>

<div class="pergunta">
<p>2. Para que serve o CSS?</p>

<textarea rows="4"></textarea>

</div>

<div class="pergunta">
<p>3. Qual linguagem adiciona interatividade ao site?</p>

<select>
<option>Escolha</option>
<option>JavaScript</option>
<option>HTML</option>
<option>CSS</option>
</select>

</div>

<button type="submit">
Enviar Avaliação
</button>

</form>

</div>

</body>
</html>
