
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADE - Rede Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>💜 JADE</h1>
    <p>Sua rede social favorita</p>
</header>

<main class="container">

    <aside class="sidebar">

        <input id="pesquisa" placeholder="🔍 Pesquisar pessoas...">

        <h3>MEU STATUS</h3>
        <div class="meu-status">
            <img src="https://randomuser.me/api/portraits/women/44.jpg">
            <div>
                <strong>Meu status</strong>
                <p>Adicionar atualização +</p>
            </div>
        </div>

        <h3>CONTATOS E CONVERSAS</h3>
        <div id="contatos"></div>

    </aside>

    <section class="chat">

        <div class="chat-header">
            <img id="fotoContato" src="">
            <div>
                <strong id="nomeContato">Ana</strong>
                <p id="statusContato">Online</p>
            </div>
        </div>

        <div class="messages" id="mensagens"></div>

        <form id="formMensagem">
            <input
                id="mensagem"
                placeholder="Digite sua mensagem..."
                autocomplete="off"
                required
            >
            <button type="submit">➤</button>
        </form>

    </section>

</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
