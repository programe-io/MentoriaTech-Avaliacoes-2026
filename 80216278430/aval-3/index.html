
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADE - Rede Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="app">

    <header>
        <h1>💜 JADE</h1>
        <span>Conecte-se com quem importa</span>
    </header>

    <main class="container">

        <aside class="sidebar">

            <input type="text" id="pesquisa"
            placeholder="🔍 Pesquisar contatos...">

            <h3>STATUS</h3>

            <div class="status-list">
                <div class="status" onclick="verStatus('Seu status')">
                    <div class="avatar">👤</div>
                    <span>Meu status +</span>
                </div>

                <div class="status" onclick="verStatus('Ana')">
                    <div class="avatar">👩🏻</div>
                    <span>Ana</span>
                </div>

                <div class="status" onclick="verStatus('Lucas')">
                    <div class="avatar">👨🏻</div>
                    <span>Lucas</span>
                </div>

                <div class="status" onclick="verStatus('Julia')">
                    <div class="avatar">👩🏽</div>
                    <span>Julia</span>
                </div>
            </div>

            <h3>CONVERSAS</h3>

            <div id="contatos">

                <div class="contact active" onclick="abrirChat('Ana', '👩🏻')">
                    <div class="avatar">👩🏻</div>
                    <div>
                        <strong>Ana</strong>
                        <p>Oi, tudo bem?</p>
                    </div>
                </div>

                <div class="contact" onclick="abrirChat('Lucas', '👨🏻')">
                    <div class="avatar">👨🏻</div>
                    <div>
                        <strong>Lucas</strong>
                        <p>Vamos sair hoje?</p>
                    </div>
                </div>

                <div class="contact" onclick="abrirChat('Julia', '👩🏽')">
                    <div class="avatar">👩🏽</div>
                    <div>
                        <strong>Julia</strong>
                        <p>Adorei a foto!</p>
                    </div>
                </div>

                <div class="contact" onclick="abrirChat('Pedro', '👦🏻')">
                    <div class="avatar">👦🏻</div>
                    <div>
                        <strong>Pedro</strong>
                        <p>Bom dia!</p>
                    </div>
                </div>

                <div class="contact" onclick="abrirChat('Mariana', '👩🏾')">
                    <div class="avatar">👩🏾</div>
                    <div>
                        <strong>Mariana</strong>
                        <p>Até amanhã ❤️</p>
                    </div>
                </div>

                <div class="contact" onclick="abrirChat('Gabriel', '🧑🏻')">
                    <div class="avatar">🧑🏻</div>
                    <div>
                        <strong>Gabriel</strong>
                        <p>Me chama depois!</p>
                    </div>
                </div>

            </div>
        </aside>

        <section class="chat">

            <div class="chat-header">
                <div class="avatar" id="fotoContato">👩🏻</div>
                <div>
                    <strong id="nomeContato">Ana</strong>
                    <p>Online</p>
                </div>
            </div>

            <div class="messages" id="mensagens">
            </div>

            <form id="formMensagem">
                <input
                    type="text"
                    id="mensagem"
                    placeholder="Digite sua mensagem..."
                    autocomplete="off"
                    required
                >
                <button type="submit">➤</button>
            </form>

        </section>

    </main>

</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
