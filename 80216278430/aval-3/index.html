
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUNIS - Mensagens</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">

    <aside class="sidebar">
        <h1>💬 NUNIS</h1>

        <input type="text" id="pesquisa"
        placeholder="Pesquisar contatos...">

        <div class="contato" onclick="abrirChat('Ana')">
            <span>👩</span>
            <div><strong>Ana</strong><p>Oi, tudo bem?</p></div>
        </div>

        <div class="contato" onclick="abrirChat('Pedro')">
            <span>👨</span>
            <div><strong>Pedro</strong><p>Vamos conversar?</p></div>
        </div>

        <div class="contato" onclick="abrirChat('Maria')">
            <span>👩</span>
            <div><strong>Maria</strong><p>Até amanhã!</p></div>
        </div>

        <div class="contato" onclick="abrirChat('Lucas')">
            <span>👨</span>
            <div><strong>Lucas</strong><p>Bom dia!</p></div>
        </div>
    </aside>

    <main class="chat">
        <header id="nomeContato">
            Selecione uma conversa
        </header>

        <div id="mensagens" class="mensagens">
            <h2>Bem-vindo ao NUNIS!</h2>
            <p>Escolha um contato para começar.</p>
        </div>

        <div class="entrada">
            <input type="text" id="mensagem"
            placeholder="Digite uma mensagem...">

            <button onclick="enviarMensagem()">Enviar ➤</button>
        </div>
    </main>

</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
