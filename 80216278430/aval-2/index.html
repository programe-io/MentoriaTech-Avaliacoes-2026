
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUNIS - Rede Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>NUNIS</h1>
    <input type="text" placeholder="Pesquisar">
    <nav>
        <a href="#">Início</a>
        <a href="#perfil">Perfil</a>
    </nav>
</header>

<main>
    <section class="perfil" id="perfil">
        <img src="https://i.pravatar.cc/150?img=47" alt="Foto de perfil">
        <div>
            <h2>@nunis</h2>
            <p>Bem-vindo ao meu mundo 💜</p>
            <p><strong id="postCount">2</strong> publicações | 
            <strong>350</strong> seguidores | 
            <strong>200</strong> seguindo</p>
        </div>
    </section>

    <section class="stories">
        <div><img src="https://i.pravatar.cc/80?img=12"><span>Amigos</span></div>
        <div><img src="https://i.pravatar.cc/80?img=32"><span>Viagens</span></div>
        <div><img src="https://i.pravatar.cc/80?img=25"><span>Momentos</span></div>
        <div><img src="https://i.pravatar.cc/80?img=45"><span>Fotos</span></div>
    </section>

    <section class="publicar">
        <h3>Compartilhe um momento 💜</h3>
        <input type="text" id="legenda" placeholder="Escreva uma legenda...">
        <input type="url" id="foto" placeholder="Cole o link de uma imagem">
        <button onclick="publicar()">Publicar</button>
    </section>

    <section class="feed" id="feed">
        <article class="post">
            <h3>@nunis</h3>
            <img src="https://picsum.photos/id/1011/600/400" alt="Paisagem">
            <div class="acoes">
                <button onclick="curtir(this)">♡ Curtir</button>
                <button onclick="comentar(this)">💬 Comentar</button>
            </div>
            <p class="likes">0 curtidas</p>
            <p>Vivendo momentos especiais! 💜</p>
        </article>

        <article class="post">
            <h3>@nunis</h3>
            <img src="https://picsum.photos/id/1015/600/400" alt="Natureza">
            <div class="acoes">
                <button onclick="curtir(this)">♡ Curtir</button>
                <button onclick="comentar(this)">💬 Comentar</button>
            </div>
            <p class="likes">0 curtidas</p>
            <p>A vida é feita de momentos! ✨</p>
        </article>
    </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
