<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="bg-gray-50 text-gray-900 antialiased">

    <div class="flex min-h-screen justify-center">
        
        <!-- BARRA LATERAL (Desktop) -->
        <aside class="hidden md:flex flex-col justify-between w-64 border-r border-gray-200 p-6 fixed h-screen bg-white z-50">
            <div>
                <!-- Logo -->
                <h1 class="text-2xl font-bold tracking-tight mb-8 font-serif italic text-black">Instagram</h1>
                
                <!-- Navegação -->
                <nav class="space-y-2">
                    <a href="#" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 font-semibold transition">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                        Início
                    </a>
                    <a href="#" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        Pesquisa
                    </a>
                    <a href="#" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        Explorar
                    </a>
                    <a href="#" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                        Reels
                    </a>
                    <a href="#" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        Mensagens
                    </a>
                    <a href="#" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        Notificações
                    </a>
                    <a href="#" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                        Criar
                    </a>
                </nav>
            </div>
            
            <!-- Perfil na Sidebar -->
            <div class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 cursor-pointer">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Perfil" class="w-8 h-8 rounded-full object-cover">
                <div class="text-sm">
                    <p class="font-bold">seu_usuario</p>
                    <p class="text-gray-500">Seu Nome</p>
                </div>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL (Feed + Stories) -->
        <main class="w-full max-w-xl md:ml-64 px-2 md:px-8 py-6 flex flex-col gap-6">
            
            <!-- Stories -->
            <section class="bg-white border border-gray-200 rounded-xl p-4 flex gap-4 overflow-x-auto no-scrollbar">
                <!-- Story Item -->
                <div class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0">
                    <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80" alt="Story" class="w-full h-full rounded-full object-cover border-2 border-white">
                    </div>
                    <span class="text-xs text-gray-600 truncate w-16 text-center">carlos_dev</span>
                </div>
                <div class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0">
                    <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80" alt="Story" class="w-full h-full rounded-full object-cover border-2 border-white">
                    </div>
                    <span class="text-xs text-gray-600 truncate w-16 text-center">ana_silva</span>
                </div>
                <div class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0">
                    <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600">
                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=150&q=80" alt="Story" class="w-full h-full rounded-full object-cover border-2 border-white">
                    </div>
                    <span class="text-xs text-gray-600 truncate w-16 text-center">lucas_tech</span>
                </div>
            </section>

            <!-- FEED DE POSTS (Gerado dinamicamente pelo JavaScript) -->
            <div id="feed-container" class="flex flex-col gap-6">
                <!-- Posts injetados via JS -->
            </div>

        </main>

        <!-- BARRA LATERAL DIREITA (Sugestões) -->
        <aside class="hidden lg:block w-80 p-6 sticky h-screen top-0">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Perfil" class="w-12 h-12 rounded-full object-cover">
                    <div>
                        <p class="font-bold text-sm">seu_usuario</p>
                        <p class="text-gray-500 text-xs">Seu Nome</p>
                    </div>
                </div>
                <button class="text-blue-500 text-xs font-bold hover:text-blue-700">Mudar</button>
            </div>

            <div class="flex justify-between items-center mb-3">
                <span class="text-gray-500 text-sm font-semibold">Sugestões para você</span>
                <button class="text-xs font-bold text-gray-900 hover:text-gray-600">Ver tudo</button>
            </div>

            <!-- Lista de Sugestões -->
            <div class="flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=150&q=80" class="w-8 h-8 rounded-full object-cover">
                        <div class="text-xs">
                            <p class="font-bold">julia_design</p>
                            <p class="text-gray-500">Seguido(a) por carlos_dev</p>
                        </div>
                    </div>
                    <button class="text-blue-500 text-xs font-bold hover:text-blue-700">Seguir</button>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=150&q=80" class="w-8 h-8 rounded-full object-cover">
                        <div class="text-xs">
                            <p class="font-bold">marcos_dev</p>
                            <p class="text-gray-500">Novo no Instagram</p>
                        </div>
                    </div>
                    <button class="text-blue-500 text-xs font-bold hover:text-blue-700">Seguir</button>
                </div>
            </div>

            <footer class="mt-8 text-xs text-gray-400 space-y-2">
                <p>&copy; 2026 INSTAGRAM CLONE FROM META</p>
            </footer>
        </aside>

    </div>

    <!-- Navegação Inferior para Mobile -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex justify-around p-3 z-50">
        <a href="#" class="text-black"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
        <a href="#" class="text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></a>
        <a href="#" class="text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></a>
        <a href="#" class="text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></a>
        <a href="#" class="text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
    </nav>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
