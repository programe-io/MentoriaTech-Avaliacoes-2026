<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <div class="container header-container">
            <h1 class="logo">MiniFeed</h1>
            <nav class="nav">
                <a href="#" class="nav-link">Início</a>
                <a href="#" class="nav-link">Notificações</a>
                <a href="#" class="nav-link">Perfil</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container main-content">
        
        <!-- Caixa de Nova Publicação -->
        <section class="create-post-card">
            <h3>Criar Publicação</h3>
            <form id="post-form">
                <textarea id="post-text" placeholder="No que você está pensando hoje?" rows="3" required></textarea>
                <input type="url" id="post-image" placeholder="URL de uma imagem (opcional)">
                <button type="submit" class="btn">Publicar</button>
            </form>
        </section>

        <!-- Feed de Postagens -->
        <section class="feed-section">
            <h3 class="section-title">Feed Recente</h3>
            <div id="feed-container" class="feed-container">
                <!-- Os posts serão injetados dinamicamente aqui pelo JavaScript -->
            </div>
        </section>

    </main>

    <!-- Rodapé -->
    <footer class="footer">
        <div class="container footer-container">
            <p>&copy; 2026 MiniFeed. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
