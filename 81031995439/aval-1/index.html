<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maria Eduarda</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      animation: aparecer 0.8s ease;
    }

    @keyframes aparecer {
      from {
        transform: scale(0.9);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    h1 {
      margin: 10px 0;
      color: #333;
    }

    p {
      color: #666;
    }

    button {
      margin-top: 15px;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #6c5ce7;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #4e3fcf;
    }

    .info {
      margin-top: 15px;
      display: none;
      font-size: 14px;
      color: #444;
      animation: fade 0.5s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .foto {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ddd;
      margin: 0 auto 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

  <div class="card">
    <div class="foto">👩</div>

    <h1>Maria Eduarda</h1>
    <p>Perfil pessoal interativo ✨</p>

    <button onclick="mostrarInfo()">Ver informações</button>

    <div class="info" id="info">
      <p>📍 Cidade: Teresina</p>
      <p>🎂 Idade: 16 anos</p>
      <p>🎧 Hobbies: música, redes sociais e passeios</p>
      <p>💖 Status: feliz e evoluindo</p>
    </div>
  </div>

  <script>
    function mostrarInfo() {
      const info = document.getElementById("info");

      if (info.style.display === "block") {
        info.style.display = "none";
      } else {
        info.style.display = "block";
      }
    }
  </script>

<script src="script.js"></script></body>
</html>
