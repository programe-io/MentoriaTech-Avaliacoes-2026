<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Online</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <div class="header-box">
        <h1>🛒 <span>Mercado Online</span></h1>
        <p>Os melhores preços da internet</p>
    </div>
</header>

<nav>
    <div class="nav-box">
        <a href="#"><span>Início</span></a>
        <a href="#"><span>Produtos</span></a>
        <a href="#"><span>Carrinho</span></a>
    </div>
</nav>

<main>

    <div class="main-box">

        <aside>
            <div class="carrinho-box">
                <h2>🧺 <span>Carrinho</span></h2>
                <ul id="carrinho"></ul>
                <p>Total: <span id="total">R$ 0</span></p>

                <div class="btn-box">
                    <button onclick="limpar()">
                        <span>Limpar Carrinho</span>
                    </button>
                </div>
            </div>
        </aside>

        <article>

            <section class="produtos">

                <div class="produto">
                    <img src="https://images.unsplash.com/photo-1586201375761-83865001e8ac?w=400" alt="Arroz">
                    <h3><span>Arroz 5kg</span></h3>
                    <p><span>R$ 25,00</span></p>
                    <button onclick="adicionar('Arroz 5kg', 25)">
                        <span>Adicionar</span>
                    </button>
                </div>

                <div class="produto">
                    <img src="https://images.unsplash.com/photo-1604908177522-040a8d7a3b05?w=400" alt="Feijão">
                    <h3><span>Feijão 1kg</span></h3>
                    <p><span>R$ 8,00</span></p>
                    <button onclick="adicionar('Feijão 1kg', 8)">
                        <span>Adicionar</span>
                    </button>
                </div>

                <div class="produto">
                    <img src="https://images.unsplash.com/photo-1585238342028-4e6a0f3b8f3d?w=400" alt="Leite">
                    <h3><span>Leite 1L</span></h3>
                    <p><span>R$ 6,00</span></p>
                    <button onclick="adicionar('Leite 1L', 6)">
                        <span>Adicionar</span>
                    </button>
                </div>

            </section>

        </article>

    </div>

</main>

<footer>
    <div class="footer-box">
        <p>© <span>2026</span> Mercado Online</p>
    </div>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
