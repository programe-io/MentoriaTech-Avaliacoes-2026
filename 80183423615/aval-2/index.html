<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área de Entrega - Avaliações</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <h1>Área de Entrega - Avaliações</h1>
      <p>Preencha os dados abaixo, revise seu código e envie sua solução para o professor.</p>
    </header>

    <form id="form-entrega">
      <div class="campo">
        <label for="aluno">Nome do Aluno:</label>
        <input type="text" id="aluno" placeholder="Digite seu nome completo" required>
      </div>

      <div class="campo">
        <label for="atividade">Selecione a Avaliação:</label>
        <select id="atividade" required>
          <option value="">Escolha uma opção...</option>
          <option value="Avaliação 01 - Estrutura HTML">Avaliação 01 - Estrutura HTML</option>
          <option value="Avaliação 02 - Estilização CSS">Avaliação 02 - Estilização CSS</option>
          <option value="Avaliação 03 - Lógica com JavaScript">Avaliação 03 - Lógica com JavaScript</option>
        </select>
      </div>

      <div class="campo">
        <label for="link-repositorio">Link do Projeto ou Código:</label>
        <input type="url" id="link-repositorio" placeholder="https://github.com" required>
      </div>

      <div class="campo">
        <label for="observacoes">Observações para o Professor:</label>
        <textarea id="observacoes" rows="3" placeholder="Descreva o que foi desenvolvido..."></textarea>
      </div>

      <button type="submit" id="btn-enviar">Publicar e Enviar Avaliação</button>
    </form>

    <div id="resultado" class="oculto"></div>
  </div>
<script src="script.js"></script></body>
</html>$0
