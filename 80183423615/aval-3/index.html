<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
  <header class="cabecalho">
    <div class="badge">Portal do Aluno</div>
    <h1>Área de Entrega - Avaliações</h1>
    <p>Desenvolva sua solução, teste na pré-visualização e envie para o professor.</p>
  </header>

  <main class="painel-principal">
    <section class="cartao-formulario">
      <h2>Dados da Entrega</h2>
      <form id="formEntrega">
        <div class="campo">
          <label for="nomeAluno">Nome Completo:</label>
          <input type="text" id="nomeAluno" placeholder="Ex: Maria Silva" required>
        </div>

        <div class="campo">
          <label for="disciplina">Disciplina / Módulo:</label>
          <select id="disciplina" required>
            <option value="">Selecione a matéria...</option>
            <option value="Desenvolvimento Web I">Desenvolvimento Web I</option>
            <option value="Lógica de Programação">Lógica de Programação</option>
            <option value="JavaScript Avançado">JavaScript Avançado</option>
          </select>
        </div>

        <div class="campo">
          <label for="linkRepo">Link do Repositório (GitHub):</label>
          <input type="url" id="linkRepo" placeholder="https://github.com" required>
        </div>

        <div class="campo">
          <label for="observacoes">Observações para o Professor:</label>
          <textarea id="observacoes" rows="3" placeholder="Descreva brevemente o que foi feito..."></textarea>
        </div>

        <button type="submit" class="btn-enviar">Publicar e Enviar Avaliação</button>
      </form>
    </section>

    <section class="cartao-historico">
      <h2>Entregas Realizadas (<span id="contador">0</span>)</h2>
      <div id="listaEntregas" class="lista-entregas">
        <p class="vazio">Nenhuma avaliação enviada ainda.</p>
      </div>
    </section>
  </main>
</div>

</html>
