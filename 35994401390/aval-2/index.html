<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas Organizadas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="wrapper">
        <header class="topo">
            <div>
                <h1>🗂️ Minhas Tarefas</h1>
                <p id="progresso-texto">0 de 0 concluídas</p>
            </div>
            <button type="button" id="btn-limpar-concluidas" class="btn-limpar">
                Limpar concluídas
            </button>
        </header>

        <div class="barra-progresso">
            <div id="barra-fill"></div>
        </div>

        <form id="form-task" class="form-task">
            <input type="text" id="task-titulo" placeholder="Título da tarefa..." required>
            <select id="task-prio">
                <option value="baixa">Baixa</option>
                <option value="media" selected>Média</option>
                <option value="alta">Alta</option>
            </select>
            <input type="date" id="task-data">
            <button type="submit" id="btn-task-submit">Criar</button>
        </form>

        <div class="barra-filtros">
            <select id="filtro-status">
                <option value="todas">Status: Todas</option>
                <option value="abertas">Status: Em aberto</option>
                <option value="feitas">Status: Concluídas</option>
            </select>

            <select id="ordenacao">
                <option value="criacao">Ordenar: Mais recentes</option>
                <option value="prioridade">Ordenar: Maior prioridade</option>
                <option value="prazo">Ordenar: Prazo mais próximo</option>
            </select>
        </div>

        <ul id="lista-task" class="lista-task"></ul>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
