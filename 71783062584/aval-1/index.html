<!DOCTYPE html>
<html><head></head>
<body>
  <h1>Calculadora</h1>

  <input id="nl" type="number">
  <input id="n2" type="number">

  <button onclick="somar ()">Somar</button>

  <p id="resultado"></p>

  <script>
    function somar() {
      let a = Number (document.getElementById("nl").value);
      let b = Number (document.getElementById("n2").value);
      document.getElementById("resultado").innerText a + b;

    }
   </script>
</body>
</html>
