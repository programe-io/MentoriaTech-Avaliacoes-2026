
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Gerenciamento de Produtos</h1>
        <p>Sistema de controle de produtos</p>
    </header>

    <main>

        <section class="painel">
            <h2>Cadastrar Produto</h2>

            <form id="formCadastro">
                <input type="text" id="descricao"
                    placeholder="Descrição do produto" required>

                <input type="number" id="quantidade"
                    placeholder="Quantidade" required>

                <input type="number" id="valor"
                    placeholder="Valor" min="0" step="0.01" required>

                <button type="submit">Cadastrar</button>
            </form>
        </section>

        <section class="painel">
            <h2>Atualizar Valor</h2>

            <form id="formValor">
                <input type="number" id="codigoValor"
                    placeholder="Código do produto" required>

                <input type="number" id="novoValor"
                    placeholder="Novo valor" min="0" step="0.01" required>

                <button type="submit">Atualizar Valor</button>
            </form>
        </section>

        <section class="painel">
            <h2>Atualizar Quantidade</h2>

            <form id="formQuantidade">
                <input type="number" id="codigoQuantidade"
                    placeholder="Código do produto" required>

                <input type="number" id="novaQuantidade"
                    placeholder="Nova quantidade" min="1" required>

                <button type="submit">Adicionar Quantidade</button>
            </form>
        </section>

        <section class="painel">
            <h2>Lista de Produtos</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody id="tabelaProdutos">
                </tbody>
            </table>

        </section>

        <p id="mensagem"></p>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
