<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header>
    <div class="logo">Mini Instagram 📸</div>

    <button class="theme" onclick="toggleTheme()">
        🌙 Modo escuro
    </button>
</header>

<main>

    <section class="new-post">
        <h3>Crie sua publicação ✨</h3>

        <textarea id="postText"
        placeholder="O que você está pensando?"
        rows="3"></textarea>

        <button class="publish" onclick="createPost()">
            Publicar
        </button>
    </section>

    <section id="feed"></section>

</main>

<script>

// PUBLICAÇÕES ALEATÓRIAS

const posts = [
    {
        text: "A vida fica mais bonita quando aprendemos a aproveitar os pequenos momentos! ❤️",
        image: "https://picsum.photos/id/1011/600/400"
    },
    {
        text: "Um lugar bonito para esquecer os problemas e aproveitar a vida! 🌴",
        image: "https://picsum.photos/id/1018/600/400"
    },
    {
        text: "Nunca deixe de acreditar nos seus sonhos! ✨",
        image: "https://picsum.photos/id/1015/600/400"
    },
    {
        text: "Que hoje seja um dia cheio de coisas boas! ☀️",
        image: "https://picsum.photos/id/1025/600/400"
    },
    {
        text: "A natureza sempre encontra uma maneira de nos surpreender! 🌿",
        image: "https://picsum.photos/id/1043/600/400"
    },
    {
        text: "Colecionando momentos e boas lembranças! 📸",
        image: "https://picsum.photos/id/1039/600/400"
    }
];

// MODO ESCURO E CLARO

function toggleTheme() {
    document.body.classList.toggle("dark");

    const dark = document.body.classList.contains("dark");

    document.querySelector(".theme").textContent =
        dark ? "☀️ Modo claro" : "🌙 Modo escuro";
}

// CRIAR PUBLICAÇÃO

function addPost(text, image = "") {
    const post = document.createElement("article");
    post.className = "post";

    const paragraph = document.createElement("p");
    paragraph.className = "post-text";
    paragraph.textContent = text;

    post.appendChild(paragraph);

    if (image) {
        const img = document.createElement("img");
        img.className = "post-image";
        img.src = image;
        img.alt = "Imagem da publicação";
        post.appendChild(img);
    }

    const actions = document.createElement("div");
    actions.className = "actions";

    actions.innerHTML = `
        <button class="like" onclick="likePost(this)">
            ♡ Curtir <span>0</span>
        </button>

        <button onclick="focusComment(this)">
            💬 Comentar
        </button>

        <button onclick="sharePost(this)">
            📤 Compartilhar
        </button>
    `;

    const comments = document.createElement("div");
    comments.className = "comments";

    comments.innerHTML = `
        <div class="comment-list"></div>

        <div class="comment-input">
            <input type="text"
            placeholder="Escreva um comentário...">

            <button onclick="addComment(this)">
                Enviar
            </button>
        </div>
    `;

    post.appendChild(actions);
    post.appendChild(comments);

    document.getElementById("feed").prepend(post);
}

// CARREGAR PUBLICAÇÕES ALEATÓRIAS

function loadRandomPosts() {
    const shuffled = [...posts].sort(() => Math.random() - 0.5);

    shuffled.forEach(post => {
        addPost(post.text, post.image);
    });
}

// CURTIR

function likePost(button) {
    const count = button.querySelector("span");
    let likes = Number(count.textContent);

    if (button.classList.contains("active")) {
        likes--;
        button.classList.remove("active");
        button.innerHTML = `♡ Curtir <span>${likes}</span>`;
    } else {
        likes++;
        button.classList.add("active");
        button.innerHTML = `♥ Curtido <span>${likes}</span>`;
    }
}

// COMENTAR

function focusComment(button) {
    button.closest(".post")
    .querySelector(".comment-input input").focus();
}

function addComment(button) {
    const post = button.closest(".post");
    const input = post.querySelector(".comment-input input");
    const list = post.querySelector(".comment-list");

    const text = input.value.trim();

    if (!text) {
        alert("Digite um comentário!");
        return;
    }

    const comment = document.createElement("div");
    comment.className = "comment";
    comment.textContent = "💬 " + text;

    list.appendChild(comment);
    input.value = "";
}

// COMPARTILHAR

function sharePost(button) {
    const post = button.closest(".post");
    const text = post.querySelector(".post-text").textContent;

    if (navigator.share) {
        navigator.share({
            title: "Mini Instagram",
            text: text
        }).catch(() => {});
    } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text)
        .then(() => alert("Publicação copiada!"));
    } else {
        alert(text);
    }
}

// NOVA PUBLICAÇÃO

function createPost() {
    const input = document.getElementById("postText");
    const text = input.value.trim();

    if (!text) {
        alert("Escreva alguma coisa!");
        return;
    }

    addPost(text);
    input.value = "";
}

// INICIAR FEED

loadRandomPosts();

</script>

</body>
</html>

  
  
</body>
</html>
