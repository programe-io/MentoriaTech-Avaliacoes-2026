<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>📦 Controle de Estoque</h1>
            <p>Gerencie seus produtos, quantidades e valores em tempo real</p>
        </header>

        <!-- Cards de Resumo -->
        <section class="dashboard">
            <div class="card">
                <h3>Total de Produtos</h3>
                <p id="total-produtos">0</p>
            </div>
            <div class="card">
                <h3>Unidades em Estoque</h3>
                <p id="total-unidades">0</p>
            </div>
            <div class="card">
                <h3>Valor Total</h3>
                <p id="valor-total">R$ 0,00</p>
            </div>
            <div class="card alerta">
                <h3>Estoque Baixo (&lt; 5)</h3>
                <p id="estoque-baixo">0</p>
            </div>
        </section>

        <!-- Formulário de Cadastro -->
        <section class="form-section">
            <h2>Adicionar Novo Produto</h2>
            <form id="form-produto">
                <input type="text" id="codigo" placeholder="Código (ex: PRD01)" required>
                <input type="text" id="nome" placeholder="Nome do Produto" required>
                <input type="text" id="categoria" placeholder="Categoria (ex: Eletrônicos)" required>
                <input type="number" id="quantidade" placeholder="Quantidade" min="0" required>
                <input type="number" id="preco" placeholder="Preço Unitário (R$)" step="0.01" min="0" required>
                <button type="submit" class="btn-add">Cadastrar</button>
            </form>
        </section>

        <!-- Barra de Pesquisa e Tabela -->
        <section class="lista-section">
            <div class="lista-header">
                <h2>Produtos Cadastrados</h2>
                <input type="text" id="busca" placeholder="🔍 Buscar por nome, código ou categoria...">
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Preço Unit.</th>
                            <th>Subtotal</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos">
                        <!-- Os produtos serão inseridos aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
