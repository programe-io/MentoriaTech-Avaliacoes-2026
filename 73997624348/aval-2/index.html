<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>✅ Gerenciador de Tarefas</h1>
            <p>Organize suas atividades diárias com prioridades</p>
        </header>

        <!-- Resumo de Progresso -->
        <section class="stats">
            <div class="stat-box">
                <span id="total-tarefas">0</span>
                <small>Total</small>
            </div>
            <div class="stat-box pendentes">
                <span id="tarefas-pendentes">0</span>
                <small>Pendentes</small>
            </div>
            <div class="stat-box concluidas">
                <span id="tarefas-concluidas">0</span>
                <small>Concluídas</small>
            </div>
        </section>

        <!-- Formulário de Nova Tarefa -->
        <form id="form-tarefa">
            <input type="text" id="titulo-tarefa" placeholder="O que precisa ser feito?" required>
            <select id="prioridade-tarefa">
                <option value="baixa">Prioridade Baixa</option>
                <option value="media" selected>Prioridade Média</option>
                <option value="alta">Prioridade Alta</option>
            </select>
            <input type="date" id="data-tarefa">
            <button type="submit" class="btn-add">Adicionar</button>
        </form>

        <!-- Barra de Filtros -->
        <div class="filtros">
            <div class="btn-group">
                <button class="filtro-btn active" data-filtro="todas">Todas</button>
                <button class="filtro-btn" data-filtro="pendentes">Pendentes</button>
                <button class="filtro-btn" data-filtro="concluidas">Concluídas</button>
            </div>
            <button id="limpar-concluidas" class="btn-limpar">Limpar Concluídas</button>
        </div>

        <!-- Lista de Tarefas -->
        <ul id="lista-tarefas" class="lista-tarefas">
            <!-- Tarefas inseridas via JavaScript -->
        </ul>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
