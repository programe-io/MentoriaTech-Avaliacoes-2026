<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ Controle de IMC</h1>
            <p>Calcule seu Índice de Massa Corporal e acompanhe sua evolução</p>
        </header>

        <main class="grid-principal">
            <!-- Formulário de Cálculo -->
            <section class="card">
                <h2>Nova Medição</h2>
                <form id="form-imc">
                    <div class="input-group">
                        <label for="nome">Nome / Identificação</label>
                        <input type="text" id="nome" placeholder="Ex: João Silva" required>
                    </div>

                    <div class="row">
                        <div class="input-group">
                            <label for="peso">Peso (kg)</label>
                            <input type="number" id="peso" placeholder="Ex: 75.5" step="0.1" min="1" max="500" required>
                        </div>

                        <div class="input-group">
                            <label for="altura">Altura (m)</label>
                            <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01" min="0.5" max="2.5" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-calcular">Calcular e Salvar</button>
                </form>
            </section>

            <!-- Resultado Atual -->
            <section class="card resultado-card" id="box-resultado">
                <h2>Resultado Atual</h2>
                <div id="resultado-conteudo" class="resultado-vazio">
                    <p>Preencha os dados ao lado para visualizar o seu IMC e sua faixa de peso ideal.</p>
                </div>
            </section>
        </main>

        <!-- Tabela de Histórico -->
        <section class="card historico-section">
            <div class="historico-header">
                <h2>Histórico de Medições</h2>
                <button id="btn-limpar" class="btn-limpar" onclick="limparHistorico()">Limpar Histórico</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Nome</th>
                            <th>Peso</th>
                            <th>Altura</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-historico">
                        <!-- Registros inseridos via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
