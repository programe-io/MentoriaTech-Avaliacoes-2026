<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Completo</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <h1>Meu Site Completo</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
    </nav>
</header>

<main>

<section>
    <h2>Seção Principal</h2>
    <p>Texto normal com <strong>negrito</strong> e <em>itálico</em>.</p>
</section>

<article>
    <h3>Artigo</h3>
    <p>Exemplo de artigo dentro do HTML.</p>
</article>

<aside>
    <p>Conteúdo lateral (aside)</p>
</aside>

<div>
    <span>Exemplo de span dentro de div</span>
</div>

<figure>
    <img src="https://via.placeholder.com/150" alt="Imagem">
    <figcaption>Legenda da imagem</figcaption>
</figure>

<audio controls>
    <source src="audio.mp3" type="audio/mpeg">
</audio>

<video width="300" controls>
    <source src="video.mp4" type="video/mp4">
</video>

<form id="formulario">
    <label>Nome:</label>
    <input type="text" id="nome">

    <label>Idade:</label>
    <input type="number" id="idade">

    <button type="submit">Enviar</button>
</form>

<ul>
    <li>Item 1</li>
    <li>Item 2</li>
</ul>

<ol>
    <li>Primeiro</li>
    <li>Segundo</li>
</ol>

<table border="1">
    <tr>
        <th>Nome</th>
        <th>Idade</th>
    </tr>
    <tr>
        <td>João</td>
        <td>15</td>
    </tr>
</table>

<footer>
    <p>Rodapé do site</p>
</footer>

</main>

<script src="script.js"></script></body>
</html>
