
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Loja de Calções</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat {
      width: 100%;
      max-width: 420px;
      height: 600px;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 5px 25px #0002;
    }

    .header {
      background: #166534;
      color: white;
      padding: 20px;
    }

    .header h2 {
      margin: 0 0 7px;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: #dcfce7;
    }

    #mensagens {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mensagem {
      padding: 12px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .loja {
      background: #eeeeee;
      align-self: flex-start;
    }

    .cliente {
      background: #dcfce7;
      align-self: flex-end;
    }

    .produtos {
      padding: 12px;
      display: grid;
      gap: 8px;
      border-top: 1px solid #eee;
    }

    .produtos button {
      border: none;
      background: #f0fdf4;
      color: #166534;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }

    .produtos button:hover {
      background: #dcfce7;
    }

    .entrada {
      display: flex;
      padding: 12px;
      gap: 8px;
      border-top: 1px solid #ddd;
    }

    .entrada input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline-color: #166534;
    }

    .entrada button {
      background: #166534;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 0 16px;
      cursor: pointer;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

  <div class="chat">
    <div class="header">
      <h2>🩳 Loja de Calções</h2>
      <p>● Atendimento online</p>
    </div>

    <div id="mensagens" aria-live="polite">
      <div class="mensagem loja">
        Olá! 👋 Bem-vindo à nossa loja!
        Quer conhecer os nossos calções?
      </div>
    </div>

    <div class="produtos">
      <button onclick="comprar('Calção desportivo', 39.90)">
        🩳 Calção desportivo — R$ 39,90
      </button>

      <button onclick="comprar('Calção casual', 49.90)">
        👖 Calção casual — R$ 49,90
      </button>

      <button onclick="comprar('Calção premium', 69.90)">
        ⭐ Calção premium — R$ 69,90
      </button>
    </div>

    <form class="entrada" id="formulario">
      <input id="texto"
        type="text"
        placeholder="Escreva sua mensagem..."
        autocomplete="off"
        required>

      <button type="submit">Enviar</button>
    </form>
  </div>

  <script>
    const mensagens = document.getElementById("mensagens");
    const formulario = document.getElementById("formulario");
    const texto = document.getElementById("texto");

    function adicionarMensagem(conteudo, tipo) {
      const div = document.createElement("div");
      div.className = "mensagem " + tipo;
      div.textContent = conteudo;
      mensagens.appendChild(div);
      mensagens.scrollTop = mensagens.scrollHeight;
    }

    function responder(mensagem) {
      const pergunta = mensagem.toLowerCase();

      if (pergunta.includes("preço") ||
          pergunta.includes("preco")) {
        return "Os nossos calções custam entre R$ 39,90 e R$ 69,90. Escolha um modelo para comprar!";
      }

      if (pergunta.includes("tamanho")) {
        return "Temos opções de tamanhos P, M, G e GG. Confirme a disponibilidade antes de comprar.";
      }

      if (pergunta.includes("entrega") ||
          pergunta.includes("frete")) {
        return "Fazemos pedidos para entrega! O valor e o prazo do frete precisam ser confirmados com a loja.";
      }

      if (pergunta.includes("oi") ||
          pergunta.includes("olá") ||
          pergunta.includes("ola")) {
        return "Olá! 😊 Seja bem-vindo! Quer ver os nossos modelos de calções?";
      }

      if (pergunta.includes("comprar")) {
        return "Escolha um dos modelos acima para iniciar o seu pedido.";
      }

      return "Obrigado pela mensagem! 😊 Escolha um dos nossos calções acima ou pergunte sobre preços, tamanhos e entrega.";
    }

    formulario.addEventListener("submit", function(event) {
      event.preventDefault();

      const mensagem = texto.value.trim();
      if (!mensagem) return;

      adicionarMensagem(mensagem, "cliente");
      texto.value = "";

      const resposta = responder(mensagem);
      adicionarMensagem(resposta, "loja");
    });

    function comprar(nome, preco) {
      const valor = preco.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });

      adicionarMensagem("Quero comprar: " + nome, "cliente");

      adicionarMensagem(
        "Ótima escolha! 🩳 Você escolheu " + nome +
        ", por " + valor +
        ". Para continuar, informe o tamanho desejado.",
        "loja"
      );
    }
  </script>

<script src="script.js"></script></body>
</html>
