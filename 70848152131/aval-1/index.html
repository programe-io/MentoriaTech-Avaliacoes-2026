<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Minha Lista de Tarefas</title>
    <!-- Ligação para o ficheiro de estilos CSS separado -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h2>Lista de Tarefas</h2>
        <div class="input-box">
            <input type="text" id="taskInput" placeholder="Escreva uma nova tarefa...">
            <button id="addBtn">Adicionar</button>
        </div>
        <ul id="taskList">
            <!-- As tarefas inseridas vão aparecer aqui dentro -->
        </ul>
    </div>

    <!-- Ligação para o ficheiro JavaScript separado (no final do body) -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
