<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📋 Gestor de Tarefas</h1>
        
        <!-- Formulário de Cadastro -->
        <form id="task-form" class="card">
            <h2>Nova Tarefa</h2>
            <div class="form-group">
                <label for="task-title">Título da Tarefa</label>
                <input type="text" id="task-title" placeholder="Mínimo 5 caracteres" required>
                <small class="error-msg" id="title-error"></small>
            </div>
            
            <div class="form-group">
                <label for="task-priority">Prioridade</label>
                <select id="task-priority" required>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>
            </div>
            
            <button type="submit" class="btn-primary">Cadastrar Tarefa</button>
        </form>

        <!-- Lista de Tarefas -->
        <div class="card">
            <h2>Tarefas Registadas</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="task-list">
                        <!-- As tarefas serão inseridas aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
            <p id="empty-msg" class="empty-msg">Nenhuma tarefa cadastrada.</p>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
