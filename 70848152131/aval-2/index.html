<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controlo de Stock</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📦 Controlo de Stock</h1>

        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2>Registar Novo Produto</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="code">Código:</label>
                    <input type="text" id="code" required placeholder="Ex: P001">
                </div>
                <div class="form-group">
                    <label for="description">Descrição:</label>
                    <input type="text" id="description" required placeholder="Ex: Rato Sem Fios">
                </div>
                <div class="form-group">
                    <label for="quantity">Quantidade:</label>
                    <input type="number" id="quantity" min="0" required placeholder="Ex: 10">
                </div>
                <div class="form-group">
                    <label for="price">Valor (€):</label>
                    <input type="number" id="price" step="0.01" min="0" required placeholder="Ex: 19.99">
                </div>
                <button type="submit" class="btn-success">Adicionar Produto</button>
            </form>
        </div>

        <!-- Tabela de Listagem -->
        <div class="card">
            <h2>Produtos em Stock</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor Unitário</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable">
                        <!-- Os produtos registados vão aparecer aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
