
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man | Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Teias nos quatro cantos -->
    <div class="teia canto-superior-esquerdo">🕸</div>
    <div class="teia canto-superior-direito">🕸</div>
    <div class="teia canto-inferior-esquerdo">🕸</div>
    <div class="teia canto-inferior-direito">🕸</div>

    <div class="container">

        <div class="logo">🕷️</div>

        <h1>SPIDER-MAN</h1>
        <h2>CALCULADORA DE IMC</h2>

        <form id="formIMC">

            <label>Nome do paciente</label>
            <input type="text" id="nome"
                placeholder="Digite seu nome" required>

            <label>Peso (kg)</label>
            <input type="number" id="peso"
                placeholder="Ex: 70" step="0.1" required>

            <label>Altura (m)</label>
            <input type="number" id="altura"
                placeholder="Ex: 1.75" step="0.01" required>

            <button type="submit">
                CALCULAR IMC
            </button>

        </form>

        <div id="resultado"></div>

        <footer>
            CALCULADORA DE ÍNDICE DE MASSA CORPORAL
        </footer>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
