<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>

 
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
  <main class="container">
    <h1>Gerenciador de Tarefas</h1>
    <p class="descricao">
      Cadastre, organize e conclua suas tarefas.
    </p>

    <h2>Nova tarefa</h2>

    <form id="formTarefa">
      <input
        type="text"
        id="titulo"
        placeholder="Digite o título da tarefa"
        minlength="5"
        required
      >

      <select id="prioridade" required>
        <option value="">Selecione a prioridade</option>
        <option value="1">1 - Baixa</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Alta</option>
      </select>

      <button type="submit" class="btn-cadastrar">
        Cadastrar tarefa
      </button>
    </form>

    <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>

    <h2>Minhas tarefas</h2>
    <p id="contador" class="contador"></p>

    <section id="listaTarefas" class="lista-tarefas">
      <p class="vazia">Nenhuma tarefa cadastrada.</p>
    </section>
  </main>
<script src="script.js"></script></body>
</html>
