<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body class="bg-black text-white font-sans antialiased selection:bg-pink-500 selection:text-white">

    <div class="flex min-h-screen justify-center">

        <!-- Sidebar / Navegação Lateral (Desktop) -->
        <aside class="hidden md:flex flex-col justify-between w-64 border-r border-zinc-800 p-4 fixed h-screen bg-black z-20">
            <div>
                <!-- Logo -->
                <div class="px-3 py-6">
                    <h1 class="text-2xl font-bold tracking-tight italic font-serif">Instagram</h1>
                </div>

                <!-- Links de Navegação -->
                <nav class="space-y-1">
                    <a href="#" class="flex items-center gap-4 p-3 hover:bg-zinc-900 rounded-xl font-semibold transition">
                        <i class="fa-solid fa-house text-xl w-6"></i>
                        <span>Página Inicial</span>
                    </a>
                    <a href="#" class="flex items-center gap-4 p-3 hover:bg-zinc-900 rounded-xl transition">
                        <i class="fa-solid fa-magnifying-glass text-xl w-6"></i>
                        <span>Pesquisa</span>
                    </a>
                    <a href="#" class="flex items-center gap-4 p-3 hover:bg-zinc-900 rounded-xl transition">
                        <i class="fa-regular fa-compass text-xl w-6"></i>
                        <span>Explorar</span>
                    </a>
                    <a href="#" class="flex items-center gap-4 p-3 hover:bg-zinc-900 rounded-xl transition">
                        <i class="fa-solid fa-clapperboard text-xl w-6"></i>
                        <span>Reels</span>
                    </a>
                    <a href="#" class="flex items-center gap-4 p-3 hover:bg-zinc-900 rounded-xl transition">
                        <i class="fa-regular fa-message text-xl w-6"></i>
                        <span>Mensagens</span>
                    </a>
                    <a href="#" id="nav-notifications" class="flex items-center gap-4 p-3 hover:bg-zinc-900 rounded-xl transition">
                        <i class="fa-regular fa-heart text-xl w-6"></i>
                        <span>Notificações</span>
                    </a>
                    <a href="#" id="open-modal" class="flex items-center gap-4 p-3 hover:bg-zinc-900 rounded-xl transition">
                        <i class="fa-regular fa-square-plus text-xl w-6"></i>
                        <span>Criar</span>
                    </a>
                    <a href="#" class="flex items-center gap-4 p-3 hover:bg-zinc-900 rounded-xl transition">
                        <div class="w-6 h-6 rounded-full overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Perfil">
                        </div>
                        <span>Perfil</span>
                    </a>
                </nav>
            </div>

            <!-- Mais Opções -->
            <div class="space-y-1">
                <a href="#" class="flex items-center gap-4 p-3 hover:bg-zinc-900 rounded-xl transition">
                    <i class="fa-solid fa-threads text-xl w-6"></i>
                    <span>Threads</span>
                </a>
                <a href="#" class="flex items-center gap-4 p-3 hover:bg-zinc-900 rounded-xl transition">
                    <i class="fa-solid fa-bars text-xl w-6"></i>
                    <span>Mais</span>
                </a>
            </div>
        </aside>

        <!-- Barra de Navegação Superior (Mobile) -->
        <header class="md:hidden flex justify-between items-center w-full px-4 py-3 border-b border-zinc-800 fixed top-0 bg-black z-20">
            <h1 class="text-xl font-bold tracking-tight italic font-serif">Instagram</h1>
            <div class="flex items-center gap-4 text-xl">
                <i class="fa-regular fa-heart cursor-pointer"></i>
                <i class="fa-regular fa-message cursor-pointer"></i>
            </div>
        </header>

        <!-- Conteúdo Principal / Feed -->
        <main class="w-full max-w-xl md:ml-64 pt-16 md:pt-4 pb-20 md:pb-4 flex flex-col items-center">
            
            <!-- Stories -->
            <div class="w-full max-w-[470px] py-4 overflow-x-auto no-scrollbar flex gap-4 border-b border-zinc-800/60 px-2 md:px-0">
                <!-- Story Item -->
                <div class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0">
                    <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover rounded-full border-2 border-black" alt="Story">
                    </div>
                    <span class="text-xs text-zinc-400 truncate w-16 text-center">seu_perfil</span>
                </div>
                <!-- Mais Stories Dinâmicos via JS ou estáticos -->
                <div class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0">
                    <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover rounded-full border-2 border-black" alt="Story">
                    </div>
                    <span class="text-xs text-zinc-400 truncate w-16 text-center">carlos_dev</span>
                </div>
                <div class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0">
                    <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover rounded-full border-2 border-black" alt="Story">
                    </div>
                    <span class="text-xs text-zinc-400 truncate w-16 text-center">ana_silva</span>
                </div>
            </div>

            <!-- Feed de Publicações (Renderizado via JavaScript) -->
            <div id="feed-container" class="w-full max-w-[470px] space-y-4 mt-4">
                <!-- Posts injetados dinamicamente pelo app.js -->
            </div>

        </main>

        <!-- Sugestões / Perfil Lateral (Desktop) -->
        <aside class="hidden lg:block w-80 p-6 fixed right-0 top-0 h-screen overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-12 h-12 rounded-full object-cover" alt="Perfil">
                    <div>
                        <h4 class="text-sm font-semibold">seu_usuario</h4>
                        <p class="text-xs text-zinc-400">Nome de Exibição</p>
                    </div>
                </div>
                <button class="text-xs text-blue-500 font-semibold hover:text-white">Mudar</button>
            </div>

            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-semibold text-zinc-400">Sugestões para você</span>
                <button class="text-xs font-semibold hover:text-zinc-400">Ver tudo</button>
            </div>

            <!-- Lista de Sugestões -->
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=150&q=80" class="w-8 h-8 rounded-full object-cover" alt="Sugerido">
                        <div>
                            <h5 class="text-sm font-semibold">lucas_moura</h5>
                            <p class="text-xs text-zinc-400">Seguido(a) por ana_silva</p>
                        </div>
                    </div>
                    <button class="text-xs text-blue-500 font-semibold hover:text-white">Seguir</button>
                </div>
            </div>
        </aside>

        <!-- Barra de Navegação Inferior (Mobile) -->
        <nav class="md:hidden flex justify-around items-center w-full h-12 border-t border-zinc-800 fixed bottom-0 bg-black z-20 px-2">
            <a href="#" class="text-xl p-2"><i class="fa-solid fa-house"></i></a>
            <a href="#" class="text-xl p-2"><i class="fa-solid fa-magnifying-glass"></i></a>
            <a href="#" id="open-modal-mobile" class="text-xl p-2"><i class="fa-regular fa-square-plus"></i></a>
            <a href="#" class="text-xl p-2"><i class="fa-solid fa-clapperboard"></i></a>
            <a href="#" class="text-xl p-2"><div class="w-6 h-6 rounded-full overflow-hidden"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80"></div></a>
        </nav>

    </div>

    <!-- Modal de Nova Publicação (Oculto por padrão) -->
    <div id="post-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 w-full max-w-lg rounded-xl overflow-hidden border border-zinc-800">
            <div class="flex justify-between items-center p-3 border-b border-zinc-800">
                <span class="font-semibold text-sm">Criar nova publicação</span>
                <button id="close-modal" class="text-xl font-bold">&times;</button>
            </div>
            <div class="p-8 flex flex-col items-center justify-center gap-4 text-center">
                <i class="fa-regular fa-image text-5xl text-zinc-400"></i>
                <p class="text-lg">Arraste as fotos e os vídeos aqui</p>
                <label class="bg-blue-500 hover:bg-blue-600 text-white text-sm font-semibold px-4 py-2 rounded-lg cursor-pointer transition">
                    Selecionar do computador
                    <input type="file" id="file-input" class="hidden" accept="image/*">
                </label>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
