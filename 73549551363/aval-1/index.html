<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Estoque - JS</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <h1>Controle de Estoque</h1>
      <p>Projeto prático de fundamentos em JavaScript</p>
    </header>

    <!-- Área de mensagens de feedback (sucesso ou erro) -->
    <div id="mensagem" class="mensagem oculto"></div>

    <div class="grid-formularios">
      <!-- Formulário de Cadastro -->
      <section class="card">
        <h2>Cadastrar Produto</h2>
        <form id="form-cadastro">
          <div class="campo">
            <label for="descricao">Descrição (mín. 5 caracteres)</label>
            <input type="text" id="descricao" placeholder="Ex: Cadeira gamer" required>
          </div>
          <div class="campo">
            <label for="quantidade">Quantidade Inicial</label>
            <input type="number" id="quantidade" placeholder="Ex: 12" required>
          </div>
          <div class="campo">
            <label for="valor">Valor Unitário (R$)</label>
            <input type="number" id="valor" step="0.01" placeholder="Ex: 699.00" required>
          </div>
          <button type="submit" class="btn-primario">Cadastrar</button>
        </form>
      </section>

      <!-- Formulários de Atualização -->
      <div class="coluna-atualizacoes">
        <!-- Atualizar Valor -->
        <section class="card">
          <h2>Alterar Valor</h2>
          <form id="form-valor">
            <div class="linha-dupla">
              <div class="campo">
                <label for="codigo-valor">Código</label>
                <input type="number" id="codigo-valor" placeholder="ID" required>
              </div>
              <div class="campo">
                <label for="novo-valor">Novo Valor (R$)</label>
                <input type="number" id="novo-valor" step="0.01" placeholder="Ex: 599.00" required>
              </div>
            </div>
            <button type="submit" class="btn-secundario">Atualizar Valor</button>
          </form>
        </section>

        <!-- Adicionar Quantidade -->
        <section class="card">
          <h2>Adicionar ao Estoque</h2>
          <form id="form-quantidade">
            <div class="linha-dupla">
              <div class="campo">
                <label for="codigo-qtd">Código</label>
                <input type="number" id="codigo-qtd" placeholder="ID" required>
              </div>
              <div class="campo">
                <label for="nova-qtd">Qtd. a Somar</label>
                <input type="number" id="nova-qtd" placeholder="Ex: 5" required>
              </div>
            </div>
            <button type="submit" class="btn-secundario">Somar Quantidade</button>
          </form>
        </section>
      </div>
    </div>

    <!-- Listagem de Produtos -->
    <section class="card tabela-card">
      <h2>Produtos Cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Quantidade</th>
            <th>Valor Unitário</th>
            <th>Total em Estoque</th>
          </tr>
        </thead>
        <tbody id="lista-produtos">
          <!-- Preenchido via JavaScript -->
        </tbody>
      </table>
      <p id="aviso-vazio" class="aviso-vazio">Nenhum produto cadastrado no momento.</p>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
