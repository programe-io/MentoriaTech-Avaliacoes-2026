<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Estoque Simples</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <h1>📦 Controle de Estoque</h1>
      <p>Gerencie entradas, saídas e quantidades facilmente</p>
    </header>

    <!-- Resumo Rápido -->
    <section class="resumo">
      <div class="card">
        <span>Total de Produtos</span>
        <strong id="total-produtos">0</strong>
      </div>
      <div class="card">
        <span>Itens em Estoque</span>
        <strong id="total-itens">0</strong>
      </div>
      <div class="card">
        <span>Valor Total (R$)</span>
        <strong id="valor-total">R$ 0,00</strong>
      </div>
    </section>

    <!-- Formulário de Cadastro -->
    <form id="form-produto" class="formulario">
      <input type="text" id="nome" placeholder="Nome do produto" required />
      <input type="text" id="categoria" placeholder="Categoria (ex: Eletrônicos)" required />
      <input type="number" id="quantidade" placeholder="Qtd." min="0" required />
      <input type="number" id="preco" placeholder="Preço unitário (R$)" step="0.01" min="0" required />
      <button type="submit" class="btn-adicionar">Adicionar</button>
    </form>

    <!-- Barra de Busca -->
    <div class="busca">
      <input type="text" id="campo-busca" placeholder="🔍 Buscar produto por nome ou categoria..." />
    </div>

    <!-- Tabela de Produtos -->
    <div class="tabela-wrapper">
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Preço Unit.</th>
            <th>Quantidade</th>
            <th>Subtotal</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista-estoque">
          <!-- Os produtos entram aqui via JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
