<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas - JS</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <h1>Gerenciador de Tarefas</h1>
      <p>Projeto prático de fundamentos lógicos em JavaScript</p>
    </header>

    <!-- Banner de feedback (sucesso ou erro) -->
    <div id="mensagem" class="mensagem oculto"></div>

    <div class="grid-formularios">
      <!-- Cadastro de Tarefa -->
      <section class="card">
        <h2>Cadastrar Nova Tarefa</h2>
        <form id="form-cadastro">
          <div class="campo">
            <label for="titulo">Título (mín. 5 caracteres)</label>
            <input type="text" id="titulo" placeholder="Ex: Estudar métodos de array" required>
          </div>
          <div class="campo">
            <label for="prioridade">Prioridade (1 a 3)</label>
            <select id="prioridade">
              <option value="1">1 - Alta</option>
              <option value="2" selected>2 - Média</option>
              <option value="3">3 - Baixa</option>
            </select>
          </div>
          <button type="submit" class="btn-primario">Cadastrar Tarefa</button>
        </form>
      </section>

      <!-- Ações por Código -->
      <div class="coluna-acoes">
        <!-- Marcar como Concluída -->
        <section class="card">
          <h2>Concluir Tarefa</h2>
          <form id="form-concluir">
            <div class="campo">
              <label for="codigo-concluir">Código da Tarefa</label>
              <input type="number" id="codigo-concluir" placeholder="Ex: 1" required>
            </div>
            <button type="submit" class="btn-sucesso">Marcar como Concluída</button>
          </form>
        </section>

        <!-- Alterar Prioridade -->
        <section class="card">
          <h2>Alterar Prioridade</h2>
          <form id="form-prioridade">
            <div class="linha-dupla">
              <div class="campo">
                <label for="codigo-prioridade">Código</label>
                <input type="number" id="codigo-prioridade" placeholder="ID" required>
              </div>
              <div class="campo">
                <label for="nova-prioridade">Nova Prioridade</label>
                <select id="nova-prioridade">
                  <option value="1">1 - Alta</option>
                  <option value="2">2 - Média</option>
                  <option value="3">3 - Baixa</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn-secundario">Atualizar Prioridade</button>
          </form>
        </section>
      </div>
    </div>

    <!-- Listagem de Tarefas -->
    <section class="card">
      <h2>Tarefas Cadastradas</h2>
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Título</th>
            <th>Prioridade</th>
            <th>Status</th>
            <th>Ações Rápidas</th>
          </tr>
        </thead>
        <tbody id="lista-tarefas">
          <!-- Preenchido via JavaScript -->
        </tbody>
      </table>
      <p id="aviso-vazio" class="aviso-vazio">Nenhuma tarefa cadastrada no momento.</p>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
