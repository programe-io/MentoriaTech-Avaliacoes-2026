<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Gerenciador de Tarefas</title>
  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Seu arquivo CSS -->
  <link rel="stylesheet" href="style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="app-container">
    <!-- Cabeçalho -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">
          <i data-lucide="check-square"></i>
        </div>
        <div>
          <h1>TaskFlow</h1>
          <p class="subtitle">Organize seu dia com clareza</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="theme-toggle" class="btn btn-icon" title="Alternar Tema">
          <i data-lucide="moon" id="theme-icon"></i>
        </button>
        <button id="export-btn" class="btn btn-secondary" title="Exportar JSON">
          <i data-lucide="download"></i> Exportar
        </button>
        <button id="open-modal-btn" class="btn btn-primary">
          <i data-lucide="plus"></i> Nova Tarefa
        </button>
      </div>
    </header>

    <!-- Painel de Estatísticas -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total</span>
        <strong id="stat-total" class="stat-value">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Em Aberto</span>
        <strong id="stat-open" class="stat-value text-pink">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Concluídas</span>
        <strong id="stat-done" class="stat-value text-green">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Atrasadas</span>
        <strong id="stat-overdue" class="stat-value text-red">0</strong>
      </div>
    </section>

    <!-- Barra de Progresso -->
    <div class="progress-wrapper">
      <div class="progress-header">
        <span>Progresso Geral</span>
        <span id="progress-text">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- Adição Rápida -->
    <form id="quick-add-form" class="quick-add">
      <input
        type="text"
        id="quick-title"
        placeholder="Adicionar tarefa rápida e pressionar Enter..."
        required
      />
      <select id="quick-priority">
        <option value="baixa">Prioridade Baixa</option>
        <option value="media" selected>Prioridade Média</option>
        <option value="alta">Prioridade Alta</option>
      </select>
      <button type="submit" class="btn btn-primary">Adicionar</button>
    </form>

    <!-- Filtros e Alternador de Visualização -->
    <section class="toolbar">
      <div class="search-box">
        <i data-lucide="search"></i>
        <input type="text" id="search-input" placeholder="Buscar tarefas..." />
      </div>

      <div class="filters">
        <select id="filter-status">
          <option value="todas">Todos os Status</option>
          <option value="abertas">Em Aberto</option>
          <option value="concluidas">Concluídas</option>
        </select>

        <select id="filter-priority">
          <option value="todas">Todas Prioridades</option>
          <option value="alta">Alta</option>
          <option value="media">Média</option>
          <option value="baixa">Baixa</option>
        </select>

        <div class="view-switcher">
          <button id="view-list-btn" class="view-btn active" title="Lista">
            <i data-lucide="list"></i> Lista
          </button>
          <button id="view-kanban-btn" class="view-btn" title="Kanban">
            <i data-lucide="columns"></i> Kanban
          </button>
        </div>
      </div>
    </section>

    <!-- Área Principal (Lista ou Kanban) -->
    <main id="tasks-container"></main>
  </div>

  <!-- Modal de Criação / Edição -->
  <div id="task-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Nova Tarefa</h2>
        <button id="close-modal-btn" class="btn-icon">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="task-form">
        <input type="hidden" id="task-id" />

        <div class="form-group">
          <label for="task-title">Título *</label>
          <input type="text" id="task-title" required placeholder="Ex: Finalizar apresentação" />
        </div>

        <div class="form-group">
          <label for="task-desc">Descrição</label>
          <textarea id="task-desc" rows="3" placeholder="Detalhes opcionais..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-priority">Prioridade</label>
            <select id="task-priority">
              <option value="baixa">Baixa</option>
              <option value="media" selected>Média</option>
              <option value="alta">Alta</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-category">Categoria</label>
            <select id="task-category">
              <option value="Trabalho">Trabalho</option>
              <option value="Pessoal">Pessoal</option>
              <option value="Estudos">Estudos</option>
              <option value="Saúde">Saúde</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-date">Data Limite</label>
            <input type="date" id="task-date" />
          </div>

          <div class="form-group">
            <label for="task-status">Status (Kanban)</label>
            <select id="task-status">
              <option value="pendente">A Fazer</option>
              <option value="andamento">Em Andamento</option>
              <option value="concluida">Concluída</option>
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="cancel-modal-btn" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar Tarefa</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Notificação Toast (Desfazer exclusão) -->
  <div id="toast" class="toast hidden">
    <span id="toast-message">Tarefa removida.</span>
    <button id="undo-btn" class="toast-undo">Desfazer</button>
  </div>

  <!-- Seu arquivo JavaScript -->
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
