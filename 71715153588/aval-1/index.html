<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Catálogo de Produtos</h1>
        <p>Cadastro e gerenciamento de produtos</p>
    </header>

    <main>

        <!-- Cadastro -->
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <div class="formulario">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" placeholder="Ex: Cadeira Gamer">

                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" min="1" placeholder="Ex: 10">

                <label for="valor">Valor</label>
                <input type="number" id="valor" min="0" step="0.01" placeholder="Ex: 699.90">

                <button onclick="cadastrarProdutoTela()">
                    Cadastrar Produto
                </button>
            </div>
        </section>

        <!-- Atualizar -->
        <section class="card">
            <h2>Atualizar Produto</h2>

            <div class="formulario">

                <label for="codigoAtualizar">Código do produto</label>
                <input type="number" id="codigoAtualizar" min="1">

                <label for="novoValor">Novo valor</label>
                <input type="number" id="novoValor" min="0" step="0.01">

                <button onclick="atualizarValorTela()">
                    Atualizar Valor
                </button>

                <label for="novaQuantidade">Adicionar quantidade</label>
                <input type="number" id="novaQuantidade" min="1">

                <button onclick="atualizarQuantidadeTela()">
                    Atualizar Quantidade
                </button>

            </div>
        </section>

        <!-- Lista -->
        <section class="card">
            <h2>Produtos Cadastrados</h2>

            <div id="mensagem"></div>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                </tbody>
            </table>
        </section>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
