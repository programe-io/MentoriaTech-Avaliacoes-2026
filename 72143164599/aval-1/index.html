<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Área de Entrega - Avaliações</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <div class="container">
                            <button class="back-btn">← Voltar para o início</button>
                                    
                                            <h1>Área de Entrega - Avaliações</h1>
                                                    <p class="description">Aqui você envia seus códigos para correção. Revise antes de publicar e garanta que sua avaliação esteja completa. Finalize seu trabalho, publique seu código e compartilhe sua solução com o professor para ser avaliada.</p>
                                                            
                                                                    <div class="editors-container">
                                                                                <div class="editor-section">
                                                                                                <div class="editor-header">
                                                                                                                    <h2>HTML</h2>
                                                                                                                                        <button class="maximize-btn">Maximizar</button>
                                                                                                                                                        </div>
                                                                                                                                                                        <textarea id="htmlEditor" class="editor" placeholder="Escreva seu código HTML aqui..."></textarea>
                                                                                                                                                                                    </div>
                                                                                                                                                                                                
                                                                                                                                                                                                            <div class="editor-section">
                                                                                                                                                                                                                            <div class="editor-header">
                                                                                                                                                                                                                                                <h2>CSS</h2>
                                                                                                                                                                                                                                                                    <button class="maximize-btn">Maximizar</button>
                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                    <textarea id="cssEditor" class="editor" placeholder="Escreva seu código CSS aqui..."></textarea>
                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                        <div class="editor-section">
                                                                                                                                                                                                                                                                                                                                                    <div class="editor-header">
                                                                                                                                                                                                                                                                                                                                                                    <h2>JavaScript</h2>
                                                                                                                                                                                                                                                                                                                                                                                    <button class="maximize-btn">Maximizar</button>
                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                            <textarea id="jsEditor" class="editor" placeholder="Escreva seu código JavaScript aqui..."></textarea>
                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="preview-section">
                                                                                                                                                                                                                                                                                                                                                                                                                                                <h2>Pré-visualização do Código</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <iframe id="preview" class="preview-frame"></iframe>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="publish-btn">Publicar no GitHub Pages</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
