<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Senhas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <div class="card">

            <h1>🔐 Gerador de Senhas</h1>

            <p class="descricao">
                Crie uma senha forte e segura em poucos segundos.
            </p>

            <div class="senha-box">
                <input
                    type="text"
                    id="senha"
                    readonly
                    placeholder="Sua senha aparecerá aqui"
                >

                <button id="copiar">
                    📋
                </button>
            </div>

            <div class="configuracoes">

                <div class="linha">
                    <label for="tamanho">
                        Tamanho da senha
                    </label>

                    <span id="valorTamanho">12</span>
                </div>

                <input
                    type="range"
                    id="tamanho"
                    min="4"
                    max="32"
                    value="12"
                >

                <label class="opcao">
                    <input type="checkbox" id="maiusculas" checked>
                    Letras maiúsculas
                </label>

                <label class="opcao">
                    <input type="checkbox" id="minusculas" checked>
                    Letras minúsculas
                </label>

                <label class="opcao">
                    <input type="checkbox" id="numeros" checked>
                    Números
                </label>

                <label class="opcao">
                    <input type="checkbox" id="simbolos">
                    Símbolos
                </label>

            </div>

            <button id="gerar">
                Gerar senha
            </button>

            <p id="mensagem"></p>

        </div>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
