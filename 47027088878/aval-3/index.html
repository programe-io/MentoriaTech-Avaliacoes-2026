<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clima Agora</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="clima">

        <h1>🌤️ Clima Agora</h1>

        <div class="busca">
            <input
                type="text"
                id="cidade"
                placeholder="Digite sua cidade"
            >

            <button id="buscar">
                Buscar
            </button>
        </div>

        <div class="resultado">

            <div id="icone">☀️</div>

            <h2 id="nomeCidade">
                Teresina
            </h2>

            <div class="temperatura">
                <span id="temperatura">30</span>°C
            </div>

            <p id="condicao">
                Ensolarado
            </p>

            <div class="detalhes">

                <div>
                    💧
                    <strong id="umidade">65%</strong>
                    <small>Umidade</small>
                </div>

                <div>
                    💨
                    <strong id="vento">12 km/h</strong>
                    <small>Vento</small>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
