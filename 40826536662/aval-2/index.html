<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="todo-app">
  <header class="topo-tarefas">
    <div>
      <h1>Gerenciador de Tarefas</h1>
      <p>Organize atividades, defina prioridades, filtre por status e salve automaticamente no navegador.</p>
    </div>
    <button type="button" id="btn-limpar-concluidas" class="btn-limpar">
      Limpar Concluídas
    </button>
  </header>

  <section class="painel-resumo" aria-label="Resumo das tarefas">
    <div class="resumo-card">
      <span>Total</span>
      <strong id="contador-total">0</strong>
    </div>
    <div class="resumo-card">
      <span>Pendentes</span>
      <strong id="contador-pendentes">0</strong>
    </div>
    <div class="resumo-card">
      <span>Concluídas</span>
      <strong id="contador-concluidas">0</strong>
    </div>
    <div class="resumo-card progresso-card">
      <div class="progresso-topo">
        <span>Progresso</span>
        <strong id="percentual-progresso">0%</strong>
      </div>
      <div class="barra-fundo">
        <div id="barra-preenchida" class="barra-preenchida"></div>
      </div>
    </div>
  </section>

  <section class="card-tarefas">
    <h2>Nova Tarefa</h2>
    <form id="form-tarefa" novalidate>
      <div class="linha-form">
        <div class="campo-tarefa campo-principal">
          <label for="input-titulo">Descrição da tarefa</label>
          <input
            type="text"
            id="input-titulo"
            placeholder="Ex.: Revisar códigos de manipulação do DOM"
            autocomplete="off"
          />
        </div>

        <div class="campo-tarefa">
          <label for="select-prioridade">Prioridade</label>
          <select id="select-prioridade">
            <option value="Normal">Normal</option>
            <option value="Alta">Alta</option>
            <option value="Baixa">Baixa</option>
          </select>
        </div>

        <div class="campo-tarefa">
          <label for="select-categoria">Categoria</label>
          <select id="select-categoria">
            <option value="Estudos">Estudos</option>
            <option value="Trabalho">Trabalho</option>
            <option value="Pessoal">Pessoal</option>
          </select>
        </div>
      </div>

      <p id="erro-tarefa" class="erro-tarefa" hidden></p>

      <div class="acoes-cadastro">
        <button type="submit" class="btn-adicionar">Adicionar Tarefa</button>
      </div>
    </form>
  </section>

  <section class="card-tarefas">
    <div class="controles-lista">
      <input
        type="search"
        id="input-busca-tarefa"
        placeholder="Buscar tarefa ou categoria..."
        aria-label="Buscar tarefa ou categoria"
      />

      <div id="filtros-tarefas" class="filtros-tarefas">
        <button type="button" class="btn-filtro ativo" data-filtro="todas">Todas</button>
        <button type="button" class="btn-filtro" data-filtro="pendentes">Pendentes</button>
        <button type="button" class="btn-filtro" data-filtro="concluidas">Concluídas</button>
      </div>
    </div>

    <ul id="lista-tarefas" class="lista-tarefas"></ul>
  </section>
</div>
  <script src="script.js"></script>
  
</body>
</html>
