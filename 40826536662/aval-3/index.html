<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="imc-app">
  <header class="topo-imc">
    <div>
      <h1>Calculadora de IMC e Ficha</h1>
      <p>Calcule o IMC, classifique a faixa com selo visual e salve o histórico de avaliações no navegador.</p>
    </div>
    <button type="button" id="btn-limpar-historico" class="btn-limpar-hist">
      Limpar Histórico
    </button>
  </header>

  <section class="card-imc">
    <h2>Nova Avaliação</h2>
    <form id="form-imc" novalidate>
      <div class="grade-imc">
        <div class="campo-imc">
          <label for="input-nome-imc">Nome</label>
          <input
            type="text"
            id="input-nome-imc"
            placeholder="Ex.: Lucas Almeida"
            autocomplete="off"
          />
        </div>

        <div class="campo-imc">
          <label for="input-peso-imc">Peso (kg)</label>
          <input
            type="number"
            id="input-peso-imc"
            step="0.1"
            min="1"
            placeholder="Ex.: 72.5"
          />
        </div>

        <div class="campo-imc">
          <label for="input-altura-imc">Altura (m)</label>
          <input
            type="number"
            id="input-altura-imc"
            step="0.01"
            min="0.3"
            placeholder="Ex.: 1.75"
          />
        </div>
      </div>

      <p id="erro-imc" class="erro-imc" hidden></p>

      <div class="acoes-imc">
        <button type="submit" class="btn-calcular">Calcular e Salvar</button>
        <button type="button" id="btn-limpar-campos" class="btn-secundario-imc">Limpar Campos</button>
      </div>
    </form>

    <div id="resultado-destaque" class="resultado-destaque" hidden>
      <div>
        <span class="rotulo-resultado">Último IMC calculado</span>
        <strong id="valor-imc-destaque">0.00</strong>
      </div>
      <span id="selo-imc-destaque" class="selo-imc"></span>
    </div>
  </section>

  <section class="card-imc">
    <h2>Registros Salvos</h2>
    <div class="tabela-imc-wrapper">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Peso</th>
            <th>Altura</th>
            <th>IMC</th>
            <th>Classificação</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="corpo-historico-imc"></tbody>
      </table>
    </div>
  </section>
</div>
  <script src="script.js"></script>
  
</body>
</html>
