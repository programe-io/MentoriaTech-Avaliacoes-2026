
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Interativo</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1 class="logo">Instagram</h1>
        <input type="text" id="search" placeholder="Pesquisar...">
        <button onclick="darkMode()">🌙</button>
    </header>

    <div class="container">

        <div class="stories">
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=1">
                <p>Você</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=2">
                <p>Ana</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=3">
                <p>Pedro</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=4">
                <p>Julia</p>
            </div>
        </div>

        <div class="new-post">
            <input id="newPost" placeholder="URL de uma imagem">
            <button onclick="createPost()">Publicar</button>
        </div>

        <div id="feed">

            <div class="post">

                <div class="post-header">👤 maria_silva</div>

                <img src="https://picsum.photos/id/1011/600/400">

                <div class="actions">
                    <button onclick="like(this)">♡</button>
                    <button onclick="focusComment(this)">💬</button>
                    <button onclick="sharePost()">➤</button>
                </div>

                <div class="likes" data-count="120">
                    120 curtidas
                </div>

                <div class="caption">
                    <b>maria_silva</b> Aproveitando o dia! ☀️
                </div>

                <div class="comments"></div>

                <div class="comment-area">
                    <input placeholder="Adicione um comentário...">
                    <button onclick="comment(this)">Enviar</button>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
