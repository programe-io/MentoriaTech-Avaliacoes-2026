<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <title>Minecraft - Mundo dos Blocos</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #dff0d8;
        color: #222;
    }

    header {
        background: #3b8526;
        color: white;
        text-align: center;
        padding: 40px 20px;
        border-bottom: 8px solid #245c18;
    }

    header h1 {
        font-size: 50px;
        text-shadow: 4px 4px #1e4215;
    }

    header p {
        margin-top: 10px;
        font-size: 20px;
    }

    nav {
        background: #222;
        text-align: center;
        padding: 18px;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin: 0 20px;
        font-weight: bold;
    }

    nav a:hover {
        color: #62c943;
    }

    .banner {
        width: 100%;
        height: 350px;
        background-image:
            linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.45)),
            url("minecraft.jpg");
        background-size: cover;
        background-position: center;

        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: white;
    }

    .banner h2 {
        font-size: 42px;
        text-shadow: 3px 3px #000;
    }

    .container {
        max-width: 1100px;
        margin: auto;
        padding: 40px 20px;
    }

    .container h2 {
        color: #347522;
        margin-bottom: 15px;
    }

    .sobre {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        margin-bottom: 30px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .card .emoji {
        font-size: 55px;
        margin-bottom: 15px;
    }

    .card h3 {
        color: #347522;
        margin-bottom: 10px;
    }

    .card p {
        line-height: 1.5;
    }

    .curiosidades {
        margin-top: 35px;
        background: #c8e6bd;
        padding: 25px;
        border-radius: 12px;
    }

    .curiosidades ul {
        margin-top: 15px;
        padding-left: 25px;
    }

    .curiosidades li {
        margin-bottom: 10px;
    }

    footer {
        background: #222;
        color: white;
        text-align: center;
        padding: 25px;
        margin-top: 30px;
    }

    @media (max-width: 700px) {
        header h1 {
            font-size: 36px;
        }

        .cards {
            grid-template-columns: 1fr;
        }

        .banner h2 {
            font-size: 30px;
        }

        nav a {
            display: block;
            margin: 10px;
        }
    }
</style>

  
  
</body>
</html>
