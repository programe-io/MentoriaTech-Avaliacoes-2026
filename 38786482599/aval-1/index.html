<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Controle de Estoque</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h1>Sistema de Controle de Estoque</h1>

    <!-- Área de Mensagens de Erro/Sucesso -->
    <div id="mensagem" class="mensagem hidden"></div>

    <!-- Formulário de Cadastro -->
    <section class="card">
      <h2>Cadastrar Novo Produto</h2>
      <form id="form-cadastro">
        <div class="form-group">
          <label for="descricao">Descrição (mínimo 5 caracteres):</label>
          <input type="text" id="descricao" placeholder="Ex: Cadeira gamer" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="quantidade">Quantidade (maior que 0):</label>
            <input type="number" id="quantidade" min="1" placeholder="Ex: 10" required>
          </div>

          <div class="form-group">
            <label for="valor">Valor R$ (maior ou igual a 0):</label>
            <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 699.00" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
      </form>
    </section>

    <!-- Formulários de Atualização -->
    <div class="grid-2">
      <!-- Atualizar Valor -->
      <section class="card">
        <h2>Atualizar Valor</h2>
        <form id="form-atualizar-valor">
          <div class="form-group">
            <label for="codigo-valor">Código do Produto:</label>
            <input type="number" id="codigo-valor" min="1" placeholder="Ex: 1" required>
          </div>
          <div class="form-group">
            <label for="novo-valor">Novo Valor (R$):</label>
            <input type="number" id="novo-valor" step="0.01" min="0" placeholder="Ex: 650.00" required>
          </div>
          <button type="submit" class="btn btn-secondary">Atualizar Valor</button>
        </form>
      </section>

      <!-- Somar Quantidade -->
      <section class="card">
        <h2>Entrada de Estoque (Somar Qtd)</h2>
        <form id="form-atualizar-qtd">
          <div class="form-group">
            <label for="codigo-qtd">Código do Produto:</label>
            <input type="number" id="codigo-qtd" min="1" placeholder="Ex: 1" required>
          </div>
          <div class="form-group">
            <label for="nova-qtd">Quantidade a Adicionar:</label>
            <input type="number" id="nova-qtd" min="1" placeholder="Ex: 5" required>
          </div>
          <button type="submit" class="btn btn-secondary">Adicionar Quantidade</button>
        </form>
      </section>
    </div>

    <!-- Tabela de Produtos -->
    <section class="card">
      <h2>Produtos em Estoque</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Descrição</th>
              <th>Quantidade</th>
              <th>Valor Unitário</th>
            </tr>
          </thead>
          <tbody id="tabela-produtos">
            <tr>
              <td colspan="4" class="text-center">Nenhum produto cadastrado.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
