<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h1>Gerenciador de Tarefas</h1>

    <!-- Área de Exibição de Erros e Sucesso -->
    <div id="mensagem" class="mensagem hidden"></div>

    <!-- Form para Cadastrar Nova Tarefa -->
    <section class="card">
      <h2>Cadastrar Nova Tarefa</h2>
      <form id="form-cadastro">
        <div class="form-group">
          <label for="titulo">Título da Tarefa (mínimo 5 caracteres):</label>
          <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript" required>
        </div>

        <div class="form-group">
          <label for="prioridade">Prioridade (1 - Alta | 2 - Média | 3 - Baixa):</label>
          <select id="prioridade" required>
            <option value="1">1 - Alta</option>
            <option value="2" selected>2 - Média</option>
            <option value="3">3 - Baixa</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar Tarefa</button>
      </form>
    </section>

    <!-- Form para Alterar Prioridade -->
    <section class="card">
      <h2>Alterar Prioridade de uma Tarefa</h2>
      <form id="form-prioridade" class="form-row">
        <div class="form-group">
          <label for="codigo-prio">Código da Tarefa:</label>
          <input type="number" id="codigo-prio" min="1" placeholder="Ex: 1" required>
        </div>

        <div class="form-group">
          <label for="nova-prioridade">Nova Prioridade:</label>
          <select id="nova-prioridade" required>
            <option value="1">1 - Alta</option>
            <option value="2">2 - Média</option>
            <option value="3">3 - Baixa</option>
          </select>
        </div>

        <button type="submit" class="btn btn-secondary">Alterar Prioridade</button>
      </form>
    </section>

    <!-- Lista de Tarefas Cadastradas -->
    <section class="card">
      <h2>Lista de Tarefas</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Título</th>
              <th>Prioridade</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-tarefas">
            <tr>
              <td colspan="5" class="text-center">Nenhuma tarefa cadastrada.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
