<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header class="topo">
    <div>
        <h1>💰 Meu Controle</h1>
        <p>Controle seus gastos e investimentos</p>
    </div>

    <button id="btnTema" class="btn-tema">🌙</button>
</header>

<main class="container">

    <!-- RESUMO -->
    <section class="resumo">

        <div class="card renda">
            <span>💵 Renda mensal</span>
            <strong id="rendaTotal">R$ 5.697,00</strong>
        </div>

        <div class="card gastos">
            <span>💸 Gastos</span>
            <strong id="gastosTotal">R$ 0,00</strong>
        </div>

        <div class="card investimento">
            <span>📈 Investimentos</span>
            <strong id="investimentoTotal">R$ 0,00</strong>
        </div>

        <div class="card saldo">
            <span>💰 Saldo</span>
            <strong id="saldoTotal">R$ 5.697,00</strong>
        </div>

    </section>

    <!-- CONTROLES -->
    <section class="barra-controle">

        <div>
            <label for="mesSelecionado">Mês:</label>
            <input type="month" id="mesSelecionado">
        </div>

        <button id="btnAdicionarGasto" class="btn-principal">
            + Adicionar gasto
        </button>

    </section>

    <!-- GASTOS E CATEGORIAS -->
    <section class="grid">

        <div class="painel">
            <div class="painel-titulo">
                <h2>📋 Meus gastos</h2>
            </div>

            <div id="listaGastos" class="lista-gastos">
                <!-- Gastos serão inseridos pelo JavaScript -->
            </div>
        </div>

        <div class="painel">
            <div class="painel-titulo">
                <h2>📂 Categorias</h2>

                <button id="btnNovaCategoria" class="btn-secundario">
                    + Nova
                </button>
            </div>

            <div id="listaCategorias" class="lista-categorias">
                <!-- Categorias serão inseridas pelo JavaScript -->
            </div>
        </div>

    </section>

    <!-- INVESTIMENTO -->
    <section class="investimento-painel">

        <div>
            <h2>🎯 Meta de investimento</h2>
            <p>Meta mensal: <strong>R$ 1.100,00</strong></p>
        </div>

        <div class="progresso-container">
            <div class="progresso">
                <div id="barraProgresso"></div>
            </div>

            <span id="textoProgresso">R$ 0,00 de R$ 1.100,00</span>
        </div>

    </section>

</main>

<!-- MODAL NOVO GASTO -->
<div id="modalGasto" class="modal">

    <div class="modal-conteudo">

        <button class="fechar" id="fecharGasto">×</button>

        <h2>Adicionar gasto</h2>

        <form id="formGasto">

            <label>Descrição</label>
            <input
                type="text"
                id="descricao"
                placeholder="Ex.: Supermercado"
                required
            >

            <label>Categoria</label>
            <select id="categoria" required></select>

            <label>Valor</label>
            <input
                type="number"
                id="valor"
                placeholder="0,00"
                step="0.01"
                min="0"
                required
            >

            <label>Data</label>
            <input type="date" id="data" required>

            <button type="submit" class="btn-principal">
                Salvar gasto
            </button>

        </form>

    </div>
</div>

<!-- MODAL NOVA CATEGORIA -->
<div id="modalCategoria" class="modal">

    <div class="modal-conteudo">

        <button class="fechar" id="fecharCategoria">×</button>

        <h2>Nova categoria</h2>

        <form id="formCategoria">

            <label>Nome da categoria</label>

            <input
                type="text"
                id="nomeCategoria"
                placeholder="Ex.: Academia"
                required
            >

            <button type="submit" class="btn-principal">
                Criar categoria
            </button>

        </form>

    </div>
</div>

<script src="java.js"></script>

<script src="script.js"></script></body>
</html>
