
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Wheeling</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🚴 Bike Wheeling</h1>
    <p>Aprenda sobre equilíbrio e controle da bicicleta</p>
</header>

<main class="container">

    <section class="card">
        <h2>Progresso das aulas</h2>
        <p id="progressText">0% concluído</p>

        <div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>

        <p id="counter">Aula 1 de 7</p>
    </section>

    <section class="card lesson">

        <div class="lesson-icon" id="icon">🪖</div>

        <span id="level">NÍVEL INICIANTE</span>

        <h2 id="title"></h2>

        <p id="description"></p>

        <h3>Conteúdo da aula</h3>

        <ul id="topics"></ul>

        <div class="tip">
            <strong>💡 Dica de segurança</strong>
            <p id="tip"></p>
        </div>

        <div class="check">
            <label>
                <input type="checkbox" id="check">
                Concluí esta aula
            </label>
        </div>

        <div class="buttons">
            <button id="back" class="btn-back">
                ← Voltar
            </button>

            <button id="next" class="btn-next">
                Próxima aula →
            </button>
        </div>

    </section>

    <section class="card">
        <h3>📚 Módulos do curso</h3>
        <div id="modules"></div>
    </section>

</main>

<footer>
    Bike Wheeling © 2026
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
