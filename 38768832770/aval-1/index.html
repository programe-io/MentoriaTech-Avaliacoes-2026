
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeMontagem</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🚲 BikeMontagem</h1>
    <p>Sistema de montagem de bicicletas</p>
</header>

<main class="container">

    <section class="card">
        <h2>Progresso da montagem</h2>
        <p id="progressText">0% concluído</p>

        <div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>

        <p id="stepCounter">Etapa 1 de 8</p>
    </section>

    <section class="card" id="content">

        <div class="step-number" id="stepNumber"></div>

        <h2 id="stepTitle"></h2>

        <p class="step-description" id="stepDescription"></p>

        <h3>Peças e ferramentas necessárias:</h3>

        <ul id="materials"></ul>

        <div class="status" id="status">
            Marque os itens conforme forem instalados.
        </div>

        <div class="buttons">
            <button class="btn-back" id="back" onclick="previousStep()">
                ← Voltar
            </button>

            <button class="btn-next" id="next" onclick="nextStep()">
                Próxima etapa →
            </button>
        </div>

    </section>

    <section class="card">
        <button class="btn-reset" onclick="resetSystem()">
            Reiniciar montagem
        </button>
    </section>

</main>

<footer>
    BikeMontagem © 2026 - Sistema educativo
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
