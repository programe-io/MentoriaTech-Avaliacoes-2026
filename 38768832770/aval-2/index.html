
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprenda a Pedalar</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🚴 Aprenda a Pedalar</h1>
    <p>Seu primeiro passo para aprender a andar de bicicleta!</p>
</header>

<main class="container">

    <section class="card">
        <h2>Seu progresso</h2>

        <div class="progress-info">
            <span id="progressText">0% concluído</span>
            <span id="stepCounter">Aula 1 de 8</span>
        </div>

        <div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>
    </section>

    <section class="card lesson">

        <div class="lesson-icon" id="lessonIcon">🚲</div>

        <span class="lesson-number" id="lessonNumber">
            AULA 1
        </span>

        <h2 id="lessonTitle"></h2>

        <p id="lessonDescription"></p>

        <h3>O que você vai aprender:</h3>

        <ul id="lessonTopics"></ul>

        <div class="tip">
            <strong>💡 Dica:</strong>
            <p id="lessonTip"></p>
        </div>

        <div class="check-area">
            <label>
                <input type="checkbox" id="completedCheck">
                Concluí esta aula
            </label>
        </div>

        <div class="buttons">
            <button class="btn-back" id="backBtn">
                ← Voltar
            </button>

            <button class="btn-next" id="nextBtn">
                Próxima aula →
            </button>
        </div>

    </section>

    <section class="card">
        <h3>📚 Conteúdo do curso</h3>
        <div id="lessonList"></div>
    </section>

</main>

<footer>
    Aprenda a Pedalar © 2026
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
