
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📋 Gerenciador de Tarefas</h1>
        <p>Organize suas atividades e acompanhe seu progresso.</p>
    </header>

    <main>

        <section class="resumo">
            <div class="card">
                <h3>Total</h3>
                <p id="total">0</p>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <p id="pendentes">0</p>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <p id="concluidas">0</p>
            </div>
        </section>

        <section class="formulario">
            <h2>Nova Tarefa</h2>

            <form id="formTarefa">

                <input type="text" id="titulo"
                    placeholder="Nome da tarefa" required>

                <textarea id="descricao"
                    placeholder="Descrição da tarefa"></textarea>

                <label for="prazo">Prazo:</label>
                <input type="date" id="prazo">

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade">
                    <option value="Baixa">Baixa</option>
                    <option value="Média">Média</option>
                    <option value="Alta">Alta</option>
                </select>

                <button type="submit" id="btnSalvar">
                    Adicionar Tarefa
                </button>

            </form>
        </section>

        <section class="tarefas">
            <h2>Minhas Tarefas</h2>

            <div class="filtros">
                <button onclick="filtrar('Todas')">Todas</button>
                <button onclick="filtrar('Pendente')">Pendentes</button>
                <button onclick="filtrar('Concluída')">Concluídas</button>
            </div>

            <div id="listaTarefas"></div>
        </section>

    </main>

    <footer>
        <p>© 2026 - Gerenciador de Tarefas</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
