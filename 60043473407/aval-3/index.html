
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese Digital</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🏥 Ficha de Anamnese</h1>
    <p>Sistema de cadastro e histórico do paciente</p>
</header>

<main>

    <section class="informacoes">
        <h2>Dados do Paciente</h2>

        <form id="formAnamnese">

            <div class="grupo">
                <label>Nome completo</label>
                <input type="text" id="nome" required>
            </div>

            <div class="grupo">
                <label>Data de nascimento</label>
                <input type="date" id="nascimento" required>
            </div>

            <div class="grupo">
                <label>Telefone</label>
                <input type="tel" id="telefone">
            </div>

            <div class="grupo">
                <label>E-mail</label>
                <input type="email" id="email">
            </div>

            <div class="grupo">
                <label>Profissão</label>
                <input type="text" id="profissao">
            </div>

            <div class="grupo">
                <label>Endereço</label>
                <input type="text" id="endereco">
            </div>

            <h2 class="titulo-secao">Histórico de Saúde</h2>

            <div class="grupo completo">
                <label>Possui alguma doença ou condição de saúde?</label>
                <textarea id="doencas"
                    placeholder="Descreva, se houver..."></textarea>
            </div>

            <div class="grupo completo">
                <label>Possui alergias?</label>
                <textarea id="alergias"
                    placeholder="Informe quais, se houver..."></textarea>
            </div>

            <div class="grupo completo">
                <label>Utiliza algum medicamento?</label>
                <textarea id="medicamentos"
                    placeholder="Informe os medicamentos, se houver..."></textarea>
            </div>

            <div class="grupo completo">
                <label>Histórico familiar</label>
                <textarea id="familia"
                    placeholder="Informe condições de saúde na família..."></textarea>
            </div>

            <h2 class="titulo-secao">Informações do Atendimento</h2>

            <div class="grupo completo">
                <label>Queixa principal</label>
                <textarea id="queixa"
                    placeholder="Qual o motivo do atendimento?"></textarea>
            </div>

            <div class="grupo completo">
                <label>Observações do profissional</label>
                <textarea id="observacoes"
                    placeholder="Anotações adicionais..."></textarea>
            </div>

            <div class="grupo completo">
                <label>
                    <input type="checkbox" id="autorizacao" required>
                    Confirmo que as informações fornecidas são verdadeiras
                    e autorizo seu uso para a finalidade deste atendimento.
                </label>
            </div>

            <div class="botoes">
                <button type="submit" id="btnSalvar">
                    Salvar Ficha
                </button>

                <button type="reset" class="limpar">
                    Limpar Formulário
                </button>
            </div>

        </form>
    </section>

    <section class="consultas">
        <h2>Pacientes Cadastrados</h2>

        <input type="text" id="pesquisa"
            placeholder="Pesquisar paciente pelo nome...">

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Paciente</th>
                        <th>Nascimento</th>
                        <th>Telefone</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaPacientes"></tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    <p>© 2026 - Sistema de Ficha de Anamnese Digital</p>
    <p>Informações confidenciais dos pacientes.</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
