
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Controle e gerenciamento de produtos</p>
    </header>

    <main>
        <section class="resumo">
            <div class="card">
                <h3>Total de Produtos</h3>
                <p id="totalProdutos">0</p>
            </div>

            <div class="card">
                <h3>Itens em Estoque</h3>
                <p id="totalItens">0</p>
            </div>

            <div class="card">
                <h3>Valor do Estoque</h3>
                <p id="valorEstoque">R$ 0,00</p>
            </div>
        </section>

        <section class="cadastro">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">
                <input type="text" id="nome"
                    placeholder="Nome do produto" required>

                <input type="text" id="categoria"
                    placeholder="Categoria" required>

                <input type="number" id="quantidade"
                    placeholder="Quantidade" min="0" required>

                <input type="number" id="preco"
                    placeholder="Preço (R$)" min="0"
                    step="0.01" required>

                <button type="submit" id="btnSalvar">
                    Adicionar Produto
                </button>
            </form>
        </section>

        <section class="estoque">
            <h2>Produtos Cadastrados</h2>

            <input type="text" id="pesquisa"
                placeholder="Pesquisar produto...">

            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 - Sistema de Controle de Estoque</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
