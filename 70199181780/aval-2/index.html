
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 25px;
            max-width: 600px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 80%;
        }

        button {
            padding: 10px;
            margin: 5px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        th {
            background-color: #007bff;
            color: white;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Sistema de Estoque</h1>

        <h3>Cadastrar Produto</h3>

        <input type="text" id="codigo" placeholder="Código do produto">
        <input type="text" id="descricao" placeholder="Descrição do produto">
        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="number" id="valor" placeholder="Valor do produto" step="0.01">

        <br>

        <button onclick="cadastrarProduto()">Cadastrar Produto</button>

        <hr>

        <h3>Alterar Produto</h3>

        <input type="text" id="codigoAlterar" placeholder="Código do produto">

        <input type="number" id="novoValor" placeholder="Novo valor" step="0.01">

        <button onclick="alterarValor()">Alterar Valor</button>

        <br>

        <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

        <button onclick="alterarQuantidade()">Alterar Quantidade</button>

        <hr>

        <h3>Produtos Cadastrados</h3>

        <button onclick="listarProdutos()">Listar Produtos</button>

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                </tr>
            </thead>

            <tbody id="listaProdutos">
            </tbody>
        </table>

        <p id="mensagem"></p>

    </div>

    <script>

        let produtos = [];

        // Cadastrar produto
        function cadastrarProduto() {

            let codigo = document.getElementById("codigo").value;
            let descricao = document.getElementById("descricao").value;
            let quantidade = Number(document.getElementById("quantidade").value);
            let valor = Number(document.getElementById("valor").value);

            if (!codigo || !descricao || document.getElementById("quantidade").value === "" ||
                document.getElementById("valor").value === "" ||
                quantidade < 0 || valor < 0 ||
                !Number.isFinite(quantidade) || !Number.isFinite(valor)) {
                alert("Preencha todos os campos corretamente!");
                return;
            }

            if (produtos.some(p => p.codigo === codigo)) {
                alert("Este código já está cadastrado!");
                return;
            }

            produtos.push({
                codigo: codigo,
                descricao: descricao,
                quantidade: quantidade,
                valor: valor
            });

            alert("Produto cadastrado com sucesso!");

            listarProdutos();

            document.getElementById("codigo").value = "";
            document.getElementById("descricao").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("valor").value = "";
        }

        // Listar produtos
        function listarProdutos() {

            let tabela = document.getElementById("listaProdutos");

            tabela.innerHTML = "";

            produtos.forEach(function(produto) {

                let linha = document.createElement("tr");

                [
                    produto.codigo,
                    produto.descricao,
                    produto.quantidade,
                    produto.valor.toFixed(2)
                ].forEach(function(valor) {
                    let celula = document.createElement("td");
                    celula.textContent = valor;
                    linha.appendChild(celula);
                });

                tabela.appendChild(linha);

            });
        }

        // Alterar valor
        function alterarValor() {

            let codigo = document.getElementById("codigoAlterar").value;
            let novoValor = Number(document.getElementById("novoValor").value);

            let produto = produtos.find(p => p.codigo === codigo);

            if (!produto) {
                alert("Produto não encontrado!");
                return;
            }

            if (document.getElementById("novoValor").value === "" ||
                !Number.isFinite(novoValor) || novoValor < 0) {
                alert("Digite um valor válido!");
                return;
            }

            produto.valor = novoValor;

            alert("Valor alterado com sucesso!");

            listarProdutos();
        }

        // Alterar quantidade
        function alterarQuantidade() {

            let codigo = document.getElementById("codigoAlterar").value;
            let novaQuantidade = Number(document.getElementById("novaQuantidade").value);

            let produto = produtos.find(p => p.codigo === codigo);

            if (!produto) {
                alert("Produto não encontrado!");
                return;
            }

            if (document.getElementById("novaQuantidade").value === "" ||
                !Number.isInteger(novaQuantidade) || novaQuantidade < 0) {
                alert("Digite uma quantidade válida!");
                return;
            }

            produto.quantidade = novaQuantidade;

            alert("Quantidade alterada com sucesso!");

            listarProdutos();
        }

    </script>

</body>
</html>
