
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Estoque</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
  <h1>📦 Controle de Estoque</h1>
  <p>Gerencie seus produtos de maneira simples e eficiente.</p>
</header>

<main class="container">

  <section class="dashboard">
    <div class="card">
      <h3>Produtos cadastrados</h3>
      <span id="totalProdutos">0</span>
    </div>

    <div class="card">
      <h3>Quantidade em estoque</h3>
      <span id="totalQuantidade">0</span>
    </div>
  </section>

  <section class="formulario">
    <h2>Cadastrar produto</h2>

    <form id="formProduto">

      <input type="text" id="codigo"
             placeholder="Código do produto" required>

      <input type="text" id="descricao"
             placeholder="Descrição do produto" required>

      <input type="number" id="quantidade"
             placeholder="Quantidade" min="0" required>

      <input type="number" id="valor"
             placeholder="Valor (R$)" min="0"
             step="0.01" required>

      <button type="submit">Adicionar produto</button>

    </form>
  </section>

  <section class="estoque">
    <h2>Produtos em estoque</h2>

    <div class="tabela-container">
      <table>
        <thead>
        <tr>
          <th>Código</th>
          <th>Descrição</th>
          <th>Quantidade</th>
          <th>Valor</th>
          <th>Ações</th>
        </tr>
        </thead>

        <tbody id="listaProdutos">
        </tbody>
      </table>
    </div>
  </section>

</main>

<footer>
  <p>© 2026 - Sistema de Controle de Estoque</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
