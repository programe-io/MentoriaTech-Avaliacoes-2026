
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="logo">✓ TaskManager</div>
        <p>Organize suas tarefas e aumente sua produtividade.</p>
    </header>

    <main class="container">

        <!-- PAINEL DE INFORMAÇÕES -->
        <section class="dashboard">

            <div class="card">
                <h3>Total de tarefas</h3>
                <span id="totalTarefas">0</span>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <span id="tarefasConcluidas">0</span>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <span id="tarefasPendentes">0</span>
            </div>

        </section>

        <!-- CADASTRO -->
        <section class="formulario">

            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <div class="campo">
                    <label for="codigo">Código</label>
                    <input
                        type="text"
                        id="codigo"
                        placeholder="Ex: T001"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título da tarefa"
                        minlength="5"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade" required>
                        <option value="">Selecione</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit">
                    + Cadastrar tarefa
                </button>

            </form>

        </section>

        <!-- LISTAGEM -->
        <section class="tarefas">

            <div class="titulo-lista">
                <h2>Minhas tarefas</h2>
                <span id="contador">0 tarefas</span>
            </div>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaTarefas">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 - Gerenciador de Tarefas</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
