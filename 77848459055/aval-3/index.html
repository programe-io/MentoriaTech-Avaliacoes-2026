<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT — Tela Inicial</title>
  <link rel="stylesheet" href="styles.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="new-chat-btn" type="button">
        <span>＋</span>
        <span>Novo chat</span>
      </button>
    </div>

    <div class="history-section">
      <div class="history-label">Hoje</div>
      <div class="history-item">Layout responsivo com CSS Grid</div>
      <div class="history-item">Resumo sobre inteligência artificial</div>

      <div class="history-label">Anteriores</div>
      <div class="history-item">Ideias de projetos para portfólio</div>
      <div class="history-item">Explicação de APIs REST</div>
    </div>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar">U</div>
        <div>
          <div class="user-name">Usuário</div>
          <div class="user-plan">Plano Gratuito</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menu">☰</button>
        <div class="model-selector">
          ChatGPT <span>▾</span>
        </div>
      </div>
    </header>

    <section class="center-stage">
      <h1 class="greeting">O que posso ajudar por hoje?</h1>

      <form class="prompt-box" id="promptForm">
        <textarea id="promptInput" rows="1" placeholder="Pergunte qualquer coisa"></textarea>
        <div class="prompt-actions">
          <div class="tools-left">
            <button class="icon-btn" type="button">＋ Anexar</button>
            <button class="icon-btn" type="button">🌐 Pesquisar</button>
          </div>
          <button class="send-btn" type="submit" title="Enviar">↑</button>
        </div>
      </form>

      <div class="suggestions">
        <button class="suggestion-card" type="button" data-prompt="Crie um plano de estudos de HTML e CSS para iniciantes">
          <div class="suggestion-title">Plano de estudos HTML e CSS</div>
          <div class="suggestion-sub">Roteiro prático para iniciantes</div>
        </button>

        <button class="suggestion-card" type="button" data-prompt="Explique como funciona o Flexbox no CSS com exemplos">
          <div class="suggestion-title">Como funciona o CSS Flexbox</div>
          <div class="suggestion-sub">Alinhamento e exemplos claros</div>
        </button>

        <button class="suggestion-card" type="button" data-prompt="Sugira 5 ideias de aplicações web para treinar front-end">
          <div class="suggestion-title">Ideias de projetos front-end</div>
          <div class="suggestion-sub">Do nível básico ao intermediário</div>
        </button>

        <button class="suggestion-card" type="button" data-prompt="Escreva um e-mail profissional pedindo feedback sobre um projeto">
          <div class="suggestion-title">E-mail de pedido de feedback</div>
          <div class="suggestion-sub">Tom profissional e direto</div>
        </button>
      </div>
    </section>

    <footer class="disclaimer">
      O ChatGPT pode cometer erros. Considere verificar informações importantes.
    </footer>
  </main>

  <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
