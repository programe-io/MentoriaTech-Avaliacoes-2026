
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineMax | Seu mundo de filmes</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 6%;
      background: #111116;
      position: sticky;
      top: 0;
      z-index: 10;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      color: #e50914;
      font-size: 28px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      color: #ddd;
      text-decoration: none;
      transition: 0.3s;
    }

    nav a:hover {
      color: #e50914;
    }

    .search {
      padding: 11px 14px;
      border-radius: 22px;
      border: 1px solid #38383f;
      background: #202027;
      color: white;
      outline: none;
      width: 210px;
    }

    .hero {
      min-height: 440px;
      padding: 80px 6%;
      display: flex;
      align-items: center;
      background:
        linear-gradient(90deg, #0b0b0f 5%, #0b0b0fdd 45%, #0b0b0f33),
        linear-gradient(0deg, #0b0b0f, transparent 45%),
        url("https://image.tmdb.org/t/p/original/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg")
        center 30% / cover;
    }

    .hero-content {
      max-width: 560px;
    }

    .tag {
      color: #ff4b55;
      font-weight: bold;
      letter-spacing: 3px;
      font-size: 12px;
    }

    h1 {
      font-size: clamp(38px, 6vw, 64px);
      margin: 18px 0;
    }

    .hero p {
      color: #ddd;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-block;
      border: none;
      background: #e50914;
      color: white;
      padding: 14px 24px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #b80710;
      transform: scale(1.04);
    }

    main {
      padding: 35px 6%;
    }

    .section-title {
      font-size: 25px;
      margin-bottom: 22px;
    }

    .categories {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .category {
      padding: 9px 17px;
      border-radius: 20px;
      background: #202027;
      color: white;
      border: 1px solid #393940;
      cursor: pointer;
    }

    .category.active,
    .category:hover {
      background: #e50914;
      border-color: #e50914;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 22px;
    }

    .movie {
      min-width: 0;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .movie:hover {
      transform: translateY(-7px);
    }

    .movie img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 10px;
      background: #202027;
    }

    .movie h3 {
      font-size: 16px;
      margin: 12px 0 7px;
    }

    .movie-info {
      color: #aaa;
      font-size: 13px;
    }

    .rating {
      color: #ffc107;
      margin-top: 8px;
      font-size: 14px;
    }

    .empty {
      color: #aaa;
      padding: 30px 0;
      display: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #888;
      border-top: 1px solid #24242a;
      margin-top: 40px;
    }

    @media (max-width: 1000px) {
      .movies {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 18px 5%;
      }

      nav {
        order: 3;
        width: 100%;
      }

      .search {
        width: 170px;
      }

      .hero {
        min-height: 380px;
        padding: 45px 5%;
      }

      main {
        padding: 28px 5%;
      }

      .movies {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

  <header>
    <div class="logo">CINEMAX<span style="color:white">+</span></div>

    <nav>
      <a href="#">Início</a>
      <a href="#filmes">Filmes</a>
      <a href="#filmes" data-genre="Ação">Ação</a>
      <a href="#filmes" data-genre="Ficção">Ficção</a>
    </nav>

    <input
      class="search"
      id="search"
      type="search"
      placeholder="Buscar filmes..."
      aria-label="Buscar filmes"
    >
  </header>

  <section class="hero">
    <div class="hero-content">
      <span class="tag">DESTAQUE DA SEMANA</span>
      <h1>Uma aventura inesquecível</h1>
      <p>
        Prepare a pipoca e descubra histórias incríveis,
        grandes aventuras e os melhores filmes em um só lugar.
      </p>
      <a class="btn" href="#filmes">▶ Explorar filmes</a>
    </div>
  </section>

  <main id="filmes">
    <h2 class="section-title">Explore os filmes</h2>

    <div class="categories">
      <button class="category active" data-filter="Todos">Todos</button>
      <button class="category" data-filter="Ação">Ação</button>
      <button class="category" data-filter="Ficção">Ficção</button>
      <button class="category" data-filter="Animação">Animação</button>
      <button class="category" data-filter="Drama">Drama</button>
    </div>

    <div class="movies" id="movies"></div>
    <p class="empty" id="empty">Nenhum filme encontrado.</p>
  </main>

  <footer>
    <p>© 2026 CineMax+ | Feito para quem ama cinema 🎬</p>
  </footer>

  <script>
    const filmes = [
      {
        titulo: "Interestelar",
        genero: "Ficção",
        ano: 2014,
        nota: "8.7",
        poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"
      },
      {
        titulo: "Batman",
        genero: "Ação",
        ano: 2022,
        nota: "7.8",
        poster: "https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg"
      },
      {
        titulo: "Homem-Aranha",
        genero: "Ação",
        ano: 2021,
        nota: "8.2",
        poster: "https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg"
      },
      {
        titulo: "Divertida Mente 2",
        genero: "Animação",
        ano: 2024,
        nota: "7.6",
        poster: "https://image.tmdb.org/t/p/w500/vpnVM9B6NMmQpWeZvzLvDESb2QY.jpg"
      },
      {
        titulo: "Duna: Parte Dois",
        genero: "Ficção",
        ano: 2024,
        nota: "8.5",
        poster: "https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg"
      },
      {
        titulo: "Oppenheimer",
        genero: "Drama",
        ano: 2023,
        nota: "8.3",
        poster: "https://image.tmdb.org/t/p/w500/ptpr0kGAckfQkJeJIt8st5dglvd.jpg"
      },
      {
        titulo: "Super Mario Bros.",
        genero: "Animação",
        ano: 2023,
        nota: "7.0",
        poster: "https://image.tmdb.org/t/p/w500/qNBAXBIQlnOThrVvA6mA2B5ggV6.jpg"
      },
      {
        titulo: "Vingadores: Ultimato",
        genero: "Ação",
        ano: 2019,
        nota: "8.4",
        poster: "https://image.tmdb.org/t/p/w500/ulzhLuWrPK07P1YkdWQLZnQh1JL.jpg"
      },
      {
        titulo: "Coringa",
        genero: "Drama",
        ano: 2019,
        nota: "8.1",
        poster: "https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg"
      },
      {
        titulo: "Avatar",
        genero: "Ficção",
        ano: 2009,
        nota: "7.9",
        poster: "https://image.tmdb.org/t/p/w500/kyeqWdyUXW608qlYkRqosgbbJyK.jpg"
      }
    ];

    const lista = document.getElementById("movies");
    const busca = document.getElementById("search");
    const vazio = document.getElementById("empty");
    const botoes = document.querySelectorAll(".category");

    let categoriaAtual = "Todos";

    function renderizarFilmes() {
      const termo = busca.value.toLowerCase().trim();

      const filtrados = filmes.filter(filme => {
        const correspondeTitulo =
          filme.titulo.toLowerCase().includes(termo);

        const correspondeCategoria =
          categoriaAtual === "Todos" ||
          filme.genero === categoriaAtual;

        return correspondeTitulo && correspondeCategoria;
      });

      lista.innerHTML = filtrados.map(filme => `
        <article class="movie"
          tabindex="0"
          data-title="${filme.titulo}">
          <img
            src="${filme.poster}"
            alt="Pôster do filme ${filme.titulo}"
            loading="lazy"
            onerror="this.style.visibility='hidden'"
          >
          <h3>${filme.titulo}</h3>
          <p class="movie-info">
            ${filme.ano} · ${filme.genero}
          </p>
          <p class="rating">★ ${filme.nota} / 10</p>
        </article>
      `).join("");

      vazio.style.display = filtrados.length ? "none" : "block";
    }

    busca.addEventListener("input", renderizarFilmes);

    botoes.forEach(botao => {
      botao.addEventListener("click", () => {
        categoriaAtual = botao.dataset.filter;

        botoes.forEach(b => b.classList.remove("active"));
        botao.classList.add("active");

        renderizarFilmes();
      });
    });

    document.querySelectorAll("nav [data-genre]").forEach(link => {
      link.addEventListener("click", () => {
        categoriaAtual = link.dataset.genre;

        botoes.forEach(botao => {
          botao.classList.toggle(
            "active",
            botao.dataset.filter === categoriaAtual
          );
        });

        renderizarFilmes();
      });
    });

    renderizarFilmes();
  </script>

</body>
</html>
