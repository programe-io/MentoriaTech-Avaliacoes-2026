<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet">
</head>
<body>
  
<div class="game">
  <h1>🚀 Space Adventure</h1>
  <p>Desvie dos meteoros e faça pontos!</p>

  <div id="score">Pontos: 0</div>

  <div id="arena">
    <div id="player">🚀</div>
    <div id="meteor">☄️</div>
  </div>

  <button onclick="jump()">PULAR</button>
  <button onclick="restart()">RECOMEÇAR</button>

  <p id="message">Prepare-se para jogar!</p>
</div>

  <script src="script.js"></script>
  
</body>
</html>
