
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoas e IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Cadastro de Pessoas</h1>

        <form id="form-pessoa">

            <label for="input-nome">Nome:</label>
            <input type="text" id="input-nome" placeholder="Digite seu nome">

            <label for="input-idade">Idade:</label>
            <input type="number" id="input-idade" placeholder="Digite sua idade">

            <label for="input-altura">Altura (metros):</label>
            <input type="number" id="input-altura" step="0.01" placeholder="Ex: 1.75">

            <label for="input-peso">Peso (kg):</label>
            <input type="number" id="input-peso" step="0.1" placeholder="Ex: 70">

            <p id="erro" hidden></p>

            <button type="submit">Cadastrar Pessoa</button>

        </form>

        <h2>Pessoas Cadastradas</h2>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Altura</th>
                        <th>Peso</th>
                        <th>IMC</th>
                        <th>Classificação</th>
                    </tr>
                </thead>

                <tbody id="tabela-pessoas">
                </tbody>
            </table>
        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
