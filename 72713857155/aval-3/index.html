<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Calculadora de IMC </title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
    <main>
        <h1> Calculadora de IMC </h1>

        <section class="card">
            <h2 id="titulo-form"> Nova pessoa</h2>

            <form id="form-pessoa" novaidade>
                <div class="campo campo-nome">
                    <label for="input-nome"> nome</label>
                    <input type="text" id="input-nome" maxlenght="58" placeholder="ex.: Maria Silva">

                </div>

                <div class="campo">
                    <label for="input-idade"> idade(anos)</label>

                    <input type="number" id="input-idade" min="1" max=120 step="1" placeholder="ex.: 30">

                </div>

                <div class="campo">
                    <label for="input-peso"> peso(kg)</label>

                    <input type="number" id="input-peso" min="2" max=500 step="0.1" placeholder="ex.: 70">
                </div>

                <div class="campo">
                    <label for="input-altura"> altura(m)</label>

                    <input type="number" id="input-altura" min="0.5" max="2.5" step="0.01" placeholder="ex.: 1.75">
                </div>

                <div class="botoes">
                    <button type="submit" id="btn-salvar"> salvar </button>
                    <button type="button" id="btn-cancelar" class="secundario" hidden> cancelar </button>
                </div>

            </form>
          
            <p id="erro" role="alert" hidden> </p>
        </section>

        <section class="card">
            <h2> Pessoas cadastradas</h2>

            <div class="tabela-wrapper">
                <table>
                    <thead>
                    <tr>
                        <th> Nome </th>
                        <th> Idade </th>
                        <th> Peso </th>
                        <th> Altura </th>
                        <th> IMC </th>
                        <th> Classificação </th>
                        <th> Ações </th>
                    </tr>
                </thead>

                <tbody id="tabela-pessoas">
                </tbody>
            </table>
            </div>
        </section>
    </main> 
    
    <script src="app.js"></script>
        
<script src="script.js"></script></body>

</html>
