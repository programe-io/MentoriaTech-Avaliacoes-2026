<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <header class="app-header">
            <h1><i class="ph ph-check-square-offset"></i> Gestor de Tarefas</h1>
            <p>Organiza o teu dia a dia com facilidade</p>
        </header>

        <!-- Formulário de Cadastro -->
        <section class="card">
            <h2><i class="ph ph-plus-circle"></i> Nova Tarefa</h2>
            
            <!-- Mensagem de erro/sucesso -->
            <div id="mensagem" class="alert hidden"></div>

            <form id="formTarefa">
                <div class="form-group">
                    <label for="titulo">Título da Tarefa</label>
                    <input 
                        type="text" 
                        id="titulo" 
                        placeholder="Ex: Cadastrar Clientes (mínimo 5 caracteres)"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" required>
                        <option value="" disabled selected>Seleciona a prioridade</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="ph ph-floppy-disk"></i> Cadastrar Tarefa
                </button>
            </form>
        </section>

        <!-- Lista de Tarefas -->
        <section class="card">
            <div class="list-header">
                <h2><i class="ph ph-list-checks"></i> As Minhas Tarefas</h2>
                <span id="contadorTarefas" class="badge-count">0 tarefas</span>
            </div>

            <div id="listaTarefas" class="task-list">
                <!-- As tarefas serão inseridas aqui via JS -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
