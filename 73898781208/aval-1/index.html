<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <input type="text" id="descricao" placeholder="Descrição">
        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="number" id="valor" placeholder="Valor">

        <button onclick="cadastrar()">Cadastrar Produto</button>

        <h2>Lista de Produtos</h2>
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>

    <script>
        let produtos = [];
        let codigo = 1;

        function cadastrar() {
            const descricao = document.getElementById("descricao").value.trim();
            const quantidade = Number(document.getElementById("quantidade").value);
            const valor = Number(document.getElementById("valor").value);

            if (descricao.length < 5 || quantidade < 1 || valor < 0 ||
                document.getElementById("quantidade").value === "" ||
                document.getElementById("valor").value === "") {
                alert("Preencha os campos corretamente!");
                return;
            }

            produtos.push({ codigo, descricao, quantidade, valor });
            codigo++;

            document.getElementById("lista").innerHTML = produtos.map(p =>
                `<tr>
                    <td>${p.codigo}</td>
                    <td>${p.descricao.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;")}</td>
                    <td>${p.quantidade}</td>
                    <td>R$ ${p.valor.toFixed(2).replace(".", ",")}</td>
                </tr>`
            ).join("");

            document.getElementById("descricao").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("valor").value = "";
        }
    </script>

<script src="script.js"></script></body>
</html>
