<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Controle de Estoque</h1>

        <form id="formProduto">
            <input type="text" id="descricao" placeholder="Descrição do produto" required>
            <input type="number" id="quantidade" placeholder="Quantidade" min="1" required>
            <input type="number" id="valor" placeholder="Valor (R$)" min="0.01" step="0.01" required>
            <button type="submit">Cadastrar Produto</button>
        </form>

        <h2>Produtos cadastrados</h2>
        <div id="listaProdutos"></div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
