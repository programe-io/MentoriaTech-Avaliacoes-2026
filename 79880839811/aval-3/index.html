<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clone Instagram - Feed</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://tailwindcss.com"></script>
  <!-- Boxicons CDN para os ícones -->
  <link href="https://unpkg.com" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

  <!-- CABEÇALHO (O código da sua imagem integrado) -->
  <header class="sticky top-0 bg-white border-b border-gray-200 z-50">
    <div class="max-w-4xl mx-auto px-4">
      <div class="flex items-center justify-between h-14">
        
        <!-- Logo -->
        <h1 class="font-semibold text-xl tracking-wide cursor-pointer">Instagram</h1>

        <!-- Barra de Pesquisa -->
        <div class="hidden sm:block relative">
          <i class="bx bx-search absolute left-3 top-2.5 text-gray-400 text-sm"></i>
          <input 
            type="text"
            placeholder="Pesquisar"
            class="bg-gray-100 pl-9 pr-4 py-1.5 rounded-lg text-sm w-64 focus:outline-none focus:ring-1 focus:ring-gray-300"
          />
        </div>

        <!-- Ícones de Navegação -->
        <div class="flex items-center gap-5 text-2xl">
          <i class="bx bx-home-alt-2 cursor-pointer hover:scale-105 transition-transform"></i>
          <i class="bx bx-paper-plane cursor-pointer hover:scale-105 transition-transform"></i>
          <i class="bx bx-plus-circle cursor-pointer hover:scale-105 transition-transform"></i>
          <i class="bx bx-compass cursor-pointer hover:scale-105 transition-transform"></i>
          <i class="bx bx-heart cursor-pointer hover:scale-105 transition-transform"></i>
          <!-- Foto de Perfil (Miniatura) -->
          <img src="https://unsplash.com" alt="Perfil" class="w-6 h-6 rounded-full object-cover border border-gray-300 cursor-pointer">
        </div>

      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL (Feed + Barra Lateral) -->
  <main class="max-w-4xl mx-auto pt-6 grid grid-cols-1 md:grid-cols-3 gap-8 px-4">
    
    <!-- COLUNA DO FEED (Stories e Posts) -->
    <section class="col-span-1 md:col-span-2 space-y-4">
      
      <!-- SEÇÃO DE STORIES -->
      <div class="bg-white border border-gray-200 rounded-lg p-4 flex gap-4 overflow-x-auto scrollbar-none">
        <!-- Story 1 (Você) -->
        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
          <div class="w-16 h-16 rounded-full p-[2px] border-2 border-pink-500">
            <img src="https://unsplash.com" class="w-full h-full rounded-full object-cover">
          </div>
          <span class="text-xs mt-1 text-gray-500 max-w-[64px] truncate">Seu story</span>
        </div>
        <!-- Story 2 -->
        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
          <div class="w-16 h-16 rounded-full p-[2px] border-2 border-pink-500">
            <img src="https://unsplash.com" class="w-full h-full rounded-full object-cover">
          </div>
          <span class="text-xs mt-1 text-gray-500 max-w-[64px] truncate">lucas_silva</span>
        </div>
        <!-- Story 3 -->
        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
          <div class="w-16 h-16 rounded-full p-[2px] border-2 border-pink-500">
            <img src="https://unsplash.com" class="w-full h-full rounded-full object-cover">
          </div>
          <span class="text-xs mt-1 text-gray-500 max-w-[64px] truncate">marina.r</span>
        </div>
      </div>

      <!-- CARD DE POSTAGEM -->
      <article class="bg-white border border-gray-200 rounded-lg">
        <!-- Topo do Post -->
        <div class="flex items-center justify-between p-3">
          <div class="flex items-center gap-3">
            <img src="https://unsplash.com" class="w-8 h-8 rounded-full object-cover">
            <span class="font-semibold text-sm cursor-pointer hover:underline">marina.r</span>
          </div>
          <i class="bx bx-dots-horizontal-rounded text-xl cursor-pointer"></i>
        </div>

        <!-- Imagem do Post -->
        <img src="https://unsplash.com" alt="Post" class="w-full h-auto object-cover max-h-[500px]">

        <!-- Ações do Post -->
        <div class="p-3 space-y-2">
          <div class="flex justify-between text-2xl">
            <div class="flex gap-4">
              <i class="bx bx-heart cursor-pointer hover:text-gray-500"></i>
              <i class="bx bx-comment cursor-pointer hover:text-gray-500"></i>
              <i class="bx bx-paper-plane cursor-pointer hover:text-gray-500"></i>
            </div>
            <i class="bx bx-bookmark cursor-pointer hover:text-gray-500"></i>
          </div>

          <!-- Curtidas e Legenda -->
          <div class="text-sm space-y-1">
            <p class="font-semibold">4.218 curtidas</p>
            <p><span class="font-semibold mr-2 cursor-pointer hover:underline">marina.r</span>Conectada com a natureza no fim de semana! 🌿✨</p>
            <p class="text-gray-400 text-xs uppercase tracking-wide pt-1">Há 2 horas</p>
          </div>
        </div>

        <!-- Área de Comentário -->
        <div class="border-t border-gray-100 p-3 flex items-center justify-between">
          <div class="flex items-center gap-3 w-full">
            <i class="bx bx-smile text-2xl cursor-pointer"></i>
            <input type="text" placeholder="Adicione um comentário..." class="w-full text-sm focus:outline-none bg-transparent">
          </div>
          <button class="text-blue-500 font-semibold text-sm opacity-50 cursor-default">Publicar</button>
        </div>
      </article>

    </section>

    <!-- BARRA LATERAL (Sugestões) -->
    <aside class="hidden md:block col-span-1 space-y-4 pt-2">
      <!-- Usuário Atual -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="https://unsplash.com" class="w-14 h-14 rounded-full object-cover">
          <div>
            <p class="font-semibold text-sm">seu_usuario</p>
            <p class="text-gray-400 text-sm">Seu Nome</p>
          </div>
        </div>
        <button class="text-blue-500 font-semibold text-xs">Mudar</button>
      </div>

      <!-- Título de Sugestões -->
      <div class="flex justify-between text-sm">
        <span class="text-gray-400 font-semibold">Sugestões para você</span>
        <button class="text-gray-900 font-semibold text-xs">Ver tudo</button>
      </div>

      <!-- Lista de Sugestões -->
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img src="https://unsplash.com" class="w-8 h-8 rounded-full object-cover">
            <div>
              <p class="font-semibold text-xs">thiago.costa</p>
              <p class="text-gray-400 text-[10px]">Seguido(a) por marina.r</p>
            </div>
          </div>
          <button class="text-blue-500 font-semibold text-xs">Seguir</button>
        </div>
      </div>
    </aside>

  </main>

</body>
</html>
<article class="bg-white border rounded-lg mb-4">

    <!-- Header -->
    <div class="flex justify-between items-center p-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gray-300"></div>
            <span class="font-semibold text-sm">usuario</span>
        </div>
        <i class="bx bx-dots-horizontal"></i>
    </div>

    <!-- Imagem -->
    <img 
        src="https://via.placeholder.com/500" 
        class="w-full"
    />

    <!-- Ações -->
    <div class="p-4">
        <div class="flex justify-between mb-2">
            <div class="flex gap-4">
                <i class="bx bx-heart"></i>
                <i class="bx bx-message-rounded"></i>
            </div>
            <i class="bx bx-bookmark"></i>
        </div>

        <p class="text-sm font-semibold">1.234 curtidas</p>
    </div>

</article>
