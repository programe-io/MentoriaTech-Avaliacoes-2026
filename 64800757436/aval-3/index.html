<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Clone</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #fafafa;
  color: #262626;
}

header {
  height: 65px;
  background: white;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: space-around;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-family: cursive;
  font-size: 29px;
  font-weight: bold;
}

.search {
  background: #efefef;
  border: none;
  padding: 11px 15px;
  border-radius: 8px;
  outline: none;
}

.menu {
  display: flex;
  gap: 22px;
  font-size: 23px;
  cursor: pointer;
}

.container {
  max-width: 950px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: 600px 290px;
  gap: 30px;
}

.stories {
  background: white;
  border: 1px solid #ddd;
  padding: 18px;
  display: flex;
  gap: 18px;
  overflow-x: auto;
  border-radius: 8px;
  margin-bottom: 22px;
}

.story {
  text-align: center;
  font-size: 12px;
  cursor: pointer;
  flex-shrink: 0;
}

.story img {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  padding: 3px;
  border: 3px solid #e1306c;
  object-fit: cover;
  margin-bottom: 5px;
}

.post {
  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin-bottom: 25px;
}

.post-header {
  display: flex;
  align-items: center;
  padding: 13px;
  gap: 10px;
}

.post-header img,
.profile img {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  object-fit: cover;
}

.post-image {
  width: 100%;
  display: block;
  max-height: 650px;
  object-fit: cover;
}

.actions {
  padding: 12px;
  font-size: 26px;
  display: flex;
  gap: 15px;
}

.actions span {
  cursor: pointer;
}

.actions .liked {
  color: #ed4956;
}

.post-info {
  padding: 0 13px 15px;
  font-size: 14px;
}

.post-info p {
  margin-top: 7px;
}

.comment-box {
  display: flex;
  border-top: 1px solid #eee;
  padding: 12px;
}

.comment-box input {
  flex: 1;
  border: none;
  outline: none;
}

.comment-box button {
  background: none;
  border: none;
  color: #0095f6;
  font-weight: bold;
  cursor: pointer;
}

.sidebar {
  padding-top: 10px;
}

.profile {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 25px;
}

.suggestion {
  color: #888;
  font-size: 14px;
  margin-bottom: 20px;
}

.suggestion-user {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 15px 0;
  font-size: 13px;
}

.suggestion-user button {
  border: none;
  color: #0095f6;
  background: none;
  font-weight: bold;
  cursor: pointer;
}

.create {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: #0095f6;
  color: white;
  border: none;
  padding: 16px 22px;
  border-radius: 30px;
  cursor: pointer;
  font-size: 16px;
  box-shadow: 0 4px 12px #0003;
}

@media(max-width: 850px) {
  .container {
    display: block;
    max-width: 600px;
    margin: 15px auto;
  }

  .sidebar {
    display: none;
  }

  .search {
    display: none;
  }

  header {
    justify-content: space-around;
  }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
  <div class="logo">Instagram</div>
  <input class="search" placeholder="Pesquisar">
  <nav class="menu">
    <span>⌂</span>
    <span>♡</span>
    <span>＋</span>
    <span>✉</span>
    <span>☻</span>
  </nav>
</header>

<div class="container">

<main>

<section class="stories">

<div class="story">
<img src="https://i.pravatar.cc/100?img=1">
<p>Seu story</p>
</div>

<div class="story">
<img src="https://i.pravatar.cc/100?img=2">
<p>mariana</p>
</div>

<div class="story">
<img src="https://i.pravatar.cc/100?img=3">
<p>pedro</p>
</div>

<div class="story">
<img src="https://i.pravatar.cc/100?img=4">
<p>julia</p>
</div>

<div class="story">
<img src="https://i.pravatar.cc/100?img=5">
<p>gabriel</p>
</div>

<div class="story">
<img src="https://i.pravatar.cc/100?img=6">
<p>ana</p>
</div>

</section>

<div id="feed"></div>

</main>

<aside class="sidebar">

<div class="profile">
<img src="https://i.pravatar.cc/100?img=12">
<div>
<strong>meu_usuario</strong>
<p style="color:gray">Meu perfil</p>
</div>
</div>

<p class="suggestion">Sugestões para você</p>

<div class="suggestion-user">
<span>👤 usuario_01</span>
<button>Seguir</button>
</div>

<div class="suggestion-user">
<span>👤 usuario_02</span>
<button>Seguir</button>
</div>

<div class="suggestion-user">
<span>👤 usuario_03</span>
<button>Seguir</button>
</div>

</aside>
</div>

<button class="create" onclick="newPost()">＋ Criar publicação</button>

<script>

const posts = [
  {
    user: "mariana",
    avatar: "https://i.pravatar.cc/100?img=2",
    image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800",
    likes: 1250,
    caption: "Vivendo momentos incríveis! ❤️"
  },
  {
    user: "pedro",
    avatar: "https://i.pravatar.cc/100?img=3",
    image: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800",
    likes: 845,
    caption: "A vida é feita de momentos. 🌎"
  },
  {
    user: "julia",
    avatar: "https://i.pravatar.cc/100?img=4",
    image: "https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=800",
    likes: 2300,
    caption: "Um dia lindo para florescer! 🌸"
  }
];

function renderPosts() {
  const feed = document.getElementById("feed");

  feed.innerHTML = posts.map((post, index) => `
    <article class="post">
      <div class="post-header">
        <img src="${post.avatar}">
        <strong>${post.user}</strong>
      </div>

      <img class="post-image" src="${post.image}">

      <div class="actions">
        <span id="like-${index}"
          onclick="likePost(${index})">♡</span>
        <span onclick="commentPost(${index})">♧</span>
        <span>➤</span>
        <span style="margin-left:auto">♧</span>
      </div>

      <div class="post-info">
        <strong id="likes-${index}">
          ${post.likes.toLocaleString("pt-BR")} curtidas
        </strong>
        <p><strong>${post.user}</strong> ${post.caption}</p>
        <p id="comments-${index}"></p>
        <p style="color:gray">Ver todos os comentários</p>
      </div>

      <div class="comment-box">
        <input id="input-${index}" placeholder="Adicione um comentário...">
        <button onclick="sendComment(${index})">Publicar</button>
      </div>
    </article>
  `).join("");
}

function likePost(index) {
  const post = posts[index];
  const button = document.getElementById("like-" + index);

  post.liked = !post.liked;
  post.likes += post.liked ? 1 : -1;

  button.innerHTML = post.liked ? "♥" : "♡";
  button.classList.toggle("liked", post.liked);

  document.getElementById("likes-" + index).innerText =
    post.likes.toLocaleString("pt-BR") + " curtidas";
}

function sendComment(index) {
  const input = document.getElementById("input-" + index);
  const comments = document.getElementById("comments-" + index);

  if(input.value.trim() === "") return;

  const p = document.createElement("p");
  const strong = document.createElement("strong");
  strong.textContent = "meu_usuario ";
  p.append(strong, document.createTextNode(input.value));

  comments.appendChild(p);
  input.value = "";
}

function commentPost(index) {
  document.getElementById("input-" + index).focus();
}

function newPost() {
  const image = prompt("Cole o link da imagem:");

  if(!image) return;

  posts.unshift({
    user: "meu_usuario",
    avatar: "https://i.pravatar.cc/100?img=12",
    image: image,
    likes: 0,
    caption: "Minha nova publicação! ✨"
  });

  renderPosts();
}

renderPosts();

</script>

<script src="script.js"></script></body>
</html>
