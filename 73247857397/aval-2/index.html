<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith — Espaço de Foco e Som Ambiente</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="app-container">
    <header class="header">
      <h1 class="logo">ZENITH</h1>
      <p class="tagline">Ambiente Minimalista para Foco e Relaxamento</p>
    </header>

    <main class="main-content">
      <!-- Pomodoro Timer -->
      <section class="card timer-card">
        <h2>Timer de Foco</h2>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="btn-start" class="btn primary">Iniciar</button>
          <button id="btn-pause" class="btn secondary" disabled>Pausar</button>
          <button id="btn-reset" class="btn outline">Reiniciar</button>
        </div>
        <div class="mode-selector">
          <button class="mode-btn active" data-time="1500">Foco (25m)</button>
          <button class="mode-btn" data-time="300">Pausa Curta (5m)</button>
          <button class="mode-btn" data-time="900">Pausa Longa (15m)</button>
        </div>
      </section>

      <!-- Sintetizador de Som Ambiente -->
      <section class="card sound-card">
        <h2>Sons Ambientes</h2>
        <div class="sound-grid">
          <div class="sound-item">
            <span class="sound-icon">🌧️</span>
            <span class="sound-label">Chuva</span>
            <input type="range" id="vol-rain" min="0" max="1" step="0.01" value="0">
          </div>
          <div class="sound-item">
            <span class="sound-icon">🌊</span>
            <span class="sound-label">Ondas</span>
            <input type="range" id="vol-waves" min="0" max="1" step="0.01" value="0">
          </div>
          <div class="sound-item">
            <span class="sound-icon">💨</span>
            <span class="sound-label">Vento</span>
            <input type="range" id="vol-wind" min="0" max="1" step="0.01" value="0">
          </div>
          <div class="sound-item">
            <span class="sound-icon">⚡</span>
            <span class="sound-label">Ruído Marrom</span>
            <input type="range" id="vol-noise" min="0" max="1" step="0.01" value="0">
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p id="quote-display">"O foco é a arte de saber o que ignorar."</p>
    </footer>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
