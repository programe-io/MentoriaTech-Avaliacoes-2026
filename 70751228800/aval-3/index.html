<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h2>Controle de IMC</h2>
        
        <form id="formImc">
            <input type="text" id="nome" placeholder="Nome do Paciente" required>
            <input type="number" id="peso" placeholder="Peso (kg)" step="0.1" min="1" required>
            <input type="number" id="altura" placeholder="Altura (m) ex: 1.75" step="0.01" min="0.5" required>
            <button type="submit">Calcular IMC</button>
        </form>

        <div id="resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
