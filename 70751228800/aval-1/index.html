<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>
        
        <form id="task-form">
            <div class="form-group">
                <label for="title">Título da Tarefa:</label>
                <input type="text" id="title" required minlength="5" placeholder="Digite o título (mín. 5 caracteres)">
            </div>
            
            <div class="form-group">
                <label for="priority">Prioridade (1 - Alta, 2 - Média, 3 - Baixa):</label>
                <input type="number" id="priority" min="1" max="3" value="1" required>
            </div>
            
            <button type="submit">Cadastrar Tarefa</button>
        </form>

        <div class="task-list-container">
            <h2>Tarefas Cadastradas</h2>
            <ul id="task-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
