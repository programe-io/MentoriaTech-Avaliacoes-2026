
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Ficha de Anamnese</h1>

        <h2>Cadastro de Paciente</h2>

        <form id="formPessoa">

            <input type="text" id="nome" placeholder="Nome do paciente">

            <input type="number" id="idade" placeholder="Idade">

            <input type="number" id="altura" step="0.01" placeholder="Altura (metros)">

            <input type="number" id="peso" step="0.1" placeholder="Peso (KG)">

            <p id="erro" hidden></p>

            <button type="submit">Salvar Paciente</button>

        </form>

        <h2>Pacientes Cadastrados</h2>

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Altura</th>
                    <th>Peso</th>
                    <th>IMC</th>
                    <th>Classificação</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody id="listaPessoas"></tbody>
        </table>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
