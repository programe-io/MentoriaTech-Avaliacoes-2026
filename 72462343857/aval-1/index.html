<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Produtos</title>
    <link rel="stylesheet" href="style.css">
   
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
    <header class="cabecalho">
        <h1>Controle de Produtos</h1>
        <p>Gerencie seus produtos e seu estoque</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" placeholder="Ex.: Teclado Gamer" required minlength="5">
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="1" step="1" placeholder="Ex.: 10" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor unitário (R$)</label>
                    <input type="number" id="valor" min="0" step="0.01" placeholder="Ex.: 99,90" required>
                </div>

                <button type="submit" class="btn btn-principal">
                    Cadastrar produto
                </button>
            </form>
        </section>

        <section class="card">
            <h2>Atualizar produto</h2>

            <form id="formAtualizar">
                <div class="campo">
                    <label for="codigoAtualizar">Código do produto</label>
                    <input type="number" id="codigoAtualizar" min="1" step="1" required>
                </div>

                <div class="campo">
                    <label for="novoValor">Novo valor (R$)</label>
                    <input type="number" id="novoValor" min="0" step="0.01" required>
                </div>

                <button type="submit" class="btn btn-secundario">
                    Atualizar valor
                </button>
            </form>

            <hr>

            <form id="formEstoque">
                <div class="campo">
                    <label for="codigoEstoque">Código do produto</label>
                    <input type="number" id="codigoEstoque" min="1" step="1" required>
                </div>

                <div class="campo">
                    <label for="quantidadeEstoque">Adicionar ao estoque</label>
                    <input type="number" id="quantidadeEstoque" min="1" step="1" required>
                </div>

                <button type="submit" class="btn btn-secundario">
                    Adicionar estoque
                </button>
            </form>
        </section>

        <section class="card lista-card">
            <div class="lista-cabecalho">
                <h2>Produtos cadastrados</h2>
                <span id="totalProdutos">0 produtos</span>
            </div>

            <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor unitário</th>
                            <th>Total em estoque</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="6" class="vazio">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Sistema de Controle de Produtos</p>
    </footer>
     <script src="app.js"></script>
<script src="script.js"></script></body>

</html>
