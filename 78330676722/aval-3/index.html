<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oceanos e Aquários</title>

<style>
*{
    margin:0;
        padding:0;
            box-sizing:border-box;
            }

            body{
                font-family: Arial, sans-serif;
                    background: linear-gradient(to bottom, #001f3f, #0074D9);
                        color:white;
                            text-align:center;
                            }

                            header{
                                padding:40px 20px;
                                    background: rgba(0,0,0,0.3);
                                    }

                                    h1{
                                        font-size:3rem;
                                        }

                                        section{
                                            padding:30px;
                                            }

                                            .aquario{
                                                width:80%;
                                                    max-width:700px;
                                                        height:250px;
                                                            margin:20px auto;
                                                                border:8px solid #87CEEB;
                                                                    border-radius:20px;
                                                                        background: linear-gradient(to bottom, #00bfff, #003366);
                                                                            position:relative;
                                                                                overflow:hidden;
                                                                                }

                                                                                .peixe{
                                                                                    position:absolute;
                                                                                        font-size:40px;
                                                                                            animation:nadar 12s linear infinite;
                                                                                            }

                                                                                            .peixe:nth-child(1){
                                                                                                top:40px;
                                                                                                    animation-duration:10s;
                                                                                                    }

                                                                                                    .peixe:nth-child(2){
                                                                                                        top:120px;
                                                                                                            animation-duration:14s;
                                                                                                            }

                                                                                                            .peixe:nth-child(3){
                                                                                                                top:180px;
                                                                                                                    animation-duration:8s;
                                                                                                                    }

                                                                                                                    @keyframes nadar{
                                                                                                                        from{
                                                                                                                                left:-60px;
                                                                                                                                    }
                                                                                                                                        to{
                                                                                                                                                left:100%;
                                                                                                                                                    }
                                                                                                                                                    }

                                                                                                                                                    button{
                                                                                                                                                        padding:12px 24px;
                                                                                                                                                            border:none;
                                                                                                                                                                border-radius:8px;
                                                                                                                                                                    background:#00c3ff;
                                                                                                                                                                        color:white;
                                                                                                                                                                            font-size:16px;
                                                                                                                                                                                cursor:pointer;
                                                                                                                                                                                }

                                                                                                                                                                                button:hover{
                                                                                                                                                                                    background:#0099cc;
                                                                                                                                                                                    }

                                                                                                                                                                                    #curiosidade{
                                                                                                                                                                                        margin-top:20px;
                                                                                                                                                                                            font-size:18px;
                                                                                                                                                                                                font-weight:bold;
                                                                                                                                                                                                }
                                                                                                                                                                                                </style>
                                                                                                                                                                                                <script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
                                                                                                                                                                                                <body>

                                                                                                                                                                                                <header>
                                                                                                                                                                                                    <h1>🌊 Oceanos e Aquários 🐠</h1>
                                                                                                                                                                                                        <p>Descubra curiosidades incríveis sobre a vida marinha.</p>
                                                                                                                                                                                                        </header>

                                                                                                                                                                                                        <section>
                                                                                                                                                                                                            <div class="aquario">
                                                                                                                                                                                                                    <div class="peixe">🐠</div>
                                                                                                                                                                                                                            <div class="peixe">🐟</div>
                                                                                                                                                                                                                                    <div class="peixe">🐡</div>
                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                            <button onclick="mostrarCuriosidade()">
                                                                                                                                                                                                                                                    Ver Curiosidade Marinha
                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                            <p id="curiosidade"></p>
                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                            function mostrarCuriosidade() {
                                                                                                                                                                                                                                                                const curiosidades = [
                                                                                                                                                                                                                                                                        "🐋 A baleia-azul é o maior animal do planeta.",
                                                                                                                                                                                                                                                                                "🦑 Polvos possuem três corações.",
                                                                                                                                                                                                                                                                                        "🐠 Existem mais de 30 mil espécies de peixes.",
                                                                                                                                                                                                                                                                                                "🌊 Os oceanos cobrem cerca de 71% da Terra.",
                                                                                                                                                                                                                                                                                                        "🪸 Recifes de coral abrigam milhares de espécies marinhas."
                                                                                                                                                                                                                                                                                                            ];

                                                                                                                                                                                                                                                                                                                const sorteio = Math.floor(Math.random() * curiosidades.length);
                                                                                                                                                                                                                                                                                                                    document.getElementById("curiosidade").innerText =
                                                                                                                                                                                                                                                                                                                            curiosidades[sorteio];
                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                            </html>
