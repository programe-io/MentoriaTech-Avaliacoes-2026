<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meio Ambiente e Clima</title>

<style>
*{
    margin:0;
        padding:0;
            box-sizing:border-box;
                font-family: Arial, sans-serif;
                }

                body{
                    background: linear-gradient(135deg, #4CAF50, #81C784);
                        min-height:100vh;
                            display:flex;
                                justify-content:center;
                                    align-items:center;
                                        color:white;
                                        }

                                        .container{
                                            background: rgba(0,0,0,0.25);
                                                padding:30px;
                                                    border-radius:20px;
                                                        width:90%;
                                                            max-width:500px;
                                                                text-align:center;
                                                                    backdrop-filter: blur(5px);
                                                                    }

                                                                    h1{
                                                                        margin-bottom:15px;
                                                                        }

                                                                        .card{
                                                                            background: rgba(255,255,255,0.15);
                                                                                padding:15px;
                                                                                    margin:10px 0;
                                                                                        border-radius:12px;
                                                                                        }

                                                                                        button{
                                                                                            background:#2E7D32;
                                                                                                color:white;
                                                                                                    border:none;
                                                                                                        padding:12px 20px;
                                                                                                            border-radius:10px;
                                                                                                                cursor:pointer;
                                                                                                                    font-size:16px;
                                                                                                                        margin-top:15px;
                                                                                                                        }

                                                                                                                        button:hover{
                                                                                                                            background:#1B5E20;
                                                                                                                            }

                                                                                                                            #mensagem{
                                                                                                                                margin-top:15px;
                                                                                                                                    font-weight:bold;
                                                                                                                                    }
                                                                                                                                    </style>
                                                                                                                                    <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                                                                                                                                    <body>

                                                                                                                                    <div class="container">
                                                                                                                                        <h1>🌎 Meio Ambiente e Clima</h1>

                                                                                                                                            <div class="card">
                                                                                                                                                    <h3>🌡 Temperatura Média</h3>
                                                                                                                                                            <p id="temp">28°C</p>
                                                                                                                                                                </div>

                                                                                                                                                                    <div class="card">
                                                                                                                                                                            <h3>🌬 Qualidade do Ar</h3>
                                                                                                                                                                                    <p id="ar">Boa</p>
                                                                                                                                                                                        </div>

                                                                                                                                                                                            <button onclick="gerarDica()">Gerar Dica Sustentável</button>

                                                                                                                                                                                                <p id="mensagem"></p>
                                                                                                                                                                                                </div>

                                                                                                                                                                                                <script>
                                                                                                                                                                                                const dicas = [
                                                                                                                                                                                                    "🌱 Plante uma árvore e ajude a reduzir o CO₂.",
                                                                                                                                                                                                        "💧 Economize água fechando a torneira ao escovar os dentes.",
                                                                                                                                                                                                            "♻️ Separe corretamente os resíduos recicláveis.",
                                                                                                                                                                                                                "🚲 Use bicicleta ou transporte público sempre que possível.",
                                                                                                                                                                                                                    "🔋 Desligue aparelhos eletrônicos quando não estiver usando.",
                                                                                                                                                                                                                        "🌍 Pequenas ações diárias geram grandes impactos positivos."
                                                                                                                                                                                                                        ];

                                                                                                                                                                                                                        function gerarDica(){
                                                                                                                                                                                                                            const indice = Math.floor(Math.random() * dicas.length);
                                                                                                                                                                                                                                document.getElementById("mensagem").textContent = dicas[indice];
                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                </html>
