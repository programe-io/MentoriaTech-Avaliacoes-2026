<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaBlog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
scroll-behavior:smooth;
}

:root{

--bg:#f5f7fb;
--card:white;
--text:#222;
--sub:#666;
--primary:#6c63ff;
--secondary:#7f53ff;
--shadow:0 15px 40px rgba(0,0,0,.08);

}

.dark{

--bg:#0d1117;
--card:#161b22;
--text:white;
--sub:#bbb;
--shadow:0 15px 40px rgba(0,0,0,.5);

}

body{

background:var(--bg);
color:var(--text);
transition:.4s;

}

.progress{

position:fixed;
top:0;
left:0;
height:5px;
background:linear-gradient(90deg,#6c63ff,#00d4ff);
width:0%;
z-index:999;

}

header{

height:80vh;

background:

linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.6)),
url("https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:30px;

}

header h1{

font-size:70px;
color:white;

}

header p{

font-size:22px;
color:white;
margin-top:15px;

}

nav{

position:sticky;
top:0;
backdrop-filter:blur(15px);
background:rgba(255,255,255,.1);
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:99;

}

.logo{

font-size:28px;
font-weight:bold;
color:white;

}

.menu{

display:flex;
gap:15px;
align-items:center;

}

input{

padding:12px;
border:none;
border-radius:40px;
width:250px;

}

button{

cursor:pointer;
border:none;
padding:12px 18px;
border-radius:30px;
background:linear-gradient(45deg,#6c63ff,#7f53ff);
color:white;
font-weight:bold;
transition:.3s;

}

button:hover{

transform:translateY(-3px);

}

.filters{

display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
padding:30px;

}

.filter{

background:white;
color:#444;
}

.dark .filter{

background:#222;
color:white;

}

.container{

max-width:1300px;
margin:auto;
padding:30px;

display:grid;
grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
gap:30px;

}

.card{

background:var(--card);
border-radius:20px;
overflow:hidden;
box-shadow:var(--shadow);
transition:.4s;
display:flex;
flex-direction:column;

}

.card:hover{

transform:translateY(-12px);

}

.card img{

height:220px;
object-fit:cover;
width:100%;

}

.content{

padding:25px;

}

.category{

display:inline-block;
padding:6px 14px;
border-radius:20px;
background:#6c63ff;
color:white;
font-size:13px;

}

.content h2{

margin:15px 0;

}

.content p{

color:var(--sub);
line-height:1.7;

}

.info{

display:flex;
justify-content:space-between;
margin-top:20px;
color:var(--sub);
font-size:14px;

}

.like{

cursor:pointer;
font-size:22px;
transition:.3s;

}

.like:hover{

transform:scale(1.2);

}

footer{

margin-top:70px;
padding:40px;
text-align:center;
background:#111;
color:white;

}

.top{

position:fixed;
bottom:25px;
right:25px;
width:55px;
height:55px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
background:#6c63ff;
color:white;
cursor:pointer;
display:none;

}

@media(max-width:700px){

header h1{

font-size:45px;

}

nav{

flex-direction:column;
gap:15px;

}

input{

width:100%;

}

}

</style>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="progress"></div>

<header>

<div>

<h1>NovaBlog</h1>

<p>Um blog moderno criado apenas com HTML, CSS e JavaScript.</p>

</div>

</header>

<nav>

<div class="logo">NovaBlog</div>

<div class="menu">

<input id="search" placeholder="Pesquisar...">

<button onclick="toggleTheme()">🌙</button>

</div>

</nav>

<div class="filters">

<button class="filter" onclick="filterCategory('Todos')">Todos</button>
<button class="filter" onclick="filterCategory('Tecnologia')">Tecnologia</button>
<button class="filter" onclick="filterCategory('Design')">Design</button>
<button class="filter" onclick="filterCategory('IA')">IA</button>

</div>

<div class="container" id="posts"></div>

<div class="top" onclick="window.scrollTo({top:0,behavior:'smooth'})">
↑
</div>

<footer>

<h2>NovaBlog</h2>

<p>© 2026 • Desenvolvido com HTML, CSS e JavaScript</p>

</footer>

<script>

const data=[

{
title:"O futuro da Inteligência Artificial",
category:"IA",
img:"https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=900&q=80",
text:"A Inteligência Artificial está revolucionando empresas, educação, medicina e praticamente todos os setores da sociedade.",
likes:22
},

{
title:"As tendências do Web Design",
category:"Design",
img:"https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=900&q=80",
text:"Interfaces minimalistas, animações suaves e experiências cada vez mais intuitivas definem o futuro do design.",
likes:17
},

{
title:"JavaScript em 2026",
category:"Tecnologia",
img:"https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=900&q=80",
text:"Novos recursos tornam o JavaScript ainda mais poderoso para aplicações web modernas.",
likes:41
},

{
title:"Como criar projetos incríveis",
category:"Tecnologia",
img:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=900&q=80",
text:"Aprenda boas práticas para criar projetos que impressionam usuários e recrutadores.",
likes:12
}

]

const container=document.getElementById("posts");

function render(list){

container.innerHTML="";

list.forEach(post=>{

const reading=Math.ceil(post.text.split(" ").length/200)+1;

container.innerHTML+=`

<div class="card">

<img src="${post.img}">

<div class="content">

<span class="category">${post.category}</span>

<h2>${post.title}</h2>

<p>${post.text}</p>

<div class="info">

<span>📖 ${reading} min</span>

<span class="like">❤️ ${post.likes}</span>

</div>

</div>

</div>

`;

});

document.querySelectorAll(".like").forEach(el=>{

el.onclick=()=>{

let n=parseInt(el.innerHTML.replace(/\D/g,""));

n++;

el.innerHTML="❤️ "+n;

}

});

}

render(data);

document.getElementById("search").addEventListener("keyup",e=>{

const t=e.target.value.toLowerCase();

render(data.filter(p=>

p.title.toLowerCase().includes(t)||

p.text.toLowerCase().includes(t)||

p.category.toLowerCase().includes(t)

));

});

function filterCategory(cat){

if(cat=="Todos") render(data);

else render(data.filter(x=>x.category==cat));

}

function toggleTheme(){

document.body.classList.toggle("dark");

}

window.onscroll=()=>{

let scroll=document.documentElement.scrollTop;

let height=document.documentElement.scrollHeight-document.documentElement.clientHeight;

document.querySelector(".progress").style.width=(scroll/height*100)+"%";

document.querySelector(".top").style.display=scroll>500?"flex":"none";

}

</script>

<script src="script.js"></script></body>
</html>
