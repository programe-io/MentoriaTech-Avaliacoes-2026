
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Store</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>NEXUS<span>STORE</span></h1>
    <button onclick="abrirCarrinho()">
        🛒 Carrinho (<span id="contador">0</span>)
    </button>
</header>

<section class="banner">
    <p class="tag">SUA LOJA ONLINE</p>
    <h2>Descubra produtos incríveis!</h2>
    <p>Qualidade, tecnologia e estilo em um só lugar.</p>
</section>

<main>
    <h2>🔥 Produtos em destaque</h2>

    <div class="produtos" id="produtos"></div>

    <section class="carrinho" id="carrinho">
        <h2>🛒 Meu carrinho</h2>

        <div id="itens">
            <p>Seu carrinho está vazio.</p>
        </div>

        <h3>Total: R$ <span id="total">0.00</span></h3>

        <button class="finalizar" onclick="finalizarCompra()">
            Finalizar compra →
        </button>
    </section>
</main>

<footer>
    <p>© 2026 Nexus Store - Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
