<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed - Rede Social</title>
    <!-- Link para a folha de estilos externa -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-globe"></i> DevNetwork
        </div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Pesquisar na rede...">
        </div>
        <div class="user-profile-header">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Foto de perfil">
        </div>
    </header>

    <!-- Layout Principal com Menu e Feed -->
    <div class="main-container">

        <!-- Menu de Navegação Lateral -->
        <nav class="sidebar">
            <ul>
                <li class="active"><a href="#"><i class="fa-solid fa-house"></i> Início</a></li>
                <li><a href="#"><i class="fa-solid fa-user"></i> Meu Perfil</a></li>
                <li><a href="#"><i class="fa-solid fa-bell"></i> Notificações</a></li>
                <li><a href="#"><i class="fa-solid fa-envelope"></i> Mensagens</a></li>
                <li><a href="#"><i class="fa-solid fa-gear"></i> Configurações</a></li>
            </ul>
        </nav>

        <!-- Seção Central do Feed -->
        <main class="feed-container">

            <!-- Área para Nova Publicação -->
            <section class="new-post-card">
                <div class="new-post-header">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar">
                    <textarea id="post-text" placeholder="No que você está pensando hoje?"></textarea>
                </div>
                <div class="new-post-footer">
                    <div class="attachment-options">
                        <label for="post-image-input" class="attach-btn">
                            <i class="fa-solid fa-image"></i> Foto
                        </label>
                        <input type="file" id="post-image-input" accept="image/*" style="display: none;">
                    </div>
                    <button id="publish-btn" class="btn-publish">Publicar</button>
                </div>
            </section>

            <!-- Lista de Postagens -->
            <div id="posts-feed">

                <!-- Postagem 1 (Exemplo Inicial) -->
                <article class="post-card">
                    <div class="post-header">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80" alt="Avatar do usuário">
                        <div class="post-user-info">
                            <h4>Carlos Silva</h4>
                            <span>Há 2 horas</span>
                        </div>
                    </div>
                    <div class="post-content">
                        <p>Explorando novos conceitos de design de interfaces hoje! O que acharam dessa combinação de cores moderna e minimalista? 🚀✨</p>
                        <img src="https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?w=800&auto=format&fit=crop&q=80" alt="Imagem da publicação" class="post-img">
                    </div>
                    <div class="post-actions">
                        <button class="action-btn like-btn"><i class="fa-regular fa-thumbs-up"></i> Curtir (<span class="like-count">14</span>)</button>
                        <button class="action-btn"><i class="fa-regular fa-comment"></i> Comentar</button>
                        <button class="action-btn"><i class="fa-solid fa-share"></i> Compartilhar</button>
                    </div>
                </article>

            </div>

        </main>
    </div>

    <!-- Rodapé -->
    <footer class="footer">
        <p>&copy; 2026 DevNetwork - Francisco Diogo</p>
        <div class="footer-links">
            <a href="#">Privacidade</a>
            <a href="#">Termos</a>
            <a href="#">Ajuda</a>
        </div>
    </footer>

    <!-- Link para o script externo -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
