<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos Customizados -->
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <!-- LAYOUT PRINCIPAL -->
    <div class="flex min-h-screen">

        <!-- SIDEBAR DE NAVEGAÇÃO (Desktop) -->
        <aside class="hidden md:flex flex-col justify-between w-64 border-r border-gray-200 bg-white p-4 fixed h-screen z-20">
            <div>
                <!-- Logo -->
                <div class="p-4 mb-4">
                    <h1 class="text-2xl font-bold tracking-tight italic font-serif">Instagram</h1>
                </div>
                <!-- Links do Menu -->
                <nav class="space-y-1">
                    <a href="#" class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-100 font-semibold text-black"><i class="fa-solid fa-house text-xl w-6"></i> Página Inicial</a>
                    <a href="#" class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-100 text-gray-700"><i class="fa-solid fa-magnifying-glass text-xl w-6"></i> Pesquisa</a>
                    <a href="#" class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-100 text-gray-700"><i class="fa-regular fa-compass text-xl w-6"></i> Explorar</a>
                    <a href="#" class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-100 text-gray-700"><i class="fa-solid fa-clapperboard text-xl w-6"></i> Reels</a>
                    <a href="#" class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-100 text-gray-700"><i class="fa-regular fa-paper-plane text-xl w-6"></i> Mensagens</a>
                    <a href="#" class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-100 text-gray-700"><i class="fa-regular fa-heart text-xl w-6"></i> Notificações</a>
                    <a href="#" class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-100 text-gray-700"><i class="fa-regular fa-square-plus text-xl w-6"></i> Criar</a>
                    <a href="#" class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-100 text-gray-700">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100" class="w-6 h-6 rounded-full object-cover" alt="Perfil"> Perfil
                    </a>
                </nav>
            </div>
            <!-- Mais opções -->
            <div class="p-2">
                <a href="#" class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-100 text-gray-700"><i class="fa-solid fa-bars text-xl w-6"></i> Mais</a>
            </div>
        </aside>

        <!-- CONTEÚDO CENTRAL -->
        <main class="flex-1 md:ml-64 flex justify-center pb-16 md:pb-0">
            <div class="w-full max-w-2xl px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- FEED PRINCIPAL (Esquerda/Centro) -->
                <div class="lg:col-span-2 w-full space-y-4">
                    
                    <!-- STORIES -->
                    <div id="stories-container" class="bg-white border border-gray-200 rounded-xl p-4 flex gap-4 overflow-x-auto scrollbar-none">
                        <!-- Inserido dinamicamente via JS -->
                    </div>

                    <!-- FEED DE POSTS -->
                    <div id="feed-container" class="space-y-4">
                        <!-- Post gerado via JS -->
                    </div>
                </div>

                <!-- SIDEBAR DIREITA (Sugestões de Perfil) -->
                <div class="hidden lg:block space-y-4">
                    <!-- Perfil Logado -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=150" class="w-14 h-14 rounded-full object-cover">
                            <div>
                                <h4 class="font-semibold text-sm">seu_usuario</h4>
                                <p class="text-gray-500 text-xs">Seu Nome Completo</p>
                            </div>
                        </div>
                        <button class="text-blue-500 text-xs font-semibold hover:text-blue-700">Mudar</button>
                    </div>

                    <!-- Sugestões -->
                    <div class="flex justify-between items-center">
                        <span class="text-gray-500 font-semibold text-sm">Sugestões para você</span>
                        <button class="text-xs font-semibold hover:text-gray-700">Ver tudo</button>
                    </div>

                    <div id="suggestions-container" class="space-y-3">
                        <!-- Preenchido via JS -->
                    </div>

                    <!-- Rodapé Links -->
                    <div class="text-xs text-gray-400 space-y-2 pt-4">
                        <p>Sobre • Ajuda • Imprensa • API • Carreiras • Privacidade • Termos • Localizações • Idioma</p>
                        <p>© 2026 INSTAGRAM FROM META</p>
                    </div>
                </div>

            </div>
        </main>

        <!-- BARRA DE NAVEGAÇÃO INFERIOR (Mobile) -->
        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center p-3 z-30">
            <a href="#" class="text-xl text-black"><i class="fa-solid fa-house"></i></a>
            <a href="#" class="text-xl text-gray-700"><i class="fa-solid fa-magnifying-glass"></i></a>
            <a href="#" class="text-xl text-gray-700"><i class="fa-regular fa-square-plus"></i></a>
            <a href="#" class="text-xl text-gray-700"><i class="fa-solid fa-clapperboard"></i></a>
            <a href="#" class="text-xl text-gray-700"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100" class="w-6 h-6 rounded-full object-cover"></a>
        </nav>

    </div>

    <!-- Script JavaScript -->
    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
