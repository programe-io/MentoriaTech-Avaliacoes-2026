<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaCook • Receitas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Barra Lateral (Desktop) / Barra Inferior (Mobile) -->
    <aside class="sidebar">
        <div class="logo">InstaCook</div>
        
        <nav class="menu-nav">
            <button class="nav-btn ativo" data-aba="feed">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M9.005 16.545a2.997 2.997 0 0 1 2.997-2.997A2.997 2.997 0 0 1 15 16.545V22h7V11.543L12 2 2 11.543V22h7.005Z"/></svg>
                <span>Página inicial</span>
            </button>

            <button class="nav-btn" data-aba="busca">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span>Pesquisar</span>
            </button>

            <button class="nav-btn" id="btn-abrir-criar">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                <span>Criar receita</span>
            </button>

            <button class="nav-btn" data-aba="salvos">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 21 12 16 5 21 5 3 19 3 19 21"/></svg>
                <span>Salvos</span>
            </button>
        </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <!-- Cabeçalho Mobile -->
        <header class="mobile-header">
            <span class="logo">InstaCook</span>
            <button id="btn-criar-mobile" class="btn-icon-mobile">➕</button>
        </header>

        <!-- Barra de Pesquisa (aparece ao clicar em Pesquisar) -->
        <div id="area-busca" class="area-busca oculto">
            <input type="text" id="input-busca" placeholder="Pesquisar receitas, ingredientes ou @chefs...">
        </div>

        <!-- Barra de Stories -->
        <section class="stories-bar" id="stories-bar">
            <!-- Renderizado via JS -->
        </section>

        <!-- Título de Seção (para Salvos) -->
        <div id="titulo-secao" class="titulo-secao oculto">
            <h3>🔖 Suas Receitas Salvas</h3>
        </div>

        <!-- Feed de Postagens -->
        <section class="feed" id="feed">
            <!-- Renderizado via JS -->
        </section>
    </main>

    <!-- Visualizador de Story em Tela Cheia -->
    <div id="story-viewer" class="story-viewer oculto">
        <div class="story-box">
            <div class="story-progress-bar"><div id="story-progress"></div></div>
            <div class="story-top">
                <span id="story-user">@usuario</span>
                <button id="fechar-story">&times;</button>
            </div>
            <img id="story-img" src="" alt="Story">
            <div class="story-caption" id="story-caption"></div>
        </div>
    </div>

    <!-- Modal de Criar Nova Receita -->
    <div id="modal-criar" class="modal oculto">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Criar nova receita</h3>
                <button id="fechar-modal">&times;</button>
            </div>
            <form id="form-receita">
                <label class="upload-area" for="input-foto">
                    <span id="upload-texto">📷 Clique para escolher uma foto do prato</span>
                    <img id="preview-foto" class="oculto" alt="Pré-visualização">
                </label>
                <input type="file" id="input-foto" accept="image/*" class="oculto">

                <input type="text" id="input-usuario" placeholder="Seu @usuario (ex: @chef.bruno)" required>
                <input type="text" id="input-titulo" placeholder="Nome da receita (ex: Brownie de Chocolate)" required>
                <input type="text" id="input-tempo" placeholder="Tempo de preparo (ex: 30 min)" required>
                <textarea id="input-legenda" rows="2" placeholder="Escreva uma legenda..." required></textarea>
                <textarea id="input-ingredientes" rows="3" placeholder="Ingredientes (um por linha)" required></textarea>
                <textarea id="input-preparo" rows="3" placeholder="Modo de preparo (um passo por linha)" required></textarea>

                <button type="submit" class="btn-insta">Compartilhar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
