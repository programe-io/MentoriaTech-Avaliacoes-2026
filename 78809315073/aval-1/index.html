<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Tycoon 2D</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="game-screen">
        <div class="hud">
            <div class="stat">💰 Dinheiro: <span id="money">R$ 0</span></div>
            <div class="stat">⚡ Lucro/seg: <span id="income">R$ 0</span></div>
        </div>

        <div class="restaurant-floor">
            <div class="kitchen-counter">
                <div id="grill" class="grill-element">
                    <span class="food-emoji">🍔</span>
                    <div class="smoke"></div>
                </div>
                <div class="counter-label">Chapa de Hambúrguer</div>
            </div>
        </div>

        <div class="upgrade-panel">
            <h2>Melhorias da Cozinha</h2>
            
            <div class="upgrade-card">
                <div class="card-details">
                    <h3>Chapa Automática</h3>
                    <p>Ganha R$ 1/s de forma passiva.</p>
                    <p class="cost-text">Custo: <span id="cost-grill-auto">R$ 15</span></p>
                </div>
                <button id="buy-grill-auto" class="btn-buy">Comprar (<span id="count-grill-auto">0</span>)</button>
            </div>

            <div class="upgrade-card">
                <div class="card-details">
                    <h3>Contratar Chapeiro</h3>
                    <p>Ganha R$ 8/s de forma passiva.</p>
                    <p class="cost-text">Custo: <span id="cost-chef">R$ 100</span></p>
                </div>
                <button id="buy-chef" class="btn-buy">Contratar (<span id="count-chef">0</span>)</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
