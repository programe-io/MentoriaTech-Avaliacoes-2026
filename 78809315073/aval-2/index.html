<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Tycoon 2D</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<header> </header>
<footer> <footer>
<img> <img>
<article> <article>
<main> <main>
<aside> <aside>
<a> <a> 
<nav> <nav>
<body>
    <H1> </H1>
    <div class="game-screen">
        <div class="hud">
            <div class="stat">💰 Dinheiro: <span id="money" class="highlight-yellow">R$ 1</span></div>
            <div class="stat">⚡ Lucro/seg: <span id="income" class="highlight-cyan">R$ 0/s</span></div>
        </div>

        <div id="prestige-info" class="prestige-bar d-none">
            ⭐ Franquias Vendidas: <span id="prestige-count">0</span> (<span id="prestige-bonus">+0%</span> de lucro global)
        </div>

        <div class="restaurant-floor">
            <div class="kitchen-counter">
                <div id="grill" class="grill-element">
                    <span class="food-emoji" id="current-burger-emoji">🍔</span>
                    <div class="smoke smoke-1"></div>
                    <div class="smoke smoke-2"></div>
                </div>
                <div class="counter-label" id="current-burger-name">Cheeseburger</div>
                <small class="click-tip">✨ Clique: +<span id="click-value">R$ 1</span> ✨</small>
            </div>
        </div>

        <div class="menu-panel mb-4">
            <h2>📜 Cardápio do Restaurante</h2>
            <div class="menu-options">
                <button id="btn-menu-cheese" class="btn-menu active-menu">🍔 Cheeseburger (R$ 1)</button>
                <button id="btn-menu-bacon" class="btn-menu locked" disabled>🔒 Bacon Burger (Custo: R$ 500)</button>
                <button id="btn-menu-monster" class="btn-menu locked" disabled>🔒 Monster Burger (Custo: R$ 5.000)</button>
            </div>
        </div>

        <div class="upgrade-panel">
            <h2>⚙️ Melhorias da Cozinha</h2>
            
            <div id="card-grill-auto" class="upgrade-card disabled-card">
                <div class="card-details">
                    <h3>Chapa Automática</h3>
                    <p>Ganha R$ 1/s de forma passiva.</p>
                    <p class="cost-text">Custo: <span id="cost-grill-auto">R$ 15</span></p>
                </div>
                <button id="buy-grill-auto" class="btn-buy" disabled>Comprar (<span id="count-grill-auto">0</span>)</button>
            </div>

            <div id="card-chef" class="upgrade-card disabled-card">
                <div class="card-details">
                    <h3>Contratar Chapeiro</h3>
                    <p>Ganha R$ 8/s de forma passiva.</p>
                    <p class="cost-text">Custo: <span id="cost-chef">R$ 100</span></p>
                </div>
                <button id="buy-chef" class="btn-buy" disabled>Contratar (<span id="count-chef">0</span>)</button>
            </div>
        </div>

        <button id="btn-prestige" class="btn-prestige-action d-none">
            🚀 Vender Franquia por +1 Estrela (Reset de Prestígio)
        </button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
