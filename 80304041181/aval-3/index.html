<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
  <!-- Ícones do FontAwesome para os botões -->
  <link rel="stylesheet" href="https://cloudflare.com">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Barra de Navegação Superior -->
  <header class="navbar">
    <div class="nav-content">
      <h1 class="logo">Instagram</h1>
      <input type="text" class="search-bar" placeholder="Pesquisar">
      <div class="nav-icons">
        <i class="fa-solid fa-house"></i>
        <i class="fa-regular fa-paper-plane"></i>
        <i class="fa-regular fa-square-plus"></i>
        <i class="fa-regular fa-heart"></i>
        <img src="https://pravatar.cc" alt="Perfil" class="nav-avatar">
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container">
    
    <!-- Seção de Stories -->
    <section class="stories">
      <div class="story">
        <div class="story-ring">
          <img src="https://pravatar.cc" alt="Seu story">
        </div>
        <span>Seu story</span>
      </div>
      <div class="story">
        <div class="story-ring">
          <img src="https://pravatar.cc" alt="maria_dev">
        </div>
        <span>maria_dev</span>
      </div>
      <div class="story">
        <div class="story-ring">
          <img src="https://pravatar.cc" alt="lucas.tech">
        </div>
        <span>lucas.tech</span>
      </div>
      <div class="story">
        <div class="story-ring">
          <img src="https://pravatar.cc" alt="ana_design">
        </div>
        <span>ana_design</span>
      </div>
      <div class="story">
        <div class="story-ring">
          <img src="https://pravatar.cc" alt="pedro_code">
        </div>
        <span>pedro_code</span>
      </div>
    </section>

    <!-- Feed de Postagens -->
    <section class="feed" id="feed">
      
      <!-- Post 1 -->
      <article class="post">
        <div class="post-header">
          <div class="post-user">
            <img src="https://pravatar.cc" alt="maria_dev">
            <span>maria_dev</span>
          </div>
          <i class="fa-solid fa-ellipsis"></i>
        </div>

        <div class="post-image-container">
          <img src="https://unsplash.com" alt="Setup de programação" class="post-img">
          <i class="fa-solid fa-heart big-heart"></i>
        </div>

        <div class="post-actions">
          <div class="left-actions">
            <i class="fa-regular fa-heart like-btn"></i>
            <i class="fa-regular fa-comment"></i>
            <i class="fa-regular fa-paper-plane"></i>
          </div>
          <i class="fa-regular fa-bookmark save-btn"></i>
        </div>

        <div class="post-info">
          <p class="likes-count"><span class="count">124</span> curtidas</p>
          <p class="caption"><strong>maria_dev</strong> Finalizando mais um projeto front-end! 💻🚀 #programacao #html #css</p>
          <span class="post-time">HÁ 2 HORAS</span>
        </div>
      </article>

      <!-- Post 2 -->
      <article class="post">
        <div class="post-header">
          <div class="post-user">
            <img src="https://pravatar.cc" alt="lucas.tech">
            <span>lucas.tech</span>
          </div>
          <i class="fa-solid fa-ellipsis"></i>
        </div>

        <div class="post-image-container">
          <img src="https://unsplash.com" alt="Praia" class="post-img">
          <i class="fa-solid fa-heart big-heart"></i>
        </div>

        <div class="post-actions">
          <div class="left-actions">
            <i class="fa-regular fa-heart like-btn"></i>
            <i class="fa-regular fa-comment"></i>
            <i class="fa-regular fa-paper-plane"></i>
          </div>
          <i class="fa-regular fa-bookmark save-btn"></i>
        </div>

        <div class="post-info">
          <p class="likes-count"><span class="count">89</span> curtidas</p>
          <p class="caption"><strong>lucas.tech</strong> Pausa para recarregar as energias 🌊☀️</p>
          <span class="post-time">HÁ 5 HORAS</span>
        </div>
      </article>

    </section>
  </main>

<script src="script.js"></script></body>
</html>
