<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dados do Usuário</title>
</head>
<body>

    <h1>Informações do Usuário</h1>
    <p id="dados"></p>

    <script>
        let nome = "João Victor";
        let idade = 16;
        let cidade = "Floresta do Piauí";

        document.getElementById("dados").innerHTML =
            "Nome: " + nome + "<br>" +
            "Idade: " + idade + " anos<br>" +
            "Cidade: " + cidade;
    </script>

<script src="script.js"></script></body>
</html>
