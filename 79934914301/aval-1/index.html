<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Aventura</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="header-content">

            <h1>Minha Aventura</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>

        </div>
    </header>

    <main>

        <!-- Área para criar uma nova publicação -->
        <section class="new-post">

            <div class="user">

                <div class="avatar">
                    K
                </div>

                <div>
                    <strong>Karine</strong>
                    <span>O que você está fazendo hoje?</span>
                </div>

            </div>

            <button>Publicar</button>

        </section>


        <!-- Publicação da Monica -->
        <article class="post">

            <div class="post-header">

                <div class="avatar">
                    M
                </div>

                <div>
                    <strong>Monica</strong>
                    <span>Há 10 minutos</span>
                </div>

            </div>

            <div class="post-text">
                Hoje eu assisti Cúmplices de um Resgate, top, tô feliz :D
            </div>

            <img
                src="https://i.scdn.co/image/ab67616d0000b2739a3826919fbd0f1f81c99abe"
                alt="Imagem de Cúmplices de um Resgate"
            >

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>

    </main>

    <footer>
        <p>Minha Aventura - Todos os direitos reservados - 2026</p>
    </footer>
