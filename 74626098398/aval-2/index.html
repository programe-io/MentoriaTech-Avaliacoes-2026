<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        .calculadora {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 220px;
        }
        #display {
            width: 100%;
            height: 40px;
            font-size: 1.2em;
            text-align: right;
            margin-bottom: 10px;
            padding: 5px;
            box-sizing: border-box;
        }
        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        button {
            height: 40px;
            font-size: 1em;
            cursor: pointer;
            border: none;
            background: #e0e0e0;
            border-radius: 5px;
        }
        button:hover {
            background: #d0d0d0;
        }
        .igual {
            grid-column: span 2;
            background: #4CAF50;
            color: white;
        }
        .limpar {
            background: #f44336;
            color: white;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="calculadora">
        <input type="text" id="display" disabled>
        <div class="botoes">
            <button class="limpar" onclick="limparTela()">C</button>
            <button onclick="adicionar('/')">/</button>
            <button onclick="adicionar('*')">*</button>
            <button onclick="adicionar('-')">-</button>

            <button onclick="adicionar('7')">7</button>
            <button onclick="adicionar('8')">8</button>
            <button onclick="adicionar('9')">9</button>
            <button onclick="adicionar('+')">+</button>

            <button onclick="adicionar('4')">4</button>
            <button onclick="adicionar('5')">5</button>
            <button onclick="adicionar('6')">6</button>
            <button onclick="calcular()" class="igual">=</button>

            <button onclick="adicionar('1')">1</button>
            <button onclick="adicionar('2')">2</button>
            <button onclick="adicionar('3')">3</button>
            <button onclick="adicionar('0')">0</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function adicionar(valor) {
            display.value += valor;
        }

        function limparTela() {
            display.value = '';
        }

        function calcular() {
            try {
                display.value = eval(display.value);
            } catch (e) {
                display.value = 'Erro';
            }
        }
    </script>

<script src="script.js"></script></body>
</html>
