
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <h1>📋 Gerenciador de Tarefas</h1>
            <p>Organize suas atividades e acompanhe seu progresso</p>
        </header>

        <!-- RESUMO DAS TAREFAS -->

        <section class="resumo">

            <div class="card">
                <h3>Total de Tarefas</h3>
                <p id="totalTarefas">0</p>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <p id="totalPendentes">0</p>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <p id="totalConcluidas">0</p>
            </div>

        </section>

        <!-- CADASTRO DE TAREFAS -->

        <section class="formulario">

            <h2 id="tituloFormulario">Cadastrar Nova Tarefa</h2>

            <form id="formTarefa">

                <div class="campos">

                    <input
                        type="text"
                        id="nomeTarefa"
                        placeholder="Nome da tarefa"
                        required>

                    <textarea
                        id="descricao"
                        placeholder="Descrição da tarefa"
                        rows="3"></textarea>

                    <select id="prioridade" required>

                        <option value="">Selecione a prioridade</option>
                        <option value="Alta">Alta</option>
                        <option value="Média">Média</option>
                        <option value="Baixa">Baixa</option>

                    </select>

                </div>

                <button type="submit" class="cadastrar" id="btnSalvar">
                    Cadastrar Tarefa
                </button>

                <button
                    type="button"
                    class="cancelar"
                    id="btnCancelar"
                    onclick="cancelarEdicao()"
                    style="display:none">

                    Cancelar

                </button>

            </form>

        </section>

        <!-- LISTAGEM DAS TAREFAS -->

        <section class="lista">

            <h2>Tarefas Cadastradas</h2>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar tarefa..."
                oninput="listarTarefas()">

            <div class="filtros">

                <button onclick="filtrarTarefas('Todas')">
                    Todas
                </button>

                <button onclick="filtrarTarefas('Pendente')">
                    Pendentes
                </button>

                <button onclick="filtrarTarefas('Concluída')">
                    Concluídas
                </button>

            </div>

            <div id="listaTarefas"></div>

        </section>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
