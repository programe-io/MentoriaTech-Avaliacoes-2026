
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .login {
      background: white;
      border: 1px solid #dbdbdb;
      padding: 35px 40px;
      width: 350px;
      text-align: center;
    }

    h1 {
      font-family: cursive;
      font-size: 42px;
      margin: 10px 0 30px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #0095f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1877f2;
    }

    a {
      color: #385185;
      text-decoration: none;
      font-size: 13px;
    }

    .cadastro {
      margin-top: 20px;
      border: 1px solid #dbdbdb;
      padding: 20px 10px;
      background: white;
      font-size: 14px;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

  <main>
    <div class="login">
      <h1>Instagram</h1>

      <form>
        <input
          type="text"
          placeholder="Nome de usuário"
          autocomplete="off"
          required
        >

        <input
          type="password"
          placeholder="Senha"
          autocomplete="new-password"
          required
        >

        <button type="submit">Entrar</button>
      </form>

      <p><a href="#">Esqueceu a senha?</a></p>
    </div>

    <div class="cadastro">
      Não tem uma conta?
      <a href="#">Cadastre-se</a>
    </div>
  </main>

<script src="script.js"></script></body>
</html>
