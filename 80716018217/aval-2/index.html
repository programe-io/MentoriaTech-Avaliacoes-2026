<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="feed">
        <h2>Meu Feed</h2>

        <div class="post">
            <div class="perfil">
                <img src="https://i.pravatar.cc/100?img=12" alt="Perfil">
                <div>
                    <h3>carla</h3>
                    <span>Há 2 horas</span>
                </div>
            </div>

            <p>
                Olá, pessoal! Hoje foi um dia incrível.
                Compartilhando um pouco desse momento! ❤️
            </p>

            <img class="post-img"
                 src="https://picsum.photos/600/350"
                 alt="Imagem da publicação">

            <div class="acoes">
                <button>❤️ Curtir</button>
                <button>💬 Comentar</button>
                <button>↗ Compartilhar</button>
            </div>
        </div>

        <div class="post">
            <div class="perfil">
                <img src="https://i.pravatar.cc/100?img=5" alt="Perfil">
                <div>
                    <h3>gabriel</h3>
                    <span>Há 5 horas</span>
                </div>
            </div>

            <p>
                Mais um dia aprendendo programação!
                Nunca desista dos seus objetivos. 🚀
            </p>

            <div class="acoes">
                <button>❤️ Curtir</button>
                <button>💬 Comentar</button>
                <button>↗ Compartilhar</button>
            </div>
        </div>
    </div>

</body>
</html>
