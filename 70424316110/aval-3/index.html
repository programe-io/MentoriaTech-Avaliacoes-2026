<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
  <div style="font-family: Arial, sans-serif; background-color: #ffffff; padding: 25px; border-radius: 10px; border: 1px solid #d1d5db; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 380px; margin: 20px auto;">
  <h1 style="text-align: center; color: #1f2937; margin-top: 0; margin-bottom: 20px; font-size: 22px;">Controle de IMC</h1>

  <div style="margin-bottom: 15px;">
    <label for="nome" style="display: block; margin-bottom: 5px; color: #374151; font-weight: bold; font-size: 14px;">Nome do Paciente:</label>
    <input type="text" id="nome" value="Ramon" placeholder="Ex: Ramon" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; box-sizing: border-box;">
  </div>

  <div style="margin-bottom: 15px;">
    <label for="peso" style="display: block; margin-bottom: 5px; color: #374151; font-weight: bold; font-size: 14px;">Peso (kg):</label>
    <input type="text" id="peso" value="60.6" placeholder="Ex: 60.6" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; box-sizing: border-box;">
  </div>

  <div style="margin-bottom: 15px;">
    <label for="altura" style="display: block; margin-bottom: 5px; color: #374151; font-weight: bold; font-size: 14px;">Altura (m):</label>
    <input type="text" id="altura" value="1,64" placeholder="Ex: 1,64" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; box-sizing: border-box;">
  </div>

  <button type="button" onclick="var n=document.getElementById('nome').value.trim();var p=parseFloat(document.getElementById('peso').value.replace(',','.'));var a=parseFloat(document.getElementById('altura').value.replace(',','.'));var r=document.getElementById('resultado');if(!n||isNaN(p)||isNaN(a)||p<=0||a<=0){r.style.display='block';r.style.backgroundColor='#fef2f2';r.style.borderLeftColor='#ef4444';r.style.color='#991b1b';r.innerHTML='Preencha todos os campos corretamente.';return;\}var imc=p/(a*a);var c='';if(imc<18.5){c='Abaixo do peso';\}else if(imc<25){c='Peso normal';\}else if(imc<30){c='Sobrepeso';\}else if(imc<35){c='Obesidade grau I';\}else if(imc<40){c='Obesidade grau II';\}else{c='Obesidade grau III';\}r.style.display='block';r.style.backgroundColor='#ecfdf5';r.style.borderLeftColor='#10b981';r.style.color='#065f46';r.innerHTML='<strong>Paciente:</strong> '+n+'<br><strong>IMC:</strong> '+imc.toFixed(2)+'<br><strong>Classificação:</strong> '+c;" style="width: 100%; padding: 12px; background-color: #10b981; color: #ffffff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px;">Calcular IMC</button>

  <div id="resultado" style="margin-top: 18px; padding: 15px; background-color: #ecfdf5; border-left: 5px solid #10b981; border-radius: 6px; color: #065f46; line-height: 1.5; display: none;"></div>
</div>
  
  
</body>
</html>
