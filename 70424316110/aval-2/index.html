<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Controle de Estoque</h1>
        <p>Gerencie seus produtos facilmente</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <input type="number" id="codigo" placeholder="Código">
            <input type="text" id="descricao" placeholder="Descrição">
            <input type="number" id="quantidade" placeholder="Quantidade">
            <input type="number" id="valor" placeholder="Valor (R\$)" step="0.01">

            <button type="button" id="btnCadastrar">
                Cadastrar Produto
            </button>

            <p id="mensagem"></p>
        </section>

        <section class="card">
            <h2>Alterar Produto</h2>

            <input type="number" id="codigoAlterar" placeholder="Código do produto">
            <input type="number" id="novoValor" placeholder="Novo valor" step="0.01">

            <button type="button" id="btnValor">Alterar Valor</button>

            <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

            <button type="button" id="btnQuantidade">Alterar Quantidade</button>
        </section>

        <section class="card">
            <h2>Lista de Produtos</h2>

            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
