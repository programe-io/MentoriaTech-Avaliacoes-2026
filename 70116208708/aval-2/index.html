<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow Pro — Sistema Kanban em JavaScript</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; \}
    body { background: #f1f5f9; color: #0f172a; min-height: 100vh; \}
    .container { max-width: 1280px; margin: 0 auto; padding: 0 1.25rem; \}
    .hidden { display: none !important; \}

    /* Topbar */
    .topbar { background: #0f172a; color: #fff; padding: 1rem 0; box-shadow: 0 2px 10px rgba(0,0,0,.15); \}
    .topbar-inner { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; \}
    .logo-area { display: flex; align-items: center; gap: .75rem; \}
    .logo-badge { background: #eab308; color: #0f172a; font-weight: 800; padding: .5rem .65rem; border-radius: 10px; \}
    .logo-area h1 { font-size: 1.2rem; \}
    .logo-area h1 span { color: #eab308; \}
    .logo-area p { font-size: .75rem; color: #94a3b8; \}
    .topbar-actions { display: flex; gap: .6rem; \}

    /* Botões e Inputs */
    .btn { border: none; padding: .6rem 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: .875rem; transition: .2s; \}
    .btn-primary { background: #eab308; color: #0f172a; \}
    .btn-primary:hover { background: #ca8a04; \}
    .btn-secondary { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; \}
    .btn-secondary:hover { background: #334155; \}
    .input-control { padding: .65rem .9rem; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; font-size: .875rem; \}

    /* Layout Principal */
    .main-wrapper { padding: 1.5rem 1.25rem 3rem; display: flex; flex-direction: column; gap: 1.25rem; \}
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; \}
    .metric-card { background: #fff; padding: 1.15rem 1.25rem; border-radius: 12px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; \}
    .metric-card span { font-size: .85rem; color: #64748b; font-weight: 500; \}
    .metric-card strong { font-size: 1.5rem; \}

    .toolbar { display: flex; gap: .75rem; flex-wrap: wrap; \}
    .toolbar input { flex: 1; min-width: 220px; \}

    /* Kanban Board */
    .board-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; align-items: start; \}
    @media (max-width: 900px) { .board-grid { grid-template-columns: 1fr; \} \}

    .kanban-column { background: #e2e8f0; border-radius: 14px; padding: 1rem; min-height: 420px; transition: .2s; border: 2px solid transparent; \}
    .kanban-column.drag-over { border-color: #0284c7; background: #dbeafe; \}
    .column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; \}
    .column-title { display: flex; align-items: center; gap: .5rem; \}
    .dot { width: 10px; height: 10px; border-radius: 50%; \}
    .counter { font-size: .75rem; font-weight: 700; padding: .2rem .6rem; border-radius: 99px; \}
    .column-body { display: flex; flex-direction: column; gap: .75rem; \}

    .task-card { background: #fff; padding: 1rem; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: grab; border: 1px solid #cbd5e1; transition: transform .15s; \}
    .task-card:hover { transform: translateY(-2px); \}
    .task-card.dragging { opacity: .45; \}
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; \}
    .prio-badge { font-size: .7rem; font-weight: 700; padding: .2rem .55rem; border-radius: 6px; text-transform: uppercase; \}
    .card-actions { display: flex; gap: .25rem; \}
    .icon-btn { background: none; border: none; cursor: pointer; padding: .2rem .4rem; border-radius: 4px; color: #64748b; \}
    .icon-btn:hover { background: #f1f5f9; color: #0f172a; \}
    .task-card h4 { font-size: .95rem; margin-bottom: .35rem; \}
    .task-desc { font-size: .82rem; color: #475569; margin-bottom: .75rem; line-height: 1.4; \}
    .card-footer { display: flex; justify-content: space-between; font-size: .75rem; color: #64748b; border-top: 1px solid #f1f5f9; padding-top: .5rem; \}
    .empty-drop { text-align: center; padding: 2rem 1rem; font-size: .82rem; color: #64748b; border: 2px dashed #cbd5e1; border-radius: 10px; \}

    /* Modal e Toast */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.6); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50; \}
    .modal-card { background: #fff; width: 100%; max-width: 460px; border-radius: 14px; padding: 1.5rem; \}
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; \}
    .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b; \}
    .modal-form { display: flex; flex-direction: column; gap: .9rem; \}
    .field { display: flex; flex-direction: column; gap: .3rem; \}
    .field label { font-size: .78rem; font-weight: 600; color: #475569; \}
    .field input, .field textarea, .field select { padding: .6rem .8rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: .875rem; \}
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; \}
    .modal-footer { display: flex; justify-content: flex-end; gap: .6rem; margin-top: .5rem; \}

    .toast-box { position: fixed; bottom: 1.25rem; right: 1.25rem; display: flex; flex-direction: column; gap: .5rem; z-index: 60; \}
    .toast-item { background: #0f172a; color: #fff; padding: .7rem 1rem; border-radius: 8px; font-size: .85rem; box-shadow: 0 4px 12px rgba(0,0,0,.2); \}
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
<script src="script.js"></script></body>
