<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="post-card">
  <!-- Cabeçalho do Post -->
  <div class="post-header">
    <div class="avatar"></div>
    <span class="username">estudante_dev</span>
  </div>

  <!-- Imagem da Publicação -->
  <img 
    src="https://unsplash.com" 
    alt="Notebook com código" 
    class="post-image"
  >

  <!-- Botões de Ação -->
  <div class="post-actions">
    <button id="btn-curtir" class="action-btn">🤍</button>
    <button id="btn-focar-comentario" class="action-btn">💬</button>
  </div>

  <!-- Contador de Curtidas e Legenda -->
  <div class="post-info">
    <p class="likes"><span id="contador-curtidas">124</span> curtidas</p>
    <p class="caption">
      <strong>estudante_dev</strong> Desenvolvendo meu projeto de HTML, CSS e JavaScript! 💻🚀
    </p>
  </div>

  <!-- Lista de Comentários -->
  <div id="lista-comentarios" class="comments-section">
    <p class="comment"><strong>maria_tech</strong> Ficou muito bom!</p>
  </div>

  <!-- Formulário para Novo Comentário -->
  <form id="form-comentario" class="comment-form">
    <input type="text" id="input-comentario" placeholder="Adicione um comentário..." required>
    <button type="submit">Publicar</button>
  </form>
</div>
  <script src="script.js"></script>
  
</body>
</html>
