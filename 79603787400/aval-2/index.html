<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini TikTok</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

/* CABEÇALHO */

header {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 20px;
    display: flex;
    justify-content: center;
    gap: 25px;
    background: linear-gradient(#0009, transparent);
    z-index: 10;
}

header span {
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

header .ativo {
    border-bottom: 3px solid white;
    padding-bottom: 5px;
}

/* VÍDEOS */

.feed {
    width: 100%;
    max-width: 450px;
    height: 100vh;
    margin: auto;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
}

.feed::-webkit-scrollbar {
    display: none;
}

.video {
    height: 100vh;
    width: 100%;
    position: relative;
    scroll-snap-align: start;
    display: flex;
    align-items: flex-end;
    background-size: cover;
    background-position: center;
}

.video::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        transparent 40%,
        rgba(0,0,0,0.8)
    );
}

/* INFORMAÇÕES */

.info {
    position: relative;
    z-index: 2;
    padding: 20px;
    padding-bottom: 90px;
    width: 80%;
}

.info h3 {
    margin-bottom: 12px;
}

.info p {
    font-size: 14px;
    line-height: 1.5;
}

/* BOTÕES LATERAIS */

.acoes {
    position: absolute;
    right: 15px;
    bottom: 110px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
}

.acao {
    text-align: center;
    cursor: pointer;
    font-size: 27px;
    background: none;
    border: none;
    color: white;
}

.acao small {
    display: block;
    font-size: 12px;
    margin-top: 5px;
}

.avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid white;
    background: linear-gradient(45deg, #fe2c55, #25f4ee);
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}

/* RODAPÉ */

footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-width: 450px;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    padding: 15px 5px;
    display: flex;
    justify-content: space-around;
    z-index: 10;
}

footer button {
    color: white;
    background: none;
    border: none;
    font-size: 12px;
    cursor: pointer;
}

footer span {
    display: block;
    font-size: 22px;
    margin-bottom: 5px;
}

/* BOTÃO CURTIR */

.curtido {
    color: #fe2c55 !important;
}

/* TELAS MAIORES */

@media (min-width: 600px) {
    .video {
        border-radius: 10px;
    }

    body {
        background: #181818;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <span>Seguindo</span>
    <span class="ativo">Para você</span>
</header>

<main class="feed">

    <!-- VÍDEO 1 -->
    <section class="video"
    style="background-image: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900');">

        <div class="info">
            <h3>@viagem_oficial</h3>
            <p>🌎 Conhecendo lugares incríveis pelo mundo!</p>
            <p>🎵 Som original - Viagem</p>
        </div>

        <div class="acoes">
            <div class="avatar">V</div>

            <button class="acao curtir">
                ♥ <small>1.2 mil</small>
            </button>

            <button class="acao comentar">
                💬 <small>120</small>
            </button>

            <button class="acao compartilhar">
                ↗ <small>Compartilhar</small>
            </button>
        </div>
    </section>

    <!-- VÍDEO 2 -->
    <section class="video"
    style="background-image: url('https://images.unsplash.com/photo-1517841905240-472988babdf9?w=900');">

        <div class="info">
            <h3>@estilo_de_vida</h3>
            <p>✨ Aproveite cada momento da sua vida!</p>
            <p>🎵 Música do momento</p>
        </div>

        <div class="acoes">
            <div class="avatar">E</div>

            <button class="acao curtir">
                ♥ <small>850</small>
            </button>

            <button class="acao comentar">
                💬 <small>85</small>
            </button>

            <button class="acao compartilhar">
                ↗ <small>Compartilhar</small>
            </button>
        </div>
    </section>

    <!-- VÍDEO 3 -->
    <section class="video"
    style="background-image: url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=900');">

        <div class="info">
            <h3>@universo</h3>
            <p>🌌 O universo é cheio de maravilhas!</p>
            <p>🎵 Sons relaxantes</p>
        </div>

        <div class="acoes">
            <div class="avatar">U</div>

            <button class="acao curtir">
                ♥ <small>2 mil</small>
            </button>

            <button class="acao comentar">
                💬 <small>200</small>
            </button>

            <button class="acao compartilhar">
                ↗ <small>Compartilhar</small>
            </button>
        </div>
    </section>

</main>

<footer>
    <button><span>⌂</span>Início</button>
    <button><span>🔍</span>Descobrir</button>
    <button><span>＋</span>Publicar</button>
    <button><span>✉</span>Caixa de entrada</button>
    <button><span>👤</span>Perfil</button>
</footer>

<script>

// CURTIR PUBLICAÇÕES
document.querySelectorAll(".curtir").forEach(botao => {
    botao.addEventListener("click", () => {
        botao.classList.toggle("curtido");
    });
});

// COMENTÁRIOS
document.querySelectorAll(".comentar").forEach(botao => {
    botao.addEventListener("click", () => {
        let comentario = prompt("Digite seu comentário:");

        if (comentario && comentario.trim() !== "") {
            alert("Comentário enviado: " + comentario);
        }
    });
});

// COMPARTILHAR
document.querySelectorAll(".compartilhar").forEach(botao => {
    botao.addEventListener("click", async () => {
        try {
            if (navigator.share) {
                await navigator.share({
                    title: "Mini TikTok",
                    text: "Olha essa publicação!"
                });
            } else {
                alert("Compartilhamento não disponível neste navegador.");
            }
        } catch (erro) {
            console.log("Compartilhamento cancelado.");
        }
    });
});

</script>

<script src="script.js"></script></body>
</html>
