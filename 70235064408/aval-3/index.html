
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pacientes</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Pacientes</h1>
        <p>Cadastre pacientes e calcule o IMC.</p>

        <form id="form-pessoa">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" min="1" required>

            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" step="0.01" min="0.1" required>

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1" min="0.1" required>

            <button type="submit">Cadastrar paciente</button>
        </form>

        <p id="mensagem"></p>

        <h2>Pacientes cadastrados</h2>

        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar paciente pelo nome..."
        >

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Altura</th>
                    <th>Peso</th>
                    <th>IMC</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody id="lista-pacientes"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
