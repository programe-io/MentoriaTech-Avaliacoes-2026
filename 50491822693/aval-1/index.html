
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>

    <style>
        body {
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background: #6c3ce9;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
        }

        .post {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ccc;
        }

        .post img {
            width: 100%;
            border-radius: 10px;
        }

        button {
            background: #6c3ce9;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #4b22ad;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Meu Instagram</h1>
        <p>Bem-vindo ao meu feed!</p>
    </header>

    <div class="container">

        <div class="post">
            <h2>Meu primeiro post 🚀</h2>
            <p>Esse é meu primeiro site feito com HTML!</p>
            <img src="https://picsum.photos/500/300" alt="Paisagem aleatória">
            <br><br>
            <button onclick="curtir()">❤️ Curtir</button>
            <p id="curtidas">0 curtidas</p>
        </div>

    </div>

    <script>
        let contador = 0;

        function curtir() {
            contador++;
            document.getElementById("curtidas").innerText =
                contador + " curtidas";
        }
    </script>

<script src="script.js"></script></body>
</html>
