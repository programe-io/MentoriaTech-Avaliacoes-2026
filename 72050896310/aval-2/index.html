<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario 2D - Versão Semântica Final</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div id="gameWindow">
        
        <header id="ui-container">
            <h1 class="ui-element">
                <p>MARIO</p>
                <p><span id="score">000000</span></p>
            </h1>
            
            <nav id="game-navigation">
                <p><a href="#" onclick="location.reload(); return false;">REINICIAR</a></p>
            </nav>

            <div class="ui-element">
                <p>VELOCIDADE (V)</p>
                <p><span id="velocity-v">0</span> px/f</p>
            </div>
            
            <div class="ui-element">
                <p>MOEDAS</p>
                <p><span id="coins">x00</span></p>
            </div>
            
            <div class="ui-element">
                <p>MUNDO</p>
                <p><span>1-1</span></p>
            </div>
        </header>

        <aside id="controls-panel">
            <p><strong>CONTROLES:</strong></p>
            <p>A / D ou ◄ / ► : Andar</p>
            <p>W ou ESPAÇO : Pular</p>
        </aside>

        <main id="world">
            
            <section class="scenery-background">
                <div class="cloud" style="left: 150px; top: 120px;"></div>
                <div class="cloud" style="left: 600px; top: 140px;"></div>
                <div class="cloud" style="left: 1200px; top: 110px;"></div>
                <div class="cloud" style="left: 1800px; top: 130px;"></div>
                <div class="cloud" style="left: 2300px; top: 100px;"></div>
                
                <div class="bush" style="left: 250px; bottom: 60px;"></div>
                <div class="bush" style="left: 900px; bottom: 60px;"></div>
                <div class="bush" style="left: 2100px; bottom: 60px;"></div>
            </section>

            <article id="flagpole" style="left: 2600px;">
                <div id="flag"></div>
            </article>

            <div id="castle" style="left: 2720px;"></div>
        </main>

        <footer id="victoryScreen">
            <p>MUNDO COMPLETADO!</p>
        </footer>

    </div>

    <script src="game.js"></script>
<script src="script.js"></script></body>
