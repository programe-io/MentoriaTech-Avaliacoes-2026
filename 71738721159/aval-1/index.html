<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Gerenciador de Tarefas e IMC</title>
        <link rel="stylesheet" href="style.css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <main class="container">
              <h1>Tarefas e Cálculo de IMC</h1>

                  <form id="task-form" class="task-form">
                        <input type="text" id="task-title" placeholder="Ex.: Avaliação física / Caminhada" required />
                              <input type="number" id="weight" step="0.1" min="1" placeholder="Peso (kg)" required />
                                    <input type="number" id="height" step="0.01" min="0.3" placeholder="Altura (m, ex.: 1.75)" required />
                                          <button type="submit">Adicionar</button>
                                              </form>

                                                  <ul id="task-list" class="task-list"></ul>
                                                    </main>

                                                      <script src="script.js"></script>
                                                      <script src="script.js"></script></body>
                                                      </html>
