<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📦 Gerenciamento de Produtos</h1>

        <!-- Alert Messages -->
        <div id="alert" class="alert"></div>

        <!-- Card: Cadastrar Produto -->
        <div class="card">
            <h2>➕ Cadastrar Novo Produto</h2>
            <form id="cadastroForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="descricao">Descrição (mín. 5 caracteres)</label>
                        <input type="text" id="descricao" placeholder="Ex: Cadeira Gamer" required>
                    </div>
                    <div class="form-group">
                        <label for="quantidade">Quantidade</label>
                        <input type="number" id="quantidade" placeholder="Ex: 10" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="valor">Valor (R$)</label>
                        <input type="number" id="valor" placeholder="Ex: 699.00" min="0" step="0.01" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
            </form>
        </div>

        <!-- Card: Atualizações -->
        <div class="card">
            <h2>✏️ Atualizar Produto</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="codigoAtualizar">Código do Produto</label>
                    <input type="number" id="codigoAtualizar" placeholder="Ex: 1" min="1" required>
                </div>
                <div class="form-group">
                    <label for="novoValor">Novo Valor (R$)</label>
                    <input type="number" id="novoValor" placeholder="Ex: 799.00" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label for="novaQuantidade">Adicionar Quantidade</label>
                    <input type="number" id="novaQuantidade" placeholder="Ex: 5" min="1">
                </div>
            </div>
            <div class="button-group">
                <button onclick="atualizarValorUI()" class="btn btn-warning">Atualizar Valor</button>
                <button onclick="atualizarQuantidadeUI()" class="btn btn-info">Adicionar Quantidade</button>
            </div>
        </div>

        <!-- Card: Lista de Produtos -->
        <div class="card">
            <h2>📋 Lista de Produtos</h2>
            <div id="produtoCount" class="produto-count">Total: 0 produtos</div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor (R$)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaProdutos">
                        <tr>
                            <td colspan="5" class="empty-message">Nenhum produto cadastrado</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
