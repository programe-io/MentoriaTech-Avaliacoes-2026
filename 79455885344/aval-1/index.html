<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rei da Sinuca | Loja Oficial</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🎱 Rei da Sinuca</h1>
        <button class="cart-btn" onclick="abrirCarrinho()">
            🛒 Carrinho (<span id="cart-count">0</span>)
        </button>
    </header>

    <!-- BANNER COM ILUSTRAÇÃO DE MESA DE SINUCA -->
    <section class="hero">
        <div class="hero-content">
            <h2>Tudo para o seu jogo perfeito</h2>
            <p>Mesas oficiais, tacos profissionais, bolas numeradas e acessórios de sinuca.</p>
        </div>
    </section>

    <!-- BUSCA E FILTROS -->
    <div class="controls">
        <input type="text" id="search-input" placeholder="Buscar produto (ex: Taco, Bola, Mesa, Giz)..." onkeyup="buscarProduto()">
        <div class="filters">
            <button class="filter-btn active" onclick="filtrarProdutos('todos', this)">Todos</button>
            <button class="filter-btn" onclick="filtrarProdutos('mesas', this)">Mesas</button>
            <button class="filter-btn" onclick="filtrarProdutos('tacos', this)">Tacos</button>
            <button class="filter-btn" onclick="filtrarProdutos('bolas', this)">Bolas</button>
            <button class="filter-btn" onclick="filtrarProdutos('acessorios', this)">Acessórios</button>
        </div>
    </div>

    <!-- VITRINE -->
    <main class="container">
        <div class="products-grid" id="products-grid"></div>
    </main>

    <!-- CARRINHO -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <h3>🛒 Seu Carrinho</h3>
            <div id="cart-items"></div>
            <div class="modal-footer">
                <strong>Total: R$ <span id="cart-total">0,00</span></strong>
                <div>
                    <button class="btn-close" onclick="fecharCarrinho()">Fechar</button>
                    <button class="btn-finish" onclick="finalizarCompra()">Finalizar Pedido</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Rei da Sinuca - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
