
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATSTOK - Rede Social de Gatos</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🐱 CATSTOK</h1>
    <input type="text" id="pesquisa" placeholder="Pesquisar gatos...">
    <button onclick="mostrarInicio()">Início</button>
    <button onclick="mostrarVideos()">Vídeos</button>
    <button onclick="mostrarPerfil()">Perfil</button>
</header>

<nav class="stories">
    <div class="story">🐱<span>Mimi</span></div>
    <div class="story">😺<span>Thor</span></div>
    <div class="story">🐈<span>Bolinha</span></div>
    <div class="story">😻<span>Mel</span></div>
    <div class="story">🐈‍⬛<span>Shadow</span></div>
</nav>

<main>
    <section id="feed">
        <h2>Explorar gatinhos 🐾</h2>
        <div id="publicacoes" class="publicacoes"></div>
    </section>

    <section id="perfil" class="oculto">
        <h2>Meu perfil 😻</h2>
        <div class="foto-perfil">🐱</div>
        <h3>@amantedegatos</h3>
        <p>Amante de gatinhos ❤️</p>
        <p id="totalPosts">0 publicações</p>
    </section>

    <section id="enviar" class="enviar">
        <h2>Nova publicação 📸</h2>
        <input type="text" id="titulo" placeholder="Escreva uma legenda...">
        <input type="file" id="arquivo" accept="image/*,video/*">
        <button onclick="publicar()">Publicar</button>
    </section>
</main>

<footer>
    <p>🐾 CATSTOK - O mundo dos gatinhos!</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
