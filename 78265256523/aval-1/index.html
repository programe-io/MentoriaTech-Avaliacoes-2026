<!DOCTYPE html>

<link href="style.css" rel="stylesheet"></head>

                <body>

                    <header>

                                                                                                                <span>👥</span>

                                                                                                                                                        <p>Sobreviventes</p>
                                                                                                                                                                        </div>

                                                                                                                                                                                        <div class="card">
                                                                                                                                                                                                            <span>🥫</span>

                                                                                                                                                                                                                                                                                    <div class="card">
                                                                                                                                                                                                                                                                                                        <span>🔋</span>

                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="explorar()">EXPLORAR</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>☣️ Projeto Apocalipse Zumbi — Área de sobrevivência</p>
