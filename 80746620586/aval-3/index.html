
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clone Instagram - Mary</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="min-h-screen bg-gray-100 text-slate-900">

    <!-- CABEÇALHO -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">

        <div class="max-w-5xl mx-auto px-4">

            <div class="flex items-center justify-between h-14">

                <!-- Logo -->
                <h1 class="text-xl font-semibold">
                    Instagram
                </h1>

                <!-- Botão de menu -->
                <button class="text-2xl">
                    <i class="bx bx-menu"></i>
                </button>

            </div>

        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-5xl mx-auto py-4 pb-20 px-4">

        <div class="flex gap-8">

            <!-- FEED -->
            <div class="flex-1 max-w-lg mx-auto w-full">

                <!-- ÁREA DE STORIES -->
                <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">

                    <div class="flex gap-4 overflow-x-auto">

                        <!-- ADICIONAR STORY -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gray-100">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">

                                        <span class="text-2xl text-gray-500">+</span>

                                    </div>

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                Seu story
                            </span>

                        </div>


                        <!-- STORY 1 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=47"
                                        alt="Foto de perfil de João"
                                        class="w-full h-full object-cover rounded-full border-2 border-white"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                João
                            </span>

                        </div>


                        <!-- STORY 2 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=32"
                                        alt="Foto de perfil de Maria"
                                        class="w-full h-full object-cover rounded-full border-2 border-white"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                Maria
                            </span>

                        </div>


                        <!-- STORY 3 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=12"
                                        alt="Foto de perfil de Pedro"
                                        class="w-full h-full object-cover rounded-full border-2 border-white"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                Pedro
                            </span>

                        </div>


                        <!-- STORY 4 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=25"
                                        alt="Foto de perfil de Ana"
                                        class="w-full h-full object-cover rounded-full border-2 border-white"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                Ana
                            </span>

                        </div>


                        <!-- STORY 5 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=44"
                                        alt="Foto de perfil de Lucas"
                                        class="w-full h-full object-cover rounded-full border-2 border-white"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                Lucas
                            </span>

                        </div>

                    </div>

                </section>


                <!-- PRIMEIRA POSTAGEM -->
                <article class="bg-white border border-gray-200 rounded-lg mb-4">

                    <!-- CABEÇALHO DA POSTAGEM -->
                    <header class="flex items-center justify-between p-3">

                        <div class="flex items-center gap-3">

                            <!-- FOTO DO PERFIL -->
                            <div class="w-10 h-10 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full p-0.5">

                                    <img
                                        src="https://i.pravatar.cc/150?img=47"
                                        alt="Perfil de João"
                                        class="w-full h-full object-cover rounded-full border-2 border-white"
                                    >

                                </div>

                            </div>

                            <!-- NOME DO USUÁRIO -->
                            <div>
                                <h2 class="text-sm font-semibold">
                                    joao_oficial
                                </h2>

                                <p class="text-xs text-gray-500">
                                    São Paulo, Brasil
                                </p>
                            </div>

                        </div>

                        <!-- MENU DA POSTAGEM -->
                        <button class="text-2xl">
                            <i class="bx bx-dots-horizontal-rounded"></i>
                        </button>

                    </header>


                    <!-- IMAGEM DA POSTAGEM -->
                    <img
                        src="https://picsum.photos/600/500"
                        alt="Imagem da postagem"
                        class="w-full object-cover"
                    >


                    <!-- AÇÕES DA POSTAGEM -->
                    <div class="p-3">

                        <div class="flex items-center gap-4 text-2xl">

                            <i class="bx bx-heart"></i>

                            <i class="bx bx-message-rounded"></i>

                            <i class="bx bx-paper-plane"></i>

                            <i class="bx bx-bookmark ml-auto"></i>

                        </div>

                        <!-- CURTIDAS -->
                        <p class="text-sm font-semibold mt-2">
                            Curtido por maria e outras 120 pessoas
                        </p>

                        <!-- LEGENDA -->
                        <p class="text-sm mt-1">
                            <strong>joao_oficial</strong>
                            Aproveitando um dia maravilhoso!
                            ☀️❤️
                        </p>

                        <p class="text-xs text-gray-500 mt-2">
                            Ver todos os comentários
                        </p>

                        <p class="text-xs text-gray-400 mt-2">
                            HÁ 2 HORAS
                        </p>

                    </div>

                </article>


                <!-- IDENTIFICAÇÃO DA ALUNA -->
                <footer class="text-center text-xs text-gray-500 mt-6">
                    Projeto desenvolvido por Mary
                    <br>
                    Clone Instagram - HTML e Tailwind CSS
                </footer>

            </div>

        </div>

    </main>

</body>
</html>
