<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 2. Título da página -->
    <title>Clone Instagram</title>
    <!-- 3. Adição do Tailwind CSS via Play CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- 3. Adição do pacote de ícones Boxicons -->
    <link href="https://unpkg.com" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<!-- 4. Estrutura geral do body -->
<body class="min-h-screen bg-gray-100 text-slate-900">

    <!-- 5. Construção do cabeçalho (header) -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <!-- Centralização e largura máxima do cabeçalho -->
        <div class="max-w-5xl mx-auto px-4">
            <!-- 6. Alinhamento dos elementos do cabeçalho -->
            <div class="flex items-center justify-between h-14">
                <!-- Logo do Instagram -->
                <h1 class="text-xl font-semibold">Instagram</h1>
                
                <!-- Botão de menu -->
                <button class="text-2xl flex items-center justify-center">
                    <i class="bx bx-menu"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 7. Estrutura do conteúdo principal (main) -->
    <main class="max-w-5xl mx-auto py-4 pb-20 px-4">
        <!-- Div com display flex e gap para alinhamento geral -->
        <div class="flex gap-8">
            
            <!-- 8. Estrutura do feed -->
            <div class="flex-1 max-w-lg mx-auto">
                
                <!-- Section destinada à área de stories -->
                <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">
                    <!-- 11. Organização dos stories em linha com rolagem horizontal -->
                    <div class="flex gap-4 overflow-x-auto">
                        
                        <!-- 9. Elemento de adicionar story -->
                        <div class="flex flex-col items-center flex-shrink-0">
                            <!-- Estrutura da bolinha do story (três divs aninhadas) -->
                            <div class="w-16 h-16 rounded-full p-[2px] bg-gray-100">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">
                                        <!-- Ícone de adicionar story -->
                                        <span class="text-2xl text-gray-500 font-light">+</span>
                                    </div>
                                </div>
                            </div>
                            <!-- Nome abaixo do story -->
                            <span class="text-xs text-center mt-1 w-16 truncate">Seu story</span>
                        </div>

                        <!-- 10. Construção do story de contato (efeito gradiente) -->
                        <div class="flex flex-col items-center flex-shrink-0">
                            <!-- Segunda div com gradiente característico do Instagram -->
                            <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <!-- Imagem de perfil do story -->
                                    <img src="https://unsplash.com" 
                                         alt="Perfil João" 
                                         class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <!-- Nome abaixo do story -->
                            <span class="text-xs text-center mt-1 w-16 truncate">João</span>
                        </div>

                        <!-- 11. Itens duplicados temporariamente para testar a rolagem horizontal -->
                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <img src="https://unsplash.com" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <span class="text-xs text-center mt-1 w-16 truncate">Carlos</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <img src="https://unsplash.com" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <span class="text-xs text-center mt-1 w-16 truncate">Maria</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <img src="https://unsplash.com" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <span class="text-xs text-center mt-1 w-16 truncate">Lucas</span>
                        </div>

                    </div>
                </section>

                <!-- 12. Início da construção do feed de postagens -->
                <article class="bg-white border border-gray-200 rounded-lg mb-4">
                    <!-- Header próprio da postagem -->
                    <div class="flex items-center justify-between p-3">
                        <div class="flex items-center gap-3">
                            <!-- 13. Reaproveitamento da estrutura circular ajustada para tamanho 10 (w-10 h-10) -->
                            <div class="w-10 h-10 rounded-full p-[2px] bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <img src="https://unsplash.com" 
                                         alt="Perfil Autor" 
                                         class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <!-- Informações de texto do autor -->
                            <div class="flex flex-col">
                                <span class="text-sm font-semibold">João</span>
                                <span class="text-xs text-gray-500">São Paulo, Brazil</span>
                            </div>
                        </div>
                        <!-- Ícone opcional de opções (...) para fidelidade visual -->
                        <button class="text-xl text-gray-600">
                            <i class="bx bx-dots-horizontal-rounded"></i>
                        </button>
                    </div>

                    <!-- Espaço reservado para a mídia da postagem (Próximas seções da aula) -->
                    <div class="w-full aspect-square bg-gray-50 border-t border-b border-gray-100 flex items-center justify-center text-gray-400">
                        <i class="bx bx-image text-5xl"></i>
                    </div>
                </article>

            </div>
            
        </div>
    </main>

<script src="script.js"></script></body>
</html>
