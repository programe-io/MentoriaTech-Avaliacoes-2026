<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram</title>
    <!-- Tailwind CSS via Play CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- Boxicons Font Icons -->
    <link href='https://unpkg.com' rel='stylesheet'>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="min-h-screen bg-gray-100 text-slate-900">

    <!-- 5 e 6. Cabeçalho (Header) -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <!-- Logo do Instagram -->
                <h1 class="text-xl font-semibold select-none">Instagram</h1>
                <!-- Botão de menu -->
                <button class="flex items-center justify-center p-2 focus:outline-none">
                    <i class='bx bx-menu text-2xl'></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 7. Estrutura do conteúdo principal (Main) -->
    <main class="max-w-5xl mx-auto py-4 pb-20 px-4">
        <div class="flex gap-8 justify-center">
            
            <!-- 8. Estrutura do Feed -->
            <div class="flex-1 max-w-lg mx-auto">
                
                <!-- 8, 9, 10 e 11. Área de Stories -->
                <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">
                    <!-- Rolagem horizontal -->
                    <div class="flex gap-4 overflow-x-auto scrollbar-none">
                        
                        <!-- 9. Elemento de adicionar story -->
                        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                            <!-- Estrutura da bolinha -->
                            <div class="w-16 h-16 rounded-full bg-gray-100 p-[2px]">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">
                                        <!-- Ícone de adicionar -->
                                        <span class="text-2xl text-gray-500 font-light">+</span>
                                    </div>
                                </div>
                            </div>
                            <span class="text-xs mt-1 text-center w-16 truncate text-gray-500">Seu story</span>
                        </div>

                        <!-- 10. Story de contato (Efeito Gradiente - João) -->
                        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                            <!-- Estrutura com gradiente do Instagram -->
                            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-[2px]">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <!-- Imagem de perfil do story -->
                                    <img src="https://unsplash.com" alt="Foto de João" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <!-- Nome abaixo do story -->
                            <span class="text-xs mt-1 text-center w-16 truncate">João</span>
                        </div>

                        <!-- Itens duplicados para testar o comportamento do scroll horizontal (item 11) -->
                        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-[2px]">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <img src="https://unsplash.com" alt="Perfil" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <span class="text-xs mt-1 text-center w-16 truncate">Maria</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-[2px]">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <img src="https://unsplash.com" alt="Perfil" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <span class="text-xs mt-1 text-center w-16 truncate">Pedro</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-[2px]">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <img src="https://unsplash.com" alt="Perfil" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <span class="text-xs mt-1 text-center w-16 truncate">Ana</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-[2px]">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <img src="https://unsplash.com" alt="Perfil" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <span class="text-xs mt-1 text-center w-16 truncate">Lucas</span>
                        </div>

                    </div>
                </section>

                <!-- 12 e 13. Início do Feed de Postagens -->
                <article class="bg-white border border-gray-200 rounded-lg mb-4">
                    <!-- Header da postagem -->
                    <div class="flex items-center justify-between p-3">
                        <div class="flex items-center gap-3">
                            <!-- 13. Reaproveitamento da estrutura circular para o perfil (Tamanho 10) -->
                            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-[2px]">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <img src="https://unsplash.com" alt="Foto de João" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <!-- Informações do Autor -->
                            <div class="flex flex-col">
                                <span class="text-sm font-semibold cursor-pointer hover:underline">João</span>
                                <span class="text-xs text-gray-500">São Paulo, Brazil</span>
                            </div>
                        </div>
                        <!-- Botão de opções da postagem -->
                        <button class="text-gray-600 hover:text-black">
                            <i class='bx bx-dots-horizontal-rounded text-xl'></i>
                        </button>
                    </div>

                    <!-- Área reservada para a imagem do post (Próximas aulas) -->
                    <div class="bg-gray-50 aspect-square w-full flex items-center justify-center border-t border-b border-gray-100">
                        <span class="text-gray-400 text-sm">[ Espaço para a foto do Feed ]</span>
                    </div>
                </article>

            </div>

            <!-- Coluna Lateral Opcional (Oculta em telas menores se necessário) -->
            <div class="hidden md:block w-72">
                <!-- Espaço reservado para sugestões de perfis laterais -->
            </div>

        </div>
    </main>

<script src="script.js"></script></body>
</html>
