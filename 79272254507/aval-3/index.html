<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram</title>
    <!-- 3. Adição do Tailwind CSS via Play CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- 3. Adição do pacote de ícones Boxicons -->
    <link href="https://unpkg.com" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<!-- 4. Estrutura geral do body -->
<body class="min-h-screen bg-gray-100 text-slate-900">

    <!-- 5. Construção do cabeçalho (header) -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <!-- Centralização e largura máxima -->
        <div class="max-w-5xl mx-auto px-4">
            <!-- 6. Alinhamento dos elementos do cabeçalho -->
            <div class="flex items-center justify-between h-14">
                <!-- Logo do Instagram -->
                <h1 class="text-xl font-semibold">Instagram</h1>
                <!-- Botão de menu -->
                <button class="text-2xl flex items-center justify-center">
                    <i class="bx bx-menu"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 7. Estrutura do conteúdo principal (main) -->
    <main class="max-w-5xl mx-auto py-4 pb-20 px-4">
        <!-- Organização entre o feed e possíveis elementos laterais -->
        <div class="flex gap-8">
            
            <!-- 8. Estrutura do feed -->
            <div class="flex-1 max-w-lg mx-auto">
                
                <!-- 11. Organização dos stories em linha com rolagem horizontal -->
                <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4 flex gap-4 overflow-x-auto">
                    
                    <!-- 9. Construção do elemento de adicionar story -->
                    <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                        <!-- Estrutura da bolinha do story -->
                        <div class="w-16 h-16 rounded-full bg-gray-100 p-0.5">
                            <div class="w-full h-full rounded-full bg-white p-0.5">
                                <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">
                                    <!-- Ícone de adicionar story -->
                                    <span class="text-2xl text-gray-500 font-light">+</span>
                                </div>
                            </div>
                        </div>
                        <span class="text-xs mt-1 w-16 text-center truncate">Seu story</span>
                    </div>

                    <!-- 10. Construção do story de contato (efeito gradiente) -->
                    <!-- Contato 1 (João) -->
                    <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                        <div class="w-16 h-16 rounded-full bg-gray-100 p-0.5">
                            <!-- Borda interna com gradiente característico do Instagram -->
                            <div class="w-full h-full rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-0.5">
                                <div class="w-full h-full rounded-full bg-white p-0.5">
                                    <!-- Imagem de perfil do story -->
                                    <img src="https://unsplash.com" alt="João" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                        </div>
                        <!-- Nome abaixo do story -->
                        <span class="text-xs mt-1 w-16 text-center truncate">João</span>
                    </div>

                    <!-- Elementos duplicados para testar o comportamento do scroll horizontal -->
                    <!-- Contato 2 -->
                    <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                        <div class="w-16 h-16 rounded-full bg-gray-100 p-0.5">
                            <div class="w-full h-full rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-0.5">
                                <div class="w-full h-full rounded-full bg-white p-0.5">
                                    <img src="https://unsplash.com" alt="Maria" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                        </div>
                        <span class="text-xs mt-1 w-16 text-center truncate">Maria</span>
                    </div>

                    <!-- Contato 3 -->
                    <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                        <div class="w-16 h-16 rounded-full bg-gray-100 p-0.5">
                            <div class="w-full h-full rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-0.5">
                                <div class="w-full h-full rounded-full bg-white p-0.5">
                                    <img src="https://unsplash.com" alt="Pedro" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                        </div>
                        <span class="text-xs mt-1 w-16 text-center truncate">Pedro</span>
                    </div>

                    <!-- Contato 4 -->
                    <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                        <div class="w-16 h-16 rounded-full bg-gray-100 p-0.5">
                            <div class="w-full h-full rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-0.5">
                                <div class="w-full h-full rounded-full bg-white p-0.5">
                                    <img src="https://unsplash.com" alt="Ana" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                        </div>
                        <span class="text-xs mt-1 w-16 text-center truncate">Ana_silva</span>
                    </div>

                    <!-- Contato 5 -->
                    <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                        <div class="w-16 h-16 rounded-full bg-gray-100 p-0.5">
                            <div class="w-full h-full rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-0.5">
                                <div class="w-full h-full rounded-full bg-white p-0.5">
                                    <img src="https://unsplash.com" alt="Lucas" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                        </div>
                        <span class="text-xs mt-1 w-16 text-center truncate">lucas_dev</span>
                    </div>

                </section>

                <!-- 12. Início da construção do feed de postagens -->
                <article class="bg-white border border-gray-200 rounded-lg mb-4">
                    <!-- Header próprio da postagem -->
                    <div class="flex items-center justify-between p-3">
                        <div class="flex items-center gap-3">
                            <!-- 13. Reaproveitamento da estrutura circular para o perfil da postagem (tamanho 10) -->
                            <div class="w-10 h-10 rounded-full bg-gray-100 p-0.5">
                                <div class="w-full h-full rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-0.5">
                                    <div class="w-full h-full rounded-full bg-white p-0.5">
                                        <img src="https://unsplash.com" alt="João" class="w-full h-full object-cover rounded-full">
                                    </div>
                                </div>
                            </div>
                            <!-- Informações do usuário da postagem -->
                            <div class="flex flex-col">
                                <span class="text-sm font-semibold cursor-pointer hover:underline">João</span>
                                <span class="text-xs text-gray-500">São Paulo, Brazil</span>
                            </div>
                        </div>
                        <!-- Botão de opções da postagem (Exemplo extra usando Boxicons) -->
                        <button class="text-xl flex items-center justify-center text-gray-600">
                            <i class="bx bx-dots-horizontal-rounded"></i>
                        </button>
                    </div>

                    <!-- Espaço reservado para a Imagem da Postagem (Próximos passos) -->
                    <div class="bg-gray-50 aspect-square w-full flex items-center justify-center text-gray-400 border-t border-b border-gray-100">
                        <span class="text-sm">[ Conteúdo / Imagem da publicação ]</span>
                    </div>
                </article>

            </div>

            <!-- Espaço reservado para Elementos Laterais (Opcional - ex: Sugestões) -->
            <div class="hidden md:block w-72 flex-shrink-0">
                <!-- Conteúdo lateral pode ser adicionado aqui futuramente -->
            </div>

        </div>
    </main>

<script src="script.js"></script></body>
</html>
