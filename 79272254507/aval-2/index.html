<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Interativo</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho da página -->
    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main>
        
        <!-- Área de nova publicação (Agora funcional) -->
        <section class="new-post-card">
            <div class="user">
                <div class="avatar">U</div>
                <div class="user-info">
                    <strong>Seu Nome</strong>
                    <!-- Trocamos o span por uma caixa de texto real -->
                    <textarea id="post-input" placeholder="O que você está pensando?"></textarea>
                </div>
            </div>
            <!-- Adicionado ID no botão para o evento de clique -->
            <button type="button" id="publish-btn">Publicar</button>
        </section>

        <!-- Feed de Postagens (O JavaScript vai injetar os novos posts aqui dentro) -->
        <div id="feed-container">
            
            <!-- Postagem Inicial Estática -->
            <article class="post-card">
                <header class="post-header">
                    <div class="user">
                        <div class="avatar">P</div>
                        <div class="user-info">
                            <strong>Peter Parker</strong>
                            <span>há 10 minutos</span>
                        </div>
                    </div>
                </header>
                
                <p class="post-text">
                    Acabei de assistir ao novo filme do Homem-Aranha! Sensacional! 🕷️🕸️
                </p>
                
                <img src="https://unsplash.com" alt="Máscara do Homem-Aranha em detalhe" class="post-image">
                
                <div class="post-actions">
                    <button type="button" class="like-btn">Curtir</button>
                    <button type="button">Comentar</button>
                </div>
            </article>

        </div>

    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 Mini Feed - Todos os direitos reservados.</p>
    </footer>

    <!-- Vínculo com o arquivo de lógica JavaScript -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
