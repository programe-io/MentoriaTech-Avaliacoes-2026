
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Gerencie seus produtos e seu estoque</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">
                <label for="descricao">Descrição do produto:</label>
                <input type="text" id="descricao" placeholder="Ex.: Cadeira Gamer" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="1" placeholder="Digite a quantidade" required>

                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor" min="0" step="0.01" placeholder="Ex.: 699.00" required>

                <button type="submit">Cadastrar Produto</button>
            </form>
        </section>

        <section class="estoque">
            <h2>Lista de Produtos</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor (R$)</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                    <!-- Os produtos serão exibidos aqui pelo JavaScript -->
                </tbody>
            </table>
        </section>

        <section class="atualizacao">
            <h2>Atualizar Produto</h2>

            <label for="codigoProduto">Código do produto:</label>
            <input type="number" id="codigoProduto" min="1" placeholder="Digite o código">

            <label for="novoValor">Novo valor (R$):</label>
            <input type="number" id="novoValor" min="0" step="0.01" placeholder="Digite o novo valor">

            <button type="button" id="btnAtualizarValor">Atualizar Valor</button>

            <label for="novaQuantidade">Adicionar quantidade:</label>
            <input type="number" id="novaQuantidade" min="1" placeholder="Quantidade a adicionar">

            <button type="button" id="btnAtualizarQuantidade">Adicionar ao Estoque</button>
        </section>

        <p id="mensagem" role="status"></p>
    </main>

    <footer>
        <p>Sistema de Controle de Estoque</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
