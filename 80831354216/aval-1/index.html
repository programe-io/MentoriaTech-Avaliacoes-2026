<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golaço FC - O Seu Blog de Futebol</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
        }

        /* Cabeçalho */
        header {
            background-color: #0b5345; /* Verde futebol */
            color: white;
            padding: 20px 0;
            text-align: center;
            border-bottom: 5px solid #117a65;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        header p {
            font-style: italic;
            color: #a3e4d7;
        }

        /* Menu de Navegação */
        nav {
            background-color: #1a252f;
            text-align: center;
        }

        nav a {
            display: inline-block;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }

        nav a:hover {
            background-color: #117a65;
        }

        /* Container Principal */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            display: flex;
            flex-wrap: wrap;
            padding: 0 15px;
            gap: 20px;
        }

        /* Área de Postagens (Esquerda) */
        .main-content {
            flex: 3;
            min-width: 300px;
        }

        .post {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .post img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .post-meta {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 10px;
        }

        .post-title {
            color: #0b5345;
            margin-bottom: 12px;
            font-size: 1.8rem;
        }

        .post-text {
            line-height: 1.6;
            color: #555;
            margin-bottom: 15px;
        }

        .btn-leia-mais {
            display: inline-block;
            background-color: #117a65;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-leia-mais:hover {
            background-color: #0b5345;
        }

        /* Barra Lateral (Direita) */
        .sidebar {
            flex: 1;
            min-width: 250px;
        }

        .sidebar-widget {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .sidebar-widget h3 {
            color: #1a252f;
            border-bottom: 3px solid #117a65;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        /* Tabela Simplificada */
        .tabela-classificacao {
            width: 100%;
            border-collapse: collapse;
        }

        .tabela-classificacao th, .tabela-classificacao td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
        }

        .tabela-classificacao th {
            background-color: #f2f2f2;
        }

        /* Rodapé */
        footer {
            background-color: #1a252f;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 40px;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Golaço FC</h1>
        <p>A sua dose diária de futebol, tática e resenha</p>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#">Campeonato Brasileiro</a>
        <a href="#">Champions League</a>
        <a href="#">Mercado da Bola</a>
        <a href="#">Contato</a>
    </nav>

    <div class="container">
  
  
</body>
</html>
