<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Sistema de Estoque</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <div class="container">
              <h1>📦 Sistema de Estoque</h1>

                  <!-- Resumo -->
                      <div class="resumo">
                            <div class="card">
                                    <span class="label">Produtos</span>
                                            <span id="total-produtos" class="valor">0</span>
                                                  </div>
                                                        <div class="card">
                                                                <span class="label">Itens em estoque</span>
                                                                        <span id="total-itens" class="valor">0</span>
                                                                              </div>
                                                                                    <div class="card">
                                                                                            <span class="label">Valor total</span>
                                                                                                    <span id="valor-total" class="valor">R$ 0,00</span>
                                                                                                          </div>
                                                                                                              </div>

                                                                                                                  <!-- Formulário -->
                                                                                                                      <form id="form-produto">
                                                                                                                            <input type="text" id="nome" placeholder="Nome do produto" required>
                                                                                                                                  <input type="number" id="quantidade" placeholder="Qtd" min="0" required>
                                                                                                                                        <input type="number" id="preco" placeholder="Preço (R$)" min="0" step="0.01" required>
                                                                                                                                              <button type="submit">Adicionar</button>
                                                                                                                                                  </form>

                                                                                                                                                      <!-- Busca -->
                                                                                                                                                          <input type="text" id="busca" placeholder="🔍 Buscar produto...">

                                                                                                                                                              <!-- Tabela -->
                                                                                                                                                                  <table id="tabela-estoque">
                                                                                                                                                                        <thead>
                                                                                                                                                                                <tr>
                                                                                                                                                                                          <th>Produto</th>
                                                                                                                                                                                                    <th>Qtd</th>
                                                                                                                                                                                                              <th>Preço</th>
                                                                                                                                                                                                                        <th>Subtotal</th>
                                                                                                                                                                                                                                  <th>Ações</th>
                                                                                                                                                                                                                                          </tr>
                                                                                                                                                                                                                                                </thead>
                                                                                                                                                                                                                                                      <tbody id="corpo-tabela"></tbody>
                                                                                                                                                                                                                                                          </table>

                                                                                                                                                                                                                                                              <p id="mensagem-vazia" class="vazio">Nenhum produto cadastrado ainda.</p>
                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                  <script src="script.js"></script>
                                                                                                                                                                                                                                                                  <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                  </html>
