
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha de Anamnese - Calculadora de IMC</title>

    <link rel="stylesheet" href="./style.css">

    <script src="./app.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <header>
            <h1>Ficha de Anamnese</h1>
            <p class="subtitulo">
                Sistema de cadastro e controle de IMC
            </p>
        </header>

        <!-- FORMULÁRIO DE CADASTRO -->

        <section class="card">

            <h2>Cadastro de Paciente</h2>

            <form id="form-pessoa" autocomplete="off">

                <div class="campo">
                    <label for="nome">Nome completo</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        maxlength="50"
                        placeholder="Digite o nome do paciente"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>

                    <input
                        type="number"
                        id="idade"
                        name="idade"
                        min="1"
                        max="120"
                        step="1"
                        placeholder="Ex: 25"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="altura">Altura (metros)</label>

                    <input
                        type="number"
                        id="altura"
                        name="altura"
                        min="0.5"
                        max="2.5"
                        step="0.01"
                        placeholder="Ex: 1.70"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="peso">Peso (KG)</label>

                    <input
                        type="number"
                        id="peso"
                        name="peso"
                        min="2"
                        max="500"
                        step="0.1"
                        placeholder="Ex: 65"
                        required
                    >
                </div>

                <p id="erro" hidden></p>

                <div class="botoes">

                    <button type="submit" class="btn-salvar">
                        Salvar paciente
                    </button>

                    <button type="button" id="cancelar" class="btn-cancelar">
                        Cancelar
                    </button>

                </div>

            </form>

        </section>


        <!-- TABELA DE PACIENTES -->

        <section class="card">

            <h2>Pacientes cadastrados</h2>

            <div class="tabela-container">

                <table>

                    <thead>

                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>

                    </thead>

                    <tbody id="tabela-pessoas">

                    </tbody>

                </table>

            </div>

        </section>

        <footer>
            <p>Sistema de Ficha de Anamnese</p>
        </footer>

    </main>

<script src="script.js"></script></body>
</html>
