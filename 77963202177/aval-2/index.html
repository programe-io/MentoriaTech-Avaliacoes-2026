<!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MiniFeed</title>
        <link rel="stylesheet" href="style.css">
    <link href="style.css" rel="stylesheet"></head>
    <body>
        
        <header>

         <div class="header-content">

            <h1>MiniFeed</h1>

            <nav>
                <a href="#">Inicio</a>
                <a href="#">Perfil</a>
            </nav>

         </div>   

        </header>



        
        <main>

                    </div>

                </div>

            </section>

                     <div class="avatar">
                        O
                    </div>

                    <div>

                    </div>

                </div>

                   Je t'aime :D
                </div>

                <img src="https://cdn.ome.lt/uploads/conteudo/fotos/ahipotesedoamor.webp" alt="Imagem do Homem Aranha">

                    <button>Curtir</button>
                    <button>Comentar</button>

                </div>


            </article>

             <article class="post">

                    </div>
