<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Completo</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
  <h1>Meu Site Completo</h1>
  <nav>
    <a href="#">Início</a>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
  </nav>
</header>

<main>

  <section>
    <h2>Seção Principal</h2>
    <p>Texto com <strong>negrito</strong>, <em>itálico</em> e <mark>marcado</mark>.</p>
    <span>Exemplo de span</span>
  </section>

  <article>
    <h3>Artigo</h3>
    <p>Conteúdo de artigo usando a tag article.</p>
  </article>

  <aside>
    <p>Barra lateral (aside)</p>
  </aside>

  <section>
    <h3>Lista</h3>
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
    </ul>

    <ol>
      <li>Primeiro</li>
      <li>Segundo</li>
    </ol>
  </section>

  <section>
    <h3>Formulário</h3>
    <form>
      <input type="text" placeholder="Nome">
      <input type="email" placeholder="Email">
      <button type="button" onclick="mostrarAlerta()">Enviar</button>
    </form>
  </section>

  <section>
    <h3>Midia</h3>
    <img src="https://via.placeholder.com/150" alt="Imagem">
    <audio controls></audio>
    <video controls width="200"></video>
  </section>

  <div>
    <p>Div genérica</p>
  </div>

</main>

<footer>
  <p>Rodapé do site</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
