<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema de Estoque</title>

  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

  <header>
    <h1>📦 Sistema de Estoque</h1>
    <p>Controle seus produtos de forma simples</p>
  </header>

  <main>

    <!-- CARDS -->
    <section class="cards">

      <div class="card">
        <h3>Total de produtos</h3>
        <strong id="totalProdutos">0</strong>
      </div>

      <div class="card">
        <h3>Itens em estoque</h3>
        <strong id="totalItens">0</strong>
      </div>

      <div class="card">
        <h3>Estoque baixo</h3>
        <strong id="estoqueBaixo">0</strong>
      </div>

      <div class="card">
        <h3>Valor do estoque</h3>
        <strong id="valorEstoque">R$ 0,00</strong>
      </div>

    </section>


    <!-- CADASTRO -->
    <section class="formulario">

      <h2>Adicionar produto</h2>

      <form id="formProduto">

        <div class="campo">
          <label>Produto</label>
          <input
            type="text"
            id="nome"
            placeholder="Nome do produto"
            required
          >
        </div>

        <div class="campo">
          <label>Categoria</label>
          <input
            type="text"
            id="categoria"
            placeholder="Categoria"
            required
          >
        </div>

        <div class="campo">
          <label>Quantidade</label>
          <input
            type="number"
            id="quantidade"
            placeholder="0"
            min="0"
            required
          >
        </div>

        <div class="campo">
          <label>Preço</label>
          <input
            type="number"
            id="preco"
            placeholder="0,00"
            min="0"
            step="0.01"
            required
          >
        </div>

        <button type="submit">
          + Adicionar produto
        </button>

      </form>

    </section>


    <!-- ESTOQUE -->
    <section class="estoque">

      <div class="topo-estoque">

        <h2>Produtos em estoque</h2>

        <input
          type="text"
          id="pesquisa"
          placeholder="🔎 Pesquisar produto..."
        >

      </div>


      <div class="tabela-container">

        <table>

          <thead>

            <tr>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Quantidade</th>
              <th>Preço</th>
              <th>Valor total</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>

          </thead>

          <tbody id="listaProdutos"></tbody>

        </table>

      </div>

      <div
        id="mensagemVazia"
        class="mensagem-vazia"
      >
        Nenhum produto cadastrado.
      </div>

    </section>

  </main>

  <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
