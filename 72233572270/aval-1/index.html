
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema IMC 3.0</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="app">

        <header class="header">
            <div class="logo">IMC+</div>
            <h1>Calculadora de IMC</h1>
            <p>Índice de Massa Corporal</p>
        </header>

        <section class="card">

            <h2>Seus dados</h2>

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome"
                    placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso"
                    placeholder="Ex: 70" step="0.1">
            </div>

            <div class="campo">
                <label for="altura">Altura (metros)</label>
                <input type="number" id="altura"
                    placeholder="Ex: 1.75" step="0.01">
            </div>

            <div class="campo">
                <label for="idade">Idade</label>
                <input type="number" id="idade"
                    placeholder="Ex: 25">
            </div>

            <div class="campo">
                <label for="sexo">Sexo</label>
                <select id="sexo">
                    <option value="">Selecione</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                </select>
            </div>

            <button id="calcular" class="btn-principal">
                Calcular IMC
            </button>

            <button id="limpar" class="btn-secundario">
                Limpar campos
            </button>

        </section>

        <section id="resultado" class="card resultado" hidden>

            <h2>Resultado do cálculo</h2>

            <p id="saudacao"></p>

            <div class="numero" id="valor">0.00</div>

            <h3 id="classificacao"></h3>

            <p id="mensagem"></p>

            <div class="barra">
                <div id="progresso"></div>
            </div>

            <p class="aviso" id="aviso"></p>

        </section>

        <section class="card historico">

            <div class="historico-topo">
                <h2>Histórico</h2>
                <button id="limparHistorico" class="btn-excluir">
                    Limpar histórico
                </button>
            </div>

            <div id="listaHistorico">
                <p class="vazio">Nenhum cálculo realizado.</p>
            </div>

        </section>

        <footer>
            <p>Desenvolvido com HTML, CSS e JavaScript</p>
            <small>Ferramenta educativa. O IMC não é um diagnóstico médico.</small>
        </footer>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
