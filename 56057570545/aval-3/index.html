<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Ficha de Anamnese</h1>
        <p>Preencha seus dados abaixo</p>

        <form id="formulario">

            <h2>Dados pessoais</h2>

            <label>Nome completo:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label>Idade:</label>
            <input type="number" id="idade" min="1" max="120" required>

            <label>Telefone:</label>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000">

            <label>Data de nascimento:</label>
            <input type="date" id="nascimento">

            <h2>Informações de saúde</h2>

            <label>Possui alguma doença?</label>
            <select id="doenca">
                <option value="Não">Não</option>
                <option value="Sim">Sim</option>
            </select>

            <label>Possui alergia?</label>
            <select id="alergia">
                <option value="Não">Não</option>
                <option value="Sim">Sim</option>
            </select>

            <label>Faz uso de medicamentos?</label>
            <select id="medicamentos">
                <option value="Não">Não</option>
                <option value="Sim">Sim</option>
            </select>

            <label>Pratica atividades físicas?</label>
            <select id="atividade">
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
                <option value="Às vezes">Às vezes</option>
            </select>

            <label>Observações:</label>
            <textarea id="observacoes" placeholder="Escreva outras informações importantes..."></textarea>

            <button type="submit">Enviar ficha</button>
            <button type="reset" class="limpar">Limpar formulário</button>

        </form>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
