<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>📦 Sistema de Estoque</h1>
        <p class="subtitulo">Cadastro e controle de produtos</p>

        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: Cadeira gamer"
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        placeholder="Ex: 10"
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input
                        type="number"
                        id="valor"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 699.90"
                    >
                </div>

                <button type="submit">Cadastrar Produto</button>
            </form>

            <p id="mensagem"></p>
        </section>

        <section class="card">
            <h2>Produtos Cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Produtos serão inseridos pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

        <section class="card">
            <h2>Atualizar Produto</h2>

            <div class="atualizacao">

                <div class="campo">
                    <label for="codigoAtualizar">Código do produto</label>
                    <input
                        type="number"
                        id="codigoAtualizar"
                        min="1"
                        placeholder="Ex: 1"
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">Novo valor</label>
                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 599.90"
                    >
                </div>

                <button onclick="atualizarValorTela()">
                    Atualizar Valor
                </button>

                <div class="campo">
                    <label for="novaQuantidade">
                        Quantidade a adicionar
                    </label>

                    <input
                        type="number"
                        id="novaQuantidade"
                        min="1"
                        placeholder="Ex: 5"
                    >
                </div>

                <button onclick="atualizarQuantidadeTela()">
                    Adicionar Estoque
                </button>

            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
