<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese - Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main>
        <h1>Ficha de Anamnese</h1>
        <p>Cadastro de pacientes e controle de IMC</p>

        <section class="card">
            <h2>Cadastro de Pacientes</h2>

            <form id="form-pessoa">

                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome"
                        placeholder="Digite o nome completo"
                        maxlength="50" required>
                </div>

                <div>
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade"
                        min="1" max="120"
                        placeholder="Digite a idade" required>
                </div>

                <div>
                    <label for="altura">Altura (m):</label>
                    <input type="number" id="altura"
                        min="0.5" max="2.5"
                        step="0.01"
                        placeholder="Ex: 1.70" required>
                </div>

                <div>
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso"
                        min="2" max="500"
                        step="0.1"
                        placeholder="Ex: 65" required>
                </div>

                <div class="botoes">
                    <button type="submit">Salvar</button>
                    <button type="reset">Cancelar</button>
                </div>

                <p id="erro" hidden></p>

            </form>
        </section>

        <section class="card">
            <h2>Pacientes Cadastrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Altura</th>
                        <th>Peso</th>
                        <th>IMC</th>
                        <th>Classificação</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabela-pessoas">
                    <tr>
                        <td colspan="7">
                            Nenhuma pessoa cadastrada ainda.
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <script src="app.js"></script>

<script src="script.js"></script></body>
</html>$0
