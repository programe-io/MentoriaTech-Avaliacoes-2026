<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>CRUD de produtos</p>
    </header>

    <main>

        <!-- Cadastro -->
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: Cadeira Gamer"
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        placeholder="Ex: 10"
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input
                        type="number"
                        id="valor"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 699.90"
                    >
                </div>

                <button type="submit" class="btn cadastrar">
                    Cadastrar Produto
                </button>

            </form>

            <p id="mensagem"></p>
        </section>

        <!-- Produtos -->
        <section class="card">
            <div class="titulo-lista">
                <h2>Produtos Cadastrados</h2>
                <span id="totalProdutos">0 produtos</span>
            </div>

            <div class="tabela-container">

                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Produtos serão inseridos pelo JavaScript -->
                    </tbody>
                </table>

            </div>

            <p id="listaVazia">
                Nenhum produto cadastrado.
            </p>
        </section>

    </main>

    <!-- Modal para atualizar produto -->
    <div id="modal" class="modal">

        <div class="modal-conteudo">

            <button class="fechar" onclick="fecharModal()">
                &times;
            </button>

            <h2 id="tituloModal">Atualizar Produto</h2>

            <input type="hidden" id="codigoAtualizacao">

            <div class="campo">
                <label for="novoValor">Novo valor</label>
                <input
                    type="number"
                    id="novoValor"
                    min="0"
                    step="0.01"
                >
            </div>

            <button
                class="btn atualizar"
                onclick="confirmarAtualizacaoValor()"
            >
                Atualizar Valor
            </button>

        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
