<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Gerenciador de Tarefas</title>
<link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head> <body>
<header class="cabecalho">
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas tarefas de forma simples e eficiente.</p>
    </div>
</header>

<main class="container">

    <section class="card">
        <h2>Cadastrar nova tarefa</h2>

        <form id="formTarefa">

            <div class="campo">
                <label for="titulo">Título da tarefa</label>
                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título da tarefa"
                    maxlength="100"
                >
            </div>

            <div class="campo">
                <label for="prioridade">Prioridade</label>
                <select id="prioridade">
                    <option value="">Selecione</option>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>
            </div>

            <button type="submit" class="btn btn-principal">
                Cadastrar tarefa
            </button>

        </form>

        <div id="mensagem" class="mensagem"></div>
    </section>

    <section class="card">
        <div class="titulo-listagem">
            <div>
                <h2>Tarefas cadastradas</h2>
                <p id="contadorTarefas">0 tarefas cadastradas</p>
            </div>

            <div class="busca">
                <input
                    type="number"
                    id="codigoBusca"
                    placeholder="Código"
                    min="1"
                >
                <button id="btnBuscar" class="btn btn-secundario">
                    Buscar
                </button>
            </div>
        </div>

        <div id="resultadoBusca"></div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Título</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaTarefas">
                    <tr>
                        <td colspan="5" class="vazio">
                            Nenhuma tarefa cadastrada.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    <p>Projeto de revisão JavaScript - Gerenciador de Tarefas</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body> </html>
