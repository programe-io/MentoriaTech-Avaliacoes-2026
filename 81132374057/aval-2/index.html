<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed Estilo Instagram</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="navbar">
    <div class="container nav-conteudo">
      <h1 class="logo">Instaclone</h1>
      <button id="btn-novo-post" type="button">+ Novo Post</button>
    </div>
  </header>

  <main class="container">
    <section id="stories" class="stories" aria-label="Stories"></section>
    <section id="feed" class="feed" aria-live="polite"></section>
  </main>

  <dialog id="modal-post" class="modal">
    <form id="form-post" class="modal-form">
      <div class="modal-topo">
        <h2>Criar publicação</h2>
        <button id="fechar-modal" type="button" aria-label="Fechar">✕</button>
      </div>
      <input id="input-usuario" type="text" placeholder="Seu @usuario" value="voce.dev" required />
      <input id="input-imagem" type="url" placeholder="URL da imagem (ex: https://picsum.photos)" required />
      <input id="input-legenda" type="text" placeholder="Escreva uma legenda..." required />
      <button type="submit" class="btn-primario">Publicar</button>
    </form>
  </dialog>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
