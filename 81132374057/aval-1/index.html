<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Blog Pessoal</title>
  <link rel="stylesheet" href="style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <div class="container topo-flex">
      <div>
        <h1>Meu Blog Pessoal</h1>
        <p>Notas, projetos e ideias do dia a dia</p>
      </div>
      <button id="toggle-tema" type="button">Modo escuro</button>
    </div>
  </header>

  <main class="container">
    <section class="controles" aria-label="Filtros de artigos">
      <input id="busca" type="search" placeholder="Buscar por título ou tema..." />
      <div id="filtros" class="filtros">
        <button class="ativo" data-categoria="Todos" type="button">Todos</button>
        <button data-categoria="Código" type="button">Código</button>
        <button data-categoria="Vida" type="button">Vida</button>
        <button data-categoria="Livros" type="button">Livros</button>
      </div>
    </section>

    <section id="lista-posts" class="grid-posts" aria-live="polite"></section>
  </main>

  <dialog id="modal-post" class="modal">
    <article class="modal-conteudo">
      <button id="fechar-modal" class="fechar" type="button" aria-label="Fechar">✕</button>
      <span id="modal-meta" class="meta"></span>
      <h2 id="modal-titulo"></h2>
      <div id="modal-corpo"></div>
    </article>
  </dialog>

  <footer class="rodape">
    <div class="container">
      <p>Feito com HTML, CSS e JavaScript puro.</p>
    </div>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
