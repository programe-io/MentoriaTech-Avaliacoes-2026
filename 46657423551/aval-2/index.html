<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória | Encontre os Pares</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1><i class="fas fa-brain"></i> Jogo da Memória</h1>
        <p>Encontre todos os pares o mais rápido possível! 🧠✨</p>
    </header>

    <main class="container-jogo">
        <div class="painel-info">
            <div class="info-item">
                <span>Jogadas:</span>
                <strong id="contador-jogadas">0</strong>
            </div>
            <div class="info-item">
                <span>Pares:</span>
                <strong id="pares-encontrados">0 / 8</strong>
            </div>
            <div class="info-item">
                <span>Tempo:</span>
                <strong id="cronometro">00:00</strong>
            </div>
        </div>

        <div class="tabuleiro" id="tabuleiro">
            <!-- As cartas são geradas pelo JavaScript -->
        </div>

        <button id="btn-reiniciar">
            <i class="fas fa-redo"></i> Reiniciar Jogo
        </button>
    </main>

    <div id="mensagem-vitoria" class="oculto">
        <div class="caixa-vitoria">
            <h2>🎉 Parabéns! Você Venceu!</h2>
            <p>Concluído em <span id="tempo-final">00:00</span> com <span id="jogadas-final">0</span> jogadas</p>
            <button id="btn-jogar-novamente">Jogar Novamente</button>
        </div>
    </div>

    <footer>
        <p>Feito com <i class="fas fa-heart"></i> e muito código | 2026</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
