<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Mengão 🔴⚫</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>
    <div class="quiz-container">
        <header>
            <h1><i class="fas fa-fire"></i> Quiz Mengão</h1>
            <div class="pontuacao-caixa">
                <i class="fas fa-star"></i> <span id="pontos">0</span>
            </div>
        </header>

        <main>
            <div class="cabecalho-pergunta">
                <span id="contador">Pergunta 1 / 6</span>
                <div class="linha-progresso">
                    <div id="progresso"></div>
                </div>
            </div>

            <h2 id="pergunta">Carregando...</h2>

            <div id="opcoes" class="grade-opcoes"></div>
        </main>

        <button id="btn-proximo" class="oculto">
            Continuar <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
