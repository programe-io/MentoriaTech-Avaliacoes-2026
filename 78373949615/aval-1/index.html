<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  
<div class="calculadora">
  <h1>Minha Calculadora</h1>
  <input type="number" id="n1" placeholder="Primeiro número">
  <input type="number" id="n2" placeholder="Segundo número">

  <div class="botoes">
    <button onclick="calcular('+')">Somar (+)</button>
    <button onclick="calcular('-')">Subtrair (-)</button>
    <button onclick="calcular('*')">Multiplicar (×)</button>
    <button onclick="calcular('/')">Dividir (÷)</button>
  </div>

  <h2 id="resultado">Resultado: 0</h2>
</div>

  <script src="script.js"></script>
  
</body>
</html>
