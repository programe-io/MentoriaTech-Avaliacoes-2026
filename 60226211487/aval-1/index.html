<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <h1>📦 Sistema de Estoque</h1>
            <p>Controle de produtos</p>
        </header>

        <!-- CADASTRO -->
        <section class="card">

            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="formulario">

                    <div class="campo">
                        <label for="codigo">Código</label>
                        <input type="text" id="codigo" placeholder="Ex: 001" required>
                    </div>

                    <div class="campo">
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao" placeholder="Nome do produto" required>
                    </div>

                    <div class="campo">
                        <label for="quantidade">Quantidade</label>
                        <input type="number" id="quantidade" min="0" placeholder="Ex: 10" required>
                    </div>

                    <div class="campo">
                        <label for="valor">Valor (R$)</label>
                        <input type="text" id="valor" placeholder="Ex: 49,99" required>
                    </div>

                </div>

                <button type="submit" class="btn-cadastrar">
                    Cadastrar Produto
                </button>

            </form>

        </section>


        <!-- PRODUTOS -->
        <section class="card">

            <div class="titulo">

                <h2>Produtos Cadastrados</h2>

                <span id="total">0 produtos</span>

            </div>

            <div class="tabela">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>

                </table>

            </div>

            <p id="semProdutos">
                Nenhum produto cadastrado.
            </p>

        </section>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
