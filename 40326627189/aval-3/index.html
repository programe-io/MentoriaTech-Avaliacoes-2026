<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha de Anamnese – Controle de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Ficha de anamnese</h1>
    <p class="sub">Cadastre pacientes e acompanhe o IMC e a classificação de cada um.</p>

    <div class="grid">
      <section class="panel" aria-labelledby="t-form">
        <h2 id="t-form">Novo paciente</h2>
        <form id="form-pessoa" novalidate>
          <label for="nome">Nome</label>
          <input id="nome" type="text" autocomplete="off">

          <label for="idade">Idade (anos)</label>
          <input id="idade" type="number" step="1">

          <label for="altura">Altura (m) — ex.: 1.70</label>
          <input id="altura" type="number" step="0.01">

          <label for="peso">Peso (kg) — ex.: 65.5</label>
          <input id="peso" type="number" step="0.1">

          <button type="submit">Salvar paciente</button>
        </form>
        <p id="erro" class="msg erro" role="alert" hidden></p>
      </section>

      <section class="panel" aria-labelledby="t-list">
        <h2 id="t-list">Pacientes cadastrados</h2>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th class="num">Idade</th>
                <th class="num">Altura</th>
                <th class="num">Peso</th>
                <th class="num">IMC</th>
                <th>Classificação</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela"></tbody>
          </table>
        </div>
        <div id="vazio" class="vazio">Nenhum paciente cadastrado. Preencha o formulário para começar.</div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
