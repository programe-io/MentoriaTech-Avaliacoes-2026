<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Estoque</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Controle de estoque</h1>
    <p class="sub">Cadastre produtos, consulte a lista e atualize valor e quantidade.</p>

    <div class="grid">
      <section class="panel" aria-labelledby="t-cad">
        <h2 id="t-cad">Cadastrar produto</h2>
        <div>
          <label for="descricao">Descrição (mín. 5 caracteres)</label>
          <input id="descricao" type="text" autocomplete="off">
          <label for="quantidade">Quantidade (mín. 1)</label>
          <input id="quantidade" type="number" step="1">
          <label for="valor">Valor (R$)</label>
          <input id="valor" type="number" step="0.01">
          <button id="btn-cadastrar" type="button">Cadastrar produto</button>
        </div>
        <div id="msg" class="msg" role="status" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="t-list">
        <h2 id="t-list">Produtos cadastrados</h2>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th class="num">Quantidade</th>
                <th class="num">Valor</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="lista"></tbody>
          </table>
        </div>
        <div id="vazio" class="vazio">Nenhum produto cadastrado. Preencha o formulário para começar.</div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
