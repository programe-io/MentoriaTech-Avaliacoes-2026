<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Gerenciador de tarefas</h1>
    <p class="sub">Cadastre tarefas, conclua o que já foi feito e ajuste as prioridades.</p>

    <div class="grid">
      <section class="panel" aria-labelledby="t-cad">
        <h2 id="t-cad">Nova tarefa</h2>
        <div>
          <label for="titulo">Título (mín. 5 caracteres)</label>
          <input id="titulo" type="text" autocomplete="off">
          <label for="prioridade">Prioridade (1 = mais alta, 3 = mais baixa)</label>
          <select id="prioridade">
            <option value="1">1 – Alta</option>
            <option value="2" selected>2 – Média</option>
            <option value="3">3 – Baixa</option>
          </select>
          <button id="btn-cadastrar" type="button">Cadastrar tarefa</button>
        </div>
        <div id="msg" class="msg" role="status" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="t-list">
        <h2 id="t-list">Tarefas cadastradas</h2>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Código</th>
                <th>Título</th>
                <th>Prioridade</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="lista"></tbody>
          </table>
        </div>
        <div id="vazio" class="vazio">Nenhuma tarefa cadastrada. Preencha o formulário para começar.</div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
