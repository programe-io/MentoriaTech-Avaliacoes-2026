<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Calculadora de IMC</h1>

    <section class="card">
      <h2>Nova pessoa</h2>
      <form id="form-imc" class="form-grid">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Ex: Francisco" required>
        </div>

        <div class="campo">
          <label for="idade">Idade (anos)</label>
          <input type="number" id="idade" min="1" max="130" placeholder="30" required>
        </div>

        <div class="campo">
          <label for="altura">Altura (m)</label>
          <input type="number" id="altura" step="0.01" min="0.5" max="2.5" placeholder="1.75" required>
        </div>

        <div class="campo">
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" step="0.1" min="1" max="500" placeholder="70.5" required>
        </div>

        <div class="acoes">
          <button type="submit" class="btn-salvar">Salvar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Pessoas cadastradas</h2>
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Idade</th>
              <th>Altura</th>
              <th>Peso</th>
              <th>IMC</th>
              <th>Classificação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-pessoas">
            <!-- Linhas inseridas via JavaScript -->
          </tbody>
        </table>
      </div>
      <p id="mensagem-vazia" class="vazio">Nenhuma pessoa cadastrada ainda.</p>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
