<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Shoes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #00ff88;
        }

        header button {
            background: #00ff88;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .banner {
            text-align: center;
            padding: 70px 20px;
            background: linear-gradient(135deg, #111, #333);
            color: white;
        }

        .banner h2 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .banner p {
            font-size: 20px;
            color: #ccc;
        }

        .produtos {
            padding: 50px 8%;
        }

        .produtos h2 {
            text-align: center;
            margin-bottom: 35px;
            font-size: 30px;
        }

        .lista {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .produto {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .produto:hover {
            transform: translateY(-8px);
        }

        .tenis {
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            margin-bottom: 15px;
        }

        .produto h3 {
            margin-bottom: 10px;
        }

        .preco {
            color: #16a34a;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .produto button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .produto button:hover {
            background: #00b863;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 30px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Urban Shoes</h1>
        <button onclick="mostrarCarrinho()">
            🛒 Carrinho (<span id="quantidade">0</span>)
        </button>
    </header>

    <section class="banner">
        <h2>Seu estilo começa aqui.</h2>
        <p>Os melhores tênis para deixar seu visual ainda mais brabo.</p>
    </section>

    <section class="produtos">

        <h2>🔥 Produtos em destaque</h2>

        <div class="lista">

            <div class="produto">
                <div class="tenis">👟</div>
                <h3>Street Black</h3>
                <div class="preco">R$ 199,90</div>
                <button onclick="adicionar()">Adicionar ao carrinho</button>
            </div>

            <div class="produto">
                <div class="tenis">👟</div>
                <h3>Runner Pro</h3>
                <div class="preco">R$ 249,90</div>
                <button onclick="adicionar()">Adicionar ao carrinho</button>
            </div>

            <div class="produto">
                <div class="tenis">👟</div>
                <h3>Urban White</h3>
                <div class="preco">R$ 179,90</div>
                <button onclick="adicionar()">Adicionar ao carrinho</button>
            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 Urban Shoes - Todos os direitos reservados.</p>
    </footer>

    <script>
        let quantidade = 0;

        function adicionar() {
            quantidade++;

            document.getElementById("quantidade").innerText = quantidade;

            alert("👟 Produto adicionado ao carrinho!");
        }

        function mostrarCarrinho() {
            alert("🛒 Você tem " + quantidade + " produto(s) no carrinho.");
        }
    </script>

<script src="script.js"></script></body>
</html>
