
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicFeed - Seu mundo musical</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🎵 MusicFeed</h1>
        <input type="text" id="pesquisa" placeholder="Pesquisar músicas ou artistas...">
        <nav>
            <a href="#">Início</a>
            <a href="#categorias">Gêneros</a>
            <a href="#publicar">Publicar</a>
        </nav>
    </header>

    <main>
        <section class="boas-vindas">
            <h2>Seu universo musical começa aqui!</h2>
            <p>Compartilhe músicas, descubra artistas e conecte-se através da música.</p>
        </section>

        <section id="categorias" class="categorias">
            <h2>Explore os gêneros</h2>
            <div class="botoes-categorias">
                <button onclick="filtrarGenero('Todos')">Todos</button>
                <button onclick="filtrarGenero('Pop')">Pop</button>
                <button onclick="filtrarGenero('Rock')">Rock</button>
                <button onclick="filtrarGenero('Rap')">Rap</button>
                <button onclick="filtrarGenero('MPB')">MPB</button>
                <button onclick="filtrarGenero('Sertanejo')">Sertanejo</button>
            </div>
        </section>

        <section id="publicar" class="publicar">
            <h2>Compartilhe sua música 🎧</h2>

            <input type="text" id="artista" placeholder="Nome do artista">
            <input type="text" id="musica" placeholder="Nome da música">
            <input type="text" id="genero" placeholder="Gênero musical">
            <textarea id="descricao" placeholder="O que você está ouvindo?"></textarea>
            <input type="url" id="imagem" placeholder="URL da imagem (opcional)">

            <button onclick="criarPost()">Publicar</button>
        </section>

        <section class="feed">
            <h2>Feed musical 🎶</h2>
            <div id="lista-posts"></div>
        </section>
    </main>

    <footer>
        <p>🎵 MusicFeed © 2026 - Compartilhando a paixão pela música.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
