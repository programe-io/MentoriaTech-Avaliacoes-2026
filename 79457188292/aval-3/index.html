
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Instagram</h1>
        <input type="text" placeholder="Pesquisar">
    </header>

    <main>
        <section class="stories">
            <div class="story"> <img src="https://i.pravatar.cc/100?img=1"> <p>Maria</p></div>
            <div class="story"> <img src="https://i.pravatar.cc/100?img=2"> <p>João</p></div>
            <div class="story"> <img src="https://i.pravatar.cc/100?img=3"> <p>Ana</p></div>
            <div class="story"> <img src="https://i.pravatar.cc/100?img=4"> <p>Pedro</p></div>
        </section>

        <section class="feed">
            <article class="post">
                <div class="post-header">
                    <img src="https://i.pravatar.cc/100?img=5">
                    <strong>usuario_instagram</strong>
                </div>

                <img class="post-image"
                src="https://picsum.photos/600/500">

                <div class="actions">
                    <button onclick="curtir(this)">♡</button>
                    <button onclick="comentar()">💬</button>
                    <button>➤</button>
                </div>

                <p class="likes">0 curtidas</p>
                <p><strong>usuario_instagram</strong> Meu primeiro post!</p>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
