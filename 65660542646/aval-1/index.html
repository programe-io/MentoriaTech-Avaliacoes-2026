
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Controle de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <h1>Sistema de Controle de Estoque</h1>
        <p>Cadastre e gerencie seus produtos com facilidade</p>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <!-- FORMULÁRIO DE CADASTRO -->
        <section class="formulario">

            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div>
                    <label for="descricao">Descrição do produto:</label>
                    <input
                        type="text"
                        id="descricao"
                        name="descricao"
                        placeholder="Ex: Cadeira Gamer"
                        required
                        minlength="5"
                    >
                </div>

                <div>
                    <label for="quantidade">Quantidade:</label>
                    <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        placeholder="Ex: 10"
                        min="1"
                        required
                    >
                </div>

                <div>
                    <label for="valor">Valor (R$):</label>
                    <input
                        type="number"
                        id="valor"
                        name="valor"
                        placeholder="Ex: 699.00"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit">
                    Cadastrar Produto
                </button>

            </form>

        </section>

        <!-- LISTAGEM DE PRODUTOS -->
        <section class="estoque">

            <h2>Produtos em Estoque</h2>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor (R$)</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaProdutos">
                        <!-- Os produtos serão inseridos pelo JavaScript -->
                    </tbody>

                </table>

            </div>

            <p id="mensagem">
                Nenhum produto cadastrado.
            </p>

        </section>

    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>Sistema de Controle de Estoque - 2026</p>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
