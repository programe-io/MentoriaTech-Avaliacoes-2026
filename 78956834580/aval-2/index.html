<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>SPFC News</title>

                <link rel="stylesheet" href="style.css">
                </head>

                <body>

                    <!-- CABEÇALHO -->

                        <header>

                                <div class="logo">
                                            <strong>SPFC</strong>
                                                        <span>NEWS</span>
                                                                </div>

                                                                        <nav>
                                                                                    <a href="#">Início</a>
                                                                                                <a href="#feed">Notícias</a>
                                                                                                            <a href="#sobre">Sobre</a>
                                                                                                                    </nav>

                                                                                                                        </header>


                                                                                                                            <!-- DESTAQUE -->

                                                                                                                                <section class="destaque">

                                                                                                                                        <div class="destaque-conteudo">

                                                                                                                                                    <span>🔴⚪⚫ DESTAQUE</span>

                                                                                                                                                                <h1>
                                                                                                                                                                                Tudo sobre o São Paulo Futebol Clube
                                                                                                                                                                                            </h1>

                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                        Acompanhe notícias, jogos, jogadores e tudo que
                                                                                                                                                                                                                                        acontece no mundo do Tricolor Paulista.
                                                                                                                                                                                                                                                    </p>

                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                </section>


                                                                                                                                                                                                                                                                    <!-- BARRA DE PESQUISA -->

                                                                                                                                                                                                                                                                        <section class="pesquisa">

                                                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                                                            type="text"
                                                                                                                                                                                                                                                                                                        id="campoPesquisa"
                                                                                                                                                                                                                                                                                                                    placeholder="Pesquisar notícia..."
                                                                                                                                                                                                                                                                                                                                onkeyup="pesquisar()"
                                                                                                                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                                                                                                                            </section>


                                                                                                                                                                                                                                                                                                                                                <!-- FEED -->

                                                                                                                                                                                                                                                                                                                                                    <main id="feed">

                                                                                                                                                                                                                                                                                                                                                            <div class="titulo-feed">

                                                                                                                                                                                                                                                                                                                                                                        <h2>Últimas notícias</h2>

                                                                                                                                                                                                                                                                                                                                                                                    <div class="filtros">

                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="filtrar('todas')">
                                                                                                                                                                                                                                                                                                                                                                                                                        Todas
                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="filtrar('futebol')">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Futebol
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="filtrar('clube')">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Clube
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="filtrar('torcida')">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Torcida
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- NOTÍCIA 1 -->

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <article
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    class="post"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                data-categoria="futebol"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="imagem-post">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ⚽
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="post-conteudo">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span class="categoria">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Futebol
  <script src="script.js"></script>
  
</body>
</html>
