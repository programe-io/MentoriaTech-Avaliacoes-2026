<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>Gerenciador de Tarefas</h1>
            <p>Projeto de gestão de tarefas em JavaScript</p>
        </header>

        <main>
            <!-- Formulário: Cadastrar Tarefa -->
            <section class="card">
                <h2>Cadastrar Nova Tarefa</h2>
                <form id="form-cadastrar">
                    <div class="form-group">
                        <label for="titulo">Título da Tarefa (mínimo de 5 caracteres):</label>
                        <input type="text" id="titulo" placeholder="Ex.: Estudar JavaScript Avançado" required>
                    </div>
                    <div class="form-group">
                        <label for="prioridade">Prioridade (1 - Alta, 2 - Média, 3 - Baixa):</label>
                        <select id="prioridade" required>
                            <option value="1">1 - Alta</option>
                            <option value="2">2 - Média</option>
                            <option value="3">3 - Baixa</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Cadastrar Tarefa</button>
                </form>
            </section>

            <!-- Painel de Gestão de Operações -->
            <section class="card">
                <h2>Operações de Gestão</h2>
                <div class="actions-grid">
                    <div class="action-box">
                        <h3>Concluir Tarefa</h3>
                        <div class="inline-form">
                            <input type="number" id="codigo-concluir" placeholder="Código">
                            <button id="btn-concluir" class="btn btn-success">Concluir</button>
                        </div>
                    </div>

                    <div class="action-box">
                        <h3>Alterar Prioridade</h3>
                        <div class="inline-form">
                            <input type="number" id="codigo-prioridade" placeholder="Código">
                            <select id="nova-prioridade">
                                <option value="1">1 - Alta</option>
                                <option value="2">2 - Média</option>
                                <option value="3">3 - Baixa</option>
                            </select>
                            <button id="btn-alterar-prioridade" class="btn btn-warning">Alterar</button>
                        </div>
                    </div>

                    <div class="action-box">
                        <h3>Buscar Tarefa por Código</h3>
                        <div class="inline-form">
                            <input type="number" id="codigo-buscar" placeholder="Código">
                            <button id="btn-buscar" class="btn btn-info">Buscar</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Notificações e Mensagens de Erro/Sucesso -->
            <div id="mensagem-status" class="alert hidden"></div>

            <!-- Tabela com a Lista de Tarefas -->
            <section class="card">
                <div class="section-header">
                    <h2>Lista de Tarefas Cadastradas</h2>
                    <button id="btn-atualizar" class="btn btn-secondary">Atualizar Lista</button>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Título</th>
                                <th>Prioridade</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-tarefas">
                            <!-- Preenchido via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
