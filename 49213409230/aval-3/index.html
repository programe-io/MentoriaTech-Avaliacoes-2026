
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  background: #fafafa;
  font-family: Arial, sans-serif;
}
header {
  background: white;
  padding: 15px;
  border-bottom: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
}
.logo {
  font-size: 27px;
  font-weight: bold;
  font-family: cursive;
}
header input {
  padding: 9px;
  border: 1px solid #ddd;
  border-radius: 8px;
}
.container {
  max-width: 600px;
  margin: 20px auto;
}
.stories {
  display: flex;
  gap: 18px;
  background: white;
  padding: 15px;
  overflow-x: auto;
  border: 1px solid #ddd;
  border-radius: 8px;
}
.story {
  text-align: center;
  font-size: 12px;
}
.story img {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  border: 3px solid #e1306c;
  padding: 2px;
  object-fit: cover;
}
.post {
  background: white;
  margin-top: 20px;
  border: 1px solid #ddd;
  border-radius: 8px;
}
.user {
  padding: 15px;
  font-weight: bold;
}
.post img {
  width: 100%;
  display: block;
}
.actions {
  padding: 12px;
  font-size: 25px;
}
.actions span {
  cursor: pointer;
  margin-right: 12px;
}
.caption {
  padding: 0 12px 15px;
}
button {
  border: none;
  background: none;
  cursor: pointer;
  font-size: 24px;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
  <div class="logo">Instagram</div>
  <input type="text" placeholder="Pesquisar">
  <span>🏠 ❤️ 👤</span>
</header>

<div class="container">

  <div class="stories">
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=1">
      <p>Seu story</p>
    </div>
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=2">
      <p>Maria</p>
    </div>
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=3">
      <p>João</p>
    </div>
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=4">
      <p>Ana</p>
    </div>
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=5">
      <p>Pedro</p>
    </div>
  </div>

  <div class="post">
    <div class="user">👤 @meuperfil</div>
    <img src="https://picsum.photos/600/450" alt="Publicação">
    <div class="actions">
      <button onclick="curtir(this)">🤍</button>
      <span>💬</span>
      <span>➤</span>
    </div>
    <div class="caption">
      <b>1.250 curtidas</b>
      <p><b>@meuperfil</b> Aproveitando o dia! 😍☀️</p>
    </div>
  </div>

  <div class="post">
    <div class="user">👤 @fotografia</div>
    <img src="https://picsum.photos/600/451" alt="Paisagem">
    <div class="actions">
      <button onclick="curtir(this)">🤍</button>
      <span>💬</span>
      <span>➤</span>
    </div>
    <div class="caption">
      <b>850 curtidas</b>
      <p><b>@fotografia</b> Que lugar incrível! 🌴</p>
    </div>
  </div>

</div>

<script>
function curtir(botao) {
  if (botao.innerHTML === "🤍") {
    botao.innerHTML = "❤️";
  } else {
    botao.innerHTML = "🤍";
  }
}
</script>

<script src="script.js"></script></body>
</html>
