<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conexão · Rede social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <h1>Conexão</h1>
    <input id="busca" type="search" placeholder="Buscar publicações ou #assuntos" aria-label="Buscar publicações">
  </header>

  <div class="layout">
    <aside class="lateral" aria-label="Seu perfil">
      <div class="cartao perfil">
        <span class="avatar grande" id="perfil-avatar"></span>
        <strong id="perfil-nome"></strong>
        <span class="mudo" id="perfil-handle"></span>
        <dl>
          <div><dt>Publicações</dt><dd id="est-posts">0</dd></div>
          <div><dt>Seguindo</dt><dd id="est-seguindo">0</dd></div>
        </dl>
      </div>
    </aside>

    <main>
      <form id="form-post" class="cartao" novalidate>
        <label for="texto" class="mudo">O que você quer compartilhar?</label>
        <textarea id="texto" rows="3" maxlength="280" placeholder="Escreva algo. Use #assuntos para organizar."></textarea>
        <div class="linha">
          <span id="contador" class="mudo" aria-live="polite">280</span>
          <button type="submit">Publicar</button>
        </div>
      </form>

      <div class="abas" role="tablist" aria-label="Tipo de feed">
        <button role="tab" id="aba-todos" aria-selected="true" data-aba="todos">Para você</button>
        <button role="tab" id="aba-seguindo" aria-selected="false" data-aba="seguindo">Seguindo</button>
        <button type="button" id="limpar-filtro" class="fantasma" hidden></button>
      </div>

      <section id="feed" aria-live="polite"></section>
      <p id="vazio" class="mudo" hidden></p>
    </main>

    <aside class="lateral" aria-label="Sugestões">
      <div class="cartao">
        <h2>Quem seguir</h2>
        <ul id="sugestoes" class="lista"></ul>
      </div>
      <div class="cartao">
        <h2>Assuntos do momento</h2>
        <ul id="assuntos" class="lista"></ul>
      </div>
    </aside>
  </div>

  <script src="js/app.js"></script>
<script src="script.js"></script></body>
</html>
