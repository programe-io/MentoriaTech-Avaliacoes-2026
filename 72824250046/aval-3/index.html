<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quadro de tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <div>
      <h1>Quadro de tarefas</h1>
      <p id="resumo" class="mudo" aria-live="polite"></p>
    </div>
    <div class="progresso" aria-label="Progresso geral">
      <div class="trilha"><div id="barra" class="barra"></div></div>
      <span id="pct" class="mudo">0% concluído</span>
    </div>
  </header>

  <form id="form-tarefa" class="nova" novalidate>
    <label class="grande">Nova tarefa
      <input id="titulo" maxlength="80" placeholder="Ex.: Enviar relatório" required>
    </label>
    <label>Prioridade
      <select id="prioridade">
        <option value="baixa">Baixa</option>
        <option value="media" selected>Média</option>
        <option value="alta">Alta</option>
      </select>
    </label>
    <label>Prazo
      <input id="prazo" type="date">
    </label>
    <button type="submit">Adicionar tarefa</button>
    <p id="erro" class="erro" role="alert"></p>
  </form>

  <div class="filtros">
    <label>Mostrar
      <select id="filtro">
        <option value="todas">Todas as prioridades</option>
        <option value="alta">Só alta</option>
        <option value="media">Só média</option>
        <option value="baixa">Só baixa</option>
      </select>
    </label>
    <button type="button" id="limpar" class="fantasma">Limpar concluídas</button>
  </div>

  <main class="quadro">
    <section class="coluna" data-coluna="fazer" aria-labelledby="t-fazer">
      <h2 id="t-fazer">A fazer <span class="cont" id="c-fazer">0</span></h2>
      <ul class="lista" id="l-fazer"></ul>
    </section>
    <section class="coluna" data-coluna="andamento" aria-labelledby="t-andamento">
      <h2 id="t-andamento">Em andamento <span class="cont" id="c-andamento">0</span></h2>
      <ul class="lista" id="l-andamento"></ul>
    </section>
    <section class="coluna" data-coluna="feito" aria-labelledby="t-feito">
      <h2 id="t-feito">Concluído <span class="cont" id="c-feito">0</span></h2>
      <ul class="lista" id="l-feito"></ul>
    </section>
  </main>

  <script src="js/app.js"></script>
<script src="script.js"></script></body>
</html>
