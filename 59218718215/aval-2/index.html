  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Gerenciador de Tarefas</h1>
        <p class="subtitulo">Cadastre e organize suas tarefas</p>

        <div class="formulario">

            <label for="titulo">Título da tarefa</label>
            <input
                type="text"
                id="titulo"
                placeholder="Digite o título da tarefa"
            >

            <label for="prioridade">Prioridade</label>
            <select id="prioridade">
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button onclick="cadastrarTarefa()">
                Cadastrar tarefa
            </button>

        </div>

        <h2>Lista de tarefas</h2>

        <div id="listaTarefas"></div>

    </div>

    <script>
        let tarefas = [];

        function cadastrarTarefa() {

            const titulo = document.getElementById("titulo").value;
            const prioridade = document.getElementById("prioridade").value;

            if (titulo.trim() === "") {
                alert("Digite o título da tarefa.");
                return;
            }

            let tarefa = {
                codigo: tarefas.length + 1,
                titulo: titulo,
                prioridade: prioridade,
                status: true
            };

            tarefas.push(tarefa);

            document.getElementById("titulo").value = "";

            listarTarefas();
        }

        function buscarTarefa(codigo) {
            return tarefas.find(tarefa => tarefa.codigo === codigo);
        }

        function concluirTarefa(codigo) {

            let tarefa = buscarTarefa(codigo);

            if (tarefa) {
                tarefa.status = false;
                listarTarefas();
            }
        }

        function listarTarefas() {

            const lista = document.getElementById("listaTarefas");

            lista.innerHTML = "";

            if (tarefas.length === 0) {
                lista.innerHTML =
                    '<p class="vazio">Nenhuma tarefa cadastrada.</p>';
                return;
            }

            tarefas.forEach(tarefa => {

                const div = document.createElement("div");

                div.className =
                    tarefa.status ? "tarefa" : "tarefa concluida";

                let prioridadeTexto;

                if (tarefa.prioridade == 1) {
                    prioridadeTexto = "Alta";
                } else if (tarefa.prioridade == 2) {
                    prioridadeTexto = "Média";
                } else {
                    prioridadeTexto = "Baixa";
                }

                div.innerHTML = `
                    <div>
                        <h3>${tarefa.titulo}</h3>

                        <p>
                            Código: ${tarefa.codigo}
                        </p>

                        <p>
                            Prioridade: ${prioridadeTexto}
                        </p>

                        <p>
                            Status:
                            ${tarefa.status ? "Pendente" : "Concluída"}
                        </p>
                    </div>

                    ${
                        tarefa.status
                        ? `<button
                            class="concluir"
                            onclick="concluirTarefa
  
  
</body>
</html>
