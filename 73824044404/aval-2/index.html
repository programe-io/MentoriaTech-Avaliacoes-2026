<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gerenciador de Tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa+One&display=swap" rel="stylesheet">
  <script>
    try {
      var salvo = localStorage.getItem("tema");
      if (salvo === "light" || salvo === "dark") document.documentElement.dataset.theme = salvo;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="layout">
    <aside class="painel">
      <button id="alternar-tema" class="tema" type="button" aria-label="Mudar para o tema escuro" title="Mudar para o tema escuro">
        <svg class="icone icone-lua" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" fill="currentColor"/>
        </svg>
        <svg class="icone icone-sol" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>
          </g>
        </svg>
      </button>
      <h1>Gerenciador de Tarefas</h1>
      <p class="intro">Cadastre tarefas, acompanhe o que falta e conclua o que já foi feito.</p>

      <div id="form-tarefa" class="form">
        <label for="titulo">Título da tarefa</label>
        <input id="titulo" type="text" placeholder="Ex.: Estudar arrays" autocomplete="off">
        <span class="dica">Mínimo de 5 caracteres</span>

        <label for="prioridade">Prioridade</label>
        <select id="prioridade">
          <option value="1">1 – Alta</option>
          <option value="2" selected>2 – Média</option>
          <option value="3">3 – Baixa</option>
        </select>

        <button id="cadastrar" type="button">Cadastrar tarefa</button>
      </div>

      <p id="mensagem" class="mensagem" role="alert" aria-live="polite"></p>
    </aside>

    <main class="conteudo">
      <header class="topo">
        <h2>Tarefas cadastradas</h2>
        <p id="contador" class="contador"></p>
      </header>

      <ul id="lista" class="lista"></ul>
      <p id="vazio" class="vazio">Nenhuma tarefa ainda. Preencha o formulário para cadastrar a primeira.</p>
    </main>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
