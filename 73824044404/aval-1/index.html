<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header>
  <h1>Sistema de Estoque</h1>
  <div class="resumo">
    <span><span class="label">Itens:</span> <span id="contador">0</span></span>
    <span><span class="label">Total em estoque:</span> <span id="valorTotal">R$ 0,00</span></span>
  </div>
</header>

  <div class="grid">
    <div class="card">
      <h2>Cadastrar produto</h2>
      <label>Descrição</label>
      <input type="text" id="inDescricao" placeholder="ex: Cadeira gamer">
      <label>Quantidade</label>
      <input type="number" id="inQuantidade" placeholder="ex: 12">
      <label>Valor (R$)</label>
      <input type="number" id="inValor" placeholder="ex: 699">
      <button onclick="onCadastrar()">Cadastrar</button>
      <div class="msg" id="msgCadastro"></div>
    </div>

    <div class="card">
      <h2>Atualizar produto</h2>
      <label>Código do produto</label>
      <input type="number" id="upCodigo" placeholder="ex: 1">
      <label>Novo valor (opcional)</label>
      <input type="number" id="upValor" placeholder="ex: 750">
      <label>Quantidade a somar (opcional)</label>
      <input type="number" id="upQuantidade" placeholder="ex: 5">
      <button onclick="onAtualizar()">Atualizar</button>
      <div class="msg" id="msgAtualizar"></div>
    </div>
  </div>

  <div class="card">
    <h2>Produtos cadastrados</h2>
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Descrição</th>
          <th>Quantidade</th>
          <th>Valor</th>
        </tr>
      </thead>
      <tbody id="tabelaProdutos"></tbody>
    </table>
    <div class="empty" id="vazio">Nenhum produto cadastrado ainda.</div>
  </div>
</div>
  <script src="script.js"></script>
  
</body>
</html>
