<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerenciador de Tarefas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topo">
  <div class="topo-interno">
    <div>
      <h1>Gerenciador de Tarefas</h1>
      <p>Cadastre, acompanhe e conclua o que precisa ser feito.</p>
    </div>
    <div class="contadores" aria-live="polite">
      <div class="contador"><strong id="qtdAndamento">0</strong><span>em andamento</span></div>
      <div class="contador fim"><strong id="qtdConcluidas">0</strong><span>concluídas</span></div>
    </div>
  </div>
</header>

<main>
  <section class="painel" aria-labelledby="tituloForm">
    <h2 id="tituloForm">Nova tarefa</h2>
    <div id="aviso" class="aviso" role="alert" hidden></div>
    <div>
      <label for="campoTitulo">Título</label>
      <input id="campoTitulo" type="text" autocomplete="off" placeholder="Ex.: Estudar arrays">
      <p class="dica">Mínimo de 5 caracteres.</p>

      <label for="campoPrioridade">Prioridade</label>
      <select id="campoPrioridade">
        <option value="1">1 – Alta</option>
        <option value="2" selected>2 – Média</option>
        <option value="3">3 – Baixa</option>
      </select>

      <button type="button" id="btnCadastrar" class="btn-principal">Cadastrar tarefa</button>
    </div>
  </section>

  <section aria-labelledby="tituloLista">
    <h2 id="tituloLista" style="margin-bottom:12px">Tarefas</h2>
    <p class="legenda">
      <span><i style="background:var(--laranja)"></i>Prioridade 1</span>
      <span><i style="background:var(--amarelo)"></i>Prioridade 2</span>
      <span><i style="background:var(--azul)"></i>Prioridade 3</span>
    </p>
    <ul id="lista" class="lista"></ul>
  </section>
</main>

  <script src="script.js" defer></script>
<script src="script.js"></script></body>
</html>
