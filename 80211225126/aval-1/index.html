<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terêncio (Wunggy do Tobby - D.P.A.)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle, #2b3a67 0%, #161d33 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            color: #a8e6cf;
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        p {
            margin-bottom: 30px;
            font-size: 14px;
            color: #dcedc1;
        }

        /* Contentor principal do bichinho */
        .cenario {
            position: relative;
            width: 300px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Animação de respiração/flutuação */
        .terencio {
            position: relative;
            width: 210px;
            height: 220px;
            animation: respirar 2.5s infinite ease-in-out;
            transition: transform 0.2s;
        }

        .terencio:active {
            transform: scale(0.95);
        }

        /* Corpo peludo verde */
        .corpo {
            position: absolute;
            bottom: 20px;
            width: 210px;
            height: 185px;
            background: radial-gradient(circle at 35% 30%, #7ed957, #388e3c);
            border-radius: 50% 50% 45% 45% / 55% 55% 40% 40%;
            box-shadow: 
                inset -10px -15px 25px rgba(0, 40, 0, 0.4),
                0 15px 25px rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        /* Tufos de pelo no topo da cabeça */
        .pelo-topo {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 35px;
            background: #5cb85c;
            border-radius: 50% 50% 0 0;
            z-index: 1;
        }
        .pelo-topo::before, .pelo-topo::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 30px;
            background: #4cae4c;
            border-radius: 50% 50% 0 0;
            top: 5px;
        }
        .pelo-topo::before { left: -18px; transform: rotate(-25deg); }
        .pelo-topo::after { right: -18px; transform: rotate(25deg); }

        /* Orelhinhas */
        .orelha {
            position: absolute;
            top: 45px;
            width: 45px;
            height: 55px;
            background: #43a047;
            border-radius: 50% 50% 20% 20%;
            z-index: 1;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        .orelha.esq { left: 5px; transform: rotate(-35deg); }
        .orelha.dir { right: 5px; transform: rotate(35deg); }

        /* Olhões grandes característicos do Wunggy */
        .olhos {
            position: absolute;
            top: 32px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 4;
        }

        .olho {
            width: 68px;
            height: 74px;
            background: #ffffff;
            border-radius: 50%;
            border: 4px solid #2e7d32;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.15);
        }

        .pupila {
            position: absolute;
            width: 34px;
            height: 34px;
            background: #1a1a1a;
            border-radius: 50%;
            top: 20px;
            left: 15px;
            transition: transform 0.1s ease-out;
        }

        /* Brilho nos olhos */
        .pupila::after {
            content: '';
            position: absolute;
            width: 11px;
            height: 11px;
            background: white;
            border-radius: 50%;
            top: 5px;
            left: 6px;
        }

        /* Narizinho */
        .nariz {
            position: absolute;
            top: 102px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 14px;
            background: #1b5e20;
            border-radius: 50%;
            z-index: 4;
        }

        /* Boca grande e simpática */
        .boca {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 45px;
            background: #4a0e17;
            border-radius: 15px 15px 50px 50px;
            border: 3px solid #2e7d32;
            overflow: hidden;
            z-index: 3;
        }

        /* Língua */
        .lingua {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 25px;
            background: #ff6b81;
            border-radius: 50%;
        }

        /* Dentinhos */
        .dente {
            position: absolute;
            top: 0;
            width: 14px;
            height: 12px;
            background: #fffdf0;
            border-radius: 0 0 5px 5px;
        }
        .dente.esq { left: 22px; }
        .dente.dir { right: 22px; }

        /* A famosa baba de gosma verde! */
        .baba {
            position: absolute;
            top: 158px;
            right: 58px;
            width: 14px;
            height: 25px;
            background: #aeea00;
            border-radius: 0 0 10px 10px;
            z-index: 5;
            opacity: 0.9;
            box-shadow: 0 0 8px #aeea00;
            animation: babar 3s infinite ease-in-out;
        }

        /* Patinhas */
        .pata {
            position: absolute;
            bottom: 8px;
            width: 50px;
            height: 28px;
            background: #2e7d32;
            border-radius: 25px 25px 10px 10px;
            z-index: 1;
        }
        .pata.esq { left: 35px; }
        .pata.dir { right: 35px; }

        /* Botão de interação (Brócolis) */
        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: #43a047;
            transform: scale(1.05);
        }

        /* Animações */
        @keyframes respirar {
            0%, 100% { transform: translateY(0) scale(1, 1); }
            50% { transform: translateY(-6px) scale(1.02, 0.98); }
        }

        @keyframes babar {
            0%, 100% { height: 15px; }
            50% { height: 42px; }
        }

        .pular {
            animation: saltoFeliz 0.5s ease;
        }

        @keyframes saltoFeliz {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-35px) scale(1.05); }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Terêncio (O Wunggy do Tobby)</h1>
    <p>Mexe o rato para ele seguir com os olhos ou dá-lhe o seu lanche favorito!</p>

    <div class="cenario" id="cenario">
        <div class="terencio" id="terencio">
            <div class="pelo-topo"></div>
            <div class="orelha esq"></div>
            <div class="orelha dir"></div>
            
            <div class="corpo">
                <div class="olhos">
                    <div class="olho"><div class="pupila"></div></div>
                    <div class="olho"><div class="pupila"></div></div>
                </div>
                
                <div class="nariz"></div>
                
                <div class="boca">
                    <div class="dente esq"></div>
                    <div class="dente dir"></div>
                    <div class="lingua"></div>
                </div>

                <!-- Gosma verde -->
                <div class="baba" id="baba"></div>
            </div>

            <div class="pata esq"></div>
            <div class="pata dir"></div>
        </div>
    </div>

    <button onclick="darBrocolis()">🥦 Dar Brócolis ao Terêncio</button>

    <script>
        const pupilas = document.querySelectorAll('.pupila');
        const terencio = document.getElementById('terencio');
        const baba = document.getElementById('baba');

        // Faz os olhos seguirem o cursor do rato
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 16 - 8;
            const y = (e.clientY / window.innerHeight) * 16 - 8;

            pupilas.forEach(pupila => {
                pupila.style.transform = `translate(${x}px, ${y}px)`;
            });
        });

        // Animação quando recebe brócolis (a comida favorita dele na série)
        function darBrocolis() {
            terencio.classList.remove('pular');
            void terencio.offsetWidth; // Reinicia a animação
            terencio.classList.add('pular');

            // Aumenta a baba verde de animação
            baba.style.height = '60px';
            setTimeout(() => {
                baba.style.height = '';
            }, 1000);
        }
    </script>
<script src="script.js"></script></body>
</html>
