<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coração em HTML e CSS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d13;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* O contentor do coração */
        .coracao {
            position: relative;
            width: 100px;
            height: 100px;
            background-color: #ff0055;
            transform: rotate(-45deg);
            box-shadow: 0 0 40px #ff0055;
            /* Chama a animação de pulsar */
            animation: pulsar 0.6s infinite alternate ease-in-out;
        }

        /* Cria a parte arredondada esquerda do coração */
        .coracao::before {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #ff0055;
            border-radius: 50%;
            top: -50px;
            left: 0;
        }

        /* Cria a parte arredondada direita do coração */
        .coracao::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #ff0055;
            border-radius: 50%;
            top: 0;
            left: 50px;
        }

        /* Animação que faz o coração encolher e esticar como se estivesse a bater */
        @keyframes pulsar {
            0% {
                transform: rotate(-45deg) scale(1);
            }
            100% {
                transform: rotate(-45deg) scale(1.25);
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Elemento HTML que representa o coração -->
    <div class="coracao"></div>

<script src="script.js"></script></body>
</html>
