
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Obstáculos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>🏃 Corrida Maluca</h1>

        <div class="pontuacao">
            Pontos: <span id="pontos">0</span>
        </div>

        <div id="jogo">
            <div id="personagem">🏃</div>
            <div id="obstaculo">🌵</div>
            <div id="chao"></div>

            <div id="mensagem">
                <h2>Pronto para jogar?</h2>
                <button onclick="iniciarJogo()">JOGAR</button>
            </div>
        </div>

        <p class="instrucoes">
            Pressione ESPAÇO ou toque na tela para pular!
        </p>

        <button id="pular" onclick="pular()">PULAR</button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
