<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>NexusPlay | Blog de Games</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <!-- Cabeçalho -->
            <header class="navbar">
                <div class="container nav-content">
                      <a href="#" class="logo">NEXUS<span>PLAY</span></a>
                            <nav>
                                    <ul class="nav-links">
                                              <li><button class="filter-btn active" data-category="todos">Todos</button></li>
                                                        <li><button class="filter-btn" data-category="reviews">Reviews</button></li>
                                                                  <li><button class="filter-btn" data-category="noticias">Notícias</button></li>
                                                                            <li><button class="filter-btn" data-category="guias">Guias</button></li>
                                                                                    </ul>
                                                                                          </nav>
                                                                                                <div class="search-box">
                                                                                                        <input type="text" id="searchInput" placeholder="Buscar artigos...">
                                                                                                              </div>
                                                                                                                  </div>
                                                                                                                    </header>

                                                                                                                      <!-- Banner Principal -->
                                                                                                                        <section class="hero">
                                                                                                                            <div class="container hero-content">
                                                                                                                                  <span class="badge">DESTAQUE DA SEMANA</span>
                                                                                                                                        <h1>O Futuro dos RPGs de Mundo Aberto na Nova Geração</h1>
                                                                                                                                              <p>Analisamos como a inteligência artificial e os novos motores gráficos estão mudando a imersão nos jogos modernos.</p>
                                                                                                                                                    <button class="btn-primary" onclick="openFeatured()">Ler Artigo Completo</button>
                                                                                                                                                        </div>
                                                                                                                                                          </section>

                                                                                                                                                            <!-- Lista de Posts -->
                                                                                                                                                              <main class="container main-section">
                                                                                                                                                                  <h2 class="section-title">Últimas Publicações</h2>
                                                                                                                                                                      <div id="postsGrid" class="posts-grid">
                                                                                                                                                                            <!-- Os cards serão inseridos via JavaScript -->
                                                                                                                                                                                </div>
                                                                                                                                                                                  </main>

                                                                                                                                                                                    <!-- Modal para leitura do artigo -->
                                                                                                                                                                                      <div id="articleModal" class="modal">
                                                                                                                                                                                          <div class="modal-content">
                                                                                                                                                                                                <span class="close-btn" id="closeModal">×</span>
                                                                                                                                                                                                      <span id="modalCategory" class="badge"></span>
                                                                                                                                                                                                            <h2 id="modalTitle"></h2>
                                                                                                                                                                                                                  <p class="modal-meta" id="modalMeta"></p>
                                                                                                                                                                                                                        <div id="modalBody" class="modal-body"></div>
                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                <!-- Rodapé -->
                                                                                                                                                                                                                                  <footer>
                                                                                                                                                                                                                                      <div class="container footer-content">
                                                                                                                                                                                                                                            <p>© 2026 NexusPlay Blog de Games. Todos os direitos reservados.</p>
                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                  </footer>

                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                    </html>
