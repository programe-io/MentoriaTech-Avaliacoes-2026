<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>MiniFeed</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <div class="app-container">
              <header class="feed-header">
                    <h1>MiniFeed</h1>
                        </header>

                            <!-- Formulário de nova postagem -->
                                <section class="composer">
                                      <textarea id="postInput" placeholder="O que está acontecendo?" maxlength="280"></textarea>
                                            <div class="composer-footer">
                                                    <span id="charCount">280</span>
                                                            <button id="publishBtn" disabled>Publicar</button>
                                                                  </div>
                                                                      </section>

                                                                          <!-- Lista de postagens -->
                                                                              <main id="feedList" class="feed-list">
                                                                                    <!-- Os posts serão inseridos via JavaScript -->
                                                                                        </main>
                                                                                          </div>

                                                                                            <script src="script.js"></script>
                                                                                            <script src="script.js"></script></body>
                                                                                            </html>
