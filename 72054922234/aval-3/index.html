<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>InstaClone</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <!-- Barra Superior -->
            <header class="navbar">
                <div class="nav-container">
                      <h1 class="brand">InstaClone</h1>
                            <button id="openModalBtn" class="new-post-btn">+ Nova Foto</button>
                                </div>
                                  </header>

                                    <main class="main-container">
                                        <!-- Barra de Stories -->
                                            <section class="stories-bar" id="storiesBar">
                                                  <!-- Stories gerados via JavaScript -->
                                                      </section>

                                                          <!-- Feed de Publicações -->
                                                              <section class="feed" id="feed">
                                                                    <!-- Posts gerados via JavaScript -->
                                                                        </section>
                                                                          </main>

                                                                            <!-- Modal para Nova Publicação -->
                                                                              <div id="postModal" class="modal">
                                                                                  <div class="modal-content">
                                                                                        <div class="modal-header">
                                                                                                <h3>Criar nova publicação</h3>
                                                                                                        <span id="closeModalBtn" class="close-btn">×</span>
                                                                                                              </div>
                                                                                                                    <form id="newPostForm">
                                                                                                                            <label for="imageUrl">URL da Imagem:</label>
                                                                                                                                    <input type="url" id="imageUrl" placeholder="https://exemplo.com/foto.jpg" required>
                                                                                                                                            
                                                                                                                                                    <label for="captionInput">Legenda:</label>
                                                                                                                                                            <textarea id="captionInput" rows="3" placeholder="Escreva uma legenda..." required></textarea>
                                                                                                                                                                    
                                                                                                                                                                            <button type="submit" class="submit-btn">Compartilhar</button>
                                                                                                                                                                                  </form>
                                                                                                                                                                                      </div>
                                                                                                                                                                                        </div>

                                                                                                                                                                                          <script src="script.js"></script>
                                                                                                                                                                                          <script src="script.js"></script></body>
                                                                                                                                                                                          </html>
