<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
</head>
<body>

    <h1>Sistema de Estoque</h1>

    <h2>Cadastrar novo produto</h2>

    <label>Código:</label>
    <input type="text" id="codigo">
    <br><br>

    <label>Descrição:</label>
    <input type="text" id="descricao">
    <br><br>

    <label>Quantidade:</label>
    <input type="number" id="quantidade">
    <br><br>

    <label>Valor:</label>
    <input type="number" id="valor" step="0.01">
    <br><br>

    <button onclick="cadastrarProduto()">
        Cadastrar produto
    </button>

    <hr>

    <h2>Produtos cadastrados</h2>

    <button onclick="listarProdutos()">
        Listar produtos
    </button>

    <div id="lista"></div>

    <hr>

    <h2>Alterar valor de um produto</h2>

    <label>Código do produto:</label>
    <input type="text" id="codigoValor">
    <br><br>

    <label>Novo valor:</label>
    <input type="number" id="novoValor" step="0.01">
    <br><br>

    <button onclick="alterarValor()">
        Alterar valor
    </button>

    <hr>

    <h2>Alterar quantidade de um produto</h2>

    <label>Código do produto:</label>
    <input type="text" id="codigoQuantidade">
    <br><br>

    <label>Nova quantidade:</label>
    <input type="number" id="novaQuantidade">
    <br><br>

    <button onclick="alterarQuantidade()">
        Alterar quantidade
    </button>

    <p id="mensagem"></p>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
