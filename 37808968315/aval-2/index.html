
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Tarefas</title>
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Gerenciamento de Tarefas</h1>

    <h2>Cadastrar nova tarefa</h2>

    <label>Código:</label>
    <input type="number" id="codigo">
    <br><br>

    <label>Título:</label>
    <input type="text" id="titulo">
    <br><br>

    <label>Prioridade:</label>
    <select id="prioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>
    <br><br>

    <label>Status:</label>
    <select id="status">
        <option value="Pendente">Pendente</option>
        <option value="Concluída">Concluída</option>
    </select>
    <br><br>

    <button onclick="cadastrarTarefa()">
        Cadastrar tarefa
    </button>

    <hr>

    <h2>Listar tarefas cadastradas</h2>

    <button onclick="listarTarefas()">
        Listar tarefas
    </button>

    <div id="lista"></div>

    <hr>

    <h2>Marcar tarefa como concluída</h2>

    <label>Código da tarefa:</label>
    <input type="number" id="codigoConcluir">
    <br><br>

    <button onclick="concluirTarefa()">
        Marcar como concluída
    </button>

    <hr>

    <h2>Alterar prioridade de uma tarefa</h2>

    <label>Código da tarefa:</label>
    <input type="number" id="codigoPrioridade">
    <br><br>

    <label>Nova prioridade:</label>
    <select id="novaPrioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>
    <br><br>

    <button onclick="alterarPrioridade()">
        Alterar prioridade
    </button>

    <p id="mensagem"></p>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
