<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Area de Entrega - Avaliações</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
      <body>
        <header class="cabecalho">
            <h1>Area de Entrega - Avaliações</h1>
                <p>Aqui você envia seus códigos para correção. Revise antes de publicar e garanta que sua avaliação esteja completa.<br>
                    Finalize seu trabalho, publique seu código e compartilhe sua solução com o professor para ser avaliada.</p>
                      </header>

                        <main class="container">
                            <!-- Linha Superior: HTML e CSS -->
                                <div class="linha-dupla">
                                      <div class="bloco-editor">
                                              <div class="topo-editor">
                                                        <span>HTML</span>
                                                                  <button onclick="maximizar(this)">Maximizar</button>
                                                                          </div>
                                                                                  <textarea id="htmlCode" placeholder="1"></textarea>
                                                                                        </div>

                                                                                              <div class="bloco-editor">
                                                                                                      <div class="topo-editor">
                                                                                                                <span>CSS</span>
                                                                                                                          <button onclick="maximizar(this)">Maximizar</button>
                                                                                                                                  </div>
                                                                                                                                          <textarea id="cssCode" placeholder="1"></textarea>
                                                                                                                                                </div>
                                                                                                                                                    </div>

                                                                                                                                                        <!-- Linha do Meio: JavaScript -->
                                                                                                                                                            <div class="bloco-editor">
                                                                                                                                                                  <div class="topo-editor">
                                                                                                                                                                          <span>JavaScript</span>
                                                                                                                                                                                  <button onclick="maximizar(this)">Maximizar</button>
                                                                                                                                                                                        </div>
                                                                                                                                                                                              <textarea id="jsCode" placeholder="1"></textarea>
                                                                                                                                                                                                  </div>

                                                                                                                                                                                                      <!-- Linha Inferior: Pré-visualização -->
                                                                                                                                                                                                          <div class="bloco-preview">
                                                                                                                                                                                                                <div class="topo-editor">
                                                                                                                                                                                                                        <span>Pré-visualização do Código</span>
                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                    <iframe id="preview"></iframe>
                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                          </main>
                                                                                                                                                                                                                                          <script src="script.js"></script></body>
                                                                                                                                                                                                                                          </html>
