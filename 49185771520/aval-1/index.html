<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Mentoria TEC Seduc Piauí</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
    }

    body {
        background: linear-gradient(135deg, #006633, #00994d);
        padding: 30px;
    }

    .form-wrapper {
        max-width: 900px;
        margin: auto;
        background: #ffffff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .header {
        background: #006633;
        color: white;
        padding: 30px;
        text-align: center;
    }

    .header h1 {
        font-size: 28px;
        margin-bottom: 10px;
    }

    .header p {
        opacity: 0.9;
    }

    form {
        padding: 30px;
    }

    .section {
        margin-bottom: 30px;
        padding: 25px;
        border: 1px solid #e0e0e0;
        border-radius: 15px;
        background-color: #fafafa;
    }

    .section h2 {
        color: #006633;
        margin-bottom: 20px;
        font-size: 20px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
    }

    input,
    textarea,
    select {
        width: 100%;
        padding: 12px;
        border: 2px solid #dcdcdc;
        border-radius: 10px;
        font-size: 15px;
        transition: 0.3s;
    }

    input:focus,
    textarea:focus,
    select:focus {
        outline: none;
        border-color: #00994d;
    }

    textarea {
        resize: vertical;
        min-height: 120px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
    }

    .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 15px;
    }

    button {
        border: none;
        padding: 14px 25px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-clear {
        background-color: #f0f0f0;
        color: #333;
    }

    .btn-clear:hover {
        background-color: #d9d9d9;
    }

    .btn-submit {
        background-color: #006633;
        color: white;
    }

    .btn-submit:hover {
        background-color: #004d26;
    }

    @media (max-width: 768px) {
        body {
            padding: 15px;
        }

        form {
            padding: 20px;
        }

        .buttons {
            flex-direction: column;
        }

        button {
            width: 100%;
        }
    }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="form-wrapper">

    <div class="header">
        <h1>Relatório de Acompanhamento da Mentoria TEC</h1>
        <p>Seduc Piauí • 2º Ano de Desenvolvimento</p>
    </div>

    <form>

        <div class="section">
            <h2>Dados do Mentor</h2>

            <div class="grid">
                <div class="input-group">
                    <label for="mentor">Nome do Mentor(a)</label>
                    <input type="text" id="mentor" required>
                </div>

                <div class="input-group">
                    <label for="escola">Escola</label>
                    <input type="text" id="escola" required>
                </div>

                <div class="input-group">
                    <label for="municipio">Município</label>
                    <input type="text" id="municipio" required>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Desenvolvimento das Atividades</h2>

            <div class="input-group">
                <label for="atividades">
                    Descreva as atividades realizadas
                </label>

                <textarea id="atividades"></textarea>
            </div>

            <div class="input-group">
                <label for="resultados">
                    Resultados obtidos durante a mentoria
                </label>

                <textarea id="resultados"></textarea>
            </div>
        </div>

        <div class="section">
            <h2>Análise e Reflexão</h2>

            <div class="input-group">
                <label for="dificuldades">
                    Dificuldades encontradas
                </label>

                <textarea id="dificuldades"></textarea>
            </div>

            <div class="input-group">
                <label for="consideracoes">
                    Sugestões e considerações finais
                </label>

                <textarea id="consideracoes"></textarea>
            </div>
        </div>

        <div class="buttons">
            <button type="reset" class="btn-clear">
                Limpar
            </button>

            <button type="submit" class="btn-submit">
                Enviar Relatório
            </button>
        </div>

    </form>

</div>

</body>
</html>
