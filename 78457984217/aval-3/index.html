<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoBank</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="banco">
        <header>
            <h1>💎 NEOBANK</h1>
            <p>Seu banco digital</p>
        </header>

        <section class="saldo">
            <p>Saldo disponível</p>
            <h2 id="saldo">R$ 1.000,00</h2>
        </section>

        <section class="operacoes">
            <h3>Operações bancárias</h3>

            <input
                type="number"
                id="valor"
                placeholder="Digite um valor"
                min="0.01"
                step="0.01"
            >

            <div class="botoes">
                <button onclick="depositar()">📥 Depositar</button>
                <button onclick="sacar()">📤 Sacar</button>
            </div>
        </section>

        <section class="historico">
            <h3>📋 Histórico</h3>
            <div id="transacoes">
                <p>Bem-vindo ao NeoBank!</p>
            </div>
        </section>

        <button class="resetar" onclick="reiniciar()">
            Reiniciar demonstração
        </button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
