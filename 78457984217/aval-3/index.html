<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Music</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="player">
        <h1>🎵 NEON MUSIC</h1>

        <div class="capa" id="capa">🎧</div>

        <h2 id="nomeMusica">Som relaxante</h2>
        <p id="artista">Artista desconhecido</p>

        <audio id="audio"></audio>

        <div class="progresso">
            <span id="atual">0:00</span>
            <input type="range" id="barra" value="0" min="0" max="100">
            <span id="duracao">0:00</span>
        </div>

        <div class="controles">
            <button onclick="anterior()">⏮</button>
            <button onclick="tocar()" id="play">▶</button>
            <button onclick="proxima()">⏭</button>
        </div>

        <div class="volume">
            <span>🔊</span>
            <input type="range" id="volume"
                min="0" max="1" step="0.01" value="0.5">
        </div>

        <h3>Minha playlist</h3>
        <div id="playlist"></div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
