<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialConnect</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>SocialConnect</h1>
        <span>🌎 Conecte-se!</span>
    </header>

    <main>
        <section class="criar-post">
            <h2>Criar publicação</h2>

            <input type="text" id="usuario" placeholder="Seu nome">

            <textarea id="texto" placeholder="O que você está pensando?"></textarea>

            <button onclick="publicar()">Publicar</button>
        </section>

        <section class="feed">
            <h2>Feed de publicações</h2>
            <div id="publicacoes"></div>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
