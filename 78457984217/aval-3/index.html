<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWeather App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Container Central com Efeito Vidro -->
    <div class="weather-card">
        <header class="search-box">
            <input type="text" id="city-input" placeholder="Digite uma cidade..." value="Rio de Janeiro">
            <button id="search-btn">🔍</button>
        </header>

        <main class="weather-info">
            <div class="location">
                <h1 id="city-name">Rio de Janeiro, BR</h1>
                <p id="current-date">Quinta-feira, 13:45</p>
            </div>

            <div class="display">
                <span id="weather-icon" class="icon">☀️</span>
                <h2 id="temperature">28°C</h2>
                <p id="condition">Ensolarado</p>
            </div>

            <!-- Dados Extras -->
            <section class="details-grid">
                <div class="detail-item">
                    <span>💧 Umidade</span>
                    <strong id="humidity">65%</strong>
                </div>
                <div class="detail-item">
                    <span>💨 Vento</span>
                    <strong id="wind">14 km/h</strong>
                </div>
            </section>
        </main>
    </div>

<script src="script.js"></script></body>
</html>
