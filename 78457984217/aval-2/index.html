<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block World 2D</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>⛏️ BLOCK WORLD</h1>
    <p>Quebre e construa seu próprio mundo!</p>

    <div class="painel">
        <span>🌱 Grama: <b id="grama">0</b></span>
        <span>🟫 Terra: <b id="terra">0</b></span>
        <span>🪨 Pedra: <b id="pedra">0</b></span>
    </div>

    <div class="controles">
        <button onclick="selecionar('grama')">🌱 Grama</button>
        <button onclick="selecionar('terra')">🟫 Terra</button>
        <button onclick="selecionar('pedra')">🪨 Pedra</button>
        <button onclick="selecionar('quebrar')">⛏️ Quebrar</button>
    </div>

    <div id="mundo"></div>

    <p id="mensagem">Selecione um bloco para começar!</p>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
