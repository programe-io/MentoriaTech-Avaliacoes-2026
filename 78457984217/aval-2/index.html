<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111c33;
        }

        header h2 {
            color: #60a5fa;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        main {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        main h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        main span {
            color: #60a5fa;
        }

        main p {
            color: #cbd5e1;
            font-size: 18px;
            margin-bottom: 30px;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #2563eb;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #111c33;
            color: #cbd5e1;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }

            main h1 {
                font-size: 34px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h2>MeuSite</h2>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#sobre">Sobre</a>
        </nav>
    </header>

    <main id="inicio">
        <h1>Bem-vindo ao <span>meu site!</span></h1>

        <p>Este é meu primeiro site feito com HTML e CSS.</p>

        <button onclick="mostrarMensagem()">
            Clique aqui
        </button>

        <p id="mensagem" style="margin-top: 25px;"></p>
    </main>

    <section id="sobre" style="text-align:center; padding:30px;">
        <h2>Sobre o site</h2>
        <p style="margin-top:15px;">
            Um projeto simples para aprender desenvolvimento web.
        </p>
    </section>

    <footer>
        <p>© 2026 MeuSite - Todos os direitos reservados.</p>
    </footer>

    <script>
        function mostrarMensagem() {
            document.getElementById("mensagem").textContent =
                "Obrigado por visitar meu site! 🚀";
        }
    </script>

<script src="script.js"></script></body>
</html>
