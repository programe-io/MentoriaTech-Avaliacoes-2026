<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Simulator</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <canvas id="matrix"></canvas>

    <div class="terminal">
        <h1>☠ MATRIX TERMINAL</h1>
        <p>SYSTEM SIMULATOR v1.0</p>

        <div id="saida">
            <p>Bem-vindo ao terminal!</p>
            <p>Digite HELP para ver os comandos.</p>
        </div>

        <div class="entrada">
            <span>root@matrix:~$</span>
            <input id="comando" type="text" placeholder="Digite um comando..." autocomplete="off">
            <button onclick="executar()">EXECUTAR</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
