<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMax</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>CINEMAX</h1>
        <input type="text" id="pesquisa" placeholder="Pesquisar filmes...">
    </header>

    <section class="banner">
        <h2>SEU UNIVERSO DE FILMES</h2>
        <p>Descubra histórias incríveis.</p>
        <button onclick="mostrarDestaque()">Ver destaque</button>
    </section>

    <main>
        <h2>Filmes populares</h2>

        <div class="filmes" id="filmes">

            <div class="filme" data-nome="Interestelar">
                <div class="poster poster1">🚀</div>
                <h3>Interestelar</h3>
                <p>Ficção científica</p>
                <button onclick="detalhes('Interestelar')">Detalhes</button>
            </div>

            <div class="filme" data-nome="Batman">
                <div class="poster poster2">🦇</div>
                <h3>Batman</h3>
                <p>Ação</p>
                <button onclick="detalhes('Batman')">Detalhes</button>
            </div>

            <div class="filme" data-nome="Avatar">
                <div class="poster poster3">🌎</div>
                <h3>Avatar</h3>
                <p>Aventura</p>
                <button onclick="detalhes('Avatar')">Detalhes</button>
            </div>

            <div class="filme" data-nome="Vingadores">
                <div class="poster poster4">⚡</div>
                <h3>Vingadores</h3>
                <p>Super-heróis</p>
                <button onclick="detalhes('Vingadores')">Detalhes</button>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
