<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>⚡ TECHSTORE</h1>
        <button onclick="mostrarCarrinho()">
            🛒 Carrinho (<span id="quantidade">0</span>)
        </button>
    </header>

    <section class="banner">
        <h2>TECNOLOGIA DO FUTURO</h2>
        <p>Os melhores produtos estão aqui!</p>
    </section>

    <main>
        <h2>Nossos produtos</h2>

        <div class="produtos">

            <div class="produto">
                <div class="imagem">🎧</div>
                <h3>Fone Bluetooth</h3>
                <p>R$ 149,90</p>
                <button onclick="adicionar('Fone Bluetooth', 149.90)">
                    Comprar
                </button>
            </div>

            <div class="produto">
                <div class="imagem">⌚</div>
                <h3>Smartwatch</h3>
                <p>R$ 299,90</p>
                <button onclick="adicionar('Smartwatch', 299.90)">
                    Comprar
                </button>
            </div>

            <div class="produto">
                <div class="imagem">🎮</div>
                <h3>Controle Gamer</h3>
                <p>R$ 199,90</p>
                <button onclick="adicionar('Controle Gamer', 199.90)">
                    Comprar
                </button>
            </div>

            <div class="produto">
                <div class="imagem">⌨️</div>
                <h3>Teclado Mecânico</h3>
                <p>R$ 249,90</p>
                <button onclick="adicionar('Teclado Mecânico', 249.90)">
                    Comprar
                </button>
            </div>

        </div>

        <section class="carrinho" id="carrinho">
            <h2>🛒 Meu carrinho</h2>

            <div id="itens"></div>

            <h3 id="total">Total: R$ 0,00</h3>

            <button onclick="finalizar()">Finalizar compra</button>
            <button onclick="limparCarrinho()" class="limpar">
                Limpar carrinho
            </button>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
