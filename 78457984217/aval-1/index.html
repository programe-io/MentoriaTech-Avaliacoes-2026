<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Login</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="login">
        <div class="icone">⚡</div>

        <h1>CYBER LOGIN</h1>
        <p>Acesse seu sistema</p>

        <form id="formulario">
            <input
                type="text"
                id="usuario"
                placeholder="Nome de usuário"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">ENTRAR</button>
        </form>

        <p id="mensagem"></p>

        <div class="rodape">
            SISTEMA FUTURISTA © 2026
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
