<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard - Password Generator</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Container do Terminal -->
    <div class="terminal-box">
        <header class="terminal-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <div class="title">CYBERGUARD // SECURE_GEN_v1.0</div>
        </header>

        <main class="terminal-body">
            <!-- Painel de Saída da Senha -->
            <div class="password-display-container">
                <input type="text" id="password-output" readonly value="CL1QU3_3M_G3R4R">
                <button id="copy-btn" title="Copiar Senha">📋</button>
            </div>

            <!-- Controles de Configuração -->
            <div class="controls-group">
                <div class="control-row">
                    <label for="length-slider">Comprimento: <span id="length-val">12</span> caracteres</label>
                    <input type="range" id="length-slider" min="6" max="24" value="12">
                </div>

                <div class="control-row checkbox-grid">
                    <label class="cyber-check">
                        <input type="checkbox" id="check-upper" checked>
                        <span>[X] Incluir Maiúsculas</span>
                    </label>
                    <label class="cyber-check">
                        <input type="checkbox" id="check-numbers" checked>
                        <span>[X] Incluir Números</span>
                    </label>
                    <label class="cyber-check">
                        <input type="checkbox" id="check-symbols" checked>
                        <span>[X] Incluir Símbolos</span>
                    </label>
                </div>
            </div>

            <!-- Botão de Ação -->
            <button id="generate-btn">EXECUTE_GENERATION.EXE</button>
        </main>
    </div>

<script src="script.js"></script></body>
</html>
