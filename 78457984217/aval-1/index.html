<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedra Papel Tesoura</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="jogo">
        <h1>⚔️ BATALHA!</h1>
        <p>Escolha sua jogada:</p>

        <div class="opcoes">
            <button onclick="jogar('pedra')">✊</button>
            <button onclick="jogar('papel')">✋</button>
            <button onclick="jogar('tesoura')">✌️</button>
        </div>

        <div class="resultado">
            <h2 id="mensagem">Prepare-se!</h2>
            <p id="jogadas">Você: - | Computador: -</p>
        </div>

        <div class="placar">
            <div>
                <h3>VOCÊ</h3>
                <span id="pontosJogador">0</span>
            </div>

            <div>
                <h3>PC</h3>
                <span id="pontosPC">0</span>
            </div>
        </div>

        <button class="reiniciar" onclick="reiniciar()">
            REINICIAR
        </button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
