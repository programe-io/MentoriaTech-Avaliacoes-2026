<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Racing</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="game">
        <h1>🏎️ NEON RACING</h1>

        <div class="placar">
            <span>Pontos: <b id="pontos">0</b></span>
            <span>Recorde: <b id="recorde">0</b></span>
        </div>

        <div id="pista">
            <div id="inicio">
                <h2>Prepare-se para correr!</h2>
                <button onclick="iniciar()">COMEÇAR</button>
            </div>

            <div id="carro">🏎️</div>
        </div>

        <div class="controles">
            <button onclick="mover(-1)">⬅️</button>
            <button onclick="mover(1)">➡️</button>
        </div>

        <p id="mensagem">Desvie dos carros!</p>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
