<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anamnese com Assinatura</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header class="cabecalho">
            <div>
                <h1>🩺 Ficha de Anamnese</h1>
                <p>Avaliação inicial, alertas clínicos e termo assinado</p>
            </div>
            <div class="acoes-topo no-print">
                <button type="button" id="btn-limpar-ficha">Limpar</button>
                <button type="button" id="btn-imprimir-ficha" class="btn-azul">Imprimir</button>
            </div>
        </header>

        <div id="painel-alertas" class="painel-alertas oculto"></div>

        <form id="form-ficha">
            <div class="grid-2">
                <div class="campo">
                    <label for="pac-nome">Nome completo *</label>
                    <input type="text" id="pac-nome" required>
                </div>
                <div class="campo">
                    <label for="pac-doc">CPF ou RG</label>
                    <input type="text" id="pac-doc">
                </div>
            </div>

            <div class="grid-3">
                <div class="campo">
                    <label for="pac-nasc">Nascimento *</label>
                    <input type="date" id="pac-nasc" required>
                </div>
                <div class="campo">
                    <label for="pac-fone">Telefone *</label>
                    <input type="tel" id="pac-fone" required>
                </div>
                <div class="campo">
                    <label for="pac-imc">IMC estimado</label>
                    <input type="text" id="pac-imc" readonly placeholder="Informe peso e altura">
                </div>
            </div>

            <div class="grid-2">
                <div class="campo">
                    <label for="pac-peso">Peso (kg)</label>
                    <input type="number" id="pac-peso" step="0.1" min="1">
                </div>
                <div class="campo">
                    <label for="pac-alt">Altura (m)</label>
                    <input type="number" id="pac-alt" step="0.01" min="0.5" max="2.5">
                </div>
            </div>

            <div class="campo">
                <label for="pac-motivo">Motivo do atendimento *</label>
                <textarea id="pac-motivo" rows="2" required></textarea>
            </div>

            <div class="grid-2">
                <div class="campo">
                    <label for="pac-alergia">Alergias conhecidas</label>
                    <input type="text" id="pac-alergia" placeholder="Ex: Dipirona, látex...">
                </div>
                <div class="campo">
                    <label for="pac-remedios">Medicamentos em uso</label>
                    <input type="text" id="pac-remedios" placeholder="Ex: Anti-hipertensivo...">
                </div>
            </div>

            <div class="campo assinatura-box">
                <div class="assinatura-topo">
                    <label>Assinatura do paciente / responsável</label>
                    <button type="button" id="btn-limpar-assinatura" class="btn-pequeno no-print">Limpar assinatura</button>
                </div>
                <canvas id="canvas-assinatura" width="600" height="130"></canvas>
            </div>

            <button type="submit" class="btn-salvar no-print">Registrar ficha</button>
        </form>

        <section class="registros no-print">
            <h2>Registros salvos (<span id="qtd-registros">0</span>)</h2>
            <input type="text" id="buscar-ficha" placeholder="Buscar paciente...">
            <div id="lista-registros"></div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
