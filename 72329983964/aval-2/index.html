
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f3f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        .tarefa {
            background: #f8f9fa;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
            border-left: 5px solid #2563eb;
        }

        .concluida {
            border-left-color: green;
            opacity: 0.7;
        }

        .concluida h3 {
            text-decoration: line-through;
        }

        .acoes {
            display: flex;
            gap: 8px;
        }

        .acoes button {
            flex: 1;
        }

        .concluir {
            background: green;
        }

        .excluir {
            background: #dc2626;
        }

        .mensagem {
            text-align: center;
            color: #555;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Gerenciador de Tarefas</h1>

    <h3>Cadastrar nova tarefa</h3>

    <input type="text" id="titulo"
        placeholder="Digite o título da tarefa">

    <select id="prioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="cadastrarTarefa()">
        Cadastrar Tarefa
    </button>

    <hr>

    <h3>Lista de tarefas</h3>

    <div id="listaTarefas">
        <p class="mensagem">Nenhuma tarefa cadastrada.</p>
    </div>

</div>

<script>

    let tarefas = [];
    let proximoCodigo = 1;

    // Cadastrar tarefa
    function cadastrarTarefa() {

        let titulo = document.getElementById("titulo").value.trim();
        let prioridade = Number(
            document.getElementById("prioridade").value
        );

        if (titulo.length < 5) {
            alert("O título deve ter no mínimo 5 caracteres!");
            return;
        }

        if (![1, 2, 3].includes(prioridade)) {
            alert("A prioridade deve ser entre 1 e 3!");
            return;
        }

        let tarefa = {
            codigo: proximoCodigo,
            titulo: titulo,
            prioridade: prioridade,
            concluida: false
        };

        tarefas.push(tarefa);
        proximoCodigo++;

        document.getElementById("titulo").value = "";

        listarTarefas();
    }

    // Listar tarefas
    function listarTarefas() {

        let lista = document.getElementById("listaTarefas");

        lista.innerHTML = "";

        if (tarefas.length === 0) {
            lista.innerHTML =
                '<p class="mensagem">Nenhuma tarefa cadastrada.</p>';
            return;
        }

        tarefas.forEach(tarefa => {

            let div = document.createElement("div");

            div.className = tarefa.concluida
                ? "tarefa concluida"
                : "tarefa";

            let titulo = document.createElement("h3");
            titulo.textContent = tarefa.titulo;

            let codigo = document.createElement("p");
            codigo.textContent = "Código: " + tarefa.codigo;

            let prioridade = document.createElement("p");
            prioridade.textContent =
                "Prioridade: " +
                (tarefa.prioridade === 1 ? "Alta" :
                 tarefa.prioridade === 2 ? "Média" : "Baixa");

            let status = document.createElement("p");
            status.textContent =
                "Status: " +
                (tarefa.concluida ? "Concluída" : "Pendente");

            let acoes = document.createElement("div");
            acoes.className = "acoes";

            let concluir = document.createElement("button");
            concluir.textContent = tarefa.concluida
                ? "Concluída"
                : "Concluir";
            concluir.className = "concluir";
            concluir.disabled = tarefa.concluida;
            concluir.onclick = () => concluirTarefa(tarefa.codigo);

            let alterar = document.createElement("button");
            alterar.textContent = "Alterar prioridade";
            alterar.onclick = () =>
                alterarPrioridade(tarefa.codigo);

            let excluir = document.createElement("button");
            excluir.textContent = "Excluir";
            excluir.className = "excluir";
            excluir.onclick = () => excluirTarefa(tarefa.codigo);

            acoes.append(concluir, alterar, excluir);

            div.append(codigo, titulo, prioridade, status, acoes);

            lista.appendChild(div);
        });
    }

    // Concluir tarefa
    function concluirTarefa(codigo) {

        let tarefa = tarefas.find(t => t.codigo === codigo);

        if (!tarefa) {
            alert("Tarefa não encontrada!");
            return;
        }

        tarefa.concluida = true;

        listarTarefas();
    }

    // Alterar prioridade
    function alterarPrioridade(codigo) {

        let tarefa = tarefas.find(t => t.codigo === codigo);

        let novaPrioridade = Number(
            prompt("Digite a nova prioridade:\n1 - Alta\n2 - Média\n3 - Baixa")
        );

        if (![1, 2, 3].includes(novaPrioridade)) {
            alert("Prioridade inválida! Digite 1, 2 ou 3.");
            return;
        }

        tarefa.prioridade = novaPrioridade;

        listarTarefas();
    }

    // Excluir tarefa
    function excluirTarefa(codigo) {

        tarefas = tarefas.filter(t => t.codigo !== codigo);

        listarTarefas();
    }

</script>

<script src="script.js"></script></body>
</html>
