
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Pessoas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #38bdf8;
        }

        table {
            width: 100%;
            max-width: 800px;
            margin: 25px auto;
            border-collapse: collapse;
            background: #1e293b;
        }

        th, td {
            padding: 15px;
            border: 1px solid #475569;
        }

        th {
            background: #0284c7;
            color: white;
        }

        tr:nth-child(even) {
            background: #334155;
        }

        tr:hover {
            background: #475569;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>📋 Cadastro de Pessoas</h1>

    <table>

            <tr>
                <th>Nome</th>

                <th>Cidade</th>
                <th>Profissão</th>
            </tr>
        </thead>

        <tbody>

<script src="script.js"></script></body>
</html>
