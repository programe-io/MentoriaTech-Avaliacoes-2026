
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Assistente de Tarefas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121826;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #202b40;
            padding: 25px;
            border-radius: 15px;
        }

        input, button {
            padding: 12px;
            margin: 5px;
            border: none;
            border-radius: 7px;
        }

        input {
            width: 65%;
        }

        button {
            background: #28a879;
            color: white;
            cursor: pointer;
        }

        li {
            background: #303d55;
            padding: 12px;
            margin: 10px 0;
            list-style: none;
            border-radius: 7px;
            overflow-wrap: anywhere;
        }

        .concluida {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .remover {
            background: #dc4545;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h1>🤖 Assistente de Tarefas</h1>
    <p>Organize suas atividades diárias!</p>

    <input id="tarefa" placeholder="Digite uma tarefa...">
    <button onclick="adicionarTarefa()">Adicionar</button>

    <ul id="lista"></ul>
</div>

<script>
    function adicionarTarefa() {
        const campo = document.getElementById("tarefa");
        const texto = campo.value.trim();

        if (texto === "") {
            alert("Digite uma tarefa primeiro!");
            return;
        }

        const item = document.createElement("li");
        const nome = document.createElement("span");
        nome.textContent = texto;

        // Marcar tarefa como concluída
        nome.onclick = function () {
            nome.classList.toggle("concluida");
        };

        // Botão para remover tarefa
        const botao = document.createElement("button");
        botao.textContent = "Excluir";
        botao.className = "remover";

        botao.onclick = function () {
            item.remove();
        };

        item.appendChild(nome);
        item.appendChild(document.createTextNode(" "));
        item.appendChild(botao);

        document.getElementById("lista").appendChild(item);

        campo.value = "";
        campo.focus();
    }
</script>

<script src="script.js"></script></body>
</html>
