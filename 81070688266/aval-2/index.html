<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Social</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="feed-container">
        <!-- Card do Post -->
        <div class="post-card">
            
            <!-- Cabeçalho do Post -->
            <div class="post-header">
                <img src="https://unsplash.com" alt="Foto de Perfil" class="profile-pic">
                <div class="user-info">
                    <h3 class="user-name">Beatriz Souza</h3>
                    <p class="post-time">Há 2 horas • <span class="public-icon">🌐</span></p>
                </div>
            </div>

            <!-- Conteúdo de Texto -->
            <div class="post-content">
                <p>Acabei de finalizar o desenvolvimento de um novo layout para o feed de uma rede social utilizando apenas <strong>HTML</strong> e <strong>CSS puro</strong>! Praticando conceitos de Flexbox e design responsivo. O que acharam? 🚀💻</p>
            </div>

            <!-- Imagem do Post -->
            <div class="post-media">
                <img src="https://unsplash.com" alt="Imagem do Post">
            </div>

            <!-- Barra de Interações/Contadores -->
            <div class="post-analytics">
                <span class="likes-count">❤️👍 42 pessoas curtiram</span>
                <span class="comments-count">12 comentários</span>
            </div>

            <!-- Botões de Ação -->
            <div class="post-actions">
                <button class="action-btn">
                    <span>👍</span> Curtir
                </button>
                <button class="action-btn">
                    <span>💬</span> Comentar
                </button>
                <button class="action-btn">
                    <span>🔄</span> Compartilhar
                </button>
            </div>

        </div>
    </div>

</body>
</html>$0
