<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="app-container" id="app">
  <!-- Barra Lateral de Navegação -->
  <aside class="sidebar">
    <div class="logo">Instagram</div>
    <nav class="nav-links">
      <button class="nav-item active" onclick="filterFeed('all', this)">
        <span>🏠</span> Página Inicial
      </button>
      <button class="nav-item" onclick="openCreateModal()">
        <span>➕</span> Criar Post
      </button>
      <button class="nav-item" onclick="filterFeed('saved', this)">
        <span>🔖</span> Salvos
      </button>
      <button class="nav-item" onclick="toggleDarkMode()">
        <span id="theme-icon">🌙</span> Alternar Tema
      </button>
    </nav>
    <div class="user-mini-profile">
      <img src="https://unsplash.com" alt="Perfil">
      <div>
        <strong>dev_criativo</strong>
        <small>Você</small>
      </div>
    </div>
  </aside>

  <!-- Área Principal (Stories + Feed) -->
  <main class="main-content">
    <!-- Carrossel de Stories -->
    <section class="stories-container" id="stories-bar"></section>

    <!-- Feed de Publicações -->
    <section class="feed-container" id="feed"></section>
  </main>

  <!-- Sugestões à Direita -->
  <aside class="suggestions-sidebar">
    <div class="suggestions-header">
      <span>Sugestões para você</span>
    </div>
    <div id="suggestions-list"></div>
  </aside>
</div>

<!-- Modal para Visualizar Stories -->
<div class="modal-overlay" id="story-modal">
  <div class="story-viewer">
    <div class="story-progress-bar">
      <div class="story-progress-fill" id="story-progress"></div>
    </div>
    <div class="story-header">
      <img id="story-avatar" src="" alt="">
      <span id="story-username"></span>
      <button class="close-btn" onclick="closeStory()">✕</button>
    </div>
    <img id="story-image" src="" alt="Story">
  </div>
</div>

<!-- Modal para Criar Nova Publicação -->
<div class="modal-overlay" id="create-modal">
  <div class="create-box">
    <div class="create-header">
      <h3>Criar nova publicação</h3>
      <button class="close-btn" onclick="closeCreateModal()">✕</button>
    </div>
    <div class="create-body">
      <label>Escolha uma imagem de exemplo ou cole uma URL:</label>
      <select id="preset-images" onchange="updatePreview()">
        <option value="https://unsplash.com">Praia Tropical</option>
        <option value="https://unsplash.com">Setup Tecnologia</option>
        <option value="https://unsplash.com">Gato Curioso</option>
        <option value="https://unsplash.com">Café da Manhã</option>
      </select>
      <input type="text" id="custom-img-url" placeholder="Ou cole a URL de outra imagem..." oninput="updatePreview()">
      
      <label>Filtro de Imagem:</label>
      <select id="image-filter" onchange="updatePreview()">
        <option value="none">Normal</option>
        <option value="grayscale(100%)">Preto e Branco</option>
        <option value="sepia(60%)">Sépia Vintage</option>
        <option value="contrast(130%) saturate(130%)">Vibrante</option>
      </select>

      <div class="preview-wrapper">
        <img id="new-post-preview" src="https://unsplash.com" alt="Preview">
      </div>

      <input type="text" id="new-post-location" placeholder="Adicionar localização (ex: Teresina, PI)">
      <textarea id="new-post-caption" rows="3" placeholder="Escreva uma legenda..."></textarea>
      <button class="publish-btn" onclick="publishPost()">Compartilhar</button>
    </div>
  </div>
</div>$0
  <script src="script.js"></script>
  
</body>
</html>
