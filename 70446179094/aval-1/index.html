<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC do Paciente</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="container">
    <header>
      <h1>Avaliação de IMC</h1>
      <p class="subtitle">Preencha os dados do paciente para calcular o Índice de Massa Corporal</p>
    </header>

    <form id="form-imc" novalidate>
      <div class="form-group">
        <label for="nome">Nome do Paciente</label>
        <input type="text" id="nome" placeholder="Ex: Maria Oliveira" required>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="peso">Peso (kg)</label>
          <input type="text" id="peso" placeholder="Ex: 70,5" inputmode="decimal" required>
        </div>

        <div class="form-group">
          <label for="altura">Altura (m ou cm)</label>
          <input type="text" id="altura" placeholder="Ex: 1,75 ou 175" inputmode="decimal" required>
        </div>
      </div>

      <p id="mensagem-erro" class="erro">Por favor, preencha o nome e insira valores válidos maiores que zero.</p>

      <div class="buttons">
        <button type="submit" class="btn-calc">Calcular IMC</button>
        <button type="button" class="btn-clear" id="btn-limpar">Limpar</button>
      </div>
    </form>

    <section id="box-resultado" class="resultado" aria-live="polite">
      <div class="resultado-header">
        <div>
          <span class="label-pequeno">Paciente</span>
          <div class="paciente-nome" id="res-nome"></div>
        </div>
        <div class="text-right">
          <span class="label-pequeno">IMC Calculado</span>
          <div class="imc-valor" id="res-imc"></div>
        </div>
      </div>

      <div id="res-badge" class="badge"></div>

      <ul class="info-lista">
        <li><strong>Dados informados:</strong> <span id="res-dados"></span></li>
        <li><strong>Faixa de peso ideal estimada:</strong> <span id="res-ideal"></span></li>
        <li><strong>Orientação clínica:</strong> <span id="res-orientacao"></span></li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
