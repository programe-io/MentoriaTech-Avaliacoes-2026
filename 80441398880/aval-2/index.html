
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minifeed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        🌐 Minifeed
    </header>

    <main class="container">

        <section class="composer">
            <h3>O que você está pensando?</h3>

            <textarea placeholder="Escreva uma publicação..."></textarea>

            <button class="publish">Publicar</button>
        </section>

        <section class="feed">

            <article class="post">
                <div class="post-header">
                    <div class="avatar">U</div>
                    <div>
                        <strong>Usuário</strong>
                        <div class="date">Hoje</div>
                    </div>
                </div>

                <div class="post-content">
                    Olá, mundo! Esta é minha primeira publicação no Minifeed.
                </div>

                <div class="actions">
                    <button class="like">❤️ Curtir</button>
                    <button class="comment-btn">💬 Comentar</button>
                </div>
            </article>

            <article class="post">
                <div class="post-header">
                    <div class="avatar">M</div>
                    <div>
                        <strong>Maria</strong>
                        <div class="date">Ontem</div>
                    </div>
                </div>

                <div class="post-content">
                    Bem-vindos ao Minifeed! Uma nova comunidade para compartilhar ideias.
                </div>

                <div class="actions">
                    <button class="like">❤️ Curtir</button>
                    <button class="comment-btn">💬 Comentar</button>
                </div>
            </article>

        </section>

    </main>

    <footer>
        © 2026 Minifeed - Sua comunidade online
    </footer>

</body>
</html>
