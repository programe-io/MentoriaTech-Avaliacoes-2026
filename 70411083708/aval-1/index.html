
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1, h2 {
            text-align: center;
            color: #2457a7;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
            color: white;
            background-color: #2457a7;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .alterar {
            background-color: #e69b16;
            margin-right: 5px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #2457a7;
            color: white;
        }

        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .container {
                padding: 12px;
            }

            .tabela {
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
    <div class="container">
        <h1>Sistema de Estoque</h1>

        <h2>Cadastrar Produto</h2>

        <form id="formulario">
            <label for="codigo">Código:</label>
            <input type="text" id="codigo" required>

            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" required>

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" min="0" step="1" required>

            <label for="valor">Valor (R$):</label>
            <input type="number" id="valor" min="0" step="0.01" required>

            <button type="submit">Cadastrar Produto</button>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>

        <h2>Produtos Cadastrados</h2>

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaProdutos"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Lista que armazena os produtos
        let produtos = [];

        const formulario = document.getElementById("formulario");
        const lista = document.getElementById("listaProdutos");
        const mensagem = document.getElementById("mensagem");

        // Cadastrar produto
        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();

            const codigo = document.getElementById("codigo").value.trim();
            const descricao = document.getElementById("descricao").value.trim();
            const quantidadeTexto = document.getElementById("quantidade").value;
            const valorTexto = document.getElementById("valor").value;

            const quantidade = Number(quantidadeTexto);
            const valor = Number(valorTexto);

            if (!codigo || !descricao) {
                mostrarMensagem("Preencha todos os campos.");
                return;
            }

            if (
                quantidadeTexto === "" ||
                !Number.isSafeInteger(quantidade) ||
                quantidade < 0
            ) {
                mostrarMensagem("Informe uma quantidade inteira válida.");
                return;
            }

            if (valorTexto === "" || !Number.isFinite(valor) || valor < 0) {
                mostrarMensagem("Informe um valor válido.");
                return;
            }

            // Verifica se o código já existe
            const existe = produtos.some(
                produto => produto.codigo.toLowerCase() === codigo.toLowerCase()
            );

            if (existe) {
                mostrarMensagem("Esse código já está cadastrado.");
                return;
            }

            const produto = {
                codigo: codigo,
                descricao: descricao,
                quantidade: quantidade,
                valor: valor
            };

            produtos.push(produto);

            formulario.reset();
            listarProdutos();
            mostrarMensagem("Produto cadastrado com sucesso!");
        });

        // Listar produtos
        function listarProdutos() {
            lista.replaceChildren();

            produtos.forEach(function(produto) {
                const linha = document.createElement("tr");

                adicionarCelula(linha, produto.codigo);
                adicionarCelula(linha, produto.descricao);
                adicionarCelula(linha, produto.quantidade);
                adicionarCelula(linha, produto.valor.toLocaleString("pt-BR", {
                    style: "currency",
                    currency: "BRL"
                }));

                const celulaAcoes = document.createElement("td");

                const botaoValor = document.createElement("button");
                botaoValor.textContent = "Alterar valor";
                botaoValor.className = "alterar";
                botaoValor.addEventListener("click", function() {
                    alterarValor(produto.codigo);
                });

                const botaoQuantidade = document.createElement("button");
                botaoQuantidade.textContent = "Alterar quantidade";
                botaoQuantidade.addEventListener("click", function() {
                    alterarQuantidade(produto.codigo);
                });

                celulaAcoes.append(botaoValor, botaoQuantidade);
                linha.appendChild(celulaAcoes);
                lista.appendChild(linha);
            });
        }

        // Criar células da tabela
        function adicionarCelula(linha, texto) {
            const celula = document.createElement("td");
            celula.textContent = texto;
            linha.appendChild(celula);
        }

        // Alterar o valor do produto
        function alterarValor(codigo) {
            const produto = produtos.find(
                item => item.codigo === codigo
            );

            const novoValor = prompt(
                "Digite o novo valor do produto:",
                produto.valor
            );

            if (novoValor === null) return;

            const texto = novoValor.trim();

            if (texto === "" || !/^\d+([.,]\d{1,2})?$/.test(texto)) {
                mostrarMensagem("Digite um valor válido.");
                return;
            }

            const valor = Number(texto.replace(",", "."));

            if (!Number.isFinite(valor) || valor < 0) {
                mostrarMensagem("O valor não pode ser negativo.");
                return;
            }

            produto.valor = valor;

            listarProdutos();
            mostrarMensagem("Valor alterado com sucesso!");
        }

        // Alterar a quantidade do produto
        function alterarQuantidade(codigo) {
            const produto = produtos.find(
                item => item.codigo === codigo
            );

            const novaQuantidade = prompt(
                "Digite a nova quantidade do produto:",
                produto.quantidade
            );

            if (novaQuantidade === null) return;

            const texto = novaQuantidade.trim();
            const quantidade = Number(texto);

            if (
                texto === "" ||
                !Number.isSafeInteger(quantidade) ||
                quantidade < 0
            ) {
                mostrarMensagem("Digite uma quantidade inteira válida.");
                return;
            }

            produto.quantidade = quantidade;

            listarProdutos();
            mostrarMensagem("Quantidade alterada com sucesso!");
        }

        // Exibir mensagens
        function mostrarMensagem(texto) {
            mensagem.textContent = texto;
        }
    </script>
<script src="script.js"></script></body>
</html>
