
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #17365d;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #17365d;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #286090;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            border-radius: 5px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Controle de Estoque</h1>

    <button onclick="cadastrarProduto()">
        1 - Cadastrar produto
    </button>

    <button onclick="listarProdutos()">
        2 - Listar produtos
    </button>

    <button onclick="alterarValor()">
        3 - Alterar valor
    </button>

    <button onclick="alterarQuantidade()">
        4 - Alterar quantidade
    </button>

    <div id="resultado">
        Sistema pronto para utilização!
    </div>

</div>

<script>

    // Lista de produtos cadastrados
    let produtos = [];

    // 1 - Cadastrar novo produto
    function cadastrarProduto() {

        let codigo = prompt("Digite o código do produto:");

        if (codigo === null || codigo.trim() === "") {
            alert("Código inválido!");
            return;
        }

        codigo = codigo.trim();

        // Verificar se o código já existe
        if (produtos.some(p => p.codigo === codigo)) {
            alert("Já existe um produto com esse código!");
            return;
        }

        let descricao = prompt("Digite a descrição do produto:");

        if (descricao === null || descricao.trim() === "") {
            alert("Descrição inválida!");
            return;
        }

        let quantidade = Number(prompt("Digite a quantidade:"));
        let valor = Number(prompt("Digite o valor do produto:"));

        if (!Number.isInteger(quantidade) || quantidade < 0 ||
            !Number.isFinite(valor) || valor < 0) {
            alert("Quantidade ou valor inválido!");
            return;
        }

        let produto = {
            codigo: codigo,
            descricao: descricao,
            quantidade: quantidade,
            valor: valor
        };

        produtos.push(produto);

        alert("Produto cadastrado com sucesso!");

    }

    // 2 - Listar produtos cadastrados
    function listarProdutos() {

        let resultado = document.getElementById("resultado");

        if (produtos.length === 0) {
            resultado.innerHTML = "<h3>Nenhum produto cadastrado!</h3>";
            return;
        }

        let html = "<h3>Produtos cadastrados</h3>";

        produtos.forEach(produto => {

            html += `
                <p>
                    <strong>Código:</strong> ${produto.codigo}<br>
                    <strong>Descrição:</strong> ${produto.descricao}<br>
                    <strong>Quantidade:</strong> ${produto.quantidade}<br>
                    <strong>Valor:</strong> ${produto.valor.toLocaleString("pt-BR", {
                        style: "currency",
                        currency: "BRL"
                    })}
                </p>
                <hr>
            `;

        });

        resultado.innerHTML = html;

    }

    // 3 - Alterar valor de um produto
    function alterarValor() {

        let codigo = prompt("Digite o código do produto:");

        if (codigo === null) return;

        let produto = produtos.find(p => p.codigo === codigo.trim());

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        let novoValor = Number(prompt("Digite o novo valor:"));

        if (!Number.isFinite(novoValor) || novoValor < 0) {
            alert("Valor inválido!");
            return;
        }

        produto.valor = novoValor;

        alert("Valor atualizado com sucesso!");

    }

    // 4 - Alterar quantidade de um produto
    function alterarQuantidade() {

        let codigo = prompt("Digite o código do produto:");

        if (codigo === null) return;

        let produto = produtos.find(p => p.codigo === codigo.trim());

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        let novaQuantidade = Number(
            prompt("Digite a nova quantidade:")
        );

        if (!Number.isInteger(novaQuantidade) || novaQuantidade < 0) {
            alert("Quantidade inválida!");
            return;
        }

        produto.quantidade = novaQuantidade;

        alert("Quantidade atualizada com sucesso!");

    }

</script>

<script src="script.js"></script></body>
</html>
