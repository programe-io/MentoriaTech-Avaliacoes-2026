<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MiniFeed</title>
        <link rel="stylesheet" href="style.css">
    <link href="style.css" rel="stylesheet"></head>

    <body>
       
        <header>

            <div class="header-content">

                <h1>MiniFeed</h1>

                <nav>
       
                 <a href="#">Inicio</a>
                 <a href="#">Perfil</a>

                </nav>

            </div>


        </header>


        <main>


            <section class="new-post">

                <div class="user">
           
                    <div class="avatar">
                     I  
                    </div>
                   
                    <div>
                       <strong>kamila</strong>
                       <span>O que você pensando?</span>
                    </div>

                </div>
 
         
                <button>Publicar</button>


            </section>

       
            <article class="post">

                <div class="post-header">

                    <div class="avatar">
                     I  
                    </div>
                    <div>
                       <strong>kamila ramos </strong>
                       <span>ha 10 minuntos</span>
                    </div>


                    <div class="post-text">
                      hoje eu vi um filme melhores amigas ,muito legal:D
                    </div>
                    <img src="https://thumb.wikimedia.org/wikipedia/pt/thumb/e/e2/Minha_melhor_amiga.jpg/250px-Minha_melhor_amiga.jpg?utm_source=pt.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"img>
         
                    <div class="post-actions">

                      <button>Curtir</button>
                      <button>Comentar</button>
                      <button>Favoritar</button>
                     <button>Compartilhar</button>

                    </div>


                </div>

            </article>

        </main>

        <footer>
            <p>"minifeed- todos os direitos reservados-2026</p>
        </footer>
    </body>

</html>
