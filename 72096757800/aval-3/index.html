
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompraFácil - Loja Virtual</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <div class="topo">
        <h1>Compra<span>Fácil</span></h1>
        <button onclick="abrirCarrinho()">
            🛒 Carrinho (<span id="quantidade">0</span>)
        </button>
    </div>

    <div class="pesquisa">
        <input type="text" id="pesquisa"
        placeholder="O que deseja comprar?">
        <button onclick="buscar()">Pesquisar</button>
    </div>
</header>

<nav>
    <button onclick="filtrar('Todos')">Todos</button>
    <button onclick="filtrar('Eletrônicos')">Eletrônicos</button>
    <button onclick="filtrar('Roupas')">Roupas</button>
    <button onclick="filtrar('Calçados')">Calçados</button>
    <button onclick="filtrar('Acessórios')">Acessórios</button>
</nav>

<main>
    <section class="banner">
        <h2>Bem-vindo à CompraFácil!</h2>
        <p>Os melhores produtos estão aqui!</p>
    </section>

    <h2 class="titulo">Nossos Produtos</h2>

    <section id="produtos" class="produtos"></section>
</main>

<div id="modalCarrinho" class="modal">
    <div class="caixa">
        <button class="fechar" onclick="fecharCarrinho()">✖</button>

        <h2>Meu Carrinho</h2>

        <div id="itensCarrinho"></div>

        <h3 id="total">Total: R$ 0,00</h3>

        <button class="finalizar" onclick="finalizarCompra()">
            Finalizar Compra
        </button>
    </div>
</div>

<footer>
    <p>© 2026 CompraFácil - Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
