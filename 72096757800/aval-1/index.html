
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompraFácil - Compre e Venda</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <div class="topo">
        <h1>Compra<span>Fácil</span></h1>
        <button class="anunciar" onclick="abrirFormulario()">
            + Anunciar
        </button>
    </div>

    <div class="pesquisa">
        <input type="text" id="pesquisa"
        placeholder="O que você está procurando?">
        <button onclick="buscarProdutos()">Buscar</button>
    </div>
</header>

<nav>
    <button onclick="filtrar('Todos')">Todos</button>
    <button onclick="filtrar('Eletrônicos')">Eletrônicos</button>
    <button onclick="filtrar('Celulares')">Celulares</button>
    <button onclick="filtrar('Veículos')">Veículos</button>
    <button onclick="filtrar('Móveis')">Móveis</button>
    <button onclick="filtrar('Moda')">Moda</button>
</nav>

<main>
    <h2>Ofertas perto de você</h2>

    <section id="produtos" class="produtos"></section>

    <div id="formulario" class="modal">
        <div class="conteudo">
            <button class="fechar" onclick="fecharFormulario()">×</button>
            <h2>Publicar anúncio</h2>

            <form id="formProduto">
                <input id="nome" placeholder="Nome do produto" required>

                <input id="preco" type="number"
                placeholder="Preço (R$)" min="0.01" step="0.01" required>

                <select id="categoria" required>
                    <option value="">Escolha a categoria</option>
                    <option>Eletrônicos</option>
                    <option>Celulares</option>
                    <option>Veículos</option>
                    <option>Móveis</option>
                    <option>Moda</option>
                </select>

                <input id="local" placeholder="Sua cidade" required>

                <input id="imagem" type="url"
                placeholder="Link da imagem do produto">

                <input id="whatsapp" placeholder="WhatsApp com DDD">

                <textarea id="descricao"
                placeholder="Descrição do produto" required></textarea>

                <button type="submit">Publicar anúncio</button>
            </form>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 CompraFácil - Compre e venda com facilidade!</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
