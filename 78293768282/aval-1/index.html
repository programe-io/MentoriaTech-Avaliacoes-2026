<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Catar Banana 🍌</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Cata Banana! 🐒</h1>

    <div id="Painel">
        <div>Pontos: <span id="pontos">0</span></div>
        <div>Vidas: <span id="vidas">3</span></div>
    </div>

    <div id="cenario">
        <div id="macaco">🐒</div>
        
        <div id="tela-gameover">
            <h2>Fim de Jogo! 😭</h2>
            <p>Você fez <span id="pontos-finais">0</span> pontos.</p>
            <button id="btn-reiniciar" onclick="reiniciarJogo()">Jogar de Novo</button>
        </div>
    </div>

    <div class="controles-toque">
        <button class="btn-toque" onmousedown="moverEsquerda()" ontouchstart="moverEsquerda()">◀ Esquerda</button>
        <button class="btn-toque" onmousedown="moverDireita()" ontouchstart="moverDireita()">Direita ▶</button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
