<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Cyber Surfers: Hyper Premium</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div id="game-container">
        <div class="horizon-glow"></div>
        <div class="tracks-container">
            <div class="pseudo-3d-floor"></div>
            <div class="rail-line" id="rail1"></div>
            <div class="rail-line" id="rail2"></div>
            <div class="rail-line" id="rail3"></div>
        </div>

        <div id="hud">
            <div class="hud-block score-color">🏃 <span id="score">0</span>m <span style="color:#ff007f" id="multiplier">X1</span></div>
            <div class="hud-block" style="color: #ff007f">🛹 <span id="hud-boards">0</span></div>
            <div class="hud-block coin-color">🪙 <span id="coins">0</span></div>
        </div>

        <div id="status-container">
            <div id="tag-magnet" class="status-tag" style="color: #00d2ff; border-left: 4px solid #00d2ff;">🧲 ÍMÃ</div>
            <div id="tag-board" class="status-tag" style="color: #ff007f; border-left: 4px solid #ff007f;">🛹 SKATE</div>
            <div id="tag-frenzy" class="status-tag" style="color: #ffea00; border-left: 4px solid #ffea00;">🚀 FRENESI</div>
        </div>

        <div id="player" class="skin-neon"></div>
        <div id="trail" class="shadow-trail"></div>

        <div id="game-over-screen" class="screen">
            <h1 style="color: #ff0055; font-size: 36px; letter-spacing: 1px; margin-bottom: 5px;">FIM DA CORRIDA</h1>
            <p style="font-size: 16px; margin-bottom: 15px; color: #aaa;">Recorde: <span id="final-score" class="score-color">0</span>m | Carteira: <span id="shop-coins" class="coin-color">0</span> 🪙</p>
            
            <button onclick="resetGame()">CORRER DE NOVO</button>

            <div class="shop-container">
                <div class="shop-title">Selecionar Surfista (Salva Automático)</div>
                <div class="skins-grid">
                    <div class="skin-card active" id="btn-skin-neon" onclick="buySkin('neon', 0)">
                        <div class="skin-preview skin-neon"></div>
                        <span>Neon</span><br><span style="color:#00ffcc">Equipado</span>
                    </div>
                    <div class="skin-card" id="btn-skin-gold" onclick="buySkin('gold', 45)">
                        <div class="skin-preview skin-gold"></div>
                        <span>Ouro</span><br><span id="cost-gold" style="color:#ffd700">45 🪙</span>
                    </div>
                    <div class="skin-card" id="btn-skin-cyber" onclick="buySkin('cyber', 90)">
                        <div class="skin-preview skin-cyber"></div>
                        <span>Cyber</span><br><span id="cost-cyber" style="color:#ff007f">90 🪙</span>
                    </div>
                </div>
            </div>
            <p class="swipe-hint">Dica: Deslize na tela/mouse para controlar</p>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html> <header> <nav> <a> <aside> <h3> <main> <article> <img> <footer>
