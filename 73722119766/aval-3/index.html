
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Ficha de Anamnese</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <h1>Ficha de Anamnese</h1>

  <form id="form">
    <input id="nome" placeholder="Nome" required>
    <input id="idade" type="number" placeholder="Idade" required>
    <input id="peso" type="number" step="0.1" placeholder="Peso" required>
    <input id="altura" type="number" step="0.01" placeholder="Altura" required>
    <button type="submit">Cadastrar</button>
    <p id="erro"></p>
  </form>

  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Nome</th>
        <th>Idade</th>
        <th>Peso</th>
        <th>Altura</th>
        <th>IMC</th>
        <th>Classificação</th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
