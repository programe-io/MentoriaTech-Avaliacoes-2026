
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Minha Lista de Tarefas</h1>
        <p>Organize seu dia de forma simples!</p>
    </header>

    <main class="container">
        <h2>Minhas atividades</h2>

        <div class="entrada">
            <input
                type="text"
                id="campoTarefa"
                placeholder="Digite uma nova tarefa..."
            >
            <button id="botaoAdicionar">Adicionar</button>
        </div>

        <p id="aviso"></p>

        <ul id="listaTarefas">
            <li>
                <span>Estudar programação</span>
                <button class="concluir">Concluir</button>
                <button class="excluir">Excluir</button>
            </li>
        </ul>

        <p id="contador">Tarefas concluídas: 0</p>
    </main>

    <footer>
        <p>Projeto desenvolvido com HTML, CSS e JavaScript.</p>
    </footer>
<script src="script.js"></script></body>
</html>
