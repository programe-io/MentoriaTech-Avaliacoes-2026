
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle Financeiro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Meu Controle Financeiro</h1>
        <p>Organize seu dinheiro e acompanhe seus gastos!</p>
    </header>

    <main class="container">
        <section class="resumo">
            <div class="cartao saldo">
                <h2>Saldo atual</h2>
                <p id="saldo">R$ 0,00</p>
            </div>

            <div class="cartao receita">
                <h2>Receitas</h2>
                <p id="receitas">R$ 0,00</p>
            </div>

            <div class="cartao despesa">
                <h2>Despesas</h2>
                <p id="despesas">R$ 0,00</p>
            </div>
        </section>

        <section class="formulario">
            <h2>Adicionar movimentação</h2>

            <label for="descricao">Descrição</label>
            <input
                type="text"
                id="descricao"
                placeholder="Ex.: Salário, alimentação..."
            >

            <label for="valor">Valor (R$)</label>
            <input
                type="number"
                id="valor"
                placeholder="Ex.: 150,00"
                min="0.01"
                step="0.01"
            >

            <label for="tipo">Tipo de movimentação</label>
            <select id="tipo">
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
            </select>

            <button id="adicionar">Adicionar movimentação</button>
            <p id="aviso"></p>
        </section>

        <section class="historico">
            <h2>Histórico</h2>
            <ul id="lista"></ul>
        </section>
    </main>

    <footer>
        <p>Projeto desenvolvido com HTML, CSS e JavaScript.</p>
    </footer>
<script src="script.js"></script></body>
</html>
