<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBlog Pro</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="container header-content">
            <div>
                <h1>DevBlog Pro</h1>
                <p>Artigos, tutoriais e ideias sobre desenvolvimento web</p>
            </div>
            <button id="toggle-form-btn" class="btn-primary">+ Nova Postagem</button>
        </div>
    </header>

    <main class="container">
        <!-- Formulário Ocultável para Nova Postagem -->
        <section id="form-section" class="card hidden">
            <h2>Escrever Novo Artigo</h2>
            <form id="post-form">
                <div class="form-row">
                    <input type="text" id="post-title" placeholder="Título do artigo" required>
                    <select id="post-category" required>
                        <option value="Tecnologia">Tecnologia</option>
                        <option value="Programação">Programação</option>
                        <option value="Design">Design</option>
                        <option value="Carreira">Carreira</option>
                    </select>
                </div>
                <input type="url" id="post-image" placeholder="URL da imagem de capa (opcional)">
                <textarea id="post-content" placeholder="Escreva o conteúdo completo do artigo..." rows="6" required></textarea>
                <div class="form-actions">
                    <button type="button" id="cancel-form-btn" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Publicar Artigo</button>
                </div>
            </form>
        </section>

        <!-- Barra de Busca e Filtros -->
        <section class="filters-bar">
            <input type="text" id="search-input" placeholder="Buscar artigos por título ou conteúdo...">
            <select id="category-filter">
                <option value="Todas">Todas as Categorias</option>
                <option value="Tecnologia">Tecnologia</option>
                <option value="Programação">Programação</option>
                <option value="Design">Design</option>
                <option value="Carreira">Carreira</option>
            </select>
        </section>

        <!-- Grade de Postagens -->
        <section id="posts-container" class="posts-grid">
            <!-- Os posts serão inseridos aqui via JavaScript -->
        </section>
    </main>

    <!-- Modal para Leitura Completa do Artigo -->
    <div id="post-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <img id="modal-img" src="" alt="Capa do artigo" class="hidden">
            <span id="modal-category" class="badge"></span>
            <h2 id="modal-title"></h2>
            <p id="modal-date" class="date"></p>
            <div id="modal-body" class="modal-body-text"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 DevBlog Pro. Desenvolvido com HTML, CSS e JavaScript puro.</p>
        </div>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
