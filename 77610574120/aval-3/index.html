<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBlog Ultimate</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="container header-content">
            <div class="brand">
                <h1>DevBlog <span>Ultimate</span></h1>
                <p>Plataforma completa de publicação e leitura</p>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="btn-icon" title="Alternar Tema">🌙</button>
                <button id="new-post-btn" class="btn-primary">+ Escrever Artigo</button>
            </div>
        </div>
    </header>    <main class="container">
        <!-- Barra de Controle: Busca, Categoria e Ordenação -->
        <section class="controls-bar">
            <input type="text" id="search-input" placeholder="🔍 Pesquisar por título, conteúdo ou #tag...">
            <select id="category-filter">
                <option value="Todas">Todas as Categorias</option>
                <option value="Tecnologia">Tecnologia</option>
                <option value="Programação">Programação</option>
                <option value="Design">Design</option>
                <option value="Carreira">Carreira</option>
            </select>
            <select id="sort-filter">
                <option value="recent">Mais Recentes</option>
                <option value="popular">Mais Curtidos</option>
            </select>
        </section>

        <!-- Estatísticas Rápidas -->
        <div class="stats-bar">
            <span id="posts-count">0 artigos publicados</span>
            <button id="reset-demo-btn" class="link-btn">Restaurar artigos de exemplo</button>
        </div>

        <!-- Grade de Postagens -->
        <section id="posts-container" class="posts-grid"></section>
    </main>

    <!-- Modal de Criação e Edição de Artigo -->
    <div id="editor-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" data-close="editor-modal">&times;</span>
            <h2 id="editor-title">Novo Artigo</h2>
            <form id="post-form">
                <input type="hidden" id="edit-post-id">
                <div class="form-row">
                    <input type="text" id="post-title" placeholder="Título do artigo" required>
                    <select id="post-category" required>
                        <option value="Tecnologia">Tecnologia</option>
                        <option value="Programação">Programação</option>
                        <option value="Design">Design</option>
                        <option value="Carreira">Carreira</option>
                    </select>
                </div>
                <div class="form-row">
                    <input type="text" id="post-author" placeholder="Nome do autor" required>
                    <input type="text" id="post-tags" placeholder="Tags separadas por vírgula (ex: js, web, css)">
                </div>
                <input type="url" id="post-image" placeholder="URL da imagem de capa (opcional)">
                <textarea id="post-content" placeholder="Escreva o conteúdo do seu artigo..." rows="8" required></textarea>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" data-close="editor-modal">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar Publicação</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Leitura Completa e Comentários -->
    <div id="reader-modal" class="modal hidden">
        <div class="modal-content reader-content">
            <span class="close-btn" data-close="reader-modal">&times;</span>
            <img id="reader-img" src="" alt="Capa" class="hidden">
            <div class="reader-meta">
                <span id="reader-category" class="badge"></span>
                <span id="reader-readtime" class="meta-info"></span>
            </div>
            <h1 id="reader-title"></h1>
            <p id="reader-author-date" class="date"></p>
            <div id="reader-tags" class="tags-container"></div>
            <div id="reader-body" class="modal-body-text"></div>

            <!-- Área de Interação no Leitor -->
            <div class="reader-actions">
                <button id="reader-like-btn" class="btn-secondary">❤️ Curtir (0)</button>
            </div>

            <!-- Seção de Comentários -->
            <div class="comments-section">
                <h3>Comentários (<span id="comments-count">0</span>)</h3>
                <form id="comment-form">
                    <input type="text" id="comment-author" placeholder="Seu nome" required>
                    <textarea id="comment-text" placeholder="Deixe seu comentário..." rows="2" required></textarea>
                    <button type="submit" class="btn-primary">Comentar</button>
                </form>
                <div id="comments-list" class="comments-list"></div>
            </div>
        </div>
    </div>

    <!-- Container de Notificações Toast -->
    <div id="toast-container" class="toast-container"></div>

    <footer>
        <div class="container">
            <p>&copy; 2026 DevBlog Ultimate. Construído com HTML, CSS e JavaScript Moderno.</p>
        </div>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
