<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Blog Dev</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <!-- Cabeçalho -->
  <header class="cabecalho">
    <div class="container cabecalho-conteudo">
      <h1 class="logo">Dev<span>Blog</span></h1>
      <nav class="menu">
        <a href="#inicio">Início</a>
        <a href="#novo-post">Escrever</a>
        <button id="btn-tema" class="btn-tema" aria-label="Alternar tema">🌙 Modo Escuro</button>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal + Barra Lateral -->
  <div id="inicio" class="container layout-principal">
    
    <!-- Área de Postagens -->
    <main class="conteudo-principal">
      <div id="lista-posts" class="lista-posts">
        <!-- Os posts serão inseridos aqui via JavaScript -->
      </div>

      <!-- Formulário para adicionar novo post -->
      <section id="novo-post" class="card-formulario">
        <h2>Publicar Novo Artigo</h2>
        <form id="form-post">
          <div class="campo">
            <label for="titulo">Título do Post</label>
            <input type="text" id="titulo" placeholder="Ex: Introdução ao Flexbox" required>
          </div>
          
          <div class="campo">
            <label for="categoria">Categoria</label>
            <select id="categoria">
              <option value="HTML & CSS">HTML & CSS</option>
              <option value="JavaScript">JavaScript</option>
              <option value="Carreira">Carreira</option>
            </select>
          </div>

          <div class="campo">
            <label for="conteudo">Conteúdo</label>
            <textarea id="conteudo" rows="4" placeholder="Escreva seu artigo aqui..." required></textarea>
          </div>

          <button type="submit" class="btn-primario">Publicar Artigo</button>
        </form>
      </section>
    </main>

    <!-- Barra Lateral (Sidebar) -->
    <aside class="barra-lateral">
      <div class="widget">
        <h3>Buscar</h3>
        <input type="text" id="campo-busca" placeholder="Pesquisar artigos...">
      </div>

      <div class="widget">
        <h3>Categorias</h3>
        <ul class="lista-categorias">
          <li><button class="filtro-cat ativo" data-cat="Todos">Todos</button></li>
          <li><button class="filtro-cat" data-cat="HTML & CSS">HTML & CSS</button></li>
          <li><button class="filtro-cat" data-cat="JavaScript">JavaScript</button></li>
          <li><button class="filtro-cat" data-cat="Carreira">Carreira</button></li>
        </ul>
      </div>

      <div class="widget">
        <h3>Sobre o Autor</h3>
        <p>Desenvolvedor apaixonado por tecnologia, compartilhando anotações e tutoriais práticos de desenvolvimento web.</p>
      </div>
    </aside>

  </div>

  <!-- Rodapé -->
  <footer class="rodape">
    <p>&copy; 2026 DevBlog. Desenvolvido com HTML, CSS e JavaScript.</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
