<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MiniFeed</title>
        <link rel="stylesheet" href="style.css">
    <link href="style.css" rel="stylesheet"></head>
    <body>
        
        <header>

            <div class="header-content">

                <h1>MiniFeed</h1>

                <nav>
                   <a href="#">Inicio</a> 
                   <a href="#">Perfil</a>
                </nav>

            </div>

        </header>

        <main>

           <section class="new-post">

            <div class="user">

                <div class="avatar">
                    J
                </div>

                <div>
                    <strong>Jonathan</strong>
                    <span>O que você está pensando?</span>
                </div>

            </div>

            <button>Publicar</button>


           </section>
           
           <article class="post">

            <div class="post-header">

                <div class="avatar">
                   A
                </div>

                <div>
                    <strong>Artur</strong>
                    <span>Há 10 minutos</span>
                </div>

            </div>

            <div class="post-text">
                Hoje eu vi o menino Ney🤩,
                ele é muito lindo, to feliz :D
            </div>

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyx1WxxTja069GXBgN23Vlt4SxExUtBGocN6KKzMwLlKdUSkeAZi4Qtiwu&s=10" alt="Imagem do Ney">

            <div class="post-actions">

                <button>Curtir</button>
                <button>Comentar</button>

            </div>      


           </article>



        </main>

        <footer>
            <p>MiniFeed - Todos os Direitos Reservados - 2026</p>
        </footer>

    </body>
</html>
