
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsFeed - Notícias</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>NewsFeed 📰</h1>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#noticias">Notícias</a>
            <a href="#sobre">Sobre</a>
        </nav>
    </header>

    <section class="destaque" id="inicio">
        <h2>Fique por dentro de tudo!</h2>
        <p>As principais notícias em um só lugar.</p>
    </section>

    <main>
        <section class="pesquisa">
            <input type="text" id="pesquisa"
            placeholder="Pesquisar notícias...">

            <button onclick="pesquisarNoticias()">Pesquisar</button>
        </section>

        <section class="categorias">
            <button onclick="filtrar('Todas')">Todas</button>
            <button onclick="filtrar('Tecnologia')">Tecnologia</button>
            <button onclick="filtrar('Esportes')">Esportes</button>
            <button onclick="filtrar('Educação')">Educação</button>
            <button onclick="filtrar('Entretenimento')">Entretenimento</button>
        </section>

        <h2 class="titulo" id="noticias">Últimas Notícias</h2>

        <div class="feed" id="feed"></div>

        <button class="carregar" onclick="carregarMais()">
            Carregar mais notícias
        </button>
    </main>

    <section class="sobre" id="sobre">
        <h2>Sobre o NewsFeed</h2>
        <p>
            Nosso objetivo é manter você informado sobre os
            principais acontecimentos do mundo.
        </p>
    </section>

    <footer>
        <p>© 2026 NewsFeed - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
