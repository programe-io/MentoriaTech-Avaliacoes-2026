<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow | Organizador de Estudos</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>StudyFlow 📚</h1>
    <p>Organize seus estudos e alcance seus objetivos.</p>
</header>

<main>
    <section class="resumo">
        <h2>Meu planejamento</h2>
        <p>Total de atividades: <strong id="totalAtividades">0</strong></p>
    </section>

    <section>
        <h2>Nova atividade</h2>

        <form id="atividadeForm">
            <input
                type="text"
                id="titulo"
                placeholder="Nome da atividade"
                required
            >

            <select id="materia" required>
                <option value="">Selecione a matéria</option>
                <option value="Matemática">Matemática</option>
                <option value="Português">Português</option>
                <option value="História">História</option>
                <option value="Geografia">Geografia</option>
                <option value="Biologia">Biologia</option>
                <option value="Programação">Programação</option>
                <option value="Outra">Outra</option>
            </select>

            <input
                type="date"
                id="prazo"
                required
            >

            <select id="tipo" required>
                <option value="">Tipo de atividade</option>
                <option value="Prova">Prova</option>
                <option value="Trabalho">Trabalho</option>
                <option value="Exercício">Exercício</option>
                <option value="Estudo">Estudo</option>
            </select>

            <button type="submit">Cadastrar atividade</button>
        </form>
    </section>

    <section>
        <h2>Atividades cadastradas</h2>
        <div id="listaAtividades"></div>
    </section>
</main>

<footer>
    <p>StudyFlow © 2026 - Organização que transforma resultados.</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
