<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow | Gerenciamento de Estudos</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>StudyFlow 📚</h1>
    <p>Seu planejamento escolar em um só lugar.</p>
</header>

<main>
    <section class="dashboard">
        <div>
            <h3>Total de tarefas</h3>
            <p id="totalTarefas">0</p>
        </div>

        <div>
            <h3>Concluídas</h3>
            <p id="concluidas">0</p>
        </div>

        <div>
            <h3>Pendentes</h3>
            <p id="pendentes">0</p>
        </div>
    </section>

    <section>
        <h2>Adicionar atividade</h2>

        <form id="atividadeForm">
            <input id="titulo" placeholder="Nome da atividade" required>

            <select id="materia" required>
                <option value="">Selecione a matéria</option>
                <option value="Matemática">Matemática</option>
                <option value="Português">Português</option>
                <option value="História">História</option>
                <option value="Geografia">Geografia</option>
                <option value="Biologia">Biologia</option>
                <option value="Programação">Programação</option>
                <option value="Outra">Outra</option>
            </select>

            <input type="date" id="prazo" required>

            <select id="prioridade" required>
                <option value="">Selecione a prioridade</option>
                <option value="Alta">Alta</option>
                <option value="Média">Média</option>
                <option value="Baixa">Baixa</option>
            </select>

            <button type="submit">Adicionar tarefa</button>
        </form>
    </section>

    <section>
        <h2>Meu progresso</h2>
        <div class="progresso">
            <div id="barraProgresso"></div>
        </div>
        <p id="percentual">0% concluído</p>
    </section>

    <section>
        <h2>Minhas atividades</h2>

        <select id="filtro">
            <option value="todas">Todas as atividades</option>
            <option value="pendentes">Pendentes</option>
            <option value="concluidas">Concluídas</option>
        </select>

        <div id="listaAtividades"></div>
    </section>
</main>

<footer>
    <p>StudyFlow © 2026 - Planeje, estude e evolua.</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
