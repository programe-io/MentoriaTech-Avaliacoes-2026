<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header>
      <button class="back">Voltar para o início</button>
        <h1>Área de Entrega - Avaliações</h1>
          <p>
              Aqui você envia seus códigos para correção.
                  Revise antes de publicar e garanta que sua avaliação esteja completa.
                    </p>
                      <p>
                          Finalize seu trabalho, publique seu código e compartilhe
                              sua solução com o professor para ser avaliada.
                                </p>
                                </header>

                                <main>
                                  <section class="editors">

                                      <div class="editor">
                                            <div class="editor-title">
                                                    <span>HTML</span>
                                                            <button class="maximize">Maximizar</button>
                                                                  </div>
                                                                        <textarea id="htmlCode" placeholder="Digite seu código HTML aqui..."></textarea>
                                                                            </div>

                                                                                <div class="editor">
                                                                                      <div class="editor-title">
                                                                                              <span>CSS</span>
                                                                                                      <button class="maximize">Maximizar</button>
                                                                                                            </div>
                                                                                                                  <textarea id="cssCode" placeholder="Digite seu código CSS aqui..."></textarea>
                                                                                                                      </div>

                                                                                                                          <div class="editor full">
                                                                                                                                <div class="editor-title">
                                                                                                                                        <span>JavaScript</span>
                                                                                                                                                <button class="maximize">Maximizar</button>
                                                                                                                                                      </div>
                                                                                                                                                            <textarea id="jsCode" placeholder="Digite seu código JavaScript aqui..."></textarea>
                                                                                                                                                                </div>

                                                                                                                                                                  </section>

                                                                                                                                                                    <section class="preview">
                                                                                                                                                                        <h3>Pré-visualização do Código</h3>
                                                                                                                                                                            <iframe id="preview"></iframe>
                                                                                                                                                                              </section>

                                                                                                                                                                                <button id="publish">
                                                                                                                                                                                    Publicar no GitHub Pages
                                                                                                                                                                                      </button>
                                                                                                                                                                                      </main>
  <script src="script.js"></script>
  
</body>
</html>
