
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

<aside class="sidebar">
    <h1 class="logo">Instagram</h1>

    <nav>
        <a href="#"><i class="fa-solid fa-house"></i> Início</a>
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Pesquisa</a>
        <a href="#"><i class="fa-solid fa-compass"></i> Explorar</a>
        <a href="#"><i class="fa-solid fa-clapperboard"></i> Reels</a>
        <a href="#"><i class="fa-solid fa-paper-plane"></i> Mensagens</a>
        <a href="#"><i class="fa-solid fa-heart"></i> Notificações</a>
        <a href="#" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-square-plus"></i> Criar
        </a>
        <a href="#"><i class="fa-solid fa-user"></i> Perfil</a>
    </nav>
</aside>

<main class="content">

    <section class="stories">
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=12">
            <span>Seu story</span>
        </div>
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=5">
            <span>mariana</span>
        </div>
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=8">
            <span>pedro</span>
        </div>
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=9">
            <span>ana</span>
        </div>
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=15">
            <span>lucas</span>
        </div>
    </section>

    <section class="feed" id="feed">

        <article class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=5">
                <strong>mariana.silva</strong>
                <span>•••</span>
            </div>

            <img class="post-image"
                 src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800">

            <div class="actions">
                <button onclick="likePost(this)">
                    <i class="fa-regular fa-heart"></i>
                </button>
                <button onclick="focusComment(this)">
                    <i class="fa-regular fa-comment"></i>
                </button>
                <button><i class="fa-regular fa-paper-plane"></i></button>
                <button class="save"><i class="fa-regular fa-bookmark"></i></button>
            </div>

            <div class="post-info">
                <strong class="likes">1.234 curtidas</strong>
                <p><strong>mariana.silva</strong> Aproveitando o dia! ❤️</p>
                <div class="comments"></div>
                <input class="comment-input"
                       placeholder="Adicione um comentário..."
                       onkeydown="if(event.key==='Enter') addComment(this)">
            </div>
        </article>

        <article class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=8">
                <strong>pedro.costa</strong>
                <span>•••</span>
            </div>

            <img class="post-image"
                 src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800">

            <div class="actions">
                <button onclick="likePost(this)">
                    <i class="fa-regular fa-heart"></i>
                </button>
                <button onclick="focusComment(this)">
                    <i class="fa-regular fa-comment"></i>
                </button>
                <button><i class="fa-regular fa-paper-plane"></i></button>
                <button class="save"><i class="fa-regular fa-bookmark"></i></button>
            </div>

            <div class="post-info">
                <strong class="likes">856 curtidas</strong>
                <p><strong>pedro.costa</strong> Que lugar incrível! 🌎</p>
                <div class="comments"></div>
                <input class="comment-input"
                       placeholder="Adicione um comentário..."
                       onkeydown="if(event.key==='Enter') addComment(this)">
            </div>
        </article>

    </section>
</main>

<input type="file" id="fileInput" accept="image/*" hidden>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
