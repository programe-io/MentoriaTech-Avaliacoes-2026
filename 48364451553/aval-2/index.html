
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>MiniSocial</h1>
    <nav>
        <a href="#">Início</a>
        <a href="#criar">Publicar</a>
        <a href="#feed">Feed</a>
    </nav>
</header>

<main>

    <section class="criar-post" id="criar">
        <h2>Criar publicação</h2>

        <input type="text" id="nome"
            placeholder="Seu nome">

        <textarea id="texto"
            placeholder="O que você está pensando?"></textarea>

        <input type="text" id="imagem"
            placeholder="URL da imagem (opcional)">

        <button onclick="publicar()">
            Publicar
        </button>
    </section>

    <section class="feed" id="feed">
        <h2>Feed de publicações</h2>

        <div id="publicacoes"></div>
    </section>

</main>

<footer>
    <p>© 2026 MiniSocial - Minha rede social</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
