<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Blog Pessoal</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="header">
    <div class="container header-content">
      <div>
        <h1>Meu Blog Pessoal</h1>
        <p>Notas sobre tecnologia, rotina e aprendizado contínuo.</p>
      </div>
      <div class="controls">
        <input type="search" id="searchInput" placeholder="Buscar posts..." aria-label="Buscar posts" />
        <select id="categoryFilter" aria-label="Filtrar por categoria">
          <option value="all">Todas as categorias</option>
          <option value="Dev">Dev</option>
          <option value="Vida">Vida</option>
          <option value="Livros">Livros</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="postsGrid" class="posts-grid" aria-live="polite"></section>
  </main>

  <dialog id="postModal" class="modal">
    <article id="modalContent" class="modal-content"></article>
    <button id="closeModal" class="btn-close" aria-label="Fechar artigo">Fechar</button>
  </dialog>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Meu Blog Pessoal. Feito com HTML, CSS e JS.</p>
    </div>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
