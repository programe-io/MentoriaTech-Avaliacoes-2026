<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InstaFeed</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="logo">InstaFeed</h1>
      <button id="newPostBtn" class="btn-new" aria-label="Novo post">+ Postar</button>
    </div>
  </header>

  <main class="feed-container">
    <section id="stories" class="stories" aria-label="Stories"></section>
    <section id="feed" class="feed" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
