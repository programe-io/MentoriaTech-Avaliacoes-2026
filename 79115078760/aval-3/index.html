
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iChat - Mensagens</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="app">

    <!-- TELA DE CONVERSAS -->
    <main id="home-screen">

        <header class="top-header">
            <span class="header-small">Edit</span>
            <h1>Chats</h1>
            <button onclick="newChat()">＋</button>
        </header>

        <div class="search-area">
            <input type="search" id="search"
            placeholder="🔍 Search">
        </div>

        <div class="archive">
            <span>📦</span> Archived
        </div>

        <div id="chat-list"></div>

    </main>

    <!-- TELA DE CONVERSA -->
    <main id="conversation-screen" class="hidden">

        <header class="chat-header">

            <button onclick="goBack()">‹</button>

            <img id="chat-avatar" src="" alt="">

            <div class="chat-info">
                <h3 id="chat-name">Contato</h3>
                <small id="chat-status">online</small>
            </div>

            <button onclick="alert('Chamada de voz demonstrativa')">📞</button>
            <button onclick="alert('Chamada de vídeo demonstrativa')">📹</button>

        </header>

        <div id="messages"></div>

        <form id="message-form">

            <button type="button" class="plus"
            onclick="alert('Anexos demonstrativos')">＋</button>

            <input type="text" id="message-input"
            placeholder="Message" autocomplete="off">

            <button type="submit" class="send">➤</button>

        </form>

    </main>

    <!-- NAVEGAÇÃO -->
    <nav class="bottom-nav">

        <button onclick="changeTab('status')">
            <span>◉</span>
            Updates
        </button>

        <button onclick="changeTab('calls')">
            <span>☎</span>
            Calls
        </button>

        <button onclick="changeTab('communities')">
            <span>👥</span>
            Communities
        </button>

        <button onclick="changeTab('home')">
            <span>●</span>
            Chats
        </button>

        <button onclick="changeTab('settings')">
            <span>⚙</span>
            Settings
        </button>

    </nav>

</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
