```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Cadastre e organize suas tarefas</p>
    </header>

    <main>

        <section>
            <h2>Cadastrar nova tarefa</h2>

            <form id="formTarefa">

                <label for="titulo">Título da tarefa:</label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Ex: Estudar JavaScript"
                >

                <label for="prioridade">Prioridade:</label>

                <select id="prioridade">

                    <option value="">
                        Selecione a prioridade
                    </option>

                    <option value="1">
                        1 - Alta
                    </option>

                    <option value="2">
                        2 - Média
                    </option>

                    <option value="3">
                        3 - Baixa
                    </option>

                </select>

                <button type="submit">
                    Cadastrar
                </button>

            </form>

            <p id="mensagem"></p>

        </section>


        <section>

            <h2>Minhas tarefas</h2>

            <div id="listaTarefas">

                <p>Nenhuma tarefa cadastrada.</p>

            </div>

        </section>

    </main>


    <!-- MODAL DE ALTERAR PRIORIDADE -->

    <div id="modalPrioridade" class="modal">

        <div class="modal-conteudo">

            <button
                id="fecharModal"
                class="fechar-modal">
                &times;
            </button>

            <h2>Alterar prioridade</h2>

            <p>
                Selecione a nova prioridade da tarefa:
            </p>

            <select id="novaPrioridade">

                <option value="1">
                    1 - Alta
                </option>

                <option value="2">
                    2 - Média
                </option>

                <option value="3">
                    3 - Baixa
                </option>

            </select>

            <div class="botoes-modal">

                <button
                    id="cancelarModal"
                    class="btn-cancelar">
                    Cancelar
                </button>

                <button
                    id="salvarPrioridade"
                    class="btn-salvar">
                    Salvar
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
```
