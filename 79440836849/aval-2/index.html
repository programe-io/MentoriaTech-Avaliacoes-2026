<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulsoSocial — Mini Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Cabeçalho -->
  <header class="navbar">
    <div class="navbar-container">
      <div class="brand">
        <span class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
          </svg>
        </span>
        <h1>PulsoSocial</h1>
      </div>

      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Buscar posts ou pessoas..." autocomplete="off" />
      </div>

      <button id="theme-toggle" class="icon-btn" title="Alternar tema" aria-label="Alternar tema">
        <svg id="theme-icon-sun" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container">
    <!-- Criador de Postagem -->
    <section class="composer-card" aria-label="Criar nova publicação">
      <div class="composer-top">
        <div class="avatar user-avatar">VC</div>
        <div class="composer-body">
          <div class="composer-user-info">
            <span class="user-name">Você</span>
            <span class="user-handle">@voce</span>
          </div>
          <textarea
            id="post-input"
            rows="3"
            maxlength="280"
            placeholder="O que está acontecendo agora?"
          ></textarea>

          <!-- Pré-visualização de Imagem -->
          <div id="image-preview-wrapper" class="image-preview-wrapper hidden">
            <img id="image-preview" src="" alt="Pré-visualização da imagem" />
            <button type="button" id="remove-image-btn" class="remove-img-btn" title="Remover imagem">&times;</button>
          </div>

          <!-- Input opcional de URL de imagem -->
          <div id="url-input-wrapper" class="url-input-wrapper hidden">
            <input type="url" id="image-url-input" placeholder="Cole o link de uma imagem (https://...)" />
          </div>
        </div>
      </div>

      <div class="composer-footer">
        <div class="composer-actions">
          <label for="image-file-input" class="action-pill" title="Enviar foto do dispositivo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>Foto</span>
            <input type="file" id="image-file-input" accept="image/*" class="hidden" />
          </label>

          <button type="button" id="toggle-url-btn" class="action-pill" title="Adicionar link de imagem">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <span>Link</span>
          </button>
        </div>

        <div class="composer-submit">
          <span id="char-counter" class="char-counter">280</span>
          <button type="button" id="publish-btn" class="btn-primary" disabled>Publicar</button>
        </div>
      </div>
    </section>

    <!-- Abas de Filtro -->
    <nav class="feed
  <script src="script.js"></script>
  
</body>
</html>
