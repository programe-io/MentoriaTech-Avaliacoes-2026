
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Controle de IMC</h1>
        <p>Cadastre seus dados para calcular o IMC.</p>

        <form id="form-imc">
            <label for="nome">Nome do paciente:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" placeholder="Ex: 70" step="0.1" min="0.1" required>

            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01" min="0.1" required>

            <button type="submit">Calcular IMC</button>
        </form>

        <div id="resultado" hidden>
            <h2>Resultado do IMC</h2>
            <p id="resultado-nome"></p>
            <p id="resultado-peso"></p>
            <p id="resultado-altura"></p>
            <p id="resultado-imc"></p>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
