<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gerenciamento de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h1>Gerenciador de Tarefas</h1>

    <!-- Formulário de Cadastro -->
    <div class="form-group">
      <input type="text" id="tituloTarefa" placeholder="Título da tarefa (mínimo 5 caracteres)" />
      
      <select id="prioridadeTarefa">
        <option value="1">Prioridade 1 (Alta)</option>
        <option value="2">Prioridade 2 (Média)</option>
        <option value="3">Prioridade 3 (Baixa)</option>
      </select>

      <button id="btnCadastrar">Cadastrar Tarefa</button>
    </div>

    <div id="mensagemErro" class="mensagem-erro"></div>

    <!-- Tabela de Listagem de Tarefas -->
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Título</th>
          <th>Prioridade</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaTarefas">
        <!-- As tarefas serão renderizadas aqui via JavaScript -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
