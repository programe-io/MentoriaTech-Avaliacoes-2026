<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Sidebar / Barra de Navegação -->
  <aside class="sidebar">
    <div class="logo">Instagram</div>
    
    <nav class="nav-links">
      <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i><span>Página inicial</span></a>
      <a href="#" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Pesquisa</span></a>
      <a href="#" class="nav-item"><i class="fa-regular fa-compass"></i><span>Explorar</span></a>
      <a href="#" class="nav-item"><i class="fa-regular fa-paper-plane"></i><span>Mensagens</span></a>
      <a href="#" class="nav-item"><i class="fa-regular fa-heart"></i><span>Notificações</span></a>
      <a href="#" id="open-modal-btn" class="nav-item"><i class="fa-regular fa-square-plus"></i><span>Criar</span></a>
      <a href="#" class="nav-item">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop" class="profile-pic-sm" alt="Perfil">
        <span>Perfil</span>
      </a>
    </nav>

    <button id="theme-toggle" class="nav-item theme-btn">
      <i class="fa-solid fa-moon"></i><span>Alternar Tema</span>
    </button>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <div class="feed-container">

      <!-- Seção de Stories -->
      <section class="stories-container">
        <div class="story">
          <div class="story-ring">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Seu story">
          </div>
          <span>Seu story</span>
        </div>
        <div class="story">
          <div class="story-ring active">
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150" alt="ana_silva">
          </div>
          <span>ana_silva</span>
        </div>
        <div class="story">
          <div class="story-ring active">
            <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150" alt="carlos_dev">
          </div>
          <span>carlos_dev</span>
        </div>
        <div class="story">
          <div class="story-ring active">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" alt="marina_r">
          </div>
          <span>marina_r</span>
        </div>
      </section>

      <!-- Feed de Publicações -->
      <section id="feed" class="posts-container"></section>

    </div>
  </main>

  <!-- Modal para Criar Publicação -->
  <div id="create-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Criar nova publicação</h3>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>
      <form id="create-post-form" class="modal-body">
        <input type="url" id="post-image-url" placeholder="URL da imagem (ex: Unsplash)" required>
        <textarea id="post-caption" placeholder="Escreva uma legenda..." rows="3" required></textarea>
        <input type="text" id="post-location" placeholder="Localização (opcional)">
        <button type="submit" class="submit-btn">Compartilhar</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
