<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <!-- Importação de ícones (Font Awesome) para os botões -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <header class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <img src="https://wikimedia.org" alt="Instagram Logo">
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Pesquisar">
            </div>
            <nav class="nav-menu">
                <a href="#"><i class="fa-solid fa-house"></i></a>
                <a href="#"><i class="fa-regular fa-paper-plane"></i></a>
                <a href="#"><i class="fa-regular fa-square-plus"></i></a>
                <a href="#"><i class="fa-regular fa-compass"></i></a>
                <a href="#"><i class="fa-regular fa-heart"></i></a>
                <div class="nav-profile">
                    <img src="https://i.pinimg.com/736x/03/ac/c0/03acc030c6700dfd274d1ef20e70609b.jpg" alt="Seu Perfil">
                    <span>Seu Perfil</span>
                </div>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <div class="feed-column">
            
            
            <section class="stories-container">
                <div class="story-item">
                    <div class="profile-ring active-story">
                        <img src="https://i.pinimg.com/736x/03/ac/c0/03acc030c6700dfd274d1ef20e70609b.jpg" alt="Seu Story">
                    </div>
                    <span>Seu Story</span>
                </div>
                <div class="story-item">
                    <div class="profile-ring">
                        <img src="https://lens.usercontent.google.com/image?vsrid=CP2EtZKOnNHYjwEQAhgBIiQ2NGRjOWExYy0yNDhkLTQ1N2MtOTFhOS02MGNiMjEzNmNiOWEyggEiAm5uKAdCdAoubGZlLWR1bW15OmFiMWM1NzU2LWM3NjItNDE0Mi1iZjIzLTU1ZDY4MTM0N2RkNxJCCkAvYm5zL25uL2Jvcmcvbm4vYm5zL2xlbnMtZnJvbnRlbmQtYXBpL3Byb2QubGVucy1mcm9udGVuZC1hcGkvMTI5WgQKAm5uONKQrbjh8ZcD&gsessionid=DoF8XBOVtp8mOAHa6RACORrWBeAJsL96E4C0Peh6AJBFI7JHE3RgQQ" alt="fernando">
                    </div>
                    <span>fernando</span>
                </div>
                <div class="story-item">
                    <div class="profile-ring">
                        <img src="https://pub-static.fotor.com/assets/projects/pages/d5bdd0513a0740a8a38752dbc32586d0/fotor-03d1a91a0cec4542927f53c87e0599f6.jpg" alt="patricia">
                    </div>
                    <span>patricia</span>
                </div>
                <div class="story-item">
                    <div class="profile-ring">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyUImKbm-l-pT4LT_iSmJAwUSh91rFzxGTC94m3DG0TghsCEZnERmXAgE&s=10" alt="joao">
                    </div>
                    <span>joao</span>
                </div>
            </section>

            
            <article class="post-card">
                
                <header class="post-header">
                    <div class="post-user-info">
                        <img src="https://static.wikia.nocookie.net/liga-da-zueira-oficial/images/3/32/Earth616_PeterParker_Render_NoiseRemoval.png/revision/latest?cb=20210203001438&path-prefix=pt-br" alt="frojho_dev" class="post-avatar">
                        <div class="user-text">
                            <span class="username">frojho_dev</span>
                            <span class="location">Parnaíba, Pi</span>
                        </div>
                    </div>
                    <button class="btn-options"><i class="fa-solid fa-ellipsis"></i></button>
                </header>

            
                <div class="post-image-placeholder">
                    
                </div>

            
                <div class="post-actions">
                    <div class="left-actions">
                        <button><i class="fa-regular fa-heart"></i></button>
                        <button><i class="fa-regular fa-comment"></i></button>
                        <button><i class="fa-regular fa-paper-plane"></i></button>
                    </div>
                    <button class="btn-save"><i class="fa-regular fa-bookmark"></i></button>
                </div>

                
                <div class="post-content">
                    <p class="likes-count">1.234 curtidas</p>
                    <p class="caption">
                        <span class="username">frojho_dev</span> 
                        Aprendendo layout responsivo com CSS Grid e Flexbox! 📦 O segredo é começar pelo mobile e ir expandindo. <span class="hashtag">#CSS #WebDev</span>
                    </p>
                    <button class="view-comments">Ver todos os 42 comentários</button>
                    <time class="post-time">HÁ 2 HORAS</time>
                </div>
            </article>

        </div>
    </main>

</body>
</html>
