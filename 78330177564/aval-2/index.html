<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" 
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    
    <header class="navbar">
        <div class="nav-container">
            <h1 class="logo">MiniFeed</h1>
            <nav class="nav-links">
                <a href="#" class="nav-item">Início</a>
                <a href="#" class="nav-item">Perfil</a>
            </nav>
        </div>
    </header>

    
    <main class="feed-container">

        <!-- CARD DE CRIAÇÃO DE POST (JONATHAN) -->
        <section class="card create-post">
            <div class="avatar purple-avatar">J</div>
            <div class="post-input-container">
                <span class="user-name">Jonathan</span>
                <input type="text" placeholder="O que você está pensando?" id="post-text">
            </div>
            <button type="button" id="btn-publish">Publicar</button>
        </section>

        
        <article class="card feed-post">
            <div class="post-header">
                <div class="avatar magenta-avatar">M</div>
                <div class="post-meta">
                    <span class="author-name">mariana</span>
                    <span class="post-time">Há 10 minutos</span>
                </div>
            </div>
            
            <p class="post-content">Hoje eu vi o novo filme do homiranha, top, to feliz :D</p>
            
            <!-- Imagem do Homem-Aranha com olhos brilhantes -->
            <div class="post-image-wrapper">
                <img src="https://s2-gshow.glbimg.com/YEwqO_RZfvDhdT6I3NyDyYkuKB0=/0x0:1440x1920/984x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_e84042ef78cb4708aeebdf1c68c6cbd6/internal_photos/bs/2026/Y/P/QVgqwESFKbXDWtDqqvGg/671244438-18575616190038906-3696831745575381725-n.jpg" alt="Homem-Aranha">
            </div>

            
            <div class="post-actions">
                <button type="button" class="btn-action">Curtir</button>
                <button type="button" class="btn-action">Comentar</button>
            </div>
        </article>

    </main>

    
    <footer>
        <p>&copy; 2026 MiniFeed - Mentoria Tech</p>
    </footer>

    
    <script>
        document.getElementById('btn-publish').addEventListener('click', () => {
            const input = document.getElementById('post-text');
            if(input.value.trim() !== "") {
                alert('Post enviado com sucesso: ' + input.value);
                input.value = "";
            }
        });
    </script>
</body>
</html>
