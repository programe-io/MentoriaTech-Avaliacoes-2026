<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="header-content">
      <h1>Mini Feed</h1>
      <nav>
        <a href="#">Início</a>
        <a href="#">Perfil</a>
      </nav>
    </div>
  </header>

  <!-- MAIN (FEED) -->
  <main>
    <!-- ÁREA DE NOVA PUBLICAÇÃO -->
    <section class="new-post">
      <div class="user">
        <div class="avatar">B</div>
        <div>
          <strong>Breno Cruz</strong>
          <span>O que você está pensando?</span>
        </div>
      </div>
      <button type="button">Publicar</button>
    </section>

    <!-- POSTAGEM 1 -->
    <article>
      <div class="post-header user">
        <div class="avatar">J</div>
        <div>
          <strong>Jonathan</strong>
          <span>há 10 minutos</span>
        </div>
      </div>
      <p class="post-text">Assistindo ao novo filme do Homem-Aranha! Incrível demais!</p>
      <img src="https://via.placeholder.com/600x350" alt="Cena do filme do Homem-Aranha" class="post-image">
      <div class="post-actions">
        <button type="button">Curtir</button>
        <button type="button">Comentar</button>
      </div>
    </article>

    <!-- POSTAGEM 2 -->
    <article>
      <div class="post-header user">
        <div class="avatar">M</div>
        <div>
          <strong>Maria Santos</strong>
          <span>há 2 horas</span>
        </div>
      </div>
      <p class="post-text">Estudando Flexbox e posicionamento no CSS hoje. Prática leva à perfeição!</p>
      <div class="post-actions">
        <button type="button">Curtir</button>
        <button type="button">Comentar</button>
      </div>
    </article>
  </main>

  <!-- RODAPÉ -->
  <footer>
    <p>&copy; 2026 Mini Feed. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
