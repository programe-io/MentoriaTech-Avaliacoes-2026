<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Stock</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Sistema de Gestão de Stock</h1>

        <!-- Div para exibição de mensagens de erro ou sucesso -->
        <div id="mensagem" class="mensagem hidden"></div>

        <!-- Formuário de Cadastro -->
        <section class="card">
            <h2>Cadastrar Produto</h2>
            <form id="form-cadastro">
                <div class="form-group">
                    <label for="descricao">Descrição (mínimo 5 carateres):</label>
                    <input type="text" id="descricao" required placeholder="Ex: Cadeira gamer">
                </div>
                <div class="form-group">
                    <label for="quantidade">Quantidade (maior que 0):</label>
                    <input type="number" id="quantidade" min="1" required placeholder="Ex: 12">
                </div>
                <div class="form-group">
                    <label for="valor">Valor (maior ou igual a 0):</label>
                    <input type="number" id="valor" step="0.01" min="0" required placeholder="Ex: 699.00">
                </div>
                <button type="submit" class="btn-primary">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Formulários de Atualização -->
        <section class="card-inline">
            <div class="card">
                <h2>Alterar Valor</h2>
                <form id="form-atualizar-valor">
                    <div class="form-group">
                        <label for="codigo-val">Código do Produto:</label>
                        <input type="number" id="codigo-val" required placeholder="Ex: 1">
                    </div>
                    <div class="form-group">
                        <label for="novo-valor">Novo Valor:</label>
                        <input type="number" id="novo-valor" step="0.01" min="0" required placeholder="Ex: 650.00">
                    </div>
                    <button type="submit" class="btn-secondary">Atualizar Valor</button>
                </form>
            </div>

            <div class="card">
                <h2>Somar Quantidade</h2>
                <form id="form-atualizar-qtd">
                    <div class="form-group">
                        <label for="codigo-qtd">Código do Produto:</label>
                        <input type="number" id="codigo-qtd" required placeholder="Ex: 1">
                    </div>
                    <div class="form-group">
                        <label for="nova-qtd">Quantidade a Adicionar:</label>
                        <input type="number" id="nova-qtd" min="1" required placeholder="Ex: 3">
                    </div>
                    <button type="submit" class="btn-secondary">Adicionar Quantidade</button>
                </form>
            </div>
        </section>

        <!-- Tabela de Produtos -->
        <section class="card">
            <h2>Produtos em Stock</h2>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor (R$)</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos">
                    <!-- Linhas inseridas via JavaScript -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
