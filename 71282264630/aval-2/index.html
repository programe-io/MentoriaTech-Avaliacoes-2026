<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <!-- Mensagens de feedback (sucesso ou erro) -->
        <div id="mensagem" class="mensagem hidden"></div>

        <!-- Formulário de Cadastro -->
        <section class="card">
            <h2>Nova Tarefa</h2>
            <form id="form-cadastrar">
                <div class="form-group">
                    <label for="titulo">Título (mínimo 5 carateres):</label>
                    <input type="text" id="titulo" placeholder="Ex: Preparar relatório semanal" required>
                </div>
                <div class="form-group">
                    <label for="prioridade">Prioridade (1 - Alta, 2 - Média, 3 - Baixa):</label>
                    <input type="number" id="prioridade" min="1" max="3" placeholder="1 a 3" required>
                </div>
                <button type="submit" class="btn-primario">Cadastrar Tarefa</button>
            </form>
        </section>

        <!-- Busca de Tarefa por Código -->
        <section class="card">
            <h2>Buscar Tarefa por Código</h2>
            <div class="busca-container">
                <input type="number" id="input-busca" placeholder="Digite o código da tarefa">
                <button onclick="executarBusca()" class="btn-secundario">Buscar</button>
                <button onclick="limparBusca()" class="btn-limpar">Mostrar Todas</button>
            </div>
            <div id="resultado-busca" class="resultado-busca hidden"></div>
        </section>

        <!-- Exibição Visual das Tarefas (Cartões) -->
        <section class="card">
            <h2>Tarefas Cadastradas</h2>
            <div id="lista-tarefas" class="grid-tarefas">
                <!-- Cartões das tarefas gerados via JS -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
