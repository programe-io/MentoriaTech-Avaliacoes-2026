<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Pro</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="app-container">
        <!-- Cabeçalho e Painel de Estatísticas -->
        <header class="app-header">
            <h1>Painel de Tarefas</h1>
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">Total</span>
                    <span id="stat-total" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Em Execução</span>
                    <span id="stat-pendentes" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Concluídas</span>
                    <span id="stat-concluidas" class="stat-value">0</span>
                </div>
            </div>
        </header>

        <!-- Div de Alertas / Notificações -->
        <div id="mensagem" class="mensagem hidden"></div>

        <!-- Formulário Avançado de Cadastro -->
        <section class="card">
            <h2>Nova Tarefa</h2>
            <form id="form-tarefa">
                <div class="form-row">
                    <div class="form-group flex-2">
                        <label for="input-titulo">Título (mínimo 5 caracteres):</label>
                        <input type="text" id="input-titulo" placeholder="Ex: Desenvolver a renderização da interface" required>
                    </div>
                    <div class="form-group flex-1">
                        <label for="input-prioridade">Prioridade:</label>
                        <select id="input-prioridade" required>
                            <option value="1">1 - Alta</option>
                            <option value="2" selected>2 - Média</option>
                            <option value="3">3 - Baixa</option>
                        </select>
                    </div>
                    <div class="form-group flex-1">
                        <label for="input-categoria">Categoria:</label>
                        <select id="input-categoria">
                            <option value="Trabalho">Trabalho</option>
                            <option value="Estudo">Estudo</option>
                            <option value="Pessoal">Pessoal</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar Tarefa</button>
            </form>
        </section>

        <!-- Barra de Ferramentas (Filtros e Pesquisa) -->
        <section class="card toolbar-card">
            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="input-busca" placeholder="Pesquisar por título...">
                </div>
                <div class="filter-group">
                    <button class="btn-filter active" data-filter="todas">Todas</button>
                    <button class="btn-filter" data-filter="pendentes">Em Execução</button>
                    <button class="btn-filter" data-filter="concluidas">Concluídas</button>
                </div>
            </div>
        </section>

        <!-- Container de Renderização Dinâmica -->
        <section class="card">
            <div class="list-header">
                <h2>Lista de Tarefas</h2>
                <button id="btn-limpar-concluidas" class="btn btn-danger-outline btn-sm">Limpar Concluídas</button>
            </div>
            <ul id="lista-tarefas" class="tarefas-list">
                <!-- Itens li gerados dinamicamente via render() em JS -->
            </ul>
        </section>
    </div>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
