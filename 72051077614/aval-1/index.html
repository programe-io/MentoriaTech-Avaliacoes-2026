<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
    <header class="cabecalho">
        <h1>Cadastro de Produtos</h1>
        <p>Gerencie seus produtos e seu estoque</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" placeholder="Ex.: Motor elétrico" minlength="5" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="1" step="1" placeholder="Ex.: 150" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor unitário (R$)</label>
                    <input type="number" id="valor" min="0" step="0.01" placeholder="Ex.: 4500.00" required>
                </div>

                <div class="botoes">
                    <button type="submit" class="btn btn-principal">
                        Cadastrar produto
                    </button>

                    <button type="reset" class="btn btn-secundario">
                        Limpar
                    </button>
                </div>
            </form>

            <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
        </section>

        <section class="card">
            <h2>Produtos cadastrados</h2>

            <div class="busca">
                <label for="buscaCodigo">Buscar por código</label>
                <div class="busca-linha">
                    <input type="number" id="buscaCodigo" min="1" step="1" placeholder="Digite o código">

                    <button type="button" id="btnBuscar" class="btn btn-principal">
                        Buscar
                    </button>

                    <button type="button" id="btnMostrarTodos" class="btn btn-secundario">
                        Mostrar todos
                    </button>
                </div>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor unitário</th>
                            <th>Valor em estoque</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="6" class="vazio">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Sistema de gerenciamento de produtos</p>
    </footer>
    <script src="app.js" defer></script>
<script src="script.js"></script></body>

</html>
