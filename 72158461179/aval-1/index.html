
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <div class="formulario">
            <h2>Novo Produto</h2>

            <input type="text" id="descricao" placeholder="Descrição do produto">

            <input type="number" id="quantidade" placeholder="Quantidade">

            <input type="number" id="valor" placeholder="Valor (R$)" step="0.01">

            <button onclick="cadastrarProduto()">Cadastrar Produto</button>
        </div>

        <div class="formulario">
            <h2>Atualizar Produto</h2>

            <input type="number" id="codigo" placeholder="Código do produto">

            <input type="number" id="novoValor" placeholder="Novo valor (R$)" step="0.01">

            <button onclick="atualizarValor()">Atualizar Valor</button>

            <input type="number" id="novaQuantidade" placeholder="Quantidade para adicionar">

            <button onclick="atualizarQuantidade()">Adicionar Quantidade</button>
        </div>

        <h2>Lista de Produtos</h2>

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos"></tbody>
            </table>
        </div>

        <p id="mensagem"></p>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
