<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mini Feed</title>
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="insta-container">
        <!-- Cabeçalho -->
        <div class="insta-header">
            <div class="insta-avatar">Foto</div>
            <div class="insta-info">
                <h2>meu_perfil_simples</h2>
                <p>Apenas registrando momentos 📸</p>
            </div>
        </div>

        <!-- Post 1 -->
        <div class="insta-post">
            <div class="post-author">
                <span></span> meu_perfil_simples
            </div>
            <div class="post-image">
                [Espaço para Imagem 1]
            </div>
            <div class="post-actions">
                ❤️ 💬 ✈️
            </div>
            <div class="post-caption">
                <strong>meu_perfil_simples</strong> Dia nublado por aqui ☁️
            </div>
        </div>

        <!-- Post 2 -->
        <div class="insta-post">
            <div class="post-author">
                <span></span> meu_perfil_simples
            </div>
            <div class="post-image">
                [Espaço para Imagem 2]
            </div>
            <div class="post-actions">
                ❤️ 💬 ✈️
            </div>
            <div class="post-caption">
                <strong>meu_perfil_simples</strong> Café da tarde ☕
            </div>
        </div>
    </div>

</body>
</html>
