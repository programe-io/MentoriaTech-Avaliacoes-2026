<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="navbar">
  <div class="nav-container">
    <h1 class="logo">Instagram</h1>
    <input type="text" class="search-bar" placeholder="Pesquisar...">
    <div class="nav-icons">
      <span>🏠</span>
      <span>💬</span>
      <span>➕</span>
      <span>❤️</span>
      <img src="https://pravatar.cc" alt="Perfil" class="nav-avatar">
    </div>
  </div>
</header>

<main class="main-container">
  <!-- Seção de Stories -->
  <section class="stories-container">
    <div class="story">
      <div class="story-ring">
        <img src="https://pravatar.cc" alt="Seu story">
      </div>
      <span>Seu story</span>
    </div>
    <div class="story">
      <div class="story-ring">
        <img src="https://pravatar.cc" alt="ana.silva">
      </div>
      <span>ana.silva</span>
    </div>
    <div class="story">
      <div class="story-ring">
        <img src="https://pravatar.cc" alt="carlos_dev">
      </div>
      <span>carlos_dev</span>
    </div>
    <div class="story">
      <div class="story-ring">
        <img src="https://pravatar.cc" alt="mariana.arte">
      </div>
      <span>mariana.arte</span>
    </div>
    <div class="story">
      <div class="story-ring">
        <img src="https://pravatar.cc" alt="viagens.br">
      </div>
      <span>viagens.br</span>
    </div>
  </section>

  <!-- Feed de Publicações -->
  <section id="feed" class="feed-container">
    <!-- Os posts serão inseridos aqui pelo JavaScript -->
  </section>
</main>
  <script src="script.js"></script>
  
</body>
</html>
