<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página com Span</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: grid;
      grid-template-areas:
        "header header"
        "nav nav"
        "aside main";
      grid-template-columns: 200px 1fr;
    }

    header {
      grid-area: header;
      background: #222;
      color: white;
      padding: 20px;
    }

    nav {
      grid-area: nav;
      background: #444;
      padding: 10px;
    }

    aside {
      grid-area: aside;
      background: #f2f2f2;
      padding: 15px;
    }

    main {
      grid-area: main;
      padding: 15px;
    }

    article {
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 10px 0;
    }

    .destaque {
      color: red;
      font-weight: bold;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

  <header>
    <h1>Meu Site <span class="destaque">Novo</span></h1>
  </header>

  <nav>
    <a href="#">Home</a> |
    <a href="#">Sobre</a> |
    <a href="#">Contato</a>
  </nav>

  <aside>
    <h2>Menu lateral</h2>
    <p>Links e informações extras aqui.</p>
    <span>Atualizado recentemente</span>
  </aside>

  <main>
    <article>
      <h2>Artigo 1</h2>
      <img src="https://via.placeholder.com/600x250" alt="Imagem exemplo">
      <p>
        Este é um <span class="destaque">exemplo importante</span> dentro do artigo.
      </p>
    </article>

    <article>
      <h2>Artigo 2</h2>
      <p>
        Texto normal com um <span>trecho em span</span> apenas para destaque leve.
      </p>
    </article>

    <div>
      <p>Este é um <span>div com span</span> dentro do conteúdo principal.</p>
    </div>
  </main>

<script src="script.js"></script></body>
</html>
