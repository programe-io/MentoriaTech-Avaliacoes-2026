<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos no JavaScript</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>Eventos no JavaScript</h1>
  </header>

  <main>
    <!-- Exemplo 1: Botão com clique único -->
    <section class="card">
      <h2>1. Evento de Clique Único (once)</h2>
      <button id="btnAcao">Acionar ação (Apenas 1 vez)</button>
      <p id="msgAcao"></p>
    </section>

    <!-- Exemplo 2: Projeto Prático - Soma de dois valores -->
    <section class="card">
      <h2>2. Calculadora de Soma</h2>
      <form id="formSoma">
        <div class="input-group">
          <label for="valor1">Primeiro valor:</label>
          <input type="number" id="valor1" placeholder="Digite o primeiro número" step="any" required>
        </div>

        <div class="input-group">
          <label for="valor2">Segundo valor:</label>
          <input type="number" id="valor2" placeholder="Digite o segundo número" step="any" required>
        </div>

        <button type="button" id="btnSomar">Somar valores</button>
      </form>

      <p id="resultadoSoma" class="resultado"></p>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
