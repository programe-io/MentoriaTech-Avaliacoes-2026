<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Minecraft</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <h1>⛏️ MINI MINECRAFT</h1>

    <div id="informacoes">
        🧱 Blocos: <span id="blocos">20</span>
        |
        ❤️ Vida: <span id="vida">100</span>
    </div>

    <div id="jogo">

        <!-- Céu -->
        <div class="ceu"></div>

        <!-- Sol -->
        <div id="sol">☀️</div>

        <!-- Jogador -->
        <div id="jogador">
            🧑
        </div>

        <!-- Mundo -->
        <div id="mundo">

            <div class="bloco grama" style="left:0px; top:350px;"></div>
            <div class="bloco grama" style="left:50px; top:350px;"></div>
            <div class="bloco grama" style="left:100px; top:350px;"></div>
            <div class="bloco grama" style="left:150px; top:350px;"></div>
            <div class="bloco grama" style="left:200px; top:350px;"></div>
            <div class="bloco grama" style="left:250px; top:350px;"></div>
            <div class="bloco grama" style="left:300px; top:350px;"></div>
            <div class="bloco grama" style="left:350px; top:350px;"></div>
            <div class="bloco grama" style="left:400px; top:350px;"></div>
            <div class="bloco grama" style="left:450px; top:350px;"></div>
            <div class="bloco grama" style="left:500px; top:350px;"></div>
            <div class="bloco grama" style="left:550px; top:350px;"></div>
            <div class="bloco grama" style="left:600px; top:350px;"></div>
            <div class="bloco grama" style="left:650px; top:350px;"></div>
            <div class="bloco grama" style="left:700px; top:350px;"></div>
            <div class="bloco grama" style="left:750px; top:350px;"></div>

            <div class="bloco terra" style="left:0px; top:400px;"></div>
            <div class="bloco terra" style="left:50px; top:400px;"></div>
            <div class="bloco terra" style="left:100px; top:400px;"></div>
            <div class="bloco terra" style="left:150px; top:400px;"></div>
            <div class="bloco terra" style="left:200px; top:400px;"></div>
            <div class="bloco terra" style="left:250px; top:400px;"></div>
            <div class="bloco terra" style="left:300px; top:400px;"></div>
            <div class="bloco terra" style="left:350px; top:400px;"></div>
            <div class="bloco terra" style="left:400px; top:400px;"></div>
            <div class="bloco terra" style="left:450px; top:400px;"></div>
            <div class="bloco terra" style="left:500px; top:400px;"></div>
            <div class="bloco terra" style="left:550px; top:400px;"></div>
            <div class="bloco terra" style="left:600px; top:400px;"></div>
            <div class="bloco terra" style="left:650px; top:400px;"></div>
            <div class="bloco terra" style="left:700px; top:400px;"></div>
            <div class="bloco terra" style="left:750px; top:400px;"></div>

        </div>

    </div>

    <div class="controles">

        <button onclick="moverEsquerda()">⬅️</button>

        <button onclick="pular()">⬆️</button>

        <button onclick="moverDireita()">➡️</button>

        <button onclick="quebrarBloco()">⛏️ Quebrar</button>

        <button onclick="colocarBloco()">🧱 Colocar</button>

    </div>

    <p>
        Use também as teclas
        <strong>W A S D</strong> ou as setas do teclado.
    </p>

    <script src="script.js"></script>

<script src="script.js"></script></body>
