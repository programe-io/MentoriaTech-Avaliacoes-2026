
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="new-post">
            <div class="user">
                <div class="avatar">A</div>
                <div>
                    <strong>Aluno</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>
            <button>Publicar</button>
        </section>

        <article class="post">
            <div class="post-header">
                <div class="avatar">J</div>
                <div>
                    <strong>João</strong>
                    <span>Há 10 minutos</span>
                </div>
            </div>

            <div class="post-text">
                Assisti ao novo filme do Homem-Aranha e gostei muito!
            </div>

            <img src="https://images.unsplash.com/photo-1531259683007-016a7b628fc3?w=800"
                 alt="Imagem ilustrativa de uma cidade">

            <div class="post-actions">
                <button onclick="curtir(this)">Curtir</button>
                <button onclick="comentar()">Comentar</button>
            </div>
        </article>

        <article class="post">
            <div class="post-header">
                <div class="avatar">M</div>
                <div>
                    <strong>Maria</strong>
                    <span>Há 30 minutos</span>
                </div>
            </div>

            <div class="post-text">
                Hoje foi um ótimo dia para aprender programação!
            </div>

            <div class="post-actions">
                <button onclick="curtir(this)">Curtir</button>
                <button onclick="comentar()">Comentar</button>
            </div>
        </article>
    </main>

    <footer>
        <p>© 2026 Mini Feed - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
