
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>InstaLife</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>
                <body>

                <div id="login" class="login">
                    <h1>InstaLife 📸</h1>
                        <p>Entre na sua rede social!</p>
                            <input id="nomeLogin" placeholder="Seu nome de usuário">
                                <button onclick="entrar()">Entrar / Criar conta</button>
                                </div>

                                <div id="app" hidden>

                                <header>
                                    <h1>InstaLife</h1>
                                        <input id="pesquisa" placeholder="Pesquisar pessoas..."
                                                   oninput="pesquisar()">
                                                       <button onclick="sair()">Sair</button>
                                                       </header>

                                                       <div class="layout">

                                                       <aside class="menu">
                                                           <button onclick="mostrar('feed')">🏠 Início</button>
                                                               <button onclick="mostrar('explorar')">🔎 Explorar</button>
                                                                   <button onclick="mostrar('perfil')">👤 Perfil</button>
                                                                       <button onclick="mostrar('notificacoes')">❤️ Notificações</button>
                                                                       </aside>

                                                                       <main>

                                                                       <section id="feed" class="pagina">

                                                                           <div class="stories">
                                                                                   <div>
                                                                                               <img id="fotoStory" src="https://i.pravatar.cc/100?img=47">
                                                                                                           <p>Seu story</p>
                                                                                                                   </div>
                                                                                                                           <button onclick="document.getElementById('arquivoStory').click()">
                                                                                                                                       + Adicionar story
                                                                                                                                               </button>
                                                                                                                                                       <input type="file" id="arquivoStory" accept="image/*" hidden
                                                                                                                                                                      onchange="adicionarStory(event)">
                                                                                                                                                                              <div id="listaStories"></div>
                                                                                                                                                                                  </div>

                                                                                                                                                                                      <div class="criar-post">
                                                                                                                                                                                              <h3>Compartilhe um momento ✨</h3>
                                                                                                                                                                                                      <textarea id="legenda" placeholder="O que você está pensando?"></textarea>
                                                                                                                                                                                                              <input type="file" id="imagem" accept="image/*">
                                                                                                                                                                                                                      <button onclick="publicar()">Publicar</button>
                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                              <div id="publicacoes"></div>

                                                                                                                                                                                                                              </section>

                                                                                                                                                                                                                              <section id="explorar" class="pagina" hidden>
                                                                                                                                                                                                                                  <h2>Explorar 🔎</h2>
                                                                                                                                                                                                                                      <div id="resultados"></div>
                                                                                                                                                                                                                                      </section>

                                                                                                                                                                                                                                      <section id="perfil" class="pagina" hidden>
                                                                                                                                                                                                                                          <div class="perfil">
                                                                                                                                                                                                                                                  <img id="fotoPerfil" src="https://i.pravatar.cc/150?img=47">
                                                                                                                                                                                                                                                          <h2 id="nomePerfil"></h2>
                                                                                                                                                                                                                                                                  <p id="bioPerfil">Compartilhando momentos! 💜</p>

                                                                                                                                                                                                                                                                          <div class="numeros">
                                                                                                                                                                                                                                                                                      <span id="totalPosts">0 publicações</span>
                                                                                                                                                                                                                                                                                                  <span id="seguidores">0 seguidores</span>
                                                                                                                                                                                                                                                                                                              <span id="seguindo">0 seguindo</span>
                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                              <h3>Editar perfil</h3>
                                                                                                                                                                                                                                                                                                                                      <input id="novaBio" placeholder="Sua biografia">
                                                                                                                                                                                                                                                                                                                                              <input type="file" id="novaFoto" accept="image/*">
                                                                                                                                                                                                                                                                                                                                                      <button onclick="editarPerfil()">Salvar alterações</button>

                                                                                                                                                                                                                                                                                                                                                              <h3>Minhas publicações</h3>
                                                                                                                                                                                                                                                                                                                                                                      <div id="meusPosts"></div>
                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                          </section>

                                                                                                                                                                                                                                                                                                                                                                          <section id="notificacoes" class="pagina" hidden>
                                                                                                                                                                                                                                                                                                                                                                              <h2>Notificações ❤️</h2>
                                                                                                                                                                                                                                                                                                                                                                                  <div id="listaNotificacoes">
                                                                                                                                                                                                                                                                                                                                                                                          <p>Suas atividades aparecerão aqui.</p>
                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                              </section>

                                                                                                                                                                                                                                                                                                                                                                                              </main>
                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                              <footer>
                                                                                                                                                                                                                                                                                                                                                                                                  InstaLife © 2026 - Sua rede, seus momentos 💜
                                                                                                                                                                                                                                                                                                                                                                                                  </footer>

                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                  <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                  <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                  </html>
