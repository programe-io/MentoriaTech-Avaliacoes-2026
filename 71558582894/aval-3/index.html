<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr(a). PediCare | Consultório Pediátrico</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-child-reaching"></i>
            <div>
                <h1>PediCare</h1>
                <span>Consultório Pediátrico</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="appointment-btn-header" id="openModalBtn">
                <i class="fa-solid fa-calendar-check"></i> Agendar Consulta
            </button>
        </div>
    </header>

    <!-- Container Principal / Feed -->
    <main class="main-container">
        
        <!-- Stories / Avisos Importantes -->
        <section class="stories-container">
            <div class="story" onclick="alert('Vacinação em dia! Confira o calendário atualizado.')">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?w=150" alt="Vacinas">
                </div>
                <span>Vacinas</span>
            </div>
            <div class="story" onclick="alert('Dicas de nutrição infantil disponíveis no feed abaixo!')">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1505576399279-565b52d4ac71?w=150" alt="Nutrição">
                </div>
                <span>Nutrição</span>
            </div>
            <div class="story" onclick="alert('Horário de atendimento: Seg a Sex das 08h às 18h.')">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=150" alt="Horários">
                </div>
                <span>Horários</span>
            </div>
            <div class="story" onclick="alert('Plantonistas disponíveis para emergências leves.')">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1516549655169-df83a0774514?w=150" alt="Plantão">
                </div>
                <span>Urgências</span>
            </div>
            <div class="story" onclick="alert('Brinquedoteca e ambiente lúdico para as crianças!')">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1472152083436-e891ef33e232?w=150" alt="Espaço">
                </div>
                <span>Espaço</span>
            </div>
        </section>

        <!-- Filtros de Categoria do Feed -->
        <div class="filter-bar">
            <button class="filter-chip active" data-filter="all">Todas as Postagens</button>
            <button class="filter-chip" data-filter="dicas">Dicas de Saúde</button>
            <button class="filter-chip" data-filter="desenvolvimento">Desenvolvimento</button>
            <button class="filter-chip" data-filter="pediatria">Avisos Médicos</button>
        </div>

        <!-- Feed de Posts do Consultório -->
        <div class="feed" id="feedContainer">
            <!-- Posts injetados via JavaScript -->
        </div>

    </main>

    <!-- Modal de Agendamento de Consulta -->
    <div class="modal" id="appointmentModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-form-container">
                <h2><i class="fa-solid fa-stethoscope" style="color: var(--accent);"></i> Agende sua Consulta</h2>
                <p>Preencha os dados abaixo para solicitar o horário com nossa equipe pediátrica.</p>
                
                <form id="appointmentForm">
                    <div class="form-group">
                        <label>Nome do Responsável:</label>
                        <input type="text" id="respName" required placeholder="Ex: Maria Silva">
                    </div>
                    <div class="form-group">
                        <label>Nome da Criança e Idade:</label>
                        <input type="text" id="childInfo" required placeholder="Ex: Joãozinho, 3 anos">
                    </div>
                    <div class="form-group">
                        <label>Especialidade / Motivo:</label>
                        <select id="reason" required>
                            <option value="">Selecione...</option>
                            <option value="Consulta de Rotina (Puericultura)">Consulta de Rotina (Puericultura)</option>
                            <option value="Primeira Consulta do Bebê (Recém-nascido)">Primeira Consulta do Bebê</option>
                            <option value="Vacinação e Acompanhamento">Vacinação e Acompanhamento</option>
                            <option value="Avaliação de Sintomas (Febre/Tosse)">Avaliação de Sintomas</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Data Preferida:</label>
                        <input type="date" id="consultDate" required>
                    </div>
                    <button type="submit" class="btn-primary">Confirmar Solicitação</button>
                </form>
            </div>
        </div>
    </div>
    <div class="overlay" id="overlay"></div>

    <!-- Rodapé com Assinatura da Desenvolvedora -->
    <footer class="footer">
        <p>Desenvolvido com carinho por <strong>Larisa Ferreira</strong> &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
