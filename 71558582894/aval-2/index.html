<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed de Moda | Loja de Roupas</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-shirt"></i>
            <h1>ChicFeed</h1>
        </div>
        <div class="header-actions">
            <button class="cart-btn" id="cartBtn" title="Carrinho">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <!-- Container Principal / Feed -->
    <main class="main-container">
        
        <!-- Stories / Destaques -->
        <section class="stories-container">
            <div class="story active">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=150" alt="Novidades">
                </div>
                <span>Novidades</span>
            </div>
            <div class="story">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=150" alt="Inverno">
                </div>
                <span>Inverno</span>
            </div>
            <div class="story">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Looks">
                </div>
                <span>Looks</span>
            </div>
            <div class="story">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=150" alt="Promo">
                </div>
                <span>Promoções</span>
            </div>
            <div class="story">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=150" alt="Casual">
                </div>
                <span>Casual</span>
            </div>
        </section>

        <!-- Filtros de Categoria -->
        <div class="filter-bar">
            <button class="filter-chip active" data-filter="all">Todos</button>
            <button class="filter-chip" data-filter="vestidos">Vestidos</button>
            <button class="filter-chip" data-filter="casacos">Casacos</button>
            <button class="filter-chip" data-filter="calcados">Calçados</button>
            <button class="filter-chip" data-filter="acessorios">Acessórios</button>
        </div>

        <!-- Feed de Posts (Produtos) -->
        <div class="feed" id="feedContainer">
            <!-- Os posts serão injetados via JavaScript -->
        </div>

    </main>

    <!-- Modal de Detalhes do Produto -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-grid">
                <div class="modal-img-container">
                    <img id="modalImg" src="" alt="Produto">
                </div>
                <div class="modal-details">
                    <h2 id="modalTitle">Nome do Produto</h2>
                    <p class="modal-price" id="modalPrice">R$ 0,00</p>
                    <p class="modal-desc" id="modalDesc">Descrição detalhada do produto e tecido de alta qualidade.</p>
                    
                    <div class="size-selector">
                        <label>Tamanho:</label>
                        <div class="sizes">
                            <span class="size-opt">P</span>
                            <span class="size-opt active">M</span>
                            <span class="size-opt">G</span>
                            <span class="size-opt">GG</span>
                        </div>
                    </div>

                    <button class="btn-primary" id="modalAddToCart">
                        <i class="fa-solid fa-cart-plus"></i> Adicionar à Sacola
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Carrinho Drawer / Lateral -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Sua Sacola</h3>
            <button id="closeCart"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cartItemsContainer">
            <!-- Itens do carrinho aqui -->
            <p class="empty-cart-msg">Sua sacola está vazia.</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotalPrice">R$ 0,00</span>
            </div>
            <button class="btn-primary" id="checkoutBtn">Finalizar Compra</button>
        </div>
    </div>
    <div class="overlay" id="overlay"></div>

    <!-- Rodapé com Assinatura da Desenvolvedora -->
    <footer class="footer">
        <p>Desenvolvido com dedicação por <strong>Larissa Ferreira</strong> &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
