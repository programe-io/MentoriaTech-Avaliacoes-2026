<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supermercado Bom Preço</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <div class="topo">
      <div>
        <h1>🛒 Supermercado Bom Preço</h1>
        <p class="sub">Escolha a quantidade de cada alimento e finalize sua compra</p>
      </div>
      <a class="pill" href="#resumo">Total: <strong id="total-topo">R$ 0,00</strong></a>
    </div>
  </header>

  <main class="layout">
    <section class="catalogo">
      <div class="toolbar">
        <input type="search" id="busca" placeholder="🔎 Buscar produto (ex.: leite, arroz, maçã)" aria-label="Buscar produto">
        <div id="categorias" class="chips" role="group" aria-label="Categorias"></div>
      </div>
      <div id="produtos" class="grade" aria-label="Produtos"></div>
      <p id="sem-resultado" class="vazio" hidden>Nenhum produto encontrado.</p>
    </section>

    <aside id="resumo" class="resumo">
      <h2>Resumo da compra</h2>
      <p id="resumo-vazio" class="vazio">Nenhum item ainda. Use o <b>+</b> nos produtos para adicionar.</p>
      <ul id="resumo-lista" class="itens"></ul>
      <div class="linha-total">Total <strong id="total">R$ 0,00</strong></div>
      <button type="button" id="btn-finalizar" class="btn primario grande" disabled>Finalizar compra</button>
      <button type="button" id="btn-limpar" class="btn link" disabled>Limpar seleção</button>
    </aside>
  </main>

  <footer>
    <button type="button" id="btn-restaurar" class="btn link">Restaurar estoque inicial</button>
  </footer>

  <dialog id="recibo">
    <h2>✅ Compra realizada!</h2>
    <p id="recibo-info" class="sub-escuro"></p>
    <ul id="recibo-itens" class="itens"></ul>
    <div class="linha-total">Total <strong id="recibo-total"></strong></div>
    <button type="button" id="btn-fechar" class="btn primario grande">Continuar comprando</button>
  </dialog>

  <div id="aviso" class="toast" role="status" hidden></div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
