
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFide - Minificador HTML</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f3f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: monospace;
            resize: vertical;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-top: 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .resultado {
            margin-top: 20px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>MiniFide HTML</h1>

    <p>Cole seu código HTML abaixo:</p>

    <textarea id="codigo"
        placeholder="Digite ou cole seu HTML aqui..."></textarea>

    <button onclick="minificar()">Minificar código</button>

    <div class="resultado">
        <p>Resultado:</p>

        <textarea id="resultado"
            placeholder="Seu código minificado aparecerá aqui..."
            readonly></textarea>

        <button onclick="copiar()">Copiar código</button>
    </div>

</div>

<script>
    function minificar() {
        let codigo = document.getElementById("codigo").value;

        let minificado = codigo
            .replace(/<!--[\s\S]*?-->/g, "")
            .replace(/\s+/g, " ")
            .replace(/>\s+</g, "><")
            .trim();

        document.getElementById("resultado").value = minificado;
    }

    function copiar() {
        let resultado = document.getElementById("resultado");

        resultado.select();
        document.execCommand("copy");

        alert("Código copiado!");
    }
</script>

</body>
</html>
