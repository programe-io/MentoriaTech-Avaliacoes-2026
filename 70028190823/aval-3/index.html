
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Controle de IMC</h1>
            <p>Projeto Prático - Avaliação Corporal</p>
        </header>

        <main>
            <h2>Dados do Paciente</h2>

            <form id="formIMC">

                <div class="campo">
                    <label for="nome">Nome do paciente:</label>
                    <input type="text" id="nome"
                        placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso"
                        placeholder="Ex: 70" step="0.1"
                        min="0.1" required>
                </div>

                <div class="campo">
                    <label for="altura">Altura (metros):</label>
                    <input type="number" id="altura"
                        placeholder="Ex: 1.75" step="0.01"
                        min="0.1" required>
                </div>

                <button type="submit">Calcular IMC</button>

            </form>

            <section id="resultado" class="resultado" hidden>
                <h2>Resultado do Paciente</h2>

                <p><strong>Nome:</strong> <span id="resNome"></span></p>
                <p><strong>Peso:</strong> <span id="resPeso"></span> kg</p>
                <p><strong>Altura:</strong> <span id="resAltura"></span> m</p>

                <div class="imc-box">
                    <p>Seu IMC é:</p>
                    <h2 id="resIMC"></h2>
                    <h3 id="classificacao"></h3>
                </div>

                <button type="button" id="limpar">
                    Novo cálculo
                </button>
            </section>
        </main>

        <footer>
            <p>Projeto Prático - Controle de IMC</p>
        </footer>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
