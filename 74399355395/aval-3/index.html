<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Ficha de Anamnese — Calculadora de IMC</h1>

    <section class="card">
      <h2>Cadastrar Paciente</h2>
      <form id="form-pessoa" novalidate>
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" maxlength="50" placeholder="Ex: Francisco Silva">
        </div>

        <div class="campo">
          <label for="idade">Idade (anos)</label>
          <input type="number" id="idade" min="1" max="120" placeholder="Ex: 30">
        </div>

        <div class="campo">
          <label for="altura">Altura (m)</label>
          <input type="number" id="altura" step="0.01" min="0.5" max="2.5" placeholder="Ex: 1.70">
        </div>

        <div class="campo">
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" step="0.1" min="2" max="500" placeholder="Ex: 65.0">
        </div>

        <p id="erro" class="mensagem-erro" hidden></p>

        <div class="acoes-form">
          <button type="submit" class="btn btn-salvar">Salvar</button>
          <button type="reset" class="btn btn-cancelar" id="btn-cancelar">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Pacientes Cadastrados</h2>
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Idade</th>
              <th>Altura</th>
              <th>Peso</th>
              <th>IMC</th>
              <th>Classificação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-pessoas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
