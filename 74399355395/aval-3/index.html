<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto 3ª Avaliação - Arrays e Renderização</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Gerenciador de Itens</h1>

    <form id="form-item" class="form-grupo">
      <input 
        type="text" 
        id="input-titulo" 
        placeholder="Digite o nome do item..." 
        autocomplete="off"
      >
      <select id="select-categoria">
        <option value="Geral">Geral</option>
        <option value="Importante">Importante</option>
        <option value="Estudos">Estudos</option>
      </select>
      <button type="submit" id="btn-adicionar">Adicionar</button>
    </form>

    <p id="mensagem-erro" class="erro oculto">Por favor, preencha o nome do item.</p>

    <div class="resumo">
      <span>Total de itens: <strong id="contador-total">0</strong></span>
    </div>

    <!-- Container onde o JS vai renderizar os elementos do Array -->
    <ul id="lista-itens" class="lista"></ul>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
