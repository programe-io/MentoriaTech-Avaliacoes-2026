<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <h1>Gerenciador de Tarefas</h1>
    
    <form id="form-tarefa">
      <div class="input-group">
        <label for="titulo">Título da Tarefa:</label>
        <input type="text" id="titulo" placeholder="Ex: Cadastrar Clientes" required>
      </div>

      <div class="input-group">
        <label for="prioridade">Prioridade (1 a 3):</label>
        <input type="number" id="prioridade" min="1" max="3" required>
      </div>

      <button type="submit">Cadastrar Tarefa</button>
    </form>

    <div id="mensagem-erro" class="erro hidden"></div>

    <h2>Lista de Tarefas</h2>
    <ul id="lista-tarefas"></ul>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
