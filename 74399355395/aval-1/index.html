<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Estoque</title>
  <!-- Vínculo com o arquivo CSS -->
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h1>Controle de Estoque</h1>

    <div id="mensagem" class="mensagem"></div>

    <div class="grid">
      <!-- Formulário de Cadastro -->
      <div class="card">
        <h3>Cadastrar Produto</h3>
        <form id="form-cadastrar">
          <div class="form-group">
            <label for="add-id">ID</label>
            <input type="number" id="add-id" required>
          </div>
          <div class="form-group">
            <label for="add-desc">Descrição</label>
            <input type="text" id="add-desc" required>
          </div>
          <div class="form-group">
            <label for="add-qty">Quantidade</label>
            <input type="number" id="add-qty" required>
          </div>
          <div class="form-group">
            <label for="add-price">Preço ($)</label>
            <input type="number" step="0.01" id="add-price" required>
          </div>
          <button type="submit">Cadastrar</button>
        </form>
      </div>

      <!-- Formulários de Atualização -->
      <div>
        <div class="card" style="margin-bottom: 15px;">
          <h3>Atualizar Preço</h3>
          <form id="form-preco">
            <div class="form-group">
              <label for="price-id">ID do Produto</label>
              <input type="number" id="price-id" required>
            </div>
            <div class="form-group">
              <label for="new-price">Novo Preço ($)</label>
              <input type="number" step="0.01" id="new-price" required>
            </div>
            <button type="submit">Atualizar Preço</button>
          </form>
        </div>

        <div class="card">
          <h3>Atualizar Quantidade</h3>
          <form id="form-qtd">
            <div class="form-group">
              <label for="qty-id">ID do Produto</label>
              <input type="number" id="qty-id" required>
            </div>
            <div class="form-group">
              <label for="new-qty">Nova Quantidade</label>
              <input type="number" id="new-qty" required>
            </div>
            <button type="submit">Atualizar Quantidade</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Tabela de Produtos -->
    <h2>Lista de Produtos</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Descrição</th>
          <th>Quantidade</th>
          <th>Preço</th>
        </tr>
      </thead>
      <tbody id="tabela-produtos">
        <!-- Preenchido dinamicamente via JS -->
      </tbody>
    </table>
  </div>

  <!-- Vínculo com o arquivo JS -->
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
