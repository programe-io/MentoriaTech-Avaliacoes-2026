
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Controle de Produtos</h1>

        <section>
            <h2>Cadastrar Produto</h2>

            <input type="text" id="descricao" placeholder="Descrição do produto">

            <input type="number" id="quantidade" placeholder="Quantidade">

            <input type="number" id="valor" placeholder="Valor">

            <button onclick="cadastrarProduto()">Cadastrar</button>
        </section>

        <section>
            <h2>Atualizar Valor</h2>

            <input type="number" id="codigoValor" placeholder="Código do produto">

            <input type="number" id="novoValor" placeholder="Novo valor">

            <button onclick="atualizarValor()">Atualizar Valor</button>
        </section>

        <section>
            <h2>Adicionar Estoque</h2>

            <input type="number" id="codigoQuantidade" placeholder="Código do produto">

            <input type="number" id="novaQuantidade" placeholder="Quantidade a adicionar">

            <button onclick="atualizarQuantidade()">Adicionar</button>
        </section>

        <section>
            <h2>Lista de Produtos</h2>

            <div id="listaProdutos"></div>
        </section>

        <p id="mensagem"></p>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
