<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="estilo.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Jogo da Velha</h1>
        <p>Desafie um amigo!</p>
    </header>

    <main class="container-jogo">
        <div id="status-jogo">Vez do jogador: X</div>
        
        <div class="tabuleiro">
            <div class="celula" data-index="0" role="button" tabindex="0" aria-label="Célula 1"></div>
            <div class="celula" data-index="1" role="button" tabindex="0" aria-label="Célula 2"></div>
            <div class="celula" data-index="2" role="button" tabindex="0" aria-label="Célula 3"></div>
            <div class="celula" data-index="3" role="button" tabindex="0" aria-label="Célula 4"></div>
            <div class="celula" data-index="4" role="button" tabindex="0" aria-label="Célula 5"></div>
            <div class="celula" data-index="5" role="button" tabindex="0" aria-label="Célula 6"></div>
            <div class="celula" data-index="6" role="button" tabindex="0" aria-label="Célula 7"></div>
            <div class="celula" data-index="7" role="button" tabindex="0" aria-label="Célula 8"></div>
            <div class="celula" data-index="8" role="button" tabindex="0" aria-label="Célula 9"></div>
        </div>

        <button id="btn-reiniciar">Reiniciar Jogo</button>
    </main>

    <footer>
        <p>&copy; 2026 Jogo da Velha. Feito com 💙 e código.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
