
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstaClone</title>

<style>
* {
    margin: 0;
        padding: 0;
            box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                    background: #fafafa;
                        color: #262626;
                        }

                        /* CABEÇALHO */
                        header {
                            background: white;
                                border-bottom: 1px solid #ddd;
                                    padding: 15px;
                                        display: flex;
                                            justify-content: space-between;
                                                align-items: center;
                                                    position: sticky;
                                                        top: 0;
                                                            z-index: 10;
                                                            }

                                                            .logo {
                                                                font-size: 27px;
                                                                    font-weight: bold;
                                                                        color: #d62976;
                                                                        }

                                                                        header input {
                                                                            padding: 10px;
                                                                                border: none;
                                                                                    background: #efefef;
                                                                                        border-radius: 8px;
                                                                                        }

                                                                                        /* LAYOUT */
                                                                                        .container {
                                                                                            max-width: 600px;
                                                                                                margin: 20px auto;
                                                                                                    padding: 10px;
                                                                                                    }

                                                                                                    /* STORIES */
                                                                                                    .stories {
                                                                                                        display: flex;
                                                                                                            gap: 15px;
                                                                                                                overflow-x: auto;
                                                                                                                    background: white;
                                                                                                                        padding: 15px;
                                                                                                                            border: 1px solid #ddd;
                                                                                                                                border-radius: 10px;
                                                                                                                                    margin-bottom: 20px;
                                                                                                                                    }

                                                                                                                                    .story {
                                                                                                                                        text-align: center;
                                                                                                                                            min-width: 65px;
                                                                                                                                                font-size: 12px;
                                                                                                                                                }

                                                                                                                                                .story img {
                                                                                                                                                    width: 60px;
                                                                                                                                                        height: 60px;
                                                                                                                                                            border-radius: 50%;
                                                                                                                                                                padding: 3px;
                                                                                                                                                                    border: 3px solid #e1306c;
                                                                                                                                                                        object-fit: cover;
                                                                                                                                                                        }

                                                                                                                                                                        /* CRIAR POST */
                                                                                                                                                                        .criar {
                                                                                                                                                                            background: white;
                                                                                                                                                                                padding: 15px;
                                                                                                                                                                                    border: 1px solid #ddd;
                                                                                                                                                                                        border-radius: 10px;
                                                                                                                                                                                            margin-bottom: 20px;
                                                                                                                                                                                            }

                                                                                                                                                                                            input, textarea {
                                                                                                                                                                                                width: 100%;
                                                                                                                                                                                                    padding: 12px;
                                                                                                                                                                                                        margin: 6px 0;
                                                                                                                                                                                                            border: 1px solid #ddd;
                                                                                                                                                                                                                border-radius: 8px;
                                                                                                                                                                                                                }

                                                                                                                                                                                                                button {
                                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                                        background: #0095f6;
                                                                                                                                                                                                                            color: white;
                                                                                                                                                                                                                                padding: 10px 15px;
                                                                                                                                                                                                                                    border-radius: 8px;
                                                                                                                                                                                                                                        cursor: pointer;
                                                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                            /* PUBLICAÇÕES */
                                                                                                                                                                                                                                            .post {
                                                                                                                                                                                                                                                background: white;
                                                                                                                                                                                                                                                    border: 1px solid #ddd;
                                                                                                                                                                                                                                                        border-radius: 10px;
                                                                                                                                                                                                                                                            margin-bottom: 25px;
                                                                                                                                                                                                                                                                overflow: hidden;
                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                .post-header {
                                                                                                                                                                                                                                                                    display: flex;
                                                                                                                                                                                                                                                                        align-items: center;
                                                                                                                                                                                                                                                                            padding: 12px;
                                                                                                                                                                                                                                                                                gap: 10px;
                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                .avatar {
                                                                                                                                                                                                                                                                                    width: 40px;
                                                                                                                                                                                                                                                                                        height: 40px;
                                                                                                                                                                                                                                                                                            border-radius: 50%;
                                                                                                                                                                                                                                                                                                object-fit: cover;
                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                .post-image {
                                                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                                                        max-height: 600px;
                                                                                                                                                                                                                                                                                                            object-fit: cover;
                                                                                                                                                                                                                                                                                                                display: block;
                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                .post-actions {
                                                                                                                                                                                                                                                                                                                    padding: 12px;
                                                                                                                                                                                                                                                                                                                        display: flex;
                                                                                                                                                                                                                                                                                                                            gap: 15px;
                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                            .post-actions button {
                                                                                                                                                                                                                                                                                                                                background: transparent;
                                                                                                                                                                                                                                                                                                                                    color: #222;
                                                                                                                                                                                                                                                                                                                                        font-size: 22px;
                                                                                                                                                                                                                                                                                                                                            padding: 0;
                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                            .info {
                                                                                                                                                                                                                                                                                                                                                padding: 0 12px 15px;
                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                .legenda {
                                                                                                                                                                                                                                                                                                                                                    margin: 10px 0;
                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                    .comentarios {
                                                                                                                                                                                                                                                                                                                                                        color: #777;
                                                                                                                                                                                                                                                                                                                                                            font-size: 14px;
                                                                                                                                                                                                                                                                                                                                                                margin-top: 8px;
                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                .comment-box {
                                                                                                                                                                                                                                                                                                                                                                    display: flex;
                                                                                                                                                                                                                                                                                                                                                                        gap: 5px;
                                                                                                                                                                                                                                                                                                                                                                            padding: 10px;
                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                            .comment-box input {
                                                                                                                                                                                                                                                                                                                                                                                flex: 1;
                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                @media(max-width: 600px) {
                                                                                                                                                                                                                                                                                                                                                                                    header input {
                                                                                                                                                                                                                                                                                                                                                                                            width: 110px;
                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                    .container {
                                                                                                                                                                                                                                                                                                                                                                                                            margin: 5px auto;
                                                                                                                                                                                                                                                                                                                                                                                                                    padding: 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                            .post {
                                                                                                                                                                                                                                                                                                                                                                                                                                    border-radius: 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                        </style>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

                                                                                                                                                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="stories">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- CRIAR PUBLICAÇÃO -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="criar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h3>📸 Criar publicação</h3>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input id="nome" placeholder="Seu nome">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <textarea id="legenda"

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input id="imagem"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            placeholder="URL da imagem">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="publicar()">Publicar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- FEED -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="feed">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="post">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="post-actions">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="comentar(this)">💬</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="alert('Link copiado!')">📤</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="info">
