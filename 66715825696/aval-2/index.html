
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Feed Social</title>

<style>
* {
    margin: 0;
        padding: 0;
            box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                    background: #f0f2f5;
                        color: #222;
                        }

                        header {
                            background: #1877f2;
                                color: white;
                                    padding: 20px;
                                        text-align: center;
                                        }

                                        .container {
                                            max-width: 600px;
                                                margin: 25px auto;
                                                    padding: 10px;
                                                    }

                                                    .criar-post, .post {
                                                        background: white;
                                                            padding: 18px;
                                                                border-radius: 12px;
                                                                    margin-bottom: 18px;
                                                                        box-shadow: 0 2px 8px #0001;
                                                                        }

                                                                        input, textarea {
                                                                            width: 100%;
                                                                                padding: 12px;
                                                                                    margin: 8px 0;
                                                                                        border: 1px solid #ddd;
                                                                                            border-radius: 8px;
                                                                                                font-size: 15px;
                                                                                                }

                                                                                                textarea {
                                                                                                    resize: vertical;
                                                                                                    }

                                                                                                    button {
                                                                                                        background: #1877f2;
                                                                                                            color: white;
                                                                                                                border: none;
                                                                                                                    padding: 10px 16px;
                                                                                                                        border-radius: 8px;
                                                                                                                            cursor: pointer;
                                                                                                                                margin-top: 8px;
                                                                                                                                }

                                                                                                                                button:hover {
                                                                                                                                    opacity: 0.85;
                                                                                                                                    }

                                                                                                                                    .post h3 {
                                                                                                                                        margin-bottom: 10px;
                                                                                                                                        }

                                                                                                                                        .post p {
                                                                                                                                            margin: 12px 0;
                                                                                                                                                overflow-wrap: anywhere;
                                                                                                                                                }

                                                                                                                                                .post img {
                                                                                                                                                    width: 100%;
                                                                                                                                                        border-radius: 10px;
                                                                                                                                                            margin-top: 10px;
                                                                                                                                                            }

                                                                                                                                                            .acoes {
                                                                                                                                                                display: flex;
                                                                                                                                                                    gap: 10px;
                                                                                                                                                                        align-items: center;
                                                                                                                                                                        }

                                                                                                                                                                        .curtir {
                                                                                                                                                                            background: #eee;
                                                                                                                                                                                color: #222;
                                                                                                                                                                                }

                                                                                                                                                                                .comentario {
                                                                                                                                                                                    background: #f0f2f5;
                                                                                                                                                                                        padding: 8px;
                                                                                                                                                                                            border-radius: 8px;
                                                                                                                                                                                                margin-top: 8px;
                                                                                                                                                                                                    font-size: 14px;
                                                                                                                                                                                                    }

                                                                                                                                                                                                    small {
                                                                                                                                                                                                        color: #777;
                                                                                                                                                                                                        }
                                                                                                                                                                                                        </style>
                                                                                                                                                                                                        <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

                                                                                                                                                                                                        <body>

                                                                                                                                                                                                        <header>
                                                                                                                                                                                                            <h1>🌐 Mini Social</h1>
                                                                                                                                                                                                                <p>Compartilhe seus momentos!</p>
                                                                                                                                                                                                                </header>

                                                                                                                                                                                                                <div class="container">

                                                                                                                                                                                                                    <div class="criar-post">
                                                                                                                                                                                                                            <h2>✏️ Criar publicação</h2>

                                                                                                                                                                                                                                    <input id="nome" placeholder="Seu nome">

                                                                                                                                                                                                                                            <textarea id="texto" placeholder="O que você está pensando?"></textarea>

                                                                                                                                                                                                                                                    <input id="foto" placeholder="URL da imagem (opcional)">

                                                                                                                                                                                                                                                            <button onclick="publicar()">Publicar 🚀</button>
                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                    <div id="feed"></div>

                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                    function publicar() {
                                                                                                                                                                                                                                                                        const nome = document.getElementById("nome").value.trim();
                                                                                                                                                                                                                                                                            const texto = document.getElementById("texto").value.trim();
                                                                                                                                                                                                                                                                                const foto = document.getElementById("foto").value.trim();

                                                                                                                                                                                                                                                                                    if (!nome || !texto) {
                                                                                                                                                                                                                                                                                            alert("Digite seu nome e uma publicação!");
                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                            const post = document.createElement("div");
                                                                                                                                                                                                                                                                                                                post.className = "post";

                                                                                                                                                                                                                                                                                                                    const titulo = document.createElement("h3");
                                                                                                                                                                                                                                                                                                                        titulo.textContent = "👤 " + nome;

                                                                                                                                                                                                                                                                                                                            const data = document.createElement("small");
                                                                                                                                                                                                                                                                                                                                data.textContent = new Date().toLocaleString("pt-BR");

                                                                                                                                                                                                                                                                                                                                    const conteudo = document.createElement("p");
                                                                                                                                                                                                                                                                                                                                        conteudo.textContent = texto;

                                                                                                                                                                                                                                                                                                                                            post.append(titulo, data, conteudo);

                                                                                                                                                                                                                                                                                                                                                if (foto) {
                                                                                                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                                                                                                    const url = new URL(foto);
                                                                                                                                                                                                                                                                                                                                                                                if (url.protocol === "https:" || url.protocol === "http:") {
                                                                                                                                                                                                                                                                                                                                                                                                const imagem = document.createElement("img");
                                                                                                                                                                                                                                                                                                                                                                                                                imagem.src = url.href;
                                                                                                                                                                                                                                                                                                                                                                                                                                imagem.alt = "Imagem da publicação";
                                                                                                                                                                                                                                                                                                                                                                                                                                                post.appendChild(imagem);
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } catch (e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                alert("URL da imagem inválida!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const acoes = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                acoes.className = "acoes";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const curtir = document.createElement("button");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        curtir.className = "curtir";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            curtir.textContent = "❤️ Curtir (0)";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let curtidas = 0;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    curtir.onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            curtidas++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    curtir.textContent = "❤️ Curtir (" + curtidas + ")";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const comentar = document.createElement("button");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                comentar.textContent = "💬 Comentar";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const comentarios = document.createElement("div");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        comentar.onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const comentario = prompt("Digite seu comentário:");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (comentario && comentario.trim()) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const item = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                item.className = "comentario";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            item.textContent = "💬 " + comentario.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        comentarios.appendChild(item);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        acoes.append(curtir, comentar);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            post.append(acoes, comentarios);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("feed").prepend(post);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("texto").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("foto").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
