
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Sistema de Controle de IMC</h1>
        <p>Cadastro e cálculo de peso e altura</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar Pessoa</h2>

            <form id="form-pessoa">

                <label>Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">

                <label>Peso (kg):</label>
                <input type="number" id="peso" step="0.1" placeholder="Ex: 70">

                <label>Altura (m):</label>
                <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75">

                <button type="submit">Calcular IMC</button>

                <p id="erro" hidden></p>
            </form>
        </section>

        <section class="resultado">
            <h2>Resultado</h2>

            <p>Total de pessoas: <strong id="total">0</strong></p>
            <p>IMC médio: <strong id="media">0.00</strong></p>

            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Peso</th>
                            <th>Altura</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ação</th>
                        </tr>
                    </thead>

                    <tbody id="lista-pessoas"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
