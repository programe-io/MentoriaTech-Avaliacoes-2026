
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Desafio da Galáxia</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <div class="container">
                            <h1>🚀 Desafio da Galáxia</h1>
                                    <p>Responda às perguntas e conquiste o universo!</p>

                                            <div id="inicio">
                                                        <div class="planeta">🪐</div>
                                                                    <button onclick="iniciarJogo()">Começar aventura ✨</button>
                                                                            </div>

                                                                                    <div id="jogo" hidden>
                                                                                                <p id="progresso"></p>
                                                                                                            <p id="vidas">❤️❤️❤️</p>
                                                                                                                        <h2 id="pergunta"></h2>
                                                                                                                                    <div id="opcoes"></div>
                                                                                                                                                <p id="mensagem"></p>
                                                                                                                                                            <p id="pontos">⭐ Pontos: 0</p>
                                                                                                                                                                    </div>

                                                                                                                                                                            <div id="final" hidden>
                                                                                                                                                                                        <h2 id="resultado"></h2>
                                                                                                                                                                                                    <p id="pontuacaoFinal"></p>
                                                                                                                                                                                                                <button onclick="iniciarJogo()">Jogar novamente 🔄</button>
                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                </html>
