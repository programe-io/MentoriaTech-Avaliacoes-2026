<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>📋 Gerenciador de Tarefas</h1>

        <!-- FORMULÁRIO -->
        <div class="formulario">

            <input
                type="text"
                id="titulo"
                placeholder="Título da tarefa"
            >

            <textarea
                id="descricao"
                placeholder="Descrição da tarefa"
            ></textarea>

            <input
                type="date"
                id="data"
            >

            <button onclick="cadastrarTarefa()">
                ➕ Cadastrar Tarefa
            </button>

        </div>

        <hr>

        <!-- BUSCA -->
        <div class="pesquisa">

            <input
                type="text"
                id="busca"
                placeholder="Buscar tarefa..."
                onkeyup="buscarTarefa()"
            >

            <select id="filtroStatus" onchange="filtrarTarefas()">

                <option value="todas">
                    Todas
                </option>

                <option value="pendentes">
                    Pendentes
                </option>

                <option value="concluidas">
                    Concluídas
                </option>

            </select>

            <button onclick="listarTarefas()">
                🔄 Atualizar
            </button>

        </div>

        <!-- ESTATÍSTICAS -->
        <div class="estatisticas">

            <div class="card">
                <h3>Total</h3>
                <span id="total">0</span>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <span id="pendentes">0</span>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <span id="concluidas">0</span>
            </div>

        </div>

        <!-- BOTÕES -->
        <div class="acoes">

            <button onclick="ordenarPorData()">
                📅 Ordenar por Data
            </button>

            <button
                class="btn-perigo"
                onclick="limparTodas()"
            >
                🗑️ Limpar Todas
            </button>

        </div>

        <!-- LISTA -->
        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
