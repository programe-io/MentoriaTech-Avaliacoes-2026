
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header class="header">
            <div>
                <h1>TaskFlow <span>✓</span></h1>
                <p>Organize suas tarefas e aumente sua produtividade.</p>
            </div>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span>Total de tarefas</span>
                <strong id="totalTasks">0</strong>
            </div>

            <div class="stat-card">
                <span>Pendentes</span>
                <strong id="pendingTasks">0</strong>
            </div>

            <div class="stat-card">
                <span>Concluídas</span>
                <strong id="completedTasks">0</strong>
            </div>

            <div class="stat-card">
                <span>Progresso</span>
                <strong id="progress">0%</strong>
            </div>
        </section>

        <section class="form-section">
            <h2 id="formTitle">Adicionar nova tarefa</h2>

            <form id="taskForm">

                <input type="hidden" id="taskId">

                <div class="form-group">
                    <label for="taskTitle">Título da tarefa</label>
                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Digite sua tarefa..."
                        required
                        maxlength="100"
                    >
                </div>

                <div class="form-group">
                    <label for="taskDescription">Descrição</label>
                    <textarea
                        id="taskDescription"
                        placeholder="Descreva sua tarefa..."
                        rows="3"
                    ></textarea>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="taskPriority">Prioridade</label>
                        <select id="taskPriority">
                            <option value="baixa">Baixa</option>
                            <option value="media" selected>Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskDate">Data de vencimento</label>
                        <input type="date" id="taskDate">
                    </div>

                </div>

                <div class="form-buttons">
                    <button type="submit" id="submitButton">
                        + Adicionar tarefa
                    </button>

                    <button
                        type="button"
                        id="cancelEdit"
                        class="cancel-button hidden"
                    >
                        Cancelar edição
                    </button>
                </div>

            </form>
        </section>

        <section class="tasks-section">

            <div class="tasks-header">
                <h2>Minhas tarefas</h2>

                <button id="deleteCompleted" class="delete-all-button">
                    Limpar concluídas
                </button>
            </div>

            <div class="filters">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Pesquisar tarefas..."
                >

                <select id="statusFilter">
                    <option value="todas">Todas</option>
                    <option value="pendente">Pendentes</option>
                    <option value="concluida">Concluídas</option>
                </select>

                <select id="priorityFilter">
                    <option value="todas">Todas as prioridades</option>
                    <option value="alta">Alta</option>
                    <option value="media">Média</option>
                    <option value="baixa">Baixa</option>
                </select>

                <select id="sortFilter">
                    <option value="recentes">Mais recentes</option>
                    <option value="antigas">Mais antigas</option>
                    <option value="prioridade">Maior prioridade</option>
                    <option value="vencimento">Data de vencimento</option>
                </select>

            </div>

            <div id="taskList" class="task-list"></div>

            <div id="emptyMessage" class="empty-message hidden">
                <h3>Nenhuma tarefa encontrada!</h3>
                <p>Adicione uma tarefa ou altere os filtros.</p>
            </div>

        </section>

        <footer>
            <p>TaskFlow © 2026 - Seus dados são salvos no navegador.</p>
        </footer>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
