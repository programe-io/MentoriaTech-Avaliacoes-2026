
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Social<span>Feed</span></h1>
    </header>

    <main>
        <section class="novo-post">
            <h2>Nova publicação</h2>

            <input type="text" id="nome" placeholder="Seu nome">

            <textarea id="texto" placeholder="Compartilhe algo..."></textarea>

            <input type="text" id="foto" placeholder="URL da imagem (opcional)">

            <button onclick="publicar()">Publicar</button>
        </section>

        <section id="feed">

            <article class="post">
                <div class="perfil">
                    <div class="avatar">JS</div>
                    <div>
                        <h3>João Silva</h3>
                        <small>Há 2 horas</small>
                    </div>
                </div>

                <p>Vivendo cada momento! 🔥</p>

                <img src="https://picsum.photos/600/350?random=1" alt="Publicação">

                <div class="acoes">
                    <button onclick="curtir(this)">🤍 Curtir</button>
                    <span>0 curtidas</span>
                </div>

                <div class="comentarios">
                    <input type="text" placeholder="Escreva um comentário...">
                    <button onclick="comentar(this)">Enviar</button>
                    <div class="lista-comentarios"></div>
                </div>
            </article>

        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
