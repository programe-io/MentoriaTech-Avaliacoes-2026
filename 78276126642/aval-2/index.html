
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FF Feed</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>🔥 FF FEED</h1>
    <p>O universo dos sobreviventes</p>
  </header>

  <main class="container">

    <section class="create">
      <h3>📢 Criar publicação</h3>
      <textarea id="texto" placeholder="O que está acontecendo?"></textarea>
      <button onclick="publicar()">PUBLICAR 🚀</button>
    </section>

    <section id="feed">
      <article class="post">
        <h3>👑 Jogador FF</h3>
        <p>Hoje é dia de pegar capa! 🔥💀</p>
        <div class="actions">
          <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
          <button onclick="comentar(this)">💬 Comentar</button>
        </div>
      </article>
    </section>

  </main>

  <footer>FF FEED © 2026</footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
