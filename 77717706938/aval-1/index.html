<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones via FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonte estilo logo Instagram -->
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <div class="app-container">
        <!-- Barra Lateral Esquerda -->
        <nav class="sidebar">
            <div class="logo">Instagram</div>
            <ul class="nav-links">
                <li class="active"><i class="fa-solid fa-house"></i> <span>Página Inicial</span></li>
                <li><i class="fa-solid fa-magnifying-glass"></i> <span>Pesquisa</span></li>
                <li><i class="fa-regular fa-compass"></i> <span>Explorar</span></li>
                <li><i class="fa-solid fa-clapperboard"></i> <span>Reels</span></li>
                <li><i class="fa-regular fa-paper-plane"></i> <span>Mensagens</span></li>
                <li><i class="fa-regular fa-heart"></i> <span>Notificações</span></li>
                <li id="open-modal-btn"><i class="fa-regular fa-square-plus"></i> <span>Criar</span></li>
                <li>
                    <img src="https://i.pravatar.cc/150?img=11" alt="Perfil" class="nav-avatar">
                    <span>Perfil</span>
                </li>
            </ul>
        </nav>

        <!-- Área Principal (Stories + Feed) -->
        <main class="main-content">
            <div class="feed-wrapper">
                <!-- Barra de Stories -->
                <div class="stories-container" id="stories-container">
                    <!-- Injetado via JS -->
                </div>

                <!-- Feed de Postagens -->
                <div class="feed-container" id="feed-container">
                    <!-- Injetado via JS -->
                </div>
            </div>
        </main>

        <!-- Barra Lateral Direita (Sugestões) -->
        <aside class="right-sidebar">
            <div class="user-profile-switch">
                <img src="https://i.pravatar.cc/150?img=11" alt="Seu perfil">
                <div class="user-info">
                    <strong>dev_front</strong>
                    <span>Desenvolvedor Web</span>
                </div>
                <button class="text-btn">Mudar</button>
            </div>

            <div class="suggestions-header">
                <span>Sugestões para você</span>
                <button class="text-btn white">Ver tudo</button>
            </div>

            <div class="suggestions-list" id="suggestions-list">
                <!-- Injetado via JS -->
            </div>

            <footer class="sidebar-footer">
                Sobre • Ajuda • Imprensa • API • Carreiras • Privacidade • Termos<br><br>
                © 2026 MINI INSTAGRAM CLONE
            </footer>
        </aside>
    </div>

    <!-- Modal para Criar Nova Publicação -->
    <div class="modal-overlay" id="create-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Criar nova publicação</h3>
                <button id="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="new-post-form" class="modal-body">
                <label>URL da Imagem (ou deixe vazio para aleatória):</label>
                <input type="url" id="post-image-url" placeholder="https://exemplo.com/foto.jpg">
                
                <label>Legenda:</label>
                <textarea id="post-caption" rows="4" placeholder="Escreva uma legenda..." required></textarea>
                
                <button type="submit" class="primary-btn">Compartilhar</button>
            </form>
        </div>
    </div>

    <!-- Modal Visualizador de Story -->
    <div class="modal-overlay" id="story-modal">
        <div class="story-viewer">
            <div class="story-progress-bar"><div class="story-progress" id="story-progress"></div></div>
            <div class="story-header">
                <img id="story-user-avatar" src="" alt="">
                <span id="story-username"></span>
                <button id="close-story-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <img id="story-image" src="" alt="Story">
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
