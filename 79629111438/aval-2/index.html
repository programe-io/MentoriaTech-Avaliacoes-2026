<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Rede Social</title>
    <style>
        /* RESET & VARIÁVEIS */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary-color: #1877f2;
            --primary-hover: #166fe5;
            --text-color: #050505;
            --text-secondary: #65676b;
            --border-color: #e4e6eb;
            --radius: 8px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 20px;
        }

        /* LAYOUT */
        .app-container {
            max-width: 550px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* FORMULÁRIO DE NOVO POST */
        .post-form textarea {
            width: 100%;
            height: 80px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 10px;
            resize: none;
            font-size: 0.95rem;
            outline: none;
        }

        .post-form textarea:focus {
            border-color: var(--primary-color);
        }

        .post-form button {
            margin-top: 10px;
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: var(--radius);
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .post-form button:hover {
            background: var(--primary-hover);
        }

        /* FEED & POSTS */
        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }

        .post-author {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .post-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .post-content {
            margin-bottom: 12px;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .post-actions {
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        .like-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .like-btn:hover {
            background: var(--bg-color);
        }

        .like-btn.liked {
            color: var(--primary-color);
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="app-container">
        <header>
            <h1>MiniFeed</h1>
        </header>

        <!-- Criar Publicação -->
        <div class="card post-form">
            <textarea id="postInput" placeholder="No que você está pensando?"></textarea>
            <button id="btnPublish">Publicar</button>
        </div>

        <!-- Feed de Notícias -->
        <div id="feed">
            <!-- Posts são inseridos aqui via JS -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const postInput = document.getElementById('postInput');
            const btnPublish = document.getElementById('btnPublish');
            const feed = document.getElementById('feed');

            // Posts Iniciais (Simulação)
            const initialPosts = [
                {
                    id: 1,
                    author: 'Ana Silva',
                    initials: 'AS',
                    color: '#e91e63',
                    time: 'Há 10 min',
                    content: 'Construindo uma mini rede social simples com HTML, CSS e JavaScript puro!',
                    likes: 3,
                    liked: false
                }
            ];

            // Renderizar posts iniciais
            initialPosts.forEach(renderPost);

            // Evento de Publicação
            btnPublish.addEventListener('click', () => {
                const text = postInput.value.trim();
                if (!text) return;

                const newPost = {
                    id: Date.now(),
                    author: 'Você',
                    initials: 'VC',
                    color: '#1877f2',
                    time: 'Agora mesmo',
                    content: text,
                    likes: 0,
                    liked: false
                };

                renderPost(newPost, true);
                postInput.value = '';
            });

            // Função para criar o HTML do post
            function renderPost(post, unshift = false) {
                const postElement = document.createElement('div');
                postElement.className = 'card';
                postElement.dataset.id = post.id;

                postElement.innerHTML = `
                    <div class="post-header">
                        <div class="avatar" style="background-color: ${post.color}">${post.initials}</div>
                        <div>
                            <div class="post-author">${post.author}</div>
                            <div class="post-time">${post.time}</div>
                        </div>
                    </div>
                    <div class="post-content">${escapeHTML(post.content)}</div>
                    <div class="post-actions">
                        <button class="like-btn ${post.liked ? 'liked' : ''}">
                            👍 <span class="like-count">${post.likes}</span> Curtidas
                        </button>
                    </div>
                `;

                // Evento de Curtir
                const likeBtn = postElement.querySelector('.like-btn');
                const likeCount = postElement.querySelector('.like-count');

                likeBtn.addEventListener('click', () => {
                    post.liked = !post.liked;
                    post.likes += post.liked ? 1 : -1;
                    likeCount.textContent = post.likes;
                    likeBtn.classList.toggle('liked', post.liked);
                });

                if (unshift) {
                    feed.prepend(postElement);
                } else {
                    feed.appendChild(postElement);
                }
            }

            // Sanitização básica contra scripts nocivos
            function escapeHTML(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
                );
            }
        });
    </script>
<script src="script.js"></script></body>
</html>
