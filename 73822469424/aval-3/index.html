<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
  <h1>Controle de IMC</h1>
  <p class="subtitulo">Calcule o Índice de Massa Corporal do paciente</p>

  <div class="campo">
    <label for="nome">Nome do paciente</label>
    <input type="text" id="nome" placeholder="Ex.: Maria Silva">
  </div>

  <div class="linha">
    <div class="campo">
      <label for="peso">Peso (kg)</label>
      <input type="number" id="peso" placeholder="Ex.: 70" step="0.1" min="0">
    </div>

    <div class="campo">
      <label for="altura">Altura (m)</label>
      <input type="number" id="altura" placeholder="Ex.: 1.75" step="0.01" min="0">
    </div>
  </div>

  <button id="btn-calcular">Calcular IMC</button>

  <div id="resultado" class="resultado oculto">
    <p id="saudacao"></p>
    <p class="valor-imc" id="valor-imc"></p>
    <p class="classificacao" id="classificacao"></p>
  </div>
</div>
  <script src="script.js"></script>
  
</body>
</html>
