<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Estoque Pro</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="dashboard-container">
        <!-- Cabeçalho -->
        <header>
            <h1>Gestão de Estoque</h1>
            <p>Monitore produtos, valores e níveis de estoque em tempo real.</p>
        </header>

        <!-- Indicadores / Métricas Rápidas -->
        <section class="metrics-grid">
            <div class="metric-card">
                <span class="metric-title">Produtos Distintos</span>
                <span class="metric-value" id="metricTotalTypes">0</span>
            </div>
            <div class="metric-card">
                <span class="metric-title">Total de Itens em Estoque</span>
                <span class="metric-value" id="metricTotalUnits">0</span>
            </div>
            <div class="metric-card">
                <span class="metric-title">Valor Total em Estoque</span>
                <span class="metric-value" id="metricTotalValue">R$ 0,00</span>
            </div>
            <div class="metric-card warning">
                <span class="metric-title">Itens em Estoque Baixo (≤ 5)</span>
                <span class="metric-value" id="metricLowStock">0</span>
            </div>
        </section>

        <main class="main-content">
            <!-- Formulário Lateral -->
            <aside class="sidebar">
                <h2>Novo Produto</h2>
                <form id="addForm">
                    <div class="field">
                        <label for="code">Código/SKU</label>
                        <input type="text" id="code" placeholder="Ex: PROD-101" required>
                    </div>
                    <div class="field">
                        <label for="title">Descrição do Produto</label>
                        <input type="text" id="title" placeholder="Ex: Monitor 24 Polegadas" required>
                    </div>
                    <div class="field">
                        <label for="category">Categoria</label>
                        <select id="category" required>
                            <option value="">Selecione...</option>
                            <option value="Eletrônicos">Eletrônicos</option>
                            <option value="Periféricos">Periféricos</option>
                            <option value="Escritório">Escritório</option>
                            <option value="Acessórios">Acessórios</option>
                        </select>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label for="quantity">Qtd</label>
                            <input type="number" id="quantity" min="0" placeholder="0" required>
                        </div>
                        <div class="field">
                            <label for="price">Preço Un.</label>
                            <input type="number" id="price" step="0.01" min="0" placeholder="0.00" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">Cadastrar Item</button>
                </form>
            </aside>

            <!-- Tabela Principal com Busca -->
            <section class="table-container">
                <div class="table-header">
                    <h2>Inventário Ativo</h2>
                    <input type="text" id="searchInput" placeholder="🔍 Buscar por código, nome ou categoria...">
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Produto</th>
                                <th>Categoria</th>
                                <th>Preço Un.</th>
                                <th>Qtd.</th>
                                <th>Total R$</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="stockTableBody">
                            <!-- Inserido dinamicamente -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
