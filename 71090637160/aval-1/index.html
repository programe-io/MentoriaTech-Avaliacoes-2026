<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Controle de Estoque</h1>

        <!-- Formulário para Cadastrar Produto -->
        <div class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="productForm">
                <div class="input-group">
                    <label for="productName">Nome do Produto:</label>
                    <input type="text" id="productName" placeholder="Ex: Teclado Mecânico" required>
                </div>

                <div class="input-group">
                    <label for="productQuantity">Quantidade Inicial:</label>
                    <input type="number" id="productQuantity" min="0" placeholder="Ex: 10" required>
                </div>

                <div class="input-group">
                    <label for="productPrice">Preço (R$):</label>
                    <input type="number" id="productPrice" step="0.01" min="0" placeholder="Ex: 150.00" required>
                </div>

                <button type="submit" class="btn-primary">Adicionar Produto</button>
            </form>
        </div>

        <!-- Tabela do Estoque -->
        <div class="card">
            <h2>Produtos no Estoque</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="inventoryTable">
                    <!-- Os produtos serão inseridos aqui dinamicamente pelo JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
