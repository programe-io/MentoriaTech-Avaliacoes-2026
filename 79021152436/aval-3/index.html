<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Perfil 2 - Instagram Clone</title>
      <style>
      :root {
        --bg: #0c1014;
          --card: #2a2f38;
            --text: #f5f5f5;
              --muted: #a8adb5;
                --line: #262b32;
                  --blue: #0095f6;
                    --red: #ff3040;
                    }

                    * { box-sizing: border-box; margin: 0; padding: 0; }

                    body {
                      background: #000;
                        color: var(--text);
                          font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                            display: flex;
                              justify-content: center;
                              }

                              button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }

                              svg {
                                width: 26px; height: 26px;
                                  fill: none; stroke: currentColor;
                                    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
                                    }
                                    svg.fill { fill: currentColor; stroke: none; }

                                    .app {
                                      width: 100%;
                                        max-width: 430px;
                                          min-height: 100vh;
                                            background: var(--bg);
                                              position: relative;
                                                padding-bottom: 90px;
                                                }

                                                /* Topo */
                                                .topbar {
                                                  display: flex; align-items: center; justify-content: space-between;
                                                    padding: 18px 16px 10px;
                                                    }
                                                    .top-right { display: flex; gap: 14px; }
                                                    .icon-btn svg { width: 30px; height: 30px; }
                                                    .username {
                                                      font-size: 22px; font-weight: 700;
                                                        display: flex; align-items: center; gap: 4px;
                                                        }
                                                        .username .chev { width: 18px; height: 18px; }

                                                        /* Perfil */
                                                        .profile {
                                                          display: flex; align-items: center; gap: 22px;
                                                            padding: 18px 16px 6px;
                                                            }
                                                            .avatar-wrap { position: relative; width: 94px; height: 94px; flex-shrink: 0; margin-top: 34px; }
                                                            .avatar {
                                                              width: 94px; height: 94px; border-radius: 50%;
                                                                background: radial-gradient(circle at 40% 35%, #c98f6b, #5a2d22 70%, #1e1411);
                                                                  border: 2px solid var(--line);
                                                                  }
                                                                  .avatar-plus {
                                                                    position: absolute; right: 0; bottom: 0;
                                                                      width: 26px; height: 26px; border-radius: 50%;
                                                                        background: #fff; color: #000;
                                                                          display: grid; place-items: center;
                                                                            font-size: 20px; font-weight: 700; line-height: 1;
                                                                              border: 2px solid var(--bg);
                                                                              }
                                                                              .note {
                                                                                position: absolute; left: -2px; top: -52px;
                                                                                  width: 92px;
                                                                                    background: var(--card);
                                                                                      color: var(--muted);
                                                                                        font-size: 13px; line-height: 1.2; text-align: center;
                                                                                          padding: 10px 8px;
                                                                                            border-radius: 18px;
                                                                                            }
                                                                                            .note::after {
                                                                                              content: ""; position: absolute; left: 22px; bottom: -6px;
                                                                                                width: 12px; height: 12px; border-radius: 50%;
                                                                                                  background: var(--card);
                                                                                                  }

                                                                                                  .info { flex: 1; }
                                                                                                  .name { font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
                                                                                                  .stats { display: flex; justify-content: space-between; gap: 10px; }
                                                                                                  .stats div { display: flex; flex-direction: column; }
                                                                                                  .stats strong { font-size: 22px; font-weight: 500; }
                                                                                                  .stats span { font-size: 17px; }

                                                                                                  /* Bio */
                                                                                                  .bio { padding: 6px 16px 0; }
                                                                                                  .pronoun { font-family: Georgia, serif; font-weight: 700; font-size: 17px; }
                                                                                                  .bio-text { font-family: Georgia, serif; font-weight: 700; font-size: 18px; margin-top: 2px; }
                                                                                                  .bio-date { font-size: 18px; margin-top: 2px; }
                                                                                                  .chip {
                                                                                                    margin-top: 16px;
                                                                                                      border: 1px solid var(--line);
                                                                                                        border-radius: 999px;
                                                                                                          padding: 9px 14px;
                                                                                                            font-size: 16px;
                                                                                                            }

                                                                                                            /* Painel */
                                                                                                            .dashboard {
                                                                                                              margin: 20px 12px 0;
                                                                                                                background: var(--card);
                                                                                                                  border-radius: 14px;
                                                                                                                    padding: 14px 16px;
                                                                                                                    }
                                                                                                                    .dashboard h2 { font-size: 20px; font-weight: 600; }
                                                                                                                    .dashboard p { color: var(--muted); font-size: 15.5px; margin-top: 3px; }

                                                                                                                    /* Botões */
                                                                                                                    .actions { display: flex; gap: 12px; padding: 16px 12px 0; }
                                                                                                                    .btn {
                                                                                                                      flex: 1;
                                                                                                                        background: var(--card);
                                                                                                                          border-radius: 10px;
                                                                                                                            padding: 13px 0;
                                                                                                                              font-size: 17px; font-weight: 600;
                                                                                                                              }
                                                                                                                              .btn:active { opacity: .7; }

                                                                                                                              /* Destaques */
                                                                                                                              .highlights { display: flex; gap: 14px; padding: 22px 12px 0; }
                                                                                                                              .highlight { width: 96px; text-align: center; }
                                                                                                                              .highlight p { font-size: 16px; margin-top: 8px; color: var(--text); }
                                                                                                                              .hl-circle {
                                                                                                                                width: 80px; height: 80px; margin: 0 auto; border-radius: 50%;
                                                                                                                                  display: grid; place-items: center;
                                                                                                                                  }
                                                                                                                                  .hl-new { border: 1.5px solid #fff; font-size: 44px; font-weight: 200; }
                                                                                                                                  .hl-ring { border: 3px solid #3a3f47; padding: 4px; }
                                                                                                                                  .hl-img {
                                                                                                                                    width: 100%; height: 100%; border-radius: 50%;
                                                                                                                                      background: linear-gradient(135deg, #e8a0a0, #3b5fa8 60%, #1b2a55);
                                                                                                                                      }

                                                                                                                                      /* Abas */
                                                                                                                                      .tabs {
                                                                                                                                        display: flex; margin-top: 26px;
                                                                                                                                          border-bottom: 1px solid var(--line);
                                                                                                                                          }
                                                                                                                                          .tab {
                                                                                                                                            flex: 1; padding: 14px 0 12px;
                                                                                                                                              display: grid; place-items: center;
                                                                                                                                                color: var(--muted);
                                                                                                                                                  border-bottom: 2px solid transparent;
                                                                                                                                                  }
                                                                                                                                                  .tab svg { width: 30px; height: 30px; }
                                                                                                                                                  .tab.active { color: var(--text); border-bottom-color: var(--text); }

                                                                                                                                                  /* Estado vazio (ilustração em CSS) */
                                                                                                                                                  .empty { display: grid; place-items: center; padding: 60px 0 40px; }
                                                                                                                                                  .illustration { position: relative; width: 320px; height: 200px; }
                                                                                                                                                  .ill-top {
                                                                                                                                                    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
                                                                                                                                                      width: 180px; height: 70px; background: #fff;
                                                                                                                                                        border-radius: 14px 14px 0 0;
                                                                                                                                                        }
                                                                                                                                                        .ill-curtain {
                                                                                                                                                          position: absolute; top: 20px; width: 90px; height: 180px;
                                                                                                                                                            background: #d300c5; border: 3px solid #000;
                                                                                                                                                            }
                                                                                                                                                            .ill-curtain.left  { left: 20px;  clip-path: polygon(30% 0, 100% 0, 100% 100%, 0 100%); }
                                                                                                                                                            .ill-curtain.right { right: 20px; clip-path: polygon(0 0, 70% 0, 100% 100%, 0 100%); }
                                                                                                                                                            .ill-card {
                                                                                                                                                              position: absolute; left: 50%; top: 20px; transform: translateX(-50%);
                                                                                                                                                                width: 130px; height: 180px; background: #f9c8ec;
                                                                                                                                                                }
                                                                                                                                                                .ill-cloud {
                                                                                                                                                                  position: absolute; right: 78px; bottom: 0;
                                                                                                                                                                    width: 70px; height: 60px; background: #ff7a00;
                                                                                                                                                                      border-radius: 50% 50% 0 0; border: 3px solid #000;
                                                                                                                                                                      }

                                                                                                                                                                      /* Navegação inferior */
                                                                                                                                                                      .bottom-nav {
                                                                                                                                                                        position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
                                                                                                                                                                          width: 100%; max-width: 430px;
                                                                                                                                                                            display: flex; align-items: center; justify-content: space-around;
                                                                                                                                                                              padding: 10px 8px 14px;
                                                                                                                                                                                background: var(--bg);
                                                                                                                                                                                  border-top: 1px solid var(--line);
                                                                                                                                                                                  }
                                                                                                                                                                                  .bottom-nav button { padding: 10px 14px; position: relative; }
                                                                                                                                                                                  .bottom-nav svg { width: 30px; height: 30px; }
                                                                                                                                                                                  .has-dot::after {
                                                                                                                                                                                    content: ""; position: absolute; right: 8px; bottom: 6px;
                                                                                                                                                                                      width: 9px; height: 9px; border-radius: 50%; background: var(--red);
                                                                                                                                                                                      }
                                                                                                                                                                                      .nav-profile { background: var(--card); border-radius: 999px; padding: 8px 22px !important; }
                                                                                                                                                                                      .mini-avatar {
                                                                                                                                                                                        width: 40px; height: 40px; border-radius: 50%;
                                                                                                                                                                                          background: radial-gradient(circle at 40% 35%, #c98f6b, #5a2d22 70%, #1e1411);
                                                                                                                                                                                            border: 2px solid #fff;
                                                                                                                                                                                            }

                                                                                                                                                                                            /* Ajustes do perfil 2 — carregue depois do style.css */

                                                                                                                                                                                            .sans { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
                                                                                                                                                                                            .name.sans { font-size: 21px; margin-bottom: 10px; }

                                                                                                                                                                                            .avatar.ring {
                                                                                                                                                                                              border: 3px solid #3a3f47;
                                                                                                                                                                                                box-shadow: inset 0 0 0 4px var(--bg);
                                                                                                                                                                                                }

                                                                                                                                                                                                /* Notificação do Threads */
                                                                                                                                                                                                .badge-wrap { position: relative; }
                                                                                                                                                                                                .badge {
                                                                                                                                                                                                  position: absolute; top: -6px; right: -6px;
                                                                                                                                                                                                    min-width: 22px; height: 22px; padding: 0 5px;
                                                                                                                                                                                                      background: var(--red); color: #fff;
                                                                                                                                                                                                        border-radius: 999px; font-size: 13px; font-weight: 700;
                                                                                                                                                                                                          display: grid; place-items: center;
                                                                                                                                                                                                          }

                                                                                                                                                                                                          /* Nota de música */
                                                                                                                                                                                                          .note {
                                                                                                                                                                                                            display: flex; flex-direction: column; align-items: flex-start;
                                                                                                                                                                                                              width: 130px; padding: 8px 12px; top: -46px; left: 6px;
                                                                                                                                                                                                              }
                                                                                                                                                                                                              .note b { color: var(--text); font-size: 15px; font-weight: 600; }
                                                                                                                                                                                                              .note small { font-size: 14px; color: var(--muted); }
                                                                                                                                                                                                              .bars { position: absolute; left: 12px; top: 12px; display: none; }

                                                                                                                                                                                                              /* Bio */
                                                                                                                                                                                                              .bio2 { padding-top: 4px; }
                                                                                                                                                                                                              .emoji-line { font-size: 22px; }
                                                                                                                                                                                                              .bio2 .bio-text { font-size: 19px; font-weight: 400; margin-top: 4px; }
                                                                                                                                                                                                              .translate { font-size: 19px; font-weight: 700; margin-top: 4px; }

                                                                                                                                                                                                              /* Chips */
                                                                                                                                                                                                              .chips { display: flex; gap: 10px; padding: 16px 12px 0; }
                                                                                                                                                                                                              .chips .chip { margin-top: 0; padding: 8px 12px; font-size: 17px; display: flex; align-items: center; gap: 6px; }
                                                                                                                                                                                                              .chips .chip svg { width: 18px; height: 18px; }
                                                                                                                                                                                                              .chip-strong b { font-weight: 700; }
                                                                                                                                                                                                              .chip-muted { color: var(--muted); }

                                                                                                                                                                                                              /* Três botões */
                                                                                                                                                                                                              .actions3 { padding-top: 18px; }
                                                                                                                                                                                                              .actions3 .btn { font-size: 18px; padding: 14px 0; }
                                                                                                                                                                                                              .actions3 .btn-icon { flex: 0 0 58px; display: grid; place-items: center; padding: 0; }
                                                                                                                                                                                                              .actions3 .btn-icon svg { width: 26px; height: 26px; }

                                                                                                                                                                                                              </style>
                                                                                                                                                                                                              <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                                                                                                                                                                                                              <body>
                                                                                                                                                                                                                <div class="app">

                                                                                                                                                                                                                    <!-- Topo -->
                                                                                                                                                                                                                        <header class="topbar">
                                                                                                                                                                                                                              <button class="icon-btn" aria-label="Criar">
                                                                                                                                                                                                                                      <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>
                                                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                                                  <button class="username">
                                                                                                                                                                                                                                                          nome_de_usuario

                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                              <div class="top-right">

                                                                                                                                                                                                                                                                                                          <span class="badge">1</span>
                                                                                                                                                                                                                                                                                                                  </button>
                                                                                                                                                                                                                                                                                                                          <button class="icon-btn" aria-label="Menu">
                                                                                                                                                                                                                                                                                                                                    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                                                                                                                                                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                      </header>

                                                                                                                                                                                                                                                                                                                                                          <!-- Perfil -->
                                                                                                                                                                                                                                                                                                                                                              <section class="profile">
                                                                                                                                                                                                                                                                                                                                                                    <div class="avatar-wrap">
                                                                                                                                                                                                                                                                                                                                                                            <div class="note">
                                                                                                                                                                                                                                                                                                                                                                                      <span class="bars"><i></i><i></i><i></i></span>
                                                                                                                                                                                                                                                                                                                                                                                                <b>Música</b>

                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="avatar ring"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                  <span class="avatar-plus">+</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="info">
                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h1 class="name sans">Nome Sobrenome</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="stats">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div><strong>2</strong><span>posts</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div><strong>247</strong><span>seguidores</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div><strong>178</strong><span>seguindo</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <!-- Bio -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <section class="bio bio2">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p class="emoji-line">💍</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p class="bio-text sans">life goes on 🤍</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Chips -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <section class="chips">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button class="chip chip-strong">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button class="chip chip-muted">+ Adicionar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <!-- Botões -->

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="btn">Editar perfil</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button class="btn">Compartilhar perfil</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="btn btn-icon" aria-label="Descobrir pessoas">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <!-- Destaques -->

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <!-- Abas -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <nav class="tabs">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="tab active" aria-label="Posts">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <svg viewBox="0 0 24 24" class="fill"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="9.500" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="9.500" width="5" height="5" rx="1"/><rect x="9.500" y="9.500" width="5" height="5" rx="1"/><rect x="16" y="9.500" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="9.500" y="16" width="5" height="5" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/></svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="tab" aria-label="Reels">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M10 8.500v7l5.500-3.500z"/></svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button class="tab" aria-label="Republicações">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <svg viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h10l-3-3M20 13v2a3 3 0 0 1-3 3H7l3 3"/></svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="tab" aria-label="Marcados">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><circle cx="12" cy="11" r="2.500"/><path d="M7.500 18c.8-2 2.400-3 4.500-3s3.700 1 4.500 3M9 5V3.500h6V5"/></svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </nav>
