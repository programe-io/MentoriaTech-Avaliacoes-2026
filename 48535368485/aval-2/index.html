
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>MiniFeed</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main>

        <section class="publicar">
            <div class="avatar">J</div>

            <div class="campo">
                <h3>Jonathan</h3>
                <p>O que você está pensando?</p>
            </div>

            <button class="btn-publicar">Publicar</button>
        </section>

        <section class="post">

            <div class="usuario">
                <div class="avatar">M</div>

                <div>
                    <h3>Maria</h3>
                    <p>Há 10 minutos</p>
                </div>
            </div>

            <p class="descricao">
                Hoje eu vi uma foto incrível! Muito top, estou feliz :D
            </p>

            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQqQcg0fLjLA97Df_uO1CgJFgEVSl2RxVqP1LydCu0GrcpPR4SEa0ETrExa7EVn-Zzk5fFiP1h3OkKrtMTq3HS0NhXU0v6aDN9lN7ojgcNEE53CB2C_ag&s=10&ec=122259001"
                alt="Foto de um homem"
                class="imagem-post"
            >

            <div class="acoes">

                <button id="likeButton" class="btn-like">
                    ♡ Curtir <span id="likeCount">0</span>
                </button>

                <button id="commentButton">
                    Comentar
                </button>

            </div>

            <div class="comentarios" id="comentarios">

                <input
                    type="text"
                    id="commentInput"
                    placeholder="Escreva um comentário..."
                >

                <button id="sendComment">Enviar</button>

                <div id="commentList"></div>

            </div>

        </section>

    </main>

    <footer>
        MiniFeed - Todos os Direitos Reservados
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
