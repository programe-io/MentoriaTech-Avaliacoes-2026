
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Mini Feed</h1>
        <nav>
            <a href="#inicio">Início</a>
            <a href="#publicacoes">Publicações</a>
            <a href="#sobre">Sobre</a>
        </nav>
    </header>

    <main>
        <section class="criar-post" id="inicio">
            <h2>O que você está pensando?</h2>
            <form>
                <input type="text" placeholder="Seu nome" required>
                <textarea placeholder="Escreva uma publicação..." required></textarea>
                <button type="submit">Publicar</button>
            </form>
        </section>

        <section class="feed" id="publicacoes">
            <h2>Últimas publicações</h2>

            <article class="post">
                <div class="usuario">
                    <div class="avatar">J</div>
                    <div>
                        <h3>João Silva</h3>
                        <small>Há 10 minutos</small>
                    </div>
                </div>

                <p>Olá, pessoal! Sejam bem-vindos ao meu Mini Feed!</p>

                <div class="acoes">
                    <button type="button">❤️ Curtir</button>
                    <button type="button">💬 Comentar</button>
                </div>
            </article>

            <article class="post">
                <div class="usuario">
                    <div class="avatar azul">M</div>
                    <div>
                        <h3>Maria Oliveira</h3>
                        <small>Há 30 minutos</small>
                    </div>
                </div>

                <p>Hoje é um ótimo dia para aprender algo novo! 📚</p>

                <div class="acoes">
                    <button type="button">❤️ Curtir</button>
                    <button type="button">💬 Comentar</button>
                </div>
            </article>

        </section>
    </main>

    <footer id="sobre">
        <p>Mini Feed © 2026 - Minha pequena rede social</p>
    </footer>

</body>
</html>
