<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #1e3a5f;
        }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        input[type="button"] {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background-color: #00b894;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: #008f72;
        }

        #resultado {
            margin-top: 20px;
        }

        .produto {
            background-color: #f5f5f5;
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #00b894;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>📦 Sistema de Estoque</h1>

        <p><strong>Escolha uma opção:</strong></p>

        <div class="botoes">

            <input type="button"
                   id="btnCadastrar"
                   value="Cadastrar produto">

            <input type="button"
                   id="btnListar"
                   value="Listar produtos">

            <input type="button"
                   id="btnValor"
                   value="Alterar valor">

            <input type="button"
                   id="btnQuantidade"
                   value="Alterar quantidade">

        </div>

        <div id="resultado"></div>

    </div>

    <script>

        let produtos = [];

        // CADASTRAR PRODUTO
        function cadastrarProduto() {

            let codigo = prompt("Digite o código do produto:");

            if (codigo === null || codigo.trim() === "") {
                alert("Código inválido!");
                return;
            }

            codigo = codigo.trim();

            // Verifica se o código já existe
            if (produtos.some(p => p.codigo === codigo)) {
                alert("Já existe um produto com esse código!");
                return;
            }

            let descricao = prompt("Digite a descrição do produto:");

            if (descricao === null || descricao.trim() === "") {
                alert("Descrição inválida!");
                return;
            }

            descricao = descricao.trim();

            let quantidadeTexto = prompt(
                "Digite a quantidade do produto:"
            );

            if (quantidadeTexto === null) {
                return;
            }

            let quantidade = Number(
                quantidadeTexto.replace(",", ".")
            );

            if (!Number.isFinite(quantidade) || quantidade < 0) {
                alert("Quantidade inválida!");
                return;
            }

            let valorTexto = prompt(
                "Digite o valor do produto:"
            );

            if (valorTexto === null) {
                return;
            }

            let valor = Number(
                valorTexto.replace(",", ".")
            );

            if (!Number.isFinite(valor) || valor < 0) {
                alert("Valor inválido!");
                return;
            }

            produtos.push({
                codigo: codigo,
                descricao: descricao,
                quantidade: quantidade,
                valor: valor
            });

            alert("Produto cadastrado com sucesso!");

            listarProdutos();
        }


        // LISTAR PRODUTOS
        function listarProdutos() {

            const resultado =
                document.getElementById("resultado");

            if (produtos.length === 0) {

                resultado.innerHTML =
                    "<p>Nenhum produto cadastrado.</p>";

                return;
            }

            let html =
                "<h2>Produtos cadastrados</h2>";

            produtos.forEach(produto => {

                html += `
                    <div class="produto">

                        <strong>Código:</strong>
                        ${produto.codigo}
                        <br>

                        <strong>Descrição:</strong>
                        ${produto.descricao}
                        <br>

                        <strong>Quantidade:</strong>
                        ${produto.quantidade}
                        <br>

                        <strong>Valor:</strong>
                        R$ ${produto.valor
                            .toFixed(2)
                            .replace(".", ",")}

                    </div>
                `;

            });

            resultado.innerHTML = html;
        }


        // ENCONTRAR PRODUTO
        function encontrarProduto(codigo) {

            return produtos.find(
                p => p.codigo === codigo
            );

        }


        // ALTERAR VALOR
        function alterarValor() {

            if (produtos.length === 0) {

                alert(
                    "Não existem produtos cadastrados."
                );

                return;
            }

            let codigo = prompt(
                "Digite o código do produto:"
            );

            if (codigo === null) {
                return;
            }

            const produto =
                encontrarProduto(codigo.trim());

            if (!produto) {

                alert("Produto não encontrado!");

                return;
            }

            let novoValorTexto = prompt(
                "Digite o novo valor:"
            );

            if (novoValorTexto === null) {
                return;
            }

            let novoValor = Number(
                novoValorTexto.replace(",", ".")
            );

            if (
                !Number.isFinite(novoValor) ||
                novoValor < 0
            ) {

                alert("Valor inválido!");

                return;
            }

            produto.valor = novoValor;

            alert(
                "Valor alterado com sucesso!"
            );

            listarProdutos();
        }


        // ALTERAR QUANTIDADE
        function alterarQuantidade() {

            if (produtos.length === 0) {

                alert(
                    "Não existem produtos cadastrados."
                );

                return;
            }

            let codigo = prompt(
                "Digite o código do produto:"
            );

            if (codigo === null) {
                return;
            }

            const produto =
                encontrarProduto(codigo.trim());

            if (!produto) {

                alert("Produto não encontrado!");

                return;
            }

            let novaQuantidadeTexto = prompt(
                "Digite a nova quantidade:"
            );

            if (novaQuantidadeTexto === null) {
                return;
            }

            let novaQuantidade = Number(
                novaQuantidadeTexto.replace(",", ".")
            );

            if (
                !Number.isFinite(novaQuantidade) ||
                novaQuantidade < 0
            ) {

                alert("Quantidade inválida!");

                return;
            }

            produto.quantidade = novaQuantidade;

            alert(
                "Quantidade alterada com sucesso!"
            );

            listarProdutos();
        }


        // BOTÕES
        document
            .getElementById("btnCadastrar")
            .addEventListener(
                "click",
                cadastrarProduto
            );

        document
            .getElementById("btnListar")
            .addEventListener(
                "click",
                listarProdutos
            );

        document
            .getElementById("btnValor")
            .addEventListener(
                "click",
                alterarValor
            );

        document
            .getElementById("btnQuantidade")
            .addEventListener(
                "click",
                alterarQuantidade
            );

    </script>

</body>

</html>
