<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Adivinhação</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="game-container">
        <h1>Adivinhe o Número</h1>
        <p>Tente adivinhar o número entre <strong>1 e 100</strong>!</p>
        
        <div class="input-area">
            <input type="number" id="palpite" min="1" max="100" placeholder="Digite seu número">
            <button onclick="verificarPalpite()">Chutar</button>
        </div>

        <p id="mensagem" class="mensagem"></p>
        <button id="reiniciar" onclick="reiniciarJogo()" style="display: none;">Jogar Novamente</button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
