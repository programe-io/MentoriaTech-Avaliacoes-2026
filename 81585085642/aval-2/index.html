<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Adivinhação</title>
  <!-- Link do arquivo CSS -->
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="game-container">
    <h1>Adivinhe o Número</h1>
    <p>Estou pensando em um número entre **1 e 50**. Tente adivinhar!</p>

    <div class="input-area">
      <input type="number" id="palpiteInput" min="1" max="50" placeholder="Digite seu palpite">
      <button id="btnChutar">Chutar</button>
    </div>

    <p id="mensagem" class="mensagem"></p>
    <button id="btnReiniciar" class="escondido">Jogar Novamente</button>
  </div>

  <!-- Link do arquivo JavaScript -->
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
