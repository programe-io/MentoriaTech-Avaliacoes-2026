
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <!-- 7. Ligação com o arquivo de estilização (CSS) -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- 3 & 4. Estrutura semântica: Cabeçalho e Navegação -->
    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <!-- 3. Estrutura semântica: Conteúdo principal do Mini Feed -->
    <main>

        <!-- 5. Área de nova publicação -->
        <section class="new-post">
            <div class="user">
                <!-- Avatar representado inicialmente por uma letra -->
                <div class="avatar">U</div>
                <div class="user-info">
                    <strong>Seu Nome</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>
            <!-- Botão de publicação com classe para receber os estilos CSS -->
            <button type="button" class="btn-publish">Publicar</button>
        </section>

        <!-- 6. Estrutura das postagens do feed -->
        <div class="feed">
            
            <!-- Postagem 1 (Representada pela tag semântica article) -->
            <article class="post">
                
                <!-- Cabeçalho da postagem -->
                <div class="post-header">
                    <div class="avatar">P</div>
                    <div class="user-info">
                        <strong>Peter Parker</strong>
                        <span class="post-time">há 10 minutos</span>
                    </div>
                </div>

                <!-- Texto da postagem -->
                <div class="post-text">
                    <p>Acabei de assistir ao novo filme do Homem-Aranha! Sensacional do início ao fim, cheio de ação e muita emoção. Quem mais já foi ver nos cinemas?</p>
                </div>

                <!-- Imagem com atributos src e alt para acessibilidade -->
                <img src="https://picsum.photos" alt="Homem-Aranha saltando entre prédios em uma cidade iluminada à noite" class="post-image">

                <!-- Ações da postagem (O JavaScript irá configurar os cliques aqui) -->
                <div class="post-actions">
                    <button type="button" class="btn-action">Curtir</button>
                    <button type="button" class="btn-action">Comentar</button>
                </div>

            </article>

        </div>

    </main>

    <!-- 3. Estrutura semântica: Rodapé da página -->
    <footer>
        <p>&copy; 2026 Mini Feed - Todos os direitos reservados.</p>
    </footer>

    <!-- 11. Vinculação do arquivo de interações (JavaScript) -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
