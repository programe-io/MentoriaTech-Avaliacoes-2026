<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="topo">
  <h1>📦 Controle de Estoque</h1>
  <p>Cadastre produtos e acompanhe quantidades e valores</p>
</header>

<main class="container">
  <p id="mensagem"></p>

  <div class="resumo">
    <div class="card"><span>Produtos</span><strong id="resProdutos">0</strong></div>
    <div class="card"><span>Unidades</span><strong id="resUnidades">0</strong></div>
    <div class="card"><span>Valor em estoque</span><strong id="resValor">R$ 0,00</strong></div>
  </div>

  <div class="grade">
    <section>
      <h2>➕ Cadastrar produto</h2>
      <label for="descricao">Descrição</label>
      <input id="descricao" type="text" placeholder="Ex.: Teclado mecânico">
      <label for="quantidade">Quantidade</label>
      <input id="quantidade" type="number" placeholder="Ex.: 15">
      <label for="valor">Valor (R$)</label>
      <input id="valor" type="number" step="0.01" placeholder="Ex.: 249.90">
      <button id="btnCadastrar" type="button">Cadastrar produto</button>
    </section>

    <section>
      <h2>✏️ Alterar produto</h2>
      <label for="codigo">Código do produto</label>
      <input id="codigo" type="number" placeholder="Ex.: 1">
      <label for="novoValor">Novo valor (R$)</label>
      <div class="linha">
        <input id="novoValor" type="number" step="0.01" placeholder="Ex.: 199.90">
        <button id="btnValor" type="button">Alterar</button>
      </div>
      <label for="novaQuantidade">Nova quantidade</label>
      <div class="linha">
        <input id="novaQuantidade" type="number" placeholder="Ex.: 20">
        <button id="btnQuantidade" type="button">Alterar</button>
      </div>
    </section>
  </div>

  <section>
    <h2>📋 Produtos cadastrados</h2>
    <div class="tabela-wrap">
      <table>
        <thead>
          <tr><th>Código</th><th>Descrição</th><th>Quantidade</th><th>Valor</th><th>Situação</th></tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </section>
</main>
  <script src="script.js"></script>
  
</body>
</html>
