<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="app">
  <header class="topo">
    <div>
      <h1>📝 Lista de Tarefas do Dia</h1>
      <p id="dataHoje"></p>
    </div>
    <button id="btnTema" class="btn btn-ghost" type="button" title="Alternar tema">🌙</button>
  </header>

  <div class="stats">
    <div class="stat"><span>Total</span><strong id="statTotal">0</strong></div>
    <div class="stat"><span>Pendentes</span><strong id="statPendentes">0</strong></div>
    <div class="stat"><span>Concluídas</span><strong id="statConcluidas">0</strong></div>
    <div class="stat progresso">
      <span>Progresso do dia</span>
      <div class="barra"><div id="barra"></div></div>
      <small id="statPct">0%</small>
    </div>
  </div>

  <section class="card">
    <div class="nova">
      <input id="titulo" class="control grande" type="text" placeholder="Uma nova tarefa..." aria-label="Nova tarefa">
      <input id="horario" class="control" type="time" aria-label="Horário (opcional)">
      <select id="prioridade" class="control" aria-label="Prioridade">
        <option value="1">🔴 Alta</option>
        <option value="2" selected>🟡 Média</option>
        <option value="3">🟢 Baixa</option>
      </select>
      <button id="btnAdicionar" class="btn btn-primary" type="button">Adicionar</button>
    </div>
  </section>

  <section class="card">
    <div class="toolbar">
      <input id="busca" class="control" type="search" placeholder="🔍 Buscar tarefa..." aria-label="Buscar">
      <div class="segmentado" id="filtros">
        <button type="button" data-filtro="todas" class="ativo">Todas</button>
        <button type="button" data-filtro="pendentes">Pendentes</button>
        <button type="button" data-filtro="concluidas">Concluídas</button>
      </div>
    </div>
    <ul id="lista" class="lista"></ul>
    <div class="rodape">
      <span id="contador"></span>
      <button id="btnLimpar" class="btn btn-ghost" type="button">Limpar concluídas</button>
    </div>
  </section>
</div>
<div id="toasts" class="toasts"></div>

  <script src="script.js"></script>
  
</body>
</html>
