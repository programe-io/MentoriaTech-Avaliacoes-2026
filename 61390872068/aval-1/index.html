<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">

<body>
  !DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Minecraft Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Mini Minecraft 2D</h1>
        <div id="mundo" class="mundo"></div>

        <!-- Barra de Inventário (Hotbar) -->
        <div class="hotbar">
            <div class="slot selecionado" data-bloco="grama">🌿<span label>Grama</span></div>
            <div class="slot" data-bloco="terra">🟫<span label>Terra</span></div>
            <div class="slot" data-bloco="pedra">⬜<span label>Pedra</span></div>
            <div class="slot" data-bloco="madeira">🪵<span label>Madeira</span></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
  <script src="script.js"></script>
  
</body>
</html>
