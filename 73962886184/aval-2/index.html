<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Perfume Elegance - Loja Online</title>

                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                <header>
                    <h1>PERFUME ELEGANCE</h1>
                        <div class="cart-icon" onclick="toggleCarrinho()">
                                🛒 Carrinho (<span id="cart-count">0</span>)
                                    </div>
                                    </header>

                                    <main>

                                    <section class="products-grid">

                                    <div class="product-card">
                                    <img src="https://images.unsplash.com/photo-1541643600914-78b084683601?w=400" alt="Perfume Essenze Floral">

                                    <div>
                                    <h3>Essenze Floral</h3>
                                    <p class="price">R$ 250,00</p>
                                    </div>

                                    <button class="btn-add" onclick="adicionarAoCarrinho('Essenze Floral',250)">
                                    Adicionar ao Carrinho
                                    </button>
                                    </div>

                                    <div class="product-card">
                                    <img src="https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=400" alt="Perfume Noir Amadeirado">

                                    <div>
                                    <h3>Noir Amadeirado</h3>
                                    <p class="price">R$ 320,00</p>
                                    </div>

                                    <button class="btn-add" onclick="adicionarAoCarrinho('Noir Amadeirado',320)">
                                    Adicionar ao Carrinho
                                    </button>
                                    </div>

                                    <div class="product-card">
                                    <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400" alt="Perfume Bleu Citrus">

                                    <div>
                                    <h3>Bleu Citrus</h3>
                                    <p class="price">R$ 290,00</p>
                                    </div>

                                    <button class="btn-add" onclick="adicionarAoCarrinho('Bleu Citrus',290)">
                                    Adicionar ao Carrinho
                                    </button>
                                    </div>

                                    </section>

                                    <aside id="carrinho-sidebar" class="sidebar">

                                    <span class="close-cart" onclick="toggleCarrinho()">&times;</span>

                                    <h2>Seu Carrinho</h2>

                                    <ul id="cart-items"></ul>

                                    <div class="cart-total">
                                    <span>Total:</span>
                                    <strong>R$ <span id="cart-total-price">0,00</span></strong>
                                    </div>

                                    <form id="checkout-form" onsubmit="finalizarCompra(event)">

                                    <h3>Seus Dados</h3>

                                    <input type="text" id="nome" placeholder="Nome Completo" required>

                                    <input type="email" id="email" placeholder="Seu Melhor E-mail" required>

                                    <input type="tel" id="telefone" placeholder="Telefone / WhatsApp" required>

                                    <h3>Forma de Pagamento</h3>

                                    <select id="payment-method" required>
                                    <option value="pix">Pix (com 5% de desconto)</option>
                                    <option value="cartao">Cartão de Crédito</option>
                                    <option value="boleto">Boleto Bancário</option>
                                    </select>

                                    <button class="btn-checkout">
                                    Finalizar Pedido
                                    </button>

                                    </form>

                                    </aside>

                                    </main>

                                    <script src="script.js"></script>

                                    <script src="script.js"></script></body>
                                    </html>
                                    </nav>
                                    <nav>
                                        </a>
                                        <a>
                                            </article>
                                            <article>
                                                </footer>
                                            <footer>
