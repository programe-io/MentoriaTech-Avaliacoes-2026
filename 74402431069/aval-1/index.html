<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Lojinha</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: #f3e8ff;
    padding: 20px;
}

.container{
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1{
    text-align: center;
    color: #7e57c2;
}

.dados{
    text-align: center;
    color: #7e57c2;
    font-weight: bold;
    margin-bottom: 25px;
}

.card{
    border: 2px solid #d1c4e9;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    background: #faf7ff;
}

h2{
    color: #7e57c2;
}

input{
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 10px;
    border: 1px solid #d1c4e9;
    border-radius: 8px;
}

button{
    background: #9575cd;
    color: white;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover{
    background: #7e57c2;
}

.produto{
    background: white;
    border: 2px solid #d8c4ff;
    border-radius: 15px;
    padding: 15px;
    margin-top: 15px;
    box-shadow: 0 3px 8px rgba(126,87,194,0.15);
}

.produto h3{
    color: #7e57c2;
    margin-bottom: 10px;
}

.info{
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    gap: 10px;
}

.caixa{
    flex: 1;
    background: #f8f3ff;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
}

footer{
    text-align: center;
    margin-top: 20px;
    color: #7e57c2;
    font-weight: bold;
}

</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>💜 Minha Lojinha 💜</h1>

    <div class="dados">
        Fernanda Vieira<br>
        CETI Francisco Sales Marthis
    </div>

    <div class="card">
        <h2>📦 Cadastrar Produto</h2>

        <input type="text" id="descricao" placeholder="Descrição do produto">
        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="number" id="valor" placeholder="Valor">

        <button onclick="cadastrarProduto()">Cadastrar Produto</button>
    </div>

    <div class="card">
        <h2>💰 Alterar Valor</h2>

        <input type="number" id="codigoValor" placeholder="Código do produto">
        <input type="number" id="novoValor" placeholder="Novo valor">

        <button onclick="alterarValor()">Alterar Valor</button>
    </div>

    <div class="card">
        <h2>📦 Alterar Quantidade</h2>

        <input type="number" id="codigoQuantidade" placeholder="Código do produto">
        <input type="number" id="novaQuantidade" placeholder="Quantidade a adicionar">

        <button onclick="alterarQuantidade()">Alterar Quantidade</button>
    </div>

    <div class="card">
        <h2>🛍️ Produtos Cadastrados</h2>

        <button onclick="listarProdutos()">Ver Produtos</button>

        <div id="listaProdutos"></div>
    </div>

    <footer>
        💜 Desenvolvido por Fernanda Vieira 💜
    </footer>

</div>

<script>

let produtos = [];

function cadastrarProduto(){

    let descricao = document.getElementById("descricao").value;
    let quantidade = Number(document.getElementById("quantidade").value);
    let valor = Number(document.getElementById("valor").value);

    if(descricao === ""){
        alert("Digite a descrição do produto.");
        return;
    }

    if(quantidade <= 0){
        alert("Digite uma quantidade válida.");
        return;
    }

    let produto = {
        codigo: produtos.length + 1,
        descricao: descricao,
        quantidade: quantidade,
        valor: valor
    };

    produtos.push(produto);

    alert("✅ Produto cadastrado com sucesso!");
}

function listarProdutos(){

    let lista = document.getElementById("listaProdutos");

    lista.innerHTML = "";

    if(produtos.length === 0){
        lista.innerHTML = "<p>Nenhum produto cadastrado.</p>";
        return;
    }

    produtos.forEach(produto => {

        lista.innerHTML += `
        <div class="produto">

            <h3>📦 Produto ${produto.codigo}</h3>

            <p><strong>📝 Descrição:</strong> ${produto.descricao}</p>

            <div class="info">

                <div class="caixa">
                    <strong>Quantidade</strong><br>
                    ${produto.quantidade}
                </div>

                <div class="caixa">
                    <strong>Valor</strong><br>
                    R$ ${produto.valor.toFixed(2)}
                </div>

            </div>

        </div>
        `;
    });
}

function alterarValor(){

    let codigo = Number(document.getElementById("codigoValor").value);
    let novoValor = Number(document.getElementById("novoValor").value);

    let produto = produtos.find(p => p.codigo === codigo);

    if(produto){

        produto.valor = novoValor;

        alert(
            "✅ Valor atualizado!\n\n" +
            "Produto: " + produto.descricao +
            "\nNovo valor: R$ " + produto.valor.toFixed(2)
        );

    }else{
        alert("❌ Produto não encontrado.");
    }
}

function alterarQuantidade(){

    let codigo = Number(document.getElementById("codigoQuantidade").value);
    let quantidade = Number(document.getElementById("novaQuantidade").value);

    let produto = produtos.find(p => p.codigo === codigo);

    if(produto){

        produto.quantidade += quantidade;

        alert(
            "✅ Quantidade atualizada!\n\n" +
            "Produto: " + produto.descricao +
            "\nNova quantidade: " + produto.quantidade
        );

    }else{
        alert("❌ Produto não encontrado.");
    }
}

</script>

</body>
</html>
