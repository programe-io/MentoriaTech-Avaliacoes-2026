<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de IMC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Calculadora de IMC</h1>
    <p class="subtitulo">Cadastre pacientes e acompanhe o Índice de Massa Corporal de cada um.</p>

    <!-- CARD 1: FORMULÁRIO -->
    <section class="card">
      <h2 id="titulo-form">Novo paciente</h2>

      <form id="form-pessoa" novalidate>
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Ex.: Maria Souza" maxlength="50" autocomplete="off">
        </div>

        <div class="linha">
          <div class="campo">
            <label for="idade">Idade (anos)</label>
            <input type="number" id="idade" placeholder="Ex.: 34" min="1" max="120">
          </div>
          <div class="campo">
            <label for="altura">Altura (m)</label>
            <input type="number" id="altura" placeholder="Ex.: 1.70" min="0.5" max="2.5" step="0.01">
          </div>
          <div class="campo">
            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso" placeholder="Ex.: 68.5" min="2" max="500" step="0.1">
          </div>
        </div>

        <!-- Prévia ao vivo do IMC -->
        <div class="previa" id="previa" hidden>
          <div class="previa-topo">
            <strong id="previa-valor">--</strong>
            <span id="previa-classe" class="selo">--</span>
          </div>
          <div class="escala" aria-hidden="true">
            <span class="faixa f-abaixo"></span>
            <span class="faixa f-normal"></span>
            <span class="faixa f-sobrepeso"></span>
            <span class="faixa f-ob1"></span>
            <span class="faixa f-ob2"></span>
            <span class="faixa f-ob3"></span>
            <i id="marcador"></i>
          </div>
          <p id="previa-dica" class="dica"></p>
        </div>

        <p id="erro" class="erro" role="alert"></p>

        <div class="botoes">
          <button type="submit" id="btn-salvar" class="btn primario">Salvar paciente</button>
          <button type="button" id="btn-cancelar" class="btn secundario">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- CARD 2: TABELA -->
    <section class="card">
      <div class="cabecalho-tabela">
        <h2>Pacientes cadastrados</h2>
        <div class="resumo">
          <span><b id="res-total">0</b> pacientes</span>
          <span>IMC médio <b id="res-media">--</b></span>
        </div>
      </div>

      <div class="rolagem">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Idade</th>
              <th>Altura</th>
              <th>Peso</th>
              <th>IMC</th>
              <th>Classificação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-pessoas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
