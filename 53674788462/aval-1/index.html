<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="header-content">
      <h1>Mini Feed</h1>
      <nav>
        <a href="#">Início</a>
        <a href="#">Perfil</a>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main>

    <!-- Área de Nova Publicação -->
    <section class="new-post-card">
      <div class="user">
        <div class="avatar">U</div>
        <div class="user-info">
          <strong>Usuário Logado</strong>
          <span>O que você está pensando?</span>
        </div>
      </div>
      <button>Publicar</button>
    </section>

    <!-- Postagem 1 -->
    <article class="post">
      <div class="post-header user">
        <div class="avatar">H</div>
        <div class="user-info">
          <strong>Homem-Aranha</strong>
          <span>há 10 minutos</span>
        </div>
      </div>

      <p class="post-text">Com grandes poderes vêm grandes responsabilidades!</p>

      <img src="https://via.placeholder.com/600x350" alt="Imagem da postagem do Homem-Aranha">

      <div class="post-actions">
        <button>Curtir</button>
        <button>Comentar</button>
      </div>
    </article>

    <!-- Postagem 2 (Duplicada para demonstrar o feed em sequência) -->
    <article class="post">
      <div class="post-header user">
        <div class="avatar">M</div>
        <div class="user-info">
          <strong>Maria Silva</strong>
          <span>há 30 minutos</span>
        </div>
      </div>

      <p class="post-text">Dia incrível aprendendo desenvolvimento web com HTML e CSS!</p>

      <img src="https://via.placeholder.com/600x350" alt="Imagem de tecnologia e código">

      <div class="post-actions">
        <button>Curtir</button>
        <button>Comentar</button>
      </div>
    </article>

  </main>

  <!-- Rodapé -->
  <footer>
    <p>&copy; Todos os direitos reservados - Mini Feed</p>
  </footer>

</body>
</html>
