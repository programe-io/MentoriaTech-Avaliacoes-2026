<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Fidi 💗</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>🎀 Mini Fidi 🎀</h1>
    <p>Um mundinho cheio de fofura!</p>
  </header>

  <nav>
    <a href="#inicio">Início</a>
    <a href="#personagens">Personagens</a>
    <a href="#roupas">Roupas</a>
  </nav>

  <main>
    <section id="inicio" class="card">
      <h2>Bem-vinda ao Mini Fidi! 💕</h2>
      <p>Crie seu mundinho mágico e divirta-se!</p>
      <button onclick="mensagem()">Clique aqui 💗</button>
    </section>

    <section id="personagens" class="card">
      <h2>🌸 Personagens</h2>
      <div class="personagens">
        <div>👧🏻<p>Fifi</p></div>
        <div>👸🏻<p>Lili</p></div>
        <div>🧚🏻‍♀️<p>Mimi</p></div>
      </div>
    </section>

    <section id="roupas" class="card">
      <h2>👗 Loja de roupinhas</h2>
      <p>Escolha seu estilo favorito!</p>
      <div class="roupas">
        <span>🎀</span>
        <span>👗</span>
        <span>👑</span>
        <span>👜</span>
        <span>👠</span>
      </div>
    </section>
  </main>

  <footer>
    Feito com 💗 para Mini Fidi
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
