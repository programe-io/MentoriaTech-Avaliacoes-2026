

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabor & Arte | Cardápio Digital</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topo">
  <div class="logo">🍽️ Sabor & Arte</div>
  <button id="abrirCarrinho" class="botao-carrinho">
    🛒 Carrinho (<span id="quantidadeCarrinho">0</span>)
  </button>
</header>

<section class="banner">
  <h1>Seu sabor favorito está aqui!</h1>
  <p>Almoço, lanches, sobremesas e bebidas.</p>
</section>

<main class="container">
  <h2>Nosso cardápio</h2>

  <input type="text" id="busca" placeholder="🔎 Buscar produto...">

  <nav class="categorias">
    <button class="filtro ativo" data-categoria="todos">Todos</button>
    <button class="filtro" data-categoria="almoco">🍛 Almoço</button>
    <button class="filtro" data-categoria="lanche">🍔 Lanches</button>
    <button class="filtro" data-categoria="sobremesa">🍰 Sobremesas</button>
    <button class="filtro" data-categoria="bebida">🥤 Bebidas</button>
  </nav>

  <section id="produtos" class="produtos"></section>
</main>

<!-- CARRINHO -->
<div class="modal" id="modalCarrinho">
  <div class="modal-conteudo">
    <button class="fechar" id="fecharCarrinho">×</button>
    <h2>🛒 Meu carrinho</h2>
    <div id="itensCarrinho"></div>
    <h3>Total: <span id="totalCarrinho">R$ 0,00</span></h3>
    <button id="fecharPedido" class="botao-principal">
      Fechar pedido
    </button>
  </div>
</div>

<!-- FINALIZAÇÃO DO PEDIDO -->
<div class="modal" id="modalFinalizar">
  <div class="modal-conteudo">
    <button class="fechar" id="fecharFinalizar">×</button>
    <h2>📋 Finalizar pedido</h2>

    <form id="formPedido">
      <label for="nomeCliente">Seu nome</label>
      <input id="nomeCliente" type="text" placeholder="Digite seu nome" required>

      <label for="enderecoCliente">Endereço de entrega</label>
      <input id="enderecoCliente" type="text" placeholder="Rua, número e bairro" required>

      <label for="pagamento">Forma de pagamento</label>
      <select id="pagamento" required>
        <option value="">Selecione</option>
        <option>Pix</option>
        <option>Dinheiro</option>
        <option>Cartão de crédito</option>
        <option>Cartão de débito</option>
      </select>

      <label for="observacao">Observações</label>
      <textarea id="observacao" placeholder="Ex.: sem cebola, ponto da carne..."></textarea>

      <h3>Total do pedido: <span id="totalFinal">R$ 0,00</span></h3>

      <button type="submit" class="botao-principal">
        Confirmar pelo WhatsApp
      </button>
    </form>
  </div>
</div>

<footer>
  <p>© 2026 Sabor & Arte — Feito com ❤️</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
