<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora Simples</title>

  <style>
    body {
      background: #1e1e1e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .calculadora {
      background: #2b2b2b;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      width: 300px;
    }

    #display {
      width: 100%;
      height: 60px;
      font-size: 28px;
      margin-bottom: 15px;
      text-align: right;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      box-sizing: border-box;
    }

    .botoes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      font-size: 22px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .numero {
      background: #3a3a3a;
      color: white;
    }

    .operador {
      background: #DC143C;
      color: white;
    }

    .igual {
      background: #00CED1;
      color: white;
    }

    .limpar {
      background: #00BFFF;
      color: white;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

  <div class="calculadora">
    <input type="text" id="display" disabled>

    <div class="botoes">
      <button class="limpar" onclick="limpar()">C</button>
      <button class="operador" onclick="adicionar('/')">÷</button>
      <button class="operador" onclick="adicionar('*')">×</button>
      <button class="operador" onclick="adicionar('-')">-</button>

      <button class="numero" onclick="adicionar('7')">7</button>
      <button class="numero" onclick="adicionar('8')">8</button>
      <button class="numero" onclick="adicionar('9')">9</button>
     <button class="operador" onclick="adicionar('+')">+</button>

      <button class="numero" onclick="adicionar('4')">4</button>
      <button class="numero" onclick="adicionar('5')">5</button>
      <button class="numero" onclick="adicionar('6')">6</button>
      <button class="igual" onclick="calcular()" rowspan="2">=</button>

      <button class="numero" onclick="adicionar('1')">1</button>
      <button class="numero" onclick="adicionar('2')">2</button>
      <button class="numero" onclick="adicionar('3')">3</button>

      <button class="numero" onclick="adicionar('0')">0</button>
      <button class="numero" onclick="adicionar('.')">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    function adicionar(valor) {
      display.value += valor;
    }

    function limpar() {
      display.value = "";
    }

    function calcular() {
      try {
        display.value = eval(display.value);
      } catch {
        display.value = "Erro"
}
    }
  </script>

</body>
</html>
