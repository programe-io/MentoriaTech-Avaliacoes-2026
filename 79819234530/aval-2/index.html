<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== CABEÇALHO ===== -->
    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <main>

        <!-- Área de nova publicação -->
        <section class="new-post">
            <div class="user">
                <div class="avatar">A</div>
                <div class="user-info">
                    <strong>Usuário Logado</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>
            <button>Publicar</button>
        </section>

        <!-- ===== POSTAGEM 1 ===== -->
        <article class="post">
            <div class="post-header">
                <div class="avatar">P</div>
                <div class="user-info">
                    <strong>Piauiense Orgulhoso</strong>
                    <span>há 10 minutos</span>
                </div>
            </div>

            <p class="post-text">
                Conheça a bandeira do nosso estado! 🇧🇷 O Piauí é um estado
                cheio de cultura, história e belezas naturais. Orgulho de ser piauiense!
            </p>

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Bandeira_do_Piau%C3%AD.svg/1280px-Bandeira_do_Piau%C3%AD.svg.png"
                alt="Bandeira do estado do Piauí, com faixas horizontais nas cores verde e amarelo e um retângulo azul com estrela ao canto superior esquerdo"
            >

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>
        </article>
  
  
</body>
</html>
