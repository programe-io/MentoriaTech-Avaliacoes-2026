<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="game-container">
        <h1>Jogo da Cobrinha</h1>
        
        <div class="scoreboard">
            <div class="score-box">Pontos: <span id="score">0</span></div>
            <div class="score-box">Recorde: <span id="high-score">0</span></div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="overlay" class="overlay">
                <h2 id="overlay-title">Jogo da Cobrinha</h2>
                <p id="overlay-msg">Use as setas do teclado ou os botões para jogar.</p>
                <button id="start-btn">Iniciar Jogo</button>
            </div>
        </div>

        <!-- Controles para celulares/tablets -->
        <div class="controls">
            <button class="btn btn-up" id="btn-up">▲</button>
            <div class="middle-row">
                <button class="btn btn-left" id="btn-left">◄</button>
                <button class="btn btn-right" id="btn-right">►</button>
            </div>
            <button class="btn btn-down" id="btn-down">▼</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
