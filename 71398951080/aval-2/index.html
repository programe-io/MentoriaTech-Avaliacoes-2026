
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <!-- CABEÇALHO -->

        <header class="cabecalho">

            <div>
                <h1>Gerenciador de Tarefas</h1>
                <p>Organize suas atividades e acompanhe seu progresso.</p>
            </div>

        </header>


        <!-- INDICADORES -->

        <section class="indicadores">

            <article class="indicador">
                <span>Total de tarefas</span>
                <strong id="total-tarefas">0</strong>
            </article>

            <article class="indicador pendente">
                <span>Em andamento</span>
                <strong id="total-pendentes">0</strong>
            </article>

            <article class="indicador concluida">
                <span>Concluídas</span>
                <strong id="total-concluidas">0</strong>
            </article>

        </section>


        <!-- FORMULÁRIO -->

        <section class="card">

            <h2 id="titulo-formulario">Cadastrar nova tarefa</h2>

            <form id="form-tarefa">

                <div class="campo">
                    <label for="titulo">Título da tarefa</label>

                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex: Estudar JavaScript"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="campo">

                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade" required>

                        <option value="">Selecione</option>

                        <option value="1">Alta</option>

                        <option value="2">Média</option>

                        <option value="3">Baixa</option>

                    </select>

                </div>

                <p id="erro" class="mensagem-erro" hidden></p>

                <div class="botoes">

                    <button type="submit" id="btn-salvar">
                        Adicionar tarefa
                    </button>

                    <button type="reset" id="btn-cancelar">
                        Cancelar
                    </button>

                </div>

            </form>

        </section>


        <!-- LISTAGEM -->

        <section class="card">

            <div class="titulo-listagem">
                <h2>Minhas tarefas</h2>

                <span id="contador-listagem">0 tarefas</span>
            </div>


            <!-- PESQUISA E FILTRO -->

            <div class="filtros">

                <input
                    type="search"
                    id="pesquisa"
                    placeholder="Pesquisar tarefa..."
                >

                <select id="filtro-status">

                    <option value="todas">Todas</option>

                    <option value="pendentes">Em andamento</option>

                    <option value="concluidas">Concluídas</option>

                </select>

            </div>


            <!-- TABELA -->

            <div class="tabela-container">

                <table>

                    <thead>

                        <tr>

                            <th>Código</th>

                            <th>Tarefa</th>

                            <th>Prioridade</th>

                            <th>Status</th>

                            <th>Ações</th>

                        </tr>

                    </thead>

                    <tbody id="tabela-tarefas">

                    </tbody>

                </table>

            </div>

        </section>


        <footer>
            <p>Gerenciador de Tarefas | Projeto de JavaScript</p>
        </footer>

    </main>

<script src="script.js"></script></body>
</html>
