<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <title>Avaliação 1</title>
            <link rel="stylesheet" href="style.css">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
            <body>
                <div class="container">
                        <h1>Estoque 2 Ano</h1>
                                
                                        <div class="section">
                                                    <h2>Gerenciar Produtos</h2>
                                                                
                                                                            <div class="input-group">
                                                                                            <label for="nomeP">Nome do Produto:</label>
                                                                                                            <input type="text" id="nomeP" placeholder="Digite o nome do produto">
                                                                                                                        </div>

                                                                                                                                    <div class="input-group">
                                                                                                                                                    <label for="qtdP">Quantidade:</label>
                                                                                                                                                                    <input type="number" id="qtdP" placeholder="Digite a quantidade do produto">
                                                                                                                                                                                </div>

                                                                                                                                                                                            <div class="input-group">
                                                                                                                                                                                                            <label for="precoP">Preço do produto:</label>
                                                                                                                                                                                                                            <input type="number" id="precoP" placeholder="Digite o preço do produto">
                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                    <button id="btAdd" class="btn-update">Adicionar Produto</button>
                                                                                                                                                                                                                                                                <button id="btAtualizar" class="btn-update">Atualizar Produto</button>
                                                                                                                                                                                                                                                                            <button id="btExcluir" class="btn-update">Excluir Produto</button>
                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                            <div class="section">
                                                                                                                                                                                                                                                                                                        <h2>Lista de Produtos</h2>
                                                                                                                                                                                                                                                                                                                    <ul id="listaProdutos" class="lista-produtos">
                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                </ul>
                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                </html>
