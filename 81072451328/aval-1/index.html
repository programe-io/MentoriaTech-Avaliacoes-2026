<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Fashion Star ✨</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>

                <body>

                <header>
                    <h1>✨ FASHION STAR ✨</h1>
                        <p>Monte o look perfeito e arrase no desfile!</p>
                        </header>

                        <main class="game">

                            <section class="character-area">
                                    <div class="score">
                                                ⭐ Pontuação: <span id="score">0</span>
                                                        </div>

                                                                <div class="avatar" id="avatar">
                                                                            <div class="hair">💇🏻‍♀️</div>
                                                                                        <div class="face">👩🏻</div>
                                                                                                    <div class="outfit" id="outfit">👗</div>
                                                                                                                <div class="shoes" id="shoes">👠</div>
                                                                                                                            <div class="accessory" id="accessory"></div>
                                                                                                                                    </div>

                                                                                                                                            <button id="runway">👠 DESFILAR</button>
                                                                                                                                                </section>

                                                                                                                                                    <section class="wardrobe">

                                                                                                                                                            <h2>👗 Escolha seu look</h2>

                                                                                                                                                                    <div class="category">
                                                                                                                                                                                <h3>Roupas</h3>

                                                                                                                                                                                            <button class="item outfit-item" data-item="👗" data-points="10">👗 Vestido</button>
                                                                                                                                                                                                        <button class="item outfit-item" data-item="👚" data-points="8">👚 Blusa</button>
                                                                                                                                                                                                                    <button class="item outfit-item" data-item="👖" data-points="7">👖 Jeans</button>
                                                                                                                                                                                                                                <button class="item outfit-item" data-item="🩱" data-points="9">🩱 Macacão</button>
                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                <div class="category">
                                                                                                                                                                                                                                                            <h3>👠 Calçados</h3>

                                                                                                                                                                                                                                                                        <button class="item shoe-item" data-item="👠" data-points="10">👠 Salto</button>
                                                                                                                                                                                                                                                                                    <button class="item shoe-item" data-item="👟" data-points="7">👟 Tênis</button>
                                                                                                                                                                                                                                                                                                <button class="item shoe-item" data-item="🥾" data-points="8">🥾 Bota</button>
                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                <div class="category">
                                                                                                                                                                                                                                                                                                                            <h3>💎 Acessórios</h3>

                                                                                                                                                                                                                                                                                                                                        <button class="item accessory-item" data-item="💎" data-points="10">💎 Joia</button>
                                                                                                                                                                                                                                                                                                                                                    <button class="item accessory-item" data-item="👜" data-points="8">👜 Bolsa</button>
                                                                                                                                                                                                                                                                                                                                                                <button class="item accessory-item" data-item="🕶️" data-points="9">🕶️ Óculos</button>
                                                                                                                                                                                                                                                                                                                                                                            <button class="item accessory-item" data-item="🎀" data-points="7">🎀 Laço</button>
                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                                                        <div class="modal" id="result">
                                                                                                                                                                                                                                                                                                                                                                                            <div class="modal-box">
                                                                                                                                                                                                                                                                                                                                                                                                    <h2>🌟 DESFILE 🌟</h2>
                                                                                                                                                                                                                                                                                                                                                                                                            <p id="message"></p>
                                                                                                                                                                                                                                                                                                                                                                                                                    <p class="final-score">
                                                                                                                                                                                                                                                                                                                                                                                                                                Pontuação: <strong id="finalScore">0</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                        </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <button id="restart">🔄 Jogar novamente</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
