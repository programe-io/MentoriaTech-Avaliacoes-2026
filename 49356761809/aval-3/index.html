
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Instagram</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <h1>Instagram</h1>
</header>

<div class="criar">
    <h2>Nova publicação</h2>
    <input type="text" id="usuario" placeholder="Seu nome">
    <input type="text" id="foto" placeholder="Link da foto">
    <textarea id="legenda" placeholder="Escreva uma legenda"></textarea>
    <button onclick="publicar()">Publicar</button>
</div>

<div id="feed">

    <div class="post">
        <h3>Maria</h3>
        <img src="https://picsum.photos/500/300?random=1">
        <p>Um dia maravilhoso! ❤️</p>
        <button onclick="curtir(this)">♡ Curtir</button>
        <p>Comentários: <span>0</span></p>
        <input type="text" placeholder="Comente aqui">
        <button onclick="comentar(this)">Enviar</button>
    </div>

    <div class="post">
        <h3>Ana</h3>
        <img src="https://picsum.photos/500/300?random=2">
        <p>Aproveitando a vida! 🌸</p>
        <button onclick="curtir(this)">♡ Curtir</button>
        <p>Comentários: <span>0</span></p>
        <input type="text" placeholder="Comente aqui">
        <button onclick="comentar(this)">Enviar</button>
    </div>

</div>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
