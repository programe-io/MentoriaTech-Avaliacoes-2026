<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>📦 Controle de Estoque</h1>
        <p>Gerencie seus produtos de forma simples</p>
    </header>

    <main class="container">

        <!-- Formulário -->
        <section class="card">
            <h2 id="titulo-form">Cadastrar Produto</h2>

            <form id="form-produto">

                <input type="hidden" id="produto-id">

                <div class="campo">
                    <label for="nome">Nome do produto</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <input
                        type="text"
                        id="categoria"
                        placeholder="Ex: Eletrônicos"
                        required
                    >
                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="quantidade">Quantidade</label>
                        <input
                            type="number"
                            id="quantidade"
                            min="0"
                            placeholder="0"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="preco">Preço</label>
                        <input
                            type="number"
                            id="preco"
                            min="0"
                            step="0.01"
                            placeholder="0,00"
                            required
                        >
                    </div>

                </div>

                <div class="botoes">
                    <button type="submit" class="btn-principal">
                        Salvar Produto
                    </button>

                    <button
                        type="button"
                        id="btn-cancelar"
                        class="btn-cancelar"
                        onclick="cancelarEdicao()"
                    >
                        Cancelar
                    </button>
                </div>

            </form>
        </section>


        <!-- Estatísticas -->
        <section class="estatisticas">

            <div class="estatistica">
                <span>Produtos</span>
                <strong id="total-produtos">0</strong>
            </div>

            <div class="estatistica">
                <span>Itens em estoque</span>
                <strong id="total-itens">0</strong>
            </div>

            <div class="estatistica">
                <span>Valor do estoque</span>
                <strong id="valor-estoque">R$ 0,00</strong>
            </div>

        </section>


        <!-- Lista -->
        <section class="card">

            <div class="cabecalho-tabela">
                <h2>Produtos cadastrados</h2>

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="🔎 Pesquisar produto..."
                >
            </div>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="lista-produtos">
                    </tbody>

                </table>

            </div>

            <p id="mensagem-vazia" class="mensagem-vazia">
                Nenhum produto cadastrado.
            </p>

        </section>

    </main>

    <footer>
        <p>CRUD de Estoque &copy; 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
