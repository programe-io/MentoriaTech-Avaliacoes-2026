<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desvie!</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-container {
            width: 95%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            background: #1e293b;
            padding: 15px 25px;
            border-radius: 12px 12px 0 0;
            font-size: 18px;
            font-weight: bold;
        }

        .score {
            color: #38bdf8;
        }

        .record {
            color: #facc15;
        }

        #game {
            position: relative;
            width: 100%;
            height: 500px;
            background:
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.03) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    rgba(255,255,255,0.03) 1px,
                    transparent 1px
                ),
                #020617;

            background-size: 40px 40px;
            overflow: hidden;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.25);
        }

        #player {
            position: absolute;
            width: 45px;
            height: 45px;
            background: #38bdf8;
            border-radius: 10px;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }

        #player::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            top: 9px;
            left: 8px;
            box-shadow: 18px 0 white;
        }

        .obstacle {
            position: absolute;
            width: 45px;
            height: 45px;
            background: #ef4444;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
        }

        .game-over {
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 23, 0.88);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .game-over h2 {
            font-size: 48px;
            color: #ef4444;
            margin-bottom: 10px;
        }

        .game-over p {
            color: #cbd5e1;
            font-size: 20px;
            margin-bottom: 25px;
        }

        button {
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            background: #38bdf8;
            color: #020617;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        .instructions {
            margin-top: 20px;
            color: #94a3b8;
        }

        .instructions strong {
            color: white;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            #game {
                height: 420px;
            }

            .score-board {
                font-size: 15px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="game-container">

        <h1>🎮 DESVIE!</h1>

        <p class="subtitle">
            Desvie dos obstáculos e consiga a maior pontuação!
        </p>

        <div class="score-board">
            <div>
                Pontos:
                <span class="score" id="score">0</span>
            </div>

            <div>
                Recorde:
                <span class="record" id="highScore">0</span>
            </div>
        </div>

        <div id="game">

            <div id="player"></div>

            <div class="game-over" id="gameOver">

                <h2>GAME OVER</h2>

                <p>
                    Sua pontuação:
                    <strong id="finalScore">0</strong>
                </p>

                <button onclick="restartGame()">
                    Jogar novamente
                </button>

            </div>

        </div>

        <p class="instructions">
            Use as teclas
            <strong>←</strong>
            e
            <strong>→</strong>
            para mover
        </p>

    </div>

    <script>
        const game = document.getElementById("game");
        const player = document.getElementById("player");

        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");
        const gameOverScreen = document.getElementById("gameOver");
        const finalScoreElement = document.getElementById("finalScore");

        let playerX = 50;
        let score = 0;
        let highScore = localStorage.getItem("desvieHighScore") || 0;

        let gameRunning = true;
        let obstacles = [];
        let gameSpeed = 3;

        highScoreElement.textContent = highScore;

        /*
        ========================================
        MOVIMENTO DO JOGADOR
        ========================================
        */

        document.addEventListener("keydown", function(event) {

            if (!gameRunning) return;

            if (event.key === "ArrowLeft") {
                playerX -= 6;
            }

            if (event.key === "ArrowRight") {
                playerX += 6;
            }

            playerX = Math.max(5, Math.min(95, playerX));

            player.style.left = playerX + "%";
        });


        /*
        ========================================
        CRIAR OBSTÁCULOS
        ========================================
        */

        function createObstacle() {

            if (!gameRunning) return;

            const obstacle = document.createElement("div");

            obstacle.classList.add("obstacle");

            const gameWidth = game.clientWidth - 45;

            const randomX =
                Math.floor(Math.random() * gameWidth);

            obstacle.style.left = randomX + "px";
            obstacle.style.top = "-50px";

            game.appendChild(obstacle);

            obstacles.push({
                element: obstacle,
                x: randomX,
                y: -50
            });
        }


        /*
        ========================================
        ATUALIZAR JOGO
        ========================================
        */

        function updateGame() {

            if (!gameRunning) return;

            const playerRect =
                player.getBoundingClientRect();

            obstacles.forEach((obstacle, index) => {

                obstacle.y += gameSpeed;

                obstacle.element.style.top =
                    obstacle.y + "px";

                const obstacleRect =
                    obstacle.element.getBoundingClientRect();

                /*
                Verificar colisão
                */

                if (
                    playerRect.left < obstacleRect.right &&
                    playerRect.right > obstacleRect.left &&
                    playerRect.top < obstacleRect.bottom &&
                    playerRect.bottom > obstacleRect.top
                ) {

                    endGame();

                    return;
                }

                /*
                Quando o obstáculo sai da tela
                */

                if (obstacle.y > game.clientHeight) {

                    obstacle.element.remove();

                    obstacles.splice(index, 1);

                    score++;

                    scoreElement.textContent = score;

                    /*
                    Aumentar dificuldade
                    */

                    if (score % 5 === 0) {
                        gameSpeed += 0.5;
                    }
                }
            });

            requestAnimationFrame(updateGame);
        }


        /*
        ========================================
        FINALIZAR JOGO
        ========================================
        */

        function endGame() {

            gameRunning = false;

            finalScoreElement.textContent = score;

            gameOverScreen.style.display = "flex";

            if (score > highScore) {

                highScore = score;

                localStorage.setItem(
                    "desvieHighScore",
                    highScore
                );

                highScoreElement.textContent =
                    highScore;
            }
        }


        /*
        ========================================
        REINICIAR
        ========================================
        */

        function restartGame() {

            obstacles.forEach(obstacle => {
                obstacle.element.remove();
            });

            obstacles = [];

            score = 0;
            gameSpeed = 3;
            playerX = 50;

            scoreElement.textContent = "0";

            player.style.left = "50%";

            gameOverScreen.style.display = "none";

            gameRunning = true;

            updateGame();
        }


        /*
        ========================================
        GERAR OBSTÁCULOS
        ========================================
        */

        setInterval(() => {

            if (gameRunning) {
                createObstacle();
            }

        }, 900);


        /*
        ========================================
        INICIAR JOGO
        ========================================
        */

        updateGame();
    </script>

</body>
</html>
