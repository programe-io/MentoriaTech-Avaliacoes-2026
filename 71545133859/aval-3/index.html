<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Reflexo</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
  <h1>🎯 Jogo de Reflexo</h1>
  <p>Clique no alvo o mais rápido possível!</p>
</header>

<nav>
  <a href="#gameArea">Ir para o jogo</a>
</nav>

<main>

  <aside>
    <h3>Instruções</h3>
    <p>Clique no quadrado vermelho quando ele aparecer.</p>
  </aside>

  <article>
    <h2>Pontuação</h2>
    <p>Pontos: <span id="score">0</span></p>
  </article>

  <!-- IMG OBRIGATÓRIA -->
  <section>
    <h2>Imagem do jogo</h2>
    <img src="https://via.placeholder.com/300x150.png?text=Jogo+de+Reflexo" alt="Imagem do jogo">
  </section>

  <section id="gameArea">
    <div id="target"></div>
  </section>

  <section>
    <button onclick="startGame()">Iniciar Jogo</button>
    <p id="msg"></p>
  </section>

</main>

<footer>
  <p>Jogo feito com HTML, CSS e JavaScript</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
