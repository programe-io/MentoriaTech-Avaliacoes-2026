
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topo">
        <h1>📦 Stock Control</h1>
        <p>Sistema de gerenciamento de produtos</p>
    </header>

    <main class="container">

        <section class="painel">
            <div class="card">
                <span>Produtos cadastrados</span>
                <h2 id="totalProdutos">0</h2>
            </div>

            <div class="card">
                <span>Unidades em estoque</span>
                <h2 id="totalUnidades">0</h2>
            </div>

            <div class="card">
                <span>Valor do estoque</span>
                <h2 id="valorEstoque">R$ 0,00</h2>
            </div>
        </section>

        <section class="formulario">
            <h2>Novo Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="codigo">Código</label>
                    <input type="number" id="codigo"
                        placeholder="Ex: 101" min="1" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao"
                        placeholder="Nome do produto" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade"
                        placeholder="Quantidade" min="0" step="1" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input type="number" id="valor"
                        placeholder="0.00" min="0" step="0.01" required>
                </div>

                <button type="submit" class="btn-adicionar">
                    + Cadastrar Produto
                </button>

            </form>
        </section>

        <section class="tabela">
            <h2>Lista de Produtos</h2>

            <div class="pesquisa">
                <input type="text" id="pesquisa"
                    placeholder="Pesquisar produto por código ou descrição...">
            </div>

            <div class="tabela-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                    </tbody>
                </table>
            </div>

            <p id="mensagemVazia" class="vazio">
                Nenhum produto cadastrado.
            </p>
        </section>

    </main>

    <footer>
        <p>Sistema de Controle de Estoque © 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
