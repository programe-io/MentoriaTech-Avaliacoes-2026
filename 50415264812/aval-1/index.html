
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="./style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="cabecalho">
        <h1>📦 Sistema de Estoque</h1>
        <p>Controle e gerenciamento de produtos</p>
    </header>

    <main class="container">

        <section class="resumo">
            <div class="card">
                <span>Produtos cadastrados</span>
                <h2 id="totalProdutos">0</h2>
            </div>

            <div class="card">
                <span>Quantidade em estoque</span>
                <h2 id="totalQuantidade">0</h2>
            </div>

            <div class="card">
                <span>Valor total do estoque</span>
                <h2 id="valorTotal">R$ 0,00</h2>
            </div>
        </section>

        <section class="area-formulario">
            <h2>Cadastrar novo produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="codigo">Código:</label>
                    <input type="number" id="codigo"
                        min="1" step="1" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição:</label>
                    <input type="text" id="descricao"
                        maxlength="100" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade"
                        min="0" step="1" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$):</label>
                    <input type="number" id="valor"
                        min="0" step="0.01" required>
                </div>

                <button type="submit" class="btn-cadastrar">
                    Cadastrar produto
                </button>

            </form>
        </section>

        <section class="area-tabela">
            <h2>Produtos cadastrados</h2>

            <input
                type="search"
                id="pesquisa"
                class="pesquisa"
                placeholder="Pesquisar produto..."
            >

            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>

            <p id="mensagemVazia">
                Nenhum produto cadastrado.
            </p>
        </section>

    </main>

    <footer>
        <p>Sistema de Estoque - Projeto Acadêmico</p>
    </footer>

    <script src="./script.js" defer></script>

<script src="script.js"></script></body>
</html>
