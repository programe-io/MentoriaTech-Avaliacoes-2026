
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Escolar</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>📚 Biblioteca Escolar</h1>
    <p>Sistema de cadastro e gerenciamento de livros</p>
</header>

<div class="container">

    <section class="dashboard">
        <div class="card">
            <h3>Total de livros</h3>
            <p id="totalLivros">0</p>
        </div>

        <div class="card">
            <h3>Disponíveis</h3>
            <p id="disponiveis">0</p>
        </div>

        <div class="card">
            <h3>Emprestados</h3>
            <p id="emprestados">0</p>
        </div>
    </section>

    <section class="formulario">
        <h2>📖 Cadastrar novo livro</h2>

        <form id="formLivro">
            <input type="text" id="titulo" placeholder="Título do livro" required>

            <input type="text" id="autor" placeholder="Nome do autor" required>

            <input type="text" id="categoria" placeholder="Categoria" required>

            <input type="text" id="isbn" placeholder="Código / ISBN" required>

            <button type="submit" id="btnSalvar">Cadastrar livro</button>
            <button type="button" id="btnCancelar" hidden>Cancelar edição</button>
        </form>
    </section>

    <section class="gerenciamento">
        <h2>📚 Livros cadastrados</h2>

        <input type="text" id="pesquisa"
        placeholder="Pesquisar por título, autor ou categoria...">

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Categoria</th>
                        <th>ISBN</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaLivros"></tbody>
            </table>
        </div>
    </section>

</div>

<footer>
    <p>Biblioteca Escolar © 2026 - Sistema de Gerenciamento</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
