
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="./style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header class="cabecalho">
        <h1>✓ Task Manager</h1>
        <p>Organize suas tarefas e acompanhe seu progresso!</p>
    </header>

    <main class="container">

        <section class="resumo">

            <div class="card">
                <span>Total de tarefas</span>
                <h2 id="totalTarefas">0</h2>
            </div>

            <div class="card">
                <span>Pendentes</span>
                <h2 id="tarefasPendentes">0</h2>
            </div>

            <div class="card">
                <span>Concluídas</span>
                <h2 id="tarefasConcluidas">0</h2>
            </div>

        </section>

        <section class="formulario">

            <h2>Adicionar nova tarefa</h2>

            <form id="formTarefa">

                <div class="campo">
                    <label for="titulo">Título da tarefa:</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex: Estudar JavaScript"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descricao">Descrição:</label>
                    <textarea
                        id="descricao"
                        placeholder="Descreva sua tarefa..."
                        maxlength="500"
                    ></textarea>
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade:</label>
                    <select id="prioridade" required>
                        <option value="Baixa">Baixa</option>
                        <option value="Média" selected>Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="prazo">Prazo:</label>
                    <input type="date" id="prazo">
                </div>

                <button type="submit" class="btn-adicionar">
                    + Adicionar tarefa
                </button>

            </form>

        </section>

        <section class="lista">

            <h2>Minhas tarefas</h2>

            <div class="filtros">

                <input
                    type="search"
                    id="pesquisa"
                    placeholder="Pesquisar tarefa..."
                >

                <select id="filtro">
                    <option value="Todas">Todas as tarefas</option>
                    <option value="Pendente">Pendentes</option>
                    <option value="Concluída">Concluídas</option>
                </select>

            </div>

            <div id="listaTarefas"></div>

            <p id="mensagemVazia">
                Nenhuma tarefa cadastrada.
            </p>

        </section>

    </main>

    <footer>
        <p>Gerenciador de Tarefas © 2026</p>
    </footer>

    <script src="./script.js" defer></script>

<script src="script.js"></script></body>
</html>
