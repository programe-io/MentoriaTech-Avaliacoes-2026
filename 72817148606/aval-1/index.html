
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Damas</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>♟ Jogo de Damas</h1>
    <p>Desafie um amigo!</p>
  </header>

  <main>
    <div class="painel">
      <h2 id="vez">Vez das peças vermelhas</h2>
      <p id="mensagem">Selecione uma peça para começar.</p>
    </div>

    <div id="tabuleiro"></div>

    <div class="informacoes">
      <div class="jogador vermelho">
        <span>🔴 Vermelho</span>
        <strong id="contVermelho">12 peças</strong>
      </div>

      <div class="jogador preto">
        <span>⚫ Preto</span>
        <strong id="contPreto">12 peças</strong>
      </div>
    </div>

    <button id="reiniciar">🔄 Reiniciar partida</button>
  </main>

  <footer>
    <p>Jogo de Damas • Feito com HTML, CSS e JavaScript</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
