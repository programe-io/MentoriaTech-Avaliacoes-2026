
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoTask</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
  <h1>⚡ AutoTask</h1>
  <p>Editor automático de códigos</p>
  <span id="status">● Aguardando códigos</span>
</header>

<main>

  <section class="editores">

    <div class="editor">
      <h2>HTML</h2>
      <textarea id="html" placeholder="Cole seu código HTML aqui..."></textarea>
    </div>

    <div class="editor">
      <h2>CSS</h2>
      <textarea id="css" placeholder="Cole seu código CSS aqui..."></textarea>
    </div>

    <div class="editor">
      <h2>JavaScript</h2>
      <textarea id="js" placeholder="Cole seu código JavaScript aqui..."></textarea>
    </div>

  </section>

  <div class="acoes">
    <button id="limpar">🗑 Limpar códigos</button>
    <button id="copiar">📋 Copiar códigos</button>
    <button id="baixar">⬇ Baixar projeto</button>
  </div>

  <section class="resultado">
    <div class="resultado-header">
      <h2>👁 Resultado automático</h2>
      <span>Atualização em tempo real</span>
    </div>

    <iframe
      id="preview"
      sandbox="allow-scripts"
      title="Pré-visualização do código">
    </iframe>
  </section>

</main>

<footer>
  <p>AutoTask © 2026 - Editor automático</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
