
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <h1>🐍 Snake Game</h1>

  <div class="painel">
    <span>Pontos: <strong id="pontos">0</strong></span>
    <span>Recorde: <strong id="recorde">0</strong></span>
  </div>

  <div class="container">
    <canvas id="canvas" width="400" height="400"></canvas>

    <div id="telaInicial">
      <h2 id="titulo">Snake Game</h2>
      <p id="descricao">Prepare-se para jogar!</p>
      <button id="iniciar">▶ INICIAR JOGO</button>
    </div>
  </div>

  <div class="botoes">
    <button id="pausar">⏸ Pausar</button>
    <button id="reiniciar">🔄 Reiniciar</button>
  </div>

  <div class="controles">
    <button data-dir="cima">⬆️</button>
    <div>
      <button data-dir="esquerda">⬅️</button>
      <button data-dir="baixo">⬇️</button>
      <button data-dir="direita">➡️</button>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
