
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>🩷 Calculadora de IMC</h1>

    <section>
        <h2>Cadastrar Pessoa</h2>

        <input type="text" id="nome" placeholder="Nome">
        <input type="number" id="peso" placeholder="Peso em kg" step="0.1">
        <input type="number" id="altura" placeholder="Altura em metros" step="0.01">

        <button onclick="cadastrar()">Calcular IMC</button>
    </section>

    <section>
        <h2>Dados das Pessoas</h2>

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Peso</th>
                        <th>Altura</th>
                        <th>IMC</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </div>
    </section>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
