<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciamento de Projetos</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}
header {
  background: #1e3a8a;
  color: white;
  padding: 24px;
  text-align: center;
}
nav {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 15px;
  background: white;
}
button {
  background: #2563eb;
  color: white;
  border: 0;
  border-radius: 6px;
  padding: 10px 14px;
  cursor: pointer;
}
button:hover { background: #1d4ed8; }
button.danger { background: #dc2626; }
main {
  max-width: 1100px;
  margin: 25px auto;
  padding: 0 16px;
}
.panel, .card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px #0000000d;
}
input, textarea, select {
  width: 100%;
  padding: 11px;
  margin: 6px 0 14px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font: inherit;
}
label { font-weight: bold; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}
.stat {
  background: #dbeafe;
  padding: 18px;
  border-radius: 8px;
}
.stat strong {
  display: block;
  font-size: 24px;
  margin-top: 8px;
}
small, .muted { color: #64748b; }
.progress {
  background: #e2e8f0;
  height: 10px;
  border-radius: 10px;
  overflow: hidden;
}
.progress div {
  height: 100%;
  background: #2563eb;
}
.task {
  border-top: 1px solid #e2e8f0;
  padding: 12px 0;
}
.hidden { display: none; }
h2 { margin-top: 0; }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
  <h1>Gerenciamento de Projetos</h1>
  <p>Organize projetos, tarefas, prazos e orçamentos</p>
</header>

<nav>
  <button onclick="mostrar('inicio')">Painel</button>
  <button onclick="mostrar('cadastro')">Cadastrar projeto</button>
  <button onclick="mostrar('projetos')">Projetos</button>
  <button onclick="mostrar('relatorio')">Relatórios</button>
</nav>

<main>
  <section id="inicio" class="panel">
    <h2>Painel geral</h2>
    <div id="estatisticas" class="grid"></div>
    <h3>Projetos recentes</h3>
    <div id="recentes"></div>
  </section>

  <section id="cadastro" class="panel hidden">
    <h2 id="tituloFormulario">Cadastrar projeto</h2>
    <form id="formProjeto">
      <input type="hidden" id="projetoId">

      <label for="nome">Nome do projeto</label>
      <input id="nome" required>

      <label for="gerente">Gerente responsável</label>
      <input id="gerente" required>

      <label for="descricao">Descrição</label>
      <textarea id="descricao" rows="3" required></textarea>

      <label for="inicioData">Data de início</label>
      <input type="date" id="inicioData" required>

      <label for="prazo">Prazo final</label>
      <input type="date" id="prazo" required>

      <label for="orcamento">Orçamento previsto (R$)</label>
      <input type="number" id="orcamento" min="0" step="0.01" required>

      <button type="submit">Salvar projeto</button>
      <button type="button" onclick="limparFormulario()">Limpar</button>
    </form>
  </section>

  <section id="projetos" class="hidden">
    <h2>Projetos cadastrados</h2>
    <div id="listaProjetos"></div>
  </section>

  <section id="detalhes" class="panel hidden">
    <h2 id="detalheTitulo">Detalhes do projeto</h2>
    <div id="detalheConteudo"></div>
    <button onclick="mostrar('projetos')">Voltar aos projetos</button>
  </section>

  <section id="relatorio" class="panel hidden">
    <h2>Relatório geral</h2>
    <div id="conteudoRelatorio"></div>
  </section>
</main>

<script>
const CHAVE = "gerenciamentoProjetos";
let projetos = carregar();

function carregar() {
  try {
    const dados = JSON.parse(localStorage.getItem(CHAVE) || "[]");
    return Array.isArray(dados) ? dados : [];
  } catch {
    return [];
  }
}

function salvar() {
  try {
    localStorage.setItem(CHAVE, JSON.stringify(projetos));
  } catch {
    alert("Não foi possível salvar os dados neste navegador.");
  }
}

function escapar(valor) {
  return String(valor ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[c]);
}

function moeda(valor) {
  return Number(valor).toLocaleString("pt-BR", {
    style: "currency", currency: "BRL"
  });
}

function dataBR(data) {
  if (!data) return "Não informada";
  const partes = data.split("-");
  return partes.length === 3
    ? `${partes[2]}/${partes[1]}/${partes[0]}`
    : data;
}

function statusProjeto(p) {
  if (p.progresso === 100) return "Concluído";
  if (p.progresso === 0) return "Não iniciado";
  return "Em andamento";
}

function mostrar(id) {
  document.querySelectorAll("main > section").forEach(s =>
    s.classList.add("hidden")
  );
  document.getElementById(id).classList.remove("hidden");

  if (id === "inicio") atualizarPainel();
  if (id === "projetos") listarProjetos();
  if (id === "relatorio") gerarRelatorio();

  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("formProjeto").addEventListener("submit", e => {
  e.preventDefault();

  const id = document.getElementById("projetoId").value;
  const inicio = document.getElementById("inicioData").value;
  const prazo = document.getElementById("prazo").value;
  const orcamento = Number(document.getElementById("orcamento").value);

  if (prazo < inicio) {
    alert("O prazo final não pode ser anterior ao início.");
    return;
  }

  if (!Number.isFinite(orcamento) || orcamento < 0) {
    alert("Informe um orçamento válido.");
    return;
  }

  const dados = {
    nome: document.getElementById("nome").value.trim(),
    gerente: document.getElementById("gerente").value.trim(),
    descricao: document.getElementById("descricao").value.trim(),
    inicio,
    prazo,
    orcamento
  };

  if (!dados.nome || !dados.gerente || !dados.descricao) {
    alert("Preencha todos os campos.");
    return;
  }

  if (id) {
    const p = projetos.find(x => x.id === id);
    if (!p) return;
    Object.assign(p, dados);
  } else {
    projetos.push({
      ...dados,
      id: (crypto.randomUUID
        ? crypto.randomUUID()
        : String(Date.now()) + Math.random()),
      gasto: 0,
      progresso: 0,
      tarefas: []
    });
  }

  salvar();
  limparFormulario();
  alert(id ? "Projeto atualizado!" : "Projeto cadastrado!");
  mostrar("projetos");
});

function limparFormulario() {
  document.getElementById("formProjeto").reset();
  document.getElementById("projetoId").value = "";
  document.getElementById("tituloFormulario").textContent =
    "Cadastrar projeto";
}

function editarProjeto(id) {
  const p = projetos.find(x => x.id === id);
  if (!p) return;

  document.getElementById("projetoId").value = p.id;
  document.getElementById("nome").value = p.nome;
  document.getElementById("gerente").value = p.gerente;
  document.getElementById("descricao").value = p.descricao;
  document.getElementById("inicioData").value = p.inicio;
  document.getElementById("prazo").value = p.prazo;
  document.getElementById("orcamento").value = p.orcamento;
  document.getElementById("tituloFormulario").textContent =
    "Editar projeto";

  mostrar("cadastro");
}

function listarProjetos() {
  const el = document.getElementById("listaProjetos");

  if (!projetos.length) {
    el.innerHTML = '<div class="card">Nenhum projeto cadastrado.</div>';
    return;
  }

  el.innerHTML = projetos.map(p => `
    <article class="card">
      <h3>${escapar(p.nome)}</h3>
      <p>${escapar(p.descricao)}</p>
      <p><b>Gerente:</b> ${escapar(p.gerente)}</p>
      <p><b>Prazo:</b> ${dataBR(p.prazo)}</p>
      <p><b>Status:</b> ${statusProjeto(p)}</p>
      <p><b>Orçamento:</b> ${moeda(p.orcamento)}</p>
      <p><b>Gasto:</b> ${moeda(p.gasto)}</p>
      <div class="progress">
        <div style="width:${p.progresso}%"></div>
      </div>
      <p>${p.progresso}% concluído · ${p.tarefas.length} tarefa(s)</p>
      <button onclick="abrirDetalhes('${p.id}')">Gerenciar</button>
      <button onclick="editarProjeto('${p.id}')">Editar</button>
      <button class="danger" onclick="excluirProjeto('${p.id}')">
        Excluir
      </button>
    </article>
  `).join("");
}

function excluirProjeto(id) {
  const p = projetos.find(x => x.id === id);
  if (!p || !confirm(`Excluir o projeto "${p.nome}" e suas tarefas?`))
    return;

  projetos = projetos.filter(x => x.id !== id);
  salvar();
  listarProjetos();
}

function abrirDetalhes(id) {
  const p = projetos.find(x => x.id === id);
  if (!p) return;

  document.getElementById("detalheTitulo").textContent = p.nome;
  document.getElementById("detalheConteudo").innerHTML = `
    <p><b>Gerente:</b> ${escapar(p.gerente)}</p>
    <p><b>Descrição:</b> ${escapar(p.descricao)}</p>
    <p><b>Início:</b> ${dataBR(p.inicio)}</p>
    <p><b>Prazo:</b> ${dataBR(p.prazo)}</p>
    <p><b>Status:</b> ${statusProjeto(p)}</p>

    <h3>Atualizar progresso e gastos</h3>
    <form id="formAtualizacao">
      <label>Progresso (%)</label>
      <input id="progressoInput" type="number" min="0" max="100"
        value="${p.progresso}" required>
      <label>Gasto acumulado (R$)</label>
      <input id="gastoInput" type="number" min="0" step="0.01"
        value="${p.gasto}" required>
      <button>Salvar atualização</button>
    </form>

    <h3>Adicionar tarefa</h3>
    <form id="formTarefa">
      <label>Nome da tarefa</label>
      <input id="nomeTarefa" required>
      <label>Responsável</label>
      <input id="responsavelTarefa" required>
      <button>Adicionar tarefa</button>
    </form>

    <h3>Tarefas</h3>
    <div id="listaTarefas"></div>
  `;

  document.getElementById("formAtualizacao").onsubmit = e => {
    e.preventDefault();
    const progresso = Number(document.getElementById("progressoInput").value);
    const gasto = Number(document.getElementById("gastoInput").value);

    if (!Number.isFinite(progresso) || progresso < 0 || progresso > 100 ||
        !Number.isFinite(gasto) || gasto < 0) {
      alert("Informe valores válidos.");
      return;
    }

    p.progresso = progresso;
    p.gasto = gasto;
    salvar();
    abrirDetalhes(id);
  };

  document.getElementById("formTarefa").onsubmit = e => {
    e.preventDefault();
    const nome = document.getElementById("nomeTarefa").value.trim();
    const responsavel =
      document.getElementById("responsavelTarefa").value.trim();

    if (!nome || !responsavel) return;

    p.tarefas.push({
      id: (crypto.randomUUID
        ? crypto.randomUUID()
        : String(Date.now()) + Math.random()),
      nome,
      responsavel,
      concluida: false
    });

    salvar();
    abrirDetalhes(id);
  };

  const lista = document.getElementById("listaTarefas");

  if (!p.tarefas.length) {
    lista.innerHTML = "<p>Nenhuma tarefa cadastrada.</p>";
  } else {
    lista.innerHTML = p.tarefas.map(t => `
      <div class="task">
        <b>${escapar(t.nome)}</b>
        <p>Responsável: ${escapar(t.responsavel)}</p>
        <p>Status: ${t.concluida ? "Concluída" : "Pendente"}</p>
        ${!t.concluida
          ? `<button onclick="concluirTarefa('${id}','${t.id}')">
               Concluir
             </button>`
          : ""}
        <button class="danger"
          onclick="excluirTarefa('${id}','${t.id}')">
          Excluir tarefa
        </button>
      </div>
    `).join("");
  }

  mostrar("detalhes");
}

function concluirTarefa(projetoId, tarefaId) {
  const p = projetos.find(x => x.id === projetoId);
  const t = p?.tarefas.find(x => x.id === tarefaId);
  if (!t) return;

  t.concluida = true;
  salvar();
  abrirDetalhes(projetoId);
}

function excluirTarefa(projetoId, tarefaId) {
  const p = projetos.find(x => x.id === projetoId);
  if (!p || !confirm("Deseja excluir esta tarefa?")) return;

  p.tarefas = p.tarefas.filter(t => t.id !== tarefaId);
  salvar();
  abrirDetalhes(projetoId);
}

function atualizarPainel() {
  const total = projetos.length;
  const orcamento = projetos.reduce((s, p) => s + p.orcamento, 0);
  const gasto = projetos.reduce((s, p) => s + p.gasto, 0);
  const media = total
    ? projetos.reduce((s, p) => s + p.progresso, 0) / total
    : 0;

  document.getElementById("estatisticas").innerHTML = `
    <div class="stat">Projetos<strong>${total}</strong></div>
    <div class="stat">Orçamento total<strong>${moeda(orcamento)}</strong></div>
    <div class="stat">Gastos<strong>${moeda(gasto)}</strong></div>
    <div class="stat">Progresso médio<strong>${media.toFixed(1)}%</strong></div>
  `;

  document.getElementById("recentes").innerHTML = total
    ? projetos.slice(-3).reverse().map(p => `
        <div class="task">
          <b>${escapar(p.nome)}</b>
          <p>${statusProjeto(p)} · ${p.progresso}%</p>
        </div>
      `).join("")
    : "<p>Nenhum projeto cadastrado.</p>";
}

function gerarRelatorio() {
  const total = projetos.length;
  const orcamento = projetos.reduce((s, p) => s + p.orcamento, 0);
  const gasto = projetos.reduce((s, p) => s + p.gasto, 0);
  const media = total
    ? projetos.reduce((s, p) => s + p.progresso, 0) / total
    : 0;
  const concluidos = projetos.filter(p => p.progresso === 100).length;
  const andamento = projetos.filter(
    p => p.progresso > 0 && p.progresso < 100
  ).length;
  const tarefas = projetos.reduce((s, p) => s + p.tarefas.length, 0);
  const tarefasConcluidas = projetos.reduce(
    (s, p) => s + p.tarefas.filter(t => t.concluida).length, 0
  );

  document.getElementById("conteudoRelatorio").innerHTML = `
    <div class="grid">
      <div class="stat">Total de projetos<strong>${total}</strong></div>
      <div class="stat">Concluídos<strong>${concluidos}</strong></div>
      <div class="stat">Em andamento<strong>${andamento}</strong></div>
      <div class="stat">Progresso médio<strong>${media.toFixed(1)}%</strong></div>
    </div>
    <div class="card">
      <p><b>Orçamento total:</b> ${moeda(orcamento)}</p>
      <p><b>Gasto acumulado:</b> ${moeda(gasto)}</p>
      <p><b>Saldo orçamentário:</b> ${moeda(orcamento - gasto)}</p>
      <p><b>Total de tarefas:</b> ${tarefas}</p>
      <p><b>Tarefas concluídas:</b> ${tarefasConcluidas}</p>
      <p><b>Tarefas pendentes:</b> ${tarefas - tarefasConcluidas}</p>
    </div>
  `;
}

atualizarPainel();
</script>
<script src="script.js"></script></body>
</html>
