<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
        }

        .relogio-container {
            text-align: center;
            padding: 50px 60px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .relogio {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #60a5fa;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.6),
                         0 0 40px rgba(96, 165, 250, 0.3);
            margin-bottom: 15px;
        }

        .data {
            font-size: 1.3rem;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        .mensagem-periodo {
            font-size: 1.1rem;
            color: #94a3b8;
            font-style: italic;
        }

        /* Responsividade */
        @media (max-width: 480px) {
            .relogio-container {
                padding: 35px 25px;
            }
            .relogio {
                font-size: 2.8rem;
            }
            .data {
                font-size: 1rem;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="relogio-container">
        <div class="relogio" id="relogio">00:00:00</div>
        <div class="data" id="data"></div>
        <div class="mensagem-periodo" id="periodo"></div>
    </div>

    <script>
        function atualizarRelogio() {
            const agora = new Date();
            
            // Horas, minutos e segundos
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            
            document.getElementById('relogio').textContent = `${horas}:${minutos}:${segundos}`;

            // Data completa em português
            const opcoesData = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            };
            const dataFormatada = agora.toLocaleDateString('pt-BR', opcoesData);
            document.getElementById('data').textContent = dataFormatada;

            // Mensagem conforme o período do dia
            const h = agora.getHours();
            let periodo = '';
            if (h >= 5 && h < 12) {
                periodo = '🌅 Bom dia! Aproveite o dia!';
            } else if (h >= 12 && h < 18) {
                periodo = '☀️ Boa tarde! Mantenha o foco!';
            } else if (h >= 18 && h < 23) {
                periodo = '🌙 Boa noite! Descanso merecido!';
            } else {
                periodo = '✨ Madrugada... Que paz!';
            }
            document.getElementById('periodo').textContent = periodo;
        }

        // Atualiza imediatamente e depois a cada 1 segundo
        atualizarRelogio();
        setInterval(atualizarRelogio, 1000);
    </script>
<script src="script.js"></script></body>
</html>
