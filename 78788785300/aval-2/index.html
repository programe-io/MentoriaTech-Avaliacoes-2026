<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .perfil-card {
            background: white;
            max-width: 450px;
            margin: 0 auto;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .foto {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #ddd;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: #667eea;
        }

        h1 {
            color: #2d3748;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .cargo {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .descricao {
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .redes a {
            display: inline-block;
            margin: 0 8px;
            padding: 10px 18px;
            background: #f7fafc;
            color: #2d3748;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .redes a:hover {
            background: #667eea;
            color: white;
        }

        .botao-acao {
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .botao-acao:hover {
            transform: scale(1.05);
        }

        #mensagem {
            margin-top: 20px;
            color: #48bb78;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #mensagem.visivel {
            opacity: 1;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="perfil-card">
        <div class="foto">👤</div>
        <h1>Maria Silva</h1>
        <p class="cargo">Desenvolvedora Web & Criadora</p>
        <p class="descricao">
            Apaixonada por tecnologia, amo criar páginas funcionais e bonitas. 
            Sempre aprendendo algo novo! 🚀
        </p>

        <div class="redes">
            <a href="#">GitHub</a>
            <a href="#">LinkedIn</a>
            <a href="#">Instagram</a>
        </div>

        <button class="botao-acao" onclick="exibirMensagem()">
            Clique para me conhecer!
        </button>
        <p id="mensagem">Obrigada pela visita! Vamos programar juntos? 💜</p>
    </div>

    <script>
        function exibirMensagem() {
            const msg = document.getElementById('mensagem');
            msg.classList.toggle('visivel');
        }
    </script>
<script src="script.js"></script></body>
</html>
