
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h1>Gerenciador de Tarefas</h1>

    <h3>Cadastrar Nova Tarefa</h3>

    <input type="number" id="codigo" placeholder="Código da tarefa">
    <input type="text" id="titulo" placeholder="Título da tarefa">

    <select id="prioridade">
        <option value="">Selecione a prioridade</option>
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="cadastrar()">Cadastrar Tarefa</button>

    <h3>Alterar Prioridade</h3>

    <input type="number" id="codigoAlterar" placeholder="Código da tarefa">

    <select id="novaPrioridade">
        <option value="">Nova prioridade</option>
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="alterarPrioridade()">Alterar Prioridade</button>

    <h3>Concluir Tarefa</h3>

    <input type="number" id="codigoConcluir" placeholder="Código da tarefa">

    <button onclick="concluir()">Marcar como Concluída</button>

    <h3>Lista de Tarefas</h3>

    <button onclick="listar()">Listar Tarefas</button>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Título</th>
                <th>Prioridade</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
