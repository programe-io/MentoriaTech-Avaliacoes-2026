
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 7px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px;
            margin: 5px 2px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Sistema de Estoque</h1>

    <h3>Cadastrar Produto</h3>

    <input type="number" id="codigo" placeholder="Código do produto">
    <input type="text" id="descricao" placeholder="Descrição">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor">

    <button onclick="cadastrar()">Cadastrar Produto</button>

    <h3>Alterar Produto</h3>

    <input type="number" id="codigoAlterar" placeholder="Código do produto">

    <input type="number" id="novoValor" placeholder="Novo valor">
    <button onclick="alterarValor()">Alterar Valor</button>

    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">
    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    <h3>Produtos Cadastrados</h3>

    <button onclick="listar()">Listar Produtos</button>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
            </tr>
        </thead>

        <tbody id="lista"></tbody>
    </table>

</div>

<script>
    let produtos = [];

    function cadastrar() {
        let codigo = Number(document.getElementById("codigo").value);
        let descricao = document.getElementById("descricao").value;
        let quantidade = Number(document.getElementById("quantidade").value);
        let valor = Number(document.getElementById("valor").value);

        if (!codigo || !descricao || quantidade < 0 ||
            document.getElementById("quantidade").value === "" ||
            valor < 0 || document.getElementById("valor").value === "") {
            alert("Preencha todos os campos corretamente!");
            return;
        }

        if (produtos.some(p => p.codigo === codigo)) {
            alert("Esse código já está cadastrado!");
            return;
        }

        produtos.push({ codigo, descricao, quantidade, valor });

        alert("Produto cadastrado com sucesso!");

        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";

        listar();
    }

    function listar() {
        let lista = document.getElementById("lista");
        lista.innerHTML = "";

        produtos.forEach(produto => {
            lista.innerHTML += `
                <tr>
                    <td>${produto.codigo}</td>
                    <td>${produto.descricao}</td>
                    <td>${produto.quantidade}</td>
                    <td>R$ ${produto.valor.toFixed(2)}</td>
                </tr>
            `;
        });
    }

    function alterarValor() {
        let codigo = Number(document.getElementById("codigoAlterar").value);
        let produto = produtos.find(p => p.codigo === codigo);
        let valor = document.getElementById("novoValor").value;

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (valor === "" || Number(valor) < 0) {
            alert("Digite um valor válido!");
            return;
        }

        produto.valor = Number(valor);

        alert("Valor alterado com sucesso!");
        listar();
    }

    function alterarQuantidade() {
        let codigo = Number(document.getElementById("codigoAlterar").value);
        let produto = produtos.find(p => p.codigo === codigo);
        let quantidade = document.getElementById("novaQuantidade").value;

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (quantidade === "" || Number(quantidade) < 0) {
            alert("Digite uma quantidade válida!");
            return;
        }

        produto.quantidade = Number(quantidade);

        alert("Quantidade alterada com sucesso!");
        listar();
    }
</script>

<script src="script.js"></script></body>
</html>
