<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas Seguras</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h2>🔐 Gerador de Senhas</h2>

    <!-- Exibição da Senha -->
    <div class="result-box">
      <input type="text" id="passwordOutput" readonly placeholder="Sua senha aparecerá aqui">
      <button id="copyBtn" title="Copiar senha">📋</button>
    </div>

    <!-- Indicador de Força -->
    <div class="strength-meter">
      <div id="strengthBar" class="strength-bar"></div>
    </div>
    <small id="strengthText">Força da senha: -</small>

    <!-- Controles -->
    <div class="options">
      <div class="option-group">
        <label for="lengthInput">Tamanho da senha: <span id="lengthVal">12</span></label>
        <input type="range" id="lengthInput" min="6" max="32" value="12">
      </div>

      <div class="checkbox-group">
        <label><input type="checkbox" id="uppercase" checked> Letras Maiúsculas (A-Z)</label>
        <label><input type="checkbox" id="lowercase" checked> Letras Minúsculas (a-z)</label>
        <label><input type="checkbox" id="numbers" checked> Números (0-9)</label>
        <label><input type="checkbox" id="symbols" checked> Símbolos (!@#$%...)</label>
      </div>
    </div>

    <button id="generateBtn">Gerar Nova Senha</button>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
