<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Churrasco</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="calculator-container">
    <header>
      <h1>🥩 Churrascômetro</h1>
      <p>Calcule a quantidade ideal para o seu evento</p>
    </header>

    <div class="input-section">
      <div class="input-card">
        <label for="men">Homens</label>
        <input type="number" id="men" min="0" value="0">
        <small>400g carne | 4L cerveja</small>
      </div>

      <div class="input-card">
        <label for="women">Mulheres</label>
        <input type="number" id="women" min="0" value="0">
        <small>300g carne | 2L cerveja</small>
      </div>

      <div class="input-card">
        <label for="children">Crianças</label>
        <input type="number" id="children" min="0" value="0">
        <small>200g carne | sem álcool</small>
      </div>

      <div class="input-card duration">
        <label for="duration">Duração (horas)</label>
        <input type="number" id="duration" min="1" value="4">
        <small>Acima de 6h aumenta +50%</small>
      </div>
    </div>

    <button id="calcBtn">Calcular Quantidades</button>

    <div id="results" class="results-container hidden">
      <h2>Lista de Compras Recomendada:</h2>
      <ul id="resultsList"></ul>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
