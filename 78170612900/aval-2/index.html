<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Simples</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    }
    .calculadora {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 250px;
    }
    #visor {
      width: 100%;
      height: 40px;
      font-size: 1.5rem;
      text-align: right;
      margin-bottom: 15px;
      padding: 5px;
      box-sizing: border-box;
    }
    .botoes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      height: 45px;
      font-size: 1.2rem;
      border: none;
      background-color: #e0e0e0;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #d0d0d0;
    }
    .igual {
      grid-column: span 2;
      background-color: #4CAF50;
      color: white;
    }
    .limpar {
      background-color: #f44336;
      color: white;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="calculadora">
    <input type="text" id="visor" disabled>
    <div class="botoes">
      <button class="limpar" onclick="limparVisor()">C</button>
      <button onclick="adicionar('/')">/</button>
      <button onclick="adicionar('*')">*</button>
      <button onclick="adicionar('-')">-</button>

      <button onclick="adicionar('7')">7</button>
      <button onclick="adicionar('8')">8</button>
      <button onclick="adicionar('9')">9</button>
      <button onclick="adicionar('+')">+</button>

      <button onclick="adicionar('4')">4</button>
      <button onclick="adicionar('5')">5</button>
      <button onclick="adicionar('6')">6</button>
      <button onclick="calcular()" class="igual">=</button>

      <button onclick="adicionar('1')">1</button>
      <button onclick="adicionar('2')">2</button>
      <button onclick="adicionar('3')">3</button>

      <button onclick="adicionar('0')" style="grid-column: span 2;">0</button>
      <button onclick="adicionar('.')">.</button>
    </div>
  </div>

  <script>
    const visor = document.getElementById('visor');

    function adicionar(valor) {
      visor.value += valor;
    }

    function limparVisor() {
      visor.value = '';
    }

    function calcular() {
      try {
        visor.value = eval(visor.value);
      } catch (e) {
        visor.value = 'Erro';
      }
    }
  </script>

<script src="script.js"></script></body>
</html>
