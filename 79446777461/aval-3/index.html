
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram Clone</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>

<body>

<!-- MENU LATERAL -->
<aside class="sidebar">

    <h1 class="logo">Instagram</h1>

    <nav>
        <a href="#"><i class="fa-solid fa-house"></i> Início</a>
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Pesquisa</a>
        <a href="#"><i class="fa-regular fa-compass"></i> Explorar</a>
        <a href="#"><i class="fa-solid fa-clapperboard"></i> Reels</a>
        <a href="#"><i class="fa-regular fa-paper-plane"></i> Mensagens</a>
        <a href="#"><i class="fa-regular fa-heart"></i> Notificações</a>
        <a href="#" onclick="abrirCriacao()"><i class="fa-solid fa-plus"></i> Criar</a>
        <a href="#"><i class="fa-regular fa-user"></i> Perfil</a>
    </nav>

</aside>

<!-- CONTEÚDO -->
<main class="main">

    <!-- STORIES -->
    <section class="stories" id="stories">

        <div class="story">
            <img src="imagens/perfil.jpg" alt="Meu perfil">
            <span>Seu story</span>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=12" alt="Perfil">
            <span>mariana</span>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=15" alt="Perfil">
            <span>pedro</span>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=20" alt="Perfil">
            <span>ana</span>
        </div>

    </section>

    <!-- FEED -->
    <section class="feed" id="feed">

        <article class="post">

            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=12" alt="Avatar">
                <strong>mariana.silva</strong>
                <span>•••</span>
            </div>

            <img class="post-image"
            src="https://picsum.photos/600/600?random=1"
            alt="Publicação">

            <div class="post-actions">

                <div>
                    <button onclick="curtir(this)">
                        <i class="fa-regular fa-heart"></i>
                    </button>

                    <button onclick="comentar(this)">
                        <i class="fa-regular fa-comment"></i>
                    </button>

                    <button>
                        <i class="fa-regular fa-paper-plane"></i>
                    </button>
                </div>

                <button onclick="salvar(this)">
                    <i class="fa-regular fa-bookmark"></i>
                </button>

            </div>

            <p class="likes">1.250 curtidas</p>

            <p><strong>mariana.silva</strong>
                Aproveitando o dia! ❤️
            </p>

            <div class="comentarios"></div>

            <input
                type="text"
                placeholder="Adicione um comentário..."
                onkeydown="enviarComentario(event, this)"
            >

        </article>

    </section>

</main>

<!-- MODAL DE CRIAÇÃO -->
<div class="modal" id="modal">

    <div class="modal-content">

        <h2>Criar publicação</h2>

        <input type="text" id="nomePost"
        placeholder="Seu nome de usuário">

        <textarea id="legendaPost"
        placeholder="Escreva uma legenda..."></textarea>

        <input type="text" id="imagemPost"
        placeholder="URL da imagem">

        <button onclick="publicar()">Compartilhar</button>

        <button onclick="fecharCriacao()" class="fechar">
            Cancelar
        </button>

    </div>

</div>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
