
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topo">
    <h1>MiniSocial</h1>
    <span>Meu Feed</span>
</header>

<main class="container">

    <!-- Criar publicação -->
    <section class="criar-post">
        <h2>Nova publicação</h2>

        <input type="text" id="usuario"
        placeholder="Seu nome">

        <textarea id="textoPost"
        placeholder="O que você está pensando?"></textarea>

        <input type="text" id="imagemPost"
        placeholder="URL da imagem (opcional)">

        <button onclick="publicar()">
            Publicar
        </button>
    </section>

    <!-- Feed -->
    <section id="feed">

        <article class="post">
            <h3>Maria Silva</h3>
            <p>Olá, pessoal! Bem-vindos ao meu feed! ❤️</p>

            <button onclick="curtir(this)">
                ❤️ Curtir <span>0</span>
            </button>

            <div class="comentarios"></div>
        </article>

    </section>

</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
