<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header class="topo">

        <div>
            <h1>Controle de Tarefas</h1>
            <p>Organize suas atividades de forma simples</p>
        </div>

    </header>


    <main class="principal">

        <!-- RESUMO -->
        <section class="resumo">

            <div class="caixa">
                <span>Total</span>
                <strong id="total">0</strong>
            </div>

            <div class="caixa">
                <span>Pendentes</span>
                <strong id="pendentes">0</strong>
            </div>

            <div class="caixa">
                <span>Concluídas</span>
                <strong id="concluidas">0</strong>
            </div>

        </section>


        <div class="conteudo">

            <!-- FORMULÁRIO -->
            <section class="painel">

                <h2>Nova tarefa</h2>

                <form onsubmit="cadastrar(event)">

                    <label for="codigo">
                        Código
                    </label>

                    <input
                        type="text"
                        id="codigo"
                        placeholder="Ex: 009"
                    >


                    <label for="titulo">
                        Título
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        placeholder="Nome da tarefa"
                    >


                    <label for="prioridade">
                        Prioridade
                    </label>

                    <select id="prioridade">

                        <option value="">
                            Selecione
                        </option>

                        <option value="1">
                            1 - Alta
                        </option>

                        <option value="2">
                            2 - Média
                        </option>

                        <option value="3">
                            3 - Baixa
                        </option>

                    </select>


                    <button type="submit">
                        Adicionar tarefa
                    </button>

                </form>

            </section>


            <!-- AÇÕES -->
            <section class="painel">

                <h2>Gerenciar</h2>

                <label for="codigoBusca">
                    Código da tarefa
                </label>

                <input
                    type="text"
                    id="codigoBusca"
                    placeholder="Ex: 001"
                >


                <button
                    class="verde"
                    onclick="concluirTarefa()"
                >
                    ✓ Marcar como concluída
                </button>


                <button
                    class="laranja"
                    onclick="alterarPrioridade()"
                >
                    Alterar prioridade
                </button>

            </section>

        </div>


        <!-- LISTA -->
        <section class="lista">

            <div class="cabecalho-lista">

                <h2>Minhas tarefas</h2>

                <button
                    class="atualizar"
                    onclick="mostrarTarefas()"
                >
                    Atualizar
                </button>

            </div>


            <div id="listaTarefas" class="tarefas">
            </div>

        </section>

    </main>


    <footer>
        Projeto de Gerenciamento de Tarefas
    </footer>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
