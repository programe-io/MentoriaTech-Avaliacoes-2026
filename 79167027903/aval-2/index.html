
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tok Mania</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1><span>Tok</span> Mania ♪</h1>
        <input type="text" placeholder="Pesquisar vídeos...">
        <button onclick="mostrarPerfil()">Perfil 👤</button>
    </header>

    <main>
        <section class="feed" id="feed">

            <article class="video">
                <video controls loop playsinline>
                    <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
                </video>

                <div class="informacoes">
                    <h3>@usuario_01</h3>
                    <p>Um momento especial! ✨ #viral #tokmania</p>
                </div>

                <div class="acoes">
                    <button onclick="curtir(this)">❤️ <span>120</span></button>
                    <button onclick="comentar()">💬 25</button>
                    <button onclick="compartilhar()">↗️ Compartilhar</button>
                </div>
            </article>

            <article class="video">
                <video controls loop playsinline>
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                </video>

                <div class="informacoes">
                    <h3>@criador_02</h3>
                    <p>Confira esse vídeo! 😍 #diversão</p>
                </div>

                <div class="acoes">
                    <button onclick="curtir(this)">❤️ <span>350</span></button>
                    <button onclick="comentar()">💬 48</button>
                    <button onclick="compartilhar()">↗️ Compartilhar</button>
                </div>
            </article>

        </section>

        <aside id="perfil" class="perfil">
            <button onclick="fecharPerfil()">✖ Fechar</button>
            <h2>👤 Meu Perfil</h2>
            <div class="avatar">👤</div>
            <h3>@meu_usuario</h3>
            <p>Bem-vindo ao meu perfil!</p>

            <div class="estatisticas">
                <p><strong>120</strong><br>Seguindo</p>
                <p><strong>500</strong><br>Seguidores</p>
                <p><strong>2.000</strong><br>Curtidas</p>
            </div>
        </aside>

    </main>

    <footer>
        <button onclick="inicio()">🏠 Início</button>
        <button onclick="mostrarPerfil()">👤 Perfil</button>
        <button onclick="novoVideo()">➕ Publicar</button>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
