
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tok Mania</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topo">
        <h1><span>Tok</span> Mania ♪</h1>
        <input type="search" placeholder="Pesquisar vídeos..." id="pesquisa">
        <button id="abrirPerfil">👤 Perfil</button>
    </header>

    <main>
        <section class="feed" id="feed">

            <article class="video">
                <video controls loop playsinline preload="metadata">
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    Seu navegador não suporta vídeos.
                </video>

                <div class="informacoes">
                    <h3>@usuario_01</h3>
                    <p>Bem-vindo ao Tok Mania! 🎵 #diversão</p>
                </div>

                <div class="acoes">
                    <button class="curtir">❤️ <span>120</span></button>
                    <button class="comentar">💬 <span>0</span></button>
                    <button class="compartilhar">↗️ Compartilhar</button>
                </div>
            </article>

            <article class="video">
                <video controls loop playsinline preload="metadata">
                    <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
                    Seu navegador não suporta vídeos.
                </video>

                <div class="informacoes">
                    <h3>@criador_02</h3>
                    <p>Compartilhando momentos especiais! ✨</p>
                </div>

                <div class="acoes">
                    <button class="curtir">❤️ <span>350</span></button>
                    <button class="comentar">💬 <span>0</span></button>
                    <button class="compartilhar">↗️ Compartilhar</button>
                </div>
            </article>

        </section>

        <section id="perfil" class="perfil escondido">
            <button id="fecharPerfil">✖ Fechar</button>
            <div class="avatar">👤</div>
            <h2>Meu Perfil</h2>
            <h3>@meu_usuario</h3>
            <p>Bem-vindo ao meu perfil!</p>

            <div class="estatisticas">
                <p><strong>120</strong><br>Seguindo</p>
                <p><strong>500</strong><br>Seguidores</p>
                <p><strong>2.000</strong><br>Curtidas</p>
            </div>
        </section>
    </main>

    <footer>
        <button id="inicio">🏠 Início</button>
        <button id="perfilRodape">👤 Perfil</button>
        <button id="publicar">➕ Publicar vídeo</button>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
