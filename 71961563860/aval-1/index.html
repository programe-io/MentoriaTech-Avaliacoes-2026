
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 toque e estoque!</h1>
        <p>Gerencie seus produtos de maneira simples</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <label for="descricao">Nome do produto</label>
                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex: Cadeira gamer"
                    required
                    minlength="5"
                >

                <label for="quantidade">Quantidade</label>
                <input
                    type="number"
                    id="quantidade"
                    min="1"
                    step="1"
                    placeholder="Ex: 10"
                    required
                >

                <label for="valor">Preço (R$)</label>
                <input
                    type="number"
                    id="valor"
                    min="0"
                    step="0.01"
                    placeholder="Ex: 199.90"
                    required
                >

                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section class="card">
            <h2>Produtos cadastrados</h2>

            <div class="resumo">
                <span>Total de produtos:</span>
                <strong id="totalProdutos">0</strong>
                <span>Unidades em estoque:</span>
                <strong id="totalUnidades">0</strong>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="5">Nenhum produto cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto CRUD e Estoque em JavaScript</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
