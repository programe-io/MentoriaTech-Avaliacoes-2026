<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- =========================================================================
         [AJUDA PARA ENCONTRAR - PASSO 1: TÍTULO DA ABA]
         ALTERE AQUI DESSA FORMA: Troque apenas o texto entre <title> e </title>
         pelo nome do seu sistema (Ex: Clínica Vida Saudável - IMC).
         ========================================================================= -->
    <title>cadastramentos de pacientes</title>

    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <!-- =========================================================================
             [AJUDA PARA ENCONTRAR - PASSO 2: CABEÇALHO PRINCIPAL]
             ALTERE AQUI DESSA FORMA:
             1) Em <h1>, coloque o nome da sua clínica, academia ou hospital.
             2) Em <p>, escreva uma frase curta descrevendo o objetivo do sistema.
             ========================================================================= -->
        <header class="cabecalho">
            <h1>CADASTRE AQUI!</h1>
            <p class="subtitulo">UM SITE PRA CADASTRAR PACIENTES PROFISSIONALMENTE</p>
        </header>

        <!-- CARD 1: Formulário de Cadastro -->
        <section class="card">

            <!-- =====================================================================
                 [AJUDA PARA ENCONTRAR - PASSO 3: TÍTULO DO FORMULÁRIO]
                 ALTERE AQUI DESSA FORMA: Troque "Cadastrar Paciente" por outro termo
                 se desejar (Ex: "Cadastrar Aluno", "Novo Atendimento").
                 ===================================================================== -->
            <h2>Cadastrar Paciente medico</h2>

            <form id="form-pessoa" novalidate>
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <!-- =============================================================
                         [AJUDA PARA ENCONTRAR - PASSO 4: EXEMPLOS NOS CAMPOS]
                         ALTERE AQUI DESSA FORMA: Mude o texto dentro de placeholder=""
                         para colocar exemplos fictícios da sua escolha.
                         ============================================================= -->
                    <input type="text" id="nome" maxlength="50" placeholder="Ex.: Maria Silva">
                </div>

                <div class="grid-campos">
                    <div class="campo">
                        <label for="idade">Idade (anos)</label>
                        <input type="number" id="idade" min="1" max="120" placeholder="Ex.: 28">
                    </div>

                    <div class="campo">
                        <label for="altura">Altura (m)</label>
                        <input type="number" id="altura" min="0.5" max="2.5" step="0.01" placeholder="Ex.: 1.70">
                    </div>

                    <div class="campo">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" id="peso" min="2" max="500" step="0.1" placeholder="Ex.: 65.5">
                    </div>
                </div>

                <!-- Mensagem de erro controlada pelo JavaScript (NÃO APAGUE O id="erro") -->
                <p id="erro" class="mensagem-erro" hidden></p>

                <!-- =====================================================================
                     [AJUDA PARA ENCONTRAR - PASSO 5: TEXTO DOS BOTÕES]
                     ALTERE AQUI DESSA FORMA: Mude apenas o texto entre <button> e </button>
                     (Ex: "Registrar Paciente" e "Limpar Campos"). Não altere os atributos id/type.
                     ===================================================================== -->
                <div class="acoes-form">
                    <button type="submit" class="btn btn-salvar">Salvar</button>
                    <button type="reset" id="btn-cancelar" class="btn btn-cancelar">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- CARD 2: Tabela de Pacientes Cadastrados -->
        <section class="card">
            <h2>Pacientes Cadastrados</h2>

            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <!-- O conteúdo abaixo é preenchido automaticamente pelo app.js -->
                    <tbody id="tabela-pessoas"></tbody>
                </table>
            </div>
        </section>

        <!-- =========================================================================
             [AJUDA PARA ENCONTRAR - PASSO 6: IDENTIFICAÇÃO DO ALUNO]
             ALTERE AQUI DESSA FORMA: Substitua [Seu Nome Aqui] e [Sua Turma] pelos
             seus dados reais para identificar a autoria do projeto.
             ========================================================================= -->
        <footer class="rodape">
            <p>Desenvolvido por: <strong>[Seu Nome Aqui]</strong> — Turma: [Sua Turma]</p>
        </footer>

    </main>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
