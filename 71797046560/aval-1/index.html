```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        h2 {
            color: #444;
        }

        section {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .produto {
            margin-top: 15px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
            border-left: 4px solid #333;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Cadastro de Produtos</h1>

        <!-- CADASTRAR PRODUTO -->
        <section>
            <h2>Cadastrar Produto</h2>

            <label for="descricao">Descrição:</label>
            <input
                type="text"
                id="descricao"
                placeholder="Digite a descrição"
            >

            <label for="quantidade">Quantidade:</label>
            <input
                type="number"
                id="quantidade"
                placeholder="Digite a quantidade"
            >

            <label for="valor">Valor:</label>
            <input
                type="number"
                id="valor"
                step="0.01"
                placeholder="Digite o valor"
            >

            <button onclick="cadastrarProdutoHTML()">
                Cadastrar Produto
            </button>
        </section>


        <!-- LISTAR PRODUTOS -->
        <section>
            <h2>Produtos cadastrados</h2>

            <button onclick="listarProdutosHTML()">
                Listar Produtos
            </button>

            <div id="listaProdutos"></div>
        </section>


        <!-- ATUALIZAR VALOR -->
        <section>
            <h2>Atualizar Valor</h2>

            <label for="codigo">Código do produto:</label>
            <input
                type="number"
                id="codigo"
                placeholder="Digite o código"
            >

            <label for="novoValor">Novo valor:</label>
            <input
                type="number"
                id="novoValor"
                step="0.01"
                placeholder="Digite o novo valor"
            >

            <button onclick="atualizarValorHTML()">
                Atualizar Valor
            </button>
        </section>

    </div>


    <script>

        // Lista onde os produtos serão armazenados
        let produtos = [];


        // ============================
        // VALIDAR PRODUTO
        // ============================

        function validarProdutos(descricao, quantidade, valor) {

            if (descricao.length < 5) {
                alert("Descrição deve ter no mínimo 5 caracteres");
                return false;
            }

            if (quantidade < 1) {
                alert("Quantidade deve ser maior que zero");
                return false;
            }

            if (valor < 0) {
                alert("Valor deve ser maior ou igual a zero");
                return false;
            }

            return true;
        }


        // ============================
        // CADASTRAR PRODUTO
        // ============================

        function cadastrarProduto(descricao, quantidade, valor) {

            let novoProduto = {
                codigo: produtos.length + 1,
                descricao: descricao,
                quantidade: quantidade,
                valor: valor
            };

            produtos.push(novoProduto);
        }


        // ============================
        // LISTAR PRODUTOS
        // ============================

        function listarProdutos() {
            console.log(produtos);
        }


        // ============================
        // ATUALIZAR VALOR
        // ============================

        function atualizarValor(codigoProduto, novoValor) {

            if (novoValor < 0) {
                alert("Valor deve ser maior ou igual a zero");
                return;
            }

            const produto = produtos.find(
                produto => produto.codigo === codigoProduto
            );

            if (produto) {
                produto.valor = novoValor;
            } else {
                alert("Produto não encontrado");
            }
        }


        // ============================
        // CADASTRAR PELO HTML
        // ============================

        function cadastrarProdutoHTML() {

            const descricao =
                document.getElementById("descricao").value;

            const quantidade =
                Number(document.getElementById("quantidade").value);

            const valor =
                Number(document.getElementById("valor").value);


            // Verifica os dados
            if (!validarProdutos(descricao, quantidade, valor)) {
                return;
            }


            // Cadastra o produto
            cadastrarProduto(descricao, quantidade, valor);


            alert("Produto cadastrado com sucesso!");


            // Limpa os campos
            document.getElementById("descricao").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("valor").value = "";


            // Atualiza a lista
            listarProdutosHTML();
        }


        // ============================
        // MOSTRAR PRODUTOS NA TELA
        // ============================

        function listarProdutosHTML() {

            const lista =
                document.getElementById("listaProdutos");

            lista.innerHTML = "";


            if (produtos.length === 0) {

                lista.innerHTML =
                    "<p>Nenhum produto cadastrado.</p>";

                return;
            }


            produtos.forEach(function(produto) {

                lista.innerHTML += `
                    <div class="produto">

                        <strong>Código:</strong>
                        ${produto.codigo}
                        <br>

                        <strong>Descrição:</strong>
                        ${produto.descricao}
                        <br>

                        <strong>Quantidade:</strong>
                        ${produto.quantidade}
                        <br>

                        <strong>Valor:</strong>
                        R$ ${produto.valor.toFixed(2)}

                    </div>
                `;

            });
        }


        // ============================
        // ATUALIZAR VALOR PELO HTML
        // ============================

        function atualizarValorHTML() {

            const codigo =
                Number(document.getElementById("codigo").value);

            const novoValor =
                Number(document.getElementById("novoValor").value);


            const produto = produtos.find(
                produto => produto.codigo === codigo
            );


            if (!produto) {

                alert("Produto não encontrado!");

                return;
            }


            if (novoValor < 0) {

                alert(
                    "O valor deve ser maior ou igual a zero!"
                );

                return;
            }


            atualizarValor(codigo, novoValor);


            alert("Valor atualizado com sucesso!");


            // Limpa os campos
            document.getElementById("codigo").value = "";
            document.getElementById("novoValor").value = "";


            // Atualiza a lista
            listarProdutosHTML();
        }

    </script>

<script src="script.js"></script></body>
</html>
