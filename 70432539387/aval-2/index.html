<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Gerenciador de Tarefas</h1>
        <p class="subtitulo">Organize suas tarefas de maneira simples.</p>

        <section>
            <h2>Cadastrar Tarefa</h2>

            <label for="titulo">Título:</label>
            <input type="text" id="titulo" placeholder="Digite o título da tarefa">

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade">
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button onclick="cadastrarTarefa()">Cadastrar Tarefa</button>
        </section>

        <section>
            <h2>Concluir Tarefa</h2>

            <label for="codigoConcluir">Código da tarefa:</label>
            <input type="number" id="codigoConcluir" placeholder="Digite o código">

            <button onclick="concluirTarefa()">Concluir Tarefa</button>
        </section>

        <section>
            <h2>Alterar Prioridade</h2>

            <label for="codigoAlterar">Código da tarefa:</label>
            <input type="number" id="codigoAlterar" placeholder="Digite o código">

            <label for="novaPrioridade">Nova prioridade:</label>
            <select id="novaPrioridade">
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button onclick="alterarPrioridade()">Alterar Prioridade</button>
        </section>

        <section>
            <h2>Tarefas Cadastradas</h2>

            <button onclick="listarTarefas()">Listar Tarefas</button>

            <div id="listaTarefas">
                <p>Nenhuma tarefa cadastrada.</p>
            </div>
        </section>

        <p id="mensagem"></p>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
