
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <header>
            <div>
                <h1>TaskFlow</h1>
                <p>Organize suas tarefas e conquiste seus objetivos.</p>
            </div>
            <span class="logo">✓</span>
        </header>

        <section class="dashboard">
            <div class="stat-card">
                <span>Total de tarefas</span>
                <h2 id="totalTasks">0</h2>
            </div>

            <div class="stat-card">
                <span>Pendentes</span>
                <h2 id="pendingTasks">0</h2>
            </div>

            <div class="stat-card">
                <span>Concluídas</span>
                <h2 id="completedTasks">0</h2>
            </div>
        </section>

        <section class="task-form">
            <h2>Adicionar nova tarefa</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Digite o nome da tarefa..."
                    required
                >

                <input type="date" id="taskDate">

                <select id="taskPriority">
                    <option value="Baixa">Baixa prioridade</option>
                    <option value="Média" selected>Média prioridade</option>
                    <option value="Alta">Alta prioridade</option>
                </select>

                <button type="submit">+ Adicionar tarefa</button>
            </form>
        </section>

        <section class="tasks-section">
            <div class="tasks-header">
                <h2>Minhas tarefas</h2>

                <select id="filterTasks">
                    <option value="all">Todas</option>
                    <option value="pending">Pendentes</option>
                    <option value="completed">Concluídas</option>
                </select>
            </div>

            <div id="taskList" class="task-list">
                <p class="empty">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>

        <footer>
            <p>TaskFlow © 2026 - Gerenciador de Tarefas</p>
        </footer>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>$0
