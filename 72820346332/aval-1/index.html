<!DOCTYPE html>
<html>
    <head>
        <style>
        body{font-family:Arial:text_align:center;}
        input, button{padding:8px: margin:5px:}
        </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <body>

    <h2>Estoque de Produtos</h2>
    <inputid="nome"placeholder="Produto">
    <input id="qtd" type="number"
    placeholder="Quantidade">
    <button
    onclick="cadastrar()">cadastrar</button>
    <ul id="lista"></ul>
    <script>
        let produtos=[];
        function cadastrar(){
            let nome =
            document.getElementByld("nome").value;
            let qtd =
            Number(document.getElementByld("qtd").value;
            );
               if(nome.length ,5|| qtd < 1){
                alert("Dados inválidos!");
                return;

               }
            produtos.push({nome, qtd});
            listar();

        }

         function listar() {
            lista.innerHTML =produtos.map(p = >
            <li>${p.nome}  -  ${p.qtd}
            unidades</li>
            ).join("");
         }
         </script>


         </body>
         </html>
