
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ficha de Anamnese</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<h1>Ficha de Anamnese</h1>

<form id="formPessoa">
    <input id="nome" placeholder="Nome" required>
    <input id="idade" type="number" placeholder="Idade" required>
    <input id="altura" type="number" step="0.01" placeholder="Altura (m)" required>
    <input id="peso" type="number" step="0.1" placeholder="Peso (kg)" required>
    <button type="submit">Cadastrar</button>
</form>

<p id="erro" hidden></p>

<table>
    <thead>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Altura</th>
            <th>Peso</th>
            <th>IMC</th>
            <th>Classificação</th>
        </tr>
    </thead>
    <tbody id="lista"></tbody>
</table>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
