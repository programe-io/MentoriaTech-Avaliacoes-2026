<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
  <header>
    <h1>HOMEM-ARANHA</h1>
    <p class="subtitle">O Amigão da Vizinhança</p>
  </header>

  <main class="card">
    <div class="spider-emblem">🕷️</div>
    <h2>Peter Parker</h2>
    <p class="bio">
      Picado por uma aranha radioativa, Peter ganhou agilidade sobre-humana, 
      força proporcional e o famoso Sentido Aranha para proteger Nova York.
    </p>

    <div class="stats">
      <div class="stat-box">
        <span>Força</span>
        <strong>95%</strong>
      </div>
      <div class="stat-box">
        <span>Agilidade</span>
        <strong>100%</strong>
      </div>
      <div class="stat-box">
        <span>Intelecto</span>
        <strong>98%</strong>
      </div>
    </div>

    <div class="actions">
      <button id="btn-teia">Soltar Teia 🕸️</button>
      <button id="btn-traje">Trocar Traje ⚫</button>
    </div>
  </main>

  <div id="teia-container"></div>
</div>

  <script src="script.js"></script>
  
</body>
</html>
