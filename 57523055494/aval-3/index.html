<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Calculadora de IMC</h1>

    <!-- Card 1: Formulário -->
    <section class="card">
      <h2>Cadastro de Paciente</h2>
      <form id="formPessoa">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Digite o nome do paciente" maxlength="50">
        </div>
        <div class="campo">
          <label for="idade">Idade</label>
          <input type="number" id="idade" placeholder="Ex: 30" min="1" max="120">
        </div>
        <div class="campo">
          <label for="altura">Altura (m)</label>
          <input type="number" id="altura" placeholder="Ex: 1.75" min="0.30" max="2.50" step="0.01">
        </div>
        <div class="campo">
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" placeholder="Ex: 70.5" min="1" max="300" step="0.1">
        </div>

        <p id="erro"></p>

        <div class="botoes">
          <button type="submit" class="btn-salvar">Salvar</button>
          <button type="button" id="btnCancelar" class="btn-cancelar">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Card 2: Tabela -->
    <section class="card">
      <h2>Pacientes Cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Altura</th>
            <th>Peso</th>
            <th>IMC</th>
            <th>Classificação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaPessoas">
          <!-- Preenchido via JavaScript -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
