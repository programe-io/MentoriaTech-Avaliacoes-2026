<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📋 Gerenciador de Tarefas</h1>

        <!-- Seção de Cadastro e Validação -->
        <div class="card">
            <h3>Novo Cadastro / Alteração</h3>
            <div class="form-group">
                <input type="text" id="inputTitulo" placeholder="Digite o título da tarefa...">
                <select id="selectPrioridade">
                    <option value="">Selecione a Prioridade</option>
                    <option value="baixa">Baixa</option>
                    <option value="média">Média</option>
                    <option value="alta">Alta</option>
                </select>
                <button onclick="dispararCadastro()">Cadastrar</button>
            </div>
            <div id="mensagemErro" class="erro-msg"></div>
        </div>

        <!-- Seção de Busca e Ações Rápidas -->
        <div class="card-acoes">
            <div class="busca-box">
                <input type="number" id="inputBuscaId" placeholder="ID da Tarefa">
                <button class="btn-info" onclick="dispararBusca()">Buscar</button>
            </div>
            <div class="botoes-grupo">
                <button class="btn-sucesso" onclick="dispararConclusao()">Concluir por ID</button>
                <button class="btn-alerta" onclick="dispararAlteracaoPrioridade()">Alterar Prioridade por ID</button>
            </div>
        </div>

        <!-- Listagem das Tarefas -->
        <div class="lista-container">
            <h2>Tarefas Cadastradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Status</th>
                        <th>Título</th>
                        <th>Prioridade</th>
                    </tr>
                </thead>
                <tbody id="tabelaTarefas">
                    <!-- Gerado dinamicamente pelo JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
