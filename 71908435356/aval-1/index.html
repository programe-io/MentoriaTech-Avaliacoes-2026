<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque Pro</title>
    <!-- Vinculando o arquivo de estilos CSS externo -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>📦 Sistema de Controle de Estoque</h1>
        </header>

        <div class="dashboard">
            <!-- COLUNA 1: CADASTRO -->
            <div class="card">
                <h2>Cadastrar Novo Produto</h2>
                <form id="form-cadastro">
                    <div class="form-group">
                        <label for="desc">Descrição do Produto</label>
                        <input type="text" id="desc" required placeholder="Ex: Notebook Dell">
                    </div>
                    <div class="form-group">
                        <label for="qtd">Quantidade Inicial</label>
                        <input type="number" id="qtd" min="0" required placeholder="Ex: 10">
                    </div>
                    <div class="form-group">
                        <label for="val">Valor Unitário (R$)</label>
                        <input type="number" id="val" step="0.01" min="0.01" required placeholder="Ex: 4500.00">
                    </div>
                    <button type="submit">Adicionar ao Estoque</button>
                </form>
            </div>

            <!-- COLUNA 2: LISTAGEM E MOVIMENTAÇÃO -->
            <div class="card">
                <h2>Produtos em Estoque</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descrição</th>
                                <th>Qtd.</th>
                                <th>Valor Un.</th>
                                <th>Total</th>
                                <th>Ações de Estoque / Preço</th>
                            </tr>
                        </thead>
                        <tbody id="lista-produtos-body">
                            <!-- Inserido dinamicamente via script.js -->
                        </tbody>
                    </table>
                </div>
                <div class="summary-box" id="resumo-estoque">
                    Valor Total do Estoque: R$ 0,00
                </div>
            </div>
        </div>
    </div>

    <!-- Vinculando o arquivo de lógica JavaScript externa -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
