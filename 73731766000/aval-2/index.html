<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de tarefas</title>
  <meta name="description" content="Cadastre, organize e conclua suas tarefas em um só lugar.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <header class="hero">
      <p class="eyebrow">Mentoria Tech · Avaliação 2</p>
      <h1>Gerenciador de tarefas</h1>
      <p class="intro">Cadastre, organize e conclua suas tarefas.</p>
    </header>

    <section class="summary" aria-label="Resumo">
      <div class="card card-total">
        <span>Total</span>
        <strong id="total">0</strong>
      </div>
      <div class="card card-andamento">
        <span>Em andamento</span>
        <strong id="andamento">0</strong>
      </div>
      <div class="card card-concluidas">
        <span>Concluídas</span>
        <strong id="concluidas">0</strong>
      </div>
    </section>

    <div class="progresso-bloco">
      <div class="progresso-topo">
        <span>Progresso</span>
        <span id="progresso-texto">0%</span>
      </div>
      <div class="progresso" role="progressbar" aria-label="Progresso das tarefas"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progresso">
        <div class="progresso-barra" id="progresso-barra"></div>
      </div>
    </div>

    <section class="panel">
      <h2><span class="marca" aria-hidden="true"></span>Nova tarefa</h2>

      <div class="campo">
        <label for="titulo">Título (mínimo 5 caracteres)</label>
        <input id="titulo" type="text" placeholder="Ex.: Estudar JavaScript" autocomplete="off">
      </div>

      <div class="campo">
        <label for="prioridade">Prioridade</label>
        <select id="prioridade">
          <option value="1">1 — Alta</option>
          <option value="2" selected>2 — Média</option>
          <option value="3">3 — Baixa</option>
        </select>
      </div>

      <button id="botao-adicionar" type="button">Adicionar tarefa</button>

      <p id="mensagem" role="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <div class="list-head">
        <h2><span class="marca" aria-hidden="true"></span>Tarefas</h2>
        <label for="filtro" class="oculto">Filtrar tarefas</label>
        <select id="filtro">
          <option value="todas">Todas</option>
          <option value="andamento">Em andamento</option>
          <option value="concluidas">Concluídas</option>
        </select>
      </div>

      <ul id="lista"></ul>
      <p id="vazia">Nenhuma tarefa cadastrada ainda.</p>
    </section>

    <footer class="rodape">
      <p>Feito com HTML, CSS e JavaScript puro.</p>
    </footer>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
