<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de IMC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Controle de IMC</h1>
    <p class="sub">Informe os dados do paciente para calcular o índice de massa corporal.</p>

    <section class="cartao">
      <label for="nome">Nome do paciente
        <input id="nome" type="text" maxlength="80" autocomplete="off">
      </label>
      <div class="linha">
        <label for="peso">Peso (kg)
          <input id="peso" type="text" inputmode="decimal" placeholder="Ex.: 70,5" autocomplete="off">
        </label>
        <label for="altura">Altura (m)
          <input id="altura" type="text" inputmode="decimal" placeholder="Ex.: 1,75" autocomplete="off">
        </label>
      </div>
      <button type="button" id="calcular">Calcular IMC</button>
      <p id="erro" role="alert" hidden></p>
    </section>

    <section class="cartao" id="resultado" hidden>
      <h2 id="rNome"></h2>
      <p class="nota" id="rDados"></p>
      <p class="imc" id="rImc"></p>
      <p class="classe" id="rClasse"></p>
      <p id="rTexto"></p>
      <p id="rIdeal"></p>
      <table>
        <thead><tr><th>Classificação</th><th>IMC</th></tr></thead>
        <tbody id="tabela"></tbody>
      </table>
      <p class="nota">O IMC é uma referência para adultos e não substitui a avaliação de um profissional de saúde.</p>
    </section>
  </main>
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
