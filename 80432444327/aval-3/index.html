
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTokPlay</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <header class="top">
        <i class="fas fa-tv"></i>

        <nav>
            <a href="#">Seguindo</a>
            <a href="#" class="active">Para você</a>
            <a href="#">Ao vivo</a>
        </nav>

        <i class="fas fa-search"></i>
    </header>

    <main class="video-feed" id="videoFeed">

        <section class="video-card">
            <video class="video" loop muted playsinline
                src="https://videos.pexels.com/video-files/3129671/3129671-hd_1080_1920_25fps.mp4">
            </video>

            <div class="video-info">
                <h3>@mariana.oficial</h3>
                <p>Um momento especial! ❤️ #paravoce #viral</p>
                <p><i class="fas fa-music"></i> Som original - Mariana</p>
            </div>

            <div class="actions">
                <div class="profile">
                    <img src="https://i.pravatar.cc/100?img=5">
                    <button class="follow">+</button>
                </div>

                <button class="action like">
                    <i class="fas fa-heart"></i>
                    <span>25.4K</span>
                </button>

                <button class="action comment">
                    <i class="fas fa-comment-dots"></i>
                    <span>1.250</span>
                </button>

                <button class="action share">
                    <i class="fas fa-share"></i>
                    <span>Compartilhar</span>
                </button>
            </div>
        </section>

        <section class="video-card">
            <video class="video" loop muted playsinline
                src="https://videos.pexels.com/video-files/854429/854429-hd_1080_1920_25fps.mp4">
            </video>

            <div class="video-info">
                <h3>@lucas.silva</h3>
                <p>A beleza está nas pequenas coisas! 🌎</p>
                <p><i class="fas fa-music"></i> Música original</p>
            </div>

            <div class="actions">
                <div class="profile">
                    <img src="https://i.pravatar.cc/100?img=8">
                    <button class="follow">+</button>
                </div>

                <button class="action like">
                    <i class="fas fa-heart"></i>
                    <span>12.8K</span>
                </button>

                <button class="action comment">
                    <i class="fas fa-comment-dots"></i>
                    <span>890</span>
                </button>

                <button class="action share">
                    <i class="fas fa-share"></i>
                    <span>Compartilhar</span>
                </button>
            </div>
        </section>

        <section class="video-card">
            <video class="video" loop muted playsinline
                src="https://videos.pexels.com/video-files/3045163/3045163-hd_1080_1920_25fps.mp4">
            </video>

            <div class="video-info">
                <h3>@ana.criativa</h3>
                <p>Vivendo e aprendendo! ✨</p>
                <p><i class="fas fa-music"></i> Som original - Ana</p>
            </div>

            <div class="actions">
                <div class="profile">
                    <img src="https://i.pravatar.cc/100?img=9">
                    <button class="follow">+</button>
                </div>

                <button class="action like">
                    <i class="fas fa-heart"></i>
                    <span>8.2K</span>
                </button>

                <button class="action comment">
                    <i class="fas fa-comment-dots"></i>
                    <span>450</span>
                </button>

                <button class="action share">
                    <i class="fas fa-share"></i>
                    <span>Compartilhar</span>
                </button>
            </div>
        </section>

    </main>

    <footer class="bottom-menu">
        <button><i class="fas fa-house"></i><span>Início</span></button>
        <button><i class="fas fa-users"></i><span>Amigos</span></button>
        <button class="add"><i class="fas fa-plus"></i></button>
        <button><i class="fas fa-inbox"></i><span>Caixa de entrada</span></button>
        <button><i class="fas fa-user"></i><span>Perfil</span></button>
    </footer>

    <!-- MODAL DE PUBLICAÇÃO -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <button class="close" id="closeModal">×</button>
            <h2>Publicar vídeo</h2>

            <input type="text" id="newUser" placeholder="Seu usuário">

            <input type="url" id="newVideo"
                placeholder="Link direto do vídeo MP4">

            <textarea id="newCaption"
                placeholder="Escreva uma legenda..."></textarea>

            <button id="publishVideo">Publicar</button>
        </div>
    </div>

    <!-- MODAL DE COMENTÁRIOS -->
    <div class="modal" id="commentModal">
        <div class="modal-content">
            <button class="close" id="closeComments">×</button>
            <h2>Comentários</h2>
            <div id="commentList"></div>
            <input type="text" id="commentInput"
                placeholder="Escreva um comentário...">
            <button id="sendComment">Enviar</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
