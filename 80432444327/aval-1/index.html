
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOTO AZUL</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <a class="logo" href="#inicio">🏍 MOTO<span>AZUL</span></a>
    <button class="menu-toggle" id="menuToggle">☰</button>
    <nav id="menu">
      <a href="#inicio">Início</a>
      <a href="#motos">Motos</a>
      <a href="#sobre">Sobre</a>
      <a href="#contato">Contato</a>
    </nav>
    <button class="carrinho" id="cartButton">
      🛒 Carrinho <span id="cartCount">0</span>
    </button>
  </header>

  <main>
    <section class="hero" id="inicio">
      <div class="hero-content">
        <p class="etiqueta">LIBERDADE SOBRE DUAS RODAS</p>
        <h1>Sinta a estrada.<br><span>Viva a aventura.</span></h1>
        <p>Encontre a moto ideal para seu estilo.</p>
        <a class="botao" href="#motos">VER MOTOS</a>
      </div>
    </section>

    <section class="secao" id="motos">
      <p class="etiqueta">NOSSA VITRINE</p>
      <h2>Escolha sua próxima moto</h2>

      <div class="filtros">
        <input id="searchInput" type="search" placeholder="Buscar moto...">
        <select id="categoryFilter">
          <option value="todas">Todas as categorias</option>
          <option value="street">Street</option>
          <option value="esportiva">Esportiva</option>
          <option value="trail">Trail</option>
        </select>
      </div>

      <div class="grade-produtos" id="productGrid"></div>
    </section>

    <section class="banner" id="sobre">
      <h2>Mais que uma moto.<br>Um novo jeito de viver.</h2>
      <span>🏁</span>
    </section>
  </main>

  <footer id="contato">
    <h2>MOTO AZUL</h2>
    <p>Pronto para acelerar?</p>
    <a href="mailto:contato@motoazul.com.br">Entre em contato</a>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
