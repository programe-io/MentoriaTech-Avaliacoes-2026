
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produtos</title>
<link href="style.css" rel="stylesheet"></head>

<body>

    <h1>Cadastro de Produtos</h1>

    <input type="text" id="descricao" placeholder="Descrição">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor">

    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="listar()">Listar Produtos</button>

    <h2>Atualizar Valor</h2>

    <input type="number" id="codigo" placeholder="Código">
    <input type="number" id="novoValor" placeholder="Novo valor">

    <button onclick="atualizarValorProduto()">Atualizar Valor</button>

    <h2>Atualizar Quantidade</h2>

    <input type="number" id="codigoQuantidade" placeholder="Código">
    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

    <button onclick="atualizarQuantidadeProduto()">Atualizar Quantidade</button>

    <script src="script.js"></script>

    <script>
        function cadastrar() {
            let descricao = document.getElementById("descricao").value;
            let quantidade = Number(document.getElementById("quantidade").value);
            let valor = Number(document.getElementById("valor").value);

            cadastrarProduto(descricao, quantidade, valor);
        }

        function listar() {
            listarProdutos();
        }

        function atualizarValorProduto() {
            let codigo = Number(document.getElementById("codigo").value);
            let novoValor = Number(document.getElementById("novoValor").value);

            atualizarValor(codigo, novoValor);
        }

        function atualizarQuantidadeProduto() {
            let codigo = Number(document.getElementById("codigoQuantidade").value);
            let novaQuantidade = Number(document.getElementById("novaQuantidade").value);

            atualizarQuantidade(codigo, novaQuantidade);
        }
    </script>

<script src="script.js"></script></body>
</html>
