<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>MiniFeed</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>

          <div class="feed-container">
              
                  <!-- Topo do Feed / Caixa de Publicação -->
                      <header class="feed-header">
                            <div class="header-top">
                                    <h2>MiniFeed</h2>
                                            <div class="header-links">
                                                      <a href="#">Início</a>
                                                                <a href="#">Perfil</a>
                                                                        </div>
                                                                              </div>
                                                                                    
                                                                                          <div class="publish-box">
                                                                                                  <div class="avatar user-j">J</div>
                                                                                                          <div class="input-area">
                                                                                                                    <input type="text" placeholder="O que você está pensando?">
                                                                                                                              <button class="btn-publish">Publicar</button>
                                                                                                                                      </div>
                                                                                                                                            </div>
                                                                                                                                                </header>

                                                                                                                                                    <!-- Postagem Principal -->
                                                                                                                                                        <main class="feed-main">
                                                                                                                                                              <article class="post">
                                                                                                                                                                      
                                                                                                                                                                              <!-- Cabeçalho do Post -->
                                                                                                                                                                                      <div class="post-header">
                                                                                                                                                                                                <div class="avatar user-f">F</div>
                                                                                                                                                                                                          <div class="post-info">
                                                                                                                                                                                                                      <span class="username">Fernanda Nayane</span>
                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                <!-- Texto do Post -->
                                                                                                                                                                                                                                                        <p class="post-text">Confira minha nova foto</p>

                                                                                                                                                                                                                                                                <!-- Imagem do Post integrada com seu link do ImgBB -->
                                                                                                                                                                                                                                                                        <div class="post-image-container">
                                                                                                                                                                                                                                                                                  <a href="https://ibb.co/TBTrf3hN" target="_blank">
                                                                                                                                                                                                                                                                                              <img src="https://i.ibb.co/LzPvF7ps/IMG-20261012-152338055-PORTRAIT.jpg" alt="Fernanda Nayane" class="post-img">
                                                                                                                                                                                                                                                                                                        </a>
                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                        <!-- Botões de Ação estilo Instagram -->
                                                                                                                                                                                                                                                                                                                                <div class="post-actions">
                                                                                                                                                                                                                                                                                                                                          <button class="action-btn" id="like-button" title="Curtir">❤️</button>
                                                                                                                                                                                                                                                                                                                                                    <button class="action-btn" title="Comentar">🗨️</button>
                                                                                                                                                                                                                                                                                                                                                              <button class="action-btn" title="Compartilhar">✈️</button>
                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                              <!-- Contador de Curtidas -->
                                                                                                                                                                                                                                                                                                                                                                                      <div class="likes-counter">
                                                                                                                                                                                                                                                                                                                                                                                                <span id="likes-count">0</span> curtidas
                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                              </article>
                                                                                                                                                                                                                                                                                                                                                                                                                  </main>

                                                                                                                                                                                                                                                                                                                                                                                                                      <!-- Rodapé -->
                                                                                                                                                                                                                                                                                                                                                                                                                          <footer class="feed-footer">
                                                                                                                                                                                                                                                                                                                                                                                                                                <p>MiniFeed - Todos os Direitos Reservados - 2026</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                    </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- JavaScript integrado para controle das curtidas no celular -->
                                                                                                                                                                                                                                                                                                                                                                                                                                          <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                              const botaoCurtir = document.getElementById('like-button');
                                                                                                                                                                                                                                                                                                                                                                                                                                                  const textoContador = document.getElementById('likes-count');
                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                          let curtidas = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              let curtido = false;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                  botaoCurtir.addEventListener('click', () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!curtido) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                curtidas++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        curtido = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                botaoCurtir.style.transform = 'scale(1.3)';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              curtidas--;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      curtido = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              botaoCurtir.style.transform = 'scale(0.9)';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          textoContador.textContent = curtidas;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      setTimeout(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              botaoCurtir.style.transform = 'scale(1)';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }, 150);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </html>
