<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Raimunda</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #87CEEB, #E0F7FA);
            text-align:center;
            padding:30px;
        }

        h1{
            color:#333;
            margin-bottom:25px;
        }

        .galeria{
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:25px;
        }

        .card{
            width:280px;
            background:#fff;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 5px 12px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:scale(1.05);
        }

        .card img{
            width:100%;
            height:200px;
            object-fit:cover;
        }

        .card h2{
            padding:15px;
            color:#444;
        }

        footer{
            margin-top:30px;
            font-size:18px;
            color:#555;
            font-weight:bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>🐾 Galeria de Raimunda 🐾</h1>

    <div class="galeria">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=600" alt="Cavalo">
            <h2>🐴 Cavalo</h2>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1620336655055-b57986f4b2a5?w=600" alt="Abelha">
            <h2>🐝 Abelha</h2>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1589656966895-2f33e7653819?w=600" alt="Urso">
            <h2>🐻 Urso</h2>
        </div>

    </div>

    <footer>
        Desenvolvido por <strong>Raimunda</strong> ❤️
    </footer>

<script src="script.js"></script></body>
</html>
