
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="header">
    <div class="header-content">
      <h1>Mini Feed</h1>
      <nav>
        <a href="#inicio">Início</a>
        <a href="#perfil">Perfil</a>
      </nav>
    </div>
  </header>

  <main class="main" id="inicio">
    <section class="card new-post">
      <div class="user">
        <div class="avatar">V</div>
        <div>
          <strong>Visitante</strong>
          <span>O que você está pensando?</span>
        </div>
      </div>

      <form id="post-form">
        <textarea id="post-input" placeholder="Escreva sua publicação..." required></textarea>
        <button type="submit">Publicar</button>
      </form>
    </section>

    <section id="feed">
      <article class="card post">
        <div class="post-header">
          <div class="avatar">A</div>
          <div>
            <strong>Ana Oliveira</strong>
            <span>Há 10 minutos</span>
          </div>
        </div>

        <p class="post-text">
          Hoje é um ótimo dia para aprender algo novo! 💻✨
        </p>

        <img
          class="post-image"
          src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=900&q=80"
          alt="Pessoa estudando e utilizando um computador"
        >

        <div class="post-actions">
          <button class="like-button" type="button">♡ Curtir <span>0</span></button>
          <button class="comment-button" type="button">Comentar</button>
        </div>

        <div class="comments"></div>
      </article>

      <article class="card post">
        <div class="post-header">
          <div class="avatar avatar-purple">M</div>
          <div>
            <strong>Maria Santos</strong>
            <span>Há 30 minutos</span>
          </div>
        </div>

        <p class="post-text">
          Um pouco de natureza para deixar o dia mais bonito! 🌿
        </p>

        <img
          class="post-image"
          src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80"
          alt="Paisagem natural ao nascer do sol"
        >

        <div class="post-actions">
          <button class="like-button" type="button">♡ Curtir <span>0</span></button>
          <button class="comment-button" type="button">Comentar</button>
        </div>

        <div class="comments"></div>
      </article>
    </section>
  </main>

  <footer id="perfil">
    <p>© 2026 Mini Feed — Todos os direitos reservados.</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
