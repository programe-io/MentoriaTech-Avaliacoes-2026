<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Mini Feed</h1>
    </header>

    <main>

        <!-- Criar publicação -->
        <section class="criar-post">

            <div class="usuario">
                <img src="https://instagram.fpnz9-1.fna.fbcdn.net/v/t51.2885-19/462363736_1080118450371097_196227837614665409_n.jpg?stp=cp0_dst-jpg_s110x80_tt6&_nc_cat=107&_nc_map=urlgen_bucketless&ccb=7-5&_nc_sid=bf7eb4&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDgwLkMzIn0%3D&_nc_ohc=jUxO2mlDcNAQ7kNvwFNIh1f&_nc_oc=AdrKeeH5LXfroKfbHgRzqooiJDMLbAjxm1Ouv2vch7-9lpn4awC9nLqrMVr3pebPDEE&_nc_zt=24&_nc_ht=instagram.fpnz9-1.fna&_nc_ss=7baaf&oh=00_AQKvAuya7G88QMHaZAWJMhMwoy7eKZH6HdETfmAhClbE5Q&oe=6AB75235">

                <div>
                    <strong>Elsomar</strong>
                    <p>O que você está pensando?</p>
                </div>
            </div>

            <textarea id="textoPost" placeholder="Escreva alguma coisa..."></textarea>

            <button onclick="publicar()">Publicar</button>

            <script src="script.js"></script>

        </section>


        <!-- Feed -->
        <section id="feed">

            <article class="post">

                <div class="cabecalho-post">

                    <img src="https://instagram.fpnz9-1.fna.fbcdn.net/v/t51.82787-19/767585907_17965867752135349_1341761898887970421_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=110&_nc_map=urlgen_bucketless&ccb=7-5&_nc_sid=f7ccc5&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDgwLkMzIn0%3D&_nc_ohc=tpqt64jVHyMQ7kNvwFMVu5p&_nc_oc=Adpo4jHdpLyfEM_bh00bIuyPOpvy9PWVU5ZLIvdEXCHL59S6av87z2OBID44fY3DAR4&_nc_zt=24&_nc_ht=instagram.fpnz9-1.fna&_nc_gid=fDO0SsLQR7blRnlLgIk7sQ&_nc_ss=7aaaf&oh=00_AQKQzYgd_FnGnvYyGAzNYN2EYesHb7qDSVW5WLYIEISbvA&oe=6AB72711">

                    <div>
                        <strong>Oduduu1</strong>
                        <small>ha 1 min</small>
                    </div>

                </div>

                <p>Olá! Bem-vindos ao meu Mini Feed! 😊</p>

                <div class="acoes">

                    <button onclick="curtir(this)">
                        ❤️ Curtir <span>0</span>
                    </button>

                    <button>
                        💬 Comentar
                    </button>

                    <button onclick="excluir(this)">
                        🗑️ Excluir
                    </button>

                </div>

            </article>

        </section>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
