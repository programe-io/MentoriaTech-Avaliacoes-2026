<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Prático - Manipulação de Estilos</title>
    <style>
        /* --- 8. Utilizando classes definidas em um arquivo CSS externo (simulado aqui) --- */
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #eee;
        }
        /* Classes que serão manipuladas via JavaScript (classList) */
        .destaque {
            font-weight: bold;
            text-transform: uppercase;
        }
        .sucesso {
            background-color: #d4edda;
            color: #155724;
        }
        .pendente {
            background-color: #fff3cd;
            color: #856404;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <!-- 1. Introdução -->
        <h1>Manipulação de CSS com JavaScript</h1>
        
        <!-- 2. Estilização direta com a propriedade style -->
        <p id="texto-introducao">Este texto terá sua cor alterada diretamente via propriedade style.</p>
        <button onclick="alterarEstiloDireto()">1. Mudar Cor (Style Direto)</button>

        <hr>

        <!-- 6. Manipulando classes com classList -->
        <p id="texto-classe">Este parágrafo alterna a classe "destaque" (negrito e maiúsculo).</p>
        <!-- 7. Métodos add, remove e toggle -->
        <button onclick="alternarClasse()">2. Alternar Classe (Toggle)</button>

        <hr>

        <!-- 9. Exemplo prático com uma tabela de situações -->
        <h3>9. Tabela de Situações</h3>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Situação</th>
                </tr>
            </thead>
            <tbody>
                <!-- 10. Selecionando vários elementos com getElementsByClassName -->
                <tr>
                    <td>Ana Souza</td>
                    <td class="coluna-situacao">Aprovado</td>
                </tr>
                <tr>
                    <td>Carlos Lima</td>
                    <td class="coluna-situacao">Pendente</td>
                </tr>
                <tr>
                    <td>Bruno Alves</td>
                    <td class="coluna-situacao">Aprovado</td>
                </tr>
            </tbody>
        </table>
        
        <!-- 11. Percorrendo elementos e aplicando estilos condicionais -->
        <button onclick="formatarTabela()" style="margin-top: 15px;">3. Formatar Tabela (Condicional)</button>
    </div>

    <!-- SCRIPT JAVASCRIPT -->
    <script>
        // 2 e 4. Aplicando propriedades CSS via JavaScript (Estilização direta)
        // 3 e 5. Nota: Isso gera CSS inline e tem limitações de reuso, por isso o classList é preferível.
        function alterarEstiloDireto() {
            const texto = document.getElementById('texto-introducao');
            texto.style.color = '#007bff';
            texto.style.fontSize = '18px';
        }

        // 6 e 7. Métodos add, remove e toggle com classList
        function alternarClasse() {
            const elemento = document.getElementById('texto-classe');
            elemento.classList.toggle('destaque');
        }

        // 10 e 11. Selecionando vários elementos com getElementsByClassName e aplicando estilos condicionais
        function formatarTabela() {
            // Seleciona todos os elementos que possuem a classe informada
            const situacoes = document.getElementsByClassName('coluna-situacao');
            
            // Percorrendo os elementos encontrados (Loop)
            for (let i = 0; i < situacoes.length; i++) {
                let textoSituacao = situacoes[i].innerText;
                
                // Aplicação de estilo condicional baseado no texto
                if (textoSituaçao === 'Aprovado') {
                    situacoes[i].classList.add('sucesso');
                } else if (textoSituacao === 'Pendente') {
                    situacoes[i].classList.add('pendente');
                }
            }
        }
    </script>
<script src="script.js"></script></body>
</html>
