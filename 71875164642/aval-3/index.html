<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 3 - Lista de Prioridades</title>
    <style>
        /* --- ESTILOS GERAIS (Item 8) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        /* Estrutura da Lista */
        ul {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }

        li {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Estilo base das etiquetas (Badges) */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: white;
            background-color: #95a5a6; /* Cor padrão cinza */
        }

        /* --- CLASSES QUE O JAVASCRIPT VAI INJETAR (Item 6 e 7) --- */
        .urgente {
            background-color: #e74c3c; /* Vermelho */
        }

        .moderado {
            background-color: #f39c12; /* Laranja */
        }

        .normal {
            background-color: #2ecc71; /* Verde */
        }

        .concluido {
            text-decoration: line-through;
            color: #bbb;
        }

        /* Botão */
        .btn-analise {
            width: 100%;
            background-color: #8e44ad;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-analise:hover {
            background-color: #71338c;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h2>Minhas Tarefas</h2>
        <p>Clique no botão abaixo para o JavaScript analisar as prioridades da lista.</p>

        <!-- Lista de Itens (Item 9) -->
        <ul id="lista-tarefas">
            <li>
                <span>Enviar relatório mensal</span>
                <span class="badge-prioridade">Urgente</span>
            </li>
            <li>
                <span>Responder e-mails de clientes</span>
                <span class="badge-prioridade">Normal</span>
            </li>
            <li>
                <span>Reunião de alinhamento de equipe</span>
                <span class="badge-prioridade">Moderado</span>
            </li>
            <li>
                <span>Atualizar planilhas de gastos</span>
                <span class="badge-prioridade">Urgente</span>
            </li>
            <li>
                <span>Organizar mesa de trabalho</span>
                <span class="badge-prioridade">Normal</span>
            </li>
        </ul>

        <button class="btn-analise" onclick="colorirPrioridades()">Analisar e Colorir Lista</button>
    </div>

    <script>
        function colorirPrioridades() {
            // ==========================================================================
            // 1. SELECIONANDO VÁRIOS ELEMENTOS COM getElementsByClassName (Item 10)
            // ==========================================================================
            // Isso nos retorna uma coleção (HTMLCollection) com todas as etiquetas
            const badges = document.getElementsByClassName('badge-prioridade');

            // ==========================================================================
            // 2. PERCORRENDO ELEMENTOS E APLICANDO ESTILOS CONDICIONAIS (Item 11)
            // ==========================================================================
            // Usamos o laço "for" para caminhar por cada um dos elementos encontrados
            for (let i = 0; i < badges.length; i++) {
                
                let elementoAtual = badges[i];
                
                // Pegamos o texto de dentro da tag (tirando espaços extras)
                let textoPrioridade = elementoAtual.textContent.trim().toLowerCase();

                // Primeiro, adicionamos a classe base visual '.badge' usando classList (Item 6)
                elementoAtual.classList.add('badge');

                // Aplicamos a condição: dependendo do texto, injetamos uma classe diferente (Item 7)
                if (textoPrioridade === 'urgente') {
                    elementoAtual.classList.add('urgente');
                } else if (textoPrioridade === 'moderado') {
                    elementoAtual.classList.add('moderado');
                } else if (textoPrioridade === 'normal') {
                    elementoAtual.classList.add('normal');
                }
            }

            // ==========================================================================
            // EXTRA: Demonstrando uma limitação/uso do .style (Item 2 e 5)
            // Alterando o botão após o clique para indicar que foi concluído
            const botao = document.querySelector('.btn-analise');
            botao.textContent = "Lista Analisada!";
            botao.disabled = true;
            botao.style.backgroundColor = "#2c3e50"; // Estilização direta via JS
            botao.style.cursor = "not-allowed";
        }
    </script>
<script src="script.js"></script></body>
</html>
