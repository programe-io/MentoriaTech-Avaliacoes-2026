<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Prático - Manipulação de Estilos</title>
    <style>
        /* CSS Externo/Interno (Item 8) */
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #333;
            color: white;
        }
        /* Classes que serão aplicadas via JavaScript (Item 6 e 7) */
        .situacao-aprovado {
            background-color: #d4edda;
            color: #155724;
            font-weight: bold;
        }
        .situacao-pendente {
            background-color: #fff3cd;
            color: #856404;
        }
        .situacao-reprovado {
            background-color: #f8d7da;
            color: #721c24;
        }
        .destaque {
            border: 3px solid #0056b3 !important;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Painel de Alunos</h1>
    <p>Os estilos abaixo foram aplicados dinamicamente usando JavaScript.</p>

    <!-- Tabela de Situações (Item 9) -->
    <table>
        <thead>
            <tr>
                <th>Aluno</th>
                <th>Nota</th>
                <th>Situação</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana Silva</td>
                <td>8.5</td>
                <!-- Adicionamos uma classe comum para selecionar depois -->
                <td class="status">Aprovado</td>
            </tr>
            <tr>
                <td>Bruno Costa</td>
                <td>5.0</td>
                <td class="status">Pendente</td>
            </tr>
            <tr>
                <td>Carlos Souza</td>
                <td>4.5</td>
                <td class="status">Reprovado</td>
            </tr>
        </tbody>
    </table>

    <br>
    <!-- Botão para demonstrar o método toggle (Item 7) -->
    <button onclick="alternarDestaque()">Alternar Destaque da Tabela</button>

    <script>
        // 1. Selecionando vários elementos com getElementsByClassName (Item 10)
        const listaStatus = document.getElementsByClassName('status');

        // 2. Percorrendo elementos e aplicando estilos condicionais (Item 11)
        for (let i = 0; i < listaStatus.length; i++) {
            let elemento = listaStatus[i];
            let textoStatus = elemento.textContent.trim();

            // Manipulando classes com classList.add (Item 6 e 7)
            if (textoStatus === 'Aprovado') {
                elemento.classList.add('situacao-aprovado');
            } else if (textoStatus === 'Pendente') {
                elemento.classList.add('situacao-pendente');
            } else if (textoStatus === 'Reprovado') {
                elemento.classList.add('situacao-reprovado');
            }
        }

        // 3. Exemplo de Estilização Direta com a propriedade .style (Item 2 e 4)
        // Modificando o título diretamente via JavaScript
        const titulo = document.querySelector('h1');
        titulo.style.color = '#0056b3';
        titulo.style.textDecoration = 'underline';

        // 4. Função para demonstrar o método .toggle (Item 7)
        function alternarDestaque() {
            const tabela = document.querySelector('table');
            tabela.classList.toggle('destaque');
        }
    </script>
<script src="script.js"></script></body>
</html>
