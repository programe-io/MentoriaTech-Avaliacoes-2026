
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <h1>Cadastro de Produtos</h1>
            <p>Gerencie seus produtos e controle seu estoque.</p>
        </header>

        <!-- Cadastro de produtos -->

        <section class="formulario">

            <h2>Adicionar Produto</h2>

            <form id="form-produto">

                <div class="campo">
                    <label for="descricao">Descrição:</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Digite o nome do produto"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade:</label>
                    <input
                        type="number"
                        id="quantidade"
                        placeholder="Digite a quantidade"
                        min="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$):</label>
                    <input
                        type="number"
                        id="valor"
                        placeholder="Digite o valor"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <p id="erro" class="erro" hidden></p>

                <button type="submit" class="btn-adicionar">
                    Cadastrar Produto
                </button>

            </form>

        </section>

        <!-- Atualização de produtos -->

        <section class="atualizacao">

            <h2>Atualizar Produto</h2>

            <div class="campo">
                <label for="codigo-atualizar">Código do produto:</label>
                <input
                    type="number"
                    id="codigo-atualizar"
                    placeholder="Digite o código"
                    min="1"
                >
            </div>

            <div class="campo">
                <label for="novo-valor">Novo valor (R$):</label>
                <input
                    type="number"
                    id="novo-valor"
                    placeholder="Digite o novo valor"
                    min="0"
                    step="0.01"
                >
            </div>

            <button type="button" id="btn-valor">
                Atualizar Valor
            </button>

            <div class="campo">
                <label for="nova-quantidade">Adicionar quantidade:</label>
                <input
                    type="number"
                    id="nova-quantidade"
                    placeholder="Digite a quantidade"
                    min="1"
                >
            </div>

            <button type="button" id="btn-quantidade">
                Atualizar Estoque
            </button>

        </section>

        <!-- Lista de produtos -->

        <section class="tabela">

            <h2>Produtos Cadastrados</h2>

            <div class="tabela-responsiva">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-produtos">

                        <tr>
                            <td colspan="4" class="vazio">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

        <footer>
            <p>Sistema de Gerenciamento de Produtos</p>
        </footer>

    </div>

<script src="script.js"></script></body>
</html>
