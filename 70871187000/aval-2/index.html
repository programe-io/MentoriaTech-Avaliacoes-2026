
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>📋 Gerenciador de Tarefas</h1>
    <p>Organize suas atividades</p>
</header>

<main>
    <section class="dashboard">
        <div class="card">
            <h3>Total de tarefas</h3>
            <span id="total">0</span>
        </div>

        <div class="card">
            <h3>Pendentes</h3>
            <span id="pendentes">0</span>
        </div>

        <div class="card">
            <h3>Concluídas</h3>
            <span id="concluidas">0</span>
        </div>

        <div class="card">
            <h3>Atrasadas</h3>
            <span id="atrasadas">0</span>
        </div>
    </section>

    <section class="formulario">
        <h2>Nova tarefa</h2>

        <form id="formTarefa">
            <input type="text" id="titulo"
                placeholder="Título da tarefa" required>

            <textarea id="descricao"
                placeholder="Descrição da tarefa"></textarea>

            <label>Prioridade</label>
            <select id="prioridade">
                <option value="Baixa">Baixa</option>
                <option value="Média" selected>Média</option>
                <option value="Alta">Alta</option>
            </select>

            <label>Data de entrega</label>
            <input type="date" id="data">

            <button type="submit">Adicionar tarefa</button>
        </form>
    </section>

    <section class="lista">
        <h2>Lista de tarefas</h2>

        <input type="text" id="pesquisa"
            placeholder="Pesquisar tarefa...">

        <select id="filtro">
            <option value="Todas">Todas</option>
            <option value="Pendente">Pendentes</option>
            <option value="Concluída">Concluídas</option>
            <option value="Atrasada">Atrasadas</option>
        </select>

        <div id="tarefas"></div>
    </section>

    <section class="progresso">
        <h2>Progresso geral</h2>
        <div class="barra">
            <div id="barraProgresso"></div>
        </div>
        <p id="percentual">0% concluído</p>
    </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
