
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>📦 Sistema de Estoque</h1>
</header>

<main>
    <section class="dashboard">
        <div class="card">
            <h3>Total de Produtos</h3>
            <p id="totalProdutos">0</p>
        </div>
        <div class="card">
            <h3>Unidades em Estoque</h3>
            <p id="totalUnidades">0</p>
        </div>
        <div class="card">
            <h3>Valor do Estoque</h3>
            <p id="valorEstoque">R$ 0,00</p>
        </div>
    </section>

    <section class="formulario">
        <h2>Cadastrar Produto</h2>

        <form id="formProduto">
            <input type="text" id="nome"
                placeholder="Nome do produto" required>

            <input type="text" id="codigo"
                placeholder="Código do produto" required>

            <input type="number" id="preco"
                placeholder="Preço" min="0" step="0.01" required>

            <input type="number" id="quantidade"
                placeholder="Quantidade" min="0" step="1" required>

            <button type="submit">Cadastrar Produto</button>
        </form>
    </section>

    <section class="estoque">
        <h2>Produtos Cadastrados</h2>

        <input type="text" id="pesquisa"
            placeholder="Pesquisar produto...">

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Código</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Total</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaProdutos"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
