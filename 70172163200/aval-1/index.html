<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>Sistema de Estoque</h1>

    <input id="codigo" placeholder="Código">
    <input id="descricao" placeholder="Descrição">
    <input id="quantidade" type="number" placeholder="Quantidade">
    <input id="valor" type="number" placeholder="Valor">

    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="listar()">Listar Produtos</button>

    <input id="codigoAlterar" placeholder="Código do produto">
    <input id="novoValor" type="number" placeholder="Novo valor">
    <button onclick="alterarValor()">Alterar Valor</button>

    <input id="novaQuantidade" type="number" placeholder="Nova quantidade">
    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    <div id="lista"></div>
</div>

<script src="script.js"></script>
</body>
</html>
