<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <h1>Gerenciador de Tarefas</h1>
      <p>Cadastre, acompanhe e gerencie suas tarefas.</p>
    </header>

    <main>
      <!-- Formulário de Cadastro -->
      <section class="card">
        <h2>Nova tarefa</h2>
        <form id="form-tarefa">
          <div class="form-group">
            <label for="codigo">Código</label>
            <input type="text" id="codigo" placeholder="Ex: T001" required>
          </div>

          <div class="form-group">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" placeholder="Digite o título da tarefa" required>
          </div>

          <div class="form-group">
            <label for="prioridade">Prioridade</label>
            <select id="prioridade" required>
              <option value="" disabled selected>Selecione</option>
              <option value="1">1 - Alta</option>
              <option value="2">2 - Média</option>
              <option value="3">3 - Baixa</option>
            </select>
          </div>

          <button type="submit" class="btn-primary">Cadastrar tarefa</button>
        </form>
      </section>

      <!-- Lista de Tarefas Cadastradas -->
      <section class="card">
        <h2>Tarefas cadastradas</h2>
        <div id="lista-tarefas-container">
          <p class="contador-tarefas"><span id="total-tarefas">0</span> tarefas</p>
          <div id="mensagem-vazia" class="empty-state">Nenhuma tarefa cadastrada.</div>
          <ul id="lista-tarefas" class="lista-tarefas"></ul>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
