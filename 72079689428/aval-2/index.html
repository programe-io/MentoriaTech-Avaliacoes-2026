
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topo">
        <div class="logo">Task<span>Flow</span></div>
        <p>Organize seu dia. Conquiste seus objetivos.</p>
    </header>

    <main class="container">

        <section class="boas-vindas">
            <div>
                <h1>Gerenciador de Tarefas</h1>
                <p>Controle suas atividades em um só lugar.</p>
            </div>
            <span class="icone">✓</span>
        </section>

        <section class="estatisticas">
            <div class="card-stat">
                <span>Total de tarefas</span>
                <strong id="total">0</strong>
            </div>

            <div class="card-stat">
                <span>Pendentes</span>
                <strong id="pendentes">0</strong>
            </div>

            <div class="card-stat">
                <span>Concluídas</span>
                <strong id="concluidas">0</strong>
            </div>
        </section>

        <section class="painel">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex: Estudar JavaScript"
                        required
                        minlength="5"
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade">
                        <option value="1">1 - Alta</option>
                        <option value="2" selected>2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit" class="btn-adicionar">
                    + Cadastrar tarefa
                </button>

            </form>
        </section>

        <section class="lista">
            <div class="lista-topo">
                <h2>Minhas tarefas</h2>

                <select id="filtro">
                    <option value="todas">Todas</option>
                    <option value="pendentes">Pendentes</option>
                    <option value="concluidas">Concluídas</option>
                </select>
            </div>

            <div id="listaTarefas">
                <p class="vazio">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>TaskFlow © 2026 - Gerenciador de Tarefas</p>
    </footer>

<script src="script.js"></script></body>
</html>
