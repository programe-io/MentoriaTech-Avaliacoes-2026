
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Escolar</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>📚 Biblioteca Escolar</h1>
    <p>Sistema de Cadastro e Gerenciamento</p>
</header>

<main class="container">

    <h2>Painel da Biblioteca</h2>

    <section class="estatisticas">
        <div class="card">
            <h3>Total de Livros</h3>
            <p id="totalLivros">0</p>
        </div>

        <div class="card">
            <h3>Disponíveis</h3>
            <p id="disponiveis">0</p>
        </div>

        <div class="card">
            <h3>Emprestados</h3>
            <p id="emprestados">0</p>
        </div>
    </section>

    <section class="painel">
        <h2 id="tituloFormulario">Cadastrar Livro</h2>

        <form id="formLivro">

            <label for="codigo">Código</label>
            <input type="text" id="codigo" placeholder="Ex: LIV001" required>

            <label for="titulo">Título do livro</label>
            <input type="text" id="titulo" placeholder="Nome do livro" required>

            <label for="autor">Autor</label>
            <input type="text" id="autor" placeholder="Nome do autor" required>

            <label for="categoria">Categoria</label>
            <select id="categoria" required>
                <option value="">Selecione</option>
                <option>Literatura</option>
                <option>Romance</option>
                <option>Ficção</option>
                <option>História</option>
                <option>Ciências</option>
                <option>Matemática</option>
                <option>Tecnologia</option>
                <option>Outros</option>
            </select>

            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="0" step="1" required>

            <label for="ano">Ano de publicação</label>
            <input type="number" id="ano" min="1" step="1" required>

            <button type="submit" id="btnSalvar">Cadastrar Livro</button>

            <button type="button" id="btnCancelar" hidden>
                Cancelar edição
            </button>

        </form>
    </section>

    <section class="painel">
        <h2>Livros cadastrados</h2>

        <input type="search" id="pesquisa"
            placeholder="Pesquisar livro ou autor...">

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Categoria</th>
                        <th>Quantidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaLivros"></tbody>
            </table>
        </div>

        <p id="mensagemVazia">Nenhum livro cadastrado.</p>
    </section>

</main>

<footer>
    Biblioteca Escolar © 2026
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
