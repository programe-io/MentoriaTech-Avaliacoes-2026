<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Gerenciamento de Estoque</h1>

        <!-- Seção de Cadastro -->
        <section class="card">
            <h2>Cadastrar Produto</h2>
            <form id="formCadastro">
                <div class="form-group">
                    <label for="descricao">Descrição (min. 5 caracteres):</label>
                    <input type="text" id="descricao" required>
                </div>
                <div class="form-group">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" min="1" required>
                </div>
                <div class="form-group">
                    <label for="valor">Valor (R$):</label>
                    <input type="number" id="valor" step="0.01" min="0" required>
                </div>
                <button type="submit">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Seção de Atualização -->
        <section class="card">
            <h2>Atualizar Estoque ou Valor</h2>
            <form id="formAtualizar">
                <div class="form-group">
                    <label for="codigoAtualizar">Código do Produto:</label>
                    <input type="number" id="codigoAtualizar" required>
                </div>
                <div class="form-group">
                    <label for="tipoAtualizacao">O que deseja atualizar?</label>
                    <select id="tipoAtualizacao">
                        <option value="valor">Alterar Valor do Produto</option>
                        <option value="quantidade">Adicionar Quantidade ao Estoque</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="novoDado">Novo Valor / Qtd a Adicionar:</label>
                    <input type="number" id="novoDado" step="0.01" required>
                </div>
                <button type="submit" class="btn-update">Atualizar Produto</button>
            </form>
        </section>

        <!-- Seção de Listagem -->
        <section class="card">
            <h2>Lista de Produtos</h2>
            <table id="tabelaProdutos">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor (R$)</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Os produtos aparecerão aqui -->
                </tbody>
            </table>
        </section>
    </div>

    <!-- Referência ao seu arquivo de script -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>v
