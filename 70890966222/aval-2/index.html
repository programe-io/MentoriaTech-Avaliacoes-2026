<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Planner Mágico 💜</title>

    <link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>


<body>

    <div class="container">


        <!-- ==========================
             CABEÇALHO
        =========================== -->

        <header>

            <div class="icone">
                ✨
            </div>

            <div>

                <h1>
                    Planner Mágico
                </h1>

                <p>
                    Organize suas tarefas com carinho 💜
                </p>

                <span class="assinatura">
                    Feito por Nana ♡
                </span>

            </div>

        </header>



        <main>


            <!-- ==========================
                 CADASTRO
            =========================== -->

            <section class="card">

                <h2>
                    🌷 Nova Tarefa
                </h2>


                <div class="formulario">


                    <!-- CÓDIGO -->

                    <div class="campo">

                        <label for="codigo">
                            Código
                        </label>

                        <input
                            type="text"
                            id="codigo"
                            placeholder="Ex: T001"
                        >

                    </div>



                    <!-- TÍTULO -->

                    <div class="campo">

                        <label for="titulo">
                            Título da tarefa
                        </label>

                        <input
                            type="text"
                            id="titulo"
                            placeholder="Ex: Fazer trabalho"
                        >

                        <small>
                            Mínimo de 5 caracteres
                        </small>

                    </div>



                    <!-- PRIORIDADE -->

                    <div class="campo">

                        <label for="prioridade">
                            Prioridade
                        </label>

                        <select id="prioridade">

                            <option value="">
                                Selecione
                            </option>

                            <option value="1">
                                1 - Alta 🔥
                            </option>

                            <option value="2">
                                2 - Média ⭐
                            </option>

                            <option value="3">
                                3 - Baixa 🌱
                            </option>

                        </select>

                    </div>

                </div>



                <button
                    class="btn cadastrar"
                    onclick="cadastrarTarefa()"
                >
                    💜 Cadastrar Tarefa
                </button>

            </section>



            <!-- ==========================
                 ALTERAÇÕES
            =========================== -->

            <section class="card">

                <h2>
                    🔄 Gerenciar Tarefa
                </h2>


                <div class="gerenciar">


                    <!-- CÓDIGO -->

                    <div class="campo">

                        <label for="codigoAlterar">
                            Código da tarefa
                        </label>

                        <input
                            type="text"
                            id="codigoAlterar"
                            placeholder="Digite o código"
                        >

                    </div>



                    <!-- NOVA PRIORIDADE -->

                    <div class="campo">

                        <label for="novaPrioridade">
                            Nova prioridade
                        </label>

                        <select id="novaPrioridade">

                            <option value="">
                                Selecione
                            </option>

                            <option value="1">
                                1 - Alta 🔥
                            </option>

                            <option value="2">
                                2 - Média ⭐
                            </option>

                            <option value="3">
                                3 - Baixa 🌱
                            </option>

                        </select>

                    </div>


                    <button
                        class="btn prioridade"
                        onclick="alterarPrioridade()"
                    >
                        ⭐ Alterar Prioridade
                    </button>



                    <button
                        class="btn concluir"
                        onclick="concluirTarefa()"
                    >
                        ✅ Concluir Tarefa
                    </button>

                </div>

            </section>



            <!-- ==========================
                 LISTA
            =========================== -->

            <section class="card">


                <div class="titulo-lista">

                    <h2>
                        📋 Minhas Tarefas
                    </h2>

                    <span id="contador">
                        0 tarefas
                    </span>

                </div>



                <div
                    id="listaTarefas"
                    class="lista-tarefas"
                >

                    <div class="vazio">

                        <span>
                            🪻
                        </span>

                        <p>
                            Nenhuma tarefa cadastrada.
                        </p>

                        <small>
                            Adicione uma tarefa para começar!
                        </small>

                    </div>

                </div>

            </section>


        </main>



        <!-- ==========================
             RODAPÉ
        =========================== -->

        <footer>

            Organizando a vida, uma tarefa por vez 💜✨

        </footer>


    </div>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>$0
