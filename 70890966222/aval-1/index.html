<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estoque Mágico 💜</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <div class="icone">📦</div>

            <div>
                <h1>Estoque Mágico</h1>
                <p>Controle seus produtos com carinho 💜</p>
            </div>
        </header>

        <main>

            <!-- CADASTRO -->
            <section class="card cadastro">

                <h2>✨ Cadastrar Produto</h2>

                <div class="formulario">

                    <div class="campo">
                        <label for="codigo">Código</label>
                        <input
                            type="text"
                            id="codigo"
                            placeholder="Ex: 001"
                        >
                    </div>

                    <div class="campo">
                        <label for="descricao">Descrição</label>
                        <input
                            type="text"
                            id="descricao"
                            placeholder="Ex: Teclado"
                        >
                    </div>

                    <div class="campo">
                        <label for="quantidade">Quantidade</label>
                        <input
                            type="number"
                            id="quantidade"
                            placeholder="Ex: 10"
                            min="0"
                        >
                    </div>

                    <div class="campo">
                        <label for="valor">Valor</label>
                        <input
                            type="number"
                            id="valor"
                            placeholder="Ex: 49.90"
                            min="0"
                            step="0.01"
                        >
                    </div>

                </div>

                <button class="btn cadastrar" onclick="cadastrarProduto()">
                    💜 Cadastrar Produto
                </button>

            </section>


            <!-- ALTERAÇÕES -->
            <section class="card">

                <h2>🔄 Alterar Produto</h2>

                <div class="alteracoes">

                    <div class="campo">
                        <label for="codigoAlterar">
                            Código do produto
                        </label>

                        <input
                            type="text"
                            id="codigoAlterar"
                            placeholder="Digite o código"
                        >
                    </div>

                    <div class="campo">
                        <label for="novoValor">
                            Novo valor
                        </label>

                        <input
                            type="number"
                            id="novoValor"
                            placeholder="Ex: 59.90"
                            min="0"
                            step="0.01"
                        >
                    </div>

                    <button
                        class="btn valor"
                        onclick="alterarValor()"
                    >
                        💰 Alterar Valor
                    </button>

                    <div class="campo">
                        <label for="novaQuantidade">
                            Nova quantidade
                        </label>

                        <input
                            type="number"
                            id="novaQuantidade"
                            placeholder="Ex: 20"
                            min="0"
                        >
                    </div>

                    <button
                        class="btn quantidade"
                        onclick="alterarQuantidade()"
                    >
                        📦 Alterar Quantidade
                    </button>

                </div>

            </section>


            <!-- LISTA DE PRODUTOS -->
            <section class="card">

                <div class="titulo-lista">
                    <h2>🛍️ Produtos Cadastrados</h2>

                    <span id="contador">
                        0 produtos
                    </span>
                </div>

                <div id="listaProdutos" class="lista-produtos">

                    <div class="vazio">
                        <span>🌸</span>
                        <p>Nenhum produto cadastrado ainda.</p>
                        <small>
                            Cadastre seu primeiro produto!
                        </small>
                    </div>

                </div>

            </section>

        </main>

        <footer>
            Feito com 💜 para organizar seu estoque ✨
        </footer>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
