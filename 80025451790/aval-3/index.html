<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 font-sans text-gray-900">
    <header class="sticky top-0 z-10 border-b border-gray-200 bg-white">
        <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4 sm:px-6">
            <p class="font-serif text-2xl font-semibold tracking-tight text-gray-900">Instagram</p>
            <button class="rounded-full p-2 text-2xl leading-none hover:bg-gray-100">🔍</button>
        </div>
    </header>

    <main class="mx-auto max-w-5xl px-0 py-6 sm:px-6">
        <article class="mx-auto max-w-lg overflow-hidden border-y border-gray-200 bg-white sm:rounded-lg sm:border">
            <div class="flex items-center justify-between px-4 py-3">
                <div class="flex items-center gap-3">
                    <div class="flex h-9 w-9 items-center justify-center rounded-full bg-gray-900 text-sm font-semibold text-white">F</div>
                    <div>
                        <p class="text-sm font-semibold">Arrascaeta</p>
                        <p class="text-xs text-gray-500">Rio de Janeiro</p>
                    </div>
                </div>
                <button class="px-2 text-xl font-bold leading-none">···</button>
            </div>

            <img
                src="https://i.metroimg.com/ZwjRJVZMNj3f5QwHQ5F5t8pRysmldLfQHOOIyOd4XK8/w:1200/q:85/f:webp/plain/https://images.metroimg.com/2025/12/01084636/Arrascaeta-Flamengo-Libertadores-1.jpg"
                alt="Campeâo da Libertadores 2023"
                class="block aspect-[4/5] w-full bg-gray-100 object-cover"
            >

            <div class="px-4 pb-4 pt-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <button type="button"  class="text-2xl leading-none hover:text-gray-500">♡</button>
                        <button type="button"  class="text-2xl leading-none hover:text-gray-500">○</button>
                        <button type="button"  class="text-2xl leading-none hover:text-gray-500">➤</button>
                    </div>
                </div>
                <p class="mt-3 text-sm font-semibold">Curtido por <span class="font-bold">flamengo, anaxy._</span> e outras pessoas</p>
                <p class="mt-2 text-sm"><span class="font-semibold">Arrascaeta</span> comemorando o título </p>
                <p class="mt-2 text-xs uppercase tracking-wide text-gray-400">HÁ 4 dias</p>
            </div>
        </article>
    </main>
</body>
</html>
