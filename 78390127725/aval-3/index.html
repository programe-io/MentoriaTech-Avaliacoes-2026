<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mine Feed | Rede Social</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>Mine<span>Feed</span></h1>

                                    <nav>
                                                <a href="#inicio">Início</a>
                                                            <a href="#publicar">Publicar</a>
                                                                        <a href="#perfil">Perfil</a>
                                                                                </nav>
                                                                                    </header>

                                                                                        <main class="container">

                                                                                                <aside class="perfil" id="perfil">
                                                                                                            <div class="capa"></div>
                                                                                                                        <div class="avatar">👤</div>
                                                                                                                                    <h2>Meu Perfil</h2>
                                                                                                                                                <p>@meuusuario</p>
                                                                                                                                                            <div class="estatisticas">
                                                                                                                                                                            <div><strong id="totalPosts">0</strong><span>Posts</span></div>
                                                                                                                                                                                            <div><strong>120</strong><span>Seguidores</span></div>
                                                                                                                                                                                                            <div><strong>85</strong><span>Seguindo</span></div>
                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                </aside>

                                                                                                                                                                                                                                        <section class="feed" id="inicio">

                                                                                                                                                                                                                                                    <div class="criar-post" id="publicar">
                                                                                                                                                                                                                                                                    <h2>O que você está pensando?</h2>
                                                                                                                                                                                                                                                                                    <textarea id="textoPost" placeholder="Compartilhe algo com seus amigos..."></textarea>
                                                                                                                                                                                                                                                                                                    <div class="acoes-publicar">
                                                                                                                                                                                                                                                                                                                        <span>💬 Compartilhe suas ideias!</span>
                                                                                                                                                                                                                                                                                                                                            <button onclick="publicarPost()">Publicar</button>
                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                    <div id="listaPosts"></div>

                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                    <aside class="tendencias">
                                                                                                                                                                                                                                                                                                                                                                                                                <h2>🔥 Em destaque</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                            <p>#MineFeed</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>#Amizade</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>#Tecnologia</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>#MeuDia</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </aside>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>© 2026 Mine Feed — Conectando pessoas 💜</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
