<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="new-post">
            <div class="user-info">
                <div class="avatar">U</div>
                <div class="user-text">
                    <strong>Utilizador</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>
            <button>Publicar</button>
        </section>

        <article class="post">
            <div class="post-header">
                <div class="avatar">H</div>
                <div class="user-text">
                    <strong>Herói</strong>
                    <span>há 10 minutos</span>
                </div>
            </div>
            <div class="post-text">
                <p>Belo dia para assistir a um filme do Homem-Aranha!</p>
            </div>
            <div class="post-image">
                <img src="https://via.placeholder.com/600x350" alt="Exemplo de imagem da publicação">
            </div>
            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 Mini Feed. Todos os direitos reservados.</p>
    </footer>
<script src="script.js"></script></body>
</html>
