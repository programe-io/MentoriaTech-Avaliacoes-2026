<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast Purple Edition</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="game-container">
        <header>
            <h1>BLOCK <span class="highlight">BLAST</span></h1>
            <div class="score-container">
                <div class="score-box">
                    <span class="label">PONTOS</span>
                    <span id="score">0</span>
                </div>
                <div class="score-box">
                    <span class="label">RECORDE</span>
                    <span id="best-score">0</span>
                </div>
            </div>
        </header>

        <div id="board" class="board"></div>

        <div id="pieces-container" class="pieces-container">
            </div>

        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Fim de Jogo!</h2>
                <p>Sua pontuação final foi: <span id="final-score" class="highlight">0</span></p>
                <button id="restart-btn">Jogar Novamente</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
<script src="script.js"></script></body>
