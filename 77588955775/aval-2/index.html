<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast Arcade Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@600;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div id="game-container">
        <header>
            <h1>BLOCK <span class="highlight">BLAST</span></h1>
            <div id="scoreboard">
                <div class="score-box">
                    <span class="label">PONTOS</span>
                    <span id="score">0</span>
                </div>
                <div class="score-box">
                    <span class="label">COMBO STREAK</span>
                    <span id="streak">0</span>
                </div>
                <div class="score-box">
                    <span class="label">RECORDE</span>
                    <span id="highscore">0</span>
                </div>
            </div>
        </header>

        <div id="board-wrapper">
            <div id="board"></div>
        </div>

        <div id="pieces-container"></div>
    </div>

    <div id="game-over">
        <div class="game-over-card">
            <h2>Fim de Jogo!</h2>
            <p>Não há movimentos válidos restantes.</p>
            <div class="final-score">Pontos: <span id="final-score-val">0</span></div>
            <button onclick="resetGame()">Jogar Novamente</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
