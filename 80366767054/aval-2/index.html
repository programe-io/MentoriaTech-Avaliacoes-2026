
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>📱 Mini Feed</h1>
    <p>Compartilhe seus melhores momentos!</p>
</header>

<main>

    <section class="criar-post">
        <h2>Criar publicação</h2>

        <input type="text" id="nome"
        placeholder="Seu nome">

        <textarea id="texto"
        placeholder="O que você está pensando?"></textarea>

        <input type="text" id="imagem"
        placeholder="URL da imagem (opcional)">

        <button onclick="criarPost()">Publicar</button>
    </section>

    <section class="feed">
        <h2>Publicações</h2>
        <div id="publicacoes">

            <article class="post">
                <h3>Maria Silva</h3>
                <p>Que dia lindo para aproveitar a natureza! 🌳</p>
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8">
                <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                <button onclick="comentar(this)">💬 Comentar</button>
                <div class="comentarios"></div>
            </article>

            <article class="post">
                <h3>João Santos</h3>
                <p>Adoro conhecer lugares novos! 🌎</p>
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
                <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                <button onclick="comentar(this)">💬 Comentar</button>
                <div class="comentarios"></div>
            </article>

        </div>
    </section>

</main>

<footer>
    <p>Mini Feed © 2026 - Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
