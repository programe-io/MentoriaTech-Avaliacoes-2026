
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mini Feed</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                <header>
                    <h1>MiniFeed</h1>
                        <span>🌎 Minha rede social</span>
                        </header>

                        <main class="container">

                            <section class="criar-post">
                                    <h2>Criar publicação</h2>

                                            <input type="text" id="nome"
                                                        placeholder="Seu nome">

                                                                <textarea id="texto"
                                                                            placeholder="O que você está pensando?"></textarea>

                                                                                    <button id="publicar">Publicar</button>
                                                                                        </section>

                                                                                            <section id="feed">

                                                                                                    <article class="post">
                                                                                                                <div class="usuario">
                                                                                                                                <div class="avatar">A</div>
                                                                                                                                                <div>
                                                                                                                                                                    <h3>André Silva</h3>
                                                                                                                                                                                        <small>Há 5 minutos</small>
                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                <p>Olá pessoal! Bem-vindos ao meu mini feed! 😍</p>

                                                                                                                                                                                                                                            <img class="foto"
                                                                                                                                                                                                                                                            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800"
                                                                                                                                                                                                                                                                            alt="Paisagem">

                                                                                                                                                                                                                                                                                        <div class="acoes">
                                                                                                                                                                                                                                                                                                        <button class="curtir">❤️ Curtir <span>10</span></button>
                                                                                                                                                                                                                                                                                                                        <button class="comentar">💬 Comentar</button>
                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                <div class="comentarios"></div>

                                                                                                                                                                                                                                                                                                                                                        </article>

                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                            <footer>
                                                                                                                                                                                                                                                                                                                                                                <p>MiniFeed © 2026</p>
                                                                                                                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                </html>
