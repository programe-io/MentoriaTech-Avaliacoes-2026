<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Quiz da Turma</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
<div class="quiz-container">
  <header>
    <h1>🧠 Super Quiz!</h1>
    <div class="pontuacao-caixa">Pontos: <span id="pontos">0</span></div>
  </header>

  <section id="tela-menu">
    <h2>Escolha a matéria para treinar:</h2>
    <div id="grid-materias" class="grid-opcoes"></div>
  </section>

  <section id="tela-quiz" class="escondido">
    <div class="topo-quiz">
      <button id="btn-menu" class="btn-menu">⬅ Trocar matéria</button>
      <span id="info-materia"></span>
    </div>
    <div class="barra"><div id="barra-progresso"></div></div>
    <h2 id="pergunta"></h2>
    <div id="caixa-opcoes" class="grid-opcoes"></div>
    <button id="btn-proximo" class="escondido">Próxima Pergunta ➔</button>
  </section>
</div>
<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
