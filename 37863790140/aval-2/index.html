<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GustavoBlock</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>GUSTAVOBLOCK</h1>
        <p>Encaixe os blocos e complete as linhas</p>
    </header>

    <main class="container-jogo">
        <canvas id="tabuleiro" width="300" height="600"></canvas>

        <aside class="painel">
            <div class="caixa">
                <h2>Próxima</h2>
                <canvas id="proxima" width="120" height="120"></canvas>
            </div>

            <div class="caixa placar">
                <p>Pontos <strong id="pontos">0</strong></p>
                <p>Linhas <strong id="linhas">0</strong></p>
                <p>Nível <strong id="nivel">1</strong></p>
                <p>Recorde <strong id="recorde">0</strong></p>
            </div>

            <p id="status-jogo">Boa sorte!</p>

            <div class="ajuda">
                <p>← → mover</p>
                <p>↑ girar</p>
                <p>↓ descer</p>
                <p>Espaço: queda</p>
                <p>P: pausar</p>
            </div>

            <button id="btn-reiniciar">Reiniciar</button>
        </aside>
    </main>

    <div class="controles">
        <button data-acao="esquerda">←</button>
        <button data-acao="girar">⟳</button>
        <button data-acao="direita">→</button>
        <button data-acao="baixo">↓</button>
        <button data-acao="queda">⤓</button>
    </div>

    <footer>Avaliação 2 - GustavoBlock</footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
