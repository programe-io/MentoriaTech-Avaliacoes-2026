<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<!-- BARRA SUPERIOR -->
<header class="topo">
    <div class="topo-interno">
        <div class="logo">
            <span class="logo-marca">IMC</span>
            <span class="logo-texto">Painel de pacientes</span>
        </div>
        <button type="button" id="abrir-form" class="btn-primario">+ Novo paciente</button>
    </div>
</header>

<main class="pagina">

    <!-- FAIXA DE RESUMO -->
    <section class="resumo" aria-label="Resumo">
        <div class="resumo-bloco principal">
            <span class="rotulo">Pacientes</span>
            <strong id="total">0</strong>
        </div>
        <div class="resumo-bloco principal">
            <span class="rotulo">IMC médio</span>
            <strong id="media">0,0</strong>
        </div>
        <ul class="distribuicao" id="distribuicao"></ul>
    </section>

    <!-- BUSCA -->
    <div class="barra-busca">
        <input type="search" id="busca" placeholder="Buscar paciente pelo nome" aria-label="Buscar paciente">
        <select id="ordem" aria-label="Ordenar por">
            <option value="recente">Mais recentes</option>
            <option value="nome">Nome (A–Z)</option>
            <option value="imc">Maior IMC</option>
        </select>
    </div>

    <!-- CARTÕES -->
    <section id="grade" class="grade"></section>

</main>


<!-- JANELA DO FORMULÁRIO -->
<dialog id="dialogo">
    <form id="form" method="dialog" novalidate autocomplete="off">

        <h2 id="titulo">Novo paciente</h2>

        <label>
            Nome completo
            <input type="text" id="f-nome" maxlength="50" placeholder="Ex.: Maria Silva">
        </label>

        <div class="trio">
            <label>
                Idade
                <input type="number" id="f-idade" min="1" max="126" step="1" placeholder="30">
            </label>
            <label>
                Altura (m)
                <input type="number" id="f-altura" min="0.5" max="2.5" step="0.01" placeholder="1.75">
            </label>
            <label>
                Peso (kg)
                <input type="number" id="f-peso" min="1" max="500" step="0.1" placeholder="70">
            </label>
        </div>

        <p class="previa">IMC calculado: <output id="previa">—</output></p>

        <p id="msg-erro" class="msg-erro" role="alert" hidden></p>

        <div class="form-botoes">
            <button type="button" id="fechar-form" class="btn-neutro">Cancelar</button>
            <button type="submit" id="salvar" class="btn-primario">Cadastrar</button>
        </div>

    </form>
</dialog>

<div id="aviso" class="aviso" role="status" hidden></div>

<script src="app.js"></script>
<script src="script.js"></script></body>
</html>
