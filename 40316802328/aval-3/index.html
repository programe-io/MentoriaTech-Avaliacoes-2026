<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="layout">

    <!-- PAINEL LATERAL: marca + formulário -->
    <aside class="painel">

        <header class="marca">
            <div class="marca-icone">⚕</div>
            <div>
                <h1>Calculadora de IMC</h1>
                <p>Acompanhamento de pacientes</p>
            </div>
        </header>

        <form id="form-pessoa" novalidate autocomplete="off">

            <h2 id="titulo-form">Nova pessoa</h2>

            <div class="campo">
                <label for="input-nome">Nome completo</label>
                <input type="text" id="input-nome" maxlength="50" placeholder="Ex.: Maria Silva" required>
            </div>

            <div class="campo">
                <label for="input-idade">Idade (anos)</label>
                <input type="number" id="input-idade" min="1" max="126" step="1" placeholder="Ex.: 30" required>
            </div>

            <div class="linha-dupla">
                <div class="campo">
                    <label for="input-altura">Altura (m)</label>
                    <input type="number" id="input-altura" min="0.5" max="2.5" step="0.01" placeholder="1.75" required>
                </div>

                <div class="campo">
                    <label for="input-peso">Peso (kg)</label>
                    <input type="number" id="input-peso" min="1" max="500" step="0.1" placeholder="70" required>
                </div>
            </div>

            <p id="erro" class="erro" role="alert" hidden></p>

            <div class="botoes">
                <button type="submit" id="btn-salvar">+ Salvar pessoa</button>
                <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar</button>
            </div>

        </form>

        <footer>Calculadora de IMC • Projeto Prático</footer>

    </aside>


    <!-- CONTEÚDO: resumo + lista -->
    <main class="conteudo">

        <section class="resumo">
            <div class="resumo-item">
                <strong id="total-pessoas">0</strong>
                <p>Pessoas cadastradas</p>
            </div>
            <div class="resumo-item">
                <strong id="media-imc">0,0</strong>
                <p>Média de IMC</p>
            </div>
        </section>

        <section class="lista">

            <div class="lista-cabecalho">
                <h2>Histórico de pacientes</h2>
                <span class="contador" id="contador">0 registros</span>
            </div>

            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-pessoas"></tbody>
                </table>
            </div>

        </section>

    </main>

</div>

<script src="app.js"></script>
<script src="script.js"></script></body>
</html>
