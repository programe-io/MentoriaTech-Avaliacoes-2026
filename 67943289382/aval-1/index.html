<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fortune Tiger - Slot Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="game-container">
        
        <!-- Header -->
        <div class="header">
            <h1 class="title">🐯 Fortune Tiger</h1>
        </div>

        <!-- Slot Machine Area -->
        <div class="machine-housing">
            <div class="slot-machine">
                <canvas id="winCanvas"></canvas>
                <div class="reels-container" id="reelsContainer">
                    <!-- Reel 1 -->
                    <div class="reel-window">
                        <div class="reel" id="reel0"></div>
                    </div>
                    <!-- Reel 2 -->
                    <div class="reel-window">
                        <div class="reel" id="reel1"></div>
                    </div>
                    <!-- Reel 3 -->
                    <div class="reel-window">
                        <div class="reel" id="reel2"></div>
                    </div>
                </div>
            </div>
            
            <!-- Floating Big Win Message -->
            <div id="winMessage" class="message-overlay">
                <div class="msg-title" id="winType">BIG WIN!</div>
                <div class="msg-value" id="winAmount">0.00</div>
            </div>
        </div>

        <!-- Controls Area -->
        <div class="controls">
            <div class="info-panel">
                <div class="info-box">
                    <span class="info-label">Balance</span>
                    <span class="info-value">R$ <span id="balanceDisplay">1000.00</span></span>
                </div>
                <div class="info-box">
                    <span class="info-label">Win</span>
                    <span class="info-value" style="color: #4ade80;">R$ <span id="winDisplay">0.00</span></span>
                </div>
            </div>

            <div class="bet-controls">
                <div class="flex flex-col items-center">
                    <span class="info-label mb-1">Bet Level</span>
                    <div class="flex gap-2">
                        <button class="btn" id="btnBetMinus">➖</button>
                        <div class="bg-gray-900 px-4 py-2 rounded-lg border border-gray-700 flex items-center justify-center min-w-[80px]">
                            <span class="info-value">R$ <span id="betDisplay">2.00</span></span>
                        </div>
                        <button class="btn" id="btnBetPlus">➕</button>
                    </div>
                </div>

                <button class="spin-btn" id="btnSpin">
                    <span class="text-3xl">🐯</span>
                    <span class="text-xs font-bold mt-1">SPIN</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Link para o arquivo JavaScript externo -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
