
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - Clone</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <aside class="sidebar">
    <h1 class="logo">Instagram</h1>

    <nav>
      <button class="nav-btn active" data-page="inicio">⌂ <span>Início</span></button>
      <button class="nav-btn" data-page="pesquisa">⌕ <span>Pesquisar</span></button>
      <button class="nav-btn" data-page="explorar">▦ <span>Explorar</span></button>
      <button class="nav-btn" data-page="reels">▶ <span>Reels</span></button>
      <button class="nav-btn" data-page="mensagens">✉ <span>Mensagens</span></button>
      <button class="nav-btn" data-page="notificacoes">♡ <span>Notificações</span></button>
      <button class="nav-btn" id="menu-create">＋ <span>Criar publicação</span></button>
      <button class="nav-btn" data-page="perfil">◎ <span>Perfil</span></button>
    </nav>

    <button class="nav-btn menu-bottom" data-page="mais">☰ <span>Mais</span></button>
  </aside>

  <main class="main-content">
    <section class="feed-area">

      <div class="stories" id="stories"></div>

      <div id="feed"></div>

      <section id="other-page" class="other-page hidden"></section>

    </section>

    <aside class="suggestions">
      <div class="my-account">
        <img src="https://i.pravatar.cc/100?img=12" alt="Minha foto">
        <div>
          <strong>meu_perfil</strong>
          <small>Meu perfil</small>
        </div>
        <button class="follow-btn">Trocar</button>
      </div>

      <div class="suggestion-title">
        <strong>Sugestões para você</strong>
        <span>Ver tudo</span>
      </div>

      <div id="suggestions"></div>

      <p class="footer-text">
        Sobre · Ajuda · Imprensa · API · Carreiras · Privacidade
        <br><br>© 2026 INSTAGRAM CLONE
      </p>
    </aside>
  </main>

  <!-- Modal de stories -->
  <div class="modal hidden" id="story-modal">
    <button class="close-modal" id="close-story">×</button>
    <button class="story-arrow prev" id="story-prev">‹</button>
    <div class="story-view">
      <div class="story-progress"><div id="story-progress-bar"></div></div>
      <strong id="story-name"></strong>
      <img id="story-image" src="" alt="Story">
    </div>
    <button class="story-arrow next" id="story-next">›</button>
  </div>

  <!-- Modal de criação -->
  <div class="modal hidden" id="create-modal">
    <div class="modal-box">
      <button class="close-modal" data-close="create-modal">×</button>
      <h2>Criar nova publicação</h2>
      <form id="create-form">
        <label class="upload-area">
          <span>＋</span>
          <p>Escolha uma foto para compartilhar</p>
          <input type="file" id="post-image" accept="image/*" required>
        </label>
        <textarea id="post-caption" placeholder="Escreva uma legenda..." maxlength="500"></textarea>
        <button class="primary-btn" type="submit">Compartilhar</button>
      </form>
    </div>
  </div>

  <!-- Modal de mensagens -->
  <div class="modal hidden" id="message-modal">
    <div class="modal-box message-box">
      <button class="close-modal" data-close="message-modal">×</button>
      <h2>Mensagens</h2>
      <div id="chat-content" class="chat-content">
        <p class="empty-chat">Escolha uma conversa para começar.</p>
      </div>
      <form id="chat-form" class="chat-form">
        <input id="message-input" type="text" placeholder="Escreva uma mensagem..." autocomplete="off">
        <button type="submit">Enviar</button>
      </form>
    </div>
  </div>

  <!-- Modal de notificações -->
  <div class="modal hidden" id="notification-modal">
    <div class="modal-box">
      <button class="close-modal" data-close="notification-modal">×</button>
      <h2>Notificações</h2>
      <div id="notification-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
