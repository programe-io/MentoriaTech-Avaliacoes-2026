<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Sistema de Estoque</h1>

        <h2>Cadastrar Produto</h2>

        <input type="number" id="codigo" placeholder="Código">

        <input type="text" id="descricao" placeholder="Descrição">

        <input type="number" id="quantidade" placeholder="Quantidade">

        <input type="number" id="valor" placeholder="Valor">

        <button id="btnCadastrar">Cadastrar Produto</button>


        <h2>Alterar Produto</h2>

        <input type="number" id="codigoAlterar" placeholder="Código do produto">

        <input type="number" id="novoValor" placeholder="Novo valor">

        <button id="btnValor">Alterar Valor</button>

        <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

        <button id="btnQuantidade">Alterar Quantidade</button>


        <h2>Produtos</h2>

        <button id="btnListar">Listar Produtos</button>

        <div id="resultado"></div>

    </div>

    <!-- IMPORTANTE: o JavaScript deve ser carregado aqui -->
    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
