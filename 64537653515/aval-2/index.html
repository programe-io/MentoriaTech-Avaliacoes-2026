<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <!-- Mensagens de Erro/Sucesso -->
        <div id="mensagem" class="mensagem oculto"></div>

        <!-- Formulario de Cadastro/Edicao -->
        <section class="card">
            <h2>Cadastrar Nova Tarefa</h2>
            <form id="form-tarefa">
                <div class="form-group">
                    <label for="titulo">Título da Tarefa (Mínimo 5 caracteres):</label>
                    <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript" required>
                </div>

                <div class="form-group">
                    <label for="prioridade">Prioridade (1 - Alta, 2 - Média, 3 - Baixa):</label>
                    <select id="prioridade" required>
                        <option value="">Selecione a prioridade...</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit" id="btn-cadastrar">Cadastrar Tarefa</button>
            </form>
        </section>

        <!-- Alterar Prioridade -->
        <section class="card">
            <h2>Alterar Prioridade de Tarefa</h2>
            <form id="form-alterar-prioridade">
                <div class="form-inline">
                    <input type="number" id="codigo-prioridade" placeholder="Código da Tarefa" required>
                    <select id="nova-prioridade" required>
                        <option value="">Nova Prioridade...</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                    <button type="submit">Atualizar Prioridade</button>
                </div>
            </form>
        </section>

        <!-- Lista de Tarefas -->
        <section class="card">
            <h2>Lista de Tarefas</h2>
            <div id="lista-tarefas" class="lista-container">
                <p>Nenhuma tarefa cadastrada.</p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
