<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo CoHo | Blog Literário Colleen Hoover</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Universo CoHo</h1>
        <p>Resenhas, análises sem spoilers e reflexões sobre os romances mais intensos de Colleen Hoover.</p>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar por título, personagem ou tema...">
        </div>
        <div class="filters" id="filterContainer">
            <button class="filter-btn active" data-category="Todos">Todos</button>
            <button class="filter-btn" data-category="Drama Contemporâneo">Drama Contemporâneo</button>
            <button class="filter-btn" data-category="Suspense Psicológico">Suspense Psicológico</button>
            <button class="filter-btn" data-category="Romance Jovem">Romance Jovem</button>
        </div>
    </div>

    <main>
        <div class="posts-grid" id="postsGrid"></div>
    </main>

    <!-- Modal de Leitura do Post -->
    <div class="modal-overlay" id="postModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal" aria-label="Fechar">&times;</button>
            <span class="tag" id="modalTag"></span>
            <h2 id="modalTitle"></h2>
            <div class="modal-meta" id="modalMeta"></div>
            <blockquote class="modal-quote" id="modalQuote"></blockquote>
            <div class="modal-text" id="modalBody"></div>
        </div>
    </div>

        <p>Universo CoHo &copy; 2026 — Blog feito para apaixonados por literatura contemporânea.</p>
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
