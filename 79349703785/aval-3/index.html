<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoHoGram • Bookstagram Colleen Hoover</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Barra Superior Estilo Instagram -->
    <header class="top-bar">
        <div class="top-bar-inner">
            <h1 class="brand-logo">CoHoGram</h1>
            <div class="top-actions">
                <button class="icon-btn" id="openCreateModal" title="Criar nova publicação">＋</button>
                <button class="icon-btn" id="toggleSavedFilter" title="Ver posts salvos">🔖</button>
            </div>
        </div>
    </header>

    <main class="ig-container">
        <!-- Faixa de Stories -->
        <section class="stories-bar" id="storiesBar"></section>

        <!-- Feed de Publicações -->
        <section class="feed-stream" id="feedStream"></section>
    </main>

    <!-- Visualizador de Story -->
    <div class="story-viewer" id="storyViewer">
        <div class="story-card">
            <div class="story-progress-bg">
                <div class="story-progress-fill" id="storyProgress"></div>
            </div>
            <div class="story-top">
                <div class="story-user">
                    <div class="story-mini-avatar" id="storyAvatar"></div>
                    <span id="storyUsername"></span>
                </div>
                <button class="close-story" id="closeStory">&times;</button>
            </div>
            <div class="story-body" id="storyContent"></div>
        </div>
    </div>

    <!-- Modal de Nova Publicação -->
    <div class="modal-backdrop" id="createModal">
        <div class="create-box">
            <div class="create-header">
                <h3>Nova publicação literária</h3>
                <button id="closeCreateModal">&times;</button>
            </div>
            <form id="createPostForm">
                <label>Seu perfil (@usuario)</label>
                <input type="text" id="newUsername" placeholder="ex: leitora.coho" required>

                <label>Livro da Colleen Hoover</label>
                <select id="newBook" required>
                    <option value="É Assim que Acaba">É Assim que Acaba</option>
                    <option value="Verity">Verity</option>
                    <option value="Novembro, 9">Novembro, 9</option>
                    <option value="O Lado Feio do Amor">O Lado Feio do Amor</option>
                    <option value="Todas as Suas (Im)Perfeições">Todas as Suas (Im)Perfeições</option>
                    <option value="É Assim que Começa">É Assim que Começa</option>
                </select>

                <label>Citação ou destaque visual da foto</label>
                <input type="text" id="newArtQuote" placeholder="Ex: Continue a nadar..." required>

                <label>Legenda do post</label>
                <textarea id="newCaption" rows="3" placeholder="Escreva sua resenha ou opinião..." required></textarea>

                <button type="submit" class="share-btn">Compartilhar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
