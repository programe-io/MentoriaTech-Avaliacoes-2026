<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoHo Feed | Comunidade de Leitores</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <span class="logo">CoHo<span>Feed</span></span>
            <div class="nav-tabs">
                <button class="tab-btn active" data-tab="all">Explorar Feed</button>
                <button class="tab-btn" data-tab="saved">Salvos (<span id="savedCount">0</span>)</button>
            </div>
        </div>
    </nav>

    <div class="feed-wrapper">
        <!-- Caixa de Nova Publicação -->
        <section class="composer-card">
            <h3>Compartilhe sua leitura</h3>
            <form id="postForm">
                <div class="form-row">
                    <input type="text" id="userName" placeholder="Seu @usuario" required>
                    <select id="bookSelect" required>
                        <option value="" disabled selected>Escolha o livro...</option>
                        <option value="É Assim que Acaba">É Assim que Acaba</option>
                        <option value="Verity">Verity</option>
                        <option value="Novembro, 9">Novembro, 9</option>
                        <option value="O Lado Feio do Amor">O Lado Feio do Amor</option>
                        <option value="Todas as Suas (Im)Perfeições">Todas as Suas (Im)Perfeições</option>
                        <option value="É Assim que Começa">É Assim que Começa</option>
                        <option value="Até o Verão Terminar">Até o Verão Terminar</option>
                    </select>
                </div>
                <textarea id="postText" rows="3" placeholder="O que você achou dessa história ou qual sua citação favorita?" required></textarea>
                <div class="composer-footer">
                    <div class="rating-input">
                        <label for="bookRating">Nota:</label>
                        <select id="bookRating">
                            <option value="5">★★★★★ (5/5)</option>
                            <option value="4">★★★★☆ (4/5)</option>
                            <option value="3">★★★☆☆ (3/5)</option>
                            <option value="2">★★☆☆☆ (2/5)</option>
                            <option value="1">★☆☆☆☆ (1/5)</option>
                        </select>
                    </div>
                    <button type="submit" class="publish-btn">Publicar no Feed</button>
                </div>
            </form>
        </section>

        <!-- Lista de Posts do Feed -->
        <main id="feedContainer" class="feed-list"></main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
