<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo - Pegue o Quadrado</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#87CEEB;
}

h1{
    color:#222;
}

#area{
    width:700px;
    height:400px;
    background:white;
    margin:auto;
    border:4px solid black;
    position:relative;
    overflow:hidden;
}

#alvo{
    width:60px;
    height:60px;
    background:red;
    position:absolute;
    border-radius:10px;
    cursor:pointer;
}

.info{
    font-size:22px;
    margin:10px;
}

button{
    padding:10px 20px;
    font-size:18px;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<h1>🎮 Pegue o Quadrado</h1>

<div class="info">
Pontos: <span id="pontos">0</span>
</div>

<div id="area">
<div id="alvo"></div>
</div>

<br>

<button onclick="iniciar()">Iniciar</button>

<script>

let pontos = 0;
let tempo;

const alvo = document.getElementById("alvo");
const area = document.getElementById("area");

function mover(){
let x = Math.random() * 620;
let y = Math.random() * 320;

alvo.style.left = x + "px";
alvo.style.top = y + "px";
}

alvo.onclick = function(){
pontos++;
document.getElementById("pontos").innerText = pontos;
mover();
}

function iniciar(){

pontos = 0;

document.getElementById("pontos").innerText = pontos;

mover();

clearTimeout(tempo);

tempo = setTimeout(()=>{
alert("Fim do jogo! Sua pontuação foi: " + pontos);
},30000);

}

</script>

<script src="script.js"></script></body>
</html>
