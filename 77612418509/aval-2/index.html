
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed - Evandro</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="new-post">
            <div class="user">
                <div class="avatar">E</div>
                <div>
                    <strong>Evandro</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>

            <textarea id="postInput" placeholder="Escreva uma publicação..."></textarea>
            <button onclick="publicar()">Publicar</button>
        </section>

        <section id="feed">

            <article class="post">
                <div class="post-header">
                    <div class="avatar">E</div>
                    <div>
                        <strong>Evandro</strong>
                        <span>Há 10 minutos</span>
                    </div>
                </div>

                <p class="post-text">
                    Olá, pessoal! Bem-vindos ao meu Mini Feed! 💙
                </p>

                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800"
                     alt="Paisagem bonita">

                <div class="post-actions">
                    <button onclick="curtir(this)">Curtir ❤️</button>
                    <button onclick="comentar()">Comentar 💬</button>
                </div>
            </article>

            <article class="post">
                <div class="post-header">
                    <div class="avatar">E</div>
                    <div>
                        <strong>Evandro</strong>
                        <span>Há 30 minutos</span>
                    </div>
                </div>

                <p class="post-text">
                    Aproveitando os bons momentos da vida! ✨
                </p>

                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800"
                     alt="Montanhas e lago">

                <div class="post-actions">
                    <button onclick="curtir(this)">Curtir ❤️</button>
                    <button onclick="comentar()">Comentar 💬</button>
                </div>
            </article>

        </section>
    </main>

    <footer>
        <p>© 2026 - Mini Feed do Evandro</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
