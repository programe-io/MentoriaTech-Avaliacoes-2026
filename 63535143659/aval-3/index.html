<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            igDarkBg: '#000000',
            igDarkSurface: '#121212',
            igDarkCard: '#0f0f0f',
            igDarkBorder: '#262626',
            igGrayText: '#a8a8a8',
            igBlue: '#0095f6',
            igBlueHover: '#1877f2',
            igLikeRed: '#ff3040'
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000;
    }
    ::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #363636;
    }

    /* Instagram Gradient Ring for Stories */
    .story-ring {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      padding: 2px;
      border-radius: 9999px;
    }

    /* Seen story ring */
    .story-ring-seen {
      background: #363636;
      padding: 2px;
      border-radius: 9999px;
    }

    /* Heart explosion animation on double tap */
    @keyframes heartPop {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.3) rotate(0deg); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(1) rotate(10deg); opacity: 0; }
    }
    .animate-heart-pop {
      animation: heartPop 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.49) forwards;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body class="bg-igDarkBg text-white font-sans antialiased select-none min-h-screen">

  <div class="flex h-screen overflow-hidden">
    <!-- LEFT SIDEBAR NAVIGATION -->
    <aside class="w-16 lg:w-60 border-r border-igDarkBorder h-full flex flex-col justify-between px-3 py-5 z-20 shrink-0">
      <div class="flex flex-col gap-5">
        <!-- Instagram Logo -->
        <a href="#" class="px-3 py-2 my-1 flex items-center">
          <span class="hidden lg:block font-bold text-2xl tracking-tight font-serif italic text-white">Instagram</span>
          <i class="fa-brands fa-instagram text-2xl lg:hidden text-white"></i>
        </a>

        <!-- Navigation Links -->
        <nav class="flex flex-col gap-1" id="nav-menu">
          <button onclick="setActiveNav(this)" class="nav-item flex items-center gap-4 p-3 rounded-lg hover:bg-igDarkSurface transition-colors text-white font-semibold w-full text-left">
            <i class="fa-solid fa-house text-xl w-6 text-center"></i>
            <span class="hidden lg:inline text-sm">Página inicial</span>
          </button>
          <button onclick="setActiveNav(this)" class="nav-item flex items-center gap-4 p-3 rounded-lg hover:bg-igDarkSurface transition-colors text-igGrayText hover:text-white w-full text-left">
            <i class="fa-solid fa-magnifying-glass text-xl w-6 text-center"></i>
            <span class="hidden lg:inline text-sm">Pesquisa</span>
          </button>
          <button onclick="setActiveNav(this)" class="nav-item flex items-center gap-4 p-3 rounded-lg hover:bg-igDarkSurface transition-colors text-igGrayText hover:text-white w-full text-left">
            <i class="fa-regular fa-compass text-xl w-6 text-center"></i>
            <span class="hidden lg:inline text-sm">Explorar</span>
          </button>
          <button onclick="setActiveNav(this)" class="nav-item flex items-center gap-4 p-3 rounded-lg hover:bg-igDarkSurface transition-colors text-igGrayText hover:text-white w-full text-left">
            <i class="fa-solid fa-clapperboard text-xl w-6 text-center"></i>
            <span class="hidden lg:inline text-sm">Reels</span>
          </button>
          <button onclick="setActiveNav(this)" class="nav-item flex items-center gap-4 p-3 rounded-lg hover:bg-igDarkSurface transition-colors text-igGrayText hover:text-white w-full text-left relative">
            <i class="fa-regular fa-paper-plane text-xl w-6 text-center"></i>
            <span class="hidden lg:inline text-sm">Mensagens</span>
            <span class="absolute top-2 left-6 lg:left-7 bg-igLikeRed text-[10px] font-bold px-1.5 py-0.5 rounded-full">3</span>
          </button>
          <button onclick="setActiveNav(this)" class="nav-item flex items-center gap-4 p-3 rounded-lg hover:bg-igDarkSurface transition-colors text-igGrayText hover:text-white w-full text-left">
            <i class="fa-regular fa-heart text-xl w-6 text-center"></i>
            <span class="hidden lg:inline text-sm">Notificações</span>
          </button>
          <button onclick="openCreateModal()" class="nav-item flex items-center gap-4 p-3 rounded-lg hover:bg-igDarkSurface transition-colors text-igGrayText hover:text-white w-full text-left">
            <i class="fa-regular fa-square-plus text-xl w-6 text-center"></i>
            <span class="hidden lg:inline text-sm">Criar</span>
          </button>
          <button onclick="setActiveNav(this)" class="nav-item flex items-center gap-4 p-3 rounded-lg hover:bg-igDarkSurface transition-colors text-igGrayText hover:text-white w-full text-left">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Avatar" class="w-6 h-6 rounded-full object-cover border border-igDarkBorder">
            <span class="hidden lg:inline text-sm">Perfil</span>
          </button>
        </nav>
      </div>

      <!-- Footer Menu Item -->
      <div class="flex flex-col gap-1">
        <a href="https://threads.net" target="_blank" class="flex items-center gap-4 p-3 rounded-lg hover:bg-igDarkSurface transition-colors text-igGrayText hover:text-white">
          <i class="fa-solid fa-threads text-xl w-6 text-center"></i>
          <span class="hidden lg:inline text-sm">Threads</span>
        </a>
        <button class="flex items-center gap-4 p-3 rounded-lg hover:bg-igDarkSurface transition-colors text-igGrayText hover:text-white w-full text-left">
          <i class="fa-solid fa-bars text-xl w-6 text-center"></i>
          <span class="hidden lg:inline text-sm">Mais</span>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 h-full overflow-y-auto flex justify-center py-6 px-4">
      <div class="w-full max-w-[630px] lg:max-w-[935px] flex gap-12">
        
        <!-- FEED & STORIES CONTAINER -->
        <section class="w-full max-w-[470px] flex flex-col gap-6 mx-auto lg:mx-0">
          
          <!-- STORIES CAROUSEL -->
          <div class="w-full py-2 flex gap-4 overflow-x-auto no-scrollbar border-b border-igDarkBorder pb-4" id="stories-container">
            <!-- Dynamic stories rendered via JS -->
          </div>

          <!-- POSTS FEED CONTAINER -->
          <div id="posts-container" class="flex flex-col gap-8">
            <!-- Dynamic Posts rendered via JS -->
          </div>

        </section>

        <!-- RIGHT SIDEBAR (Desktop suggestions) -->
        <aside class="hidden lg:block w-[320px] shrink-0 pt-2">
          <!-- Current User Profile Header -->
          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="User Profile" class="w-12 h-12 rounded-full object-cover border border-igDarkBorder">
              <div class="flex flex-col">
                <span class="text-sm font-semibold text-white hover:underline cursor-pointer">seu_usuario</span>
                <span class="text-xs text-igGrayText">Seu Nome • Desenvolvedor</span>
              </div>
            </div>
            <button class="text-xs font-semibold text-igBlue hover:text-white transition-colors">Mudar</button>
          </div>

          <!-- Suggestions Header -->
          <div class="flex justify-between items-center mb-4">
            <span class="text-sm font-semibold text-igGrayText">Sugestões para você</span>
            <button class="text-xs font-semibold text-white hover:text-igGrayText transition-colors">Ver tudo</button>
          </div>

          <!-- Suggestions List -->
          <div class="flex flex-col gap-3.5 mb-6" id="suggestions-list">
            <!-- Dynamic suggestions via JS -->
          </div>

          <!-- Footer Links -->
          <footer class="text-xs text-igGrayText flex flex-col gap-4">
            <div class="flex flex-wrap gap-x-2 gap-y-1">
              <a href="#" class="hover:underline">Sobre</a> • 
              <a href="#" class="hover:underline">Ajuda</a> • 
              <a href="#" class="hover:underline">Imprensa</a> • 
              <a href="#" class="hover:underline">API</a> • 
              <a href="#" class="hover:underline">Carreiras</a> • 
              <a href="#" class="hover:underline">Privacidade</a> • 
              <a href="#" class="hover:underline">Termos</a> • 
              <a href="#" class="hover:underline">Localizações</a> • 
              <a href="#" class="hover:underline">Idioma</a>
            </div>
            <p class="uppercase font-medium">© 2026 INSTAGRAM CLONE</p>
          </footer>
        </aside>

      </div>
    </main>
  </div>

  <!-- FULLSCREEN STORY VIEWER MODAL -->
  <div id="story-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center">
    <!-- Close Button -->
    <button onclick="closeStoryModal()" class="absolute top-5 right-6 text-white text-2xl z-30 hover:text-gray-400 focus:outline-none">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <!-- Navigation Arrows -->
    <button onclick="navigateStory(-1)" class="absolute left-6 text-white text-3xl z-30 hover:text-gray-400 focus:outline-none p-2">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button onclick="navigateStory(1)" class="absolute right-6 text-white text-3xl z-30 hover:text-gray-400 focus:outline-none p-2">
      <i class="fa-solid fa-chevron-right"></i>
    </button>

    <!-- Story Card Content -->
    <div class="relative w-full max-w-[380px] h-[85vh] max-h-[700px] bg-igDarkSurface rounded-xl overflow-hidden flex flex-col justify-between shadow-2xl border border-igDarkBorder">
      <!-- Progress Bar Overlay -->
      <div class="absolute top-3 left-3 right-3 flex gap-1.5 z-20">
        <div class="h-1 flex-1 bg-white/30 rounded-full overflow-hidden">
          <div id="story-progress-bar" class="h-full bg-white w-0 transition-all duration-100 ease-linear"></div>
        </div>
      </div>

      <!-- Story Header -->
      <div class="absolute top-6 left-3 right-3 flex items-center justify-between z-20 text-white">
        <div class="flex items-center gap-2.5">
          <img id="story-modal-avatar" src="" class="w-8 h-8 rounded-full object-cover border border-white/20">
          <span id="story-modal-username" class="text-xs font-semibold drop-shadow-md"></span>
          <span id="story-modal-time" class="text-[11px] text-gray-300 drop-shadow-md">2h</span>
        </div>
        <button class="text-white text-xs p-1"><i class="fa-solid fa-ellipsis"></i></button>
      </div>

      <!-- Story Image -->
      <img id="story-modal-image" src="" class="w-full h-full object-cover select-none">

      <!-- Story Footer Reply Input -->
      <div class="absolute bottom-4 left-3 right-3 flex items-center gap-3 z-20">
        <input type="text" placeholder="Enviar mensagem..." class="flex-1 bg-black/50 border border-white/30 rounded-full px-4 py-2 text-xs text-white placeholder-gray-300 focus:outline-none focus:border-white transition-colors">
        <button class="text-white text-xl hover:text-gray-300"><i class="fa-regular fa-heart"></i></button>
        <button class="text-white text-xl hover:text-gray-300"><i class="fa-regular fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <!-- CREATE POST MODAL SIMULATION -->
  <div id="create-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
    <button onclick="closeCreateModal()" class="absolute top-5 right-6 text-white text-2xl z-30"><i class="fa-solid fa-xmark"></i></button>
    <div class="bg-igDarkSurface border border-igDarkBorder rounded-xl w-full max-w-lg overflow-hidden flex flex-col">
      <div class="border-b border-igDarkBorder p-3 text-center font-semibold text-sm">Criar nova publicação</div>
      <div class="p-8 flex flex-col items-center justify-center gap-4 text-center min-h-[300px]">
        <i class="fa-regular fa-images text-5xl text-igGrayText"></i>
        <p class="text-lg font-light">Arraste as fotos e os vídeos aqui</p>
        <button onclick="alert('Selecione uma imagem do seu dispositivo!')" class="bg-igBlue hover:bg-igBlueHover text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors">
          Selecionar do computador
        </button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // STORIES DATA
    const storiesData = [
      { id: 0, username: "seu_story", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80", image: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=800&q=80", seen: false },
      { id: 1, username: "design_hub", avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=150&q=80", image: "https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=800&q=80", seen: false },
      { id: 2, username: "tech_insider", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80", image: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=800&q=80", seen: false },
      { id: 3, username: "dev_life", avatar: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=150&q=80", image: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=800&q=80", seen: false },
      { id: 4, username: "travel_vibes", avatar: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=150&q=80", image: "https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=800&q=80", seen: false }
    ];

    // POSTS DATA
    const postsData = [
      {
        id: 101,
        username: "tech_insider",
        userAvatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80",
        location: "Silicon Valley, California",
        postImage: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80",
        likes: 1420,
        likedByText: "dev_master",
        isLiked: false,
        isSaved: false,
        caption: "O futuro do desenvolvimento Web com Tailwind CSS e JavaScript Vanilla puro! ⚡ Qual é o seu framework favorito atualmente? #tech #code #javascript #webdev",
        timeAgo: "HÁ 2 HORAS",
        comments: [
          { username: "aline_code", text: "Ficou sensacional esse setup! 🔥" },
          { username: "mariana_dev", text: "JavaScript puro ainda reina demais!" }
        ]
      },
      {
        id: 102,
        username: "travel_vibes",
        userAvatar: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=150&q=80",
        location: "Fernando de Noronha, Brasil",
        postImage: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80",
        likes: 3890,
        likedByText: "carla_design",
        isLiked: true,
        isSaved: true,
        caption: "A calmaria de um pôr do sol inesquecível no paraíso! 🌅🌊 Marcando o próximo destino. #travel #nature #noronha",
        timeAgo: "HÁ 4 HORAS",
        comments: [
          { username: "lucas.tech", text: "Que lugar maravilhoso! Preciso ir aí." }
        ]
      }
    ];

    // SUGGESTIONS DATA
    const suggestionsData = [
      { id: 1, username: "gabriel_frontend", subtitle: "Seguido(a) por mariana_dev", avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" },
      { id: 2, username: "code_inspiration", subtitle: "Novo no Instagram", avatar: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?auto=format&fit=crop&w=150&q=80" },
      { id: 3, username: "ui_patterns", subtitle: "Seguido(a) por lucas.tech + 3 outros", avatar: "https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=150&q=80" }
    ];

    // RENDER STORIES
    function renderStories() {
      const container = document.getElementById('stories-container');
      container.innerHTML = storiesData.map((story, index) => `
        <button onclick="openStoryModal(${index})" class="flex flex-col items-center gap-1.5 shrink-0 group focus:outline-none">
          <div class="${story.seen ? 'story-ring-seen' : 'story-ring'}">
            <div class="bg-black p-[2px] rounded-full">
              <img src="${story.avatar}" class="w-14 h-14 rounded-full object-cover group-hover:scale-105 transition-transform duration-200">
            </div>
          </div>
          <span class="text-xs text-gray-300 truncate w-16 text-center">${story.username}</span>
        </button>
      `).join('');
    }

    // RENDER POSTS
    function renderPosts() {
      const container = document.getElementById('posts-container');
      container.innerHTML = postsData.map(post => `
        <article class="bg-black border-b border-igDarkBorder pb-6 flex flex-col gap-3">
          <!-- Header -->
          <div class="flex items-center justify-between py-1">
            <div class="flex items-center gap-3">
              <div class="story-ring p-[2px]">
                <img src="${post.userAvatar}" class="w-8 h-8 rounded-full object-cover border border-black">
              </div>
              <div class="flex flex-col">
                <div class="flex items-center gap-1">
                  <span class="text-sm font-semibold text-white hover:underline cursor-pointer">${post.username}</span>
                  <i class="fa-solid fa-circle-check text-igBlue text-xs"></i>
                  <span class="text-xs text-igGrayText">• 2 h</span>
                </div>
                <span class="text-xs text-igGrayText">${post.location}</span>
              </div>
            </div>
            <button class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-ellipsis"></i></button>
          </div>

          <!-- Image Container with double tap heart -->
          <div class="relative rounded overflow-hidden bg-igDarkSurface flex items-center justify-center cursor-pointer select-none" ondblclick="doubleTapLike(${post.id})">
            <img src="${post.postImage}" alt="Post image" class="w-full max-h-[580px] object-cover">
            <i id="heart-pop-${post.id}" class="fa-solid fa-heart text-white text-8xl absolute top-1/2 left-1/2 opacity-0 pointer-events-none drop-shadow-2xl"></i>
          </div>

          <!-- Action Buttons Bar -->
          <div class="flex justify-between items-center pt-1">
            <div class="flex items-center gap-4 text-2xl">
              <button onclick="toggleLike(${post.id})" class="focus:outline-none transition-transform active:scale-125">
                <i id="like-icon-${post.id}" class="${post.isLiked ? 'fa-solid fa-heart text-igLikeRed' : 'fa-regular fa-heart text-white hover:text-igGrayText'}"></i>
              </button>
              <button onclick="focusCommentInput(${post.id})" class="text-white hover:text-igGrayText focus:outline-none">
                <i class="fa-regular fa-comment"></i>
              </button>
              <button class="text-white hover:text-igGrayText focus:outline-none">
                <i class="fa-regular fa-paper-plane"></i>
              </button>
            </div>
            <button onclick="toggleSave(${post.id})" class="text-2xl text-white hover:text-igGrayText focus:outline-none">
              <i id="save-icon-${post.id}" class="${post.isSaved ? 'fa-solid fa-bookmark text-white' : 'fa-regular fa-bookmark'}"></i>
            </button>
          </div>

          <!-- Likes -->
          <div class="text-sm font-semibold text-white">
            Curtido por <span class="font-bold">${post.likedByText}</span> e outras <span id="like-count-${post.id}">${post.likes.toLocaleString('pt-BR')}</span> pessoas
          </div>

          <!-- Caption -->
          <div class="text-sm text-white leading-relaxed">
            <span class="font-semibold mr-2">${post.username}</span>
            <span>${post.caption}</span>
          </div>

          <!-- Comments -->
          <div id="comments-container-${post.id}" class="flex flex-col gap-1 text-sm">
            ${post.comments.length > 0 ? `<button class="text-xs text-igGrayText text-left mb-1 hover:text-white">Ver todos os ${post.comments.length} comentários</button>` : ''}
            ${post.comments.map(c => `
              <div><span class="font-semibold text-white mr-2">${c.username}</span><span class="text-gray-300">${c.text}</span></div>
            `).join('')}
          </div>

          <!-- Time Ago -->
          <div class="text-[10px] text-igGrayText tracking-wider uppercase mt-1">${post.timeAgo}</div>

          <!-- Add Comment Section -->
          <form onsubmit="postComment(event, ${post.id})" class="flex items-center justify-between border-t border-igDarkBorder pt-3 mt-1 relative">
            <button type="button" onclick="toggleEmojiPicker(${post.id})" class="text-igGrayText hover:text-white text-lg mr-3 focus:outline-none">
              <i class="fa-regular fa-face-smile"></i>
            </button>
            <input type="text" id="comment-input-${post.id}" placeholder="Adicione um comentário..." class="bg-transparent text-sm text-white placeholder-igGrayText focus:outline-none w-full pr-4">
            <button type="submit" class="text-xs font-semibold text-igBlue hover:text-white transition-colors shrink-0">Publicar</button>
            
            <!-- Quick Emoji Picker -->
            <div id="emoji-picker-${post.id}" class="hidden absolute left-0 bottom-12 bg-igDarkSurface border border-igDarkBorder rounded-lg p-2 flex gap-2 shadow-lg z-30">
              <span onclick="appendEmoji(${post.id}, '❤️')" class="cursor-pointer hover:scale-125 transition-transform text-lg">❤️</span>
              <span onclick="appendEmoji(${post.id}, '🔥')" class="cursor-pointer hover:scale-125 transition-transform text-lg">🔥</span>
              <span onclick="appendEmoji(${post.id}, '👏')" class="cursor-pointer hover:scale-125 transition-transform text-lg">👏</span>
              <span onclick="appendEmoji(${post.id}, '😍')" class="cursor-pointer hover:scale-125 transition-transform text-lg">😍</span>
              <span onclick="appendEmoji(${post.id}, '🚀')" class="cursor-pointer hover:scale-125 transition-transform text-lg">🚀</span>
            </div>
          </form>
        </article>
      `).join('');
    }

    // RENDER SUGGESTIONS
    function renderSuggestions() {
      const container = document.getElementById('suggestions-list');
      container.innerHTML = suggestionsData.map(s => `
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img src="${s.avatar}" class="w-9 h-9 rounded-full object-cover">
            <div class="flex flex-col">
              <span class="text-xs font-semibold text-white hover:underline cursor-pointer">${s.username}</span>
              <span class="text-[11px] text-igGrayText truncate w-36">${s.subtitle}</span>
            </div>
          </div>
          <button onclick="toggleFollow(this)" class="text-xs font-semibold text-igBlue hover:text-white transition-colors">Seguir</button>
        </div>
      `).join('');
    }

    // INTERACTIVE HELPERS
    function setActiveNav(element) {
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('text-white', 'font-semibold');
        item.classList.add('text-igGrayText');
      });
      element.classList.remove('text-igGrayText');
      element.classList.add('text-white', 'font-semibold');
    }

    function toggleLike(postId) {
      const post = postsData.find(p => p.id === postId);
      post.isLiked = !post.isLiked;
      post.likes += post.isLiked ? 1 : -1;

      const icon = document.getElementById(`like-icon-${postId}`);
      const count = document.getElementById(`like-count-${postId}`);
      
      icon.className = post.isLiked ? 'fa-solid fa-heart text-igLikeRed' : 'fa-regular fa-heart text-white hover:text-igGrayText';
      count.innerText = post.likes.toLocaleString('pt-BR');
    }

    function doubleTapLike(postId) {
      const post = postsData.find(p => p.id === postId);
      if (!post.isLiked) {
        toggleLike(postId);
      }
      const heart = document.getElementById(`heart-pop-${postId}`);
      heart.classList.remove('animate-heart-pop');
      void heart.offsetWidth; // Force Reflow
      heart.classList.add('animate-heart-pop');
    }

    function toggleSave(postId) {
      const post = postsData.find(p => p.id === postId);
      post.isSaved = !post.isSaved;
      const icon = document.getElementById(`save-icon-${postId}`);
      icon.className = post.isSaved ? 'fa-solid fa-bookmark text-white' : 'fa-regular fa-bookmark';
    }

    function focusCommentInput(postId) {
      document.getElementById(`comment-input-${postId}`).focus();
    }

    function toggleEmojiPicker(postId) {
      const picker = document.getElementById(`emoji-picker-${postId}`);
      picker.classList.toggle('hidden');
    }

    function appendEmoji(postId, emoji) {
      const input = document.getElementById(`comment-input-${postId}`);
      input.value += emoji;
      toggleEmojiPicker(postId);
      input.focus();
    }

    function postComment(e, postId) {
      e.preventDefault();
      const input = document.getElementById(`comment-input-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      const post = postsData.find(p => p.id === postId);
      post.comments.push({ username: 'seu_usuario', text });

      const container = document.getElementById(`comments-container-${postId}`);
      const commentEl = document.createElement('div');
      commentEl.innerHTML = `<span class="font-semibold text-white mr-2">seu_usuario</span><span class="text-gray-300">${text}</span>`;
      container.appendChild(commentEl);

      input.value = '';
    }

    function toggleFollow(btn) {
      if (btn.innerText === 'Seguir') {
        btn.innerText = 'Seguindo';
        btn.classList.remove('text-igBlue');
        btn.classList.add('text-gray-400');
      } else {
        btn.innerText = 'Seguir';
        btn.classList.remove('text-gray-400');
        btn.classList.add('text-igBlue');
      }
    }

    // STORY MODAL LOGIC
    let currentStoryIndex = 0;
    let storyProgressInterval = null;

    function openStoryModal(index) {
      currentStoryIndex = index;
      storiesData[index].seen = true;
      renderStories();

      const story = storiesData[index];
      document.getElementById('story-modal-avatar').src = story.avatar;
      document.getElementById('story-modal-username').innerText = story.username;
      document.getElementById('story-modal-image').src = story.image;

      document.getElementById('story-modal').classList.remove('hidden');
      startStoryProgress();
    }

    function startStoryProgress() {
      const bar = document.getElementById('story-progress-bar');
      bar.style.width = '0%';
      let progress = 0;

      clearInterval(storyProgressInterval);
      storyProgressInterval = setInterval(() => {
        progress += 2;
        bar.style.width = `${progress}%`;
        if (progress >= 100) {
          clearInterval(storyProgressInterval);
          navigateStory(1);
        }
      }, 100);
    }

    function navigateStory(direction) {
      clearInterval(storyProgressInterval);
      currentStoryIndex += direction;
      if (currentStoryIndex >= 0 && currentStoryIndex < storiesData.length) {
        openStoryModal(currentStoryIndex);
      } else {
        closeStoryModal();
      }
    }

    function closeStoryModal() {
      clearInterval(storyProgressInterval);
      document.getElementById('story-modal').classList.add('hidden');
    }

    function openCreateModal() {
      document.getElementById('create-modal').classList.remove('hidden');
    }

    function closeCreateModal() {
      document.getElementById('create-modal').classList.add('hidden');
    }

    // INITIALIZATION
    window.onload = () => {
      renderStories();
      renderPosts();
      renderSuggestions();
    };
  </script>
<script src="script.js"></script></body>
</html>
