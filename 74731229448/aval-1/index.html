
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            box-sizing: border-box;
            border-radius: 5px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .produto {
            background: #f1f5f9;
            padding: 12px;
            margin-top: 10px;
            border-radius: 5px;
        }

        .alterar {
            background: #16a34a;
        }

        .alterar:hover {
            background: #15803d;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Sistema de Estoque</h1>

    <h3>Cadastrar Produto</h3>

    <input type="number" id="codigo" placeholder="Código do produto">
    <input type="text" id="descricao" placeholder="Descrição do produto">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor do produto">

    <button onclick="cadastrarProduto()">Cadastrar Produto</button>

    <hr>

    <h3>Produtos Cadastrados</h3>

    <button onclick="listarProdutos()">Listar Produtos</button>

    <div id="lista"></div>

    <hr>

    <h3>Alterar Valor</h3>

    <input type="number" id="codigoValor" placeholder="Código do produto">
    <input type="number" id="novoValor" placeholder="Novo valor">

    <button class="alterar" onclick="alterarValor()">Alterar Valor</button>

    <hr>

    <h3>Alterar Quantidade</h3>

    <input type="number" id="codigoQuantidade" placeholder="Código do produto">
    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

    <button class="alterar" onclick="alterarQuantidade()">Alterar Quantidade</button>

</div>

<script>

    let produtos = [];

    function cadastrarProduto() {

        let codigo = Number(document.getElementById("codigo").value);
        let descricao = document.getElementById("descricao").value;
        let quantidade = Number(document.getElementById("quantidade").value);
        let valor = Number(document.getElementById("valor").value);

        if (!codigo || !descricao || quantidade < 0 || !Number.isFinite(valor) || valor < 0) {
            alert("Preencha todos os campos corretamente!");
            return;
        }

        if (produtos.some(p => p.codigo === codigo)) {
            alert("Já existe um produto com esse código!");
            return;
        }

        produtos.push({
            codigo,
            descricao,
            quantidade,
            valor
        });

        alert("Produto cadastrado com sucesso!");

        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";

        listarProdutos();
    }

    function listarProdutos() {

        let lista = document.getElementById("lista");

        lista.innerHTML = "";

        if (produtos.length === 0) {
            lista.innerHTML = "<p>Nenhum produto cadastrado.</p>";
            return;
        }

        produtos.forEach(function(produto) {

            lista.innerHTML += `
                <div class="produto">
                    <strong>Código:</strong> ${produto.codigo}<br>
                    <strong>Descrição:</strong> ${produto.descricao}<br>
                    <strong>Quantidade:</strong> ${produto.quantidade}<br>
                    <strong>Valor:</strong> R$ ${produto.valor.toFixed(2)}
                </div>
            `;

        });
    }

    function alterarValor() {

        let codigo = Number(document.getElementById("codigoValor").value);
        let novoValor = Number(document.getElementById("novoValor").value);

        let produto = produtos.find(p => p.codigo === codigo);

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (novoValor < 0 || document.getElementById("novoValor").value === "") {
            alert("Digite um valor válido!");
            return;
        }

        produto.valor = novoValor;

        alert("Valor alterado com sucesso!");

        listarProdutos();
    }

    function alterarQuantidade() {

        let codigo = Number(document.getElementById("codigoQuantidade").value);
        let novaQuantidade = Number(document.getElementById("novaQuantidade").value);

        let produto = produtos.find(p => p.codigo === codigo);

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (novaQuantidade < 0 || !Number.isInteger(novaQuantidade) ||
            document.getElementById("novaQuantidade").value === "") {
            alert("Digite uma quantidade válida!");
            return;
        }

        produto.quantidade = novaQuantidade;

        alert("Quantidade alterada com sucesso!");

        listarProdutos();
    }

</script>

<script src="script.js"></script></body>
</html>
