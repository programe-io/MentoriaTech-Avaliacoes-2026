<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>📦 Controle de Estoque</h1>

    <!-- Formulário para Cadastrar Produto -->
    <div class="card">
        <h2>Adicionar Novo Produto</h2>
        <div class="form-group">
            <input type="number" id="cad-codigo" placeholder="Código do Produto">
            <input type="text" id="cad-descricao" placeholder="Descrição/Nome">
            <input type="number" id="cad-quantidade" placeholder="Quantidade Inicial">
            <input type="number" id="cad-valor" step="0.01" placeholder="Preço (R$)">
            <button onclick="executarCadastro()">Cadastrar</button>
        </div>
    </div>

    <!-- Painel de Atualizações -->
    <div class="row">
        <!-- Alterar Preço -->
        <div class="card">
            <h2>Atualizar Preço</h2>
            <div class="form-group">
                <input type="number" id="alt-v-codigo" placeholder="Código do Produto">
                <input type="number" id="alt-v-novo" step="0.01" placeholder="Novo Preço (R$)">
                <button onclick="executarAlterarValor()">Atualizar Preço</button>
            </div>
        </div>

        <!-- Alterar Quantidade -->
        <div class="card">
            <h2>Atualizar Estoque (Qtd)</h2>
            <div class="form-group">
                <input type="number" id="alt-q-codigo" placeholder="Código do Produto">
                <input type="number" id="alt-q-nova" placeholder="Nova Quantidade">
                <button onclick="executarAlterarQuantidade()">Atualizar Qtd</button>
            </div>
        </div>
    </div>

    <!-- Tabela de Exibição dos Produtos -->
    <div class="card">
        <h2>Produtos Cadastrados</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Preço Unitário</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos">
                    <!-- Os produtos inseridos via JS aparecerão aqui -->
                </tbody>
            </table>
        </div>
    </div>
</div>

  <script src="script.js"></script>
  
</body>
</html>
