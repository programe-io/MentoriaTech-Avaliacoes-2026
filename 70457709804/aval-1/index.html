<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Controle de Estoque</h1>
            <p>Gerencie seus produtos de forma simples e rápida</p>
        </header>

        <!-- Formulário de Cadastro / Edição -->
        <section class="form-section">
            <h2 id="form-title">Adicionar Novo Produto</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">
                
                <div class="form-group">
                    <label for="name">Nome do Produto:</label>
                    <input type="text" id="name" placeholder="Ex: Teclado Mecânico" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="quantity">Quantidade:</label>
                        <input type="number" id="quantity" min="0" placeholder="0" required>
                    </div>

                    <div class="form-group">
                        <label for="price">Preço Unitário (R$):</label>
                        <input type="number" id="price" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-save" class="btn btn-primary">Salvar Produto</button>
                    <button type="button" id="btn-cancel" class="btn btn-secondary hidden">Cancelar Edição</button>
                </div>
            </form>
        </section>

        <!-- Barra de Pesquisa e Resumo -->
        <section class="controls-section">
            <input type="text" id="search-input" placeholder="Buscar produto pelo nome...">
            <div class="total-badge">
                Valor Total em Estoque: <strong id="total-stock-value">R$ 0,00</strong>
            </div>
        </section>

        <!-- Tabela de Produtos -->
        <section class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Produto</th>
                        <th>Qtd.</th>
                        <th>Preço Unit.</th>
                        <th>Subtotal</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="product-list">
                    <!-- Os itens serão inseridos aqui via JavaScript -->
                </tbody>
            </table>
            <p id="empty-message" class="empty-msg">Nenhum produto cadastrado no estoque.</p>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
