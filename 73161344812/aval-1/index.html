<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📦 Controle de Estoque</h1>

        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-cadastro">
                <div class="form-group">
                    <label for="cad-codigo">Código:</label>
                    <input type="text" id="cad-codigo" required placeholder="Ex: P001">
                </div>
                <div class="form-group">
                    <label for="cad-descricao">Descrição:</label>
                    <input type="text" id="cad-descricao" required placeholder="Ex: Teclado Mecânico">
                </div>
                <div class="form-group">
                    <label for="cad-quantidade">Quantidade:</label>
                    <input type="number" id="cad-quantidade" min="0" required placeholder="Ex: 10">
                </div>
                <div class="form-group">
                    <label for="cad-valor">Valor (R$):</label>
                    <input type="number" id="cad-valor" step="0.01" min="0" required placeholder="Ex: 150.00">
                </div>
                <button type="submit" class="btn-success">Cadastrar Produto</button>
            </form>
        </div>

        <!-- Formulários de Alteração Rápida -->
        <div class="grid-alteracoes">
            <div class="card">
                <h2>Alterar Valor</h2>
                <form id="form-alterar-valor">
                    <div class="form-group">
                        <label for="alt-val-codigo">Código do Produto:</label>
                        <input type="text" id="alt-val-codigo" required>
                    </div>
                    <div class="form-group">
                        <label for="alt-val-novo">Novo Valor (R$):</label>
                        <input type="number" id="alt-val-novo" step="0.01" min="0" required>
                    </div>
                    <button type="submit" class="btn-primary">Atualizar Valor</button>
                </form>
            </div>

            <div class="card">
                <h2>Alterar Quantidade</h2>
                <form id="form-alterar-qtd">
                    <div class="form-group">
                        <label for="alt-qtd-codigo">Código do Produto:</label>
                        <input type="text" id="alt-qtd-codigo" required>
                    </div>
                    <div class="form-group">
                        <label for="alt-qtd-novo">Nova Quantidade:</label>
                        <input type="number" id="alt-qtd-novo" min="0" required>
                    </div>
                    <button type="submit" class="btn-primary">Atualizar Qtd</button>
                </form>
            </div>
        </div>

        <!-- Listagem de Produtos -->
        <div class="card table-card">
            <h2>Produtos Cadastrados</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor Unitário</th>
                            <th>Valor Total</th>
                        </tr>
                    </thead>
                    <tbody id="lista-produtos">
                        <!-- Os produtos cadastrados entram aqui via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
