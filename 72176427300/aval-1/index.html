<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controlo de Estoque</title>
  <!-- Ligação com o arquivo CSS separado -->
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <h1>📦 Controlo de Estoque / Inventário</h1>

  <!-- Alerta de Erros de Validação -->
  <div id="errorAlert" class="error-message"></div>

  <!-- Formulário de Cadastro de Produto -->
  <div class="card">
    <h2>Entrada de Novo Produto</h2>
    <form id="formProduto">
      <div class="form-group">
        <label for="nome">Nome do Produto:</label>
        <input type="text" id="nome" placeholder="Ex: Teclado Mecânico RGB" required>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="quantidade">Quantidade Inicial:</label>
          <input type="number" id="quantidade" min="0" value="1" required>
        </div>
        
        <div class="form-group">
          <label for="preco">Preço Unitário (€):</label>
          <input type="number" id="preco" min="0.01" step="0.01" placeholder="0.00" required>
        </div>
      </div>

      <div class="form-group">
        <label for="categoria">Categoria:</label>
        <select id="categoria">
          <option value="Eletrónicos">Eletrónicos</option>
          <option value="Escritório">Escritório</option>
          <option value="Acessórios">Acessórios</option>
          <option value="Outros" selected>Outros</option>
        </select>
      </div>
      
      <button type="submit">Adicionar ao Estoque</button>
    </form>
  </div>

  <!-- Painel do Inventário Atual -->
  <div class="card">
    <h2>Produtos em Estoque</h2>
    
    <!-- Filtro de Busca Opcional -->
    <div class="form-group">
      <input type="text" id="buscaProduto" placeholder="🔍 Pesquisar produto pelo nome...">
    </div>

    <!-- Tabela de Dados (Mais adequada para estoque do que listas simples) -->
    <div class="table-container">
      <table id="tabelaEstoque">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Qtd.</th>
            <th>Preço Unitário</th>
            <th>Total em Estoque</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="listaProdutos">
          <!-- Os produtos serão injetados dinamicamente via JS aqui -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Importação do arquivo de lógica isolado -->
  <script src="estoque.js"></script>
<script src="script.js"></script></body>
</html>
