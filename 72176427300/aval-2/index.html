<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
 
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <h1>📋 Gerenciador de Tarefas</h1>

  <!-- Alerta de Erros de Validação -->
  <div id="errorAlert" class="error-message"></div>

  <!-- Formulário de Cadastro -->
  <div class="card">
    <h2>Nova Tarefa</h2>
    <form id="formTarefa">
      <div class="form-group">
        <label for="titulo">Título da Tarefa (mínimo 5 caracteres):</label>
        <input type="text" id="titulo" placeholder="Ex: Estudar algoritmos em JavaScript" required>
      </div>
      <div class="form-group">
        <label for="prioridade">Prioridade:</label>
        <select id="prioridade">
          <option value="1">1 - Alta</option>
          <option value="2">2 - Média</option>
          <option value="3" selected>3 - Baixa</option>
        </select>
      </div>
      <button type="submit">Cadastrar Tarefa</button>
    </form>
  </div>

  <!-- Lista de Tarefas -->
  <div class="card">
    <h2>Minhas Tarefas</h2>
    <div id="listaTarefas">
      <!-- As tarefas serão inseridas aqui dinamicamente pelo JavaScript -->
    </div>
  </div>

  <!-- Script com o motor lógico do projeto -->
   <script src="app.js"></script>
  <script src="script.js"></script></body>
</html>
