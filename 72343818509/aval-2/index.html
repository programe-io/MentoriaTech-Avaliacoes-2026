
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Gerenciador de Tarefas</h1>

    <h3>Cadastrar tarefa</h3>

    <input id="codigo" placeholder="Código">
    <input id="titulo" placeholder="Título da tarefa">

    <select id="prioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="listar()">Listar tarefas</button>

    <h3>Alterar tarefa</h3>

    <input id="codigoAlterar" placeholder="Código da tarefa">

    <select id="novaPrioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="alterarPrioridade()">Alterar prioridade</button>
    <button onclick="concluir()">Marcar como concluída</button>

    <div id="resultado"></div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
