
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Task Quest</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <div class="container">

                            <header>
                                        <p>✦ CENTRAL DE MISSÕES ✦</p>
                                                    <h1>Task <span>Quest</span></h1>
                                                                <p>Organize suas missões e complete seus objetivos!</p>
                                                                        </header>

                                                                                <section class="resumo">
                                                                                            <div class="card-resumo">
                                                                                                            <h2 id="total">0</h2>
                                                                                                                            <p>Total</p>
                                                                                                                                        </div>

                                                                                                                                                    <div class="card-resumo">
                                                                                                                                                                    <h2 id="pendentes">0</h2>
                                                                                                                                                                                    <p>Pendentes</p>
                                                                                                                                                                                                </div>

                                                                                                                                                                                                            <div class="card-resumo">
                                                                                                                                                                                                                            <h2 id="feitas">0</h2>
                                                                                                                                                                                                                                            <p>Concluídas</p>
                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                        <section class="progresso">
                                                                                                                                                                                                                                                                                    <p>Progresso das missões: <span id="porcentagem">0%</span></p>

                                                                                                                                                                                                                                                                                                <div class="barra">
                                                                                                                                                                                                                                                                                                                <div id="preenchimento"></div>
                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                            <section class="cadastro">
                                                                                                                                                                                                                                                                                                                                                        <h2>Nova missão</h2>

                                                                                                                                                                                                                                                                                                                                                                    <input type="text" id="titulo" placeholder="Digite sua missão">

                                                                                                                                                                                                                                                                                                                                                                                <select id="prioridade">
                                                                                                                                                                                                                                                                                                                                                                                                <option value="1">Prioridade baixa</option>
                                                                                                                                                                                                                                                                                                                                                                                                                <option value="2">Prioridade média</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="3">Prioridade alta</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                            </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="adicionar()">+ Adicionar missão</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <section class="tarefas">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2>Minhas missões</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="filtros">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button class="selecionado" onclick="filtrar('todas', this)">Todas</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="filtrar('pendentes', this)">Pendentes</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="filtrar('feitas', this)">Concluídas</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="lista"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
