
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Pessoas e IMC</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Cadastro de Pessoas</h1>

        <h2>Adicionar Pessoa</h2>

        <form id="form-pessoa">

            <input
                type="text"
                id="input-nome"
                placeholder="Digite o nome"
                required
            >

            <input
                type="number"
                id="input-idade"
                placeholder="Idade"
                min="1"
                max="120"
                required
            >

            <input
                type="number"
                id="input-altura"
                placeholder="Altura (ex: 1.75)"
                min="0.5"
                max="2.5"
                step="0.01"
                required
            >

            <input
                type="number"
                id="input-peso"
                placeholder="Peso (kg)"
                min="2"
                max="500"
                step="0.1"
                required
            >

            <p id="erro" hidden></p>

            <button type="submit">
                Cadastrar Pessoa
            </button>

        </form>

        <h2>Pessoas Cadastradas</h2>

        <table>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Altura</th>
                    <th>Peso</th>
                    <th>IMC</th>
                    <th>Classificação</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tabela-pessoas">

                <tr>
                    <td colspan="7">
                        Nenhuma pessoa cadastrada ainda.
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
