
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f2f5;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .formulario {
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .mensagem {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
                overflow-x: auto;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Sistema de Estoque</h1>

    <div class="formulario">

        <h2>Cadastrar Produto</h2>

        <input type="number" id="codigo" placeholder="Código do produto">

        <input type="text" id="descricao" placeholder="Descrição do produto">

        <input type="number" id="quantidade" placeholder="Quantidade">

        <input type="number" id="valor" placeholder="Valor do produto" step="0.01">

        <button onclick="cadastrarProduto()">Cadastrar Produto</button>

    </div>

    <hr>

    <h2>Alterar Produto</h2>

    <input type="number" id="codigoAlterar" placeholder="Código do produto">

    <input type="number" id="novoValor" placeholder="Novo valor" step="0.01">

    <button onclick="alterarValor()">Alterar Valor</button>

    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    <hr>

    <h2>Produtos Cadastrados</h2>

    <button onclick="listarProdutos()">Listar Produtos</button>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
            </tr>
        </thead>

        <tbody id="tabelaProdutos">
        </tbody>
    </table>

    <p class="mensagem" id="mensagem"></p>

</div>

<script>

    let produtos = [];

    // Cadastrar produto
    function cadastrarProduto() {

        let codigo = Number(document.getElementById("codigo").value);
        let descricao = document.getElementById("descricao").value;
        let quantidade = Number(document.getElementById("quantidade").value);
        let valor = Number(document.getElementById("valor").value);

        if (
            document.getElementById("codigo").value === "" ||
            descricao.trim() === "" ||
            document.getElementById("quantidade").value === "" ||
            document.getElementById("valor").value === ""
        ) {
            alert("Preencha todos os campos!");
            return;
        }

        let existe = produtos.find(p => p.codigo === codigo);

        if (existe) {
            alert("Já existe um produto com esse código!");
            return;
        }

        if (codigo <= 0 || quantidade < 0 || valor < 0) {
            alert("Digite valores válidos!");
            return;
        }

        produtos.push({
            codigo: codigo,
            descricao: descricao,
            quantidade: quantidade,
            valor: valor
        });

        alert("Produto cadastrado com sucesso!");

        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";

        listarProdutos();
    }

    // Listar produtos
    function listarProdutos() {

        let tabela = document.getElementById("tabelaProdutos");

        tabela.innerHTML = "";

        if (produtos.length === 0) {
            tabela.innerHTML = `
                <tr>
                    <td colspan="4">Nenhum produto cadastrado!</td>
                </tr>
            `;
            return;
        }

        produtos.forEach(produto => {

            tabela.innerHTML += `
                <tr>
                    <td>${produto.codigo}</td>
                    <td>${produto.descricao}</td>
                    <td>${produto.quantidade}</td>
                    <td>R$ ${produto.valor.toFixed(2)}</td>
                </tr>
            `;

        });
    }

    // Alterar valor
    function alterarValor() {

        let codigo = Number(document.getElementById("codigoAlterar").value);
        let novoValor = document.getElementById("novoValor").value;

        let produto = produtos.find(p => p.codigo === codigo);

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (novoValor === "" || Number(novoValor) < 0) {
            alert("Digite um valor válido!");
            return;
        }

        produto.valor = Number(novoValor);

        alert("Valor alterado com sucesso!");

        listarProdutos();

        document.getElementById("novoValor").value = "";
    }

    // Alterar quantidade
    function alterarQuantidade() {

        let codigo = Number(document.getElementById("codigoAlterar").value);
        let novaQuantidade = document.getElementById("novaQuantidade").value;

        let produto = produtos.find(p => p.codigo === codigo);

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (novaQuantidade === "" || Number(novaQuantidade) < 0) {
            alert("Digite uma quantidade válida!");
            return;
        }

        produto.quantidade = Number(novaQuantidade);

        alert("Quantidade alterada com sucesso!");

        listarProdutos();

        document.getElementById("novaQuantidade").value = "";
    }

</script>

</body>
</html>
