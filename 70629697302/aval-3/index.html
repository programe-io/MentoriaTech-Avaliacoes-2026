
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Controle de IMC</h1>
        <p>Preencha os dados do paciente abaixo:</p>

        <form id="formIMC">

            <label for="nome">Nome do Paciente:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" placeholder="Ex: 70" step="0.1" required>

            <label for="altura">Altura (metros):</label>
            <input type="number" id="altura" placeholder="Ex: 1.70" step="0.01" required>

            <button type="button" onclick="calcularIMC()">
                Calcular IMC
            </button>

        </form>

        <p id="erro"></p>

        <div id="resultado" style="display: none;">
            <h2>Resultado do IMC</h2>
            <p id="mensagem"></p>
        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
