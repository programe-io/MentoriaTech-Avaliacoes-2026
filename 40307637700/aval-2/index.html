<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <title>Lista de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
    <body>
      <div class="container">
          <h1>Lista de Tarefas</h1>
              <p class="subtitulo">Organize suas tarefas por prioridade</p>

                  <form id="form-tarefa">
                        <label for="titulo">Título da tarefa</label>
                              <input type="text" id="titulo" placeholder="Ex: Cadastrar Clientes">

                                    <label for="prioridade">Prioridade (1 a 3)</label>
                                          <select id="prioridade">
                                                  <option value="1">1 - Baixa</option>
                                                          <option value="2">2 - Média</option>
                                                                  <option value="3">3 - Alta</option>
                                                                        </select>

                                                                              <button type="submit">Cadastrar Tarefa</button>
                                                                                  </form>

                                                                                      <ul id="lista-tarefas"></ul>
                                                                                          <p id="mensagem-vazia" class="mensagem-vazia">Nenhuma tarefa cadastrada.</p>
                                                                                            </div>
                                                                                            <script src="script.js"></script></body>
                                                                                            </html>
