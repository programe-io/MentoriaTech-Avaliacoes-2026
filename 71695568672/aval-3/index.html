<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Corporativo</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📋 Gerenciador de Tarefas</h1>
        
        <!-- Formulário de Cadastro e Alteração -->
        <div class="card">
            <h2>Cadastrar / Alterar Tarefa</h2>
            <form id="form-tarefa">
                <input type="hidden" id="tarefa-id">
                
                <div class="form-group">
                    <label for="descricao">Descrição da Tarefa:</label>
                    <input type="text" id="descricao" placeholder="Ex: Redigir relatório mensal de vendas">
                </div>
                
                <div class="form-group">
                    <label for="prioridade">Prioridade:</label>
                    <select id="prioridade">
                        <option value="">Selecione...</option>
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>
                
                <div class="btn-group">
                    <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar Tarefa</button>
                    <button type="button" id="btn-cancelar" class="btn btn-secondary" style="display: none;">Cancelar Edição</button>
                </div>
            </form>
        </div>

        <!-- Listagem das Tarefas -->
        <div class="card">
            <h2>Lista de Atividades</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Status</th>
                            <th>Descrição</th>
                            <th>Prioridade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-tarefas">
                        <!-- Inserido dinamicamente pelo JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
