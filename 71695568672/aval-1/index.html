<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📦 Controle de Estoque</h1>

        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-produto">
                <div class="form-group">
                    <label for="descricao">Descrição do Produto:</label>
                    <input type="text" id="descricao" placeholder="Ex: Notebook Gamer" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="quantidade">Quantidade:</label>
                        <input type="number" id="quantidade" min="0" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label for="valor">Valor Unitário (R$):</label>
                        <input type="number" id="valor" min="0.01" step="0.01" placeholder="0.00" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Adicionar Produto</button>
            </form>
        </div>

        <!-- Tabela de Produtos -->
        <div class="card">
            <h2>📋 Produtos em Estoque</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor Unitário</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos">
                        <!-- Os produtos cadastrados vão aparecer aqui dinamicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
