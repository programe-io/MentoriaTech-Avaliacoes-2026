<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rotina Escolar — Andressa de Miranda Rocha</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --p1-bg: #fee2e2;
      --p1-text: #b91c1c;
      --p2-bg: #fef3c7;
      --p2-text: #b45309;
      --p3-bg: #dcfce7;
      --p3-text: #15803d;
      --done-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.18);
    }

    header h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }

    header p {
      font-size: 0.98rem;
      opacity: 0.92;
    }

    .grid-top {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .grid-top {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 14px;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    input, select, button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    .msg-erro {
      color: #b91c1c;
      background: #fee2e2;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-top: 10px;
      display: none;
    }

    .dias-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .dia-btn {
      width: auto;
      padding: 8px 14px;
      background: #e2e8f0;
      color: var(--text);
      font-size: 0.88rem;
    }

    .dia-btn.ativo {
      background: var(--primary);
      color: #fff;
    }

    .tarefa-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
      background: #fff;
    }

    .tarefa-item.concluida {
      background: var(--done-bg);
      opacity: 0.78;
    }

    .tarefa-item.concluida .titulo-tarefa {
      text-decoration: line-through;
      color: var(--muted);
    }

    .meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .p-1 { background: var(--p1-bg); color: var(--p1-text); }
    .p-2 { background: var(--p2-bg); color: var(--p2-text); }
    .p-3 { background: var(--p3-bg); color: var(--p3-text); }

    .acoes {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .acoes select {
      width: auto;
      padding: 7px 10px;
      font-size: 0.85rem;
    }

    .btn-concluir {
      width: auto;
      padding: 7px 12px;
      font-size: 0.85rem;
      background: #16a34a;
    }

    .btn-concluir:hover {
      background: #15803d;
    }

    .btn-concluir:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <h1>Rotina Escolar Semanal</h1>
      <p><strong>Estudante:</strong> Andressa de Miranda Rocha • Controle de aulas, estudos e entregas</p>
    </header>

    <div class="grid-top">
      <section class="card">
        <h2>Cadastrar Nova Atividade Escolar</h2>
        <form id="formTarefa">
          <div class="form-group">
            <label for="diaSemana">Dia da Semana</label>
            <select id="diaSemana">
              <option value="Segunda-feira">Segunda-feira</option>
              <option value="Terça-feira">Terça-feira</option>
              <option value="Quarta-feira">Quarta-feira</option>
              <option value="Quinta-feira">Quinta-feira</option>
              <option value="Sexta-feira">Sexta-feira</option>
            </select>
          </div>

          <div class="form-group">
            <label for="titulo">Título da Tarefa (mín. 5 caracteres)</label>
            <input type="text" id="titulo" placeholder="Ex.: Resolver lista de Matemática" required />
          </div>

          <div class="form-group">
            <label for="prioridade">Prioridade (1 = Alta, 2 = Média, 3 = Baixa)</label>
            <select id="prioridade">
              <option value="1">1 - Alta</option>
              <option value="2">2 - Média</option>
              <option value="3">3 - Baixa</option>
            </select>
          </div>

          <button type="submit">Adicionar à Rotina</button>
          <div id="msgErro" class="msg-erro"></div>
        </form>
      </section>

      <section class="card">
        <h2>Resumo da Semana</h2>
        <p id="resumoTexto" style="line-height: 1.6; color: var(--muted);">
          Selecione um dia da semana abaixo para filtrar as atividades de <strong>Andressa de Miranda Rocha</strong>.
        </p>
      </section>
    </div>

    <section class="card">
      <h2>Cronograma e Tarefas</h2>
      <div class="dias-bar" id="diasBar"></div>
      <div id="listaTarefas"></div>
    </section>
  </div>

  <script>
    class GerenciadorTarefas {
      constructor() {
        this.tarefas = [];
        this.proximoCodigo = 1;
      }

      validarTitulo(titulo) {
        if (typeof titulo !== "string" || titulo.trim().length < 5) {
          throw new Error("O título deve ter no mínimo 5 caracteres.");
        }
      }

      validarPrioridade(prioridade) {
        const numero = Number(prioridade);
        if (!Number.isInteger(numero) || numero < 1 || numero > 3) {
          throw new Error("A prioridade deve ser um valor entre 1 (alta) e 3 (baixa).");
        }
      }

      cadastrarTarefa(titulo, prioridade, diaSemana) {
        this.validarTitulo(titulo);
        this.validarPrioridade(prioridade);

        const tarefa = {
          codigo: this.proximoCodigo++,
          titulo: titulo.trim(),
          prioridade: Number(prioridade),
          concluida: false,
          diaSemana
        };

        this.tarefas.push(tarefa);
        return tarefa;
      }

      listarTarefas(filtroDia = "Todos") {
        if (filtroDia === "Todos") return [...this.tarefas];
        return this.tarefas.filter((t) => t.diaSemana === filtroDia);
      }

      marcarComoConcluida(codigo) {
        const tarefa = this.tarefas.find((t) => t.codigo === Number(codigo));
        if (!tarefa) throw new Error("Tarefa não encontrada.");
        tarefa.concluida = true;
        return tarefa;
      }

      alterarPrioridade(codigo, novaPrioridade) {
        this.validarPrioridade(novaPrioridade);
        const tarefa = this.tarefas.find((t) => t.codigo === Number(codigo));
        if (!tarefa) throw new Error("Tarefa não encontrada.");
        tarefa.prioridade = Number(novaPrioridade);
        return tarefa;
      }
    }

    const gerenciador = new GerenciadorTarefas();
    const diasSemana = ["Todos", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira"];
    let diaSelecionado = "Todos";

    const rotinasIniciais = [
      ["Segunda-feira", "07:30 - Aula de Matemática e revisão de funções", 1],
      ["Segunda-feira", "14:00 - Fazer resumo de História", 2],
      ["Terça-feira", "07:30 - Aula de Português e redação dissertativa", 1],
      ["Terça-feira", "15:30 - Leitura de livro paradidático", 3],
      ["Quarta-feira", "07:30 - Aula de Biologia e laboratório", 2],
      ["Quarta-feira", "16:00 - Exercícios de Química orgânica", 1],
      ["Quinta-feira", "07:30 - Aula de Geografia e atualidades", 2],
      ["Quinta-feira", "15:00 - Prática de Inglês e vocabulário", 3],
      ["Sexta-feira", "07:30 - Aula de Física e resolução de provas", 1],
      ["Sexta-feira", "14:30 - Organizar materiais e cadernos da semana", 3]
    ];

    rotinasIniciais.forEach(([dia, titulo, prio]) => {
      gerenciador.cadastrarTarefa(titulo, prio, dia);
    });

    const diasBar = document.getElementById("diasBar");
    const listaTarefas = document.getElementById("listaTarefas");
    const formTarefa = document.getElementById("formTarefa");
    const msgErro = document.getElementById("msgErro");
    const resumoTexto = document.getElementById("resumoTexto");

    function nomePrioridade(p) {
      if (p === 1) return "1 - Alta";
      if (p === 2) return "2 - Média";
      return "3 - Baixa";
    }

    function renderDias() {
      diasBar.innerHTML = "";
      diasSemana.forEach((dia) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `dia-btn ${diaSelecionado === dia ? "ativo" : ""}`;
        btn.textContent = dia;
        btn.onclick = () => {
          diaSelecionado = dia;
          renderDias();
          renderTarefas();
        };
        diasBar.appendChild(btn);
      });
    }

    function renderTarefas() {
      const todas = gerenciador.listarTarefas();
      const concluidas = todas.filter((t) => t.concluida).length;
      resumoTexto.innerHTML = `
        <strong>Aluna:</strong> Andressa de Miranda Rocha<br/>
        <strong>Total de atividades:</strong> ${todas.length} | <strong>Concluídas:</strong> ${concluidas} | <strong>Pendentes:</strong> ${todas.length - concluidas}
      `;

      const filtradas = gerenciador.listarTarefas(diaSelecionado);
      if (filtradas.length === 0) {
        listaTarefas.innerHTML = `<p style="color: var(--muted);">Nenhuma atividade cadastrada para ${diaSelecionado}.</p>`;
        return;
      }

      listaTarefas.innerHTML = filtradas.map((t) => `
        <div class="tarefa-item ${t.concluida ? "concluida" : ""}">
          <div>
            <span class="badge p-${t.prioridade}">${nomePrioridade(t.prioridade)}</span>
            <strong class="titulo-tarefa" style="margin-left: 8px;">${t.titulo}</strong>
            <div class="meta">
              Código: #${t.codigo} • Dia: ${t.diaSemana} • Status: ${t.concluida ? "Concluída" : "Pendente"}
            </div>
          </div>
          <div class="acoes">
            <select aria-label="Alterar prioridade" onchange="onAlterarPrioridade(${t.codigo}, this.value)">
              <option value="1" ${t.prioridade === 1 ? "selected" : ""}>Prioridade 1 (Alta)</option>
              <option value="2" ${t.prioridade === 2 ? "selected" : ""}>Prioridade 2 (Média)</option>
              <option value="3" ${t.prioridade === 3 ? "selected" : ""}>Prioridade 3 (Baixa)</option>
            </select>
            <button
              type="button"
              class="btn-concluir"
              ${t.concluida ? "disabled" : ""}
              onclick="onConcluir(${t.codigo})"
            >
              ${t.concluida ? "Concluída" : "Concluir"}
            </button>
          </div>
        </div>
      `).join("");
    }

    window.onConcluir = (codigo) => {
      gerenciador.marcarComoConcluida(codigo);
      renderTarefas();
    };

    window.onAlterarPrioridade = (codigo, novaPrioridade) => {
      try {
        msgErro.style.display = "none";
        gerenciador.alterarPrioridade(codigo, novaPrioridade);
        renderTarefas();
      } catch (err) {
        msgErro.textContent = err.message;
        msgErro.style.display = "block";
      }
    };

    formTarefa.addEventListener("submit", (e) => {
      e.preventDefault();
      msgErro.style.display = "none";

      const dia = document.getElementById("diaSemana").value;
      const titulo = document.getElementById("titulo").value;
      const prioridade = document.getElementById("prioridade").value;

      try {
        gerenciador.cadastrarTarefa(titulo, prioridade, dia);
        document.getElementById("titulo").value = "";
        renderTarefas();
      } catch (err) {
        msgErro.textContent = err.message;
        msgErro.style.display = "block";
      }
    });

    renderDias();
    renderTarefas();
  </script>
<script src="script.js"></script></body>
</html>
