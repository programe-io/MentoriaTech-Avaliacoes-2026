<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Perfil - Instagram Clone</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <div class="app">

              <!-- Topo -->
                  <header class="topbar">
                        <button class="icon-btn" aria-label="Criar">
                                <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>
                                      </button>
                                            <button class="username">
                                                    rhyann_xp
                                                            <svg viewBox="0 0 24 24" class="chev"><path d="M6 9l6 6 6-6"/></svg>
                                                                  </button>
                                                                        <div class="top-right">
                                                                                <button class="icon-btn" aria-label="Threads">
                                                                                          <svg viewBox="0 0 24 24"><path d="M17.5 9.5C16.8 6.8 14.8 5.5 12 5.5c-3.3 0-5.5 2.4-5.5 6.5s2.2 6.5 5.5 6.5c2.6 0 4.5-1.4 4.5-3.5 0-2.3-2.2-3.2-4.2-3.2-1.6 0-2.6.7-2.6 1.7 0 .9.8 1.5 1.9 1.5 1.7 0 2.9-1.1 2.9-3.6"/></svg>
                                                                                                  </button>
                                                                                                          <button class="icon-btn" aria-label="Menu">
                                                                                                                    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                                                                                                                            </button>
                                                                                                                                  </div>
                                                                                                                                      </header>

                                                                                                                                          <!-- Perfil -->
                                                                                                                                              <section class="profile">
                                                                                                                                                    <div class="avatar-wrap">
                                                                                                                                                            <div class="note">Não consigo decidir…</div>
                                                                                                                                                                    <div class="avatar"></div>
                                                                                                                                                                            <span class="avatar-plus">+</span>
                                                                                                                                                                                  </div>

                                                                                                                                                                                        <div class="info">
                                                                                                                                                                                                <h1 class="name">Rhyan</h1>
                                                                                                                                                                                                        <div class="stats">
                                                                                                                                                                                                                  <div><strong>0</strong><span>posts</span></div>
                                                                                                                                                                                                                            <div><strong>423</strong><span>seguidores</span></div>
                                                                                                                                                                                                                                      <div><strong>564</strong><span>seguindo</span></div>
                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                            <section class="bio">
                                                                                                                                                                                                                                                                  <p class="pronoun">Pi</p>
                                                                                                                                                                                                                                                                        <p class="bio-text">Abençoado! 👑</p>
                                                                                                                                                                                                                                                                              <p class="bio-date">2009/06/07</p>
                                                                                                                                                                                                                                                                                    <button class="chip">+ Adicionar banners</button>
                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                            <!-- Painel -->
                                                                                                                                                                                                                                                                                                <section class="dashboard">
                                                                                                                                                                                                                                                                                                      <h2>Seu painel</h2>
                                                                                                                                                                                                                                                                                                            <p>2,2 mil visualizações nos últimos 30 dias.</p>
                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                    <!-- Botões -->
                                                                                                                                                                                                                                                                                                                        <section class="actions">
                                                                                                                                                                                                                                                                                                                              <button class="btn">Editar perfil</button>
                                                                                                                                                                                                                                                                                                                                    <button class="btn">Compartilhar perfil</button>
                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                            <!-- Destaques -->
                                                                                                                                                                                                                                                                                                                                                <section class="highlights">
                                                                                                                                                                                                                                                                                                                                                      <div class="highlight">
                                                                                                                                                                                                                                                                                                                                                              <div class="hl-circle hl-new"><span>+</span></div>
                                                                                                                                                                                                                                                                                                                                                                      <p>Novo</p>
                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                  <div class="highlight">
                                                                                                                                                                                                                                                                                                                                                                                          <div class="hl-circle hl-ring"><div class="hl-img"></div></div>
                                                                                                                                                                                                                                                                                                                                                                                                  <p>Mó paz ☁️</p>
                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Abas -->
                                                                                                                                                                                                                                                                                                                                                                                                                    <nav class="tabs">
                                                                                                                                                                                                                                                                                                                                                                                                                          <button class="tab active" aria-label="Posts">
                                                                                                                                                                                                                                                                                                                                                                                                                                  <svg viewBox="0 0 24 24" class="fill"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="9.5" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><rect x="16" y="9.5" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="9.5" y="16" width="5" height="5" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/></svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                              <button class="tab" aria-label="Reels">
                                                                                                                                                                                                                                                                                                                                                                                                                                                      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M10 8.5v7l5.5-3.5z"/></svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <button class="tab" aria-label="Republicações">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <svg viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h10l-3-3M20 13v2a3 3 0 0 1-3 3H7l3 3"/></svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button class="tab" aria-label="Marcados">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><circle cx="12" cy="11" r="2.5"/><path d="M7.5 18c.8-2 2.4-3 4.5-3s3.7 1 4.5 3M9 5V3.5h6V5"/></svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </nav>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Estado vazio -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <section class="empty">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="illustration">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="ill-top"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="ill-curtain left"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="ill-curtain right"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="ill-card"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="ill-cloud"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Navegação inferior -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <footer class="bottom-nav">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button aria-label="Início">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button aria-label="Reels">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M10 8.5v7l5.5-3.5z"/></svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button aria-label="Mensagens" class="has-dot">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <svg viewBox="0 0 24 24"><path d="M21 3L3 10l7 3 3 7z"/></svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <button aria-label="Buscar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button aria-label="Perfil" class="nav-profile">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="mini-avatar"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </html>
