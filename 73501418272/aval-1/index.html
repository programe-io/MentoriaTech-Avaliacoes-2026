<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Controle de produtos</p>
    </header>

    <main>
        <section class="painel">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">
                <input type="text" id="nome" placeholder="Nome do produto" required>
                <input type="text" id="codigo" placeholder="Código" required>
                <input type="number" id="quantidade" placeholder="Quantidade" min="0" required>
                <input type="number" id="preco" placeholder="Preço" min="0" step="0.01" required>

                <button type="submit" id="botaoSalvar">Adicionar Produto</button>
            </form>
        </section>

        <section class="painel">
            <h2>Estoque de Produtos</h2>

            <input type="search" id="pesquisa" placeholder="Pesquisar produto...">

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Código</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
