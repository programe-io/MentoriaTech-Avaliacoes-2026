<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <header>
            <h1>Ficha de Anamnese</h1>
            <p>Cadastro e histórico do paciente</p>
        </header>

        <form id="formAnamnese">

            <h2>1. Dados pessoais</h2>

            <div class="grid">
                <label>Nome completo
                    <input type="text" id="nome" required>
                </label>

                <label>Data de nascimento
                    <input type="date" id="nascimento">
                </label>

                <label>Telefone
                    <input type="tel" id="telefone">
                </label>

                <label>E-mail
                    <input type="email" id="email">
                </label>

                <label>Profissão
                    <input type="text" id="profissao">
                </label>

                <label>Estado civil
                    <select id="estadoCivil">
                        <option value="">Selecione</option>
                        <option>Solteiro(a)</option>
                        <option>Casado(a)</option>
                        <option>Divorciado(a)</option>
                        <option>Viúvo(a)</option>
                    </select>
                </label>
            </div>

            <h2>2. Histórico de saúde</h2>

            <label>Possui alguma doença ou condição de saúde?
                <textarea id="doencas" rows="3"></textarea>
            </label>

            <label>Faz uso de medicamentos?
                <textarea id="medicamentos" rows="3"></textarea>
            </label>

            <label>Possui alergias? Quais?
                <textarea id="alergias" rows="3"></textarea>
            </label>

            <label>Já realizou alguma cirurgia?
                <textarea id="cirurgias" rows="3"></textarea>
            </label>

            <h2>3. Hábitos e rotina</h2>

            <label>Pratica atividades físicas?
                <select id="atividade">
                    <option value="">Selecione</option>
                    <option>Sim</option>
                    <option>Não</option>
                    <option>Às vezes</option>
                </select>
            </label>

            <label>Como considera sua alimentação?
                <select id="alimentacao">
                    <option value="">Selecione</option>
                    <option>Boa</option>
                    <option>Regular</option>
                    <option>Precisa melhorar</option>
                </select>
            </label>

            <label>Como está a qualidade do seu sono?
                <select id="sono">
                    <option value="">Selecione</option>
                    <option>Boa</option>
                    <option>Regular</option>
                    <option>Ruim</option>
                </select>
            </label>

            <h2>4. Informações adicionais</h2>

            <label>Queixa principal ou motivo da consulta
                <textarea id="queixa" rows="4"></textarea>
            </label>

            <label>Observações
                <textarea id="observacoes" rows="4"></textarea>
            </label>

            <div class="botoes">
                <button type="submit">Salvar ficha</button>
                <button type="button" class="imprimir" onclick="window.print()">Imprimir</button>
                <button type="reset" class="limpar">Limpar</button>
            </div>

        </form>

        <section class="registros">
            <h2>Fichas cadastradas</h2>
            <div id="listaFichas"></div>
        </section>

        <p class="aviso">
            As informações são confidenciais. Utilize este sistema apenas com
            autorização e mantenha os dados protegidos.
        </p>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
