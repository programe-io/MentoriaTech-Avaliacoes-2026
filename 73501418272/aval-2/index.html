<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📋 Gerenciador de Tarefas</h1>
        <p>Organize suas atividades diariamente</p>
    </header>

    <main>
        <section class="painel">
            <h2>Adicionar Nova Tarefa</h2>

            <form id="formTarefa">
                <input type="text" id="titulo" placeholder="Nome da tarefa" required>

                <input type="date" id="prazo" required>

                <select id="prioridade">
                    <option value="Baixa">Baixa</option>
                    <option value="Média">Média</option>
                    <option value="Alta">Alta</option>
                </select>

                <button type="submit" id="botaoSalvar">
                    Adicionar Tarefa
                </button>
            </form>
        </section>

        <section class="painel">
            <h2>Minhas Tarefas</h2>

            <input type="search" id="pesquisa" placeholder="Pesquisar tarefa...">

            <div class="filtros">
                <button data-filtro="Todas">Todas</button>
                <button data-filtro="Pendentes">Pendentes</button>
                <button data-filtro="Concluídas">Concluídas</button>
            </div>

            <div id="listaTarefas"></div>
        </section>
    </main>

    <footer>
        <p>Gerenciador de Tarefas © 2026</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
