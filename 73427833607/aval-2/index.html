
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Estoque</title>
  <link rel="stylesheet" href="avaliacao2.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Gerenciador de Estoque</h1>
    <form id="formProduto">
      <input id="nome" type="text" placeholder="Nome do produto" required>
      <input id="quantidade" type="number" min="1" placeholder="Quantidade" required>
      <input id="preco" type="number" min="0.01" step="0.01" placeholder="Preço (R$)" required>
      <button type="submit">Adicionar produto</button>
    </form>

    <p id="mensagem" aria-live="polite"></p>

    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Qtd.</th>
            <th>Preço</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>

    <h2>Valor total do estoque: <span id="total">R$ 0,00</span></h2>
  </main>
  <script src="avaliacao2.js"></script>
<script src="script.js"></script></body>
</html>
