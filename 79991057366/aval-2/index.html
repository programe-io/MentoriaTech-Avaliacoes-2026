<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Feed - </title>
  
 
  <script src="https://cdn.tailwindcss.com"></script>
  
  
  <link rel="stylesheet" href="style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  
  <main class="max-w-xl mx-auto space-y-6">

    
    <header class="flex items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <h1 class="text-xl font-bold text-gray-800">Meu Feed</h1>
      <span class="text-sm bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-medium">
        Tailwind CSS
      </span>
    </header>

    
    <article class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
      
      
      <div class="flex items-center justify-between p-4 border-b border-gray-100">
        <div class="flex items-center space-x-3">
          <img class="w-10 h-10 rounded-full object-cover" src="https://i.pravatar.cc/150?img=12" alt="Avatar Ana">
          <div>
            <h2 class="text-sm font-semibold text-gray-900">Ana Silva</h2>
            <p class="text-xs text-gray-500">Desenvolvedora Frontend</p>
          </div>
        </div>
        <span class="text-xs text-gray-400">Há 2h</span>
      </div>

      
      <div class="p-4 space-y-3">
        <p class="text-gray-700 text-sm leading-relaxed">
          Praticando alinhamento com <code class="tag-code">flex</code> e espaçamento com <code class="tag-code">space-y</code> e <code class="tag-code">space-x</code> no Tailwind CSS! 🚀
        </p>
        
        <div class="rounded-lg overflow-hidden border border-gray-100">
          <img class="w-full h-48 object-cover" src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=600&q=80" alt="Workspace">
        </div>
      </div>

      
      <div class="flex items-center justify-between px-4 py-3 bg-gray-50 border-t border-gray-100 text-xs text-gray-600">
        <button class="btn-action">
          <span>❤️</span>
          <span class="font-medium">24 Curtidas</span>
        </button>
        <button class="btn-action">
          <span>💬</span>
          <span class="font-medium">5 Comentários</span>
        </button>
        <button class="btn-action">
          <span>🔄</span>
          <span class="font-medium">Compartilhar</span>
        </button>
      </div>

    </article>

    
    <article class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3">
      <div class="flex items-center space-x-3">
        <img class="w-10 h-10 rounded-full object-cover" src="https://i.pravatar.cc/150?img=33" alt="Avatar Lucas">
        <div>
          <h2 class="text-sm font-semibold text-gray-900">Lucas Costa</h2>
          <p class="text-xs text-gray-400">Há 5h</p>
        </div>
      </div>
      <p class="text-gray-700 text-sm leading-relaxed">
        Dica: use <code class="tag-code">mx-auto</code> para centralizar containers e <code class="tag-code">items-center</code> para alinhar ícones e textos na mesma linha.
      </p>
    </article>

  </main>

</body>
</html>
