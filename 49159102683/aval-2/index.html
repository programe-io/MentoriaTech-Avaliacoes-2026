<head>

  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA Sports FC 27 - Ultimate Team Market</title>
    <style>
        :root {
            --primary: #1f2232;
            --accent: #d4af37; /* Cor dourada estilo carta TOTY/Icon */
            --accent-hover: #b89728;
            --danger: #ff4757;
            --bg: #0b0e14;
            --card-bg: #161b22;
            --text-light: #ffffff;
            --text-muted: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-light);
            padding-bottom: 50px;
        }

        /* Header estilo FC Ultimate Team */
        header {
            background: linear-gradient(135deg, #111422 0%, #1a1f35 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: var(--text-light);
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 1.1rem;
        }

        /* Barra de Saldo Fixo (Coins) */
        .coins-bar {
            position: sticky;
            top: 0;
            background: linear-gradient(90deg, #1f2232, #2d324f);
            color: var(--accent);
            text-align: center;
            padding: 15px;
            font-size: 1.8rem;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 1000;
            border-bottom: 1px solid var(--accent);
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            border-left: 5px solid var(--accent);
            padding-left: 10px;
        }

        /* Grid de Cartas */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        /* Estilo de Carta do UT */
        .player-card {
            background: linear-gradient(145deg, #222738, #161b22);
            border-radius: 12px;
            border: 2px solid var(--accent);
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        .player-card:hover {
            transform: translateY(-5px);
        }

        .player-rating {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent);
        }

        .player-position {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .player-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .player-price {
            font-size: 1.1rem;
            color: #2ed573;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Meu Elenco (Carrinho) */
        .squad-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #30363d;
        }

        .squad-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .squad-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #30363d;
        }

        .squad-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent);
            border-top: 2px solid var(--accent);
            padding-top: 15px;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .coins-bar { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>EA Sports <span>FC 27</span></h1>
        <p>Ultimate Team Market & Squad Builder</p>
    </header>

    <!-- Barra de Moedas (Coins) -->
    <div class="coins-bar" id="coins-display">
        🪙 10.000.000 Coins
    </div>

    <div class="container">
        <h2 class="section-title">Mercado de Transferências</h2>
        
        <!-- Grid de Jogadores Disponíveis -->
        <div class="market-grid" id="market-grid"></div>

        <!-- Meu Elenco / Time
  <script src="script.js"></script>
  
</body>
</html>
