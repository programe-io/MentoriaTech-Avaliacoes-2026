<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="header-content">

            <h1>🏛️ MiniFeed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>

        </div>
    </header>


    <main>

        <!-- Área de publicação -->
        <section class="publicar">

            <div class="avatar">
                T
            </div>

            <strong>Tandhara</strong>

            <span>O que você está pensando?</span>

            <button>Publicar</button>

        </section>


        <!-- Publicação -->
        <article class="post">

            <div class="post-header">

                <div class="avatar">
                    M
                </div>

                <div>
                    <strong>Maria</strong>
                    <span>Há 10 minutos</span>
                </div>

            </div>


            <div class="post-text">

                Hoje eu vi o novo filme do Homem-Aranha,
                top, tô feliz :D

            </div>


            <!-- IMAGEM -->
            <div class="imagem-post">

                <img
                    src="https://tse3.mm.bing.net/th/id/OIP.5uIzKBFjSpU5Yd4P6u8sewHaE4?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                    alt="Imagem do Homem-Aranha"
                >

            </div>


            <div class="post-actions">

                <button>Curtir</button>
                <button>Comentar</button>

            </div>

        </article>

    </main>


    <footer>
        <p>MiniFeed - Todos os Direitos Reservados - 2026</p>
    </footer>

</body>

</html>
