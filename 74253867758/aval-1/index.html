
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja Online</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🛍️ Minha Loja</h1>
    <button id="abrirCarrinho">
        🛒 Carrinho (<span id="contador">0</span>)
    </button>
</header>

<main>
    <h2>Nossos Produtos</h2>

    <section class="produtos" id="produtos"></section>
</main>

<div class="carrinho" id="carrinho">
    <div class="carrinho-topo">
        <h2>Meu Carrinho</h2>
        <button id="fecharCarrinho">✖</button>
    </div>

    <div id="itensCarrinho"></div>

    <div class="resumo">
        <h3>Resumo da compra</h3>
        <p>Subtotal: <span id="subtotal">R$ 0,00</span></p>
        <h2>Total: <span id="total">R$ 0,00</span></h2>

        <button class="finalizar" onclick="finalizarCompra()">
            Finalizar compra
        </button>
    </div>
</div>

<div class="fundo" id="fundo"></div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
