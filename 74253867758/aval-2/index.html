
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>📋 TaskManager</h1>
    <span>Organize seu dia!</span>
</header>

<main>

    <h2 class="titulo">Meu Painel</h2>
    <p class="subtitulo">Gerencie suas atividades e acompanhe seu progresso.</p>

    <!-- Dashboard -->
    <section class="dashboard">

        <div class="card">
            <h3>Total de tarefas</h3>
            <p id="total">0</p>
        </div>

        <div class="card">
            <h3>Pendentes</h3>
            <p id="pendentes">0</p>
        </div>

        <div class="card">
            <h3>Concluídas</h3>
            <p id="concluidas">0</p>
        </div>

        <div class="card">
            <h3>Atrasadas</h3>
            <p id="atrasadas">0</p>
        </div>

    </section>

    <!-- Formulário -->
    <section class="formulario">

        <h2>➕ Nova tarefa</h2>

        <input
            type="text"
            id="nomeTarefa"
            placeholder="Digite o nome da tarefa..."
            maxlength="120"
        >

        <label>Data de conclusão</label>
        <input type="date" id="dataTarefa">

        <label>Prioridade</label>

        <select id="prioridade">
            <option value="baixa">Prioridade baixa</option>
            <option value="media">Prioridade média</option>
            <option value="alta">Prioridade alta</option>
        </select>

        <button class="adicionar" onclick="adicionarTarefa()">
            + Adicionar tarefa
        </button>

    </section>

    <!-- Lista -->
    <section class="tarefas">

        <h2>📝 Minhas tarefas</h2>

        <div class="filtros">

            <button onclick="filtrar('todas')">Todas</button>

            <button onclick="filtrar('pendente')">Pendentes</button>

            <button onclick="filtrar('concluida')">Concluídas</button>

            <button onclick="filtrar('atrasada')">Atrasadas</button>

        </div>

        <div id="listaTarefas"></div>

    </section>

    <!-- Progresso -->
    <section class="progresso">

        <h2>📊 Meu progresso</h2>

        <div class="barra">
            <div id="barraProgresso"></div>
        </div>

        <p id="textoProgresso">0% concluído</p>

    </section>

</main>

<footer>
    <p>TaskManager © 2026 - Organize suas tarefas</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
