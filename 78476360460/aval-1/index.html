
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site de Matemática</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #eef2ff;
      padding: 30px 15px;
    }

    .cartao {
      max-width: 500px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px #0002;
    }

    h1 {
      color: #6246ea;
    }

    button {
      background: #6246ea;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      margin: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #4630b5;
    }

    #resultado {
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>
  <div class="cartao">
    <h1>📐 Matemática Interativa</h1>
    <p>Quanto é 8 × 7?</p>

    <button onclick="responder(54)">54</button>
    <button onclick="responder(56)">56</button>
    <button onclick="responder(64)">64</button>

    <p id="resultado" aria-live="polite"></p>
  </div>

  <script>
    function responder(valor) {
      const resultado = document.getElementById("resultado");

      if (valor === 56) {
        resultado.textContent = "🎉 Parabéns! Você acertou!";
        resultado.style.color = "green";
      } else {
        resultado.textContent = "Tente novamente! Você consegue!";
        resultado.style.color = "red";
      }
    }
  </script>
<script src="script.js"></script></body>
</html>
