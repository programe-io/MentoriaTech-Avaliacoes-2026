
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vértice Shoes</title>
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
  <h1>VÉRTICE <span>SHOES</span></h1>
    <nav>
        <a href="#inicio">Início</a>
            <a href="#produtos">Produtos</a>
                <a href="#sobre">Sobre</a>
                  </nav>
                    <button id="cart-button">🛒 Carrinho (<span id="cart-count">0</span>)</button>
                    </header>

                    <section class="hero" id="inicio">
                      <p>ESTILO • CONFORTO • PERSONALIDADE</p>
                        <h2>Seu próximo passo começa aqui.</h2>
                          <a href="#produtos">CONHEÇA NOSSA COLEÇÃO</a>
                          </section>

                          <section id="produtos">
                            <h2>Nossa coleção</h2>
                              <div id="product-list" class="product-grid"></div>
                              </section>

                              <section id="sobre">
                                <h2>Sobre a Vértice Shoes</h2>
                                  <p>Calçados selecionados para quem valoriza estilo, qualidade e conforto.</p>
                                  </section>

                                  <aside id="cart-panel">
                                    <button id="close-cart">Fechar ✕</button>
                                      <h2>Meu carrinho</h2>
                                        <div id="cart-items"></div>
                                          <h3>Total: R$ <span id="cart-total">0,00</span></h3>
                                            <button id="checkout">Finalizar pedido</button>
                                            </aside>

                                            <footer>
                                              <p>© 2026 VÉRTICE SHOES</p>
                                              </footer>

                                              <script src="script.js"></script></body>
                                              </html>
