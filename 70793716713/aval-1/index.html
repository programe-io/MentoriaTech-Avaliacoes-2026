<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Controle de Estoque</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>📦 Controle de Estoque</h1>
      <p>Gerencie produtos, quantidades e alertas de reposição em tempo real.</p>
    </div>
  </header>

  <main class="container">
    <!-- Resumo / Indicadores -->
    <section class="resumo" aria-label="Resumo do estoque">
      <div class="card-kpi">
        <span>Total de Produtos</span>
        <strong id="total-produtos">0</strong>
      </div>
      <div class="card-kpi">
        <span>Unidades em Estoque</span>
        <strong id="total-unidades">0</strong>
      </div>
      <div class="card-kpi alerta">
        <span>Estoque Baixo (≤ 5)</span>
        <strong id="estoque-baixo">0</strong>
      </div>
    </section>

    <!-- Formulário de Cadastro -->
    <section class="painel" aria-label="Cadastrar produto">
      <h2>Novo Produto</h2>
      <form id="form-produto" class="form-grid">
        <div class="campo">
          <label for="nome">Nome do Produto *</label>
          <input type="text" id="nome" placeholder="Ex.: Teclado Mecânico" required />
        </div>

        <div class="campo">
          <label for="categoria">Categoria *</label>
          <select id="categoria" required>
            <option value="">Selecione...</option>
            <option value="Periféricos">Periféricos</option>
            <option value="Hardware">Hardware</option>
            <option value="Escritório">Escritório</option>
            <option value="Acessórios">Acessórios</option>
          </select>
        </div>

        <div class="campo">
          <label for="quantidade">Quantidade *</label>
          <input type="number" id="quantidade" min="0" value="1" required />
        </div>

        <div class="campo">
          <label for="preco">Preço Unitário (R$) *</label>
          <input type="number" id="preco" min="0" step="0.01" placeholder="0.00" required />
        </div>

        <div class="acoes-form">
          <button type="submit" class="btn btn-primario">+ Adicionar ao Estoque</button>
        </div>
      </form>
    </section>

    <!-- Busca e Tabela -->
    <section class="painel" aria-label="Lista de produtos">
      <div class="cabecalho-tabela">
        <h2>Itens Cadastrados</h2>
        <input type="search" id="busca" placeholder="Buscar por nome ou categoria..." />
      </div>

      <div class="tabela-responsiva">
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Qtd.</th>
              <th>Preço Un.</th>
              <th>Subtotal</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- Linhas geradas via JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
