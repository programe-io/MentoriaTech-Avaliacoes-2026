<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficha de Anamnese - Parte 2</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topbar">
    <div class="container topbar-flex">
      <div>
        <h1>🩺 Ficha de Anamnese — Parte 2</h1>
        <p>Histórico clínico, hábitos, avaliação específica, consentimento e fichas salvas.</p>
      </div>
      <button type="button" id="btn-imprimir" class="btn btn-secundario">🖨️ Imprimir Ficha</button>
    </div>
  </header>

  <main class="container">
    <!-- Resumo / Indicadores -->
    <section class="resumo" aria-label="Resumo das fichas">
      <div class="card-kpi">
        <span>Fichas Salvas</span>
        <strong id="total-fichas">0</strong>
      </div>
      <div class="card-kpi">
        <span>Com Alergias Registradas</span>
        <strong id="total-alergias">0</strong>
      </div>
      <div class="card-kpi alerta">
        <span>Em Uso de Medicamentos</span>
        <strong id="total-medicamentos">0</strong>
      </div>
    </section>

    <!-- Formulário Parte 2 -->
    <section class="painel" aria-label="Avaliação clínica e consentimento">
      <h2>Avaliação Aprofundada e Termo de Ciência</h2>
      <form id="form-anamnese-p2">
        <div class="form-grid">
          <div class="campo">
            <label for="paciente">Nome do Paciente *</label>
            <input type="text" id="paciente" placeholder="Ex.: Mariana Silva" required />
          </div>

          <div class="campo">
            <label for="queixa-principal">Queixa Principal / Motivo *</label>
            <input type="text" id="queixa-principal" placeholder="Ex.: Dor lombar / Avaliação estética" required />
          </div>

          <div class="campo">
            <label for="medicamentos">Medicamentos em Uso</label>
            <input type="text" id="medicamentos" placeholder="Ex.: Losartana 50mg (ou 'Nenhum')" />
          </div>

          <div class="campo">
            <label for="alergias">Alergias Conhecidas</label>
            <input type="text" id="alergias" placeholder="Ex.: Dipirona, látex (ou 'Nenhuma')" />
          </div>
        </div>

        <fieldset class="grupo-check">
          <legend>Hábitos e Histórico de Saúde</legend>
          <label class="check-item">
            <input type="checkbox" id="hab-fumante" />
            <span>Tabagismo / Fumante</span>
          </label>
          <label class="check-item">
            <input type="checkbox" id="hab-etilismo" />
            <span>Consumo frequente de álcool</span>
          </label>
          <label class="check-item">
            <input type="checkbox" id="hab-atividade" />
            <span>Pratica atividade física regular</span>
          </label>
          <label class="check-item">
            <input type="checkbox" id="hab-cirurgia" />
            <span>Histórico de cirurgias anteriores</span>
          </label>
        </fieldset>

        <div class="campo espaco-topo">
          <label for="observacoes">Observações Clínicas / Conduta Inicial</label>
          <textarea id="observacoes" rows="3" placeholder="Registre detalhes relevantes da avaliação, sinais vitais ou orientações..."></textarea>
        </div>

        <div class="consentimento-box">
          <label class="check-item">
            <input type="checkbox" id="consentimento" required />
            <span>Declaro que as informações fornecidas são verdadeiras e autorizo o registro desta ficha de anamnese para fins de atendimento. *</span>
          </label>
        </div>

        <div class="acoes-form">
          <button type="submit" class="btn btn-primario">💾 Salvar Ficha (Parte 2)</button>
          <button type="button" id="btn-limpar" class="btn btn-secundario">Limpar Campos</button>
        </div>
      </form>
    </section>

    <!-- Fichas Registradas -->
    <section class="painel" aria-label="Fichas registradas">
      <div class="cabecalho-lista">
        <h2>Fichas Registradas</h2>
        <input type="search" id="busca" placeholder="Buscar por paciente ou queixa..." />
      </div>

      <div id="lista-fichas" class="lista-fichas">
        <!-- Cards gerados via JavaScript -->
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
