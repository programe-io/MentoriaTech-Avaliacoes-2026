<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>✅ Gerenciador de Tarefas</h1>
      <p>Organize atividades, defina prioridades e acompanhe seu progresso diário.</p>
    </div>
  </header>

  <main class="container">
    <!-- Resumo / Indicadores -->
    <section class="resumo" aria-label="Resumo das tarefas">
      <div class="card-kpi">
        <span>Total de Tarefas</span>
        <strong id="total-tarefas">0</strong>
      </div>
      <div class="card-kpi">
        <span>Pendentes</span>
        <strong id="tarefas-pendentes">0</strong>
      </div>
      <div class="card-kpi concluida-kpi">
        <span>Concluídas</span>
        <strong id="tarefas-concluidas">0</strong>
      </div>
    </section>

    <!-- Formulário de Nova Tarefa -->
    <section class="painel" aria-label="Adicionar tarefa">
      <h2>Nova Tarefa</h2>
      <form id="form-tarefa" class="form-grid">
        <div class="campo campo-titulo">
          <label for="titulo">Descrição da Tarefa *</label>
          <input type="text" id="titulo" placeholder="Ex.: Revisar relatório semanal" required />
        </div>

        <div class="campo">
          <label for="prioridade">Prioridade *</label>
          <select id="prioridade" required>
            <option value="Média">Média</option>
            <option value="Alta">Alta</option>
            <option value="Baixa">Baixa</option>
          </select>
        </div>

        <div class="campo">
          <label for="prazo">Prazo (opcional)</label>
          <input type="date" id="prazo" />
        </div>

        <div class="acoes-form">
          <button type="submit" class="btn btn-primario">+ Adicionar Tarefa</button>
        </div>
      </form>
    </section>

    <!-- Filtros e Lista -->
    <section class="painel" aria-label="Lista de tarefas">
      <div class="cabecalho-lista">
        <h2>Minhas Tarefas</h2>
        <div class="controles-filtro">
          <select id="filtro-status" aria-label="Filtrar por status">
            <option value="todas">Todas</option>
            <option value="pendentes">Pendentes</option>
            <option value="concluidas">Concluídas</option>
          </select>
          <input type="search" id="busca" placeholder="Buscar tarefa..." />
        </div>
      </div>

      <ul id="lista-tarefas" class="lista-tarefas">
        <!-- Itens gerados via JavaScript -->
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
