<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeriesFeed - Rede Social de Séries</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #202024;
      --border-color: #323238;
      --primary: #8257e5;
      --primary-hover: #996dff;
      --text-main: #e1e1e6;
      --text-muted: #8d8d99;
      --like-color: #f75a68;
      --star-color: #fba94c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
    }

    header {
      width: 100%;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 20px 16px;
    }

    /* Formulário de Novo Post */
    .new-post-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input, select, textarea {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      padding: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    #series-name {
      flex: 2;
    }

    #series-rating {
      flex: 1;
    }

    textarea {
      width: 100%;
      resize: vertical;
      min-height: 80px;
      margin-bottom: 12px;
    }

    .btn-post {
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-post:hover {
      background-color: var(--primary-hover);
    }

    /* Feed de Postagens */
    .post {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .username {
      font-weight: bold;
      display: block;
    }

    .time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .series-badge {
      background-color: rgba(130, 87, 229, 0.15);
      color: var(--primary-hover);
      border: 1px solid var(--primary);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 8px;
    }

    .stars {
      color: var(--star-color);
      margin-left: 6px;
    }

    .post-content {
      line-height: 1.5;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .post-actions {
      display: flex;
      gap: 16px;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .action-btn:hover {
      color: var(--text-main);
    }

    .action-btn.liked {
      color: var(--like-color);
      font-weight: bold;
    }

    /* Seção de Comentários */
    .comments-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      display: none;
    }

    .comments-section.open {
      display: block;
    }

    .comment-list {
      margin-bottom: 10px;
    }

    .comment-item {
      background-color: var(--bg-color);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.88rem;
    }

    .comment-item strong {
      color: var(--primary-hover);
      margin-right: 6px;
    }

    .comment-form {
      display: flex;
      gap: 8px;
    }

    .comment-form input {
      flex: 1;
      padding: 8px;
      font-size: 0.85rem;
    }

    .comment-form button {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0 14px;
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍿 SeriesFeed</h1>
  </header>

  <div class="container">
    <!-- Criar Nova Publicação -->
    <div class="new-post-card">
      <div class="form-row">
        <input type="text" id="series-name" placeholder="Nome da série (ex: Severance)">
        <select id="series-rating">
          <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
          <option value="4">⭐⭐⭐⭐ (4/5)</option>
          <option value="3">⭐⭐⭐ (3/5)</option>
          <option value="2">⭐⭐ (2/5)</option>
          <option value="1">⭐ (1/5)</option>
        </select>
      </div>
      <textarea id="post-text" placeholder="O que você achou do último episódio? (Sem spoilers!)"></textarea>
      <button class="btn-post" onclick="createPost()">Publicar Opinião</button>
    </div>

    <!-- Lista de Publicações -->
    <div id="feed"></div>
  </div>

  <script>
    // Dados iniciais simulando um banco de dados
    let posts = [
      {
        id: 1,
        user: "Camila Silva",
        avatar: "CS",
        time: "Há 15 minutos",
        series: "Breaking Bad",
        rating: 5,
        content: "Reassistindo pela terceira vez e o episódio Ozymandias continua sendo uma obra-prima absoluta da televisão. Atuação impecável!",
        likes: 24,
        liked: false,
        comments: [
          { user: "Lucas M.", text: "Concordo 100%, melhor episódio de qualquer série." }
        ]
      },
      {
        id: 2,
        user: "Rafael Costa",
        avatar: "RC",
        time: "Há 2 horas",
        series: "The Bear",
        rating: 4,
        content: "A tensão na cozinha nessa nova temporada me deixou sem fôlego. A edição de som dessa série merece todos os prêmios.",
        likes: 12,
        liked: true,
        comments: []
      }
    ];

    const feedElement = document.getElementById('feed');

    // Renderiza os posts na tela
    function renderFeed() {
      feedElement.innerHTML = '';

      posts.forEach(post => {
        const stars = '★'.repeat(post.rating) + '☆'.repeat(5 - post.rating);
        
        const commentsHTML = post.comments.map(c => `
          <div class="comment-item">
            <strong>${c.user}:</strong> ${c.text}
          </div>
        `).join('');

        const postHTML = `
          <div class="post" id="post-${post.id}">
            <div class="post-header">
              <div class="user-info">
                <div class="avatar">${post.avatar}</div>
                <div>
                  <span class="username">${post.user}</span>
                  <span class="time">${post.time}</span>
                </div>
              </div>
            </div>

            <div class="series-badge">
              🎬 ${post.series} <span class="stars">${stars}</span>
            </div>

            <p class="post-content">${post.content}</p>

            <div class="post-actions">
              <button class="action-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                ${post.liked ? '❤️' : '🤍'} ${post.likes} Curtidas
              </button>
              <button class="action-btn" onclick="toggleComments(${post.id})">
                💬 ${post.comments.length} Comentários
              </button>
            </div>

            <div class="comments-section" id="comments-${post.id}">
              <div class="comment-list">
                ${commentsHTML}
              </div>
              <div class="comment-form">
                <input type="text" id="input-comment-${post.id}" placeholder="Escreva um comentário...">
                <button onclick="addComment(${post.id})">Enviar</button>
              </div>
            </div>
          </div>
        `;
        feedElement.innerHTML += postHTML;
      });
    }

    // Cria um novo post
    function createPost() {
      const seriesInput = document.getElementById('series-name');
      const ratingInput = document.getElementById('series-rating');
      const textInput = document.getElementById('post-text');

      const series = seriesInput.value.trim();
      const rating = parseInt(ratingInput.value);
      const content = textInput.value.trim();

      if (!series || !content) {
        alert('Por favor, preencha o nome da série e sua opinião!');
        return;
      }

      const newPost = {
        id: Date.now(),
        user: "Você",
        avatar: "VC",
        time: "Agora mesmo",
        series: series,
        rating: rating,
        content: content,
        likes: 0,
        liked: false,
        comments: []
      };

      posts.unshift(newPost); // Adiciona no topo do feed
      seriesInput.value = '';
      textInput.value = '';
      renderFeed();
    }

</body>
</html>
