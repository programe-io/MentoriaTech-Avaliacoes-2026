
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <header class="cabecalho">
            <div class="logo">✓</div>
            <div>
                <h1>TaskFlow</h1>
                <p>Organize suas tarefas e alcance seus objetivos.</p>
            </div>
        </header>

        <section class="resumo">
            <article class="card-resumo total">
                <span>Total de tarefas</span>
                <strong id="totalTarefas">0</strong>
            </article>

            <article class="card-resumo concluidas">
                <span>Concluídas</span>
                <strong id="tarefasConcluidas">0</strong>
            </article>

            <article class="card-resumo pendentes">
                <span>Pendentes</span>
                <strong id="tarefasPendentes">0</strong>
            </article>
        </section>

        <section class="painel">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">
                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex.: Estudar JavaScript"
                        minlength="5"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" required>
                        <option value="1">Alta</option>
                        <option value="2" selected>Média</option>
                        <option value="3">Baixa</option>
                    </select>
                </div>

                <button type="submit" class="btn-adicionar">
                    + Adicionar tarefa
                </button>
            </form>

            <p id="mensagem" class="mensagem" role="status"></p>
        </section>

        <section class="lista-section">
            <div class="lista-topo">
                <h2>Minhas tarefas</h2>
                <span id="contador">0 tarefas</span>
            </div>

            <div class="filtros">
                <input
                    type="search"
                    id="busca"
                    placeholder="Buscar tarefa pelo título..."
                    aria-label="Buscar tarefas"
                >

                <select id="filtroStatus" aria-label="Filtrar por status">
                    <option value="todas">Todas</option>
                    <option value="pendentes">Pendentes</option>
                    <option value="concluidas">Concluídas</option>
                </select>
            </div>

            <div id="listaTarefas" class="lista-tarefas"></div>
        </section>

        <footer>
            <p>TaskFlow · Gerenciador de Tarefas</p>
        </footer>
    </main>
<script src="script.js"></script></body>
</html>
