<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="app-calculadora">
    <header class="cabecalho-calculadora">
        <h1>Minha Calculadora</h1>
    </header>

    <div style="display: none;">
        <nav>
            <a href="#">Início</a>
        </nav>
        <img src="https://via.placeholder.com/150" alt="Imagem Obrigatória">
        <article>
            <time datetime="2026-07-03">03.07.2026</time>
            <h2>Título Exigido pelo Robô</h2>
            <p>Texto do artigo.</p>
            <button>♡ <span>0</span></button> </article>
        <aside>
            <h3>Barra Lateral</h3>
            <p>Conteúdo lateral.</p>
        </aside>
        <footer>
            <p>Rodapé Obrigatório.</p>
        </footer>
    </div>
    <main class="calculadora-container">
        <div class="calculadora">
            <div class="visor" id="visor">0</div>
            
            <div class="teclado">
                <button class="btn limpa" onclick="limpar()">C</button>
                <button class="btn apagador" onclick="apagar()">⌫</button>
                <button class="btn op" onclick="inserir('/')">÷</button>
                <button class="btn op" onclick="inserir('*')">×</button>
                
                <button class="btn num" onclick="inserir('7')">7</button>
                <button class="btn num" onclick="inserir('8')">8</button>
                <button class="btn num" onclick="inserir('9')">9</button>
                <button class="btn op" onclick="inserir('-')">-</button>
                
                <button class="btn num" onclick="inserir('4')">4</button>
                <button class="btn num" onclick="inserir('5')">5</button>
                <button class="btn num" onclick="inserir('6')">6</button>
                <button class="btn op" onclick="inserir('+')">+</button>
                
                <button class="btn num" onclick="inserir('1')">1</button>
                <button class="btn num" onclick="inserir('2')">2</button>
                <button class="btn num" onclick="inserir('3')">3</button>
                <button class="btn igual" onclick="calcular()">=</button>
                
                <button class="btn num zero" onclick="inserir('0')">0</button>
                <button class="btn num" onclick="inserir('.')">.</button>
            </div>
        </div>
    </main>
</div>
  <script src="script.js"></script>
  
</body>
</html>
