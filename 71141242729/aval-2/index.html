
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <header>
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas atividades de maneira simples.</p>
        </header>

        <section class="dashboard">
            <div class="card">
                <h3>Total</h3>
                <span id="total">0</span>
            </div>
            <div class="card">
                <h3>Pendentes</h3>
                <span id="pendentes">0</span>
            </div>
            <div class="card">
                <h3>Concluídas</h3>
                <span id="concluidas">0</span>
            </div>
        </section>

        <section class="form-section">
            <h2 id="formTitulo">Cadastrar tarefa</h2>

            <form id="formTarefa">
                <input type="hidden" id="tarefaId">

                <input
                    type="text"
                    id="titulo"
                    placeholder="Título da tarefa"
                    required
                >

                <textarea
                    id="descricao"
                    placeholder="Descrição da tarefa"
                    required
                ></textarea>

                <label for="data">Data de vencimento:</label>
                <input type="date" id="data">

                <button type="submit" id="btnSalvar">
                    Cadastrar tarefa
                </button>
                <button type="button" id="btnCancelar" class="cancelar" hidden>
                    Cancelar edição
                </button>
            </form>
        </section>

        <section class="lista-section">
            <h2>Minhas tarefas</h2>

            <input
                type="search"
                id="busca"
                placeholder="Buscar por título ou descrição..."
            >

            <div class="filtros">
                <button class="filtro ativo" data-filtro="todas">
                    Todas
                </button>
                <button class="filtro" data-filtro="pendentes">
                    Pendentes
                </button>
                <button class="filtro" data-filtro="concluidas">
                    Concluídas
                </button>
            </div>

            <select id="ordenacao">
                <option value="recentes">Mais recentes</option>
                <option value="antigas">Mais antigas</option>
                <option value="data">Vencimento mais próximo</option>
                <option value="titulo">Ordem alfabética</option>
            </select>

            <div id="listaTarefas"></div>

            <button id="btnLimpar" class="limpar">
                Excluir todas as tarefas
            </button>
        </section>

        <footer>
            <p>Gerenciador de Tarefas - Desenvolvido em JavaScript</p>
        </footer>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
