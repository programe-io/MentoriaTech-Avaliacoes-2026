
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoVida - Sistema Ambiental</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🌱 EcoVida</h1>
        <p>Cuidando do planeta começa com pequenas atitudes!</p>
    </header>

    <main>
        <section class="resumo">
            <div class="card">
                <h3>Denúncias</h3>
                <p id="total">0</p>
            </div>
            <div class="card">
                <h3>Concluídas</h3>
                <p id="concluidas">0</p>
            </div>
        </section>

        <section class="formulario">
            <h2>Registrar ocorrência ambiental</h2>

            <form id="form">
                <input type="text" id="titulo"
                    placeholder="Título da ocorrência" required>

                <select id="tipo" required>
                    <option value="">Selecione o tipo</option>
                    <option value="Desmatamento">Desmatamento</option>
                    <option value="Poluição">Poluição</option>
                    <option value="Lixo irregular">Lixo irregular</option>
                    <option value="Queimada">Queimada</option>
                    <option value="Outro">Outro</option>
                </select>

                <textarea id="descricao"
                    placeholder="Descreva o problema..."
                    required></textarea>

                <button type="submit">Registrar ocorrência</button>
            </form>
        </section>

        <section class="lista">
            <h2>Ocorrências registradas</h2>
            <div id="ocorrencias"></div>
        </section>
    </main>

    <footer>
        <p>🌎 EcoVida - Preserve o meio ambiente.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
