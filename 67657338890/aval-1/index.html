<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Rede Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <nav>
            <h1>SocialGram</h1>

            <input type="text" placeholder="Pesquisar">

            <a href="#">Início</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main>

        <section class="perfil">
            <img src="images/perfil.jpg" alt="Foto do perfil">

            <div>
                <h2>João Silva</h2>
                <p>@joaosilva</p>
            </div>
        </section>

        <section class="feed">

            <article class="post">
                <header class="post-header">
                    <strong>João Silva</strong>
                </header>

                <figure>
                    <img src="images/foto1.jpg" alt="Paisagem bonita">
                </figure>

                <div class="acoes">
                    <button class="curtir">♡ Curtir</button>
                    <button>💬 Comentar</button>
                </div>

                <p>Um dia incrível! 🌄</p>
            </article>

            <article class="post">
                <header class="post-header">
                    <strong>Maria Santos</strong>
                </header>

                <figure>
                    <img src="images/foto2.jpg" alt="Foto de uma cidade">
                </figure>

                <div class="acoes">
                    <button class="curtir">♡ Curtir</button>
                    <button>💬 Comentar</button>
                </div>

                <p>Que lugar maravilhoso! ❤️</p>
            </article>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 SocialGram</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
