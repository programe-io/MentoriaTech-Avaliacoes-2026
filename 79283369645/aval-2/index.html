<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🌸 Meu Mini Feed</h1>
        <p>Compartilhe seus melhores momentos!</p>
    </header>

    <main>
        <section class="novo-post">
            <h2>Nova publicação</h2>

            <input type="text" id="nome"
                placeholder="Seu nome">

            <textarea id="legenda"
                placeholder="O que você está pensando?"></textarea>

            <input type="text" id="imagem"
                placeholder="URL da imagem (opcional)">

            <button onclick="publicar()">
                Publicar ✨
            </button>
        </section>

        <section id="feed">
            <article class="post">
                <h3>Maria 🌷</h3>

                <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946"
                     alt="Flores rosas em um jardim">

                <p>Um dia lindo para florescer! 🌸</p>

                <button onclick="curtir(this)">
                    ❤️ Curtir <span>0</span>
                </button>

                <div class="comentarios">
                    <input type="text"
                        placeholder="Escreva um comentário...">

                    <button onclick="comentar(this)">
                        Comentar
                    </button>

                    <div class="lista-comentarios"></div>
                </div>
            </article>

            <article class="post">
                <h3>Ana 💕</h3>

                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9"
                     alt="Retrato de uma jovem sorrindo">

                <p>Espalhando amor e boas energias! ✨</p>

                <button onclick="curtir(this)">
                    ❤️ Curtir <span>0</span>
                </button>

                <div class="comentarios">
                    <input type="text"
                        placeholder="Escreva um comentário...">

                    <button onclick="comentar(this)">
                        Comentar
                    </button>

                    <div class="lista-comentarios"></div>
                </div>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
