
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Sistema de Estoque</h1>
        <p class="subtitulo">Gerenciamento de produtos</p>

        <div class="formulario">
            <input type="number" id="codigo" placeholder="Código do produto">
            <input type="text" id="descricao" placeholder="Descrição do produto">
            <input type="number" id="quantidade" placeholder="Quantidade">
            <input type="number" id="valor" placeholder="Valor (R$)" step="0.01">

            <button onclick="cadastrarProduto()">Cadastrar Produto</button>
        </div>

        <h2>Produtos cadastrados</h2>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaProdutos"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
