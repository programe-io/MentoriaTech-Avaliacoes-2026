<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Simples</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho / Barra Superior -->
    <header class="navbar">
        <h2 class="logo">Instagram</h2>
        <input type="text" class="search-bar" placeholder="Pesquisar">
        <div class="nav-icons">
            <i class="fa-solid fa-house"></i>
            <i class="fa-regular fa-paper-plane"></i>
            <i class="fa-regular fa-compass"></i>
            <i class="fa-regular fa-heart"></i>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <div class="container">
        
        <!-- Feed de Publicações -->
        <main class="feed">
            
            <!-- Stories -->
            <div class="stories">
                <div class="story-item">
                    <div class="story-ring"><img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" alt="User"></div>
                    <span>seu_story</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" alt="User"></div>
                    <span>mariana</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" alt="User"></div>
                    <span>carlos</span>
                </div>
            </div>

            <!-- Post -->
            article class="post">
                <div class="post-header">
                    <div class="user-info">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" alt="Avatar">
                        <span>mariana</span>
                    </div>
                    <i class="fa-solid fa-ellipsis"></i>
                </div>

                <div class="post-img">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600" alt="Post">
                </div>

                <div class="post-actions">
                    <div class="left-icons">
                        <i class="fa-regular fa-heart"></i>
                        <i class="fa-regular fa-comment"></i>
                        <i class="fa-regular fa-paper-plane"></i>
                    </div>
                    <i class="fa-regular fa-bookmark"></i>
                </div>

                <div class="post-content">
                    <p class="likes">Curtido por <strong>carlos</strong> e outras <strong>500 pessoas</strong></p>
                    <p class="caption"><strong>mariana</strong> Primeiro post no meu feed simplificado! 🚀</p>
                    <p class="comments-link">Ver todos os 12 comentários</p>
                    <input type="text" class="comment-input" placeholder="Adicione um comentário...">
                </div>
            </article>

        </main>

        <!-- Sidebar Direita -->
        <aside class="sidebar">
            <div class="my-profile">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" alt="Perfil">
                <div class="profile-info">
                    <span class="username">seu_usuario</span>
                    <span class="name">Seu Nome</span>
                </div>
                <a href="#" class="switch">Mudar</a>
            </div>

            <div class="suggestions-title">
                <span>Sugestões para você</span>
                <a href="#">Ver tudo</a>
            </div>

            <div class="suggestion">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100" alt="Sugestão">
                <div class="suggestion-info">
                    <span class="username">lucas_dev</span>
                    <span class="relation">Seguido por mariana</span>
                </div>
                <a href="#" class="follow">Seguir</a>
            </div>
        </aside>

    </div>

<script src="script.js"></script></body>
</html>
