
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Escolar</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>📚 Biblioteca Escolar</h1>
    <p>Sistema de Cadastro e Gerenciamento</p>
</header>

<main class="container">

    <section class="resumo">
        <div class="card">
            <h3>Livros</h3>
            <p id="totalLivros">0</p>
        </div>
        <div class="card">
            <h3>Alunos</h3>
            <p id="totalAlunos">0</p>
        </div>
        <div class="card">
            <h3>Empréstimos ativos</h3>
            <p id="totalEmprestimos">0</p>
        </div>
        <div class="card">
            <h3>Exemplares disponíveis</h3>
            <p id="livrosDisponiveis">0</p>
        </div>
    </section>

    <section class="painel">
        <h2>📖 Cadastrar Livro</h2>

        <form onsubmit="cadastrarLivro(event)">
            <input type="text" id="titulo" placeholder="Título do livro" required>
            <input type="text" id="autor" placeholder="Nome do autor" required>
            <input type="text" id="categoria" placeholder="Categoria" required>
            <input type="number" id="ano" placeholder="Ano de publicação" min="1" required>
            <input type="number" id="quantidade" placeholder="Quantidade de exemplares" min="1" required>

            <button type="submit">Cadastrar Livro</button>
        </form>
    </section>

    <section class="painel">
        <h2>👨‍🎓 Cadastrar Aluno</h2>

        <form onsubmit="cadastrarAluno(event)">
            <input type="text" id="nomeAluno" placeholder="Nome completo do aluno" required>
            <input type="text" id="turma" placeholder="Turma do aluno" required>

            <button type="submit">Cadastrar Aluno</button>
        </form>
    </section>

    <section class="painel">
        <h2>📚 Livros cadastrados</h2>

        <input type="text" id="pesquisa" placeholder="Pesquisar livro ou autor..." oninput="listarLivros()">

        <div id="listaLivros"></div>
    </section>

    <section class="painel">
        <h2>🔄 Registrar Empréstimo</h2>

        <form onsubmit="registrarEmprestimo(event)">

            <label>Aluno:</label>
            <select id="alunoSelect" required>
                <option value="">Selecione um aluno</option>
            </select>

            <label>Livro:</label>
            <select id="livroSelect" required>
                <option value="">Selecione um livro</option>
            </select>

            <label>Data de devolução:</label>
            <input type="date" id="dataDevolucao" required>

            <button type="submit">Registrar Empréstimo</button>
        </form>
    </section>

    <section class="painel">
        <h2>📋 Histórico de Empréstimos</h2>
        <div id="listaEmprestimos"></div>
    </section>

</main>

<footer>
    Biblioteca Escolar - Sistema de Gerenciamento
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
