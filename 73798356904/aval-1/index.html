
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>CONTROLE DE ESTOQUE</h1>
        <p>Sistema de gerenciamento de produtos</p>
    </header>

    <main>

        <section class="cadastro">
            <h2>Cadastrar Novo Produto</h2>

            <label for="codigo">Código:</label>
            <input type="text" id="codigo" placeholder="Digite o código">

            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" placeholder="Nome do produto">

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" min="0" step="1" placeholder="Quantidade">

            <label for="valor">Valor (R$):</label>
            <input type="number" id="valor" min="0" step="0.01" placeholder="Valor">

            <button type="button" onclick="cadastrarProduto()">
                Cadastrar Produto
            </button>
        </section>

        <section class="estoque">
            <h2>Lista de Produtos</h2>

            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                    </tbody>
                </table>
            </div>

            <h3 id="totalEstoque">
                Valor total do estoque: R$ 0,00
            </h3>
        </section>

    </main>

    <footer>
        <p>Projeto CRUD e Estoque - Aula 14</p>
        <p>Desenvolvido com HTML, CSS e JavaScript</p>
    </footer>

<script src="script.js"></script></body>
</html>
