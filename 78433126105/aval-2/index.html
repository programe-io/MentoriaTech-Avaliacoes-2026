
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed da Kamilinha</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>💗 Kamilinha Feed</h1>
        <p>Turma do Hitalo Santos</p>
    </header>

    <main>
        <section class="perfil">
            <div class="foto">K</div>
            <h2>Kamilinha 🌸</h2>
            <p>Bem-vindos ao meu mini feed!</p>
        </section>

        <section class="novo-post">
            <h3>Compartilhe uma novidade!</h3>
            <textarea id="textoPost" placeholder="O que você está pensando?"></textarea>
            <button onclick="adicionarPost()">Publicar</button>
        </section>

        <section id="feed">
            <article class="post">
                <h3>🌷 Kamilinha</h3>
                <p>Seja bem-vindo ao meu cantinho! 💕</p>
                <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                <button onclick="comentar()">💬 Comentar</button>
            </article>

            <article class="post">
                <h3>✨ Kamilinha</h3>
                <p>A turma do Hitalo Santos é especial! 💗</p>
                <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                <button onclick="comentar()">💬 Comentar</button>
            </article>
        </section>
    </main>

    <footer>
        <p>Feito com carinho 💖 | Kamilinha Feed</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
