<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>Gerenciador de Tarefas</h1>
        </header>

        <!-- Formulário de Cadastro -->
        <section class="card">
            <h2>Nova Tarefa</h2>
            <form id="form-tarefa">
                <div class="input-group">
                    <input type="text" id="codigo" placeholder="Código (ex: T01)" required>
                    <input type="text" id="titulo" placeholder="Título da tarefa (mín. 5 caracteres)" required>
                    <select id="prioridade" required>
                        <option value="" disabled selected>Selecione a Prioridade</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Cadastrar Tarefa</button>
            </form>
        </section>

        <!-- Tabela de Listagem -->
        <section class="card">
            <h2>Tarefas Cadastradas</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-tarefas">
                        <!-- As tarefas serão inseridas aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
