<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>Controle de IMC de Pacientes</h1>
        </header>

        <!-- Formulário de Entrada -->
        <section class="card">
            <h2>Novo Registro</h2>
            <form id="form-imc">
                <div class="input-group">
                    <div class="field">
                        <label for="nome">Nome do Paciente</label>
                        <input type="text" id="nome" placeholder="Ex: João Silva" required>
                    </div>
                    <div class="field">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" id="peso" placeholder="Ex: 75.5" step="0.1" min="1" required>
                    </div>
                    <div class="field">
                        <label for="altura">Altura (m)</label>
                        <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01" min="0.5" max="3" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Calcular e Registrar</button>
            </form>
        </section>

        <!-- Destaque da Última Avaliação -->
        <section id="destaque-card" class="card hidden">
            <h2>Resultado Atual</h2>
            <div id="destaque-conteudo"></div>
        </section>

        <!-- Tabela de Controle / Histórico -->
        <section class="card">
            <h2>Histórico de Pacientes Avaliados</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Paciente</th>
                            <th>Peso</th>
                            <th>Altura</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-pacientes">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
