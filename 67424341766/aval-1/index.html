<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Controle de Estoque</h1>
        </header>

        <!-- Formulário de Cadastro -->
        <section class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-cadastro">
                <div class="input-group">
                    <input type="text" id="codigo" placeholder="Código (ex: P001)" required>
                    <input type="text" id="descricao" placeholder="Descrição do produto" required>
                    <input type="number" id="quantidade" placeholder="Quantidade" min="0" required>
                    <input type="number" id="valor" placeholder="Valor (R$)" step="0.01" min="0" required>
                </div>
                <button type="submit" class="btn-primary">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Tabela de Listagem -->
        <section class="card">
            <h2>Produtos Cadastrados</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor Unitário</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos">
                        <!-- Os produtos serão inseridos aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
