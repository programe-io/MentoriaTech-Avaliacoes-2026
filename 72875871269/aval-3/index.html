
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Jogo da Velha</h1>

        <div class="placar">
            <div class="jogador">
                <span>Jogador X</span>
                <strong id="scoreX">0</strong>
            </div>

            <div class="jogador">
                <span>Jogador O</span>
                <strong id="scoreO">0</strong>
            </div>
        </div>

        <h2 id="status">Vez do jogador X</h2>

        <div class="tabuleiro" id="tabuleiro">
            <button class="celula" data-index="0"></button>
            <button class="celula" data-index="1"></button>
            <button class="celula" data-index="2"></button>

            <button class="celula" data-index="3"></button>
            <button class="celula" data-index="4"></button>
            <button class="celula" data-index="5"></button>

            <button class="celula" data-index="6"></button>
            <button class="celula" data-index="7"></button>
            <button class="celula" data-index="8"></button>
        </div>

        <button id="reiniciar" class="btn">
            Reiniciar partida
        </button>

        <button id="novoJogo" class="btn secundario">
            Zerar placar
        </button>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
