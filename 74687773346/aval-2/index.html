
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f2ff;
            text-align: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #aaa;
        }

        h1 {
            color: #2878c7;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            margin: 5px;
            background-color: #2878c7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #155a9c;
        }

        #resultado {
            margin-top: 20px;
            text-align: left;
        }

        .produto {
            background-color: #eef6ff;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Sistema de Estoque</h1>

    <h3>Cadastrar Produto</h3>

    <input type="number" id="codigo" placeholder="Código do produto">
    <input type="text" id="descricao" placeholder="Descrição do produto">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor do produto" step="0.01">

    <button onclick="cadastrar()">Cadastrar Produto</button>

    <hr>

    <h3>Alterar Produto</h3>

    <input type="number" id="codigoAlterar" placeholder="Código do produto">

    <input type="number" id="novoValor" placeholder="Novo valor">
    <button onclick="alterarValor()">Alterar Valor</button>

    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">
    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    <hr>

    <h3>Produtos Cadastrados</h3>

    <button onclick="listar()">Listar Produtos</button>

    <div id="resultado"></div>

</div>

<script>
    let produtos = [];

    // Cadastrar produto
    function cadastrar() {
        let codigo = Number(document.getElementById("codigo").value);
        let descricao = document.getElementById("descricao").value;
        let quantidade = Number(document.getElementById("quantidade").value);
        let valor = Number(document.getElementById("valor").value);

        if (codigo <= 0 || descricao === "" ||
            quantidade < 0 || valor < 0 ||
            document.getElementById("codigo").value === "" ||
            document.getElementById("quantidade").value === "" ||
            document.getElementById("valor").value === "") {
            alert("Preencha todos os campos corretamente!");
            return;
        }

        if (produtos.some(p => p.codigo === codigo)) {
            alert("Esse código já está cadastrado!");
            return;
        }

        produtos.push({
            codigo: codigo,
            descricao: descricao,
            quantidade: quantidade,
            valor: valor
        });

        alert("Produto cadastrado com sucesso!");

        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";

        listar();
    }

    // Listar produtos
    function listar() {
        let resultado = document.getElementById("resultado");

        resultado.innerHTML = "";

        if (produtos.length === 0) {
            resultado.innerHTML = "<p>Nenhum produto cadastrado.</p>";
            return;
        }

        produtos.forEach(function(produto) {
            resultado.innerHTML += `
                <div class="produto">
                    <strong>Código:</strong> ${produto.codigo}<br>
                    <strong>Descrição:</strong> ${produto.descricao}<br>
                    <strong>Quantidade:</strong> ${produto.quantidade}<br>
                    <strong>Valor:</strong> R$ ${produto.valor.toFixed(2)}
                </div>
            `;
        });
    }

    // Alterar valor
    function alterarValor() {
        let codigo = Number(document.getElementById("codigoAlterar").value);
        let novoValor = Number(document.getElementById("novoValor").value);

        let produto = produtos.find(p => p.codigo === codigo);

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (document.getElementById("novoValor").value === "" || novoValor < 0) {
            alert("Digite um valor válido!");
            return;
        }

        produto.valor = novoValor;

        alert("Valor alterado com sucesso!");
        listar();
    }

    // Alterar quantidade
    function alterarQuantidade() {
        let codigo = Number(document.getElementById("codigoAlterar").value);
        let novaQuantidade = Number(document.getElementById("novaQuantidade").value);

        let produto = produtos.find(p => p.codigo === codigo);

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (document.getElementById("novaQuantidade").value === "" || novaQuantidade < 0) {
            alert("Digite uma quantidade válida!");
            return;
        }

        produto.quantidade = novaQuantidade;

        alert("Quantidade alterada com sucesso!");
        listar();
    }
</script>

<script src="script.js"></script></body>
</html>
