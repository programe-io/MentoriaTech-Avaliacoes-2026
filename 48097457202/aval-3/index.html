<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main>
        <h1>Calculadora de IMC</h1>

        <section class="card">
            <h2>Nova pessoa</h2>
            <form id="formPessoa">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Ex.: Maria Silva" maxlength="50" required>
                </div>
                <div class="campo">
                    <label for="idade">Idade (anos)</label>
                    <input type="number" id="idade" placeholder="Ex.: 30" min="1" max="120" required>
                </div>
                <div class="campo">
                    <label for="altura">Altura (m)</label>
                    <input type="number" id="altura" placeholder="Ex.: 1.75" step="0.01" min="0.5" max="2.5" required>
                </div>
                <div class="campo">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" placeholder="Ex.: 70" step="0.1" min="2" max="500" required>
                </div>
                
                <button type="submit" id="btnSalvar">Salvar</button>
            </form>
            <p id="erro" class="hidden"></p>
        </section>

        <section class="card">
            <h2>Pessoas cadastradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Altura</th>
                        <th>Peso</th>
                        <th>IMC</th>
                        <th>Classificação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaPessoas">
                    
                </tbody>
            </table>
        </section>
    </main>
<script src="script.js"></script></body>
</html>
