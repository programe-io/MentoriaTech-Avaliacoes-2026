
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Meu Gerenciador de Tarefas</h1>
        <p>Organizando minhas atividades de forma simples e prática.</p>
    </header>

    <main class="container">

        <!-- Cadastro de tarefas -->
        <section class="caixa">

            <h2>Cadastrar nova tarefa</h2>

            <form id="formulario">

                <label for="titulo">Título da tarefa:</label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o nome da tarefa"
                    required
                >

                <label for="prioridade">Prioridade:</label>

                <select id="prioridade">
                    <option value="1">1 - Alta</option>
                    <option value="2" selected>2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit">+ Adicionar tarefa</button>

            </form>

        </section>

        <!-- Resumo das tarefas -->
        <section class="resumo">

            <div>
                <h3>Total de tarefas</h3>
                <p id="total">0</p>
            </div>

            <div>
                <h3>Pendentes</h3>
                <p id="pendentes">0</p>
            </div>

            <div>
                <h3>Concluídas</h3>
                <p id="concluidas">0</p>
            </div>

        </section>

        <!-- Lista de tarefas -->
        <section class="caixa">

            <h2>Minhas tarefas</h2>

            <div id="lista">

                <p class="mensagem">
                    Você ainda não possui tarefas cadastradas.
                </p>

            </div>

        </section>

    </main>

    <footer>
        <p>Projeto acadêmico - Sistema de Gerenciamento de Tarefas</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
