
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Ficha de Anamnese</h1>
        <p>Cadastro e informações do paciente</p>
    </header>

    <div class="container">

        <form id="formAnamnese">

            <h2>Dados Pessoais</h2>

            <label>Nome completo:</label>
            <input type="text" id="nome" required>

            <label>Data de nascimento:</label>
            <input type="date" id="nascimento" required>

            <label>Telefone:</label>
            <input type="tel" id="telefone">

            <label>Profissão:</label>
            <input type="text" id="profissao">

            <h2>Informações de Saúde</h2>

            <label>Possui alguma doença?</label>
            <textarea id="doenca"></textarea>

            <label>Possui alergias?</label>
            <textarea id="alergias"></textarea>

            <label>Utiliza algum medicamento?</label>
            <textarea id="medicamentos"></textarea>

            <label>Já realizou alguma cirurgia?</label>
            <textarea id="cirurgia"></textarea>

            <h2>Histórico e Sintomas</h2>

            <label>Principal queixa:</label>
            <textarea id="queixa" required></textarea>

            <label>Histórico familiar:</label>
            <textarea id="historico"></textarea>

            <label>Observações:</label>
            <textarea id="observacoes"></textarea>

            <button type="submit">Salvar Ficha</button>

        </form>

        <h2>Fichas Cadastradas</h2>

        <div id="resultado"></div>

    </div>

    <footer>
        <p>Sistema de Ficha de Anamnese - 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
