
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCare Pro - Ficha Médica</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>✚ MediCare Pro</h1>
    <p>Sistema de cadastro e gerenciamento médico</p>
  </header>

  <main>
    <section class="formulario">
      <h2>Cadastro de paciente</h2>

      <form id="formPaciente">
        <label>Nome completo</label>
        <input type="text" id="nome" required>

        <div class="linha">
          <div>
            <label>Idade</label>
            <input type="number" id="idade" min="0" required>
          </div>
          <div>
            <label>Sexo</label>
            <select id="sexo" required>
              <option value="">Selecione</option>
              <option>Masculino</option>
              <option>Feminino</option>
              <option>Outro</option>
            </select>
          </div>
        </div>

        <label>Tipo sanguíneo</label>
        <select id="sangue">
          <option>Não informado</option>
          <option>A+</option>
          <option>A-</option>
          <option>B+</option>
          <option>B-</option>
          <option>AB+</option>
          <option>AB-</option>
          <option>O+</option>
          <option>O-</option>
        </select>

        <label>Telefone</label>
        <input type="tel" id="telefone">

        <label>Alergias</label>
        <input type="text" id="alergias" placeholder="Ex: nenhuma ou alergias conhecidas">

        <label>Sintomas</label>
        <textarea id="sintomas" required></textarea>

        <label>Histórico médico</label>
        <textarea id="historico"></textarea>

        <label>Diagnóstico</label>
        <textarea id="diagnostico"></textarea>

        <label>Prescrição / Orientações</label>
        <textarea id="prescricao"></textarea>

        <button type="submit">Salvar ficha médica</button>
      </form>
    </section>

    <section class="pacientes">
      <h2>Pacientes cadastrados</h2>
      <input type="search" id="pesquisa" placeholder="Pesquisar paciente...">
      <div id="listaPacientes"></div>
    </section>
  </main>

  <footer>
    <p>© 2026 MediCare Pro - Projeto demonstrativo</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
