
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Store | Loja Escolar</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🎒 School Store</h1>
    <p>Sua loja de materiais escolares online</p>
    <button onclick="abrirCarrinho()">
        🛒 Carrinho (<span id="contador">0</span>)
    </button>
</header>

<section class="banner">
    <h2>Volta às aulas!</h2>
    <p>Encontre tudo para seus estudos em um só lugar.</p>
</section>

<main>
    <h2 class="titulo">📚 Nossos Produtos</h2>
    <div class="produtos" id="produtos"></div>
</main>

<section class="carrinho" id="carrinho">
    <div class="topo-carrinho">
        <h2>🛒 Meu Carrinho</h2>
        <button onclick="fecharCarrinho()">✖</button>
    </div>

    <div id="itensCarrinho"></div>

    <div class="resumo">
        <p>Quantidade: <strong id="totalItens">0</strong></p>
        <h2>Total: R$ <span id="total">0,00</span></h2>
        <button class="finalizar" onclick="finalizarCompra()">
            Finalizar compra
        </button>
    </div>
</section>

<div class="fundo" id="fundo" onclick="fecharCarrinho()"></div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
