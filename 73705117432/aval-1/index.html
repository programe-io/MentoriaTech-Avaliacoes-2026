<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linha Reta — Moda e roupas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <a class="logo" href="#">Linha Reta</a>
    <button class="btn-carrinho" id="abrirCarrinho" aria-label="Abrir carrinho">
      Carrinho <span class="contador" id="contador">0</span>
    </button>
  </header>

  <section class="hero">
    <h1>Roupa feita para repetir.</h1>
    <p>Peças básicas em algodão e linho, do tamanho certo ao preço certo.</p>
  </section>

  <main>
    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por categoria"></div>
    <div class="grade" id="produtos"></div>
  </main>

  <div class="fundo" id="fundo"></div>
  <aside class="carrinho" id="carrinho" aria-label="Carrinho de compras">
    <div class="carrinho-topo">
      <h2>Seu carrinho</h2>
      <button class="fechar" id="fecharCarrinho" aria-label="Fechar carrinho">×</button>
    </div>
    <div class="itens" id="itens"></div>
    <div class="resumo">
      <label class="pix">
        <input type="checkbox" id="pix"> Pagar com Pix (5% de desconto)
      </label>
      <div class="linha"><span>Subtotal</span><span id="subtotal">R$ 0,00</span></div>
      <div class="linha" id="linhaDesconto" hidden><span>Desconto Pix</span><span id="desconto">R$ 0,00</span></div>
      <div class="linha total"><span>Total</span><span id="total">R$ 0,00</span></div>
      <button class="finalizar" id="finalizar">Finalizar compra</button>
      <button class="limpar" id="limpar">Esvaziar carrinho</button>
    </div>
  </aside>

  <div class="aviso" id="aviso" role="status"></div>
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
