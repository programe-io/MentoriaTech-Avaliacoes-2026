<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prumo — Rotina saudável</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <div>
      <h1>Prumo</h1>
      <p id="saudacao"></p>
    </div>
    <div class="anel" id="anel" role="img" aria-label="Progresso do dia">
      <strong id="anelTexto">0%</strong>
    </div>
  </header>

  <nav class="dias" id="dias" aria-label="Dias da semana"></nav>

  <main class="layout">
    <section class="coluna">
      <div class="titulo-secao">
        <h2 id="tituloDia">Treino do dia</h2>
        <span id="resumoDia" class="suave"></span>
      </div>
      <ul class="lista" id="lista"></ul>

      <form class="form" id="form">
        <h3>Adicionar exercício</h3>
        <div class="sugestoes" id="sugestoes" aria-label="Sugestões"></div>
        <div class="campos">
          <label>Nome
            <input id="nome" required maxlength="40" placeholder="Ex.: Agachamento">
          </label>
          <label>Categoria
            <select id="categoria">
              <option>Força</option><option>Cardio</option>
              <option>Mobilidade</option><option>Core</option>
            </select>
          </label>
          <label>Medida
            <select id="medida">
              <option value="series">Séries × repetições</option>
              <option value="minutos">Minutos</option>
            </select>
          </label>
          <div class="par" id="campoSeries">
            <label>Séries <input id="series" type="number" min="1" max="10" value="3"></label>
            <label>Repetições <input id="reps" type="number" min="1" max="100" value="12"></label>
          </div>
          <label id="campoMin" hidden>Duração (min)
            <input id="minutos" type="number" min="1" max="240" value="20">
          </label>
        </div>
        <button class="primario" type="submit">Adicionar ao dia</button>
      </form>
    </section>

    <aside class="coluna lateral">
      <div class="cartao">
        <h3>Água</h3>
        <p class="grande"><span id="aguaMl">0</span> <small>de 2.000 ml</small></p>
        <div class="barra"><div id="aguaBarra"></div></div>
        <div class="botoes">
          <button id="maisAgua">+ 250 ml</button>
          <button id="menosAgua" class="sec">− 250 ml</button>
        </div>
      </div>

      <div class="cartao">
        <h3>Sono</h3>
        <label class="sono">Horas dormidas na noite anterior
          <input id="sono" type="number" min="0" max="14" step="0.5" placeholder="0">
        </label>
        <p class="suave" id="dicaSono">Adultos costumam precisar de 7 a 9 horas.</p>
      </div>

      <div class="cartao">
        <h3>Semana</h3>
        <div class="grafico" id="grafico"></div>
        <p class="suave" id="resumoSemana"></p>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
