
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header class="header">
            <div>
                <h1>Gerenciador de Tarefas</h1>
                <p>Organize suas atividades e acompanhe seu progresso.</p>
            </div>
        </header>

        <!-- RESUMO -->

        <section class="cards">

            <div class="card">
                <h3>Total de tarefas</h3>
                <p id="totalTarefas">0</p>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <p id="tarefasPendentes">0</p>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <p id="tarefasConcluidas">0</p>
            </div>

        </section>

        <!-- CADASTRO -->

        <section class="form-section">

            <h2>Adicionar nova tarefa</h2>

            <form id="formTarefa">

                <input type="hidden" id="tarefaId">

                <div class="form-group">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título da tarefa"
                        required
                        maxlength="120"
                    >
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea
                        id="descricao"
                        placeholder="Descreva sua tarefa..."
                        rows="3"
                    ></textarea>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="prioridade">Prioridade</label>

                        <select id="prioridade">
                            <option value="Baixa">Baixa</option>
                            <option value="Média" selected>Média</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="prazo">Data de entrega</label>
                        <input type="date" id="prazo">
                    </div>

                </div>

                <button type="submit" id="btnSalvar">
                    Adicionar tarefa
                </button>

                <button type="button" id="btnCancelar" class="btn-cancelar hidden">
                    Cancelar edição
                </button>

            </form>

        </section>

        <!-- LISTA DE TAREFAS -->

        <section class="tasks-section">

            <div class="tasks-header">
                <h2>Minhas tarefas</h2>

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar tarefa..."
                >
            </div>

            <!-- FILTROS -->

            <div class="filtros">

                <button class="filtro active" data-filtro="todas">
                    Todas
                </button>

                <button class="filtro" data-filtro="pendentes">
                    Pendentes
                </button>

                <button class="filtro" data-filtro="concluidas">
                    Concluídas
                </button>

            </div>

            <!-- TAREFAS -->

            <div id="listaTarefas" class="lista-tarefas"></div>

            <p id="mensagemVazia" class="mensagem-vazia hidden">
                Nenhuma tarefa encontrada.
            </p>

        </section>

    </div>

    <script src="js/script.js"></script>

<script src="script.js"></script></body>
</html>
