<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
  <link rel="stylesheet" href="style.css">
  <!-- Ícones do FontAwesome para curtidas, comentários, etc. -->
  <link rel="stylesheet" href="https://cloudflare.com">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

  <div class="app-container">
    <!-- Menu Lateral (Sidebar) -->
    <aside class="sidebar">
      <h1 class="logo">Instagram</h1>
      <nav class="nav-links">
        <a href="#" class="active"><i class="fa-solid fa-house"><span>Início</span></i></a>
        <a href="#"><i class="fa-solid fa-magnifying-glass"><span>Pesquisa</span></i></a>
        <a href="#"><i class="fa-regular fa-compass"><span>Explorar</span></i></a>
        <a href="#"><i class="fa-regular fa-square-plus"><span>Criar</span></i></a>
        <a href="#"><i class="fa-regular fa-user"><span>Perfil</span></i></a>
      </nav>
    </aside>

    <!-- Conteúdo Principal (Feed) -->
    <main class="main-content">
      <!-- Stories / Status -->
      <section class="stories">
        <div class="story">
          <div class="story-ring"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQy3d5dEGZwVAQkmVUhlLL3YthMvhWF-Z75F5heUtz1NQ&s=10" alt="Avatar"></div>
          <span>seu_story</span>
        </div>
        <div class="story">
          <div class="story-ring"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQItvzAcwo9yjvgROGCUr_YkF7_8miWgvgbpu9lBe8nMw&s" alt="Avatar"></div>
          <span>maria_dev</span>
        </div>
        <div class="story">
          <div class="story-ring"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9PuhM_LXKVMRIMo43IW3yfeC-P619iFa2ucJSC5WJEA&s=10" alt="Avatar"></div>
          <span>joao_js</span>
        </div>
      </section>

      <!-- Feed de Posts -->
      <section class="feed">
        <article class="post">
          <header class="post-header">
            <div class="user-info">
              <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcStVIBzuuMgQQ4t8f7GPuW1i7Dwfwzatkrw22RNT2JeRXbRE7EjIAjwYac&s=10" alt="Foto perfil">
              <span>dev_frontend</span>
            </div>
            <i class="fa-solid fa-ellipsis"></i>
          </header>

          <div class="post-image">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTENrwuBZA6psyPmUtjh4hUW8q0D12zWrwhWKJCAZEN7Q&s=10" alt="Postagem">
          </div>

          <div class="post-actions">
            <div class="left-actions">
              <i class="fa-regular fa-heart like-btn" onclick="toggleLike(this)"></i>
              <i class="fa-regular fa-comment"></i>
              <i class="fa-regular fa-paper-plane"></i>
            </div>
            <i class="fa-regular fa-bookmark"></i>
          </div>

          <div class="post-footer">
            <p class="likes-count"><strong>1,240 curtidas</strong></p>
            <p class="caption"><strong>dev_frontend</strong> Construindo um clone do Instagram com HTML, CSS e JS! 🚀</p>
            <div class="add-comment">
              <input type="text" placeholder="Adicione um comentário...">
              <button>Publicar</button>
            </div>
          </div>
        </article>
      </section>
    </main>

    <!-- Sugestões Laterais -->
    <aside class="suggestions">
      <div class="current-user">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQy3d5dEGZwVAQkmVUhlLL3YthMvhWF-Z75F5heUtz1NQ&s=10" alt="Eu">
        <div>
          <span class="username"></span>
          <span class="name">Pedro Isaac</span>
        </div>
        <a href="#" class="switch-btn">Mudar</a>
      </div>
      <div class="suggestions-header">
        <span>Sugestões para você</span>
        <a href="#">Ver tudo</a>
      </div>
      <div class="suggestion-item">
        <div class="user-info">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxcjOASQmNcQDY90eTIXxi-QUHAzJ6JElYvHUgI68b-SJeTEKdjt6L3Vk&s=10" alt="">
          <div>
            <span class="username">css_master</span>
            <span class="subtext">Seguido por joao_js</span>
          </div>
        </div>
        <a href="#" class="follow-btn">Seguir</a>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
