<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetGram - Feed Canino</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="header-container">
            <h1>🐶 PetGram</h1>
            <span>A rede social dos cães</span>
        </div>
    </header>

    <main class="feed-container">
        <!-- Formulário para criar novo post no feed -->
        <section class="create-post">
            <h2>Compartilhe um momento</h2>
            <form id="post-form">
                <input type="text" id="pet-name" placeholder="Nome do seu cachorro (ex: Thor)" required>
                <input type="url" id="pet-photo" placeholder="URL da foto do cachorro (opcional)">
                <textarea id="pet-caption" rows="2" placeholder="O que seu pet está aprontando hoje?" required></textarea>
                <button type="submit">Publicar no Feed</button>
            </form>
        </section>

        <!-- Onde as postagens do feed serão carregadas -->
        <section id="feed-list"></section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
