<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Barra Lateral (Desktop) / Barra Inferior (Mobile) -->
    <aside class="sidebar">
        <div class="logo">Instagram</div>
        <nav class="nav-links">
            <button class="nav-item active" onclick="window.scrollTo(0,0)">
                <span>🏠</span> <span class="nav-text">Página inicial</span>
            </button>
            <button class="nav-item" id="open-create-modal">
                <span>➕</span> <span class="nav-text">Criar</span>
            </button>
            <button class="nav-item" onclick="alert('Você está logado como @seu_perfil')">
                <span>👤</span> <span class="nav-text">Perfil</span>
            </button>
        </nav>
    </aside>

    <!-- Área Principal -->
    <main class="main-content">
        <div class="feed-wrapper">
            <!-- Barra de Stories -->
            <section class="stories-bar" id="stories-container"></section>

            <!-- Feed de Postagens -->
            <section id="posts-feed"></section>
        </div>

        <!-- Coluna Direita (Sugestões - Desktop) -->
        <aside class="suggestions-panel">
            <div class="current-user">
                <img src="https://unsplash.com" alt="Avatar">
                <div>
                    <strong>seu_perfil</strong>
                    <span>Seu Nome</span>
                </div>
            </div>
            <p class="suggestions-title">Sugestões para você</p>
            <div class="suggestion-item">
                <div class="sug-info">
                    <img src="https://unsplash.com" alt="User">
                    <div>
                        <strong>lucas.dev</strong>
                        <span>Seguido por ana_clara</span>
                    </div>
                </div>
                <button class="follow-btn" onclick="toggleFollow(this)">Seguir</button>
            </div>
            <div class="suggestion-item">
                <div class="sug-info">
                    <img src="https://unsplash.com" alt="User">
                    <div>
                        <strong>viagens_br</strong>
                        <span>Sugestão para você</span>
                    </div>
                </div>
                <button class="follow-btn" onclick="toggleFollow(this)">Seguir</button>
            </div>
        </aside>
    </main>

    <!-- Modal para Criar Nova Publicação -->
    <div id="create-modal" class="modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Criar nova publicação</h3>
                <span id="close-create-modal" class="close-btn">&times;</span>
            </div>
            <form id="new-post-form">
                <label class="file-upload-label">
                    📁 Escolher foto do computador
                    <input type="file" id="post-file" accept="image/*">
                </label>
                <span class="divider-text">ou cole um link de imagem</span>
                <input type="url" id="post-url" placeholder="https://exemplo.com">
                <textarea id="post-caption" rows="3" placeholder="Escreva uma legenda..." required></textarea>
                <button type="submit" class="submit-post-btn">Compartilhar</button>
            </form>
        </div>
    </div>

    <!-- Modal para Visualizar Story -->
    <div id="story-modal" class="modal story-viewer">
        <div class="story-content">
            <div class="story-progress"><div class="story-bar-fill"></div></div>
            <div class="story-header">
                <img id="story-avatar" src="" alt="">
                <strong id="story-username"></strong>
                <span id="close-story" class="close-story-btn">&times;</span>
            </div>
            <img id="story-image" src="" alt="Story">
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
