<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Canino - Blog sobre Cachorros</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="container header-content">
            <h1>🐾 Mundo Canino</h1>
            <nav>
                <button class="filter-btn active" data-category="todos">Todos</button>
                <button class="filter-btn" data-category="saude">Saúde</button>
                <button class="filter-btn" data-category="adestramento">Adestramento</button>
                <button class="filter-btn" data-category="curiosidades">Curiosidades</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Dicas, cuidados e amor para o seu melhor amigo</h2>
            <p>Tudo o que você precisa saber para deixar seu cãozinho feliz e saudável.</p>
        </section>

        <!-- Os posts serão inseridos aqui automaticamente pelo JavaScript -->
        <section id="posts-container" class="posts-grid"></section>
    </main>

    <!-- Janela Modal para ler o post completo -->
    <div id="post-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <img id="modal-img" src="" alt="Imagem do post">
            <span id="modal-category" class="badge"></span>
            <h2 id="modal-title"></h2>
            <p id="modal-date" class="date"></p>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Mundo Canino. Feito com amor para amantes de cães.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
