<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minefeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>

        <div class="header-content">

            <h1>Minefeed</h1>

            <nav>
                <a href="#">Inicio</a>
                <a href="#">Perfil</a>
            </nav>

        </div>

    </header>

    <main> 

        <section class="new-post">

            <div class="user">

                <div class="avatar">
                    R
                </div>

                <div>
                    <strong>Reginaldo</strong>
                    <span>O que Voce esta pensado</span>
                </div>

                <button>Publicar</button>


            </div>



        </section>

        <article class="post">

            <div class="post-header">

                <div class="user">

                    <div class="avatar">
                        L
                    </div>

                    <div>
                        <strong>lucas</strong>
                        <span>há 30 minutos</span>
                    </div>

                </div>

            </div>

            <div class="post-text">
                Hoje eu joguei o meu jogo favorito, muito top
            </div>

            <img src="https://assets-prd.ignimgs.com/2022/01/04/manhunt-2-button-1641281784696.jpg?crop=1%3A1%2Csmart&format=jpg&auto=webp&quality=80" alt="Manhunt">

            <div class="post-actions">
                <button>Curtir</button>
                <button>comentar</button>
            </div>

        </article>



        
    
    </main>

    <footer>
        <p>Minefeed - Todos Direitos Reservados - 2026</p>
    </footer>

</body>
</html>
