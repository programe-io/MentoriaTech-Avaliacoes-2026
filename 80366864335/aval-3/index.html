
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

<div class="sidebar">
    <h1>Instagram</h1>

    <a href="#"><i class="fa-solid fa-house"></i> Início</a>
    <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Pesquisar</a>
    <a href="#"><i class="fa-regular fa-compass"></i> Explorar</a>
    <a href="#"><i class="fa-solid fa-clapperboard"></i> Reels</a>
    <a href="#"><i class="fa-brands fa-facebook-messenger"></i> Mensagens</a>
    <a href="#"><i class="fa-regular fa-heart"></i> Notificações</a>
    <a href="#" onclick="abrirModal(); return false;">
        <i class="fa-solid fa-plus"></i> Criar publicação
    </a>
    <a href="#"><i class="fa-solid fa-user"></i> Perfil</a>
</div>

<main>

    <section class="stories">
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=5">
            <p>Seu story</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=12">
            <p>Mariana</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=9">
            <p>Camila</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=20">
            <p>Juliana</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=25">
            <p>Amanda</p>
        </div>
    </section>

    <section class="feed" id="feed">

        <article class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=12">
                <strong>mariana.oficial</strong>
                <span>•••</span>
            </div>

            <img class="post-image"
            src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=800"
            alt="Look feminino">

            <div class="actions">
                <button onclick="curtir(this)">
                    <i class="fa-regular fa-heart"></i>
                </button>

                <button onclick="comentar(this)">
                    <i class="fa-regular fa-comment"></i>
                </button>

                <button>
                    <i class="fa-regular fa-paper-plane"></i>
                </button>

                <button class="save">
                    <i class="fa-regular fa-bookmark"></i>
                </button>
            </div>

            <p class="likes">1.250 curtidas</p>
            <p><strong>mariana.oficial</strong> Amando esse look! 💗</p>

            <div class="comentarios"></div>

            <div class="comment-box">
                <input type="text" placeholder="Adicione um comentário...">
                <button onclick="enviarComentario(this)">Publicar</button>
            </div>
        </article>

        <article class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=9">
                <strong>camila_style</strong>
                <span>•••</span>
            </div>

            <img class="post-image"
            src="https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=800"
            alt="Vestido elegante">

            <div class="actions">
                <button onclick="curtir(this)">
                    <i class="fa-regular fa-heart"></i>
                </button>

                <button onclick="comentar(this)">
                    <i class="fa-regular fa-comment"></i>
                </button>

                <button>
                    <i class="fa-regular fa-paper-plane"></i>
                </button>

                <button class="save">
                    <i class="fa-regular fa-bookmark"></i>
                </button>
            </div>

            <p class="likes">980 curtidas</p>
            <p><strong>camila_style</strong> Elegância sempre! ✨</p>

            <div class="comentarios"></div>

            <div class="comment-box">
                <input type="text" placeholder="Adicione um comentário...">
                <button onclick="enviarComentario(this)">Publicar</button>
            </div>
        </article>

    </section>
</main>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2>Criar publicação</h2>

        <input type="text" id="usuario" placeholder="Nome de usuário">
        <input type="text" id="foto" placeholder="URL da imagem">
        <textarea id="legenda" placeholder="Escreva uma legenda..."></textarea>

        <button onclick="publicar()">Compartilhar</button>
        <button onclick="fecharModal()" class="fechar">Cancelar</button>
    </div>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
