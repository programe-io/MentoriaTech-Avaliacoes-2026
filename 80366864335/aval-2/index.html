
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Fashion Feed 💗</h1>
    <p>Inspiração e estilo todos os dias!</p>
</header>

<main>
    <section class="novo-post">
        <h2>Compartilhe seu look ✨</h2>
        <input type="text" id="nome" placeholder="Seu nome">
        <input type="text" id="imagem" placeholder="URL da imagem do look">
        <textarea id="legenda" placeholder="Escreva uma legenda..."></textarea>
        <button onclick="publicar()">Publicar</button>
    </section>

    <section id="feed">

        <article class="post">
            <h3>Mariana 💕</h3>
            <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=600" alt="Look feminino">
            <p>Um look perfeito para arrasar! 🌸</p>
            <button onclick="curtir(this)">♡ Curtir</button>
            <span>0 curtidas</span>
        </article>

        <article class="post">
            <h3>Camila ✨</h3>
            <img src="https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=600" alt="Vestido feminino">
            <p>Elegância em cada detalhe! 💗</p>
            <button onclick="curtir(this)">♡ Curtir</button>
            <span>0 curtidas</span>
        </article>

    </section>
</main>

<footer>
    <p>Fashion Feed © 2026 | Moda feminina 💕</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
