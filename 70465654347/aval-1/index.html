<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <div class="formulario">
            <input type="text" id="titulo" placeholder="Título da tarefa">

            <input type="text" id="descricao" placeholder="Descrição">

            <select id="prioridade">
                <option value="">Selecione a prioridade</option>
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>
            </select>

            <button onclick="cadastrarTarefa()">Cadastrar Tarefa</button>
        </div>

        <div class="busca">
            <input type="text" id="busca" placeholder="Buscar tarefa...">
            <button onclick="buscarTarefa()">Buscar</button>
            <button onclick="listarTarefas()">Listar Todas</button>
        </div>

        <div id="listaTarefas"></div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
