
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Controle de IMC</h1>
        <p>Sistema de avaliação corporal</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Dados do Paciente</h2>

            <form id="formIMC">

                <label for="nome">Nome do paciente</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="peso">Peso (kg)</label>
                <input
                    type="number"
                    id="peso"
                    placeholder="Ex: 70"
                    step="0.1"
                    min="1"
                    required
                >

                <label for="altura">Altura (cm)</label>
                <input
                    type="number"
                    id="altura"
                    placeholder="Ex: 175"
                    step="0.1"
                    min="1"
                    required
                >

                <button type="submit">Calcular IMC</button>

            </form>
        </section>

        <section class="resultado" id="resultado">

            <h2>Resultado do Paciente</h2>

            <p id="mensagem">
                Preencha os dados para calcular seu IMC.
            </p>

            <div class="dados-resultado">
                <h3 id="nomeResultado"></h3>

                <p>Seu IMC é:</p>

                <span id="valorIMC">--</span>

                <h3 id="classificacao"></h3>

                <p id="descricao"></p>
            </div>

        </section>

    </main>

    <footer>
        <p>Projeto Prático - Controle de IMC</p>
        <p>Desenvolvido com HTML, CSS e JavaScript</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
