
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Controle e gerenciamento de produtos</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <label for="codigo">Código do produto</label>
                <input type="text" id="codigo"
                    placeholder="Ex: 001" required>

                <label for="descricao">Descrição</label>
                <input type="text" id="descricao"
                    placeholder="Nome do produto" required>

                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade"
                    min="0" placeholder="Ex: 20" required>

                <label for="valor">Valor (R$)</label>
                <input type="number" id="valor"
                    min="0" step="0.01"
                    placeholder="Ex: 15.50" required>

                <button type="submit">Cadastrar Produto</button>

            </form>
        </section>

        <section class="card">
            <h2>Produtos Cadastrados</h2>

            <div class="resumo">
                <div>
                    <span>Total de produtos</span>
                    <strong id="totalProdutos">0</strong>
                </div>

                <div>
                    <span>Total em estoque</span>
                    <strong id="totalEstoque">0</strong>
                </div>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                    </tbody>
                </table>
            </div>

            <p id="mensagemVazia">
                Nenhum produto cadastrado.
            </p>
        </section>

    </main>

    <footer>
        <p> Sistema de Controle de Estoque - 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
