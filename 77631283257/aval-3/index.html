<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  
<div class="container">
  <h1>📚 Avaliações Trimestrais</h1>
  <p>Organize e acompanhe suas atividades escolares.</p>

  <div class="avaliacao">
    <h3>Avaliação 1 — Primeiro Trimestre</h3>
    <input id="link1" type="url" placeholder="Cole o link da atividade">
    <button onclick="enviar(1)">Enviar</button>
    <p id="status1">⏳ Não enviada</p>
  </div>

  <div class="avaliacao">
    <h3>Avaliação 2 — Segundo Trimestre</h3>
    <input id="link2" type="url" placeholder="Cole o link da atividade">
    <button onclick="enviar(2)">Enviar</button>
    <p id="status2">⏳ Não enviada</p>
  </div>

  <div class="avaliacao">
    <h3>Avaliação 3 — Terceiro Trimestre</h3>
    <input id="link3" type="url" placeholder="Cole o link da atividade">
    <button onclick="enviar(3)">Enviar</button>
    <p id="status3">⏳ Não enviada</p>
  </div>

  <div class="progresso">
    <h3>Progresso das atividades</h3>
    <p id="contador">0 de 3 avaliações enviadas</p>
    <div class="barra">
      <div id="preenchimento"></div>
    </div>
  </div>
</div>

  <script src="script.js"></script>
  
</body>
</html>
