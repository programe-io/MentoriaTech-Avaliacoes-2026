<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <h1>Controle de IMC</h1>
        <p class="subtitulo">Preencha os dados do paciente abaixo.</p>

        <form id="form-imc">
            <div class="campo">
                <label for="nome">Nome do Paciente</label>
                <input type="text" id="nome" placeholder="Ex: João Silva" required>
            </div>

            <div class="campo">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" step="0.1" min="1" placeholder="Ex: 75.5" required>
            </div>

            <div class="campo">
                <label for="altura">Altura (m)</label>
                <input type="number" id="altura" step="0.01" min="0.5" max="2.5" placeholder="Ex: 1.75" required>
            </div>

            <div class="botoes">
                <button type="submit" class="btn-calcular">Calcular IMC</button>
                <button type="button" id="btn-limpar" class="btn-limpar">Limpar</button>
            </div>
        </form>

        <section id="resultado" class="resultado oculto">
            <h2 id="res-paciente"></h2>
            <p class="valor-imc">IMC: <strong id="res-valor"></strong></p>
            <p class="classificacao">Classificação: <span id="res-classificacao"></span></p>
            <p id="res-info" class="info-extra"></p>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
