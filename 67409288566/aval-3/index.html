<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Estoque</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="container">
    <h1>Sistema de Controle de Estoque</h1>

    <!-- 1. CADASTRAR NOVO PRODUTO -->
    <section class="card">
      <h2>1. Cadastrar Novo Produto</h2>
      <form id="form-cadastro">
        <div class="linha-inputs">
          <input type="text" id="cad-codigo" placeholder="Código (ex: 101)" required>
          <input type="text" id="cad-descricao" placeholder="Descrição do produto" required>
          <input type="number" id="cad-quantidade" placeholder="Quantidade" min="0" required>
          <input type="number" id="cad-valor" placeholder="Valor (R$)" step="0.01" min="0" required>
        </div>
        <button type="submit" class="btn-azul">Cadastrar Produto</button>
      </form>
    </section>

    <!-- 2. ALTERAR VALOR E QUANTIDADE -->
    <div class="grid-duplo">
      <!-- Alterar Valor -->
      <section class="card">
        <h2>2. Alterar Valor</h2>
        <form id="form-valor">
          <input type="text" id="val-codigo" placeholder="Código do produto" required>
          <input type="number" id="val-novo" placeholder="Novo valor (R$)" step="0.01" min="0" required>
          <button type="submit" class="btn-verde">Atualizar Valor</button>
        </form>
      </section>

      <!-- Alterar Quantidade -->
      <section class="card">
        <h2>3. Alterar Quantidade</h2>
        <form id="form-quantidade">
          <input type="text" id="qtd-codigo" placeholder="Código do produto" required>
          <input type="number" id="qtd-nova" placeholder="Nova quantidade" min="0" required>
          <button type="submit" class="btn-verde">Atualizar Quantidade</button>
        </form>
      </section>
    </div>

    <!-- 3. LISTAR PRODUTOS CADASTRADOS -->
    <section class="card">
      <div class="topo-lista">
        <h2>4. Produtos Cadastrados</h2>
        <button type="button" id="btn-listar" class="btn-cinza">Atualizar Lista</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Quantidade</th>
            <th>Valor Unitário</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <tr>
            <td colspan="4" class="vazio">Nenhum produto cadastrado.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
