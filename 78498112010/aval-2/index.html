<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mini Feed Sofrência</title>
                <link rel="stylesheet" href="style.css">
                <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>👑 Mini Feed Sofrência</h1>
                                    <p>Espaço para partilhar as tuas músicas e versos favoritos</p>
                                        </header>

                                            <main class="container">
                                                    <!-- Formulário para criar uma publicação -->
                                                            <section class="post-form">
                                                                        <h3>Nova Publicação</h3>
                                                                                    <input type="text" placeholder="Nome da música..." value="Troca de Calçada">
                                                                                                <textarea placeholder="Escreve o teu verso favorito...">Se alguém passar por ela, fique em silêncio...</textarea>
                                                                                                            <button type="button">Publicar 🎵</button>
                                                                                                                    </section>

                                                                                                                            <!-- Feed de publicações -->
                                                                                                                                    <section class="feed">
                                                                                                                                                <article class="post">
                                                                                                                                                                <div class="user-info">
                                                                                                                                                                                    <img src="https://i.pravatar.cc/100" alt="Avatar" class="avatar">
                                                                                                                                                                                                        <span class="username">Fã N.º 1</span>
                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                        <div class="music-card">
                                                                                                                                                                                                                                                                            <!-- Capa em SVG (Gerada diretamente pelo navegador) -->
                                                                                                                                                                                                                                                                                                <svg class="album-cover" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                                                                                                                                                                                                                                                                                                                        <rect width="100" height="100" fill="#1b2a47"/>
                                                                                                                                                                                                                                                                                                                                                <circle cx="80" cy="20" r="12" fill="#e5a93b"/>
                                                                                                                                                                                                                                                                                                                                                                        <path d="M0 60 Q 25 40, 50 60 T 100 60 L 100 100 L 0 100 Z" fill="#2d4059"/>
                                                                                                                                                                                                                                                                                                                                                                                                <path d="M0 75 Q 35 55, 70 75 T 100 70 L 100 100 L 0 100 Z" fill="#e5a93b" opacity="0.8"/>
                                                                                                                                                                                                                                                                                                                                                                                                                        <text x="50" y="50" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">TROCA DE</text>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <text x="50" y="62" font-family="sans-serif" font-size="9" fill="#e5a93b" text-anchor="middle" font-weight="bold">CALÇADA</text>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </svg>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="music-details">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h4>Troca de Calçada</h4>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>Marília Mendonça • Decretos Reais</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p class="post-content">"Se alguém passar por ela, fique em silêncio / Respeite a dor de quem não teve escolha..." 💔</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </article>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
