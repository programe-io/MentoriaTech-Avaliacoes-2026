```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Turbo Recomendações</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
}

header{
    background:#ff0000;
    padding:20px;
    text-align:center;
    font-size:2rem;
    font-weight:bold;
}

.search{
    display:flex;
    justify-content:center;
    margin:20px;
}

.search input{
    width:60%;
    padding:12px;
    border:none;
    border-radius:8px 0 0 8px;
}

.search button{
    padding:12px 20px;
    border:none;
    background:#ff0000;
    color:white;
    cursor:pointer;
    border-radius:0 8px 8px 0;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#1f1f1f;
    border-radius:12px;
    overflow:hidden;
    transition:.3s;
}

.card:hover{
    transform:scale(1.03);
}

.card iframe{
    width:100%;
    height:200px;
}

.info{
    padding:15px;
}

.info h3{
    margin-bottom:10px;
}

.tag{
    display:inline-block;
    background:red;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    margin-top:10px;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
🔥 YouTube Turbo Recomendações 🔥
</header>

<div class="search">
    <input type="text" id="pesquisa" placeholder="Pesquisar vídeos...">
    <button onclick="buscar()">Buscar</button>
</div>

<div class="container" id="videos">

<div class="card">
<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
<div class="info">
<h3>Vídeo Viral</h3>
<p>Um dos vídeos mais famosos da internet.</p>
<span class="tag">Trending</span>
</div>
</div>

<div class="card">
<iframe src="https://www.youtube.com/embed/jNQXAC9IVRw" allowfullscreen></iframe>
<div class="info">
<h3>Primeiro Vídeo do YouTube</h3>
<p>História da plataforma.</p>
<span class="tag">Histórico</span>
</div>
</div>

<div class="card">
<iframe src="https://www.youtube.com/embed/kJQP7kiw5Fk" allowfullscreen></iframe>
<div class="info">
<h3>Música Popular</h3>
<p>Entre os vídeos mais vistos.</p>
<span class="tag">Música</span>
</div>
</div>

</div>

<script>
function buscar(){
    let texto = document.getElementById("pesquisa").value;

    if(texto.trim() === ""){
        alert("Digite algo para pesquisar!");
        return;
    }

    window.open(
      "https://www.youtube.com/results?search_query=" +
      encodeURIComponent(texto),
      "_blank"
    );
}
</script>

</body>
</html>
```
