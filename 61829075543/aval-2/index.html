<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas Fofo ✨</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <header class="header">
      <h1>✨ Minhas Tarefas Fofas ✨</h1>
      <p>Organize seu dia com muito carinho e cor! 🌸</p>
    </header>

    <!-- Formulário de Cadastro -->
    <section class="card form-card">
      <h2>Cadastrar Nova Tarefa 📝</h2>
      
      <form id="formTarefa">
        <div class="input-group">
          <label for="titulo">Título da Tarefa:</label>
          <input 
            type="text" 
            id="titulo" 
            placeholder="Digite no mínimo 5 caracteres... 💖"
            autocomplete="off"
          >
        </div>

        <div class="input-group">
          <label for="prioridade">Prioridade:</label>
          <select id="prioridade">
            <option value="1">1 - Alta (Urgente! 🔥)</option>
            <option value="2" selected>2 - Média (Importante 🧡)</option>
            <option value="3">3 - Baixa (Tranquilo 🌸)</option>
          </select>
        </div>

        <button type="submit" id="btnCadastrar">Adicionar Tarefa 💖</button>
      </form>

      <!-- Mensagem de erro/sucesso -->
      <div id="mensagemFeedback" class="feedback"></div>
    </section>

    <!-- Lista de Tarefas -->
    <section class="card list-card">
      <h2>Lista de Tarefas 📋</h2>
      
      <div id="listaTarefas" class="lista-container">
        <!-- As tarefas cadastradas serão inseridas aqui via JavaScript -->
      </div>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>$0
