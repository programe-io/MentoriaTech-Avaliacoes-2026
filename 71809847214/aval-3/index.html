
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de IMC do Paciente</title>

    <link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Calculadora de IMC</h1>

        <p>Informe os dados do paciente abaixo:</p>

        <!-- FORMULÁRIO DO PACIENTE -->

        <form id="formulario">

            <label for="nome">Nome do Paciente:</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite o nome do paciente"
                required
            >

            <label for="peso">Peso (kg):</label>
            <input
                type="number"
                id="peso"
                placeholder="Exemplo: 70"
                min="0.1"
                step="0.1"
                required
            >

            <label for="altura">Altura (metros):</label>
            <input
                type="number"
                id="altura"
                placeholder="Exemplo: 1.75"
                min="0.1"
                max="2.99"
                step="0.01"
                required
            >

            <button type="submit">
                Calcular IMC
            </button>

        </form>

        <!-- RESULTADO DO PACIENTE -->

        <div id="resultado">

            <h2>Resultado do Paciente</h2>

            <p>
                <strong>Nome:</strong>
                <span id="resNome"></span>
            </p>

            <p>
                <strong>Peso:</strong>
                <span id="resPeso"></span> kg
            </p>

            <p>
                <strong>Altura:</strong>
                <span id="resAltura"></span> m
            </p>

            <hr>

            <h3>Índice de Massa Corporal (IMC)</h3>

            <div id="resIMC" class="imc"></div>

            <p>
                <strong>Classificação:</strong>
                <span id="resClassificacao"></span>
            </p>

            <h3>Informações sobre o IMC</h3>

            <p id="resInformacao"></p>

            <p class="aviso">
                O IMC é um indicador de triagem e não substitui
                a avaliação de um profissional de saúde.
            </p>

        </div>

    </div>

    <!-- ARQUIVO JAVASCRIPT -->

    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
