<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha - Neon Edition</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="background-animation"></div>

    <header>
        <h1>JOGO DA VELHA</h1>
        <p class="subtitulo">Neon Edition</p>
    </header>

    <main class="container-jogo">
        <div class="placar">
            <div class="jogador-card jogador-x ativo" id="card-x">
                <span class="simbolo">X</span>
                <span class="nome">Jogador 1</span>
                <span class="pontos" id="pontos-x">0</span>
            </div>
            <div class="jogador-card jogador-o" id="card-o">
                <span class="simbolo">O</span>
                <span class="nome">Jogador 2</span>
                <span class="pontos" id="pontos-o">0</span>
            </div>
        </div>

        <h2 id="status-jogo">Vez do jogador: X</h2>

        <div class="tabuleiro" id="tabuleiro">
            <div class="celula" data-index="0"></div>
            <div class="celula" data-index="1"></div>
            <div class="celula" data-index="2"></div>
            <div class="celula" data-index="3"></div>
            <div class="celula" data-index="4"></div>
            <div class="celula" data-index="5"></div>
            <div class="celula" data-index="6"></div>
            <div class="celula" data-index="7"></div>
            <div class="celula" data-index="8"></div>
        </div>

        <div class="controles">
            <button id="btn-reiniciar">🔄 Reiniciar Rodada</button>
            <button id="btn-zerar" class="secundario">🗑️ Zerar Placar</button>
        </div>
    </main>

    <footer>
        <p>Feito com HTML, CSS e JavaScript puro 💜</p>
    </footer>

    <!-- Modal de Vitória -->
    <div class="modal" id="modal">
        <div class="modal-conteudo">
            <h2 id="modal-titulo">🎉 Vitória!</h2>
            <p id="modal-mensagem">O jogador X venceu a rodada!</p>
            <button id="btn-proxima">Próxima Rodada</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
