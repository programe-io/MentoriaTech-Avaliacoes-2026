<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de Contato</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f2f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .formulario {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }

        .titulo {
            text-align: center;
            margin-bottom: 30px;
        }

        .titulo h1 {
            color: #222;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .titulo p {
            color: #777;
            font-size: 15px;
        }

        .linha {
            display: flex;
            gap: 15px;
        }

        .campo {
            width: 100%;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e1e5eb;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        textarea {
            height: 130px;
            resize: none;
        }

        .termos {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }

        .termos input {
            width: auto;
        }

        .botao {
            width: 100%;
            padding: 15px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .botao:hover {
            background: #3730a3;
            transform: translateY(-2px);
        }

        .sucesso {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #dcfce7;
            color: #166534;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .formulario {
                padding: 25px;
            }

            .linha {
                flex-direction: column;
                gap: 0;
            }

            .titulo h1 {
                font-size: 26px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <div class="formulario">

        <div class="titulo">
            <h1>Entre em contato</h1>
            <p>Preencha o formulário abaixo para falar conosco.</p>
        </div>

        <form id="meuFormulario">

            <div class="linha">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="sobrenome">Sobrenome</label>
                    <input
                        type="text"
                        id="sobrenome"
                        placeholder="Seu sobrenome"
                        required
                    >
                </div>

            </div>

            <div class="linha">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        placeholder="(00) 00000-0000"
                    >
                </div>

            </div>

            <div class="campo">
                <label for="assunto">Assunto</label>

                <select id="assunto" required>
                    <option value="">Selecione um assunto</option>
                    <option value="duvida">Dúvida</option>
                    <option value="suporte">Suporte</option>
                    <option value="orcamento">Orçamento</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem</label>

                <textarea
                    id="mensagem"
                    placeholder="Escreva sua mensagem..."
                    required
                ></textarea>
            </div>

            <div class="termos">
                <input type="checkbox" id="termos" required>

                <label for="termos">
                    Aceito os termos e condições.
                </label>
            </div>

            <button type="submit" class="botao">
                Enviar mensagem
            </button>

            <div class="sucesso" id="sucesso">
                ✅ Mensagem enviada com sucesso!
            </div>

        </form>

    </div>

    <script>
        const formulario = document.getElementById("meuFormulario");
        const sucesso = document.getElementById("sucesso");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            sucesso.style.display = "block";

            formulario.reset();

            setTimeout(function() {
                sucesso.style.display = "none";
            }, 5000);

        });
    </script>

</body>
</html>
