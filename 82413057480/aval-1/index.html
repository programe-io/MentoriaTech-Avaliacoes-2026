<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jogo 3D</title>
<style>
body{
    margin:0;
    overflow:hidden;
}
canvas{
    display:block;
}
</style>
<link href="style.css" rel="stylesheet"></head>
<body>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.166/build/three.module.js";

// Cena
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

// Câmera
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.set(0,2,5);

// Renderizador
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// Luz
const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,0.5));

// Chão
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(50,50),
    new THREE.MeshStandardMaterial({color:0x44aa44})
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// Jogador
const player = new THREE.Mesh(
    new THREE.BoxGeometry(),
    new THREE.MeshStandardMaterial({color:0xff0000})
);
player.position.y = 0.5;
scene.add(player);

// Controles
const keys = {};

document.addEventListener("keydown",(e)=>keys[e.key]=true);
document.addEventListener("keyup",(e)=>keys[e.key]=false);

function update(){

    if(keys["w"]) player.position.z -= 0.08;
    if(keys["s"]) player.position.z += 0.08;
    if(keys["a"]) player.position.x -= 0.08;
    if(keys["d"]) player.position.x += 0.08;

    camera.position.x = player.position.x;
    camera.position.z = player.position.z + 5;
    camera.lookAt(player.position);
}

function animate(){
    requestAnimationFrame(animate);
    update();
    renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

<script src="script.js"></script></body>
</html>
