<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vogle</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#fff;
}

.container{
    text-align:center;
}

.logo{
    font-size:70px;
    font-weight:bold;
    margin-bottom:30px;
}

.logo span:nth-child(1){color:#4285F4;}
.logo span:nth-child(2){color:#EA4335;}
.logo span:nth-child(3){color:#FBBC05;}
.logo span:nth-child(4){color:#4285F4;}
.logo span:nth-child(5){color:#34A853;}

.search-box{
    width:600px;
    max-width:90%;
    padding:15px 20px;
    border:1px solid #dcdcdc;
    border-radius:30px;
    font-size:18px;
    outline:none;
    transition:.3s;
}

.search-box:focus{
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

.buttons{
    margin-top:30px;
}

button{
    padding:12px 22px;
    margin:5px;
    border:none;
    border-radius:5px;
    background:#f8f9fa;
    cursor:pointer;
    font-size:15px;
    transition:.3s;
}

button:hover{
    background:#e8eaed;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="logo">
        <span>V</span>
        <span>o</span>
        <span>g</span>
        <span>l</span>
        <span>e</span>
    </div>

    <input class="search-box" type="text" placeholder="Pesquisar no Vogle">

    <div class="buttons">
        <button>Pesquisar</button>
        <button>Estou com sorte</button>
    </div>

</div>

</body>
</html>
