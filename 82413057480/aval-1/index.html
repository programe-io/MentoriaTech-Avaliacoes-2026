<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .descricao {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .botao {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .botao:hover {
            background: #5568d9;
            transform: translateY(-2px);
        }

        #mensagem {
            display: none;
            margin-top: 20px;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            background: #d4edda;
            color: #155724;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1>Cadastro</h1>
        <p class="descricao">Preencha os dados abaixo</p>

        <form id="formulario">

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemplo@email.com"
                    required
                >
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >
            </div>

            <div class="campo">
                <label for="idade">Idade</label>
                <input
                    type="number"
                    id="idade"
                    name="idade"
                    min="1"
                    max="120"
                    placeholder="Digite sua idade"
                    required
                >
            </div>

            <div class="campo">
                <label for="cidade">Cidade</label>
                <select id="cidade" name="cidade" required>
                    <option value="">Selecione...</option>
                    <option value="teresina">Teresina</option>
                    <option value="sao-paulo">São Paulo</option>
                    <option value="rio">Rio de Janeiro</option>
                    <option value="brasilia">Brasília</option>
                    <option value="outra">Outra</option>
                </select>
            </div>

            <div class="campo">
                <label for="mensagemTexto">Mensagem</label>
                <textarea
                    id="mensagemTexto"
                    name="mensagem"
                    placeholder="Digite sua mensagem..."
                ></textarea>
            </div>

            <button type="submit" class="botao">
                Enviar formulário
            </button>

            <div id="mensagem">
                ✅ Formulário enviado com sucesso!
            </div>

        </form>

    </div>

    <script>
        const formulario = document.getElementById("formulario");
        const mensagem = document.getElementById("mensagem");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            mensagem.style.display = "block";

            formulario.reset();
        });
    </script>

</body>
</html>
