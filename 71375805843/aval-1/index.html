
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento de Tarefas</title>
    <!-- Tailwind CSS CDN para Estilização Moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-indigo-600 text-white shadow-md py-6 px-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">🚀 TaskSystem Pro</h1>
            <span id="date-display" class="text-sm bg-indigo-700 py-1 px-3 rounded-full"></span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6">
        
        <!-- Cards de Estatísticas -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 uppercase font-semibold">Total de Tarefas</p>
                    <h3 id="total-count" class="text-2xl font-bold text-slate-700">0</h3>
                </div>
                <div class="p-3 bg-indigo-50 text-indigo-600 rounded-lg">📊</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 uppercase font-semibold">Pendentes</p>
                    <h3 id="pending-count" class="text-2xl font-bold text-amber-600">0</h3>
                </div>
                <div class="p-3 bg-amber-50 text-amber-600 rounded-lg">⏳</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 uppercase font-semibold">Concluídas</p>
                    <h3 id="completed-count" class="text-2xl font-bold text-emerald-600">0</h3>
                </div>
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg">✅</div>
            </div>
        </div>

        <!-- Formulário de Adição -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-6">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">Adicionar Nova Tarefa</h2>
            <form id="task-form" class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="O que precisa ser feito?" 
                    required
                    class="flex-grow px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                <select 
                    id="task-priority" 
                    class="px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"
                >
                    <option value="Baixa">Baixa</option>
                    <option value="Média" selected>Média</option>
                    <option value="Alta">Alta</option>
                </select>
                <button 
                    type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-lg transition-colors cursor-pointer"
                >
                    Adicionar
                </button>
            </form>
        </div>

        <!-- Lista de Tarefas -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-semibold text-slate-700">Lista de Atividades</h3>
                <button id="clear-all" class="text-xs text-red-500 hover:underline">Limpar Concluídas</button>
            </div>
            <ul id="task-list" class="divide-y divide-slate-100">
                <!-- As tarefas serão inseridas aqui dinamicamente -->
            </ul>
            <div id="empty-state" class="p-8 text-center text-slate-400 hidden">
                Nenhuma tarefa cadastrada no momento.
            </div>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 mt-auto">
        Sistema desenvolvido com HTML5, Tailwind CSS e JavaScript.
    </footer>

    <!-- Lógica do Sistema -->
    <script>
        // Exibir data atual no cabeçalho
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' \};
        document.getElementById('date-display').innerText = new Date().toLocaleDateString('pt-BR', options);

        // Estado do Sistema
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskPriority = document.getElementById('task-priority');
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');
        
        const totalCount = document.getElementById('total-count');
        const pendingCount = document.getElementById('pending-count');
        const completedCount = document.getElementById('completed-count');
        const clearAllBtn = document.getElementById('clear-all');

        // Salvar e Renderizar
        function saveAndRender() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        \}

        // Renderizar Tarefas na Tela
        function renderTasks() {
            taskList.innerHTML = '';
            
            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
            \} else {
                emptyState.classList.add('hidden');
            \}

            let completed = 0;
            let pending = 0;

            tasks.forEach((task, index) => {
                if (task.completed) completed++;
                else pending++;

                const li = document.createElement('li');
                li.className = `p-4 flex items-center justify-between hover:bg-slate-50 transition-colors \${task.completed ? 'bg-slate-50/60' : ''\}`;
                
                // Cor da Badge de Prioridade
                let badgeColor = 'bg-slate-100 text-slate-600';
                if (task.priority === 'Alta') badgeColor = 'bg-red-50 text-red-600';
                if (task.priority === 'Média') badgeColor = 'bg-amber-50 text-amber-600';
                if (task.priority === 'Baixa') badgeColor = 'bg-blue-50 text-blue-600';

                li.innerHTML = `
                    <div class="flex items-center space-x-3 flex-grow">
                        <input type="checkbox" \${task.completed ? 'checked' : ''\} onclick="toggleTask(\${index\})" class="w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer">
                        <span class="\${task.completed ? 'line-through text-slate-400' : 'text-slate-700'\} font-medium">\${escapeHtml(task.text)\}</span>
                        <span class="text-xs px-2 py-0.5 rounded-full font-medium \${badgeColor\}">\${task.priority\}</span>
                    </div>
                    <button onclick="deleteTask(\${index\})" class="text-slate-400 hover:text-red-600 p-1 transition-colors cursor-pointer" title="Excluir">
                        🗑️
                    </button>
                `;
                taskList.appendChild(li);
            \});

            totalCount.innerText = tasks.length;
            pendingCount.innerText = pending;
            completedCount.innerText = completed;
        \}

        // Adicionar Tarefa
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if(!text) return;

            tasks.push({
                text: text,
                priority: taskPriority.value,
                completed: false
            \});

            taskInput.value = '';
            saveAndRender();
        \});

        // Alternar Status da Tarefa
        window.toggleTask = function(index) {
            tasks[index].completed = !tasks[index].completed;
            saveAndRender();
        \}

        // Excluir Tarefa
        window.deleteTask = function(index) {
            tasks.splice(index, 1);
            saveAndRender();
        \}

        // Limpar Concluídas
        clearAllBtn.addEventListener('click', () => {
            tasks = tasks.filter(task => !task.completed);
            saveAndRender();
        \});

        // Segurança básica contra XSS
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        \}

        // Executar carregamento inicial
        renderTasks();
    </script>
<script src="script.js"></script></body>
</html>$0
