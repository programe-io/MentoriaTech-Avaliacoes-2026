<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram • Feed Dinâmico</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes heartPop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .animate-heart-pop {
            animation: heartPop 0.8s ease-in-out forwards;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased dark:bg-zinc-950 dark:text-zinc-100 transition-colors duration-300">

    <!-- Barra de Navegação Superior -->
    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-200 dark:bg-zinc-900/90 dark:border-zinc-800">
        <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="text-2xl font-bold tracking-tight italic font-serif cursor-pointer hover:opacity-80 transition">
                Instagram
            </div>
            
            <div class="hidden sm:block relative w-64">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </span>
                <input type="text" placeholder="Pesquisar" class="w-full bg-gray-100 dark:bg-zinc-800 rounded-lg pl-9 pr-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 dark:focus:ring-zinc-600 transition" />
            </div>

            <div class="flex items-center space-x-5">
                <i data-lucide="home" class="w-6 h-6 cursor-pointer hover:scale-110 transition text-black dark:text-white"></i>
                <i data-lucide="message-circle" class="w-6 h-6 cursor-pointer hover:scale-110 transition"></i>
                <i data-lucide="plus-square" id="btn-open-modal" class="w-6 h-6 cursor-pointer hover:scale-110 transition text-sky-500" title="Criar publicação"></i>
                <i data-lucide="compass" class="w-6 h-6 cursor-pointer hover:scale-110 transition"></i>
                <i data-lucide="heart" class="w-6 h-6 cursor-pointer hover:scale-110 transition"></i>
                
                <!-- Avatar do Usuário Atual na Nav -->
                <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-yellow-500 via-red-500 to-purple-600 p-[2px] cursor-pointer hover:scale-105 transition">
                    <img id="nav-user-avatar" src="" class="w-full h-full object-cover rounded-full border border-white dark:border-zinc-900" />
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex gap-8 justify-center">
        
        <!-- Coluna do Feed Dinâmico -->
        <section class="w-full max-w-[470px] space-y-6">
            
            <!-- Seção de Stories -->
            <div class="bg-white border border-gray-200 rounded-xl p-4 flex space-x-4 overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden dark:bg-zinc-900 dark:border-zinc-800 shadow-xs">
                <div class="flex flex-col items-center space-y-1 cursor-pointer flex-shrink-0 group">
                    <div class="w-16 h-16 rounded-full p-[2px] border-2 border-gray-300 dark:border-zinc-700 relative group-hover:scale-105 transition">
                        <img id="story-user-avatar" src="" class="w-full h-full object-cover rounded-full" />
                        <span class="absolute bottom-0 right-0 bg-sky-500 text-white rounded-full p-0.5 border-2 border-white text-xs dark:border-zinc-900 font-bold flex items-center justify-center w-5 h-5">+</span>
                    </div>
                    <span class="text-xs text-gray-500 dark:text-zinc-400 truncate w-16 text-center">Seu story</span>
                </div>
                <div class="flex flex-col items-center space-y-1 cursor-pointer flex-shrink-0 group">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-yellow-500 via-red-500 to-purple-600 p-[2px] group-hover:scale-105 transition">
                        <div class="bg-white p-[2px] rounded-full h-full w-full dark:bg-zinc-900">
                            <img src="https://picsum.photos/seed/lucas/100" class="w-full h-full object-cover rounded-full" />
                        </div>
                    </div>
                    <span class="text-xs truncate w-16 text-center font-medium">lucas_silva</span>
                </div>
                <div class="flex flex-col items-center space-y-1 cursor-pointer flex-shrink-0 group">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-yellow-500 via-red-500 to-purple-600 p-[2px] group-hover:scale-105 transition">
                        <div class="bg-white p-[2px] rounded-full h-full w-full dark:bg-zinc-900">
                            <img src="https://picsum.photos/seed/amanda/100" class="w-full h-full object-cover rounded-full" />
                        </div>
                    </div>
                    <span class="text-xs truncate w-16 text-center font-medium">amanda.k</span>
                </div>
            </div>

<!-- Container do Feed -->
            <div id="feed-container" class="space-y-6"></div>

        </section>

        <!-- Sidebar Lateral -->
        <aside class="hidden lg:block w-[310px] space-y-4 pt-3">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <img id="sidebar-user-avatar" src="" class="w-14 h-14 object-cover rounded-full shadow-xs" />
                    <div>
                        <span id="sidebar-username" class="font-semibold text-sm block"></span>
                        <p id="sidebar-name" class="text-sm text-gray-500 dark:text-zinc-400"></p>
                    </div>
                </div>
                <button id="btn-switch-account" class="text-sky-500 font-semibold text-xs hover:text-sky-600 transition cursor-pointer">Mudar</button>
            </div>

            <div class="flex justify-between items-center pt-2">
                <span class="text-gray-500 dark:text-zinc-400 font-semibold text-sm">Sugestões para você</span>
                <button class="text-xs font-semibold text-gray-900 dark:text-white hover:opacity-70">Ver tudo</button>
            </div>

            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <img src="https://picsum.photos/seed/felipe/100" class="w-8 h-8 object-cover rounded-full" />
                        <div>
                            <p class="font-semibold text-sm">felipe.melo</p>
                            <p class="text-xs text-gray-400">Seguido por lucas_silva</p>
                        </div>
                    </div>
                    <button class="text-sky-500 font-semibold text-xs hover:text-sky-700 transition follow-btn">Seguir</button>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <img src="https://picsum.photos/seed/beatriz/100" class="w-8 h-8 object-cover rounded-full" />
                        <div>
                            <p class="font-semibold text-sm">beatriz.souza</p>
                            <p class="text-xs text-gray-400">Novo no Instagram</p>
                        </div>
                    </div>
                    <button class="text-sky-500 font-semibold text-xs hover:text-sky-700 transition follow-btn">Seguir</button>
                </div>
            </div>

            <div class="text-xs text-gray-400 pt-6 space-y-2">
                <p>Sobre • Ajuda • Imprensa • API • Carreiras • Privacidade • Termos</p>
                <p>© 2026 INSTAGRAM CLONE FROM META</p>
            </div>
        </aside>

    </main>

    <!-- Modal de Mudança de Conta -->
    <div id="modal-switch" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-zinc-900 w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl border border-gray-200 dark:border-zinc-800 animate-in fade-in zoom-in duration-200">
            <div class="flex justify-between items-center p-4 border-b border-gray-200 dark:border-zinc-800">
                <h3 class="font-semibold text-center w-full">Alternar Conta</h3>
                <button id="btn-close-switch" class="text-gray-500 hover:text-black dark:hover:text-white font-bold text-lg">×</button>
            </div>
            <div id="accounts-list" class="p-4 space-y-3">
                <!-- Contas injetadas via JS -->
            </div>
        </div>
    </div>

    <!-- Modal de Novo Post -->
    <div id="modal-new-post" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-zinc-900 w-full max-w-md rounded-2xl overflow-hidden shadow-2xl border border-gray-200 dark:border-zinc-800">
            <div class="flex justify-between items-center p-4 border-b border-gray-200 dark:border-zinc-800">
                <h3 class="font-semibold text-center w-full">Criar nova publicação</h3>
                <button id="btn-close-modal" class="text-gray-500 hover:text-black dark:hover:text-white font-bold text-lg">×</button>
            </div>
            <form id="new-post-form" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">URL da Imagem</label>
                    <input type="url" id="post-image-url" placeholder="Cole o link da foto (ex: https://picsum.photos/seed/ex/600)" required class="w-full text-sm bg-gray-100 dark:bg-zinc-800 border border-gray-300 dark:border-zinc-700 rounded-lg p-2.5 focus:outline-none" />
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Legenda</label>
                    <textarea id="post-caption" placeholder="Escreva uma legenda..." rows="3" required class="w-full text-sm bg-gray-100 dark:bg-zinc-800 border border-gray-300 dark:border-zinc-700 rounded-lg p-2.5 focus:outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-md">Compartilhar</button>
            </form>
        </div>
    </div>

    <!-- Script Unificado com Gerenciador de Contas -->
    <script>
        // Lista de contas disponíveis na sua sessão
        const availableAccounts = [
            { username: "anacruz_dev", name: "Ana Cruz", avatar: "https://picsum.photos/seed/me/100" },
            { username: "lucas_silva", name: "Lucas Silva", avatar: "https://picsum.photos/seed/lucas/100" },
            { username: "amanda_fotografia", name: "Amanda Costa", avatar: "https://picsum.photos/seed/amanda/100" }
        ];

        // Conta ativa no momento (padrão: Ana Cruz)
        let activeAccount = availableAccounts[0];

        // Banco de dados de posts
        let posts = [
            {
                id: 1,
                username: "lucas_silva",
                userAvatar: "https://picsum.photos/seed/lucas/100",
                location: "São Paulo, Brazil",
                imageUrl: "https://picsum.photos/seed/natureza/600/600",
                caption: "Explorando novas paisagens nesse fim de semana! 🌲✨ #natureza #trip",
                timeAgo: "Há 2 horas",
                likes: 4832,
                isLiked: false,
                isSaved: false,
                comments: [
                    { username: "amanda.k", text: "Que lugar lindo! Quero ir também 😍" },
                    { username: "felipe.melo", text: "Top demais! Boa trilha 👊" }
                ]
            }
        ];

        const botComments = [
            { username: "carlos_fotografia", text: "Excelente enquadramento de câmera! 📸" },
            { username: "julia_tour", text: "Nossa, que visual incrível!" },
            { username: "beatriz.souza", text: "Amei muito! ❤️" }
        ];

        // Simular comentários automáticos de outras pessoas
        setInterval(() => {
            if (posts.length > 0) {
                const randomPost = posts[Math.floor(Math.random() * posts.length)];
                const randomBot = botComments[Math.floor(Math.random() * botComments.length)];
                randomPost.comments.push({ username: randomBot.username, text: randomBot.text });
                renderFeed();
            }
        }, 15000);

        // Atualizar informações da conta ativa na interface
        function updateActiveUserInterface() {
            document.getElementById('nav-user-avatar').src = activeAccount.avatar;
            document.getElementById('story-user-avatar').src = activeAccount.avatar;
            document.getElementById('sidebar-user-avatar').src = activeAccount.avatar;
            document.getElementById('sidebar-username').textContent = activeAccount.username;
            document.getElementById('sidebar-name').textContent = activeAccount.name;
        }

        // Renderizar Feed Completo
        function renderFeed() {
            updateActiveUserInterface();
            const feedContainer = document.getElementById('feed-container');
            feedContainer.innerHTML = '';

            posts.forEach((post) => {
                const article = document.createElement('article');
                article.className = "bg-white border border-gray-200 rounded-xl dark:bg-zinc-900 dark:border-zinc-800 shadow-xs";
                
                let commentsHtml = '';
                post.comments.forEach(c => {
                    commentsHtml += `<p><span class="font-semibold mr-2 text-black dark:text-white">${c.username}</span>${c.text}</p>`;
                });

                article.innerHTML = `
                    <div class="flex items-center justify-between p-3">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-yellow-500 to-purple-600 p-[1.5px]">
                                <img src="${post.userAvatar}" class="w-full h-full object-cover rounded-full border border-white dark:border-zinc-900" />
                            </div>
                            <div>
                                <span class="font-semibold text-sm hover:underline cursor-pointer">${post.username}</span>
                                <p class="text-xs text-gray-500 dark:text-zinc-400">${post.location || 'Brasil'}</p>
                            </div>
                        </div>
                        <i data-lucide="more-horizontal" class="cursor-pointer w-5 h-5 text-gray-600 dark:text-zinc-400"></i>
                    </div>

                    <div class="w-full aspect-square bg-gray-100 dark:bg-zinc-800 relative cursor-pointer select-none post-image-box" data-id="${post.id}">
                        <img src="${post.imageUrl}" class="w-full h-full object-cover" />
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 pointer-events-none transition-opacity floating-heart-box">
                            <i data-lucide="heart" class="w-24 h-24 text-white fill-white drop-shadow-lg scale-75 animate-heart-pop"></i>
                        </div>
                    </div>

                    <div class="p-3 space-y-2">
                        <div class="flex items-center justify-between">
                            <div class="flex space-x-4">
                                <button class="btn-like cursor-pointer hover:scale-110 transition focus:outline-none" data-id="${post.id}">
                                    <i data-lucide="heart" class="w-6 h-6 ${post.isLiked ? 'text-red-500 fill-red-500' : 'text-gray-800 dark:text-zinc-100'}"></i>
                                </button>
                                <button class="cursor-pointer hover:scale-110 transition focus:outline-none">
                                    <i data-lucide="message-circle" class="w-6 h-6 text-gray-800 dark:text-zinc-100"></i>
                                </button>
                                <button class="cursor-pointer hover:scale-110 transition focus:outline-none">
                                    <i data-lucide="send" class="w-6 h-6 text-gray-800 dark:text-zinc-100"></i>
                                </button>
                            </div>
                            <button class="btn-save cursor-pointer hover:scale-110 transition focus:outline-none" data-id="${post.id}">
                                <i data-lucide="bookmark" class="w-6 h-6 text-gray-800 dark:text-zinc-100 ${post.isSaved ? 'fill-black dark:fill-white' : ''}"></i>
                            </button>
                        </div>

                        <div class="text-sm space-y-1">
                            <p class="font-semibold">${post.likes} curtidas</p>
                            <p><span class="font-semibold mr-2">${post.username}</span>${post.caption}</p>
                            
                            <div class="space-y-1 pt-1 text-gray-700 dark:text-zinc-300 max-h-32 overflow-y-auto">
                                ${commentsHtml}
                            </div>

                            <p class="text-xs text-gray-400 uppercase tracking-wide pt-1">${post.timeAgo}</p>
                        </div>
                    </div>

                    <form class="comment-form border-t border-gray-100 p-3 flex items-center justify-between dark:border-zinc-800" data-id="${post.id}">
                        <div class="flex items-center space-x-2 w-full">
                            <i data-lucide="smile" class="w-5 h-5 cursor-pointer text-gray-500"></i>
                            <input type="text" placeholder="Adicione um comentário..." class="comment-input w-full text-sm bg-transparent focus:outline-none text-gray-900 dark:text-zinc-100" />
                        </div>
                        <button type="submit" class="publish-btn text-sky-500 font-semibold text-sm opacity-40 cursor-default transition-opacity" disabled>Publicar</button>
                    </form>
                `;

                feedContainer.appendChild(article);
            });

            lucide.createIcons();
            attachEventListeners();
        }

        // Ouvintes de eventos nos posts
        function attachEventListeners() {
            document.querySelectorAll('.btn-like').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.getAttribute('data-id'));
                    const post = posts.find(p => p.id === id);
                    if (post) {
                        post.isLiked = !post.isLiked;
                        post.likes += post.isLiked ? 1 : -1;
                        renderFeed();
                    }
                });
            });

            let lastClickTime = 0;
            document.querySelectorAll('.post-image-box').forEach(box => {
                box.addEventListener('click', () => {
                    const currentTime = new Date().getTime();
                    if (currentTime - lastClickTime < 300) {
                        const id = parseInt(box.getAttribute('data-id'));
                        const post = posts.find(p => p.id === id);
                        if (post && !post.isLiked) {
                            post.isLiked = true;
                            post.likes += 1;
                            renderFeed();
                            const heartAnim = box.querySelector('.floating-heart-box');
                            heartAnim.classList.remove('opacity-0');
                            setTimeout(() => heartAnim.classList.add('opacity-0'), 800);
                        }
                    }
                    lastClickTime = currentTime;
                });
            });

            document.querySelectorAll('.btn-save').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.getAttribute('data-id'));
                    const post = posts.find(p => p.id === id);
                    if (post) {
                        post.isSaved = !post.isSaved;
                        renderFeed();
                    }
                });
            });

            document.querySelectorAll('.comment-input').forEach(input => {
                input.addEventListener('input', () => {
                    const form = input.closest('form');
                    const btn = form.querySelector('.publish-btn');
                    if (input.value.trim().length > 0) {
                        btn.classList.remove('opacity-40', 'cursor-default');
                        btn.classList.add('opacity-100', 'cursor-pointer');
                        btn.removeAttribute('disabled');
                    } else {
                        btn.classList.add('opacity-40', 'cursor-default');
                        btn.classList.remove('opacity-100', 'cursor-pointer');
                        btn.setAttribute('disabled', 'true');
                    }
                });
            });

            document.querySelectorAll('.comment-form').forEach(form => {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const id = parseInt(form.getAttribute('data-id'));
                    const input = form.querySelector('.comment-input');
                    const text = input.value.trim();

                    if (text) {
                        const post = posts.find(p => p.id === id);
                        if (post) {
                            // O comentário é postado usando a conta atualmente logada!
                            post.comments.push({ username: activeAccount.username, text: text });
                            renderFeed();
                        }
                    }
                });
            });
        }

        // Sistema de Troca de Contas (Modal)
        const modalSwitch = document.getElementById('modal-switch');
        const btnSwitchAccount = document.getElementById('btn-switch-account');
        const btnCloseSwitch = document.getElementById('btn-close-switch');
        const accountsList = document.getElementById('accounts-list');

        function renderAccountsList() {
            accountsList.innerHTML = '';
            availableAccounts.forEach(acc => {
                const isCurrent = acc.username === activeAccount.username;
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-2 rounded-xl transition ${isCurrent ? 'bg-gray-100 dark:bg-zinc-800' : 'hover:bg-gray-50 dark:hover:bg-zinc-800/50 cursor-pointer'}`;
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${acc.avatar}" class="w-10 h-10 object-cover rounded-full" />
                        <div>
                            <p class="font-semibold text-sm">${acc.username}</p>
                            <p class="text-xs text-gray-500">${acc.name}</p>
                        </div>
                    </div>
                    ${isCurrent ? '<span class="text-xs bg-sky-500 text-white font-semibold px-2 py-1 rounded-md">Ativa</span>' : '<button class="text-sky-500 text-xs font-semibold hover:underline">Alternar</button>'}
                `;

                if (!isCurrent) {
                    div.addEventListener('click', () => {
                        activeAccount = acc;
                        modalSwitch.classList.add('hidden');
                        renderFeed();
                    });
                }
                accountsList.appendChild(div);
            });
        }

        btnSwitchAccount.addEventListener('click', () => {
            renderAccountsList();
            modalSwitch.classList.remove('hidden');
        });
        btnCloseSwitch.addEventListener('click', () => modalSwitch.classList.add('hidden'));

        // Modal de Novo Post
        const modalPost = document.getElementById('modal-new-post');
        const btnOpenModal = document.getElementById('btn-open-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const newPostForm = document.getElementById('new-post-form');

        btnOpenModal.addEventListener('click', () => modalPost.classList.remove('hidden'));
        btnCloseModal.addEventListener('click', () => modalPost.classList.add('hidden'));

        newPostForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const imageUrl = document.getElementById('post-image-url').value.trim();
            const caption = document.getElementById('post-caption').value.trim();

            if (imageUrl && caption) {
                const newPost = {
                    id: posts.length + 1,
                    username: activeAccount.username,   // Posta com a conta atualmente ativa
                    userAvatar: activeAccount.avatar,
                    location: "Brasil",
                    imageUrl: imageUrl,
                    caption: caption,
                    timeAgo: "Agora mesmo",
                    likes: 0,
                    isLiked: false,
                    isSaved: false,
                    comments: []
                };

                posts.unshift(newPost);
                renderFeed();
                newPostForm.reset();
                modalPost.classList.add('hidden');
            }
        });

        // Fechar modais ao clicar fora
        window.addEventListener('click', (e) => {
            if (e.target === modalSwitch) modalSwitch.classList.add('hidden');
            if (e.target === modalPost) modalPost.classList.add('hidden');
        });

        // Inicializar aplicação
        renderFeed();
    </script>
</body>
</html>
