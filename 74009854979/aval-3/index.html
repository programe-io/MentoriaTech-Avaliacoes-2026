
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identidades Digitais</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <header>
      <h1>🪪 Identidades Digitais</h1>
      <p>Cadastre e gerencie identidades fictícias</p>
    </header>

    <section class="formulario">
      <h2>Criar identidade</h2>

      <form id="formIdentidade">
        <label for="nome">Nome completo</label>
        <input id="nome" type="text"
          placeholder="Digite o nome" required>

        <label for="nascimento">Data de nascimento</label>
        <input id="nascimento" type="date" required>

        <label for="nacionalidade">Nacionalidade</label>
        <input id="nacionalidade" type="text"
          placeholder="Ex.: Brasileira" required>

        <label for="foto">URL da foto (opcional)</label>
        <input id="foto" type="url"
          placeholder="https://exemplo.com/foto.jpg">

        <button type="submit">Criar identidade</button>
      </form>
    </section>

    <section>
      <h2>Identidades cadastradas</h2>
      <div id="listaIdentidades" class="lista">
        <p class="vazio">Nenhuma identidade cadastrada.</p>
      </div>
    </section>

    <footer>
      Projeto demonstrativo • Sem validade oficial
    </footer>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
