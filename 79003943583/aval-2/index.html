<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="cabecalho">
  <div>
    <span class="identificacao">PROJETO DA ÁGATHA</span>
    <h1>Mini Feed Social</h1>
    <p>Compartilhe uma ideia com a turma.</p>
  </div>

  <span class="avatar" aria-label="Perfil de Ágatha">Á</span>
</header>

<main class="container">
  <section class="card">
    <h2>Olá, Ágatha!</h2>

    <form id="form-publicacao">
      <label for="mensagem">
        O que você está aprendendo hoje?
      </label>

      <textarea
        id="mensagem"
        rows="4"
        maxlength="280"
        placeholder="Escreva sua mensagem..."
        required
      ></textarea>

      <div class="acoes">
        <span id="contador">0/280</span>
        <button type="submit">Publicar</button>
      </div>
    </form>

    <p id="status" role="status"></p>
  </section>

  <h2>Publicações recentes</h2>

  <section
    id="publicacoes"
    aria-label="Feed de publicações"
  ></section>
</main>

<footer>
  Ágatha • Mini Feed Social • Demonstração local
</footer>
  <script src="script.js"></script>
  
</body>
</html>
