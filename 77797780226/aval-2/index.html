
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SocialFeed</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header class="topo">
                            <h1>SocialFeed</h1>
                                    <input type="text" placeholder="Pesquisar...">
                                            <div class="perfil">👤</div>
                                                </header>

                                                    <main class="container">

                                                            <section class="criar-post">
                                                                        <h2>O que está acontecendo?</h2>
                                                                                    <textarea id="textoPost" placeholder="Compartilhe algo..."></textarea>
                                                                                                <button onclick="publicar()">Publicar</button>
                                                                                                        </section>

                                                                                                                <section class="feed" id="feed">

                                                                                                                            <article class="post">
                                                                                                                                            <div class="usuario">
                                                                                                                                                                <div class="avatar">👨</div>
                                                                                                                                                                                    <div>
                                                                                                                                                                                                            <strong>João Silva</strong>
                                                                                                                                                                                                                                    <small>Há 10 minutos</small>
                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                        <p>Que dia incrível! Aproveitando a natureza! 🌳☀️</p>

                                                                                                                                                                                                                                                                                                        <img class="imagem-post"
                                                                                                                                                                                                                                                                                                                        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=900"
                                                                                                                                                                                                                                                                                                                                        alt="Paisagem natural">

                                                                                                                                                                                                                                                                                                                                                        <div class="acoes">
                                                                                                                                                                                                                                                                                                                                                                            <button onclick="curtir(this)">❤️ <span>12</span></button>
                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="mostrarComentario(this)">💬 Comentar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="compartilhar()">↗️ Compartilhar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="comentarios">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="text" placeholder="Escreva um comentário...">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="comentar(this)">Enviar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="lista-comentarios"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </article>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <article class="post">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="usuario">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="avatar">👩</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong>Maria Oliveira</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <small>Há 30 minutos</small>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Adoro compartilhar momentos especiais! ❤️</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="acoes">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="curtir(this)">❤️ <span>25</span></button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="mostrarComentario(this)">💬 Comentar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="compartilhar()">↗️ Compartilhar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="comentarios">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="text" placeholder="Escreva um comentário...">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="comentar(this)">Enviar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="lista-comentarios"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </article>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>© 2026 SocialFeed | Sua rede social</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
