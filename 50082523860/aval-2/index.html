<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini feed social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Meu feed</h1>
        <p></p>
    </header>

    <main class="container">

        <section class="criar-post">
            <h2>Compartilhe um momento ou memória que quer lembrar sempre!</h2>

            <input type="text" placeholder="Seu nome">

            <textarea placeholder="O que você está pensando?"></textarea>

            <button>Publicar</button>
        </section>

        <section class="feed">

            <!-- PRIMEIRA PUBLICAÇÃO -->
            <article class="post">

                <div class="post-header">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/86/Marina_Ruy_Barbosa_01.jpg?utm_source=pt.wikipedia.org&utm_campaign=imageinfo&utm_content=original"
                    alt="Perfil">

                    <div>
                        <strong>Maria Silva</strong>
                        <small>Há 10 minutos</small>
                    </div>
                </div>

                <div class="post-text">
                    Hoje eu vi o novo "filme minha melhor amiga" nos cinemas,ameiiiii dms,
        achei tudo,arrasam!
                </div>

                <img class="post-img"
                src="https://upload.wikimedia.org/wikipedia/pt/e/e2/Minha_melhor_amiga.jpg?utm_source=pt.wikipedia.org&utm_campaign=imageinfo&utm_content=original"
                alt="Publicação">

                <div class="post-actions">
                    <button>♡ Curtir</button>
                    <button>💬 Comentar</button>
                </div>

            </article>

            <!-- SEGUNDA PUBLICAÇÃO -->
            <article class="post">

                <div class="post-header">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/76/%C3%8Dsis_Valverde_1.jpg?utm_source=pt.wikipedia.org&utm_campaign=imageinfo&utm_content=original"
                    alt="Perfil">

                    <div>
                        <strong>vivian santos</strong>
                        <small>Há 1 hora</small>
                    </div>
                </div>

                <div class="post-text">
                    paraíso no meio do nordeste!
                </div>

                <img class="post-img"
                src="https://upload.wikimedia.org/wikipedia/commons/1/1d/Jericoacoara_%282%29.png?utm_source=pt.wikipedia.org&utm_campaign=imageinfo&utm_content=original"
                alt="Paisagem Jericoacora">

                <div class="post-actions">
                    <button>♡ Curtir</button>
                    <button>💬 Comentar</button>
                </div>

            </article>

        </section>

    </main>

    <footer>
        

    </footer>

</body>
</html>
