<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Fácil - Loja Online</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🛍️ Shop Fácil</h1>
    <p>Sua loja favorita está aqui!</p>
    <input type="text" id="pesquisa" placeholder="Pesquisar produtos...">
    <button onclick="mostrarCarrinho()">🛒 Carrinho (<span id="quantidade">0</span>)</button>
</header>

<main>
    <h2>Nossos Produtos</h2>
    <section id="produtos" class="produtos">

        <div class="produto">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30d?w=400" alt="Fone de ouvido">
            <h3>Fone de Ouvido</h3>
            <p>R$ 89,90</p>
            <button onclick="adicionar('Fone de Ouvido', 89.90)">Adicionar ao carrinho</button>
        </div>

        <div class="produto">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" alt="Relógio">
            <h3>Relógio Moderno</h3>
            <p>R$ 129,90</p>
            <button onclick="adicionar('Relógio Moderno', 129.90)">Adicionar ao carrinho</button>
        </div>

        <div class="produto">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" alt="Tênis">
            <h3>Tênis Esportivo</h3>
            <p>R$ 199,90</p>
            <button onclick="adicionar('Tênis Esportivo', 199.90)">Adicionar ao carrinho</button>
        </div>

        <div class="produto">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400" alt="Câmera">
            <h3>Câmera Digital</h3>
            <p>R$ 299,90</p>
            <button onclick="adicionar('Câmera Digital', 299.90)">Adicionar ao carrinho</button>
        </div>

    </section>

    <section id="carrinho" class="carrinho">
        <h2>🛒 Meu Carrinho</h2>
        <div id="itens"></div>
        <h3>Total: R$ <span id="total">0.00</span></h3>
        <button onclick="finalizarCompra()">Finalizar Compra</button>
    </section>
</main>

<footer>
    <p>© 2026 Shop Fácil - Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
