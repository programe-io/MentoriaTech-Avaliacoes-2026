<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="header-content">
            <h1>MiniFeed</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>

        <section class="new-post">
            <div class="user">
                <div class="avatar">
                    N
                </div>
                <div>
                    <strong>Nauana</strong>
                    <span>cachorros</span>
                </div>
            </div>
            <button>Publicar</button>
        </section>

        <article class="post">
            <div class="post-header">
                <div class="avatar">
                    S
                </div>
                <div>
                    <strong>Siane</strong>
                    <span>Há 10 minutos</span>
                </div>
            </div>

            <div class="post-text">
                Hoje eu vi vários cachorrinhos no pet shop!
            </div>
            
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWnFHsmpJOF5XUCnmQmpnx4W0yYSKTy7X4LWhI_D9UEg&s=10" alt="Exemplo de maquiagem colorida">
            

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>
        </article>

    </main>

    <footer>
        <p>MiniFeed - Todos os Direitos Reservados Nauana - 2026</p>
    </footer>

</body>
</html>
