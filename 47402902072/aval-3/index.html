
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstaBam</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 font-family:Arial,sans-serif;
  background:#fafafa;
   color:#262626;
   }

   header{
    position:sticky;
     top:0;
      background:white;
       border-bottom:1px solid #ddd;
        padding:12px 7%;
         display:flex;
          align-items:center;
           justify-content:space-between;
            z-index:10;
            }

            .logo{
             font-size:28px;
              font-weight:bold;
               font-family:Georgia,serif;
                background:linear-gradient(45deg,#ff7a00,#ff0069,#8a2be2);
                 background-clip:text;
                  -webkit-background-clip:text;
                   color:transparent;
                   }

                   header input{
                    padding:10px;
                     border:1px solid #ddd;
                      border-radius:8px;
                       background:#fafafa;
                       }

                       nav{
                        display:flex;
                         gap:20px;
                          font-size:23px;
                           cursor:pointer;
                           }

                           .container{
                            max-width:950px;
                             margin:30px auto;
                              display:grid;
                               grid-template-columns:minmax(0,600px) 280px;
                                gap:35px;
                                 padding:0 15px;
                                 }

                                 .stories{
                                  background:white;
                                   border:1px solid #ddd;
                                    border-radius:8px;
                                     padding:15px;
                                      display:flex;
                                       gap:17px;
                                        overflow-x:auto;
                                         margin-bottom:20px;
                                         }

                                         .story{
                                          text-align:center;
                                           min-width:65px;
                                            font-size:12px;
                                             cursor:pointer;
                                             }

                                             .avatar{
                                              width:58px;
                                               height:58px;
                                                border-radius:50%;
                                                 padding:3px;
                                                  background:linear-gradient(45deg,#ffb000,#ff0069,#8a2be2);
                                                   margin:auto auto 6px;
                                                   }

                                                   .avatar img{
                                                    width:100%;
                                                     height:100%;
                                                      border-radius:50%;
                                                       border:2px solid white;
                                                        object-fit:cover;
                                                        }

                                                        .post{
                                                         background:white;
                                                          border:1px solid #ddd;
                                                           border-radius:8px;
                                                            margin-bottom:22px;
                                                             overflow:hidden;
                                                             }

                                                             .post-header{
                                                              display:flex;
                                                               align-items:center;
                                                                padding:12px;
                                                                 gap:10px;
                                                                 }

                                                                 .post-header .avatar{
                                                                  width:38px;
                                                                   height:38px;
                                                                    margin:0;
                                                                     padding:2px;
                                                                      flex-shrink:0;
                                                                      }

                                                                      .post-header strong{font-size:14px}

                                                                      .post-image{
                                                                       width:100%;
                                                                        height:420px;
                                                                         object-fit:cover;
                                                                          background:#eee;
                                                                           display:block;
                                                                           }

                                                                           .actions{
                                                                            padding:12px 14px;
                                                                             font-size:25px;
                                                                              display:flex;
                                                                               gap:15px;
                                                                               }

                                                                               .actions span{cursor:pointer}

                                                                               .post-content{
                                                                                padding:0 14px 14px;
                                                                                 font-size:14px;
                                                                                 }

                                                                                 .post-content p{margin-top:7px}

                                                                                 .post-content input{
                                                                                  width:100%;
                                                                                   border:0;
                                                                                    border-top:1px solid #eee;
                                                                                     padding:13px 0;
                                                                                      margin-top:12px;
                                                                                       outline:none;
                                                                                       }

                                                                                       .sidebar{padding-top:10px}

                                                                                       .profile{
                                                                                        display:flex;
                                                                                         align-items:center;
                                                                                          gap:12px;
                                                                                           margin-bottom:25px;
                                                                                           }

                                                                                           .profile img{
                                                                                            width:45px;
                                                                                             height:45px;
                                                                                              border-radius:50%;
                                                                                               object-fit:cover;
                                                                                               }

                                                                                               .profile small{color:#888}

                                                                                               .suggestions{
                                                                                                color:#888;
                                                                                                 font-size:14px;
                                                                                                  margin-bottom:18px;
                                                                                                  }

                                                                                                  .suggestion{
                                                                                                   display:flex;
                                                                                                    justify-content:space-between;
                                                                                                     align-items:center;
                                                                                                      margin:15px 0;
                                                                                                       font-size:13px;
                                                                                                       }

                                                                                                       .suggestion button{
                                                                                                        border:0;
                                                                                                         background:none;
                                                                                                          color:#0095f6;
                                                                                                           font-weight:bold;
                                                                                                            cursor:pointer;
                                                                                                            }

                                                                                                            .create{
                                                                                                             background:white;
                                                                                                              border:1px solid #ddd;
                                                                                                               border-radius:8px;
                                                                                                                padding:15px;
                                                                                                                 margin-bottom:20px;
                                                                                                                 }

                                                                                                                 .create h3{margin-bottom:12px}

                                                                                                                 .create input,.create textarea{
                                                                                                                  width:100%;
                                                                                                                   padding:10px;
                                                                                                                    border:1px solid #ddd;
                                                                                                                     border-radius:6px;
                                                                                                                      margin-bottom:9px;
                                                                                                                       font-family:Arial;
                                                                                                                       }

                                                                                                                       .create button{
                                                                                                                        background:#0095f6;
                                                                                                                         color:white;
                                                                                                                          border:0;
                                                                                                                           border-radius:6px;
                                                                                                                            padding:10px 16px;
                                                                                                                             cursor:pointer;
                                                                                                                              font-weight:bold;
                                                                                                                              }

                                                                                                                              @media(max-width:750px){
                                                                                                                               .container{display:block;margin:15px auto}
                                                                                                                                .sidebar{display:none}
                                                                                                                                 header{padding:12px 15px}
                                                                                                                                  header input{width:110px}
                                                                                                                                   nav{gap:12px}
                                                                                                                                    .post-image{height:auto;max-height:450px}
                                                                                                                                    }
                                                                                                                                    </style>
                                                                                                                                    <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

                                                                                                                                    <body>

                                                                                                                                    <header>
                                                                                                                                     <div class="logo">📸 InstaBam</div>
                                                                                                                                      <input id="search" placeholder="Pesquisar..." oninput="searchPosts()">
                                                                                                                                       <nav>
                                                                                                                                         <span onclick="location.reload()">🏠</span>
                                                                                                                                           <span onclick="document.getElementById('postText').focus()">➕</span>
                                                                                                                                             <span>❤️</span>
                                                                                                                                               <span>👤</span>
                                                                                                                                                </nav>
                                                                                                                                                </header>

                                                                                                                                                <div class="container">

                                                                                                                                                <main>

                                                                                                                                                 <section class="stories">
                                                                                                                                                   <div class="story">
                                                                                                                                                      <div class="avatar"><img src="https://i.pravatar.cc/100?img=12"></div>
                                                                                                                                                         Seu story
                                                                                                                                                           </div>
                                                                                                                                                             <div class="story">
                                                                                                                                                                <div class="avatar"><img src="https://i.pravatar.cc/100?img=5"></div>
                                                                                                                                                                   Lucas
                                                                                                                                                                     </div>
                                                                                                                                                                       <div class="story">
                                                                                                                                                                          <div class="avatar"><img src="https://i.pravatar.cc/100?img=9"></div>
                                                                                                                                                                             Ana
                                                                                                                                                                               </div>
                                                                                                                                                                                 <div class="story">
                                                                                                                                                                                    <div class="avatar"><img src="https://i.pravatar.cc/100?img=15"></div>
                                                                                                                                                                                       Pedro
                                                                                                                                                                                         </div>
                                                                                                                                                                                           <div class="story">
                                                                                                                                                                                              <div class="avatar"><img src="https://i.pravatar.cc/100?img=20"></div>
                                                                                                                                                                                                 Maria
                                                                                                                                                                                                   </div>
                                                                                                                                                                                                    </section>

                                                                                                                                                                                                     <section class="create">
                                                                                                                                                                                                       <h3>➕ Criar publicação</h3>
                                                                                                                                                                                                         <input id="username" placeholder="Seu nome">
                                                                                                                                                                                                           <input id="imageUrl" placeholder="URL da imagem">
                                                                                                                                                                                                             <textarea id="postText" placeholder="No que você está pensando?"></textarea>
                                                                                                                                                                                                               <button onclick="createPost()">Publicar</button>
                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                 <section id="feed">

                                                                                                                                                                                                                   <article class="post">
                                                                                                                                                                                                                      <div class="post-header">
                                                                                                                                                                                                                          <div class="avatar"><img src="https://i.pravatar.cc/100?img=12"></div>
                                                                                                                                                                                                                              <strong>lucas_oficial</strong>
                                                                                                                                                                                                                                 </div>
                                                                                                                                                                                                                                    <img class="post-image" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Paisagem de montanhas">
                                                                                                                                                                                                                                       <div class="actions">
                                                                                                                                                                                                                                           <span onclick="like(this)">♡</span>
                                                                                                                                                                                                                                               <span onclick="focusComment(this)">💬</span>
                                                                                                                                                                                                                                                   <span>➤</span>
                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                         <div class="post-content">
                                                                                                                                                                                                                                                             <strong class="likes">120 curtidas</strong>
                                                                                                                                                                                                                                                                 <p><strong>lucas_oficial</strong> Que lugar incrível! 🌄</p>
                                                                                                                                                                                                                                                                     <input placeholder="Adicione um comentário..." onkeydown="sendComment(event,this)">
                                                                                                                                                                                                                                                                         <div class="comments"></div>
                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                              </article>

                                                                                                                                                                                                                                                                                <article class="post">
                                                                                                                                                                                                                                                                                   <div class="post-header">
                                                                                                                                                                                                                                                                                       <div class="avatar"><img src="https://i.pravatar.cc/100?img=5"></div>
                                                                                                                                                                                                                                                                                           <strong>ana_maria</strong>
                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                 <img class="post-image" src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=800" alt="Flores coloridas">
                                                                                                                                                                                                                                                                                                    <div class="actions">
                                                                                                                                                                                                                                                                                                        <span onclick="like(this)">♡</span>
                                                                                                                                                                                                                                                                                                            <span onclick="focusComment(this)">💬</span>
                                                                                                                                                                                                                                                                                                                <span>➤</span>
                                                                                                                                                                                                                                                                                                                   </div>
                                                                                                                                                                                                                                                                                                                      <div class="post-content">
                                                                                                                                                                                                                                                                                                                          <strong class="likes">85 curtidas</strong>
                                                                                                                                                                                                                                                                                                                              <p><strong>ana_maria</strong> Um dia cheio de cores! 🌸</p>
                                                                                                                                                                                                                                                                                                                                  <input placeholder="Adicione um comentário..." onkeydown="sendComment(event,this)">
                                                                                                                                                                                                                                                                                                                                      <div class="comments"></div>
                                                                                                                                                                                                                                                                                                                                         </div>
                                                                                                                                                                                                                                                                                                                                           </article>

                                                                                                                                                                                                                                                                                                                                            </section>
                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                            <aside class="sidebar">
                                                                                                                                                                                                                                                                                                                                             <div class="profile">
                                                                                                                                                                                                                                                                                                                                               <img src="https://i.pravatar.cc/100?img=12">
                                                                                                                                                                                                                                                                                                                                                 <div>
                                                                                                                                                                                                                                                                                                                                                    <strong>meu_perfil</strong><br>
                                                                                                                                                                                                                                                                                                                                                       <small>Bem-vindo ao InstaBam!</small>
                                                                                                                                                                                                                                                                                                                                                         </div>
                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                           <div class="suggestions">Sugestões para você</div>

                                                                                                                                                                                                                                                                                                                                                            <div class="suggestion">
                                                                                                                                                                                                                                                                                                                                                              <strong>carla_santos</strong>
                                                                                                                                                                                                                                                                                                                                                                <button>Seguir</button>
                                                                                                                                                                                                                                                                                                                                                                 </div>

                                                                                                                                                                                                                                                                                                                                                                  <div class="suggestion">
                                                                                                                                                                                                                                                                                                                                                                    <strong>pedro_games</strong>
                                                                                                                                                                                                                                                                                                                                                                      <button>Seguir</button>
                                                                                                                                                                                                                                                                                                                                                                       </div>

                                                                                                                                                                                                                                                                                                                                                                        <div class="suggestion">
                                                                                                                                                                                                                                                                                                                                                                          <strong>maria_fotos</strong>
                                                                                                                                                                                                                                                                                                                                                                            <button>Seguir</button>
                                                                                                                                                                                                                                                                                                                                                                             </div>
                                                                                                                                                                                                                                                                                                                                                                             </aside>

                                                                                                                                                                                                                                                                                                                                                                             </div>

                                                                                                                                                                                                                                                                                                                                                                             <script>

                                                                                                                                                                                                                                                                                                                                                                             function like(element){
                                                                                                                                                                                                                                                                                                                                                                              const post=element.closest(".post");
                                                                                                                                                                                                                                                                                                                                                                               const likes=post.querySelector(".likes");
                                                                                                                                                                                                                                                                                                                                                                                let count=parseInt(likes.textContent)||0;

                                                                                                                                                                                                                                                                                                                                                                                 if(element.textContent==="♡"){
                                                                                                                                                                                                                                                                                                                                                                                   element.textContent="❤️";
                                                                                                                                                                                                                                                                                                                                                                                     count++;
                                                                                                                                                                                                                                                                                                                                                                                      }else{
                                                                                                                                                                                                                                                                                                                                                                                        element.textContent="♡";
                                                                                                                                                                                                                                                                                                                                                                                          count--;
                                                                                                                                                                                                                                                                                                                                                                                           }

                                                                                                                                                                                                                                                                                                                                                                                            likes.textContent=count+" curtidas";
                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                            function focusComment(element){
                                                                                                                                                                                                                                                                                                                                                                                             element.closest(".post").querySelector("input").focus();
                                                                                                                                                                                                                                                                                                                                                                                             }

                                                                                                                                                                                                                                                                                                                                                                                             function sendComment(event,input){
                                                                                                                                                                                                                                                                                                                                                                                              if(event.key==="Enter"){
                                                                                                                                                                                                                                                                                                                                                                                                const text=input.value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                  if(!text)return;

                                                                                                                                                                                                                                                                                                                                                                                                    const comment=document.createElement("p");
                                                                                                                                                                                                                                                                                                                                                                                                      comment.textContent="Você: "+text;
                                                                                                                                                                                                                                                                                                                                                                                                        input.nextElementSibling.appendChild(comment);
                                                                                                                                                                                                                                                                                                                                                                                                          input.value="";
                                                                                                                                                                                                                                                                                                                                                                                                           }
                                                                                                                                                                                                                                                                                                                                                                                                           }

                                                                                                                                                                                                                                                                                                                                                                                                           function createPost(){
                                                                                                                                                                                                                                                                                                                                                                                                            const username=document.getElementById("username").value.trim()||"usuario";
                                                                                                                                                                                                                                                                                                                                                                                                             const image=document.getElementById("imageUrl").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                              const text=document.getElementById("postText").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                               if(!image){
                                                                                                                                                                                                                                                                                                                                                                                                                 alert("Digite o endereço de uma imagem!");
                                                                                                                                                                                                                                                                                                                                                                                                                   return;
                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                     const post=document.createElement("article");
                                                                                                                                                                                                                                                                                                                                                                                                                      post.className="post";

                                                                                                                                                                                                                                                                                                                                                                                                                       const header=document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                        header.className="post-header";

                                                                                                                                                                                                                                                                                                                                                                                                                         const name=document.createElement("strong");
                                                                                                                                                                                                                                                                                                                                                                                                                          name.textContent=username;

                                                                                                                                                                                                                                                                                                                                                                                                                           const avatar=document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                            avatar.className="avatar";

                                                                                                                                                                                                                                                                                                                                                                                                                             const avatarImg=document.createElement("img");
                                                                                                                                                                                                                                                                                                                                                                                                                              avatarImg.src="https://i.pravatar.cc/100?img=12";
                                                                                                                                                                                                                                                                                                                                                                                                                               avatar.appendChild(avatarImg);

                                                                                                                                                                                                                                                                                                                                                                                                                                header.append(avatar,name);

                                                                                                                                                                                                                                                                                                                                                                                                                                 const photo=document.createElement("img");
                                                                                                                                                                                                                                                                                                                                                                                                                                  photo.className="post-image";
                                                                                                                                                                                                                                                                                                                                                                                                                                   photo.src=image;
                                                                                                                                                                                                                                                                                                                                                                                                                                    photo.alt="Publicação";
                                                                                                                                                                                                                                                                                                                                                                                                                                     photo.onerror=()=>alert("Não foi possível carregar essa imagem.");

                                                                                                                                                                                                                                                                                                                                                                                                                                      const actions=document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                       actions.className="actions";

                                                                                                                                                                                                                                                                                                                                                                                                                                        const heart=document.createElement("span");
                                                                                                                                                                                                                                                                                                                                                                                                                                         heart.textContent="♡";
                                                                                                                                                                                                                                                                                                                                                                                                                                          heart.onclick=()=>like(heart);

                                                                                                                                                                                                                                                                                                                                                                                                                                           const commentIcon=document.createElement("span");
                                                                                                                                                                                                                                                                                                                                                                                                                                            commentIcon.textContent="💬";
                                                                                                                                                                                                                                                                                                                                                                                                                                             commentIcon.onclick=()=>focusComment(commentIcon);

                                                                                                                                                                                                                                                                                                                                                                                                                                              const share=document.createElement("span");
                                                                                                                                                                                                                                                                                                                                                                                                                                               share.textContent="➤";

                                                                                                                                                                                                                                                                                                                                                                                                                                                actions.append(heart,commentIcon,share);

                                                                                                                                                                                                                                                                                                                                                                                                                                                 const content=document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                  content.className="post-content";

                                                                                                                                                                                                                                                                                                                                                                                                                                                   const likes=document.createElement("strong");
                                                                                                                                                                                                                                                                                                                                                                                                                                                    likes.className="likes";
                                                                                                                                                                                                                                                                                                                                                                                                                                                     likes.textContent="0 curtidas";

                                                                                                                                                                                                                                                                                                                                                                                                                                                      const caption=document.createElement("p");
                                                                                                                                                                                                                                                                                                                                                                                                                                                       const author=document.createElement("strong");
                                                                                                                                                                                                                                                                                                                                                                                                                                                        author.textContent=username;
                                                                                                                                                                                                                                                                                                                                                                                                                                                         caption.append(author,document.createTextNode(" "+text));

                                                                                                                                                                                                                                                                                                                                                                                                                                                          const input=document.createElement("input");
                                                                                                                                                                                                                                                                                                                                                                                                                                                           input.placeholder="Adicione um comentário...";
                                                                                                                                                                                                                                                                                                                                                                                                                                                            input.onkeydown=(event)=>sendComment(event,input);

                                                                                                                                                                                                                                                                                                                                                                                                                                                             const comments=document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                              comments.className="comments";

                                                                                                                                                                                                                                                                                                                                                                                                                                                               content.append(likes,caption,input,comments);
