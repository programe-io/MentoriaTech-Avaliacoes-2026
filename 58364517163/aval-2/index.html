<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Gerenciamento de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>📋 Sistema de Gerenciamento de Tarefas</h1>
        <p>Cadastre, organize e acompanhe suas tarefas</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>➕ Cadastrar nova tarefa</h2>

            <div class="formulario">

                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título da tarefa"
                >

                <select id="prioridade">
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button class="btn-cadastrar" onclick="cadastrar()">
                    Cadastrar
                </button>

            </div>
        </section>


        <section class="resumo">

            <div class="resumo-item">
                <strong id="total">0</strong>
                <span>Total de tarefas</span>
            </div>

            <div class="resumo-item">
                <strong id="pendentes">0</strong>
                <span>Tarefas pendentes</span>
            </div>

            <div class="resumo-item">
                <strong id="concluidas">0</strong>
                <span>Tarefas concluídas</span>
            </div>

        </section>


        <section class="card">

            <h2>🔎 Pesquisar tarefas</h2>

            <div class="filtros">

                <input
                    type="text"
                    id="busca"
                    placeholder="Digite o título da tarefa"
                >

                <select id="filtro">
                    <option value="todas">Todas</option>
                    <option value="pendentes">Pendentes</option>
                    <option value="concluidas">Concluídas</option>
                </select>

            </div>

        </section>


        <section class="card">

            <h2>📝 Tarefas cadastradas</h2>

            <div id="lista"></div>

        </section>

    </main>


    <footer>
        Sistema de Gerenciamento de Tarefas
    </footer>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
