<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstaClone</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fafafa;
    font-family: Arial, sans-serif;
    color: #262626;
}

header {
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 15px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    font-family: cursive;
}

.search {
    padding: 10px;
    border: none;
    background: #efefef;
    border-radius: 8px;
    outline: none;
}

.icons {
    font-size: 23px;
    display: flex;
    gap: 20px;
    cursor: pointer;
}

.container {
    max-width: 950px;
    margin: 30px auto;
    display: grid;
    grid-template-columns: 600px 280px;
    gap: 30px;
    padding: 0 10px;
}

.stories {
    background: white;
    padding: 18px;
    border: 1px solid #ddd;
    border-radius: 8px;
    display: flex;
    gap: 18px;
    overflow-x: auto;
    margin-bottom: 25px;
}

.story {
    text-align: center;
    cursor: pointer;
    min-width: 65px;
}

.story img {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 3px solid #e1306c;
    padding: 2px;
    object-fit: cover;
}

.story p {
    font-size: 12px;
    margin-top: 5px;
}

.post {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 25px;
    overflow: hidden;
}

.post-header {
    display: flex;
    align-items: center;
    padding: 13px;
    gap: 10px;
}

.post-header img {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
}

.post-header strong {
    font-size: 14px;
}

.post-image {
    width: 100%;
    height: 420px;
    object-fit: cover;
}

.post-actions {
    padding: 12px;
    font-size: 25px;
}

.post-actions span {
    cursor: pointer;
    margin-right: 12px;
}

.heart.liked {
    color: red;
}

.likes, .caption, .comments {
    padding: 0 13px 10px;
    font-size: 14px;
}

.caption strong {
    margin-right: 5px;
}

.comment-input {
    display: flex;
    border-top: 1px solid #eee;
    padding: 12px;
}

.comment-input input {
    flex: 1;
    border: none;
    outline: none;
}

.comment-input button {
    border: none;
    background: none;
    color: #0095f6;
    font-weight: bold;
    cursor: pointer;
}

.sidebar {
    padding: 10px;
}

.profile {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

.profile img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
}

.suggestions {
    color: #888;
    font-size: 14px;
    margin-bottom: 20px;
}

.suggestion {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 15px 0;
    font-size: 13px;
}

.suggestion button {
    border: none;
    color: #0095f6;
    background: none;
    font-weight: bold;
    cursor: pointer;
}

@media(max-width: 850px) {
    .container {
        display: block;
        max-width: 600px;
    }

    .sidebar {
        display: none;
    }

    header {
        padding: 12px 15px;
    }

    .search {
        width: 120px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header>
    <div class="logo">InstaClone</div>
    <input class="search" type="text" placeholder="Pesquisar">
    <div class="icons">
        <span>⌂</span>
        <span>✉</span>
        <span>♡</span>
        <span>👤</span>
    </div>
</header>

<div class="container">

<main>

    <section class="stories">
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=12">
            <p>Seu story</p>
        </div>
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=5">
            <p>mariana</p>
        </div>
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=8">
            <p>pedro</p>
        </div>
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=9">
            <p>juliana</p>
        </div>
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=15">
            <p>gabriel</p>
        </div>
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=20">
            <p>ana</p>
        </div>
    </section>

    <article class="post">
        <div class="post-header">
            <img src="https://i.pravatar.cc/100?img=12">
            <strong>Lorenna_wzx</strong>
        </div>

        <img class="post-image"
        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900">

        <div class="post-actions">
            <span class="heart" onclick="like(this)">♡</span>
            <span onclick="focusComment(this)">💬</span>
            <span>➤</span>
        </div>

        <div class="likes"><strong>1.245 curtidas</strong></div>

        <div class="caption">
            <strong>Lorenna_wzx</strong>
            montanha 🌴☀️
        </div>

        <div class="comments" id="comments1"></div>

        <div class="comment-input">
            <input type="text" placeholder="Adicione um comentário...">
            <button onclick="comment(this)">Publicar</button>
        </div>
    </article>

    <article class="post">
        <div class="post-header">
            <img src="https://i.pravatar.cc/100?img=5">
            <strong>mariana.oficial</strong>
        </div>

        <img class="post-image"
        src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=900">

        <div class="post-actions">
            <span class="heart" onclick="like(this)">♡</span>
            <span onclick="focusComment(this)">💬</span>
            <span>➤</span>
        </div>

        <div class="likes"><strong>856 curtidas</strong></div>

        <div class="caption">
            <strong>mariana.oficial</strong>
            laguinho ❤️
        </div>

        <div class="comments"></div>

        <div class="comment-input">
            <input type="text" placeholder="Adicione um comentário...">
            <button onclick="comment(this)">Publicar</button>
        </div>
    </article>

</main>

<aside class="sidebar">
    <div class="profile">
        <img src="https://i.pravatar.cc/100?img=12">
        <div>
            <strong>Lorenna_wzx</strong>
            <p style="color:#888;font-size:13px">Lorenna</p>
        </div>
    </div>

    <p class="suggestions">Sugestões para você</p>

    <div class="suggestion">
        <strong>lucas_123</strong>
        <button>Seguir</button>
    </div>

    <div class="suggestion">
        <strong>ana.silva</strong>
        <button>Seguir</button>
    </div>

    <div class="suggestion">
        <strong>pedro_ofc</strong>
        <button>Seguir</button>
    </div>
</aside>

</div>

<script>
function like(element) {
    element.classList.toggle("liked");

    if (element.classList.contains("liked")) {
        element.innerHTML = "♥";
    } else {
        element.innerHTML = "♡";
    }
}

function comment(button) {
    const post = button.closest(".post");
    const input = post.querySelector("input");
    const comments = post.querySelector(".comments");

    if (input.value.trim() === "") return;

    const newComment = document.createElement("p");
    const name = document.createElement("strong");

    name.textContent = "seu_perfil: ";
    newComment.appendChild(name);
    newComment.appendChild(document.createTextNode(input.value));

    comments.appendChild(newComment);
    input.value = "";
}

function focusComment(element) {
    element.closest(".post")
    .querySelector(".comment-input input").focus();
}
</script>

</body>
</html>
