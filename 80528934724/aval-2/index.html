<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Projeto Interativo</title>
  <!-- Link para o arquivo CSS externo (se tiver um) -->
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Estrutura do Cartão (Card) -->
  <div class="card">
    <h1>Contador Interativo</h1>
    <p>Clique nos botões abaixo para alterar o valor em tempo real.</p>
    
    <!-- Exibição do número -->
    <div id="valor" style="font-size: 48px; font-weight: bold; margin-bottom: 20px;">0</div>
    
    <!-- Botões de Ação -->
    <div class="botoes-container">
      <button id="btn-subtrair">- Subtrair</button>
      <button id="btn-somar">+ Somar</button>
    </div>
  </div>

  <!-- Link para o arquivo JavaScript externo (inserido no final para não travar a página) -->
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
