        <link rel="stylesheet" href="style,css">
    <link href="style.css" rel="stylesheet"></head>
    <body>

            <div class="header-content">

                <nav>
                    <a href="#">Inicio</a>
                    <a href="#">Perfil</a>
                </nav>
            </div>
        </header>
        <main>
            <section class="new-post">
                <div class="user">
                    <div class="avatar">
                        J

                        <strong>Turma 1 ano</strong>

                        M
                    </div>

                </div>
                <img src="https://www.amazon.com.br/Intelig%C3%AAncia-Artificial-Uma-Abordagem-Moderna/dp/8595158878" alt="IA - Uma Abordagem Moderna">

            <p>MiniFed Social - Turma 1º Ano - 2026</p>
        </footer>
