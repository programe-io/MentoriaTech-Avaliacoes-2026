<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Azul</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>

        <section class="new-post">

            <div class="user">
                <div class="avatar">J</div>

                <div>
                    <strong>Pamela</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>

            <button>Publicar</button>

        </section>

        <article class="post">

            <div class="post-header">
                <div class="avatar">A</div>

                <div>
                    <strong>Ana</strong>
                    <span>há 10 minutos</span>
                </div>
            </div>

            <p class="post-text">
                Hoje comecei a estudar HTML e CSS.
                Estou criando meu primeiro Mini Feed!
            </p>

            <img
                src="https://picsum.photos/600/300"
                alt="Imagem da publicação"
            >

            <div class="post-actions">
                <button>👍 Curtir</button>
                <button>💬 Comentar</button>
            </div>

        </article>

        <article class="post">

            <div class="post-header">
                <div class="avatar">C</div>

                <div>
                    <strong>Carlos</strong>
                    <span>há 25 minutos</span>
                </div>
            </div>

            <p class="post-text">
                Aprender programação fica mais fácil
                quando praticamos criando projetos.
            </p>

            <img
                src="https://picsum.photos/600/301"
                alt="Imagem da publicação"
            >

            <div class="post-actions">
                <button>👍 Curtir</button>
                <button>💬 Comentar</button>
            </div>

        </article>

    </main>

    <footer>
        <p>Mini Feed © 2026</p>
    </footer>

</body>

</html>
