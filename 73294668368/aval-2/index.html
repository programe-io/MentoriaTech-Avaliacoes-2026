<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução à Programação</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8f0fe;
            text-align: center;
            padding: 30px;
        \}

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #aaa;
        \}

        h1 {
            color: #2455a4;
        \}

        button {
            background: #2455a4;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        \}

        button:hover {
            background: #16376e;
        \}

        #resultado {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        \}
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">
        <h1>Introdução à Programação</h1>

        <p>Aprenda os primeiros passos da lógica de programação com JavaScript!</p>

        <h3>Verifique sua idade</h3>

        <input type="number" id="idade" placeholder="Digite sua idade">

        <br><br>

        <button onclick="verificarIdade()">Verificar</button>

        <p id="resultado"></p>
    </div>

    <script>
        function verificarIdade() {
            let idade = Number(document.getElementById("idade").value);

            if (idade >= 18) {
                document.getElementById("resultado").innerHTML =
                    "Você é maior de idade!";
            \} else if (idade > 0) {
                document.getElementById("resultado").innerHTML =
                    "Você é menor de idade!";
            \} else {
                document.getElementById("resultado").innerHTML =
                    "Digite uma idade válida!";
            \}
        \}
    </script>

<script src="script.js"></script></body>
</html>$0
