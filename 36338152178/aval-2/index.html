
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Gerenciador de Tarefas</h1>

        <form id="formTarefa">

            <label for="titulo">Título da tarefa:</label>
            <input
                type="text"
                id="titulo"
                placeholder="Digite o título da tarefa"
                required
            >

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade">
                <option value="1">1 - Baixa</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Alta</option>
            </select>

            <button type="submit">Cadastrar tarefa</button>

        </form>

        <h2>Minhas tarefas</h2>

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Título</th>
                    <th>Prioridade</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="listaTarefas"></tbody>
        </table>

        <h2>Concluir tarefa</h2>

        <div class="acoes">
            <input
                type="number"
                id="codigoConcluir"
                placeholder="Código da tarefa"
            >

            <button id="btnConcluir">Concluir tarefa</button>
        </div>

        <h2>Alterar prioridade</h2>

        <div class="acoes">
            <input
                type="number"
                id="codigoAlterar"
                placeholder="Código da tarefa"
            >

            <select id="novaPrioridade">
                <option value="1">1 - Baixa</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Alta</option>
            </select>

            <button id="btnAlterar">Alterar prioridade</button>
        </div>

        <p id="mensagem"></p>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
