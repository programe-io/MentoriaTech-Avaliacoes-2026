<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📦 Controle de Estoque</h1>
        
        <form id="form-produto">
            <div class="form-group">
                <input type="text" id="nome-produto" placeholder="Nome do produto" required>
                <input type="number" id="qtd-produto" placeholder="Quantidade" min="1" required>
                <button type="submit">Adicionar</button>
            </div>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="lista-estoque">
                <!-- Os produtos cadastrados vão aparecer aqui -->
            </tbody>
        </table>
    </div>
<script src="script.js"></script></body>
</html>
