<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Trabalho</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <h1>💼 Gerenciador de Trabalho</h1>
    <p>Organize suas tarefas e acompanhe seu trabalho</p>
</header>

<main>

    <!-- PAINEL -->
    <section class="dashboard">

        <div class="card">
            <span>📋</span>
            <h3>Total de tarefas</h3>
            <strong id="totalTarefas">0</strong>
        </div>

        <div class="card">
            <span>⏳</span>
            <h3>Pendentes</h3>
            <strong id="pendentes">0</strong>
        </div>

        <div class="card">
            <span>🔄</span>
            <h3>Em andamento</h3>
            <strong id="andamento">0</strong>
        </div>

        <div class="card">
            <span>✅</span>
            <h3>Concluídas</h3>
            <strong id="concluidas">0</strong>
        </div>

    </section>

    <!-- CADASTRO -->
    <section class="formulario">

        <h2>➕ Nova tarefa</h2>

        <form id="formTarefa">

            <input
                type="text"
                id="titulo"
                placeholder="Nome da tarefa"
                required
            >

            <input
                type="text"
                id="responsavel"
                placeholder="Responsável"
                required
            >

            <input
                type="date"
                id="data"
                required
            >

            <select id="prioridade" required>
                <option value="">Prioridade</option>
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>
            </select>

            <select id="status" required>
                <option value="Pendente">Pendente</option>
                <option value="Em andamento">Em andamento</option>
                <option value="Concluído">Concluído</option>
            </select>

            <button type="submit">
                Adicionar tarefa
            </button>

        </form>

    </section>

    <!-- LISTA -->
    <section class="tarefas">

        <div class="topo">

            <h2>📋 Minhas tarefas</h2>

            <input
                type="text"
                id="pesquisa"
                placeholder="🔍 Pesquisar tarefa..."
            >

        </div>

        <div class="tabela-container">

            <table>

                <thead>
                    <tr>
                        <th>Tarefa</th>
                        <th>Responsável</th>
                        <th>Entrega</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaTarefas"></tbody>

            </table>

        </div>

    </section>

</main>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
