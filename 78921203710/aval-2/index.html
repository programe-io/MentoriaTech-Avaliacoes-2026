
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aryanewzy - Rede Social</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">

        <a class="navbar-brand logo" href="#">InstaFoto</a>

        <div class="d-flex gap-4">
            <a href="#" class="nav-icon"><i class="bi bi-house-door"></i></a>
            <a href="#" class="nav-icon"><i class="bi bi-heart"></i></a>
            <a href="#" class="nav-icon"><i class="bi bi-chat-dots"></i></a>
            <a href="#" class="nav-icon"><i class="bi bi-person-circle"></i></a>
        </div>

    </div>
</nav>


<main class="container my-4">

    <!-- PERFIL -->
    <section class="card profile-card border-0 shadow-sm mb-4">
        <div class="card-body d-flex align-items-center gap-4 flex-wrap">

            <img
                src="https://www.magnific.com/br/fotos/perfil-mulher"
                class="profile-img"
                alt="Foto de perfil">

            <div>
                <h3 class="fw-bold">maria</h3>

                <div class="d-flex gap-3 flex-wrap my-2">
                    <span><strong>12</strong> publicações</span>
                    <span><strong>850</strong> seguidores</span>
                    <span><strong>420</strong> seguindo</span>
                </div>

                <p class="mb-0">
                    ✨ Memes, amor e momentos especiais.
                    <br>
                    💜 Bem-vindos ao meu mundo!
                </p>
            </div>

        </div>
    </section>


    <!-- STORIES -->
    <h5 class="fw-bold mb-3">Stories</h5>

    <section class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <div class="d-flex gap-4 overflow-auto" id="stories"></div>
        </div>
    </section>


    <!-- FEED -->
    <h5 class="fw-bold mb-3">Publicações</h5>

    <section id="feed"></section>

</main>


<footer class="text-center py-4 text-muted">
    © 2026 Aryanewzy - Todos os direitos reservados 💜
</footer>


<!-- MODAL DOS STORIES -->
<div class="modal fade" id="storyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content story-modal">

            <div class="modal-header border-0">
                <h5 class="modal-title" id="storyTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body text-center">
                <img id="storyImage" class="img-fluid rounded" alt="Story">
            </div>

        </div>
    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
