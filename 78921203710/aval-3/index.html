
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aryanewzy WhatsApp</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link href="style.css" rel="stylesheet"></head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-header">

            <img src="https://i.pravatar.cc/100?img=60" alt="Perfil">

            <div class="sidebar-icons">
                <i class="bi bi-chat-left-text" title="Nova conversa"></i>
                <i class="bi bi-three-dots-vertical" title="Menu"></i>
            </div>

        </div>

        <!-- PESQUISA -->
        <div class="search-area">

            <div class="search-box">
                <i class="bi bi-search"></i>

                <input
                    type="text"
                    id="searchContact"
                    placeholder="Pesquisar ou começar uma nova conversa">
            </div>

        </div>

        <!-- CONTATOS -->
        <div class="contacts" id="contacts"></div>

    </aside>


    <!-- ÁREA DA CONVERSA -->
    <main class="chat-area" id="chatArea">

        <div class="welcome-screen">

            <i class="bi bi-whatsapp"></i>

            <h2>Aryanewzy WhatsApp</h2>

            <p>
                Envie mensagens e converse com seus amigos.
                <br>
                Selecione uma conversa para começar.
            </p>

        </div>

    </main>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript -->
<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
