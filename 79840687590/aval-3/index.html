
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS vs CSS</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        .botao-css {
            background-color: blue;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="flex flex-col items-center justify-center min-h-screen gap-6">

    <h1 class="text-3xl font-bold">
        Tailwind CSS vs CSS
    </h1>

    <!-- Botão com Tailwind CSS -->
    <button class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
        Botão Tailwind
    </button>

    <!-- Botão com CSS tradicional -->
    <button class="botao-css">
        Botão CSS
    </button>

<script src="script.js"></script></body>
</html>
