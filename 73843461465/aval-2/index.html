<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <h1>✅ Gerenciamento de Tarefas</h1>
<p class="sub">Fundamentos Lógicos com JavaScript - PROJETO</p>

<div class="card">
  <h2>Cadastrar Nova Tarefa</h2>

  <label>Código:</label>
  <input type="text" id="codigo" placeholder="Ex: 001">

  <label>Título (mínimo 5 caracteres):</label>
  <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript">
  <div class="erro" id="erroTitulo">O título deve ter no mínimo 5 caracteres!</div>

  <label>Prioridade:</label>
  <select id="prioridade">
    <option value="1">1 - Alta</option>
    <option value="2">2 - Média</option>
    <option value="3">3 - Baixa</option>
  </select>

  <button onclick="cadastrarTarefa()">Cadastrar Tarefa</button>
</div>

<div class="card">
  <h2>📋 Tarefas Cadastradas</h2>
  <div id="lista"></div>
</div>
  <script src="script.js"></script>
  
</body>
</html>
