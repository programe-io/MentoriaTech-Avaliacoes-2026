<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas tarefas</p>
    </header>

    <main>

        <section class="formulario">
            <h2>Cadastrar nova tarefa</h2>

            <form id="formTarefa">

                <label for="codigo">Código:</label>
                <input type="number" id="codigo" required>

                <label for="titulo">Título:</label>
                <input type="text" id="titulo" placeholder="Digite o título" required>

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade" required>
                    <option value="">Selecione a prioridade</option>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit">Cadastrar tarefa</button>

            </form>
        </section>


        <section class="lista">
            <h2>Tarefas cadastradas</h2>

            <div id="listaTarefas">
                <p class="vazio">Nenhuma tarefa cadastrada.</p>
            </div>

        </section>

    </main>


    <footer>
        <p>Gerenciador de Tarefas &copy; 2026</p>
    </footer>


    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
