
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <h1>🚀 SPACE SHOOTER</h1>

        <div class="hud">
            <span>⭐ Pontos: <strong id="score">0</strong></span>
            <span>❤️ Vidas: <strong id="lives">3</strong></span>
        </div>

        <div class="game-container">
            <canvas id="gameCanvas" width="500" height="600"></canvas>

            <div id="startScreen" class="overlay">
                <h2>SPACE SHOOTER</h2>
                <p>Destrua os inimigos e sobreviva!</p>
                <button id="startButton">JOGAR</button>
            </div>

            <div id="gameOverScreen" class="overlay hidden">
                <h2>FIM DE JOGO!</h2>
                <p>Pontuação: <strong id="finalScore">0</strong></p>
                <button id="restartButton">JOGAR NOVAMENTE</button>
            </div>
        </div>

        <div class="controls">
            <p>PC: ← → para mover | ESPAÇO para atirar</p>
            <p>Celular: use os botões abaixo</p>

            <div class="mobile-controls">
                <button id="leftButton">◀</button>
                <button id="fireButton">🔥</button>
                <button id="rightButton">▶</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
