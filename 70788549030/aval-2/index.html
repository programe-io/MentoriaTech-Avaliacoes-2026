<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gerenciador de Tarefas</title>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
            <body>
                <div class="container">
                        <h1>Gerenciador de Tarefas</h1>
                                
                                        <!-- Formulário de Cadastro -->
                                                <div class="form-group">
                                                            <label for="tituloTarefa">Título da Tarefa:</label>
                                                                        <input type="text" id="tituloTarefa" placeholder="Digite o título (mín. 5 caracteres)">
                                                                                </div>

                                                                                        <div class="form-group">
                                                                                                    <label for="prioridadeTarefa">Prioridade:</label>
                                                                                                                <select id="prioridadeTarefa">
                                                                                                                                <option value="1">1 - Alta</option>
                                                                                                                                                <option value="2">2 - Média</option>
                                                                                                                                                                <option value="3">3 - Baixa</option>
                                                                                                                                                                            </select>
                                                                                                                                                                                    </div>

                                                                                                                                                                                            <button id="btnCadastrar">Cadastrar Tarefa</button>

                                                                                                                                                                                                    <!-- Lista de Tarefas -->
                                                                                                                                                                                                            <ul id="listaTarefas" class="task-list"></ul>
                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                </html>
