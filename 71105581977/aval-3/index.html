
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthFlow - Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <aside class="sidebar">
        <h2>HealthFlow</h2>
        <p>Controle de Saúde</p>

        <nav>
            <a href="#">🏠 Dashboard</a>
            <a href="#cadastro">➕ Novo Paciente</a>
            <a href="#resultado">📊 Resultado do IMC</a>
        </nav>

        <div class="icone">
            <span>♥</span>
        </div>
    </aside>

    <main>
        <header>
            <h1>Controle de IMC</h1>
            <p>Calcule e acompanhe o índice de massa corporal.</p>
        </header>

        <section class="cards">
            <div class="card">
                <h3>Último Paciente</h3>
                <p id="nomePaciente">---</p>
            </div>

            <div class="card">
                <h3>Último IMC</h3>
                <p id="imcPaciente">---</p>
            </div>

            <div class="card">
                <h3>Classificação</h3>
                <p id="classificacao">---</p>
            </div>
        </section>

        <section class="formulario" id="cadastro">
            <h2>Dados do Paciente</h2>

            <form id="formIMC">
                <input type="text" id="nome"
                    placeholder="Nome do paciente" required>

                <input type="number" id="peso"
                    placeholder="Peso em kg" min="1"
                    step="0.1" required>

                <input type="number" id="altura"
                    placeholder="Altura em metros" min="0.1"
                    step="0.01" required>

                <button type="submit">Calcular IMC</button>
            </form>
        </section>

        <section class="resultado" id="resultado">
            <h2>Resultado do Cálculo</h2>

            <div class="resultado-box">
                <p id="mensagem">
                    Preencha os dados para calcular o IMC.
                </p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
