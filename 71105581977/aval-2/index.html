
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <h2>TaskFlow</h2>
            <p>Gerenciador de Tarefas</p>
        </div>

        <nav>
            <a href="#">🏠 Dashboard</a>
            <a href="#cadastro">➕ Nova Tarefa</a>
            <a href="#tarefas">📋 Minhas Tarefas</a>
        </nav>

        <div class="icone">
            <span>✓</span>
        </div>
    </aside>

    <main>
        <header>
            <h1>Gerenciamento de Tarefas</h1>
            <p>Organize suas atividades e acompanhe seu progresso.</p>
        </header>

        <section class="cards">
            <div class="card">
                <h3>Total de Tarefas</h3>
                <p id="totalTarefas">0</p>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <p id="tarefasConcluidas">0</p>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <p id="tarefasPendentes">0</p>
            </div>
        </section>

        <section class="formulario" id="cadastro">
            <h2>Cadastrar Nova Tarefa</h2>

            <form id="formTarefa">
                <input type="number" id="codigo"
                    placeholder="Código da tarefa" required>

                <input type="text" id="titulo"
                    placeholder="Título da tarefa" required>

                <select id="prioridade" required>
                    <option value="">Selecione a prioridade</option>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit">Cadastrar Tarefa</button>
            </form>
        </section>

        <section class="tarefas" id="tarefas">
            <h2>Minhas Tarefas</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaTarefas"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
