<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Beauty Star</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>
                <body>

                    <div class="game">
                            <h1>💄 Beauty Star 💅</h1>
                                    <p>Monte o visual da personagem!</p>

                                            <div class="personagem">
                                                        <div id="cabelo">💇</div>
                                                                    <div id="rosto">👩</div>
                                                                                <div id="roupa">👗</div>
                                                                                        </div>

                                                                                                <div class="menu">
                                                                                                            <h2>Escolha o cabelo</h2>
                                                                                                                        <button onclick="escolher('cabelo', '💇‍♀️')">💇‍♀️</button>
                                                                                                                                    <button onclick="escolher('cabelo', '👩‍🦱')">👩‍🦱</button>
                                                                                                                                                <button onclick="escolher('cabelo', '👩‍🦰')">👩‍🦰</button>

                                                                                                                                                            <h2>Escolha a maquiagem</h2>
                                                                                                                                                                        <button onclick="escolher('rosto', '💄')">💄</button>
                                                                                                                                                                                    <button onclick="escolher('rosto', '💋')">💋</button>
                                                                                                                                                                                                <button onclick="escolher('rosto', '✨')">✨</button>

                                                                                                                                                                                                            <h2>Escolha a roupa</h2>
                                                                                                                                                                                                                        <button onclick="escolher('roupa', '👗')">👗</button>
                                                                                                                                                                                                                                    <button onclick="escolher('roupa', '👚')">👚</button>
                                                                                                                                                                                                                                                <button onclick="escolher('roupa', '🥻')">🥻</button>
                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                <p class="pontuacao">Pontuação: <span id="pontos">0</span></p>

                                                                                                                                                                                                                                                                        <button class="finalizar" onclick="finalizar()">⭐ Finalizar Visual</button>

                                                                                                                                                                                                                                                                                <p id="resultado"></p>
                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                        </html>
