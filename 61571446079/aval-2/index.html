<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mini Rede Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Minha Rede Social</h1>

        <!-- Caixa para criar novo post -->
        <div class="caixa-postagem">
            <textarea id="textoPost" placeholder="No que você está pensando?"></textarea>
            <button id="botaoPublicar">Publicar</button>
        </div>

        <!-- Feed de publicações -->
        <div id="feed" class="feed">
            <!-- Post de exemplo inicial -->
            <div class="post">
                <p class="autor">João Silva</p>
                <p class="conteudo">Bem-vindo à minha nova rede social integrada com HTML, CSS e JS!</p>
                <button class="botao-curtir">Curtir (<span>0</span>)</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
