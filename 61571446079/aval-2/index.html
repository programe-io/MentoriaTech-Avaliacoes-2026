<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Seguras</title>
    <link rel="stylesheet" href="estilo.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>🔑 Gerador de Senhas</h1>
        
        <!-- Campo para exibir a senha e botão de copiar -->
        <div class="resultado-container">
            <input type="text" id="senha" readonly placeholder="Clique em Gerar">
            <button id="btn-copiar">Copiar</button>
        </div>

        <!-- Opções de personalização -->
        <div class="opcoes">
            <div class="campo">
                <label for="tamanho">Tamanho: <span id="valor-tamanho">12</span> caracteres</label>
                <input type="range" id="tamanho" min="6" max="32" value="12">
            </div>

            <div class="checkboxes">
                <label><input type="checkbox" id="maiusculas" checked> Incluir Maiúsculas (A-Z)</label>
                <label><input type="checkbox" id="minusculas" checked> Incluir Minúsculas (a-z)</label>
                <label><input type="checkbox" id="numeros" checked> Incluir Números (0-9)</label>
                <label><input type="checkbox" id="simbolos" checked> Incluir Símbolos (!@#$)</label>
            </div>
        </div>

        <button id="btn-gerar">Gerar Senha</button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
