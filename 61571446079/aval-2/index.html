<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="feed-container">
    <header class="feed-header">
      <h2>Meu Mini Feed</h2>
    </header>

    <!-- Formulário para nova publicação -->
    <div class="post-box">
      <textarea id="post-text" placeholder="No que você está pensando?" rows="3"></textarea>
      <div class="post-box-footer">
        <button id="btn-post">Publicar</button>
      </div>
    </div>

    <!-- Container onde os posts serão renderizados -->
    <div id="posts-container"></div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
