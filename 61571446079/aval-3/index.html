<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mini E-commerce</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Loja Virtual</h1>
            <div class="carrinho-icone">🛒 Carrinho: <span id="contadorCarrinho">0</span> itens</div>
        </header>

        <main class="loja-layout">
            <!-- Vitrine de Produtos -->
            <section class="produtos">
                <h2>Produtos Disponíveis</h2>
                <div class="grid-produtos">
                    <div class="produto-card">
                        <h3>Fone Bluetooth</h3>
                        <p class="preco">R$ 150,00</p>
                        <button onclick="adicionarAoCarrinho('Fone Bluetooth', 150)">Comprar</button>
                    </div>
                    <div class="produto-card">
                        <h3>Smartwatch</h3>
                        <p class="preco">R$ 300,00</p>
                        <button onclick="adicionarAoCarrinho('Smartwatch', 300)">Comprar</button>
                    </div>
                    <div class="produto-card">
                        <h3>Teclado Gamer</h3>
                        <p class="preco">R$ 220,00</p>
                        <button onclick="adicionarAoCarrinho('Teclado Gamer', 220)">Comprar</button>
                    </div>
                </div>
            </section>

            <!-- Resumo do Carrinho -->
            <aside class="carrinho-resumo">
                <h2>Seu Carrinho</h2>
                <ul id="listaCarrinho">
                    <li class="carrinho-vazio">O carrinho está vazio.</li>
                </ul>
                <div class="total">
                    <strong>Total: R$ <span id="valorTotal">0,00</span></strong>
                </div>
                <button id="botaoFinalizar" onclick="finalizarCompra()">Finalizar Compra</button>
            </aside>
        </main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
