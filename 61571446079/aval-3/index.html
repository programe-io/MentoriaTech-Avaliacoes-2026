<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Clone</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Layout Principal -->
  <div class="app-layout">
    
    <!-- Sidebar / Navegação Lateral (Estilo Instagram Web) -->
    <aside class="sidebar">
      <div class="brand">
        <h2>Instagram</h2>
      </div>

      <nav class="nav-menu">
        <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i> <span>Página inicial</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i> <span>Pesquisa</span></a>
        <a href="#" class="nav-item"><i class="fa-regular fa-compass"></i> <span>Explorar</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-clapperboard"></i> <span>Reels</span></a>
        <a href="#" class="nav-item"><i class="fa-regular fa-paper-plane"></i> <span>Mensagens</span></a>
        <a href="#" class="nav-item"><i class="fa-regular fa-heart"></i> <span>Notificações</span></a>
        <a href="#" id="open-create" class="nav-item"><i class="fa-regular fa-square-plus"></i> <span>Criar</span></a>
        <a href="#" class="nav-item">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" class="profile-thumb" alt="Perfil">
          <span>Perfil</span>
        </a>
      </nav>
    </aside>

    <!-- Conteúdo Central -->
    <main class="main-content">
      <div class="feed-container">
        
        <!-- Barra de Stories -->
        <section class="stories-bar" id="stories-container">
          <!-- Renderizado via JS -->
        </section>

        <!-- Feed de Publicações -->
        <section class="feed" id="feed-container">
          <!-- Renderizado via JS -->
        </section>

      </div>
    </main>

    <!-- Sidebar Direita (Sugestões de Perfil) -->
    <aside class="right-sidebar">
      <div class="user-profile-header">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Seu Perfil">
        <div class="user-info">
          <span class="username">seu_usuario</span>
          <span class="fullname">Seu Nome</span>
        </div>
        <button class="switch-btn">Mudar</button>
      </div>

      <div class="suggestions-header">
        <span>Sugestões para você</span>
        <a href="#">Ver tudo</a>
      </div>

      <div class="suggestions-list" id="suggestions-container">
        <!-- Renderizado via JS -->
      </div>
    </aside>

  </div>

  <!-- Modal para Criar Novo Post -->
  <div id="create-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Criar nova publicação</h3>
        <button id="close-modal" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="post-img-url" placeholder="Cole a URL de uma imagem..." />
        <textarea id="post-caption" placeholder="Escreva uma legenda..."></textarea>
      </div>
      <div class="modal-footer">
        <button id="publish-btn" class="btn-primary">Compartilhar</button>
      </div>
    </div>
  </div>

  <!-- Custom JS -->
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
