<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronômetro Digital</title>
    <link rel="stylesheet" href="estilo.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>⏱️ Cronômetro</h1>

        <!-- Display do Tempo -->
        <div class="display" id="display">00:00:00</div>

        <!-- Botões de Controle -->
        <div class="controles">
            <button id="btn-iniciar" class="btn btn-iniciar">Iniciar</button>
            <button id="btn-volta" class="btn btn-volta" disabled>Volta</button>
            <button id="btn-zerar" class="btn btn-zerar" disabled>Zerar</button>
        </div>

        <!-- Registro de Voltas -->
        <div class="historico">
            <h2>Voltas</h2>
            <ul id="lista-voltas"></ul>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
