<!DOCTYPE html>
<html>
<head>
  <title>Insta Ultra Simples</title>
  <style>
    body { font-family: sans-serif; background: #eee; display: flex; justify-content: center; }
    .post { background: #fff; border: 1px solid #ccc; width: 300px; margin-top: 20px; }
    .header { padding: 10px; font-weight: bold; }
    img { width: 100%; }
    .footer { padding: 10px; }
    button { background: none; border: none; font-size: 20px; cursor: pointer; }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="post">
    <div class="header">@jonatas</div>
    <img src="https://picsum.photos/300">
    <div class="footer">
      <button onclick="this.innerText = this.innerText === '🤍' ? '❤️' : '🤍'">🤍</button>
      <p><b>@jonatas</b> Minha foto!</p>
    </div>
  </div>

<script src="script.js"></script></body>
</html>
