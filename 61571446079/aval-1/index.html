<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Supermercado</title>
    <link rel="stylesheet" href="estilo.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>🛒 Lista de Supermercado</h1>

        <!-- Formulário para adicionar novos itens -->
        <form id="form-item">
            <input type="text" id="input-item" placeholder="Ex: Leite, Pão, Maçã..." required>
            <button type="submit">Adicionar</button>
        </form>

        <!-- Lista onde os itens aparecerão -->
        <ul id="lista-compras">
            <!-- Os itens serão gerados dinamicamente via JavaScript -->
        </ul>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
