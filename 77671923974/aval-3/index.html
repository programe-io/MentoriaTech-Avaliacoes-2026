<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📸 Mini Feed</h1>
    </header>

    <main class="container">

        <section class="criar-post">
            <h2>O que você está pensando?</h2>

            <input type="text" id="nome" placeholder="Seu nome">
            <textarea id="texto" placeholder="Escreva uma publicação..."></textarea>

            <button onclick="publicar()">Publicar</button>
        </section>

        <section id="feed">
            <article class="post">
                <h3>João</h3>
                <p>Meu primeiro post no Mini Feed! 🚀</p>
                <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
            </article>
        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
