<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundamentos de JavaScript</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #f7df1e;
            background-color: #323330;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            margin-top: 0;
        }
        h2 {
            border-bottom: 2px solid #323330;
            padding-bottom: 5px;
            color: #2c3e50;
        }
        .card {
            background: #f9f9f9;
            border-left: 5px solid #f7df1e;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin: 5px 0;
        }
        ul {
            padding-left: 20px;
        }
        li {
            padding: 5px 0;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>JavaScript na Prática (HTML + JS)</h1>

        <!-- Seções onde o JavaScript vai injetar os resultados -->
        <div class="card">
            <h2>1. Variáveis e Tipos de Dados</h2>
            <p id="output-dados"></p>
        </div>

        <div class="card">
            <h2>2. Operadores e Condicionais</h2>
            <p id="output-condicionais"></p>
        </div>

        <div class="card">
            <h2>3. Estruturas de Repetição (Loop)</h2>
            <ul id="output-repeticao"></ul>
        </div>

        <div class="card">
            <h2>4. Funções e Estruturas de Dados</h2>
            <p id="output-funcoes"></p>
            <p><strong>Lista de Tecnologias:</strong></p>
            <ul id="output-lista"></ul>
        </div>
    </div>

    <!-- CÓDIGO JAVASCRIPT INTEGRADO -->
    <script>
        // 1. Variáveis e Tipos de Dados
        let nomeAluno = "Carlos";
        let idade = 25;
        const nomeCurso = "Lógica de JS";
        
        document.getElementById("output-dados").innerHTML = 
            `O aluno <strong>${nomeAluno}</strong> (Idade: ${idade} anos) está matriculado no curso <strong>${nomeCurso}</strong>.`;

        // 2. Operadores e Condicionais
        let nota1 = 8.5;
        let nota2 = 7.0;
        let media = (nota1 + nota2) / 2;
        let statusFinal = "";

        if (media >= 7.0) {
            statusFinal = "<span style='color: green; font-weight: bold;'>Aprovado! Parabéns.</span>";
        } else if (media >= 5.0) {
            statusFinal = "<span style='color: orange; font-weight: bold;'>Recuperação.</span>";
        } else {
            statusFinal = "<span style='color: red; font-weight: bold;'>Reprovado.</span>";
        }

        document.getElementById("output-condicionais").innerHTML = 
            `Média calculada: <strong>${media.toFixed(1)}</strong><br>Status do Aluno: ${statusFinal}`;

        // 3. Estruturas de Repetição
        let listaRepeticao = document.getElementById("output-repeticao");
        for (let i = 3; i > 0; i--) {
            let item = document.createElement("li");
            item.textContent = `Faltam ${i} dias para o início das aulas...`;
            listaRepeticao.appendChild(item);
        }
        let itemFinal = document.createElement("li");
        itemFinal.innerHTML = "<strong>🚀 As aulas começaram!</strong>";
        listaRepeticao.appendChild(itemFinal);

        // 4. Funções e Estruturas de Dados (Arrays)
        function calcularMensalidade(valorBase, desconto) {
            return valorBase - desconto;
        }
        let boleto = calcularMensalidade(300, 45);
        document.getElementById("output-funcoes").innerHTML = 
            `Valor da mensalidade calculada via função: <strong>R$ ${boleto},00</strong>`;

        let linguagens = ["JavaScript", "Python", "TypeScript", "HTML/CSS"];
        let listaLinguagens = document.getElementById("output-lista");
        
        linguagens.forEach(function(linguagem) {
            let li = document.createElement("li");
            li.textContent = linguagem;
            listaLinguagens.appendChild(li);
        });
    </script>
</body>
</html>
