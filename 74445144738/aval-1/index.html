<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Estoque</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <h1>Controle de Estoque</h1>

    <!-- Formulário de Cadastro / Edição -->
    <form id="stock-form">
      <input type="hidden" id="product-id">
      
      <div class="input-group">
        <label for="product-name">Nome do Produto</label>
        <input type="text" id="product-name" required placeholder="Ex: Teclado Mecânico">
      </div>

      <div class="input-group">
        <label for="product-qty">Quantidade</label>
        <input type="number" id="product-qty" min="0" required placeholder="0">
      </div>

      <div class="input-group">
        <label for="product-price">Preço (R$)</label>
        <input type="number" id="product-price" step="0.01" min="0" required placeholder="0.00">
      </div>

      <button type="submit" id="save-btn">Salvar Produto</button>
      <button type="button" id="cancel-btn" class="hidden">Cancelar</button>
    </form>

    <!-- Tabela de Produtos -->
    <h2>Produtos em Estoque</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Quantidade</th>
          <th>Preço Un.</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="stock-table-body">
        <!-- Itens inseridos via JavaScript -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
