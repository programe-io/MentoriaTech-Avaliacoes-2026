```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Cadastro de Produtos</h1>

        <!-- CADASTRO -->
        <div class="card">

            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="formulario">

                    <div class="campo">
                        <label for="descricao">Descrição</label>
                        <input
                            type="text"
                            id="descricao"
                            placeholder="Ex: Cadeira Gamer"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="quantidade">Quantidade</label>
                        <input
                            type="number"
                            id="quantidade"
                            min="1"
                            placeholder="Ex: 10"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="valor">Valor</label>
                        <input
                            type="number"
                            id="valor"
                            min="0"
                            step="0.01"
                            placeholder="Ex: 699.00"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn-cadastrar"
                    >
                        Cadastrar Produto
                    </button>

                </div>

            </form>

        </div>


        <!-- ATUALIZAÇÃO -->
        <div class="card">

            <h2>Atualizar Produto</h2>

            <div class="formulario">

                <div class="campo">
                    <label for="codigoAtualizar">
                        Código do Produto
                    </label>

                    <input
                        type="number"
                        id="codigoAtualizar"
                        min="1"
                        placeholder="Ex: 1"
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">
                        Novo Valor
                    </label>

                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 750.00"
                    >
                </div>

                <button type="button" id="btnAtualizarValor">
                    Atualizar Valor
                </button>

                <div class="campo">
                    <label for="novaQuantidade">
                        Nova Quantidade
                    </label>

                    <input
                        type="number"
                        id="novaQuantidade"
                        min="1"
                        placeholder="Ex: 20"
                    >
                </div>

                <button type="button" id="btnAtualizarQuantidade">
                    Atualizar Quantidade
                </button>

            </div>

        </div>


        <!-- LISTAGEM -->
        <div class="card">

            <h2>Produtos Cadastrados</h2>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Os produtos serão adicionados pelo JavaScript -->
                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
```
