<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Controle de IMC</h1>
    <form id="form-imc">
      <label for="nome">Nome do Paciente:</label>
      <input type="text" id="nome" placeholder="Ex: Maria Silva" required>

      <label for="peso">Peso (kg):</label>
      <input type="number" id="peso" step="0.1" placeholder="Ex: 70.5" required>

      <label for="altura">Altura (m):</label>
      <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75" required>

      <button type="submit">Calcular IMC</button>
    </form>

    <div id="resultado" class="resultado oculto"></div>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
