
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #263b5e;
        }

        h2 {
            color: #263b5e;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px 3px;
            border: none;
            border-radius: 5px;
            background: #263b5e;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #42689e;
        }

        .produto {
            background: #f0f2f5;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #263b5e;
        }

        .mensagem {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>📦 Sistema de Estoque</h1>

    <h2>Cadastrar Produto</h2>

    <input type="number" id="codigo" placeholder="Código do produto">
    <input type="text" id="descricao" placeholder="Descrição do produto">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor do produto" step="0.01">

    <button onclick="cadastrar()">Cadastrar Produto</button>

    <hr>

    <h2>Alterar Produto</h2>

    <input type="number" id="codigoAlterar" placeholder="Código do produto">

    <input type="number" id="novoValor" placeholder="Novo valor" step="0.01">
    <button onclick="alterarValor()">Alterar Valor</button>

    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">
    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    <hr>

    <h2>Produtos Cadastrados</h2>

    <button onclick="listar()">Listar Produtos</button>

    <div id="lista"></div>

    <p id="mensagem" class="mensagem"></p>

</div>

<script>

    let produtos = [];

    function cadastrar() {

        let codigo = Number(document.getElementById("codigo").value);
        let descricao = document.getElementById("descricao").value;
        let quantidade = Number(document.getElementById("quantidade").value);
        let valor = Number(document.getElementById("valor").value);

        if (!codigo || !descricao.trim() ||
            document.getElementById("quantidade").value === "" ||
            document.getElementById("valor").value === "" ||
            quantidade < 0 || valor < 0) {
            alert("Preencha todos os campos corretamente!");
            return;
        }

        let existe = produtos.find(p => p.codigo === codigo);

        if (existe) {
            alert("Código já cadastrado!");
            return;
        }

        produtos.push({
            codigo: codigo,
            descricao: descricao,
            quantidade: quantidade,
            valor: valor
        });

        alert("Produto cadastrado com sucesso!");

        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";

        listar();
    }

    function listar() {

        let lista = document.getElementById("lista");

        lista.innerHTML = "";

        if (produtos.length === 0) {
            lista.innerHTML = "<p>Nenhum produto cadastrado.</p>";
            return;
        }

        produtos.forEach(produto => {

            lista.innerHTML += `
                <div class="produto">
                    <strong>Código:</strong> ${produto.codigo}<br>
                    <strong>Descrição:</strong> ${produto.descricao}<br>
                    <strong>Quantidade:</strong> ${produto.quantidade}<br>
                    <strong>Valor:</strong> R$ ${produto.valor.toFixed(2)}
                </div>
            `;

        });
    }

    function alterarValor() {

        let codigo = Number(document.getElementById("codigoAlterar").value);
        let novoValor = document.getElementById("novoValor").value;

        let produto = produtos.find(p => p.codigo === codigo);

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (novoValor === "" || Number(novoValor) < 0) {
            alert("Digite um valor válido!");
            return;
        }

        produto.valor = Number(novoValor);

        alert("Valor alterado com sucesso!");

        listar();
    }

    function alterarQuantidade() {

        let codigo = Number(document.getElementById("codigoAlterar").value);
        let novaQuantidade = document.getElementById("novaQuantidade").value;

        let produto = produtos.find(p => p.codigo === codigo);

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (novaQuantidade === "" || Number(novaQuantidade) < 0) {
            alert("Digite uma quantidade válida!");
            return;
        }

        produto.quantidade = Number(novaQuantidade);

        alert("Quantidade alterada com sucesso!");

        listar();
    }

</script>

<script src="script.js"></script></body>
</html>
