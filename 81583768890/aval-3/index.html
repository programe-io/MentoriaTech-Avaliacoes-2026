<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clone Instagram</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topbar">
    <h1 class="logo">InstaClone</h1>
  </header>

  <main class="container">
    <!-- Barra de Stories -->
    <section class="stories" aria-label="Stories">
      <div class="story">
        <div class="story-ring"><img src="https://i.pravatar.cc/150?img=12" alt="Ana" /></div>
        <span>ana.dev</span>
      </div>
      <div class="story">
        <div class="story-ring"><img src="https://i.pravatar.cc/150?img=32" alt="Lucas" /></div>
        <span>lucas_ui</span>
      </div>
      <div class="story">
        <div class="story-ring"><img src="https://i.pravatar.cc/150?img=45" alt="Marina" /></div>
        <span>marina.js</span>
      </div>
      <div class="story">
        <div class="story-ring"><img src="https://i.pravatar.cc/150?img=58" alt="Rafael" /></div>
        <span>rafa.code</span>
      </div>
    </section>

    <!-- Postagem do Feed -->
    <article class="post">
      <div class="post-header">
        <img class="avatar" src="https://i.pravatar.cc/150?img=12" alt="Avatar de ana.dev" />
        <span class="username">ana.dev</span>
      </div>

      <img
        class="post-image"
        src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=900&q=80"
        alt="Notebook com código em mesa de trabalho"
      />

      <div class="post-actions">
        <div class="left-actions">
          <button id="like-btn" class="icon-btn" aria-label="Curtir">♡</button>
          <label for="comment-input" class="icon-btn" aria-label="Comentar">💬</label>
        </div>
        <button id="save-btn" class="icon-btn" aria-label="Salvar">🔖</button>
      </div>

      <p class="likes"><strong id="likes-count">128</strong> curtidas</p>

      <p class="caption">
        <strong>ana.dev</strong> Montando o clone do feed passo a passo! 🚀
      </p>

      <ul id="comments-list" class="comments-list">
        <li><strong>lucas_ui</strong> Ficou muito bom o layout!</li>
      </ul>

      <form id="comment-form" class="comment-form">
        <input
          id="comment-input"
          type="text"
          placeholder="Adicione um comentário..."
          autocomplete="off"
        />
        <button type="submit">Publicar</button>
      </form>
    </article>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
