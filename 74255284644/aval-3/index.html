<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h1>Ficha de Anamnese</h1>

    <form id="formAnamnese">

        <h2>Dados pessoais</h2>

        <label>Nome completo:</label>
        <input type="text" id="nome" required>

        <label>Idade:</label>
        <input type="number" id="idade" required>

        <label>Telefone:</label>
        <input type="tel" id="telefone">

        <label>Data de nascimento:</label>
        <input type="date" id="nascimento">

        <h2>Histórico de saúde</h2>

        <label>Possui alguma doença?</label>
        <select id="doenca">
            <option>Não</option>
            <option>Sim</option>
        </select>

        <label>Possui alergia?</label>
        <select id="alergia">
            <option>Não</option>
            <option>Sim</option>
        </select>

        <label>Usa algum medicamento?</label>
        <select id="medicamento">
            <option>Não</option>
            <option>Sim</option>
        </select>

        <label>Já realizou alguma cirurgia?</label>
        <select id="cirurgia">
            <option>Não</option>
            <option>Sim</option>
        </select>

        <h2>Informações adicionais</h2>

        <label>Queixa principal:</label>
        <textarea id="queixa"></textarea>

        <label>Observações:</label>
        <textarea id="observacoes"></textarea>

        <button type="submit">Enviar ficha</button>
    </form>

    <div id="resultado"></div>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
