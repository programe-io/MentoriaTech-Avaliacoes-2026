
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <h2>Cadastrar Produto</h2>

        <input type="text" id="descricao" placeholder="Descrição do produto">
        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="number" id="valor" placeholder="Valor">

        <button onclick="cadastrarProduto()">Cadastrar</button>

        <h2>Atualizar Valor</h2>

        <input type="number" id="codigoValor" placeholder="Código do produto">
        <input type="number" id="novoValor" placeholder="Novo valor">

        <button onclick="atualizarValor()">Atualizar Valor</button>

        <h2>Atualizar Quantidade</h2>

        <input type="number" id="codigoQuantidade" placeholder="Código do produto">
        <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

        <button onclick="atualizarQuantidade()">Atualizar Quantidade</button>

        <h2>Lista de Produtos</h2>

        <div id="listaProdutos"></div>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
