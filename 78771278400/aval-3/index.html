<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone (Simplificado)</title>
  <script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="bg-gray-50 flex flex-col items-center min-h-screen pt-4">

  <!-- CABEÇALHO / NAVBAR -->
  <header class="w-full max-w-sm bg-white border border-gray-300 p-3 flex justify-between items-center rounded-t-lg">
    <h1 class="font-bold text-lg">Instagram</h1>
    <span class="text-xl">❤️</span>
  </header>

  <!-- SEÇÃO DE STORIES -->
  <div class="w-full max-w-sm bg-white border-x border-b border-gray-300 p-3 flex space-x-3 overflow-x-auto">
    <div class="flex flex-col items-center">
      <img src="https://via.placeholder.com/50" class="w-12 h-12 rounded-full border-2 border-pink-500 p-0.5">
      <span class="text-[10px] mt-1">Seu story</span>
    </div>
    <div class="flex flex-col items-center">
      <img src="https://via.placeholder.com/50" class="w-12 h-12 rounded-full border-2 border-pink-500 p-0.5">
      <span class="text-[10px] mt-1">usuario_1</span>
    </div>
    <div class="flex flex-col items-center">
      <img src="https://via.placeholder.com/50" class="w-12 h-12 rounded-full border-2 border-pink-500 p-0.5">
      <span class="text-[10px] mt-1">usuario_2</span>
    </div>
  </div>

  <!-- POST DO FEED -->
  <main class="w-full max-w-sm bg-white border border-gray-300 mt-4 rounded-lg overflow-hidden">
    <!-- Topo do Post -->
    <div class="flex items-center p-3 space-x-2">
      <img src="https://via.placeholder.com/40" class="w-8 h-8 rounded-full">
      <span class="font-semibold text-xs">programe_io</span>
    </div>

    <!-- Imagem -->
    <img src="https://via.placeholder.com/400x300" class="w-full object-cover">

    <!-- Ações e Legenda -->
    <div class="p-3 space-y-1">
      <div class="flex space-x-3 text-lg">
        <button>❤️</button>
        <button>💬</button>
        <button>✈️</button>
      </div>
      <p class="font-semibold text-xs">100 curtidas</p>
      <p class="text-xs">
        <span class="font-semibold">programe_io</span> Meu primeiro clone do Instagram! 🚀
      </p>
    </div>
  </main>

<script src="script.js"></script></body>
</html>
