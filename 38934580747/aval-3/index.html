<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <h1>Calculadora de IMC - Ficha de Anamnese</h1>

        <!-- Card 1: Formulário de Cadastro -->
        <section class="card">
            <h2>Cadastrar Paciente</h2>
            <form id="form-pessoa">
                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Ex: Maria Silva" maxlength="50">
                </div>

                <div class="campo-grupo">
                    <div class="campo">
                        <label for="idade">Idade (anos):</label>
                        <input type="number" id="idade" placeholder="Ex: 30" min="1" max="120">
                    </div>

                    <div class="campo">
                        <label for="altura">Altura (m):</label>
                        <input type="number" id="altura" placeholder="Ex: 1.70" min="0.5" max="2.5" step="0.01">
                    </div>

                    <div class="campo">
                        <label for="peso">Peso (kg):</label>
                        <input type="number" id="peso" placeholder="Ex: 65.5" min="2" max="500" step="0.1">
                    </div>
                </div>

                <!-- Mensagem de erro -->
                <p id="erro" class="mensagem-erro" hidden></p>

                <div class="botoes">
                    <button type="submit" class="btn-salvar">Salvar</button>
                    <button type="reset" id="btn-cancelar" class="btn-cancelar">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Card 2: Tabela de Pacientes Cadastrados -->
        <section class="card">
            <h2>Pacientes Cadastrados</h2>
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-pessoas">
                        <!-- Preenchido dinamicamente via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
