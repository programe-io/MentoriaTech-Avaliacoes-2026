<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <div class="formulario">
            <label>Descrição</label>
            <input type="text" id="descricao" placeholder="Nome do produto">

            <label>Quantidade</label>
            <input type="number" id="quantidade" placeholder="Quantidade">

            <label>Valor</label>
            <input type="number" id="valor" step="0.01" placeholder="R$ 0,00">

            <button onclick="cadastrar()">Cadastrar Produto</button>
        </div>

        <h2>Atualizar Produto</h2>

        <div class="formulario">
            <label>Código do Produto</label>
            <input type="number" id="codigo" placeholder="Código">

            <label>Novo Valor</label>
            <input type="number" id="novoValor" step="0.01" placeholder="Novo valor">

            <button onclick="atualizarValorProduto()">Atualizar Valor</button>

            <label>Nova Quantidade</label>
            <input type="number" id="novaQuantidade" placeholder="Quantidade">

            <button onclick="atualizarQuantidadeProduto()">Atualizar Quantidade</button>
        </div>

        <h2>Produtos Cadastrados</h2>
        <div id="listaProdutos"></div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
