<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Página Completa</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
    }

    header {
      background: #0077cc;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background: #005fa3;
      display: flex;
      justify-content: center;
      gap: 15px;
      padding: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
      background: white;
    }

    .card {
      background: #e9e9e9;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #222;
      color: white;
      margin-top: 20px;
    }

    button {
      padding: 10px 15px;
      border: none;
      background: #0077cc;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #005fa3;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

  <header>
    <h1>Minha Página Completa</h1>
    <p>Exemplo de HTML com CSS e JavaScript</p>
  </header>

  <nav>
    <a href="#inicio">Início</a>
    <a href="#sobre">Sobre</a>
    <a href="#contato">Contato</a>
  </nav>

  <div class="container" id="inicio">

    <h2>Bem-vindo</h2>
    <p>Esta é uma página HTML completa com estrutura básica.</p>

    <div class="card">
      <h3>Card 1</h3>
      <p>Conteúdo de exemplo dentro de um card.</p>
    </div>

    <div class="card">
      <h3>Card 2</h3>
      <p>Outro exemplo de seção estilizada.</p>
    </div>

    <button onclick="mostrarMensagem()">Clique aqui</button>

    <p id="mensagem"></p>

  </div>

  <footer>
    <p>&copy; 2026 - Minha Página</p>
  </footer>

  <script>
    function mostrarMensagem() {
      document.getElementById("mensagem").innerText =
        "Você clicou no botão! JavaScript funcionando 👍";
    }
  </script>

<script src="script.js"></script></body>
</html>
