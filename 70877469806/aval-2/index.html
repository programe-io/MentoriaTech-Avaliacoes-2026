<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>
        
        <!-- Formulário de Cadastro -->
        <section class="form-section">
            <h2>Nova Tarefa</h2>
            <form id="form-tarefa">
                <div class="form-group">
                    <label for="titulo">Título da Tarefa (mín. 5 carateres):</label>
                    <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript Avançado" required>
                </div>
                
                <div class="form-group">
                    <label for="prioridade">Prioridade:</label>
                    <select id="prioridade" required>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>
                
                <button type="submit" id="btn-cadastrar">Cadastrar Tarefa</button>
            </form>
            <div id="mensagem-erro" class="erro-msg"></div>
        </section>

        <!-- Lista de Tarefas -->
        <section class="list-section">
            <h2>Tarefas Cadastradas</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-tarefas">
                        <!-- As tarefas serão inseridas aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
