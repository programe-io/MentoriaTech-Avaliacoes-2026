<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Anamnese - Controle de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Ficha de Anamnese - Controle de IMC</h1>

    <!-- Formulário de cadastro -->
    <form id="form-pessoa" novalidate>
      <div class="campos">
        <div class="campo">
          <label for="input-nome">Nome completo</label>
          <input type="text" id="input-nome" placeholder="Ex: Francisco Silva" required>
        </div>

        <div class="campo">
          <label for="input-idade">Idade (anos)</label>
          <input type="number" id="input-idade" placeholder="Ex: 30" required>
        </div>

        <div class="campo">
          <label for="input-altura">Altura (m)</label>
          <input type="number" id="input-altura" step="0.01" placeholder="Ex: 1.70" required>
        </div>

        <div class="campo">
          <label for="input-peso">Peso (kg)</label>
          <input type="number" id="input-peso" step="0.1" placeholder="Ex: 65.0" required>
        </div>
      </div>

      <!-- Mensagem de erro controlada pelo JS -->
      <p id="erro" class="mensagem-erro" hidden></p>

      <button type="submit" class="btn-salvar">Salvar Paciente</button>
    </form>

    <!-- Tabela de exibição -->
    <div class="tabela-wrapper">
      <table>
        <thead>
          <tr>
            <th>Cód.</th>
            <th>Nome</th>
            <th>Idade</th>
            <th>Altura</th>
            <th>Peso</th>
            <th>IMC</th>
            <th>Classificação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-pessoas">
          <!-- As linhas serão inseridas dinamicamente via JavaScript -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
