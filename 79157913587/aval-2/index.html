<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MiniFeed da Karem</title>
        <link rel="stylesheet" href="style.css">
    <link href="style.css" rel="stylesheet"></head>
    <body>
        
        <header>
            
            <div class="header-content">

                <h1>MiniFeed New Social</h1>

                <nav>
                    <a href="#">Início</a>
                    <a href="#">Perfil</a>
                </nav>

            </div>


        </header>

        <main>

            <section class="new-post">

                <div class="user">

                    <div class="Avatar">
                        K
                    </div>

                    <div>
                        <strong>Karem</strong>
                        <span>O que você está pensando?!</span>
                    </div>

                </div>

                <button>Publicar</button>



            </section>

            <article class="post">

                <div class="post-header"></div>
                <div class="Avatar">
                        M
                    </div>

                    <div>
                        <strong>Emanuelly</strong>
                        <span>Há 30 Minutos</span>
                    </div>

                    <div class="post-text">

                        Hoje assisti uma série na Netflix chamada: Diário de um Vampiro,
                        foi muito legal!

                    </div>

                    <img src="images (1).jpg" alt="Diário de um Vampiro" width="550px">

                    <div class="Post-Action">

                        <button>Curtir</button>
                        <button>Comentar</button>

                    </div>

            </article>

        </main>

        <footer>

        </footer>

    </body>
