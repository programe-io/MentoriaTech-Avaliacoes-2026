<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Efeito Do A Barrel Roll</title>
    <style>
        /* 1. Definição da animação de rotação (360 graus) */
        @keyframes roll {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* 2. Classe que aciona a animação (duração de 4 segundos como a do Google) */
        .barrel-roll {
            animation-name: roll;
            animation-duration: 4s;
            animation-iteration-count: 1; /* Roda apenas 1 vez */
            animation-timing-function: ease-in-out; /* Começo e fim suaves */
        }

        /* Estilos básicos para o exemplo visual */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .quadrado {
            width: 200px;
            height: 200px;
            background-color: #4285F4;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- O elemento que vai girar -->
    <div id="tela" class="quadrado">Clique para girar!</div>

    <script>
        // Script simples para ativar a animação no clique
        const elemento = document.getElementById('tela');
        
        elemento.addEventListener('click', () => {
            // Adiciona a classe de animação
            elemento.classList.add('barrel-roll');
            
            // Remove a classe após o término (4s) para poder clicar e girar de novo
            setTimeout(() => {
                elemento.classList.remove('barrel-roll');
            }, 4000);
        });
    </script>

<script src="script.js"></script></body>
</html>
