<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <!-- Conexão com o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Cadastro de Produtos</h1>
        <p class="subtitulo">
            Sistema de gerenciamento de estoque
        </p>

        <!-- Formulário de cadastro -->
        <div class="card">
            <h2>Cadastrar novo produto</h2>

            <form id="formProduto">

                <div class="formulario">

                    <div>
                        <label for="descricao">Descrição do produto:</label>
                        <input
                            type="text"
                            id="descricao"
                            placeholder="Ex.: Mouse Logitech"
                            required
                        >
                    </div>

                    <div>
                        <label for="quantidade">Quantidade:</label>
                        <input
                            type="number"
                            id="quantidade"
                            min="1"
                            step="1"
                            placeholder="Ex.: 10"
                            required
                        >
                    </div>

                    <div>
                        <label for="valor">Valor unitário (R$):</label>
                        <input
                            type="number"
                            id="valor"
                            min="0"
                            step="0.01"
                            placeholder="Ex.: 99.90"
                            required
                        >
                    </div>

                </div>

                <button type="submit">
                    Cadastrar produto
                </button>

            </form>

            <p id="mensagem" class="mensagem"></p>
        </div>

        <!-- Resumo do estoque -->
        <div class="card">
            <h2>Resumo do estoque</h2>

            <p>
                Produtos cadastrados:
                <strong id="totalProdutos">0</strong>
            </p>

            <p>
                Unidades em estoque:
                <strong id="totalUnidades">0</strong>
            </p>

            <p>
                Valor total do estoque:
                <strong id="valorEstoque">R$ 0,00</strong>
            </p>
        </div>

        <!-- Tabela de produtos -->
        <div class="card">
            <h2>Lista de produtos</h2>

            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor unitário</th>
                            <th>Valor total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Produtos adicionados pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Conexão com o arquivo JavaScript -->
    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
