<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
  <h1>📦 Sistema de Estoque de Produtos</h1>
  <p class="subtitulo">Cadastre, liste e atualize seus produtos</p>

  <div class="card card-cadastrar">
    <h3>➕ Cadastrar Produto</h3>
    <form id="formProduto">
      <input type="text" id="codigo" placeholder="Código" required>
      <input type="text" id="descricao" placeholder="Descrição" required>
      <input type="number" id="quantidade" placeholder="Quantidade" required>
      <input type="number" id="valor" placeholder="Valor" step="0.01" required>
      <button class="btn-cadastrar" type="submit">Cadastrar</button>
    </form>
  </div>

  <div class="card card-valor">
    <h3>💰 Alterar Valor</h3>
    <div class="alterar">
      <input type="text" id="codAlterarValor" placeholder="Código do produto">
      <input type="number" id="novoValor" placeholder="Novo valor" step="0.01">
      <button class="btn-valor" onclick="alterarValor()">Alterar Valor</button>
    </div>
  </div>

  <div class="card card-qtd">
    <h3>🔢 Alterar Quantidade</h3>
    <div class="alterar">
      <input type="text" id="codAlterarQtd" placeholder="Código do produto">
      <input type="number" id="novaQuantidade" placeholder="Nova quantidade">
      <button class="btn-quantidade" onclick="alterarQuantidade()">Alterar Quantidade</button>
    </div>
  </div>

  <hr>

  <h2>📋 Produtos Cadastrados</h2>
  <table id="tabelaProdutos">
    <thead>
      <tr>
        <th>Código</th>
        <th>Descrição</th>
        <th>Quantidade</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody id="corpoTabela"></tbody>
  </table>
</div>
  <script src="script.js"></script>
  
</body>
</html>
