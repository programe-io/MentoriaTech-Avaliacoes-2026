
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header class="header">
            <h1>Gerenciador de Tarefas</h1>
            <p>Cadastre, organize e acompanhe suas tarefas.</p>
        </header>

        <section class="form-section">
            <h2>Cadastrar nova tarefa</h2>

            <form id="taskForm">

                <div class="form-group">
                    <label for="taskCode">Código:</label>
                    <input type="text" id="taskCode"
                        placeholder="Digite o código da tarefa" required>
                </div>

                <div class="form-group">
                    <label for="taskTitle">Título:</label>
                    <input type="text" id="taskTitle"
                        placeholder="Digite o título da tarefa" required>
                </div>

                <div class="form-group">
                    <label for="taskPriority">Prioridade:</label>
                    <select id="taskPriority" required>
                        <option value="1">1 - Alta</option>
                        <option value="2" selected>2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit">Adicionar tarefa</button>

            </form>
        </section>

        <section class="tasks-section">
            <h2>Minhas tarefas</h2>

            <div class="summary">
                <span id="totalTasks">Total: 0</span>
                <span id="completedTasks">Concluídas: 0</span>
                <span id="pendingTasks">Pendentes: 0</span>
            </div>

            <div id="taskList">
                <p class="empty-state">
                    Nenhuma tarefa cadastrada. Adicione sua primeira tarefa!
                </p>
            </div>
        </section>

        <footer class="page-footer">
            As tarefas ficam salvas neste navegador.
        </footer>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
