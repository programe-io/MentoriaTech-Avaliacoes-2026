<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">

  <h1>Gerenciador de Tarefas</h1>

  <p class="descricao">
    Cadastre, conclua e altere a prioridade das suas tarefas.
  </p>

  <form id="formulario">

    <label for="titulo">Título da tarefa</label>

    <input
      type="text"
      id="titulo"
      placeholder="Digite uma tarefa"
    >

    <label for="prioridade">Prioridade</label>

    <select id="prioridade">
      <option value="1">1 - Alta</option>
      <option value="2" selected>2 - Média</option>
      <option value="3">3 - Baixa</option>
    </select>

    <button type="submit">
      Cadastrar tarefa
    </button>

  </form>

  <div class="resumo">
    <p>Total: <strong id="total">0</strong></p>
    <p>Pendentes: <strong id="pendentes">0</strong></p>
    <p>Concluídas: <strong id="concluidas">0</strong></p>
  </div>

  <h2>Lista de tarefas</h2>

  <p id="mensagem">
    Nenhuma tarefa cadastrada.
  </p>

  <div id="lista"></div>

</div>

  <script src="script.js"></script>
  
</body>
</html>
