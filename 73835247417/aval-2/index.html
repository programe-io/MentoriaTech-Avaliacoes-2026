<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="app">
  <h1>Gerenciador de Tarefas</h1>

  <form id="form-tarefa" novalidate>
    <div class="campo">
      <label for="titulo">Título (mín. 5 caracteres)</label>
      <input type="text" id="titulo" placeholder="Ex.: Estudar JavaScript" autocomplete="off">
    </div>
    <div class="campo campo-prioridade">
      <label for="prioridade">Prioridade</label>
      <select id="prioridade">
        <option value="1">1 - Alta</option>
        <option value="2" selected>2 - Média</option>
        <option value="3">3 - Baixa</option>
      </select>
    </div>
    <button type="submit">Cadastrar</button>
  </form>

  <p id="mensagem" role="alert"></p>

  <section>
    <div class="topo-lista">
      <h2>Tarefas cadastradas</h2>
      <span id="contador">0 tarefas</span>
    </div>
    <ul id="lista"></ul>
  </section>
</main>
  <script src="script.js"></script>
  
</body>
</html>
