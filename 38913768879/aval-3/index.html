<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON SYNTH // Audio Launchpad & Sequenciador</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="app-container">
        <header>
            <h1>⚡ NEON SYNTH 2026</h1>
            <p>Sintetizador Interativo & Sequenciador de Ritmos</p>
        </header>

        <main>
            <!-- Osciloscópio / Visualizador de Áudio em Canvas -->
            <div class="visualizer-wrapper">
                <canvas id="visualizer" width="500" height="90"></canvas>
            </div>

            <!-- Painel de Controle e Tempo (BPM) -->
            <div class="painel-controles">
                <button id="btn-loop" class="btn-acao">▶ INICIAR RITMO</button>
                <div class="bpm-box">
                    <label for="bpm">BPM: <span id="bpm-val">120</span></label>
                    <input type="range" id="bpm" min="70" max="180" value="120">
                </div>
            </div>

            <!-- LEDs Indicadores do Sequenciador de Passo -->
            <div class="step-tracker">
                <span class="step-led"></span><span class="step-led"></span>
                <span class="step-led"></span><span class="step-led"></span>
                <span class="step-led"></span><span class="step-led"></span>
                <span class="step-led"></span><span class="step-led"></span>
            </div>

            <!-- Grid de 8 Pads de Som -->
            <div class="pads-grid" id="pads-grid">
                <button class="pad-btn" data-sound="kick" data-key="1">
                    <span class="pad-num">1</span> BUMBO (KICK)
                </button>
                <button class="pad-btn" data-sound="snare" data-key="2">
                    <span class="pad-num">2</span> CAIXA (SNARE)
                </button>
                <button class="pad-btn" data-sound="hihat" data-key="3">
                    <span class="pad-num">3</span> PRATO (HI-HAT)
                </button>
                <button class="pad-btn" data-sound="clap" data-key="4">
                    <span class="pad-num">4</span> PALMA (CLAP)
                </button>
                <button class="pad-btn" data-sound="bass1" data-key="5">
                    <span class="pad-num">5</span> BASS DROP
                </button>
                <button class="pad-btn" data-sound="synth1" data-key="6">
                    <span class="pad-num">6</span> SYNTH A
                </button>
                <button class="pad-btn" data-sound="synth2" data-key="7">
                    <span class="pad-num">7</span> SYNTH B
                </button>
                <button class="pad-btn" data-sound="laser" data-key="8">
                    <span class="pad-num">8</span> LASER FX
                </button>
            </div>
        </main>

        <footer>
            <p>Dica: Use os cliques no mouse ou as **teclas 1 a 8** do seu teclado!</p>
        </footer>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
