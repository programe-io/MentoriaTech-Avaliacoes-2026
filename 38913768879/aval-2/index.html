<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-CORE // Survival Protocol</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>CYBER-CORE</h1>
        <p>Defenda o núcleo. Desvie das ameaças. Absorva os dados.</p>
    </header>

    <main class="container-principal">
        <div class="hud">
            <div class="hud-item">
                <span>PONTUAÇÃO</span>
                <strong id="score">0</strong>
            </div>
            <div class="hud-item">
                <span>MULTIPLICADOR</span>
                <strong id="combo">x1</strong>
            </div>
            <div class="hud-item">
                <span>INTEGRIDADE</span>
                <strong id="health">100%</strong>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="700" height="450"></canvas>
            
            <div id="screen-overlay" class="overlay">
                <h2 id="overlay-title">INICIAR PROTOCOLO</h2>
                <p id="overlay-msg">Mova o mouse sobre a tela para controlar o Núcleo.</p>
                <button id="btn-acao">INICIAR JOGO</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 CYBER-CORE Engine. Desenvolvido com HTML5 Canvas & JS Puro.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
