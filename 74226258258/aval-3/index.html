<!DOCTYPE html>

<head>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Instagram</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="bg-gray-100">

<header class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-5xl mx-auto p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">Instagram</h1>

        <input type="text" placeholder="Pesquisar"
        class="hidden md:block bg-gray-100 rounded-lg p-2">

        <div class="flex gap-4 text-2xl">
            <i class="bx bx-home"></i>
            <i class="bx bx-search"></i>
            <i class="bx bx-plus"></i>
            <i class="bx bx-heart"></i>
            <i class="bx bx-user-circle"></i>
        </div>
    </div>
</header>

<main class="max-w-5xl mx-auto p-4 flex gap-8">

<div class="feed w-full max-w-lg mx-auto">

    <!-- STORIES -->
    <section class="bg-white rounded-lg p-4 mb-4">
        <div class="flex gap-5 overflow-x-auto">

            <div class="story">
                <div class="story-img">
                    <span>+</span>
                </div>
                <p>Seu story</p>
            </div>

            <div class="story">
                <img src="https://i.pinimg.com/736x/14/4e/6b/144e6b74157165d07dae7415c4db61cd.jpg">
                <p>paola.pinheiro</p>
            </div>

            <div class="story">
                <img src="https://i.pinimg.com/1200x/0a/5e/42/0a5e42cf6a59594c36f267a87e580122.jpg">
                <p>adryvv</p>
            </div>

            <div class="story">
                <img src="https://i.pinimg.com/736x/39/10/11/3910114f4796c7ddffe99236c4a0800b.jpg">
                <p>yas.costa</p>
            </div>

        </div>
    </section>

    <!-- PUBLICAÇÃO 1 -->
    <article class="post bg-white rounded-lg mb-4">

        <div class="flex justify-between items-center p-4">
            <div class="flex items-center gap-3">
                <img class="avatar"
                src="https://i.pinimg.com/1200x/0a/5e/42/0a5e42cf6a59594c36f267a87e580122.jpg">
                <div>
                    <strong>adryvv</strong>
                    <p class="text-xs text-gray-500">São Paulo, Brasil</p>
                </div>
            </div>
            <i class="bx bx-dots-horizontal text-2xl"></i>
        </div>

        <img class="post-img"
        src="https://i.pinimg.com/736x/14/01/e5/1401e5ba6d70d96735a75a687f9f45a1.jpg">

        <div class="p-4">
            <div class="flex justify-between text-2xl">
                <div class="flex gap-4">
                    <i class="bx bx-heart like" onclick="toggleLike(this, 'likes-1')"></i>
                    <i class="bx bx-message-rounded"></i>
                    <i class="bx bx-send"></i>
                </div>
                <i class="bx bx-bookmark bookmark"
                onclick="toggleBookmark(this)"></i>
            </div>

            <p id="likes-1" class="font-bold mt-2" data-count="1234">
                1.234 curtidas
            </p>

            <p class="text-sm mt-2">
                <strong>adryvv</strong>
                Turistandooo!
            </p>

            <p class="text-gray-500 text-sm mt-2">
                Ver todos os 48 comentários
            </p>
            <p class="text-xs text-gray-400 mt-2">HÁ DUAS HORAS</p>
        </div>
    </article>

    <!-- PUBLICAÇÃO 2 -->
    <article class="post bg-white rounded-lg mb-4">

        <div class="flex items-center justify-between p-4">
            <div class="flex items-center gap-3">
                <img class="avatar"
                src="https://i.pinimg.com/736x/39/10/11/3910114f4796c7ddffe99236c4a0800b.jpg">
                <div>
                    <strong>yas.costa</strong>
                    <p class="text-xs text-gray-500">Parnaíba-PI</p>
                </div>
            </div>
            <i class="bx bx-dots-horizontal text-2xl"></i>
        </div>

        <img class="post-img"
        src="https://i.pinimg.com/736x/90/95/1a/90951ad2ec63837a8393593b805a647f.jpg">

        <div class="p-4">
            <div class="flex justify-between text-2xl">
                <div class="flex gap-4">
                    <i class="bx bx-heart like"
                    onclick="toggleLike(this, 'likes-2')"></i>
                    <i class="bx bx-message-rounded"></i>
                    <i class="bx bx-send"></i>
                </div>
                <i class="bx bx-bookmark bookmark"
                onclick="toggleBookmark(this)"></i>
            </div>

            <p id="likes-2" class="font-bold mt-2" data-count="1050">
                1.050 curtidas
            </p>

            <p class="text-sm mt-2">
                <strong>yas.costa</strong>
                meu dia na praia!
            </p>

            <p class="text-gray-500 text-sm mt-2">
                Ver todos os 19 comentários
            </p>
            <p class="text-xs text-gray-400 mt-2">HÁ DUAS HORAS</p>
        </div>
    </article>

</div>


  <script src="script.js"></script>
  
</body>
</html>
