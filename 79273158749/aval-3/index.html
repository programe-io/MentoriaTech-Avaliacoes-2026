    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>KhemGram • Rede Interativa</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
    <body>

        <!-- Barra Lateral de Navegação -->
        <aside class="sidebar">
            <div class="logo">
                <h1>KhemGram</h1>
            </div>
            <nav class="nav-links">
                <a href="#" class="nav-item active" data-tab="feed"><i class="fa-solid fa-house"></i> <span>Página Inicial</span></a>
                <a href="#" class="nav-item" id="btn-open-search"><i class="fa-solid fa-magnifying-glass"></i> <span>Pesquisa</span></a>
                <a href="#" class="nav-item" data-tab="messages"><i class="fa-regular fa-paper-plane"></i> <span>Mensagens</span></a>
                <a href="#" class="nav-item" id="btn-open-create"><i class="fa-regular fa-square-plus"></i> <span>Criar Post</span></a>
                <a href="#" class="nav-item profile-link" data-tab="feed">
                    <img src="https://placehold.co/40x40/2c3e50/ffffff?text=K" alt="Khem">
                    <span>khem_oficial</span>
                </a>
            </nav>
        </aside>

        <!-- Gaveta de Pesquisa -->
        <div class="search-drawer" id="search-drawer">
            <div class="drawer-header">
                <h2>Pesquisar</h2>
                <i class="fa-solid fa-xmark" id="btn-close-search"></i>
            </div>
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Buscar Khem, Parat, Charn ou Jet...">
            </div>
            <div class="search-results" id="search-results">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <!-- Conteúdo Principal -->
        <main class="main-container">
            
            <!-- ABA 1: FEED PRINCIPAL -->
            <div class="feed-section" id="tab-feed">
                
                <!-- Barra de Stories -->
                <section class="stories-container" id="stories-bar">
                    <!-- Preenchido via JS -->
                </section>

                <!-- Container de Posts -->
                <div id="posts-container">
                    <!-- Preenchido via JS -->
                </div>

            </div>

            <!-- ABA 2: MENSAGENS (DIRECT) -->
            <div class="messages-section hidden" id="tab-messages">
                <div class="chat-list">
                    <div class="chat-list-header">
                        <strong>khem_oficial</strong>
                        <i class="fa-regular fa-pen-to-square"></i>
                    </div>
                    <div id="chat-users-list">
                        <!-- Contatos via JS -->
                    </div>
                </div>
                <div class="chat-window">
                    <div class="chat-header" id="active-chat-header">
                        <img src="imagens/ab6761610000e5eb3d668ea042e66148e36f9673.jpg" alt="Parat">
                        <div>
                            <strong>mestre_parat</strong>
                            <span>Online agora</span>
                        </div>
                    </div>
                    <div class="chat-messages" id="chat-messages-box">
                        <!-- Mensagens via JS -->
                    </div>
                    <form class="chat-input-form" id="chat-form">
                        <input type="text" id="chat-input" placeholder="Envie uma mensagem..." autocomplete="off">
                        <button type="submit">Enviar</button>
                    </form>
                </div>
            </div>

            <!-- Barra Lateral Direita (Sugestões e Seguir) -->
            <aside class="right-sidebar" id="right-sidebar">
                <div class="current-user">
                    <img src="imagens/images.jpg" alt="Khem">
                    <div class="user-meta">
                        <strong>khem_oficial</strong>
                        <span>Khemjira</span>
                    </div>
                    <span class="badge-online">Ativo</span>
                </div>

                <div class="suggestions-header">
                    <span>Personagens & Amigos</span>
                </div>

                <div id="suggestions-list">
                    <!-- Lista de Seguir/Seguindo via JS -->
                </div>

                <footer class="sidebar-footer">
                    <p>Sobre • Ajuda • Privacidade • Termos</p>
                    <p>© 2026 KHEMGRAM INTERATIVO</p>
                </footer>
            </aside>
        </main>

        <!-- MODAL: VISUALIZADOR DE STORIES -->
        <div class="modal-overlay hidden" id="story-modal">
            <div class="story-viewer">
                <div class="story-progress-bar">
                    <div class="story-progress-fill" id="story-progress"></div>
                </div>
                <div class="story-viewer-header">
                    <div class="story-user-info">
                        <img id="story-avatar" src="" alt="">
                        <strong id="story-username"></strong>
                        <span id="story-time">2h</span>
                    </div>
                    <i class="fa-solid fa-xmark" id="btn-close-story"></i>
                </div>
                <div class="story-content">
                    <img id="story-image" src="" alt="Story">
                    <p class="story-caption" id="story-text"></p>
                </div>
            </div>
        </div>

        <!-- MODAL: CRIAR NOVA POSTAGEM -->
        <div class="modal-overlay hidden" id="create-modal">
            <div class="create-box">
                <div class="create-header">
                    <h3>Criar nova publicação</h3>
                    <i class="fa-solid fa-xmark" id="btn-close-create"></i>
                </div>
                <form id="create-post-form" class="create-form">
                    <label>Escolha uma foto do computador (opcional):</label>
                    <input type="file" id="post-file-input" accept="image/*">
                    
                    <label>Ou cole o link de uma imagem:</label>
                    <input type="text" id="post-url-input" placeholder="https://...">

                    <label>Localização:</label>
                    <input type="text" id="post-location-input" placeholder="Ex: Templo Sagrado, Bangkok..." required>

                    <label>Legenda:</label>
                    <textarea id="post-caption-input" rows="3" placeholder="Escreva o que Khem está pensando..." required></textarea>

                    <button type="submit" class="btn-primary">Compartilhar no Feed</button>
                </form>
            </div>
        </div>

        <script src="script.js"></script>
    <script src="script.js"></script></body>
    </html>
