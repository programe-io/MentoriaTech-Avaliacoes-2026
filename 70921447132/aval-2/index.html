<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Gerenciador de Tarefas</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <main class="container">
              <header class="topo">
                    <div>
                            <p class="subtitulo">ORGANIZAÇÃO PESSOAL</p>
                                    <h1>Gerenciador de Tarefas</h1>
                                            <p class="descricao">Cadastre, organize e acompanhe suas tarefas.</p>
                                                  </div>
                                                        <div class="icone">✓</div>
                                                            </header>

                                                                <section class="painel">
                                                                      <h2>Nova tarefa</h2>
                                                                            <form id="formTarefa">
                                                                                    <div class="campo titulo-campo">
                                                                                              <label for="titulo">Título da tarefa</label>
                                                                                                        <input id="titulo" type="text" placeholder="Ex.: Estudar JavaScript" minlength="5" required>
                                                                                                                </div>
                                                                                                                        <div class="campo">
                                                                                                                                  <label for="prioridade">Prioridade</label>
                                                                                                                                            <select id="prioridade">
                                                                                                                                                        <option value="1">1 - Alta</option>
                                                                                                                                                                    <option value="2" selected>2 - Média</option>
                                                                                                                                                                                <option value="3">3 - Baixa</option>
                                                                                                                                                                                          </select>
                                                                                                                                                                                                  </div>
                                                                                                                                                                                                          <button type="submit" class="btn-adicionar">Adicionar tarefa</button>
                                                                                                                                                                                                                </form>
                                                                                                                                                                                                                      <p id="mensagem" class="mensagem" aria-live="polite"></p>
                                                                                                                                                                                                                          </section>

                                                                                                                                                                                                                              <section class="lista-section">
                                                                                                                                                                                                                                    <div class="lista-cabecalho">
                                                                                                                                                                                                                                            <h2>Minhas tarefas</h2>
                                                                                                                                                                                                                                                    <span id="contador" class="contador">0 tarefas</span>
                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                <div id="listaTarefas" class="lista-tarefas">
                                                                                                                                                                                                                                                                        <p class="vazio">Nenhuma tarefa cadastrada ainda.</p>
                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                  </section>
                                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                                      <script src="script.js"></script>
                                                                                                                                                                                                                                                                                      <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                      </html>
