
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewsFeed - Notícias</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f4f6;
    color: #222;
}

header {
    background: #14213d;
    color: white;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

.logo span {
    color: #fca311;
}

nav {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    cursor: pointer;
}

nav a:hover {
    color: #fca311;
}

.container {
    max-width: 1200px;
    margin: 35px auto;
    padding: 0 20px;
}

.topo {
    margin-bottom: 25px;
}

.topo h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.topo p {
    color: #666;
}

.search {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin: 20px 0;
    font-size: 16px;
}

.categorias {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.categorias button {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: white;
    cursor: pointer;
    transition: .3s;
}

.categorias button:hover,
.categorias button.ativo {
    background: #fca311;
    color: white;
}

.feed {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px #00000010;
    transition: .3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.conteudo {
    padding: 18px;
}

.tag {
    color: #fca311;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
}

.conteudo h2 {
    font-size: 19px;
    margin: 12px 0;
}

.conteudo p {
    color: #666;
    line-height: 1.5;
    font-size: 14px;
}

.data {
    color: #999;
    font-size: 12px;
    margin-top: 15px;
}

.ler {
    display: inline-block;
    margin-top: 15px;
    background: #14213d;
    color: white;
    padding: 10px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
}

.ler:hover {
    background: #fca311;
}

#mais {
    display: block;
    margin: 35px auto;
    padding: 14px 30px;
    border: none;
    background: #14213d;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

#mais:hover {
    background: #fca311;
}

footer {
    background: #14213d;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 50px;
}

@media(max-width: 900px) {
    .feed {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 600px) {
    header {
        flex-direction: column;
    }

    .feed {
        grid-template-columns: 1fr;
    }

    .topo h1 {
        font-size: 25px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <div class="logo">News<span>Feed</span></div>

    <nav>
        <a href="#">Início</a>
        <a href="#noticias">Notícias</a>
        <a href="#sobre">Sobre</a>
    </nav>
</header>

<main class="container">

    <section class="topo">
        <h1>Últimas Notícias</h1>
        <p>Fique informado sobre os principais acontecimentos.</p>

        <input
            type="text"
            class="search"
            id="pesquisa"
            placeholder="Pesquisar notícias..."
        >
    </section>

    <div class="categorias">
        <button class="ativo" onclick="filtrar('Todas', this)">Todas</button>
        <button onclick="filtrar('Tecnologia', this)">Tecnologia</button>
        <button onclick="filtrar('Esportes', this)">Esportes</button>
        <button onclick="filtrar('Política', this)">Política</button>
        <button onclick="filtrar('Entretenimento', this)">Entretenimento</button>
    </div>

    <section class="feed" id="noticias"></section>

    <button id="mais" onclick="carregarMais()">
        Carregar mais notícias
    </button>

</main>

<footer id="sobre">
    <p>© 2026 NewsFeed - Todos os direitos reservados.</p>
</footer>

<script>

const listaNoticias = [
    {
        titulo: "Inteligência artificial transforma o mundo",
        categoria: "Tecnologia",
        descricao: "Novas tecnologias estão mudando a maneira como as pessoas trabalham e se comunicam.",
        imagem: "https://images.unsplash.com/photo-1677442136019-21780ecad995?w=600",
        data: "18/11/2026"
    },
    {
        titulo: "Brasil se prepara para novos desafios",
        categoria: "Esportes",
        descricao: "Seleções e atletas intensificam a preparação para as próximas competições.",
        imagem: "https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=600",
        data: "18/11/2026"
    },
    {
        titulo: "Debates políticos movimentam o país",
        categoria: "Política",
        descricao: "Representantes discutem propostas e projetos para o futuro do Brasil.",
        imagem: "https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?w=600",
        data: "17/11/2026"
    },
    {
        titulo: "Cinema anuncia grandes lançamentos",
        categoria: "Entretenimento",
        descricao: "Novas produções prometem movimentar as salas de cinema.",
        imagem: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600",
        data: "17/11/2026"
    },
    {
        titulo: "Tecnologia avança na área da educação",
        categoria: "Tecnologia",
        descricao: "Ferramentas digitais estão criando novas possibilidades de aprendizagem.",
        imagem: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600",
        data: "16/11/2026"
    },
    {
        titulo: "Campeonatos movimentam o futebol",
        categoria: "Esportes",
        descricao: "Clubes disputam partidas importantes em busca de títulos.",
        imagem: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=600",
        data: "16/11/2026"
    },
    {
        titulo: "Novidades no cenário econômico",
        categoria: "Política",
        descricao: "Decisões e propostas econômicas estão no centro das discussões.",
        imagem: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=600",
        data: "15/11/2026"
    },
    {
        titulo: "Música ganha destaque nas plataformas",
        categoria: "Entretenimento",
        descricao: "Artistas lançam novos trabalhos e conquistam milhares de ouvintes.",
        imagem: "https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=600",
        data: "15/11/2026"
    }
];

let categoriaAtual = "Todas";
let quantidade = 6;

function mostrarNoticias() {

    const feed = document.getElementById("noticias");
    const busca = document.getElementById("pesquisa")
        .value.toLowerCase();

    feed.innerHTML = "";

    const filtradas = listaNoticias.filter(noticia => {

        const categoriaOK =
            categoriaAtual === "Todas" ||
            noticia.categoria === categoriaAtual;

        const buscaOK =
            noticia.titulo.toLowerCase().includes(busca) ||
            noticia.descricao.toLowerCase().includes(busca);

        return categoriaOK && buscaOK;
    });

    filtradas.slice(0, quantidade).forEach(noticia => {

        feed.innerHTML += `
            <article class="card">
                <img src="${noticia.imagem}" alt="${noticia.titulo}">

                <div class="conteudo">
                    <span class="tag">${noticia.categoria}</span>

                    <h2>${noticia.titulo}</h2>

                    <p>${noticia.descricao}</p>

                    <div class="data">${noticia.data}</div>

                    <button class="ler"
                        onclick="lerNoticia('${noticia.titulo.replace(/'/g, "\\'")}')">
                        Ler notícia
                    </button>
                </div>
            </article>
        `;
    });

    document.getElementById("mais").style.display =
        filtradas.length > quantidade ? "block" : "none";

    if (filtradas.length === 0) {
        feed.innerHTML = "<p>Nenhuma notícia encontrada.</p>";
    }
}

function filtrar(categoria, botao) {

    categoriaAtual = categoria;
    quantidade = 6;

    document.querySelectorAll(".categorias button")
        .forEach(btn => btn.classList.remove("ativo"));

    botao.classList.add("ativo");

    mostrarNoticias();
}

function carregarMais() {
    quantidade += 3;
    mostrarNoticias();
}

function lerNoticia(titulo) {
    const noticia = listaNoticias.find(n => n.titulo === titulo);

    alert(
        noticia.titulo + "\n\n" +
        noticia.descricao
    );
}

document.getElementById("pesquisa")
    .addEventListener("input", mostrarNoticias);

mostrarNoticias();

</script>

<script src="script.js"></script></body>
</html>
