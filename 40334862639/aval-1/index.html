
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>
        <p>Gerencie os produtos do seu estoque.</p>

        <section class="card">
            <h2>Novo Produto</h2>

            <form id="formProduto">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao"
                       placeholder="Nome do produto" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade"
                       min="1" placeholder="Ex.: 10" required>

                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor"
                       min="0" step="0.01"
                       placeholder="Ex.: 99.90" required>

                <button type="submit">Cadastrar Produto</button>
            </form>
        </section>

        <section class="card">
            <h2>Atualizar Produto</h2>

            <label for="codigo">Código do produto:</label>
            <input type="number" id="codigo" min="1"
                   placeholder="Ex.: 1">

            <label for="novoValor">Novo valor (R$):</label>
            <input type="number" id="novoValor"
                   min="0" step="0.01"
                   placeholder="Ex.: 89.90">

            <button type="button" id="btnValor">
                Atualizar Valor
            </button>

            <label for="novaQuantidade">Adicionar quantidade:</label>
            <input type="number" id="novaQuantidade"
                   min="1" placeholder="Ex.: 5">

            <button type="button" id="btnQuantidade">
                Adicionar Estoque
            </button>
        </section>

        <section class="card">
            <h2>Lista de Produtos</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                    </tbody>
                </table>
            </div>

            <p id="mensagem"></p>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
