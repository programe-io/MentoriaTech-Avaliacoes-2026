<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header class="navbar">
        <h1>MiniFeed</h1>
    </header>

    <main class="container">
        <!-- Caixa para criar nova postagem -->
        <section class="post-box">
            <form id="post-form">
                <input type="text" id="author-input" placeholder="Seu nome" required>
                <textarea id="content-input" rows="3" placeholder="O que você está pensando?" required></textarea>
                <button type="submit">Publicar</button>
            </form>
        </section>

        <!-- Área onde o feed será renderizado -->
        <section id="feed-container" class="feed-list"></section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
