<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaClone</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <!-- Barra Superior -->
    <header class="navbar">
        <div class="nav-container">
            <h1 class="logo">InstaClone</h1>
            <button id="open-modal-btn" class="btn-new-post">+ Nova Postagem</button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-container">
        <!-- Barra de Stories -->
        <section class="stories-bar" id="stories-container"></section>

        <!-- Feed de Publicações -->
        <section class="feed" id="feed-container"></section>
    </main>

    <!-- Modal para Criar Nova Postagem -->
    <div id="post-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Criar nova publicação</h2>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            <form id="new-post-form">
                <input type="text" id="username-input" placeholder="Seu nome de usuário (ex: joao.silva)" required>
                <input type="url" id="image-url-input" placeholder="URL da imagem (ex: https://picsum.photos)" required>
                <textarea id="caption-input" rows="3" placeholder="Escreva uma legenda..." required></textarea>
                <button type="submit" class="btn-submit">Compartilhar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
