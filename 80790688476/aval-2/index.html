```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <!-- CABEÇALHO -->
        <header>
            <div>
                <h1>Gerenciador de Tarefas</h1>
                <p>Organize suas tarefas de forma simples</p>
            </div>

            <div class="data" id="dataAtual"></div>
        </header>


        <!-- RESUMO -->
        <section class="resumo">

            <div class="card">
                <span class="icone azul">📋</span>
                <div>
                    <p>Total</p>
                    <strong id="totalTarefas">0</strong>
                </div>
            </div>

            <div class="card">
                <span class="icone amarelo">⏳</span>
                <div>
                    <p>Pendentes</p>
                    <strong id="tarefasPendentes">0</strong>
                </div>
            </div>

            <div class="card">
                <span class="icone verde">✅</span>
                <div>
                    <p>Concluídas</p>
                    <strong id="tarefasConcluidas">0</strong>
                </div>
            </div>

        </section>


        <!-- ADICIONAR TAREFA -->
        <section class="painel adicionar">

            <h2>Nova tarefa</h2>

            <div class="formulario">

                <input
                    type="text"
                    id="tituloTarefa"
                    placeholder="Digite uma tarefa..."
                >

                <select id="prioridade">
                    <option value="baixa">Baixa</option>
                    <option value="media" selected>Média</option>
                    <option value="alta">Alta</option>
                </select>

                <input
                    type="date"
                    id="dataTarefa"
                >

                <button id="btnAdicionar">
                    + Adicionar
                </button>

            </div>

        </section>


        <!-- LISTA -->
        <section class="painel">

            <div class="topo-lista">

                <h2>Minhas tarefas</h2>

                <div class="filtros">

                    <input
                        type="text"
                        id="pesquisa"
                        placeholder="🔎 Pesquisar..."
                    >

                    <select id="filtro">
                        <option value="todas">Todas</option>
                        <option value="pendentes">Pendentes</option>
                        <option value="concluidas">Concluídas</option>
                        <option value="alta">Prioridade alta</option>
                    </select>

                </div>

            </div>


            <div id="listaTarefas" class="lista-tarefas"></div>


            <div id="mensagemVazia" class="mensagem-vazia">
                <div>📝</div>
                <h3>Nenhuma tarefa encontrada</h3>
                <p>Adicione uma nova tarefa para começar.</p>
            </div>

        </section>


        <!-- RODAPÉ -->
        <footer>
            <button id="limparConcluidas">
                🗑️ Limpar concluídas
            </button>

            <span>
                As tarefas são salvas automaticamente.
            </span>
        </footer>

    </div>


    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
```
