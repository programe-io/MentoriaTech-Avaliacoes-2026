<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <h1>📋 Gerenciador de Tarefas</h1>
<p>Cadastre, organize e acompanhe suas tarefas.</p>

<div class="resumo">
  <div>Total de tarefas: <strong id="total">4</strong></div>
  <div>Pendentes: <strong id="pendentes">3</strong></div>
  <div>Concluídas: <strong id="concluidas">1</strong></div>
</div>

<h2>Cadastrar nova tarefa</h2>

<div class="formulario">
  <input id="titulo" type="text" placeholder="Digite o título da tarefa">
  <select id="prioridade">
    <option value="1">1 - Alta</option>
    <option value="2" selected>2 - Média</option>
    <option value="3">3 - Baixa</option>
  </select>
  <button id="adicionar">Cadastrar tarefa</button>
</div>

<p id="mensagem"></p>

<h2>Lista de tarefas</h2>

<table>
  <thead>
    <tr>
      <th>Código</th>
      <th>Título</th>
      <th>Prioridade</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody id="lista"></tbody>
</table>
  <script src="script.js"></script>
  
</body>
</html>
