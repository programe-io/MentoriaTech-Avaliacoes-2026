<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Élise - Gestão de Tarefas & Atelier</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Playfair Display & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <!-- Arquivo CSS Externo -->
    <link rel="stylesheet" href="style.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        rose: {
                            50: '#fdf2f4',
                            100: '#fce7eb',
                            200: '#f8d2d9',
                            300: '#f2aeb9',
                            400: '#e87d8f',
                            500: '#d9526a',
                            600: '#c23b53',
                            700: '#a32f44',
                            800: '#872a3b',
                            900: '#732635',
                            950: '#40111a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body class="bg-rose-50/60 dark:bg-zinc-950 text-zinc-800 dark:text-zinc-100 font-sans min-h-screen transition-colors duration-300 flex flex-col">

    <!-- Header Principal -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md border-b border-rose-200/60 dark:border-zinc-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-full bg-rose-200 dark:bg-rose-900/50 flex items-center justify-center border-2 border-rose-400 shadow-inner">
                    <i class="fa-solid fa-wand-magic-sparkles text-rose-600 dark:text-rose-300 text-lg"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-serif font-bold tracking-wide text-rose-700 dark:text-rose-300">Maison Élise</h1>
                    <p class="text-xs uppercase tracking-widest text-zinc-500 dark:text-zinc-400 font-medium">Atelier & Gestão de Demandas</p>
                </div>
            </div>

            <!-- Ações do Topo -->
            <div class="flex items-center space-x-4">
                <button onclick="openNewTaskModal()" class="inline-flex items-center space-x-2 bg-rose-500 hover:bg-rose-600 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-all shadow-md shadow-rose-500/20 active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nova Tarefa</span>
                </button>
                <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-xl bg-rose-100 dark:bg-zinc-800 text-rose-700 dark:text-rose-300 flex items-center justify-center transition-all hover:bg-rose-200 dark:hover:bg-zinc-700" title="Alternar Tema">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Cards de Indicadores de Produtividade -->
        <section class="grid grid-cols-1 sm:grid-cols-3 gap-5">
            <div class="bg-white dark:bg-zinc-900 p-6 rounded-2xl border border-rose-100 dark:border-zinc-800 shadow-sm relative overflow-hidden group">
                <div class="flex items-center justify-between relative z-10">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">Total de Tarefas</p>
                        <h3 id="kpiTotal" class="text-3xl font-bold font-serif text-zinc-900 dark:text-white mt-1">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-rose-100 dark:bg-rose-900/40 text-rose-600 dark:text-rose-400 flex items-center justify-center text-xl">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white dark:bg-zinc-900 p-6 rounded-2xl border border-rose-100 dark:border-zinc-800 shadow-sm relative overflow-hidden group">
                <div class="flex items-center justify-between relative z-10">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">Em Andamento</p>
                        <h3 id="kpiProgress" class="text-3xl font-bold font-serif text-amber-600 dark:text-amber-400 mt-1">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xl">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white dark:bg-zinc-900 p-6 rounded-2xl border border-rose-100 dark:border-zinc-800 shadow-sm relative overflow-hidden group">
                <div class="flex items-center justify-between relative z-10">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">Concluídas</p>
                        <h3 id="kpiCompleted" class="text-3xl font-bold font-serif text-emerald-600 dark:text-emerald-400 mt-1">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-xl">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- Barra de Ferramentas / Filtros -->
        <section class="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-rose-100 dark:border-zinc-800 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="relative w-full md:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-zinc-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="renderKanban()" placeholder="Buscar tarefas..." class="w-full pl-10 pr-4 py-2.5 bg-rose-50/50 dark:bg-zinc-800/50 border border-rose-200 dark:border-zinc-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-400 dark:text-white">
            </div>

            <div class="flex items-center space-x-3 w-full md:w-auto">
                <select id="priorityFilter" onchange="renderKanban()" class="bg-rose-50/50 dark:bg-zinc-800/50 border border-rose-200 dark:border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-zinc-700 dark:text-zinc-200 focus:outline-none focus:ring-2 focus:ring-rose-400 w-full md:w-auto">
                    <option value="">Todas as Prioridades</option>
                    <option value="Baixa">Baixa</option>
                    <option value="Média">Média</option>
                    <option value="Alta">Alta (Urgente)</option>
                </select>
            </div>
        </section>

        <!-- Quadro Kanban Dinâmico (Arrastar e Soltar / Mudar Status) -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
            
            <!-- Coluna: A Fazer -->
            <div class="bg-rose-50/40 dark:bg-zinc-900/40 rounded-2xl p-4 border border-rose-100 dark:border-zinc-800 flex flex-col min-h-[500px]">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-rose-200/60 dark:border-zinc-800">
                    <h3 class="font-serif font-bold text-zinc-800 dark:text-zinc-200 flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-zinc-400 inline-block"></span>
                        <span>A Fazer</span>
                    </h3>
                    <span id="countTodo" class="text-xs bg-white dark:bg-zinc-800 px-2.5 py-1 rounded-full font-bold text-zinc-600 dark:text-zinc-300 shadow-sm">0</span>
                </div>
                <div id="colTodo" class="space-y-3 flex-grow" ondragover="allowDrop(event)" ondrop="dropTask(event, 'todo')">
                    <!-- Cards injetados via JS -->
                </div>
            </div>

            <!-- Coluna: Em Andamento -->
            <div class="bg-rose-50/40 dark:bg-zinc-900/40 rounded-2xl p-4 border border-rose-100 dark:border-zinc-800 flex flex-col min-h-[500px]">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-rose-200/60 dark:border-zinc-800">
                    <h3 class="font-serif font-bold text-zinc-800 dark:text-zinc-200 flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
                        <span>Em Andamento</span>
                    </h3>
                    <span id="countProgress" class="text-xs bg-white dark:bg-zinc-800 px-2.5 py-1 rounded-full font-bold text-amber-600 dark:text-amber-400 shadow-sm">0</span>
                </div>
                <div id="colProgress" class="space-y-3 flex-grow" ondragover="allowDrop(event)" ondrop="dropTask(event, 'progress')">
                    <!-- Cards injetados via JS -->
                </div>
            </div>

            <!-- Coluna: Concluído -->
            <div class="bg-rose-50/40 dark:bg-zinc-900/40 rounded-2xl p-4 border border-rose-100 dark:border-zinc-800 flex flex-col min-h-[500px]">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-rose-200/60 dark:border-zinc-800">
                    <h3 class="font-serif font-bold text-zinc-800 dark:text-zinc-200 flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                        <span>Concluído</span>
                    </h3>
                    <span id="countDone" class="text-xs bg-white dark:bg-zinc-800 px-2.5 py-1 rounded-full font-bold text-emerald-600 dark:text-emerald-400 shadow-sm">0</span>
                </div>
                <div id="colDone" class="space-y-3 flex-grow" ondragover="allowDrop(event)" ondrop="dropTask(event, 'done')">
                    <!-- Cards injetados via JS -->
                </div>
            </div>

        </section>
    </main>

    <!-- Rodapé -->
    <footer class="mt-auto border-t border-rose-200/60 dark:border-zinc-800 bg-white/50 dark:bg-zinc-900/50 py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-zinc-500 dark:text-zinc-400">
            <p>&copy; 2026 Maison Élise - Atelier & Alta Costura. Organização Dinâmica de Tarefas.</p>
        </div>
    </footer>

    <!-- Modal de Tarefa -->
    <div id="taskModal" class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-950/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-zinc-900 rounded-3xl max-w-md w-full mx-4 shadow-2xl border border-rose-100 dark:border-zinc-800 transform scale-95 transition-transform duration-300 overflow-hidden" id="modalContainer">
            <div class="px-6 py-5 bg-rose-50/80 dark:bg-zinc-800/80 border-b border-rose-100 dark:border-zinc-700 flex items-center justify-between">
                <h3 id="modalTitle" class="text-xl font-serif font-bold text-rose-700 dark:text-rose-300">Nova Tarefa do Atelier</h3>
                <button onclick="closeTaskModal()" class="w-8 h-8 rounded-full bg-white dark:bg-zinc-700 text-zinc-500 dark:text-zinc-300 flex items-center justify-center hover:bg-rose-100 dark:hover:bg-zinc-600 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="taskForm" onsubmit="saveTask(event)" class="p-6 space-y-4">
                <input type="hidden" id="taskId">
                
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-600 dark:text-zinc-400 mb-1">Título da Tarefa</label>
                    <input type="text" id="taskTitle" required placeholder="Ex: Prototipagem do Vestido de Noiva" class="w-full px-4 py-2.5 bg-rose-50/50 dark:bg-zinc-800/50 border border-rose-200 dark:border-zinc-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-400 dark:text-white">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-600 dark:text-zinc-400 mb-1">Descrição Detalhada</label>
                    <textarea id="taskDesc" rows="3" placeholder="Detalhes dos materiais ou especificações..." class="w-full px-4 py-2.5 bg-rose-50/50 dark:bg-zinc-800/50 border border-rose-200 dark:border-zinc-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-400 dark:text-white resize-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-600 dark:text-zinc-400 mb-1">Prioridade</label>
                        <select id="taskPriority" required class="w-full px-3 py-2.5 bg-rose-50/50 dark:bg-zinc-800/50 border border-rose-200 dark:border-zinc-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-400 dark:text-white">
                            <option value="Baixa">Baixa</option>
                            <option value="Média">Média</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-600 dark:text-zinc-400 mb-1">Data Limite</label>
                        <input type="date" id="taskDate" required class="w-full px-3 py-2.5 bg-rose-50/50 dark:bg-zinc-800/50 border border-rose-200 dark:border-zinc-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-400 dark:text-white">
                    </div>
                </div>

                <div class="pt-4 flex items-center justify-end space-x-3">
                    <button type="button" onclick="closeTaskModal()" class="px-5 py-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 text-zinc-700 dark:text-zinc-300 font-medium text-sm hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" class="px-6 py-2.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-medium text-sm shadow-md shadow-rose-500/20 transition-all">
                        Salvar Tarefa
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 bg-zinc-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 border border-zinc-800">
        <div id="toastIcon" class="text-rose-400 text-lg"></div>
        <span id="toastMessage" class="text-sm font-medium"></span>
    </div>

    <!-- Arquivo JS Externo -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
