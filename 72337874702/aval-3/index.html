<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Élise - Atelier & Gestão Master PRO</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Pro Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <!-- Folha de Estilos Exclusiva e Complexa -->
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body class="atelier-body min-h-screen flex flex-col relative selection:bg-pink-200 selection:text-blue-900">

    <!-- Canvas de Partículas Dinâmicas (Background Vivo) -->
    <canvas id="particleCanvas" class="bg-particles"></canvas>

    <!-- Header Master com Efeito Glassmorphism Dinâmico -->
    <header class="sticky top-0 z-40 atelier-header backdrop-blur-xl border-b border-pink-100/80 shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="atelier-brand-icon w-12 h-12 rounded-2xl bg-gradient-to-br from-pink-50 to-pink-100 flex items-center justify-center border border-pink-200 shadow-sm">
                    <i class="fa-solid fa-gem text-pink-500 text-xl animate-pulse"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-serif font-bold tracking-wide text-slate-900 flex items-center gap-2">
                        Maison Élise <span class="text-[10px] font-mono px-2 py-0.5 rounded-md bg-pink-100 text-pink-600 border border-pink-200 shadow-xs">PRO v4.0</span>
                    </h1>
                    <p class="text-[11px] uppercase tracking-widest text-slate-400 font-bold font-mono">Ateliê de Alta-Costura & Orçamentos Inteligentes</p>
                </div>
            </div>

            <!-- Controles do Header -->
            <div class="flex items-center space-x-3">
                <button id="btnLogs" class="atelier-btn-ghost px-4 py-2.5 rounded-xl bg-white hover:bg-slate-50 text-slate-600 font-bold text-xs flex items-center space-x-2 border border-slate-200 shadow-xs transition-all">
                    <i class="fa-solid fa-terminal text-blue-600"></i>
                    <span class="hidden md:inline font-mono">Audit Logs (<span id="logCount">0</span>)</span>
                </button>

                <button id="btnNewTask" class="atelier-btn-primary inline-flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm transition-all shadow-md shadow-blue-500/20 active:scale-95">
                    <i class="fa-solid fa-plus-circle"></i>
                    <span>Nova Demanda</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal Dinâmico -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 relative z-10">

        <!-- Indicadores KPI Complexos & Financeiros -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div class="atelier-kpi-card bg-white p-5 rounded-2xl border border-slate-200 shadow-xs relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-24 h-24 bg-pink-50 rounded-full blur-xl group-hover:scale-150 transition-transform"></div>
                <p class="text-xs font-mono uppercase tracking-wider text-slate-400 font-bold relative z-10">Total de Peças</p>
                <h3 id="kpiTotal" class="text-3xl font-bold font-mono text-slate-900 mt-1 relative z-10">0</h3>
            </div>
            <div class="atelier-kpi-card bg-white p-5 rounded-2xl border border-slate-200 shadow-xs relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-24 h-24 bg-amber-50 rounded-full blur-xl group-hover:scale-150 transition-transform"></div>
                <p class="text-xs font-mono uppercase tracking-wider text-amber-600 font-bold relative z-10">Em Andamento</p>
                <h3 id="kpiProgress" class="text-3xl font-bold font-mono text-amber-600 mt-1 relative z-10">0</h3>
            </div>
            <div class="atelier-kpi-card bg-white p-5 rounded-2xl border border-slate-200 shadow-xs relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-24 h-24 bg-emerald-50 rounded-full blur-xl group-hover:scale-150 transition-transform"></div>
                <p class="text-xs font-mono uppercase tracking-wider text-emerald-600 font-bold relative z-10">Concluídas</p>
                <h3 id="kpiCompleted" class="text-3xl font-bold font-mono text-emerald-600 mt-1 relative z-10">0</h3>
            </div>
            <div class="atelier-kpi-card bg-white p-5 rounded-2xl border border-slate-200 shadow-xs relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-24 h-24 bg-pink-100/60 rounded-full blur-xl group-hover:scale-150 transition-transform"></div>
                <p class="text-xs font-mono uppercase tracking-wider text-pink-600 font-bold relative z-10">Alta Urgência</p>
                <h3 id="kpiUrgent" class="text-3xl font-bold font-mono text-pink-600 mt-1 relative z-10">0</h3>
            </div>
            <div class="atelier-kpi-card bg-white p-5 rounded-2xl border border-slate-200 shadow-xs relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-24 h-24 bg-blue-50 rounded-full blur-xl group-hover:scale-150 transition-transform"></div>
                <p class="text-xs font-mono uppercase tracking-wider text-blue-600 font-bold relative z-10">Orçamento Total</p>
                <h3 id="kpiBudget" class="text-2xl font-bold font-mono text-blue-600 mt-1 relative z-10">R$ 0,00</h3>
            </div>
        </section>

        <!-- Barra de Ferramentas / Filtros Avançados -->
        <section class="bg-white/90 backdrop-blur-md p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Pesquisar por peça, ID ou categoria..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all">
            </div>

            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <select id="categoryFilter" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all">
                    <option value="">Todas as Categorias</option>
                    <option value="Vestido de Noiva">Vestido de Noiva</option>
                    <option value="Alta-Costura">Alta-Costura</option>
                    <option value="Bordado a Mão">Bordado a Mão</option>
                    <option value="Noite & Gala">Noite & Gala</option>
                    <option value="Acessório">Acessório</option>
                </select>

                <select id="priorityFilter" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all">
                    <option value="">Todas Prioridades</option>
                    <option value="Baixa">Baixa</option>
                    <option value="Média">Média</option>
                    <option value="Alta">Alta (Urgente)</option>
                </select>

                <select id="sortFilter" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all">
                    <option value="date">Ordenar por Data</option>
                    <option value="budget">Ordenar por Maior Orçamento</option>
                    <option value="priority">Ordenar por Urgência</option>
                </select>
            </div>
        </section>

        <!-- Quadro Kanban Dinâmico (Drag & Drop Avançado) -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
            
            <!-- Coluna 1: A Fazer -->
            <div class="kanban-column bg-white/80 backdrop-blur-md rounded-2xl p-4 border border-slate-200 flex flex-col min-h-[580px] shadow-xs">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
                    <h3 class="font-serif font-bold text-slate-800 flex items-center space-x-2 text-base">
                        <span class="w-3 h-3 rounded-full bg-pink-400 inline-block shadow-xs animate-pulse"></span>
                        <span>A Fazer (Backlog)</span>
                    </h3>
                    <span id="countTodo" class="text-xs bg-slate-100 px-3 py-1 rounded-full font-mono font-bold text-slate-600 border border-slate-200">0</span>
                </div>
                <div id="colTodo" class="space-y-3.5 flex-grow transition-all" ondragover="allowDrop(event)" ondrop="dropTask(event, 'todo')"></div>
            </div>

            <!-- Coluna 2: Em Andamento -->
            <div class="kanban-column bg-white/80 backdrop-blur-md rounded-2xl p-4 border border-slate-200 flex flex-col min-h-[580px] shadow-xs">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
                    <h3 class="font-serif font-bold text-slate-800 flex items-center space-x-2 text-base">
                        <span class="w-3 h-3 rounded-full bg-amber-400 inline-block shadow-xs animate-pulse"></span>
                        <span>Em Andamento</span>
                    </h3>
                    <span id="countProgress" class="text-xs bg-amber-50 px-3 py-1 rounded-full font-mono font-bold text-amber-700 border border-amber-200">0</span>
                </div>
                <div id="colProgress" class="space-y-3.5 flex-grow transition-all" ondragover="allowDrop(event)" ondrop="dropTask(event, 'progress')"></div>
            </div>

            <!-- Coluna 3: Concluído -->
            <div class="kanban-column bg-white/80 backdrop-blur-md rounded-2xl p-4 border border-slate-200 flex flex-col min-h-[580px] shadow-xs">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
                    <h3 class="font-serif font-bold text-slate-800 flex items-center space-x-2 text-base">
                        <span class="w-3 h-3 rounded-full bg-emerald-400 inline-block shadow-xs"></span>
                        <span>Concluído</span>
                    </h3>
                    <span id="countDone" class="text-xs bg-emerald-50 px-3 py-1 rounded-full font-mono font-bold text-emerald-700 border border-emerald-200">0</span>
                </div>
                <div id="colDone" class="space-y-3.5 flex-grow transition-all" ondragover="allowDrop(event)" ondrop="dropTask(event, 'done')"></div>
            </div>

        </section>
    </main>

    <!-- Modal de Adição/Edição de Tarefas Complexo -->
    <div id="taskModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-lg w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-300 overflow-hidden" id="modalContainer">
            <div class="px-6 py-5 bg-gradient-to-r from-pink-50/80 to-blue-50/50 border-b border-pink-100 flex items-center justify-between">
                <h3 id="modalTitle" class="text-xl font-serif font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib text-pink-500"></i> Nova Demanda de Peça
                </h3>
                <button id="btnCloseModal" class="w-8 h-8 rounded-full bg-white text-slate-500 flex items-center justify-center hover:bg-blue-600 hover:text-white font-bold transition-colors shadow-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="taskForm" class="p-6 space-y-4">
                <input type="hidden" id="taskId">
                
                <div>
                    <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 mb-1 font-bold">Título da Peça</label>
                    <input type="text" id="taskTitle" required placeholder="Ex: Vestido de Noiva Coleção Inverno" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>

                <div>
                    <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 mb-1 font-bold">Especificações Técnicas e Materiais</label>
                    <textarea id="taskDesc" rows="3" placeholder="Metragem de renda, tipo de pedraria, medidas do busto..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 resize-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 mb-1 font-bold">Categoria da Peça</label>
                        <select id="taskCategory" required class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600">
                            <option value="Vestido de Noiva">Vestido de Noiva</option>
                            <option value="Alta-Costura">Alta-Costura</option>
                            <option value="Bordado a Mão">Bordado a Mão</option>
                            <option value="Noite & Gala">Noite & Gala</option>
                            <option value="Acessório">Acessório</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 mb-1 font-bold">Prioridade</label>
                        <select id="taskPriority" required class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600">
                            <option value="Baixa">Baixa</option>
                            <option value="Média">Média</option>
                            <option value="Alta">Alta (Urgente)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 mb-1 font-bold">Orçamento Estimado (R$)</label>
                        <input type="number" step="0.01" id="taskBudget" required placeholder="1500.00" class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div>
                        <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 mb-1 font-bold">Prazo de Entrega</label>
                        <input type="date" id="taskDate" required class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                </div>

                <div class="pt-4 flex items-center justify-end space-x-3 border-t border-slate-100">
                    <button type="button" id="btnCancelModal" class="px-5 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold text-sm hover:bg-slate-100 transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" class="px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md shadow-blue-500/20 transition-all">
                        Salvar Demanda
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Logs de Auditoria Complexo -->
    <div id="logsModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-2xl w-full mx-4 shadow-2xl overflow-hidden">
            <div class="px-6 py-5 bg-gradient-to-r from-pink-50 to-blue-50 border-b border-pink-100 flex items-center justify-between">
                <h3 class="text-xl font-serif font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-terminal text-blue-600"></i> Auditoria de Ações do DOM
                </h3>
                <button onclick="closeLogsModal()" class="w-8 h-8 rounded-full bg-white text-slate-500 flex items-center justify-center hover:bg-blue-600 hover:text-white font-bold shadow-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6 max-h-96 overflow-y-auto space-y-2 font-mono text-xs" id="logsContainer"></div>
        </div>
    </div>

    <!-- Toast Notification Flutuante -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-28 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 border border-slate-800">
        <div id="toastIcon" class="text-pink-400 text-lg"></div>
        <span id="toastMessage" class="text-sm font-bold font-mono"></span>
    </div>

    <!-- Motor JavaScript Modular -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
