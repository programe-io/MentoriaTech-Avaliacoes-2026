<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatame Match - Jogo de Judô</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Tatame Match</h1>
        <p>Mostre suas técnicas e conquiste o Ippon!</p>
    </header>

    <main class="container-jogo">
        <h2>Combate no Tatame</h2>
        <div id="status-jogo">Vez do Judoca: 🥋 Atleta Vermelho (X)</div>

        <div class="tabuleiro">
            <div class="celula" data-index="0"></div>
            <div class="celula" data-index="1"></div>
            <div class="celula" data-index="2"></div>
            <div class="celula" data-index="3"></div>
            <div class="celula" data-index="4"></div>
            <div class="celula" data-index="5"></div>
            <div class="celula" data-index="6"></div>
            <div class="celula" data-index="7"></div>
            <div class="celula" data-index="8"></div>
        </div>

        <button id="btn-reiniciar">Reiniciar Luta</button>
    </main>

    <footer>
        <p>🥋 Desenvolvido com espírito marcial</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
