<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Roupas Fashion</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Fashion Store</h1>
        <p>Moda para todos os estilos</p>
    </header>

    <section class="produtos">
        <div class="card">
            <img src="https://via.placeholder.com/250x300" alt="Camiseta">
            <h2>Camiseta Premium</h2>
            <p>R$ 79,90</p>
            <button onclick="comprar('Camiseta Premium')">Comprar</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/250x300" alt="Calça Jeans">
            <h2>Calça Jeans</h2>
            <p>R$ 129,90</p>
            <button onclick="comprar('Calça Jeans')">Comprar</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/250x300" alt="Jaqueta">
            <h2>Jaqueta Moderna</h2>
            <p>R$ 199,90</p>
            <button onclick="comprar('Jaqueta Moderna')">Comprar</button>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Fashion Store - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
