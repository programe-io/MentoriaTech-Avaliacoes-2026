<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Estoque</title>

    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header class="topo">
        <div>
            <span class="subtitulo">SISTEMA DE ESTOQUE</span>
            <h1>Meus Produtos</h1>
        </div>

        <div class="contador">
            <span id="totalProdutos">0</span>
            <small>Produtos</small>
        </div>
    </header>


    <main class="principal">

        <!-- FORMULÁRIO -->
        <aside class="painel">

            <h2>Novo produto</h2>

            <p class="descricao-painel">
                Preencha os dados abaixo para adicionar um produto.
            </p>

            <form id="formProduto">

                <div class="grupo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Nome do produto"
                        required
                    >
                </div>

                <div class="linha">

                    <div class="grupo">
                        <label for="quantidade">Quantidade</label>
                        <input
                            type="number"
                            id="quantidade"
                            min="1"
                            placeholder="0"
                            required
                        >
                    </div>

                    <div class="grupo">
                        <label for="valor">Valor</label>
                        <input
                            type="number"
                            id="valor"
                            min="0"
                            step="0.01"
                            placeholder="0,00"
                            required
                        >
                    </div>

                </div>

                <button class="btn-principal" type="submit">
                    + Adicionar produto
                </button>

            </form>


            <div class="separador"></div>


            <h2>Atualizar estoque</h2>

            <div class="grupo">
                <label for="codigo">Código</label>
                <input
                    type="number"
                    id="codigo"
                    min="1"
                    placeholder="Código do produto"
                >
            </div>

            <div class="grupo">
                <label for="novoValor">Novo valor</label>
                <input
                    type="number"
                    id="novoValor"
                    min="0"
                    step="0.01"
                    placeholder="R$ 0,00"
                >
            </div>

            <button class="btn-secundario" id="btnValor">
                Atualizar valor
            </button>


            <div class="grupo quantidade-update">
                <label for="novaQuantidade">
                    Adicionar ao estoque
                </label>

                <input
                    type="number"
                    id="novaQuantidade"
                    min="1"
                    placeholder="Quantidade"
                >
            </div>

            <button class="btn-secundario" id="btnQuantidade">
                Atualizar quantidade
            </button>

        </aside>


        <!-- PRODUTOS -->
        <section class="produtos">

            <div class="titulo-produtos">

                <div>
                    <span class="subtitulo">INVENTÁRIO</span>
                    <h2>Produtos cadastrados</h2>
                </div>

                <span class="status">
                    ● Sistema ativo
                </span>

            </div>


            <div
                id="listaProdutos"
                class="grid-produtos"
            >
            </div>

            <div
                id="semProdutos"
                class="sem-produtos"
            >
                <div class="icone-vazio">📦</div>

                <h3>Nenhum produto cadastrado</h3>

                <p>
                    Adicione seu primeiro produto usando
                    o formulário ao lado.
                </p>
            </div>

        </section>

    </main>


    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
