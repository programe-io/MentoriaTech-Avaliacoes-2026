
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Controle de IMC</h1>
        <p>Preencha os dados do paciente</p>

        <form action="CalcularIMC" method="post">

            <label>Nome do paciente:</label>
            <input type="text" name="nome" required>

            <label>Peso (kg):</label>
            <input type="number" name="peso" step="0.01" min="1" required>

            <label>Altura (m):</label>
            <input type="number" name="altura" step="0.01" min="0.1" required>

            <button type="submit">Calcular IMC</button>

        </form>
    </div>

<script src="script.js"></script></body>
</html>
