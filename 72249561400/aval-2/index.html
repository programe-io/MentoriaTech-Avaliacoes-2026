
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <header>
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas atividades de maneira simples e prática.</p>
        </header>

        <section class="resumo">
            <div class="card">
                <h3>Total</h3>
                <span id="totalTarefas">0</span>
            </div>

            <div class="card">
                <h3>Em andamento</h3>
                <span id="tarefasPendentes">0</span>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <span id="tarefasConcluidas">0</span>
            </div>
        </section>

        <section class="formulario">
            <h2>Cadastrar nova tarefa</h2>

            <form id="formTarefa">

                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título da tarefa"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade" required>
                        <option value="">Selecione</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit">Cadastrar tarefa</button>

            </form>
        </section>

        <section class="busca">
            <h2>Buscar tarefa</h2>

            <div class="busca-conteudo">
                <input
                    type="number"
                    id="codigoBusca"
                    placeholder="Digite o código da tarefa"
                    min="1"
                >

                <button id="btnBuscar">Buscar</button>
                <button id="btnMostrarTodas" class="secundario">
                    Mostrar todas
                </button>
            </div>

            <div id="resultadoBusca"></div>
        </section>

        <section class="lista">
            <h2>Minhas tarefas</h2>

            <div id="listaTarefas">
                <p class="vazio">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>

        <div id="mensagem" class="mensagem"></div>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
