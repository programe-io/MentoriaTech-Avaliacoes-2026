
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header class="cabecalho">
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas atividades e acompanhe seu progresso.</p>
        </header>

        <section class="resumo">
            <div class="card">
                <span>Total de tarefas</span>
                <strong id="total">0</strong>
            </div>

            <div class="card">
                <span>Em andamento</span>
                <strong id="pendentes">0</strong>
            </div>

            <div class="card">
                <span>Concluídas</span>
                <strong id="concluidas">0</strong>
            </div>
        </section>

        <section class="painel">
            <h2>Cadastrar nova tarefa</h2>

            <form id="formTarefa">

                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex: Estudar JavaScript"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade" required>
                        <option value="">Selecione a prioridade</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit" class="btn-principal">
                    + Cadastrar tarefa
                </button>

            </form>
        </section>

        <section class="painel">
            <h2>Buscar tarefa</h2>

            <div class="busca">
                <input
                    type="number"
                    id="codigoBusca"
                    placeholder="Digite o código da tarefa"
                    min="1"
                >

                <button id="btnBuscar">Buscar</button>
                <button id="btnTodas" class="btn-secundario">
                    Todas
                </button>
            </div>

            <div id="resultadoBusca"></div>
        </section>

        <section class="painel">
            <div class="titulo-lista">
                <h2>Minhas tarefas</h2>
                <span id="quantidade">0 tarefas</span>
            </div>

            <div id="listaTarefas">
                <p class="vazio">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>

        <footer>
            <p>Projeto desenvolvido com HTML, CSS e JavaScript.</p>
        </footer>

    </main>

    <div id="mensagem" class="mensagem"></div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
