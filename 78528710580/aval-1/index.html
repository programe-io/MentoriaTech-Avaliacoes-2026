<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>🎯 Clique no Alvo</h1>

        <div class="info">
            <span>Pontos: <b id="score">0</b></span>
            <span>Tempo: <b id="time">30</b>s</span>
        </div>

        <div id="area">
            <button id="target"></button>
        </div>

        <button id="start">Começar Jogo</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
