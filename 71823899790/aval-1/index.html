<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Entrega - Avaliações</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Área de Entrega - Avaliações</h1>

        <p>
            Aqui você envia seus códigos para correção. Revise antes de publicar e
            garanta que sua avaliação esteja completa.
        </p>

        <p>
            Finalize seu trabalho, publique seu código e compartilhe sua solução
            com o professor.
        </p>
    </header>


    <main>

        <section class="area-codigos">

            <!-- HTML -->
            <div class="editor-container">

                <div class="titulo-editor">
                    <h2>HTML</h2>

                    <button>Maximizar</button>
                </div>

                <div class="editor">
                    <span>1</span>
                    <textarea></textarea>
                </div>

            </div>


            <!-- CSS -->
            <div class="editor-container">

                <div class="titulo-editor">
                    <h2>CSS</h2>

                    <button>Maximizar</button>
                </div>

                <div class="editor">
                    <span>1</span>
                    <textarea></textarea>
                </div>

            </div>

        </section>


        <!-- PRÉ-VISUALIZAÇÃO -->
        <section class="preview-container">

            <h2>Pré-visualização do Código</h2>

            <div class="preview"></div>

        </section>

    </main>

</body>
