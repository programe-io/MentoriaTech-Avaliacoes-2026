
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>MiniFeed</h1>
        <div class="perfil">👤 Meu Perfil</div>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#">Explorar</a>
        <a href="#">Mensagens</a>
        <a href="#">Perfil</a>
    </nav>

    <main>

        <section class="nova-publicacao">
            <h2>O que você está pensando?</h2>

            <textarea
                id="textoPost"
                placeholder="Compartilhe algo com seus amigos..."
            ></textarea>

            <input
                type="text"
                id="imagemPost"
                placeholder="URL da imagem (opcional)"
            >

            <button onclick="publicar()">
                Publicar
            </button>
        </section>

        <section class="feed" id="feed">

            <article class="post">
                <div class="post-header">
                    <div class="avatar">👩</div>
                    <div>
                        <strong>Ana Silva</strong>
                        <small>Há 10 minutos</small>
                    </div>
                </div>

                <p>
                    Aproveitando um lindo dia para apreciar
                    a natureza! 🌻
                </p>

                <img
                    src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900"
                    alt="Paisagem natural"
                    class="post-image"
                >

                <div class="acoes">
                    <button onclick="curtir(this)">❤️ Curtir</button>
                    <button onclick="comentar(this)">💬 Comentar</button>
                    <button onclick="compartilhar()">🔗 Compartilhar</button>
                </div>
            </article>

            <article class="post">
                <div class="post-header">
                    <div class="avatar">👨</div>
                    <div>
                        <strong>Pedro Santos</strong>
                        <small>Há 30 minutos</small>
                    </div>
                </div>

                <p>
                    Nunca deixe de aprender coisas novas.
                    Cada dia é uma oportunidade! 🚀
                </p>

                <div class="acoes">
                    <button onclick="curtir(this)">❤️ Curtir</button>
                    <button onclick="comentar(this)">💬 Comentar</button>
                    <button onclick="compartilhar()">🔗 Compartilhar</button>
                </div>
            </article>

        </section>

    </main>

    <footer>
        <p>© 2026 MiniFeed - Elyssa.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
