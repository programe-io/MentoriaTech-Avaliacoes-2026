<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <title>Jogo de Comunicação</title>
      <style>
          body {
                font-family: Arial;
                      background: #1e1e2f;
                            color: white;
                                  text-align: center;
                                      }

                                          #chat {
                                                width: 80%;
                                                      height: 300px;
                                                            margin: 20px auto;
                                                                  background: #2c2c3c;
                                                                        border-radius: 10px;
                                                                              overflow-y: auto;
                                                                                    padding: 10px;
                                                                                          text-align: left;
                                                                                              }

                                                                                                  .msg {
                                                                                                        margin: 5px 0;
                                                                                                            }

                                                                                                                input {
                                                                                                                      width: 60%;
                                                                                                                            padding: 10px;
                                                                                                                                  border-radius: 5px;
                                                                                                                                        border: none;
                                                                                                                                            }

                                                                                                                                                button {
                                                                                                                                                      padding: 10px;
                                                                                                                                                            margin: 5px;
                                                                                                                                                                  border: none;
                                                                                                                                                                        border-radius: 5px;
                                                                                                                                                                              background: #4CAF50;
                                                                                                                                                                                    color: white;
                                                                                                                                                                                          cursor: pointer;
                                                                                                                                                                                              }

                                                                                                                                                                                                  button:hover {
                                                                                                                                                                                                        background: #45a049;
                                                                                                                                                                                                            }
                                                                                                                                                                                                              </style>
                                                                                                                                                                                                              <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                                                                                                                                                                                                              <body>

                                                                                                                                                                                                              <h1>🎮 Jogo de Comunicação</h1>

                                                                                                                                                                                                              <div id="chat"></div>

                                                                                                                                                                                                              <input type="text" id="mensagem" placeholder="Digite sua mensagem...">
                                                                                                                                                                                                              <button onclick="enviarMensagem()">Enviar</button>
                                                                                                                                                                                                              <button onclick="iniciarVoz()">🎤 Falar</button>

                                                                                                                                                                                                              <script>
                                                                                                                                                                                                                const chat = document.getElementById("chat");

                                                                                                                                                                                                                  function adicionarMensagem(texto, tipo = "Jogador") {
                                                                                                                                                                                                                      const msg = document.createElement("div");
                                                                                                                                                                                                                          msg.className = "msg";
                                                                                                                                                                                                                              msg.innerHTML = "<strong>" + tipo + ":</strong> " + texto;
                                                                                                                                                                                                                                  chat.appendChild(msg);
                                                                                                                                                                                                                                      chat.scrollTop = chat.scrollHeight;
                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                          function enviarMensagem() {
                                                                                                                                                                                                                                              const input = document.getElementById("mensagem");
                                                                                                                                                                                                                                                  const texto = input.value;

                                                                                                                                                                                                                                                      if (texto.trim() !== "") {
                                                                                                                                                                                                                                                            adicionarMensagem(texto);
                                                                                                                                                                                                                                                                  input.value = "";
                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                          // Reconhecimento de voz
                                                                                                                                                                                                                                                                            function iniciarVoz() {
                                                                                                                                                                                                                                                                                if (!('webkitSpeechRecognition' in window)) {
                                                                                                                                                                                                                                                                                      alert("Seu navegador não suporta reconhecimento de voz.");
                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                    const recognition = new webkitSpeechRecognition();
                                                                                                                                                                                                                                                                                                        recognition.lang = "pt-BR";
                                                                                                                                                                                                                                                                                                            recognition.start();

                                                                                                                                                                                                                                                                                                                recognition.onresult = function(event) {
                                                                                                                                                                                                                                                                                                                      const texto = event.results[0][0].transcript;
                                                                                                                                                                                                                                                                                                                            adicionarMensagem(texto, "🎤 Voz");
                                                                                                                                                                                                                                                                                                                                };

                                                                                                                                                                                                                                                                                                                                    recognition.onerror = function() {
                                                                                                                                                                                                                                                                                                                                          alert("Erro ao usar o microfone.");
                                                                                                                                                                                                                                                                                                                                              };
                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                </html>
