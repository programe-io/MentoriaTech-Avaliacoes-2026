
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Social Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topo">
        <h1>SocialFeed</h1>
        <span>🌐 Minha rede social</span>
    </header>

    <main class="container">

        <section class="criar-post">
            <h2>Criar publicação</h2>

            <input type="text" id="nome"
                placeholder="Seu nome">

            <input type="text" id="fotoPerfil"
                placeholder="Link da foto de perfil">

            <textarea id="texto"
                placeholder="O que você está pensando?"></textarea>

            <input type="text" id="imagem"
                placeholder="Link da imagem da publicação">

            <button onclick="criarPost()">
                Publicar
            </button>
        </section>

        <section id="feed">

            <article class="post">
                <div class="usuario">
                    <img src="https://i.pravatar.cc/100?img=12">
                    <div>
                        <strong>Ana Silva</strong>
                        <small>Há 10 minutos</small>
                    </div>
                </div>

                <p>Um dia incrível para aproveitar a vida! ☀️</p>

                <img class="foto-post"
                    src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800">

                <div class="acoes">
                    <button onclick="curtir(this)">
                        ❤️ Curtir <span>12</span>
                    </button>
                </div>

                <div class="comentarios">
                    <input type="text"
                        placeholder="Escreva um comentário...">
                    <button onclick="comentar(this)">Enviar</button>
                    <div class="lista-comentarios"></div>
                </div>
            </article>

            <article class="post">
                <div class="usuario">
                    <img src="https://i.pravatar.cc/100?img=32">
                    <div>
                        <strong>Pedro Santos</strong>
                        <small>Há 30 minutos</small>
                    </div>
                </div>

                <p>Adoro conhecer lugares novos! 🌴</p>

                <img class="foto-post"
                    src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800">

                <div class="acoes">
                    <button onclick="curtir(this)">
                        ❤️ Curtir <span>25</span>
                    </button>
                </div>

                <div class="comentarios">
                    <input type="text"
                        placeholder="Escreva um comentário...">
                    <button onclick="comentar(this)">Enviar</button>
                    <div class="lista-comentarios"></div>
                </div>
            </article>

        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
