<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro e Cálculo de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <h1>Cadastro de Pessoas</h1>
        <p>Cadastre pessoas e acompanhe seus índices de massa corporal.</p>

        <section class="card">
            <h2>Adicionar Pessoa</h2>

            <form id="formPessoa">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite o nome completo" required>

                <label for="idade">Idade</label>
                <input type="number" id="idade" placeholder="Digite a idade" min="1" required>

                <label for="altura">Altura (m)</label>
                <input type="number" id="altura" placeholder="Ex: 1.70" step="0.01" min="0.1" required>

                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" placeholder="Ex: 65" step="0.1" min="0.1" required>

                <div class="botoes">
                    <button type="submit">Cadastrar Pessoa</button>
                    <button type="reset" class="limpar">Limpar</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Pessoas Cadastradas</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaPessoas">
                        <tr id="mensagemVazia">
                            <td colspan="7">Nenhuma pessoa cadastrada ainda</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <footer>
            Sistema de Cadastro e Cálculo de IMC
        </footer>
    </main>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>$0
