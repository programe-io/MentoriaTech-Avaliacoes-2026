<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Pessoas - IMC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="cabecalho">
            <h1>Cadastro de Pessoas</h1>
            <p>Cadastre pessoas e acompanhe seus índices de massa corporal.</p>
        </header>

        <section class="card">

            <h2>Adicionar Pessoa</h2>

            <form id="form-pessoa">

                <div class="grupo-campos">

                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite o nome"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="idade">Idade</label>
                        <input
                            type="number"
                            id="idade"
                            placeholder="Ex: 25"
                            min="1"
                            max="120"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="altura">Altura (m)</label>
                        <input
                            type="number"
                            id="altura"
                            placeholder="Ex: 1.75"
                            min="0.5"
                            max="2.5"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="peso">Peso (kg)</label>
                        <input
                            type="number"
                            id="peso"
                            placeholder="Ex: 70"
                            min="2"
                            max="500"
                            step="0.1"
                            required
                        >
                    </div>

                </div>

                <p id="erro" class="erro" hidden></p>

                <div class="botoes">
                    <button type="submit" class="botao-adicionar">
                        Cadastrar Pessoa
                    </button>

                    <button type="reset" class="botao-limpar">
                        Limpar
                    </button>
                </div>

            </form>

        </section>

        <section class="card">

            <h2>Pessoas Cadastradas</h2>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-pessoas">

                        <tr>
                            <td colspan="7" class="vazio">
                                Nenhuma pessoa cadastrada ainda
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

        <footer>
            <p>Sistema de Cadastro e Cálculo de IMC</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>$0
  <script src="script.js"></script>
  
</body>
</html>
