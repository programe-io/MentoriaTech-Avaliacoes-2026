<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <h1>Calculadora de IMC</h1>

        <section class="card">
            <h2>Nova pessoa</h2>

            <form id="formulario">

                <div class="campo nome">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Nome" required>
                </div>

                <div class="campo">
                    <label for="idade">Idade (anos)</label>
                    <input type="number" id="idade" placeholder="Ex: 30" required>
                </div>

                <div class="campo">
                    <label for="altura">Altura (m)</label>
                    <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75" required>
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" step="0.1" placeholder="Ex: 70" required>
                </div>

                <button type="submit">Salvar</button>

            </form>
        </section>

        <section class="card">
            <h2>Pessoas cadastradas</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaPessoas">
                        <tr>
                            <td colspan="7" class="vazio">
                                Nenhuma pessoa cadastrada ainda.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>

    <script src="app.js"></script>

<script src="script.js"></script></body>
</html>$0
