<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <h1>Calculadora de IMC</h1>

        <section class="card">
            <h2>Nova pessoa</h2>

            <form id="formulario">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="idade">Idade (anos)</label>
                    <input type="number" id="idade" placeholder="Digite sua idade" required>
                </div>

                <div class="campo">
                    <label for="altura">Altura (cm)</label>
                    <input type="number" id="altura" placeholder="Ex: 170" required>
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" placeholder="Ex: 65" step="0.1" required>
                </div>

                <button type="submit">Salvar</button>
            </form>
        </section>

        <section class="resultado">
            <h2>IMC</h2>
            <div id="resultado">
                Preencha os dados para calcular seu IMC.
            </div>
        </section>

        <section class="card">
            <h2>Pessoas cadastradas</h2>

            <div class="tabela">
                <div class="linha cabecalho">
                    <span>Nome</span>
                    <span>Idade</span>
                    <span>Peso</span>
                    <span>Altura</span>
                    <span>IMC</span>
                </div>

                <div id="listaPessoas">
                    <p class="vazio">Nenhuma pessoa cadastrada ainda.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>$0
