
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Sistema de Estoque</h1>

    <h3>Cadastrar Produto</h3>

    <input type="number" id="codigo" placeholder="Código do produto">
    <input type="text" id="descricao" placeholder="Descrição do produto">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor do produto">

    <button onclick="cadastrarProduto()">Cadastrar Produto</button>

    <hr>

    <h3>Alterar Produto</h3>

    <input type="number" id="codigoAlterar" placeholder="Código do produto">

    <input type="number" id="novoValor" placeholder="Novo valor">

    <button onclick="alterarValor()">Alterar Valor</button>

    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    <hr>

    <h3>Produtos Cadastrados</h3>

    <button onclick="listarProdutos()">Listar Produtos</button>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
            </tr>
        </thead>

        <tbody id="listaProdutos"></tbody>
    </table>

</div>

<script>

    let produtos = [];

    // CADASTRAR PRODUTO
    function cadastrarProduto() {

        let codigo = Number(document.getElementById("codigo").value);
        let descricao = document.getElementById("descricao").value;
        let quantidade = Number(document.getElementById("quantidade").value);
        let valor = Number(document.getElementById("valor").value);

        if (!codigo || !descricao || quantidade < 0 || 
            document.getElementById("quantidade").value === "" ||
            document.getElementById("valor").value === "" || valor < 0) {
            alert("Preencha todos os campos corretamente!");
            return;
        }

        let existe = produtos.find(p => p.codigo === codigo);

        if (existe) {
            alert("Esse código já está cadastrado!");
            return;
        }

        produtos.push({
            codigo: codigo,
            descricao: descricao,
            quantidade: quantidade,
            valor: valor
        });

        alert("Produto cadastrado com sucesso!");

        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";

        listarProdutos();
    }

    // LISTAR PRODUTOS
    function listarProdutos() {

        let tabela = document.getElementById("listaProdutos");

        tabela.innerHTML = "";

        produtos.forEach(produto => {

            tabela.innerHTML += `
                <tr>
                    <td>${produto.codigo}</td>
                    <td>${produto.descricao}</td>
                    <td>${produto.quantidade}</td>
                    <td>R$ ${produto.valor.toFixed(2)}</td>
                </tr>
            `;

        });
    }

    // ALTERAR VALOR
    function alterarValor() {

        let codigo = Number(document.getElementById("codigoAlterar").value);

        let produto = produtos.find(p => p.codigo === codigo);

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        let novoValor = document.getElementById("novoValor").value;

        if (novoValor === "" || Number(novoValor) < 0) {
            alert("Digite um valor válido!");
            return;
        }

        produto.valor = Number(novoValor);

        alert("Valor alterado com sucesso!");

        listarProdutos();
    }

    // ALTERAR QUANTIDADE
    function alterarQuantidade() {

        let codigo = Number(document.getElementById("codigoAlterar").value);

        let produto = produtos.find(p => p.codigo === codigo);

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        let novaQuantidade = document.getElementById("novaQuantidade").value;

        if (novaQuantidade === "" || Number(novaQuantidade) < 0) {
            alert("Digite uma quantidade válida!");
            return;
        }

        produto.quantidade = Number(novaQuantidade);

        alert("Quantidade alterada com sucesso!");

        listarProdutos();
    }

</script>

<script src="script.js"></script></body>
</html>
