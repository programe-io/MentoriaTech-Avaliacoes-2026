<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória Neon</title>

    <!-- Font Awesome para os ícones das cartas -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Jogo da Memória</h1>
        <p>Encontre todos os pares de ícones no menor número de tentativas!</p>
    </header>

    <main class="container-jogo">
        <div class="painel-info">
            <div class="info-box">
                <span class="label">Jogadas:</span>
                <span id="contador-jogadas">0</span>
            </div>
            <div class="info-box">
                <span class="label">Pares Encontrados:</span>
                <span id="contador-pares">0 / 8</span>
            </div>
        </div>

        <div id="status-jogo">Clique em uma carta para começar!</div>

        <!-- Tabuleiro do jogo (4x4 = 16 cartas) -->
        <div class="tabuleiro-memoria" id="tabuleiro"></div>

        <button id="btn-reiniciar">Novo Jogo</button>
    </main>

    <footer>
        <p>&copy; 2026 Jogo da Memória. Desenvolvido em HTML, CSS e JavaScript.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
