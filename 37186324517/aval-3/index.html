<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Show do Milhão</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="jogo-container">
        <header>
            <h1>💰 SHOW DO MILHÃO 💰</h1>
            <div class="painel-valores">
                <div class="caixa-valor">Prêmio Atual: <span id="valor-atual">R$ 0</span></div>
                <div class="caixa-valor destaque">Valendo: <span id="valor-proximo">R$ 1.000</span></div>
            </div>
        </header>

        <main id="area-jogo">
            <h2 id="pergunta">Carregando pergunta...</h2>

            <div id="caixa-opcoes" class="grid-opcoes">
                <!-- Opções de resposta geradas pelo JavaScript -->
            </div>
        </main>

        <!-- Painel de Ajudas e Ações -->
        <div class="painel-acoes">
            <div class="ajudas">
                <button id="btn-eliminar" class="btn-ajuda">❌ Eliminar 2 Erradas</button>
                <button id="btn-pular" class="btn-ajuda">⏭️ Pular Pergunta (<span id="pulos-restantes">1</span>)</button>
            </div>
            <button id="btn-parar" class="btn-parar">✋ Parar e Levar Prêmio</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
