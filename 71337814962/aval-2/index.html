<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descendentes</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>🖤 Descendentes</h1>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#personagens">Personagens</a>
        </nav>
    </header>

    <main>

        <section id="inicio" class="inicio">
            <h2>Bem-vindo a Auradon</h2>

            <p>
                Entre no mundo de Descendentes
                e conheça os personagens.
            </p>

            <button onclick="mostrarMensagem()">
                Entrar
            </button>
        </section>


        <section id="personagens">

            <h2>Personagens</h2>

            <div class="cards">

                <div class="card">
                    <div class="foto">💜</div>

                    <h3>Mal</h3>

                    <p>Filha de Malévola.</p>

                    <button onclick="escolher('Mal')">
                        Escolher
                    </button>
                </div>


                <div class="card">
                    <div class="foto">💙</div>

                    <h3>Evie</h3>

                    <p>Filha da Rainha Má.</p>

                    <button onclick="escolher('Evie')">
                        Escolher
                    </button>
                </div>


                <div class="card">
                    <div class="foto">❤️</div>

                    <h3>Jay</h3>

                    <p>Filho de Jafar.</p>

                    <button onclick="escolher('Jay')">
                        Escolher
                    </button>
                </div>


                <div class="card">
                    <div class="foto">💚</div>

                    <h3>Carlos</h3>

                    <p>Filho de Cruella.</p>

                    <button onclick="escolher('Carlos')">
                        Escolher
                    </button>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>Site Descendentes</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
