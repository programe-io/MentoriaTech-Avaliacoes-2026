  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram — Clone</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <!-- BARRA SUPERIOR -->
    <nav class="superior">
        <div class="logo">Instagram</div>
        <div class="nav-direita">
            <ion-icon class="icone-nav" name="heart-outline"></ion-icon>
            <ion-icon class="icone-nav" name="paper-plane-outline"></ion-icon>
            <div class="perfil-mini">S</div>
        </div>
    </nav>

    <div class="container">
        <!-- STORIES -->
        <div class="stories">
            <div class="lista-stories">
                <div class="story">
                    <div class="story-borda seu-story">
                        <div class="story-conteudo">👤</div>
                        <span class="maiszinho">+</span>
                    </div>
                    <div class="story-nome">Seu story</div>
                </div>
                <div class="story">
                    <div class="story-borda"><div class="story-conteudo">🌟</div></div>
                    <div class="story-nome">mariana_</div>
                </div>
                <div class="story">
                    <div class="story-borda"><div class="story-conteudo">🌸</div></div>
                    <div class="story-nome">ana.clara</div>
                </div>
                <div class="story">
                    <div class="story-borda"><div class="story-conteudo">✨</div></div>
                    <div class="story-nome">joao_victor</div>
                </div>
                <div class="story">
                    <div class="story-borda"><div class="story-conteudo">🎀</div></div>
                    <div class="story-nome">beatriz_s</div>
                </div>
                <div class="story">
                    <div class="story-borda"><div class="story-conteudo">🌻</div></div>
                    <div class="story-nome">larissa_g</div>
                </div>
            </div>
        </div>

        <!-- POSTAGEM 1 -->
        <div class="postagem">
            <div class="post-cabecalho">
                <div class="post-usuario">
                    <div class="post-foto-perfil">S</div>
                    <div>
                        <div class="post-nome">sxllsz-</div>
                        <div class="post-local">Luzilândia, Piauí</div>
                    </div>
                </div>
                <ion-icon name="ellipsis-horizontal"></ion-icon>
            </div>
            <div class="post-imagem">☀️</div>
            <div class="post-acoes">
                <div class="acoes-esq">
                    <ion-icon name="heart-outline"></ion-icon>
                    <ion-icon name="chatbubble-outline"></ion-icon>
                    <ion-icon name="paper-plane-outline"></ion-icon>
                </div>
                <ion-icon name="bookmark-outline"></ion-icon>
            </div>
            <div class="post-texto">
                <div class="curtidas">248 curtidas</div>
                <div class="legenda"><span>sxllsz-</span> ✨ Grata por mais um dia! Que a luz do sol ilumine sempre o seu caminho. ☀️🤍</div>
                <div class="ver-comentarios">Ver todos os 26 comentários</div>
                <div class="horario">Há 3 horas</div>
            </div>
        </div>

        <!-- POSTAGEM 2 -->
        <div class="postagem">
            <div class="post-cabecalho">
                <div class="post-usuario">
                    <div class="post-foto-perfil">M</div>
                    <div>
                        <div class="post-nome">mariana_</div>
                        <div class="post-local">Praça Central</div>
                    </div>
                </div>
                <ion-icon name="ellipsis-horizontal"></ion-icon>
  
  
</body>
