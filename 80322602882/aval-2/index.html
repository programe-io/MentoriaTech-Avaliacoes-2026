<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
  <header>
    <h1>Meu Mini Feed</h1>
  </header>

  <section class="criar-post">
    <textarea id="textoPost" placeholder="No que você está pensando?"></textarea>
    <button id="btnPublicar">Publicar</button>
  </section>

  <main id="listaPosts">
    <!-- Post inicial de exemplo -->
    <article class="post">
      <div class="post-header">
        <strong>@usuario_dev</strong>
        <span>Agora mesmo</span>
      </div>
      <p class="post-conteudo">Olá! Este é o meu primeiro post no mini feed social. 🚀</p>
      <div class="post-acoes">
        <button class="btn-curtir" onclick="curtirPost(this)">❤️ Curtir (<span>0</span>)</button>
      </div>
      <div class="comentarios">
        <div class="lista-comentarios"></div>
        <div class="form-comentario">
          <input type="text" placeholder="Escreva um comentário...">
          <button onclick="comentarPost(this)">Enviar</button>
        </div>
      </div>
    </article>
  </main>
</div>
  <script src="script.js"></script>
  
</body>
</html>
