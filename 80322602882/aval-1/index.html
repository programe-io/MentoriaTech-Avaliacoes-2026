<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header>
  <h1>Meu Blog Pessoal</h1>
  <p>Compartilhando ideias, projetos e aprendizados.</p>
</header>

<main>
  <section class="nova-postagem">
    <h2>Escrever Nova Postagem</h2>
    <input type="text" id="titulo-post" placeholder="Título da postagem...">
    <textarea id="conteudo-post" rows="4" placeholder="Escreva o conteúdo aqui..."></textarea>
    <button onclick="publicarPost()">Publicar no Blog</button>
  </section>

  <section id="lista-posts">
    <article class="post">
      <h3>Bem-vindo ao meu primeiro post!</h3>
      <span class="data">Publicado hoje</span>
      <p>Este é o espaço onde vou compartilhar minha jornada na programação e desenvolvimento web.</p>
      <button class="btn-curtir" onclick="curtir(this)">Curtir (<span>0</span>)</button>
    </article>
  </section>
</main>

<footer>
  <p>&copy; 2026 - Desenvolvido por Mim</p>
</footer>
  <script src="script.js"></script>
  
</body>
</html>
