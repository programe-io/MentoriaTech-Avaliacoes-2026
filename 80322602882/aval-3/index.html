<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <!-- Cabeçalho -->
  <header class="navbar">
    <div class="nav-container">
      <h1 class="logo">Instagram</h1>
      <input type="text" class="search-bar" placeholder="Pesquisar">
      <div class="nav-icons">
        <span>🏠</span>
        <span>💬</span>
        <span>➕</span>
        <span>❤️</span>
        <div class="avatar-mini"></div>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container">
    <!-- Barra de Stories -->
    <section class="stories">
      <div class="story">
        <div class="story-ring"><img src="https://picsum.photos" alt="Perfil 1"></div>
        <span>seu_story</span>
      </div>
      <div class="story">
        <div class="story-ring"><img src="https://picsum.photos" alt="Perfil 2"></div>
        <span>ana.dev</span>
      </div>
      <div class="story">
        <div class="story-ring"><img src="https://picsum.photos" alt="Perfil 3"></div>
        <span>lucas_ui</span>
      </div>
      <div class="story">
        <div class="story-ring"><img src="https://picsum.photos" alt="Perfil 4"></div>
        <span>mari.js</span>
      </div>
      <div class="story">
        <div class="story-ring"><img src="https://picsum.photos" alt="Perfil 5"></div>
        <span>tech_br</span>
      </div>
    </section>

    <!-- Feed de Postagens -->
    <section id="feed">
      <!-- Post 1 -->
      <article class="post">
        <div class="post-header">
          <div class="user-info">
            <img src="https://picsum.photos" alt="ana.dev" class="user-avatar">
            <strong>ana.dev</strong>
          </div>
          <span class="options">•••</span>
        </div>

        <div class="post-image-container">
          <img src="https://picsum.photos" alt="Setup de programação" class="post-img">
        </div>

        <div class="post-actions">
          <div class="left-actions">
            <button class="like-btn" aria-label="Curtir">🤍</button>
            <button class="comment-focus-btn" aria-label="Comentar">💬</button>
            <button aria-label="Compartilhar">📤</button>
          </div>
          <button class="save-btn" aria-label="Salvar">🔖</button>
        </div>

        <div class="post-info">
          <p class="likes-count"><strong>124 curtidas</strong></p>
          <p class="caption"><strong>ana.dev</strong> Finalizando meu projeto em HTML, CSS e JavaScript! 💻🚀</p>
          <div class="comments-list"></div>
          <span class="post-time">HÁ 2 HORAS</span>
        </div>

        <form class="comment-form">
          <input type="text" class="comment-input" placeholder="Adicione um comentário..." required>
          <button type="submit" class="post-comment-btn">Publicar</button>
        </form>
      </article>

      <!-- Post 2 -->
      <article class="post">
        <div class="post-header">
          <div class="user-info">
            <img src="https://picsum.photos" alt="lucas_ui" class="user-avatar">
            <strong>lucas_ui</strong>
          </div>
          <span class="options">•••</span>
        </div>

        <div class="post-image-container">
          <img src="https://picsum.photos" alt="Paisagem" class="post-img">
        </div>

        <div class="post-actions">
          <div class="left-actions">
            <button class="like-btn" aria-label="Curtir">🤍</button>
            <button class="comment-focus-btn" aria-label="Comentar">💬</button>
            <button aria-label="Compartilhar">📤</button>
          </div>
          <button class="save-btn" aria-label="Salvar">🔖</button>
        </div>

        <div class="post-info">
          <p class="likes-count"><strong>89 curtidas</strong></p>
          <p class="caption"><strong>lucas_ui</strong> Pausa para recarregar as energias no fim de semana 🌿☀️</p>
          <div class="comments-list"></div>
          <span class="post-time">HÁ 5 HORAS</span>
        </div>

        <form class="comment-form">
          <input type="text" class="comment-input" placeholder="Adicione um comentário..." required>
          <button type="submit" class="post-comment-btn">Publicar</button>
        </form>
      </article>
    </section>
  </main>
<script src="script.js"></script></body>
</html>
