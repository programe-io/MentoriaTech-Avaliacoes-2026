<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Minha Lista de Tarefas</h1>
            <p>Organize suas atividades de forma simples e rápida.</p>
        </header>

        <main>
            <form id="taskForm">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Digite uma nova tarefa..."
                    autocomplete="off"
                >
                <button type="submit">Adicionar</button>
            </form>

            <div class="info">
                <span id="taskCount">0 tarefas</span>
                <button id="clearButton" type="button">Limpar concluídas</button>
            </div>

            <ul id="taskList"></ul>

            <p id="emptyMessage" class="empty">
                Nenhuma tarefa adicionada ainda.
            </p>
        </main>

        <footer>
            <p>Projeto desenvolvido em HTML, CSS e JavaScript.</p>
        </footer>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
