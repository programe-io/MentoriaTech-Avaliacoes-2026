
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .tarefa {
            background: #eeeeee;
            padding: 12px;
            margin-top: 10px;
            border-radius: 5px;
        }

        .concluida {
            color: green;
        }

        #mensagem {
            color: red;
        }
    </style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <form id="formTarefa">
            <label for="titulo">Título da tarefa:</label>
            <input
                type="text"
                id="titulo"
                placeholder="Digite o título"
                required
            >

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade">
                <option value="1">1 - Baixa</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Alta</option>
            </select>

            <button type="submit">Cadastrar tarefa</button>
        </form>

        <p id="mensagem"></p>

        <h2>Lista de tarefas</h2>
        <div id="listaTarefas"></div>
    </div>

    <script>
        let tarefas = [];
        let geradorCodigo = 0;

        const form = document.getElementById("formTarefa");
        const mensagem = document.getElementById("mensagem");
        const lista = document.getElementById("listaTarefas");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const titulo = document.getElementById("titulo").value.trim();
            const prioridade = Number(
                document.getElementById("prioridade").value
            );

            try {
                cadastrarTarefa(titulo, prioridade);
                mensagem.style.color = "green";
                mensagem.textContent = "Tarefa cadastrada com sucesso!";
                form.reset();
                listarTarefas();
            } catch (erro) {
                mensagem.style.color = "red";
                mensagem.textContent = erro.message;
            }
        });

        function validarDadosTarefas(titulo, prioridade) {
            if (titulo.length < 5) {
                throw new Error(
                    "O título deve ter no mínimo 5 caracteres."
                );
            }

            if (prioridade < 1 || prioridade > 3) {
                throw new Error(
                    "Informe uma prioridade entre 1 e 3."
                );
            }
        }

        function cadastrarTarefa(titulo, prioridade) {
            validarDadosTarefas(titulo, prioridade);

            const tarefa = {
                codigo: ++geradorCodigo,
                titulo: titulo,
                prioridade: prioridade,
                status: true
            };

            tarefas.push(tarefa);
        }

        function listarTarefas() {
            lista.innerHTML = "";

            tarefas.forEach(function(tarefa) {
                const item = document.createElement("div");
                item.className = "tarefa";

                if (!tarefa.status) {
                    item.classList.add("concluida");
                }

                const texto = document.createElement("p");
                texto.textContent =
                    "Código: " + tarefa.codigo +
                    " | Tarefa: " + tarefa.titulo +
                    " | Prioridade: " + tarefa.prioridade +
                    " | Status: " +
                    (tarefa.status ? "Pendente" : "Concluída");

                item.appendChild(texto);

                if (tarefa.status) {
                    const botao = document.createElement("button");
                    botao.textContent = "Concluir tarefa";

                    botao.addEventListener("click", function() {
                        concluirTarefa(tarefa.codigo);
                        listarTarefas();
                    });

                    item.appendChild(botao);
                }

                lista.appendChild(item);
            });
        }

        function buscarTarefa(codigo) {
            const tarefa = tarefas.find(t => t.codigo === codigo);

            if (!tarefa) {
                throw new Error("Tarefa não encontrada.");
            }

            return tarefa;
        }

        function concluirTarefa(codigo) {
            const tarefa = buscarTarefa(codigo);

            if (!tarefa.status) {
                throw new Error("Tarefa já concluída.");
            }

            tarefa.status = false;
        }
    </script>
<script src="script.js"></script></body>
</html>
