<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed - Arquivos do Aranha</title>
    <!-- Link para o CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bangers&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="container header-content">
            <h1 class="logo">Web<span>Aranha</span> <small>Feed</small></h1>
            <nav>
                <ul>
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Explorar</a></li>
                    <li><a href="#">Perfil</a></li>
                </ul>
            </nav>
            <button id="theme-toggle" aria-label="Alternar tema">🕷️</button>
        </div>
    </header>

    <!-- Conteúdo Principal / Mini Feed -->
    <main class="container feed-layout">
        
        <!-- Perfil Lateral Esquerdo / Resumo -->
        <aside class="sidebar-profile">
            <div class="profile-card">
                <div class="profile-avatar">🕷️</div>
                <h3>Alan Parker</h3>
                <p class="profile-handle">@webmaster_spidey</p>
                <p class="profile-bio">Estudando redes, tecnologia e balançando pelos cabos de fibra óptica de Nova York.</p>
                <div class="profile-stats">
                    <div><strong>6</strong> Arquivos</div>
                    <div><strong>Infra</strong> Web</div>
                </div>
            </div>
        </aside>

        <!-- Feed Principal de Posts -->
        <section class="feed-container" id="posts-container">
            <!-- Os mini posts serão injetados dinamicamente via JavaScript -->
        </section>

    </main>

    <!-- Rodapé -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Blog do Alan | Mini Feed Web & Internet.</p>
        </div>
    </footer>

    <!-- Link para o JavaScript -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
