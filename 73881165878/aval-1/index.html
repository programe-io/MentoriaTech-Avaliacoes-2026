

<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Sistema de Estoque</h1>

        <h2>Cadastrar Produto</h2>

        <input id="codigo" placeholder="Código do produto">

        <input id="descricao" placeholder="Descrição">

        <input id="quantidade" type="number" placeholder="Quantidade">

        <input id="valor" type="number" step="0.01" placeholder="Valor">

        <button onclick="cadastrar()">Cadastrar Produto</button>

        <h2>Alterar Produto</h2>

        <input id="codigoAlterar" placeholder="Código do produto">

        <input id="novoValor" type="number" step="0.01" placeholder="Novo valor">

        <button onclick="alterarValor()">Alterar Valor</button>

        <input id="novaQuantidade" type="number" placeholder="Nova quantidade">

        <button onclick="alterarQuantidade()">Alterar Quantidade</button>

        <h2>Produtos Cadastrados</h2>

        <button onclick="listar()">Listar Produtos</button>

        <div id="lista"></div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
