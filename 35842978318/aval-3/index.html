
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <h1>Controle de IMC</h1>
        <p>Preencha os dados do paciente.</p>

        <input type="text" id="nome" placeholder="Nome do paciente">
        <input type="number" id="peso" placeholder="Peso em kg" step="0.1">
        <input type="number" id="altura" placeholder="Altura em metros" step="0.01">

        <button onclick="calcularIMC()">Calcular IMC</button>

        <div id="resultado"></div>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
