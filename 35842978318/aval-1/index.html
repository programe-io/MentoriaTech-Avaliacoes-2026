
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <h1>Controle de Estoque</h1>

        <input id="codigo" type="number" placeholder="Código do produto">
        <input id="descricao" type="text" placeholder="Descrição do produto">
        <input id="quantidade" type="number" placeholder="Quantidade">
        <input id="valor" type="number" step="0.01" placeholder="Valor">

        <button onclick="cadastrarProduto()">Cadastrar produto</button>
        <button onclick="listarProdutos()">Listar produtos</button>
        <button onclick="alterarValor()">Alterar valor</button>
        <button onclick="alterarQuantidade()">Alterar quantidade</button>

        <div id="resultado"></div>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
