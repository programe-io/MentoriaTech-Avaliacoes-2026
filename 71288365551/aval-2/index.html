<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Gerenciador de Tarefas</h1>

        <div class="section">

            <h2>Cadastrar Tarefa</h2>

            <div class="input-group">
                <label for="titulo">Título da tarefa:</label>
                <input type="text" id="titulo"
                    placeholder="Digite o título da tarefa">
            </div>

            <div class="input-group">
                <label for="prioridade">Prioridade:</label>
                <select id="prioridade">
                    <option value="">Selecione</option>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>
            </div>

            <button id="btCadastrar">Cadastrar Tarefa</button>

        </div>

        <div class="section">

            <h2>Gerenciar Tarefas</h2>

            <div class="input-group">
                <label for="codigo">Código da tarefa:</label>
                <input type="number" id="codigo"
                    placeholder="Digite o código da tarefa">
            </div>

            <div class="input-group">
                <label for="novaPrioridade">Nova prioridade:</label>
                <select id="novaPrioridade">
                    <option value="">Selecione</option>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>
            </div>

            <div class="botoes">
                <button id="btListar">Listar Tarefas</button>
                <button id="btConcluir">Concluir Tarefa</button>
                <button id="btAlterar">Alterar Prioridade</button>
            </div>

            <p id="mensagem"></p>

        </div>

        <div class="section">

            <h2>Lista de Tarefas</h2>

            <ul id="listaTarefas"></ul>

        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
