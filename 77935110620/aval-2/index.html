
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Feed</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="header-content">

            <h1>Mini Feed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>

        </div>
    </header>

    <main>

        <section class="new-post">

            <div class="user">

                <div class="avatar">M</div>

                <div class="user-info">
                    <strong>Luis otávio</strong>
                    <span>Poste o que gosta!</span>
                </div>

            </div>

            <button type="button">Publicar</button>

        </section>
        <article class="post">

            <div class="post-header">

                <div class="user">

                    <div class="avatar">e
                    </div>

                    <div class="user-info">
                        <strong>enzo@progamer</strong>
                        <span>Há 10 minutos</span>
                    </div>

                </div>

            </div>

            <div class="post-text">
                Minha mais nova construçaão no minecraft
            </div>

            <img
                class="post-image"
                src="https://plus.unsplash.com/premium_photo-1713991088871-614d45da7fdb?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                alt="Paisagem urbana com prédios iluminados"
            >

            <div class="post-actions">
                <button type="button"> Curtir</button>
                <button type="button"> Comentar</button>
            </div>

        </article>
        <article class="post">

            <div class="post-header">

                <div class="user">

                    <div class="avatar avatar-blue">G</div>

                    <div class="user-info">
                        <strong>gabrieldomato</strong>
                        <span>Há 30 minutos</span>
                    </div>

                </div>

            </div>

            <div class="post-text">
                programando minecraft 2
            </div>

            <img
                class="post-image"
                src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=900"
                alt="Computador utilizado para programação"
            >

            <div class="post-actions">
                <button type="button"> Curtir</button>
                <button type="button"> Comentar</button>
            </div>

        </article>

      
        <article class="post">

            <div class="post-header">

                <div class="user">

                    <div class="avatar avatar-green">P</div>

                    <div class="user-info">
                        <strong>Joaoeder123</strong>
                        <span>Há 1 hora</span>
                    </div>

                </div>

            </div>

            <div class="post-text">
                programaçao.
            </div>

            <img
                class="post-image"
                src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=900"
                alt="Pessoa trabalhando em um computador"
            >

            <div class="post-actions">
                <button type="button"> Curtir</button>
                <button type="button"> Comentar</button>
            </div>
        </article>
    </main>
    <footer>
    </footer>
</body>
</html>
