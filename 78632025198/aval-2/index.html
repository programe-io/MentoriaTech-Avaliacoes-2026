<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Feed Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="app-bar">
      <span class="app-bar__mark">feed<span class="app-bar__mark-dot">.</span></span>
          <span class="app-bar__tag">mini social</span>
            </header>

              <main class="feed">

                  <!-- POST — Cledson -->
                      <article class="post" style="--ring-a:#1B1B1F; --ring-b:#8A8A8A;">
                            <div class="post__head">
                                    <div class="avatar-ring avatar-ring--initial">
                                              <span class="avatar avatar--initial">C</span>
                                                      </div>
                                                              <div class="post__who">
                                                                        <span class="post__name">Cledson</span>
                                                                                  <span class="post__meta">@cledson &middot; 5 h</span>
                                                                                          </div>
                                                                                                  <button class="post__more" aria-label="Mais opções">&#8942;</button>
                                                                                                        </div>

                                                                                                              <p class="post__text">
                                                                                                                      "Velozes e Furiosos 7" continua sendo a despedida mais emocionante
                                                                                                                              do cinema 🏎️💨 — família até o fim. See you again sempre vai
                                                                                                                                      arrancar uma lágrima.
                                                                                                                                            </p>

                                                                                                                                                  <div class="post__media">
                                                                                                                                                          <!-- Substitua o src abaixo pelo link do pôster de Velozes e Furiosos 7 -->
                                                                                                                                                                  <img src="https://i.postimg.cc/C1NB7TmN/spyd-Myy-D81Hj-GJVw-Zvjajkr-WW1h.jpg"
                                                                                                                                                                 alt="Pôster do filme Velozes e Furiosos 7">
                                                                                                                                                                        </div>

                                                                                                                                                                              <div class="post__actions">
                                                                                                                                                                                      <button class="action action--like">
                                                                                                                                                                                                <span class="action__icon">&#9825;</span>
                                                                                                                                                                                                          <span class="action__count">298</span>
                                                                                                                                                                                                                  </button>
                                                                                                                                                                                                                          <button class="action">
                                                                                                                                                                                                                                    <span class="action__icon">&#9998;</span>
                                                                                                                                                                                                                                              <span class="action__count">24</span>
                                                                                                                                                                                                                                                      </button>
                                                                                                                                                                                                                                                              <button class="action">
                                                                                                                                                                                                                                                                        <span class="action__icon">&#8635;</span>
                                                                                                                                                                                                                                                                                  <span class="action__count">17</span>
                                                                                                                                                                                                                                                                                          </button>
                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                    </article>

                                                                                                                                                                                                                                                                                                      </main>

                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                      </html>
