
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>SocialFeed</h1>
        <span>🌎 Conecte-se com o mundo</span>
    </header>

    <main>
        <section class="criar-post">
            <h2>Criar publicação</h2>
            <input type="text" id="nome" placeholder="Seu nome">
            <textarea id="texto" placeholder="O que você está pensando?"></textarea>
            <input type="url" id="imagem" placeholder="Link da imagem (opcional)">
            <button onclick="criarPost()">Publicar</button>
        </section>

        <section id="feed">

            <article class="post">
                <div class="usuario">
                    <img src="https://i.pravatar.cc/100?img=12">
                    <div>
                        <h3>Lucas Silva</h3>
                        <small>Há 10 minutos</small>
                    </div>
                </div>

                <p>Que lugar incrível! Amo conhecer novos lugares! 🌴</p>

                <img class="foto-post" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900">

                <div class="acoes">
                    <button class="like" onclick="curtir(this)">❤️ Curtir <span>12</span></button>
                    <button onclick="focarComentario(this)">💬 Comentar</button>
                </div>

                <div class="comentarios">
                    <input type="text" placeholder="Escreva um comentário...">
                    <button onclick="comentar(this)">Enviar</button>
                    <div class="lista-comentarios"></div>
                </div>
            </article>

            <article class="post">
                <div class="usuario">
                    <img src="https://i.pravatar.cc/100?img=47">
                    <div>
                        <h3>Ana Oliveira</h3>
                        <small>Há 30 minutos</small>
                    </div>
                </div>

                <p>Um pouco de natureza para deixar o dia melhor! 🌿</p>

                <img class="foto-post" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900">

                <div class="acoes">
                    <button class="like" onclick="curtir(this)">❤️ Curtir <span>25</span></button>
                    <button onclick="focarComentario(this)">💬 Comentar</button>
                </div>

                <div class="comentarios">
                    <input type="text" placeholder="Escreva um comentário...">
                    <button onclick="comentar(this)">Enviar</button>
                    <div class="lista-comentarios"></div>
                </div>
            </article>

            <article class="post">
                <div class="usuario">
                    <img src="https://i.pravatar.cc/100?img=33">
                    <div>
                        <h3>Pedro Costa</h3>
                        <small>Há 1 hora</small>
                    </div>
                </div>

                <p>Programar é transformar ideias em realidade! 💻</p>

                <img class="foto-post" src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=900">

                <div class="acoes">
                    <button class="like" onclick="curtir(this)">❤️ Curtir <span>38</span></button>
                    <button onclick="focarComentario(this)">💬 Comentar</button>
                </div>

                <div class="comentarios">
                    <input type="text" placeholder="Escreva um comentário...">
                    <button onclick="comentar(this)">Enviar</button>
                    <div class="lista-comentarios"></div>
                </div>
            </article>

        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
