<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <header class="cabecalho">
            <div>
                <p class="etiqueta">ORGANIZAÇÃO PESSOAL</p>
                <h1>Gerenciador de Tarefas</h1>
                <p class="subtitulo">
                    Cadastre, acompanhe e organize suas tarefas.
                </p>
            </div>
            <div class="icone">✓</div>
        </header>

        <section class="painel">
            <h2>Cadastrar nova tarefa</h2>

            <form id="form-tarefa">
                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        id="titulo"
                        type="text"
                        placeholder="Ex.: Fazer atividade de matemática"
                        required
                    >
                    <small>O título precisa ter pelo menos 5 caracteres.</small>
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade">
                        <option value="1">1 — Alta</option>
                        <option value="2">2 — Média</option>
                        <option value="3">3 — Baixa</option>
                    </select>
                </div>

                <button type="submit" class="botao-principal">
                    + Cadastrar tarefa
                </button>

                <p id="mensagem" class="mensagem"></p>
            </form>
        </section>

        <section class="painel">
            <div class="linha-titulo">
                <h2>Minhas tarefas</h2>
                <span id="contador" class="contador">0 tarefas</span>
            </div>

            <div id="lista-tarefas" class="lista-tarefas">
                <p class="vazio">Nenhuma tarefa cadastrada ainda.</p>
            </div>
        </section>

        <footer>As tarefas ficam salvas neste navegador.</footer>
    </main>

<script src="script.js"></script></body>
</html>$0
