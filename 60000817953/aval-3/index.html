
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Camylla</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <header>
            <h1>Instagram</h1>
            <input type="text" placeholder="Pesquisar">
            <div class="icons">
                🏠 ❤️ ✉️
            </div>
        </header>

        <main>
            <section class="perfil">
                <img src="https://i.pravatar.cc/150?img=47" alt="Foto de perfil">
                <div>
                    <h2>camylla</h2>
                    <p>Olá! Seja bem-vindo ao meu Instagram 💗</p>
                    <p><strong>12</strong> publicações
                    <strong>250</strong> seguidores
                    <strong>180</strong> seguindo</p>
                </div>
            </section>

            <section class="stories">
                <div>
                    <img src="https://i.pravatar.cc/100?img=12">
                    <p>Amigos</p>
                </div>
                <div>
                    <img src="https://i.pravatar.cc/100?img=25">
                    <p>Viagens</p>
                </div>
                <div>
                    <img src="https://i.pravatar.cc/100?img=32">
                    <p>Momentos</p>
                </div>
                <div>
                    <img src="https://i.pravatar.cc/100?img=45">
                    <p>Fotos</p>
                </div>
            </section>

            <h3>Publicações</h3>

            <section class="posts">
                <img src="https://picsum.photos/300/300?random=1">
                <img src="https://picsum.photos/300/300?random=2">
                <img src="https://picsum.photos/300/300?random=3">
                <img src="https://picsum.photos/300/300?random=4">
                <img src="https://picsum.photos/300/300?random=5">
                <img src="https://picsum.photos/300/300?random=6">
            </section>
        </main>

    </div>

</body>
</html>
