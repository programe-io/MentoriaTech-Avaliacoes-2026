<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Arquivos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">
            📁 <span>FileManager</span>
        </div>

        <button class="new-btn" id="newBtn">
            ＋ Novo
        </button>

        <nav>
            <button class="nav-item active" data-filter="all">
                🏠 Todos os arquivos
            </button>

            <button class="nav-item" data-filter="folder">
                📁 Pastas
            </button>

            <button class="nav-item" data-filter="file">
                📄 Arquivos
            </button>
        </nav>

        <div class="storage">
            <div class="storage-title">
                Armazenamento
            </div>

            <div class="progress">
                <div class="progress-bar"></div>
            </div>

            <small id="storageText">
                Calculando...
            </small>
        </div>
    </aside>


    <main class="main">

        <header class="topbar">

            <div class="breadcrumb" id="breadcrumb">
                🏠 Início
            </div>

            <div class="top-actions">

                <div class="search">
                    🔎
                    <input
                        type="text"
                        id="search"
                        placeholder="Pesquisar arquivos..."
                    >
                </div>

                <label class="upload-btn">
                    ⬆️ Upload
                    <input type="file" id="fileInput" hidden multiple>
                </label>

            </div>

        </header>


        <section class="content">

            <div class="content-header">
                <div>
                    <h1>Meus arquivos</h1>
                    <p id="itemCount">0 itens</p>
                </div>

                <div class="view-buttons">
                    <button id="gridView" class="view active">▦</button>
                    <button id="listView" class="view">☷</button>
                </div>
            </div>


            <div id="fileContainer" class="file-grid"></div>

            <div id="emptyState" class="empty-state">
                <div>📂</div>
                <h2>Nenhum arquivo encontrado</h2>
                <p>Crie uma pasta ou faça upload de um arquivo.</p>
            </div>

        </section>

    </main>

</div>


<!-- Menu Novo -->

<div class="modal" id="newModal">

    <div class="modal-box">

        <button class="close" id="closeModal">×</button>

        <h2>Criar novo</h2>

        <button class="modal-option" id="createFolder">
            📁
            <div>
                <strong>Nova pasta</strong>
                <span>Criar uma nova pasta</span>
            </div>
        </button>

        <button class="modal-option" id="createFile">
            📄
            <div>
                <strong>Novo arquivo</strong>
                <span>Criar um arquivo de texto</span>
            </div>
        </button>

    </div>

</div>


<!-- Modal de edição -->

<div class="modal" id="editorModal">

    <div class="editor-box">

        <div class="editor-header">
            <h2 id="editorTitle">Novo arquivo</h2>
            <button class="close" id="closeEditor">×</button>
        </div>

        <input
            type="text"
            id="fileName"
            placeholder="Nome do arquivo"
        >

        <textarea
            id="fileContent"
            placeholder="Digite o conteúdo do arquivo..."
        ></textarea>

        <button class="save-btn" id="saveFile">
            💾 Salvar arquivo
        </button>

    </div>

</div>


<!-- Menu de contexto -->

<div class="context-menu" id="contextMenu">

    <button id="openItem">📂 Abrir</button>
    <button id="renameItem">✏️ Renomear</button>
    <button id="downloadItem">⬇️ Baixar</button>
    <button id="deleteItem">🗑️ Excluir</button>

</div>


<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
