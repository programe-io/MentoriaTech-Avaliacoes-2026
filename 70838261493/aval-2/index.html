<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas tarefas e mantenha sua produtividade.</p>
        </header>

        <section class="formulario">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">
                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o nome da tarefa..."
                    required
                >

                <select id="prioridade">
                    <option value="baixa">Prioridade baixa</option>
                    <option value="media">Prioridade média</option>
                    <option value="alta">Prioridade alta</option>
                </select>

                <button type="submit" id="btnSalvar">
                    Adicionar tarefa
                </button>
            </form>
        </section>

        <section class="filtros">
            <button class="filtro ativo" data-filtro="todas">
                Todas
            </button>

            <button class="filtro" data-filtro="pendentes">
                Pendentes
            </button>

            <button class="filtro" data-filtro="concluidas">
                Concluídas
            </button>
        </section>

        <section class="lista">
            <h2>Minhas tarefas</h2>

            <ul id="listaTarefas"></ul>

            <p id="mensagemVazia">
                Nenhuma tarefa cadastrada.
            </p>
        </section>

        <footer>
            <p id="contador">0 tarefas cadastradas</p>
        </footer>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
