<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Ficha de Anamnese</h1>
            <p>Cadastro e histórico de saúde do paciente</p>
        </header>

        <form id="formAnamnese">

            <section class="form-section">
                <h2>1. Dados pessoais</h2>

                <div class="grid">
                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="campo">
                        <label for="dataNascimento">Data de nascimento</label>
                        <input type="date" id="dataNascimento">
                    </div>

                    <div class="campo">
                        <label for="idade">Idade</label>
                        <input type="number" id="idade" min="0">
                    </div>

                    <div class="campo">
                        <label for="sexo">Sexo</label>
                        <select id="sexo">
                            <option value="">Selecione</option>
                            <option>Feminino</option>
                            <option>Masculino</option>
                            <option>Outro</option>
                            <option>Prefiro não informar</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone">
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email">
                    </div>

                    <div class="campo">
                        <label for="profissao">Profissão</label>
                        <input type="text" id="profissao">
                    </div>

                    <div class="campo">
                        <label for="estadoCivil">Estado civil</label>
                        <select id="estadoCivil">
                            <option value="">Selecione</option>
                            <option>Solteiro(a)</option>
                            <option>Casado(a)</option>
                            <option>Divorciado(a)</option>
                            <option>Viúvo(a)</option>
                            <option>Outro</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2>2. Queixa principal</h2>

                <div class="campo">
                    <label for="queixa">Qual o principal motivo da consulta?</label>
                    <textarea id="queixa" rows="4"
                    placeholder="Descreva o motivo da consulta..."></textarea>
                </div>

                <div class="campo">
                    <label for="sintomas">Sintomas apresentados</label>
                    <textarea id="sintomas" rows="4"
                    placeholder="Descreva os sintomas..."></textarea>
                </div>

                <div class="campo">
                    <label for="inicioSintomas">Quando os sintomas começaram?</label>
                    <input type="text" id="inicioSintomas">
                </div>
            </section>

            <section class="form-section">
                <h2>3. Histórico de saúde</h2>

                <div class="campo">
                    <label for="doencas">Doenças ou condições preexistentes</label>
                    <textarea id="doencas" rows="3"
                    placeholder="Ex.: hipertensão, diabetes..."></textarea>
                </div>

                <div class="campo">
                    <label for="cirurgias">Cirurgias anteriores</label>
                    <textarea id="cirurgias" rows="3"></textarea>
                </div>

                <div class="campo">
                    <label for="internacoes">Internações anteriores</label>
                    <textarea id="internacoes" rows="3"></textarea>
                </div>

                <div class="campo">
                    <label for="historicoFamiliar">Histórico familiar</label>
                    <textarea id="historicoFamiliar" rows="3"
                    placeholder="Histórico de doenças na família..."></textarea>
                </div>
            </section>

            <section class="form-section">
                <h2>4. Medicamentos e alergias</h2>

                <div class="campo">
                    <label for="medicamentos">Medicamentos em uso</label>
                    <textarea id="medicamentos" rows="3"></textarea>
                </div>

                <div class="campo">
                    <label for="alergias">Alergias</label>
                    <textarea id="alergias" rows="3"
                    placeholder="Medicamentos, alimentos ou outras substâncias..."></textarea>
                </div>
            </section>

            <section class="form-section">
                <h2>5. Hábitos e estilo de vida</h2>

                <div class="grid">
                    <div class="campo">
                        <label for="alimentacao">Alimentação</label>
                        <textarea id="alimentacao" rows="3"></textarea>
                    </div>

                    <div class="campo">
                        <label for="sono">Qualidade do sono</label>
                        <textarea id="sono" rows="3"></textarea>
                    </div>

                    <div class="campo">
                        <label for="atividade">Atividade física</label>
                        <textarea id="atividade" rows="3"></textarea>
                    </div>

                    <div class="campo">
                        <label for="habitos">Outros hábitos</label>
                        <textarea id="habitos" rows="3"
                        placeholder="Informações relevantes..."></textarea>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2>6. Observações</h2>

                <div class="campo">
                    <label for="observacoes">Observações gerais</label>
                    <textarea id="observacoes" rows="5"></textarea>
                </div>
            </section>

            <section class="form-section">
                <h2>7. Identificação do profissional</h2>

                <div class="grid">
                    <div class="campo">
                        <label for="profissional">Nome do profissional</label>
                        <input type="text" id="profissional">
                    </div>

                    <div class="campo">
                        <label for="registro">Registro profissional</label>
                        <input type="text" id="registro">
                    </div>
                </div>

                <div class="campo">
                    <label for="dataConsulta">Data da consulta</label>
                    <input type="date" id="dataConsulta">
                </div>
            </section>

            <div class="botoes">
                <button type="submit" class="btn-salvar">
                    Finalizar preenchimento
                </button>

                <button type="button" class="btn-imprimir" id="imprimir">
                    Imprimir ficha
                </button>

                <button type="reset" class="btn-limpar">
                    Limpar ficha
                </button>
            </div>

        </form>

        <footer>
            <p>Ficha de Anamnese • Documento de apoio ao atendimento</p>
        </footer>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
