<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Água e Treino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Água e Treino</h1>
        <p id="hoje"></p>
      </div>
      <div class="streak" id="streak"></div>
    </div>

    <div class="card">
      <div class="head"><h2>Últimos 7 dias</h2></div>
      <div class="week" id="week"></div>
      <div class="legend">
        <span><span class="dot w on dot-inline"></span> meta de água</span>
        <span><span class="dot m on dot-inline"></span> treino completo</span>
      </div>
    </div>

    <div class="grid">
      <section class="card" aria-labelledby="h-agua">
        <div class="head"><h2 id="h-agua">Água</h2><span id="copo-info"></span></div>
        <div class="ringbox">
          <svg viewBox="0 0 120 120" role="img" aria-label="Progresso de água do dia">
            <circle class="ring-bg" cx="60" cy="60" r="52" fill="none" stroke-width="10"></circle>
            <circle class="ring-fg" id="ring" cx="60" cy="60" r="52" fill="none" stroke-width="10"
                    stroke-linecap="round" transform="rotate(-90 60 60)"
                    stroke-dasharray="326.73" stroke-dashoffset="326.73"></circle>
          </svg>
          <div class="ringtxt"><b id="ml">0</b><span id="de">de 2500 ml</span></div>
        </div>
        <p class="msg" id="msg"></p>
        <div class="btns">
          <button class="btn-water" data-add="200" type="button">+ 200 ml</button>
          <button class="btn-water" data-add="300" type="button">+ 300 ml</button>
          <button class="btn-water" data-add="500" type="button">+ 500 ml</button>
        </div>
        <div class="row2">
          <label class="goal" for="meta">Meta diária
            <input id="meta" type="number" min="500" max="8000" step="100"> ml
          </label>
          <button class="link" id="undo" type="button">Desfazer último</button>
        </div>
        <p class="hist" id="hist"></p>
      </section>

      <section class="card" aria-labelledby="h-treino">
        <div class="head"><h2 id="h-treino">Exercícios de hoje</h2><span id="ex-info"></span></div>
        <div class="bar" aria-hidden="true"><i id="exbar"></i></div>
        <ul id="lista"></ul>
        <form class="add" id="form">
          <input id="novo-nome" type="text" placeholder="Novo exercício" maxlength="60" required aria-label="Nome do exercício">
          <input id="novo-min" type="number" min="1" max="300" placeholder="min" aria-label="Duração em minutos">
          <button class="btn-move" type="submit">Adicionar</button>
        </form>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
