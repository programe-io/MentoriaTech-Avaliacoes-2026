  <!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Arena Futebol</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }

        /* Cabeçalho e Navegação */
        header {
            background-color: #0e5c2c; /* Verde futebol */
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        nav {
            background-color: #123e24;
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 5px 15px;
            margin: 0 10px;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #4cd137;
        }

        /* Layout Principal */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* Área dos Posts */
        main {
            flex: 3;
            min-width: 300px;
        }

        article {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        article img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: cover;
            border-radius: 6px;
            margin: 15px 0;
        }

        article .meta {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 10px;
        }

        article h2 {
            color: #123e24;
            margin-bottom: 10px;
        }

        article .read-more {
            display: inline-block;
            margin-top: 15px;
            color: #0e5c2c;
            text-decoration: none;
            font-weight: bold;
        }

        article .read-more:hover {
            text-decoration: underline;
        }

        /* Barra Lateral */
        aside {
            flex: 1;
            min-width: 250px;
        }

        .sidebar-box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .sidebar-box h3 {
            color: #0e5c2c;
            border-bottom: 2px solid #0e5c2c;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .sidebar-box ul {
            list-style: none;
        }

        .sidebar-box ul li {
            margin-bottom: 10px;
        }

        .sidebar-box ul li a {
            color: #333;
            text-decoration: none;
            transition: color 0.2s;
        }

        .sidebar-box ul li a:hover {
            color: #0e5c2c;
        }

        /* Rodapé */
        footer {
            background-color: #123e24;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
            font-size: 0.9rem;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
