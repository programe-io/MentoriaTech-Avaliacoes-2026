<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>GameZone</title>

                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

                <body>

                    <header>
                            <h1>🎮 GameZone</h1>
                                    <p>Seu portal de jogos</p>
                                        </header>

                                            <main>

                                                    <section class="jogos">
                                                                <h2>🔥 Jogos</h2>

                                                                            <div class="cards">

                                                                                            <div class="card">
                                                                                                                <h3>⚽ Futebol</h3>
                                                                                                                                    <p>Mostre que você entende de futebol!</p>
                                                                                                                                                        <button onclick="mensagem('Futebol')">
                                                                                                                                                                                Jogar
                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                    <div class="card">
                                                                                                                                                                                                                                                        <h3>🔢 Adivinhe o Número</h3>
                                                                                                                                                                                                                                                                            <p>Tente descobrir o número secreto.</p>
                                                                                                                                                                                                                                                                                                <button onclick="iniciarJogo()">
                                                                                                                                                                                                                                                                                                                        Jogar
                                                                                                                                                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                            <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                <h3>🧠 Quiz</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Teste seus conhecimentos.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="mensagem('Quiz')">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                Jogar
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <section id="game">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>🔢 Adivinhe o Número</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>Escolhi um número entre 1 e 10.</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    type="number" 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    id="numero"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    placeholder="Digite um número"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    min="1"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    max="10"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="verificarNumero()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Tentar
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p id="resultado"></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>🎮 GameZone © 2026</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
