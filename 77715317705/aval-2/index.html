<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>

    <link rel="stylesheet" href="./style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>


<body>

    <header class="header">
        <h2>MiniFeed</h2>

        <nav>
            <a href="#">Início</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main class="container">

        <section class="create-post">

            <div class="avatar">J</div>

            <div class="input-area">
                <strong>Jonathan</strong>
                <input type="text" placeholder="O que você está pensando?">
            </div>

            <button>Publicar</button>

        </section>

        <section class="feed">

            <article class="post">

                <div class="post-header">

                    <div class="avatar">M</div>

                    <div>
                        <strong>Maria</strong>
                        <small>Há 10 minutos</small>
                    </div>

                </div>

                <p>
                    Hoje eu vi o novo filme do homem-aranha,
                    top, to feliz :D
                </p>

                <img
                    class="post-image"
                    src="https://images.unsplash.com/photo-1635805737707-575885ab0820?w=700"
                    alt="Imagem temática de super-herói"
                >

                <div class="post-actions">
                    <button>♡ Curtir</button>
                    <button>💬 Comentar</button>
                    <button>↗ Compartilhar</button>
                </div>

            </article>

            <article class="post">

                <div class="post-header">

                    <div class="avatar avatar-blue">A</div>

                    <div>
                        <strong>André</strong>
                        <small>Há 30 minutos</small>
                    </div>

                </div>

                <p>
                    Mais um dia aprendendo programação! 🚀
                </p>

                <div class="post-actions">
                    <button>♡ Curtir</button>
                    <button>💬 Comentar</button>
                    <button>↗ Compartilhar</button>
                </div>

            </article>

        </section>

    </main>

</body>
<footer>
    © 2026 Mini Feed. Todos os direitos reservados.
</footer>
</html>
