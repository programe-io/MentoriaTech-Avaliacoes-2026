
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Luiz</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topo">
    <h1>Instagram</h1>
    <input type="text" id="pesquisa" placeholder="Pesquisar">
    <div class="perfil-topo">
        <img src="https://randomuser.me/api/portraits/men/45.jpg" alt="Luiz">
        <span>Luiz</span>
    </div>
</header>

<main class="container">

    <section class="feed">

        <div class="stories">
            <div class="story">
                <img src="https://randomuser.me/api/portraits/men/45.jpg">
                <span>Seu story</span>
            </div>

            <div class="story">
                <img src="https://randomuser.me/api/portraits/women/44.jpg">
                <span>Mariana</span>
            </div>

            <div class="story">
                <img src="https://randomuser.me/api/portraits/men/22.jpg">
                <span>Gabriel</span>
            </div>

            <div class="story">
                <img src="https://randomuser.me/api/portraits/women/68.jpg">
                <span>Isabela</span>
            </div>

            <div class="story">
                <img src="https://randomuser.me/api/portraits/men/76.jpg">
                <span>Rafael</span>
            </div>

            <div class="story">
                <img src="https://randomuser.me/api/portraits/women/32.jpg">
                <span>Camila</span>
            </div>
        </div>

        <article class="publicacao">
            <div class="usuario">
                <img src="https://randomuser.me/api/portraits/women/44.jpg">
                <strong>Mariana</strong>
            </div>

            <img class="foto-post" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Paisagem">

            <div class="acoes">
                <button class="curtir">♡ Curtir</button>
                <button class="comentar">Comentar</button>
                <button class="compartilhar">Enviar</button>
            </div>

            <p><strong>Mariana</strong> Aproveitando cada momento! ☀️</p>
            <p class="likes">12 curtidas</p>
            <div class="comentarios"></div>

            <form class="form-comentario">
                <input type="text" placeholder="Adicione um comentário...">
                <button type="submit">Publicar</button>
            </form>
        </article>

        <article class="publicacao">
            <div class="usuario">
                <img src="https://randomuser.me/api/portraits/men/22.jpg">
                <strong>Gabriel</strong>
            </div>

            <img class="foto-post" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800" alt="Praia">

            <div class="acoes">
                <button class="curtir">♡ Curtir</button>
                <button class="comentar">Comentar</button>
                <button class="compartilhar">Enviar</button>
            </div>

            <p><strong>Gabriel</strong> Que lugar incrível! 🌊</p>
            <p class="likes">25 curtidas</p>
            <div class="comentarios"></div>

            <form class="form-comentario">
                <input type="text" placeholder="Adicione um comentário...">
                <button type="submit">Publicar</button>
            </form>
        </article>

        <article class="publicacao">
            <div class="usuario">
                <img src="https://randomuser.me/api/portraits/women/68.jpg">
                <strong>Isabela</strong>
            </div>

            <img class="foto-post" src="https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=800" alt="Natureza">

            <div class="acoes">
                <button class="curtir">♡ Curtir</button>
                <button class="comentar">Comentar</button>
                <button class="compartilhar">Enviar</button>
            </div>

            <p><strong>Isabela</strong> Um dia especial! 💗</p>
            <p class="likes">18 curtidas</p>
            <div class="comentarios"></div>

            <form class="form-comentario">
                <input type="text" placeholder="Adicione um comentário...">
                <button type="submit">Publicar</button>
            </form>
        </article>

    </section>

    <aside class="lateral">
        <div class="meu-perfil">
            <img src="https://randomuser.me/api/portraits/men/45.jpg">
            <div>
                <strong>Luiz</strong>
                <p>Meu perfil</p>
            </div>
        </div>

        <h4>Sugestões para você</h4>

        <div class="sugestao">
            <img src="https://randomuser.me/api/portraits/men/76.jpg">
            <span>Rafael</span>
            <button class="seguir">Seguir</button>
        </div>

        <div class="sugestao">
            <img src="https://randomuser.me/api/portraits/women/32.jpg">
            <span>Camila</span>
            <button class="seguir">Seguir</button>
        </div>

        <div class="sugestao">
            <img src="https://randomuser.me/api/portraits/women/44.jpg">
            <span>Mariana</span>
            <button class="seguir">Seguir</button>
        </div>

        <div class="sugestao">
            <img src="https://randomuser.me/api/portraits/men/22.jpg">
            <span>Gabriel</span>
            <button class="seguir">Seguir</button>
        </div>
    </aside>

</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
