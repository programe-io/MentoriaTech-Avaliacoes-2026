
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENATA - Meu Instagram</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="min-h-screen bg-gray-100 text-slate-900">

    <!-- CABEÇALHO -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">

        <div class="max-w-5xl mx-auto px-4">

            <div class="flex items-center justify-between h-14">

                <h1 class="text-2xl font-bold text-pink-600">
                    RENATA
                </h1>

                <button class="text-2xl">
                    <i class="bx bx-menu"></i>
                </button>

            </div>

        </div>

    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-5xl mx-auto py-4 pb-20 px-4">

        <div class="flex gap-8">

            <!-- FEED -->
            <div class="flex-1 max-w-lg mx-auto">

                <!-- STORIES -->
                <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">

                    <div class="flex gap-4 overflow-x-auto">

                        <!-- ADICIONAR STORY -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-2 bg-gray-100">

                                <div class="w-full h-full rounded-full bg-white">

                                    <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">

                                        <span class="text-2xl text-gray-500">+</span>

                                    </div>

                                </div>

                            </div>

                            <span class="text-xs mt-1 text-center w-16">
                                Seu story
                            </span>

                        </div>

                        <!-- STORY 1 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-1 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img src="https://i.pravatar.cc/150?img=47"
                                    class="w-full h-full object-cover rounded-full">

                                </div>

                            </div>

                            <span class="text-xs mt-1 text-center w-16">
                                Maria
                            </span>

                        </div>

                        <!-- STORY 2 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-1 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img src="https://i.pravatar.cc/150?img=44"
                                    class="w-full h-full object-cover rounded-full">

                                </div>

                            </div>

                            <span class="text-xs mt-1 text-center w-16">
                                Ana
                            </span>

                        </div>

                        <!-- STORY 3 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-1 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img src="https://i.pravatar.cc/150?img=49"
                                    class="w-full h-full object-cover rounded-full">

                                </div>

                            </div>

                            <span class="text-xs mt-1 text-center w-16">
                                Júlia
                            </span>

                        </div>

                        <!-- STORY 4 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-1 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img src="https://i.pravatar.cc/150?img=45"
                                    class="w-full h-full object-cover rounded-full">

                                </div>

                            </div>

                            <span class="text-xs mt-1 text-center w-16">
                                Carla
                            </span>

                        </div>

                    </div>

                </section>

                <!-- PUBLICAÇÃO 1 -->
                <article class="bg-white border border-gray-200 rounded-lg mb-4">

                    <!-- CABEÇALHO DA PUBLICAÇÃO -->
                    <header class="flex items-center justify-between p-3">

                        <div class="flex items-center gap-3">

                            <div class="w-10 h-10 rounded-full p-1 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <img src="https://i.pravatar.cc/150?img=47"
                                class="w-full h-full rounded-full object-cover">

                            </div>

                            <div>
                                <h2 class="font-semibold text-sm">
                                    renata
                                </h2>

                                <p class="text-xs text-gray-500">
                                    Brasil
                                </p>
                            </div>

                        </div>

                        <i class="bx bx-dots-horizontal-rounded text-xl"></i>

                    </header>

                    <!-- FOTO DA PUBLICAÇÃO -->
                    <img src="https://picsum.photos/600/600?random=10"
                    class="w-full object-cover">

                    <!-- AÇÕES -->
                    <div class="p-3">

                        <div class="flex items-center justify-between text-2xl">

                            <div class="flex gap-4">
                                <i class="bx bx-heart"></i>
                                <i class="bx bx-message-rounded"></i>
                                <i class="bx bx-send"></i>
                            </div>

                            <i class="bx bx-bookmark"></i>

                        </div>

                        <p class="font-semibold text-sm mt-3">
                            120 curtidas
                        </p>

                        <p class="text-sm mt-1">
                            <strong>renata</strong>
                            Bem-vindos ao meu espaço! ❤️
                        </p>

                        <p class="text-xs text-gray-400 mt-2">
                            Ver todos os comentários
                        </p>

                    </div>

                </article>

                <!-- PUBLICAÇÃO 2 -->
                <article class="bg-white border border-gray-200 rounded-lg mb-4">

                    <header class="flex items-center justify-between p-3">

                        <div class="flex items-center gap-3">

                            <img src="https://i.pravatar.cc/150?img=44"
                            class="w-10 h-10 rounded-full object-cover">

                            <div>
                                <h2 class="font-semibold text-sm">
                                    maria
                                </h2>

                                <p class="text-xs text-gray-500">
                                    Minha vida
                                </p>
                            </div>

                        </div>

                        <i class="bx bx-dots-horizontal-rounded text-xl"></i>

                    </header>

                    <img src="https://picsum.photos/600/600?random=20"
                    class="w-full object-cover">

                    <div class="p-3">

                        <div class="flex items-center justify-between text-2xl">

                            <div class="flex gap-4">
                                <i class="bx bx-heart"></i>
                                <i class="bx bx-message-rounded"></i>
                                <i class="bx bx-send"></i>
                            </div>

                            <i class="bx bx-bookmark"></i>

                        </div>

                        <p class="font-semibold text-sm mt-3">
                            85 curtidas
                        </p>

                        <p class="text-sm mt-1">
                            <strong>maria</strong>
                            Aproveitando os bons momentos! 🌸
                        </p>

                    </div>

                </article>

            </div>

        </div>

    </main>

</body>
</html>
