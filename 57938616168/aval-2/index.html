<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>MiniFeed - Ana Beatriz</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <main class="feed-container">
                            <!-- Cabeçalho do Post -->
                                    <header class="post-header">
                                                <!-- Sua foto adicionada no perfil -->
                                                            <img src="https://i.ibb.co/wZ1LqKv0/Film-Cam-FC-100-20260329-162503901.jpg" alt="Foto de perfil de Ana Beatriz" class="profile-instagram">
                                                                        <div class="user-info">
                                                                                        <span class="username">Ana Beatriz</span>
                                                                                                        <span class="location">Piauí , Brazil</span>
                                                                                                                    </div>
                                                                                                                            </header>

                                                                                                                                    <!-- Imagem do Post (Tamanho Médio) -->
                                                                                                                                            <div class="post-image-container">
                                                                                                                                                        <!-- Sua foto adicionada no post principal -->
                                                                                                                                                                    <img src="https://i.ibb.co/wZ1LqKv0/Film-Cam-FC-100-20260329-162503901.jpg" alt="Post de Ana Beatriz" class="post-image-medium">
                                                                                                                                                                            </div>

                                                                                                                                                                                    <!-- Barra de Interações (Curtidas e Contador) -->
                                                                                                                                                                                            <section class="post-actions">
                                                                                                                                                                                                        <div class="action-buttons">
                                                                                                                                                                                                                        <button class="btn-like">💖 Curtir</button>
                                                                                                                                                                                                                                        <button class="btn-comment">💬 Comentar</button>
                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                <p class="likes-count">✨ <strong>1.240 pessoas</strong> curtiram isso</p>
                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                <!-- Seção de Comentários Fofos com Emojis Engraçados -->
                                                                                                                                                                                                                                                                                        <section class="comments-section">
                                                                                                                                                                                                                                                                                                    <div class="comment-item">
                                                                                                                                                                                                                                                                                                                    <span class="comment-avatar">🥰</span>
                                                                                                                                                                                                                                                                                                                                    <p><strong>Mariana:</strong> Que foto mais linda! Você passa uma energia tão leve! ✨</p>
                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                            <div class="comment-item">
                                                                                                                                                                                                                                                                                                                                                                            <span class="comment-avatar">🤪</span>
                                                                                                                                                                                                                                                                                                                                                                                            <p><strong>Lucas:</strong> Simplesmente perfeita, arrasou muito! 🌸</p>
                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="comment-item">
                                                                                                                                                                                                                                                                                                                                                                                                                                    <span class="comment-avatar">💅</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p><strong>Beatriz:</strong> Coisa mais fofa desse mundo, amei o look! 💕</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
