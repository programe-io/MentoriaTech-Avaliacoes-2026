<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h1>Calculadora de IMC</h1>
    <p class="subtitulo">Informe seu peso e altura para calcular</p>

    <form id="form-imc">
      <div class="campo">
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" step="0.1" min="1" max="500" placeholder="Ex: 70.5" required>
      </div>

      <div class="campo">
        <label for="altura">Altura (m)</label>
        <input type="number" id="altura" step="0.01" min="0.5" max="2.5" placeholder="Ex: 1.75" required>
      </div>

      <div class="botoes">
        <button type="submit" class="btn-calcular">Calcular</button>
        <button type="button" class="btn-limpar" id="btn-limpar">Limpar</button>
      </div>
    </form>

    <div id="caixa-resultado" class="resultado">
      <h2 id="valor-imc">0.00</h2>
      <p id="classificacao-imc">Classificação</p>
    </div>

    <div id="caixa-historico" class="historico">
      <h3>Últimos cálculos</h3>
      <ul id="lista-historico"></ul>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
