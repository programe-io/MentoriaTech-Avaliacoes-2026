
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Sistema de Estoque</h1>

        <h3>Cadastrar Produto</h3>

        <input type="text" id="descricao" placeholder="Descrição do produto">
        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="number" id="valor" placeholder="Valor">

        <button onclick="cadastrar()">Cadastrar</button>
        <button onclick="listar()">Listar Produtos</button>

        <h3>Alterar Produto</h3>

        <input type="number" id="codigo" placeholder="Código do produto">
        <input type="number" id="novoValor" placeholder="Novo valor">
        <button onclick="alterarValor()">Alterar Valor</button>

        <input type="number" id="novaQuantidade" placeholder="Quantidade a adicionar">
        <button onclick="alterarQuantidade()">Alterar Quantidade</button>

        <div id="listaProdutos"></div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
