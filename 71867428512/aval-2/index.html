
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organiza+ | Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topo">
        <h1>Organiza+</h1>
        <p>Planeje suas tarefas e organize seu dia.</p>
    </header>

    <main class="container">

        <section class="painel">
            <div>
                <span>Tarefas cadastradas</span>
                <strong id="total">0</strong>
            </div>
            <div>
                <span>Pendentes</span>
                <strong id="pendentes">0</strong>
            </div>
            <div>
                <span>Concluídas</span>
                <strong id="concluidas">0</strong>
            </div>
        </section>

        <section class="formulario">
            <h2>Cadastrar tarefa</h2>

            <form id="formTarefa">
                <label for="titulo">Nome da tarefa</label>
                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o nome da tarefa"
                    required
                >

                <label for="descricao">Descrição</label>
                <textarea
                    id="descricao"
                    placeholder="Descreva sua tarefa"
                ></textarea>

                <div class="campos">
                    <div>
                        <label for="prioridade">Prioridade</label>
                        <select id="prioridade">
                            <option value="Baixa">Baixa</option>
                            <option value="Média">Média</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>

                    <div>
                        <label for="categoria">Categoria</label>
                        <select id="categoria">
                            <option value="Estudos">Estudos</option>
                            <option value="Pessoal">Pessoal</option>
                            <option value="Trabalho">Trabalho</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                </div>

                <label for="prazo">Data de conclusão</label>
                <input type="date" id="prazo">

                <button type="submit" id="salvar">Adicionar tarefa</button>
                <button type="button" id="cancelar" hidden>
                    Cancelar edição
                </button>
            </form>
        </section>

        <section class="area-lista">
            <h2>Minhas tarefas</h2>

            <input
                type="search"
                id="pesquisa"
                placeholder="Pesquisar tarefa..."
            >

            <div class="filtros">
                <select id="filtroStatus">
                    <option value="todas">Todas</option>
                    <option value="pendente">Pendentes</option>
                    <option value="concluida">Concluídas</option>
                </select>

                <select id="filtroCategoria">
                    <option value="todas">Todas as categorias</option>
                    <option value="Estudos">Estudos</option>
                    <option value="Pessoal">Pessoal</option>
                    <option value="Trabalho">Trabalho</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <div id="listaTarefas"></div>
        </section>

    </main>

    <footer>
        <p>Organiza+ - Gerenciador de Tarefas</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
