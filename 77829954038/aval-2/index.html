<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <body>

  <!-- CABEÇALHO -->
  <header>

    <div class="logo">
      MineFeed
    </div>

    <input
      class="pesquisa"
      type="text"
      placeholder="Pesquisar..."
    >

    <div class="menu">
      <span>⌂</span>
      <span>♡</span>
      <span>☰</span>
    </div>

  </header>


  <div class="container">

    <!-- STORIES -->
    <div class="stories">

      <div class="story">
        <img src="https://i.pravatar.cc/100?img=1">
        <p>Você</p>
      </div>

      <div class="story">
        <img src="https://i.pravatar.cc/100?img=2">
        <p>Lucas</p>
      </div>

      <div class="story">
        <img src="https://i.pravatar.cc/100?img=3">
        <p>Ana</p>
      </div>

      <div class="story">
        <img src="https://i.pravatar.cc/100?img=4">
        <p>Pedro</p>
      </div>

      <div class="story">
        <img src="https://i.pravatar.cc/100?img=5">
        <p>Maria</p>
      </div>

      <div class="story">
        <img src="https://i.pravatar.cc/100?img=6">
        <p>João</p>
      </div>

    </div>


    <!-- CRIAR POST -->
    <div class="criar-post">

      <textarea
        id="textoPost"
        placeholder="O que você está pensando?"
      ></textarea>

      <button class="botao" onclick="criarPost()">
        Publicar
      </button>

    </div>


    <!-- FEED -->

    <div id="feed">

      <!-- POST 1 -->
      <article class="post">

        <div class="post-header">
          <img src="https://i.pravatar.cc/100?img=12">

          <div>
            <div class="usuario">mine_user</div>
            <small>Há 10 minutos</small>
          </div>
        </div>

        <img
          class="post-imagem"
          src="https://picsum.photos/600/600?random=10"
        >

        <div class="acoes">

          <span onclick="curtir(this)">
            ♡
          </span>

          <span>
            💬
          </span>

          <span>
            ↗
          </span>

        </div>

        <div class="post-conteudo">

          <div class="curtidas">
            128 curtidas
          </div>

          <div class="legenda">
            <b>mine_user</b>
            Aproveitando o dia! 🌎✨
          </div>

          <div class="comentarios">
            Ver todos os 12 comentários
          </div>

        </div>

      </article>


      <!-- POST 2 -->
      <article class="post">

        <div class="post-header">

          <img src="https://i.pravatar.cc/100?img=20">

          <div>
            <div class="usuario">ana_dev</div>
            <small>Há 1 hora</small>
          </div>

        </div>

        <img
          class="post-imagem"
          src="https://picsum.photos/600/600?random=20"
        >

        <div class="acoes">

          <span onclick="curtir(this)">
            ♡
          </span>

          <span>💬</span>

          <span>↗</span>

        </div>

        <div class="post-conteudo">

          <div class="curtidas">
            256 curtidas
          </div>

          <div class="legenda">
            <b>ana_dev</b>
            Mais um projeto saindo! 💻🚀
          </div>

          <div class="comentarios">
            Ver todos os 24 comentários
          </div>

        </div>

      </article>

    </div>

  </div>


  <script>

    /* CURTIR POST */

    function curtir(elemento) {

      elemento.classList.toggle("curtido");

      if (elemento.classList.contains("curtido")) {
        elemento.innerHTML = "♥";
      } else {
        elemento.innerHTML = "♡";
      }

    }


    /* CRIAR NOVO POST */

    function criarPost() {

      const texto =
        document.getElementById("textoPost").value.trim();

      if (texto === "") {
        alert("Digite alguma coisa antes de publicar!");
        return;
      }

      const feed =
        document.getElementById("feed");

      const novoPost =
        document.createElement("article");

      novoPost.className = "post";

      novoPost.innerHTML = `

        <div class="post-header">

          <img
            src="https://i.pravatar.cc/100?img=1"
          >

          <div>

            <div class="usuario">
              Você
            </div>

            <small>
              Agora
            </small>

          </div>

        </div>


        <div
          style="
            padding:25px;
            font-size:18px;
            line-height:1.5;
          "
        >
          ${texto}
        </div>


        <div class="acoes">

          <span onclick="curtir(this)">
            ♡
          </span>

          <span>
            💬
          </span>

          <span>
            ↗
          </span>

        </div>


        <div class="post-conteudo">

          <div class="curtidas">
            0 curtidas
          </div>

          <div class="legenda">
            <b>Você</b>
            publicou agora.
          </div>

        </div>

      `;

      feed.prepend(novoPost);

      document.getElementById("textoPost").value = "";

    }

  </script>

</body>
</html>

  
  
</body>
</html>
