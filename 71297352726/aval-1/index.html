
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Produtos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <header>
            <h1>Controle de Produtos</h1>
            <p>Cadastre e gerencie seus produtos</p>
        </header>

        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formCadastro">
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex.: Cadeira gamer"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        step="1"
                        placeholder="Ex.: 10"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input
                        type="number"
                        id="valor"
                        min="0"
                        step="0.01"
                        placeholder="Ex.: 699.00"
                        required
                    >
                </div>

                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section class="card">
            <h2>Atualizar produto</h2>

            <form id="formAtualizacao">
                <div class="campo">
                    <label for="codigoAtualizacao">Código do produto</label>
                    <input
                        type="number"
                        id="codigoAtualizacao"
                        min="1"
                        step="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">Novo valor (R$)</label>
                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit">Atualizar preço</button>
            </form>

            <form id="formQuantidade" class="form-quantidade">
                <div class="campo">
                    <label for="codigoQuantidade">Código do produto</label>
                    <input
                        type="number"
                        id="codigoQuantidade"
                        min="1"
                        step="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="novaQuantidade">Quantidade a adicionar</label>
                    <input
                        type="number"
                        id="novaQuantidade"
                        min="1"
                        step="1"
                        required
                    >
                </div>

                <button type="submit">Adicionar quantidade</button>
            </form>
        </section>

        <section class="card">
            <h2>Produtos cadastrados</h2>

            <div id="mensagem" class="mensagem" role="status"
                 aria-live="polite"></div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor unitário</th>
                            <th>Total em estoque</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="5">Nenhum produto cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

<script src="script.js"></script></body>
</html>
