



<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Minhas Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="sidebar">
    <h2>✓ TaskFlow</h2>
    <p>MENU</p>
    <a href="#inicio">🏠 Dashboard</a>
    <a href="#tarefas">📋 Minhas tarefas</a>
    <a href="#cadastro">➕ Nova tarefa</a>
</div>

<main class="content">

    <header id="inicio">
        <div>
            <h1>Dashboard</h1>
            <p>Bem-vindo! Organize suas atividades.</p>
        </div>
        <span class="online">● Online</span>
    </header>

    <section class="cards">
        <div class="card">
            <p>Total de tarefas</p>
            <h2 id="total">0</h2>
        </div>

        <div class="card">
            <p>Pendentes</p>
            <h2 id="pendentes">0</h2>
        </div>

        <div class="card">
            <p>Concluídas</p>
            <h2 id="concluidas">0</h2>
        </div>
    </section>

    <section class="box" id="cadastro">
        <h2>Adicionar nova tarefa</h2>
        <p>Preencha os dados abaixo.</p>

        <form id="formTarefa">
            <input id="titulo" placeholder="Nome da tarefa" required>

            <select id="prioridade">
                <option value="Alta">Alta</option>
                <option value="Média">Média</option>
                <option value="Baixa">Baixa</option>
            </select>

            <button type="submit">+ Adicionar tarefa</button>
        </form>
    </section>

    <section class="box" id="tarefas">
        <h2>Minhas tarefas</h2>

        <input
            id="pesquisa"
            class="pesquisa"
            placeholder="🔎 Pesquisar tarefa..."
        >

        <div id="lista"></div>
    </section>

    <footer>
        TaskFlow © 2026 - Todos os direitos reservados.
    </footer>

</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
