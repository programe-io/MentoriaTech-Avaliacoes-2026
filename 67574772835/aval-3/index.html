
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Minhas Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topo">
        <div class="logo">Task<span>Flow.</span></div>
        <p>Organize suas tarefas e alcance seus objetivos.</p>
    </header>

    <main class="painel">

        <section class="formulario">
            <h2>Nova tarefa</h2>
            <p>Adicione uma atividade à sua lista.</p>

            <form id="formTarefa">

                <input
                    type="text"
                    id="codigo"
                    placeholder="Código da tarefa"
                    required
                >

                <input
                    type="text"
                    id="titulo"
                    placeholder="Nome da tarefa"
                    required
                >

                <select id="prioridade">
                    <option value="1">Prioridade alta</option>
                    <option value="2">Prioridade média</option>
                    <option value="3">Prioridade baixa</option>
                </select>

                <button type="submit">+ Adicionar tarefa</button>

            </form>
        </section>

        <section class="area-tarefas">

            <div class="cabecalho">
                <h2>Minhas atividades</h2>
                <span id="contador">0 tarefas</span>
            </div>

            <div id="listaTarefas" class="grade-tarefas">
                <p class="vazio">Nenhuma tarefa cadastrada ainda.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>TaskFlow © 2026 - Gerenciador de tarefas</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
