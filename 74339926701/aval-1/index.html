<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Controle de Estoque</h1>

        <!-- Formulário de Cadastro -->
        <section class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-cadastro">
                <input type="text" id="codigo" placeholder="Código (ex: P01)" required>
                <input type="text" id="descricao" placeholder="Descrição do produto" required>
                <input type="number" id="quantidade" placeholder="Quantidade" min="0" required>
                <input type="number" id="valor" placeholder="Valor (R$)" step="0.01" min="0" required>
                <button type="submit">Cadastrar</button>
            </form>
        </section>

        <!-- Formulário de Alteração -->
        <section class="card">
            <h2>Alterar Produto</h2>
            <div class="alterar-grid">
                <input type="text" id="codigo-busca" placeholder="Código do produto">
                
                <div class="acao-grupo">
                    <input type="number" id="novo-valor" placeholder="Novo Valor (R$)" step="0.01" min="0">
                    <button type="button" id="btn-alterar-valor">Alterar Valor</button>
                </div>

                <div class="acao-grupo">
                    <input type="number" id="nova-quantidade" placeholder="Nova Quantidade" min="0">
                    <button type="button" id="btn-alterar-qtd">Alterar Quantidade</button>
                </div>
            </div>
        </section>

        <!-- Listagem de Produtos -->
        <section class="card">
            <h2>Produtos Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor Unitário</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos">
                    <!-- Os produtos serão inseridos aqui pelo JavaScript -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
