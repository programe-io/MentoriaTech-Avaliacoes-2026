<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <!-- Cadastro de Tarefa -->
        <section class="card">
            <h2>Cadastrar Nova Tarefa</h2>
            <form id="form-cadastro">
                <input type="text" id="codigo" placeholder="Código (ex: T01)" required>
                <input type="text" id="titulo" placeholder="Título (mín. 5 caracteres)" required>
                <select id="prioridade" required>
                    <option value="">Selecione a Prioridade</option>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>
                <button type="submit">Cadastrar Tarefa</button>
            </form>
        </section>

        <!-- Ações na Tarefa -->
        <section class="card">
            <h2>Gerenciar Tarefa Existente</h2>
            <div class="acoes-grid">
                <input type="text" id="codigo-busca" placeholder="Informe o código da tarefa">
                
                <div class="acao-grupo">
                    <button type="button" id="btn-concluir" class="btn-sucesso">Marcar como Concluída</button>
                </div>

                <div class="acao-grupo">
                    <select id="nova-prioridade">
                        <option value="">Nova Prioridade (1 a 3)</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                    <button type="button" id="btn-alterar-prioridade" class="btn-primario">Alterar Prioridade</button>
                </div>
            </div>
        </section>

        <!-- Listagem de Tarefas -->
        <section class="card">
            <h2>Tarefas Cadastradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Título</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabela-tarefas">
                    <!-- Inserido dinamicamente pelo JS -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
