<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1>Minhas Tarefas</h1>
        <p id="contadorTexto" class="muted">0 de 0 concluídas</p>
      </div>
      <div class="header-actions">
        <button id="limparFeitasBtn" type="button" class="btn btn-ghost">
          Limpar concluídas
        </button>
      </div>
    </header>

    <section class="progress-box" aria-label="Progresso das tarefas">
      <div class="progress-bar-track">
        <div id="progressBarFill" class="progress-bar-fill"></div>
      </div>
      <span id="percentualTexto" class="progress-label">0%</span>
    </section>

    <form id="novoItemForm" class="quick-add">
      <input
        type="text"
        id="tituloInput"
        placeholder="Digite uma nova tarefa e pressione Enter..."
        autocomplete="off"
        required
      />
      <select id="nivelInput" aria-label="Nível de prioridade">
        <option value="normal">Normal</option>
        <option value="urgente">Urgente</option>
        <option value="leve">Leve</option>
      </select>
      <input type="date" id="prazoInput" aria-label="Prazo da tarefa" />
      <button type="submit" class="btn btn-primary">Adicionar</button>
    </form>

    <section class="controls-bar">
      <div class="tabs" role="tablist" aria-label="Filtrar tarefas">
        <button type="button" class="tab active" data-filtro="todas">Todas</button>
        <button type="button" class="tab" data-filtro="abertas">Em aberto</button>
        <button type="button" class="tab" data-filtro="feitas">Concluídas</button>
      </div>

      <div class="sort-group">
        <label for="ordenarSelect" class="muted">Ordenar:</label>
        <select id="ordenarSelect">
          <option value="recentes">Mais recentes</option>
          <option value="prioridade">Maior prioridade</option>
          <option value="prazo">Prazo mais próximo</option>
        </select>
      </div>
    </section>

    <main>
      <ul id="listaItens" class="todo-list"></ul>
      <p id="vazioMsg" class="empty-msg hidden">Nenhuma tarefa por aqui.</p>
    </main>
  </div>

  <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
