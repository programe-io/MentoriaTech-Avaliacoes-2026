
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eaf0f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #075985;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #0284c7;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #0284c7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        .limpar {
            margin-top: 10px;
            background: #64748b;
        }

        .resultado {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f1f5f9;
            line-height: 1.8;
        }

        .resultado h2 {
            text-align: center;
            color: #075985;
            margin-bottom: 15px;
        }

        .numero {
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            color: #0284c7;
            margin: 10px 0;
        }

        .classificacao {
            text-align: center;
            padding: 12px;
            border-radius: 7px;
            font-weight: bold;
            margin: 15px 0;
        }

        .baixo {
            background: #fef3c7;
            color: #92400e;
        }

        .normal {
            background: #dcfce7;
            color: #166534;
        }

        .sobrepeso {
            background: #ffedd5;
            color: #9a3412;
        }

        .obesidade {
            background: #fee2e2;
            color: #991b1b;
        }

    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Calculadora de IMC</h1>

        <p class="subtitulo">Avaliação do paciente</p>

        <form id="formIMC">

            <label for="nome">Nome do paciente:</label>
            <input type="text" id="nome"
                placeholder="Digite o nome" required>

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso"
                placeholder="Ex: 70" min="0.01"
                step="any" required>

            <label for="altura">Altura (metros):</label>
            <input type="number" id="altura"
                placeholder="Ex: 1.75" min="0.01"
                step="any" required>

            <button type="submit">CALCULAR IMC</button>

            <button type="reset" class="limpar">
                LIMPAR
            </button>

        </form>

        <div class="resultado" id="resultado">
        </div>

    </div>

    <script>
        const formulario = document.getElementById("formIMC");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            // Receber informações
            const nome = document.getElementById("nome").value.trim();
            const peso = Number(document.getElementById("peso").value);
            const altura = Number(document.getElementById("altura").value);

            // Validar informações
            if (nome.length < 2) {
                alert("Digite o nome do paciente!");
                return;
            }

            if (!Number.isFinite(peso) || peso <= 0) {
                alert("Digite um peso válido!");
                return;
            }

            if (!Number.isFinite(altura) || altura <= 0) {
                alert("Digite uma altura válida!");
                return;
            }

            // Calcular IMC
            const imc = peso / (altura * altura);

            let classificacao = "";
            let classe = "";

            // Classificar resultado
            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
                classe = "baixo";
            }
            else if (imc < 25) {
                classificacao = "Peso normal";
                classe = "normal";
            }
            else if (imc < 30) {
                classificacao = "Sobrepeso";
                classe = "sobrepeso";
            }
            else {
                classificacao = "Obesidade";
                classe = "obesidade";
            }

            // Mostrar resultado
            const resultado = document.getElementById("resultado");

            resultado.style.display = "block";

            resultado.innerHTML = `
                <h2>Resultado do Paciente</h2>

                <p><strong>Nome:</strong> ${nome.replace(/[&<>"']/g, c => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                })[c])}</p>

                <p><strong>Peso:</strong> ${peso} kg</p>

                <p><strong>Altura:</strong> ${altura} m</p>

                <p class="numero">${imc.toFixed(2)}</p>

                <div class="classificacao ${classe}">
                    ${classificacao}
                </div>

                <p>
                    O resultado representa o Índice de Massa Corporal
                    do paciente, utilizado como indicador geral.
                </p>
            `;

        });

        // Limpar resultado
        formulario.addEventListener("reset", function() {
            document.getElementById("resultado").style.display = "none";
            document.getElementById("resultado").innerHTML = "";
        });

    </script>

<script src="script.js"></script></body>
</html>
