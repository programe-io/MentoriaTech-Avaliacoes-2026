
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🏥 Sistema de Avaliação de IMC</h1>
        <p>Calculadora de Índice de Massa Corporal</p>
    </header>

    <main class="container">

        <section class="formulario">

            <h2>Dados do Paciente</h2>

            <form id="formIMC">

                <div class="campo">
                    <label for="nome">Nome do Paciente</label>
                    <input type="text" id="nome"
                        placeholder="Digite o nome do paciente" required>
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso"
                        placeholder="Ex: 70"
                        min="0.01" step="any" required>
                </div>

                <div class="campo">
                    <label for="altura">Altura (metros)</label>
                    <input type="number" id="altura"
                        placeholder="Ex: 1.75"
                        min="0.01" step="any" required>
                </div>

                <button type="submit">Calcular IMC</button>

                <button type="reset" class="limpar">
                    Limpar Dados
                </button>

            </form>

        </section>

        <section class="resultado" id="resultado">

            <h2>Resultado da Avaliação</h2>

            <p class="mensagem">
                Preencha os dados do paciente para calcular o IMC.
            </p>

        </section>

    </main>

    <footer>
        <p>Projeto de Cálculo de IMC - HTML, CSS e JavaScript</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
