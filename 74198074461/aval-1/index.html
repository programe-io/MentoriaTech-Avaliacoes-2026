
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Controle de Estoque</h1>
        <p>Gerenciamento de produtos</p>
    </header>

    <main class="container">

        <section class="resumo">
            <div class="card">
                <h3>Total de Produtos</h3>
                <p id="totalProdutos">0</p>
            </div>

            <div class="card">
                <h3>Quantidade em Estoque</h3>
                <p id="totalQuantidade">0</p>
            </div>

            <div class="card">
                <h3>Valor do Estoque</h3>
                <p id="valorEstoque">R$ 0,00</p>
            </div>
        </section>

        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label>Código do Produto</label>
                    <input type="text" id="codigo"
                        placeholder="Ex: 001" required>
                </div>

                <div class="campo">
                    <label>Descrição</label>
                    <input type="text" id="descricao"
                        placeholder="Nome do produto" required>
                </div>

                <div class="campo">
                    <label>Quantidade</label>
                    <input type="number" id="quantidade"
                        min="0" placeholder="Quantidade" required>
                </div>

                <div class="campo">
                    <label>Valor (R$)</label>
                    <input type="number" id="valor"
                        min="0" step="0.01"
                        placeholder="0.00" required>
                </div>

                <button type="submit">Cadastrar Produto</button>

            </form>
        </section>

        <section class="estoque">
            <h2>Produtos Cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
