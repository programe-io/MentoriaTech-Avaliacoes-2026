
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazenda Segura</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🐄 Fazenda Segura</h1>
    <p>Sistema inteligente de controle rural 🌱</p>
</header>

<main>
    <section class="resumo">
        <div class="card">
            <h3>🐮 Total de animais</h3>
            <p id="total">0</p>
        </div>

        <div class="card">
            <h3>🐑 Espécies cadastradas</h3>
            <p id="especies">0</p>
        </div>

        <div class="card">
            <h3>🍃 Registros de alimentação</h3>
            <p id="alimentacoes">0</p>
        </div>
    </section>

    <section class="painel">
        <h2>➕ Cadastrar animal</h2>

        <form id="formAnimal">
            <input type="text" id="nome" placeholder="Nome do animal" required>

            <select id="especie" required>
                <option value="">Escolha a espécie</option>
                <option value="Bovino">🐄 Bovino</option>
                <option value="Ovino">🐑 Ovino</option>
                <option value="Caprino">🐐 Caprino</option>
                <option value="Suíno">🐖 Suíno</option>
                <option value="Equino">🐎 Equino</option>
                <option value="Ave">🐔 Ave</option>
            </select>

            <input type="number" id="idade" placeholder="Idade em anos" min="0" required>

            <button type="submit">Cadastrar animal</button>
        </form>
    </section>

    <section class="painel">
        <h2>📋 Animais cadastrados</h2>

        <input type="text" id="busca" placeholder="🔎 Buscar animal...">

        <div id="listaAnimais"></div>
    </section>

    <section class="painel">
        <h2>🍃 Registrar alimentação</h2>

        <form id="formAlimentacao">
            <select id="animalAlimentado" required>
                <option value="">Selecione o animal</option>
            </select>

            <input type="text" id="comida" placeholder="Tipo de alimentação" required>

            <button type="submit">Registrar alimentação</button>
        </form>

        <div id="listaAlimentacao"></div>
    </section>
</main>

<footer>
    <p>🌱 Fazenda Segura © 2026 | Cuidando dos animais!</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
