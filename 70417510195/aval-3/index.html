<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gerenciador de Tarefas JS</title>
                <link rel="stylesheet" href="style.css">
                    <!-- Font Awesome para ícones -->
                        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
                        <body>
                            <div class="container">
                                    <!-- Header -->
                                            <header class="header">
                                                        <div class="logo">
                                                                        <i class="fa-brands fa-js-square"></i>
                                                                                        <h1>TaskManager.js</h1>
                                                                                                    </div>
                                                                                                                <p>Sistema de Gerenciamento de Tarefas</p>
                                                                                                                        </header>

                                                                                                                                <!-- Form de Cadastro -->
                                                                                                                                        <section class="card form-card">
                                                                                                                                                    <h2><i class="fa-solid fa-plus-circle"></i> Cadastrar Nova Tarefa</h2>
                                                                                                                                                                <form id="taskForm">
                                                                                                                                                                                <div class="form-group">
                                                                                                                                                                                                    <label for="taskTitle">Título da Tarefa</label>
                                                                                                                                                                                                                        <input type="text" id="taskTitle" placeholder="Ex: Implementar módulo de autenticação" required>
                                                                                                                                                                                                                                            <span class="error-msg" id="titleError">O título deve ter no mínimo 5 caracteres.</span>
                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                            <div class="form-group">
                                                                                                                                                                                                                                                                                                <label for="taskPriority">Prioridade</label>
                                                                                                                                                                                                                                                                                                                    <select id="taskPriority" required>
                                                                                                                                                                                                                                                                                                                                            <option value="1">1 - Alta</option>
                                                                                                                                                                                                                                                                                                                                                                    <option value="2" selected>2 - Média</option>
                                                                                                                                                                                                                                                                                                                                                                                            <option value="3">3 - Baixa</option>
                                                                                                                                                                                                                                                                                                                                                                                                                </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                <button type="submit" class="btn btn-primary">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <i class="fa-solid fa-plus"></i> Adicionar Tarefa
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Lista de Tarefas -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <section class="card list-card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="list-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2><i class="fa-solid fa-list-check"></i> Lista de Tarefas</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="stats" id="taskStats">0 tarefas</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="table-responsive">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Código</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <th>Título</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Prioridade</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <th>Estado</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Ações</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <tbody id="taskList">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Tarefas inseridas via JS -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="emptyState" class="empty-state">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <i class="fa-regular fa-clipboard"></i>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>Nenhuma tarefa cadastrada até ao momento.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
