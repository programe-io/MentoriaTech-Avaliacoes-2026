
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>CyberComponent Studio | Lab de DOM & Eventos</title>
                <!-- Google Fonts -->
                    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
                        <!-- FontAwesome -->
                            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                                <!-- CSS Separado -->
                                    <link rel="stylesheet" href="style.css">
                                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
                                    <body>
                                        <div class="matrix-bg"></div>

                                            <div class="app-container">
                                                    <!-- HEADER -->
                                                            <header class="app-header">
                                                                        <div class="logo-area">
                                                                                        <i class="fa-solid fa-wand-magic-sparkles neon-pulse"></i>
                                                                                                        <h1>Cyber<span>Component</span> <span class="badge-lab">DOM STUDIO</span></h1>
                                                                                                                    </div>
                                                                                                                                <p class="subtitle">Laboratório de Eventos, Elementos e Estilos Dinâmicos via JavaScript</p>
                                                                                                                                        </header>

                                                                                                                                                <!-- PAINEL DE CONTROLE / FORMULÁRIO -->
                                                                                                                                                        <section class="control-panel">
                                                                                                                                                                    <h2><i class="fa-solid fa-gears"></i> Construtor de Elementos</h2>
                                                                                                                                                                                
                                                                                                                                                                                            <div class="form-grid">
                                                                                                                                                                                                            <div class="input-group">
                                                                                                                                                                                                                                <label for="elementType"><i class="fa-solid fa-shapes"></i> Tipo de Elemento</label>
                                                                                                                                                                                                                                                    <select id="elementType">
                                                                                                                                                                                                                                                                            <option value="card">Card Futurista</option>
                                                                                                                                                                                                                                                                                                    <option value="button">Botão Neon</option>
                                                                                                                                                                                                                                                                                                                            <option value="alert">Alerta do Sistema</option>
                                                                                                                                                                                                                                                                                                                                                    <option value="badge">Badge de Status</option>
                                                                                                                                                                                                                                                                                                                                                                        </select>
                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                        <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                            <label for="elementText"><i class="fa-solid fa-pen"></i> Texto do Elemento</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" id="elementText" value="Protocolo Ativado" placeholder="Digite o conteúdo...">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label for="elementTheme"><i class="fa-solid fa-palette"></i> Estilo / Cor Base</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <select id="elementTheme">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="cyan">Ciano Neon</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="pink">Rosa Choque</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="green">Verde Matrix</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="yellow">Amper Alerta</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="animToggle"><i class="fa-solid fa-bolt"></i> Animação de Entrada</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <select id="animToggle">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="pulse">Efeito Pulso</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="slide">Deslizar Lateral</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="zoom">Zoom In</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="action-buttons">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button id="createElementBtn" class="btn-neon-primary">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <i class="fa-solid fa-plus"></i> Criar Elemento Dinamicamente
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="clearAllBtn" class="btn-neon-danger">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <i class="fa-solid fa-trash-can"></i> Remover Todos
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- PAINEL DE ÁREA DE TESTES DE EVENTOS E DOM -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <section class="stage-section">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="stage-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h2><i class="fa-solid fa-desktop"></i> Palco de Execução (DOM Sandbox)</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <span id="elementCounter" class="counter-badge">Elementos Ativos: 0</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="dynamicStage" class="dynamic-stage">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Elementos criados via JS vão aparecer aqui -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="stage-placeholder" id="stagePlaceholder">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <i class="fa-solid fa-code"></i>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>Nenhum elemento instanciado. Utilize o construtor acima para gerar nós no DOM via JavaScript.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- JS Separado -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
