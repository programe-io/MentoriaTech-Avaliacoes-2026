
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>CyberPulse | Loja de Eletrônicos & Estoque</title>
                <!-- Google Fonts -->
                    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
                        <!-- FontAwesome -->
                            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                                <!-- CSS Separado -->
                                    <link rel="stylesheet" href="style.css">
                                    <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
                                    <body>
                                        <div class="cyber-bg"></div>

                                            <div class="app-container">
                                                    <!-- HEADER -->
                                                            <header class="app-header">
                                                                        <div class="logo-area">
                                                                                        <i class="fa-solid fa-microchip neon-pulse"></i>
                                                                                                        <h1>Cyber<span>Pulse</span> <span class="badge-store">ESTOQUE & LOJA</span></h1>
                                                                                                                    </div>
                                                                                                                                <p class="subtitle">Next-Gen Electronic Inventory & Smart Checkout</p>
                                                                                                                                            
                                                                                                                                                        <div class="header-actions">
                                                                                                                                                                        <button id="openCartBtn" class="btn-neon-cart">
                                                                                                                                                                                            <i class="fa-solid fa-cart-shopping"></i> Carrinho <span id="cartCountBadge" class="cart-badge">0</span>
                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                </header>

                                                                                                                                                                                                                                        <!-- DASHBOARD DE MÉTRICAS -->
                                                                                                                                                                                                                                                <section class="stats-grid">
                                                                                                                                                                                                                                                            <div class="stat-card">
                                                                                                                                                                                                                                                                            <div class="stat-icon cyan"><i class="fa-solid fa-boxes-stacked"></i></div>
                                                                                                                                                                                                                                                                                            <div class="stat-info">
                                                                                                                                                                                                                                                                                                                <span id="statTotalItems" class="stat-number">0</span>
                                                                                                                                                                                                                                                                                                                                    <span class="stat-label">Modelos em Estoque</span>
                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                            <div class="stat-card">
                                                                                                                                                                                                                                                                                                                                                                                            <div class="stat-icon pink"><i class="fa-solid fa-warehouse"></i></div>
                                                                                                                                                                                                                                                                                                                                                                                                            <div class="stat-info">
                                                                                                                                                                                                                                                                                                                                                                                                                                <span id="statTotalStock" class="stat-number">0</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span class="stat-label">Unidades Físicas</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="stat-card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="stat-icon green"><i class="fa-solid fa-cash-register"></i></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="stat-info">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <span id="statTotalSales" class="stat-number">R$ 0,00</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span class="stat-label">Vendas Realizadas</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- CATÁLOGO DE PRODUTOS -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <section class="catalog-section">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="section-title-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2><i class="fa-solid fa-bolt"></i> Vitrine de Aparelhos</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="search-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <i class="fa-solid fa-magnifying-glass"></i>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="searchInput" placeholder="Buscar eletrônicos...">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="productsGrid" class="products-grid">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Preenchido via JavaScript -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- MODAL DO CARRINHO DE COMPRAS / CHECKOUT -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="cartModal" class="modal-overlay hidden">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="modal-content">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="modal-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h3><i class="fa-solid fa-cart-shopping"></i> Carrinho CyberPulse</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button id="closeCartBtn" class="btn-close"><i class="fa-solid fa-xmark"></i></button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="cartItemsList" class="cart-items-list">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Itens do carrinho aqui -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="modal-footer">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="cart-total-area">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span>Total do Pedido:</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <span id="cartTotalPrice" class="total-price">R$ 0,00</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button id="checkoutBtn" class="btn-neon-primary">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <i class="fa-solid fa-shield-halved"></i> Finalizar Compra & Baixa no Estoque
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- JS Separado -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
