<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>TaskPulse // Gerenciador de Tarefas</title>
                <link rel="stylesheet" href="style.css">
                    <!-- Google Fonts -->
                        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
                        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                        <body>
                            <div class="container">
                                    <header>
                                                <h1>TASK<span>PULSE</span></h1>
                                                            <p>Sistema de Gerenciamento Operacional</p>
                                                                    </header>

                                                                            <section class="task-input-section">
                                                                                        <form id="task-form">
                                                                                                        <input type="text" id="task-input" placeholder="Digite uma nova tarefa..." required autocomplete="off">
                                                                                                                        <select id="task-category">
                                                                                                                                            <option value="frontend">Frontend</option>
                                                                                                                                                                <option value="backend">Backend</option>
                                                                                                                                                                                    <option value="cyber">Cybersecurity</option>
                                                                                                                                                                                                        <option value="geral">Geral</option>
                                                                                                                                                                                                                        </select>
                                                                                                                                                                                                                                        <button type="submit" id="btn-add">Adicionar [ + ]</button>
                                                                                                                                                                                                                                                    </form>
                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                    <section class="task-stats">
                                                                                                                                                                                                                                                                                <div class="stat-card">Total: <span id="count-total">0</span></div>
                                                                                                                                                                                                                                                                                            <div class="stat-card">Concluídas: <span id="count-completed">0</span></div>
                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                            <section class="task-list-section">
                                                                                                                                                                                                                                                                                                                        <ul id="task-list">
                                                                                                                                                                                                                                                                                                                                        <!-- As tarefas serão injetadas aqui via JavaScript -->
                                                                                                                                                                                                                                                                                                                                                    </ul>
                                                                                                                                                                                                                                                                                                                                                            </section>
                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                    </html>
