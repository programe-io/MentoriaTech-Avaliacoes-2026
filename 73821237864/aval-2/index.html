<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>NexusStock // Sistema de Estoque</title>
                <link rel="stylesheet" href="style.css">
                    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                    <body>
                        <div class="container">
                                <header>
                                            <h1>NEXUS<span>STOCK</span></h1>
                                                        <p>Sistema de Controle Operacional de Inventário</p>
                                                                </header>

                                                                        <!-- Métricas Rápidas / Dashboard -->
                                                                                <section class="dashboard-stats">
                                                                                            <div class="stat-card">
                                                                                                            <span>Total de Itens</span>
                                                                                                                            <h2 id="stat-total-items">0</h2>
                                                                                                                                        </div>
                                                                                                                                                    <div class="stat-card">
                                                                                                                                                                    <span>Valor em Estoque</span>
                                                                                                                                                                                    <h2 id="stat-total-value">R$ 0,00</h2>
                                                                                                                                                                                                </div>
                                                                                                                                                                                                            <div class="stat-card alert">
                                                                                                                                                                                                                            <span>Estoque Crítico</span>
                                                                                                                                                                                                                                            <h2 id="stat-critical">0</h2>
                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                        <!-- Formulário de Cadastro -->
                                                                                                                                                                                                                                                                                <section class="form-section">
                                                                                                                                                                                                                                                                                            <form id="product-form">
                                                                                                                                                                                                                                                                                                            <div class="input-group">
                                                                                                                                                                                                                                                                                                                                <input type="text" id="product-name" placeholder="Nome do produto..." required autocomplete="off">
                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                <div class="input-row">
                                                                                                                                                                                                                                                                                                                                                                                    <input type="number" id="product-qty" placeholder="Quantidade" min="0" required>
                                                                                                                                                                                                                                                                                                                                                                                                        <input type="number" id="product-price" placeholder="Preço (R$)" step="0.01" min="0" required>
                                                                                                                                                                                                                                                                                                                                                                                                                            <select id="product-category">
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="hardware">Hardware</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="perifericos">Periféricos</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="componentes">Componentes</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="geral">Geral</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button type="submit" id="btn-save">Registrar Produto [ + ]</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Listagem de Produtos -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <section class="inventory-section">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="table-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h3>Inventário Atual</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="table-container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <th>Produto</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Categoria</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <th>Qtd</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Preço Unit.</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <th>Total</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Ações</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <tbody id="product-list">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Injetado via JavaScript -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
