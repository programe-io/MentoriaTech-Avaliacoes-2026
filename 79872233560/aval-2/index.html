
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TFEED</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="header-content">

            <h1>TFEED</h1>

            <nav aria-label="Navegação principal">
                <a href="#">Início</a>
                <a href="#">Feed</a>
                <a href="#">Perfil</a>
            </nav>

        </div>
    </header>

    <main>

        <!-- Área para criar uma nova publicação -->
        <section class="new-post">

            <div class="user">

                <div class="avatar">T</div>

                <div class="user-info">
                    <strong>Thaynara</strong>
                    <span>O que você está pensando?</span>
                </div>

                <button type="button">Comida</button>

            </div>

        </section>

        <!-- Publicação -->
        <article class="post">

            <div class="post-header">

                <div class="avatar">M</div>

                <div class="user-info">
                    <strong>Mateus</strong>
                    <span>Há 52 minutos</span>
                </div>

            </div>

            <div class="post-content">
                <p>Beleza! Hoje foi um dia muito bom. 😊</p>
            </div>

        </article>

    </main>

</body>

</html>
