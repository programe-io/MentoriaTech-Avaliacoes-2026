
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header class="topo">
            <div>
                <p class="eyebrow">ORGANIZE SEU DIA</p>
                <h1>Gerenciador de Tarefas</h1>
                <p class="subtitulo">
                    Cadastre, priorize e acompanhe suas tarefas.
                </p>
            </div>

            <div class="resumo">
                <span id="totalTarefas">0</span>
                <small>tarefas no total</small>
            </div>
        </header>

        <section class="painel">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <div class="campo campo-titulo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex.: Estudar JavaScript"
                        required
                    >
                    <small>O título deve ter pelo menos 5 caracteres.</small>
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade">
                        <option value="1">1 - Alta</option>
                        <option value="2" selected>2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="status">Status inicial</label>
                    <select id="status">
                        <option value="pendente">Pendente</option>
                        <option value="concluida">Concluída</option>
                    </select>
                </div>

                <button type="submit" class="botao principal">
                    + Adicionar tarefa
                </button>

            </form>

            <p id="mensagem" class="mensagem"></p>
        </section>

        <section class="lista-secao">

            <div class="lista-cabecalho">
                <div>
                    <h2>Minhas tarefas</h2>
                    <p class="subtitulo">
                        Acompanhe o que falta fazer.
                    </p>
                </div>

                <label class="filtro-label" for="filtroStatus">
                    Mostrar:
                    <select id="filtroStatus">
                        <option value="todas">Todas</option>
                        <option value="pendente">Pendentes</option>
                        <option value="concluida">Concluídas</option>
                    </select>
                </label>
            </div>

            <div id="listaTarefas" class="lista-tarefas">
            </div>

        </section>

        <footer>
            Projeto acadêmico - HTML, CSS e JavaScript
        </footer>

    </main>

<script src="script.js"></script></body>
</html>
