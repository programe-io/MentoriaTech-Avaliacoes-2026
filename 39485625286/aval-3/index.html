<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tags HTML</title>
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Meu Site</h1>
        <span>Bem-vindo à página!</span>
    </header>

    <nav>
        <a href="#">Início</a> |
        <a href="#">Sobre</a> |
        <a href="#">Contato</a>
    </nav>

    <main>
        <div>
            <h2>Conteúdo Principal</h2>

            <img src="https://via.placeholder.com/300" alt="Imagem de exemplo">

            <p>
                Este é um exemplo utilizando as tags
                <span>span</span>,
                <span>div</span>,
                <span>nav</span>,
                <span>main</span>,
                <span>img</span> e
                <span>header</span>.
            </p>
        </div>
    </main>

<script src="script.js"></script></body>
</html>
