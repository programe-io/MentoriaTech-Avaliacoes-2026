
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Instagram Clone</title>

        <script src="https://cdn.tailwindcss.com"></script>
          <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
                <link rel="stylesheet" href="style.css">
                <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
                <body class="bg-black text-white">

                  <div class="flex min-h-screen">

                      <!-- Sidebar -->
                          <aside class="sidebar border-r border-gray-800 p-6">
                                <h1 class="text-3xl font-bold mb-10">Instagram</h1>

                                      <nav class="space-y-7">
                                              <a href="#"><i class="fa-solid fa-house"></i> Início</a>
                                                      <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Pesquisa</a>
                                                              <a href="#"><i class="fa-solid fa-compass"></i> Explorar</a>
                                                                      <a href="#"><i class="fa-solid fa-film"></i> Reels</a>
                                                                              <a href="#"><i class="fa-brands fa-facebook-messenger"></i> Mensagens</a>
                                                                                      <a href="#"><i class="fa-solid fa-heart"></i> Notificações</a>
                                                                                              <a href="#" onclick="createPost()"><i class="fa-solid fa-square-plus"></i> Criar</a>
                                                                                                      <a href="#"><i class="fa-solid fa-user"></i> Perfil</a>
                                                                                                            </nav>
                                                                                                                </aside>

                                                                                                                    <!-- Feed -->
                                                                                                                        <main class="flex-1 max-w-3xl mx-auto p-5">

                                                                                                                              <!-- Stories -->
                                                                                                                                    <section class="flex gap-5 overflow-x-auto mb-10 stories">

                                                                                                                                            <div class="story">
                                                                                                                                                      <img src="https://i.pravatar.cc/100?img=12">
                                                                                                                                                                <span>seu_story</span>
                                                                                                                                                                        </div>

                                                                                                                                                                                <div class="story">
                                                                                                                                                                                          <img src="https://i.pravatar.cc/100?img=20">
                                                                                                                                                                                                    <span>maria</span>
                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                    <div class="story">
                                                                                                                                                                                                                              <img src="https://i.pravatar.cc/100?img=30">
                                                                                                                                                                                                                                        <span>joao</span>
                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                        <div class="story">
                                                                                                                                                                                                                                                                  <img src="https://i.pravatar.cc/100?img=40">
                                                                                                                                                                                                                                                                            <span>ana</span>
                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                            <div class="story">
                                                                                                                                                                                                                                                                                                      <img src="https://i.pravatar.cc/100?img=50">
                                                                                                                                                                                                                                                                                                                <span>pedro</span>
                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                              </section>

                                                                                                                                                                                                                                                                                                                                    <!-- Publicações -->
                                                                                                                                                                                                                                                                                                                                          <section id="feed" class="space-y-10">

                                                                                                                                                                                                                                                                                                                                                  <article class="post">

                                                                                                                                                                                                                                                                                                                                                            <div class="flex items-center gap-3 mb-3">
                                                                                                                                                                                                                                                                                                                                                                        <img class="avatar" src="https://i.pravatar.cc/100?img=20">
                                                                                                                                                                                                                                                                                                                                                                                    <strong>maria_silva</strong>
                                                                                                                                                                                                                                                                                                                                                                                                <span class="text-gray-500">• 2 h</span>
                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                    <img class="post-image"
                                                                                                                                                                                                                                                                                                                                                                                                                                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900">

                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="flex justify-between text-2xl py-3">
                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="flex gap-5">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="likePost(this)">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <i class="fa-regular fa-heart"></i>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button><i class="fa-regular fa-comment"></i></button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button><i class="fa-regular fa-paper-plane"></i></button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button><i class="fa-regular fa-bookmark"></i></button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <p class="font-bold">1.245 curtidas</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p class="mt-2">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <strong>maria_silva</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Aproveitando cada momento! ✨
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p class="text-gray-500 text-sm mt-2">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Ver todos os 32 comentários
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            class="comment-input"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        placeholder="Adicione um comentário..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    onkeydown="addComment(event, this)"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </article>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </main>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
