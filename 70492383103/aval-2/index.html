<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Meu Planner ✨</title>

                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

                <body>

                    <main class="app">

                            <header class="cabecalho">
                                        <h1>Meu Planner ✨</h1>

                                                    <p>
                                                                    Organize suas tarefas e deixe seu dia mais leve.
                                                                                </p>

                                                                                            <div class="contador" id="contador">
                                                                                                            Nenhuma tarefa
                                                                                                                        </div>
                                                                                                                                </header>


                                                                                                                                        <form id="form-tarefa" class="form">

                                                                                                                                                    <input
                                                                                                                                                                    type="text"
                                                                                                                                                                                    id="entrada"
                                                                                                                                                                                                    placeholder="O que precisa ser feito?"
                                                                                                                                                                                                                    maxlength="120"
                                                                                                                                                                                                                                    required
                                                                                                                                                                                                                                                >

                                                                                                                                                                                                                                                            <select id="prioridade">
                                                                                                                                                                                                                                                                            <option value="baixa">Baixa</option>
                                                                                                                                                                                                                                                                                            <option value="media" selected>Média</option>
                                                                                                                                                                                                                                                                                                            <option value="alta">Alta</option>
                                                                                                                                                                                                                                                                                                                        </select>

                                                                                                                                                                                                                                                                                                                                    <button type="submit" class="btn-adicionar">
                                                                                                                                                                                                                                                                                                                                                    + Adicionar
                                                                                                                                                                                                                                                                                                                                                                </button>

                                                                                                                                                                                                                                                                                                                                                                        </form>


                                                                                                                                                                                                                                                                                                                                                                                <div class="filtros" id="filtros">

                                                                                                                                                                                                                                                                                                                                                                                            <button class="ativo" data-filtro="todas">
                                                                                                                                                                                                                                                                                                                                                                                                            Todas
                                                                                                                                                                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                    <button data-filtro="pendentes">
                                                                                                                                                                                                                                                                                                                                                                                                                                                    Pendentes
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button data-filtro="concluidas">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Concluídas
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <ul id="lista" class="lista"></ul>


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button id="limpar" class="limpar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Limpar tarefas concluídas
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </main>


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
