<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Sistema de Controle de Estoque</h1>

        <!-- Seção de Cadastro -->
        <section class="card">
            <h2>Cadastrar Produto</h2>
            <div class="form-group">
                <label for="desc">Descrição:</label>
                <input type="text" id="desc" placeholder="Mínimo 5 caracteres">
            </div>
            <div class="form-group">
                <label for="qtd">Quantidade:</label>
                <input type="number" id="qtd" min="1" placeholder="Ex: 10">
            </div>
            <div class="form-group">
                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 99.90">
            </div>
            <button onclick="handleCadastro()">Cadastrar</button>
        </section>

        <!-- Seção de Atualização -->
        <div class="row">
            <section class="card half">
                <h2>Atualizar Valor</h2>
                <div class="form-group">
                    <label for="codValor">Código do Produto:</label>
                    <input type="number" id="codValor">
                </div>
                <div class="form-group">
                    <label for="novoValor">Novo Valor:</label>
                    <input type="number" id="novoValor" step="0.01">
                </div>
                <button onclick="handleAtualizarValor()">Atualizar Valor</button>
            </section>

            <section class="card half">
                <h2>Atualizar Quantidade</h2>
                <div class="form-group">
                    <label for="codQtd">Código do Produto:</label>
                    <input type="number" id="codQtd">
                </div>
                <div class="form-group">
                    <label for="novaQtd">Adicionar Quantidade:</label>
                    <input type="number" id="novaQtd">
                </div>
                <button onclick="handleAtualizarQuantidade()">Adicionar</button>
            </section>
        </div>

        <!-- Seção de Listagem -->
        <section class="card">
            <h2>Produtos no Estoque</h2>
            <button onclick="listarProdutos()">Atualizar Lista</button>
            <div id="listaProdutos" class="lista-container">
                <p>Nenhum produto cadastrado.</p>
            </div>
        </section>
    </div>

    <script>
        // --- Lógica do Sistema de Estoque ---
        let produtos = [];

        function validarProduto(descricao, quantidade, valor) {
            if (descricao.length < 5) throw new Error("Descrição deve ter, no mínimo, cinco caracteres");
            if (quantidade < 1) throw new Error("Quantidade deve ser maior que zero");
            if (valor < 0) throw new Error("Valor deve ser maior ou igual a zero");
        }

        function cadastrarProduto(descricao, quantidade, valor) {
            validarProduto(descricao, quantidade, valor);
            let novoProduto = {
                codigo: produtos.length + 1,
                descricao: descricao,
                quantidade: Number(quantidade),
                valor: Number(valor)
            };
            produtos.push(novoProduto);
            alert("Produto cadastrado com sucesso!");
            listarProdutos();
        }

        function atualizarValor(codigoProduto, novoValor) {
            if (novoValor < 0) throw new Error("Valor deve ser maior ou igual a zero");
            const produto = produtos.find((prod) => prod.codigo === Number(codigoProduto));
            if (produto) {
                produto.valor = Number(novoValor);
                alert("Valor atualizado!");
                listarProdutos();
            } else {
                throw new Error("Produto não encontrado");
            }
        }

        function atualizarQuantidade(codigoProduto, novaQuantidade) {
            if (novaQuantidade < 1) throw new Error("A quantidade deve ser maior que zero");
            const produto = produtos.find((prod) => prod.codigo === Number(codigoProduto));
            if (produto) {
                produto.quantidade += Number(novaQuantidade);
                alert("Estoque atualizado!");
                listarProdutos();
            } else {
                throw new Error("Produto não encontrado");
            }
        }

        function listarProdutos() {
            const container = document.getElementById('listaProdutos');
            if (produtos.length === 0) {
                container.innerHTML = "<p>Nenhum produto cadastrado.</p>";
                return;
            }
            let html = `<table><thead><tr><th>Cód.</th><th>Descrição</th><th>Qtd.</th><th>Valor (R$)</th></tr></thead><tbody>`;
            produtos.forEach(p => {
                html += `<tr><td>${p.codigo}</td><td>${p.descricao}</td><td>${p.quantidade}</td><td>${p.valor.toFixed(2)}</td></tr>`;
            });
            html += "</tbody></table>";
            container.innerHTML = html;
        }

        // Handlers de Interface
        function handleCadastro() {
            try {
                cadastrarProduto(document.getElementById('desc').value, document.getElementById('qtd').value, document.getElementById('valor').value);
            } catch (e) { alert(e.message); }
        }

        function handleAtualizarValor() {
            try {
                atualizarValor(document.getElementById('codValor').value, document.getElementById('novoValor').value);
            } catch (e) { alert(e.message); }
        }

        function handleAtualizarQuantidade() {
            try {
                atualizarQuantidade(document.getElementById('codQtd').value, document.getElementById('novaQtd').value);
            } catch (e) { alert(e.message); }
        }
    </script>
</body>
</html>
