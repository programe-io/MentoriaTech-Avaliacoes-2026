
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram Clone</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
<link href="style.css" rel="stylesheet"></head>
<body>
  <header><h2>Instagram</h2></header>

  <div class="stories">
    <img src="https://i.pravatar.cc/60?img=1">
    <img src="https://i.pravatar.cc/60?img=2">
    <img src="https://i.pravatar.cc/60?img=3">
    <img src="https://i.pravatar.cc/60?img=4">
  </div>

  <main>
    <article class="post">
      <h4>klarissafreitas.</h4>
      <img class="photo"
        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600">
      <button id="like"><i data-lucide="heart"></i> Curtir</button>
      <p id="likes">❤️ 12 curtidas</p>
      <p>Que lugar lindo! 🌿</p>
      <input id="comment" placeholder="Comente...">
      <button onclick="comentar()">Enviar</button>
      <div id="comments"></div>
    </article>
  </main>

  <footer>
    <i data-lucide="house"></i>
    <i data-lucide="search"></i>
    <i data-lucide="plus-square"></i>
    <i data-lucide="user-round"></i>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
