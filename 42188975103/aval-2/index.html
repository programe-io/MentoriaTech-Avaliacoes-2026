<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Gerenciador de Tarefas</h1>

    <input type="text" id="titulo" placeholder="Título da tarefa">
    <input type="number" id="prioridade" placeholder="Prioridade (1 a 3)">

    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="listar()">Listar tarefas</button>

    <input type="number" id="codigo" placeholder="Código da tarefa">

    <button onclick="concluir()">Concluir tarefa</button>

    <input type="number" id="novaPrioridade" placeholder="Nova prioridade">

    <button onclick="alterarPrioridade()">Alterar prioridade</button>

    <ul id="lista"></ul>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
