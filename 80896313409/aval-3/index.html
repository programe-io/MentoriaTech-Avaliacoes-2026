<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Ícones Boxicons -->
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
  <title>Clone Instagram</title>

  <style>
    .bg-muted { background-color: #f3f4f6; }
    .bg-card { background-color: #ffffff; }
    .border-border { border-color: #e5e7eb; }
    .text-muted { color: #6b7280; }
  </style>
</head>
<body class="min-h-screen bg-muted">

  <!-- Cabeçalho (Topo) -->
  <header class="sticky top-0 bg-card border-b border-border z-50">
    <div class="max-w-5xl mx-auto px-4">
      <div class="flex items-center justify-between h-14">
        <h1 class="font-semibold text-lg">Instagram</h1>

        <input
          type="text"
          placeholder="Pesquisar"
          class="hidden md:block bg-muted px-4 py-2 rounded-lg text-sm outline-none"
        />

        <div class="flex items-center gap-4">
          <i class='bx bx-home text-xl cursor-pointer'></i>
          <i class='bx bx-plus text-xl cursor-pointer'></i>
          <i class='bx bx-heart text-xl cursor-pointer'></i>
          <!-- Foto de perfil opcional no topo -->
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKiMWZPYC0iDiERCDjw15nFX_NDP2IPV0k2FBJ_x4qtP6NKzVMKUbnR6J3&s=10" alt="Perfil" class="w-7 h-7 rounded-full object-cover cursor-pointer">
        </div>
      </div>
    </div>
  </header>

  
  <main class="max-w-5xl mx-auto px-4 py-6 pb-20 md:pb-8">
    <div class="flex gap-8">

    
      <div class="flex-1 max-w-lg mx-auto">

     
        <section class="bg-card border border-border rounded-lg p-4 mb-4">
          <div class="flex gap-4 overflow-x-auto">
            
           
            <div class="flex flex-col items-center shrink-0">
              <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKiMWZPYC0iDiERCDjw15nFX_NDP2IPV0k2FBJ_x4qtP6NKzVMKUbnR6J3&s=10">
              <span class="text-xs mt-1">seu_story</span>
            </div>

            
  
  
</body>
</html>
