<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas tarefas de forma simples e eficiente.</p>
        </header>

        <section class="form-container">
            <h2>Nova tarefa</h2>

            <form id="taskForm">
                <div class="form-group">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" placeholder="Ex: T001" required>
                </div>

                <div class="form-group">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" placeholder="Digite o título da tarefa" required>
                </div>

                <div class="form-group">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" required>
                        <option value="">Selecione</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit">Cadastrar tarefa</button>
            </form>

            <p id="mensagem"></p>
        </section>

        <section class="tasks-container">
            <div class="tasks-header">
                <h2>Tarefas cadastradas</h2>
                <span id="contador">0 tarefas</span>
            </div>

            <div id="listaTarefas"></div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
