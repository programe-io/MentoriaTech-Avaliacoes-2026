<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>📦 Sistema de Estoque</h1>

        <!-- Cadastro -->
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="0" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input type="number" id="valor" min="0" step="0.01" required>
                </div>

                <button type="submit">Cadastrar Produto</button>

            </form>
        </section>


        <!-- Lista de produtos -->
        <section class="card">
            <div class="titulo-lista">
                <h2>Produtos Cadastrados</h2>
                <span id="totalProdutos">0 produtos</span>
            </div>

            <div id="listaProdutos">
                <p class="vazio">Nenhum produto cadastrado.</p>
            </div>

            <div class="total-estoque">
                Valor total do estoque:
                <strong id="valorTotal">R$ 0,00</strong>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
