<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="app-container">
  <!-- Cabeçalho -->
  <header class="navbar">
    <h1 class="logo">InstaClone</h1>
    <div class="nav-icons">
      <span>➕</span>
      <span>❤️</span>
      <span>✉️</span>
    </div>
  </header>

  <!-- Barra de Stories -->
  <section class="stories">
    <div class="story">
      <img src="https://picsum.photos" alt="Story">
      <span>Seu story</span>
    </div>
    <div class="story">
      <img src="https://picsum.photos" alt="Story">
      <span>ana_silva</span>
    </div>
    <div class="story">
      <img src="https://picsum.photos" alt="Story">
      <span>carlos.dev</span>
    </div>
    <div class="story">
      <img src="https://picsum.photos" alt="Story">
      <span>viagens_br</span>
    </div>
    <div class="story">
      <img src="https://picsum.photos" alt="Story">
      <span>mariana_art</span>
    </div>
  </section>

  <!-- Feed de Publicações -->
  <main class="feed">
    <article class="post">
      <!-- Topo do Post -->
      <div class="post-header">
        <div class="user-info">
          <img src="https://picsum.photos" alt="Avatar">
          <strong>ana_silva</strong>
        </div>
        <span class="options">•••</span>
      </div>

      <!-- Imagem do Post -->
      <div class="post-image">
        <img src="https://picsum.photos" alt="Paisagem" ondblclick="curtirFoto()">
      </div>

      <!-- Ações (Curtir, Comentar, Compartilhar) -->
      <div class="post-actions">
        <div class="left-actions">
          <button id="like-btn" onclick="curtirFoto()">🤍</button>
          <button onclick="focarComentario()">💬</button>
          <button>🚀</button>
        </div>
        <button id="save-btn" onclick="salvarPost()">🔖</button>
      </div>

      <!-- Curtidas e Legenda -->
      <div class="post-info">
        <p class="likes"><strong id="like-count">124</strong> curtidas</p>
        <p class="caption"><strong>ana_silva</strong> Aproveitando o fim de tarde nesse lugar incrível! 🌅✨</p>
        
        <!-- Lista de Comentários -->
        <div id="comments-list" class="comments-list">
          <p><strong>carlos.dev</strong> Que foto sensacional!</p>
        </div>
      </div>

      <!-- Adicionar Comentário -->
      <div class="add-comment">
        <input type="text" id="comment-input" placeholder="Adicione um comentário...">
        <button onclick="adicionarComentario()">Publicar</button>
      </div>
    </article>
  </main>
</div>$0
  
  
</body>
</html>
