
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
  <div class="header-content">
    <h1>Mini<span>Feed.</span></h1>
    <nav>
      <a href="#">Início</a>
      <a href="#">Perfil</a>
    </nav>
  </div>
</header>

<main>
  <section class="card new-post">
    <div class="user">
      <div class="avatar">A</div>
      <div>
        <strong>Alex Silva</strong>
        <p>O que você está pensando?</p>
      </div>
    </div>
    <button>+ Publicar</button>
  </section>

  <article class="card post">
    <div class="post-header">
      <div class="avatar">J</div>
      <div>
        <strong>João Pedro</strong>
        <p>Há 10 minutos</p>
      </div>
    </div>

    <p class="post-text">
      Aproveitando o dia e compartilhando bons momentos!
    </p>

    <img src="https://placehold.co/700x350/2563eb/ffffff?text=Meu+Momento"
         alt="Imagem de uma publicação">

    <div class="post-actions">
      <button>♡ Curtir</button>
      <button>💬 Comentar</button>
    </div>
  </article>

  <article class="card post">
    <div class="post-header">
      <div class="avatar">M</div>
      <div>
        <strong>Maria Oliveira</strong>
        <p>Há 30 minutos</p>
      </div>
    </div>

    <p class="post-text">
      Nunca pare de aprender coisas novas!
    </p>

    <div class="post-actions">
      <button>♡ Curtir</button>
      <button>💬 Comentar</button>
    </div>
  </article>
</main>

<footer>
  <p>© 2026 Mini Feed | Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script></body>
</html>
