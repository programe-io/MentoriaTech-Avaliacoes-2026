
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <div>
        <h1>✓ TaskManager</h1>
        <p>Organize suas tarefas e acompanhe seu progresso</p>
    </div>
</header>

<main class="container">

    <section class="resumo">
        <div class="card">
            <span>Total de tarefas</span>
            <h2 id="total">0</h2>
        </div>

        <div class="card">
            <span>Pendentes</span>
            <h2 id="pendentes">0</h2>
        </div>

        <div class="card">
            <span>Concluídas</span>
            <h2 id="concluidas">0</h2>
        </div>
    </section>

    <section class="painel">
        <h2>Adicionar nova tarefa</h2>

        <form id="formTarefa">

            <label for="titulo">Título da tarefa</label>
            <input
                type="text"
                id="titulo"
                placeholder="Ex: Cadastrar clientes"
                required
            >

            <label for="prioridade">Prioridade</label>

            <select id="prioridade">
                <option value="1">Baixa</option>
                <option value="2">Média</option>
                <option value="3">Alta</option>
            </select>

            <button type="submit">+ Adicionar tarefa</button>

        </form>
    </section>

    <section class="painel">
        <div class="titulo-lista">
            <h2>Minhas tarefas</h2>
            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar tarefa..."
            >
        </div>

        <div class="filtros">
            <button class="filtro ativo" data-filtro="todas">Todas</button>
            <button class="filtro" data-filtro="pendentes">Pendentes</button>
            <button class="filtro" data-filtro="concluidas">Concluídas</button>
        </div>

        <div id="listaTarefas"></div>

        <p id="mensagemVazia">Nenhuma tarefa encontrada.</p>
    </section>

</main>

<footer>
    <p>TaskManager © 2026 - Gerenciador de Tarefas</p>
</footer>

<script src="script.js"></script></body>
</html>
