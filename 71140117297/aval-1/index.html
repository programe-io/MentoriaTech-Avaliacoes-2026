
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Estoque Fácil</h1>
        <p>Sistema de gerenciamento de produtos</p>
    </header>

    <main class="container">

        <section class="resumo">
            <div class="card">
                <h3>Total de produtos</h3>
                <p id="totalProdutos">0</p>
            </div>

            <div class="card">
                <h3>Itens em estoque</h3>
                <p id="totalItens">0</p>
            </div>

            <div class="card">
                <h3>Valor do estoque</h3>
                <p id="valorEstoque">R$ 0,00</p>
            </div>
        </section>

        <section class="cadastro">
            <h2>Cadastrar novo produto</h2>

            <form id="formProduto">

                <input type="text" id="descricao"
                placeholder="Nome do produto" required>

                <input type="number" id="quantidade"
                placeholder="Quantidade" min="1" required>

                <input type="number" id="valor"
                placeholder="Valor (R$)" min="0" step="0.01" required>

                <button type="submit">+ Cadastrar produto</button>

            </form>
        </section>

        <section class="estoque">
            <h2>Produtos cadastrados</h2>

            <input type="text" id="pesquisa"
            placeholder="🔎 Pesquisar produto...">

            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>Estoque Fácil © 2026 - Sistema de Controle</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
