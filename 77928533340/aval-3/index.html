
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>InstaClone</title>
        <link rel="stylesheet" href="style.css">
        <link href="style.css" rel="stylesheet"></head>
        <body>

        <div class="app">

          <aside class="sidebar">
              <h1 class="logo">InstaClone</h1>

                  <nav>
                        <a href="#feed">🏠 Início</a>
                              <a href="#search">🔎 Pesquisar</a>
                                    <a href="#explore">🧭 Explorar</a>
                                          <a href="#stories">🎬 Stories</a>
                                                <a href="#create">➕ Criar publicação</a>
                                                      <a href="#profile">👤 Perfil</a>
                                                          </nav>
                                                            </aside>

                                                              <main id="feed">

                                                                  <section class="stories" id="stories">
                                                                        <div class="story">
                                                                                <img src="https://i.pravatar.cc/100?img=12">
                                                                                        <span>Seu story</span>
                                                                                              </div>
                                                                                                    <div class="story">
                                                                                                            <img src="https://i.pravatar.cc/100?img=32">
                                                                                                                    <span>Lucas</span>
                                                                                                                          </div>
                                                                                                                                <div class="story">
                                                                                                                                        <img src="https://i.pravatar.cc/100?img=44">
                                                                                                                                                <span>Maria</span>
                                                                                                                                                      </div>
                                                                                                                                                            <div class="story">
                                                                                                                                                                    <img src="https://i.pravatar.cc/100?img=15">
                                                                                                                                                                            <span>Pedro</span>
                                                                                                                                                                                  </div>
                                                                                                                                                                                        <div class="story">
                                                                                                                                                                                                <img src="https://i.pravatar.cc/100?img=47">
                                                                                                                                                                                                        <span>Ana</span>
                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                  </section>

                                                                                                                                                                                                                      <section class="create" id="create">
                                                                                                                                                                                                                            <h2>Criar publicação</h2>
                                                                                                                                                                                                                                  <input id="username" placeholder="Seu nome">
                                                                                                                                                                                                                                        <input id="imageUrl" placeholder="URL da imagem (opcional)">
                                                                                                                                                                                                                                              <textarea id="caption" placeholder="Escreva uma legenda..."></textarea>
                                                                                                                                                                                                                                                    <button onclick="createPost()">Compartilhar</button>
                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                            <section id="posts"></section>

                                                                                                                                                                                                                                                              </main>

                                                                                                                                                                                                                                                                <aside class="rightbar">
                                                                                                                                                                                                                                                                    <h3>Sugestões para você</h3>
                                                                                                                                                                                                                                                                        <div class="suggestion">
                                                                                                                                                                                                                                                                              <img src="https://i.pravatar.cc/100?img=22">
                                                                                                                                                                                                                                                                                    <span>Mariana</span>
                                                                                                                                                                                                                                                                                          <button>Seguir</button>
                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                  <div class="suggestion">
                                                                                                                                                                                                                                                                                                        <img src="https://i.pravatar.cc/100?img=18">
                                                                                                                                                                                                                                                                                                              <span>Gabriel</span>
                                                                                                                                                                                                                                                                                                                    <button>Seguir</button>
                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                          </aside>

                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                          <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                          <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                          </html>
