<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - Gestão de Projetos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <div class="workspace-container">
        <!-- BARRA SUPERIOR -->
        <header class="navbar">
            <div class="brand">
                <i class="fa-solid fa-square-poll-horizontal"></i>
                <h1>TaskFlow Pro</h1>
            </div>
            <div class="board-actions">
                <button class="btn btn-primary" id="btn-new-task">
                    <i class="fa-solid fa-plus"></i> Nova Tarefa
                </button>
            </div>
        </header>

        <!-- ÁREA DO QUADRO KANBAN -->
        <main class="kanban-board">
            
            <!-- Coluna: A Fazer -->
            <div class="kanban-column" data-status="todo">
                <div class="column-header text-red">
                    <h2>A Fazer</h2>
                    <span class="task-count" id="count-todo">0</span>
                </div>
                <div class="column-cards" id="tasks-todo"></div>
            </div>

            <!-- Coluna: Em Andamento -->
            <div class="kanban-column" data-status="progress">
                <div class="column-header text-amber">
                    <h2>Em Andamento</h2>
                    <span class="task-count" id="count-progress">0</span>
                </div>
                <div class="column-cards" id="tasks-progress"></div>
            </div>

            <!-- Coluna: Concluído -->
            <div class="kanban-column" data-status="done">
                <div class="column-header text-green">
                    <h2>Concluído</h2>
                    <span class="task-count" id="count-done">0</span>
                </div>
                <div class="column-cards" id="tasks-done"></div>
            </div>

        </main>
    </div>

    <!-- MODAL DE CRIAÇÃO -->
    <div class="modal-overlay" id="task-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Nova Tarefa</h2>
                <button class="close-modal" id="close-modal-btn">&times;</button>
            </div>
            <form id="task-form" class="modal-form">
                <div class="form-group">
                    <label for="task-title">Título da Tarefa</label>
                    <input type="text" id="task-title" required placeholder="Ex: Criar layout da Home">
                </div>
                <div class="form-group">
                    <label for="task-desc">Descrição</label>
                    <textarea id="task-desc" rows="3" placeholder="Detalhes sobre a entrega..."></textarea>
                </div>
                <div class="form-group">
                    <label for="task-priority">Prioridade</label>
                    <select id="task-priority">
                        <option value="Baixa">Baixa</option>
                        <option value="Média" selected>Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-modal-btn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Adicionar no Quadro</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
