<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>📋 Gerenciador de Tarefas</h1>

        <div class="formulario">
            <input type="hidden" id="idTarefa">

            <label>Título da tarefa:</label>
            <input type="text" id="titulo" placeholder="Digite o título">

            <label>Descrição:</label>
            <textarea id="descricao" placeholder="Digite a descrição"></textarea>

            <label>Data:</label>
            <input type="date" id="data">

            <button onclick="cadastrarOuAlterar()">Cadastrar Tarefa</button>
        </div>

        <div class="busca">
            <input type="text" id="buscar" placeholder="Buscar tarefa..." oninput="buscarTarefas()">
        </div>

        <h2>Minhas Tarefas</h2>

        <div id="listaTarefas"></div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
