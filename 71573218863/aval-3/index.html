<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedal Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: título curto, palco do jogo em destaque, dicas de controle logo abaixo. Visual único de dia ensolarado, escolhido de propósito. */
:root{
  --bg:#0E3B43;
    --fg:#EAF6F2;
      --muted:#9CC4C0;
        --accent:#FF7A45;
          --panel:#145059;
            --font:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;
              color-scheme:dark;
              }
              *{box-sizing:border-box}
              body{
                margin:0;
                  background:var(--bg);
                    color:var(--fg);
                      font-family:var(--font);
                        font-size:1rem;
                          line-height:1.5;
                            padding-block:0;
                              padding-left:max(16px, env(safe-area-inset-left, 0px));
                                padding-right:max(16px, env(safe-area-inset-right, 0px));
                                }
                                .wrap{max-width:820px;margin-inline:auto;padding-block:20px 36px;display:grid;gap:14px}
                                header{display:grid;gap:2px}
                                h1{margin:0;font-weight:700;font-size:clamp(2rem,8vw,3.1rem);line-height:1;letter-spacing:.01em}
                                .tag{margin:0;color:var(--muted)}
                                #game{
                                  display:block;width:100%;height:auto;aspect-ratio:8/5;
                                    border-radius:14px;background:#7EC8F0;cursor:pointer;
                                      touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
                                        box-shadow:0 10px 30px rgba(0,0,0,.35);
                                        }
                                        #game:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
                                        .help{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
                                        .help div{background:var(--panel);border-radius:12px;padding:10px 14px;min-width:0}
                                        .help strong{display:block;font-weight:600;color:var(--fg)}
                                        .help span{color:var(--muted);font-size:.93rem}
                                        kbd{font-family:var(--font);font-weight:600;background:var(--bg);border:1px solid #2F7580;border-radius:6px;padding:0 6px}
                                        </style>
                                        <script src="https://cdn.tailwindcss.com"></script>
</head>
                                        <body>
                                        <div class="wrap">
                                          <header>
                                              <h1>Pedal Rush</h1>
                                                  <p class="tag">Pule os obstáculos, pegue as moedas e vá o mais longe que der.</p>
                                                    </header>

                                                      <canvas id="game" width="800" height="500" tabindex="0" role="img" aria-label="Jogo de bicicleta: toque ou aperte espaço para pular obstáculos"></canvas>

                                                        <div class="help">
                                                            <div><strong>Pular</strong><span>Toque na tela ou aperte <kbd>Espaço</kbd> ou <kbd>↑</kbd></span></div>
                                                                <div><strong>Pulo alto</strong><span>Segure o toque ou a tecla. Cercas pedem pulo alto.</span></div>
                                                                    <div><strong>Pontos</strong><span>Cada metro vale 1 ponto e cada moeda vale 10. Buracos derrubam você.</span></div>
                                                                      </div>
                                                                      </div>

                                                                      <script>
                                                                      (function () {
                                                                        'use strict';
                                                                          var W = 800, H = 500, GY = 410, R = 22;
                                                                            var FONT = '"Fredoka", system-ui, sans-serif';
                                                                              var canvas = document.getElementById('game');
                                                                                var ctx = canvas.getContext('2d');

                                                                                  var best = 0;
                                                                                    try { best = parseInt(localStorage.getItem('pedala-ai-recorde'), 10) || 0; } catch (e) {}

                                                                                      var state = 'ready';
                                                                                        var overAt = 0;
                                                                                          var newBest = false;
                                                                                            var S = null;
                                                                                              var fx = [];
                                                                                                var clouds = [{ x: 80, y: 70, s: 1 }, { x: 330, y: 125, s: 0.7 }, { x: 560, y: 60, s: 1.2 }, { x: 760, y: 140, s: 0.8 }];

                                                                                                  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

                                                                                                    function reset() {
                                                                                                        S = {
                                                                                                              x: 150, y: GY, vy: 0, onGround: true, lastGround: 0, jumpBuf: -1e9,
                                                                                                                    dist: 0, coins: 0, speed: 6, spawnIn: 520, obs: [], cns: [],
                                                                                                                          wa: 0, pa: 0, crashT: 0, shake: 0
                                                                                                                              };
                                                                                                                                  fx = [];
                                                                                                                                    }
                                                                                                                                      reset();

                                                                                                                                        function points() { return Math.floor(S.dist / 12) + S.coins * 10; }

                                                                                                                                          /* ---------- entrada ---------- */
                                                                                                                                            function jump() { S.vy = -13; S.onGround = false; S.jumpBuf = -1e9; S.lastGround = -1e9; }

                                                                                                                                              function press() {
                                                                                                                                                  var now = performance.now();
                                                                                                                                                      if (state === 'ready') { reset(); state = 'playing'; return; }
                                                                                                                                                          if (state === 'over') {
                                                                                                                                                                if (now - overAt > 600) { reset(); state = 'playing'; }
                                                                                                                                                                      return;
                                                                                                                                                                          }
                                                                                                                                                                              if (S.onGround || now - S.lastGround < 80) { jump(); } else { S.jumpBuf = now; }
                                                                                                                                                                                }

                                                                                                                                                                                  function release() {
                                                                                                                                                                                      if (state === 'playing' && S.vy < -8) S.vy = -8;
                                                                                                                                                                                        }

                                                                                                                                                                                          function isJumpKey(e) { return e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'; }
                                                                                                                                                                                            window.addEventListener('keydown', function (e) {
                                                                                                                                                                                                if (isJumpKey(e)) { e.preventDefault(); if (!e.repeat) press(); }
                                                                                                                                                                                                  });
                                                                                                                                                                                                    window.addEventListener('keyup', function (e) { if (isJumpKey(e)) release(); });
                                                                                                                                                                                                      canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); press(); });
                                                                                                                                                                                                        window.addEventListener('pointerup', release);
                                                                                                                                                                                                          window.addEventListener('pointercancel', release);

                                                                                                                                                                                                            /* ---------- lógica ---------- */
                                                                                                                                                                                                              var DIMS = { cone: [26, 36], rock: [44, 28], log: [64, 22], fence: [54, 60], hole: [84, 0] };

                                                                                                                                                                                                                function spawn() {
                                                                                                                                                                                                                    var meters = S.dist / 12;
                                                                                                                                                                                                                        var pool = ['cone', 'rock', 'log', 'hole'];
                                                                                                                                                                                                                            if (meters > 120) pool.push('fence', 'fence');
                                                                                                                                                                                                                                var k = pool[Math.floor(Math.random() * pool.length)];
                                                                                                                                                                                                                                    var d = DIMS[k];
                                                                                                                                                                                                                                        var o = { k: k, w: d[0], h: d[1], x: W + 60 };
                                                                                                                                                                                                                                            S.obs.push(o);
                                                                                                                                                                                                                                                if (Math.random() < 0.7) {
                                                                                                                                                                                                                                                      var cx = o.x + o.w / 2;
                                                                                                                                                                                                                                                            for (var i = 0; i < 5; i++) {
                                                                                                                                                                                                                                                                    var u = (i - 2) / 2;
                                                                                                                                                                                                                                                                            S.cns.push({ x: cx + (i - 2) * 36, y: GY - 62 - (1 - u * u) * 72, ph: Math.random() * 6, taken: false });
                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                          function crash() {
                                                                                                                                                                                                                                                                                              state = 'over';
                                                                                                                                                                                                                                                                                                  overAt = performance.now();
                                                                                                                                                                                                                                                                                                      S.crashT = 0;
                                                                                                                                                                                                                                                                                                          S.shake = 10;
                                                                                                                                                                                                                                                                                                              var p = points();
                                                                                                                                                                                                                                                                                                                  newBest = p > best;
                                                                                                                                                                                                                                                                                                                      if (newBest) {
                                                                                                                                                                                                                                                                                                                            best = p;
                                                                                                                                                                                                                                                                                                                                  try { localStorage.setItem('pedala-ai-recorde', String(best)); } catch (e) {}
                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                          function moveClouds(dt, mv) {
                                                                                                                                                                                                                                                                                                                                              for (var i = 0; i < clouds.length; i++) {
                                                                                                                                                                                                                                                                                                                                                    clouds[i].x -= 0.15 * dt + mv * 0.06;
                                                                                                                                                                                                                                                                                                                                                          if (clouds[i].x < -140) clouds[i].x = W + 140;
                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                  function updateFx(dt) {
                                                                                                                                                                                                                                                                                                                                                                      for (var i = fx.length - 1; i >= 0; i--) {
                                                                                                                                                                                                                                                                                                                                                                            fx[i].t += dt;
                                                                                                                                                                                                                                                                                                                                                                                  if (fx[i].t > 22) fx.splice(i, 1);
                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                          function update(dt, now) {
                                                                                                                                                                                                                                                                                                                                                                                              if (state === 'ready') {
                                                                                                                                                                                                                                                                                                                                                                                                    S.dist += 2.2 * dt; S.wa += 0.1 * dt; S.pa += 0.12 * dt;
                                                                                                                                                                                                                                                                                                                                                                                                          moveClouds(dt, 2.2);
                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                        if (state === 'over') {
                                                                                                                                                                                                                                                                                                                                                                                                                              S.crashT += dt;
                                                                                                                                                                                                                                                                                                                                                                                                                                    S.shake *= Math.pow(0.9, dt);
                                                                                                                                                                                                                                                                                                                                                                                                                                          updateFx(dt);
                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                        S.speed = 6 + Math.min(7, S.dist / 12 / 150);
                                                                                                                                                                                                                                                                                                                                                                                                                                                            var mv = S.speed * dt;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                S.dist += mv;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!S.onGround) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          S.vy += 0.62 * dt;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                S.y += S.vy * dt;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (S.y >= GY) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              S.y = GY; S.vy = 0; S.onGround = true; S.lastGround = now;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (now - S.jumpBuf < 130) jump();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      S.lastGround = now;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              S.wa += mv / R;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  S.pa += S.onGround ? mv / 15 : 0.07 * dt;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      moveClouds(dt, mv);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          S.spawnIn -= mv;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (S.spawnIn <= 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    spawn();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          S.spawnIn = S.speed * 46 + 90 + Math.random() * 260;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  var i;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      for (i = 0; i < S.obs.length; i++) S.obs[i].x -= mv;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          for (i = 0; i < S.cns.length; i++) S.cns[i].x -= mv;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              var bl = S.x - 28, br = S.x + 32;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  for (i = 0; i < S.obs.length; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        var o = S.obs[i];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (o.k === 'hole') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (S.y >= GY - 6 && S.x > o.x + 14 && S.x < o.x + o.w - 14) { crash(); return; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else if (br > o.x + 4 && bl < o.x + o.w - 4 && S.y > GY - o.h + 4) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    crash(); return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  for (i = 0; i < S.cns.length; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        var c = S.cns[i];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (!c.taken && Math.abs(c.x - S.x) < 30 && Math.abs(c.y - (S.y - 30)) < 38) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      c.taken = true; S.coins++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              fx.push({ x: c.x, y: c.y, t: 0 });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            updateFx(dt);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                S.obs = S.obs.filter(function (o) { return o.x + o.w > -30; });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    S.cns = S.cns.filter(function (c) { return c.x > -30 && !c.taken; });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        /* ---------- desenho ---------- */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function rr(x, y, w, h, r) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ctx.moveTo(x + r, y);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ctx.arcTo(x + w, y, x + w, y + h, r);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ctx.arcTo(x + w, y + h, x, y + h, r);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.arcTo(x, y + h, x, y, r);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ctx.arcTo(x, y, x + w, y, r);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ctx.closePath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function hills(base, amp, f, off, color) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.fillStyle = color;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ctx.moveTo(0, GY);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          for (var x = 0; x <= W + 8; x += 8) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                var xx = x + off;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      var y = base - (Math.sin(xx * f) * amp + Math.sin(xx * f * 2.7 + 1.3) * amp * 0.35);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.lineTo(x, y);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.lineTo(W + 8, GY);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.closePath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fill();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function drawSky() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    var g = ctx.createLinearGradient(0, 0, 0, GY);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        g.addColorStop(0, '#6CC3EE');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            g.addColorStop(0.62, '#BFE6F5');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                g.addColorStop(1, '#FFE3A8');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.fillStyle = g;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.fillRect(0, 0, W, GY);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            var sg = ctx.createRadialGradient(610, 170, 10, 610, 170, 130);
