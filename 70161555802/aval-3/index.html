<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio - Byel Cardoso</title>
    <style>
        /* CSS - Estilização da Página */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Topo da página */
        header {
            background-color: #1e1e1e;
            padding: 20px;
            border-bottom: 2px solid #00ffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #00ffff;
            font-size: 22px;
        }

        /* Menu de navegação */
        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #00ffff;
        }

        /* Conteúdo principal */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Cartão de perfil contido no Artigo */
        .profile-card {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 255, 255, 0.15);
            border: 1px solid #00ffff;
            transition: all 0.3s ease;
        }

        /* Imagem de perfil */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00ffff;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 26px;
            color: #00ffff;
            margin-bottom: 15px;
            cursor: pointer;
        }

        /* Container das informações */
        .info-container {
            margin-bottom: 20px;
        }

        .info-text {
            font-size: 16px;
            margin: 8px 0;
            color: #cccccc;
        }

        .highlight {
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
        }

        .bio {
            font-size: 14px;
            line-height: 1.6;
            color: #aaaaaa;
        }

        /* Rodapé */
        footer {
            background-color: #1e1e1e;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: #777777;
            border-top: 1px solid #2d2d2d;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu Espaço Dev</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Projetos</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <main>
        
        <article class="profile-card">
            
            <img class="profile-img" src="https://via.placeholder.com/150/00ffff/ffffff?text=Byel" alt="Foto de Byel Cardoso">
            
            <h2>Byel Cardoso</h2>
            
            <div class="info-container">
                <p class="info-text"><strong>Idade:</strong> 15 anos</p>
                <p class="info-text"><strong>Cor Favorita:</strong> <span class="highlight">Ciano</span></p>
            </div>
            
            <p class="bio">
                Bem-vindo ao meu site! Tenho 15 anos, curto tecnologia e essa página foi estruturada usando as melhores tags do HTML5.
            </p>
            
        </article>

    </main>

    <footer>
        <p>&copy; 2026 - Desenvolvido por Byel Cardoso</p>
    </footer>

    <script>
  <script src="script.js"></script>
  
</body>
</html>
