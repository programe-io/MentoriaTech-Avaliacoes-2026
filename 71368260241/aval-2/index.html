
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="header-content">
            <h1>📋 TaskManager</h1>
            <p>Organize suas tarefas e aumente sua produtividade.</p>
        </div>
    </header>

    <main class="container">

        <!-- PAINEL DE RESUMO -->

        <section class="resumo">

            <div class="card">
                <h3>Total de Tarefas</h3>
                <p id="totalTarefas">0</p>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <p id="tarefasPendentes">0</p>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <p id="tarefasConcluidas">0</p>
            </div>

        </section>

        <!-- CADASTRO DE TAREFAS -->

        <section class="cadastro">

            <h2>Adicionar Nova Tarefa</h2>

            <form id="formTarefa">

                <input
                    type="text"
                    id="titulo"
                    placeholder="Título da tarefa"
                    maxlength="100"
                    required
                >

                <textarea
                    id="descricao"
                    placeholder="Descrição da tarefa"
                    rows="3"
                ></textarea>

                <div class="campos">

                    <div>
                        <label for="prioridade">Prioridade</label>

                        <select id="prioridade">
                            <option value="baixa">Baixa</option>
                            <option value="media" selected>Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>

                    <div>
                        <label for="data">Data de conclusão</label>

                        <input type="date" id="data">
                    </div>

                </div>

                <button type="submit" class="btn-adicionar">
                    + Adicionar Tarefa
                </button>

            </form>

        </section>

        <!-- LISTA DE TAREFAS -->

        <section class="tarefas">

            <h2>Minhas Tarefas</h2>

            <input
                type="text"
                id="pesquisa"
                placeholder="🔎 Pesquisar tarefa..."
            >

            <div class="filtros">

                <button class="filtro ativo" data-filtro="todas">
                    Todas
                </button>

                <button class="filtro" data-filtro="pendentes">
                    Pendentes
                </button>

                <button class="filtro" data-filtro="concluidas">
                    Concluídas
                </button>

            </div>

            <div id="listaTarefas" class="lista-tarefas">

                <!-- Tarefas inseridas pelo JavaScript -->

            </div>

        </section>

    </main>

    <footer>
        <p>TaskManager © 2026 - Gerenciador de Tarefas</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
