<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>💅 Esmalteria Glamour</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>

        <div class="cabecalho">

            <img src="img/esmalte1.jpg" alt="Esmalte">

            <div>
                <h1>💅 Esmalteria Glamour</h1>
                <p>Controle de estoque de esmaltes</p>
            </div>

        </div>

    </header>


    <main>

        <section class="formulario">

            <h2>✨ Cadastrar Esmalte</h2>

            <div class="campo">

                <label for="codigo">
                    Código:
                </label>

                <input
                    type="text"
                    id="codigo"
                    placeholder="Ex: E001"
                >

            </div>


            <div class="campo">

                <label for="descricao">
                    Nome do esmalte:
                </label>

                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex: Rosa Pink"
                >

            </div>


            <div class="campo">

                <label for="imagem">
                    Imagem:
                </label>

                <select id="imagem">

                    <option value="esmalte1.jpg">
                        Esmalte Rosa
                    </option>

                    <option value="esmalte2.jpg">
                        Esmalte Vermelho
                    </option>

                    <option value="esmalte3.jpg">
                        Esmalte Roxo
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="cor">
                    Cor:
                </label>

                <input
                    type="color"
                    id="cor"
                    value="#ff69b4"
                >

            </div>


            <div class="campo">

                <label for="quantidade">
                    Quantidade:
                </label>

                <input
                    type="number"
                    id="quantidade"
                    min="0"
                    placeholder="Ex: 20"
                >

            </div>


            <div class="campo">

                <label for="valor">
                    Valor:
                </label>

                <input
                    type="number"
                    id="valor"
                    min="0"
                    step="0.01"
                    placeholder="Ex: 9.90"
                >

            </div>


            <button onclick="cadastrarProduto()">
                💖 Cadastrar Esmalte
            </button>

        </section>


        <section class="estoque">

            <h2>💄 Esmaltes em Estoque</h2>

            <div id="listaProdutos">

                <p class="mensagem">
                    Nenhum esmalte cadastrado.
                </p>

            </div>

        </section>

    </main>


    <footer>

        <p>
            💅 Esmalteria Glamour © 2026
        </p>

    </footer>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
