<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Web Clone</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1 class="brand">Instagram</h1>
      <nav class="nav">
        <button class="nav-btn active" data-view="home">🏠 <span>Página Inicial</span></button>
        <button class="nav-btn" data-view="explore">🔍 <span>Explorar</span></button>
        <button class="nav-btn" id="openCreateModal">➕ <span>Criar</span></button>
        <button class="nav-btn" data-view="saved">🔖 <span>Salvos</span></button>
        <button class="nav-btn" data-view="profile">👤 <span>Perfil</span></button>
      </nav>
    </aside>

    <main class="main-content">
      <section id="view-home" class="view active">
        <div id="storiesBar" class="stories-bar"></div>
        <div id="feedList" class="feed-list"></div>
      </section>

      <section id="view-explore" class="view">
        <input type="search" id="exploreSearch" class="search-box" placeholder="Buscar por usuário ou legenda..." />
        <div id="exploreGrid" class="photo-grid"></div>
      </section>

      <section id="view-saved" class="view">
        <h2 class="section-title">Publicações Salvas</h2>
        <div id="savedGrid" class="photo-grid"></div>
      </section>

      <section id="view-profile" class="view">
        <header class="profile-header">
          <img id="profileAvatar" src="https://picsum.photos" alt="Avatar" class="profile-pic" />
          <div class="profile-info">
            <div class="profile-top">
              <h2 id="profileUsername">voce.dev</h2>
              <button id="editProfileBtn" class="btn-secondary">Editar perfil</button>
            </div>
            <div class="profile-stats">
              <span><strong id="statPosts">0</strong> publicações</span>
              <span><strong>428</strong> seguidores</span>
              <span><strong>315</strong> seguindo</span>
            </div>
            <p id="profileBio" class="profile-bio">Construindo interfaces com HTML, CSS e JS puro.</p>
          </div>
        </header>
        <div id="profileGrid" class="photo-grid"></div>
      </section>
    </main>
  </div>

  <!-- Modal Criar Post -->
  <dialog id="createModal" class="modal">
    <form id="createForm" class="modal-box">
      <h3>Criar nova publicação</h3>
      <label class="file-label">
        Selecionar foto do computador
        <input type="file" id="postImageFile" accept="image/*" />
      </label>
      <input type="url" id="postImageUrl" placeholder="Ou cole a URL de uma imagem (opcional)" />
      <input type="text" id="postLocation" placeholder="Localização (ex: Teresina, PI)" />
      <textarea id="postCaption" rows="3" placeholder="Escreva uma legenda..." required></textarea>
      <div class="modal-actions">
        <button type="button" id="closeCreateModal" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary">Compartilhar</button>
      </div>
    </form>
  </dialog>

  <!-- Modal Visualizador de Stories -->
  <dialog id="storyModal" class="story-modal">
    <div class="story-viewer">
      <div class="story-progress"><div id="storyBarFill" class="story-bar-fill"></div></div>
      <div class="story-top">
        <span id="storyUserLabel"></span>
        <button id="closeStoryModal" aria-label="Fechar story">✕</button>
      </div>
      <img id="storyImage" src="" alt="Story" />
    </div>
  </dialog>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
