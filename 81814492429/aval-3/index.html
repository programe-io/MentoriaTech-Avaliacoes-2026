
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram - João Henrique</title>

    <link rel="stylesheet" href="style.css">

    <!-- Ícones -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>

<body>

    <main class="instagram-container">

        <!-- CABEÇALHO -->
        <header class="top-header">

            <div class="instagram-logo">
                Instagram
            </div>

            <div class="header-icons">
                <i class="fa-regular fa-heart"></i>
                <i class="fa-brands fa-facebook-messenger"></i>
            </div>

        </header>


        <!-- PERFIL -->
        <section class="profile">

            <div class="profile-top">

                <!-- FOTO DE PERFIL -->
                <div class="profile-photo">

                    <img
                    src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRHMzDaJBGxAUDVIKVpACpu1dJuBubQAIGjGyJedKnzOg&s=10
                    alt="Foto de perfil">

                </div>


                <!-- ESTATÍSTICAS -->
                <div class="profile-stats">

                    <div class="stat">
                        <strong>6</strong>
                        <span>publicações</span>
                    </div>

                    <div class="stat">
                        <strong>33M</strong>
                        <span>seguidores</span>
                    </div>

                    <div class="stat">
                        <strong>427</strong>
                        <span>seguindo</span>
                    </div>

                </div>

            </div>


            <!-- INFORMAÇÕES -->
            <div class="profile-info">

                <h2>João Henrique Dias Resende</h2>

                <p class="username">
                    @joao_h_d_r
                </p>

                <p class="bio">
                    Sou cristão, tenho 15 anos e estudo no Ceti Dom Severino
                </p>

            </div>


            <!-- BOTÕES -->
            <div class="profile-buttons">

                <button id="seguirBtn">
                    Seguir
                </button>

                <button id="mensagemBtn">
                    Mensagem
                </button>

                <button class="add-button">
                    <i class="fa-solid fa-user-plus"></i>
                </button>

            </div>


            <!-- DESTAQUES -->
            <section class="highlights">

                <div class="highlight">

                    <div class="highlight-circle">
                        <i class="fa-solid fa-cross"></i>
                    </div>

                    <span>Deus</span>

                </div>

                <div class="highlight">

                    <div class="highlight-circle">
                        <i class="fa-solid fa-camera"></i>
                    </div>

                    <span>Momentos</span>

                </div>

                <div class="highlight">

                    <div class="highlight-circle">
                        <i class="fa-solid fa-users"></i>
                    </div>

                    <span>Amigos</span>

                </div>

                <div class="highlight">

                    <div class="highlight-circle">
                        <i class="fa-solid fa-heart"></i>
                    </div>

                    <span>Favoritos</span>

                </div>

                <div class="highlight">

                    <div class="highlight-circle new-highlight">
                        <i class="fa-solid fa-plus"></i>
                    </div>

                    <span>Novo</span>

                </div>

            </section>

        </section>


        <!-- MENU DE PUBLICAÇÕES -->
        <nav class="profile-navigation">

            <div class="nav-item active" data-tab="posts">
                <i class="fa-solid fa-table-cells"></i>
            </div>

            <div class="nav-item" data-tab="reels">
                <i class="fa-solid fa-clapperboard"></i>
            </div>

            <div class="nav-item" data-tab="tagged">
                <i class="fa-regular fa-user"></i>
            </div>

        </nav>


        <!-- PUBLICAÇÕES -->
        <section class="posts-grid" id="postsGrid">

            <div class="post">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQVR8W7z-HGC0pGeTIiHtFC3Mf4hry0IfYSMKfGcSTWfg&s=10"
                alt="Publicação 1">
                <div class="post-overlay">
                    <i class="fa-solid fa-heart"></i> 120
                    <i class="fa-solid fa-comment"></i> 15
                </div>
            </div>

            <div class="post">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVXvjB0FnPn2hvriS28JzjY5t6aaJOh1CW6W6HP90SAg&s=10"
                alt="Publicação 2">
                <div class="post-overlay">
                    <i class="fa-solid fa-heart"></i> 98
                    <i class="fa-solid fa-comment"></i> 8
                </div>
            </div>

            <div class="post">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRif_JNiIGetHhPfqDltJZMTyqE50ZF2S93pmORadeeAA&s=10"
                alt="Publicação 3">
                <div class="post-overlay">
                    <i class="fa-solid fa-heart"></i> 210
                    <i class="fa-solid fa-comment"></i> 22
                </div>
            </div>

            <div class="post">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJ3oLwqYESe3oo65G6_EV3gJerpXiX6CA5h_jRMzW_VA&s=10"
                alt="Publicação 4">
                <div class="post-overlay">
                    <i class="fa-solid fa-heart"></i> 75
                    <i class="fa-solid fa-comment"></i> 5
                </div>
            </div>

            <div class="post">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSaiZ7Vmoze52GbWPvlfnerWPgxqrm7hFYbbKSoUC8OSQ&s=10"
                alt="Publicação 5">
                <div class="post-overlay">
                    <i class="fa-solid fa-heart"></i> 156
                    <i class="fa-solid fa-comment"></i> 12
                </div>
            </div>

            <div class="post">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ__qWIAarbd0eDTheoNfutUjZRg3-OebJSA145iYV9NQ&s=10"
                alt="Publicação 6">
                <div class="post-overlay">
                    <i class="fa-solid fa-heart"></i> 87
                    <i class="fa-solid fa-comment"></i> 9
                </div>
            </div>

        </section>


        <!-- MENU INFERIOR -->
        <footer class="bottom-navigation">

            <i class="fa-solid fa-house"></i>
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-regular fa-square-plus"></i>
            <i class="fa-solid fa-clapperboard"></i>

            <img src="https://i.pravatar.cc/100?img=12"
            alt="Perfil">

        </footer>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
