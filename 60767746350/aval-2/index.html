<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manuel Lucas — Mini Feed</title>

    <!-- O arquivo style.css deve estar na MESMA pasta deste HTML -->
    <link rel="stylesheet" href="./style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header class="topbar">
        <div class="logo">
            <span class="logo-mark">M</span>

            <div>
                <strong>Manuel Lucas</strong>
                <small>mini feed</small>
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            online
        </div>
    </header>


    <main class="container">

        <!-- Caixa de postagem -->
        <section class="composer">

            <div class="composer-top">

                <div class="avatar">M</div>

                <div>
                    <h2>O que está acontecendo?</h2>
                    <p>Compartilhe alguma coisa com o pessoal.</p>
                </div>

            </div>


            <input
                id="name"
                type="text"
                placeholder="Seu nome"
                maxlength="30"
            >


            <textarea
                id="comment"
                placeholder="Escreva algo..."
                maxlength="500"
            ></textarea>


            <div class="composer-bottom">

                <label class="file-button">

                    <input
                        type="file"
                        id="imageUpload"
                        accept="image/*"
                    >

                    <span>＋ imagem</span>

                </label>


                <button
                    onclick="postComment()"
                    class="post-button"
                    type="button"
                >
                    Publicar
                    <span>→</span>
                </button>

            </div>


            <div id="fileName" class="file-name"></div>

        </section>


        <!-- Feed -->
        <section class="feed">

            <div class="feed-header">

                <div>
                    <span class="section-label">LIVE FEED</span>
                    <h1>Publicações</h1>
                </div>

                <span id="postCount" class="post-count">
                    0 posts
                </span>

            </div>


            <div id="posts"></div>

        </section>

    </main>


    <footer>
        <span>Manuel Lucas</span>
        <span>•</span>
        <span>dados salvos neste navegador</span>
    </footer>

<script src="script.js"></script></body>
</html>
