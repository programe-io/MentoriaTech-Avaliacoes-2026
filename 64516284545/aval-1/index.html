
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Contador</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            padding-top: 100px;
        }

        h1 {
            color: #333;
        }

        #contador {
            font-size: 50px;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .aumentar {
            background-color: #28a745;
            color: white;
        }

        .diminuir {
            background-color: #dc3545;
            color: white;
        }

        .zerar {
            background-color: #007bff;
            color: white;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Meu Contador</h1>

    <div id="contador">0</div>

    <button class="aumentar" onclick="aumentar()">+</button>
    <button class="diminuir" onclick="diminuir()">-</button>
    <button class="zerar" onclick="zerar()">Zerar</button>

    <script>
        let numero = 0;

        function aumentar() {
            numero++;
            atualizar();
        }

        function diminuir() {
            numero--;
            atualizar();
        }

        function zerar() {
            numero = 0;
            atualizar();
        }

        function atualizar() {
            document.getElementById("contador").textContent = numero;
        }
    </script>

<script src="script.js"></script></body>
</html>
