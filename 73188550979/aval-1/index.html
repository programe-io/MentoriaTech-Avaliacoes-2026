<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento de Estoque</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #334155;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .error-message {
            background-color: #fee2e2;
            color: var(--danger);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.875rem;
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        .actions-cell {
            display: flex;
            gap: 5px;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h1>Controle de Estoque</h1>

    <div id="errorAlert" class="error-message"></div>

    <div class="card">
        <h2>Cadastrar Novo Produto</h2>
        <div class="form-grid">
            <div class="form-group">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" placeholder="Ex: Cadeira gamer">
            </div>
            <div class="form-group">
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" placeholder="Ex: 12">
            </div>
            <div class="form-group">
                <label for="valor">Valor (R$)</label>
                <input type="number" step="0.01" id="valor" placeholder="Ex: 699.00">
            </div>
            <button onclick="handleCadastrar()">Cadastrar</button>
        </div>
    </div>

    <div class="card">
        <h2>Produtos Cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaProdutos">
                <tr>
                    <td colspan="5" style="text-align: center; color: #64748b;">Nenhum produto cadastrado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let produtos = [];

    function mostrarErro(mensagem) {
        const alertBox = document.getElementById('errorAlert');
        alertBox.textContent = mensagem;
        alertBox.style.display = 'block';
        setTimeout(() => {
            alertBox.style.display = 'none';
        }, 4000);
    }

    function validarProduto(descricao, quantidade, valor) {
        if (descricao.length < 5) {
            throw new Error("Descrição deve ter, no mínimo, cinco caracteres");
        }
        if (quantidade < 1) {
            throw new Error("Quantidade deve ser maior que zero");
        }
        if (valor < 0) {
            throw new Error("Valor deve ser maior ou igual a zero");
        }
    }

    function cadastrarProduto(descricao, quantidade, valor) {
        validarProduto(descricao, quantidade, valor);
        let novoProduto = {
            codigo: produtos.length + 1,
            descricao: descricao,
            quantidade: Number(quantidade),
            valor: Number(valor)
        };
        produtos.push(novoProduto);
    }

    function atualizarValor(codigoProduto, novoValor) {
        if (novoValor < 0) {
            throw new Error("Valor deve ser maior ou igual a zero");
        }
        const produto = produtos.find((prod) => prod.codigo === codigoProduto);
        if (produto) {
            produto.valor = Number(novoValor);
        } else {
            throw new Error("Produto não encontrado");
        }
    }

    function atualizarQuantidade(codigoProduto, novaQuantidade) {
        if (novaQuantidade < 1) {
            throw new Error("Quantidade deve ser maior que zero");
        }
        const produto = produtos.find((prod) => prod.codigo === codigoProduto);
        if (produto) {
            produto.quantidade = produto.quantidade + Number(novaQuantidade);
        } else {
            throw new Error("Produto não encontrado");
        }
    }

    function renderizarTabela() {
        const tbody = document.getElementById('tabelaProdutos');
        tbody.innerHTML = '';

        if (produtos.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #64748b;">Nenhum produto cadastrado.</td></tr>`;
            return;
        }

        produtos.forEach(prod => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${prod.codigo}</td>
                <td>${prod.descricao}</td>
                <td>${prod.quantidade}</td>
                <td>R$ ${prod.valor.toFixed(2)}</td>
                <td class="actions-cell">
                    <button class="btn-sm" onclick="pedirNovoValor(${prod.codigo})">Alterar Valor</button>
                    <button class="btn-sm" onclick="pedirMaisQuantidade(${prod.codigo})">+ Qtd</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function handleCadastrar() {
        const descInput = document.getElementById('descricao');
        const qtdInput = document.getElementById('quantidade');
        const valInput = document.getElementById('valor');

        try {
            cadastrarProduto(descInput.value, qtdInput.value, valInput.value);
            descInput.value = '';
            qtdInput.value = '';
            valInput.value = '';
            renderizarTabela();
        } catch (e) {
            mostrarErro(e.message);
        }
    }

    function pedirNovoValor(codigo) {
        const novoValor = prompt("Digite o novo valor do produto:");
        if (novoValor !== null) {
            try {
                atualizarValor(codigo, novoValor);
                renderizarTabela();
            } catch (e) {
                mostrarErro(e.message);
            }
        }
    }

    function pedirMaisQuantidade(codigo) {
        const qtdAdicional = prompt("Digite a quantidade a ser somada no estoque:");
        if (qtdAdicional !== null) {
            try {
                atualizarQuantidade(codigo, qtdAdicional);
                renderizarTabela();
            } catch (e) {
                mostrarErro(e.message);
            }
        }
    }
</script>

<script src="script.js"></script></body>
</html>
