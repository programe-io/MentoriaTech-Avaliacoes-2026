<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma e Tabela IMC</title>
    <!-- Vinculando o arquivo CSS separado -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <!-- SEÇÃO 1: Calculadora de Soma -->
        <section class="card">
            <h2>Calculadora de Soma</h2>
            <div class="input-group">
                <input type="number" id="num1" placeholder="Digite o 1º valor">
                <input type="number" id="num2" placeholder="Digite o 2º valor">
                <button id="btnSomar">Somar</button>
            </div>
            <div class="result" id="resultadoSoma">Resultado: -</div>
        </section>

        <!-- SEÇÃO 2: Tabela de Pessoas e IMC -->
        <section class="card">
            <h2>Tabela de Avaliação de IMC</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Peso (kg)</th>
                        <th>Altura (m)</th>
                        <th>IMC</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </section>
    </div>

    <!-- Vinculando o arquivo JavaScript separado (no final para carregar os elementos) -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
