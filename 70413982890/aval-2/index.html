
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Gerenciamento de Tarefas</h1>
        <p>Organize suas atividades e acompanhe seu progresso</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar nova tarefa</h2>

            <form id="formTarefa">
                <label for="codigo">Código:</label>
                <input type="number" id="codigo" min="1" required>

                <label for="titulo">Título da tarefa:</label>
                <input
                    type="text"
                    id="titulo"
                    placeholder="Ex.: Estudar JavaScript"
                    minlength="5"
                    required
                >

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade" required>
                    <option value="1">1 - Alta</option>
                    <option value="2" selected>2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit">Cadastrar tarefa</button>
            </form>
        </section>

        <section class="tarefas">
            <h2>Tarefas cadastradas</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaTarefas"></tbody>
                </table>
            </div>

            <p id="mensagem"></p>
        </section>
    </main>

    <footer>
        <p>Sistema de gerenciamento de tarefas</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
