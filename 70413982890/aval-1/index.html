
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Cuidados Pessoais</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Estoque de Cuidados Pessoais</h1>
        <p>Controle de produtos da loja</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <label for="codigo">Código:</label>
                <input type="number" id="codigo" min="1" required>

                <label for="descricao">Descrição do produto:</label>
                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex.: Shampoo"
                    required
                >

                <label for="quantidade">Quantidade em estoque:</label>
                <input type="number" id="quantidade" min="0" required>

                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor" min="0"
                       step="0.01" required>

                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section class="estoque">
            <h2>Produtos cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                    </tbody>
                </table>
            </div>

            <p id="mensagem"></p>
        </section>
    </main>

    <footer>
        <p>Sistema de controle de estoque</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
