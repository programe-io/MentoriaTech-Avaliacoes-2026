
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Sistema de gerenciamento de estoque</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <input type="text" id="descricao"
                placeholder="Descrição do produto">

            <input type="number" id="quantidade"
                placeholder="Quantidade">

            <input type="number" id="valor"
                placeholder="Valor do produto" step="0.01">

            <button onclick="cadastrarProduto()">
                Cadastrar Produto
            </button>
        </section>

        <section class="formulario">
            <h2>Atualizar Produto</h2>

            <input type="number" id="codigoAtualizar"
                placeholder="Código do produto">

            <input type="number" id="novoValor"
                placeholder="Novo valor" step="0.01">

            <button onclick="atualizarValor()">
                Atualizar Valor
            </button>

            <input type="number" id="codigoQuantidade"
                placeholder="Código do produto">

            <input type="number" id="novaQuantidade"
                placeholder="Quantidade para adicionar">

            <button onclick="atualizarQuantidade()">
                Adicionar Quantidade
            </button>
        </section>

        <section class="produtos">
            <h2>Lista de Produtos</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Sistema de Cadastro de Produtos</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
