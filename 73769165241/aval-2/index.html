
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas atividades de maneira simples!</p>
    </header>

    <main>

        <section class="card">
            <h2>Cadastrar Nova Tarefa</h2>

            <input type="text" id="descricao"
                placeholder="Digite a descrição da tarefa">

            <select id="prioridade">
                <option value="">Selecione a prioridade</option>
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>
            </select>

            <button onclick="cadastrarTarefa()">
                Cadastrar Tarefa
            </button>
        </section>

        <section class="card">
            <h2>Pesquisar Tarefa</h2>

            <input type="number" id="codigoBusca"
                placeholder="Digite o código da tarefa">

            <button onclick="buscarTarefa()">
                Buscar
            </button>

            <div id="resultadoBusca"></div>
        </section>

        <section class="card">
            <h2>Alterar Prioridade</h2>

            <input type="number" id="codigoAlterar"
                placeholder="Código da tarefa">

            <select id="novaPrioridade">
                <option value="">Nova prioridade</option>
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>
            </select>

            <button onclick="alterarPrioridade()">
                Alterar Prioridade
            </button>
        </section>

        <section class="card">
            <h2>Lista de Tarefas</h2>

            <div id="listaTarefas"></div>
        </section>

    </main>

    <footer>
        <p>Projeto Gerenciador de Tarefas - JavaScript</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
