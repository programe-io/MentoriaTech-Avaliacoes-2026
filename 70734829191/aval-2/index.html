<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas tarefas e acompanhe seu progresso.</p>
    </header>

    <main>
        <section id="cadastro">
            <h2>Cadastrar nova tarefa</h2>

            <form id="form-tarefa">
                <div>
                    <label for="titulo">Título da tarefa:</label>
                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Digite o título da tarefa"
                        minlength="5"
                        required
                    >
                </div>

                <div>
                    <label for="prioridade">Prioridade:</label>
                    <select id="prioridade" name="prioridade" required>
                        <option value="">Selecione a prioridade</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit">Cadastrar tarefa</button>
            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>
        </section>

        <section id="lista-tarefas">
            <h2>Minhas tarefas</h2>

            <div id="tarefas-container">
                <p id="lista-vazia">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Gerenciador de Tarefas &copy; 2026</p>
    </footer>

<script src="script.js"></script></body>
</html>
