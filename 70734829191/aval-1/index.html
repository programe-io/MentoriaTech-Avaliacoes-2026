

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Sistema de Cadastro de Produtos</h1>
        <p>Cadastre, consulte e atualize seus produtos</p>
    </header>

    <main>
        <section class="container">

            <h2>Cadastrar Produto</h2>

            <form id="formCadastro">
                <label for="descricao">Descrição do produto:</label>
                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex.: Caderno escolar"
                    required
                >

                <label for="quantidade">Quantidade:</label>
                <input
                    type="number"
                    id="quantidade"
                    min="1"
                    placeholder="Digite a quantidade"
                    required
                >

                <label for="valor">Valor (R$):</label>
                <input
                    type="number"
                    id="valor"
                    min="0"
                    step="0.01"
                    placeholder="Ex.: 15.50"
                    required
                >

                <button type="submit">Cadastrar Produto</button>
            </form>

        </section>

        <section class="container">

            <h2>Atualizar Valor</h2>

            <form id="formAtualizarValor">
                <label for="codigoValor">Código do produto:</label>
                <input
                    type="number"
                    id="codigoValor"
                    min="1"
                    placeholder="Digite o código"
                    required
                >

                <label for="novoValor">Novo valor (R$):</label>
                <input
                    type="number"
                    id="novoValor"
                    min="0"
                    step="0.01"
                    placeholder="Digite o novo valor"
                    required
                >

                <button type="submit">Atualizar Valor</button>
            </form>

        </section>

        <section class="container">

            <h2>Adicionar Quantidade</h2>

            <form id="formAtualizarQuantidade">
                <label for="codigoQuantidade">Código do produto:</label>
                <input
                    type="number"
                    id="codigoQuantidade"
                    min="1"
                    placeholder="Digite o código"
                    required
                >

                <label for="novaQuantidade">Quantidade a adicionar:</label>
                <input
                    type="number"
                    id="novaQuantidade"
                    min="1"
                    placeholder="Digite a quantidade"
                    required
                >

                <button type="submit">Adicionar Quantidade</button>
            </form>

        </section>

        <section class="container lista-container">

            <h2>Produtos Cadastrados</h2>

            <button type="button" id="btnListar">
                Listar Produtos
            </button>

            <div id="mensagem" role="status"></div>

            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor (R$)</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="4">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>
    </main>

    <footer>
        <p>Sistema de Cadastro de Produtos</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
