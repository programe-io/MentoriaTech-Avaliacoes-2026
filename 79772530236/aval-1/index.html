<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Interativo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    \}

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f2f5;
    \}

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 300px;
    \}

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #333;
    \}

    #contador {
      font-size: 3rem;
      font-weight: bold;
      margin: 20px 0;
      color: #007bff;
    \}

    .botoes {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    \}

    button {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      transition: background-color 0.2s;
    \}

    button:hover {
      background-color: #0056b3;
    \}

    button.diminuir {
      background-color: #dc3545;
    \}

    button.diminuir:hover {
      background-color: #a71d2a;
    \}

    button.resetar {
      background-color: #6c757d;
    \}

    button.resetar:hover {
      background-color: #545b62;
    \}
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h1>Contador</h1>
    <div id="contador">0</div>
    <div class="botoes">
      <button class="diminuir" onclick="alterarValor(-1)">-</button>
      <button class="resetar" onclick="zerar()">Zerar</button>
      <button class="aumentar" onclick="alterarValor(1)">+</button>
    </div>
  </div>

  <script>
    let valorAtual = 0;
    const displayContador = document.getElementById('contador');

    function alterarValor(quantidade) {
      valorAtual += quantidade;
      displayContador.textContent = valorAtual;
    \}

    function zerar() {
      valorAtual = 0;
      displayContador.textContent = valorAtual;
    \}
  </script>

</body>
</html>
