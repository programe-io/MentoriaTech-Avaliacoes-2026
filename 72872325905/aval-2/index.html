<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexExchange | Conversor de Moedas Inteligente</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fontes modernas do Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Barra de Navegação Superior -->
    <header>
        <div class="logo">Apex<span>Exchange</span></div>
        <div class="status-badge">
            <span class="status-dot"></span> Taxas em Tempo Real
        </div>
    </header>

    <!-- Área Principal do Conversor -->
    <main class="main-container">
        <section class="converter-box">
            <h1>Conversor de Moedas</h1>
            <p class="subtitle">Insira o valor e selecione as moedas para conversão instantânea.</p>

            <form id="converter-form">
                <!-- Campo de Valor -->
                <div class="input-group">
                    <label for="amount">Valor a converter</label>
                    <div class="input-wrapper">
                        <span class="currency-symbol" id="input-symbol">R$</span>
                        <input type="number" id="amount" placeholder="0,00" min="0.01" step="0.01" required value="100">
                    </div>
                </div>

                <!-- Seleção de Moedas -->
                <div class="selection-row">
                    <div class="select-group">
                        <label for="from-currency">De</label>
                        <select id="from-currency">
                            <option value="BRL" selected>BRL - Real Brasileiro</option>
                            <option value="USD">USD - Dólar Americano</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - Libra Esterlina</option>
                            <option value="BTC">BTC - Bitcoin</option>
                        </select>
                    </div>

                    <!-- Botão de Inversão de Moedas -->
                    <button type="button" id="btn-swap" title="Inverter moedas">🔄</button>

                    <div class="select-group">
                        <label for="to-currency">Para</label>
                        <select id="to-currency">
                            <option value="BRL">BRL - Real Brasileiro</option>
                            <option value="USD" selected>USD - Dólar Americano</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - Libra Esterlina</option>
                            <option value="BTC">BTC - Bitcoin</option>
                        </select>
                    </div>
                </div>

                <!-- Botão de Ação -->
                <button type="submit" id="btn-convert">Converter Valor</button>
            </form>

            <!-- Painel de Resultados -->
            <div id="result-container" class="result-container hide">
                <div class="result-card">
                    <span class="base-text" id="result-base">100 BRL =</span>
                    <h2 class="target-text" id="result-target">18.52 USD</h2>
                    <p class="update-text" id="result-time">Atualizado em: --/--/----</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 ApexExchange. Dados fornecidos gratuitamente via AwesomeAPI.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
