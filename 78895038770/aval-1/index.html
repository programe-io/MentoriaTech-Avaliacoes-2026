
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja Online</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🛒 Minha Loja</h1>
    <input type="text" id="pesquisa"
        placeholder="Buscar produtos...">
    <button onclick="mostrarCarrinho()">
        🛍️ Carrinho (<span id="quantidade">0</span>)
    </button>
</header>

<nav>
    <a href="#">Início</a>
    <a href="#produtos">Produtos</a>
    <a href="#">Ofertas</a>
    <a href="#">Contato</a>
</nav>

<section class="banner">
    <h2>Ofertas imperdíveis!</h2>
    <p>Encontre os melhores produtos com preços especiais.</p>
</section>

<main>
    <h2 id="produtos">Produtos em destaque</h2>
    <div class="produtos" id="listaProdutos"></div>
</main>

<div id="carrinho" class="modal">
    <div class="modal-conteudo">
        <button class="fechar" onclick="fecharCarrinho()">✖</button>
        <h2>Meu Carrinho</h2>
        <div id="itensCarrinho"></div>
        <h3 id="total">Total: R$ 0,00</h3>
    </div>
</div>

<footer>
    <p>© 2026 Minha Loja Online - Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
