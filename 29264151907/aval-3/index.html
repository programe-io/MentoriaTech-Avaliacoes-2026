
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas atividades de forma simples e prática.</p>
    </header>

    <main class="container">

        <section class="formulario">
            <h2>Adicionar nova tarefa</h2>

            <form id="form-tarefa">
                <input
                    type="text"
                    id="titulo-tarefa"
                    placeholder="Digite o nome da tarefa..."
                    minlength="5"
                    required
                >

                <select id="prioridade">
                    <option value="Baixa">Prioridade baixa</option>
                    <option value="Média" selected>Prioridade média</option>
                    <option value="Alta">Prioridade alta</option>
                </select>

                <button type="submit">Adicionar tarefa</button>
            </form>
        </section>

        <section class="tarefas">
            <div class="titulo-lista">
                <h2>Minhas tarefas</h2>
                <span id="contador">0 tarefas</span>
            </div>

            <div id="lista-tarefas">
                <!-- As tarefas serão inseridas aqui pelo JavaScript -->
            </div>
        </section>

    </main>

    <footer>
        <p>Projeto de JavaScript — Arrays e Renderização</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
