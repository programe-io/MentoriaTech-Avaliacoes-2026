<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Container Principal (Simulando uma tela Mobile/Smartphone) -->
    <div class="mobile-container">
        
        <!-- Topo / Navbar -->
        <header class="app-header">
            <h1 class="logo">Instagram</h1>
            <div class="header-actions">
                <span class="icon">❤️</span>
                <span class="icon">💬</span>
            </div>
        </header>

        <!-- Barra de Stories (Rolagem Horizontal) -->
        <section class="stories-container" id="stories-list">
            <!-- Gerado via JavaScript -->
        </section>

        <!-- Feed de Publicações -->
        <main class="feed-container" id="feed-list">
            <!-- Gerado via JavaScript -->
        </main>

        <!-- Barra de Navegação Inferior -->
        <footer class="app-footer">
            <span class="footer-icon active">🏠</span>
            <span class="footer-icon">🔍</span>
            <span class="footer-icon">➕</span>
            <span class="footer-icon">🎬</span>
            <span class="footer-icon profile-thumb">👤</span>
        </footer>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
