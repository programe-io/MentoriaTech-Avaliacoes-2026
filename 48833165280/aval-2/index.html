<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitSocial - Compartilhe sua Evolução</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Topo do App -->
    <header>
        <div class="container header-container">
            <h1 class="logo">💪 Fit<span>Social</span></h1>
        </div>
    </header>

    <div class="container app-layout">
        
        <!-- Lateral Izquerda: Perfil do Usuário -->
        <aside class="profile-card">
            <div class="profile-header">
                <div class="avatar">⚡</div>
                <h2>Atleta Fit</h2>
                <p>@atleta_focado</p>
            </div>
            <div class="profile-stats">
                <div class="stat-item">
                    <span id="streak-count" class="stat-number">12</span>
                    <span class="stat-label">Dias Seguidos</span>
                </div>
                <div class="stat-item">
                    <span id="total-workouts" class="stat-number">3</span>
                    <span class="stat-label">Treinos Postados</span>
                </div>
            </div>
        </aside>

        <!-- Centro: Criador de Posts e Feed -->
        <main class="feed-container">
            
            <!-- Caixa para Criar Post -->
            <section class="create-post-box">
                <h3>O que você treinou hoje?</h3>
                <form id="post-form">
                    <textarea id="post-text" placeholder="Ex: Pago o legday de hoje! Foco total..." required></textarea>
                    
                    <div class="form-options">
                        <select id="exercise-type" required>
                            <option value="" disabled selected>Tipo de treino</option>
                            <option value="🏋️‍♂️ Musculação">🏋️‍♂️ Musculação</option>
                            <option value="🏃‍♂️ Corrida / Cardio">🏃‍♂️ Corrida / Cardio</option>
                            <option value="🧘‍♂️ Yoga / Alongamento">🧘‍♂️ Yoga / Alongamento</option>
                            <option value="🚴‍♂️ Ciclismo">🚴‍♂️ Ciclismo</option>
                        </select>

                        <select id="intensity-level" required>
                            <option value="" disabled selected>Intensidade</option>
                            <option value="🔥 Leve">🔥 Leve</option>
                            <option value="🔥🔥 Moderado">🔥🔥 Moderado</option>
                            <option value="🔥🔥🔥 Intenso">🔥🔥🔥 Intenso</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Publicar Treino</button>
                </form>
            </section>

            <!-- O Feed de Publicações -->
            <section id="feed" class="feed-list">
                <!-- Os posts dinâmicos do JavaScript entrarão aqui -->
            </section>

        </main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
