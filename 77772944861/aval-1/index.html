<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  
<!-- TELA DE ENTRADA -->
<div class="intro-screen" id="intro">

    <div class="intro-content">
        <p class="intro-subtitle">O RETORNO DO HOMEM DE MIL SÓIS</p>

        <h1>SENTRY</h1>

        <p class="intro-message">
            Olá, visitante! Seja bem-vindo ao universo do Sentry.
            Prepare-se para conhecer o poder de um dos seres
            mais extraordinários da Marvel.
        </p>

        <button id="enterButton">
            ENTRAR NO UNIVERSO
        </button>
    </div>

</div>

<!-- BLOCO DE NOTAS -->
<section class="notepad" id="notepad">

    <div class="notepad-header">
        <h2>MEU BLOCO DE NOTAS</h2>
        <span>✦</span>
    </div>

    <p>Escreva suas ideias, pensamentos ou anotações.</p>

    <textarea
        id="notes"
        placeholder="Escreva suas anotações aqui..."
    ></textarea>

    <div class="notepad-buttons">
        <button id="saveNotes">SALVAR</button>
        <button id="clearNotes">LIMPAR</button>
    </div>

    <p id="saveMessage">Suas anotações ficam salvas neste navegador.</p>

</section>

<!-- COLOQUE ANTES DO FECHAMENTO DO BODY -->
<script src="script.js"></script>

  <script src="script.js"></script>
  
</body>
</html>
