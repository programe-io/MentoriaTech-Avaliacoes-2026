<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <header class="header">
            <div>
                <h1>Minhas tarefas</h1>
                <p>Organize suas tarefas de forma simples e eficiente.</p>
            </div>
        </header>

        <section class="card">

            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <div class="form-group">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex: Cadastrar clientes"
                    >
                </div>

                <div class="form-group">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade">
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">
                    + Adicionar tarefa
                </button>

            </form>

            <p id="mensagem"></p>

        </section>

        <section class="tarefas-section">

            <div class="section-title">
                <div>
                    <h2>Suas tarefas</h2>
                    <p id="contador">0 tarefas cadastradas</p>
                </div>
            </div>

            <div id="listaTarefas" class="lista-tarefas">
                <!-- As tarefas serão inseridas pelo JavaScript -->
            </div>

        </section>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
