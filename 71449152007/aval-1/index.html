<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Cadastro de Produtos</h1>

        <div class="formulario">
            <h2>Cadastrar Produto</h2>

            <div class="campo">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" placeholder="Ex: Cadeira Gamer">
            </div>

            <div class="campo">
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" placeholder="Ex: 10" min="1">
            </div>

            <div class="campo">
                <label for="valor">Valor</label>
                <input type="number" id="valor" placeholder="Ex: 699.00" min="0.01" step="0.01">
            </div>

            <button onclick="cadastrarProduto()">Cadastrar Produto</button>

            <p id="mensagem"></p>
        </div>

        <div class="produtos">
            <h2>Produtos cadastrados</h2>

            <div id="listaProdutos">
                <p class="vazio">Nenhum produto cadastrado.</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>$0
