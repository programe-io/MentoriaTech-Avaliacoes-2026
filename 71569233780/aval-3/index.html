<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aula 04 - Exemplo 08</title>
</head>
<body>
<table border="1px">
<thead>
<tr>
<th>Nome</th>
<th>Peso</th>
<th>Altura</th>
<th>IMC</th>
<th>Situacao</th>
</tr></thead>

<tbody>
<tr>
<td>Joao 1</td>
<td>72.0</td>
<td>1.65</td>
<td>26.4</td>
<td class="situacao">Sobrepeso</td>
</tr>

<tr>
<td>Joao2</td>
<td>65.0<td>
<td>1.68</td><td>18.2</td>
<td class="situacao">Normal</td></td>
</tbody>
</table>
<script>
const situacoes=document.getElementsByClassName("situacao");

for(let situacao of situacoes){
    const texto=situacao.textcontent;

    if(texto==="Normal"){
        situacao.style.color="green";
    }
    else if(texto==="Sobrepeso"){
        situacao.style.color="red";
    }
}
</script>
</body>
</html>
