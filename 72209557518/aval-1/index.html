<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Promedio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
        }

        h1 {
            color: #2e8b57;
        }

        input {
            margin: 5px;
            padding: 8px;
            width: 100px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #2e8b57;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3cb371;
        }

        #resultado {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

    <h1>Calculadora de Promedio</h1>

    <input type="number" id="nota1" placeholder="Nota 1">
    <input type="number" id="nota2" placeholder="Nota 2">
    <input type="number" id="nota3" placeholder="Nota 3">

    <br>

    <button id="calcular">Calcular</button>

    <div id="resultado"></div>

    <script>
        document.getElementById("calcular").addEventListener("click", function () {

            // Variables
            let n1 = Number(document.getElementById("nota1").value);
            let n2 = Number(document.getElementById("nota2").value);
            let n3 = Number(document.getElementById("nota3").value);

            // Promedio
            let media = (n1 + n2 + n3) / 3;

            // Condición
            let resultado = "";

            if (media >= 7) {
                resultado = "Aprobado ✅";
            } else {
                resultado = "Reprobado ❌";
            }

            // Mostrar resultado
            document.getElementById("resultado").innerHTML =
                "Promedio: " + media.toFixed(2) + "<br>" + resultado;
        });
    </script>

<script src="script.js"></script></body>
</html>
