
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Biblioteca Escolar</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <h1>📚 Biblioteca Escolar</h1>
    <p>Sistema de Cadastro e Gerenciamento</p>
</header>

<nav>
    <a href="#inicio">Início</a>
    <a href="#cadastro">Cadastrar Livro</a>
    <a href="#acervo">Acervo</a>
</nav>

<main>

<section id="inicio" class="painel">
    <h2>Painel da Biblioteca</h2>

    <div class="cards">
        <div class="card">
            <h3>Total de Livros</h3>
            <p id="total">0</p>
        </div>

        <div class="card">
            <h3>Disponíveis</h3>
            <p id="disponiveis">0</p>
        </div>

        <div class="card">
            <h3>Emprestados</h3>
            <p id="emprestados">0</p>
        </div>
    </div>
</section>

<section id="cadastro" class="formulario">
    <h2>Cadastro de Livros</h2>

    <form id="livroForm">

        <input type="hidden" id="livroId">

        <label>Título do livro:</label>
        <input type="text" id="titulo"
               placeholder="Digite o título" required>

        <label>Autor:</label>
        <input type="text" id="autor"
               placeholder="Nome do autor" required>

        <label>Categoria:</label>
        <input type="text" id="categoria"
               placeholder="Ex: Literatura" required>

        <label>ISBN:</label>
        <input type="text" id="isbn"
               placeholder="Código ISBN">

        <label>Quantidade:</label>
        <input type="number" id="quantidade"
               min="0" required>

        <button type="submit" id="botaoSalvar">
            Cadastrar Livro
        </button>

        <button type="button" id="cancelar"
                class="cancelar" hidden>
            Cancelar edição
        </button>

    </form>
</section>

<section id="acervo">
    <h2>Acervo de Livros</h2>

    <input type="text" id="pesquisa"
           placeholder="Pesquisar por título ou autor...">

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Categoria</th>
                    <th>Quantidade</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaLivros"></tbody>
        </table>
    </div>
</section>

</main>

<footer>
    <p>Biblioteca Escolar - Sistema de Gerenciamento</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
