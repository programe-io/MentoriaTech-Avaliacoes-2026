
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Calculadora de IMC</h1>
        <p class="subtitulo">Sistema de avaliação do paciente</p>

        <form id="formIMC">

            <label for="nome">Nome do paciente:</label>
            <input type="text" id="nome"
                placeholder="Digite o nome do paciente" required>

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso"
                placeholder="Ex: 70" step="0.01" min="0.01" required>

            <label for="altura">Altura (metros):</label>
            <input type="number" id="altura"
                placeholder="Ex: 1.75" step="0.01" min="0.01" required>

            <button type="submit">Calcular IMC</button>

            <button type="button" class="limpar"
                onclick="limparFormulario()">Limpar</button>

        </form>

        <div id="resultado" class="resultado" hidden>
            <h2>Resultado do paciente</h2>

            <p id="resultadoNome"></p>
            <p id="resultadoPeso"></p>
            <p id="resultadoAltura"></p>

            <h3 id="valorIMC"></h3>
            <p id="classificacao"></p>
            <p id="informacao"></p>
        </div>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
