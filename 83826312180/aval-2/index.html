<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Feed SEDUC PI</title>
        <style>
            :root { --azul: #005981; --verde: #007932; --amarelo: #fdb913; --bg: #f1f5f9; }
                * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
                    body { background: var(--bg); color: #1e293b; }
                        header { background: var(--azul); color: #fff; padding: 14px; border-bottom: 4px solid var(--amarelo); text-align: center; }
                            main { max-width: 620px; margin: 20px auto; padding: 0 12px; display: grid; gap: 14px; }
                                .card { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
                                    textarea, input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 8px; }
                                        .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
                                            button { background: var(--azul); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
                                                button.like { background: #e2e8f0; color: #1e293b; }
                                                    button.like.ativo { background: #fee2e2; color: #b91c1c; }
                                                        .tag { background: #e0f2fe; color: var(--azul); font-size: 12px; padding: 3px 8px; border-radius: 99px; font-weight: bold; }
                                                            .meta { font-size: 12px; color: #64748b; margin-bottom: 8px; }
                                                                .filtros { display: flex; gap: 6px; flex-wrap: wrap; }
                                                                    .filtros button { background: #fff; color: var(--azul); border: 1px solid var(--azul); }
                                                                        .filtros button.ativo { background: var(--azul); color: #fff; }
                                                                          </style>
                                                                          <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                                                                          <body>
                                                                            <header>
                                                                                <h2>SEDUC PI • Feed Escolar</h2>
                                                                                  </header>

                                                                                    <main>
                                                                                        <div class="filtros" id="filtros">
                                                                                              <button class="ativo" data-cat="Todas">Todas</button>
                                                                                                    <button data-cat="Projetos">Projetos</button>
                                                                                                          <button data-cat="Eventos">Eventos</button>
                                                                                                                <button data-cat="Dicas">Dicas</button>
                                                                                                                    </div>

                                                                                                                        <form class="card" id="form">
                                                                                                                              <input id="escola" placeholder="Escola / Município (ex: CETI • Teresina)" />
                                                                                                                                    <textarea id="texto" rows="2" placeholder="Compartilhe uma novidade da rede estadual..." required></textarea>
                                                                                                                                          <div class="row">
                                                                                                                                                  <select id="cat" style="width:auto;margin:0">
                                                                                                                                                            <option>Projetos</option>
                                                                                                                                                                      <option>Eventos</option>
                                                                                                                                                                                <option>Dicas</option>
                                                                                                                                                                                        </select>
                                                                                                                                                                                                <button type="submit">Publicar</button>
                                                                                                                                                                                                      </div>
                                                                                                                                                                                                          </form>

                                                                                                                                                                                                              <div id="feed" style="display:grid;gap:12px"></div>
                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                  <script>
                                                                                                                                                                                                                      let posts = [
                                                                                                                                                                                                                            { id: 1, escola: "CETI • Teresina - PI", cat: "Projetos", texto: "Feira de ciências com foco em energias renováveis.", likes: 15, liked: false },
                                                                                                                                                                                                                                  { id: 2, escola: "GRE • Picos - PI", cat: "Eventos", texto: "Aulão preparatório reuniu estudantes da rede estadual.", likes: 22, liked: false }
                                                                                                                                                                                                                                      ];
                                                                                                                                                                                                                                          let filtro = "Todas";

                                                                                                                                                                                                                                              const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };

                                                                                                                                                                                                                                                  function render() {
                                                                                                                                                                                                                                                        const lista = filtro === "Todas" ? posts : posts.filter(p => p.cat === filtro);
                                                                                                                                                                                                                                                              document.getElementById("feed").innerHTML = lista.map(p => `
                                                                                                                                                                                                                                                                      <article class="card">
                                                                                                                                                                                                                                                                                <div class="row"><span class="meta">${esc(p.escola)}</span><span class="tag">${esc(p.cat)}</span></div>
                                                                                                                                                                                                                                                                                          <p style="margin:6px 0 10px">${esc(p.texto)}</p>
                                                                                                                                                                                                                                                                                                    <button class="like ${p.liked ? "ativo" : ""}" onclick="curtir(${p.id})">♥ ${p.likes}</button>
                                                                                                                                                                                                                                                                                                            </article>
                                                                                                                                                                                                                                                                                                                  `).join("") || `<div class="card">Sem postagens aqui.</div>`;
                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                          function curtir(id) {
                                                                                                                                                                                                                                                                                                                                const p = posts.find(x => x.id === id);
                                                                                                                                                                                                                                                                                                                                      p.liked = !p.liked;
                                                                                                                                                                                                                                                                                                                                            p.likes += p.liked ? 1 : -1;
                                                                                                                                                                                                                                                                                                                                                  render();
                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                          document.getElementById("form").onsubmit = e => {
                                                                                                                                                                                                                                                                                                                                                                e.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                      posts.unshift({
                                                                                                                                                                                                                                                                                                                                                                              id: Date.now(),
                                                                                                                                                                                                                                                                                                                                                                                      escola: document.getElementById("escola").value.trim() || "Rede Estadual • PI",
                                                                                                                                                                                                                                                                                                                                                                                              cat: document.getElementById("cat").value,
                                                                                                                                                                                                                                                                                                                                                                                                      texto: document.getElementById("texto").value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                              likes: 0,
                                                                                                                                                                                                                                                                                                                                                                                                                      liked: false
                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                  e.target.reset();
                                                                                                                                                                                                                                                                                                                                                                                                                                        render();
                                                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                                                                document.querySelectorAll("#filtros button").forEach(b => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                      b.onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.querySelectorAll("#filtros button").forEach(x => x.classList.remove("ativo"));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      b.classList.add("ativo");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              filtro = b.dataset.cat;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      render();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    render();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </html>
