<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão de JavaScript - Parte 1</title>
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Revisão de JavaScript</h1>

    <h2>Tipos de dados</h2>

    <script>
        // String
        const nome = "João";

        // Number
        const idade = 20;
        const altura = 1.75;

        // Boolean
        const aprovado = true;

        // Undefined
        let endereco;

        // Null
        const telefone = null;

        console.log("Nome:", nome);
        console.log("Idade:", idade);
        console.log("Altura:", altura);
        console.log("Aprovado:", aprovado);
        console.log("Endereço:", endereco);
        console.log("Telefone:", telefone);

        // typeof
        console.log(typeof nome);
        console.log(typeof idade);
        console.log(typeof aprovado);
        console.log(typeof endereco);
        console.log(typeof telefone);


        // ====================================
        // STRINGS E INTERPOLAÇÃO
        // ====================================

        console.log(`Meu nome é ${nome} e tenho ${idade} anos.`);


        // ====================================
        // OPERADORES ARITMÉTICOS
        // ====================================

        const numero1 = 10;
        const numero2 = 5;

        console.log("Adição:", numero1 + numero2);
        console.log("Subtração:", numero1 - numero2);
        console.log("Multiplicação:", numero1 * numero2);
        console.log("Divisão:", numero1 / numero2);
        console.log("Exponenciação:", numero1 ** numero2);
        console.log("Resto:", numero1 % numero2);


        // Precedência
        console.log(10 + 10 * 2);       // 30
        console.log((10 + 10) * 2);     // 40


        // ====================================
        // OPERADORES RELACIONAIS
        // ====================================

        console.log(10 == "10");   // true
        console.log(10 === "10");  // false

        console.log(10 != "10");   // false
        console.log(10 !== "10");  // true

        console.log(20 > 10);      // true
        console.log(20 < 10);      // false
        console.log(20 >= 20);     // true
        console.log(20 <= 10);     // false


        // ====================================
        // OPERADORES LÓGICOS
        // ====================================

        const idadePessoa = 20;
        const temDocumento = true;

        // E
        console.log(idadePessoa >= 18 && temDocumento);

        // OU
        console.log(idadePessoa >= 18 || temDocumento);

        // NOT
        console.log(!temDocumento);


        // ====================================
        // IF / ELSE IF / ELSE
        // ====================================

        const numero = 20;

        if (numero < 15) {
            console.log("O número é menor que 15");

        } else if (numero < 25) {
            console.log("O número está entre 15 e 24");

        } else {
            console.log("O número é 25 ou maior");
        }


        // ====================================
        // SWITCH / CASE
        // ====================================

        const dia = 2;

        switch (dia) {

            case 1:
                console.log("Domingo");
                break;

            case 2:
                console.log("Segunda-feira");
                break;

            case 3:
                console.log("Terça-feira");
                break;

            default:
                console.log("Dia inválido");
        }
    </script>

<script src="script.js"></script></body>
</html>
