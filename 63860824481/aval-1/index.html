<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Área de Entrega - Avaliações</title>

                <style>
                        body {
                                    font-family: Arial, sans-serif;
                                                background-color: #f4f4f4;
                                                            margin: 0;
                                                                        padding: 0;
                                                                                }

                                                                                        .container {
                                                                                                    max-width: 600px;
                                                                                                                margin: 50px auto;
                                                                                                                            background: white;
                                                                                                                                        padding: 20px;
                                                                                                                                                    border-radius: 10px;
                                                                                                                                                                box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
                                                                                                                                                                        }

                                                                                                                                                                                h1 {
                                                                                                                                                                                            text-align: center;
                                                                                                                                                                                                    }

                                                                                                                                                                                                            p {
                                                                                                                                                                                                                        text-align: center;
                                                                                                                                                                                                                                    color: #555;
                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                    label {
                                                                                                                                                                                                                                                                display: block;
                                                                                                                                                                                                                                                                            margin-top: 15px;
                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                            input, textarea {
                                                                                                                                                                                                                                                                                                        width: 100%;
                                                                                                                                                                                                                                                                                                                    padding: 10px;
                                                                                                                                                                                                                                                                                                                                margin-top: 5px;
                                                                                                                                                                                                                                                                                                                                            border-radius: 5px;
                                                                                                                                                                                                                                                                                                                                                        border: 1px solid #ccc;
                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                        button {
                                                                                                                                                                                                                                                                                                                                                                                    margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                            padding: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                        background-color: #007BFF;
                                                                                                                                                                                                                                                                                                                                                                                                                                    color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            border-radius: 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        button:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    background-color: #0056b3;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h1>Área de Entrega</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>Envie seu código para avaliação. Revise antes de publicar!</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label>Nome:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" placeholder="Digite seu nome">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label>Disciplina:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" placeholder="Ex: Programação Web">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label>Código:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <textarea rows="8" placeholder="Cole seu código aqui..."></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button type="submit">Enviar Avaliação</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
