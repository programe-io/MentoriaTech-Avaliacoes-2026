<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="container">

    <h1>Cadastro de Produtos</h1>

    <section class="card">
        <h2>Cadastrar Produto</h2>

        <form id="formProduto">

            <div class="campo">
                <label for="descricao">Descrição</label>
                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex: Cadeira Gamer"
                    required
                >
            </div>

            <div class="campo">
                <label for="quantidade">Quantidade</label>
                <input
                    type="number"
                    id="quantidade"
                    min="1"
                    placeholder="Ex: 10"
                    required
                >
            </div>

            <div class="campo">
                <label for="valor">Valor</label>
                <input
                    type="number"
                    id="valor"
                    min="0"
                    step="0.01"
                    placeholder="Ex: 699.00"
                    required
                >
            </div>

            <button type="submit">Cadastrar Produto</button>

        </form>
    </section>


    <section class="card">
        <h2>Atualizar Produto</h2>

        <div class="atualizacao">

            <div class="campo">
                <label for="codigo">Código</label>
                <input
                    type="number"
                    id="codigo"
                    min="1"
                    placeholder="Código do produto"
                >
            </div>

            <div class="campo">
                <label for="novoValor">Novo valor</label>
                <input
                    type="number"
                    id="novoValor"
                    min="0"
                    step="0.01"
                    placeholder="Novo valor"
                >
            </div>

            <button type="button" id="btnAtualizarValor">
                Atualizar Valor
            </button>

        </div>

        <div class="atualizacao">

            <div class="campo">
                <label for="codigoQuantidade">Código</label>
                <input
                    type="number"
                    id="codigoQuantidade"
                    min="1"
                    placeholder="Código do produto"
                >
            </div>

            <div class="campo">
                <label for="novaQuantidade">Quantidade a adicionar</label>
                <input
                    type="number"
                    id="novaQuantidade"
                    min="1"
                    placeholder="Quantidade"
                >
            </div>

            <button type="button" id="btnAtualizarQuantidade">
                Adicionar Quantidade
            </button>

        </div>
    </section>


    <section class="card">
        <div class="titulo-lista">
            <h2>Produtos cadastrados</h2>
            <span id="totalProdutos">0 produtos</span>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                </tbody>
            </table>
        </div>
    </section>

</main>

<script src="script.js"></script>

  <script src="script.js"></script>
  
</body>
</html>
