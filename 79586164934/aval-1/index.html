<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vice City News | Blog GTA VI</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="navbar">
    <div class="logo">VICE<span>NEWS</span> VI</div>
    <nav class="filters">
      <button class="filter-btn active" data-category="todos">Todos</button>
      <button class="filter-btn" data-category="noticias">Notícias</button>
      <button class="filter-btn" data-category="mapa">Mapa & Leonida</button>
      <button class="filter-btn" data-category="personagens">Personagens</button>
    </nav>
  </header>

  <section class="hero">
    <h1>Bem-vindo de volta a <span>Vice City</span></h1>
    <p>As últimas novidades, análises e segredos do estado de Leonida.</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar artigos (ex: Lucia, Jason, mapa)...">
    </div>
  </section>

  <main class="container">
    <div id="postsGrid" class="posts-grid"></div>
  </main>

  <!-- Modal de leitura -->
  <div id="articleModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close-btn">&times;</button>
      <span id="modalCategory" class="badge"></span>
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="date"></p>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <footer>
    <p>Blog de fãs dedicado a Grand Theft Auto VI &bull; Projeto HTML, CSS & JS</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
