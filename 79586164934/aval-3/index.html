<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizontes da Fé | Blog sobre Religiões e Cultura</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="navbar">
    <div class="logo">HORIZONTES<span>DA FÉ</span></div>
    <nav class="filters">
      <button class="filter-btn active" data-category="todos">Todos</button>
      <button class="filter-btn" data-category="historia">História</button>
      <button class="filter-btn" data-category="tradicoes">Tradições</button>
      <button class="filter-btn" data-category="arquitetura">Arquitetura Sacra</button>
    </nav>
  </header>

  <section class="hero">
    <h1>Conhecendo as <span>Religiões do Mundo</span></h1>
    <p>Um espaço informativo sobre história, filosofia, símbolos e diversidade cultural das tradições espirituais.</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar artigos (ex: Budismo, templos, história)...">
    </div>
  </section>

  <main class="container">
    <div id="postsGrid" class="posts-grid"></div>
  </main>

  <!-- Modal de leitura -->
  <div id="articleModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close-btn">&times;</button>
      <span id="modalCategory" class="badge"></span>
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="date"></p>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <footer>
    <p>Horizontes da Fé &bull; Estudo cultural e histórico sobre religiões</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
