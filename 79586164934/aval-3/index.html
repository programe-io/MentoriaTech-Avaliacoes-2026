<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaClone | HTML, CSS & JS</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-content">
      <h1 class="brand">InstaClone</h1>
      <button id="openModalBtn" class="new-post-btn">+ Nova Publicação</button>
    </div>
  </header>

  <main class="main-container">
    <!-- Barra de Stories -->
    <section id="storiesBar" class="stories-bar"></section>

    <!-- Feed de Publicações -->
    <section id="feedContainer" class="feed"></section>
  </main>

  <!-- Modal para Nova Publicação -->
  <div id="postModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Criar nova publicação</h3>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      <form id="newPostForm">
        <input type="text" id="usernameInput" placeholder="Seu nome de usuário (ex: joao.dev)" required>
        <input type="url" id="imageUrlInput" placeholder="URL da imagem (ex: https://picsum.photos)" required>
        <textarea id="captionInput" rows="3" placeholder="Escreva uma legenda..." required></textarea>
        <button type="submit" class="submit-btn">Compartilhar</button>
      </form>
    </div>
  </div>

  <!-- Visualizador de Story -->
  <div id="storyModal" class="modal hidden">
    <div class="story-viewer">
      <button id="closeStoryBtn" class="close-story">&times;</button>
      <div class="story-user-info">
        <img id="storyAvatar" src="" alt="">
        <span id="storyUser"></span>
      </div>
      <img id="storyImage" class="story-img" src="" alt="Story">
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
