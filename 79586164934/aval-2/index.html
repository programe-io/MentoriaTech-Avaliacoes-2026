<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terra Viva | Blog sobre a Natureza</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="navbar">
    <div class="logo">TERRA<span>VIVA</span></div>
    <nav class="filters">
      <button class="filter-btn active" data-category="todos">Todos</button>
      <button class="filter-btn" data-category="florestas">Florestas</button>
      <button class="filter-btn" data-category="oceanos">Oceanos</button>
      <button class="filter-btn" data-category="fauna">Fauna</button>
    </nav>
  </header>

  <section class="hero">
    <h1>Explore a beleza do <span>Mundo Natural</span></h1>
    <p>Histórias, curiosidades e descobertas sobre biomas, vida selvagem e preservação.</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar artigos (ex: Amazônia, corais, aves)...">
    </div>
  </section>

  <main class="container">
    <div id="postsGrid" class="posts-grid"></div>
  </main>

  <!-- Modal de leitura -->
  <div id="articleModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close-btn">&times;</button>
      <span id="modalCategory" class="badge"></span>
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="date"></p>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <footer>
    <p>Terra Viva &bull; Blog dedicado à natureza e biodiversidade</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
