<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed Social</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topbar">
    <h1>Mini<span>Feed</span></h1>
  </header>

  <main class="feed-container">
    <!-- Caixa para criar post -->
    <section class="composer">
      <div class="composer-header">
        <div class="avatar">VC</div>
        <input type="text" id="authorInput" placeholder="Seu nome (ex: Ana Silva)" maxlength="25">
      </div>
      <textarea id="postInput" rows="3" maxlength="280" placeholder="O que está acontecendo agora?"></textarea>
      <div class="composer-footer">
        <span id="charCount">280</span>
        <button id="publishBtn">Publicar</button>
      </div>
    </section>

    <!-- Lista de publicações -->
    <section id="feedList" class="feed-list"></section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
