
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header class="topo">
        <div>
            <h1>✓ Gerenciador de Tarefas</h1>
            <p>Organize suas atividades e acompanhe seu progresso.</p>
        </div>
    </header>

    <main class="container">
        <section class="resumo">
            <article class="card">
                <span>Total de tarefas</span>
                <strong id="totalTarefas">0</strong>
            </article>

            <article class="card">
                <span>Pendentes</span>
                <strong id="totalPendentes">0</strong>
            </article>

            <article class="card">
                <span>Em andamento</span>
                <strong id="totalAndamento">0</strong>
            </article>

            <article class="card">
                <span>Concluídas</span>
                <strong id="totalConcluidas">0</strong>
            </article>
        </section>

        <section class="painel">
            <h2 id="tituloFormulario">Nova tarefa</h2>

            <form id="formTarefa">
                <input type="hidden" id="tarefaId">

                <div class="campos">
                    <label>
                        Título da tarefa
                        <input type="text" id="titulo"
                            placeholder="Ex.: Estudar JavaScript" required>
                    </label>

                    <label>
                        Categoria
                        <input type="text" id="categoria"
                            placeholder="Ex.: Estudos" required>
                    </label>

                    <label>
                        Data de vencimento
                        <input type="date" id="prazo" required>
                    </label>

                    <label>
                        Prioridade
                        <select id="prioridade" required>
                            <option value="Baixa">Baixa</option>
                            <option value="Média" selected>Média</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </label>

                    <label>
                        Status
                        <select id="status" required>
                            <option value="Pendente">Pendente</option>
                            <option value="Em andamento">Em andamento</option>
                            <option value="Concluída">Concluída</option>
                        </select>
                    </label>
                </div>

                <label class="descricao-label">
                    Descrição
                    <textarea id="descricao"
                        placeholder="Detalhes da tarefa (opcional)"
                        rows="3"></textarea>
                </label>

                <div class="acoes">
                    <button type="submit" id="btnSalvar">
                        Adicionar tarefa
                    </button>
                    <button type="button" id="btnCancelar"
                        class="secundario oculto">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <section class="painel">
            <h2>Minhas tarefas</h2>

            <div class="filtros">
                <input type="search" id="pesquisa"
                    placeholder="Buscar tarefas...">

                <select id="filtroStatus">
                    <option value="">Todos os status</option>
                    <option value="Pendente">Pendentes</option>
                    <option value="Em andamento">Em andamento</option>
                    <option value="Concluída">Concluídas</option>
                </select>

                <select id="filtroPrioridade">
                    <option value="">Todas as prioridades</option>
                    <option value="Alta">Alta</option>
                    <option value="Média">Média</option>
                    <option value="Baixa">Baixa</option>
                </select>

                <select id="ordenacao">
                    <option value="prazo">Ordenar por prazo</option>
                    <option value="prioridade">Ordenar por prioridade</option>
                    <option value="recente">Mais recentes</option>
                </select>
            </div>

            <div id="listaTarefas" class="lista-tarefas"></div>

            <p id="mensagemVazia" class="vazio">
                Nenhuma tarefa cadastrada.
            </p>
        </section>
    </main>

    <footer>
        Gerenciador de Tarefas &copy; 2026
    </footer>
<script src="script.js"></script></body>
</html>
