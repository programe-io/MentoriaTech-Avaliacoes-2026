
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>VS Instagram</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>
                <body>

                <div id="login" class="login">
                    <h1>VS Instagram</h1>
                        <input id="usuario" placeholder="Nome de usuário">
                            <input id="senha" type="password" placeholder="Senha">
                                <button onclick="entrar()">Entrar</button>
                                    <p>Projeto educativo de rede social</p>
                                    </div>

                                    <div id="app" hidden>

                                    <header>
                                        <h1>VS Instagram</h1>
                                            <input id="pesquisa" placeholder="Pesquisar..." oninput="pesquisar()">
                                                <button onclick="sair()">Sair</button>
                                                </header>

                                                <main>
                                                    <section class="perfil">
                                                            <div class="avatar">V</div>
                                                                    <div>
                                                                                <h2 id="nomePerfil">Vitinho V11</h2>
                                                                                            <p>Fé, foco e determinação! ⚽</p>
                                                                                                        <p>Publicações: <span id="total">0</span></p>
                                                                                                                </div>
                                                                                                                    </section>

                                                                                                                        <section class="stories">
                                                                                                                                <div><span>🟣</span>Seu story</div>
                                                                                                                                        <div><span>🔵</span>Lucas</div>
                                                                                                                                                <div><span>🟠</span>Maria</div>
                                                                                                                                                        <div><span>🔴</span>Pedro</div>
                                                                                                                                                            </section>

                                                                                                                                                                <section class="criar">
                                                                                                                                                                        <h2>Criar publicação</h2>
                                                                                                                                                                                <textarea id="legenda" placeholder="No que você está pensando?"></textarea>
                                                                                                                                                                                        <input type="file" id="foto" accept="image/*">
                                                                                                                                                                                                <button onclick="publicar()">Publicar</button>
                                                                                                                                                                                                    </section>

                                                                                                                                                                                                        <section id="feed"></section>
                                                                                                                                                                                                        </main>

                                                                                                                                                                                                        <footer>
                                                                                                                                                                                                            <span>🏠 Início</span>
                                                                                                                                                                                                                <span>🔍 Pesquisa</span>
                                                                                                                                                                                                                    <span>❤️ Curtidas</span>
                                                                                                                                                                                                                        <span>👤 Perfil</span>
                                                                                                                                                                                                                        </footer>

                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                        </html>
