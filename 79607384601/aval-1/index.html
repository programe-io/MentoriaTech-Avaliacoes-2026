
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetor Pro</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>PROJETOR PRO</h1>
        <span>Central de apresentação</span>
    </header>

    <div class="container">

        <aside class="controls">
            <h2>Painel de controle</h2>

            <label>Texto da apresentação</label>
            <textarea id="texto" placeholder="Digite sua apresentação..."></textarea>

            <label>Adicionar imagem</label>
            <input type="file" id="arquivo" accept="image/*">

            <label>Cor de fundo</label>
            <input type="color" id="cor" value="#000000">

            <label>Tamanho do texto</label>
            <input type="range" id="tamanho" min="20" max="100" value="45">

            <button onclick="mostrarTexto()">Projetar texto</button>
            <button onclick="mostrarImagem()">Projetar imagem</button>
            <button onclick="telaCheia()">Tela cheia</button>
            <button class="limpar" onclick="limparTela()">Limpar projeção</button>
        </aside>

        <main class="preview">
            <div id="projecao">
                <h1>PROJETOR PRO</h1>
                <p>Sua apresentação começa aqui</p>
            </div>
        </main>

    </div>

    <footer>
        PROJETOR PRO © 2026
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
