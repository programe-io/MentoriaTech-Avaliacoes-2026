<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <section class="card">
    <h2>🎯 RASTREADOR DE CABEÇA</h2>

    <p class="note">
        Rastreador demonstrativo para testar
        o funcionamento do painel.
    </p>

    <button id="trackerToggle">
        ATIVAR RASTREADOR
    </button>

    <button id="trackerReset" class="secondary">
        REINICIAR
    </button>

    <div class="control">
        <label>Velocidade do alvo</label>
        <input
            type="range"
            id="trackerSpeed"
            min="1"
            max="10"
            value="3"
        >
        <span id="trackerSpeedValue">3</span>
    </div>

    <div id="trackerArena">
        <div id="trackerTarget">🔴</div>
        <div id="trackerCrosshair">+</div>
    </div>

    <div id="trackerStatus" class="status">
        Rastreador desligado.
    </div>
</section>

<style>
#trackerArena {
    height: 220px;
    position: relative;
    overflow: hidden;
    background: #101018;
    border: 1px solid #444;
    border-radius: 12px;
    margin-top: 12px;
}

#trackerTarget {
    position: absolute;
    left: 48%;
    top: 48%;
    font-size: 30px;
    transform: translate(-50%, -50%);
}

#trackerCrosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    color: white;
    font-size: 28px;
    transform: translate(-50%, -50%);
}
</style>



  <script src="script.js"></script>
  
</body>
</html>
