<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Aplicativo de Tarefas</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      align-self: flex-start;
    }

    header {
      margin-bottom: 1.25rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button.add-btn {
      padding: 0.7rem 1.1rem;
      border: none;
      border-radius: 10px;
      background-color: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.add-btn:hover {
      background-color: var(--accent-hover);
    }

    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .filter-btn {
      flex: 1;
      padding: 0.45rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
    }

    .filter-btn.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    li.task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex: 1;
      cursor: pointer;
    }

    .task-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .task-text {
      font-size: 0.95rem;
      word-break: break-word;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
      padding: 0.25rem 0.4rem;
      border-radius: 6px;
    }

    .delete-btn:hover {
      color: var(--danger);
      background-color: rgba(239, 68, 68, 0.12);
    }

    .footer {
      margin-top: 1.25rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .clear-btn:hover {
      color: var(--text);
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="app">
    <header>
      <h1>Minhas Tarefas</h1>
      <p id="statusText">0 tarefas pendentes</p>
    </header>

    <form class="input-group" id="taskForm">
      <input type="text" id="taskInput" placeholder="Digite uma nova tarefa..." autocomplete="off" required />
      <button type="submit" class="add-btn">Adicionar</button>
    </form>

    <div class="filters">
      <button type="button" class="filter-btn active" data-filter="all">Todas</button>
      <button type="button" class="filter-btn" data-filter="active">Pendentes</button>
      <button type="button" class="filter-btn" data-filter="completed">Concluídas</button>
    </div>

    <ul id="taskList"></ul>

    <div class="footer">
      <span id="totalCount">Total: 0</span>
      <button type="button" class="clear-btn" id="clearCompleted">Limpar concluídas</button>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "html_todo_app_v1";
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentFilter = "all";

    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const statusText = document.getElementById("statusText");
    const totalCount = document.getElementById("totalCount");
    const clearCompletedBtn = document.getElementById("clearCompleted");
    const filterButtons = document.querySelectorAll(".filter-btn");

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function renderTasks() {
      const filtered = tasks.filter((task) => {
        if (currentFilter === "active") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
      });

      taskList.innerHTML = "";

      filtered.forEach((task) => {
        const li = document.createElement("li");
        li.className = `task ${task.completed ? "completed" : ""}`;

        const left = document.createElement("label");
        left.className = "task-left";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const span = document.createElement("span");
        span.className = "task-text";
        span.textContent = task.text;

        left.appendChild(checkbox);
        left.appendChild(span);

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "delete-btn";
        delBtn.title = "Excluir tarefa";
        delBtn.textContent = "✕";
        delBtn.addEventListener("click", () => deleteTask(task.id));

        li.appendChild(left);
        li.appendChild(delBtn);
        taskList.appendChild(li);
      });

      const pendingCount = tasks.filter((t) => !t.completed).length;
      statusText.textContent = `${pendingCount} ${pendingCount === 1 ? "tarefa pendente" : "tarefas pendentes"}`;
      totalCount.textContent = `Total: ${tasks.length}`;
    }

    function addTask(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      tasks.unshift({
        id: Date.now().toString(),
        text: trimmed,
        completed: false,
      });
      saveTasks();
      renderTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map((t) => (t.id === id ? { ...t, completed: !t.completed } : t));
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter((t) => t.id !== id);
      saveTasks();
      renderTasks();
    }

    taskForm.addEventListener("submit", (e) => {
      e.preventDefault();
      addTask(taskInput.value);
      taskInput.value = "";
      taskInput.focus();
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        filterButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderTasks();
      });
    });

    clearCompletedBtn.addEventListener("click", () => {
      tasks = tasks.filter((t) => !t.completed);
      saveTasks();
      renderTasks();
    });

    renderTasks();
  </script>
<script src="script.js"></script></body>
</html>
