<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de IMC - Projeto Prático</title>
  <link rel="stylesheet" href="style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <h1>Controle de IMC</h1>
      <p>Explorando o JavaScript com o HTML</p>
    </header>

    <!-- Formulário de Entrada -->
    <section class="card">
      <h2>Dados do Paciente</h2>
      <form id="form-imc">
        <div class="grid-inputs">
          <div class="campo campo-nome">
            <label for="nome">Nome do Paciente</label>
            <input type="text" id="nome" placeholder="Ex: Maria Silva" required />
          </div>

          <div class="campo">
            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso" step="0.1" min="1" placeholder="Ex: 68.5" required />
          </div>

          <div class="campo">
            <label for="altura">Altura (m)</label>
            <input type="number" id="altura" step="0.01" min="0.5" max="2.5" placeholder="Ex: 1.65" required />
          </div>
        </div>

        <button type="submit" class="btn-primario">Calcular IMC</button>
      </form>
      <p id="erro" class="erro"></p>
    </section>

    <!-- Resultado Atual do Paciente -->
    <section id="card-resultado" class="card resultado-oculto">
      <h2>Resultado da Avaliação</h2>
      <div id="info-resultado" class="box-resultado"></div>
    </section>

    <!-- Histórico de Pacientes Avaliados -->
    <section class="card">
      <div class="topo-tabela">
        <h2>Histórico de Pacientes</h2>
        <button id="btn-limpar" class="btn-secundario" type="button">Limpar Histórico</button>
      </div>

      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Paciente</th>
              <th>Peso (kg)</th>
              <th>Altura (m)</th>
              <th>IMC</th>
              <th>Classificação</th>
            </tr>
          </thead>
          <tbody id="tabela-pacientes">
            <!-- Registros inseridos via JavaScript -->
          </tbody>
        </table>
      </div>
      <p id="lista-vazia" class="vazio">Nenhum cálculo realizado ainda.</p>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
