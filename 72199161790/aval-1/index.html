<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Controle de Estoque - CRUD</title>
  <link rel="stylesheet" href="style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <h1>Controle de Estoque</h1>
      <p>Projeto CRUD - Fundamentos Lógicos com JavaScript</p>
    </header>

    <!-- Formulário de Cadastro -->
    <section class="card">
      <h2>Cadastrar Novo Produto</h2>
      <form id="form-produto">
        <div class="grid-inputs">
          <div class="campo">
            <label for="codigo">Código</label>
            <input type="number" id="codigo" placeholder="Ex: 101" required />
          </div>

          <div class="campo">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" placeholder="Ex: Teclado Mecânico" required />
          </div>

          <div class="campo">
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="0" placeholder="Ex: 15" required />
          </div>

          <div class="campo">
            <label for="valor">Valor Unitário (R$)</label>
            <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 199.90" required />
          </div>
        </div>

        <button type="submit" class="btn-primario">Cadastrar Produto</button>
      </form>
      <p id="mensagem" class="mensagem"></p>
    </section>

    <!-- Listagem e Edição -->
    <section class="card">
      <div class="topo-tabela">
        <h2>Produtos Cadastrados</h2>
        <span id="total-geral" class="badge">Total em estoque: R$ 0,00</span>
      </div>

      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Descrição</th>
              <th>Quantidade</th>
              <th>Valor Unit. (R$)</th>
              <th>Subtotal (R$)</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-produtos">
            <!-- Linhas inseridas via JavaScript -->
          </tbody>
        </table>
      </div>
      <p id="lista-vazia" class="vazio">Nenhum produto cadastrado no momento.</p>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
