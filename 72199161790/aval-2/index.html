<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <h1>Gerenciador de Tarefas</h1>
      <p>Projeto - Fundamentos Lógicos com JavaScript</p>
    </header>

    <!-- Formulário de Cadastro -->
    <section class="card">
      <h2>Cadastrar Nova Tarefa</h2>
      <form id="form-tarefa">
        <div class="grid-inputs">
          <div class="campo">
            <label for="codigo">Código</label>
            <input type="number" id="codigo" placeholder="Ex: 1" required />
          </div>

          <div class="campo campo-titulo">
            <label for="titulo">Título (mín. 5 caracteres)</label>
            <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript" required />
          </div>

          <div class="campo">
            <label for="prioridade">Prioridade (1 a 3)</label>
            <select id="prioridade" required>
              <option value="1">1 - Alta</option>
              <option value="2" selected>2 - Média</option>
              <option value="3">3 - Baixa</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-primario">Cadastrar Tarefa</button>
      </form>
      <p id="mensagem" class="mensagem"></p>
    </section>

    <!-- Listagem e Gerenciamento -->
    <section class="card">
      <div class="topo-tabela">
        <h2>Tarefas Cadastradas</h2>
        <span id="resumo-tarefas" class="badge">0 tarefas | 0 concluídas</span>
      </div>

      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Título</th>
              <th>Prioridade</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-tarefas">
            <!-- Tarefas inseridas via JavaScript -->
          </tbody>
        </table>
      </div>
      <p id="lista-vazia" class="vazio">Nenhuma tarefa cadastrada no momento.</p>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
