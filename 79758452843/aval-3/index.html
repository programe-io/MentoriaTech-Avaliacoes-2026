<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalie Nossa Escola de Natação | AquaFitness</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        \}

        body {
            background-color: #e0f2fe; /* Azul claro refrescante */
            color: #1e3a8a; /* Azul marinho escuro para melhor leitura */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        \}

        .container {
            background-color: #ffffff;
            max-width: 500px;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(30, 58, 138, 0.15);
            text-align: center;
            border-top: 10px solid #0284c7; /* Azul Piscina */
        \}

        .header {
            padding: 35px 20px 10px 20px;
        \}

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        \}

        h1 {
            font-size: 24px;
            color: #1e3a8a;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        \}

        p {
            font-size: 15px;
            color: #475569;
            line-height: 1.6;
            padding: 0 25px;
            margin-bottom: 30px;
        \}

        .stars {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 35px;
        \}

        .star {
            font-size: 34px;
            color: #f59e0b; /* Estrelas em tom dourado quente */
        \}

        .btn-container {
            padding: 0 20px;
        \}

        .btn-avaliacao {
            display: inline-block;
            background-color: #0284c7; /* Azul Piscina */
            color: #ffffff;
            text-decoration: none;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 30px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-bottom: 35px;
            width: 85%;
            box-shadow: 0 5px 15px rgba(2, 132, 199, 0.3);
        \}

        .btn-avaliacao:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
        \}

        .btn-avaliacao:active {
            transform: translateY(0);
        \}

        .footer {
            background-color: #f8fafc;
            padding: 18px;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            font-weight: bold;
        \}
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <div class="header">
            <!-- Ícone temático de natação -->
            <div class="icon">🏊‍♂️</div>
            <h1>Dê um mergulho e deixe sua nota!</h1>
        </div>
        
        <p>Sua opinião nos ajuda a manter a qualidade de nossas piscinas, a segurança das aulas e a dedicação dos nossos professores. Leva menos de 1 minuto!</p>
        
        <!-- Cinco estrelas para incentivar a nota máxima -->
        <div class="stars">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
        </div>

        <!-- COLOQUE O SEU LINK DE AVALIAÇÃO DO GOOGLE OU FORMULÁRIO NO HREF ABAIXO -->
        <div class="btn-container">
            <a href="https://google.com" target="_blank" class="btn-avaliacao">
                Avaliar Escola
            </a>
        </div>

        <div class="footer">
            Obrigado por nadar e evoluir com a gente!
        </div>
    </div>

<script src="script.js"></script></body>
</html>$0
