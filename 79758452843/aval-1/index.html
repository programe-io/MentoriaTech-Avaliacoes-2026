<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalie Nossa Escola de Futebol Americano</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Impact', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        \}

        body {
            background-color: #1b3122; /* Verde escuro do gramado */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        \}

        .container {
            background-color: #ffffff;
            color: #2c3e50;
            max-width: 500px;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            border-top: 10px solid #5a3825; /* Marrom couro da bola */
        \}

        .header {
            padding: 35px 20px 10px 20px;
        \}

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        \}

        h1 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 26px;
            color: #1b3122;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        \}

        p {
            font-size: 15px;
            color: #555;
            line-height: 1.6;
            padding: 0 25px;
            margin-bottom: 30px;
        \}

        .stars {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 35px;
        \}

        .star {
            font-size: 34px;
            color: #f1c40f;
        \}

        .btn-container {
            padding: 0 20px;
        \}

        .btn-avaliacao {
            display: inline-block;
            background-color: #5a3825; /* Cor da bola */
            color: #ffffff;
            text-decoration: none;
            padding: 16px 40px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px; /* Cantos mais retos estilo esporte */
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-bottom: 35px;
            width: 80%;
            box-shadow: 0 5px 15px rgba(90, 56, 37, 0.4);
            border-bottom: 4px solid #3d2518;
        \}

        .btn-avaliacao:hover {
            background-color: #6e442e;
            transform: translateY(-2px);
        \}

        .btn-avaliacao:active {
            transform: translateY(0);
            border-bottom-width: 2px;
        \}

        .footer {
            background-color: #f4f6f4;
            padding: 18px;
            font-size: 12px;
            color: #7f8c8d;
            border-top: 1px solid #e2e8e2;
            font-weight: bold;
        \}
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <div class="header">
            <!-- Ícone temático de futebol americano -->
            <div class="icon">🏈</div>
            <h1>Garanta esse Touchdown!</h1>
        </div>
        
        <p>Sua avaliação é o nosso plano de jogo perfeito. Deixe seu feedback sobre nossos treinos, coaches e estrutura para nos ajudar a conquistar mais jardas!</p>
        
        <!-- Estrelas decorativas que estimulam nota máxima -->
        <div class="stars">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
        </div>

        <!-- REPLANTE O LINK ABAIXO PELO SEU LINK DO GOOGLE MEU NEGÓCIO OU FORMULÁRIO -->
        <div class="btn-container">
            <a href="https://google.com" target="_blank" class="btn-avaliacao">
                Avaliar o Time
            </a>
        </div>

        <div class="footer">
            Obrigado por vestir a nossa camisa!
        </div>
    </div>

<script src="script.js"></script></body>
</html>$0
