<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalie Nossa Escola de Tiro | Centro de Treinamento</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        \}

        body {
            background-color: #1a1a1a; /* Fundo escuro tático */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        \}

        .container {
            background-color: #262626; /* Container grafite */
            color: #ffffff;
            max-width: 500px;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            border-top: 6px solid #d4af37; /* Detalhe em Dourado/Latão */
        \}

        .header {
            padding: 40px 20px 10px 20px;
        \}

        .icon-target {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px auto;
            border: 4px dashed #d4af37;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            background-color: #1a1a1a;
        \}

        h1 {
            font-size: 24px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 700;
        \}

        p {
            font-size: 15px;
            color: #b3b3b3;
            line-height: 1.6;
            padding: 0 25px;
            margin-bottom: 30px;
        \}

        .stars {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 35px;
        \}

        .star {
            font-size: 34px;
            color: #d4af37; /* Estrelas douradas */
        \}

        .btn-container {
            padding: 0 20px;
        \}

        .btn-avaliacao {
            display: inline-block;
            background-color: #c0392b; /* Vermelho fosco de alerta/ação */
            color: #ffffff;
            text-decoration: none;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-bottom: 40px;
            width: 85%;
            box-shadow: 0 5px 15px rgba(192, 57, 43, 0.4);
        \}

        .btn-avaliacao:hover {
            background-color: #e74c3c;
            transform: translateY(-2px);
        \}

        .btn-avaliacao:active {
            transform: translateY(0);
        \}

        .footer {
            background-color: #1e1e1e;
            padding: 18px;
            font-size: 12px;
            color: #777;
            border-top: 1px solid #2d2d2d;
            letter-spacing: 0.5px;
        \}
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <div class="header">
            <!-- Alvo estilizado em CSS e Emoji -->
            <div class="icon-target">🎯</div>
            <h1>Sua avaliação na mosca!</h1>
        </div>
        
        <p>Sua opinião nos ajuda a manter o mais alto padrão de segurança, instrução e estrutura. Leve menos de 1 minuto para registrar sua nota máxima!</p>
        
        <!-- Cinco estrelas para incentivar nota máxima -->
        <div class="stars">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
        </div>

        <!-- COLE O SEU LINK DE AVALIAÇÃO DO GOOGLE OU FORMULÁRIO NO HREF ABAIXO -->
        <div class="btn-container">
            <a href="https://google.com" target="_blank" class="btn-avaliacao">
                Enviar Minha Nota
            </a>
        </div>

        <div class="footer">
            Obrigado pela confiança e bons tiros!
        </div>
    </div>

<script src="script.js"></script></body>
</html>$0
