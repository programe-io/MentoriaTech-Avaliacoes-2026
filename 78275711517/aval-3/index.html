<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Dark Clone</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones via FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body class="dark-mode">

    <!-- Barra Lateral (Sidebar) -->
    <aside class="sidebar">
        <h1 class="logo">Instagram</h1>
        <nav class="nav-links">
            <a href="#" class="active"><i class="fa-solid fa-house"></i> Início</a>
            <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Pesquisa</a>
            <a href="#"><i class="fa-regular fa-compass"></i> Explorar</a>
            <a href="#"><i class="fa-regular fa-square-plus"></i> Criar</a>
            <a href="#"><i class="fa-regular fa-user"></i> Perfil</a>
        </nav>
    </aside>

    <!-- Conteúdo Principal (Feed e Stories) -->
    <main class="main-content">
        
        <!-- Área de Stories -->
        <section class="stories-container">
            <div class="story">
                <div class="story-ring"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWwr6jaDMAqZ4GLG7k5CwluRORDVhLVHtHA2hQCBW3vA&s=10" alt="Avatar"></div>
                <span>seu_perfil</span>
            </div>
            <div class="story">
                <div class="story-ring"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLgwPEbZjmhb-PIo1HasszzA2havoabOgnJOwFn4Azgw&s=10" alt="Avatar"></div>
                <span>user_leo</span>
            </div>
            <div class="story">
                <div class="story-ring"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTE0xnWdDMxU3foUrtaf1xalLGfZCSd3hJR_e7InI-0sg&s=10" alt="Avatar"></div>
                <span>maria_dev</span>
            </div>
            <div class="story">
                <div class="story-ring"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6cVTLYzNc16OdiMi7PsRlb-mSb2-QkFSp01GOWmcxKg&s=10" alt="Avatar"></div>
                <span>joao_js</span>
            </div>
        </section>

        <!-- Feed de Posts -->
        <section class="feed">
            <article class="post">
                <header class="post-header">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLgwPEbZjmhb-PIo1HasszzA2havoabOgnJOwFn4Azgw&s=10" alt="Avatar" class="avatar-sm">
                    <span class="username">user_leo</span>
                </header>
                <div class="post-image">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxm5uFbaO2SChxdeT8yJJIMjJp4XSkB6JVWBs_BdOsGw&s=10" alt="Postagem">
                </div>
                <div class="post-actions">
                    <i class="fa-regular fa-heart like-btn"></i>
                    <i class="fa-regular fa-comment"></i>
                    <i class="fa-regular fa-paper-plane"></i>
                </div>
                <div class="post-info">
                    <p class="likes-count"><strong>1,240 curtidas</strong></p>
                    <p class="caption"><strong>user_leo</strong> Explorando o novo layout escuro do projeto! 🚀 #frontend #css</p>
                </div>
            </article>
        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
