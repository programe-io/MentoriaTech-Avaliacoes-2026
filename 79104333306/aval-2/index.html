
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio da Internet e Web</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <header>
            <h1>🌐 Desafio da Internet</h1>
            <p>Teste seus conhecimentos sobre Internet e Web!</p>
        </header>

        <div id="inicio" class="tela">
            <h2>Bem-vindo ao Quiz!</h2>
            <p>
                Responda às perguntas e descubra
                quanto você sabe sobre a Internet.
            </p>
            <button onclick="iniciarJogo()">
                Começar Jogo
            </button>
        </div>

        <div id="quiz" class="tela escondido">

            <div class="informacoes">
                <span id="progresso">Pergunta 1 de 10</span>
                <span id="pontuacao">Pontos: 0</span>
            </div>

            <div class="barra">
                <div id="progresso-barra"></div>
            </div>

            <h2 id="pergunta"></h2>

            <div id="alternativas"></div>

            <p id="feedback"></p>

            <button id="proximo" onclick="proximaPergunta()" disabled>
                Próxima pergunta
            </button>

        </div>

        <div id="resultado" class="tela escondido">
            <h2>🏆 Fim do jogo!</h2>

            <p id="mensagem-final"></p>

            <h3 id="pontuacao-final"></h3>

            <button onclick="reiniciarJogo()">
                Jogar novamente
            </button>
        </div>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
