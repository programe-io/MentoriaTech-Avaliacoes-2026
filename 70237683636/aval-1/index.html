<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMC + Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Saúde & Tarefas</h1>

    <section class="card">
      <h2>Calculadora de IMC</h2>
      <form id="imc-form">
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" step="0.1" min="1" required />

        <label for="altura">Altura (m)</label>
        <input type="number" id="altura" step="0.01" min="0.3" required />

        <button type="submit">Calcular IMC</button>
      </form>
      <p id="imc-resultado">Preencha peso e altura para calcular.</p>
    </section>

    <section class="card">
      <h2>Gerenciador de Tarefas</h2>
      <form id="tarefa-form">
        <input type="text" id="tarefa-input" placeholder="Ex: Caminhar 30 min" required />
        <button type="submit">Adicionar</button>
      </form>
      <ul id="lista-tarefas"></ul>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
