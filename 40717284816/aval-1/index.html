<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Sistema de Estoque</h1>
        <p class="subtitulo">Gerenciamento de produtos</p>

        <!-- Cadastro -->
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <div class="form-group">
                <label for="codigo">Código</label>
                <input type="text" id="codigo" placeholder="Digite o código">
            </div>

            <div class="form-group">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" placeholder="Digite a descrição">
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" placeholder="Digite a quantidade" min="0">
            </div>

            <div class="form-group">
                <label for="valor">Valor</label>
                <input type="number" id="valor" placeholder="Digite o valor" min="0" step="0.01">
            </div>

            <button onclick="cadastrarProduto()">Cadastrar Produto</button>
        </section>

        <!-- Alterações -->
        <section class="card">
            <h2>Alterar Produto</h2>

            <div class="form-group">
                <label for="codigoAlteracao">Código do produto</label>
                <input type="text" id="codigoAlteracao" placeholder="Digite o código">
            </div>

            <div class="botoes">
                <button onclick="alterarValor()">Alterar Valor</button>
                <button onclick="alterarQuantidade()">Alterar Quantidade</button>
            </div>
        </section>

        <!-- Lista -->
        <section class="card">
            <div class="titulo-lista">
                <h2>Produtos Cadastrados</h2>
                <button class="btn-listar" onclick="listarProdutos()">
                    Atualizar Lista
                </button>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Produtos aparecerão aqui -->
                    </tbody>
                </table>
            </div>
        </section>

        <div id="mensagem"></div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
