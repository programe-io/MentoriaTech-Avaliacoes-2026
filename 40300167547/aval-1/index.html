<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <header class="topo">
            <h1>📦 Controle de Estoque</h1>
            <p>Cadastre e gerencie seus produtos de forma simples.</p>
        </header>

        <section class="resumo">
            <div class="card-resumo">
                <span>Produtos</span>
                <strong id="totalProdutos">0</strong>
            </div>
            <div class="card-resumo">
                <span>Itens em estoque</span>
                <strong id="totalItens">0</strong>
            </div>
            <div class="card-resumo destaque">
                <span>Valor do estoque</span>
                <strong id="valorEstoque">R$ 0,00</strong>
            </div>
        </section>

        <section class="painel">
            <h2>Novo produto</h2>

            <form id="formProduto" autocomplete="off">
                <div class="campo campo-grande">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" placeholder="Ex.: Teclado mecânico" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="1" step="1" placeholder="0" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor unitário (R$)</label>
                    <input type="number" id="valor" min="0" step="0.01" placeholder="0,00" required>
                </div>

                <button type="submit" class="botao botao-salvar">Salvar produto</button>
            </form>

            <p id="mensagem" role="status"></p>
        </section>

        <section class="painel">
            <div class="painel-topo">
                <h2>Produtos cadastrados</h2>
                <input type="search" id="pesquisa" class="busca" placeholder="🔍 Pesquisar produto...">
            </div>

            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Qtd.</th>
                            <th>Valor unit.</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
