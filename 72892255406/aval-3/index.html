<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Avaliação 3º Trimestre - Lista de Tarefas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Minhas Tarefas</h1>
    <p>Adicione, conclua ou remova suas atividades do dia.</p>

    <div class="input-grupo">
      <input type="text" id="novaTarefa" placeholder="Digite uma nova tarefa...">
      <button id="btnAdicionar">Adicionar</button>
    </div>

    <ul id="listaTarefas" class="lista"></ul>

    <div class="rodape">
      <span id="contador">Total: 0 tarefas</span>
      <button id="btnLimpar" class="btn-secundario">Limpar tudo</button>
    </div>
  </main>
<script src="script.js"></script></body>
</html>
