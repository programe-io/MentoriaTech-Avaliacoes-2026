<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Avaliação 2º Trimestre - Calculadora de Média</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Calculadora de Média</h1>
    <p>Digite as três notas do trimestre para verificar a situação do aluno.</p>

    <div class="campo">
      <label for="nota1">1ª Nota:</label>
      <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Ex: 7.5">
    </div>

    <div class="campo">
      <label for="nota2">2ª Nota:</label>
      <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="Ex: 8.0">
    </div>

    <div class="campo">
      <label for="nota3">3ª Nota:</label>
      <input type="number" id="nota3" min="0" max="10" step="0.1" placeholder="Ex: 6.5">
    </div>

    <button id="btnCalcular">Calcular Média</button>

    <div id="resultado" class="resultado oculto"></div>
  </main>
<script src="script.js"></script></body>
</html>
