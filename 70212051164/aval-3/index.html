
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #101720;
            color: #e5e7eb;
            padding: 20px;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background-color: #182433;
            border: 1px solid #293747;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 13px;
            margin-bottom: 15px;
        }

        .formulario {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 11px;
            color: #cbd5e1;
        }

        input {
            background-color: #172333;
            border: 1px solid #293747;
            border-radius: 4px;
            padding: 8px;
            color: white;
            width: 100%;
            outline: none;
            font-size: 12px;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            background-color: #3b82f6;
            border: none;
            border-radius: 4px;
            color: white;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 12px;
        }

        button:hover {
            background-color: #2563eb;
        }

        .botao {
            margin-top: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        th, td {
            padding: 10px 5px;
            text-align: left;
            border-bottom: 1px solid #293747;
        }

        th {
            color: #94a3b8;
        }

        .vazio {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
        }

        .excluir {
            background-color: #dc2626;
            padding: 5px 8px;
        }

        .excluir:hover {
            background-color: #b91c1c;
        }

        @media (max-width: 600px) {
            .formulario {
                grid-template-columns: repeat(2, 1fr);
            }

            .tabela {
                overflow-x: auto;
            }

            table {
                min-width: 650px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h2>Calculadora de IMC</h2>

        <div class="card">

            <h3>Nova pessoa</h3>

            <form id="formulario">

                <div class="formulario">

                    <div class="campo">
                        <label>Nome</label>
                        <input type="text" id="nome" placeholder="Ex: Francisco" required>
                    </div>

                    <div class="campo">
                        <label>Idade (anos)</label>
                        <input type="number" id="idade" placeholder="Ex: 30" min="1" required>
                    </div>

                    <div class="campo">
                        <label>Altura (m)</label>
                        <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01" min="0.01" required>
                    </div>

                    <div class="campo">
                        <label>Peso (kg)</label>
                        <input type="number" id="peso" placeholder="Ex: 70" step="0.1" min="0.1" required>
                    </div>

                </div>

                <div class="botao">
                    <button type="submit">Salvar</button>
                </div>

            </form>

        </div>

        <div class="card">

            <h3>Pessoas cadastradas</h3>

            <div class="tabela">

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="lista">

                        <tr>
                            <td colspan="7" class="vazio">
                                Nenhuma pessoa cadastrada ainda.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script>

        const formulario = document.getElementById("formulario");
        const lista = document.getElementById("lista");

        let pessoas = [];

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            const nome = document.getElementById("nome").value;
            const idade = Number(document.getElementById("idade").value);
            const altura = Number(document.getElementById("altura").value);
            const peso = Number(document.getElementById("peso").value);

            if (altura <= 0 || peso <= 0 || idade <= 0) {
                alert("Digite valores válidos!");
                return;
            }

            const imc = peso / (altura * altura);

            let classificacao;

            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            } else if (imc < 25) {
                classificacao = "Peso normal";
            } else if (imc < 30) {
                classificacao = "Sobrepeso";
            } else if (imc < 35) {
                classificacao = "Obesidade I";
            } else if (imc < 40) {
                classificacao = "Obesidade II";
            } else {
                classificacao = "Obesidade III";
            }

            const pessoa = {
                nome: nome,
                idade: idade,
                altura: altura,
                peso: peso,
                imc: imc.toFixed(2),
                classificacao: classificacao
            };

            pessoas.push(pessoa);

            mostrarPessoas();

            formulario.reset();

        });

        function mostrarPessoas() {

            lista.innerHTML = "";

            if (pessoas.length === 0) {

                lista.innerHTML = `
                    <tr>
                        <td colspan="7" class="vazio">
                            Nenhuma pessoa cadastrada ainda.
                        </td>
                    </tr>
                `;

                return;
            }

            pessoas.forEach(function(pessoa, indice) {

                lista.innerHTML += `
                    <tr>
                        <td>${pessoa.nome}</td>
                        <td>${pessoa.idade}</td>
                        <td>${pessoa.altura} m</td>
                        <td>${pessoa.peso} kg</td>
                        <td>${pessoa.imc}</td>
                        <td>${pessoa.classificacao}</td>
                        <td>
                            <button class="excluir" onclick="excluirPessoa(${indice})">
                                Excluir
                            </button>
                        </td>
                    </tr>
                `;

            });

        }

        function excluirPessoa(indice) {

            pessoas.splice(indice, 1);

            mostrarPessoas();

        }

    </script>

</body>
</html>
