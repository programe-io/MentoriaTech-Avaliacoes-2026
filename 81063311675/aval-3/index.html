<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#100d18">
    <title>Instagram Sofia</title>
    <link rel="stylesheet" href="styles.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topbar">
    <a class="marca" href="#" onclick="mostrar('inicio'); return false;">
        ✦ instagram
    </a>

    <label class="busca-wrap">
        <span>⌕</span>
        <input type="search" id="busca"
        placeholder="Buscar pessoas e momentos"
        oninput="pesquisar(this.value)">
    </label>

    <button class="botao-icone"
    onclick="mostrar('notificacoes')">♧</button>
</header>

<aside class="navegacao">
    <p class="nav-legenda">MENU</p>
    <button class="nav-item" onclick="mostrar('inicio')">⌂ Início</button>
    <button class="nav-item" onclick="mostrar('amigos')">♙ Amigos</button>
    <button class="nav-item" onclick="mostrar('melhores')">♥ Melhores amigos</button>
    <button class="nav-item" onclick="mostrar('mensagens')">▤ Mensagens</button>
    <button class="nav-item" onclick="mostrar('notificacoes')">♧ Notificações</button>

    <p class="nav-legenda">SEU ESPAÇO</p>
    <button class="nav-item" onclick="mostrar('publicar')">＋ Criar publicação</button>
    <button class="nav-item" onclick="mostrar('perfil')">◉ Meu perfil</button>

    <div class="nav-rodape">
        <span class="avatar avatar-voce">S</span>
        <div>
            <strong>Sofia</strong>
            <small>Compartilhe boas vibrações</small>
        </div>
    </div>
</aside>

<main id="conteudo" class="conteudo"></main>

<aside class="painel-direito">
    <section class="mini-perfil">
        <div class="capa-perfil"></div>
        <div class="mini-perfil-conteudo">
            <span class="avatar avatar-grande">S</span>
            <h3>Olá, Sofia! ✦</h3>
            <p>Seu espaço, suas histórias.</p>
            <div class="estatisticas">
                <div>
                    <strong id="contador-amigos">4</strong>
                    <span>amigos</span>
                </div>
                <div>
                    <strong id="contador-posts">3</strong>
                    <span>momentos</span>
                </div>
            </div>
        </div>
    </section>

    <section class="sugestoes">
        <h3>Para conhecer ✦</h3>
        <p>Marina Costa ☕</p>
        <p>João Pedro ✨</p>
        <p>Luiza Martins 🌿</p>
    </section>
</aside>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
