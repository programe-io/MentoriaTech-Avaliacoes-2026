<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  
<body>

    <header>

        <div class="logo">
            MiniFeed
        </div>

        <input
            class="search"
            type="text"
            placeholder="Pesquisar"
        >

        <div class="menu">
            🏠
            💬
            ❤️
            👤
        </div>

    </header>


    <main>

        <!-- Stories -->

        <section class="stories">

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=1">
                <p>joao</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=2">
                <p>maria</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=3">
                <p>lucas</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=4">
                <p>ana</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=5">
                <p>pedro</p>
            </div>

        </section>


        <!-- Post -->

        <article class="post">

            <div class="post-header">

                <img src="https://i.pravatar.cc/100?img=12">

                <span class="username">
                    usuario
                </span>

            </div>


            <img
                class="post-image"
                src="https://picsum.photos/600/600"
                alt="Foto da publicação"
            >


            <div class="actions">

                <span>♡</span>
                <span>💬</span>
                <span>➤</span>

            </div>


            <div class="likes">
                1.234 curtidas
            </div>


            <div class="caption">

                <strong>usuario</strong>

                Confira minha nova publicação! 📸

            </div>

        </article>


        <!-- Segundo post -->

        <article class="post">

            <div class="post-header">

                <img src="https://i.pravatar.cc/100?img=20">

                <span class="username">
                    desenvolvedor
                </span>

            </div>


            <img
                class="post-image"
                src="https://picsum.photos/600/601"
                alt="Foto da publicação"
            >


            <div class="actions">

                <span>♡</span>
                <span>💬</span>
                <span>➤</span>

            </div>


            <div class="likes">
                856 curtidas
            </div>


            <div class="caption">

                <strong>desenvolvedor</strong>

                Criando meu primeiro projeto! 💻

            </div>

        </article>

    </main>


    <footer>

        MiniFeed © 2026

    </footer>

</body>
</html>

  
  
</body>
</html>
