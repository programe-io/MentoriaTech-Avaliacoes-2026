<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>📦 Sistema de Estoque</h1>

    <form id="formProduto">
        <input type="text" id="codigo" placeholder="Código do produto" required>

        <input type="text" id="descricao" placeholder="Descrição do produto" required>

        <input type="number" id="quantidade" placeholder="Quantidade" min="0" required>

        <input type="number" id="valor" placeholder="Valor do produto (R$)" min="0" step="0.01" required>

        <button type="submit">Cadastrar Produto</button>
    </form>

    <h2>Produtos em Estoque</h2>

    <div id="listaProdutos"></div>

    <h3 id="totalEstoque">Total de produtos: 0</h3>
    <h3 id="valorEstoque">Valor total: R$ 0,00</h3>
</div>
  <script src="script.js"></script>
  
</body>
</html>
