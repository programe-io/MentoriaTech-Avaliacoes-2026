<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- Carregamento de Estilos e Ícones -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<div class="notion-workspace min-h-screen text-stone-800 p-4 md:p-8">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Cabeçalho -->
    <header class="notion-card rounded-2xl p-6 md:p-8 shadow-sm border border-stone-200/80 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl bg-stone-900 text-white flex items-center justify-center text-2xl shadow-md">
          <i data-lucide="calendar-range" class="w-7 h-7"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-md bg-stone-200 text-stone-700">Notion Pro</span>
            <span class="text-xs text-stone-400">/ Agenda & Tarefas</span>
          </div>
          <h1 class="text-2xl md:text-3xl font-bold text-stone-900 mt-1">Gerenciador & Calendário</h1>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <div class="px-3.5 py-2 rounded-xl bg-stone-100 border border-stone-200 text-xs font-medium text-stone-600">
          Total: <strong id="kpi-total" class="text-stone-900 text-sm ml-1">0</strong>
        </div>
        <div class="px-3.5 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-xs font-medium text-emerald-800">
          Concluídas: <strong id="kpi-concluidas" class="text-emerald-950 text-sm ml-1">0</strong>
        </div>
        <button type="button" onclick="limparTudo()" class="px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Zerar
        </button>
      </div>
    </header>

    <!-- Formulário de Criação com Data -->
    <section class="notion-card rounded-2xl p-5 shadow-sm border border-stone-200/80">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-stone-500 uppercase mb-1">Código</label>
          <input type="text" id="codigo" placeholder="Ex: TSK-01"
            class="w-full bg-white border border-stone-300 rounded-xl px-3.5 py-2.5 text-sm text-stone-800 focus:outline-none focus:border-stone-800">
        </div>

        <div class="md:col-span-4">
          <label class="block text-xs font-semibold text-stone-500 uppercase mb-1">Título (mín. 5 letras) *</label>
          <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript"
            class="w-full bg-white border border-stone-300 rounded-xl px-3.5 py-2.5 text-sm text-stone-800 focus:outline-none focus:border-stone-800">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-stone-500 uppercase mb-1">Data da Tarefa *</label>
          <input type="date" id="data-tarefa"
            class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2.5 text-sm text-stone-800 focus:outline-none focus:border-stone-800">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-stone-500 uppercase mb-1">Prioridade *</label>
          <select id="prioridade"
            class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2.5 text-sm text-stone-800 focus:outline-none focus:border-stone-800">
            <option value="1">1 — Alta</option>
            <option value="2">2 — Média</option>
            <option value="3">3 — Baixa</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <button type="button" onclick="cadastrarTarefa()"
            class="w-full bg-stone-900 hover:bg-stone-800 text-white font-medium py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-sm cursor-pointer">
            <i data-lucide="plus" class="w-4 h-4"></i> Adicionar
          </button>
        </div>
      </div>
    </section>

    <!-- Grid Principal: Calendário + Boletim Diário & Lista -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Coluna Esquerda: Mini Calendário Personalizado -->
      <div class="lg:col-span-5 notion-card rounded-2xl p-5 border border-stone-200/80 space-y-4">
        <div class="flex items-center justify-between pb-3 border-b border-stone-200">
          <h2 class="font-bold text-stone-800 text-sm uppercase tracking-wide flex items-center gap-2">
            <i data-lucide="calendar" class="w-4 h-4 text-stone-600"></i> Calendário do Mês
          </h2>
          <span id="mes-atual-label" class="text-xs font-semibold text-stone-500 capitalize"></span>
        </div>

        <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-stone-400 mb-2">
          <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
        </div>
        <div id="grid-calendario" class="grid grid-cols-7 gap-1.5"></div>
      </div>

      <!-- Coluna Direita: Boletim Diário & Lista de Tarefas -->
      <div class="lg:col-span-7 space-y-6">
        
        <!-- Boletim Diário -->
        <div class="notion-card rounded-2xl p-5 border border-stone-200/80 bg-gradient-to-br from-stone-50 to-amber-50/40">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-stone-800 text-sm flex items-center gap-2">
              <i data-lucide="file-text" class="w-4 h-4 text-amber-600"></i> Boletim Diário (<span id="data-selecionada-label">Hoje</span>)
            </h3>
            <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800" id="boletim-status">Resumo do dia</span>
          </div>
          <div id="conteudo-boletim" class="text-sm text-stone-600 space-y-1">
            <p>Selecione um dia no calendário para ver o boletim detalhado.</p>
          </div>
        </div>

        <!-- Listagem de Tarefas -->
        <div class="notion-card rounded-2xl p-5 border border-stone-200/80">
          <div class="flex items-center justify-between pb-3 mb-3 border-b border-stone-200">
            <h3 class="font-bold text-stone-800 text-sm uppercase tracking-wide">Tarefas na Data</h3>
            <span id="contador-tarefas-data" class="text-xs font-semibold px-2 py-0.5 rounded-md bg-stone-200 text-stone-700">0</span>
          </div>
          <div id="lista-tarefas-data" class="space-y-3 max-h-[300px] overflow-y-auto pr-1"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Notificação Flutuante -->
  <div id="toast" class="fixed bottom-5 right-5 bg-stone-900 text-white px-4 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 text-sm font-medium z-50">
    <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-msg">Ação concluída!</span>
  </div>
</div>
  <script src="script.js"></script>
  
</body>
</html>
