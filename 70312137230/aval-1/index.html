<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- Carregamento de Estilos e Ícones -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<div class="pagina-estoque text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Cabeçalho -->
    <header class="glass rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-4 shadow-xl">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 p-3 rounded-xl shadow-lg shadow-indigo-500/30">
          <i data-lucide="boxes" class="w-7 h-7 text-white"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-white">StockFlow <span class="text-indigo-400">Pro</span></h1>
          <p class="text-sm text-slate-400">Gerenciamento inteligente de inventário</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <button type="button" onclick="exportarCSV()" class="flex items-center gap-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 px-4 py-2.5 rounded-xl text-sm font-medium transition">
          <i data-lucide="download" class="w-4 h-4"></i>
          Exportar CSV
        </button>
        <button type="button" onclick="limparTudo()" class="flex items-center gap-2 bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 px-4 py-2.5 rounded-xl text-sm font-medium transition">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
          Resetar Dados
        </button>
      </div>
    </header>

    <!-- Cards de Resumo (KPIs) -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="glass rounded-2xl p-5 flex items-center justify-between">
        <div>
          <p class="text-sm text-slate-400">Total de Produtos</p>
          <h3 id="kpi-produtos" class="text-2xl font-bold mt-1">0</h3>
        </div>
        <div class="p-3 bg-indigo-500/20 rounded-xl text-indigo-400">
          <i data-lucide="package" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="glass rounded-2xl p-5 flex items-center justify-between">
        <div>
          <p class="text-sm text-slate-400">Itens em Estoque</p>
          <h3 id="kpi-itens" class="text-2xl font-bold mt-1">0</h3>
        </div>
        <div class="p-3 bg-sky-500/20 rounded-xl text-sky-400">
          <i data-lucide="layers" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="glass rounded-2xl p-5 flex items-center justify-between">
        <div>
          <p class="text-sm text-slate-400">Valor Patrimonial</p>
          <h3 id="kpi-valor" class="text-2xl font-bold mt-1 text-emerald-400">R$ 0,00</h3>
        </div>
        <div class="p-3 bg-emerald-500/20 rounded-xl text-emerald-400">
          <i data-lucide="dollar-sign" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="glass rounded-2xl p-5 flex items-center justify-between">
        <div>
          <p class="text-sm text-slate-400">Alertas de Reposição</p>
          <h3 id="kpi-alertas" class="text-2xl font-bold mt-1 text-amber-400">0</h3>
        </div>
        <div class="p-3 bg-amber-500/20 rounded-xl text-amber-400">
          <i data-lucide="alert-triangle" class="w-6 h-6"></i>
        </div>
      </div>
    </section>

    <!-- Conteúdo Principal: Cadastro + Tabela -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Formulário de Cadastro -->
      <aside class="glass rounded-2xl p-6 h-fit shadow-xl">
        <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-400"></i>
          Cadastrar Produto
        </h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 uppercase mb-1">Nome do Produto *</label>
            <input type="text" id="nome" placeholder="Ex: Teclado Mecânico RGB"
              class="w-full bg-slate-900/70 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-300 uppercase mb-1">Código / SKU</label>
              <input type="text" id="sku" placeholder="Ex: TEC-001"
                class="w-full bg-slate-900/70 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-300 uppercase mb-1">Categoria</label>
              <select id="categoria"
                class="w-full bg-slate-900/70 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                <option value="Eletrônicos">Eletrônicos</option>
                <option value="Periféricos">Periféricos</option>
                <option value="Escritório">Escritório</option>
                <option value="Alimentos">Alimentos</option>
                <option value="Outros">Outros</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-300 uppercase mb-1">Valor (R$) *</label>
              <input type="number" id="preco" step="0.01" min="0" placeholder="0.00"
                class="w-full bg-slate-900/70 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-300 uppercase mb-1">Qtd *</label>
              <input type="number" id="quantidade" min="0" placeholder="0"
                class="w-full bg-slate-900/70 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-300 uppercase mb-1">Qtd Mín.</label>
              <input type="number" id="minimo" min="0" value="5"
                class="w-full bg-slate-900/70 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
          </div>

          <button type="button" onclick="cadastrarProduto()"
            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2 cursor-pointer">
            <i data-lucide="save" class="w-4 h-4"></i>
            Adicionar ao Estoque
          </button>
        </div>
      </aside>

      <!-- Lista de Produtos -->
      <main class="glass rounded-2xl p-6 lg:col-span-2 shadow-xl flex flex-col">
        <div class="flex flex-col sm:flex-row gap-3 justify-between items-center mb-5">
          <div class="relative w-full sm:w-72">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
            <input type="text" id="busca" oninput="renderizarTabela()" placeholder="Buscar por nome ou SKU..."
              class="w-full bg-slate-900/70 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>

          <select id="filtro-status" onchange="renderizarTabela()"
            class="w-full sm:w-48 bg-slate-900/70 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="todos">Todos os Status</option>
            <option value="ok">Em Dia</option>
            <option value="baixo">Estoque Baixo</option>
            <option value="zerado">Esgotados</option>
          </select>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-700/70 text-xs uppercase text-slate-400">
                <th class="py-3 px-4">Produto</th>
                <th class="py-3 px-4">Valor Unit.</th>
                <th class="py-3 px-4 text-center">Quantidade</th>
                <th class="py-3 px-4">Subtotal</th>
                <th class="py-3 px-4">Status</th>
                <th class="py-3 px-4 text-right">Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-produtos" class="divide-y divide-slate-800 text-sm"></tbody>
          </table>
        </div>

        <div id="estado-vazio" class="hidden text-center py-12 text-slate-400">
          <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
          <p>Nenhum produto encontrado.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal de Edição -->
  <div id="modal-editar" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="glass rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-700">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white">Editar Produto</h3>
        <button type="button" onclick="fecharModal()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-4">
        <input type="hidden" id="edit-id">
        
        <div>
          <label class="block text-xs text-slate-400 uppercase mb-1">Produto</label>
          <input type="text" id="edit-nome" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-400 uppercase mb-1">Novo Valor (R$)</label>
            <input type="number" id="edit-preco" step="0.01" min="0" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-400 uppercase mb-1">Nova Quantidade</label>
            <input type="number" id="edit-quantidade" min="0" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="fecharModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm">
            Cancelar
          </button>
          <button type="button" onclick="salvarEdicao()" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium">
            Salvar Alterações
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast de Notificação -->
  <div id="toast" class="fixed bottom-5 right-5 bg-indigo-600 text-white px-5 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 text-sm font-medium z-50">
    <i data-lucide="check-circle" class="w-4 h-4"></i>
    <span id="toast-msg">Ação realizada!</span>
  </div>
</div>
  <script src="script.js"></script>
  
</body>
</html>
