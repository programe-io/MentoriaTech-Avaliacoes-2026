!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="header-content">
            <h1>MiniFeed</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="new-post">
            <div class="user">
                <div class="avatar">
                    J 
                </div>
                <div>
                    <strong>bruno</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>

            <div>
                <textarea placeholder="No que você está pensando?"></textarea>
                <button>Publicar</button>
            </div>
        </section>

        <article class="post">
            <div class="post-header">
                <div class="avatar">
                    y
                </div> 
                <div>
                    <strong>bruno</strong>
                    <span>Há 10 minutos</span>
                </div>    
            </div>

            <div class="post-text">
                Hoje eu vi o novo filme do homiranha,
                top, to feliz :D
            </div>

            <img src="https://www.sonypictures.com.br/sites/brazil/files/2022-03/BG_ESPETACULAR%20HOMEM-ARANHA_0.JPG" alt="Imagem do home aranha">

            <div class="post-actions">

                <button>Curtir</button>
                <button>Comentar</button>

            </div>



        </article>
    </main>

    <footer>
        <p>MiniFeed - Todos os Direitos Reservados Bruno - 2026</p>
    </footer>
    
</body>
</html>
