
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Gerenciamento de Tarefas</h1>

    <h2>Cadastrar Nova Tarefa</h2>

    <label>Código:</label>
    <input type="number" id="codigo"><br><br>

    <label>Título:</label>
    <input type="text" id="titulo"><br><br>

    <label>Prioridade (1 a 3):</label>
    <input type="number" id="prioridade" min="1" max="3"><br><br>

    <button onclick="cadastrar()">Cadastrar Tarefa</button>

    <hr>

    <h2>Concluir Tarefa</h2>

    <label>Código da tarefa:</label>
    <input type="number" id="codigoConcluir"><br><br>

    <button onclick="concluir()">Marcar como Concluída</button>

    <hr>

    <h2>Alterar Prioridade</h2>

    <label>Código da tarefa:</label>
    <input type="number" id="codigoAlterar"><br><br>

    <label>Nova prioridade:</label>
    <input type="number" id="novaPrioridade" min="1" max="3"><br><br>

    <button onclick="alterarPrioridade()">Alterar Prioridade</button>

    <hr>

    <h2>Lista de Tarefas</h2>

    <button onclick="listar()">Listar Tarefas</button>

    <ul id="lista"></ul>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
