
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Calculadora de IMC</h1>

        <p class="descricao">
            Informe os dados do paciente para calcular o Índice de Massa Corporal.
        </p>

        <form id="formIMC">

            <label for="nome">Nome do paciente:</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite o nome do paciente"
                required
            >

            <label for="peso">Peso (kg):</label>
            <input
                type="number"
                id="peso"
                placeholder="Ex: 70"
                step="0.1"
                min="0.1"
                required
            >

            <label for="altura">Altura (m):</label>
            <input
                type="number"
                id="altura"
                placeholder="Ex: 1.75"
                step="0.01"
                min="0.1"
                required
            >

            <button type="submit">Calcular IMC</button>

        </form>

        <div class="resultado" id="resultado" hidden>
            <h2>Resultado do paciente</h2>

            <p><strong>Nome:</strong> <span id="resNome"></span></p>
            <p><strong>Peso:</strong> <span id="resPeso"></span> kg</p>
            <p><strong>Altura:</strong> <span id="resAltura"></span> m</p>
            <p><strong>IMC:</strong> <span id="resIMC"></span></p>

            <p>
                <strong>Classificação:</strong>
                <span class="classificacao" id="classificacao"></span>
            </p>
        </div>

        <footer>
            Sistema de Avaliação do IMC
        </footer>

    </div>

    <script>
        const formulario = document.getElementById("formIMC");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            // Receber os dados
            const nome = document.getElementById("nome").value.trim();
            const peso = parseFloat(document.getElementById("peso").value);
            const altura = parseFloat(document.getElementById("altura").value);

            // Validar os dados
            if (!nome || !Number.isFinite(peso) ||
                !Number.isFinite(altura) || peso <= 0 || altura <= 0) {
                alert("Preencha todos os campos corretamente!");
                return;
            }

            // Calcular IMC
            const imc = peso / (altura * altura);

            // Classificar IMC
            let classificacao;

            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            } else if (imc < 25) {
                classificacao = "Peso normal";
            } else if (imc < 30) {
                classificacao = "Sobrepeso";
            } else if (imc < 35) {
                classificacao = "Obesidade grau I";
            } else if (imc < 40) {
                classificacao = "Obesidade grau II";
            } else {
                classificacao = "Obesidade grau III";
            }

            // Exibir os resultados
            document.getElementById("resNome").textContent = nome;
            document.getElementById("resPeso").textContent = peso.toFixed(1);
            document.getElementById("resAltura").textContent = altura.toFixed(2);
            document.getElementById("resIMC").textContent = imc.toFixed(2);
            document.getElementById("classificacao").textContent = classificacao;

            document.getElementById("resultado").hidden = false;
        });
    </script>

<script src="script.js"></script></body>
</html>
