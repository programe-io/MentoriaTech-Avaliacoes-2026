!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle de IMC</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { padding: 8px; width: 250px; }
        button { padding: 10px 15px; background-color: #f7df1e; border: none; cursor: pointer; font-weight: bold; }
        #resultado { margin-top: 20px; padding: 15px; border: 1px solid #ddd; display: none; }
    </style>
<link href="style.css" rel="stylesheet"></head>
<body>

    <h2>Projeto Prático: Controle de IMC</h2>
    
    <div class="form-group">
        <label for="nome">Nome do Paciente:</label>
        <input type="text" id="nome" placeholder="Ex: João Silva">
    </div>

    <div class="form-group">
        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" step="0.1" placeholder="Ex: 75.5">
    </div>

    <div class="form-group">
        <label for="altura">Altura (m):</label>
        <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75">
    </div>

    <button onclick="calcularIMC()">Calcular IMC</button>

    <div id="resultado"></div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
