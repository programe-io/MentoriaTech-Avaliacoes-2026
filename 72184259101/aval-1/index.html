
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Sistema de Estoque</h1>

    <h2>Cadastrar Produto</h2>

    <label>Código:</label>
    <input type="number" id="codigo"><br><br>

    <label>Descrição:</label>
    <input type="text" id="descricao"><br><br>

    <label>Quantidade:</label>
    <input type="number" id="quantidade"><br><br>

    <label>Valor:</label>
    <input type="number" id="valor" step="0.01"><br><br>

    <button onclick="cadastrar()">Cadastrar Produto</button>

    <hr>

    <h2>Alterar Produto</h2>

    <label>Código do produto:</label>
    <input type="number" id="codigoAlterar"><br><br>

    <label>Novo valor:</label>
    <input type="number" id="novoValor" step="0.01"><br><br>

    <button onclick="alterarValor()">Alterar Valor</button>

    <br>

    <label>Nova quantidade:</label>
    <input type="number" id="novaQuantidade"><br><br>

    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    <hr>

    <h2>Produtos Cadastrados</h2>

    <button onclick="listar()">Listar Produtos</button>

    <ul id="lista"></ul>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
