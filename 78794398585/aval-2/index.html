
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladybug Feed 🐞</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🐞 Ladybug Feed</h1>
    <p>O diário da heroína de Paris!</p>
</header>

<main>
    <section class="perfil">
        <div class="foto">🐞</div>
        <h2>Ladybug</h2>
        <p>Heroína de Paris ❤️</p>
    </section>

    <section class="publicacao">
        <h3>🐞 Ladybug</h3>
        <img src="https://placehold.co/600x350/d71936/ffffff?text=Ladybug" alt="Imagem da Ladybug">

        <p>Salvando Paris mais uma vez! ❤️✨</p>

        <div class="acoes">
            <button onclick="curtir(this)">❤️ Curtir</button>
            <span class="contador">0 curtidas</span>
        </div>

        <input type="text" placeholder="Escreva um comentário..." class="comentario">
        <button onclick="comentar(this)">Enviar</button>

        <div class="comentarios"></div>
    </section>

    <section class="publicacao">
        <h3>🐞 Ladybug</h3>
        <img src="https://placehold.co/600x350/171717/ffffff?text=Miraculous" alt="Miraculous">

        <p>Com coragem e amizade podemos vencer tudo! ✨</p>

        <div class="acoes">
            <button onclick="curtir(this)">❤️ Curtir</button>
            <span class="contador">0 curtidas</span>
        </div>

        <input type="text" placeholder="Escreva um comentário..." class="comentario">
        <button onclick="comentar(this)">Enviar</button>

        <div class="comentarios"></div>
    </section>

</main>

<footer>
    <p>🐞 Ladybug Feed - Feito com ❤️</p>
</footer>

<script src="script.js"></script>

</html>
