
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>MiniFeed</h1>
        <p>Compartilhe seus momentos!</p>
    </header>

    <main>
        <section class="criar-post">
            <h2>Nova publicação</h2>
            <textarea id="textoPost" placeholder="O que você está pensando?"></textarea>
            <button onclick="publicar()">Publicar</button>
        </section>

        <section id="feed">
            <h2>Publicações</h2>
            
            <div class="post">
                <h3>Lucas</h3>
                <p>Olá pessoal! Bem-vindos ao meu MiniFeed! 🚀</p>
                <button onclick="curtir(this)">❤️ Curtir</button>
                <span>0 curtidas</span>
            </div>

            <div class="post">
                <h3>Ana</h3>
                <p>Hoje é um ótimo dia para aprender algo novo! 📚</p>
                <button onclick="curtir(this)">❤️ Curtir</button>
                <span>0 curtidas</span>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 MiniFeed - Todos os direitos reservados</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
