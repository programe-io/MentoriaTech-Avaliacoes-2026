
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaClone</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>InstaClone</h1>
    <input type="search" id="search" placeholder="Pesquisar">
</header>

<div class="container">

    <aside class="sidebar">
        <h2>Menu</h2>
        <a href="#">🏠 Início</a>
        <a href="#">🔍 Explorar</a>
        <a href="#">🎬 Reels</a>
        <a href="#">💬 Mensagens</a>
        <a href="#">❤️ Notificações</a>
        <a href="#criar">➕ Criar publicação</a>
        <a href="#">👤 Perfil</a>
    </aside>

    <main>

        <section class="stories">
            <div><img src="https://i.pravatar.cc/100?img=12"><p>Seu story</p></div>
            <div><img src="https://i.pravatar.cc/100?img=5"><p>Mariana</p></div>
            <div><img src="https://i.pravatar.cc/100?img=8"><p>Pedro</p></div>
            <div><img src="https://i.pravatar.cc/100?img=20"><p>Juliana</p></div>
            <div><img src="https://i.pravatar.cc/100?img=15"><p>Gabriel</p></div>
        </section>

        <section class="create-post" id="criar">
            <h2>Nova publicação</h2>
            <input id="username" placeholder="Seu nome">
            <textarea id="caption" placeholder="O que você está pensando?"></textarea>
            <input id="imageUrl" placeholder="Link da imagem (opcional)">
            <button onclick="createPost()">Publicar</button>
        </section>

        <section id="feed">

            <article class="post">
                <div class="post-header">
                    <img src="https://i.pravatar.cc/100?img=5">
                    <strong>mariana.oliveira</strong>
                </div>

                <img class="post-image"
                src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                alt="Praia">

                <div class="actions">
                    <button onclick="likePost(this)">♡ Curtir</button>
                    <button onclick="focusComment(this)">💬 Comentar</button>
                </div>

                <p class="caption">
                    <strong>mariana.oliveira</strong>
                    Aproveitando o dia! ☀️
                </p>

                <p class="likes">0 curtidas</p>

                <div class="comments"></div>

                <form class="comment-form" onsubmit="addComment(event)">
                    <input placeholder="Adicione um comentário..." required>
                    <button>Enviar</button>
                </form>
            </article>

        </section>

    </main>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
