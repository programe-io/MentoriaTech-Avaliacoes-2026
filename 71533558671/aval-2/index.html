<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Quantidade</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Atualizar Quantidade</h1>

        <label for="codigoProduto">Código do produto:</label>
        <input type="text" id="codigoProduto" placeholder="Digite o código">

        <label for="novaQuantidade">Nova quantidade:</label>
        <input type="number" id="novaQuantidade" min="1" placeholder="Digite a quantidade">

        <button onclick="atualizarQuantidade(
            document.getElementById('codigoProduto').value,
            Number(document.getElementById('novaQuantidade').value)
        )">
            Atualizar
        </button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
