<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Lista de Produtos</h1>

        <div class="produtos">

            <!-- PRODUTO 1 -->
            <div class="produto">
                <span class="codigo">Código: 1</span>
                <h2>Cadeira gamer</h2>

                <p class="quantidade">
                    Quantidade: <span id="quantidade1">12</span>
                </p>

                <p class="preco">
                    R$ <span id="valor1">699,00</span>
                </p>

                <input type="number"
                       id="novaQuantidade1"
                       placeholder="Nova quantidade">

                <input type="number"
                       id="novoValor1"
                       placeholder="Novo valor"
                       step="0.01">

                <button onclick="alterarProduto(1)">
                    Alterar Produto
                </button>
            </div>


            <!-- PRODUTO 2 -->
            <div class="produto">
                <span class="codigo">Código: 2</span>
                <h2>Mouse Logitech</h2>

                <p class="quantidade">
                    Quantidade: <span id="quantidade2">38</span>
                </p>

                <p class="preco">
                    R$ <span id="valor2">97,00</span>
                </p>

                <input type="number"
                       id="novaQuantidade2"
                       placeholder="Nova quantidade">

                <input type="number"
                       id="novoValor2"
                       placeholder="Novo valor"
                       step="0.01">

                <button onclick="alterarProduto(2)">
                    Alterar Produto
                </button>
            </div>


            <!-- PRODUTO 3 -->
            <div class="produto">
                <span class="codigo">Código: 3</span>
                <h2>Teclado Mecânico</h2>

                <p class="quantidade">
                    Quantidade: <span id="quantidade3">15</span>
                </p>

                <p class="preco">
                    R$ <span id="valor3">250,00</span>
                </p>

                <input type="number"
                       id="novaQuantidade3"
                       placeholder="Nova quantidade">

                <input type="number"
                       id="novoValor3"
                       placeholder="Novo valor"
                       step="0.01">

                <button onclick="alterarProduto(3)">
                    Alterar Produto
                </button>
            </div>


            <!-- PRODUTO 4 -->
            <div class="produto">
                <span class="codigo">Código: 4</span>
                <h2>Monitor 24"</h2>

                <p class="quantidade">
                    Quantidade: <span id="quantidade4">8</span>
                </p>

                <p class="preco">
                    R$ <span id="valor4">850,00</span>
                </p>

                <input type="number"
                       id="novaQuantidade4"
                       placeholder="Nova quantidade">

                <input type="number"
                       id="novoValor4"
                       placeholder="Novo valor"
                       step="0.01">

                <button onclick="alterarProduto(4)">
                    Alterar Produto
                </button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
