<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Minhas Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h2 class="logo">✦ TaskFlow</h2>
            <p class="menu-title">MENU PRINCIPAL</p>
            <a class="active" href="#">▦ &nbsp; Minhas tarefas</a>
            <a href="#formTarefa">＋ &nbsp; Nova tarefa</a>
            <div class="sidebar-footer">Organize seu dia.</div>
        </aside>

        <main class="content">
            <header>
                <div>
                    <p class="welcome">SEU ESPAÇO DE PRODUTIVIDADE</p>
                    <h1>Minhas tarefas</h1>
                    <p class="subtitle">Planeje seu dia. Conquiste seus objetivos.</p>
                </div>
                <div class="avatar">TF</div>
            </header>

            <section class="stats">
                <div class="stat-card">
                    <span>Total de tarefas</span>
                    <strong id="total">0</strong>
                </div>
                <div class="stat-card">
                    <span>Pendentes</span>
                    <strong id="pendentes">0</strong>
                </div>
                <div class="stat-card">
                    <span>Concluídas</span>
                    <strong id="concluidas">0</strong>
                </div>
            </section>

            <section class="panel">
                <h2>＋ Criar nova tarefa</h2>
                <form id="formTarefa">
                    <div class="field">
                        <label for="titulo">Nome da tarefa</label>
                        <input id="titulo" type="text"
                            placeholder="Ex.: Estudar programação" required>
                    </div>

                    <div class="field">
                        <label for="prioridade">Prioridade</label>
                        <select id="prioridade">
                            <option value="1">🔴 Alta</option>
                            <option value="2">🟡 Média</option>
                            <option value="3">🟢 Baixa</option>
                        </select>
                    </div>

                    <button type="submit">Adicionar tarefa +</button>
                </form>
                <p id="mensagem"></p>
            </section>

            <section class="task-section">
                <div class="section-heading">
                    <h2>Lista de tarefas</h2>
                    <span id="contador">0 tarefas</span>
                </div>
                <div id="listaTarefas" class="task-list"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
