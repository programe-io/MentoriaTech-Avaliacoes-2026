<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaFeed — Rede Social</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>
  <div class="app-wrapper">
    <!-- Sidebar Desktop -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fa-brands fa-instagram"></i>
        <span>InstaFeed</span>
      </div>
      <nav class="side-nav">
        <a href="#" class="side-link active"><i class="fa-solid fa-house"></i><span>Página inicial</span></a>
        <a href="#" class="side-link"><i class="fa-solid fa-magnifying-glass"></i><span>Pesquisa</span></a>
        <a href="#" class="side-link"><i class="fa-regular fa-compass"></i><span>Explorar</span></a>
        <a href="#" class="side-link"><i class="fa-solid fa-clapperboard"></i><span>Reels</span></a>
        <a href="#" class="side-link"><i class="fa-regular fa-paper-plane"></i><span>Mensagens</span></a>
        <a href="#" class="side-link"><i class="fa-regular fa-heart"></i><span>Notificações</span></a>
        <a href="#" class="side-link"><i class="fa-regular fa-square-plus"></i><span>Criar</span></a>
        <a href="#" class="side-link"><i class="fa-regular fa-circle-user"></i><span>Perfil</span></a>
      </nav>
      <a href="#" class="side-link more-link"><i class="fa-solid fa-bars"></i><span>Mais</span></a>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <section class="stories-section">
        <div class="stories" id="stories"></div>
      </section>
      <section class="feed" id="feed"></section>
    </main>

    <!-- Right Panel Desktop -->
    <aside class="right-panel">
      <div class="profile-card">
        <img src="https://i.pravatar.cc/150?img=68" alt="Seu perfil" class="profile-avatar">
        <div class="profile-info">
          <span class="profile-user">voce.usuario</span>
          <span class="profile-name">Seu Nome</span>
        </div>
        <button class="switch-btn">Mudar</button>
      </div>
      <div class="suggestions">
        <div class="suggestions-header">
          <span>Sugestões para você</span>
          <button class="see-all">Ver tudo</button>
        </div>
        <div class="suggestions-list" id="suggestionsList"></div>
      </div>
      <footer class="panel-footer">
        <p>Sobre · Ajuda · Imprensa · API · Carreiras · Privacidade · Termos</p>
        <p>© 2026 InstaFeed</p>
      </footer>
    </aside>
  </div>

  <!-- Bottom Nav Mobile -->
  <nav class="bottom-nav">
    <button class="nav-item active"><i class="fa-solid fa-house"></i></button>
    <button class="nav-item"><i class="fa-solid fa-magnifying-glass"></i></button>
    <button class="nav-item"><i class="fa-regular fa-square-plus"></i></button>
    <button class="nav-item"><i class="fa-solid fa-clapperboard"></i></button>
    <button class="nav-item profile-nav">
      <img src="https://i.pravatar.cc/150?img=68" alt="Perfil">
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <!-- Comments Modal -->
  <div class="modal-overlay" id="commentsModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Comentários</h3>
        <button class="modal-close" id="closeComments">&times;</button>
      </div>
      <div class="modal-body" id="commentsList"></div>
      <div class="modal-footer">
        <img src="https://i.pravatar.cc/150?img=68" alt="Você" class="comment-avatar">
        <input type="text" id="commentInput" placeholder="Adicione um comentário..." maxlength="220">
        <button id="sendComment" class="post-comment-btn">Publicar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
