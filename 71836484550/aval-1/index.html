<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Cadastre e gerencie seus produtos</p>
    </header>

    <main class="container">

        <!-- CADASTRO -->
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="codigo">Código</label>
                    <input
                        type="text"
                        id="codigo"
                        placeholder="Ex: P001"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Nome do produto"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        placeholder="Ex: 10"
                        min="0"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input
                        type="number"
                        id="valor"
                        placeholder="Ex: 25.90"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-cadastrar">
                    Cadastrar Produto
                </button>

            </form>
        </section>


        <!-- RESUMO -->
        <section class="resumo">

            <div class="resumo-card">
                <span>Produtos</span>
                <strong id="totalProdutos">0</strong>
            </div>

            <div class="resumo-card">
                <span>Itens em estoque</span>
                <strong id="totalItens">0</strong>
            </div>

            <div class="resumo-card">
                <span>Valor do estoque</span>
                <strong id="valorEstoque">R$ 0,00</strong>
            </div>

        </section>


        <!-- LISTAGEM -->
        <section class="card">

            <div class="titulo-lista">
                <h2>Produtos Cadastrados</h2>
            </div>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Produtos serão adicionados pelo JavaScript -->
                    </tbody>

                </table>

            </div>

            <p id="mensagemVazia" class="mensagem-vazia">
                Nenhum produto cadastrado.
            </p>

        </section>

    </main>

    <footer>
        <p>Sistema de Estoque &copy; 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
