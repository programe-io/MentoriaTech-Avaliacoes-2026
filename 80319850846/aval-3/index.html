
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Estilos personalizados -->
    <style>
        body {
            background-color: #f9fafb;
        }

        .bg-card {
            background-color: #ffffff;
        }

        .border-border {
            border-color: #e5e7eb;
        }

        .text-muted {
            color: #6b7280;
        }

        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-none {
            scrollbar-width: none;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen antialiased pb-16 md:pb-0">

    <!-- 1. TOPO: BARRA DE NAVEGAÇÃO -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">

        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">

            <!-- Logo -->
            <div class="text-xl font-bold italic tracking-wide cursor-pointer font-serif">
                Instagram
            </div>

            <!-- Campo de busca -->
            <div class="hidden sm:block relative w-64">
                <input
                    type="text"
                    placeholder="Pesquisar"
                    class="w-full bg-gray-100 border border-transparent rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-gray-300"
                >
            </div>

            <!-- Ícones de navegação -->
            <nav class="flex items-center space-x-4 sm:space-x-6 text-2xl">

                <a href="#" class="hover:text-gray-600">
                    <i class="bx bx-home-alt-solid"></i>
                </a>

                <a href="#" class="hover:text-gray-600">
                    <i class="bx bx-message-rounded-detail"></i>
                </a>

                <a href="#" class="hover:text-gray-600">
                    <i class="bx bx-plus-circle"></i>
                </a>

                <a href="#" class="hover:text-gray-600">
                    <i class="bx bx-compass"></i>
                </a>

                <a href="#" class="hover:text-gray-600">
                    <i class="bx bx-heart"></i>
                </a>

                <!-- Foto do perfil -->
                <div class="w-7 h-7 bg-gradient-to-tr from-yellow-400 to-purple-600 rounded-full p-[1.5px] cursor-pointer">
                    <div class="w-full h-full bg-gray-300 rounded-full border border-white"></div>
                </div>

            </nav>
        </div>
    </header>


    <!-- 2. CONTEÚDO PRINCIPAL -->
    <main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- COLUNA DO FEED -->
        <section class="lg:col-span-2 space-y-6">

            <!-- 3. STORIES -->
            <div class="bg-white border border-gray-200 rounded-lg p-4 flex space-x-4 overflow-x-auto scrollbar-none">

                <!-- Story 1 -->
                <div class="flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer w-16">

                    <div class="w-14 h-14 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 rounded-full p-[2px]">
                        <div class="w-full h-full bg-gray-200 rounded-full border-2 border-white"></div>
                    </div>

                    <span class="text-xs text-gray-500 truncate w-full text-center">
                        seu_amigo
                    </span>
                </div>

                <!-- Story 2 -->
                <div class="flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer w-16">

                    <div class="w-14 h-14 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 rounded-full p-[2px]">
                        <div class="w-full h-full bg-gray-200 rounded-full border-2 border-white"></div>
                    </div>

                    <span class="text-xs text-gray-500 truncate w-full text-center">
                        dev_code
                    </span>
                </div>

                <!-- Story 3 -->
                <div class="flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer w-16">

                    <div class="w-14 h-14 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 rounded-full p-[2px]">
                        <div class="w-full h-full bg-gray-200 rounded-full border-2 border-white"></div>
                    </div>

                    <span class="text-xs text-gray-500 truncate w-full text-center">
                        tail_css
                    </span>
                </div>

            </div>


            <!-- 4. CARD DE POSTAGEM -->
            <article class="bg-white border border-gray-200 rounded-lg">

                <!-- Cabeçalho do post -->
                <div class="flex items-center justify-between p-3 border-b border-gray-100">

                    <div class="flex items-center space-x-3">

                        <div class="w-8 h-8 bg-gradient-to-tr from-yellow-400 to-purple-600 rounded-full p-[1.5px]">
                            <div class="w-full h-full bg-gray-300 rounded-full border border-white"></div>
                        </div>

                        <span class="font-semibold text-sm cursor-pointer hover:underline">
                            usuario_teste
                        </span>

                    </div>

                    <button class="text-xl hover:text-gray-500">
                        <i class="bx bx-dots-horizontal-rounded"></i>
                    </button>

                </div>


                <!-- Imagem do post -->
                <div class="bg-gray-100 aspect-square w-full">

                    <img
                        src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=900"
                        alt="Post"
                        class="w-full h-full object-cover"
                    >

                </div>


                <!-- Ações do post -->
                <div class="p-3 space-y-2">

                    <div class="flex items-center justify-between text-2xl">

                        <div class="flex items-center space-x-4">

                            <button class="hover:text-gray-500">
                                <i class="bx bx-heart"></i>
                            </button>

                            <button class="hover:text-gray-500">
                                <i class="bx bx-comment"></i>
                            </button>

                            <button class="hover:text-gray-500">
                                <i class="bx bx-send"></i>
                            </button>

                        </div>

                        <button class="hover:text-gray-500">
                            <i class="bx bx-bookmark"></i>
                        </button>

                    </div>


                    <!-- Curtidas e legenda -->
                    <div class="text-sm space-y-1">

                        <p class="font-semibold cursor-pointer">
                            1.243 curtidas
                        </p>

                        <p>
                            <span class="font-semibold cursor-pointer hover:underline mr-2">
                                usuario_teste
                            </span>
                            Construindo meu clone do Instagram usando Tailwind CSS! 🚀 #dev #web
                        </p>

                        <p class="text-xs text-gray-400 uppercase tracking-wide pt-1">
                            Há 2 horas
                        </p>

                    </div>

                </div>


                <!-- Caixa de comentários -->
                <div class="border-t border-gray-100 p-3 hidden sm:flex items-center justify-between">

                    <div class="flex items-center space-x-3 w-full">

                        <button class="text-2xl">
                            <i class="bx bx-smile"></i>
                        </button>

                        <input
                            type="text"
                            placeholder="Adicione um comentário..."
                            class="w-full text-sm focus:outline-none"
                        >

                    </div>

                    <button class="text-blue-500 font-semibold text-sm opacity-50 cursor-default">
                        Publicar
                    </button>

                </div>

            </article>

        </section>


        <!-- 5. SIDEBAR -->
        <aside class="hidden lg:block space-y-4">

            <!-- Usuário atual -->
            <div class="flex items-center justify-between">

                <div class="flex items-center space-x-4">

                    <div class="w-14 h-14 bg-gray-300 rounded-full cursor-pointer"></div>

                    <div>
                        <p class="font-semibold text-sm cursor-pointer">
                            seu_perfil
                        </p>

                        <p class="text-gray-400 text-sm">
                            Seu Nome Completo
                        </p>
                    </div>

                </div>

                <button class="text-blue-500 text-xs font-semibold hover:text-blue-700">
                    Mudar
                </button>

            </div>


            <!-- Título das sugestões -->
            <div class="flex justify-between items-center text-sm font-semibold text-gray-400 pt-2">

                <span>Sugestões para você</span>

                <button class="text-gray-900 text-xs hover:text-gray-500">
                    Ver tudo
                </button>

            </div>


            <!-- Lista de sugestões -->
            <div class="space-y-3">

                <!-- Sugestão 1 -->
                <div class="flex items-center justify-between">

                    <div class="flex items-center space-x-3">

                        <div class="w-8 h-8 bg-gray-300 rounded-full"></div>

                        <div class="text-xs">
                            <p class="font-semibold cursor-pointer hover:underline">
                                novo_dev
                            </p>

                            <p class="text-gray-400">
                                Seguido(a) por amigos
                            </p>
                        </div>

                    </div>

                    <button class="text-blue-500 text-xs font-semibold hover:text-blue-700">
                        Seguir
                    </button>

                </div>


                <!-- Sugestão 2 -->
                <div class="flex items-center justify-between">

                    <div class="flex items-center space-x-3">

                        <div class="w-8 h-8 bg-gray-300 rounded-full"></div>

                        <div class="text-xs">
                            <p class="font-semibold cursor-pointer hover:underline">
                                tailwind_expert
                            </p>

                            <p class="text-gray-400">
                                Novo no Instagram
                            </p>
                        </div>

                    </div>

                    <button class="text-blue-500 text-xs font-semibold hover:text-blue-700">
                        Seguir
                    </button>

                </div>

            </div>

        </aside>

    </main>


    <!-- 6. MENU MOBILE -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 h-12 bg-white border-t border-gray-200 flex items-center justify-around text-2xl z-50">

        <a href="#" class="text-gray-900">
            <i class="bx bx-home-alt-solid"></i>
        </a>

        <a href="#" class="text-gray-900">
            <i class="bx bx-search"></i>
        </a>

        <a href="#" class="text-gray-900">
            <i class="bx bx-plus-square"></i>
        </a>

        <a href="#" class="text-gray-900">
            <i class="bx bx-movie-play"></i>
        </a>

        <a href="#" class="text-gray-900">
            <i class="bx bx-user-circle"></i>
        </a>

    </div>

</body>
</html>
