
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YURE STORE</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🛍️ YURE STORE</h1>
    <p>Sua loja favorita!</p>
    <button id="cartButton">🛒 Carrinho (<span id="cartCount">0</span>)</button>
</header>

<section class="banner">
    <h2>Bem-vindo à YURE STORE!</h2>
    <p>Encontre os melhores produtos com ótimos preços.</p>
</section>

<main>
    <h2>Nossos produtos</h2>

    <input type="text" id="search" placeholder="🔎 Pesquisar produtos...">

    <div class="products" id="products"></div>

    <section class="cart" id="cart">
        <h2>🛒 Meu carrinho</h2>
        <div id="cartItems">Seu carrinho está vazio.</div>
        <h3>Total: R$ <span id="total">0,00</span></h3>
        <button onclick="checkout()">Finalizar compra</button>
    </section>
</main>

<footer>
    <p>© 2026 YURE STORE - Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
