<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Equino | Blog sobre Cavalos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="cabecalho">
        <div class="container">
            <h1>🐎 Mundo Equino</h1>
            <p>Paixão, cuidados, raças e histórias sobre cavalos</p>
        </div>
    </header>

    <nav class="navegacao">
        <div class="container">
            <button class="filtro-btn ativo" data-categoria="todos">Todos os Posts</button>
            <button class="filtro-btn" data-categoria="racas">Raças</button>
            <button class="filtro-btn" data-categoria="cuidados">Cuidados & Saúde</button>
            <button class="filtro-btn" data-categoria="esportes">Esportes & Montaria</button>
        </div>
    </nav>

    <main class="container">
        <section class="busca-container">
            <input type="text" id="campo-busca" placeholder="Buscar artigos por título ou palavra-chave...">
        </section>

        <section id="lista-posts" class="grade-posts">
            <!-- Os artigos serão inseridos aqui pelo JavaScript -->
        </section>
    </main>

    <!-- Modal para leitura do artigo completo -->
    <div id="modal-artigo" class="modal">
        <div class="modal-conteudo">
            <span class="fechar-modal">&times;</span>
            <img id="modal-imagem" src="" alt="Imagem do artigo">
            <span id="modal-categoria" class="tag-categoria"></span>
            <h2 id="modal-titulo"></h2>
            <p id="modal-data" class="data-post"></p>
            <div id="modal-texto"></div>
        </div>
    </div>

    <footer class="rodape">
        <div class="container">
            <p>&copy; 2026 Mundo Equino. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
