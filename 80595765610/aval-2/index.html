<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EquusFeed — Comunidade Equestre</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="navbar">
    <div class="container nav-content">
      <h1>🐎 EquusFeed</h1>
      <div class="filtros">
        <button class="btn-filtro ativo" data-categoria="Todos">Todos</button>
        <button class="btn-filtro" data-categoria="Mangalarga">Mangalarga</button>
        <button class="btn-filtro" data-categoria="Quarto de Milha">Quarto de Milha</button>
        <button class="btn-filtro" data-categoria="Árabe">Árabe</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Formulário de Nova Postagem -->
    <section class="criar-post-card">
      <h2>Compartilhe um registro</h2>
      <form id="form-post">
        <div class="input-group">
          <input type="text" id="autor" placeholder="Seu nome ou Haras" required>
          <select id="categoria" required>
            <option value="Mangalarga">Mangalarga Marchador</option>
            <option value="Quarto de Milha">Quarto de Milha</option>
            <option value="Árabe">Puro Sangue Árabe</option>
          </select>
        </div>
        <input type="url" id="imagem-url" placeholder="URL da foto do cavalo (opcional)">
        <textarea id="legenda" rows="3" placeholder="Escreva sobre o treino, cavalgada ou manejo..." required></textarea>
        <button type="submit" class="btn-publicar">Publicar no Feed</button>
      </form>
    </section>

    <!-- Lista de Postagens -->
    <section id="feed-container" class="feed"></section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
