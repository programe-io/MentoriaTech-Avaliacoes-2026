<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones via FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Barra de Navegação Superior -->
    <header class="navbar">
        <div class="nav-container">
            <h1 class="logo">Instagram</h1>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Pesquisar">
            </div>
            <nav class="nav-icons">
                <i class="fa-solid fa-house" title="Página Inicial"></i>
                <i class="fa-regular fa-paper-plane" title="Mensagens"></i>
                <i class="fa-regular fa-square-plus" id="btn-open-modal" title="Criar Publicação"></i>
                <i class="fa-regular fa-compass" title="Explorar"></i>
                <i class="fa-regular fa-heart" title="Notificações"></i>
                <img src="https://pravatar.cc" alt="Seu Perfil" class="nav-avatar">
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-container">
        <section class="feed-section">
            <!-- Barra de Stories -->
            <div class="stories-container" id="stories-container">
                <!-- Preenchido via JavaScript -->
            </div>

            <!-- Feed de Publicações -->
            <div class="posts-container" id="posts-container">
                <!-- Preenchido via JavaScript -->
            </div>
        </section>

        <!-- Barra Lateral (Sugestões) -->
        <aside class="sidebar">
            <div class="user-profile-switch">
                <img src="https://pravatar.cc" alt="Avatar">
                <div class="user-info">
                    <strong>dev_brasil</strong>
                    <span>Desenvolvedor Web</span>
                </div>
                <button class="btn-link">Mudar</button>
            </div>

            <div class="suggestions-header">
                <span>Sugestões para você</span>
                <a href="#">Ver tudo</a>
            </div>

            <div class="suggestion-item">
                <img src="https://pravatar.cc" alt="Sugestão">
                <div class="user-info">
                    <strong>design.ui</strong>
                    <span>Segue você</span>
                </div>
                <button class="btn-link follow-btn">Seguir</button>
            </div>

            <div class="suggestion-item">
                <img src="https://pravatar.cc" alt="Sugestão">
                <div class="user-info">
                    <strong>viagens_br</strong>
                    <span>Sugestões para você</span>
                </div>
                <button class="btn-link follow-btn">Seguir</button>
            </div>
        </aside>
    </main>

    <!-- Modal para Criar Nova Publicação -->
    <div class="modal" id="post-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Criar nova publicação</h3>
                <span class="close-modal" id="btn-close-modal">&times;</span>
            </div>
            <form id="new-post-form">
                <input type="url" id="post-image-url" placeholder="Cole a URL da imagem (ex: Unsplash)" required>
                <textarea id="post-caption" rows="3" placeholder="Escreva uma legenda..." required></textarea>
                <button type="submit" class="btn-primary">Compartilhar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
