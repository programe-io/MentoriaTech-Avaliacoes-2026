<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SABOREAR | Haute Cuisine System</title>

                <link rel="stylesheet" href="style.css">
                <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <div id="authArea" class="auth-bg">
                            <div id="sessaoCadastro" class="container">
                                        <h1>SABOREAR</h1>
                                                    <h2>Membro da Equipe</h2>
                                                                <input type="text" id="cadNome" placeholder="NOME DO COLABORADOR">
                                                                            <input type="email" id="cadEmail" placeholder="E-MAIL INSTITUCIONAL">
                                                                                        <button class="btn-gold" onclick="irParaLogin()">Registrar</button>
                                                                                                </div>

                                                                                                        <div id="sessaoLogin" class="container hidden">
                                                                                                                    <h1>SABOREAR</h1>
                                                                                                                                <h2>Acesso Restrito</h2>
                                                                                                                                            <input type="email" id="loginEmail" placeholder="E-MAIL">
                                                                                                                                                        <button class="btn-gold" onclick="autenticar()">Entrar</button>
                                                                                                                                                                </div>
                                                                                                                                                                    </div>

                                                                                                                                                                        <div id="sessaoPedido" class="restaurante-container hidden">
                                                                                                                                                                                <header style="text-align:center; margin-bottom:50px;">
                                                                                                                                                                                            <h1>SABOREAR RESTAURANT</h1>
                                                                                                                                                                                                        <p style="color:#c5a059; letter-spacing:3px;">PAINEL DE ATENDIMENTO</p>
                                                                                                                                                                                                                </header>

                                                                                                                                                                                                                        <div style="max-width:600px; margin:0 auto 50px auto;">
                                                                                                                                                                                                                                    <input type="text" id="clienteNome" placeholder="Nome do Convidado">

                                                                                                                                                                                                                                                <select id="mesa">
                                                                                                                                                                                                                                                                <option value="">Posição da Mesa</option>
                                                                                                                                                                                                                                                                                <option>Salão Principal - 01</option>
                                                                                                                                                                                                                                                                                                <option>Salão Principal - 02</option>
                                                                                                                                                                                                                                                                                                                <option>Terraço VIP - 01</option>
                                                                                                                                                                                                                                                                                                                                <option>Terraço VIP - 02</option>
                                                                                                                                                                                                                                                                                                                                                <option>Jardim de Inverno - 01</option>
                                                                                                                                                                                                                                                                                                                                                            </select>
                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                            <h3>MENÚ DE ASSINATURA</h3>

                                                                                                                                                                                                                                                                                                                                                                                    <div class="grid-menu" id="menuItems"></div>

                                                                                                                                                                                                                                                                                                                                                                                            <div style="position:fixed; bottom:30px; right:30px;">
                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="irParaResumo()" class="btn-gold" style="width:250px;">
                                                                                                                                                                                                                                                                                                                                                                                                                        Fechar Pedido (<span id="contagem">0</span>)
                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="sessaoResumo" class="restaurante-container hidden">
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="receipt">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h2 style="color:black;">EXTRATO DE CONSUMO</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p id="resumoCabecalho"></p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="itensLista"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h3 id="totalFinal">Total: R$ 0,00</h3>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <br>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="finalizar()" class="btn-gold">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Confirmar Pedido
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="voltar()" style="background:none;border:none;color:gray;width:100%;margin-top:15px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Voltar ao Menu
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
