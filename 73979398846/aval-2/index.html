<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Burger-Monkey</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header class="header">
                            <img src="https://cdn-icons-png.flaticon.com/512/1041/1041402.png" alt="Logo Burger-Monkey: Macaco com hambúrguer" width="40" height="40">
                                    <h1>Burger-Monkey</h1>
                                            <nav>
                                                        <a href="#cardapio" class="carrinho-btn">Cardápio</a>
                                                                    <a href="#promocoes" class="carrinho-btn">Promoções</a>
                                                                                <button class="carrinho-btn" id="abrir-carrinho-btn">
                                                                                                🛒 R$ <span id="total-carrinho">0,00</span>
                                                                                                            </button>
                                                                                                                    </nav>
                                                                                                                        </header>

                                                                                                                            <section class="busca">
                                                                                                                                    <input type="text" id="busca-input" placeholder="Buscar: feijão tropeiro, galinha...">
                                                                                                                                        </section>

                                                                                                                                            <nav class="categorias" id="categorias-nav">
                                                                                                                                                    <button class="categoria ativa" data-cat="todos">Todos</button>
                                                                                                                                                            <button class="categoria" data-cat="pf">PFs</button>
                                                                                                                                                                    <button class="categoria" data-cat="bebidas">Bebidas</button>
                                                                                                                                                                            <button class="categoria" data-cat="promocao">Promoções</button>
                                                                                                                                                                                </nav>

                                                                                                                                                                                    <main>
                                                                                                                                                                                            <article class="produtos" id="lista-produtos">
                                                                                                                                                                                                        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600" alt="Prato delicioso do Burger-Monkey" class="banner">
                                                                                                                                                                                                                    <h2 class="secao-titulo">Mais Pedidos</h2>
                                                                                                                                                                                                                            </article>
                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                    <aside>
                                                                                                                                                                                                                                            <h3>Informações do Pedido</h3>
                                                                                                                                                                                                                                                    <p>Taxa de entrega: R$ 3,00</p>
                                                                                                                                                                                                                                                            <p>Horário: 11h às 15h</p>
                                                                                                                                                                                                                                                                    <p><a href="https://wa.me/5589999221649" target="_blank">Falar no WhatsApp</a></p>
                                                                                                                                                                                                                                                                        </aside>

                                                                                                                                                                                                                                                                            <div class="carrinho-fixo" id="carrinho-fixo">
                                                                                                                                                                                                                                                                                    <button class="finalizar-btn" id="finalizar-btn-fixo">
                                                                                                                                                                                                                                                                                                Finalizar no WhatsApp - R$ <span id="total-final">0,00</span>
                                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                <div class="modal" id="modal-carrinho">
                                                                                                                                                                                                                                                                                                                        <div class="modal-conteudo">
                                                                                                                                                                                                                                                                                                                                    <span class="fechar" id="fechar-carrinho-btn">&times;</span>
                                                                                                                                                                                                                                                                                                                                                <h2>Seu Pedido</h2>
                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                        <div id="itens-carrinho"></div>
                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                <div class="modal-info-entrega">
                                                                                                                                                                                                                                                                                                                                                                                                                <p><span>Subtotal:</span> <span id="modal-subtotal">R$ 0,00</span></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                <p><span>Taxa de entrega:</span> <span id="taxa-entrega-txt">R$ 3,00</span></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <h3><span>Total:</span> <span id="modal-total">R$ 3,00</span></h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="finalizar-btn" id="finalizar-btn-modal">Mande seu pedido pelo WhatsApp</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <footer class="rodape-copyright">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>&copy; Copyright 2026 Burger-Monkey. Todos os direitos reservados.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
