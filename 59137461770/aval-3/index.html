<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">Instagram</div>
            <div class="nav-icons">
                <span>🏠</span>
                <span>🔍</span>
                <span>❤️</span>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Barra de Stories -->
        <section class="stories">
            <div class="story">
                <div class="story-ring"><img src="https://images.unsplash.com/photo-1527980965255-d3b416303d12?w=150" alt="Seu story"></div>
                <span>Seu story</span>
            </div>
            <div class="story">
                <div class="story-ring"><img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" alt="dev.brasil"></div>
                <span>dev.brasil</span>
            </div>
            <div class="story">
                <div class="story-ring"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" alt="viagens"></div>
                <span>viagens</span>
            </div>
            <div class="story">
                <div class="story-ring"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" alt="carlos.ui"></div>
                <span>carlos.ui</span>
            </div>
            <div class="story">
                <div class="story-ring"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150" alt="julia.foto"></div>
                <span>julia.foto</span>
            </div>
        </section>

        <!-- Criar Nova Publicação -->
        <section class="novo-post-card">
            <h3>➕ Criar nova publicação</h3>
            <form id="form-postar" class="form-grid">
                <div class="form-row">
                    <input type="text" name="usuario" placeholder="Seu @usuario" required>
                    <input type="text" name="local" placeholder="Localização (opcional)">
                </div>
                <input type="url" name="imagemUrl" placeholder="URL da imagem (deixe vazio para imagem padrão)">
                <input type="text" name="legenda" placeholder="Escreva uma legenda..." required>
                <button type="submit" class="btn-publicar">Compartilhar no Feed</button>
            </form>
        </section>

        <!-- Feed dinâmico -->
        <section id="feed-container"></section>
    </main>

    <script>
        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        function renderizarFeed(posts) {
            const container = document.getElementById('feed-container');
            container.innerHTML = posts.map(p => {
                const comentariosHtml = p.comentarios.map(c => {
                    const [autor, ...resto] = c.split(': ');
                    return `<p class="comentario"><strong>${escaparHtml(autor)}:</strong> ${escaparHtml(resto.join(': '))}</p>`;
                }).join('');

                return `
                    <article class="post">
                        <div class="post-header">
                            <div class="user-info">
                                <img src="${escaparHtml(p.avatar)}" alt="Avatar" class="avatar-post">
                                <div>
                                    <span class="username">${escaparHtml(p.usuario)}</span>
                                    <span class="location">${escaparHtml(p.local)}</span>
                                </div>
                            </div>
                            <span class="dots">•••</span>
                        </div>

                        <img src="${escaparHtml(p.imagemUrl)}" alt="Post" class="post-img">

                        <div class="post-actions">
                            <button type="button" class="btn-icon" onclick="curtirPost(${p.id})">
                                ${p.curtido ? '❤️' : '🤍'}
                            </button>
                            <span class="btn-icon">💬</span>
                            <span class="btn-icon">✈️</span>
                        </div>

                        <div class="post-content">
                            <p class="likes">${p.curtidas} curtidas</p>
                            <p class="caption"><strong>${escaparHtml(p.usuario)}</strong> ${escaparHtml(p.legenda)}</p>
                            <div class="comentarios-lista">${comentariosHtml}</div>
                        </div>

                        <form class="comment-box" onsubmit="comentarPost(event, ${p.id})">
                            <input type="text" name="comentario" placeholder="Adicione um comentário..." required>
                            <button type="submit">Publicar</button>
                        </form>
                    </article>
                `;
            }).join('');
        }

        async function carregarFeed() {
            const res = await fetch('/api/posts');
            const posts = await res.json();
            renderizarFeed(posts);
        }

        document.getElementById('form-postar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const params = new URLSearchParams(new FormData(e.target));
            const res = await fetch('/api/posts', { method: 'POST', body: params });
            renderizarFeed(await res.json());
            e.target.reset();
        });

        async function curtirPost(id) {
            const params = new URLSearchParams({ id });
            const res = await fetch('/api/curtir', { method: 'POST', body: params });
            renderizarFeed(await res.json());
        }

        async function comentarPost(e, id) {
            e.preventDefault();
            const input = e.target.comentario;
            const params = new URLSearchParams({ id, comentario: input.value });
            const res = await fetch('/api/comentar', { method: 'POST', body: params });
            renderizarFeed(await res.json());
        }

        carregarFeed();
    </script>
<script src="script.js"></script></body>
</html>
