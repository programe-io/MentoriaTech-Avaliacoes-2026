<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <link rel="stylesheet" th:href="@{/style.css}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <div class="container">
            <h1>💬 Mini Feed Social</h1>
        </div>
    </header>

    <main class="container">
        <!-- Caixa de Nova Publicação -->
        <section class="composer-card">
            <form th:action="@{/postar}" method="POST">
                <div class="user-inputs">
                    <input type="text" name="usuario" placeholder="Seu nome (ex: Maria Silva)" required>
                    <input type="text" name="handle" placeholder="@usuario">
                </div>
                <textarea name="texto" rows="3" maxlength="280" placeholder="O que está acontecendo agora?" required></textarea>
                <div class="composer-footer">
                    <span class="limite-info">Máx. 280 caracteres</span>
                    <button type="submit" class="btn-postar">Publicar</button>
                </div>
            </form>
        </section>

        <!-- Timeline / Feed -->
        <section class="feed-lista">
            <div th:if="${#lists.isEmpty(posts)}" class="vazio">
                <p>Nenhuma publicação ainda. Seja o primeiro a postar!</p>
            </div>

            <article class="post-card" th:each="post : ${posts}">
                <div class="avatar" th:text="${#strings.substring(post.usuario, 0, 1).toUpperCase()}">U</div>
                <div class="post-body">
                    <div class="post-header">
                        <div>
                            <strong class="nome" th:text="${post.usuario}">Nome</strong>
                            <span class="handle" th:text="${post.handle}">@usuario</span>
                            <span class="data">· <span th:text="${post.dataHora}">01/01/2026</span></span>
                        </div>
                        <form th:action="@{/deletar/{id}(id=${post.id})}" method="POST">
                            <button type="submit" class="btn-deletar" title="Excluir">✕</button>
                        </form>
                    </div>

                    <p class="post-texto" th:text="${post.texto}">Conteúdo do post...</p>

                    <div class="post-actions">
                        <form th:action="@{/curtir/{id}(id=${post.id})}" method="POST">
                            <button type="submit" class="btn-curtir">
                                ❤️ <span th:text="${post.curtidas}">0</span>
                            </button>
                        </form>
                    </div>
                </div>
            </article>
        </section>
    </main>
<script src="script.js"></script></body>
</html>
