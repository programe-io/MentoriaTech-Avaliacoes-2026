<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Programação</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="quiz-container">
        <div id="quiz-header">
            <h2>Quiz Tech</h2>
            <div id="progress">Pergunta 1 de 3</div>
        </div>
        
        <div id="question-box">
            <p id="question-text">Carregando pergunta...</p>
            <div id="options-container">
                <!-- As opções serão geradas pelo JavaScript -->
            </div>
        </div>

        <div id="result-box" class="hide">
            <h3>Parabéns! Você concluiu o quiz.</h3>
            <p id="score-text">Você acertou 0 de 0 perguntas.</p>
            <button id="restart-btn">Reiniciar Quiz</button>
        </div>
        
        <button id="next-btn" class="hide">Próxima Pergunta</button>
    </div>
<script src="script.js"></script></body>
</html>
