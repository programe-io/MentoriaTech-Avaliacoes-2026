
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Restaurante</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🍽️ Restaurante Sabor & Arte</h1>
        <p>Faça seu cadastro e garanta sua entrada!</p>
    </header>

    <main>
        <section class="container">

            <h2>Cadastro de Entrada</h2>

            <form id="formCadastro">

                <label>Nome completo:</label>
                <input type="text" id="nome"
                    placeholder="Digite seu nome" required>

                <label>Telefone:</label>
                <input type="tel" id="telefone"
                    placeholder="(99) 99999-9999" required>

                <label>Escolha o restaurante:</label>
                <select id="restaurante" required>
                    <option value="">Selecione</option>
                    <option value="Sabor & Arte">Sabor & Arte</option>
                    <option value="Cantinho Gourmet">Cantinho Gourmet</option>
                    <option value="Delícias da Casa">Delícias da Casa</option>
                </select>

                <label>Quantidade de pessoas:</label>
                <input type="number" id="pessoas"
                    min="1" max="20" value="1" required>

                <label>Data da entrada:</label>
                <input type="date" id="data" required>

                <label>Horário:</label>
                <input type="time" id="horario" required>

                <button type="submit">Confirmar Cadastro</button>

            </form>

            <div id="mensagem"></div>

        </section>

        <section class="container">
            <h2>Clientes Cadastrados</h2>

            <div id="listaClientes">
                <p>Nenhum cliente cadastrado.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Restaurante Sabor & Arte</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
