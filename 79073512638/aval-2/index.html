<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed Social</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="feed-container">
    
    <!-- Formulário de Nova Publicação -->
    <section class="create-post">
      <textarea id="postText" placeholder="No que você está pensando?"></textarea>
      <button type="button" id="publishBtn">Publicar</button>
    </section>

    <!-- Feed de Publicações -->
    <section id="feed" class="feed-list">
      
      <!-- Card de Post -->
      <article class="post">
        
        <header class="post-header">
          <div class="avatar">A</div>
          <div class="post-info">
            <h4>Ana Silva</h4>
            <time datetime="2026-10-29T07:00">Há 2 horas</time>
          </div>
        </header>

        <div class="post-content">
          <p>Hoje o dia está excelente para programar novas interfaces! 🚀</p>
        </div>

        <footer class="post-footer">
          
          <div class="post-actions">
            <button type="button" class="action-btn like-btn">
              <span class="like-icon">👍</span> 
              <span>Curtir</span> 
              (<span class="like-count">0</span>)
            </button>
          </div>

          <section class="comments-section">
            
            <form class="comment-form" onsubmit="return false;">
              <input type="text" placeholder="Escreva um comentário..." aria-label="Escreva um comentário">
            </form>

            <div class="comment-list">
              <article class="comment">
                <strong>Carlos Eduardo</strong>
                <p>Concordo totalmente!</p>
              </article>
            </div>

          </section>

        </footer>

      </article>

    </section>

  </main>

<script src="script.js"></script></body>
</html>
