<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="container">
    <h1>Calculadora de IMC</h1>
    <p class="subtitulo">Descubra seu Índice de Massa Corporal</p>

    <form id="imc-form">
      <div class="input-group">
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" step="0.1" placeholder="Ex: 70.5" required>
      </div>

      <div class="input-group">
        <label for="altura">Altura (m ou cm)</label>
        <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75 ou 175" required>
      </div>

      <div class="botoes">
        <button type="submit" class="btn-calcular">Calcular</button>
        <button type="button" id="btn-limpar" class="btn-limpar">Limpar</button>
      </div>
    </form>

    <section id="resultado" class="resultado oculto">
      <p>Seu IMC é:</p>
      <h2 id="valor-imc">00.0</h2>
      <span id="classificacao" class="badge">Classificação</span>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
