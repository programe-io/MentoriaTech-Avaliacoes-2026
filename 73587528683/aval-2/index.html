<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Cabeçalho -->
    <header class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
      <div>
        <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
          <i data-lucide="check-square" class="text-indigo-600"></i>
          Gerenciador de Tarefas
        </h1>
        <p class="text-sm text-gray-500 mt-1">Organize suas atividades diárias com categorias e prioridades</p>
      </div>
      <button id="btnOpenAddModal" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-lg transition duration-200 flex items-center justify-center gap-2 shadow-sm">
        <i data-lucide="plus-circle" class="w-5 h-5"></i>
        Nova Tarefa
      </button>
    </header>

    <!-- Cards de Resumo -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-gray-500">Total de Tarefas</p>
          <p id="totalTasksCount" class="text-3xl font-bold text-gray-900 mt-1">0</p>
        </div>
        <div class="p-3 bg-indigo-50 text-indigo-600 rounded-lg">
          <i data-lucide="list-todo" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-gray-500">Em Andamento</p>
          <p id="pendingTasksCount" class="text-3xl font-bold text-amber-600 mt-1">0</p>
        </div>
        <div class="p-3 bg-amber-50 text-amber-600 rounded-lg">
          <i data-lucide="clock" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-gray-500">Concluídas</p>
          <p id="completedTasksCount" class="text-3xl font-bold text-emerald-600 mt-1">0</p>
        </div>
        <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg">
          <i data-lucide="check-circle-2" class="w-6 h-6"></i>
        </div>
      </div>
    </section>

    <!-- Barra de Filtros e Busca -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
      <!-- Abas de Filtro de Status -->
      <div class="flex bg-gray-100 p-1 rounded-lg w-full md:w-auto">
        <button data-filter="all" class="filter-tab flex-1 md:flex-initial px-4 py-1.5 text-xs font-semibold rounded-md transition text-gray-700 bg-white shadow-sm">Todas</button>
        <button data-filter="pending" class="filter-tab flex-1 md:flex-initial px-4 py-1.5 text-xs font-semibold rounded-md transition text-gray-500 hover:text-gray-700">Pendentes</button>
        <button data-filter="completed" class="filter-tab flex-1 md:flex-initial px-4 py-1.5 text-xs font-semibold rounded-md transition text-gray-500 hover:text-gray-700">Concluídas</button>
      </div>

      <!-- Busca e Filtro de Categoria -->
      <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
        <div class="relative w-full sm:w-64">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
          <input type="text" id="searchInput" placeholder="Buscar tarefas..." class="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>

        <select id="categoryFilter" class="w-full sm:w-44 py-2 px-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          <option value="all">Todas Categorias</option>
        </select>
      </div>
    </section>

    <!-- Lista de Tarefas -->
    <main class="space-y-3" id="taskListContainer">
      <!-- Inserido via JS -->
    </main>

    <!-- Estado Vazio -->
    <div id="emptyState" class="hidden py-16 text-center bg-white rounded-xl shadow-sm border border-gray-100">
      <i data-lucide="clipboard-x" class="w-12 h-12 mx-auto text-gray-300 mb-3"></i>
      <p class="text-base font-medium text-gray-600">Nenhuma tarefa encontrada</p>
      <p class="text-sm text-gray-400 mt-1">Crie uma nova tarefa ou altere os filtros de busca.</p>
    </div>
  </div>

  <!-- Modal de Cadastrar/Editar Tarefa -->
  <div id="taskModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 overflow-hidden transform transition-all scale-95 duration-300" id="modalContent">
      <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
        <h3 id="modalTitle" class="font-bold text-gray-800">Nova Tarefa</h3>
        <button id="btnCloseModal" class="text-gray-400 hover:text-gray-600 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="taskForm" class="p-6 space-y-4">
        <input type="hidden" id="taskId">

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1" for="taskTitle">Título da Tarefa</label>
          <input type="text" id="taskTitle" required placeholder="Ex: Preparar relatório semanal" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1" for="taskDescription">Descrição (Opcional)</label>
          <textarea id="taskDescription" rows="3" placeholder="Detalhes ou passos para concluir a tarefa..." class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm resize-none"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1" for="taskCategory">Categoria</label>
            <input type="text" id="taskCategory" required placeholder="Ex: Trabalho, Estudos" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1" for="taskPriority">Prioridade</label>
            <select id="taskPriority" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
              <option value="baixa">Baixa</option>
              <option value="media" selected>Média</option>
              <option value="alta">Alta</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1" for="taskDueDate">Data de Vencimento</label>
          <input type="date" id="taskDueDate" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
        </div>

        <div class="pt-4 border-t border-gray-100 flex justify-end gap-3">
          <button type="button" id="btnCancel" class="px-4 py-2 border border-gray-200 text-gray-600 rounded-lg hover:bg-gray-50 text-sm font-medium transition">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition shadow-sm">Salvar Tarefa</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Arquivo JS -->
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
