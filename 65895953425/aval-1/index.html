<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Processamento de Produtos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <h1>Calculadora de Lote de Produtos</h1>
    <p>Insira a quantidade e o valor unitário dos produtos para processar o lote.</p>

    <div class="form-group">
      <label for="quantidade">Quantidade de Produtos:</label>
      <input type="number" id="quantidade" placeholder="Ex: 5" min="1">
    </div>

    <div class="form-group">
      <label for="preco">Preço Unitário (R$):</label>
      <input type="number" id="preco" placeholder="Ex: 15.50" step="0.01" min="0">
    </div>

    <button onclick="processarLote()">Calcular Lote</button>

    <div id="resultado" class="resultado-box hidden">
      <h3>Resumo do Processamento</h3>
      <p id="infoLote"></p>
    </div>
  </div>
<script src="script.js"></script></body>
</html>
