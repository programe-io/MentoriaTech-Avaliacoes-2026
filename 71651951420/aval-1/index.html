
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IMC - Sistema de Saúde</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <header class="header">
            <div class="logo">IMC+</div>
            <h1>Calculadora de IMC</h1>
            <p>Cuide da sua saúde acompanhando seu IMC.</p>
        </header>

        <section class="formulario">

            <div class="campo">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso"
                    placeholder="Ex: 70" min="1" step="0.1">
            </div>

            <div class="campo">
                <label for="altura">Altura (metros)</label>
                <input type="number" id="altura"
                    placeholder="Ex: 1.75" min="0.1" step="0.01">
            </div>

            <div class="campo">
                <label for="idade">Idade</label>
                <input type="number" id="idade"
                    placeholder="Ex: 25" min="1">
            </div>

            <div class="campo">
                <label for="sexo">Sexo</label>
                <select id="sexo">
                    <option value="">Selecione</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                </select>
            </div>

            <button id="calcular">Calcular IMC</button>
            <button id="limpar" class="btn-secundario">
                Limpar dados
            </button>

        </section>

        <section id="resultado" class="resultado" hidden>

            <h2>Resultado do cálculo</h2>

            <div class="imc-valor" id="valor">0.00</div>

            <h3 id="classificacao"></h3>

            <p id="mensagem"></p>

            <div class="barra">
                <div class="progresso" id="progresso"></div>
            </div>

        </section>

        <footer>
            <p>Desenvolvido com HTML, CSS e JavaScript</p>
            <small>O IMC é uma ferramenta de triagem, não um diagnóstico.</small>
        </footer>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
