
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Médica Digital</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>✚ Saúde Digital</h1>
    <p>Sistema de Cadastro e Controle de Pacientes</p>
</header>

<main>
    <section class="resumo">
        <div class="card">
            <span>👨‍⚕️</span>
            <h2 id="total">0</h2>
            <p>Pacientes cadastrados</p>
        </div>
        <div class="card">
            <span>📋</span>
            <h2 id="consultas">0</h2>
            <p>Fichas registradas</p>
        </div>
    </section>

    <section class="cadastro">
        <h2>＋ Cadastrar Paciente</h2>

        <form id="formFicha">
            <div class="campos">
                <div>
                    <label>Nome completo</label>
                    <input type="text" id="nome" required>
                </div>

                <div>
                    <label>Data de nascimento</label>
                    <input type="date" id="nascimento" required>
                </div>

                <div>
                    <label>Tipo sanguíneo</label>
                    <select id="sangue">
                        <option value="">Selecione</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>
                        <option>Não informado</option>
                    </select>
                </div>

                <div>
                    <label>Telefone</label>
                    <input type="tel" id="telefone">
                </div>

                <div>
                    <label>Alergias conhecidas</label>
                    <input type="text" id="alergias"
                        placeholder="Ex: medicamentos, alimentos...">
                </div>

                <div>
                    <label>Medicamentos em uso</label>
                    <input type="text" id="medicamentos">
                </div>

                <div class="completo">
                    <label>Histórico médico</label>
                    <textarea id="historico"
                        placeholder="Informações médicas relevantes..."></textarea>
                </div>

                <div class="completo">
                    <label>Observações</label>
                    <textarea id="observacoes"></textarea>
                </div>
            </div>

            <button type="submit" class="salvar">
                Salvar ficha médica
            </button>
        </form>
    </section>

    <section class="lista">
        <h2>📋 Pacientes cadastrados</h2>

        <input type="search" id="pesquisa"
            placeholder="Pesquisar paciente pelo nome...">

        <div id="listaPacientes"></div>
    </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
