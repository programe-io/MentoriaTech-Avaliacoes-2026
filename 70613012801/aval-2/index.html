
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>✓ Minhas Tarefas</h1>
    <p>Organize seu dia e alcance seus objetivos!</p>
</header>

<main>
    <section class="painel">
        <h2>Meu Progresso</h2>
        <div class="estatisticas">
            <div class="card">
                <h3 id="total">0</h3>
                <p>Total</p>
            </div>
            <div class="card">
                <h3 id="pendentes">0</h3>
                <p>Pendentes</p>
            </div>
            <div class="card">
                <h3 id="concluidas">0</h3>
                <p>Concluídas</p>
            </div>
        </div>

        <div class="barra">
            <div id="progresso"></div>
        </div>
        <p id="porcentagem">0% concluído</p>
    </section>

    <section class="formulario">
        <h2>Adicionar tarefa</h2>

        <input type="text" id="nome"
            placeholder="Digite sua tarefa">

        <input type="date" id="data">

        <select id="prioridade">
            <option value="Baixa">Prioridade baixa</option>
            <option value="Média">Prioridade média</option>
            <option value="Alta">Prioridade alta</option>
        </select>

        <button onclick="adicionarTarefa()">
            + Adicionar tarefa
        </button>
    </section>

    <section class="tarefas">
        <h2>Minhas atividades</h2>

        <div class="filtros">
            <button onclick="filtrar('Todas')">Todas</button>
            <button onclick="filtrar('Pendente')">Pendentes</button>
            <button onclick="filtrar('Concluída')">Concluídas</button>
        </div>

        <div id="listaTarefas"></div>
    </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
