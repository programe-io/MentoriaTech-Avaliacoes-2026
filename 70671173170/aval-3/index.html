
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese - Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header>
            <h1>Ficha de Anamnese</h1>
            <p>Cadastro de pacientes e controle de IMC</p>
        </header>

        <!-- CARD DO FORMULÁRIO -->
        <section class="card">
            <h2>Cadastro de Paciente</h2>

            <form id="form-pessoa">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome do paciente"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>
                    <input
                        type="number"
                        id="idade"
                        placeholder="Ex: 25"
                        min="1"
                        max="120"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="altura">Altura (metros)</label>
                    <input
                        type="number"
                        id="altura"
                        placeholder="Ex: 1.75"
                        min="0.5"
                        max="2.5"
                        step="0.01"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg)</label>
                    <input
                        type="number"
                        id="peso"
                        placeholder="Ex: 70.5"
                        min="1"
                        max="500"
                        step="0.1"
                        required
                    >
                </div>

                <div class="botoes">
                    <button type="submit" class="btn-salvar">
                        Salvar paciente
                    </button>

                    <button type="reset" class="btn-cancelar">
                        Cancelar
                    </button>
                </div>

                <p id="erro" role="alert"></p>

            </form>
        </section>

        <!-- CARD DA TABELA -->
        <section class="card tabela-card">

            <h2>Pacientes cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-pessoas">
                        <!-- Dados inseridos pelo JavaScript -->
                    </tbody>
                </table>
            </div>

        </section>

        <footer>
            <p>Projeto de estudo - Calculadora de IMC</p>
        </footer>

    </main>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
