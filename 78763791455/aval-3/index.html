<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Clone Instagram</title>
                <link rel="stylesheet" href="css/style.css">
                </head>
                <body>

                    <!-- Container Principal -->
                        <main class="instagram-wrapper">
                                
                                        <!-- Lado Esquerdo: Telefones / Mockup (Opcional, estilo tela de login ou feed) -->
                                                <div class="instagram-phone">
                                                            <img src="img/instagram-celular.png" alt="Celular">
                                                                    </div>

                                                                            <!-- Lado Direito: Feed / Conteúdo -->
                                                                                    <div class="instagram-content">
                                                                                                
                                                                                                            <!-- Feed de Stories / Postagens -->
                                                                                                                        <section class="feed">
                                                                                                                                        <!-- Exemplo de Post -->
                                                                                                                                                        <article class="post">
                                                                                                                                                                            <header class="post-header">
                                                                                                                                                                                                    <div class="user-info">
                                                                                                                                                                                                                                <img src="img/avatar.jpg" alt="Avatar" class="avatar">
                                                                                                                                                                                                                                                            <span>nome_do_usuario</span>
                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                        </header>
                                                                                                                                                                                                                                                                                                                            <div class="post-img">
                                                                                                                                                                                                                                                                                                                                                    <img src="img/post.jpg" alt="Publicação">
                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                            <div class="post-actions">
                                                                                                                                                                                                                                                                                                                                                                                                                    <button>❤️</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                            <button>💬</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button>✈️</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="post-footer">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p><strong>nome_do_usuario</strong> Curtido por outras pessoas...</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </article>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>
  
  
</body>
</html>
