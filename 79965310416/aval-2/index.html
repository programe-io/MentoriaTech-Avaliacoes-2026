
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>

            <nav>
                <a href="#inicio">Início</a>
                <a href="#perfil">Perfil</a>
            </nav>
        </div>
    </header>

    <main id="inicio">

        <section class="new-post">
            <div class="user">
                <div class="avatar">J</div>

                <div>
                    <strong>Julia</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>

            <textarea id="postText" placeholder="Escreva sua publicação..."></textarea>

            <button id="publishBtn">Publicar</button>
        </section>

        <section class="feed" id="feed">

            <article class="post">
                <div class="post-header">
                    <div class="avatar">M</div>

                    <div>
                        <strong>Maria</strong>
                        <span>Há 10 minutos</span>
                    </div>
                </div>

                <p class="post-text">
                    Hoje foi um dia incrível! Amo assistir filmes
                    e aproveitar cada momento. ❤️
                </p>

                <img
                    src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=900"
                    alt="Sala de cinema com poltronas"
                    class="post-image"
                >

                <div class="post-actions">
                    <button class="like-btn">❤️ Curtir</button>
                    <button class="comment-btn">💬 Comentar</button>
                </div>

                <div class="comments"></div>
            </article>

            <article class="post">
                <div class="post-header">
                    <div class="avatar">P</div>

                    <div>
                        <strong>Pedro</strong>
                        <span>Há 30 minutos</span>
                    </div>
                </div>

                <p class="post-text">
                    Aproveitando a natureza e curtindo
                    um dia maravilhoso! 🌳
                </p>

                <img
                    src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=900"
                    alt="Paisagem natural com montanhas e lago"
                    class="post-image"
                >

                <div class="post-actions">
                    <button class="like-btn">❤️ Curtir</button>
                    <button class="comment-btn">💬 Comentar</button>
                </div>

                <div class="comments"></div>
            </article>

        </section>

    </main>

    <footer>
        <p>© 2026 Mini Feed - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
