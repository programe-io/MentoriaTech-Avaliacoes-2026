<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram - Peaky Blinders Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body id="app-body" class="h-full bg-white text-[#0f1419] dark:bg-black dark:text-[#f3f5f7] antialiased pb-14 md:pb-0 transition-colors duration-200">

    <div id="toast-banner" class="hidden fixed bottom-16 md:bottom-6 left-1/2 -translate-x-1/2 bg-neutral-900 dark:bg-white text-white dark:text-black text-xs font-semibold px-4 py-2.5 rounded-full shadow-xl z-50 transition-all"></div>

    <div class="flex h-full flex-col md:flex-row max-w-[1920px] mx-auto">
        <aside class="hidden md:flex flex-col justify-between w-[72px] xl:w-[245px] h-screen sticky top-0 border-r border-[#dbdbdb] dark:border-[#262626] px-3 py-5 z-30 bg-white dark:bg-black">
            <div class="space-y-6">
                <div class="px-3 pt-2 pb-4">
                    <h1 onclick="resetFeed()" class="hidden xl:block text-2xl font-bold tracking-tight cursor-pointer font-serif select-none">Instagram</h1>
                    <svg onclick="resetFeed()" class="xl:hidden w-6 h-6 cursor-pointer fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                </div>

                <nav class="space-y-1">
                    <button id="nav-home" onclick="resetFeed()" class="nav-item flex items-center gap-4 w-full p-3 hover:bg-gray-100 dark:hover:bg-[#121212] rounded-lg transition-colors font-bold text-sm">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M9.005 16.545a2.997 2.997 0 0 1 2.997-2.997A2.997 2.997 0 0 1 15 16.545V22h7V11.543L12 2 2 11.543V22h7v-5.455z"/></svg>
                        <span class="hidden xl:inline">Página inicial</span>
                    </button>

                    <button id="nav-search" onclick="toggleSearchModal()" class="nav-item flex items-center gap-4 w-full p-3 hover:bg-gray-100 dark:hover:bg-[#121212] rounded-lg transition-colors text-sm">
                        <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        <span class="hidden xl:inline">Pesquisa</span>
                    </button>

                    <button id="nav-explore" onclick="showExplore()" class="nav-item flex items-center gap-4 w-full p-3 hover:bg-gray-100 dark:hover:bg-[#121212] rounded-lg transition-colors text-sm">
                        <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
                        <span class="hidden xl:inline">Explorar</span>
                    </button>

                    <button id="nav-reels" onclick="showReels()" class="nav-item flex items-center gap-4 w-full p-3 hover:bg-gray-100 dark:hover:bg-[#121212] rounded-lg transition-colors text-sm">
                        <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><line x1="2" y1="8" x2="22" y2="8"/><line x1="8" y1="2" x2="10" y2="8"/><line x1="15" y1="2" x2="17" y2="8"/><polygon points="10 12 16 15 10 18 10 12" fill="currentColor"/></svg>
                        <span class="hidden xl:inline">Reels</span>
                    </button>

                    <button id="nav-dm" onclick="showDirectMessages()" class="nav-item flex items-center gap-4 w-full p-3 hover:bg-gray-100 dark:hover:bg-[#121212] rounded-lg transition-colors text-sm relative">
                        <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        <span class="hidden xl:inline">Mensagens</span>
                        <span id="dm-unread-badge" class="absolute top-2 left-6 xl:left-auto xl:right-3 w-2.5 h-2.5 bg-insta-red rounded-full"></span>
                    </button>

                    <button id="nav-notifications" onclick="showNotifications()" class="nav-item flex items-center gap-4 w-full p-3 hover:bg-gray-100 dark:hover:bg-[#121212] rounded-lg transition-colors text-sm relative">
                        <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        <span class="hidden xl:inline">Notificações</span>
                        <span id="notif-unread-badge" class="absolute top-2 left-6 xl:left-auto xl:right-3 w-2.5 h-2.5 bg-insta-red rounded-full"></span>
                    </button>

                    <button onclick="openCreateModal()" class="nav-item flex items-center gap-4 w-full p-3 hover:bg-gray-100 dark:hover:bg-[#121212] rounded-lg transition-colors text-sm">
                        <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
                        <span class="hidden xl:inline">Criar</span>
                    </button>

                    <button id="nav-profile" onclick="showProfile()" class="nav-item flex items-center gap-4 w-full p-3 hover:bg-gray-100 dark:hover:bg-[#121212] rounded-lg transition-colors text-sm">
                        <img id="sidebar-user-avatar" src="" class="w-6 h-6 rounded-full object-cover border border-gray-300 dark:border-neutral-700" />
                        <span class="hidden xl:inline">Perfil</span>
                    </button>
                </nav>
            </div>

            <div class="pt-4 border-t border-[#dbdbdb] dark:border-[#262626]">
                <button onclick="toggleDarkMode()" class="flex items-center gap-4 w-full p-3 hover:bg-gray-100 dark:hover:bg-[#121212] rounded-lg transition-colors text-sm">
                    <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <span class="hidden xl:inline">Alternar modo</span>
                </button>
            </div>
        </aside>

        <header class="md:hidden sticky top-0 bg-white dark:bg-black border-b border-[#dbdbdb] dark:border-[#262626] z-40 px-4 py-3 flex items-center justify-between">
            <h1 onclick="resetFeed()" class="font-bold text-xl tracking-tight font-serif cursor-pointer select-none">Instagram</h1>
            <div class="flex items-center gap-4 text-xl">
                <button onclick="toggleDarkMode()" title="Alternar Tema">
                    <svg class="w-5 h-5 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <button onclick="openCreateModal()">
                    <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
                </button>
                <button onclick="showNotifications()" class="relative">
                    <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    <span id="notif-mobile-badge" class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-insta-red rounded-full"></span>
                </button>
                <button onclick="showDirectMessages()" class="relative">
                    <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    <span id="dm-mobile-badge" class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-insta-red rounded-full"></span>
                </button>
            </div>
        </header>

        <main id="main-area" class="flex-1 max-w-5xl mx-auto w-full px-2 sm:px-4 py-4 md:py-8 flex justify-center"></main>

        <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white dark:bg-black border-t border-[#dbdbdb] dark:border-[#262626] z-40 flex justify-around items-center py-2.5">
            <button onclick="resetFeed()" class="p-1">
                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M9.005 16.545a2.997 2.997 0 0 1 2.997-2.997A2.997 2.997 0 0 1 15 16.545V22h7V11.543L12 2 2 11.543V22h7v-5.455z"/></svg>
            </button>
            <button onclick="showExplore()" class="p-1">
                <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
            </button>
            <button onclick="showReels()" class="p-1">
                <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><line x1="2" y1="8" x2="22" y2="8"/><polygon points="10 12 16 15 10 18 10 12" fill="currentColor"/></svg>
            </button>
            <button onclick="toggleSearchModal()" class="p-1">
                <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </button>
            <button onclick="showProfile()" class="p-1">
                <img id="mobile-nav-avatar" src="" class="w-6 h-6 rounded-full object-cover border border-gray-400" />
            </button>
        </nav>
    </div>

    <div id="search-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex justify-center items-start pt-16 p-4" onclick="if(event.target.id==='search-modal') toggleSearchModal()">
        <div class="bg-white dark:bg-[#121212] w-full max-w-md rounded-2xl p-5 border border-[#dbdbdb] dark:border-[#262626] shadow-xl animate-fade-in">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">Pesquisar no Feed</h3>
                <button onclick="toggleSearchModal()" class="text-xl hover:opacity-70">✕</button>
            </div>
            <div class="relative">
                <input id="search-input" type="text" placeholder="Digite usuário, local ou legenda..." oninput="filterPosts()" class="w-full bg-gray-100 dark:bg-[#262626] px-4 py-2.5 pr-10 rounded-xl text-sm outline-none" />
                <button onclick="document.getElementById('search-input').value=''; filterPosts();" class="absolute right-3 top-2.5 text-xs text-[#737373] hover:text-current">Limpar</button>
            </div>
            <div class="flex flex-wrap gap-2 mt-3">
                <button onclick="quickSearch('Birmingham')" class="text-xs px-2.5 py-1 rounded-full bg-gray-100 dark:bg-[#262626] hover:opacity-80">Birmingham</button>
                <button onclick="quickSearch('john_wick')" class="text-xs px-2.5 py-1 rounded-full bg-gray-100 dark:bg-[#262626] hover:opacity-80">john_wick</button>
                <button onclick="quickSearch('jack_reacher')" class="text-xs px-2.5 py-1 rounded-full bg-gray-100 dark:bg-[#262626] hover:opacity-80">jack_reacher</button>
                <button onclick="quickSearch('shelby')" class="text-xs px-2.5 py-1 rounded-full bg-gray-100 dark:bg-[#262626] hover:opacity-80">shelby</button>
            </div>
        </div>
    </div>

    <div id="story-modal" class="hidden fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4" onclick="if(event.target.id==='story-modal') closeStory()">
        <button onclick="closeStory()" class="absolute top-4 right-4 text-white text-3xl hover:opacity-70">✕</button>
        <div id="story-bg" class="relative w-full max-w-sm h-[80vh] rounded-2xl overflow-hidden bg-cover bg-center flex flex-col justify-between p-4 shadow-2xl border border-white/10">
            <div class="space-y-3 bg-gradient-to-b from-black/75 to-transparent -m-4 p-4">
                <div class="w-full bg-white/30 h-1 rounded-full overflow-hidden">
                    <div id="story-progress" class="bg-white h-full w-0"></div>
                </div>
                <div class="flex items-center gap-3">
                    <img id="story-user-img" src="" class="w-10 h-10 rounded-full border-2 border-white object-cover" />
                    <div>
                        <span id="story-username" class="text-white font-semibold text-sm drop-shadow block"></span>
                        <span class="text-white/70 text-[11px]">Há 2 h</span>
                    </div>
                </div>
            </div>
            <div class="bg-gradient-to-t from-black/75 to-transparent -m-4 p-4 text-center">
                <p class="text-white/90 text-xs font-medium tracking-wide">"By order of the Peaky Blinders."</p>
            </div>
        </div>
    </div>

    <div id="create-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onclick="if(event.target.id==='create-modal') closeCreateModal()">
        <div class="bg-white dark:bg-[#121212] w-full max-w-md rounded-2xl p-5 border border-[#dbdbdb] dark:border-[#262626] shadow-xl animate-fade-in">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-semibold text-base">Nova publicação</h3>
                <button onclick="closeCreateModal()" class="text-xl hover:opacity-70">✕</button>
            </div>
            <div class="space-y-3.5">
                <label class="flex flex-col items-center justify-center w-full h-24 border-2 border-dashed border-gray-300 dark:border-[#363636] rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-[#1a1a1a] transition">
                    <span class="text-xs font-semibold text-insta-blue">Selecionar foto do dispositivo</span>
                    <span class="text-[11px] text-[#737373] mt-0.5">ou cole uma URL abaixo</span>
                    <input id="post-file-input" type="file" accept="image/*" class="hidden" onchange="handleImageFileSelect(event)" />
                </label>

                <input id="post-image-url" type="text" placeholder="URL da imagem (https://...)" oninput="previewPostImage()" class="w-full border border-gray-200 dark:border-[#262626] bg-gray-50 dark:bg-black p-2.5 rounded-xl text-sm outline-none" />
                
                <div id="image-preview-container" class="hidden w-full h-48 rounded-xl overflow-hidden border border-gray-200 dark:border-[#262626] relative">
                    <img id="image-preview" src="" class="w-full h-full object-cover" />
                    <button onclick="clearPostPreview()" class="absolute top-2 right-2 bg-black/70 text-white text-xs px-2 py-1 rounded-md">Remover</button>
                </div>

                <input id="post-location" type="text" placeholder="Localização (ex: Small Heath, Birmingham)" class="w-full border border-gray-200 dark:border-[#262626] bg-gray-50 dark:bg-black p-2.5 rounded-xl text-sm outline-none" />
                <textarea id="post-caption" rows="3" placeholder="Escreva uma legenda..." class="w-full border border-gray-200 dark:border-[#262626] bg-gray-50 dark:bg-black p-2.5 rounded-xl text-sm outline-none resize-none"></textarea>
                <button onclick="submitNewPost()" class="w-full bg-insta-blue hover:bg-insta-hoverBlue transition-colors text-white font-semibold py-2.5 rounded-xl text-sm">Compartilhar</button>
            </div>
        </div>
    </div>

    <div id="explore-detail-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" onclick="if(event.target.id==='explore-detail-modal') document.getElementById('explore-detail-modal').classList.add('hidden')">
        <div class="bg-white dark:bg-[#121212] w-full max-w-2xl rounded-2xl overflow-hidden border border-[#dbdbdb] dark:border-[#262626] flex flex-col md:flex-row animate-fade-in">
            <div class="md:w-3/5 bg-black flex items-center justify-center">
                <img id="explore-modal-img" src="" class="w-full max-h-[60vh] object-cover" />
            </div>
            <div class="md:w-2/5 p-4 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between border-b border-[#dbdbdb] dark:border-[#262626] pb-3 mb-3">
                        <div class="flex items-center gap-2.5">
                            <img id="explore-modal-avatar" src="" class="w-8 h-8 rounded-full object-cover" />
                            <span id="explore-modal-user" class="font-semibold text-sm"></span>
                        </div>
                        <button onclick="document.getElementById('explore-detail-modal').classList.add('hidden')" class="text-lg">✕</button>
                    </div>
                    <p id="explore-modal-caption" class="text-sm leading-relaxed"></p>
                </div>
                <div class="pt-4 border-t border-[#dbdbdb] dark:border-[#262626] mt-4">
                    <p id="explore-modal-stats" class="text-xs font-semibold text-[#737373]"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="reel-comments-modal" class="hidden fixed inset-0 bg-black/75 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target.id==='reel-comments-modal') closeReelComments()">
        <div class="bg-white dark:bg-[#121212] w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 border border-[#dbdbdb] dark:border-[#262626] shadow-2xl animate-fade-in">
            <div class="flex justify-between items-center pb-3 border-b border-[#dbdbdb] dark:border-[#262626]">
                <h3 class="font-bold text-sm">Comentários do Reel</h3>
                <button onclick="closeReelComments()" class="text-lg">✕</button>
            </div>
            <div id="reel-comments-list" class="max-h-64 overflow-y-auto py-3 space-y-3"></div>
            <div class="flex items-center gap-2 pt-3 border-t border-[#dbdbdb] dark:border-[#262626]">
                <input id="reel-comment-input" type="text" placeholder="Adicione um comentário..." class="w-full text-xs bg-gray-100 dark:bg-[#262626] px-3 py-2.5 rounded-full outline-none" onkeypress="if(event.key==='Enter') submitReelComment()" />
                <button onclick="submitReelComment()" class="text-xs font-semibold text-insta-blue px-2">Publicar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
