<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📦 Gestão de Estoque</h1>

        <!-- Secção de Alertas/Erros -->
        <div id="mensagem-erro" class="alert error hidden"></div>
        <div id="mensagem-sucesso" class="alert success hidden"></div>

        <div class="grid">
            <!-- Formulário: Cadastrar Produto -->
            <section class="card">
                <h2>Cadastrar Produto</h2>
                <form id="form-cadastrar">
                    <div class="form-group">
                        <label for="descricao">Descrição (mín. 5 carateres):</label>
                        <input type="text" id="descricao" placeholder="Ex: Cadeira gamer" required>
                    </div>
                    <div class="form-group">
                        <label for="quantidade">Quantidade (maior que 0):</label>
                        <input type="number" id="quantidade" min="1" placeholder="Ex: 12" required>
                    </div>
                    <div class="form-group">
                        <label for="valor">Valor (€):</label>
                        <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 699.00" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
                </form>
            </section>

            <!-- Formulário: Atualizar Produto -->
            <section class="card">
                <h2>Atualizar Produto</h2>
                
                <form id="form-atualizar-valor">
                    <h3>Alterar Valor</h3>
                    <div class="form-inline">
                        <input type="number" id="codigo-val" placeholder="Código" required>
                        <input type="number" id="novo-valor" step="0.01" min="0" placeholder="Novo Valor (€)" required>
                        <button type="submit" class="btn">Atualizar</button>
                    </div>
                </form>

                <hr>

                <form id="form-atualizar-qtd">
                    <h3>Adicionar Quantidade</h3>
                    <div class="form-inline">
                        <input type="number" id="codigo-qtd" placeholder="Código" required>
                        <input type="number" id="nova-qtd" min="1" placeholder="Qtd. a Somar" required>
                        <button type="submit" class="btn">Adicionar</button>
                    </div>
                </form>
            </section>
        </div>

        <!-- Tabela de Produtos Cadastrados -->
        <section class="card full-width">
            <h2>Produtos no Estoque</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor (€)</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos">
                        <tr>
                            <td colspan="4" class="empty-msg">Nenhum produto cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Script com a Lógica do Sistema -->
    <script>
        // Array para armazenar os produtos
        let produtos = [];

        // Validações
        function validarProduto(descricao, quantidade, valor) {
            if (descricao.length < 5) {
                throw new Error("A descrição deve ter, no mínimo, cinco carateres.");
            }
            if (quantidade < 1) {
                throw new Error("A quantidade deve ser maior que zero.");
            }
            if (valor < 0) {
                throw new Error("O valor deve ser maior ou igual a zero.");
            }
        }

        // Função para cadastrar produto
        function cadastrarProduto(descricao, quantidade, valor) {
            validarProduto(descricao, quantidade, valor);

            let novoProduto = {
                codigo: produtos.length + 1,
                descricao: descricao,
                quantidade: quantidade,
                valor: valor
            };

            produtos.push(novoProduto);
        }

        // Função para atualizar o valor de um produto
        function atualizarValor(codigoProduto, novoValor) {
            if (novoValor < 0) {
                throw new Error("O valor deve ser maior ou igual a zero.");
            }

            const produto = produtos.find((prod) => prod.codigo === codigoProduto);

            if (produto) {
                produto.valor = novoValor;
            } else {
                throw new Error("Produto não encontrado.");
            }
        }

        // Função para atualizar/somar a quantidade de um produto
        function atualizarQuantidade(codigoProduto, novaQuantidade) {
            if (novaQuantidade < 1) {
                throw new Error("A quantidade a somar deve ser maior que zero.");
            }

            const produto = produtos.find((prod) => prod.codigo === codigoProduto);

            if (produto) {
                produto.quantidade = produto.quantidade + novaQuantidade;
            } else {
                throw new Error("Produto não encontrado.");
            }
        }

        // Função para renderizar a tabela HTML
        function renderizarTabela() {
            const tbody = document.getElementById('tabela-produtos');
            tbody.innerHTML = '';

            if (produtos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">Nenhum produto cadastrado.</td></tr>';
                return;
            }

            produtos.forEach(prod => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${prod.codigo}</strong></td>
                    <td>${prod.descricao}</td>
                    <td>${prod.quantidade}</td>
                    <td>€ ${prod.valor.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Auxiliares de Notificação
        function mostrarErro(msg) {
            const divErro = document.getElementById('mensagem-erro');
            const divSucesso = document.getElementById('mensagem-sucesso');
            divSucesso.classList.add('hidden');
            divErro.textContent = msg;
            divErro.classList.remove('hidden');
        }

        function mostrarSucesso(msg) {
            const divErro = document.getElementById('mensagem-erro');
            const divSucesso = document.getElementById('mensagem-sucesso');
            divErro.classList.add('hidden');
            divSucesso.textContent = msg;
            divSucesso.classList.remove('hidden');
        }

        function limpaMensagens() {
            document.getElementById('mensagem-erro').classList.add('hidden');
            document.getElementById('mensagem-sucesso').classList.add('hidden');
        }

        // Eventos dos Formulários
        document.getElementById('form-cadastrar').addEventListener('submit', function(e) {
            e.preventDefault();
            limpaMensagens();

            try {
                const desc = document.getElementById('descricao').value;
                const qtd = parseInt(document.getElementById('quantidade').value);
                const val = parseFloat(document.getElementById('valor').value);

                cadastrarProduto(desc, qtd, val);
                renderizarTabela();
                mostrarSucesso(`Produto "${desc}" cadastrado com sucesso!`);
                this.reset();
            } catch (err) {
                mostrarErro(err.message);
            }
        });

        document.getElementById('form-atualizar-valor').addEventListener('submit', function(e) {
            e.preventDefault();
            limpaMensagens();

            try {
                const cod = parseInt(document.getElementById('codigo-val').value);
                const val = parseFloat(document.getElementById('novo-valor').value);

                atualizarValor(cod, val);
                renderizarTabela();
                mostrarSucesso(`Valor do produto #${cod} atualizado para € ${val.toFixed(2)}.`);
                this.reset();
            } catch (err) {
                mostrarErro(err.message);
            }
        });

        document.getElementById('form-atualizar-qtd').addEventListener('submit', function(e) {
            e.preventDefault();
            limpaMensagens();

            try {
                const cod = parseInt(document.getElementById('codigo-qtd').value);
                const qtd = parseInt(document.getElementById('nova-qtd').value);

                atualizarQuantidade(cod, qtd);
                renderizarTabela();
                mostrarSucesso(`Adicionadas ${qtd} unidades ao produto #${cod}.`);
                this.reset();
            } catch (err) {
                mostrarErro(err.message);
            }
        });
    </script>
</body>
</html>
