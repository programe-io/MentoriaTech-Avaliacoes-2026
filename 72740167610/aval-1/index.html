<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <h1>📦 Sistema de Estoque</h1>

<div class="form">
  <input id="descricao" type="text" placeholder="Descrição do produto">
    <input id="quantidade" type="number" placeholder="Quantidade">
      <input id="valor" type="number" placeholder="Valor R$">
        <button onclick="cadastrarProduto()">Cadastrar Produto</button>
        </div>

        <h2>Produtos Cadastrados</h2>
        <div id="lista"></div>

        <h2>Alterar Produto</h2>
        <div class="form">
          <input id="codigoAlterar" type="number" placeholder="Código do produto">
            <input id="novoValor" type="number" placeholder="Novo valor">
              <button onclick="alterarValor()">Alterar Valor</button>
                <input id="novaQuantidade" type="number" placeholder="Nova quantidade">
                  <button onclick="alterarQuantidade()">Alterar Quantidade</button>
                  </div>

                  <p id="mensagem"></p>
  <script src="script.js"></script>
  
</body>
</html>
