
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfume Social</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
  <h1>🌸 Perfume Social</h1>
  <p>Compartilhe sua paixão por fragrâncias!</p>
</header>

<nav>
  <a href="#">Início</a>
  <a href="#publicar">Publicar</a>
  <a href="#feed">Explorar</a>
</nav>

<main>
  <section class="composer" id="publicar">
    <h2>Compartilhe seu perfume favorito ✨</h2>
    <input id="nome" placeholder="Seu nome">
    <input id="titulo" placeholder="Nome do perfume">
    <textarea id="descricao" placeholder="Conte o que você acha dessa fragrância..."></textarea>
    <input id="imagem" placeholder="URL da imagem do perfume">
    <button onclick="publicar()">Publicar 🌷</button>
  </section>

  <section id="feed">
    <h2>Explorar fragrâncias</h2>
    <div id="posts"></div>
  </section>
</main>

<footer>
  <p>🌸 Perfume Social — Compartilhe sua essência.</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
