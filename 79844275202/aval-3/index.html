<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="app-container">
  <!-- Barra Superior -->
  <header class="navbar">
    <div class="logo">InstaClone</div>
    <div class="nav-actions">
      <button id="btn-new-post" title="Criar Publicação">➕</button>
      <button id="btn-theme" title="Alternar Tema">🌓</button>
    </div>
  </header>

  <!-- Barra de Stories -->
  <section class="stories-bar" id="stories-container"></section>

  <!-- Modal de Criação de Post -->
  <div class="modal hidden" id="post-modal">
    <div class="modal-content">
      <h3>Nova Publicação</h3>
      <input type="text" id="post-img-url" placeholder="URL da imagem (ou deixe vazio para aleatória)" />
      <textarea id="post-caption" rows="3" placeholder="Escreva uma legenda..."></textarea>
      <div class="modal-buttons">
        <button id="cancel-post" class="btn-secondary">Cancelar</button>
        <button id="publish-post" class="btn-primary">Publicar</button>
      </div>
    </div>
  </div>

  <!-- Feed Principal -->
  <main class="feed" id="feed-container"></main>
</div>$0
  <script src="script.js"></script>
  
</body>
</html>
