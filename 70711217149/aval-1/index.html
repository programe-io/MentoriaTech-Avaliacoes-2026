```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .formulario {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
            color: #444;
        }

        input,
        select,
        button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        .tarefa {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
            background-color: #fafafa;
        }

        .tarefa h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .tarefa p {
            margin: 5px 0;
        }

        .concluida {
            background-color: #e8f5e9;
            border-color: #4caf50;
        }

        .concluida h3 {
            text-decoration: line-through;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .botoes button {
            flex: 1;
            min-width: 150px;
        }

        .concluir {
            background-color: #28a745;
        }

        .concluir:hover {
            background-color: #1e7e34;
        }

        .alterar {
            background-color: #ff9800;
        }

        .alterar:hover {
            background-color: #e68900;
        }

        .mensagem {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1>📋 Gerenciador de Tarefas</h1>

        <div class="formulario">

            <label for="titulo">Título da tarefa:</label>
            <input 
                type="text" 
                id="titulo" 
                placeholder="Digite o título da tarefa"
            >

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade">
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button onclick="cadastrarTarefa()">
                ➕ Cadastrar Tarefa
            </button>

        </div>

        <div id="mensagem" class="mensagem"></div>

        <h2>📌 Tarefas cadastradas</h2>

        <br>

        <div id="listaTarefas"></div>

    </div>

    <script>

        // Array que armazenará as tarefas
        let tarefas = [];

        // Função para cadastrar uma nova tarefa
        function cadastrarTarefa() {

            const titulo = document.getElementById("titulo").value.trim();
            const prioridade = Number(
                document.getElementById("prioridade").value
            );

            // Validação do título
            if (titulo.length < 5) {
                mostrarMensagem(
                    "O título deve ter no mínimo 5 caracteres!",
                    "red"
                );
                return;
            }

            // Validação da prioridade
            if (prioridade < 1 || prioridade > 3) {
                mostrarMensagem(
                    "A prioridade deve estar entre 1 e 3!",
                    "red"
                );
                return;
            }

            // Criando a tarefa
            const tarefa = {
                codigo: tarefas.length + 1,
                titulo: titulo,
                prioridade: prioridade,
                concluida: false
            };

            // Adicionando ao array
            tarefas.push(tarefa);

            // Limpando o campo
            document.getElementById("titulo").value = "";

            mostrarMensagem(
                "Tarefa cadastrada com sucesso!",
                "green"
            );

            listarTarefas();
        }

        // Função para listar as tarefas
        function listarTarefas() {

            const lista = document.getElementById("listaTarefas");

            lista.innerHTML = "";

            if (tarefas.length === 0) {
                lista.innerHTML = "<p>Nenhuma tarefa cadastrada.</p>";
                return;
            }

            tarefas.forEach(function(tarefa) {

                const div = document.createElement("div");

                div.classList.add("tarefa");

                if (tarefa.concluida) {
                    div.classList.add("concluida");
                }

                let nomePrioridade = "";

                if (tarefa.prioridade === 1) {
                    nomePrioridade = "Alta";
                } else if (tarefa.prioridade === 2) {
                    nomePrioridade = "Média";
                } else {
                    nomePrioridade = "Baixa";
                }

                const status = tarefa.concluida
                    ? "Concluída"
                    : "Pendente";

                div.innerHTML = `
                    <h3>${tarefa.titulo}</h3>

                    <p><strong>Código:</strong> ${tarefa.codigo}</p>

                    <p>
                        <strong>Prioridade:</strong>
                        ${tarefa.prioridade} - ${nomePrioridade}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        ${status}
                    </p>

                    <div class="botoes">

                        <button 
                            class="concluir"
                            onclick="marcarConcluida(${tarefa.codigo})">
                            ${tarefa.concluida
                                ? "↩️ Reabrir"
                                : "✅ Concluir"}
                        </button>

                        <button 
                            class="alterar"
                            onclick="alterarPrioridade(${tarefa.codigo})">
                            🔄 Alterar Prioridade
                        </button>

                    </div>
                `;

                lista.appendChild(div);
            });
        }

        // Função para marcar uma tarefa como concluída
        function marcarConcluida(codigo) {

            const tarefa = tarefas.find(
                tarefa => tarefa.codigo === codigo
            );

            if (tarefa) {
                tarefa.concluida = !tarefa.concluida;
            }

            listarTarefas();
        }

        // Função para alterar a prioridade
        function alterarPrioridade(codigo) {

            const tarefa = tarefas.find(
                tarefa => tarefa.codigo === codigo
            );

            if (!tarefa) {
                return;
            }

            const novaPrioridade = Number(
                prompt(
                    "Digite a nova prioridade:\n" +
                    "1 - Alta\n" +
                    "2 - Média\n" +
                    "3 - Baixa"
                )
            );

            // Verificando a prioridade
            if (
                isNaN(novaPrioridade) ||
                novaPrioridade < 1 ||
                novaPrioridade > 3
            ) {
                alert(
                    "Prioridade inválida! Digite um valor entre 1 e 3."
                );
                return;
            }

            tarefa.prioridade = novaPrioridade;

            listarTarefas();
        }

        // Função para mostrar mensagens
        function mostrarMensagem(texto, cor) {

            const mensagem = document.getElementById("mensagem");

            mensagem.textContent = texto;
            mensagem.style.color = cor;

            setTimeout(function() {
                mensagem.textContent = "";
            }, 3000);
        }

        // Exibir a lista inicialmente
        listarTarefas();

    </script>

</body>
</html>
