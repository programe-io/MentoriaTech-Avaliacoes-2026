<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #2c3e50;
    }

    /* Formulário */
    form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #3498db;
    }

    select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #fff;
      font-size: 14px;
    }

    .btn-add {
      padding: 12px 18px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-add:hover {
      background-color: #219150;
    }

    /* Filtros e Contador */
    .barra-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .filtros button {
      background: none;
      border: 1px solid transparent;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      color: #666;
    }

    .filtros button.ativo {
      border-color: #3498db;
      color: #3498db;
      font-weight: bold;
    }

    /* Lista de Tarefas */
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }

    li:hover {
      background-color: #fafafa;
    }

    .tarefa-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      cursor: pointer;
    }

    .tarefa-info input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .concluida .texto {
      text-decoration: line-through;
      color: #95a5a6;
    }

    /* Etiquetas de Prioridade */
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .alta { background-color: #fadbd8; color: #c0392b; }
    .media { background-color: #fcf3cf; color: #d68910; }
    .baixa { background-color: #d4efdf; color: #27ae60; }

    .btn-del {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-left: 10px;
    }

    .btn-del:hover {
      background-color: #c0392b;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h1>✅ Minhas Tarefas</h1>

    <form id="form-tarefa">
      <input type="text" id="input-tarefa" placeholder="O que você precisa fazer?" required>
      <select id="prioridade">
        <option value="media">Média</option>
        <option value="alta">Alta</option>
        <option value="baixa">Baixa</option>
      </select>
      <button type="submit" class="btn-add">Adicionar</button>
    </form>

    <div class="barra-status">
      <span id="contador">0 pendentes</span>
      <div class="filtros">
        <button class="ativo" onclick="mudarFiltro('todas', this)">Todas</button>
        <button onclick="mudarFiltro('pendentes', this)">Pendentes</button>
        <button onclick="mudarFiltro('concluidas', this)">Concluídas</button>
      </div>
    </div>

    <ul id="lista-tarefas"></ul>
  </div>

  <script>
    let tarefas = JSON.parse(localStorage.getItem('minhas_tarefas')) || [];
    let filtroAtual = 'todas';

    const form = document.getElementById('form-tarefa');
    const lista = document.getElementById('lista-tarefas');
    const contador = document.getElementById('contador');

    function salvarERenderizar() {
      localStorage.setItem('minhas_tarefas', JSON.stringify(tarefas));
      renderizar();
    }

    // Adicionar nova tarefa
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const texto = document.getElementById('input-tarefa').value.trim();
      const prioridade = document.getElementById('prioridade').value;

      if (!texto) return;

      tarefas.push({
        id: Date.now(),
        texto,
        prioridade,
        concluida: false
      });

      form.reset();
      salvarERenderizar();
    });

    // Marcar ou desmarcar como concluída
    function alternarStatus(id) {
      const tarefa = tarefas.find(t => t.id === id);
      if (tarefa) {
        tarefa.concluida = !tarefa.concluida;
        salvarERenderizar();
      }
    }

    // Excluir tarefa
    function removerTarefa(id) {
      tarefas = tarefas.filter(t => t.id !== id);
      salvarERenderizar();
    }

    // Alterar aba de filtro
    function mudarFiltro(filtro, botao) {
      filtroAtual = filtro;
      document.querySelectorAll('.filtros button').forEach(btn => btn.classList.remove('ativo'));
      botao.classList.add('ativo');
      renderizar();
    }

    // Desenhar lista na tela
    function renderizar() {
      lista.innerHTML = '';

      const pendentes = tarefas.filter(t => !t.concluida).length;
      contador.textContent = `${pendentes} ${pendentes === 1 ? 'pendente' : 'pendentes'}`;

      const filtradas = tarefas.filter(t => {
        if (filtroAtual === 'pendentes') return !t.concluida;
        if (filtroAtual === 'concluidas') return t.concluida;
        return true;
      });

      filtradas.forEach(tarefa => {
        const li = document.createElement('li');
        if (tarefa.concluida) li.classList.add('concluida');

        li.innerHTML = `
          <label class="tarefa-info">
            <input type="checkbox" ${tarefa.concluida ? 'checked' : ''} onchange="alternarStatus(${tarefa.id})">
            <span class="texto">${tarefa.texto}</span>
          </label>
          <span class="badge ${tarefa.prioridade}">${tarefa.prioridade}</span>
          <button class="btn-del" onclick="removerTarefa(${tarefa.id})">Excluir</button>
        `;
        lista.appendChild(li);
      });
    }

    // Inicia a tela
    renderizar();
  </script>

<script src="script.js"></script></body>
</html>
