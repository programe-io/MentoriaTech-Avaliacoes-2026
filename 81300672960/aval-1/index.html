<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Controle de Estoque</h1>
        <p>Sistema de gerenciamento de pequenos comércios</p>
    </header>

    <main>

        <section class="resumo">

            <div class="card">
                <h3>Total de produtos</h3>
                <p id="totalProdutos">0</p>
            </div>

            <div class="card">
                <h3>Unidades em estoque</h3>
                <p id="totalUnidades">0</p>
            </div>

            <div class="card">
                <h3>Valor total do estoque</h3>
                <p id="valorEstoque">R\$ 0,00</p>
            </div>

        </section>

        <section class="painel">

            <h2>Cadastrar novo produto</h2>

            <form id="formProduto">

                <input
                    type="text"
                    id="descricao"
                    placeholder="Nome do produto"
                    required
                    minlength="3"
                >

                <input
                    type="number"
                    id="quantidade"
                    placeholder="Quantidade"
                    min="1"
                    step="1"
                    required
                >

                <input
                    type="number"
                    id="valor"
                    placeholder="Preço em R\$"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">
                    Cadastrar produto
                </button>

            </form>

            <p id="mensagem"></p>

        </section>

        <section class="painel">

            <h2>Estoque de produtos</h2>

            <input
                type="search"
                id="pesquisa"
                placeholder="Pesquisar produto..."
            >

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>Projeto Escolar - Sistema de Controle de Estoque</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
