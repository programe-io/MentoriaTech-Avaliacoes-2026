<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Controle de Estoque</h1>
        <p>Cadastro e gerenciamento de produtos</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <label>Descrição do produto</label>
                <input type="text" id="descricao"
                    placeholder="Nome do produto" required>

                <label>Quantidade</label>
                <input type="number" id="quantidade"
                    placeholder="Quantidade" min="1" required>

                <label>Valor (R\$)</label>
                <input type="number" id="valor"
                    placeholder="Preço do produto"
                    min="0" step="0.01" required>

                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section class="card">
            <h2>Atualizar produto</h2>

            <label>Código do produto</label>
            <input type="number" id="codigoAtualizar"
                placeholder="Digite o código">

            <label>Novo valor (R\$)</label>
            <input type="number" id="novoValor"
                placeholder="Novo preço" min="0" step="0.01">

            <button onclick="atualizarValorTela()">
                Atualizar valor
            </button>

            <label>Quantidade a adicionar</label>
            <input type="number" id="novaQuantidade"
                placeholder="Quantidade" min="1">

            <button onclick="atualizarQuantidadeTela()">
                Adicionar quantidade
            </button>
        </section>

        <section class="card">
            <h2>Produtos cadastrados</h2>

            <p id="totalProdutos">Total de produtos: 0</p>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                    </tbody>
                </table>
            </div>
        </section>

        <p id="mensagem"></p>
    </main>

    <footer>
        <p>Projeto CRUD - Controle de Estoque</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
