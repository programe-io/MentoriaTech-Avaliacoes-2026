
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Ficha de Anamnese</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                <div class="container">

                    <h1>Ficha de Anamnese</h1>
                        <p class="subtitulo">Cadastro e avaliação do IMC</p>

                            <form id="formulario">

                                    <label>Nome completo</label>
                                            <input type="text" id="nome" required>

                                                    <label>Idade</label>
                                                            <input type="number" id="idade" required>

                                                                    <label>Altura (metros)</label>
                                                                            <input type="number" id="altura" step="0.01" required>

                                                                                    <label>Peso (kg)</label>
                                                                                            <input type="number" id="peso" step="0.1" required>

                                                                                                    <p id="mensagemErro"></p>

                                                                                                            <button type="submit">Cadastrar pessoa</button>

                                                                                                                </form>

                                                                                                                    <h2>Pessoas cadastradas</h2>

                                                                                                                        <p>Total de pessoas: <span id="contador">0</span></p>

                                                                                                                            <div class="tabela-container">
                                                                                                                                    <table>
                                                                                                                                                <thead>
                                                                                                                                                                <tr>
                                                                                                                                                                                    <th>Código</th>
                                                                                                                                                                                                        <th>Nome</th>
                                                                                                                                                                                                                            <th>Idade</th>
                                                                                                                                                                                                                                                <th>Altura</th>
                                                                                                                                                                                                                                                                    <th>Peso</th>
                                                                                                                                                                                                                                                                                        <th>IMC</th>
                                                                                                                                                                                                                                                                                                            <th>Classificação</th>
                                                                                                                                                                                                                                                                                                                                <th>Ação</th>
                                                                                                                                                                                                                                                                                                                                                </tr>
                                                                                                                                                                                                                                                                                                                                                            </thead>

                                                                                                                                                                                                                                                                                                                                                                        <tbody id="tabelaPessoas"></tbody>
                                                                                                                                                                                                                                                                                                                                                                                </table>
                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                    </html>
