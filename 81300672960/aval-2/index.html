
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gerenciador de Tarefas</title>

                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <div class="container">

                            <h1>Gerenciador de Tarefas</h1>
                                    <p>Cadastre e organize suas tarefas.</p>

                                            <form id="formTarefa">

                                                        <label for="titulo">Título da tarefa</label>
                                                                    <input type="text" id="titulo" placeholder="Digite o título">

                                                                                <label for="descricao">Descrição</label>
                                                                                            <textarea id="descricao" placeholder="Descreva a tarefa"></textarea>

                                                                                                        <label for="prioridade">Prioridade</label>
                                                                                                                    <select id="prioridade">
                                                                                                                                    <option value="Baixa">Baixa</option>
                                                                                                                                                    <option value="Média">Média</option>
                                                                                                                                                                    <option value="Alta">Alta</option>
                                                                                                                                                                                </select>

                                                                                                                                                                                            <button type="submit">Cadastrar tarefa</button>

                                                                                                                                                                                                    </form>

                                                                                                                                                                                                            <hr>

                                                                                                                                                                                                                    <h2>Buscar tarefa</h2>

                                                                                                                                                                                                                            <div class="busca">
                                                                                                                                                                                                                                        <input type="number" id="codigoBusca"
                                                                                                                                                                                                                                                           placeholder="Digite o código">

                                                                                                                                                                                                                                                                       <button type="button" onclick="buscarTarefa()">
                                                                                                                                                                                                                                                                                       Buscar
                                                                                                                                                                                                                                                                                                   </button>
                                                                                                                                                                                                                                                                                                           </div>

                                                                                                                                                                                                                                                                                                                   <button type="button" onclick="listarTarefas()">
                                                                                                                                                                                                                                                                                                                               Mostrar todas
                                                                                                                                                                                                                                                                                                                                       </button>

                                                                                                                                                                                                                                                                                                                                               <h2>Tarefas cadastradas</h2>

                                                                                                                                                                                                                                                                                                                                                       <div id="listaTarefas"></div>

                                                                                                                                                                                                                                                                                                                                                           </div>

                                                                                                                                                                                                                                                                                                                                                               <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                               <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                               </html>
