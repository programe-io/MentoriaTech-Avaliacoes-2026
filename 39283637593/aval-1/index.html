<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Sistema de Estoque</h1>

        <!-- Cadastro -->
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <div class="form-group">
                <label for="codigo">Código:</label>
                <input type="text" id="codigo" placeholder="Digite o código">
            </div>

            <div class="form-group">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" placeholder="Digite a descrição">
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" placeholder="Digite a quantidade">
            </div>

            <div class="form-group">
                <label for="valor">Valor:</label>
                <input type="number" id="valor" step="0.01" placeholder="Digite o valor">
            </div>

            <button onclick="cadastrarProduto()">
                Cadastrar Produto
            </button>
        </section>

        <!-- Alterações -->
        <section class="card">
            <h2>Alterar Produto</h2>

            <div class="form-group">
                <label for="codigoAlteracao">Código do produto:</label>
                <input type="text" id="codigoAlteracao" placeholder="Código">
            </div>

            <div class="form-group">
                <label for="novoValor">Novo valor:</label>
                <input type="number" id="novoValor" step="0.01" placeholder="Novo valor">
            </div>

            <button onclick="alterarValor()">
                Alterar Valor
            </button>

            <div class="form-group">
                <label for="novaQuantidade">Nova quantidade:</label>
                <input type="number" id="novaQuantidade" placeholder="Nova quantidade">
            </div>

            <button onclick="alterarQuantidade()">
                Alterar Quantidade
            </button>
        </section>

        <!-- Lista de produtos -->
        <section class="card">
            <h2>Produtos Cadastrados</h2>

            <button onclick="listarProdutos()">
                Listar Produtos
            </button>

            <div id="listaProdutos"></div>
        </section>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
