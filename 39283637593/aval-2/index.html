
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="header">
        <div class="container">
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas atividades de maneira simples e eficiente.</p>
        </div>
    </header>

    <main class="container">

        <section class="card">
            <h2>Cadastrar nova tarefa</h2>

            <form id="formTarefa">
                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex.: Estudar JavaScript"
                        minlength="5"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" required>
                        <option value="1">1 - Alta</option>
                        <option value="2" selected>2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-principal">
                    Cadastrar tarefa
                </button>
            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>
        </section>

        <section class="resumo">
            <div class="resumo-item">
                <span>Total de tarefas</span>
                <strong id="total">0</strong>
            </div>

            <div class="resumo-item">
                <span>Pendentes</span>
                <strong id="pendentes">0</strong>
            </div>

            <div class="resumo-item">
                <span>Concluídas</span>
                <strong id="concluidas">0</strong>
            </div>
        </section>

        <section class="card">
            <h2>Tarefas cadastradas</h2>

            <div class="filtros">
                <label for="filtro">Filtrar tarefas:</label>
                <select id="filtro">
                    <option value="todas">Todas</option>
                    <option value="pendente">Pendentes</option>
                    <option value="concluida">Concluídas</option>
                </select>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaTarefas"></tbody>
                </table>
            </div>

            <p id="vazio" class="vazio">
                Nenhuma tarefa cadastrada.
            </p>
        </section>

    </main>

    <footer>
        <p>Projeto acadêmico - HTML, CSS e JavaScript</p>
    </footer>

<script src="script.js"></script></body>
</html>
