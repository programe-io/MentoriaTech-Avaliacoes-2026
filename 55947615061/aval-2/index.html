<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Feed</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>
        </div>

        <nav>
            <a href="#">Início</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main>

        <section class="new-post">
            <div class="user">
                <div class="avatar">D</div>

                <div class="user-info">
                    <strong>DAVI</strong>
                    <span>O QUE VOCÊ ESTÁ PENSANDO?</span>
                </div>
            </div>

            <button>Publicar</button>
        </section>

        <article class="post">

            <div class="post-header">
                <div class="avatar">K</div>

                <div class="user-info">
                    <strong>Kayane</strong>
                    <span>HÁ 10 MINUTOS</span>
                </div>
            </div>

            <div class="post-text">
                Hoje eu vi o novo filme do Homem-Aranha,
                top, tô feliz :D
            </div>

            <img
                src="https://wallpaperaccess.com/full/8791945.jpg"
                alt="Imagem do Homem-Aranha"
            >

            <div class="actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>

    </main>

    <footer>
        <p>Mini Feed - Todos os direitos reservados - 2026</p>
    </footer>

</body>

</html>
