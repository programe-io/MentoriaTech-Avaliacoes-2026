<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha 2D</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div id="game-container">
        <header id="game-header">
            <h1 id="game-title">
                <p>SNAKE GAME</p>
            </h1>
            <div id="score-board">
                <p>PONTOS: <span id="current-score">0</span></p>
                <p>RECORDE: <span id="high-score">0</span></p>
            </div>
        </header>

        <nav id="game-nav">
            <p><button id="btn-restart" onclick="resetGame()">REINICIAR</button></p>
        </nav>

        <main id="stage">
            <canvas id="snakeCanvas" width="400" height="400"></canvas>
            
            <div id="game-over-screen">
                <p>FIM DE JOGO</p>
                <p class="sub-text">Pressione Espaço para tentar de novo</p>
            </div>
        </main>

        <aside id="instructions">
            <p><strong>COMO JOGAR:</strong></p>
            <p>Use as setas do teclado (◄ ▲ ▼ ►) ou as teclas W, A, S, D para direcionar a cobrinha.</p>
        </aside>

        <footer id="game-footer">
            <p>&copy; 2026 - Desenvolvido em HTML5 Semântico</p>
        </footer>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
