<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimaTempo 2D - Previsão do Tempo</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div id="site-wrapper">

        <header id="main-header">
            <h1 class="brand-title">
                <p>NUVEMCLIMA</p>
            </h1>
        </header>

        <nav id="search-bar">
            <form onsubmit="buscarClima(event)">
                <p>
                    <input type="text" id="city-input" placeholder="Digite uma cidade (Ex: São Paulo)..." required>
                    <button type="submit">Buscar</button>
                </p>
            </form>
        </nav>

        <main id="weather-content">
            
            <article id="current-weather">
                <h2 class="hidden-title"><p>Clima Atual</p></h2>
                <p class="city-name" id="w-city">São Paulo</p>
                <p class="weather-desc" id="w-desc">Ensolarado</p>
                <p class="temperature"><span id="w-temp">26</span>°C</p>
            </article>

            <section id="weather-details">
                <div class="detail-card">
                    <p class="detail-label">Umidade</p>
                    <p class="detail-value"><span id="w-humidity">60</span>%</p>
                </div>
                <div class="detail-card">
                    <p class="detail-label">Vento</p>
                    <p class="detail-value"><span id="w-wind">14</span> km/h</p>
                </div>
                <div class="detail-card">
                    <p class="detail-label">Sensação</p>
                    <p class="detail-value"><span id="w-feels">28</span>°C</p>
                </div>
            </section>

        </main>

        <aside id="weather-alerts">
            <p class="alert-title"><strong>AVISOS METEOROLÓGICOS:</strong></p>
            <p class="alert-text">Nenhum alerta crítico para a região selecionada no momento. Índice UV moderado.</p>
        </aside>

        <footer id="main-footer">
            <p>&copy; 2026 NuvemClima - Dados Semânticos Atualizados</p>
        </footer>

    </div>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
