<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed de Gostos</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
    
    <header>
        <div class="header-content">
            <h1>Feed de Gostos</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Meu Perfil</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="new-post">
            <div class="user">
                <div class="Avatar">
                     G  <!-- Inicial do nome do aluno -->
                </div>
                <div>
                    <strong> Guilherme</strong>
                    <span>Recomende algo legal para seus amigos!</span>
                </div>
            </div>
            <button>Postar</button>
        </section>

        <article class="post">
            <div class="post-header">
                <div class="Avatar">
                     G 
                </div>
                <div>
                    <strong> Guilherme </strong>
                    <span>Há 5 minutos</span>
                </div>
            </div>

            <div class="post-text">
                 Transformers
            </div>

            <img src=" https://upload.wikimedia.org/wikipedia/pt/e/ee/Transformers-poster.jpg?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original " alt="Imagem da indicação">

            <div class="Post-Action">
                <button>Curtir ❤️</button>
                <button>Comentar 💬</button>
            </div>
        </article>
    </main>

    <footer>
        <p>Feed de Gostos - Todos os direitos reservados - 2026</p>            
    </footer>

</body>
</html>
