
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProTask</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>💼 ProTask</h1>
    <p>Gerencie seus projetos com eficiência.</p>
  </header>

  <main>
    <section class="formulario">
      <h2>Novo projeto</h2>
      <input id="projeto" placeholder="Nome do projeto">
      <input id="descricao" placeholder="Descrição da tarefa">
      <button onclick="adicionar()">Criar tarefa</button>
    </section>

    <section class="kanban">
      <div class="coluna">
        <h2>📋 A fazer</h2>
        <div id="fazer"></div>
      </div>

      <div class="coluna">
        <h2>⚙️ Em andamento</h2>
        <div id="andamento"></div>
      </div>

      <div class="coluna">
        <h2>✅ Concluído</h2>
        <div id="concluido"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
