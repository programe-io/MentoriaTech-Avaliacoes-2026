
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>🚀 TaskFlow</h1>
    <p>Organize suas tarefas e alcance seus objetivos.</p>
  </header>

  <main>
    <section class="painel">
      <h2>Minhas tarefas</h2>

      <form id="formulario">
        <input id="tarefa" type="text" placeholder="Digite uma tarefa..." required>
        <button type="submit">+ Adicionar</button>
      </form>

      <div class="estatisticas">
        <div>Total: <strong id="total">0</strong></div>
        <div>Concluídas: <strong id="concluidas">0</strong></div>
        <div>Pendentes: <strong id="pendentes">0</strong></div>
      </div>

      <ul id="lista"></ul>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
