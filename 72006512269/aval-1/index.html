<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Controle de Estoque</h1>

        <!-- Formulario de Cadastro -->
        <div class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="formProduto">
                <div class="campo">
                    <label for="codigo">Código:</label>
                    <input type="text" id="codigo" placeholder="Ex: 101" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição:</label>
                    <input type="text" id="descricao" placeholder="Ex: Teclado USB" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" min="0" placeholder="Ex: 10" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor Unitário (R$):</label>
                    <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 49.90" required>
                </div>

                <button type="submit">Cadastrar Produto</button>
            </form>
        </div>

        <!-- Tabela de Produtos -->
        <div class="card">
            <h2>Produtos em Estoque</h2>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Qtd.</th>
                        <th>Valor Unit. (R$)</th>
                        <th>Total Item (R$)</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaProdutos">
                    <!-- Linhas adicionadas via JavaScript -->
                </tbody>
            </table>

            <div class="rodape-total">
                <strong>Valor Total do Estoque: R$ <span id="totalGeral">0.00</span></strong>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
