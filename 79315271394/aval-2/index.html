
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mini Feed Social</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>SocialFeed</h1>
                                    <p>Compartilhe seus momentos!</p>
                                        </header>

                                            <main>
                                                    <section class="criar-post">
                                                                <h2>Nova publicação</h2>
                                                                            <input type="text" id="nome" placeholder="Seu nome">
                                                                                        <textarea id="mensagem" placeholder="O que você está pensando?"></textarea>
                                                                                                    <button onclick="publicar()">Publicar</button>
                                                                                                            </section>

                                                                                                                    <section class="feed">
                                                                                                                                <h2>Feed de publicações</h2>
                                                                                                                                            <div id="posts">

                                                                                                                                                            <article class="post">
                                                                                                                                                                                <h3>Maria Silva</h3>
                                                                                                                                                                                                    <p>Que dia maravilhoso! ❤️</p>
                                                                                                                                                                                                                        <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                                                                                                                                                                                                                                            <button onclick="comentar(this)">💬 Comentar</button>
                                                                                                                                                                                                                                                                <div class="comentarios"></div>
                                                                                                                                                                                                                                                                                </article>

                                                                                                                                                                                                                                                                                                <article class="post">
                                                                                                                                                                                                                                                                                                                    <h3>João Santos</h3>
                                                                                                                                                                                                                                                                                                                                        <p>Aproveitando cada momento! 🌻</p>
                                                                                                                                                                                                                                                                                                                                                            <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
                                                                                                                                                                                                                                                                                                                                                                                <button onclick="comentar(this)">💬 Comentar</button>
                                                                                                                                                                                                                                                                                                                                                                                                    <div class="comentarios"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                    </article>

                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>© 2026 - SocialFeed</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
