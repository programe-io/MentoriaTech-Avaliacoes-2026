<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Avaliação</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        input[type="text"], input[type="email"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .rating-container {
            display: flex;
            justify-content: space-between;
            flex-direction: row-reverse;
            max-width: 250px;
            margin: 0 auto 20px auto;
        }
        .rating-container input {
            display: none;
        }
        .rating-container label {
            cursor: pointer;
            font-size: 30px;
            color: #ccc;
            transition: color 0.2s;
        }
        .rating-container input:checked ~ label,
        .rating-container label:hover,
        .rating-container label:hover ~ label {
            color: #ffca08;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h2>Sua Opinião Importa!</h2>
    <form action="#" method="POST">
        
        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="form-group">
            <label for="motivo">O que você está avaliando?</label>
            <select id="motivo" name="motivo" required>
                <option value="" disabled selected>Selecione uma opção...</option>
                <option value="atendimento">Atendimento ao Cliente</option>
                <option value="produto">Qualidade do Produto</option>
                <option value="entrega">Tempo de Entrega</option>
                <option value="outro">Outro</option>
            </select>
        </div>

        <div class="form-group">
            <label style="text-align: center;">Sua Nota:</label>
            <div class="rating-container">
                <input type="radio" id="star5" name="rating" value="5" /><label for="star5" title="Excelente">★</label>
                <input type="radio" id="star4" name="rating" value="4" /><label for="star4" title="Muito Bom">★</label>
                <input type="radio" id="star3" name="rating" value="3" /><label for="star3" title="Bom">★</label>
                <input type="radio" id="star2" name="rating" value="2" /><label for="star2" title="Regular">★</label>
                <input type="radio" id="star1" name="rating" value="1" /><label for="star1" title="Ruim">★</label>
            </div>
        </div>

        <div class="form-group">
            <label for="comentarios">Deixe seu comentário ou sugestão:</label>
            <textarea id="comentarios" name="comentarios" placeholder="Conte-nos mais sobre sua experiência..."></textarea>
        </div>

        <button type="submit">Enviar Avaliação</button>

    </form>
</div>

<script src="script.js"></script></body>
</html>
