<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz K-Pop | Stray Kids & BLACKPINK</title>

    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="quiz-container">

        <header>
            <div>
                <h1>🎤 K-POP QUIZ</h1>
                <p>Stray Kids × BLACKPINK</p>
            </div>

            <div class="pontuacao-caixa">
                ⭐ <span id="pontos">0</span>
            </div>
        </header>


        <main>

            <div class="progresso">
                <span id="numero-pergunta">1</span>
                / 10
            </div>

            <h2 id="pergunta">
                Carregando pergunta...
            </h2>

            <div id="caixa-opcoes" class="grid-opcoes">
            </div>

        </main>


        <div class="controles">

            <button id="btn-proximo" class="escondido">
                Próxima ➜
            </button>

        </div>

        <div id="resultado" class="escondido">
        </div>

    </div>


    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
