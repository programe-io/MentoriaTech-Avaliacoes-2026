<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Calculadora de IMC</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <main>
                            <h1>Sistema de Gestão de IMC</h1>

                                    <div class="card">
                                                <h2>Cadastrar Paciente</h2>
                                                            <form id="form-pessoa">
                                                                            <div class="campo">
                                                                                                <label for="nome">Nome:</label>
                                                                                                                    <input type="text" id="nome" placeholder="Digite o nome completo" maxlength="50">
                                                                                                                                    </div>

                                                                                                                                                    <div class="campo">
                                                                                                                                                                        <label for="idade">Idade:</label>
                                                                                                                                                                                            <input type="number" id="idade" min="1" max="120" placeholder="Ex: 30">
                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                            <div class="campo">
                                                                                                                                                                                                                                                <label for="altura">Altura (m):</label>
                                                                                                                                                                                                                                                                    <input type="number" id="altura" step="0.01" min="0.5" max="2.5" placeholder="Ex: 1.75">
                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                    <div class="campo">
                                                                                                                                                                                                                                                                                                                        <label for="peso">Peso (kg):</label>
                                                                                                                                                                                                                                                                                                                                            <input type="number" id="peso" step="0.1" min="2" max="500" placeholder="Ex: 70.5">
                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                            <p id="erro" hidden></p>

                                                                                                                                                                                                                                                                                                                                                                                            <div class="botoes">
                                                                                                                                                                                                                                                                                                                                                                                                                <button type="submit" id="btn-salvar">Salvar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                    <button type="reset" id="btn-cancelar">Cancelar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>Pacientes Cadastrados</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Nome</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Idade</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Altura</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Peso</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>IMC</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Classificação</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Ações</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <tbody id="tabela-pessoas">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Preenchido dinamicamente pelo JavaScript -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="app.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
