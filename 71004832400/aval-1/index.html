<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>📦 EstoquePro</h2>
    <nav>
        <a href="#" onclick="mostrarPagina('dashboard')">Dashboard</a>
        <a href="#" onclick="mostrarPagina('produtos')">Produtos</a>
        <a href="#" onclick="mostrarPagina('movimentacoes')">Movimentações</a>
    </nav>
</div>

<main>
    <header>
        <h1 id="titulo">Dashboard</h1>
        <span>Controle de Estoque</span>
    </header>

    <section id="dashboard" class="pagina">
        <div class="cards">
            <div class="card">
                <h3>Total de Produtos</h3>
                <p id="totalProdutos">0</p>
            </div>
            <div class="card">
                <h3>Unidades em Estoque</h3>
                <p id="totalUnidades">0</p>
            </div>
            <div class="card">
                <h3>Estoque Baixo</h3>
                <p id="estoqueBaixo">0</p>
            </div>
            <div class="card">
                <h3>Valor em Estoque</h3>
                <p id="valorEstoque">R$ 0,00</p>
            </div>
        </div>

        <h2>Produtos cadastrados</h2>
        <div id="listaDashboard"></div>
    </section>

    <section id="produtos" class="pagina" hidden>
        <h2>Cadastrar produto</h2>

        <form id="formProduto">
            <input id="nome" placeholder="Nome do produto" required>
            <input id="codigo" placeholder="Código" required>
            <input id="categoria" placeholder="Categoria">
            <input id="preco" type="number" step="0.01" min="0"
                placeholder="Preço unitário" required>
            <input id="quantidade" type="number" min="0"
                placeholder="Quantidade" required>
            <input id="minimo" type="number" min="0"
                placeholder="Estoque mínimo" required>

            <button type="submit">Salvar produto</button>
        </form>

        <input id="pesquisa" placeholder="Pesquisar produto..."
            oninput="listarProdutos()">

        <div id="listaProdutos"></div>
    </section>

    <section id="movimentacoes" class="pagina" hidden>
        <h2>Movimentação de estoque</h2>

        <form id="formMovimentacao">
            <select id="produtoMov" required>
                <option value="">Selecione um produto</option>
            </select>

            <select id="tipoMov">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
            </select>
  <script src="script.js"></script>
  
</body>
</html>
