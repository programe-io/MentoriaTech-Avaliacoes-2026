
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8eaf6;
            margin: 0;
            padding: 30px;
        \}

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #0002;
        \}

        h1 {
            text-align: center;
            color: #3949ab;
        \}

        .formulario {
            display: flex;
            gap: 10px;
        \}

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        \}

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #3949ab;
            color: white;
            cursor: pointer;
        \}

        button:hover {
            background: #283593;
        \}

        ul {
            list-style: none;
            padding: 0;
        \}

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f3f4fa;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            gap: 10px;
        \}

        li span {
            overflow-wrap: anywhere;
        \}

        .concluida {
            text-decoration: line-through;
            color: gray;
        \}

        .excluir {
            background: #e53935;
        \}

        .excluir:hover {
            background: #b71c1c;
        \}

        .estatisticas {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            text-align: center;
        \}

        .estatisticas div {
            color: #3949ab;
            font-weight: bold;
        \}
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>📋 Gerenciador de Tarefas</h1>

    <div class="formulario">
        <input
            type="text"
            id="tarefa"
            placeholder="Digite sua tarefa..."
        >

        <button onclick="adicionar()">Adicionar</button>
    </div>

    <div class="estatisticas">
        <div>
            <p>Total</p>
            <span id="total">0</span>
        </div>

        <div>
            <p>Pendentes</p>
            <span id="pendentes">0</span>
        </div>

        <div>
            <p>Concluídas</p>
            <span id="concluidas">0</span>
        </div>
    </div>

    <ul id="lista"></ul>

</div>

<script>

    let tarefas = JSON.parse(
        localStorage.getItem("tarefas")
    ) || [];

    function salvar() {
        localStorage.setItem(
            "tarefas",
            JSON.stringify(tarefas)
        );
    \}

    function adicionar() {
        let campo = document.getElementById("tarefa");
        let texto = campo.value.trim();

        if (texto === "") {
            alert("Digite uma tarefa!");
            return;
        \}

        tarefas.push({
            nome: texto,
            feita: false
        \});

        campo.value = "";

        salvar();
        atualizar();
    \}

    function concluir(index) {
        tarefas[index].feita = !tarefas[index].feita;

        salvar();
        atualizar();
    \}

    function excluir(index) {
        tarefas.splice(index, 1);

        salvar();
        atualizar();
    \}

    function atualizar() {
        let lista = document.getElementById("lista");

        lista.innerHTML = "";

        tarefas.forEach((tarefa, index) => {

            let item = document.createElement("li");

            let texto = document.createElement("span");
            texto.textContent = tarefa.nome;

            if (tarefa.feita) {
                texto.classList.add("concluida");
            \}

            let concluirBtn = document.createElement("button");
            concluirBtn.textContent = tarefa.feita ? "Desfazer" : "Concluir";
            concluirBtn.onclick = () => concluir(index);

            let excluirBtn = document.createElement("button");
            excluirBtn.textContent = "Excluir";
            excluirBtn.className = "excluir";
            excluirBtn.onclick = () => excluir(index);

            item.appendChild(texto);
            item.appendChild(concluirBtn);
            item.appendChild(excluirBtn);

            lista.appendChild(item);
        \});

        document.getElementById("total").textContent =
            tarefas.length;

        document.getElementById("pendentes").textContent =
            tarefas.filter(t => !t.feita).length;

        document.getElementById("concluidas").textContent =
            tarefas.filter(t => t.feita).length;
    \}

    document.getElementById("tarefa")
        .addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                adicionar();
            \}
        \});

    atualizar();

</script>

<script src="script.js"></script></body>
</html>$0
