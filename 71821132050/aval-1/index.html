
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Estoque</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #0f172a;
    color: white;
    padding: 22px;
    text-align: center;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 15px;
}

.resumo {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #0001;
}

.card h3 {
    color: #64748b;
    font-size: 14px;
}

.card p {
    font-size: 25px;
    font-weight: bold;
    margin-top: 10px;
    color: #2563eb;
}

.formulario {
    background: white;
    padding: 22px;
    border-radius: 10px;
    margin-bottom: 25px;
}

.formulario h2 {
    margin-bottom: 15px;
}

.campos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

input {
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    width: 100%;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
    background: #2563eb;
    margin-top: 12px;
}

button:hover {
    opacity: 0.85;
}

.tabela {
    background: white;
    padding: 20px;
    border-radius: 10px;
    overflow-x: auto;
}

.tabela h2 {
    margin-bottom: 15px;
}

#pesquisa {
    margin-bottom: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #e2e8f0;
}

th {
    background: #f8fafc;
}

.excluir {
    background: #dc2626;
}

.editar {
    background: #16a34a;
}

.baixo {
    color: #dc2626;
    font-weight: bold;
}

.normal {
    color: #16a34a;
    font-weight: bold;
}

</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <h1>📦 Sistema de Controle de Estoque</h1>
    <p>Gerenciamento de produtos</p>
</header>

<div class="container">

    <div class="resumo">
        <div class="card">
            <h3>Total de produtos</h3>
            <p id="totalProdutos">0</p>
        </div>

        <div class="card">
            <h3>Unidades em estoque</h3>
            <p id="totalUnidades">0</p>
        </div>

        <div class="card">
            <h3>Valor do estoque</h3>
            <p id="valorEstoque">R$ 0,00</p>
        </div>

        <div class="card">
            <h3>Estoque baixo</h3>
            <p id="estoqueBaixo">0</p>
        </div>
    </div>

    <div class="formulario">
        <h2 id="tituloFormulario">Cadastrar produto</h2>

        <div class="campos">
            <input type="text" id="nome" placeholder="Nome do produto">
            <input type="text" id="codigo" placeholder="Código do produto">
            <input type="number" id="quantidade" placeholder="Quantidade" min="0">
            <input type="number" id="preco" placeholder="Preço unitário" min="0" step="0.01">
        </div>

        <button onclick="salvarProduto()">Salvar produto</button>
        <button onclick="cancelarEdicao()" id="cancelar" style="display:none;background:#64748b">
            Cancelar edição
        </button>
    </div>

    <div class="tabela">
        <h2>Lista de produtos</h2>

        <input type="text" id="pesquisa"
        placeholder="Pesquisar produto..."
        oninput="mostrarProdutos()">

        <table>
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Código</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaProdutos"></tbody>
        </table>
    </div>

</div>

<script>

let produtos = JSON.parse(localStorage.getItem("estoque")) || [];
let editando = null;

function salvarDados() {
    localStorage.setItem("estoque", JSON.stringify(produtos));
}

function salvarProduto() {

    let nome = document.getElementById("nome").value.trim();
    let codigo = document.getElementById("codigo").value.trim();
    let quantidade = Number(document.getElementById("quantidade").value);
    let preco = Number(document.getElementById("preco").value);

    if (!nome || !codigo ||
        document.getElementById("quantidade").value === "" ||
        document.getElementById("preco").value === "" ||
        quantidade < 0 || preco < 0 ||
        !Number.isFinite(quantidade) ||
        !Number.isFinite(preco)) {
        alert("Preencha todos os campos corretamente!");
        return;
    }

    let codigoDuplicado = produtos.some((p, i) =>
        p.codigo.toLowerCase() === codigo.toLowerCase() &&
        i !== editando
    );

    if (codigoDuplicado) {
        alert("Este código já está cadastrado!");
        return;
    }

    let produto = { nome, codigo, quantidade, preco };

    if (editando !== null) {
        produtos[editando] = produto;
        editando = null;
    } else {
        produtos.push(produto);
    }

    salvarDados();
    limparFormulario();
    mostrarProdutos();
}

function mostrarProdutos() {

    let lista = document.getElementById("listaProdutos");
    let busca = document.getElementById("pesquisa").value.toLowerCase();

    lista.innerHTML = "";

    let filtrados = produtos.map((p, i) => ({...p, indice:i}))
        .filter(p =>
            p.nome.toLowerCase().includes(busca) ||
            p.codigo.toLowerCase().includes(busca)
        );

    filtrados.forEach(p => {

        let total = p.quantidade * p.preco;
        let status = p.quantidade <= 5
            ? '<span class="baixo">Estoque baixo</span>'
            : '<span class="normal">Normal</span>';

        lista.innerHTML += `
            <tr>
                <td>${escapar(p.nome)}</td>
                <td>${escapar(p.codigo)}</td>
                <td>${p.quantidade}</td>
                <td>${formatar(p.preco)}</td>
                <td>${formatar(total)}</td>
                <td>${status}</td>
                <td>
                    <button class="editar"
                    onclick="editarProduto(${p.indice})">Editar</button>

                    <button class="excluir"
                    onclick="excluirProduto(${p.indice})">Excluir</button>
                </td>
            </tr>
        `;
    });

    atualizarResumo();
}

function escapar(texto) {
    return String(texto).replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;",
        '"':"&quot;", "'":"&#39;"
    })[c]);
}

function formatar(valor) {
    return valor.toLocaleString("pt-BR", {
        style:"currency",
        currency:"BRL"
    });
}

function atualizarResumo() {

    let unidades = produtos.reduce((s,p) => s + p.quantidade, 0);
    let valor = produtos.reduce((s,p) => s + p.quantidade*p.preco, 0);
    let baixos = produtos.filter(p => p.quantidade <= 5).length;

    document.getElementById("totalProdutos").innerText = produtos.length;
    document.getElementById("totalUnidades").innerText = unidades;
    document.getElementById("valorEstoque").innerText = formatar(valor);
    document.getElementById("estoqueBaixo").innerText = baixos;
}

function editarProduto(i) {

    let p = produtos[i];

    document.getElementById("nome").value = p.nome;
    document.getElementById("codigo").value = p.codigo;
    document.getElementById("quantidade").value = p.quantidade;
    document.getElementById("preco").value = p.preco;

    editando = i;

    document.getElementById("tituloFormulario").innerText = "Editar produto";
    document.getElementById("cancelar").style.display = "inline-block";

    window.scrollTo({top:0, behavior:"smooth"});
}

function excluirProduto(i) {

    if (confirm("Deseja realmente excluir este produto?")) {
        produtos.splice(i, 1);
        salvarDados();
        mostrarProdutos();
    }
}

function limparFormulario() {
    document.getElementById("nome").value = "";
    document.getElementById("codigo").value = "";
    document.getElementById("quantidade").value = "";
    document.getElementById("preco").value = "";

    document.getElementById("tituloFormulario").innerText = "Cadastrar produto";
    document.getElementById("cancelar").style.display = "none";
}

function cancelarEdicao() {
    editando = null;
    limparFormulario();
}

mostrarProdutos();

</script>

<script src="script.js"></script></body>
</html>
