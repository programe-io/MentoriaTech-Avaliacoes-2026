<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed - Homem de Ferro</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho Principal -->
    <header class="navbar">
        <div class="logo">MiniFeed</div>
        <nav class="menu">
            <a href="#">Início</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main class="feed-container">
        
        <!-- Área de Criar Post (Jonathan) -->
        <section class="create-post">
            <div class="avatar avatar-j">J</div>
            <div class="input-area">
                <span class="username">Jonathan</span>
                <input type="text" placeholder="O que você está pensando?">
            </div>
            <button class="btn-publish">Publicar</button>
        </section>

        <!-- Post do Feed (Tony Stark / Homem de Ferro) -->
        <article class="post">
            <div class="post-header">
                <div class="avatar avatar-m">T</div>
                <div>
                    <strong>Tony Stark</strong>
                    <span>Há 10 minutos</span>
                </div>
            </div>

            <div class="post-text">
                Testando a nova armadura Mark LXXXV. Eu sou o Homem de Ferro! 🚀🔥
            </div>

            <img class="post-image" src="https://m.media-amazon.com/images/I/617e3lDd80L.jpg" alt="Homem de Ferro">

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>
        </article>

    </main>

</body>
</html>
