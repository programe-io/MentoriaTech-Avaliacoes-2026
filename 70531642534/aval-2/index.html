
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <section class="formulario">
            <h2>Cadastrar Nova Tarefa</h2>

            <input type="text" id="codigo" placeholder="Código da tarefa">
            <input type="text" id="titulo" placeholder="Título da tarefa (mínimo 5 caracteres)">

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade">
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button onclick="cadastrarTarefa()">Cadastrar Tarefa</button>
        </section>

        <section class="formulario">
            <h2>Gerenciar Tarefas</h2>

            <input type="text" id="codigoAlterar" placeholder="Código da tarefa">

            <button onclick="concluirTarefa()">Marcar como Concluída</button>

            <label for="novaPrioridade">Nova prioridade:</label>
            <select id="novaPrioridade">
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button onclick="alterarPrioridade()">Alterar Prioridade</button>
        </section>

        <section class="lista">
            <h2>Tarefas Cadastradas</h2>

            <button onclick="listarTarefas()">Atualizar Lista</button>

            <div id="resultado"></div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
