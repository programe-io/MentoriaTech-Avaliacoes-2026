
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Tabela de IMC</h1>
        <p class="subtitulo">Cadastro e cálculo do Índice de Massa Corporal</p>

        <form id="formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite o nome" required>

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" placeholder="Ex.: 70" min="0.1" step="any" required>

            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" placeholder="Ex.: 1.75" min="0.1" step="any" required>

            <button type="submit">Calcular IMC</button>
        </form>

        <h2>Pessoas cadastradas</h2>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Peso (kg)</th>
                        <th>Altura (m)</th>
                        <th>IMC</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabelaPessoas">
                    <tr>
                        <td colspan="5">Nenhuma pessoa cadastrada.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
