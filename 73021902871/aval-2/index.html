<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anna Vitória — Site de Risa</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header class="topbar">
        <div class="logo">
            <span class="logo-mark">AV</span>
            <div>
                <strong>Anna Vitória</strong>
                <small>o site de risa 😂</small>
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            rindo online
        </div>
    </header>


    <main class="container">

        <!-- Caixa de postagem -->
        <section class="composer">

            <div class="composer-top">
                <div class="avatar">U</div>

                <div>
                    <h2>O que te fez rir hoje?</h2>
                    <p>Conte uma piada, um meme ou uma história engraçada.</p>
                </div>
            </div>

            <input
                id="name"
                type="text"
                placeholder="Seu nome (ou apelido engraçado)"
                maxlength="30"
            >

            <textarea
                id="comment"
                placeholder="Manda a piada aqui... hahaha"
                maxlength="500"
            ></textarea>

            <div class="composer-bottom">

                <label class="file-button">
                    <input type="file" id="imageUpload" accept="image/*">
                    <span>📸 meme</span>
                </label>

                <button onclick="postComment()" class="post-button">
                    Rir alto!
                    <span>😆</span>
                </button>

            </div>

            <div id="fileName" class="file-name"></div>

        </section>


        <!-- Feed -->
        <section class="feed">

            <div class="feed-header">
                <div>
                    <span class="section-label">MURAL DA RISADA</span>
                    <h1>Risadas do dia</h1>
                </div>

                <span id="postCount" class="post-count">0 risadas</span>
            </div>

            <div id="posts"></div>

        </section>

    </main>


    <footer>
        <span>Anna Vitória</span>
        <span>•</span>
        <span>rir é o melhor remédio 😹 · dados salvos neste navegador</span>
    </footer>


<script src="script.js"></script></body>
</html>
