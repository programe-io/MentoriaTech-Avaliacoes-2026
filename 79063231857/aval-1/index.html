<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Perfil Moderno</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
    background: #eef1f5;
}

.perfil {
    max-width: 700px;
    margin: 60px auto;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
}

.perfil img {
    width: 150px;
    height: 150px;
    border-radius: 50%;
}

.perfil h1 {
    margin-bottom: 5px;
}

.descricao {
    color: #666;
}

.habilidades {
    margin-top: 30px;
}

.habilidade {
    display: inline-block;
    background: #6c63ff;
    color: white;

    padding: 10px 15px;

    margin: 5px;

    border-radius: 20px;
}

.botao {
    display: inline-block;

    margin-top: 30px;

    padding: 12px 25px;

    background: #222;

    color: white;

    text-decoration: none;

    border-radius: 8px;
}

</style>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<div class="perfil">

    <img
    src="https://placehold.co/150x150"
    alt="Foto de perfil">

    <h1>Maria Eduarda</h1>

    <p class="descricao">
        Estudante de Desenvolvimento de Sistemas
    </p>

    <p>
        Gosto de tecnologia e estou desenvolvendo
        meus primeiros projetos para a internet.
    </p>

    <div class="habilidades">

        <h2>Habilidades</h2>

        <span class="habilidade">HTML</span>

        <span class="habilidade">CSS</span>

        <span class="habilidade">JavaScript</span>

        <span class="habilidade">Python</span>

    </div>

    <a
    class="botao"
    href="https://github.com/"
    target="_blank">

        Ver projetos

    </a>

</div>

</body>

</html>
