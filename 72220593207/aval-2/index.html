<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <header class="cabecalho">
            <span class="subtitulo">ORGANIZE SUA ROTINA</span>
            <h1>Minhas tarefas</h1>
            <p>Planeje seu dia e acompanhe seu progresso.</p>
        </header>

        <section class="resumo">
            <article class="card-resumo">
                <span>Total de tarefas</span>
                <strong id="totalTarefas">0</strong>
            </article>

            <article class="card-resumo">
                <span>Pendentes</span>
                <strong id="tarefasPendentes">0</strong>
            </article>

            <article class="card-resumo">
                <span>Concluídas</span>
                <strong id="tarefasConcluidas">0</strong>
            </article>
        </section>

        <section class="painel">
            <h2 id="tituloFormulario">Adicionar tarefa</h2>

            <form id="formTarefa">
                <input type="hidden" id="codigoTarefa">

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex.: Estudar JavaScript"
                        minlength="5"
                        required
                    >
                </div>

                <div class="linha-campos">
                    <div class="campo">
                        <label for="prioridade">Prioridade</label>
                        <select id="prioridade">
                            <option value="baixa">Baixa</option>
                            <option value="media" selected>Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="dataLimite">Data limite</label>
                        <input type="date" id="dataLimite">
                    </div>
                </div>

                <div class="botoes-formulario">
                    <button type="submit" id="botaoSalvar">
                        Adicionar tarefa
                    </button>
                    <button
                        type="button"
                        id="botaoCancelar"
                        class="botao-secundario"
                        hidden
                    >
                        Cancelar edição
                    </button>
                </div>
            </form>
        </section>

        <section class="lista-section">
            <div class="titulo-lista">
                <h2>Minha lista</h2>

                <select id="filtro">
                    <option value="todas">Todas</option>
                    <option value="pendentes">Pendentes</option>
                    <option value="concluidas">Concluídas</option>
                </select>
            </div>

            <div id="listaTarefas" class="lista-tarefas">
                <p class="vazio">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>
    </main>
<script src="script.js"></script></body>
</html>
