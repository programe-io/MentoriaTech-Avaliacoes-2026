<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Entrega - Avaliações</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Área de Entrega - Avaliações</h1>
            <p>Envie seus códigos para correção. Revise antes de publicar e garanta que sua avaliação esteja completa.</p>
        </header>

        <main>
            <form id="form-entrega">
                <div class="editor-box">
                    <div class="editor-header">
                        <span>HTML</span>
                        <button type="button" class="btn-maximizar" onclick="maximizar('html-code')">Maximizar</button>
                    </div>
                    <textarea id="html-code" placeholder="Cole seu código HTML aqui..." required></textarea>
                </div>

                <div class="editor-box">
                    <div class="editor-header">
                        <span>CSS</span>
                        <button type="button" class="btn-maximizar" onclick="maximizar('css-code')">Maximizar</button>
                    </div>
                    <textarea id="css-code" placeholder="Cole seu código CSS aqui..." required></textarea>
                </div>

                <div class="editor-box">
                    <div class="editor-header">
                        <span>JavaScript</span>
                        <button type="button" class="btn-maximizar" onclick="maximizar('js-code')">Maximizar</button>
                    </div>
                    <textarea id="js-code" placeholder="Cole seu código JavaScript aqui..." required></textarea>
                </div>

                <div class="actions">
                    <button type="submit" id="btn-enviar">Finalizar e Publicar Trabalho</button>
                </div>
            </form>
        </main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
