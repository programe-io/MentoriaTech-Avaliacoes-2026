<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de IMC</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Prática - Tabela de Pessoas</h1>

        <p>
            Cadastre pessoas informando nome, peso e altura.
            O sistema calculará automaticamente o IMC e a situação.
        </p>

        <!-- FORMULÁRIO -->

        <div class="formulario">

            <input
                type="text"
                id="nome"
                placeholder="Nome"
            >

            <input
                type="number"
                id="peso"
                placeholder="Peso (kg)"
                step="0.1"
            >

            <input
                type="number"
                id="altura"
                placeholder="Altura (m)"
                step="0.01"
            >

            <button onclick="adicionarPessoa()">
                Adicionar
            </button>

        </div>

        <p id="mensagem"></p>


        <!-- TABELA -->

        <table>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Peso</th>
                    <th>Altura</th>
                    <th>IMC</th>
                    <th>Situação</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody id="tabelaPessoas">
                <!-- Pessoas serão adicionadas aqui -->
            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
