
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaFácil - Rede Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>InstaFácil 📸</h1>
        <input type="text" placeholder="Pesquisar">
        <nav>
            <a href="#">Início</a>
            <a href="#">Explorar</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main>
        <section class="stories">
            <h2>Stories</h2>
            <div class="story">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Perfil">
                <p>Ana</p>
            </div>
            <div class="story">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100" alt="Perfil">
                <p>Lucas</p>
            </div>
        </section>

        <section class="feed">
            <article class="post">
                <h3>👤 Ana Julia</h3>
                <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=700" alt="Foto de flores">
                <button onclick="curtir(this)">♡ Curtir</button>
                <p>Uma foto especial para compartilhar! 🌸</p>
                <p class="likes">0 curtidas</p>
            </article>

            <article class="post">
                <h3>👤 Lucas</h3>
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700" alt="Paisagem">
                <button onclick="curtir(this)">♡ Curtir</button>
                <p>Aproveitando um dia maravilhoso! ☀️</p>
                <p class="likes">0 curtidas</p>
            </article>
        </section>

        <section class="criar">
            <h2>Criar publicação</h2>
            <input type="text" id="legenda" placeholder="Escreva uma legenda">
            <button onclick="publicar()">Publicar</button>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
