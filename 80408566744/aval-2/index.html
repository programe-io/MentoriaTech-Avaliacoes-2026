<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <!-- NOVA PUBLICAÇÃO -->
        <section class="new-post">
            <div class="user">
                <div class="avatar">N</div>

                <div>
                    <strong>Nanda</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>

            <button>Publicar</button>
        </section>

        <!-- PRIMEIRA POSTAGEM -->
        <article class="post">

            <div class="post-header">
                <div class="avatar">M</div>

                <div>
                    <strong>Maria</strong>
                    <span>Há 10 minutos</span>
                </div>
            </div>

            <div class="post-text">
                Hoje foi um dia incrível!
                Estou muito feliz com minhas conquistas.
            </div>

            <img
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800"
                alt="Paisagem bonita">

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>

        <!-- SEGUNDA POSTAGEM -->
        <article class="post">

            <div class="post-header">
                <div class="avatar">J</div>

                <div>
                    <strong>João</strong>
                    <span>Há 30 minutos</span>
                </div>
            </div>

            <div class="post-text">
                Aprendendo HTML e CSS!
                Cada dia descubro algo novo.
            </div>

            <img
                src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800"
                alt="Computador utilizado para programação">

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>

    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>© 2026 Mini Feed - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
