<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Gerenciador de Tarefas</h1>
    <p>Organize suas atividades</p>
</header>

<main>
    <section>
        <h2>Nova tarefa</h2>

        <form id="formTarefa">
            <input type="text" id="titulo"
                placeholder="Título da tarefa" required>

            <select id="prioridade">
                <option value="1">Alta prioridade</option>
                <option value="2">Média prioridade</option>
                <option value="3">Baixa prioridade</option>
            </select>

            <p id="erro" class="erro" hidden></p>

            <button type="submit">Cadastrar tarefa</button>
        </form>
    </section>

    <section>
        <h2>Minhas tarefas</h2>
        <div id="listaTarefas"></div>
    </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
