
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header>
            <h1>📦 Controle de Estoque</h1>
            <p>Gerencie seus produtos e movimentações</p>
        </header>

        <section class="resumo">

            <div class="card">
                <h3>Total de produtos</h3>
                <strong id="total-produtos">0</strong>
            </div>

            <div class="card">
                <h3>Itens em estoque</h3>
                <strong id="total-itens">0</strong>
            </div>

            <div class="card alerta">
                <h3>Estoque baixo</h3>
                <strong id="estoque-baixo">0</strong>
            </div>

        </section>

        <section class="formulario">

            <h2>Cadastrar produto</h2>

            <form id="form-produto">

                <input type="hidden" id="produto-id">

                <div class="campo">
                    <label for="nome">Nome do produto</label>
                    <input type="text" id="nome"
                        placeholder="Ex: Teclado" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria"
                        placeholder="Ex: Informática" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade"
                        min="0" step="1" required>
                </div>

                <div class="campo">
                    <label for="preco">Preço unitário (R\$)</label>
                    <input type="number" id="preco"
                        min="0" step="0.01" required>
                </div>

                <button type="submit" id="btn-salvar">
                    Cadastrar produto
                </button>

                <button type="button" id="btn-cancelar" hidden>
                    Cancelar edição
                </button>

            </form>

        </section>

        <section class="movimentacao">

            <h2>Movimentação de estoque</h2>

            <form id="form-movimentacao">

                <select id="produto-movimento" required>
                    <option value="">Selecione um produto</option>
                </select>

                <select id="tipo-movimento" required>
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>

                <input type="number" id="qtd-movimento"
                    min="1" step="1"
                    placeholder="Quantidade" required>

                <button type="submit">Registrar movimentação</button>

            </form>

        </section>

        <section class="tabela">

            <h2>Produtos cadastrados</h2>

            <input type="search" id="busca"
                placeholder="Buscar produto...">

            <div class="tabela-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Valor total</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="lista-produtos"></tbody>
                </table>
            </div>

        </section>

        <section class="historico">
            <h2>Últimas movimentações</h2>
            <ul id="lista-historico"></ul>
        </section>

    </main>

<script src="script.js"></script></body>
</html>$0
