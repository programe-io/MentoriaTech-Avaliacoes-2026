
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header>
            <h1>Minha Lista de Tarefas</h1>
            <p>Organize suas atividades diárias!</p>
        </header>

        <section class="resumo">
            <div class="card">
                <h3>Total</h3>
                <strong id="total">0</strong>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <strong id="pendentes">0</strong>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <strong id="concluidas">0</strong>
            </div>
        </section>

        <form id="form-tarefa">
            <input
                type="text"
                id="titulo"
                placeholder="Digite uma nova tarefa..."
                required
            >
            <button type="submit">Adicionar</button>
        </form>

        <section class="filtros">
            <button class="ativo" data-filtro="todas">Todas</button>
            <button data-filtro="pendentes">Pendentes</button>
            <button data-filtro="concluidas">Concluídas</button>
        </section>

        <ul id="lista-tarefas"></ul>

        <footer>
            <button id="limpar-concluidas">
                Limpar concluídas
            </button>
        </footer>

    </main>

<script src="script.js"></script></body>
</html>$0
