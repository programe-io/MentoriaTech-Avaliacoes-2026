<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <h1>Gerenciador de Tarefas</h1>

    <!-- Form para Cadastrar Tarefa -->
    <section class="card">
      <h2>Nova Tarefa</h2>
      <form id="form-cadastro">
        <div class="form-group">
          <label for="titulo">Título da Tarefa (mín. 5 carateres):</label>
          <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript" required>
        </div>
        <div class="form-group">
          <label for="prioridade">Prioridade (1 - Alta, 2 - Média, 3 - Baixa):</label>
          <input type="number" id="prioridade" min="1" max="3" placeholder="Ex: 1" required>
        </div>
        <button type="submit" class="btn btn-primary">Cadastrar Tarefa</button>
      </form>
    </section>

    <!-- Form para Operações nas Tarefas -->
    <section class="card grid-2">
      <div>
        <h3>Concluir Tarefa</h3>
        <form id="form-concluir">
          <input type="number" id="codigo-concluir" placeholder="Código da Tarefa" required>
          <button type="submit" class="btn">Marcar como Concluída</button>
        </form>
      </div>
      <div>
        <h3>Alterar Prioridade</h3>
        <form id="form-prioridade">
          <input type="number" id="codigo-prioridade" placeholder="Código da Tarefa" required>
          <input type="number" id="nova-prioridade" min="1" max="3" placeholder="Nova Prioridade (1-3)" required>
          <button type="submit" class="btn">Atualizar Prioridade</button>
        </form>
      </div>
    </section>

    <!-- Feedback ao Usuário -->
    <div id="mensagem" class="mensagem hidden"></div>

    <!-- Listagem de Tarefas -->
    <section class="card">
      <h2>Lista de Tarefas</h2>
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Título</th>
            <th>Prioridade</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tabela-tarefas">
          <!-- Inserido dinamicamente pelo JavaScript -->
        </tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
