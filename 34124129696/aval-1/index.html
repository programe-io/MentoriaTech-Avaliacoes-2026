<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão de Stock</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <h1>Gestão de Stock</h1>

    <!-- Secção de Formulário de Cadastro -->
    <section class="card">
      <h2>Cadastrar Novo Produto</h2>
      <form id="form-cadastro">
        <div class="form-group">
          <label for="descricao">Descrição (mín. 5 carateres):</label>
          <input type="text" id="descricao" placeholder="Ex: Cadeira gamer" required>
        </div>
        <div class="form-group">
          <label for="quantidade">Quantidade (mín. 1):</label>
          <input type="number" id="quantidade" min="1" placeholder="Ex: 12" required>
        </div>
        <div class="form-group">
          <label for="valor">Valor (€):</label>
          <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 699.00" required>
        </div>
        <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
      </form>
    </section>

    <!-- Secção de Alteração -->
    <section class="card grid-2">
      <div>
        <h3>Atualizar Valor</h3>
        <form id="form-atualizar-valor">
          <input type="number" id="val-codigo" placeholder="Cód. do Produto" required>
          <input type="number" id="val-novo" step="0.01" min="0" placeholder="Novo Valor (€)" required>
          <button type="submit" class="btn">Atualizar Valor</button>
        </form>
      </div>
      <div>
        <h3>Adicionar Quantidade</h3>
        <form id="form-atualizar-qtd">
          <input type="number" id="qtd-codigo" placeholder="Cód. do Produto" required>
          <input type="number" id="qtd-nova" min="1" placeholder="Qtd. a Somar" required>
          <button type="submit" class="btn">Adicionar Qtd.</button>
        </form>
      </div>
    </section>

    <!-- Mensagem de Feedback -->
    <div id="mensagem" class="mensagem hidden"></div>

    <!-- Tabela de Produtos -->
    <section class="card">
      <h2>Produtos em Stock</h2>
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Qtd. em Stock</th>
            <th>Valor (€)</th>
          </tr>
        </thead>
        <tbody id="tabela-produtos">
          <!-- Linhas inseridas via JS -->
        </tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
