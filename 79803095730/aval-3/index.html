
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fafafa;
    font-family: Arial, sans-serif;
    color: #262626;
}

header {
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    position: sticky;
    top: 0;
}

.logo {
    font-family: cursive;
    font-size: 28px;
    font-weight: bold;
}

header input {
    padding: 9px;
    border: 1px solid #ddd;
    border-radius: 7px;
    background: #fafafa;
}

header a {
    color: #262626;
    text-decoration: none;
    font-size: 22px;
    margin: 5px;
}

.container {
    max-width: 600px;
    margin: 25px auto;
    padding: 10px;
}

.stories {
    background: white;
    padding: 15px;
    display: flex;
    gap: 18px;
    overflow-x: auto;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.story {
    text-align: center;
    font-size: 12px;
}

.story img {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 3px solid #e1306c;
    padding: 2px;
    object-fit: cover;
}

.post {
    background: white;
    border: 1px solid #ddd;
    margin-top: 20px;
    border-radius: 8px;
    overflow: hidden;
}

.post-header {
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.post-header img {
    width: 38px;
    height: 38px;
    border-radius: 50%;
}

.post-photo {
    width: 100%;
    display: block;
}

.actions {
    padding: 12px;
    font-size: 26px;
}

.actions button {
    background: none;
    border: none;
    font-size: 26px;
    cursor: pointer;
    margin-right: 10px;
}

.actions button:hover {
    transform: scale(1.1);
}

.caption {
    padding: 0 12px 15px;
    font-size: 14px;
}

.comments {
    padding: 0 12px 12px;
}

.comments input {
    width: 80%;
    border: none;
    padding: 10px;
    outline: none;
}

.comments button {
    border: none;
    color: #0095f6;
    background: none;
    font-weight: bold;
    cursor: pointer;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <div class="logo">Instagram</div>
    <input type="text" placeholder="Pesquisar">
    <nav>
        <a href="#">🏠</a>
        <a href="#">💬</a>
        <a href="#">➕</a>
        <a href="#">❤️</a>
        <a href="#">👤</a>
    </nav>
</header>

<div class="container">

    <div class="stories">
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=1">
            <p>Seu story</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=2">
            <p>Maria</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=3">
            <p>Lucas</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=4">
            <p>Ana</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=5">
            <p>Pedro</p>
        </div>
    </div>

    <div class="post">
        <div class="post-header">
            <img src="https://i.pravatar.cc/100?img=1">
            <strong>yhasmim</strong>
        </div>

        <img class="post-photo"
        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800">

        <div class="actions">
            <button onclick="curtir(this)">🤍</button>
            <button onclick="comentar(this)">💬</button>
            <button>📤</button>
        </div>

        <div class="caption">
            <strong>yhasmim</strong>
            Aproveitando os pequenos momentos da vida! ✨❤️
            <p>🌸 Seja feliz do seu jeito!</p>
        </div>

        <div class="comments">
            <input type="text" placeholder="Adicione um comentário...">
            <button onclick="publicar(this)">Publicar</button>
        </div>
    </div>

    <div class="post">
        <div class="post-header">
            <img src="https://i.pravatar.cc/100?img=2">
            <strong>maria_fotos</strong>
        </div>

        <img class="post-photo"
        src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=800">

        <div class="actions">
            <button onclick="curtir(this)">🤍</button>
            <button>💬</button>
            <button>📤</button>
        </div>

        <div class="caption">
            <strong>maria_fotos</strong>
            Flores deixam tudo mais bonito! 🌷
        </div>
    </div>

</div>

<script>
function curtir(botao) {
    if (botao.innerHTML === "🤍") {
        botao.innerHTML = "❤️";
    } else {
        botao.innerHTML = "🤍";
    }
}

function comentar(botao) {
    botao.closest(".post").querySelector("input").focus();
}

function publicar(botao) {
    let input = botao.parentElement.querySelector("input");
    let texto = input.value.trim();

    if (texto !== "") {
        let comentario = document.createElement("p");
        comentario.innerHTML = "<strong>Você:</strong> " +
            document.createTextNode(texto).textContent;

        botao.closest(".post").querySelector(".caption").appendChild(comentario);
        input.value = "";
    }
}
</script>

</body>
</html>
