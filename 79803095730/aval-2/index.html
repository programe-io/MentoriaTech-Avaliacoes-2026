
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mini Feed</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0e6ff;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            color: #7b2cbf;
        }

        .feed {
            max-width: 450px;
            margin: auto;
        }

        .post {
            background-color: white;
            padding: 15px;
            margin: 20px 0;
            border-radius: 15px;
            box-shadow: 0 3px 10px #00000015;
        }

        .usuario {
            font-weight: bold;
            color: #7b2cbf;
        }

        .foto {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }

        button {
            background-color: #9d4edd;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #7b2cbf;
        }

        input {
            padding: 10px;
            width: 65%;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .comentarios {
            color: #555;
            font-size: 14px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>💜 Meu Mini Feed</h1>
        <p>Compartilhe seus momentos!</p>
    </header>

    <main class="feed">

        <div class="post">
            <p class="usuario">@yhasmim.sousaa</p>

            <p>Um dia bonito para guardar na memória! ✨</p>

            <img class="foto"
            src="IMG_0623.jpeg"
            alt="Paisagem bonita">

            <p id="curtidas1">❤️ 0 curtidas</p>

            <button onclick="curtir('curtidas1')">
                ❤️ Curtir
            </button>

            <hr>

            <input id="comentario1"
            type="text" placeholder="Escreva um comentário...">

            <button onclick="comentar('comentario1', 'lista1')">
                Enviar
            </button>

            <div id="lista1" class="comentarios"></div>
        </div>

        <div class="post">
            <p class="usuario">@amigo</p>

            <p>Aproveitando os pequenos momentos! 🌸</p>

            <img class="foto"
            src="IMG_2334.jpeg"
            alt="Natureza">

            <p id="curtidas2">❤️ 0 curtidas</p>

            <button onclick="curtir('curtidas2')">
                ❤️ Curtir
            </button>
        </div>

    </main>

    <script>
        function curtir(id) {
            let texto = document.getElementById(id);
            let numero = Number(texto.dataset.total || 0);

            numero++;

            texto.dataset.total = numero;
            texto.innerText = "❤️ " + numero + " curtidas";
        }

        function comentar(campo, lista) {
            let entrada = document.getElementById(campo);
            let texto = entrada.value.trim();

            if (texto !== "") {
                let novo = document.createElement("p");
                novo.innerText = "💬 " + texto;

                document.getElementById(lista).appendChild(novo);

                entrada.value = "";
            }
        }
    </script>

</body>
</html>
