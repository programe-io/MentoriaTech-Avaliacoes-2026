<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="navbar">
  <div class="nav-content">
    <h1 class="logo">Instagram</h1>
    <input type="text" class="search-bar" placeholder="Pesquisar...">
    <div class="nav-icons">
      <span>🏠</span>
      <span>💬</span>
      <span>➕</span>
      <span>❤️</span>
      <img src="https://unsplash.com" alt="Perfil" class="nav-avatar">
    </div>
  </div>
</header>

<main class="container">
  <!-- Barra de Stories -->
  <section class="stories">
    <div class="story">
      <div class="story-ring"><img src="https://unsplash.com" alt="Você"></div>
      <span>Seu story</span>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://unsplash.com" alt="lucas_dev"></div>
      <span>lucas_dev</span>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://unsplash.com" alt="ana.design"></div>
      <span>ana.design</span>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://unsplash.com" alt="pedro_trips"></div>
      <span>pedro_trips</span>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://unsplash.com" alt="mari_fotos"></div>
      <span>mari_fotos</span>
    </div>
  </section>

  <!-- Feed de Postagens -->
  <section class="feed">
    <!-- Post 1 -->
    <article class="post">
      <div class="post-header">
        <img src="https://unsplash.com" alt="Avatar">
        <strong>lucas_dev</strong>
      </div>
      <div class="post-image-container">
        <img src="https://unsplash.com" alt="Setup de programação" class="post-img">
      </div>
      <div class="post-actions">
        <button class="like-btn" aria-label="Curtir">🤍</button>
        <button class="comment-focus-btn" aria-label="Comentar">💬</button>
        <button aria-label="Compartilhar">✈️</button>
      </div>
      <div class="post-info">
        <p class="likes-count"><span class="count">142</span> curtidas</p>
        <p class="caption"><strong>lucas_dev</strong> Finalizando o novo projeto web hoje! 💻🚀</p>
        <div class="comments-list"></div>
      </div>
      <form class="comment-form">
        <input type="text" placeholder="Adicione um comentário..." required>
        <button type="submit">Publicar</button>
      </form>
    </article>

    <!-- Post 2 -->
    <article class="post">
      <div class="post-header">
        <img src="https://unsplash.com" alt="Avatar">
        <strong>pedro_trips</strong>
      </div>
      <div class="post-image-container">
        <img src="https://unsplash.com" alt="Praia" class="post-img">
      </div>
      <div class="post-actions">
        <button class="like-btn" aria-label="Curtir">🤍</button>
        <button class="comment-focus-btn" aria-label="Comentar">💬</button>
        <button aria-label="Compartilhar">✈️</button>
      </div>
      <div class="post-info">
        <p class="likes-count"><span class="count">389</span> curtidas</p>
        <p class="caption"><strong>pedro_trips</strong> Fim de tarde perfeito na praia ☀️🌊</p>
        <div class="comments-list"></div>
      </div>
      <form class="comment-form">
        <input type="text" placeholder="Adicione um comentário..." required>
        <button type="submit">Publicar</button>
      </form>
    </article>
  </section>
</main>
  <script src="script.js"></script>
  
</body>
</html>
