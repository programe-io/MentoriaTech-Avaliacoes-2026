<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="app-container">
  <header class="navbar">
    <h1>Meu Feed Social</h1>
  </header>

  <main class="feed-wrapper">
    <!-- Caixa para criar nova postagem -->
    <section class="create-post">
      <textarea id="postInput" placeholder="No que você está pensando hoje?" rows="3"></textarea>
      <div class="post-actions-bar">
        <button id="publishBtn">Publicar</button>
      </div>
    </section>

    <!-- Área onde as postagens vão aparecer -->
    <section id="feedContainer" class="feed-list">
      <!-- Postagem inicial de exemplo -->
      <article class="post-card">
        <div class="post-header">
          <div class="avatar">U</div>
          <div class="user-info">
            <strong>Usuário Exemplo</strong>
            <span>Agora mesmo</span>
          </div>
        </div>
        <p class="post-content">Olá, pessoal! Este é o meu novo feed social feito com HTML, CSS e JavaScript. 🚀</p>
        <div class="post-footer">
          <button class="like-btn" onclick="toggleLike(this)">❤️ Curtir (<span>1</span>)</button>
        </div>
      </article>
    </section>
  </main>
</div>


  <script src="script.js"></script>
  
</body>
</html>
