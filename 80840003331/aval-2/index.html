<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="header-content">
            <h1>MiniFeed</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>

        <section class="new-post">
            <div class="user">
                <div class="avatar">
                    H
                </div>
                <div>
                    <strong>Helena</strong>
                    <span>gatos</span>
                </div>
            </div>
            <button>Publicar</button>
        </section>

        <article class="post">
            <div class="post-header">
                <div class="avatar">
                    S
                </div>
                <div>
                    <strong>francivane</strong>
                    <span>Há 10 minutos</span>
                </div>
            </div>

            <div class="post-text">
                fiz carinho em varios gatinhos na rua hoje!
            </div>
            
            
            

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>
        </article>

    </main>

    <footer>
        <p>MiniFeed - Todos os Direitos Reservados helena - 2026</p>
    </footer>

</body>
</html>
