
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaMini</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topbar">
    <div class="top-inner">
        <h1 class="logo">InstaMini</h1>

        <input class="search" id="search"
        placeholder="Pesquisar">

        <nav class="nav">
            <button onclick="window.scrollTo(0,0)">⌂</button>
            <button onclick="alert('Mensagens')">✉</button>
            <button onclick="document.getElementById('postText').focus()">＋</button>
            <button onclick="alert('Curtidas')">♡</button>
            <button onclick="alert('Meu perfil')">◉</button>
        </nav>
    </div>
</header>

<main class="layout">

<section>

    <div class="stories">
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=12">
            <span>Seu story</span>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=32">
            <span>mariana</span>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=5">
            <span>pedro.s</span>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=47">
            <span>annaluiza</span>
        </div>
    </div>

    <form class="create" id="createForm">
        <input id="postText"
        placeholder="O que você quer compartilhar?"
        required>
        <button type="submit">Publicar</button>
    </form>

    <div id="feed">

        <article class="post">
            <div class="post-head">
                <img class="avatar"
                src="https://i.pravatar.cc/100?img=32">
                <b>mariana</b>
            </div>

            <img class="post-image"
            src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?w=900">

            <div class="post-actions">
                <button class="like">♡</button>
                <button onclick="alert('Comentar')">♧</button>
                <button onclick="alert('Compartilhar')">➤</button>
            </div>

            <div class="post-content">
                <b><span class="like-count">1284</span> curtidas</b>
                <p><b>mariana</b> Um dia maravilhoso! ☀️🌊</p>
            </div>
        </article>

        <article class="post">
            <div class="post-head">
                <img class="avatar"
                src="https://i.pravatar.cc/100?img=5">
                <b>pedro.s</b>
            </div>

            <img class="post-image"
            src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=900">

            <div class="post-actions">
                <button class="like">♡</button>
                <button>♧</button>
                <button>➤</button>
            </div>

            <div class="post-content">
                <b><span class="like-count">856</span> curtidas</b>
                <p><b>pedro.s</b> Minha pausa para um café! ☕</p>
            </div>
        </article>

    </div>
</section>

<aside class="sidebar">
    <div class="profile">
        <img src="https://i.pravatar.cc/100?img=12">
        <div>
            <b>seu_perfil</b>
            <p>Bem-vindo ao InstaMini!</p>
        </div>
    </div>

    <h4>Sugestões para você</h4>

    <div class="suggestion">
        <img src="https://i.pravatar.cc/100?img=44">
        <b>lucas.ofc</b>
        <button>Seguir</button>
    </div>

    <div class="suggestion">
        <img src="https://i.pravatar.cc/100?img=25">
        <b>bia_fotos</b>
        <button>Seguir</button>
    </div>
</aside>

</main>

<script>
document.querySelectorAll(".like").forEach(button => {
    button.addEventListener("click", () => {
        const post = button.closest(".post");
        const count = post.querySelector(".like-count");
        let number = Number(count.textContent);

        if (button.classList.contains("liked")) {
            button.classList.remove("liked");
            button.textContent = "♡";
            count.textContent = number - 1;
        } else {
            button.classList.add("liked");
            button.textContent = "♥";
            count.textContent = number + 1;
        }
    });
});

document.getElementById("createForm")
.addEventListener("submit", function(event) {
    event.preventDefault();

    const input = document.getElementById("postText");
    const text = input.value.trim();

    if (!text) return;

    const post = document.createElement("article");
    post.className = "post";

    const head = document.createElement("div");
    head.className = "post-head";

    const user = document.createElement("b");
    user.textContent = "seu_perfil";
    head.appendChild(user);

    const caption = document.createElement("div");
    caption.className = "post-content";

    const paragraph = document.createElement("p");
    paragraph.textContent = text;

    caption.appendChild(paragraph);
    post.append(head, caption);

    document.getElementById("feed").prepend(post);
    input.value = "";
});

document.getElementById("search")
.addEventListener("input", function() {
    const search = this.value.toLowerCase();

    document.querySelectorAll("#feed .post")
    .forEach(post => {
        post.style.display =
            post.textContent.toLowerCase().includes(search)
            ? "block" : "none";
    });
});
</script>

<script src="script.js"></script></body>
</html>
