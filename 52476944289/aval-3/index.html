
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Instagram</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Mini Insta 📸</h1>
        <input type="text" placeholder="Pesquisar...">
    </header>

    <main class="container">

        <section class="stories">
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=1">
                <p>Maria</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=2">
                <p>João</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=3">
                <p>Ana</p>
            </div>
        </section>

        <article class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=1">
                <strong>Maria Silva</strong>
            </div>

            <img class="post-image"
            src="https://picsum.photos/id/1011/600/500">

            <div class="post-content">
                <button onclick="curtir(this)">♡</button>
                <button onclick="comentar()">💬</button>
                <p><strong>120 curtidas</strong></p>
                <p><strong>Maria:</strong> Aproveitando o dia! ❤️</p>
            </div>
        </article>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
