
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calculadora Pro</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <header>
            <h1>🧮 Calculadora Pro</h1>
            <p>Uma calculadora simples e moderna</p>
        </header>

        <section class="calculadora">

            <div class="display">

                <div id="operacao"> </div>

                <div id="resultado">0</div>

            </div>

            <div class="botoes">

                <button class="especial" onclick="limpar()">
                    AC
                </button>

                <button class="especial" onclick="apagar()">
                    ⌫
                </button>

                <button class="especial" onclick="porcentagem()">
                    %
                </button>

                <button class="operador"
                        onclick="adicionarOperador('/')">
                    ÷
                </button>

                <button onclick="adicionarNumero('7')">7</button>
                <button onclick="adicionarNumero('8')">8</button>
                <button onclick="adicionarNumero('9')">9</button>

                <button class="operador"
                        onclick="adicionarOperador('*')">
                    ×
                </button>

                <button onclick="adicionarNumero('4')">4</button>
                <button onclick="adicionarNumero('5')">5</button>
                <button onclick="adicionarNumero('6')">6</button>

                <button class="operador"
                        onclick="adicionarOperador('-')">
                    −
                </button>

                <button onclick="adicionarNumero('1')">1</button>
                <button onclick="adicionarNumero('2')">2</button>
                <button onclick="adicionarNumero('3')">3</button>

                <button class="operador"
                        onclick="adicionarOperador('+')">
                    +
                </button>

                <button onclick="inverterSinal()">±</button>
                <button onclick="adicionarNumero('0')">0</button>
                <button onclick="adicionarNumero('.')">.</button>

                <button class="igual" onclick="calcular()">
                    =
                </button>

            </div>

        </section>

        <section class="historico">

            <div class="historico-topo">
                <h2>Histórico</h2>

                <button onclick="limparHistorico()">
                    Limpar
                </button>
            </div>

            <div id="listaHistorico">
                <p class="vazio">Nenhuma operação realizada.</p>
            </div>

        </section>

        <footer>
            <p>© 2026 Calculadora Pro</p>
        </footer>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
