
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="game-container">

        <header>
            <h1>🐍 Snake Game</h1>
            <p>Coma, cresça e não bata nas paredes!</p>
        </header>

        <div class="score-board">
            <div>
                <span>PONTUAÇÃO</span>
                <h2 id="score">0</h2>
            </div>

            <div>
                <span>RECORDE</span>
                <h2 id="record">0</h2>
            </div>
        </div>

        <div class="game-area">
            <canvas id="game" width="400" height="400"></canvas>

            <div id="game-over" class="game-message">
                <h2>Game Over!</h2>
                <p>Sua pontuação: <span id="final-score">0</span></p>
                <button onclick="startGame()">Jogar novamente</button>
            </div>

            <div id="start-screen" class="game-message">
                <h2>Pronto para jogar?</h2>
                <p>Use as setas para controlar a cobrinha.</p>
                <button onclick="startGame()">Começar jogo</button>
            </div>
        </div>

        <div class="controls">
            <button onclick="changeDirection('up')">⬆️</button>

            <div>
                <button onclick="changeDirection('left')">⬅️</button>
                <button onclick="changeDirection('down')">⬇️</button>
                <button onclick="changeDirection('right')">➡️</button>
            </div>
        </div>

        <button class="restart-button" onclick="startGame()">
            ↻ Reiniciar jogo
        </button>

        <footer>
            Desenvolvido com HTML, CSS e JavaScript
        </footer>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
