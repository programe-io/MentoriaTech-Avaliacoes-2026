
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Game - Jogo da Cobrinha</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="game-container">

        <header>
            <h1>🐍 SNAKE GAME</h1>
            <p>O clássico jogo da cobrinha!</p>
        </header>

        <section class="score-board">
            <div>
                <span>PONTUAÇÃO</span>
                <strong id="score">0</strong>
            </div>

            <div>
                <span>RECORDE</span>
                <strong id="record">0</strong>
            </div>
        </section>

        <div class="game-area">

            <canvas id="game" width="400" height="400"></canvas>

            <div class="overlay" id="overlay">

                <h2 id="message">SNAKE GAME</h2>

                <p id="description">
                    Prepare-se para jogar!
                </p>

                <button id="startButton" onclick="iniciarJogo()">
                    ▶ JOGAR
                </button>

            </div>

        </div>

        <div class="controls">

            <button onclick="mudarDirecao('UP')">⬆️</button>

            <div>
                <button onclick="mudarDirecao('LEFT')">⬅️</button>
                <button onclick="mudarDirecao('DOWN')">⬇️</button>
                <button onclick="mudarDirecao('RIGHT')">➡️</button>
            </div>

        </div>

        <button class="restart" onclick="reiniciarJogo()">
            ↻ Reiniciar jogo
        </button>

        <footer>
            <p>Use as setas do teclado ou os controles na tela.</p>
            <p>© 2026 - Snake Game</p>
        </footer>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
