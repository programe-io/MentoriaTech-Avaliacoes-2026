  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golaço FC - O Seu Blog de Futebol</title>
    <style>
        /* Configurações Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Cabeçalho */
        header {
            background-color: #0f5132; /* Verde Escuro / Campo */
            color: #fff;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .logo span {
            color: #2ec4b6; /* Detalhe em tom vivo */
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            font-weight: 600;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #2ec4b6;
        }

        /* Banner Principal (Destaque) */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80') no-repeat center center/cover;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 0 20px;
        }

        .hero-content h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #2ec4b6;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #209f93;
        }

        /* Conteúdo Principal */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 30px;
        }

        /* Grid de Notícias */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .post-card {
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }

        .post-card:hover {
            transform: translateY(-5px);
        }

        .post-img {
            width: 100%;
            height: 200px;
            background-color: #ddd;
            object-fit: cover;
        }

        .post-body {
            padding: 20px;
        }

        .category {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #0f5132;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

        .post-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #222;
        }

        .post-excerpt {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 15px;
        }

        .post-meta {
            font-size: 0.8rem;
            color: #999;
        }

        /* Barra Lateral (Sidebar) */
        aside {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .widget {
            margin-bottom: 30px;
        }

        .widget h3 {
            border-bottom: 2px solid #0f5132;
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .widget ul {
            list-style: none;
        }

        .widget ul li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }

        .widget ul li:last-child {
            border-bottom: none;
        }

        /* Rodapé */
        footer {
            background-color: #111;
            color: #ccc;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 0.9rem;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .hero-content h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>

        </div>
    </section>
