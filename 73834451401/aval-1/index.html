
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🎮 Game Zone</h1>
        <p>Bem-vindo ao mundo dos jogos!</p>
    </header>

    <main>
        <section class="card">
            <h2>🔢 Acerte o Número</h2>
            <p>Estou pensando em um número de 1 a 10.</p>

            <input
                type="number"
                id="numero"
                min="1"
                max="10"
                placeholder="Digite um número"
            >

            <button id="btnJogar">Jogar</button>
            <button id="btnNovo" class="secundario">
                Novo jogo
            </button>

            <p id="mensagem" aria-live="polite">
                Boa sorte!
            </p>

            <p>Tentativas: <span id="tentativas">0</span></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Game Zone - Feito por você!</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
