
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cálculo de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Calculadora de IMC</h1>
            <p>Sistema de avaliação do Índice de Massa Corporal</p>
        </header>

        <main>
            <form id="formulario">
                <label for="nome">Nome do paciente:</label>
                <input type="text" id="nome"
                    placeholder="Digite o nome do paciente" required>

                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso"
                    placeholder="Ex: 70" step="0.1" min="0.1" required>

                <label for="altura">Altura (metros):</label>
                <input type="number" id="altura"
                    placeholder="Ex: 1.70" step="0.01" min="0.1" required>

                <button type="submit">Calcular IMC</button>
            </form>

            <section id="resultado" class="resultado">
                <h2>Resultado do paciente</h2>
                <p>Preencha os dados para calcular o IMC.</p>
            </section>
        </main>

        <footer>
            <p>© 2026 - Sistema de Cálculo de IMC</p>
        </footer>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
