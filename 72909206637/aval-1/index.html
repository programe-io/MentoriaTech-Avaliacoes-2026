
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Sistema de Estoque</h1>
        <p>Cadastro e gerenciamento de produtos</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <label for="codigo">Código:</label>
                <input type="number" id="codigo" min="1" step="1"
                       placeholder="Digite o código" required>

                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao"
                       placeholder="Nome do produto" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="0" step="1"
                       placeholder="Digite a quantidade" required>

                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor" min="0" step="0.01"
                       placeholder="Digite o valor" required>

                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section class="estoque">
            <h2>Produtos cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="5">Nenhum produto cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Sistema de Estoque - Projeto em HTML, CSS e JavaScript</p>
    </footer>

<script src="script.js"></script></body>
</html>
