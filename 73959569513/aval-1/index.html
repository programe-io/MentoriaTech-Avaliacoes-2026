<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Carro Esportivo</title>

<link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

<form>

<h2>Cadastro de Carro Esportivo</h2>

<label>Modelo:</label>
<input type="text" id="modelo" placeholder="Ex.: Ferrari F8">

<label>Marca:</label>
<input type="text" id="marca" placeholder="Ex.: Ferrari">

<label>Ano:</label>
<input type="number" id="ano" placeholder="2024">

<label>Categoria:</label>
<select id="categoria">
    <option>SuperEsportivo</option>
        <option>Cupê</option>
            <option>Conversível</option>
                <option>Hipercarro</option>
                </select>

                <label>Combustível:</label><br>

                <input type="radio" name="comb"> Gasolina
                <input type="radio" name="comb"> Híbrido
                <input type="radio" name="comb"> Elétrico

                <br><br>

                <label>Opcionais:</label><br>

                <input type="checkbox"> Turbo<br>
                <input type="checkbox"> Câmbio Automático<br>
                <input type="checkbox"> Tração Integral

                <br><br>

                <label>Descrição:</label>

                <textarea rows="4" placeholder="Descreva o carro"></textarea>

                <div class="botoes">
                    <button type="button" onclick="cadastrar()">Enviar</button>
                        <button type="reset">Limpar</button>
                        </div>

                        <p id="mensagem"></p>

                        </form>

                        <script src="script.js"></script>

                        <script src="script.js"></script></body>
                        </html>
