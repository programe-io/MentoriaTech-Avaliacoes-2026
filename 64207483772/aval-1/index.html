<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão de Estoque - CRUD</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <header>
      <h1>📦 Gestão de Estoque</h1>
      <p>Projeto de Teste CRUD em JavaScript</p>
    </header>

    <!-- Painel de Estatísticas -->
    <section class="stats">
      <div class="stat-card">
        <h3>Total de Itens</h3>
        <p id="stat-total-itens">0</p>
      </div>
      <div class="stat-card">
        <h3>Unidades em Estoque</h3>
        <p id="stat-total-unidades">0</p>
      </div>
      <div class="stat-card">
        <h3>Valor Total do Estoque</h3>
        <p id="stat-valor-total">R$ 0,00</p>
      </div>
    </section>

    <!-- Formulário de Cadastro -->
    <section class="card">
      <h2>Cadastrar Novo Produto</h2>
      <form id="form-produto">
        <div class="form-grid">
          <div class="form-group">
            <label for="descricao">Descrição do Produto</label>
            <input type="text" id="descricao" placeholder="Ex: Cadeira gamer" required>
          </div>
          <div class="form-group">
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" placeholder="Ex: 10" min="1" required>
          </div>
          <div class="form-group">
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" step="0.01" placeholder="Ex: 699.00" min="0" required>
          </div>
        </div>

        <div id="mensagem-erro" class="mensagem-erro"></div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
          <button type="button" id="btn-carregar-exemplos" class="btn btn-secondary">Carregar Dados de Exemplo</button>
        </div>
      </form>
    </section>

    <!-- Tabela de Produtos -->
    <section class="card">
      <h2>Produtos no Estoque</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Descrição</th>
              <th>Qtd.</th>
              <th>Valor Unitário</th>
              <th>Valor Total</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-produtos-corpo">
            <tr>
              <td colspan="6" class="empty-state">Nenhum produto cadastrado no estoque.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
