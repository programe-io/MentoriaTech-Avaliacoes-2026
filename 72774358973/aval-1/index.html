
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header>
            <h1>Sistema de IMC</h1>
            <p>Cadastro e cálculo do Índice de Massa Corporal</p>
        </header>

        <section class="card">
            <h2>Cadastrar Pessoa</h2>

            <form id="form-imc">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite o nome" required>

                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" step="0.1" min="1" required>

                <label for="altura">Altura (m):</label>
                <input type="number" id="altura" step="0.01" min="0.5" required>

                <button type="submit">Calcular IMC</button>

                <p id="mensagem"></p>

            </form>
        </section>

        <section class="card">
            <h2>Registros</h2>

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Peso</th>
                        <th>Altura</th>
                        <th>IMC</th>
                        <th>Ação</th>
                    </tr>
                </thead>

                <tbody id="lista-registros">
                </tbody>
            </table>

            <button id="limpar" class="secundario">
                Limpar registros
            </button>
        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
