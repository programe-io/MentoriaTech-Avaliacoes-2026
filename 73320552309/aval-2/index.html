
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>✓ Gerenciador de Tarefas</h1>
        <p>Organize suas atividades e acompanhe seu progresso</p>
    </header>

    <main>

        <section class="resumo">
            <div class="card">
                <h3>Total de tarefas</h3>
                <span id="totalTarefas">0</span>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <span id="totalPendentes">0</span>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <span id="totalConcluidas">0</span>
            </div>
        </section>

        <section class="cadastro">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <label for="titulo">Título da tarefa:</label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Ex: Estudar JavaScript"
                    required
                >

                <label for="prioridade">Prioridade:</label>

                <select id="prioridade" required>
                    <option value="">Selecione a prioridade</option>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit" class="btn-cadastrar">
                    Cadastrar tarefa
                </button>

            </form>
        </section>

        <section class="tarefas">

            <h2>Minhas tarefas</h2>

            <div class="filtros">
                <button class="filtro ativo" data-filtro="todas">
                    Todas
                </button>

                <button class="filtro" data-filtro="pendentes">
                    Pendentes
                </button>

                <button class="filtro" data-filtro="concluidas">
                    Concluídas
                </button>
            </div>

            <div id="listaTarefas">
                <!-- As tarefas serão inseridas pelo JavaScript -->
            </div>

            <p id="mensagemVazia" class="mensagem-vazia">
                Nenhuma tarefa cadastrada.
            </p>

        </section>

    </main>

    <footer>
        <p>Projeto Gerenciador de Tarefas - JavaScript</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
