<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="container">
    <h1>📋 Gerenciador de Tarefas</h1>

    <!-- FORMULÁRIO DE CADASTRO -->
    <section class="card">
      <h2>Cadastrar Nova Tarefa</h2>
      <form id="form-tarefa">
        <div class="form-group">
          <label for="titulo">Título da Tarefa (mín. 5 caracteres):</label>
          <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript" required>
        </div>

        <div class="form-group">
          <label for="prioridade">Prioridade (1 = Alta, 2 = Média, 3 = Baixa):</label>
          <select id="prioridade" required>
            <option value="">Selecione...</option>
            <option value="1">1 - Alta</option>
            <option value="2">2 - Média</option>
            <option value="3">3 - Baixa</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar Tarefa</button>
      </form>
    </section>

    <!-- MENSAGEM DE ALERTA DE ERRO OU SUCESSO -->
    <div id="mensagem" class="mensagem hidden"></div>

    <!-- LISTA DE TAREFAS -->
    <section class="card">
      <h2>Suas Tarefas</h2>
      <div id="lista-tarefas" class="lista-tarefas">
        <!-- As tarefas serão renderizadas dinamicamente aqui -->
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
