<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Estoque</title>
  <link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="container">
    <h1>📦 Controle de Estoque (CRUD)</h1>

    <!-- FORMULÁRIO DE CADASTRO -->
    <section class="card">
      <h2>Cadastrar Novo Produto</h2>
      <form id="form-produto">
        <div class="form-group">
          <label for="descricao">Descrição do Produto:</label>
          <input type="text" id="descricao" placeholder="Ex: Cadeira Gamer" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" min="1" placeholder="Ex: 10" required>
          </div>

          <div class="form-group">
            <label for="valor">Valor (R$):</label>
            <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 150.00" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
      </form>
    </section>

    <!-- MENSAGEM DE ERRO/SUCESSO -->
    <div id="mensagem" class="mensagem hidden"></div>

    <!-- TABELA DE PRODUTOS -->
    <section class="card">
      <h2>Produtos em Estoque</h2>
      <table class="tabela-estoque">
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Quantidade</th>
            <th>Valor (R$)</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista-produtos">
          <!-- Linhas inseridas via JavaScript -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
