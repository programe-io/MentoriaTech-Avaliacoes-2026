<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanSmart | Dashboard</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>FinanSmart</h1>
    <p>Seu dinheiro sob controle.</p>
</header>

<main>
    <section class="dashboard">
        <div class="indicador saldo">
            <p>Saldo atual</p>
            <h2 id="saldoAtual">R$ 0,00</h2>
        </div>

        <div class="indicador">
            <p>Receitas</p>
            <h2 id="totalReceitas">R$ 0,00</h2>
        </div>

        <div class="indicador">
            <p>Despesas</p>
            <h2 id="totalDespesas">R$ 0,00</h2>
        </div>
    </section>

    <section>
        <h2>Nova movimentação</h2>

        <form id="movimentacaoForm">
            <input id="descricao" placeholder="Descrição" required>

            <input id="valor" type="number" min="0.01"
                step="0.01" placeholder="Valor" required>

            <select id="tipo" required>
                <option value="">Tipo de movimentação</option>
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
            </select>

            <select id="categoria" required>
                <option value="">Categoria</option>
                <option value="Alimentação">Alimentação</option>
                <option value="Transporte">Transporte</option>
                <option value="Estudos">Estudos</option>
                <option value="Lazer">Lazer</option>
                <option value="Trabalho">Trabalho</option>
                <option value="Outros">Outros</option>
            </select>

            <button type="submit" id="botaoMovimentacao">
                Adicionar movimentação
            </button>

            <button type="button" id="cancelarEdicao"
                class="secundario" hidden>
                Cancelar edição
            </button>
        </form>

        <p id="mensagem"></p>
    </section>

    <section>
        <h2>Minhas metas financeiras</h2>

        <form id="metaForm">
            <input id="nomeMeta" placeholder="Nome da meta" required>

            <input id="valorMeta" type="number" min="0.01"
                step="0.01" placeholder="Valor desejado" required>

            <button type="submit">Criar meta</button>
        </form>

        <div id="listaMetas"></div>
    </section>

    <section>
        <h2>Resumo de despesas</h2>
        <div id="graficoCategorias"></div>
    </section>

    <section>
        <h2>Receitas e despesas</h2>
        <div class="grafico">
            <div class="barra-receita">
                <span>Receitas</span>
                <strong id="barraReceita">R$ 0,00</strong>
            </div>

            <div class="barra-despesa">
                <span>Despesas</span>
                <strong id="barraDespesa">R$ 0,00</strong>
            </div>
        </div>
    </section>

    <section>
        <h2>Histórico de movimentações</h2>
        <div id="historico"></div>
    </section>
</main>

<footer>
    <p>FinanSmart ©️ 2026 - Educação financeira</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
