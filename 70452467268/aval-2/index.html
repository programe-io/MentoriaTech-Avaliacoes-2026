<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanSmart | Planejamento</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>FinanSmart</h1>
    <p>Planeje hoje para conquistar amanhã.</p>
</header>

<main>
    <section class="resumo">
        <div>
            <h3>Receitas</h3>
            <p id="receitas">R$ 0,00</p>
        </div>

        <div>
            <h3>Despesas</h3>
            <p id="despesas">R$ 0,00</p>
        </div>

        <div>
            <h3>Saldo</h3>
            <p id="saldo">R$ 0,00</p>
        </div>
    </section>

    <section>
        <h2>Registrar movimentação</h2>

        <form id="movimentacaoForm">
            <input id="descricao" placeholder="Descrição" required>
            <input id="valor" type="number" min="0.01" step="0.01" placeholder="Valor" required>

            <select id="tipo" required>
                <option value="">Selecione o tipo</option>
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
            </select>

            <select id="categoria" required>
                <option value="">Selecione a categoria</option>
                <option value="Alimentação">Alimentação</option>
                <option value="Transporte">Transporte</option>
                <option value="Estudos">Estudos</option>
                <option value="Lazer">Lazer</option>
                <option value="Trabalho">Trabalho</option>
                <option value="Outros">Outros</option>
            </select>

            <button type="submit">Registrar</button>
        </form>
    </section>

    <section>
        <h2>Criar meta financeira</h2>

        <form id="metaForm">
            <input id="nomeMeta" placeholder="Nome da meta" required>
            <input id="valorMeta" type="number" min="0.01" step="0.01" placeholder="Valor desejado" required>
            <button type="submit">Criar meta</button>
        </form>
    </section>

    <section>
        <h2>Adicionar economia à meta</h2>

        <form id="economiaForm">
            <select id="metaEscolhida" required>
                <option value="">Selecione uma meta</option>
            </select>

            <input id="valorEconomia" type="number" min="0.01" step="0.01" placeholder="Valor economizado" required>

            <button type="submit">Adicionar valor</button>
        </form>

        <p id="mensagem"></p>
    </section>

    <section>
        <h2>Minhas metas</h2>
        <div id="listaMetas"></div>
    </section>

    <section>
        <h2>Resumo por categoria</h2>
        <div id="resumoCategorias"></div>
    </section>
</main>

<footer>
    <p>FinanSmart ©️ 2026</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
