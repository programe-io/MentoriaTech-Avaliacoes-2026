<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanSmart | Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>FinanSmart</h1>
        <p>Organize seu dinheiro, planeje seu futuro.</p>
    </header>

    <main>
        <section class="saldo">
            <h2>Saldo atual</h2>
            <span id="saldoAtual">R$ 0,00</span>
        </section>

        <section class="resumo">
            <div>
                <h3>Receitas</h3>
                <p id="totalReceitas">R$ 0,00</p>
            </div>

            <div>
                <h3>Despesas</h3>
                <p id="totalDespesas">R$ 0,00</p>
            </div>
        </section>

        <section>
            <h2>Nova movimentação</h2>

            <form id="movimentacaoForm">
                <input
                    type="text"
                    id="descricao"
                    placeholder="Descrição"
                    required
                >

                <input
                    type="number"
                    id="valor"
                    placeholder="Valor em reais"
                    min="0.01"
                    step="0.01"
                    required
                >

                <select id="tipo" required>
                    <option value="">Tipo de movimentação</option>
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>

                <select id="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Estudos">Estudos</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Trabalho">Trabalho</option>
                    <option value="Outros">Outros</option>
                </select>

                <button type="submit">Adicionar movimentação</button>
            </form>
        </section>

        <section>
            <h2>Histórico financeiro</h2>
            <div id="historico">
                <p>Nenhuma movimentação registrada.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>FinanSmart ©️ 2026 - Educação financeira</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
