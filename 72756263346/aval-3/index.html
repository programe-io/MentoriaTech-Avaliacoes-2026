<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Exemplo completo de HTML">
  <meta name="keywords" content="html, css, javascript">
  <meta name="author" content="Exemplo">

  <title>HTML Completo</title>

  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">Meu Site</div>

    <nav>
      <a href="#">Home</a>
      <a href="#">Sobre</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <!-- MAIN -->
  <main>

    <section>
      <h1>Título principal</h1>
      <p>Parágrafo com <strong>negrito</strong>, <em>itálico</em> e <mark>marca texto</mark>.</p>

      <a href="https://example.com">Link externo</a>
    </section>

    <section>
      <h2>Imagem e mídia</h2>

      <figure>
        <img src="https://via.placeholder.com/150" alt="Imagem">
        <figcaption>Legenda da imagem</figcaption>
      </figure>

      <video controls width="250">
        <source src="video.mp4" type="video/mp4">
      </video>

      <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
      </audio>

      <canvas id="canvas"></canvas>
    </section>

    <section>
      <h2>Formulário</h2>

      <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">

        <label for="email">Email:</label>
        <input type="email" id="email">

        <label for="senha">Senha:</label>
        <input type="password">

        <select>
          <option>Opção 1</option>
          <option>Opção 2</option>
        </select>

        <textarea></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>

    <section>
      <h2>Tabela</h2>

      <table border="1">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Idade</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>João</td>
            <td>15</td>
          </tr>
        </tbody>
      </table>
    </section>

    <aside>
      <p>Conteúdo lateral (aside)</p>
    </aside>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>Rodapé do site</p>
  </footer>

  <!-- ELEMENTOS GENÉRICOS -->
  <div>Div genérica</div>
  <span>Span inline</span>

  <!-- SCRIPTS -->
  <script>
    console.log("JS funcionando");
  </script>

<script src="script.js"></script></body>
</html>
