<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gerenciador de Tarefas</title>
<link rel="stylesheet" href="styles.css" />
<link href="style.css" rel="stylesheet"></head>
<body>

<h1>Gerenciador de Tarefas</h1>

<div id="mensagemErro" class="mensagem-erro" style="display:none;"></div>

<form id="formTarefa">
  <label for="titulo">Título da tarefa:</label>
  <input type="text" id="titulo" name="titulo" placeholder="Digite o título da tarefa" required />

  <label for="prioridade">Prioridade:</label>
  <select id="prioridade" name="prioridade">
    <option value="1">Alta</option>
    <option value="2" selected>Média</option>
    <option value="3">Baixa</option>
  </select>

  <button type="submit">Cadastrar Tarefa</button>
</form>

<div class="tarefas" id="listaTarefas"></div>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
