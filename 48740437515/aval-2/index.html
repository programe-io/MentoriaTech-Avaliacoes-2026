<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniLoop Social</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .brand-bg {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }

    .brand-text {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-10">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 py-3 px-4 shadow-sm mb-6">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="brand-bg w-8 h-8 rounded-lg flex items-center justify-center text-white">
          <i class="fa-solid fa-infinity"></i></div><span class="font-bold text-lg brand-text">MiniLoop</span>
      </div>
      <div class="text-xs text-slate-500 font-medium"><i class="fa-solid fa-house text-indigo-600 mr-1"></i>Início</div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 space-y-4">
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
      <textarea id="postTxt" rows="2" placeholder="No que você está pensando?" class="w-full text-sm p-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500 resize-none bg-slate-50"></textarea>
      <div class="flex justify-between items-center">
        <input type="text" id="postImg" placeholder="URL da imagem (opcional)" class="text-xs p-1.5 border rounded w-2/3 bg-slate-50">
        <button onclick="addPost()" class="brand-bg text-white text-xs font-bold px-4 py-1.5 rounded-lg hover:opacity-90">Publicar</button>
      </div>
    </div>

    <div id="feed" class="space-y-4">
      <article class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3" id="post-1">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-purple-600 text-white flex items-center justify-center font-bold text-sm">
            M</div>
          <div>
            <h4 class="font-bold text-sm">Maria</h4><span class="text-[10px] text-slate-400">Há 10 minutos</span>
          </div>
        </div>
        <p class="text-xs text-slate-700 leading-relaxed">Hoje eu vi o novo filme do homiranha, top, to feliz :D
          <span class="text-indigo-500 font-medium">#cinema</span></p>
        <img src="https://images.unsplash.com/photo-1635805737707-575885ab0820?w=500&q=80" class="rounded-lg w-full max-h-80 object-cover" onerror="this.src='https://placehold.co/400x300?text=Homem+Aranha'">
        <div class="flex items-center gap-2 pt-1 border-t text-xs">
          <button onclick="toggleLike(1)" id="like-1" class="flex items-center gap-1 px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200"><i class="fa-regular fa-heart"></i> <span>Curtir</span> (<span id="lc-1">14</span>)</button>
          <button onclick="toggleCommentBox(1)" class="flex items-center gap-1 px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200"><i class="fa-regular fa-comment"></i> <span>Comentar</span> (<span id="cc-1">1</span>)</button>
        </div>
        <div id="comments-1" class="hidden space-y-2 pt-2 border-t text-xs">
          <div id="clist-1" class="space-y-1">
            <div class="bg-slate-50 p-2 rounded"><strong class="text-indigo-600">Jonathan:</strong> Muito bom esse
              filme!</div>
          </div>
          <div class="flex gap-1">
            <input type="text" id="ci-1" placeholder="Escreva um comentário..." class="flex-grow p-1.5 border rounded text-xs" onkeypress="if(event.key==='Enter')addComment(1)">
            <button onclick="addComment(1)" class="brand-bg text-white px-3 py-1 rounded font-bold">Enviar</button>
          </div>
        </div>
      </article>
    </div>
  </main>

  <script>
    let postCount = 1;
    function addPost() {
      const txt = document.getElementById('postTxt').value.trim();
      const img = document.getElementById('postImg').value.trim();
      if(!txt && !img) return;
      postCount++; const id = postCount;
      const imgTag = img ? `<img src="${img}" class="rounded-lg w-full max-h-80 object-cover my-2" onerror="this.style.display='none'">` : '';
      const html = `<article class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3" id="post-${id}">
        <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-full brand-bg text-white flex items-center justify-center font-bold text-sm">J</div>
        <div><h4 class="font-bold text-sm">Jonathan</h4><span class="text-[10px] text-slate-400">Agora mesmo</span></div></div>
        <p class="text-xs text-slate-700 leading-relaxed">${escapeHtml(txt)}</p>${imgTag}
        <div class="flex items-center gap-2 pt-1 border-t text-xs">
          <button onclick="toggleLike(${id})" id="like-${id}" class="flex items-center gap-1 px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200"><i class="fa-regular fa-heart"></i> <span>Curtir</span> (<span id="lc-${id}">0</span>)</button>
          <button onclick="toggleCommentBox(${id})" class="flex items-center gap-1 px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200"><i class="fa-regular fa-comment"></i> <span>Comentar</span> (<span id="cc-${id}">0</span>)</button>
        </div>
        <div id="comments-${id}" class="hidden space-y-2 pt-2 border-t text-xs">
          <div id="clist-${id}" class="space-y-1"></div>
          <div class="flex gap-1">
            <input type="text" id="ci-${id}" placeholder="Escreva um comentário..." class="flex-grow p-1.5 border rounded text-xs" onkeypress="if(event.key==='Enter')addComment(${id})">
            <button onclick="addComment(${id})" class="brand-bg text-white px-3 py-1 rounded font-bold">Enviar</button>
          </div>
        </div></article>`;
      document.getElementById('feed').insertAdjacentHTML('afterbegin', html);
      document.getElementById('postTxt').value = ''; document.getElementById('postImg').value = '';
    }
    function toggleLike(id) {
      const btn = document.getElementById(`like-${id}`);
      const count = document.getElementById(`lc-${id}`);
      let n = parseInt(count.textContent);
      if (btn.classList.contains('text-rose-600')) {
        btn.classList.remove('text-rose-600', 'font-bold');
        btn.querySelector('i').className = 'fa-regular fa-heart';
        count.textContent = n - 1;
      } else {
        btn.classList.add('text-rose-600', 'font-bold');
        btn.querySelector('i').className = 'fa-solid fa-heart';
        count.textContent = n + 1;
      }
    }
    function toggleCommentBox(id) { document.getElementById(`comments-${id}`).classList.toggle('hidden'); }
    function addComment(id) {
      const input = document.getElementById(`ci-${id}`);
      const text = input.value.trim();
      if(!text) return;
      document.getElementById(`clist-${id}`).insertAdjacentHTML('beforeend', `<div class="bg-slate-50 p-2 rounded"><strong class="text-indigo-600">Jonathan:</strong> ${escapeHtml(text)}</div>`);
      const count = document.getElementById(`cc-${id}`);
      count.textContent = parseInt(count.textContent) + 1;
      input.value = '';
    }
    function escapeHtml(str) { return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
  </script>
<script src="script.js"></script></body>

</html>
