<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Girl</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Fashion Girl</h1>
        <p>Moda feminina para jovens</p>
    </header>

    <main>
        <section class="banner">
            <h2>Nova Coleção 2026</h2>
            <button onclick="mostrarMensagem()">Ver Promoções</button>
        </section>

        <section class="produtos">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=500" alt="Look Feminino">
                <h3>Vestido Casual</h3>
                <p>R$ 129,90</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=500" alt="Moda Jovem">
                <h3>Conjunto Fashion</h3>
                <p>R$ 159,90</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500" alt="Roupa Feminina">
                <h3>Jaqueta Moderna</h3>
                <p>R$ 199,90</p>
            </div>
        </section>

        <div id="mensagem"></div>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
