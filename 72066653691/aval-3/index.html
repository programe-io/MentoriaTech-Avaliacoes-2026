<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PsiCare</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <div class="logo">
        <h1>Psi<span>Care</span></h1>
    </div>

    <nav>
        <a href="#">Início</a>
        <a href="#">Consultas</a>
        <a href="#">Contato</a>
    </nav>
</header>

<main>

    <section class="banner">
        <article>
            <div class="texto">
                <h2>Consultas <span>Online</span> de Psicologia</h2>
                <p>Cuide da sua saúde mental com segurança.</p>
                <button onclick="agendar()">Agendar</button>
            </div>
        </article>

        <aside>
            <div class="imagem">
                <img src="https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?w=800" alt="Psicóloga">
            </div>
        </aside>
    </section>

    <section class="servicos">
        <h2>Serviços</h2>

        <div class="cards">

            <article class="card">
                <img src="https://images.unsplash.com/photo-1516302752625-fcc3c50ae61f?w=400">
                <h3>Ansiedade</h3>
                <p>Tratamento especializado.</p>
            </article>

            <article class="card">
                <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=400">
                <h3>Depressão</h3>
                <p>Acompanhamento emocional.</p>
            </article>

            <article class="card">
                <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=400">
                <h3>Terapia Familiar</h3>
                <p>Melhore seus relacionamentos.</p>
            </article>

        </div>
    </section>

</main>

<footer>
    <div>
        <p>© 2026 <span>PsiCare</span></p>
    </div>
</footer>

<script src="script.js"></script>

</html>
