<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Case</title>
<link href="style.css" rel="stylesheet"></head>
<body>
    <h1>Exemplo de Switch Case</h1>
    <p id="resultado"></p>

    <script>
        let numero = 12;

        switch(numero){
            case 5:
                document.getElementById('resultado').innerHTML = 'O valor é igual a 5';
                break;
            case 7:
                document.getElementById('resultado').innerHTML = 'O valor é igual a 7';
                break;
            case 10:
                document.getElementById('resultado').innerHTML = 'O valor é igual a 10';
                break;
            case 15:
                document.getElementById('resultado').innerHTML = 'O valor é igual a 15';
                break;
            default:
                document.getElementById('resultado').innerHTML = 'Não tenho um case para o valor especificado';
                break;
        }
    </script>
<script src="script.js"></script></body>
</html>
