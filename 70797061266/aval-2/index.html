<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array unshift e shift</title>
<link href="style.css" rel="stylesheet"></head>
<body>
    <h1>Exemplo de unshift e shift</h1>
    <p id="antes"></p>
    <p id="depois"></p>

    <script>
        let meuArray = [];
        meuArray.unshift(5);
        meuArray.unshift(8);
        meuArray.unshift(3);

        document.getElementById('antes').innerHTML = 'Antes do shift: [' + meuArray.join(', ') + ']';

        meuArray.shift();

        document.getElementById('depois').innerHTML = 'Depois do shift: [' + meuArray.join(', ') + ']';
    </script>
<script src="script.js"></script></body>
</html>
