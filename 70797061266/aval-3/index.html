<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main>
        <h1>Calculadora de IMC</h1>

        <!-- Card do formulário -->
        <section class="card">
            <h2 id="titulo-form">Nova pessoa</h2>

            <form id="form-pessoa" novalidate>
                <div class="campo campo-nome">
                    <label for="input-nome">Nome</label>
                    <input type="text" id="input-nome" maxlength="50" placeholder="Ex.: Maria Silva">
                </div>

                <div class="campo">
                    <label for="input-idade">Idade (anos)</label>
                    <input type="number" id="input-idade" min="1" max="120" step="1" placeholder="Ex.: 30">
                </div>

                <div class="campo">
                    <label for="input-altura">Altura (m)</label>
                    <input type="number" id="input-altura" min="0.5" max="2.5" step="0.01" placeholder="Ex.: 1.75">
                </div>

                <div class="campo">
                    <label for="input-peso">Peso (kg)</label>
                    <input type="number" id="input-peso" min="2" max="500" step="0.1" placeholder="Ex.: 70">
                </div>

                <div class="botoes">
                    <button type="submit" id="btn-salvar">Salvar</button>
                    <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar</button>
                </div>
            </form>

            <p id="erro" role="alert" hidden></p>
        </section>

        <!-- Card da tabela -->
        <section class="card">
            <h2>Pessoas cadastradas</h2>

            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-pessoas">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
