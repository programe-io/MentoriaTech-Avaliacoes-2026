
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Rosa 💗</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>💗 Sistema de Estoque</h1>

    <div class="container">
        <h2>Cadastrar produto</h2>

        <input type="number" id="codigo" placeholder="Código do produto">
        <input type="text" id="descricao" placeholder="Descrição do produto">
        <input type="number" id="quantidade" placeholder="Quantidade" min="0">
        <input type="number" id="valor" placeholder="Valor (R$)" min="0" step="0.01">

        <button onclick="cadastrarProduto()">Cadastrar produto</button>

        <p id="mensagem"></p>
    </div>

    <div class="container">
        <h2>Alterar produto</h2>

        <input type="number" id="codigoAlterar" placeholder="Código do produto">
        <input type="number" id="novoValor" placeholder="Novo valor (R$)" min="0" step="0.01">
        <button onclick="alterarValor()">Alterar valor</button>

        <input type="number" id="novaQuantidade" placeholder="Nova quantidade" min="0">
        <button onclick="alterarQuantidade()">Alterar quantidade</button>
    </div>

    <div class="container">
        <h2>Produtos cadastrados</h2>
        <button onclick="listarProdutos()">Atualizar lista</button>

        <div id="listaProdutos"></div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
