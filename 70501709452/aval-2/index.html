
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Projetos</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <aside class="sidebar">
    <h2>ProjectFlow</h2>
    <nav>
      <a href="#dashboard">📊 Dashboard</a>
      <a href="#projetos">📁 Projetos</a>
      <a href="#cadastro">➕ Novo projeto</a>
    </nav>
    <p class="sidebar-footer">Gestão de projetos</p>
  </aside>

  <main class="main-content" id="dashboard">
    <header class="topbar">
      <div>
        <h1>Gerenciamento de Projetos</h1>
        <p>Acompanhe seus projetos e tarefas.</p>
      </div>
      <button onclick="abrirFormulario()">
        + Novo projeto
      </button>
    </header>

    <section class="stats">
      <article class="stat-card">
        <span>Total de projetos</span>
        <h2 id="totalProjetos">0</h2>
      </article>
      <article class="stat-card">
        <span>Em andamento</span>
        <h2 id="emAndamento">0</h2>
      </article>
      <article class="stat-card">
        <span>Concluídos</span>
        <h2 id="concluidos">0</h2>
      </article>
      <article class="stat-card">
        <span>Tarefas pendentes</span>
        <h2 id="pendentes">0</h2>
      </article>
    </section>

    <section id="cadastro" class="panel hidden">
      <h2 id="tituloFormulario">Novo projeto</h2>
      <form id="formProjeto">
        <input type="hidden" id="projetoId">

        <label for="nome">Nome do projeto</label>
        <input id="nome" required
          placeholder="Ex.: Sistema de vendas">

        <label for="responsavel">Responsável</label>
        <input id="responsavel" required
          placeholder="Nome do responsável">

        <label for="descricao">Descrição</label>
        <textarea id="descricao"
          placeholder="Descreva o projeto"></textarea>

        <label for="prazo">Prazo final</label>
        <input type="date" id="prazo" required>

        <div class="form-actions">
          <button type="submit">Salvar projeto</button>
          <button type="button" class="secondary"
            onclick="fecharFormulario()">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="panel" id="projetos">
      <div class="section-heading">
        <div>
          <h2>Meus projetos</h2>
          <p>Consulte e atualize seus projetos.</p>
        </div>
        <input id="busca" placeholder="Buscar projeto..."
          aria-label="Buscar projeto">
      </div>
      <div id="listaProjetos" class="project-grid"></div>
    </section>
  </main>

  <dialog id="dialogTarefas">
    <div class="dialog-header">
      <h2 id="tituloTarefas">Tarefas</h2>
      <button class="secondary" onclick="fecharTarefas()">
        Fechar
      </button>
    </div>
    <form id="formTarefa">
      <input id="tarefaNome" required
        placeholder="Nome da nova tarefa">
      <button type="submit">Adicionar tarefa</button>
    </form>
    <div id="listaTarefas"></div>
  </dialog>
<script src="script.js"></script></body>
</html>
