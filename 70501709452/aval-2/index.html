
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas 💗</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>💗 Minhas Tarefas</h1>
        <p>Organize suas tarefas com carinho!</p>
    </header>

    <main>
        <section class="container">
            <h2>Cadastrar tarefa</h2>

            <input type="number" id="codigo" placeholder="Código da tarefa">
            <input type="text" id="titulo" placeholder="Título (mínimo 5 caracteres)">

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade">
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button onclick="cadastrarTarefa()">Cadastrar tarefa</button>
            <p id="mensagem"></p>
        </section>

        <section class="container">
            <h2>Gerenciar tarefas</h2>

            <input type="number" id="codigoAlterar" placeholder="Código da tarefa">

            <label for="novaPrioridade">Nova prioridade:</label>
            <select id="novaPrioridade">
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button onclick="alterarPrioridade()">Alterar prioridade</button>
            <button onclick="concluirTarefa()">Marcar como concluída</button>
        </section>

        <section class="container">
            <h2>Lista de tarefas 📋</h2>
            <button onclick="listarTarefas()">Atualizar lista</button>
            <div id="listaTarefas"></div>
        </section>
    </main>

    <footer>Feito com 💗</footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
