
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>💗 Calculadora de IMC</h1>

    <div class="container">
        <h2>Cadastrar pessoa</h2>

        <input type="text" id="nome" placeholder="Nome da pessoa">
        <input type="number" id="peso" placeholder="Peso em kg" step="0.1" min="0">
        <input type="number" id="altura" placeholder="Altura em metros" step="0.01" min="0">

        <button onclick="adicionarPessoa()">Calcular IMC</button>

        <p id="mensagem"></p>
    </div>

    <div class="container">
        <h2>Resultado</h2>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Peso (kg)</th>
                    <th>Altura (m)</th>
                    <th>IMC</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="tabela"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
