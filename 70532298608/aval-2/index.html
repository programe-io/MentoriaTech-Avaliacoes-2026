
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <h1>Sistema de Estoque</h1>
        <p>Cadastro e controle de produtos</p>

        <section>
            <h2>Cadastrar produto</h2>

            <form>
                <label for="codigo">Código:</label>
                <input type="number" id="codigo" required>

                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="0" required>

                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor" min="0" step="0.01" required>

                <button type="button">Cadastrar produto</button>
            </form>
        </section>

        <section>
            <h2>Produtos cadastrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="4">Os produtos serão exibidos aqui.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
<script src="script.js"></script></body>
</html>
