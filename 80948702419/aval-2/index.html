<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lordran Feed - Mensagens de Soapstone</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>LORDRAN CHRONICLES</h1>
        <p class="subtitle">"Não desista, esqueleto!" — Rede de Mensagens dos Undead</p>
    </header>

    <div class="container">
        <!-- Criar Post -->
        <section class="post-box">
            <h2>Escrever com Orange Guidance Soapstone</h2>
            <form id="postForm">
                <div class="form-row">
                    <input type="text" id="authorInput" placeholder="Seu nome (ex: Solaire de Astora)" required>
                    <select id="categoryInput">
                        <option value="Dica">Dica</option>
                        <option value="Boss">Boss</option>
                        <option value="Lore">Lore</option>
                    </select>
                </div>
                <textarea id="contentInput" placeholder="Escreva sua mensagem no chão..." required></textarea>
                <button type="submit" class="btn-post">Deixar Sinal no Chão</button>
            </form>
        </section>

        <!-- Filtros -->
        <div class="filters">
            <button class="filter-btn active" data-filter="Todos">Todos</button>
            <button class="filter-btn" data-filter="Dica">Dicas</button>
            <button class="filter-btn" data-filter="Boss">Bosses</button>
            <button class="filter-btn" data-filter="Lore">Lore</button>
        </div>

        <!-- Lista de Posts -->
        <main class="feed" id="feedContainer"></main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
