<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InstaClone</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">InstaClone</div>
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Pesquisar usuário..."
        aria-label="Pesquisar usuário"
      />
      <button class="new-post-btn" id="openModalBtn">+ Nova postagem</button>
    </div>
  </header>

  <main>
    <section class="stories" id="stories"></section>
    <section class="feed" id="feed"></section>
  </main>

  <!-- Modal de nova postagem -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h2>Criar nova postagem</h2>
      <input
        type="text"
        id="postUsername"
        placeholder="Seu usuário (ex: ana.dev)"
        value="voce.dev"
      />
      <input
        type="url"
        id="postImageUrl"
        placeholder="URL da imagem (ou deixe vazio para imagem aleatória)"
      />
      <textarea
        id="postCaption"
        rows="3"
        placeholder="Escreva uma legenda..."
      ></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" id="closeModalBtn">Cancelar</button>
        <button class="new-post-btn" id="publishPostBtn">Publicar</button>
      </div>
    </div>
  </div>

  <!-- Visualizador simples de Story -->
  <div class="modal-backdrop" id="storyViewer">
    <div class="story-modal">
      <div class="story-modal-header">
        <span id="storyViewerUser"></span>
        <button class="close-story-btn" id="closeStoryBtn" aria-label="Fechar story">✕</button>
      </div>
      <img id="storyViewerImg" src="" alt="Story" />
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
