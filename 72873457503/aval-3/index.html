
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🛍️ Minha Loja</h1>
        <div class="carrinho">
            🛒 Carrinho: <span id="quantidade">0</span>
        </div>
    </header>

    <main>
        <h2>Nossos Produtos</h2>

        <div class="produtos">

            <div class="produto">
                <div class="imagem">👟</div>
                <h3>Tênis Esportivo</h3>
                <p>R$ 150,00</p>
                <button onclick="adicionar('Tênis Esportivo', 150)">
                    Adicionar
                </button>
            </div>

            <div class="produto">
                <div class="imagem">🎧</div>
                <h3>Fone Bluetooth</h3>
                <p>R$ 80,00</p>
                <button onclick="adicionar('Fone Bluetooth', 80)">
                    Adicionar
                </button>
            </div>

            <div class="produto">
                <div class="imagem">⌚</div>
                <h3>Relógio Digital</h3>
                <p>R$ 120,00</p>
                <button onclick="adicionar('Relógio Digital', 120)">
                    Adicionar
                </button>
            </div>

        </div>

        <section class="resumo">
            <h2>Meu Carrinho</h2>
            <ul id="lista"></ul>
            <h3>Total: R$ <span id="total">0.00</span></h3>
            <button onclick="limparCarrinho()">Limpar Carrinho</button>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
