
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe o Número</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="jogo">
        <h1>🎮 Adivinhe o Número</h1>
        <p>Estou pensando em um número de 1 a 100!</p>

        <input type="number" id="numero" placeholder="Digite seu palpite">

        <button onclick="verificar()">Tentar</button>

        <p id="mensagem">Boa sorte!</p>

        <p>Tentativas: <span id="tentativas">0</span></p>

        <button class="reiniciar" onclick="reiniciar()">
            Jogar novamente
        </button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
