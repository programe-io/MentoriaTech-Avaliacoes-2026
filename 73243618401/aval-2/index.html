
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="logo">
            <h1>✓ TaskManager</h1>
            <p>Organize suas tarefas e aumente sua produtividade.</p>
        </div>
    </header>

    <main class="container">

        <!-- Indicadores -->
        <section class="cards">

            <div class="card">
                <h3>Total de tarefas</h3>
                <span id="total">0</span>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <span id="pendentes">0</span>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <span id="concluidas">0</span>
            </div>

        </section>

        <!-- Cadastro -->
        <section class="section">

            <h2>Adicionar nova tarefa</h2>

            <form id="formulario">

                <div class="campo">
                    <label for="titulo">Nome da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o nome da tarefa"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Descreva sua tarefa"
                    >
                </div>

                <div class="campo">
                    <label for="data">Prazo</label>
                    <input
                        type="date"
                        id="data"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade">
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>

                <button type="submit" class="btn-adicionar">
                    + Adicionar tarefa
                </button>

            </form>

        </section>

        <!-- Lista de tarefas -->
        <section class="section">

            <div class="titulo-lista">
                <h2>Minhas tarefas</h2>

                <select id="filtro">
                    <option value="Todas">Todas</option>
                    <option value="Pendente">Pendentes</option>
                    <option value="Concluída">Concluídas</option>
                </select>
            </div>

            <div id="listaTarefas" class="lista-tarefas">

                <p class="vazio">
                    Nenhuma tarefa cadastrada.
                </p>

            </div>

        </section>

    </main>

    <footer>
        <p>Gerenciador de Tarefas © 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
