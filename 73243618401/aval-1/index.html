

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Estoque</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #0f172a;
    color: white;
    padding: 20px 30px;
}

header h1 {
    font-size: 24px;
}

.container {
    padding: 30px;
    max-width: 1200px;
    margin: auto;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #00000010;
}

.card h3 {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 12px;
}

.card p {
    font-size: 28px;
    font-weight: bold;
    color: #2563eb;
}

.section {
    background: white;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px #00000010;
}

.section h2 {
    margin-bottom: 20px;
}

form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

input, select {
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    width: 100%;
    outline: none;
}

input:focus, select:focus {
    border-color: #2563eb;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #1d4ed8;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #e2e8f0;
}

th {
    background: #f8fafc;
    color: #475569;
}

.status {
    background: #dcfce7;
    color: #15803d;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
}

.baixo {
    background: #fee2e2;
    color: #b91c1c;
}

.search {
    margin-bottom: 20px;
    max-width: 350px;
}

.tabela {
    overflow-x: auto;
}

@media(max-width:600px) {
    .container {
        padding: 15px;
    }

    header {
        padding: 18px;
    }

    .section {
        padding: 15px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <h1>📦 Sistema de Estoque</h1>
    <p>Controle de produtos e mercadorias</p>
</header>

<div class="container">

    <div class="cards">
        <div class="card">
            <h3>Total de Produtos</h3>
            <p id="total">0</p>
        </div>

        <div class="card">
            <h3>Itens em Estoque</h3>
            <p id="quantidade">0</p>
        </div>

        <div class="card">
            <h3>Estoque Baixo</h3>
            <p id="baixo">0</p>
        </div>
    </div>

    <div class="section">
        <h2>➕ Cadastrar Produto</h2>

        <form id="formulario">
            <input type="text" id="nome"
                placeholder="Nome do produto" required>

            <input type="text" id="codigo"
                placeholder="Código" required>

            <input type="number" id="qtd"
                placeholder="Quantidade" min="0" required>

            <input type="number" id="preco"
                placeholder="Preço de venda" min="0" step="0.01" required>

            <button type="submit">Cadastrar Produto</button>
        </form>
    </div>

    <div class="section">
        <h2>📋 Produtos em Estoque</h2>

        <input class="search" type="text"
            id="pesquisa"
            placeholder="Pesquisar produto...">

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Código</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>

                <tbody id="lista"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
let produtos = [];

const formulario = document.getElementById("formulario");

formulario.addEventListener("submit", function(e) {
    e.preventDefault();

    const nome = document.getElementById("nome").value;
    const codigo = document.getElementById("codigo").value;
    const qtd = Number(document.getElementById("qtd").value);
    const preco = Number(document.getElementById("preco").value);

    if (produtos.some(p => p.codigo === codigo)) {
        alert("Este código já está cadastrado!");
        return;
    }

    produtos.push({
        nome,
        codigo,
        qtd,
        preco
    });

    formulario.reset();
    atualizar();
});

function atualizar() {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    produtos.forEach((p, i) => {
        const status = p.qtd <= 5 ? "Estoque baixo" : "Disponível";

        lista.innerHTML += `
        <tr>
            <td>${p.nome}</td>
            <td>${p.codigo}</td>
            <td>${p.qtd}</td>
            <td>R$ ${p.preco.toFixed(2)}</td>
            <td>
                <span class="status ${p.qtd <= 5 ? 'baixo' : ''}">
                    ${status}
                </span>
            </td>
            <td>
                <button onclick="remover(${i})">
                    Excluir
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("total").textContent =
        produtos.length;

    document.getElementById("quantidade").textContent =
        produtos.reduce((s, p) => s + p.qtd, 0);

    document.getElementById("baixo").textContent =
        produtos.filter(p => p.qtd <= 5).length;
}

function remover(i) {
    if (confirm("Deseja excluir este produto?")) {
        produtos.splice(i, 1);
        atualizar();
    }
}

document.getElementById("pesquisa")
.addEventListener("input", function() {
    const termo = this.value.toLowerCase();

    document.querySelectorAll("#lista tr")
    .forEach((linha, i) => {
        const p = produtos[i];

        linha.style.display =
            (p.nome.toLowerCase().includes(termo) ||
             p.codigo.toLowerCase().includes(termo))
            ? ""
            : "none";
    });
});
</script>

<script src="script.js"></script></body>
</html>
