<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <h1>Gerenciador de Tarefas</h1>

    <div class="formulario">
      <div class="campo">
        <label for="titulo">Título da Tarefa (mín. 5 caracteres):</label>
        <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript">
      </div>

      <div class="campo">
        <label for="prioridade">Prioridade (1 = Alta, 2 = Média, 3 = Baixa):</label>
        <input type="number" id="prioridade" min="1" max="3" value="1">
      </div>

      <button type="button" id="btn-cadastrar" class="btn-cadastrar">Cadastrar Tarefa</button>
    </div>

    <p id="mensagem" class="mensagem"></p>

    <h2>Tarefas Cadastradas</h2>
    <ul id="lista-tarefas" class="lista"></ul>
  </div>
<script src="script.js"></script></body>
</html>
