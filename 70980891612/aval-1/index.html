<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Estoque</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h1>Sistema de Estoque de Produtos</h1>

    <h2>1. Cadastrar Novo Produto</h2>
    <div class="formulario">
      <input type="text" id="codigo" placeholder="Código (ex: 101)">
      <input type="text" id="descricao" placeholder="Descrição do produto">
      <input type="number" id="quantidade" placeholder="Quantidade">
      <input type="number" id="valor" step="0.01" placeholder="Valor (R$)">
      <button onclick="cadastrarProduto()">+ Cadastrar</button>
    </div>

    <h2>2. Produtos Cadastrados</h2>
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Descrição</th>
          <th>Quantidade</th>
          <th>Valor Unitário</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="lista-produtos">
        <tr>
          <td colspan="5" class="vazio">Nenhum produto cadastrado no estoque.</td>
        </tr>
      </tbody>
    </table>
  </div>

<script src="script.js"></script></body>
</html>
