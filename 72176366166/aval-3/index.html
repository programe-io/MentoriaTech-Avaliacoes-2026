<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📋 Gerenciador de Tarefas</h1>
        
        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2>Nova Tarefa</h2>
            <div class="form-group">
                <input type="text" id="tituloTarefa" placeholder="Digite o título da tarefa...">
                <select id="prioridadeTarefa">
                    <option value="baixa">Baixa</option>
                    <option value="média">Média</option>
                    <option value="alta">Alta</option>
                </select>
                <button id="btnCadastrar" onclick="acaoCadastrar()">Cadastrar</button>
            </div>
            <div id="mensagemErro" class="erro-msg"></div>
        </div>

        <!-- Área de Exibição das Tarefas -->
        <div class="card">
            <h2>Minhas Tarefas</h2>
            <ul id="containerTarefas" class="lista-tarefas">
                <!-- As tarefas serão inseridas aqui dinamicamente pelo JavaScript -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
