<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Sistema de Controle de Estoque</h1>
    </header>

    <main class="container">
        <!-- FORMULÁRIO DE CADASTRO -->
        <section class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-cadastro">
                <div class="form-group">
                    <label for="desc">Descrição:</label>
                    <input type="text" id="desc" placeholder="Ex: Mouse Gamer" required>
                </div>
                <div class="form-group-row">
                    <div class="form-group">
                        <label for="qtd">Quantidade:</label>
                        <input type="number" id="qtd" min="0" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label for="val">Valor Unitário (R$):</label>
                        <input type="number" id="val" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>
                </div>
                <button type="submit" class="btn-success">Cadastrar Produto</button>
            </form>
        </section>

        <!-- OPERAÇÕES DE ATUALIZAÇÃO -->
        <section class="card-grid">
            <div class="card">
                <h2>Atualizar Preço</h2>
                <div class="form-group-row">
                    <input type="number" id="id-preco" placeholder="ID do Prod.">
                    <input type="number" id="novo-preco" step="0.01" placeholder="Novo Preço (R$)">
                </div>
                <button onclick="alterarPreçoWeb()" class="btn-primary">Atualizar Valor</button>
            </div>

            <div class="card">
                <h2>Movimentar Estoque</h2>
                <div class="form-group-row">
                    <input type="number" id="id-qtd" placeholder="ID do Prod.">
                    <input type="number" id="variacao-qtd" placeholder="Qtd (Ex: 5 ou -3)">
                </div>
                <button onclick="alterarQuantidadeWeb()" class="btn-primary">Atualizar Qtd</button>
            </div>
        </section>

        <!-- TABELA DE PRODUTOS -->
        <section class="card">
            <h2>Produtos em Estoque</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Preço Unitário</th>
                            <th>Total em Estoque</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos">
                        <!-- Linhas inseridas dinamicamente via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
