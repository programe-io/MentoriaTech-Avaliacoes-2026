<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Instagram - Spider-Man</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="insta-container">
        <!-- Cabeçalho do Perfil -->
        <header class="profile-header">
            <div class="profile-photo">
                <img src="https://unsplash.com" alt="Spider-Man Profile">
            </div>
            <section class="profile-info">
                <div class="username-row">
                    <h2>spiderman</h2>
                    <button class="follow-btn">Seguir</button>
                </div>
                <div class="stats-row">
                    <span><strong>3</strong> publicações</span>
                    <span><strong>15.2M</strong> seguidores</span>
                    <span><strong>115</strong> seguindo</span>
                </div>
                <div class="bio">
                    <h1>Seu Amigo da Vizinhança</h1>
                    <p>Apenas um garoto do Queens fazendo o seu melhor. 🕷️🕸️</p>
                    <p>Com grandes poderes vêm grandes responsabilidades.</p>
                </div>
            </section>
        </header>

        <!-- Abas de Conteúdo -->
        <div class="profile-tabs">
            <span class="active-tab">PUBLICAÇÕES</span>
            <span>REELS</span>
            <span>MARCADOS</span>
        </div>

        <!-- Grid de Fotos -->
        <main class="photo-grid">
            <div class="grid-item">
                <img src="https://unsplash.com" alt="Homem-Aranha no Prédio">
                <div class="overlay">❤️ 3.5M 💬 98K</div>
            </div>
            <div class="grid-item">
                <img src="https://unsplash.com" alt="Máscara Detalhada">
                <div class="overlay">❤️ 2.9M 💬 64K</div>
            </div>
            <div class="grid-item">
                <img src="https://unsplash.com" alt="Aranha em Nova York">
                <div class="overlay">❤️ 4.1M 💬 120K</div>
            </div>
        </main>
    </div>
<script src="script.js"></script></body>
</html>
