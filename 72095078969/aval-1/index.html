<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Sistema de Estoque</h1>

        <!-- Cadastro de produto -->
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="codigo">Código:</label>
                    <input type="number" id="codigo" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição:</label>
                    <input type="text" id="descricao" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" min="0" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor:</label>
                    <input type="number" id="valor" min="0" step="0.01" required>
                </div>

                <button type="submit">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Alterações -->
        <section class="card">
            <h2>Alterar Produto</h2>

            <div class="alteracoes">
                <div class="campo">
                    <label for="codigoAlterar">Código:</label>
                    <input type="number" id="codigoAlterar">
                </div>

                <div class="campo">
                    <label for="novoValor">Novo Valor:</label>
                    <input type="number" id="novoValor" min="0" step="0.01">
                </div>

                <button onclick="alterarValor()">Alterar Valor</button>
            </div>

            <div class="alteracoes">
                <div class="campo">
                    <label for="novaQuantidade">Nova Quantidade:</label>
                    <input type="number" id="novaQuantidade" min="0">
                </div>

                <button onclick="alterarQuantidade()">Alterar Quantidade</button>
            </div>
        </section>

        <!-- Lista de produtos -->
        <section class="card">
            <h2>Produtos no Estoque</h2>

            <div id="mensagem"></div>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor Unitário</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                    <!-- Produtos serão inseridos pelo JavaScript -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
