
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mani Grafite Social</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                <header>
                    <h1>MANI <span>GRAFITE</span></h1>
                        <p>Uma rede social para quem vive a arte urbana!</p>
                        </header>

                        <nav>
                            <a href="#inicio">🏠 Início</a>
                                <a href="#publicar">➕ Publicar</a>
                                    <a href="#perfil">👤 Perfil</a>
                                    </nav>

                                    <main>

                                        <section id="inicio">
                                                <h2>Feed de artistas</h2>
                                                        <div id="feed"></div>
                                                            </section>

                                                                <section id="publicar">
                                                                        <h2>Compartilhe sua arte</h2>

                                                                                <form id="postForm">
                                                                                            <input type="text" id="autor"
                                                                                                               placeholder="Nome do artista" required>

                                                                                                                           <textarea id="legenda"
                                                                                                                                                 placeholder="Escreva sobre seu grafite..."
                                                                                                                                                                       required></textarea>

                                                                                                                                                                                   <input type="url" id="imagem"
                                                                                                                                                                                                      placeholder="Link da imagem (URL)">

                                                                                                                                                                                                                  <label for="arquivo">Ou escolha uma imagem:</label>
                                                                                                                                                                                                                              <input type="file" id="arquivo" accept="image/*">

                                                                                                                                                                                                                                          <button type="submit">Publicar arte 🎨</button>
                                                                                                                                                                                                                                                  </form>
                                                                                                                                                                                                                                                      </section>

                                                                                                                                                                                                                                                          <section id="perfil">
                                                                                                                                                                                                                                                                  <h2>Meu perfil</h2>
                                                                                                                                                                                                                                                                          <div class="perfil-card">
                                                                                                                                                                                                                                                                                      <div class="avatar">🎨</div>
                                                                                                                                                                                                                                                                                                  <h3>Artista Urbano</h3>
                                                                                                                                                                                                                                                                                                              <p>Amante da arte, criatividade e cultura de rua.</p>
                                                                                                                                                                                                                                                                                                                          <p>Publicações: <strong id="totalPosts">0</strong></p>
                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                      </section>

                                                                                                                                                                                                                                                                                                                                      </main>

                                                                                                                                                                                                                                                                                                                                      <footer>
                                                                                                                                                                                                                                                                                                                                          <p>© 2026 Mani Grafite Social</p>
                                                                                                                                                                                                                                                                                                                                              <p>A rua é nossa tela!</p>
                                                                                                                                                                                                                                                                                                                                              </footer>

                                                                                                                                                                                                                                                                                                                                              <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                              <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                              </html>
