
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="app">
    <aside class="sidebar">
        <header>
            <h2>WhatsApp</h2>
            <span>⋮</span>
        </header>

        <input type="text" id="pesquisa"
        placeholder="Pesquisar conversa...">

        <div class="contatos" id="contatos">
            <div class="contato ativo" onclick="abrirChat('João')">
                <div class="avatar">J</div>
                <div>
                    <h3>João</h3>
                    <p>Oi, tudo bem?</p>
                </div>
            </div>

            <div class="contato" onclick="abrirChat('Maria')">
                <div class="avatar rosa">M</div>
                <div>
                    <h3>Maria</h3>
                    <p>Vamos sair hoje?</p>
                </div>
            </div>

            <div class="contato" onclick="abrirChat('Pedro')">
                <div class="avatar azul">P</div>
                <div>
                    <h3>Pedro</h3>
                    <p>Até amanhã!</p>
                </div>
            </div>

            <div class="contato" onclick="abrirChat('Ana')">
                <div class="avatar roxo">A</div>
                <div>
                    <h3>Ana</h3>
                    <p>Bom dia!</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="chat">
        <header class="chat-header">
            <div class="avatar" id="avatarChat">J</div>
            <div>
                <h3 id="nomeChat">João</h3>
                <p>online</p>
            </div>
        </header>

        <div class="mensagens" id="mensagens">
            <div class="recebida">Oi, tudo bem?</div>
            <div class="enviada">Tudo sim! E você?</div>
            <div class="recebida">Estou bem também!</div>
        </div>

        <div class="entrada">
            <input type="text" id="mensagem"
            placeholder="Digite uma mensagem...">
            <button onclick="enviarMensagem()">➤</button>
        </div>
    </main>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
