
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagam - Rede Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Instagam ✦</h1>

    <input type="text" id="pesquisa"
    placeholder="Pesquisar publicações...">

    <button onclick="abrirModal()">＋ Criar</button>
</header>

<main>

    <section class="stories">
        <h2>Stories</h2>
        <div class="story-list">
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=1">
                <p>Maria</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=2">
                <p>Pedro</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=3">
                <p>Ana</p>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=4">
                <p>Lucas</p>
            </div>
        </div>
    </section>

    <section class="feed">
        <h2>Publicações</h2>

        <div id="publicacoes">

            <article class="post">
                <div class="usuario">
                    <img src="https://i.pravatar.cc/100?img=1">
                    <strong>maria_silva</strong>
                </div>

                <img class="foto"
                src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800">

                <div class="acoes">
                    <button onclick="curtir(this)">♡ Curtir</button>
                    <button onclick="comentar(this)">💬 Comentar</button>
                </div>

                <p class="legenda">
                    <strong>maria_silva</strong>
                    Aproveitando o dia! ☀️
                </p>

                <p class="contador">0 curtidas</p>
                <div class="comentarios"></div>
            </article>

            <article class="post">
                <div class="usuario">
                    <img src="https://i.pravatar.cc/100?img=2">
                    <strong>pedro_oficial</strong>
                </div>

                <img class="foto"
                src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=800">

                <div class="acoes">
                    <button onclick="curtir(this)">♡ Curtir</button>
                    <button onclick="comentar(this)">💬 Comentar</button>
                </div>

                <p class="legenda">
                    <strong>pedro_oficial</strong>
                    Uma vista incrível! 🌆
                </p>

                <p class="contador">0 curtidas</p>
                <div class="comentarios"></div>
            </article>

        </div>
    </section>

</main>

<div id="modal" class="modal">
    <div class="modal-conteudo">
        <button class="fechar" onclick="fecharModal()">×</button>

        <h2>Nova publicação</h2>

        <input type="text" id="nome"
        placeholder="Seu nome">

        <input type="text" id="imagem"
        placeholder="URL da imagem">

        <textarea id="legenda"
        placeholder="Escreva uma legenda..."></textarea>

        <button onclick="publicar()">Compartilhar</button>
    </div>
</div>

<footer>
    <p>© 2026 Instagam - Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
