<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  
</head>
<body>
  <div class="game">
      <header class="topo">
          <div>
                <h1>🎯 Desafio do Clique</h1>
                      <p>Acerta o alvo o máximo de vezes antes do tempo acabar!</p>
                          </div>
                              <button id="btnTema">🌙</button>
                                </header>

                                  <div class="placar">
                                      <div>
                                            <span>Pontos</span>
                                                  <strong id="pontos">0</strong>
                                                      </div>

                                                          <div>
                                                                <span>Tempo</span>
                                                                      <strong id="tempo">30</strong>
                                                                          </div>

                                                                              <div>
                                                                                    <span>Combo</span>
                                                                                          <strong id="combo">0</strong>
                                                                                              </div>

                                                                                                  <div>
                                                                                                        <span>Recorde</span>
                                                                                                              <strong id="recorde">0</strong>
                                                                                                                  </div>
                                                                                                                    </div>

                                                                                                                      <div class="barra">
                                                                                                                          <div id="progresso"></div>
                                                                                                                            </div>

                                                                                                                              <main id="arena">
                                                                                                                                  <div id="inicio" class="tela">
                                                                                                                                        <div class="icone">🎮</div>
                                                                                                                                              <h2>Pronto para jogar?</h2>
                                                                                                                                                    <p>Clique no alvo o mais rápido que conseguir.</p>
                                                                                                                                                          <button id="btnComecar" class="botao">COMEÇAR JOGO</button>
                                                                                                                                                              </div>

                                                                                                                                                                  <button id="alvo">🎯</button>

                                                                                                                                                                      <div id="fim" class="tela escondido">
                                                                                                                                                                            <div class="icone">🏆</div>
                                                                                                                                                                                  <h2>Fim de jogo!</h2>
                                                                                                                                                                                        <p>Sua pontuação foi:</p>
                                                                                                                                                                                              <strong id="pontuacaoFinal">0</strong>
                                                                                                                                                                                                    <p id="mensagemFinal"></p>
                                                                                                                                                                                                          <button id="btnNovamente" class="botao">JOGAR NOVAMENTE</button>
                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                  <footer>
                                                                                                                                                                                                                      <span>Desafio do Clique</span>
                                                                                                                                                                                                                          <span>Feito com HTML, CSS e JavaScript</span>
                                                                                                                                                                                                                            </footer>
                                                                                                                                                                                                                            </div>
  
  
</body>
</html>
