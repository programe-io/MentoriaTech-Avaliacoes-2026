
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Tarefas</title>
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Gerenciamento de Tarefas</h1>

    <h2>Cadastrar Nova Tarefa</h2>

    <label>Código:</label>
    <input type="number" id="codigo" placeholder="Digite o código">

    <br><br>

    <label>Título:</label>
    <input type="text" id="titulo" placeholder="Digite o título">

    <br><br>

    <label>Prioridade:</label>
    <select id="prioridade">
        <option value="">Selecione</option>
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <br><br>

    <button onclick="cadastrarTarefa()">Cadastrar Tarefa</button>

    <hr>

    <h2>Tarefas Cadastradas</h2>

    <button onclick="listarTarefas()">Listar Tarefas</button>

    <div id="lista"></div>

    <hr>

    <h2>Marcar Tarefa como Concluída</h2>

    <input type="number" id="codigoConcluir" placeholder="Código da tarefa">

    <button onclick="concluirTarefa()">Concluir Tarefa</button>

    <hr>

    <h2>Alterar Prioridade</h2>

    <input type="number" id="codigoAlterar" placeholder="Código da tarefa">

    <select id="novaPrioridade">
        <option value="">Selecione a prioridade</option>
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="alterarPrioridade()">Alterar Prioridade</button>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
