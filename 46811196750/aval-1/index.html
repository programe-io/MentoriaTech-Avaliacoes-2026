
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Sistema de Estoque</h1>

    <h2>Cadastrar Produto</h2>

    <label>Código:</label>
    <input type="number" id="codigo"><br><br>

    <label>Descrição:</label>
    <input type="text" id="descricao"><br><br>

    <label>Quantidade:</label>
    <input type="number" id="quantidade"><br><br>

    <label>Valor:</label>
    <input type="number" id="valor" step="0.01"><br><br>

    <button onclick="cadastrar()">Cadastrar Produto</button>

    <hr>

    <h2>Produtos Cadastrados</h2>

    <button onclick="listar()">Listar Produtos</button>

    <div id="lista"></div>

    <hr>

    <h2>Alterar Valor</h2>

    <input type="number" id="codigoValor" placeholder="Código do produto">
    <input type="number" id="novoValor" placeholder="Novo valor" step="0.01">

    <button onclick="alterarValor()">Alterar Valor</button>

    <hr>

    <h2>Alterar Quantidade</h2>

    <input type="number" id="codigoQuantidade" placeholder="Código do produto">
    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    <script>

        let produtos = [];

        function cadastrar() {

            let codigo = Number(document.getElementById("codigo").value);
            let descricao = document.getElementById("descricao").value;
            let quantidade = Number(document.getElementById("quantidade").value);
            let valor = Number(document.getElementById("valor").value);

            if (!codigo || !descricao || quantidade < 0 || valor < 0) {
                alert("Preencha os campos corretamente!");
                return;
            }

            produtos.push({
                codigo,
                descricao,
                quantidade,
                valor
            });

            alert("Produto cadastrado com sucesso!");

            document.getElementById("codigo").value = "";
            document.getElementById("descricao").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("valor").value = "";
        }

        function listar() {

            let lista = document.getElementById("lista");

            lista.innerHTML = "";

            produtos.forEach(function(produto) {

                lista.innerHTML += `
                    <p>
                        Código: ${produto.codigo}<br>
                        Descrição: ${produto.descricao}<br>
                        Quantidade: ${produto.quantidade}<br>
                        Valor: R$ ${produto.valor.toFixed(2)}
                    </p>
                    <hr>
                `;

            });

        }

        function alterarValor() {

            let codigo = Number(document.getElementById("codigoValor").value);

            let produto = produtos.find(p => p.codigo === codigo);

            if (produto) {

                let novoValor = Number(document.getElementById("novoValor").value);

                produto.valor = novoValor;

                alert("Valor alterado com sucesso!");

            } else {

                alert("Produto não encontrado!");

            }

        }

        function alterarQuantidade() {

            let codigo = Number(document.getElementById("codigoQuantidade").value);

            let produto = produtos.find(p => p.codigo === codigo);

            if (produto) {

                let novaQuantidade = Number(document.getElementById("novaQuantidade").value);

                produto.quantidade = novaQuantidade;

                alert("Quantidade alterada com sucesso!");

            } else {

                alert("Produto não encontrado!");

            }

        }

    </script>

<script src="script.js"></script></body>
</html>
