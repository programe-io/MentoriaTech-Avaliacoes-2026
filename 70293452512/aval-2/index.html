<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaNotas 2.0</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>EducaNotas 2.0</h1>
    <p>Sistema de Gestão de Desempenho Escolar</p>
</header>

<main class="container">
    <section class="card">
        <h2>Cadastro de Alunos</h2>

        <form id="formulario">
            <label for="nome">Nome do aluno:</label>
            <input type="text" id="nome" required>

            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1" required>

            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1" required>

            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" min="0" max="10" step="0.1" required>

            <button type="submit">Cadastrar Aluno</button>
        </form>
    </section>

    <section class="card">
        <h2>Lista de Alunos</h2>
        <div id="listaAlunos">
            Nenhum aluno cadastrado.
        </div>
    </section>
</main>

<footer>
    <p>EducaNotas 2.0 - Mentoria Tech</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
