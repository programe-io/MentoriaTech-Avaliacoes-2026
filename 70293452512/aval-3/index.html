<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaNotas 3.0</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>EducaNotas 3.0</h1>
    <p>Painel Inteligente de Gestão Escolar</p>
</header>

<main class="container">

    <section class="card">
        <h2>Cadastrar Estudante</h2>

        <form id="formulario">
            <label for="nome">Nome do aluno:</label>
            <input type="text" id="nome" required>

            <label for="nota1">Primeira nota:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1" required>

            <label for="nota2">Segunda nota:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1" required>

            <label for="nota3">Terceira nota:</label>
            <input type="number" id="nota3" min="0" max="10" step="0.1" required>

            <button type="submit">Salvar Cadastro</button>
        </form>
    </section>

    <section class="card">
        <h2>Painel de Desempenho</h2>

        <div class="estatisticas">
            <p>Total de alunos: <strong id="total">0</strong></p>
            <p>Aprovados: <strong id="aprovados">0</strong></p>
            <p>Recuperação: <strong id="recuperacao">0</strong></p>
            <p>Reprovados: <strong id="reprovados">0</strong></p>
        </div>

        <h2>Histórico de Alunos</h2>

        <div id="listaAlunos">
            Nenhum aluno cadastrado.
        </div>
    </section>

</main>

<footer>
    <p>EducaNotas 3.0 - Projeto Mentoria Tech</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
