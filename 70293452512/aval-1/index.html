<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaNotas - Gestão Escolar</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>EducaNotas</h1>
        <p>Sistema de Gestão de Notas Escolares</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Desempenho do Aluno</h2>
            <p>Preencha os dados para calcular a média.</p>

            <form id="formulario">
                <label for="nome">Nome do aluno:</label>
                <input type="text" id="nome"
                    placeholder="Digite seu nome" required>

                <label for="nota1">Primeira nota:</label>
                <input type="number" id="nota1"
                    min="0" max="10" step="0.1" required>

                <label for="nota2">Segunda nota:</label>
                <input type="number" id="nota2"
                    min="0" max="10" step="0.1" required>

                <label for="nota3">Terceira nota:</label>
                <input type="number" id="nota3"
                    min="0" max="10" step="0.1" required>

                <button type="submit">Calcular Média</button>
            </form>

            <div id="resultado" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        <p>EducaNotas © 2026 - Projeto Mentoria Tech</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
