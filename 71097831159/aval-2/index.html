<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Envio de Trabalhos</title> <link rel="stylesheet" href="style.css"> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head> <body> <header> <h1>📚 Portal de Trabalhos</h1> <p>Envie seu trabalho para avaliação</p> </header> <main class="container">
<section class="card">
  <h2>Enviar Trabalho</h2>
  <p class="descricao">
    Preencha os dados abaixo para enviar seu trabalho ao professor.
  </p>

  <form id="formulario">

    <label for="nome">Nome do aluno</label>
    <input
      type="text"
      id="nome"
      placeholder="Digite seu nome"
      required
    >

    <label for="turma">Turma</label>
    <input
      type="text"
      id="turma"
      placeholder="Ex: 2º Ano A"
      required
    >

    <label for="titulo">Título do trabalho</label>
    <input
      type="text"
      id="titulo"
      placeholder="Digite o título do trabalho"
      required
    >

    <label for="descricao">Descrição</label>
    <textarea
      id="descricao"
      placeholder="Digite uma breve descrição do trabalho"
      required
    ></textarea>

    <label for="arquivo">Arquivo do trabalho</label>
    <input
      type="file"
      id="arquivo"
      accept=".pdf,.doc,.docx,.zip"
      required
    >

    <button type="submit">
      📤 Enviar Trabalho
    </button>

  </form>

  <div id="mensagem"></div>
</section>

</main> <footer> <p>© 2026 Portal de Trabalhos</p> </footer> <script src="script.js"></script> <script src="script.js"></script></body> </html>
