<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <!-- Formulário de Cadastro -->
        <form id="form-tarefa" class="card">
            <h2>Nova Tarefa</h2>
            
            <div class="input-group">
                <label for="titulo">Título da Tarefa:</label>
                <input type="text" id="titulo" placeholder="Ex: Cadastrar Clientes (mín. 5 letras)" required>
            </div>

            <div class="input-group">
                <label for="prioridade">Prioridade:</label>
                <select id="prioridade">
                    <option value="1">1 - Alta</option>
                    <option value="2" selected>2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Cadastrar Tarefa</button>
            <p id="mensagem-erro" class="erro"></p>
        </form>

        <!-- Lista de Tarefas -->
        <div class="card">
            <h2>Suas Tarefas</h2>
            <ul id="lista-tarefas" class="lista">
                <!-- As tarefas serão inseridas aqui via JavaScript -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
