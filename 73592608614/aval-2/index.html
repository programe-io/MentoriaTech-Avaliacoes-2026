<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="app-container">
    <header>
      <h2>Painel de Tarefas</h2>
    </header>

    <section class="form-section">
      <h3>Nova Tarefa</h3>
      <form id="task-form">
        <div class="field">
          <label for="task-title">Título</label>
          <input type="text" id="task-title" placeholder="Ex: Cadastrar clientes" required>
        </div>
        <div class="field">
          <label for="task-priority">Prioridade</label>
          <input type="number" id="task-priority" placeholder="1 a 3" min="1" required>
        </div>
        <button type="submit" class="btn-primary">+ Cadastrar</button>
      </form>
    </section>

    <section class="filter-section">
      <input type="number" id="search-code" placeholder="Código da tarefa">
      <button id="btn-search">Buscar</button>
      <button id="btn-complete" class="btn-outline">Concluir</button>
      <button id="btn-list" class="btn-outline">Ver Todas</button>
    </section>

    <section class="list-section">
      <ul id="task-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
