<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FF Arena Feed - Comunidade Free Fire</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0e14;
      color: #f1f5f9;
      line-height: 1.5;
    }

    header {
      background: linear-gradient(90deg, #131822, #1e2533);
      border-bottom: 2px solid #f59e0b;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      color: #f59e0b;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .logo span {
      color: #ffffff;
    }

    .container {
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* Formulário de Novo Post */
    .post-box {
      background-color: #151b26;
      border: 1px solid #283244;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .post-inputs {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    input, select, textarea {
      background-color: #0b0e14;
      border: 1px solid #283244;
      color: #ffffff;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #f59e0b;
    }

    .post-inputs input {
      flex: 1;
    }

    textarea {
      width: 100%;
      resize: vertical;
      min-height: 75px;
      margin-bottom: 10px;
    }

    .post-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-booyah {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .btn-booyah:hover {
      opacity: 0.9;
    }

    /* Filtros */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-btn {
      background-color: #151b26;
      border: 1px solid #283244;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .filter-btn.active {
      background-color: #f59e0b;
      color: #0b0e14;
      border-color: #f59e0b;
    }

    /* Cards do Feed */
    .feed-card {
      background-color: #151b26;
      border: 1px solid #283244;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #dc2626);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }

    .nick {
      font-weight: bold;
      font-size: 1rem;
    }

    .rank-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 6px;
      background-color: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.4);
      margin-left: 6px;
    }

    .category-tag {
      font-size: 0.75rem;
      background-color: #1e293b;
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
    }

    .card-text {
      color: #e2e8f0;
      margin-bottom: 14px;
      font-size: 0.98rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #283244;
      padding-top: 12px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .like-btn {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .like-btn.liked {
      background-color: rgba(245, 158, 11, 0.2);
      border-color: #f59e0b;
      color: #f59e0b;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="logo">FF <span>Arena Feed</span></div>
      <span style="font-size: 0.85rem; color: #22c55e;">● Servidor BR Online</span>
    </div>
  </header>

  <main class="container">
    <!-- Caixa de Publicação -->
    <section class="post-box">
      <div class="post-inputs">
        <input type="text" id="nickInput" placeholder="Seu Nickname

  
  
</body>
</html>
