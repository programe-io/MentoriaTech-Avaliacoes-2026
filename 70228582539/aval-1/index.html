
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Página Web</title>

    <style>
        /* Estilo geral */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Cabeçalho */
        header {
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
        }

        header h1 {
            font-size: 28px;
        }

        /* Menu */
        nav {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.08);
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #93c5fd;
        }

        /* Conteúdo principal */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #e2e8f0;
        }

        /* Botão */
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        #mensagem {
            margin-top: 20px;
            font-weight: bold;
            color: #93c5fd;
        }

        /* Rodapé */
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.25);
            color: #cbd5e1;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            header h1 {
                font-size: 23px;
            }

            nav {
                gap: 15px;
                flex-wrap: wrap;
            }

            .card {
                padding: 25px;
            }

            .card h2 {
                font-size: 25px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <header>
        <h1>Minha Página Web</h1>
    </header>

    <nav>
        <a href="#inicio">Início</a>
        <a href="#sobre">Sobre</a>
        <a href="#contato">Contato</a>
    </nav>

    <main id="inicio">
        <section class="card" id="sobre">
            <h2>Bem-vindo!</h2>

            <p>
                Esta é minha primeira página HTML.
                Ela possui um design moderno, funciona
                em celulares e computadores e tem
                um botão interativo.
            </p>

            <button onclick="mostrarMensagem()">
                Clique aqui
            </button>

            <div id="mensagem" aria-live="polite"></div>
        </section>
    </main>

    <footer id="contato">
        <p>&copy; <span id="ano"></span> Minha Página Web.
        Todos os direitos reservados.</p>
    </footer>

    <script>
        // Mostra uma mensagem ao clicar no botão
        function mostrarMensagem() {
            document.getElementById("mensagem").textContent =
                "Olá! Obrigado por visitar minha página!";
        }

        // Atualiza automaticamente o ano do rodapé
        document.getElementById("ano").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
