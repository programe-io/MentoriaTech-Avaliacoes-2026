
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Gamer</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🎮 Loja Gamer</h1>
    <div>🛒 Carrinho: <span id="itens">0</span> itens</div>
</header>

<main>
    <section class="produtos" id="produtos">

        <div class="produto" data-id="0">
            <img src="https://images.unsplash.com/photo-1598300056393-4aac492f4344?w=500" alt="Cadeira gamer">
            <h2>Cadeira Gamer</h2>
            <p>R$ 899,00</p>
            <div class="quantidade">
                <button onclick="alterar(0,-1)">-</button>
                <span id="qtd-0">1</span>
                <button onclick="alterar(0,1)">+</button>
            </div>
            <button class="adicionar" onclick="adicionar(0)">Adicionar ao carrinho</button>
        </div>

        <div class="produto" data-id="1">
            <img src="https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=500" alt="Monitor">
            <h2>Monitor Gamer</h2>
            <p>R$ 1.299,00</p>
            <div class="quantidade">
                <button onclick="alterar(1,-1)">-</button>
                <span id="qtd-1">1</span>
                <button onclick="alterar(1,1)">+</button>
            </div>
            <button class="adicionar" onclick="adicionar(1)">Adicionar ao carrinho</button>
        </div>

        <div class="produto" data-id="2">
            <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500" alt="Teclado">
            <h2>Teclado Mecânico</h2>
            <p>R$ 299,00</p>
            <div class="quantidade">
                <button onclick="alterar(2,-1)">-</button>
                <span id="qtd-2">1</span>
                <button onclick="alterar(2,1)">+</button>
            </div>
            <button class="adicionar" onclick="adicionar(2)">Adicionar ao carrinho</button>
        </div>

        <div class="produto" data-id="3">
            <img src="https://images.unsplash.com/photo-1527814050087-3793815479db?w=500" alt="Mouse">
            <h2>Mouse Gamer</h2>
            <p>R$ 149,00</p>
            <div class="quantidade">
                <button onclick="alterar(3,-1)">-</button>
                <span id="qtd-3">1</span>
                <button onclick="alterar(3,1)">+</button>
            </div>
            <button class="adicionar" onclick="adicionar(3)">Adicionar ao carrinho</button>
        </div>

    </section>

    <section class="resumo">
        <h2>🛒 Meu Carrinho</h2>
        <div id="listaCarrinho">Nenhum produto adicionado.</div>
        <hr>
        <p>Quantidade de itens: <strong id="itensResumo">0</strong></p>
        <h2>Total: <span id="valorTotal">R$ 0,00</span></h2>
        <button class="finalizar" onclick="finalizarCompra()">
            Finalizar compra
        </button>
        <button class="limpar" onclick="limparCarrinho()">
            Limpar carrinho
        </button>
    </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
