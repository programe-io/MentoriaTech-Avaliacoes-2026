
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Loja Online</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #0f172a;
    color: white;
    padding: 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    font-size: 25px;
}

.carrinho-topo {
    background: #16a34a;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: bold;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 15px;
}

h2 {
    margin-bottom: 20px;
}

.produtos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.produto {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 12px #00000012;
    transition: 0.3s;
}

.produto:hover {
    transform: translateY(-5px);
}

.imagem {
    background: #e2e8f0;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 65px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.produto h3 {
    margin-bottom: 10px;
}

.preco {
    color: #16a34a;
    font-size: 23px;
    font-weight: bold;
    margin: 12px 0;
}

.estoque {
    color: #64748b;
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    margin-bottom: 12px;
}

button {
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.adicionar {
    width: 100%;
    background: #16a34a;
    color: white;
}

.adicionar:hover {
    background: #15803d;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.carrinho {
    background: white;
    padding: 25px;
    margin-top: 35px;
    border-radius: 15px;
    box-shadow: 0 3px 12px #00000012;
}

.item-carrinho {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 15px 0;
    border-bottom: 1px solid #e2e8f0;
    flex-wrap: wrap;
}

.controles {
    display: flex;
    align-items: center;
    gap: 10px;
}

.controles button {
    background: #e2e8f0;
    padding: 8px 12px;
}

.remover {
    background: #fee2e2 !important;
    color: #dc2626;
}

.total {
    background: #0f172a;
    color: white;
    padding: 22px;
    border-radius: 12px;
    margin-top: 20px;
}

.total h2 {
    color: #22c55e;
    font-size: 30px;
    margin-top: 10px;
}

.finalizar {
    background: #16a34a;
    color: white;
    width: 100%;
    margin-top: 15px;
    font-size: 17px;
    padding: 16px;
}

.vazio {
    color: #64748b;
    padding: 20px 0;
}

@media(max-width: 600px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    .item-carrinho {
        flex-direction: column;
        align-items: flex-start;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header>
    <h1>🛒 Minha Loja Online</h1>
    <div class="carrinho-topo">
        Carrinho: <span id="contador">0</span> itens
    </div>
</header>

<div class="container">

    <h2>🛍️ Nossos Produtos</h2>

    <div class="produtos" id="produtos"></div>

    <section class="carrinho">

        <h2>🛒 Meu Carrinho</h2>

        <div id="listaCarrinho">
            <p class="vazio">Seu carrinho está vazio.</p>
        </div>

        <div class="total">
            <p>Quantidade total: <span id="quantidadeTotal">0</span></p>
            <h2 id="valorTotal">R$ 0,00</h2>
            <button class="finalizar" onclick="finalizarCompra()">
                FINALIZAR COMPRA
            </button>
        </div>

    </section>
</div>

<script>

// PRODUTOS DA LOJA

let produtos = [
    {
        id: 1,
        nome: "Smartphone",
        preco: 1500,
        estoque: 20,
        emoji: "📱"
    },
    {
        id: 2,
        nome: "Notebook",
        preco: 3500,
        estoque: 10,
        emoji: "💻"
    },
    {
        id: 3,
        nome: "Fone Bluetooth",
        preco: 150,
        estoque: 30,
        emoji: "🎧"
    },
    {
        id: 4,
        nome: "Relógio",
        preco: 250,
        estoque: 15,
        emoji: "⌚"
    },
    {
        id: 5,
        nome: "Teclado Gamer",
        preco: 300,
        estoque: 12,
        emoji: "⌨️"
    },
    {
        id: 6,
        nome: "Mouse Gamer",
        preco: 120,
        estoque: 25,
        emoji: "🖱️"
    }
];

let carrinho = [];

// FORMATAÇÃO DO DINHEIRO

function dinheiro(valor) {
    return valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

// MOSTRAR PRODUTOS

function mostrarProdutos() {

    const area = document.getElementById("produtos");

    area.innerHTML = "";

    produtos.forEach(produto => {

        area.innerHTML += `
            <div class="produto">

                <div class="imagem">${produto.emoji}</div>

                <h3>${produto.nome}</h3>

                <p class="preco">
                    ${dinheiro(produto.preco)}
                </p>

                <p class="estoque">
                    Estoque disponível: 
                    <strong>${produto.estoque}</strong>
                </p>

                <input
                    type="number"
                    id="qtd-${produto.id}"
                    value="1"
                    min="1"
                    max="${produto.estoque}"
                    placeholder="Quantidade"
                    ${produto.estoque === 0 ? "disabled" : ""}
                >

                <button
                    class="adicionar"
                    onclick="adicionarCarrinho(${produto.id})"
                    ${produto.estoque === 0 ? "disabled" : ""}
                >
                    ${produto.estoque === 0 ? "ESGOTADO" : "ADICIONAR AO CARRINHO"}
                </button>

            </div>
        `;
    });
}

// ADICIONAR PRODUTO

function adicionarCarrinho(id) {

    const produto = produtos.find(p => p.id === id);

    const campo = document.getElementById("qtd-" + id);

    const quantidade = Number(campo.value);

    if (!Number.isInteger(quantidade) || quantidade <= 0) {
        alert("Digite uma quantidade válida!");
        return;
    }

    if (quantidade > produto.estoque) {
        alert("Estoque insuficiente!");
        return;
    }

    let item = carrinho.find(p => p.id === id);

    if (item) {
        item.quantidade += quantidade;
    } else {
        carrinho.push({
            id: id,
            quantidade: quantidade
        });
    }

    produto.estoque -= quantidade;

    mostrarProdutos();
    atualizarCarrinho();
}

// ATUALIZAR CARRINHO

function atualizarCarrinho() {

    const lista = document.getElementById("listaCarrinho");

    lista.innerHTML = "";

    let total = 0;
    let quantidadeTotal = 0;

    if (carrinho.length === 0) {
        lista.innerHTML = '<p class="vazio">Seu carrinho está vazio.</p>';
    }

    carrinho.forEach(item => {

        const produto = produtos.find(p => p.id === item.id);

        const subtotal = produto.preco * item.quantidade;

        total += subtotal;
        quantidadeTotal += item.quantidade;

        lista.innerHTML += `

            <div class="item-carrinho">

                <div>
                    <strong>${produto.emoji} ${produto.nome}</strong>
                    <p>${dinheiro(produto.preco)} cada</p>
                    <p>Subtotal: ${dinheiro(subtotal)}</p>
                </div>

                <div class="controles">

                    <button onclick="alterarQuantidade(${item.id}, -1)">
                        -
                    </button>

                    <strong>${item.quantidade}</strong>

                    <button onclick="alterarQuantidade(${item.id}, 1)">
                        +
                    </button>

                    <button class="remover"
                        onclick="removerProduto(${item.id})">
                        Remover
                    </button>

                </div>

            </div>
        `;
    });

    document.getElementById("contador").innerText = quantidadeTotal;

    document.getElementById("quantidadeTotal").innerText = quantidadeTotal;

    document.getElementById("valorTotal").innerText = dinheiro(total);

}

// AUMENTAR OU DIMINUIR QUANTIDADE

function alterarQuantidade(id, valor) {

    const produto = produtos.find(p => p.id === id);

    const item = carrinho.find(p => p.id === id);

    if (valor > 0) {

        if (produto.estoque <= 0) {
            alert("Não há mais produtos no estoque!");
            return;
        }

        item.quantidade++;
        produto.estoque--;

    } else {

        item.quantidade--;
        produto.estoque++;

        if (item.quantidade <= 0) {
            carrinho = carrinho.filter(p => p.id !== id);
        }
    }

    mostrarProdutos();
    atualizarCarrinho();
}

// REMOVER PRODUTO

function removerProduto(id) {

    const item = carrinho.find(p => p.id === id);

    const produto = produtos.find(p => p.id === id);

    produto.estoque += item.quantidade;

    carrinho = carrinho.filter(p => p.id !== id);

    mostrarProdutos();
    atualizarCarrinho();
}

// FINALIZAR COMPRA

function finalizarCompra() {

    if (carrinho.length === 0) {
        alert("Adicione produtos ao carrinho primeiro!");
        return;
    }

    let total = 0;

    carrinho.forEach(item => {

        const produto = produtos.find(p => p.id === item.id);

        total += produto.preco * item.quantidade;

    });

    alert(
        "COMPRA FINALIZADA!\n\n" +
        "Quantidade de produtos: " +
        carrinho.reduce((soma, item) => soma + item.quantidade, 0) +
        "\nValor total: " + dinheiro(total)
    );

    carrinho = [];

    atualizarCarrinho();
    mostrarProdutos();
}

// INICIALIZAR SISTEMA

mostrarProdutos();
atualizarCarrinho();

</script>

</body>
</html>
