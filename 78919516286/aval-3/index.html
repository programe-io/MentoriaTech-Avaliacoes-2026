<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Interativo</title>
    <!-- Ligação com o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="counter-container">
        <h1>Contador</h1>
        <div id="value">0</div>
        
        <div class="button-group">
            <button id="btn-decrease" class="btn">Diminuir</button>
            <button id="btn-reset" class="btn">Resetar</button>
            <button id="btn-increase" class="btn">Aumentar</button>
        </div>
    </div>

    <!-- Ligação com o arquivo JavaScript externo -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
