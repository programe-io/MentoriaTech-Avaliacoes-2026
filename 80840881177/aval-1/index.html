<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exemplo de Página</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #121f3d;
      color: #fff;
    }
    nav {
      background-color: #1e2a5a;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: #a0c4ff;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .container {
      display: flex;
      max-width: 1200px;
      margin: 20px auto;
      gap: 20px;
    }
    aside {
      flex: 1;
      background-color: #223366;
      padding: 15px;
      border-radius: 8px;
    }
    aside .fakeimg {
      background-color: #445588;
      height: 100px;
      margin: 10px 0;
      border-radius: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ccc;
      font-style: italic;
    }
    main {
      flex: 3;
      background-color: #223366;
      padding: 15px;
      border-radius: 8px;
    }
    main .fakeimg {
      background-color: #445588;
      height: 200px;
      margin: 10px 0;
      border-radius: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ccc;
      font-style: italic;
    }
    footer {
      background-color: #1e2a5a;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      font-size: 1.2em;
      font-weight: bold;
      border-top: 1px solid #334477;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="#">Pagina 2</a>
    <a href="#">Pagina 3</a>
    <a href="#">Pagina 4</a>
  </nav>

  <div class="container">
    <aside>
      <h2>Sobre</h2>
      <h5>Fotinha</h5>
      <div class="fakeimg">Imagem</div>
      <p>Minha Bio</p>
      <h3>Minha Galeria</h3>
      <p>Algum texto legal aqui</p>
      <div class="fakeimg">Imagem</div>
      <div class="fakeimg">Imagem</div>
      <div class="fakeimg">Imagem</div>
    </aside>

    <main>
      <article>
        <h2>TITULO DA POSTAGEM</h2>
        <h5>Jonathan, Jun 22, 2023</h5>
        <div class="fakeimg">Imagem</div>
        <p>Algum texto...</p>
        <p>Descrição completa.</p>
      </article>
    </main>
  </div>

  <footer>
    <h2>Footer</h2>
  </footer>

</body>
</html>
