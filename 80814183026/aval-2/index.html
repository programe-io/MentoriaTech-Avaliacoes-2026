<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SocialFeed</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
  <div class="logo">socialfeed</div>
  <input class="search" placeholder="Pesquisar no SocialFeed">
  <div style="font-size:22px">🔔 💬 👤</div>
</header>

<div class="container">
  <div class="stories" id="stories">
    <div class="story" onclick="addStory()"><img src="https://i.pravatar.cc/100?img=1"><p>Você +</p></div>
    <div class="story"><img src="https://i.pravatar.cc/100?img=5"><p>Ana</p></div>
    <div class="story"><img src="https://i.pravatar.cc/100?img=8"><p>Marcos</p></div>
    <div class="story"><img src="https://i.pravatar.cc/100?img=12"><p>Julia</p></div>
    <div class="story"><img src="https://i.pravatar.cc/100?img=15"><p>Pedro</p></div>
  </div>

  <div class="create">
    <img src="https://i.pravatar.cc/100?img=1">
    <input placeholder="No que você está pensando, João?" onclick="openModal()">
  </div>

  <div id="feed"></div>
</div>

<div id="newPostModal" class="modal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between"><h3>Criar publicação</h3><button onclick="closeModal()" class="x">X</button></div>
    <textarea id="newText" placeholder="O que você está pensando?"></textarea>
    <input id="newImg" placeholder="Link da imagem (opcional)">
    <button onclick="createPost()" class="btn-post">Publicar</button>
  </div>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
