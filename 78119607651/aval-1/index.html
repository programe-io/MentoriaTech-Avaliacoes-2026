<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <title>Jogo da Memória</title>

        <style>
            *{
                  margin:0;
                        padding:0;
                              box-sizing:border-box;
                                    font-family: Arial, sans-serif;
                                        }

                                            body{
                                                  background:#1e1e2f;
                                                        display:flex;
                                                              justify-content:center;
                                                                    align-items:center;
                                                                          min-height:100vh;
                                                                                flex-direction:column;
                                                                                      color:white;
                                                                                          }

                                                                                              h1{
                                                                                                    margin-bottom:20px;
                                                                                                        }

                                                                                                            .game{
                                                                                                                  display:grid;
                                                                                                                        grid-template-columns:repeat(4,100px);
                                                                                                                              gap:12px;
                                                                                                                                  }

                                                                                                                                      .card{
                                                                                                                                            width:100px;
                                                                                                                                                  height:100px;
                                                                                                                                                        background:#444;
                                                                                                                                                              border-radius:12px;
                                                                                                                                                                    display:flex;
                                                                                                                                                                          justify-content:center;
                                                                                                                                                                                align-items:center;
                                                                                                                                                                                      font-size:40px;
                                                                                                                                                                                            cursor:pointer;
                                                                                                                                                                                                  transform-style:preserve-3d;
                                                                                                                                                                                                        transition:0.4s;
                                                                                                                                                                                                              position:relative;
                                                                                                                                                                                                                  }

                                                                                                                                                                                                                      .card.flip{
                                                                                                                                                                                                                            transform:rotateY(180deg);
                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                    .front,
                                                                                                                                                                                                                                        .back{
                                                                                                                                                                                                                                              position:absolute;
                                                                                                                                                                                                                                                    width:100%;
                                                                                                                                                                                                                                                          height:100%;
                                                                                                                                                                                                                                                                display:flex;
                                                                                                                                                                                                                                                                      justify-content:center;
                                                                                                                                                                                                                                                                            align-items:center;
                                                                                                                                                                                                                                                                                  border-radius:12px;
                                                                                                                                                                                                                                                                                        backface-visibility:hidden;
                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                .front{
                                                                                                                                                                                                                                                                                                      background:#6c63ff;
                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                              .back{
                                                                                                                                                                                                                                                                                                                    background:white;
                                                                                                                                                                                                                                                                                                                          color:black;
                                                                                                                                                                                                                                                                                                                                transform:rotateY(180deg);
                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                        button{
                                                                                                                                                                                                                                                                                                                                              margin-top:20px;
                                                                                                                                                                                                                                                                                                                                                    padding:10px 20px;
                                                                                                                                                                                                                                                                                                                                                          border:none;
                                                                                                                                                                                                                                                                                                                                                                border-radius:8px;
                                                                                                                                                                                                                                                                                                                                                                      background:#6c63ff;
                                                                                                                                                                                                                                                                                                                                                                            color:white;
                                                                                                                                                                                                                                                                                                                                                                                  font-size:16px;
                                                                                                                                                                                                                                                                                                                                                                                        cursor:pointer;
                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                button:hover{
                                                                                                                                                                                                                                                                                                                                                                                                      background:#574bdb;
                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                                                                                            <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
                                                                                                                                                                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                                                                                                                                                                              <h1>🧠 Jogo da Memória</h1>

                                                                                                                                                                                                                                                                                                                                                                                                                <div class="game" id="game"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                  <button onclick="startGame()">Reiniciar</button>

                                                                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                        const emojis = ["🍕","🍔","🍟","🌮","🍩","🍎","🍉","🍓"];
                                                                                                                                                                                                                                                                                                                                                                                                                            let cards = [...emojis, ...emojis];

                                                                                                                                                                                                                                                                                                                                                                                                                                const game = document.getElementById("game");

                                                                                                                                                                                                                                                                                                                                                                                                                                    let firstCard = null;
                                                                                                                                                                                                                                                                                                                                                                                                                                        let secondCard = null;
                                                                                                                                                                                                                                                                                                                                                                                                                                            let lockBoard = false;

                                                                                                                                                                                                                                                                                                                                                                                                                                                function shuffle(array){
                                                                                                                                                                                                                                                                                                                                                                                                                                                      return array.sort(() => Math.random() - 0.5);
                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                              function createCard(emoji){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const card = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          card.classList.add("card");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                card.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="front"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="back">${emoji}</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            card.dataset.emoji = emoji;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  card.addEventListener("click", flipCard);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return card;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function flipCard(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if(lockBoard) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(this === firstCard) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  this.classList.add("flip");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(!firstCard){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                firstCard = this;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    secondCard = this;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          checkMatch();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function checkMatch(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const isMatch =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                firstCard.dataset.emoji === secondCard.dataset.emoji;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if(isMatch){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              resetBoard();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            lockBoard = true;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    setTimeout(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              firstCard.classList.remove("flip");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        secondCard.classList.remove("flip");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  resetBoard();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }, 1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function resetBoard(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              [firstCard, secondCard] = [null, null];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    lockBoard = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function startGame(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  game.innerHTML = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        shuffle(cards).forEach(emoji => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const card = createCard(emoji);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        game.appendChild(card);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      startGame();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
