<!DOCTYPE html>
<html>
<head>
  <title>Jogo: Adivinhe o Número!</title>
  <link href="style.css" rel="stylesheet"></head>
  <body>
    <h1>🔢 Adivinhe o Número Secreto!</h1>
      <p>Eu pensei em um número entre 1 e 100. Tente adivinhar!</p>

        <input type="number" id="chute" placeholder="Digite seu palpite..." min="1" max="100">
          <button onclick="verificarChute()">Chutar!</button>

            <p id="mensagem"></p>
              <p>Tentativas: <span id="contador">0</span></p>
                <button onclick="reiniciarJogo()">🔄 Jogar de novo</button>
                <script src="script.js"></script></body>
                </html>
