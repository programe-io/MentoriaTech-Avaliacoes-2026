<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>📦 Controle de Estoque</h1>
            <p>Gerencie seus produtos de forma simples e rápida.</p>
        </header>

        <div class="grid-layout">
            <!-- Formulário de Cadastro -->
            <section class="card">
                <h2>Cadastrar Produto</h2>
                <form id="form-cadastro">
                    <div class="form-group">
                        <label for="codigo">Código:</label>
                        <input type="text" id="codigo" required placeholder="Ex: P001">
                    </div>

                    <div class="form-group">
                        <label for="descricao">Descrição:</label>
                        <input type="text" id="descricao" required placeholder="Ex: Camiseta Básica">
                    </div>

                    <div class="form-group">
                        <label for="quantidade">Quantidade:</label>
                        <input type="number" id="quantidade" min="0" required placeholder="Ex: 10">
                    </div>

                    <div class="form-group">
                        <label for="valor">Valor (R\$):</label>
                        <input type="number" id="valor" min="0.01" step="0.01" required placeholder="Ex: 49.90">
                    </div>

                    <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
                </form>
            </section>

            <!-- Lista de Produtos -->
            <section class="card">
                <h2>Produtos no Estoque</h2>
                <div class="table-responsive">
                    <table id="tabela-estoque">
                        <thead>
                            <tr>
                                <th>Cód</th>
                                <th>Descrição</th>
                                <th>Qtd</th>
                                <th>Valor (R\$)</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Os produtos serão inseridos aqui via JavaScript -->
                            <tr id="linha-vazia">
                                <td colspan="5" style="text-align: center; color: #777;">Nenhum produto cadastrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>$0
