<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Feed Interativo</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Header do Feed -->
    <header class="feed-header">
        <div class="container header-content">
            <h1>Meu<span>Feed</span></h1>
            <nav class="feed-nav">
                <button class="nav-btn active" id="btn-all">Todos</button>
                <button class="nav-btn" id="btn-saved">Salvos (<span id="saved-count">0</span>)</button>
            </nav>
        </div>
    </header>

    <!-- Layout Central -->
    <main class="container feed-container">

        <!-- Criador de Novas Publicações -->
        <section class="post-creator card">
            <div class="creator-header">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Avatar" class="avatar">
                <textarea id="post-input" placeholder="No que você está pensando hoje?" rows="3"></textarea>
            </div>
            <div class="creator-actions">
                <span class="char-counter"><span id="char-count">0</span>/280</span>
                <button id="publish-btn" disabled>Publicar</button>
            </div>
        </section>

        <!-- Container do Feed (Posts Dinâmicos) -->
        <section id="posts-list" class="posts-list">
            <!-- Os posts serão inseridos via JavaScript -->
        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
