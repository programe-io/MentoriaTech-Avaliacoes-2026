  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <h1 class="logo">Instagram</h1>
            <div class="nav-icons">
                <button class="icon-btn" id="create-post-btn" title="Criar Post">➕</button>
                <button class="icon-btn" title="Notificações">❤️</button>
                <button class="icon-btn" id="theme-btn" title="Alternar Tema">🌙</button>
            </div>
        </div>
    </header>

    <!-- Modal para Criar Novo Post -->
    <div id="create-modal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Criar nova publicação</h3>
                <button class="close-modal" id="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="img-url-input" placeholder="Cole a URL da Imagem (Ex: https://...)">
                <textarea id="caption-input" placeholder="Escreva uma legenda..." rows="3"></textarea>
                <button id="submit-post-btn" class="primary-btn">Compartilhar</button>
            </div>
        </div>
    </div>

    <!-- Layout Principal -->
    <main class="main-layout">
        
        <!-- Coluna Principal (Stories + Feed) -->
        <section class="feed-section">
            
            <!-- Carrossel de Stories -->
            <div class="stories-wrapper" id="stories-container">
                <!-- Inserido dinamicamente via JS -->
            </div>

            <!-- Feed de Publicações -->
            <div class="posts-feed" id="posts-container">
                <!-- Inserido dinamicamente via JS -->
            </div>

        </section>

        <!-- Sidebar (Perfil + Sugestões) -->
        <aside class="sidebar">
            <div class="user-profile">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Seu Perfil" class="avatar-img large">
                <div class="user-info">
                    <span class="username">seu_usuario</span>
                    <span class="name">Seu Nome</span>
                </div>
                <button class="link-btn">Mudar</button>
            </div>

            <div class="suggestions-header">
                <span>Sugestões para você</span>
                <a href="#">Ver tudo</a>
            </div>

            <div class="suggestions-list" id="suggestions-container">
                <!-- Inserido dinamicamente via JS -->
            </div>

            <footer class="sidebar-footer">
                <p>Sobre • Ajuda • Imprensa • API • Car
  <script src="script.js"></script>
  
</body>
</html>
