<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Gerenciamento de Tarefas</h1>

    <div class="formulario">
        <input type="number" id="codigo" placeholder="Código">

        <input type="text" id="titulo" placeholder="Título da tarefa">

        <select id="prioridade">
            <option value="">Escolha a prioridade</option>
            <option value="1">1 - Alta</option>
            <option value="2">2 - Média</option>
            <option value="3">3 - Baixa</option>
        </select>

        <button onclick="cadastrarTarefa()">Cadastrar Tarefa</button>
    </div>

    <h2>Tarefas cadastradas</h2>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Título</th>
                <th>Prioridade</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="listaTarefas"></tbody>
    </table>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
