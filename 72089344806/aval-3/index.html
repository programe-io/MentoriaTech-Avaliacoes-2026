
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Ficha de Anamnese</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <div class="container">
                            <header>
                                        <h1>Ficha de Anamnese</h1>
                                                    <p>Cadastro e informações do paciente</p>
                                                            </header>

                                                                    <form id="ficha">

                                                                                <h2>1. Dados pessoais</h2>

                                                                                            <label>Nome completo:</label>
                                                                                                        <input type="text" id="nome" required>

                                                                                                                    <label>Data de nascimento:</label>
                                                                                                                                <input type="date" id="nascimento">

                                                                                                                                            <label>Idade:</label>
                                                                                                                                                        <input type="number" id="idade">

                                                                                                                                                                    <label>Telefone:</label>
                                                                                                                                                                                <input type="tel" id="telefone">

                                                                                                                                                                                            <label>Endereço:</label>
                                                                                                                                                                                                        <input type="text" id="endereco">

                                                                                                                                                                                                                    <h2>2. Histórico de saúde</h2>

                                                                                                                                                                                                                                <label>Possui alguma doença?</label>
                                                                                                                                                                                                                                            <select id="doenca">
                                                                                                                                                                                                                                                            <option value="">Selecione</option>
                                                                                                                                                                                                                                                                            <option>Sim</option>
                                                                                                                                                                                                                                                                                            <option>Não</option>
                                                                                                                                                                                                                                                                                                        </select>

                                                                                                                                                                                                                                                                                                                    <label>Possui alguma alergia?</label>
                                                                                                                                                                                                                                                                                                                                <select id="alergia">
                                                                                                                                                                                                                                                                                                                                                <option value="">Selecione</option>
                                                                                                                                                                                                                                                                                                                                                                <option>Sim</option>
                                                                                                                                                                                                                                                                                                                                                                                <option>Não</option>
                                                                                                                                                                                                                                                                                                                                                                                            </select>

                                                                                                                                                                                                                                                                                                                                                                                                        <label>Utiliza algum medicamento?</label>
                                                                                                                                                                                                                                                                                                                                                                                                                    <select id="medicamento">
                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="">Selecione</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option>Sim</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option>Não</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>3. Queixa principal</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Qual o motivo da consulta?</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <textarea id="queixa" rows="4"></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Observações adicionais:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <textarea id="observacoes" rows="4"></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="submit">Cadastrar ficha</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button type="button" onclick="window.print()">Imprimir ficha</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="resultado"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
