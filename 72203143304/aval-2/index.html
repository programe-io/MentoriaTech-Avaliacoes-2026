
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <header class="header">
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas tarefas e acompanhe seu progresso.</p>
        </header>

        <!-- Indicadores -->
        <section class="dashboard">

            <div class="card">
                <span>Total de tarefas</span>
                <h2 id="totalTarefas">0</h2>
            </div>

            <div class="card">
                <span>Tarefas pendentes</span>
                <h2 id="tarefasPendentes">0</h2>
            </div>

            <div class="card">
                <span>Tarefas concluídas</span>
                <h2 id="tarefasConcluidas">0</h2>
            </div>

        </section>

        <!-- Cadastro -->
        <section class="section">

            <h2>Adicionar nova tarefa</h2>

            <form id="formTarefa">

                <div class="form-group">
                    <label for="titulo">Título da tarefa</label>

                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex: Estudar JavaScript"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade" required>
                        <option value="">Selecione</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">
                    Cadastrar tarefa
                </button>

            </form>

        </section>

        <!-- Busca -->
        <section class="section">

            <h2>Buscar tarefa</h2>

            <div class="search">

                <input
                    type="number"
                    id="codigoBusca"
                    placeholder="Digite o código da tarefa"
                    min="1"
                >

                <button
                    type="button"
                    class="btn-primary"
                    id="btnBuscar"
                >
                    Buscar
                </button>

                <button
                    type="button"
                    class="btn-secondary"
                    id="btnMostrarTodas"
                >
                    Mostrar todas
                </button>

            </div>

        </section>

        <!-- Listagem -->
        <section class="section">

            <div class="list-header">

                <h2>Minhas tarefas</h2>

                <select id="filtroStatus">
                    <option value="todas">Todas</option>
                    <option value="pendentes">Pendentes</option>
                    <option value="concluidas">Concluídas</option>
                </select>

            </div>

            <div id="listaTarefas">

                <p class="empty">
                    Nenhuma tarefa cadastrada.
                </p>

            </div>

        </section>

        <!-- Mensagens -->
        <div id="mensagem" role="status" aria-live="polite"></div>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
