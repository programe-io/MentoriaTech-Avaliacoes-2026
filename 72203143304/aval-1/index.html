

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <header>
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas atividades e acompanhe seu progresso.</p>
        </header>

        <section class="dashboard">
            <div class="card">
                <span>Total de tarefas</span>
                <h2 id="totalTarefas">0</h2>
            </div>

            <div class="card">
                <span>Pendentes</span>
                <h2 id="tarefasPendentes">0</h2>
            </div>

            <div class="card">
                <span>Concluídas</span>
                <h2 id="tarefasConcluidas">0</h2>
            </div>
        </section>

        <section class="form-section">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <div class="form-group">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título da tarefa"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade" required>
                        <option value="">Selecione a prioridade</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">
                    + Cadastrar tarefa
                </button>

            </form>
        </section>

        <section class="search-section">
            <h2>Buscar tarefa</h2>

            <div class="search-box">
                <input
                    type="number"
                    id="codigoBusca"
                    placeholder="Digite o código da tarefa"
                    min="1"
                >

                <button onclick="buscarPorCodigo()" class="btn-search">
                    Buscar
                </button>

                <button onclick="listarTarefas()" class="btn-secondary">
                    Mostrar todas
                </button>
            </div>
        </section>

        <section class="tasks-section">

            <div class="tasks-header">
                <h2>Minhas tarefas</h2>

                <select id="filtroStatus" onchange="filtrarTarefas()">
                    <option value="todas">Todas</option>
                    <option value="pendentes">Pendentes</option>
                    <option value="concluidas">Concluídas</option>
                </select>
            </div>

            <div id="listaTarefas" class="tasks-list">
                <p class="empty-message">
                    Nenhuma tarefa cadastrada.
                </p>
            </div>

        </section>

        <div id="mensagem" class="mensagem"></div>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
