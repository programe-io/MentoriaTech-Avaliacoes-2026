<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>HTML completo</title>
  <meta name="description" content="Exemplo completo de HTML">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
  <h1>Título principal (h1)</h1>
  <h2>Subtítulo (h2)</h2>
  <h3>Exemplo h3</h3>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Sobre</a>
</nav>

<main>

  <section>
    <article>
      <h3>Artigo</h3>
      <p>Parágrafo normal</p>
      <span>Texto em span</span>
    </article>
  </section>

  <aside>
    <p>Conteúdo lateral</p>
  </aside>

  <div>
    <p>Div comum</p>
  </div>

  <img src="https://via.placeholder.com/150" alt="imagem">

  <a href="https://google.com">Link</a>

  <ul>
    <li>Lista 1</li>
    <li>Lista 2</li>
  </ul>

  <ol>
    <li>Ordem 1</li>
    <li>Ordem 2</li>
  </ol>

  <form>
    <label>Nome:</label>
    <input type="text">
    <button>Enviar</button>
  </form>

  <table border="1">
    <tr>
      <th>Nome</th>
      <th>Idade</th>
    </tr>
    <tr>
      <td>João</td>
      <td>15</td>
    </tr>
  </table>

</main>

<footer>
  <p>Rodapé</p>
</footer>

<!-- Tags extras mais raras -->
<details>
  <summary>Clique aqui</summary>
  Conteúdo escondido
</details>

<mark>Texto destacado</mark>
<small>Texto pequeno</small>
<strong>Negrito</strong>
<em>Itálico</em>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
