
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Sistema de gerenciamento de estoque</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form>
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao"
                    placeholder="Nome do produto">

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade"
                    placeholder="Quantidade em estoque">

                <label for="valor">Valor:</label>
                <input type="number" id="valor"
                    placeholder="Valor do produto" step="0.01">

                <button type="button">Cadastrar Produto</button>
            </form>
        </section>

        <section class="card">
            <h2>Atualizar Valor</h2>

            <form>
                <label for="codigoValor">Código do produto:</label>
                <input type="number" id="codigoValor"
                    placeholder="Código">

                <label for="novoValor">Novo valor:</label>
                <input type="number" id="novoValor"
                    placeholder="Novo valor" step="0.01">

                <button type="button">Atualizar Valor</button>
            </form>
        </section>

        <section class="card">
            <h2>Atualizar Quantidade</h2>

            <form>
                <label for="codigoQuantidade">Código do produto:</label>
                <input type="number" id="codigoQuantidade"
                    placeholder="Código">

                <label for="novaQuantidade">Quantidade a adicionar:</label>
                <input type="number" id="novaQuantidade"
                    placeholder="Quantidade">

                <button type="button">Adicionar Quantidade</button>
            </form>
        </section>

        <section class="card">
            <h2>Produtos Cadastrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td colspan="4">Nenhum produto cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Sistema de Cadastro de Produtos</p>
    </footer>

<script src="script.js"></script></body>
</html>
