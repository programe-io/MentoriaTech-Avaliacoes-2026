
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="conversor-card">
        <h2>💵 Conversor de Moedas</h2>
        <p>Converta Dólar (USD) para Real (BRL)</p>
        
        <div class="input-group">
            <label for="valorDolar">Valor em Dólar ($):</label>
            <input type="number" id="valorDolar" placeholder="Ex: 100" min="0" step="0.01">
        </div>

        <button id="btnConverter">Converter para Real</button>

        <div id="resultado" class="resultado-box">
            Digite um valor para calcular.
        </div>
    </div>
<script src="script.js"></script></body>
</html>
