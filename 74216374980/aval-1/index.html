<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Gerenciamento de estoque</p>
    </header>

    <main>

        <!-- Cadastro -->
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: Cadeira Gamer"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        placeholder="Ex: 10"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input
                        type="number"
                        id="valor"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 699.90"
                        required
                    >
                </div>

                <button type="submit">
                    Cadastrar Produto
                </button>

            </form>
        </section>


        <!-- Atualizar produto -->
        <section class="card">

            <h2>Atualizar Produto</h2>

            <div class="atualizacao">

                <div class="campo">
                    <label for="codigoAtualizar">
                        Código do Produto
                    </label>

                    <input
                        type="number"
                        id="codigoAtualizar"
                        min="1"
                        placeholder="Código"
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">
                        Novo Valor
                    </label>

                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        placeholder="Novo valor"
                    >
                </div>

                <button id="btnValor">
                    Atualizar Valor
                </button>

            </div>


            <div class="atualizacao">

                <div class="campo">
                    <label for="novaQuantidade">
                        Quantidade a adicionar
                    </label>

                    <input
                        type="number"
                        id="novaQuantidade"
                        min="1"
                        placeholder="Quantidade"
                    >
                </div>

                <button id="btnQuantidade">
                    Adicionar Quantidade
                </button>

            </div>

        </section>


        <!-- Mensagem -->
        <div id="mensagem"></div>


        <!-- Lista -->
        <section class="card">

            <div class="titulo-lista">
                <h2>Produtos Cadastrados</h2>

                <span id="totalProdutos">
                    0 produtos
                </span>
            </div>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Total</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Produtos serão inseridos aqui -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>Sistema de Cadastro de Produtos</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
