<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Produtos</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
  <h1>Cadastro de Produtos</h1>
  <p>Gerenciamento de estoque</p>
</header>

<main>
  <section class="card">
    <h2>Cadastrar Produto</h2>
    <div class="row">
      <div class="field grow">
        <label for="desc">Descrição</label>
        <input id="desc" type="text" placeholder="Ex: Cadeira Gamer">
      </div>
      <div class="field">
        <label for="qtd">Quantidade</label>
        <input id="qtd" type="number" min="0" placeholder="Ex: 10">
      </div>
      <div class="field">
        <label for="valor">Valor</label>
        <input id="valor" type="number" min="0" step="0.01" placeholder="Ex: 699.90">
      </div>
      <button id="btnCadastrar">Cadastrar Produto</button>
    </div>
  </section>

  <section class="card">
    <h2>Atualizar Produto</h2>
    <div class="row">
      <div class="field">
        <label for="codValor">Código do Produto</label>
        <input id="codValor" type="number" min="1" placeholder="Código">
      </div>
      <div class="field">
        <label for="novoValor">Novo Valor</label>
        <input id="novoValor" type="number" min="0" step="0.01" placeholder="Novo valor">
      </div>
      <button id="btnValor">Atualizar Valor</button>
    </div>
    <div class="row">
      <div class="field">
        <label for="codQtd">Código do Produto</label>
        <input id="codQtd" type="number" min="1" placeholder="Código">
      </div>
      <div class="field">
        <label for="addQtd">Quantidade a adicionar</label>
        <input id="addQtd" type="number" min="1" placeholder="Quantidade">
      </div>
      <button id="btnQtd">Adicionar Quantidade</button>
    </div>
  </section>

  <section class="card">
    <div class="list-head">
      <h2>Produtos Cadastrados</h2>
      <span class="badge" id="contador">0 produtos</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Código</th><th>Descrição</th><th>Quantidade</th><th>Valor</th><th>Total</th><th></th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
    </div>
    <div class="total-bar">Valor total em estoque: <strong id="totalGeral">R$ 0,00</strong></div>
  </section>
</main>

<div id="toast" role="status"></div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
