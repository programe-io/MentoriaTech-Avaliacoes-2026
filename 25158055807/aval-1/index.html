
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">
                <label>Descrição:</label>
                <input type="text" id="descricao" placeholder="Nome do produto" required>

                <label>Quantidade:</label>
                <input type="number" id="quantidade" min="1" placeholder="Quantidade" required>

                <label>Valor:</label>
                <input type="number" id="valor" min="0" step="0.01" placeholder="Valor do produto" required>

                <button type="submit">Cadastrar Produto</button>
            </form>
        </section>

        <section class="formulario">
            <h2>Atualizar Produto</h2>

            <label>Código do produto:</label>
            <input type="number" id="codigoAtualizar" placeholder="Código">

            <label>Novo valor:</label>
            <input type="number" id="novoValor" min="0" step="0.01" placeholder="Novo valor">

            <button onclick="atualizarPreco()">Atualizar Valor</button>

            <label>Adicionar quantidade:</label>
            <input type="number" id="novaQuantidade" min="1" placeholder="Quantidade">

            <button onclick="atualizarEstoque()">Atualizar Estoque</button>
        </section>

        <p id="mensagem"></p>

        <section class="lista">
            <h2>Produtos Cadastrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody id="tabelaProdutos">
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
