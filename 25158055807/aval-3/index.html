<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topo">
    <div class="topo-marca">
        <span class="logo" aria-hidden="true">IMC</span>
        <div>
            <h1>Painel de IMC</h1>
            <p>Acompanhe o índice de massa corporal dos pacientes</p>
        </div>
    </div>
    <dl class="resumo">
        <div><dt>Pacientes</dt><dd id="total-pessoas">0</dd></div>
        <div><dt>IMC médio</dt><dd id="media-imc">0,0</dd></div>
    </dl>
</header>

<main class="layout">

    <!-- FORMULÁRIO -->
    <aside class="painel painel-form">
        <h2 id="titulo-form">Novo paciente</h2>

        <form id="form-pessoa" novalidate autocomplete="off">
            <label class="campo">
                <span>Nome completo</span>
                <input type="text" id="input-nome" maxlength="50" placeholder="Maria Silva" required>
            </label>

            <div class="linha">
                <label class="campo">
                    <span>Idade</span>
                    <input type="number" id="input-idade" min="1" max="126" step="1" placeholder="30" required>
                </label>
                <label class="campo">
                    <span>Altura (m)</span>
                    <input type="number" id="input-altura" min="0.5" max="2.5" step="0.01" placeholder="1.75" required>
                </label>
                <label class="campo">
                    <span>Peso (kg)</span>
                    <input type="number" id="input-peso" min="1" max="500" step="0.1" placeholder="70" required>
                </label>
            </div>

            <!-- PRÉVIA AO VIVO -->
            <div class="previa" id="previa" data-faixa="vazio">
                <span class="previa-rotulo">IMC calculado</span>
                <strong class="previa-valor" id="previa-valor">--</strong>
                <span class="previa-texto" id="previa-texto">Preencha altura e peso</span>
            </div>

            <p id="erro" class="erro" role="alert" hidden></p>

            <div class="botoes">
                <button type="submit" id="btn-salvar" class="primario">Salvar paciente</button>
                <button type="button" id="btn-cancelar" class="fantasma" hidden>Cancelar</button>
            </div>
        </form>
    </aside>

    <!-- LISTA -->
    <section class="painel painel-lista">
        <div class="lista-topo">
            <div>
                <h2>Pacientes</h2>
                <p id="contador">0 registros</p>
            </div>
            <input type="search" id="busca" placeholder="Buscar por nome" aria-label="Buscar por nome">
        </div>

        <ul class="lista" id="lista"></ul>
    </section>

</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
<script src="script.js"></script></body>
</html>
