
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Mundinho 💙</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topo">
        <a href="#" class="logo">meu mundinho <span>♡</span></a>
        <p>um pouquinho de mim 💙🩷</p>
    </header>

    <main class="container">

        <section class="perfil">
            <div class="avatar">💙</div>

            <div class="perfil-info">
                <h1>Meu cantinho ♡</h1>
                <p>@meucantinho</p>
                <p>música, amigas, praia e minhas obsessões ✨</p>

                <div class="estatisticas">
                    <span><strong id="totalPosts">6</strong> posts</span>
                    <span><strong id="totalCurtidas">0</strong> curtidas</span>
                </div>
            </div>
        </section>

        <section class="criar-post">
            <h2>O que vamos postar hoje? 💌</h2>

            <form id="formPost">
                <input
                    type="text"
                    id="tituloPost"
                    placeholder="Título do post..."
                    maxlength="70"
                    required
                >

                <textarea
                    id="textoPost"
                    placeholder="Escreva alguma coisa..."
                    maxlength="500"
                    required
                ></textarea>

                <select id="categoriaPost">
                    <option value="Momentos">Momentos</option>
                    <option value="Música">Música</option>
                    <option value="Comidinhas">Comidinhas</option>
                    <option value="Games">Games</option>
                    <option value="Amizades">Amizades</option>
                    <option value="Favoritos">Favoritos</option>
                </select>

                <button type="submit" class="btn-publicar">
                    Publicar post +
                </button>
            </form>
        </section>

        <section class="feed">
            <h2>Meu feed ✨</h2>

            <div class="filtros">
                <button class="filtro ativo" data-categoria="Todos">Todos</button>
                <button class="filtro" data-categoria="Música">Música</button>
                <button class="filtro" data-categoria="Comidinhas">Comidinhas</button>
                <button class="filtro" data-categoria="Momentos">Momentos</button>
                <button class="filtro" data-categoria="Games">Games</button>
                <button class="filtro" data-categoria="Amizades">Amizades</button>
                <button class="filtro" data-categoria="Favoritos">Favoritos</button>
            </div>

            <div id="listaPosts" class="lista-posts"></div>
        </section>

    </main>

    <footer>
        <p>feito com amor 💙🩷</p>
        <p>meu mundinho © 2026</p>
    </footer>

<script src="script.js"></script></body>
</html>
