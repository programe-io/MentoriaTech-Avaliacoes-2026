
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Estoque</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #eef2f7;
    padding: 30px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #00000015;
}

h1 {
    text-align: center;
    color: #23395d;
    margin-bottom: 25px;
}

.formulario {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

input {
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    width: 100%;
}

button {
    border: none;
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    background: #2563eb;
}

button:hover {
    opacity: 0.85;
}

.cadastrar {
    grid-column: span 2;
    background: #16a34a;
}

h2 {
    color: #23395d;
    margin: 25px 0 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 13px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

th {
    background: #23395d;
    color: white;
}

.alterar {
    background: #f59e0b;
    margin: 3px;
}

.vazio {
    text-align: center;
    padding: 20px;
    color: #777;
}

@media (max-width: 650px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 15px;
    }

    .formulario {
        grid-template-columns: 1fr;
    }

    .cadastrar {
        grid-column: span 1;
    }

    table {
        font-size: 12px;
    }

    th, td {
        padding: 8px 4px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>📦 Sistema de Estoque</h1>

    <h2>Cadastrar Produto</h2>

    <div class="formulario">
        <input type="text" id="codigo" placeholder="Código do produto">
        <input type="text" id="descricao" placeholder="Descrição do produto">
        <input type="number" id="quantidade" placeholder="Quantidade" min="0">
        <input type="number" id="valor" placeholder="Valor (R$)" min="0" step="0.01">

        <button class="cadastrar" onclick="cadastrarProduto()">
            Cadastrar Produto
        </button>
    </div>

    <h2>Produtos Cadastrados</h2>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="listaProdutos">
            <tr>
                <td colspan="5" class="vazio">Nenhum produto cadastrado.</td>
            </tr>
        </tbody>
    </table>

</div>

<script>
let produtos = [];

function cadastrarProduto() {
    let codigo = document.getElementById("codigo").value.trim();
    let descricao = document.getElementById("descricao").value.trim();
    let quantidade = Number(document.getElementById("quantidade").value);
    let valor = Number(document.getElementById("valor").value);

    if (!codigo || !descricao ||
        document.getElementById("quantidade").value === "" ||
        document.getElementById("valor").value === "" ||
        !Number.isInteger(quantidade) || quantidade < 0 ||
        !Number.isFinite(valor) || valor < 0) {
        alert("Preencha todos os campos corretamente!");
        return;
    }

    if (produtos.some(p => p.codigo === codigo)) {
        alert("Este código já está cadastrado!");
        return;
    }

    produtos.push({
        codigo,
        descricao,
        quantidade,
        valor
    });

    limparCampos();
    listarProdutos();

    alert("Produto cadastrado com sucesso!");
}

function listarProdutos() {
    let lista = document.getElementById("listaProdutos");
    lista.innerHTML = "";

    if (produtos.length === 0) {
        lista.innerHTML = `
            <tr>
                <td colspan="5" class="vazio">
                    Nenhum produto cadastrado.
                </td>
            </tr>`;
        return;
    }

    produtos.forEach((produto, indice) => {
        lista.innerHTML += `
            <tr>
                <td>${produto.codigo}</td>
                <td>${produto.descricao}</td>
                <td>${produto.quantidade}</td>
                <td>R$ ${produto.valor.toFixed(2)}</td>
                <td>
                    <button class="alterar"
                    onclick="alterarValor(${indice})">
                        Alterar valor
                    </button>

                    <button class="alterar"
                    onclick="alterarQuantidade(${indice})">
                        Alterar quantidade
                    </button>
                </td>
            </tr>`;
    });
}

function alterarValor(indice) {
    let novoValor = prompt("Digite o novo valor:");

    if (novoValor === null || novoValor.trim() === "") return;

    novoValor = Number(novoValor);

    if (!Number.isFinite(novoValor) || novoValor < 0) {
        alert("Digite um valor válido!");
        return;
    }

    produtos[indice].valor = novoValor;
    listarProdutos();
    alert("Valor alterado com sucesso!");
}

function alterarQuantidade(indice) {
    let novaQuantidade = prompt("Digite a nova quantidade:");

    if (novaQuantidade === null || novaQuantidade.trim() === "") return;

    novaQuantidade = Number(novaQuantidade);

    if (!Number.isInteger(novaQuantidade) || novaQuantidade < 0) {
        alert("Digite uma quantidade válida!");
        return;
    }

    produtos[indice].quantidade = novaQuantidade;
    listarProdutos();
    alert("Quantidade alterada com sucesso!");
}

function limparCampos() {
    document.getElementById("codigo").value = "";
    document.getElementById("descricao").value = "";
    document.getElementById("quantidade").value = "";
    document.getElementById("valor").value = "";
}
</script>

</body>
</html>
