<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caçadora de Estrelas</title>

<style>
body {
    background: linear-gradient(135deg, #19002e, #5b1685);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 30px;
\}

h1 {
    color: #f5c8ff;
\}

#jogo {
    background: #291044;
    border: 3px solid #d99aff;
    border-radius: 15px;
    max-width: 500px;
    height: 300px;
    margin: 20px auto;
    position: relative;
    overflow: hidden;
\}

#estrela {
    position: absolute;
    font-size: 35px;
    cursor: pointer;
    display: none;
\}

button {
    background: #d17aff;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
\}

button:hover {
    background: #a43ed1;
\}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<h1>🌟 Caçadora de Estrelas 🌟</h1>
<p>Clique nas estrelas para ganhar pontos!</p>

<h2>Pontos: <span id="pontos">0</span></h2>
<h3>Tempo: <span id="tempo">30</span> segundos</h3>

<div id="jogo">
    <span id="estrela" onclick="pegarEstrela()">⭐</span>
</div>

<button onclick="iniciarJogo()">Começar jogo</button>

<script>
let pontos = 0;
let tempo = 30;
let intervalo;
let ativo = false;

function iniciarJogo() {
    pontos = 0;
    tempo = 30;
    ativo = true;

    document.getElementById("pontos").textContent = pontos;
    document.getElementById("tempo").textContent = tempo;

    moverEstrela();

    clearInterval(intervalo);

    intervalo = setInterval(() => {
        tempo--;
        document.getElementById("tempo").textContent = tempo;

        if (tempo <= 0) {
            clearInterval(intervalo);
            ativo = false;
            document.getElementById("estrela").style.display = "none";
            alert("Fim de jogo! Você fez " + pontos + " pontos!");
        \}
    \}, 1000);
\}

function pegarEstrela() {
    if (!ativo) return;

    pontos++;
    document.getElementById("pontos").textContent = pontos;
    moverEstrela();
\}

function moverEstrela() {
    const jogo = document.getElementById("jogo");
    const estrela = document.getElementById("estrela");

    estrela.style.left = Math.random() * (jogo.clientWidth - 45) + "px";
    estrela.style.top = Math.random() * (jogo.clientHeight - 45) + "px";
    estrela.style.display = "block";
\}
</script>

<script src="script.js"></script></body>
