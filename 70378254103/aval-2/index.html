<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Estoque Tech</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <h1>📦 Gestão de Estoque Tech</h1>

    <!-- Form Cadastrar -->
    <section class="card">
      <h2>Cadastrar Produto</h2>
      <form id="form-cadastrar">
        <input type="number" id="cad-codigo" placeholder="Código" required>
        <input type="text" id="cad-descricao" placeholder="Descrição" required>
        <input type="number" id="cad-qtd" placeholder="Quantidade" required>
        <input type="number" step="0.01" id="cad-valor" placeholder="Valor (R$)" required>
        <button type="submit" class="btn-principal">Cadastrar</button>
      </form>
    </section>

    <!-- Forms Alterar -->
    <section class="card grid-2">
      <div>
        <h3>Alterar Valor</h3>
        <form id="form-valor">
          <input type="number" id="alt-val-codigo" placeholder="Código" required>
          <input type="number" step="0.01" id="alt-val-novo" placeholder="Novo Valor (R$)" required>
          <button type="submit" class="btn-atualizar">Atualizar Valor</button>
        </form>
      </div>
      <div>
        <h3>Alterar Quantidade</h3>
        <form id="form-qtd">
          <input type="number" id="alt-qtd-codigo" placeholder="Código" required>
          <input type="number" id="alt-qtd-nova" placeholder="Nova Qtd" required>
          <button type="submit" class="btn-atualizar">Atualizar Qtd</button>
        </form>
      </div>
    </section>

    <!-- Tabela Listagem -->
    <section class="card">
      <h2>📋 Produtos Cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Quantidade</th>
            <th>Valor Un.</th>
          </tr>
        </thead>
        <tbody id="tabela-produtos"></tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
