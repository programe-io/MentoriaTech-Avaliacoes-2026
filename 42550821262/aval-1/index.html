<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1ª Avaliação de Mentoria Tech - SEDUC PI 2026</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background: linear-gradient(135deg, #003366, #0055aa);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .container{
        background:white;
        width:100%;
        max-width:800px;
        border-radius:15px;
        padding:30px;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    .logo{
        text-align:center;
        margin-bottom:20px;
    }

    .logo h1{
        color:#003366;
    }

    .logo p{
        color:#666;
        margin-top:5px;
    }

    h2{
        color:#0055aa;
        margin-bottom:20px;
        text-align:center;
    }

    .question{
        margin-bottom:20px;
        padding:15px;
        background:#f5f7fa;
        border-radius:10px;
    }

    .question p{
        font-weight:bold;
        margin-bottom:10px;
    }

    label{
        display:block;
        margin:8px 0;
        cursor:pointer;
    }

    button{
        width:100%;
        padding:15px;
        border:none;
        background:#0055aa;
        color:white;
        font-size:18px;
        border-radius:10px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#003d80;
    }

    #resultado{
        margin-top:20px;
        text-align:center;
        font-size:20px;
        font-weight:bold;
        color:#003366;
    }

    footer{
        text-align:center;
        margin-top:20px;
        color:#777;
        font-size:14px;
    }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="logo">
        <h1>SEDUC PI</h1>
        <p>Mentoria Tech</p>
    </div>

    <h2>1ª Avaliação de Conhecimentos</h2>

    <form id="quiz">

        <div class="question">
            <p>1. O que significa HTML?</p>
            <label><input type="radio" name="q1" value="1"> HyperText Markup Language</>
            <label><input type="radio" name="q1" value="0"> HighText Machine Language</label>
            <label><input type="radio" name="q1" value="0"> Home Tool Markup Language</label>
        </div>

        <div class="question">
            <p>2. Qual linguagem é utilizada para estilizar páginas web?</p>
            <label><input type="radio" name="q2" value="0"> Python</label>
            <label><input type="radio" name="q2" value="1"> CSS</label>
            <label><input type="radio" name="q2" value="0"> Java</label>
        </div>

        <div class="question">
            <p>3. Qual linguagem adiciona interatividade às páginas?</p>
            <label><input type="radio" name="q3" value="1"> JavaScript</label>
            <label><input type="radio" name="q3" value="0"> HTML</label>
            <label><input type="radio" name="q3" value="0"> CSS</label>
        </div>

        <div class="question">
            <p>4. Qual tag cria um link em HTML?</p>
            <label><input type="radio" name="q4" value="1">&lt;a&gt;</label>
            <label><input type="radio" name="q4" value="0">&lt;link&gt;</label>
            <label><input type="radio" name="q4" value="0">&lt;href&gt;</label>
        </div>

        <div class="question">
            <p>5. O que significa CSS?</p>
            <label><input type="radio" name="q5" value="1"> Cascading Style Sheets</label>
            <label><input type="radio" name="q5" value="0"> Computer Style Sheets</label>
            <label><input type="radio" name="q5" value="0"> Creative Style System</label>
        </div>

        <button type="button" onclick="corrigir()">Finalizar Avaliação</button>

    </form>

    <div id="resultado"></div>

    <footer>
        © 2026 - Mentoria Tech | SEDUC PI
    </footer>

</div>

<script>
function corrigir() {
    let total = 0;

    for(let i = 1; i <= 5; i++) {
        let resposta = document.querySelector(`input[name="q${i}"]:checked`);
        if(resposta){
            total += Number(resposta.value);
        }
    }

    let nota = (total * 2);

    document.getElementById("resultado").innerHTML =
        `Você acertou ${total}/5 questões.<br>Nota: ${nota.toFixed(1)}/10`;
}
</script>

</body>
</html>
