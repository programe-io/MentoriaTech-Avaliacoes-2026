
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IXPIR TOK</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="top">
        <h1>IXPIR <span>TOK</span></h1>

        <nav>
            <a href="#" class="active">Para você</a>
            <a href="#">Seguindo</a>
            <a href="#">Ao vivo</a>
        </nav>

        <button class="search">🔍</button>
    </header>

    <main class="video-feed" id="videoFeed">

        <section class="video-card">
            <video class="video" loop playsinline
                src="https://videos.pexels.com/video-files/3129671/3129671-hd_1080_1920_25fps.mp4">
            </video>

            <div class="video-info">
                <h3>@maria_silva</h3>
                <p>Um momento incrível! ❤️✨ #ixpirtok</p>
                <p class="music">♫ Música original - Maria</p>
            </div>

            <div class="video-actions">
                <div class="creator-avatar">M</div>

                <button class="like-btn">
                    <span>♡</span>
                    <small>12.5K</small>
                </button>

                <button class="comment-btn">
                    <span>💬</span>
                    <small>850</small>
                </button>

                <button class="share-btn">
                    <span>➤</span>
                    <small>Compartilhar</small>
                </button>

                <div class="music-disc">♫</div>
            </div>
        </section>

        <section class="video-card">
            <video class="video" loop playsinline
                src="https://videos.pexels.com/video-files/854124/854124-hd_1080_1920_25fps.mp4">
            </video>

            <div class="video-info">
                <h3>@pedro_oficial</h3>
                <p>Natureza e paisagens maravilhosas 🌎</p>
                <p class="music">♫ Som original - Pedro</p>
            </div>

            <div class="video-actions">
                <div class="creator-avatar">P</div>

                <button class="like-btn">
                    <span>♡</span>
                    <small>8.2K</small>
                </button>

                <button class="comment-btn">
                    <span>💬</span>
                    <small>320</small>
                </button>

                <button class="share-btn">
                    <span>➤</span>
                    <small>Compartilhar</small>
                </button>

                <div class="music-disc">♫</div>
            </div>
        </section>

    </main>

    <footer class="bottom-menu">
        <button>🏠<small>Início</small></button>
        <button>🔍<small>Explorar</small></button>
        <button class="create-btn" id="openUpload">＋</button>
        <button>💬<small>Inbox</small></button>
        <button>👤<small>Perfil</small></button>
    </footer>

    <!-- Modal de publicação -->
    <div class="modal" id="uploadModal">
        <div class="modal-box">
            <button class="close" id="closeUpload">×</button>

            <h2>Publicar vídeo</h2>

            <input type="text" id="username" placeholder="Seu usuário">

            <input type="text" id="videoUrl" placeholder="Link do vídeo (MP4)">

            <textarea id="description" placeholder="Escreva uma descrição..."></textarea>

            <button id="publishVideo">Publicar vídeo</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
