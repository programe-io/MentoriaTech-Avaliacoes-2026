<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chica da Garrafa</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#fff0f6;
}

header{
background:#ff4fa3;
color:white;
padding:20px;
text-align:center;
font-size:35px;
font-weight:bold;
}

nav{
display:flex;
justify-content:center;
gap:15px;
padding:15px;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

nav button{
padding:12px 25px;
border:none;
background:#ff4fa3;
color:white;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

nav button:hover{
background:#ff2f8d;
}

section{
display:none;
padding:30px;
}

.ativa{
display:block;
}

.produtos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.card img{
width:180px;
height:180px;
object-fit:cover;
border-radius:10px;
}

.card h2{
margin:10px 0;
color:#ff4fa3;
}

.preco{
font-size:24px;
font-weight:bold;
margin:10px 0;
color:#ff4fa3;
}

.card button{
padding:12px 18px;
border:none;
background:#ff4fa3;
color:white;
border-radius:8px;
cursor:pointer;
}

.card button:hover{
background:#ff2f8d;
}

.carrinho{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

#lista li{
margin:10px 0;
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:20px;
border:1px solid #ffb3d9;
border-radius:8px;
}

.total{
font-size:25px;
font-weight:bold;
color:#ff4fa3;
margin-bottom:20px;
}

.finalizar{
width:100%;
padding:15px;
background:#ff4fa3;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.finalizar:hover{
background:#ff2f8d;
}

</style>

</head>

<body>

<header>

🌸 Chica da Garrafa 🌸

</header>

<nav>

<button onclick="abrirTela('produtos')">
Produtos
</button>

<button onclick="abrirTela('carrinho')">
Carrinho
</button>

</nav>

<!-- TELA DOS PRODUTOS -->

<section id="produtos" class="ativa">

<div class="produtos">

<div class="card">

<img src="https://images.unsplash.com/photo-1564419320408-38e24e038739?w=600">

<h2>Água Mineral 500ml</h2>

<div class="preco">
R$ 5,00
</div>

<button onclick="adicionar('Água Mineral 500ml',5)">
Adicionar ao Carrinho
</button>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1559839914-17aae19cec71?w=600">

<h2>Água Mineral 1 Litro</h2>

<div class="preco">
R$ 8,00
</div>

<button onclick="adicionar('Água Mineral 1 Litro',8)">
Adicionar ao Carrinho
</button>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1523362628745-0c100150b504?w=600">

<h2>Pack com 12 Garrafas</h2>

<div class="preco">
R$ 30,00
</div>

<button onclick="adicionar('Pack com 12',30)">
Adicionar ao Carrinho
</button>

</div>

</div>
            
</section>
  
  
</body>
</html>
