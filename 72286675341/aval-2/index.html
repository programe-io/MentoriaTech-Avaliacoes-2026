
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas atividades de forma simples</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">
                <label for="titulo">Título da tarefa</label>
                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título da tarefa"
                    required
                >

                <label for="prioridade">Prioridade</label>
                <select id="prioridade" required>
                    <option value="Baixa">Baixa</option>
                    <option value="Média" selected>Média</option>
                    <option value="Alta">Alta</option>
                </select>

                <button type="submit">Cadastrar tarefa</button>
            </form>
        </section>

        <section class="tarefas">
            <h2>Minhas tarefas</h2>

            <div class="resumo">
                <span>Total: <strong id="total">0</strong></span>
                <span>Pendentes: <strong id="pendentes">0</strong></span>
                <span>Concluídas: <strong id="concluidas">0</strong></span>
            </div>

            <div id="listaTarefas">
                <p class="vazio">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto de Mentoria Tech - 2ª Série</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
