<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Simples</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🛍️ Loja Simples</h1>
    <nav>
        <a href="#" style="color: white; text-decoration: none; font-weight: bold;">Início</a>
    </nav>
</header>

<main>

<div class="produtos">

    <article class="produto">
        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300&auto=format&fit=crop&q=60" alt="Camiseta">
        <h2>Camiseta</h2>
        <p>R$ 50,00</p>
        <button onclick="adicionar('Camiseta',50)">Comprar</button>
    </article>

    <article class="produto">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300&auto=format&fit=crop&q=60" alt="Tênis">
        <h2>Tênis</h2>
        <p>R$ 200,00</p>
        <button onclick="adicionar('Tênis',200)">Comprar</button>
    </article>

    <article class="produto">
        <img src="https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=300&auto=format&fit=crop&q=60" alt="Boné">
        <h2>Boné</h2>
        <p>R$ 40,00</p>
        <button onclick="adicionar('Boné',40)">Comprar</button>
    </article>

</div>

<aside class="carrinho">
    <h2>Carrinho</h2>

    <ul id="lista"></ul>

    <h3>Total: R$ <span id="total">0.00</span></h3>

    <button onclick="finalizar()">Finalizar Compra</button>
</aside>

</main>

<footer>
    <p>&copy; 2026 Loja Simples. Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
