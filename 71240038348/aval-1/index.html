<!DOCTYPE html>
<html><head></head>
    <h1>calculadora</h1>

    <input id="n1" type="number">
    <input id="n2" type="number">

    <button onclick="somar()">somar</button>

    <p id="resultado"></p>

    <script>
     function somar() {
      let a = Number(document.getElementByld("n1").value);
      let b = Number(document.getElementByld("n2").value);  
       
      document.getElementByld("resultado").innertext = a + b;
     }
    </script>
    </body>
    </html>
