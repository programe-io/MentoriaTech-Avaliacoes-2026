<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paisagem da Copa do Mundo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
            background: #0b6623;
        }

        .paisagem {
            height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.45)),
                url("https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1600&q=80")
                center/cover no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .conteudo {
            background: rgba(0, 80, 30, 0.75);
            padding: 40px;
            border-radius: 20px;
            max-width: 700px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 55px;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 3px 3px 5px black;
        }

        p {
            font-size: 21px;
            line-height: 1.6;
        }

        .bola {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .botao {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 30px;
            background: #ffd700;
            color: #006400;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            transition: 0.3s;
        }

        .botao:hover {
            background: white;
            transform: scale(1.05);
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

    <section class="paisagem">
        <div class="conteudo">

            <div class="bola">⚽</div>

            <h1>Copa do Mundo</h1>

            <p>
                Uma bela paisagem de futebol representa a emoção,
                a energia e a união dos torcedores durante a Copa do Mundo.
                Os estádios, os campos verdes e as torcidas criam um cenário
                inesquecível para os amantes do futebol.
            </p>

            <a href="#" class="botao">Viva o Futebol!</a>

        </div>
    </section>

<script src="script.js"></script></body>
</html>
