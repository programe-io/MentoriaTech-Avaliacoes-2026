
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topo">
        <div>
            <h1>📦 Controle de Produtos</h1>
            <p>Gerencie seu estoque de forma simples.</p>
        </div>
    </header>

    <main class="container">

        <section class="resumo">
            <div class="card-resumo">
                <span>Total de produtos</span>
                <h2 id="totalProdutos">0</h2>
            </div>

            <div class="card-resumo">
                <span>Unidades em estoque</span>
                <h2 id="totalEstoque">0</h2>
            </div>

            <div class="card-resumo">
                <span>Valor do estoque</span>
                <h2 id="valorEstoque">R$ 0,00</h2>
            </div>
        </section>

        <section class="painel">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="descricao">Descrição do produto</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex.: Cadeira Gamer"
                        required
                        minlength="5"
                    >
                </div>

                <div class="campos-linha">
                    <div class="campo">
                        <label for="quantidade">Quantidade</label>
                        <input
                            type="number"
                            id="quantidade"
                            placeholder="Ex.: 12"
                            min="1"
                            step="1"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="valor">Valor unitário (R$)</label>
                        <input
                            type="number"
                            id="valor"
                            placeholder="Ex.: 699.00"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="botao-principal">
                    + Cadastrar produto
                </button>
            </form>
        </section>

        <section class="painel">
            <div class="titulo-tabela">
                <h2>Produtos cadastrados</h2>
                <input
                    type="search"
                    id="pesquisa"
                    placeholder="Pesquisar produto..."
                >
            </div>

            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor unitário</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="6" class="vazio">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <div id="mensagem" class="mensagem" role="status"
         aria-live="polite"></div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
