
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>SAÚDE & VIDA</h1>
        <p>Ficha de Anamnese do Paciente</p>
    </header>

    <main>

        <section class="formulario">

            <h2>Dados do Paciente</h2>

            <form id="formulario">

                <label>Nome completo:</label>
                <input type="text" id="nome" required>

                <label>Idade:</label>
                <input type="number" id="idade" min="0" required>

                <label>Telefone:</label>
                <input type="tel" id="telefone">

                <label>Data da consulta:</label>
                <input type="date" id="data" required>

                <h2>Histórico de Saúde</h2>

                <label>Possui alguma doença?</label>
                <textarea id="doenca"></textarea>

                <label>Possui alergia?</label>
                <textarea id="alergia"></textarea>

                <label>Utiliza medicamentos?</label>
                <textarea id="medicamento"></textarea>

                <label>Já realizou cirurgia?</label>
                <textarea id="cirurgia"></textarea>

                <h2>Queixas e Sintomas</h2>

                <label>Qual o principal motivo da consulta?</label>
                <textarea id="queixa" required></textarea>

                <label>Há quanto tempo apresenta os sintomas?</label>
                <textarea id="sintomas"></textarea>

                <label>Observações adicionais:</label>
                <textarea id="observacoes"></textarea>

                <button type="submit">Cadastrar Anamnese</button>

            </form>

        </section>

        <section class="registros">

            <h2>Pacientes Cadastrados</h2>

            <input type="text" id="pesquisa"
                placeholder="Pesquisar paciente pelo nome">

            <div id="lista"></div>

        </section>

    </main>

    <footer>
        <p>Saúde & Vida - Sistema de Anamnese 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
