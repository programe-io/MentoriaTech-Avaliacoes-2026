<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin-bottom: 5px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 25px auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .card h3 {
            color: #666;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }

        .formulario,
        .tabela-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            margin-bottom: 25px;
        }

        .formulario h2,
        .tabela-container h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        .campo input,
        .campo select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        .campo input:focus,
        .campo select:focus {
            border-color: #2563eb;
        }

        .botoes {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .pesquisa {
            margin-bottom: 15px;
        }

        .pesquisa input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8fafc;
        }

        .estoque-baixo {
            color: #dc2626;
            font-weight: bold;
        }

        .estoque-normal {
            color: #16a34a;
            font-weight: bold;
        }

        .acoes {
            display: flex;
            gap: 5px;
        }

        .acoes button {
            padding: 7px 10px;
            font-size: 12px;
        }

        @media (max-width: 900px) {
            .cards,
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .cards,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .tabela-container {
                overflow-x: auto;
            }

            table {
                min-width: 800px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header>
    <h1>📦 Sistema de Estoque</h1>
    <p>Controle de produtos, entradas e saídas</p>
</header>

<div class="container">

    <!-- DASHBOARD -->
    <div class="cards">

        <div class="card">
            <h3>Total de Produtos</h3>
            <p id="totalProdutos">0</p>
        </div>

        <div class="card">
            <h3>Itens em Estoque</h3>
            <p id="totalItens">0</p>
        </div>

        <div class="card">
            <h3>Estoque Baixo</h3>
            <p id="estoqueBaixo">0</p>
        </div>

        <div class="card">
            <h3>Valor do Estoque</h3>
            <p id="valorEstoque">R$ 0,00</p>
        </div>

    </div>

    <!-- CADASTRO -->
    <div class="formulario">

        <h2>➕ Cadastrar Produto</h2>

        <form id="formProduto">

            <div class="form-grid">

                <div class="campo">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" required>
                </div>

                <div class="campo">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" required>
                </div>

                <div class="campo">
                    <label for="fornecedor">Fornecedor</label>
                    <input type="text" id="fornecedor">
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="0" required>
                </div>

                <div class="campo">
                    <label for="minimo">Estoque Mínimo</label>
                    <input type="number" id="minimo" min="0" required>
                </div>

                <div class="campo">
                    <label for="preco">Preço de Custo</label>
                    <input type="number" id="preco" min="0" step="0.01" required>
                </div>

            </div>

            <div class="botoes">
                <button type="submit" class="btn-primary">
                    Cadastrar Produto
                </button>

                <button type="button" onclick="limparFormulario()">
                    Limpar
                </button>
            </div>

        </form>
    </div>

    <!-- MOVIMENTAÇÃO -->
    <div class="formulario">

        <h2>🔄 Movimentação de Estoque</h2>

        <div class="form-grid">

            <div class="campo">
                <label>Produto</label>
                <select id="produtoMovimentacao">
                    <option value="">Selecione</option>
                </select>
            </div>

            <div class="campo">
                <label>Tipo</label>
                <select id="tipoMovimentacao">
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>
            </div>

            <div class="campo">
                <label>Quantidade</label>
                <input type="number" id="quantidadeMovimentacao" min="1">
            </div>

        </div>

        <div class="botoes">
            <button class="btn-success" onclick="movimentarEstoque()">
                Registrar Movimentação
            </button>
        </div>

    </div>

    <!-- LISTA DE PRODUTOS -->
    <div class="tabela-container">

        <h2>📋 Produtos</h2>

        <div class="pesquisa">
            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar por código, nome ou categoria..."
                oninput="mostrarProdutos()"
            >
        </div>

        <table>

            <thead>
                <tr>
                    <th>Código</th>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Fornecedor</th>
                    <th>Quantidade</th>
                    <th>Mínimo</th>
                    <th>Preço</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaProdutos"></tbody>

        </table>

    </div>

</div>

<script>

    let produtos = JSON.parse(localStorage.getItem("produtos")) || [];

    const formProduto = document.getElementById("formProduto");

    formProduto.addEventListener("submit", function(event) {

        event.preventDefault();

        const codigo = document.getElementById("codigo").value.trim();
        const nome = document.getElementById("nome").value.trim();
        const categoria = document.getElementById("categoria").value.trim();
        const fornecedor = document.getElementById("fornecedor").value.trim();
        const quantidade = Number(document.getElementById("quantidade").value);
        const minimo = Number(document.getElementById("minimo").value);
        const preco = Number(document.getElementById("preco").value);

        const existe = produtos.some(
            produto => produto.codigo.toLowerCase() === codigo.toLowerCase()
        );

        if (existe) {
            alert("Já existe um produto com esse código.");
            return;
        }

        const produto = {
            id: Date.now(),
            codigo,
            nome,
            categoria,
            fornecedor,
            quantidade,
            minimo,
            preco
        };

        produtos.push(produto);

        salvarProdutos();

        formProduto.reset();

        alert("Produto cadastrado com sucesso!");

    });

    function salvarProdutos() {

        localStorage.setItem(
            "produtos",
            JSON.stringify(produtos)
        );

        mostrarProdutos();
        atualizarDashboard();
        atualizarSelect();

    }

    function mostrarProdutos() {

        const tabela = document.getElementById("listaProdutos");

        const pesquisa = document
            .getElementById("pesquisa")
            .value
            .toLowerCase();

        tabela.innerHTML = "";

        const filtrados = produtos.filter(produto =>

            produto.codigo.toLowerCase().includes(pesquisa) ||
            produto.nome.toLowerCase().includes(pesquisa) ||
            produto.categoria.toLowerCase().includes(pesquisa)

        );

        filtrados.forEach(produto => {

            const estoqueBaixo =
                produto.quantidade <= produto.minimo;

            const linha = document.createElement("tr");

            linha.innerHTML = `

                <td>${produto.codigo}</td>

                <td>${produto.nome}</td>

                <td>${produto.categoria}</td>

                <td>${produto.fornecedor || "-"}</td>

                <td>${produto.quantidade}</td>

                <td>${produto.minimo}</td>

                <td>
                    R$ ${produto.preco.toFixed(2).replace(".", ",")}
                </td>

                <td>
                    <span class="${estoqueBaixo ? "estoque-baixo" : "estoque-normal"}">
                        ${estoqueBaixo ? "⚠ Estoque baixo" : "✓ Normal"}
                    </span>
                </td>

                <td>

                    <div class="acoes">

                        <button
                            class="btn-danger"
                            onclick="excluirProduto(${produto.id})">
                            Excluir
                        </button>

                    </div>

                </td>

            `;

            tabela.appendChild(linha);

        });

    }

    function excluirProduto(id) {

        const produto = produtos.find(p => p.id === id);

        if (!produto) return;

        const confirmar = confirm(
            `Deseja excluir o produto "${produto.nome}"?`
        );

        if (!confirmar) return;

        produtos = produtos.filter(
            produto => produto.id !== id
        );

        salvarProdutos();

    }

    function atualizarDashboard() {

        const totalProdutos = produtos.length;

        const totalItens = produtos.reduce(
            (total, produto) => total + produto.quantidade,
            0
        );

        const baixo = produtos.filter(
            produto => produto.quantidade <= produto.minimo
        ).length;

        const valor = produtos.reduce(
            (total, produto) =>
                total + produto.quantidade * produto.preco,
            0
        );

        document.getElementById("totalProdutos").textContent =
            totalProdutos;

        document.getElementById("totalItens").textContent =
            totalItens;

        document.getElementById("estoqueBaixo").textContent =
            baixo;

        document.getElementById("valorEstoque").textContent =
            valor.toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL"
            });

    }

    function atualizarSelect() {

        const select =
            document.getElementById("produtoMovimentacao");

        select.innerHTML =
            '<option value="">Selecione</option>';

        produtos.forEach(produto => {

            const option =
                document.createElement("option");

            option.value = produto.id;

            option.textContent =
                `${produto.codigo} - ${produto.nome}`;

            select.appendChild(option);

        });

    }

    function movimentarEstoque() {

        const produtoId =
            Number(
                document.getElementById(
                    "produtoMovimentacao"
                ).value
            );

        const tipo =
            document.getElementById(
                "tipoMovimentacao"
            ).value;

        const quantidade =
            Number(
                document.getElementById(
                    "quantidadeMovimentacao"
                ).value
            );

        if (!produtoId) {
            alert("Selecione um produto.");
            return;
        }

        if (!quantidade || quantidade <= 0) {
            alert("Informe uma quantidade válida.");
            return;
        }

        const produto =
            produtos.find(
                produto => produto.id === produtoId
            );

        if (!produto) {
            alert("Produto não encontrado.");
            return;
        }

        if (
            tipo === "saida" &&
            quantidade > produto.quantidade
        ) {
            alert(
                "Não há quantidade suficiente em estoque."
            );
            return;
        }

        if (tipo === "entrada") {

            produto.quantidade += quantidade;

        } else {

            produto.quantidade -= quantidade;

        }

        salvarProdutos();

        document.getElementById(
            "quantidadeMovimentacao"
        ).value = "";

        alert("Movimentação registrada!");

    }

    function limparFormulario() {
        formProduto.reset();
    }

    mostrarProdutos();
    atualizarDashboard();
    atualizarSelect();

</script>

</body>
</html>
