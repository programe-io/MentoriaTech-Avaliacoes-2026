<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clone Instagram</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://jsdelivr.net"></script>
  <!-- Boxicons CDN (Para os ícones funcionarem) -->
  <link href="https://unpkg.com" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- 1. Topo: Logo, Busca e Navegação (Página 4) -->
  <header class="sticky top-0 bg-white border-b border-gray-200 z-50">
    <div class="max-w-5xl mx-auto px-4">
      <div class="flex items-center justify-between h-14">

        <h1 class="font-semibold text-lg">Instagram</h1>

        <input 
          type="text" 
          placeholder="Pesquisar" 
          class="hidden md:block bg-gray-100 px-4 py-2 rounded-lg text-sm focus:outline-none"
        />

        <div class="flex gap-4">
          <i class='bx bx-home text-xl cursor-pointer'></i>
          <i class='bx bx-heart text-xl cursor-pointer'></i>
        </div>

      </div>
    </div>
  </header>

  <!-- 2. Container do Conteúdo (Página 5) -->
  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex gap-8">
      
      <!-- Feed -->
      <div class="flex-1 max-w-lg mx-auto">
        <!-- Os cards de postagem e stories entrarão aqui dentro -->
      </div>

    </div>
  </main>

</body>
</html>
<!-- ============================================= -->
<!-- CRIAR A BARRA DE STORIES HORIZONTAL           -->
<!-- ============================================= -->
<section class="bg-white border rounded-lg p-4 mb-4">
    <div class="flex gap-4 overflow-x-auto">

        <!-- Item do Story -->
        <div class="flex flex-col items-center">
            <div class="w-16 h-16 rounded-full bg-gray-300"></div>
            <span class="text-xs mt-1">seu_story</span>
        </div>

    </div>
</section>

<!-- ============================================= -->
<!-- CRIAR UM CARD DE POSTAGEM                     -->
<!-- ============================================= -->
<article class="bg-white border rounded-lg mb-4">
    <!-- Header -->
    <div class="flex justify-between items-center p-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gray-300"></div>
            <span class="font-semibold text-sm">usuario</span>
        </div>
        <i class="bx bx-dots-horizontal"></i>
    </div>

    <!-- Imagem -->
    <img src="https://placeholder.com" class="w-full" />

    <!-- Ações -->
    <div class="p-4">
        <!-- O restante dos botões de ação e comentários continuam no próximo slide -->
    </div>
</article>
<aside class="hidden lg:block w-80">

  <div class="flex items-center gap-3 mb-4">
    <div class="w-12 h-12 rounded-full bg-gray-300"></div>
    <div>
      <p class="font-semibold text-sm">seu_usuario</p>
      <p class="text-xs text-gray-500">Seu nome</p>
    </div>
  </div>

</aside>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Mobile - Clone Instagram</title>
  
  <!-- CDN do Tailwind CSS -->
  <script src="https://tailwindcss.com"></script>
  
  <!-- CDN do Boxicons (necessário para os ícones bx-home, bx-search, etc.) -->
  <link href="https://unpkg.com" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Conteúdo principal da página (apenas para demonstração) -->
  <main class="p-4 pb-20">
    <h1 class="text-xl font-bold text-center mt-10">Conteúdo do Feed (Clone Instagram)</h1>
    <p class="text-gray-600 text-center mt-2 text-sm">Redimensione a tela ou abra no celular para ver o menu inferior.</p>
  </main>

  <!-- Código do Menu Mobile (conforme o slide) -->
  <nav class="md:hidden fixed bottom-0 w-full bg-white border-t">
    <div class="flex justify-around py-3">
      <i class='bx bx-home text-2xl text-gray-800 cursor-pointer'></i>
      <i class='bx bx-search text-2xl text-gray-800 cursor-pointer'></i>
      <i class='bx bx-plus text-2xl text-gray-800 cursor-pointer'></i>
      <i class='bx bx-heart text-2xl text-gray-800 cursor-pointer'></i>
    </div>
  </nav>

</body>
</html>
