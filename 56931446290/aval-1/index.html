<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto de Avaliação</title>

    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #eaeaea;
            color: #333;
            line-height: 1.6;
        }

        /* Cabeçalho */
        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        /* Navegação */
        nav {
            background-color: #444;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #00c3ff;
        }

        /* Conteúdo principal */
        main {
            padding: 20px;
        }

        section {
            background-color: white;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        section h2 {
            margin-bottom: 10px;
            color: #222;
        }

        /* Lista */
        ul {
            margin-left: 20px;
            margin-top: 10px;
        }

        li {
            margin-bottom: 5px;
        }

        /* Imagem */
        img {
            width: 200px;
            margin-top: 10px;
            border-radius: 10px;
            border: 2px solid #ccc;
        }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table, th, td {
            border: 1px solid #aaa;
        }

        th {
            background-color: #333;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        /* Formulário */
        form {
            margin-top: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 10px;
            padding: 10px;
            background-color: #00c3ff;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0099cc;
        }

        /* Rodapé */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

    </style>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<header>
    <h1>Minha Página</h1>
    <p>Projeto de avaliação HTML e CSS</p>
</header>

<nav>
    <a href="#">Início</a>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
</nav>

<main>

<section>
    <h2>Sobre mim</h2>
    <p>Meu nome é Carlos e estou aprendendo HTML e CSS.</p>

    <h3>Interesses:</h3>
    <ul>
        <li>Programação</li>
        <li>Jogos</li>
        <li>Esportes</li>
    </ul>

    <img src="https://via.placeholder.com/200" alt="Imagem exemplo">
</section>

<section>
    <h2>Tabela de estudos</h2>

    <table>
        <tr>
            <th>Dia</th>
            <th>Atividade</th>
        </tr>
        <tr>
            <td>Segunda</td>
            <td>HTML</td>
        </tr>
        <tr>
            <td>Terça</td>
            <td>CSS</td>
        </tr>
    </table>
</section>

<section>
    <h2>Contato</h2>

    <form>
        <label>Nome:</label>
        <input type="text">

        <label>Email:</label>
        <input type="email">

        <label>Mensagem:</label>
        <textarea></textarea>

        <button type="submit">Enviar</button>
    </form>
</section>

</main>

<footer>
    <p>© 2026 - Projeto de Avaliação</p>
</footer>

</body>
</html>
