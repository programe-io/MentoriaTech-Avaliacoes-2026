<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
</head>
<body>

    <header>
        <div class="header-content">
            <h1>MiniFeed 💗</h1>
            <nav>
                <a href="#">Cantinho</a>
                <a href="#">Meu Perfil 🧸</a>
            </nav>
        </div>
    </header>

    <main>

        <section class="new-post">
            <div class="user">
                <div class="avatar">D</div>
                <div>
                    <strong>Davi 🌸</strong>
                    <span>Espalhe um pouquinho de amor hoje... 💕</span>
                </div>
            </div>
            <button>Compartilhar 💌</button>
        </section>

        <article class="post">
            <div class="post-header">
                <div class="avatar">P</div>
                <div>
                    <strong>Pedro 🐻</strong>
                    <span>Há 15 minutos</span>
                </div>
            </div>
            <div class="post-test">
                Um dia lindo, cheio de paz, flores e coisas boas! 🌷☀️
            </div>
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800" alt="Paisagem natural">
            <div class="post-actions">
                <button>Curtir 💗</button>
                <button>Comentar 💬</button>
            </div>
        </article>

        <article class="post">
            <div class="post-header">
                <div class="avatar">M</div>
                <div>
                    <strong>Matheus 🐰</strong>
                    <span>Há 10 minutos</span>
                </div>
            </div>
            <div class="post-test">
                Meu momento favorito é ficar no meu cantinho fazendo o que amo! 🎮💕
            </div>
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800" alt="Setup gamer">
            <div class="post-actions">
                <button>Curtir 💗</button>
                <button>Comentar 💬</button>
            </div>
        </article>

        <article class="post">
            <div class="post-header">
                <div class="avatar">F</div>
                <div>
                    <strong>Felipe 🌻</strong>
                    <span>Há 17 minutos</span>
                </div>
            </div
  
  
</body>
</html>
