
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <h1>Calculadora de IMC</h1>

        <form id="form-pessoa">
            <label for="nome">Nome do paciente:</label>
            <input type="text" id="nome" required>

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1" min="1" required>

            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" step="0.01" min="0.5" required>

            <button type="submit">Calcular IMC</button>
        </form>

        <section id="resultado" class="resultado" hidden>
            <h2>Resultado do paciente</h2>
            <p id="nome-resultado"></p>
            <p id="peso-resultado"></p>
            <p id="altura-resultado"></p>
            <p id="imc-resultado"></p>
            <p id="classificacao"></p>
        </section>
    </main>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
