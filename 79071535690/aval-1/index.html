<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Feed</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Mini Social</h1>
    </header>

    <main>

        <section class="criar-post">
            <h2>Criar publicação</h2>

            <input
                type="text"
                id="nome"
                placeholder="Seu nome"
            >

            <textarea
                id="mensagem"
                placeholder="No que você está pensando?"
            ></textarea>

            <button id="publicar">
                Publicar
            </button>
        </section>

        <section>
            <h2>Feed</h2>

            <div id="feed">

                <div class="post">
                    <h3>Lucas</h3>

                    <p>
                        Olá! Essa é minha primeira publicação 😄
                    </p>

                    <div class="acoes">
                        <button class="curtir">
                            👍 Curtir
                            <span>0</span>
                        </button>

                        <button class="excluir">
                            🗑 Excluir
                        </button>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
