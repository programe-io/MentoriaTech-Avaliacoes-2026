<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Calculadora</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
\}

body {
    background: #151515;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
\}

.calculadora {
    background: #252525;
    padding: 25px;
    border-radius: 20px;
    width: 320px;
    box-shadow: 0 10px 30px #0008;
\}

#display {
    width: 100%;
    height: 75px;
    background: #111;
    border: none;
    border-radius: 10px;
    margin-bottom: 20px;
    color: white;
    font-size: 32px;
    text-align: right;
    padding: 15px;
\}

.botoes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
\}

button {
    height: 60px;
    border: none;
    border-radius: 12px;
    background: #3b3b3b;
    color: white;
    font-size: 22px;
    cursor: pointer;
    transition: 0.2s;
\}

button:hover {
    background: #555;
\}

.operador {
    background: #ff9500;
\}

.operador:hover {
    background: #e08700;
\}

.limpar {
    background: #d94343;
\}

.igual {
    background: #219653;
\}

.zero {
    grid-column: span 2;
\}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="calculadora">

    <input type="text" id="display" value="0" readonly>

    <div class="botoes">

        <button class="limpar" onclick="limpar()">AC</button>
        <button onclick="porcentagem()">%</button>
        <button onclick="apagar()">⌫</button>
        <button class="operador" onclick="adicionar('/')">÷</button>

        <button onclick="adicionar('7')">7</button>
        <button onclick="adicionar('8')">8</button>
        <button onclick="adicionar('9')">9</button>
        <button class="operador" onclick="adicionar('*')">×</button>

        <button onclick="adicionar('4')">4</button>
        <button onclick="adicionar('5')">5</button>
        <button onclick="adicionar('6')">6</button>
        <button class="operador" onclick="adicionar('-')">−</button>

        <button onclick="adicionar('1')">1</button>
        <button onclick="adicionar('2')">2</button>
        <button onclick="adicionar('3')">3</button>
        <button class="operador" onclick="adicionar('+')">+</button>

        <button class="zero" onclick="adicionar('0')">0</button>
        <button onclick="adicionar('.')">.</button>
        <button class="igual" onclick="calcular()">=</button>

    </div>
</div>

<script>
const display = document.getElementById("display");

function adicionar(valor) {
    if (display.value === "0" || display.value === "Erro") {
        display.value = valor;
    \} else {
        display.value += valor;
    \}
\}

function limpar() {
    display.value = "0";
\}

function apagar() {
    display.value = display.value.slice(0, -1) || "0";
\}

function porcentagem() {
    try {
        display.value = String(
            Number(display.value) / 100
        );
    \} catch {
        display.value = "Erro";
    \}
\}

function calcular() {
    try {
        const expressao = display.value;

        if (!/^[0-9+\\-*/.() ]+\$/.test(expressao)) {
            throw new Error();
        \}

        const resultado = Function(
            '"use strict"; return (' + expressao + ')'
        )();

        if (!Number.isFinite(resultado)) {
            throw new Error();
        \}

        display.value = String(
            Number(resultado.toPrecision(12))
        );

    \} catch {
        display.value = "Erro";
    \}
\}
</script>

<script src="script.js"></script></body>
</html>$0
