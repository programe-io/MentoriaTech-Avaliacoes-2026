<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Super Quiz da Turma</title>

    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="quiz-container">

        <header>

            <div>
                <p class="categoria">DESAFIO DO DIA</p>
                <h1>🧠 Super Quiz!</h1>
            </div>

            <div class="pontuacao-caixa">
                🏆 <span id="pontos">0</span>
            </div>

        </header>


        <div class="informacoes">

            <span id="contador">
                Pergunta 1 de 5
            </span>

            <span id="vidas">
                ❤️ ❤️ ❤️
            </span>

        </div>


        <div class="barra-fundo">
            <div id="barra-progresso"></div>
        </div>


        <main id="area-quiz">

            <h2 id="pergunta">
                Carregando pergunta...
            </h2>

            <div
                id="caixa-opcoes"
                class="grid-opcoes">
            </div>

            <p id="feedback"></p>

        </main>


        <div class="controles">

            <button
                id="btn-proximo"
                class="escondido">
                Próxima pergunta ➜
            </button>

        </div>


        <div
            id="resultado"
            class="resultado escondido">

            <div class="trofeu">
                🏆
            </div>

            <h2>Quiz finalizado!</h2>

            <p id="mensagem-final"></p>

            <div class="pontuacao-final">
                <span>Sua pontuação</span>
                <strong id="pontuacao-final">0</strong>
            </div>

            <button id="btn-jogar-novamente">
                🔄 Jogar novamente
            </button>

        </div>

    </div>


    <footer>
        <p>🎮 Super Quiz da Turma • Projeto HTML, CSS e JavaScript</p>
    </footer>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
