<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menino Ney - Mini Feed</title>
    <link rel="stylesheet" href="tws.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>⚽ Menino Ney</h1>
        <p>the perfect chaos</p>
    </header>

    <main>
        <section class="perfil">
            <img src="https://images.copaamerica.com/neymar_santos_1015b0713e.jpg"
                 alt="Foto de perfil">
            <h2>Neymar Jr. ⚡</h2>
            <p>Jogador de futebol 🇧🇷</p>
            <p>Craque dentro e fora de campo!</p>
            <button id="seguir">Seguir</button>
        </section>

        <section class="feed">
            <h2>Publicações</h2>

            <article class="post">
                <h3>Neymar Jr. ⚽</h3>
                <img src="https://conteudo.imguol.com.br/c/esporte/7d/2026/11/15/neymar-termina-participacao-em-torneio-de-poquer-em-10-lugar-1794793774710_v2_450x450.jpg"
                     alt="Publicação de futebol">
                <p>ousadia e alegria ❤️⚽</p>
                <button class="curtir">❤️ Curtir</button>
                <span class="contador">0 curtidas</span>
            </article>

            <article class="post">
                <h3>Neymar Jr. 🔥</h3>
                <img src="https://i.pinimg.com/736x/06/b1/ba/06b1ba102f127f23b2ec9e8f73ccd66d.jpg"
                     alt="Momento de futebol">
                <p>Drible, habilidade e alegria! 🇧🇷</p>
                <button class="curtir">❤️ Curtir</button>
                <span class="contador">0 curtidas</span>
            </article>
        </section>
    </main>

    <script src="njr.js"></script>
<script src="script.js"></script></body>
</html>
