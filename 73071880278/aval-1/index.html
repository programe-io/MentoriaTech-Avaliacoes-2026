<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Gerenciador de Tarefas</h1>

        <!-- Cadastro / Alteração -->
        <section class="formulario">

            <h2 id="tituloFormulario">Cadastrar Tarefa</h2>

            <input type="hidden" id="idTarefa">

            <label for="titulo">Título</label>
            <input 
                type="text" 
                id="titulo" 
                placeholder="Digite o título da tarefa"
            >

            <label for="descricao">Descrição</label>
            <textarea 
                id="descricao" 
                placeholder="Digite a descrição da tarefa"
            ></textarea>

            <button onclick="salvarTarefa()">Salvar Tarefa</button>

            <button 
                id="btnCancelar" 
                class="btn-cancelar" 
                onclick="cancelarEdicao()"
                style="display: none;"
            >
                Cancelar
            </button>

            <p id="mensagem"></p>

        </section>


        <!-- Busca -->
        <section class="busca">

            <h2>Buscar Tarefas</h2>

            <input 
                type="text" 
                id="campoBusca" 
                placeholder="Digite o título ou descrição"
                oninput="buscarTarefas()"
            >

        </section>


        <!-- Lista -->
        <section>

            <h2>Lista de Tarefas</h2>

            <div id="listaTarefas"></div>

        </section>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
