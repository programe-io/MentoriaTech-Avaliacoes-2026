<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mini Feed Social</title>
                <link rel="stylesheet" href="style.css">
                    <!-- Ícones externos para os botões -->
                        <link rel="stylesheet" href="https://cloudflare.com">
                        <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
                        <body>

                            <div class="feed-container">
                                    
                                            <!-- Bloco: Criar Novo Post -->
                                                    <div class="feed-card create-post">
                                                                <div class="post-header">
                                                                                <img src="https://unsplash.com" alt="Sua foto de perfil" class="avatar">
                                                                                                <textarea placeholder="No que você está pensando?"></textarea>
                                                                                                            </div>
                                                                                                                        <div class="create-post-actions">
                                                                                                                                        <button class="btn-secondary"><i class="fa-solid fa-image"></i> Foto</button>
                                                                                                                                                        <button class="btn-primary">Publicar</button>
                                                                                                                                                                    </div>
                                                                                                                                                                            </div>

                                                                                                                                                                                    <!-- Bloco: Card de Postagem Individual -->
                                                                                                                                                                                            <div class="feed-card">
                                                                                                                                                                                                        <!-- Cabeçalho do Post -->
                                                                                                                                                                                                                    <div class="post-header">
                                                                                                                                                                                                                                    <img src="https://unsplash.com" alt="Foto do usuário" class="avatar">
                                                                                                                                                                                                                                                    <div class="user-info">
                                                                                                                                                                                                                                                                        <h3 class="user-name">Rodrigo Silva</h3>
                                                                                                                                                                                                                                                                                            <span class="post-time">Há 2 horas</span>
                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                            <button class="btn-options"><i class="fa-solid fa-ellipsis"></i></button>
                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                    <!-- Conteúdo de Texto -->
                                                                                                                                                                                                                                                                                                                                                                <div class="post-content">
                                                                                                                                                                                                                                                                                                                                                                                <p>Codando meu novo projeto de portfólio usando Flexbox e Grid no CSS. O resultado está ficando animal! 🚀💻 #programacao #webdev</p>
                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                        <!-- Imagem do Post -->
                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="post-image">
                                                                                                                                                                                                                                                                                                                                                                                                                                    <img src="https://unsplash.com" alt="Código em uma tela">
                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Contador de Interações -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="post-status">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span class="likes-count"><i class="fa-solid fa-heart text-danger"></i> 42 curtidas</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span class="comments-count">12 comentários</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Botões de Ação -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="post-actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="action-btn"><i class="fa-regular fa-heart"></i> Curtir</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="action-btn"><i class="fa-regular fa-comment"></i> Comentar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="action-btn"><i class="fa-regular fa-share-from-square"></i> Compartilhar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    se
