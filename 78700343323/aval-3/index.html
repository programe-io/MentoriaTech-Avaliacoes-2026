<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dicionário Nordestino: O que é Muído?</title>
    
    <!-- O CSS começa aqui -->
    <style>
        /* Altera o fundo da página inteira e o tipo de letra */
        body {
            background-color: #fff8f0; /* Cor de fundo suave (bege/areia) */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a2c11; /* Texto num tom castanho escuro */
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            text-align: center;
        }

        /* Estiliza o título principal */
        h1 {
            color: #d94e34; /* Cor de tijolo/terracota */
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        /* Destaca a palavra 'Muído' com uma cor diferente e fundo */
        .destaque {
            background-color: #ffe699;
            color: #b25900;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Transforma o botão num elemento moderno e apelativo */
        button {
            background-color: #d94e34;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px; /* Bordas arredondadas */
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, background-color 0.2s; /* Animação suave */
        }

        /* Efeito visual quando passa o rato (mouse) por cima do botão */
        button:hover {
            background-color: #b23822;
            transform: scale(1.05); /* Aumenta ligeiramente de tamanho */
        }
    </style>
    <!-- O CSS termina aqui -->

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Dicionário Nordestino 🌵</h1>
    
    <p>Você sabe o que significa <span class="destaque">Muído</span>?</p>
    
    <p>No Nordeste, essa palavra significa uma conversa comprida, uma fofoca, uma confusão ou aquela reclamação cheia de lero-lero por algo sem importância.</p>

    <button onclick="alert('Deixe de muído e vá estudar CSS! 🎨')">Entendi o recado!</button>

</body>
</html>
