<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show do Milhão</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="quiz-container">
        <header>
            <h1>💰 Show do Milhão</h1>
            <div class="pontuacao-caixa"><span id="pontos">R$ 0</span></div>
        </header>

        <!-- Ajudas do Jogo -->
        <div id="painel-ajudas" class="painel-ajudas">
            <button id="btn-universitarios" class="btn-ajuda">🎓 Universitários</button>
            <button id="btn-cartas" class="btn-ajuda">🃏 Cartas</button>
            <button id="btn-pular" class="btn-ajuda">⏭️ Pular (<span id="pulos-restantes">3</span>)</button>
        </div>

        <main id="area-quiz">
            <h2 id="pergunta">Carregando pergunta...</h2>
            
            <div id="caixa-opcoes" class="grid-opcoes">
                <!-- Os botões das respostas vão aparecer aqui pelo JavaScript -->
            </div>
            
            <div id="mensagem-ajuda" class="mensagem-ajuda escondido"></div>
        </main>

        <div class="controles">
            <button id="btn-parar" class="btn-acao btn-parar">✋ Parar</button>
            <button id="btn-proximo" class="btn-acao escondido">Próxima Pergunta ➔</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
