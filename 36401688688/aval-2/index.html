<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória Neon</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h1>JOGO DA MEMÓRIA</h1>
    <p>Encontre todos os pares no menor tempo possível!</p>
  </header>

  <main class="container-jogo">
    <div class="painel-info">
      <div class="info-box">
        <span>Movimentos</span>
        <strong id="movimentos">0</strong>
      </div>
      <div class="info-box">
        <span>Tempo</span>
        <strong id="tempo">00:00</strong>
      </div>
    </div>

    <p id="status-jogo">Clique em uma carta para começar!</p>

    <div class="tabuleiro-memoria" id="tabuleiro"></div>

    <button id="btn-reiniciar">NOVO JOGO</button>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
