<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="cabecalho">
  <div>
    <span class="etiqueta">MINI FEED DA ANA CLARA</span>
    <h1>Conecta Clara ✦</h1>
    <p>Pequenas ideias também merecem ser compartilhadas.</p>
  </div>

  <span class="avatar" aria-label="Perfil de Ana Clara">AC</span>
</header>

<main class="container">
  <section class="card">
    <h2>O que você quer compartilhar?</h2>

    <form id="formulario">
      <label for="mensagem">Sua mensagem</label>

      <textarea
        id="mensagem"
        rows="4"
        maxlength="280"
        placeholder="Escreva uma ideia ou descoberta..."
        required
      ></textarea>

      <div class="acoes">
        <span id="contador">0/280</span>
        <button type="submit">Publicar</button>
      </div>
    </form>

    <p id="status" role="status"></p>
  </section>

  <h2>Publicações recentes</h2>
  <section id="feed" aria-label="Feed de publicações"></section>
</main>

<footer>
  Ana Clara • Mini Feed Social • Projeto de estudo
</footer>
  <script src="script.js"></script>
  
</body>
</html>
