<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>

        <!-- Área de nova publicação -->
        <section class="new-post">
            <div class="user">
                <div class="avatar">A</div>

                <div>
                    <strong>Arthur</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>

            <button id="publishBtn">Publicar</button>
        </section>

        <!-- Primeira postagem -->
        <article class="post">

            <div class="post-header">
                <div class="avatar">P</div>

                <div>
                    <strong>Pedro</strong>
                    <span>há 10 minutos</span>
                </div>
            </div>

            <p class="post-text">
                Acabei de assistir Homem-Aranha e gostei muito do filme!
            </p>

            <img
                src="https://images.unsplash.com/photo-1531259683007-016a7b628fc3"
                alt="Pessoa usando roupa inspirada em super-herói">

            <div class="post-actions">
                <button class="likeBtn">Curtir</button>
                <button class="commentBtn">Comentar</button>
            </div>

        </article>

        <!-- Segunda postagem -->
        <article class="post">

            <div class="post-header">
                <div class="avatar">M</div>

                <div>
                    <strong>Maria</strong>
                    <span>há 30 minutos</span>
                </div>
            </div>

            <p class="post-text">
                Hoje foi um ótimo dia para aprender HTML, CSS e JavaScript!
            </p>

            <div class="post-actions">
                <button class="likeBtn">Curtir</button>
                <button class="commentBtn">Comentar</button>
            </div>

        </article>

    </main>

    <footer>
        <p>&copy; 2026 Mini Feed - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
