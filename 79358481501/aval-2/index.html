
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mini Feed</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>Mini Feed</h1>
                                    <p>Compartilhe seus momentos!</p>
                                        </header>

                                            <main class="container">

                                                    <section class="postar">
                                                                <h2>Nova publicação</h2>

                                                                            <input type="text" id="usuario"
                                                                                            placeholder="Seu nome">

                                                                                                        <textarea id="mensagem"
                                                                                                                        placeholder="O que você está pensando?"></textarea>

                                                                                                                                    <button onclick="publicar()">
                                                                                                                                                    Publicar
                                                                                                                                                                </button>
                                                                                                                                                                        </section>

                                                                                                                                                                                <section class="feed">
                                                                                                                                                                                            <h2>Publicações</h2>
                                                                                                                                                                                                        <div id="publicacoes">

                                                                                                                                                                                                                        <article class="post">
                                                                                                                                                                                                                                            <h3>Lucas</h3>
                                                                                                                                                                                                                                                                <p>Hoje foi um dia incrível! ☀️</p>

                                                                                                                                                                                                                                                                                    <button onclick="curtir(this)">
                                                                                                                                                                                                                                                                                                            ❤️ Curtir <span>0</span>
                                                                                                                                                                                                                                                                                                                                </button>
                                                                                                                                                                                                                                                                                                                                                </article>

                                                                                                                                                                                                                                                                                                                                                                <article class="post">
                                                                                                                                                                                                                                                                                                                                                                                    <h3>Mariana</h3>
                                                                                                                                                                                                                                                                                                                                                                                                        <p>Aproveitando cada momento! ✨</p>

                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="curtir(this)">
                                                                                                                                                                                                                                                                                                                                                                                                                                                    ❤️ Curtir <span>0</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </article>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>© 2026 - Mini Feed</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
