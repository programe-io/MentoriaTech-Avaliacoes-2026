<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz ENEM | Preparação Completa</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="quiz-container">
        <header>
            <h1>📝 Quiz ENEM</h1>
            <div class="pontuacao-caixa">Pontos: <span id="pontos">0</span></div>
        </header>

        <div class="area-materia">
            <span id="nome-materia" class="etiqueta-materia"></span>
        </div>

        <main id="area-quiz">
            <h2 id="pergunta">Carregando pergunta...</h2>
            
            <div id="caixa-opcoes" class="grid-opcoes">
                <!-- Respostas geradas pelo JavaScript -->
            </div>
        </main>

        <div class="controles">
            <button id="btn-proximo" class="escondido">Próxima ➔</button>
        </div>

        <div class="progresso">
            <span id="contador-perguntas">1 / 10</span>
            <div class="barra-progresso">
                <div id="preencher-progresso"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
