<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>🧠 Jogo da Memória</h1>
        <p>Encontre os pares iguais!</p>
    </header>

    <main class="container-jogo">
        <div class="painel-info">
            <p>Tentativas: <span id="contador">0</span></p>
            <p>Pares: <span id="pares-encontrados">0</span> / 8</p>
        </div>

        <div class="tabuleiro-memoria" id="tabuleiro">
            <!-- As cartas serão geradas pelo JavaScript -->
        </div>

        <button id="btn-reiniciar">🔄 Reiniciar Jogo</button>
    </main>

    <footer>
        <p>&copy; 2026 Jogo da Memória</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
