
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Cadastro de Produtos</h1>
        <p class="subtitulo">Sistema de gerenciamento de produtos</p>

        <form id="formProduto">

            <label>Nome do produto:</label>
            <input type="text" id="nome"
                placeholder="Digite o nome do produto" required>

            <label>Código do produto:</label>
            <input type="text" id="codigo"
                placeholder="Digite o código" required>

            <label>Preço (R$):</label>
            <input type="number" id="preco"
                placeholder="Ex: 50.00" step="0.01" min="0.01" required>

            <label>Quantidade:</label>
            <input type="number" id="quantidade"
                placeholder="Ex: 10" min="1" step="1" required>

            <label>Categoria:</label>
            <select id="categoria" required>
                <option value="">Selecione uma categoria</option>
                <option value="Eletrônicos">Eletrônicos</option>
                <option value="Alimentos">Alimentos</option>
                <option value="Roupas">Roupas</option>
                <option value="Acessórios">Acessórios</option>
                <option value="Outros">Outros</option>
            </select>

            <button type="submit">Cadastrar Produto</button>

        </form>

        <div class="lista">
            <h2>Produtos Cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Código</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                            <th>Categoria</th>
                            <th>Ação</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>

            <h3 id="totalEstoque">Valor total do estoque: R$ 0,00</h3>
        </div>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
