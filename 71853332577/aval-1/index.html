
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <header>
            <div class="logo">✓ TaskFlow</div>
            <p>Organize suas tarefas e aumente sua produtividade.</p>
        </header>

        <main>

            <section class="dashboard">
                <div class="stat-card">
                    <span>Total de tarefas</span>
                    <h2 id="totalTasks">0</h2>
                </div>

                <div class="stat-card">
                    <span>Pendentes</span>
                    <h2 id="pendingTasks">0</h2>
                </div>

                <div class="stat-card">
                    <span>Concluídas</span>
                    <h2 id="completedTasks">0</h2>
                </div>
            </section>

            <section class="task-section">

                <h2>Minhas tarefas</h2>

                <form id="taskForm">
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Digite uma nova tarefa..."
                        maxlength="100"
                        required
                    >

                    <button type="submit">+ Adicionar</button>
                </form>

                <div class="filters">
                    <button class="filter active" data-filter="all">
                        Todas
                    </button>

                    <button class="filter" data-filter="pending">
                        Pendentes
                    </button>

                    <button class="filter" data-filter="completed">
                        Concluídas
                    </button>
                </div>

                <div id="taskList" class="task-list">
                    <p class="empty">Nenhuma tarefa cadastrada.</p>
                </div>

            </section>

        </main>

        <footer>
            <p>TaskFlow © 2026 — Gerenciador de Tarefas</p>
        </footer>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
