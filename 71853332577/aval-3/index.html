
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Ficha de Anamnese</h1>
    <p>Sistema de cadastro e avaliação de pacientes</p>
</header>

<main>
    <form id="formAnamnese">

        <section>
            <h2>Dados pessoais</h2>

            <div class="grid">
                <div>
                    <label>Nome completo</label>
                    <input type="text" id="nome" required>
                </div>

                <div>
                    <label>Data de nascimento</label>
                    <input type="date" id="nascimento" required>
                </div>

                <div>
                    <label>CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00">
                </div>

                <div>
                    <label>Telefone</label>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000">
                </div>

                <div>
                    <label>Sexo</label>
                    <select id="sexo">
                        <option value="">Selecione</option>
                        <option>Masculino</option>
                        <option>Feminino</option>
                        <option>Outro</option>
                        <option>Prefiro não informar</option>
                    </select>
                </div>

                <div>
                    <label>Profissão</label>
                    <input type="text" id="profissao">
                </div>
            </div>
        </section>

        <section>
            <h2>Histórico de saúde</h2>

            <label>Possui alguma doença?</label>
            <textarea id="doencas" placeholder="Descreva..."></textarea>

            <label>Faz uso de medicamentos?</label>
            <textarea id="medicamentos" placeholder="Informe os medicamentos..."></textarea>

            <label>Possui alergias?</label>
            <textarea id="alergias" placeholder="Informe as alergias..."></textarea>

            <label>Já realizou alguma cirurgia?</label>
            <textarea id="cirurgias" placeholder="Descreva..."></textarea>
        </section>

        <section>
            <h2>Informações clínicas</h2>

            <div class="grid">
                <div>
                    <label>Peso (kg)</label>
                    <input type="number" id="peso" step="0.1" min="0">
                </div>

                <div>
                    <label>Altura (cm)</label>
                    <input type="number" id="altura" min="0">
                </div>

                <div>
                    <label>Pressão arterial</label>
                    <input type="text" id="pressao" placeholder="Ex: 12/8">
                </div>

                <div>
                    <label>Temperatura (°C)</label>
                    <input type="number" id="temperatura" step="0.1">
                </div>
            </div>

            <label>Queixa principal</label>
            <textarea id="queixa" required placeholder="Qual o motivo da consulta?"></textarea>

            <label>Sintomas apresentados</label>
            <textarea id="sintomas" placeholder="Descreva os sintomas..."></textarea>

            <label>Observações adicionais</label>
            <textarea id="observacoes" placeholder="Outras informações..."></textarea>
        </section>

        <button type="submit">Salvar anamnese</button>
        <button type="reset" class="limpar">Limpar formulário</button>

    </form>

    <section class="cadastros">
        <h2>Pacientes cadastrados</h2>
        <input type="search" id="pesquisa" placeholder="Pesquisar paciente...">
        <div id="listaPacientes"></div>
    </section>

</main>

<footer>
    <p>Sistema de Anamnese | Projeto Educacional</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
