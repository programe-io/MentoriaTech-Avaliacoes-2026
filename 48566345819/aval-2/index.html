
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>MiniFeed</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#perfil">Perfil</a>
        </nav>
    </header>

    <main>
        <section class="card criar">
            <div class="avatar">J</div>

            <div class="campo">
                <strong>Jonathan</strong>
                <input id="texto" type="text"
                       placeholder="O que você está pensando?">
            </div>

            <button onclick="publicar()">Publicar</button>
        </section>

        <section id="feed">
            <article class="card post">
                <div class="perfil">
                    <div class="avatar">M</div>
                    <div class="info">
                        <strong>Maria</strong>
                        <small>Há 10 minutos</small>
                    </div>
                </div>

                <p class="mensagem">
                    Hoje eu vi o novo filme do homiranha, top, tô feliz :D
                </p>

                <img
                    class="postagem-img"
                    src="https://m.media-amazon.com/images/S/pv-target-images/f5e4cc7c28becb45dc981ed3859397930593220676c899ba46169ad162fa82d2.jpg"
                    alt="Imagem da publicação">

                <div class="acoes">
                    <button onclick="curtir(this)">Curtir</button>
                    <button onclick="comentar(this)">Comentar</button>
                </div>

                <div class="comentarios"></div>
            </article>
        </section>
    </main>

    <footer>
        MiniFeed - Todos os Direitos Reservados - 2026
    </footer>

    <script src="script.js"></script>
</body>
</html>
