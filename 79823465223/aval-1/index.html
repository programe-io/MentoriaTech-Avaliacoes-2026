<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniFeed</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>

        <div class="header-content">

            <h1>MiniFeed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>

        </div>

    </header>


    <main>

        <section class="new-post">

            <div class="user">

                <div class="avatar">
                    H
                </div>

                <div>
                    <strong>Heloa</strong>
                    <span>O que você está pensando?</span>
                </div>

            </div>

            <button>Publicar</button>

        </section>


        <article class="post">

            <div class="post-header">

                <div class="avatar">
                    R
                </div>

                <div>
                    <strong>Ravena</strong>
                    <span>Há 10 minutos</span>
                </div>

            </div>


            <div class="post-text">

                Hoje eu vi um filme que se chama
                Batman (O Cavaleiro das Trevas).
                Top, estou feliz :D

            </div>


            <!-- NOVA IMAGEM -->

            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQC0MISV7-9CDbxC2gcXI--ZZo5DiqxqLXXXTyI0FMZ96pXPt7bLx0AXes&s=10"
                alt="Imagem do Batman"
            >


            <div class="post-actions">

                <button>
                    ❤️ Curtir
                </button>

                <button>
                    💬 Comentar
                </button>

            </div>


            <div class="comment-box">

                <input
                    type="text"
                    placeholder="Escreva um comentário..."
                >

                <button>
                    Enviar
                </button>

            </div>

        </article>

    </main>


    <footer>

        <p>
            MiniFeed - Todos os Direitos Reservados - 2026
        </p>

    </footer>

</body>

</html>
