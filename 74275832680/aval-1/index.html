
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Gerenciamento de estoque</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <input type="text" id="descricao"
                placeholder="Descrição do produto">

            <input type="number" id="quantidade"
                placeholder="Quantidade">

            <input type="number" id="valor"
                placeholder="Valor do produto" step="0.01">

            <button onclick="cadastrar()">Cadastrar Produto</button>
        </section>

        <section class="formulario">
            <h2>Atualizar Produto</h2>

            <input type="number" id="codigo"
                placeholder="Código do produto">

            <input type="number" id="novoValor"
                placeholder="Novo valor" step="0.01">

            <button onclick="atualizarPreco()">
                Atualizar Valor
            </button>

            <input type="number" id="novaQuantidade"
                placeholder="Quantidade para adicionar">

            <button onclick="atualizarEstoque()">
                Atualizar Quantidade
            </button>
        </section>

        <section class="lista">
            <h2>Produtos Cadastrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody id="tabelaProdutos">
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
