<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clone Instagram - Futsal & Stories</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cloudflare.com">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

  <div class="instagram-container">
    
    <!-- Barra de Stories (2 Stories) -->
    <div class="stories-container">
      <div class="story-item" onclick="openStory('futsal.pro', 'https://unsplash.com')">
        <div class="story-ring">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/06/Futebol_Salao_Pan2007.jpg?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original" alt="futsal.pro">
        </div>
        <span class="story-username">futsal.pro</span>
      </div>

      <div class="story-item" onclick="openStory('falcao_oficial', 'https://unsplash.com')">
        <div class="story-ring">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6hZFgCVZbY6LC_4H0sOdTvpGC1ZJhLFyiGXVjo9QL_Q&s=10" alt="falcao_oficial">
        </div>
        <span class="story-username">falcao_oficial</span>
      </div>
    </div>

    <!-- Post do Feed -->
    <div class="post">
      <div class="post-header">
        <div class="user-info">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/06/Futebol_Salao_Pan2007.jpg?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original" alt="Avatar" class="avatar">
          <span class="username">futsal.pro</span>
        </div>
        <i class="fa-solid fa-ellipsis"></i>
      </div>

      <div class="post-image">
        <img src="https://static.mundoeducacao.uol.com.br/mundoeducacao/2022/10/falcao-futsal.jpg" alt="Partida de Futsal">
      </div>

      <div class="post-actions">
        <div class="left-actions">
          <i class="fa-regular fa-heart like-btn" id="likeIcon"></i>
          <i class="fa-regular fa-comment"></i>
          <i class="fa-regular fa-paper-plane"></i>
        </div>
        <div class="right-actions">
          <i class="fa-regular fa-bookmark"></i>
        </div>
      </div>

      <div class="post-likes">
        Curtido por <strong id="likeCount">1.240</strong> pessoas
      </div>

      <div class="post-caption">
        <span class="username">futsal.pro</span> 
        Golaço de falta na gaveta! 🔥⚽ Quem joga desse jeito na quadra merece camisa 10. O que acharam do lance?
      </div>

      <div class="post-comments">
        <p><span>joao_quadra</span> Joga demais! ⚡</p>
        <p><span>goleiro_raiz</span> Nem vi a bola passar...</p>
      </div>

      <div class="post-add-comment">
        <input type="text" placeholder="Adicione um comentário...">
        <button>Publicar</button>
      </div>
    </div>

  </div>

  <!-- Modal de Visualização do Story -->
  <div class="story-modal" id="storyModal" onclick="closeStory()">
    <div class="story-content" onclick="event.stopPropagation()">
      <div class="story-modal-header">
        <span id="storyModalUser">usuario</span>
        <i class="fa-solid fa-xmark" onclick="closeStory()"></i>
      </div>
      <img id="storyModalImg" src="" alt="Story">
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
