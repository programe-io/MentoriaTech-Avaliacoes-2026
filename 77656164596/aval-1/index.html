<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Clima</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body class="bg-default">

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-cloud-sun-rain"></i> Portal do Clima</h1>
            <p>Descubra as condições meteorológicas em tempo real</p>
        </header>

        <main>
            <div class="search-box">
                <input type="text" id="city-input" placeholder="Digite o nome da cidade...">
                <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <div class="weather-card hidden" id="weather-card">
                <h2 id="city-name">São Paulo, BR</h2>
                
                <div class="weather-main">
                    <i id="weather-icon" class="fa-solid fa-sun"></i>
                    <span id="temperature">25°C</span>
                </div>

                <p id="weather-description">Ensolarado</p>

                <div class="weather-details">
                    <div class="detail-item">
                        <i class="fa-solid fa-droplet"></i>
                        <div>
                            <p>Umidade</p>
                            <span id="humidity">60%</span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fa-solid fa-wind"></i>
                        <div>
                            <p>Vento</p>
                            <span id="wind-speed">15 km/h</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="error-message" class="error-msg hidden">
                Cidade não encontrada. Tente novamente!
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Portal do Clima. Criado com HTML, CSS e JS.</p>
        </footer>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
