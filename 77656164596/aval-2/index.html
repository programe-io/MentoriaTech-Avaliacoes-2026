<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Squirrel Adventure - Final Stable</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div id="game-window">
        <div id="bg-sky" class="parallax-layer"></div>
        <div id="bg-mountain" class="parallax-layer"></div>
        <div id="bg-clouds" class="parallax-layer"></div>

        <header>
            <nav id="ui">
                <a href="#" style="text-decoration: none; color: inherit;">
                    <div class="score-container">
                        <div class="label">SCORE</div>
                        <div id="score">000000</div>
                    </div>
                </a>
                
                <div class="center-status" id="power-display">PEQUENO</div>
                
                <a href="#" style="text-decoration: none; color: inherit;">
                    <div class="lives-container">
                        <div class="label">LIVES</div>
                        <div id="lives-sprites">
                            <span class="heart"></span>
                            <span class="heart"></span>
                            <span class="heart"></span>
                        </div>
                    </div>
                </a>
            </nav>
        </header>

        <main id="world">
            <article id="player" class="state-idle">
                <div class="squirrel-sprite">
                    <div class="ear"></div>
                    <div class="eye"></div>
                    <div class="tail"></div>
                    <div class="body-main"></div>
                    <div class="feet-container">
                        <div class="foot foot-1"></div>
                        <div class="foot foot-2"></div>
                    </div>
                </div>
            </article>
        </main>

        <aside id="game-controls-info" style="display: none;">
            <h3>Como Jogar</h3>
            <p>Controles: Setas para mover, Espaço para pular.</p>
            <img src="icon.png" alt="Controles" style="display: none;">
        </aside>

        <div id="game-over-screen">
            <div class="game-over-box">
                <h1>GAME OVER</h1>
                <div class="final-score">TOTAL SCORE: <span id="final-score-val">000000</span></div>
                <p class="blink-text">PRESSIONE ESPAÇO PARA REINICIAR</p>
            </div>
        </div>

        <footer style="display: none;">
            <p>Retro Squirrel Adventure &copy; 2026</p>
        </footer>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
