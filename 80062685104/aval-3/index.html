<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram</title>
    <!-- Tailwind CSS via Play CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- Boxicons Font CDN -->
    <link href="https://unpkg.com" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="min-h-screen bg-gray-100 text-slate-900">

    <!-- 5 e 6. Cabeçalho (Header) -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <!-- Logo do Instagram -->
                <span class="text-xl font-semibold select-none">Instagram</span>
                
                <!-- Botão de menu -->
                <button class="flex items-center justify-center p-2 focus:outline-none">
                    <i class="bx bx-menu text-2xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 7. Estrutura do Conteúdo Principal (Main) -->
    <main class="max-w-5xl mx-auto py-4 pb-20 px-4">
        <div class="flex gap-8">
            
            <!-- 8. Estrutura do Feed -->
            <div class="flex-1 max-w-lg mx-auto">
                
                <!-- Seção de Stories -->
                <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">
                    <!-- 11. Organização dos stories em linha com rolagem horizontal -->
                    <div class="flex gap-4 overflow-x-auto scrollbar-none">
                        
                        <!-- 9. Elemento de adicionar story -->
                        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                            <!-- Estrutura da bolinha do story -->
                            <div class="w-16 h-16 rounded-full bg-gray-100 p-[2px]">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">
                                        <!-- Ícone de adicionar story -->
                                        <span class="text-2xl text-gray-500 font-light">+</span>
                                    </div>
                                </div>
                            </div>
                            <span class="text-xs mt-1 text-center w-16 truncate">Seu story</span>
                        </div>

                        <!-- 10. Story de contato (efeito gradiente) -->
                        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                            <div class="w-16 h-16 rounded-full bg-gray-100 p-[2px]">
                                <!-- Gradiente colorido na borda do direct -->
                                <div class="w-full h-full rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-[2px]">
                                    <!-- Imagem de perfil do story -->
                                    <img src="https://unsplash.com" alt="Foto de perfil de João" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <!-- Nome abaixo do story -->
                            <span class="text-xs mt-1 text-center w-16 truncate">João</span>
                        </div>

                        <!-- Itens duplicados para testar o scroll horizontal (Item 11) -->
                        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                            <div class="w-16 h-16 rounded-full bg-gray-100 p-[2px]">
                                <div class="w-full h-full rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-[2px]">
                                    <img src="https://unsplash.com" alt="Perfil" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <span class="text-xs mt-1 text-center w-16 truncate">Maria</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                            <div class="w-16 h-16 rounded-full bg-gray-100 p-[2px]">
                                <div class="w-full h-full rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-[2px]">
                                    <img src="https://unsplash.com" alt="Perfil" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <span class="text-xs mt-1 text-center w-16 truncate">Ana_Silva</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                            <div class="w-16 h-16 rounded-full bg-gray-100 p-[2px]">
                                <div class="w-full h-full rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-[2px]">
                                    <img src="https://unsplash.com" alt="Perfil" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <span class="text-xs mt-1 text-center w-16 truncate">Pedro</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                            <div class="w-16 h-16 rounded-full bg-gray-100 p-[2px]">
                                <div class="w-full h-full rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-[2px]">
                                    <img src="https://unsplash.com" alt="Perfil" class="w-full h-full object-cover rounded-full">
                                </div>
                            </div>
                            <span class="text-xs mt-1 text-center w-16 truncate">Lucas_Dev</span>
                        </div>

                    </div>
                </section>

                <!-- 12. Início da construção do feed de postagens -->
                <article class="bg-white border border-gray-200 rounded-lg mb-4">
                    <!-- Cabeçalho da postagem -->
                    <header class="flex items-center justify-between p-3">
                        <div class="flex items-center gap-3">
                            <!-- 13. Reaproveitamento da estrutura circular (Tamanho reduzido para w-10 h-10) -->
                            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-[2px] cursor-pointer">
                                <img src="https://unsplash.com" alt="Foto de perfil de João" class="w-full h-full object-cover rounded-full">
                            </div>
                            <!-- Nome do usuário e localização -->
                            <div class="flex flex-col">
                                <span class="text-sm font-semibold cursor-pointer hover:underline">João</span>
                                <span class="text-xs text-gray-500">São Paulo, Brazil</span>
                            </div>
                        </div>
                        <!-- Botão de opções da postagem -->
                        <button class="text-gray-600 hover:text-gray-900">
                            <i class="bx bx-dots-horizontal-rounded text-xl"></i>
                        </button>
                    </header>

                    <!-- Espaço reservado para a foto da postagem (Parte 2 do projeto) -->
                    <div class="bg-gray-50 aspect-square w-full flex items-center justify-center border-t border-b border-gray-100">
                        <p class="text-gray-400 text-sm">Espaço da imagem da postagem (Parte 2)</p>
                    </div>
                </article>

            </div>

            <!-- Coluna Lateral Opcional (Oculta em telas menores, estruturada via Flexbox) -->
            <div class="hidden md:block w-72 flex-shrink-0">
                <!-- Conteúdo lateral como sugestões pode ser inserido aqui -->
            </div>

        </div>
    </main>

<script src="script.js"></script></body>
</html>
