<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Acompanhamento - Mentoria TEC</title>
<style>
body{
    font-family: Verdana, sans-serif;
    background:#e8f5e9;
    margin:0;
    padding:20px;
}
.card{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
h1{
    text-align:center;
    color:#1b5e20;
}
p{
    text-align:center;
    color:#555;
}
.grupo{
    margin-bottom:18px;
}
label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}
input, textarea, select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}
textarea{
    resize:vertical;
}
.botao{
    width:100%;
    background:#2e7d32;
    color:white;
    border:none;
    padding:14px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}
.botao:hover{
    background:#1b5e20;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="card">
    <h1>Relatório de Mentoria TEC</h1>
    <p>Preencha as informações abaixo.</p>
    <form>
        <div class="grupo">
            <label>Nome Completo</label>
            <input type="text" required>
        </div>
        <div class="grupo">
            <label>Unidade Escolar</label>
            <input type="text" required>
        </div>
        <div class="grupo">
            <label>Cidade</label>
            <input type="text" required>
        </div>
        <div class="grupo">
            <label>Turma Acompanhada</label>
            <input type="text">
        </div>
        <div class="grupo">
            <label>Período Avaliado</label>
            <input type="month">
        </div>
        <div class="grupo">
            <label>Descreva as ações realizadas</label>
            <textarea rows="4"></textarea>
        </div>
        <div class="grupo">
            <label>Impactos observados</label>
            <textarea rows="4"></textarea>
        </div>
        <div class="grupo">
            <label>Desafios enfrentados</label>
            <textarea rows="4"></textarea>
        </div>
        <div class="grupo">
            <label>Sugestões para melhorias</label>
            <textarea rows="4"></textarea>
        </div>
        <button class="botao" type="submit">
            Enviar Relatório
        </button>
    </form>
</div>
</body>
</html>
