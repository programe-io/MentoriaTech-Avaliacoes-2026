<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sthefany Vitória</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#7c3aed,#a855f7,#ec4899);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:90%;
    max-width:700px;
    background:white;
    border-radius:20px;
    padding:40px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
    color:#7c3aed;
    font-size:42px;
    margin-bottom:10px;
}

h2{
    color:#555;
    margin-bottom:25px;
}

p{
    color:#666;
    line-height:1.8;
    font-size:18px;
}

iframe{
    width:100%;
    height:350px;
    border:none;
    border-radius:15px;
    margin:30px 0;
}

button{
    background:#7c3aed;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#9333ea;
}

footer{
    margin-top:25px;
    color:#777;
}
</style>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="card">

<h1>Sthefany Vitória</h1>

<h2>Meu Site em HTML</h2>

<p>
Olá! Seja bem-vindo(a) ao meu site.
Este projeto foi desenvolvido utilizando HTML e CSS para demonstrar meus conhecimentos em desenvolvimento web.
</p>

<iframe
src="https://www.youtube.com/embed/hZFjLm5j2zc"
allowfullscreen>
</iframe>

<button>Saiba Mais</button>

<footer>
© 2026 • Desenvolvido por Sthefany Vitória 💜
</footer>

</div>

</body>
</html>
