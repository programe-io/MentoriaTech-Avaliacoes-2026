<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfólio - Sthefany Vitória</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background:linear-gradient(135deg,#6d28d9,#9333ea,#ec4899);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    max-width:800px;
    width:100%;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:25px;
    padding:40px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,.4);
}

h1{
    font-size:3rem;
    color:#f9a8d4;
    margin-bottom:10px;
}

h2{
    color:#ffffff;
    margin-bottom:20px;
}

p{
    line-height:1.8;
    color:#f3f4f6;
    margin-bottom:20px;
}

.video{
    position:relative;
    width:100%;
    padding-bottom:56.25%;
    margin:30px 0;
    border-radius:20px;
    overflow:hidden;
}

.video iframe{
    position:absolute;
    width:100%;
    height:100%;
    left:0;
    top:0;
}

.btn{
    display:inline-block;
    padding:15px 35px;
    background:#f9a8d4;
    color:#6d28d9;
    text-decoration:none;
    font-weight:bold;
    border-radius:50px;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    background:#ffffff;
}

.footer{
    margin-top:30px;
    color:#e5e7eb;
    font-size:14px;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">

<h1>Sthefany Vitória</h1>
<h2>Meu Portfólio</h2>

<p>
Seja bem-vindo(a)! Este site foi criado para apresentar um pouco sobre mim,
meus estudos e meu interesse por tecnologia, programação e desenvolvimento web.
</p>

<div class="video">
<iframe src="https://www.youtube.com/embed/hZFjLm5j2zc"
title="Vídeo"
frameborder="0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
allowfullscreen>
</iframe>
</div>

<a href="#" class="btn">Conheça Meu Trabalho</a>

<div class="footer">
Desenvolvido por Sthefany Vitória • 2026 💜
</div>

</div>

</body>
</html>
