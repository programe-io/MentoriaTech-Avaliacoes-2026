<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>📦 Controle de Estoque</h1>

        <div class="formulario">
            <input type="hidden" id="produtoId">

            <input type="text" id="nome" placeholder="Nome do produto">

            <input type="number" id="quantidade" placeholder="Quantidade" min="0">

            <input type="number" id="preco" placeholder="Preço" min="0" step="0.01">

            <button onclick="salvarProduto()" id="btnSalvar">
                Cadastrar
            </button>

            <button onclick="limparFormulario()" class="cancelar">
                Limpar
            </button>
        </div>

        <div class="resumo">
            <div>
                <strong id="totalProdutos">0</strong>
                <span>Produtos</span>
            </div>

            <div>
                <strong id="totalEstoque">0</strong>
                <span>Itens em estoque</span>
            </div>

            <div>
                <strong id="valorEstoque">R$ 0,00</strong>
                <span>Valor do estoque</span>
            </div>
        </div>

        <h2>Produtos cadastrados</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Valor Total</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaProdutos"></tbody>
        </table>

        <p id="mensagem" class="mensagem"></p>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
