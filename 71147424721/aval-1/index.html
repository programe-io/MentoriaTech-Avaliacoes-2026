
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Produtos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Sistema de Produtos</h1>
        <p>Cadastre e gerencie seus produtos</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formCadastro">
                <label for="descricao">Descrição</label>
                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex.: Cadeira Gamer"
                    required
                >

                <label for="quantidade">Quantidade</label>
                <input
                    type="number"
                    id="quantidade"
                    min="1"
                    step="1"
                    placeholder="Ex.: 12"
                    required
                >

                <label for="valor">Valor (R$)</label>
                <input
                    type="number"
                    id="valor"
                    min="0"
                    step="0.01"
                    placeholder="Ex.: 699.00"
                    required
                >

                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section class="card">
            <h2>Atualizar produto</h2>

            <form id="formAtualizar">
                <label for="codigoProduto">Código do produto</label>
                <input
                    type="number"
                    id="codigoProduto"
                    min="1"
                    step="1"
                    placeholder="Ex.: 1"
                    required
                >

                <label for="novoValor">Novo valor (R$)</label>
                <input
                    type="number"
                    id="novoValor"
                    min="0"
                    step="0.01"
                    placeholder="Deixe vazio se não for alterar"
                >

                <label for="novaQuantidade">Nova quantidade</label>
                <input
                    type="number"
                    id="novaQuantidade"
                    min="1"
                    step="1"
                    placeholder="Deixe vazio se não for alterar"
                >

                <button type="submit">Atualizar produto</button>
            </form>
        </section>

        <section class="card">
            <div class="titulo-lista">
                <h2>Lista de produtos</h2>
                <span id="totalProdutos">0 produtos</span>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="5" class="vazio">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <div id="mensagem" role="status" aria-live="polite"></div>
    </main>

    <footer>
        <p>Sistema de Cadastro de Produtos</p>
    </footer>

<script src="script.js"></script></body>
</html>
