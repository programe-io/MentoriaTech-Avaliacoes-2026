<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAção - Conectado com o Planeta</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🌱 EcoAção</h1>
        <p>Aprenda a proteger o meio ambiente de forma interativa!</p>
    </header>

    <main class="container">
        <section class="card-quiz">
            <h2>Desafio Ecológico 🌍</h2>
            <p class="instrucao">Responda à pergunta abaixo para testar seus conhecimentos:</p>
            
            <div id="quiz">
                <p id="pergunta">Carregando pergunta...</p>
                <div id="opcoes" class="opcoes-container"></div>
            </div>

            <div id="resultado" class="escondido">
                <h3>Resultado Final</h3>
                <p id="mensagem-final"></p>
                <button onclick="reiniciarQuiz()">Tentar Novamente 🔄</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto para a disciplina de Mentoria Tech 🚀</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
