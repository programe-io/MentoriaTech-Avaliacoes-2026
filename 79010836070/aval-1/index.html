<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Voogle</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fff;
        text-align: center;
    }

    /* HEADER */
    .header {
        display: flex;
        justify-content: flex-end;
        padding: 15px 20px;
        gap: 15px;
        font-size: 14px;
    }

    .header a {
        text-decoration: none;
        color: #333;
    }

    .header a:hover {
        text-decoration: underline;
    }

    /* LOGO */
    .logo {
        margin-top: 100px;
        font-size: 70px;
        font-weight: bold;
        color: #4285f4;
    }

    .logo span:nth-child(2) { color: #ea4335; }
    .logo span:nth-child(3) { color: #fbbc05; }
    .logo span:nth-child(4) { color: #4285f4; }
    .logo span:nth-child(5) { color: #34a853; }
    .logo span:nth-child(6) { color: #ea4335; }

    /* SEARCH */
    .search-box {
        margin-top: 30px;
    }

    .search-box input {
        width: 500px;
        padding: 15px;
        border-radius: 30px;
        border: 1px solid #ddd;
        outline: none;
        font-size: 16px;
    }

    .search-box input:hover {
        box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }

    /* BUTTONS */
    .buttons {
        margin-top: 25px;
    }

    .buttons button {
        padding: 10px 20px;
        margin: 5px;
        border: none;
        background: #f8f9fa;
        cursor: pointer;
        border-radius: 5px;
    }

    .buttons button:hover {
        border: 1px solid #ccc;
    }

    /* FOOTER */
    .footer {
        position: absolute;
        bottom: 0;
        width: 100%;
        background: #f2f2f2;
        padding: 15px;
        font-size: 14px;
        color: #555;
    }
</style>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<div class="header">
    <a href="#">Gmail</a>
    <a href="#">Imagens</a>
</div>

<div class="logo">
    <span>V</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
</div>

<div class="search-box">
    <input type="text" placeholder="Pesquisar no Voogle...">
</div>

<div class="buttons">
    <button onclick="search()">Pesquisar</button>
    <button onclick="surprise()">Estou com sorte</button>
</div>

<div class="footer">
    Brasil
</div>

<script>
function search() {
    let query = document.querySelector("input").value;
    if(query) {
        window.location.href = "https://www.google.com/search?q=" + query;
    }
}

function surprise() {
    window.location.href = "https://www.google.com";
}
</script>

</body>
</html>
