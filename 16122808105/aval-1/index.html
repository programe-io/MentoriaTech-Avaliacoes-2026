```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
<link href="style.css" rel="stylesheet"></head>
<body>
    <h1>Sistema de Estoque de Produtos</h1>

    <section>
        <h2>Cadastrar produto</h2>

        <label for="codigo">Código:</label>
        <input type="text" id="codigo">

        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao">

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" min="0">

        <label for="valor">Valor (R$):</label>
        <input type="number" id="valor" min="0" step="0.01">

        <button onclick="cadastrarProduto()">Cadastrar produto</button>
    </section>

    <section>
        <h2>Gerenciar estoque</h2>

        <label for="codigoAlteracao">Código do produto:</label>
        <input type="text" id="codigoAlteracao">

        <label for="novoValor">Novo valor (R$):</label>
        <input type="number" id="novoValor" min="0" step="0.01">
        <button onclick="alterarValor()">Alterar valor</button>

        <label for="novaQuantidade">Nova quantidade:</label>
        <input type="number" id="novaQuantidade" min="0">
        <button onclick="alterarQuantidade()">Alterar quantidade</button>
    </section>

    <section>
        <h2>Produtos cadastrados</h2>
        <button onclick="listarProdutos()">Atualizar lista</button>
        <div id="listaProdutos"></div>
    </section>

    <p id="mensagem" role="status"></p>

    <script>
        // O código JavaScript será inserido no campo JavaScript da plataforma.
    </script>
<script src="script.js"></script></body>
</html>
