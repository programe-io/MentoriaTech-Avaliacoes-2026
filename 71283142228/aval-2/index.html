
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header>
            <span class="tag">PROJETO • JAVASCRIPT</span>
            <h1>Gerenciador de Tarefas</h1>
            <p>Cadastre, organize e acompanhe suas tarefas.</p>
        </header>

        <section class="section">

            <h2>Nova tarefa</h2>

            <div class="input-group">
                <label for="tituloTarefa">Título da tarefa</label>
                <input type="text" id="tituloTarefa"
                    placeholder="Digite o título da tarefa">
            </div>

            <div class="input-group">
                <label for="prioridadeTarefa">Prioridade</label>
                <select id="prioridadeTarefa">
                    <option value="1">1 - Alta</option>
                    <option value="2" selected>2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>
            </div>

            <div class="input-group">
                <label for="selecionarTarefa">Selecionar tarefa</label>
                <select id="selecionarTarefa">
                    <option value="">Selecione uma tarefa</option>
                </select>
            </div>

            <div class="botoes">
                <button id="btAdicionar" class="btn-primary">
                    Cadastrar tarefa
                </button>

                <button id="btStatus" class="btn-success">
                    Concluir / Reabrir
                </button>

                <button id="btPrioridade" class="btn-secondary">
                    Alterar prioridade
                </button>
            </div>

        </section>

        <section class="section">

            <div class="list-heading">
                <h2>Tarefas cadastradas</h2>

                <span id="contadorTarefas" class="counter">
                    0 tarefas
                </span>
            </div>

            <ul id="listaTarefas" class="lista-tarefas">
                <li class="empty">
                    Nenhuma tarefa cadastrada ainda.
                </li>
            </ul>

        </section>

        <footer>
            Prioridade: 1 = Alta • 2 = Média • 3 = Baixa
        </footer>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
