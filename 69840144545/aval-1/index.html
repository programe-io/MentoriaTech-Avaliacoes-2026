[13:10, 26/11/2026] +55 89 9918-8201: <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque em Cards</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h1>📦 Estoque</h1>
            <div class="metrica">
                <span>Unidades totais</span>
                <strong id="m-unidades">0</strong>
            </div>
            <div class="metrica">
                <span>Valor patrimonial</span>
                <strong id="m-valor">R$ 0,00</strong>
            </div>
            <div class="metrica alerta-card">
                <span>Abaixo do mínimo</span>
                <strong id="m-baixo">0</strong>
            </div>
            <button type="button" id="btn-csv" class="btn-export">⬇️ Exportar CSV</button>
        </aside>

        <main class="conteudo">
            <form id="form-estoque" class="cadastro-bar">
                <input type="text" id="prod-nome" placeholder="Nome do item" required>
                <input type="text" id="prod-cat" placeholder="Categoria" required>
                <input type="number" id="prod-qtd" placeholder="Qtd" min="0" required>
                <input type="number" id="prod-min" placeholder="Qtd mín." min="1" value="5" required>
                <input type="number" id="prod-preco" placeholder="Preço (R$)" step="0.01" min="0.01" required>
                <button type="submit" id="btn-submit">Salvar item</button>
            </form>

            <div class="toolbar">
                <input type="text" id="filtro-estoque" placeholder="Filtrar por nome ou categoria...">
                <label class="toggle-baixo">
                    <input type="checkbox" id="apenas-baixo"> Mostrar apenas estoque baixo
                </label>
            </div>

            <div id="grid-produtos" class="grid-produtos"></div>
        </main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
