<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header class="header">
            <span class="logo">MiniFeed</span>
            <nav class="nav">
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </header>

        <section class="criar-post">
            <div class="usuario-box">
                <div class="avatar">J</div>
                <div class="usuario-info">
                    <strong>Jonathan</strong>
                    <input type="text" placeholder="O que você está pensando?">
                </div>
            </div>
            <button type="button" class="btn-publicar">Publicar</button>
        </section>

        <main class="feed">
            <article class="post">
                <div class="post-topo">
                    <div class="avatar">M</div>
                    <div class="post-autor">
                        <strong>Maria</strong>
                        <span>Há 10 minutos</span>
                    </div>
                </div>

                <p class="post-descricao">Hoje eu vi o novo filme do homiranha, top, to feliz :D</p>

                <div class="post-imagem">
                    <img src="https://i.imgur.com/8Km9tLL.jpg" alt="Homem-Aranha">
                </div>

                <div class="post-botoes">
                    <button type="button" class="btn-acao">Curtir</button>
                    <button type="button" class="btn-acao">Comentar</button>
                </div>
            </article>
        </main>

        <footer class="footer">
            <p>MiniFeed - Todos os Direitos Reservados</p>
        </footer>
    </div>

</body>
</html>
