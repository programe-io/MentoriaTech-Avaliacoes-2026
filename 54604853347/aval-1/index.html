<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>
        
        <!-- Formulário de Cadastro -->
        <div class="card">
            <h3>Cadastrar Nova Tarefa</h3>
            <div class="form-group">
                <input type="text" id="titulo" placeholder="Título da tarefa (mínimo 5 caracteres)">
            </div>
            <div class="form-group">
                <select id="prioridade">
                    <option value="1">1 - Prioridade Alta</option>
                    <option value="2">2 - Prioridade Média</option>
                    <option value="3">3 - Prioridade Baixa</option>
                </select>
            </div>
            <button onclick="cadastrarTarefa()">Adicionar Tarefa</button>
            <div id="mensagem-erro" class="erro"></div>
        </div>

        <!-- Lista de Tarefas -->
        <div class="card">
            <h3>Minhas Tarefas</h3>
            <ul id="lista-tarefas"></ul>
        </div>
    </div>
<script src="script.js"></script></body>
</html>
