
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Gerenciador de Tarefas</h1>

    <div class="container">
        <h2>Cadastrar Tarefa</h2>

        <input type="number" id="codigo" placeholder="Código">
        <input type="text" id="titulo" placeholder="Título da tarefa">
        
        <select id="prioridade">
            <option value="">Selecione a prioridade</option>
            <option value="1">1 - Alta</option>
            <option value="2">2 - Média</option>
            <option value="3">3 - Baixa</option>
        </select>

        <button onclick="cadastrarTarefa()">Cadastrar Tarefa</button>

        <h2>Minhas Tarefas</h2>
        <button onclick="listarTarefas()">Listar Tarefas</button>

        <div id="lista"></div>

        <h2>Alterar Tarefa</h2>

        <input type="number" id="codigoAlterar" placeholder="Código da tarefa">

        <select id="novaPrioridade">
            <option value="">Nova prioridade</option>
            <option value="1">1 - Alta</option>
            <option value="2">2 - Média</option>
            <option value="3">3 - Baixa</option>
        </select>

        <button onclick="alterarPrioridade()">Alterar Prioridade</button>

        <button onclick="concluirTarefa()">Marcar como Concluída</button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
