
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clone Instagram - Ranielly</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        /* Rolagem horizontal dos stories */
        .stories-container {
            scrollbar-width: none;
        }

        .stories-container::-webkit-scrollbar {
            display: none;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="min-h-screen bg-gray-100 text-slate-900">

    <!-- CABEÇALHO -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">

        <div class="max-w-5xl mx-auto px-4">

            <div class="flex items-center justify-between h-14">

                <!-- Logo -->
                <h1 class="text-xl font-semibold">
                    Instagram
                </h1>

                <!-- Menu -->
                <button class="text-2xl" aria-label="Abrir menu">
                    <i class="bx bx-menu"></i>
                </button>

            </div>

        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-5xl mx-auto px-4 py-4 pb-20">

        <div class="flex gap-8">

            <!-- FEED -->
            <div class="flex-1 max-w-lg mx-auto w-full">

                <!-- SEÇÃO DE STORIES -->
                <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">

                    <div class="flex gap-4 overflow-x-auto stories-container">

                        <!-- ADICIONAR STORY -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gray-100">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">

                                        <span class="text-2xl text-gray-500">
                                            +
                                        </span>

                                    </div>

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                Seu story
                            </span>

                        </div>


                        <!-- STORY 1 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=12"
                                        alt="Foto de perfil de João"
                                        class="w-full h-full object-cover rounded-full"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center truncate">
                                João
                            </span>

                        </div>


                        <!-- STORY 2 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=47"
                                        alt="Foto de perfil de Maria"
                                        class="w-full h-full object-cover rounded-full"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center truncate">
                                Maria
                            </span>

                        </div>


                        <!-- STORY 3 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=33"
                                        alt="Foto de perfil de Ana"
                                        class="w-full h-full object-cover rounded-full"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center truncate">
                                Ana
                            </span>

                        </div>


                        <!-- STORY 4 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=52"
                                        alt="Foto de perfil de Pedro"
                                        class="w-full h-full object-cover rounded-full"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center truncate">
                                Pedro
                            </span>

                        </div>


                        <!-- STORY 5 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=25"
                                        alt="Foto de perfil de Carla"
                                        class="w-full h-full object-cover rounded-full"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center truncate">
                                Carla
                            </span>

                        </div>


                        <!-- STORY 6 -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=60"
                                        alt="Foto de perfil de Lucas"
                                        class="w-full h-full object-cover rounded-full"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center truncate">
                                Lucas
                            </span>

                        </div>

                    </div>

                </section>


                <!-- POSTAGEM -->
                <article class="bg-white border border-gray-200 rounded-lg mb-4">

                    <!-- CABEÇALHO DA POSTAGEM -->
                    <header class="flex items-center justify-between p-3">

                        <div class="flex items-center gap-3">

                            <!-- Foto de perfil -->
                            <div class="w-10 h-10 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-0.5">

                                    <img
                                        src="https://i.pravatar.cc/150?img=12"
                                        alt="Perfil do usuário"
                                        class="w-full h-full object-cover rounded-full"
                                    >

                                </div>

                            </div>

                            <!-- Nome do usuário -->
                            <div>
                                <h2 class="text-sm font-semibold">
                                    joao.silva
                                </h2>

                                <p class="text-xs text-gray-500">
                                    São Paulo, Brasil
                                </p>
                            </div>

                        </div>

                        <!-- Opções -->
                        <button class="text-xl" aria-label="Mais opções">
                            <i class="bx bx-dots-horizontal-rounded"></i>
                        </button>

                    </header>


                    <!-- IMAGEM DA POSTAGEM -->
                    <div>
                        <img
                            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900"
                            alt="Paisagem de natureza"
                            class="w-full object-cover"
                        >
                    </div>


                    <!-- AÇÕES DA POSTAGEM -->
                    <div class="p-3">

                        <div class="flex items-center justify-between text-2xl">

                            <div class="flex gap-4">

                                <i class="bx bx-heart cursor-pointer"></i>

                                <i class="bx bx-message-rounded cursor-pointer"></i>

                                <i class="bx bx-send cursor-pointer"></i>

                            </div>

                            <i class="bx bx-bookmark cursor-pointer"></i>

                        </div>

                        <p class="text-sm font-semibold mt-3">
                            1.250 curtidas
                        </p>

                        <p class="text-sm mt-1">
                            <strong>joao.silva</strong>
                            Aproveitando um dia incrível!
                        </p>

                        <p class="text-xs text-gray-400 mt-2">
                            HÁ 2 HORAS
                        </p>

                    </div>

                </article>


                <!-- IDENTIFICAÇÃO DA ALUNA -->
                <footer class="text-center py-4">

                    <p class="text-xs text-gray-400">
                        Projeto desenvolvido por Ranielly
                    </p>

                    <p class="text-xs text-gray-400 mt-1">
                        Clone Instagram - Tailwind CSS
                    </p>

                </footer>

            </div>

        </div>

    </main>

</body>
</html>
