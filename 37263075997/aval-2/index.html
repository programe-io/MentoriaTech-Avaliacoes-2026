<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="feed-container">
    <!-- Cabeçalho -->
    <header class="feed-header">
        <h1>MiniFeed 🌿</h1>
        <span>Início</span>
    </header>

    <!-- Caixa de Texto para Novo Post -->
    <div class="new-post-box">
        <textarea id="post-text" placeholder="O que você está pensando hoje? ✨"></textarea>
        <div class="post-box-footer" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <!-- Botão oculto e botão visível para carregar foto do rolo da câmera -->
            <input type="file" id="post-image-input" accept="image/*" style="display: none;">
            <button class="btn-green" id="upload-photo-btn" style="background-color: #f0f7f4; color: #4f772d; margin-right: auto;">📷 Foto</button>
            <button class="btn-green" id="publish-btn">Publicar</button>
        </div>
    </div>

    <!-- Onde os novos posts vão aparecer -->
    <div id="feed-posts-wrapper">
        <!-- Post com a Imagem Principal Atualizada -->
        <div class="feed-post">
            <div class="user-profile">
                <div class="avatar">✨</div>
                <div class="user-info">
                    <div class="username">Milena da Conceição</div>
                    <div class="post-time">Agora mesmo</div>
                </div>
            </div>
            
            <div class="post-content">
                Montando meu mini feed pessoal novinho! Que acharam desse visual verde pastel? 🌿🥰
            </div>

            <!-- Foto oficial da Milena vinculada diretamente -->
            <img class="post-image" src="https://ibb.co" alt="Foto do Post">

            <div class="post-actions">

            <div class="post-actions">
                <button class="action-btn like-btn">❤️ Curtir</button>
                <button class="action-btn">💬 Comentar</button>
            </div>

            <!-- Comentários -->
            <div class="comments-section">
                <div class="comment">
                    <div class="comment-avatar">B</div>
                    <div class="comment-body">
                        <div class="comment-username">Beatriz</div>
                        <div>Ficou maravilhoso! Amei os detalhes dessa cor. 💫</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

  <script src="script.js"></script>
  
</body>
</html>
