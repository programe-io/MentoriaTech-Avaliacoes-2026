<!DOCTYPE html><html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Ficha de Anamnese</title>
                    <link rel="stylesheet" href="style.css">
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                    <body><div class="container">

                        <header>
                                <h1>Ficha de Anamnese</h1>
                                        <p>Sistema de cadastro e controle de IMC</p>
                                            </header>

                                                <section class="formulario">
                                                        <h2>Cadastrar Paciente</h2>

                                                                <form id="formPessoa">

                                                                            <label for="nome">Nome:</label>
                                                                                        <input type="text" id="nome" placeholder="Digite o nome">

                                                                                                    <label for="idade">Idade:</label>
                                                                                                                <input type="number" id="idade" placeholder="Digite a idade">

                                                                                                                            <label for="altura">Altura (m):</label>
                                                                                                                                        <input type="number" id="altura" step="0.01" placeholder="Ex: 1.70">

                                                                                                                                                    <label for="peso">Peso (kg):</label>
                                                                                                                                                                <input type="number" id="peso" step="0.1" placeholder="Ex: 65">

                                                                                                                                                                            <p id="erro" hidden></p>

                                                                                                                                                                                        <button type="submit">Salvar Paciente</button>

                                                                                                                                                                                                </form>
                                                                                                                                                                                                    </section>

                                                                                                                                                                                                        <section class="tabela">
                                                                                                                                                                                                                <h2>Pacientes Cadastrados</h2>

                                                                                                                                                                                                                        <div class="tabela-responsiva">
                                                                                                                                                                                                                                    <table>
                                                                                                                                                                                                                                                    <thead>
                                                                                                                                                                                                                                                                        <tr>
                                                                                                                                                                                                                                                                                                <th>Código</th>
                                                                                                                                                                                                                                                                                                                        <th>Nome</th>
                                                                                                                                                                                                                                                                                                                                                <th>Idade</th>
                                                                                                                                                                                                                                                                                                                                                                        <th>Altura</th>
                                                                                                                                                                                                                                                                                                                                                                                                <th>Peso</th>
                                                                                                                                                                                                                                                                                                                                                                                                                        <th>IMC</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <th>Classificação</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <th>Ações</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </thead>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <tbody id="listaPessoas">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </tbody>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
