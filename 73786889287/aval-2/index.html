
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gerenciador de Tarefas</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>Gerenciador de Tarefas</h1>
                                    <p>Organize suas atividades de forma simples</p>
                                        </header>

                                            <main class="container">

                                                    <section class="formulario">
                                                                <h2>Cadastrar nova tarefa</h2>

                                                                            <form id="formTarefa">

                                                                                            <label for="titulo">Título:</label>
                                                                                                            <input type="text" id="titulo"
                                                                                                                                   placeholder="Digite o título da tarefa" required>

                                                                                                                                                   <label for="descricao">Descrição:</label>
                                                                                                                                                                   <textarea id="descricao"
                                                                                                                                                                                             placeholder="Descreva a tarefa"></textarea>

                                                                                                                                                                                                             <label for="prioridade">Prioridade:</label>
                                                                                                                                                                                                                             <select id="prioridade">
                                                                                                                                                                                                                                                 <option value="Baixa">Baixa</option>
                                                                                                                                                                                                                                                                     <option value="Média">Média</option>
                                                                                                                                                                                                                                                                                         <option value="Alta">Alta</option>
                                                                                                                                                                                                                                                                                                         </select>

                                                                                                                                                                                                                                                                                                                         <button type="submit">Cadastrar tarefa</button>
                                                                                                                                                                                                                                                                                                                                     </form>
                                                                                                                                                                                                                                                                                                                                             </section>

                                                                                                                                                                                                                                                                                                                                                     <section class="pesquisa">
                                                                                                                                                                                                                                                                                                                                                                 <h2>Buscar tarefas</h2>
                                                                                                                                                                                                                                                                                                                                                                             <input type="text" id="busca"
                                                                                                                                                                                                                                                                                                                                                                                                placeholder="Digite o código ou título da tarefa">
                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                <section class="tarefas">
                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>Lista de tarefas</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="listaTarefas">
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- As tarefas aparecem aqui -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>Projeto Gerenciador de Tarefas</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
