
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Entrega - Avaliações</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Área de Entrega - Avaliações</h1>
        <p>Aqui você envia seus códigos para correção.</p>
    </header>

    <main>
        <section class="container">
            <h2>Finalize seu trabalho</h2>
            <p>Revise seu código antes de publicar.</p>

            <label for="htmlCode">HTML</label>
            <textarea id="htmlCode" placeholder="Digite seu HTML..."></textarea>

            <label for="cssCode">CSS</label>
            <textarea id="cssCode" placeholder="Digite seu CSS..."></textarea>

            <label for="jsCode">JavaScript</label>
            <textarea id="jsCode" placeholder="Digite seu JavaScript..."></textarea>

            <div class="buttons">
                <button onclick="executarCodigo()">Executar código</button>
                <button onclick="publicarCodigo()">Publicar atividade</button>
            </div>

            <h2>Pré-visualização</h2>
            <iframe id="resultado"></iframe>

            <p id="mensagem"></p>
        </section>
    </main>

    <footer>
        <p>Área de Avaliações © 2026</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
