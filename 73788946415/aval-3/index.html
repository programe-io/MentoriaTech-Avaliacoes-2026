
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha de Anamnese - Calculadora de IMC</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main>

        <h1>Ficha de Anamnese</h1>
        <p class="subtitulo">Cadastro e controle do Índice de Massa Corporal</p>

        <!-- Formulário -->
        <section class="card">

            <h2 id="titulo-form">Cadastrar nova pessoa</h2>

            <form id="form-pessoa" novalidate>

                <div class="campo campo-nome">
                    <label for="input-nome">Nome</label>
                    <input type="text" id="input-nome"
                        maxlength="50" placeholder="Ex.: Maria Silva">
                </div>

                <div class="campo">
                    <label for="input-idade">Idade (anos)</label>
                    <input type="number" id="input-idade"
                        min="1" max="120" placeholder="Ex.: 30">
                </div>

                <div class="campo">
                    <label for="input-altura">Altura (m)</label>
                    <input type="number" id="input-altura"
                        min="0.5" max="2.5" step="0.01"
                        placeholder="Ex.: 1.75">
                </div>

                <div class="campo">
                    <label for="input-peso">Peso (kg)</label>
                    <input type="number" id="input-peso"
                        min="2" max="500" step="0.1"
                        placeholder="Ex.: 70">
                </div>

                <div class="botoes">
                    <button type="submit" id="btn-salvar">
                        Salvar cadastro
                    </button>

                    <button type="button" id="btn-cancelar"
                        class="secundario" hidden>
                        Cancelar
                    </button>
                </div>

            </form>

            <p id="erro" role="alert" hidden></p>

        </section>

        <!-- Tabela de pessoas -->
        <section class="card">

            <h2>Pessoas cadastradas</h2>

            <p class="descricao">
                Confira os dados e a classificação do IMC.
            </p>

            <div class="tabela-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-pessoas">
                    </tbody>

                </table>

            </div>

        </section>

        <footer>
            Projeto Ficha de Anamnese - Calculadora de IMC
        </footer>

    </main>

    <script src="app.js"></script>

<script src="script.js"></script></body>
</html>
