
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cadastro de Produtos</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>Gerenciamento de Produtos</h1>
                                    <p>Sistema de cadastro e controle de estoque</p>
                                        </header>

                                            <main>

                                                    <section class="container">
                                                                <h2>Cadastrar Produto</h2>

                                                                            <form id="formProduto">

                                                                                            <label for="descricao">Descrição do produto:</label>
                                                                                                            <input type="text" id="descricao"
                                                                                                                                placeholder="Digite o nome do produto">

                                                                                                                                                <label for="quantidade">Quantidade:</label>
                                                                                                                                                                <input type="number" id="quantidade"
                                                                                                                                                                                    placeholder="Digite a quantidade">

                                                                                                                                                                                                    <label for="valor">Valor (R$):</label>
                                                                                                                                                                                                                    <input type="number" id="valor"
                                                                                                                                                                                                                                        step="0.01" placeholder="Digite o valor">

                                                                                                                                                                                                                                                        <button type="submit">Cadastrar Produto</button>

                                                                                                                                                                                                                                                                    </form>

                                                                                                                                                                                                                                                                                <p id="mensagem"></p>
                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                <section class="container">
                                                                                                                                                                                                                                                                                                            <h2>Produtos Cadastrados</h2>

                                                                                                                                                                                                                                                                                                                        <div class="tabela-container">
                                                                                                                                                                                                                                                                                                                                        <table>
                                                                                                                                                                                                                                                                                                                                                            <thead>
                                                                                                                                                                                                                                                                                                                                                                                    <tr>
                                                                                                                                                                                                                                                                                                                                                                                                                <th>Código</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Descrição</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <th>Quantidade</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Valor</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </thead>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <tbody id="listaProdutos">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <section class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h2>Atualizar Valor do Produto</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label for="codigoValor">Código do produto:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="number" id="codigoValor">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label for="novoValor">Novo valor:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="number" id="novoValor"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                step="0.01">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="atualizarValor()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Atualizar Valor
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <section class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2>Atualizar Quantidade</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="codigoQuantidade">Código do produto:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="number" id="codigoQuantidade">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label for="novaQuantidade">Quantidade para adicionar:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="number" id="novaQuantidade">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="atualizarQuantidade()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Adicionar Estoque
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Projeto de Cadastro e Gerenciamento de Produtos</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
