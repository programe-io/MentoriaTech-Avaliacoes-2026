<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ritmo | Gerenciador de rotinas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="pagina">
    <header class="cabecalho">
      <div>
        <p class="marca">Ritmo</p>
        <h1 id="titulo-dia">Hoje</h1>
        <p class="data" id="data-extenso"></p>
      </div>

      <div class="anel" aria-live="polite">
        <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
          <circle class="anel-fundo" cx="60" cy="60" r="50"/>
          <circle class="anel-valor" id="anel-valor" cx="60" cy="60" r="50"/>
        </svg>
        <div class="anel-texto">
          <strong id="anel-percentual">0%</strong>
          <span id="anel-detalhe">0 de 0</span>
        </div>
      </div>
    </header>

    <nav class="semana" aria-label="Escolher dia da semana">
      <button class="seta" id="semana-anterior" aria-label="Semana anterior">&lsaquo;</button>
      <div class="dias" id="dias"></div>
      <button class="seta" id="semana-proxima" aria-label="Próxima semana">&rsaquo;</button>
    </nav>

    <div class="conteudo">
      <main>
        <ul class="lista" id="lista"></ul>
      </main>

      <aside class="painel">
        <h2 id="form-titulo">Nova rotina</h2>
        <form id="form" autocomplete="off">
          <label for="nome">Nome da rotina</label>
          <input id="nome" type="text" maxlength="40" placeholder="Ex.: Beber 2 litros de água" required>

          <div class="linha">
            <div>
              <label for="hora">Horário</label>
              <input id="hora" type="time" value="08:00" required>
            </div>
            <div>
              <label for="categoria">Categoria</label>
              <select id="categoria">
                <option value="saude">Saúde</option>
                <option value="estudo">Estudo</option>
                <option value="trabalho">Trabalho</option>
                <option value="casa">Casa</option>
                <option value="lazer">Lazer</option>
              </select>
            </div>
          </div>

          <fieldset>
            <legend>Dias da semana</legend>
            <div class="dias-form" id="dias-form"></div>
          </fieldset>

          <p class="erro" id="erro" role="alert"></p>

          <div class="botoes">
            <button type="submit" class="primario" id="salvar">Adicionar rotina</button>
            <button type="button" class="secundario" id="cancelar" hidden>Cancelar</button>
          </div>
        </form>

        <dl class="resumo">
          <div><dt>Rotinas cadastradas</dt><dd id="total-rotinas">0</dd></div>
          <div><dt>Maior sequência atual</dt><dd id="maior-sequencia">0 dias</dd></div>
        </dl>
      </aside>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
