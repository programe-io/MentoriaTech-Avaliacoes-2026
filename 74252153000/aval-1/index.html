<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Porto | Loja de games online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="topo">
    <a class="marca" href="#">Pixel Porto</a>
    <button class="botao-carrinho" id="abrir-carrinho" aria-controls="carrinho" aria-expanded="false">
      Carrinho
      <span class="contador" id="contador">0</span>
    </button>
  </header>

  <section class="abertura">
    <h1>Seu próximo jogo está aqui.</h1>
    <p>Escolha a quantidade, monte o carrinho e veja o total em reais na hora.</p>
  </section>

  <div class="layout">
    <main>
      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por plataforma"></div>
      <div class="grade" id="produtos"></div>
    </main>

    <aside class="carrinho" id="carrinho" aria-label="Carrinho de compras">
      <div class="carrinho-topo">
        <h2>Seu carrinho</h2>
        <button class="fechar" id="fechar-carrinho" aria-label="Fechar carrinho">&times;</button>
      </div>

      <ul class="itens" id="itens"></ul>

      <div class="resumo" id="resumo">
        <fieldset class="pagamento">
          <legend>Forma de pagamento</legend>
          <label><input type="radio" name="pagamento" value="pix" checked> Pix (10% de desconto)</label>
          <label><input type="radio" name="pagamento" value="cartao"> Cartão, até 3x sem juros</label>
        </fieldset>

        <dl class="valores">
          <div><dt>Subtotal</dt><dd id="subtotal">R$ 0,00</dd></div>
          <div id="linha-desconto"><dt>Desconto Pix</dt><dd id="desconto">- R$ 0,00</dd></div>
          <div class="total"><dt>Total</dt><dd id="total">R$ 0,00</dd></div>
        </dl>
        <p class="parcelas" id="parcelas"></p>

        <button class="finalizar" id="finalizar">Finalizar compra</button>
        <button class="limpar" id="limpar">Esvaziar carrinho</button>
      </div>
    </aside>
  </div>

  <div class="fundo" id="fundo"></div>
  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
