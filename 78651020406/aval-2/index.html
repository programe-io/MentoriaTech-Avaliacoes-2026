<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MiniFeed da Jayara</title>
        <link rel="stylesheet" href="style.css">
    <link href="style.css" rel="stylesheet"></head>
    <body>
        
        <header>
            
            <div class="header-content">

                <h1>MiniFeed da Jayara</h1>

                <nav>
                    <a href="#">Início</a>
                    <a href="#">Perfil</a>
                </nav>

            </div>


        </header>

        <main>

            <section class="new-post">

                <div class="user">

                    <div class="Avatar">
                        J
                    </div>

                    <div>
                        <strong>Jayara</strong>
                        <span>O que você está pensando?!</span>
                    </div>

                </div>

                <button>Publicar</button>



            </section>

            <article class="post">

                <div class="post-header"></div>
                <div class="Avatar">
                        L
                    </div>

                    <div>
                        <strong>Luíza</strong>
                        <span>Há 1 hora</span>
                    </div>

                    <div class="post-text">

                        Saudades de quando estive em Miami!

                    </div>

                    <img src="miami.jpg" alt="Miami" width="550px">

                    <div class="Post-Action">

                        <button>Curtir</button>
                        <button>Comentar</button>

                    </div>

            </article>

        </main>

        <footer>
            <p>Jayara - copyright - Todos os direitos reservados - 2028</p>            
        </footer>

    </body>
</html>
