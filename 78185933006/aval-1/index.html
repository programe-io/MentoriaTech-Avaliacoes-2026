<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Fashion Store</h1>

    <nav>
        <a href="#">Início</a>
        <a href="#">Produtos</a>
        <a href="#">Contato</a>
    </nav>
</header>

<section class="banner">
    <h2>Moda Feminina 2026</h2>
    <p>As melhores tendências com até 40% de desconto.</p>
    <button onclick="mensagem()">Comprar Agora</button>
</section>

<section class="produtos">

    <div class="produto">
        <img src="https://via.placeholder.com/250x300" alt="Vestido">
        <h3>Vestido Floral</h3>
        <p>R$ 149,90</p>
        <button onclick="comprar('Vestido Floral')">Comprar</button>
    </div>

    <div class="produto">
        <img src="https://via.placeholder.com/250x300" alt="Blusa">
        <h3>Blusa Elegante</h3>
        <p>R$ 89,90</p>
        <button onclick="comprar('Blusa Elegante')">Comprar</button>
    </div>

    <div class="produto">
        <img src="https://via.placeholder.com/250x300" alt="Calça">
        <h3>Calça Jeans</h3>
        <p>R$ 129,90</p>
        <button onclick="comprar('Calça Jeans')">Comprar</button>
    </div>

</section>

<footer>
    <p>© 2026 Fashion Store - Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
