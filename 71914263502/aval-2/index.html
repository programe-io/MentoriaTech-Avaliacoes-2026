
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header>
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas atividades de maneira simples.</p>
        </header>

        <section class="resumo">
            <div class="card">
                <span>Total</span>
                <strong id="total">0</strong>
            </div>

            <div class="card">
                <span>Pendentes</span>
                <strong id="pendentes">0</strong>
            </div>

            <div class="card">
                <span>Concluídas</span>
                <strong id="concluidas">0</strong>
            </div>
        </section>

        <section class="cadastro">
            <h2>Adicionar tarefa</h2>

            <form id="formTarefa">
                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título da tarefa"
                    minlength="5"
                    required
                >

                <select id="prioridade">
                    <option value="1">Prioridade 1 - Baixa</option>
                    <option value="2">Prioridade 2 - Média</option>
                    <option value="3">Prioridade 3 - Alta</option>
                </select>

                <button type="submit" id="botaoSalvar">
                    Cadastrar tarefa
                </button>

                <button type="button" id="cancelar" hidden>
                    Cancelar edição
                </button>
            </form>
        </section>

        <section class="filtros">
            <h2>Pesquisar e filtrar</h2>

            <input
                type="search"
                id="pesquisa"
                placeholder="Pesquisar por título ou código..."
            >

            <div class="opcoes">
                <select id="filtroStatus">
                    <option value="todos">Todos os status</option>
                    <option value="pendente">Pendentes</option>
                    <option value="concluida">Concluídas</option>
                </select>

                <select id="filtroPrioridade">
                    <option value="todas">Todas as prioridades</option>
                    <option value="1">Prioridade baixa</option>
                    <option value="2">Prioridade média</option>
                    <option value="3">Prioridade alta</option>
                </select>
            </div>
        </section>

        <section class="lista">
            <h2>Minhas tarefas</h2>
            <div id="listaTarefas"></div>
        </section>

        <footer>
            <p>Gerenciador de Tarefas JavaScript</p>
        </footer>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
