
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Meu Mini Feed</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main>
        <section class="new-post">
            <h2>O que está acontecendo?</h2>
            <textarea id="textoPost" placeholder="Escreva sua publicação..."></textarea>
            <button id="publicar">Publicar</button>
        </section>

        <section class="feed" id="feed">

            <!-- Publicação 1 -->
            <article class="post">
                <div class="post-header">
                    <div class="avatar kayllow">K</div>
                    <div>
                        <h3>Kayllow</h3>
                        <span>Há 2 horas</span>
                    </div>
                </div>

                <p>Com grandes poderes vêm grandes responsabilidades! 🕷️</p>

                <img
                    class="post-image"
                    src="https://commons.wikimedia.org/wiki/Special:FilePath/Spider-Man.jpg"
                    alt="Homem-Aranha"
                >

                <small class="credit">
                    Foto: Gage Skidmore (CC BY-SA 2.0)
                </small>

                <div class="post-actions">
                    <button class="curtir">♡ Curtir</button>
                    <button class="comentar">Comentar</button>
                </div>

                <div class="comentarios"></div>
            </article>

            <!-- Publicação 2 -->
            <article class="post">
                <div class="post-header">
                    <div class="avatar ana">A</div>
                    <div>
                        <h3>Ana Letícia</h3>
                        <span>Há 30 minutos</span>
                    </div>
                </div>

                <p>Um dia de cada vez, sempre buscando aprender coisas novas! 💜✨</p>

                <div class="post-actions">
                    <button class="curtir">♡ Curtir</button>
                    <button class="comentar">Comentar</button>
                </div>

                <div class="comentarios"></div>
            </article>

        </section>
    </main>

    <footer>
        <p>Meu Mini Feed - 2026</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
