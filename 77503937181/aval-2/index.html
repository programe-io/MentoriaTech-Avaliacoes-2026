
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Kayllow</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topo">
        <h1>Instagram</h1>
        <input type="text" id="pesquisa" placeholder="Pesquisar">
        <div class="perfil-topo">
            <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Kayllow">
            <span>Kayllow</span>
        </div>
    </header>

    <main>
        <section class="stories">
            <h2>Stories</h2>
            <div class="lista-stories">
                <div class="story">
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Kayllow">
                    <p>Seu story</p>
                </div>
                <div class="story">
                    <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Ana">
                    <p>Ana</p>
                </div>
                <div class="story">
                    <img src="https://randomuser.me/api/portraits/men/45.jpg" alt="Lucas">
                    <p>Lucas</p>
                </div>
                <div class="story">
                    <img src="https://randomuser.me/api/portraits/women/68.jpg" alt="Maria">
                    <p>Maria</p>
                </div>
            </div>
        </section>

        <section class="perfil">
            <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Kayllow">
            <div>
                <h2>Kayllow</h2>
                <p>Bem-vindo ao meu perfil!</p>
                <p>📸 Compartilhando momentos especiais.</p>
            </div>
        </section>

        <section class="publicacoes">
            <h2>Publicações</h2>

            <article class="post">
                <div class="post-cabecalho">
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Kayllow">
                    <strong>Kayllow</strong>
                </div>
                <img class="foto-post" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Paisagem">
                <div class="acoes">
                    <button class="curtir">♡ Curtir</button>
                    <button class="comentar">Comentar</button>
                </div>
                <p class="legenda"><strong>Kayllow</strong> Aproveitando os melhores momentos! 🌅</p>
                <div class="comentarios"></div>
                <input class="campo-comentario" type="text" placeholder="Adicione um comentário...">
                <button class="enviar-comentario">Publicar</button>
            </article>

            <article class="post">
                <div class="post-cabecalho">
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Kayllow">
                    <strong>Kayllow</strong>
                </div>
                <img class="foto-post" src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=800" alt="Céu estrelado">
                <div class="acoes">
                    <button class="curtir">♡ Curtir</button>
                    <button class="comentar">Comentar</button>
                </div>
                <p class="legenda"><strong>Kayllow</strong> Vivendo e aprendendo! ✨</p>
                <div class="comentarios"></div>
                <input class="campo-comentario" type="text" placeholder="Adicione um comentário...">
                <button class="enviar-comentario">Publicar</button>
            </article>
        </section>
    </main>

    <footer>
        <p>Início　　Pesquisar　　Reels　　Perfil: Kayllow</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
