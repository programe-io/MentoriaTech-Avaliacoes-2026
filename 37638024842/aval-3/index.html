<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tabela de Pessoas - IMC</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Prática - Tabela de IMC</h1>

        <div class="card">

            <h2>Cadastrar Pessoa</h2>

            <div class="formulario">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome"
                >

                <input
                    type="number"
                    id="peso"
                    placeholder="Peso (kg)"
                    step="0.1"
                >

                <input
                    type="number"
                    id="altura"
                    placeholder="Altura (m)"
                    step="0.01"
                >

                <button onclick="adicionarPessoa()">
                    Adicionar
                </button>

            </div>

        </div>


        <div class="card">

            <h2>Pessoas cadastradas</h2>

            <table>

                <thead>

                    <tr>
                        <th>Nome</th>
                        <th>Peso</th>
                        <th>Altura</th>
                        <th>IMC</th>
                        <th>Situação</th>
                    </tr>

                </thead>

                <tbody id="tabelaPessoas">

                    <!-- Pessoas serão adicionadas aqui -->

                </tbody>

            </table>

        </div>

    </div>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
