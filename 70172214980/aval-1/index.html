<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <aside>
        <h2>📦 Estoque</h2>

        <nav>
            <a href="#">Início</a>
            <a href="#cadastro">Cadastrar Produto</a>
            <a href="#produtos">Meus Produtos</a>
        </nav>
    </aside>


    <main>

        <header>
            <div>
                <h1>Controle de Produtos</h1>
                <p>Gerencie seu estoque de forma simples.</p>
            </div>

            <div class="usuario">
                👤 Administrador
            </div>
        </header>


        <!-- RESUMO -->

        <section class="resumo">

            <div class="resumo-card">
                <span>📦</span>

                <div>
                    <p>Produtos</p>
                    <h2 id="totalProdutos">0</h2>
                </div>
            </div>


            <div class="resumo-card">
                <span>🔢</span>

                <div>
                    <p>Unidades</p>
                    <h2 id="totalQuantidade">0</h2>
                </div>
            </div>


            <div class="resumo-card">
                <span>💰</span>

                <div>
                    <p>Valor Total</p>
                    <h2 id="valorTotal">R$ 0,00</h2>
                </div>
            </div>

        </section>


        <!-- CADASTRO -->

        <section class="secao" id="cadastro">

            <h2>Cadastrar Produto</h2>

            <div class="formulario">

                <div>
                    <label>Código</label>
                    <input type="number" id="codigo" placeholder="Ex: 1">
                </div>


                <div>
                    <label>Nome do Produto</label>
                    <input type="text" id="descricao" placeholder="Ex: Mouse">
                </div>


                <div>
                    <label>Quantidade</label>
                    <input type="number" id="quantidade" placeholder="Ex: 10">
                </div>


                <div>
                    <label>Valor</label>
                    <input type="number" id="valor" step="0.01" placeholder="Ex: 50.00">
                </div>

            </div>

            <button class="btn-adicionar" onclick="cadastrarProduto()">
                Cadastrar Produto
            </button>

        </section>


        <!-- PRODUTOS -->

        <section class="secao" id="produtos">

            <div class="titulo-produtos">

                <div>
                    <h2>Produtos Cadastrados</h2>
                    <p>Lista completa do estoque.</p>
                </div>

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar produto..."
                    oninput="pesquisarProduto()"
                >

            </div>


            <div class="tabela">

                <table>

                    <thead>

                        <tr>
                            <th>Código</th>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>

                    </thead>


                    <tbody id="listaProdutos">

                    </tbody>

                </table>

            </div>

            <p id="mensagem"></p>

        </section>

    </main>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
