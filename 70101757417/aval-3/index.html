<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <nav>
        <div class="logo">
            TASK<span>MANAGER</span>
        </div>

        <div class="menu">
            <span>Início</span>
            <span>Tarefas</span>
        </div>
    </nav>


    <main>

        <section class="inicio">

            <div>
                <p class="pequeno">MEU PAINEL</p>

                <h1>
                    Gerenciador de<br>
                    <span>tarefas</span>
                </h1>

                <p class="descricao">
                    Cadastre, organize e acompanhe suas tarefas.
                </p>
            </div>

        </section>


        <!-- CADASTRO -->

        <section class="cadastro">

            <h2>+ Nova tarefa</h2>

            <div class="formulario">

                <div>
                    <label>Código</label>

                    <input
                        type="text"
                        id="codigo"
                        placeholder="Ex: 009"
                    >
                </div>


                <div class="campo-titulo">

                    <label>Título</label>

                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título da tarefa"
                    >

                </div>


                <div>

                    <label>Prioridade</label>

                    <select id="prioridade">

                        <option value="">
                            Selecione
                        </option>

                        <option value="1">
                            1 - Alta
                        </option>

                        <option value="2">
                            2 - Média
                        </option>

                        <option value="3">
                            3 - Baixa
                        </option>

                    </select>

                </div>


                <button onclick="cadastrar()">
                    ADICIONAR
                </button>

            </div>

        </section>


        <!-- ESTATÍSTICAS -->

        <section class="estatisticas">

            <div class="estatistica">
                <small>TOTAL</small>
                <strong id="total">0</strong>
            </div>

            <div class="estatistica">
                <small>PENDENTES</small>
                <strong id="pendentes">0</strong>
            </div>

            <div class="estatistica">
                <small>CONCLUÍDAS</small>
                <strong id="concluidas">0</strong>
            </div>

        </section>


        <!-- TAREFAS -->

        <section class="area-tarefas">

            <div class="titulo">

                <h2>Minhas tarefas</h2>

                <div class="buscar">

                    <input
                        type="text"
                        id="codigoBusca"
                        placeholder="Código"
                    >

                    <button onclick="concluir()">
                        ✓ Concluir
                    </button>

                    <button
                        class="btn-prioridade"
                        onclick="alterarPrioridade()"
                    >
                        Prioridade
                    </button>

                </div>

            </div>


            <div id="lista">
            </div>

        </section>

    </main>


    <footer>
        Task Manager © 2026
    </footer>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
