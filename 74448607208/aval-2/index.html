<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Anamnese</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Ficha de Anamnese</h1>

    <form id="anamneseForm" class="card">
      <div class="form-group">
        <label for="nome">Nome do Paciente</label>
        <input type="text" id="nome" required placeholder="Nome completo">
      </div>

      <div class="row">
        <div class="form-group">
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" step="0.1" min="1" required placeholder="Ex: 70.5">
        </div>

        <div class="form-group">
          <label for="altura">Altura (m)</label>
          <input type="number" id="altura" step="0.01" min="0.3" max="2.5" required placeholder="Ex: 1.75">
        </div>
      </div>

      <div class="actions">
        <button type="reset" class="btn-secondary">Limpar</button>
        <button type="submit" class="btn-primary">Salvar</button>
      </div>
    </form>

    <section class="registros">
      <h2>Registros</h2>
      <ul id="listaRegistros"></ul>
    </section>
  </main>

  <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
