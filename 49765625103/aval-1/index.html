```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <form id="formProduto">
            <label for="descricao">Descrição do produto</label>
            <input type="text" id="descricao"
                   placeholder="Digite a descrição" required>

            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade"
                   placeholder="Digite a quantidade"
                   min="1" required>

            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor"
                   placeholder="Digite o valor"
                   min="0" step="0.01" required>

            <button type="submit">Cadastrar Produto</button>
        </form>

        <hr>

        <h2>Atualizar Produto</h2>

        <label for="codigo">Código do produto</label>
        <input type="number" id="codigo"
               placeholder="Digite o código">

        <label for="novoValor">Novo valor (R$)</label>
        <input type="number" id="novoValor"
               placeholder="Digite o novo valor"
               min="0" step="0.01">

        <button type="button" id="btnValor">
            Atualizar Valor
        </button>

        <label for="novaQuantidade">Adicionar quantidade</label>
        <input type="number" id="novaQuantidade"
               placeholder="Digite a quantidade"
               min="1">

        <button type="button" id="btnQuantidade">
            Atualizar Quantidade
        </button>

        <hr>

        <h2>Lista de Produtos</h2>

        <button type="button" id="btnListar">
            Listar Produtos
        </button>

        <div id="mensagem"></div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>
                <tbody id="listaProdutos">
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
