
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeTok - Rede Social</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topbar">
        <h1>Vibe<span>Tok</span></h1>
        <div class="top-actions">
            <button id="uploadBtn">＋ Criar</button>
            <div class="profile">U</div>
        </div>
    </header>

    <main class="feed" id="feed">

        <article class="video-card">
            <video class="video" loop muted playsinline
                src="https://www.w3schools.com/html/mov_bbb.mp4"></video>

            <div class="video-info">
                <h3>@criador_oficial</h3>
                <p>Compartilhando momentos incríveis! ✨</p>
                <p>🎵 Som original - Criador</p>
            </div>

            <div class="video-actions">
                <div class="creator-avatar">C</div>
                <button class="follow-btn">+</button>
                <button class="like-btn">❤️ <span>120</span></button>
                <button class="comment-btn">💬 <span>24</span></button>
                <button class="share-btn">↗️ <span>Compartilhar</span></button>
            </div>
        </article>

        <article class="video-card">
            <video class="video" loop muted playsinline
                src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video>

            <div class="video-info">
                <h3>@mundo_natureza</h3>
                <p>A beleza da natureza! 🌸🌿</p>
                <p>🎵 Música relaxante</p>
            </div>

            <div class="video-actions">
                <div class="creator-avatar">M</div>
                <button class="follow-btn">+</button>
                <button class="like-btn">❤️ <span>350</span></button>
                <button class="comment-btn">💬 <span>56</span></button>
                <button class="share-btn">↗️ <span>Compartilhar</span></button>
            </div>
        </article>

    </main>

    <input type="file" id="videoUpload" accept="video/*" hidden>

    <nav class="bottom-nav">
        <button id="homeBtn">🏠<span>Início</span></button>
        <button id="searchBtn">🔎<span>Buscar</span></button>
        <button id="navUploadBtn" class="create-nav">＋<span>Criar</span></button>
        <button id="inboxBtn">💬<span>Inbox</span></button>
        <button id="profileBtn">👤<span>Perfil</span></button>
    </nav>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
