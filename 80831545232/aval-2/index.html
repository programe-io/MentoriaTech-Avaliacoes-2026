<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conecta — Feed</title>
<link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<!-- ============ TOPBAR ============ -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="#">
      <span class="logo-mark">C</span>
      <span>Conecta</span>
    </a>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="search" type="text" placeholder="Buscar no feed..." />
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" id="theme-toggle" aria-label="Alternar tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <button class="icon-btn" aria-label="Notificações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="dot"></span>
      </button>
      <div class="avatar" style="--g1:#5b6cff; --g2:#8b5cf6; width:36px; height:36px; font-size:14px;">VC</div>
    </div>
  </div>
</header>

<!-- ============ LAYOUT ============ -->
<div class="layout">

  <!-- SIDEBAR ESQUERDA -->
  <aside class="sidebar-left">
    <nav>
      <button class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20z"/><path d="M9 21.5V12h6v9.5"/></svg>
        Início
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        Explorar
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Notificações
        <span class="badge">3</span>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.7-.8L3 21l1.9-5.1A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>
        Mensagens
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        Salvos
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Perfil
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Configurações
      </button>
    </nav>
  </aside>

  <!-- FEED -->
  <main>
    <!-- Composer -->
    <section class="card composer">
      <div class="composer-top">
        <div class="avatar" style="--g1:#5b6cff; --g2:#8b5cf6; width:44px; height:44px; font-size:16px;">VC</div>
        <textarea id="composer-input" rows="2" placeholder="No que você está pensando?"></textarea>
      </div>
      <div class="composer-actions">
        <div class="composer-tools">
          <button class="tool" type="button">📷 Foto</button>
          <button class="tool" type="button">🎥 Vídeo</button>
          <button class="tool" type="button">😊 Sentimento</button>
        </div>
        <button class="btn-primary" id="publish-btn" type="button">Publicar</button>
      </div>
    </section>

    <!-- Posts -->
    <div id="posts"></div>
  </main>

  <!-- SIDEBAR DIREITA -->
  <aside class="sidebar-right">
    <section class="card widget">
      <h3 class="card-title">Sugestões para você</h3>

      <div class="suggest">
        <div class="avatar" style="--g1:#22c55e; --g2:#0f766e; width:40px; height:40px; font-size:14px;">LF</div>
        <div class="suggest-info">
          <div class="suggest-name">Lucas Ferreira</div>
          <div class="suggest-sub">@lucasdev</div>
        </div>
        <button class="btn-follow" data-follow="Lucas Ferreira">Seguir</button>
      </div>

      <div class="suggest">
        <div class="avatar" style="--g1:#a855f7; --g2:#ec4899; width:40px; height:40px; font-size:14px;">MC</div>
        <div class="suggest-info">
          <div class="suggest-name">Marina Costa</div>
          <div class="suggest-sub">@marinacosta</div>
        </div>
        <button class="btn-follow" data-follow="Marina Costa">Seguir</button>
      </div>

      <div class="suggest">
        <div class="avatar" style="--g1:#f97316; --g2:#f43f5e; width:40px; height:40px; font-size:14px;">RL</div>
        <div class="suggest-info">
          <div class="suggest-name">Rafael Lima</div>
          <div class="suggest-sub">@rafalima</div>
        </div>
        <button class="btn-follow" data-follow="Rafael Lima">Seguir</button>
      </div>
    </section>

    <section class="card widget">
      <h3 class="card-title">Assuntos do momento</h3>
      <button class="trend">
        <div class="trend-tag">#FrontEnd</div>
        <div class="trend-count">12,4 mil publicações</div>
      </button>
      <button class="trend">
        <div class="trend-tag">#ViagemDosSonhos</div>
        <div class="trend-count">8,1 mil publicações</div>
      </button>
      <button class="trend">
        <div class="trend-tag">#CaféDaManhã</div>
        <div class="trend-count">5,7 mil publicações</div>
      </button>
      <button class="trend">
        <div class="trend-tag">#Tecnologia</div>
        <div class="trend-count">3,2 mil publicações</div>
      </button>
    </section>
  </aside>
</div>

<!-- NAV MOBILE -->
<nav class="bottom-nav">
  <button class="active" aria-label="Início">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20z"/><path d="M9 21.5V12h6v9.5"/></svg>
  </button>
  <button aria-label="Explorar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
  </button>
  <button aria-label="Publicar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
  </button>
  <button aria-label="Notificações">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
  </button>
  <button aria-label="Perfil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  </button>
</nav>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ================= ÍCONES ================= */
  var ICONS = {
    comment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.7-.8L3 21l1.9-5.1A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
    verified: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5l2.6 2 3.2-.4 1.2 3 2.9 1.5-1 3.1 1 3.1-2.9 1.5-1.2 3-3.2-.4-2.6 2-2.6-2-3.2.4-1.2-3L2.1 17.6l1-3.1-1-3.1 2.9-1.5 1.2-3 3.2.4z"/><path d="M10.6 15.4l-2.8-2.8 1.3-1.3 1.5 1.5 4-4 1.3 1.3z" fill="#fff"/></svg>'
  };

  function heartSVG(filled) {
    return '<svg viewBox="0 0 24 24" fill="' + (filled ? 'currentColor' : 'none') +
      '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
  }

  /* ================= DADOS ================= */
  var posts = [
    {
      id: 1,
      user: { name: "Ana Beatriz", initials: "AB", g1: "#f97316", g2: "#f43f5e", verified: true },
      time: "2 h",
      text: "Acordar às 5h e ver esse nascer do sol na trilha valeu cada segundo. 🌄\n\nQuem aí também é do time que ama uma aventura no fim de semana?",
      image: { bg: "linear-gradient(135deg,#0ea5e9,#1e3a8a)", emoji: "🏔️" },
      likes: 128, shares: 12, liked: false,
      comments: [
        { name: "Lucas Ferreira", initials: "LF", g1: "#22c55e", g2: "#0f766e", text: "Que lugar é esse? Preciso ir!" },
        { name: "Marina Costa", initials: "MC", g1: "#a855f7", g2: "#ec4899", text: "Simplesmente incrível 😍" }
      ]
    },
    {
      id: 2,
      user: { name: "Lucas Ferreira", initials: "LF", g1: "#22c55e", g2: "#0f766e", verified: false },
      time: "4 h",
      text: "Passei a manhã inteira caçando um bug que era só um ponto e vírgula faltando. 😅\n\nMoral da história: leia o console com calma antes de surtar.",
      image: null,
      likes: 84, shares: 6, liked: false,
      comments: [
        { name: "Ana Beatriz", initials: "AB", g1: "#f97316", g2: "#f43f5e", text: "Clássico! Todo dev já passou por isso 😂" }
      ]
    },
    {
      id: 3,
      user: { name: "Marina Costa", initials: "MC", g1: "#a855f7", g2: "#ec4899", verified: true },
      time: "6 h",
      text: "Domingo perfeito tem café coado, livro e nenhuma pressa. ☕📚",
      image: { bg: "linear-gradient(135deg,#f59e0b,#b45309)", emoji: "☕" },
      likes: 213, shares: 24, liked: false,
      comments: [
        { name: "Rafael Lima", initials: "RL", g1: "#f97316", g2: "#f43f5e", text: "A definição exata de paz." },
        { name: "Lucas Ferreira", initials: "LF", g1: "#22c55e", g2: "#0f766e", text: "Qual livro? 👀" }
      ]
    },
    {
      id: 4,
      user: { name: "Rafael Lima", initials: "RL", g1: "#f97316", g2: "#f43f5e", verified: false },
      time: "9 h",
      text: "Terminei meu primeiro projeto em React hoje! 🚀\n\nForam semanas de café, documentação e muita teimosia — mas deu certo. Obrigado a todo mundo que ajudou.",
      image: { bg: "linear-gradient(135deg,#6366f1,#0f172a)", emoji: "💻" },
      likes: 342, shares: 51, liked: false,
      comments: [
        { name: "Marina Costa", initials: "MC", g1: "#a855f7", g2: "#ec4899", text: "Parabéns!! 🎉🎉" }
      ]
    }
  ];

  /* ================= HELPERS ================= */
  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  function avatar(u, size) {
    size = size || 44;
    return '<div class="avatar" style="--g1:' + u.g1 + ';--g2:' + u.g2 +
      ';width:' + size + 'px;height:' + size + 'px;font-size:' +
      Math.round(size * 0.38) + 'px">' + esc(u.initials) + '</div>';
  }

  function plural(n, s, p) {
    return n + ' ' + (n === 1 ? s : p);
  }

  /* ================= RENDER ================= */
  function postHTML(p) {
    var commentsHTML = p.comments.map(function (c) {
      return '<div class="comment">' +
        avatar(c, 32) +
        '<div class="comment-bubble"><span class="comment-author">' + esc(c.name) + '</span>' +
        esc(c.text) + '</div></div>';
    }).join('');

    return '<article class="post" data-id="' + p.id + '">' +
      '<div class="post-head">' +
        avatar(p.user) +
        '<div class="post-meta">' +
          '<div class="post-author">' + esc(p.user.name) + (p.user.verified ? ICONS.verified : '') + '</div>' +
          '<div class="post-sub">' + esc(p.time) + ' · 🌍</div>' +
        '</div>' +
        '<button class="icon-btn" data-action="more" aria-label="Mais opções">' + ICONS.more + '</button>' +
      '</div>' +

      '<p class="post-text">' + esc(p.text) + '</p>' +

      (p.image
        ? '<div class="post-image" style="background:' + p.image.bg + '"><span>' + p.image.emoji + '</span></div>'
        : '') +

      '<div class="post-stats">' +
        '<span>' + plural(p.likes, 'curtida', 'curtidas') + '</span>' +
        '<span>' + plural(p.comments.length, 'comentário', 'comentários') + ' · ' +
          plural(p.shares, 'compartilhamento', 'compartilhamentos') + '</span>' +
      '</div>' +

      '<div class="post-actions">' +
        '<button class="action' + (p.liked ? ' liked' : '') + '" data-action="like">' +
          heartSVG(p.liked) + '<span>Curtir</span></button>' +
        '<button class="action" data-action="comment">' + ICONS.comment + '<span>Comentar</span></button>' +
        '<button class="action" data-action="share">' + ICONS.share + '<span>Compartilhar</span></button>' +
      '</div>' +

      '<div class="comments">' + commentsHTML +
        '<div class="comment-box">' +
          '<input type="text" placeholder="Escreva um comentário..." data-comment-input />' +
          '<button class="btn-send" data-action="send" aria-label="Enviar">' + ICONS.send + '</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  var feedEl = document.getElementById('posts');

  function renderFeed() {
    feedEl.innerHTML = posts.map(postHTML).join('');
  }

  function findPost(el) {
    var article = el.closest('.post');
    if (!article) return null;
    return posts.filter(function (p) { return p.id === Number(article.dataset.id); })[0] || null;
  }

  function refresh(article, post) {
    article.outerHTML = postHTML(post);
  }

  /* ================= TOAST ================= */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 2200);
  }

  /* ================= AÇÕES NOS POSTS ================= */
  function sendComment(article, post) {
    var input = article.querySelector('[data-comment-input]');
    if (!input) return;
    var text = input.value.trim();
    if (!text) { input.focus(); return; }

    post.comments.push({
      name: 'Você', initials: 'VC', g1: '#5b6cff', g2: '#8b5cf6', text: text
    });
    refresh(article, post);
    toast('Comentário publicado ✅');
  }

  feedEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;

    var article = btn.closest('.post');
    var post = findPost(btn);
    if (!article || !post) return;

    var action = btn.dataset.action;

    if (action === 'like') {
      post.liked = !post.liked;
      post.likes += post.liked ? 1 : -1;
      refresh(article, post);
    } else if (action === 'share') {
      post.shares += 1;
      refresh(article, post);
      toast('Link copiado para a área de transferência 🔗');
    } else if (action === 'comment') {
      var input = article.querySelector('[data-comment-input]');
      if (input) input.focus();
    } else if (action === 'send') {
      sendComment(article, post);
    } else if (action === 'more') {
      toast('Mais opções em breve 😉');
    }
  });

  feedEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.matches('[data-comment-input]')) {
      e.preventDefault();
      var article = e.target.closest('.post');
      var post = findPost(e.target);
      if (article && post) sendComment(article, post);
    }
  });

  /* ================= COMPOSER ================= */
  var composerInput = document.getElementById('composer-input');
  var publishBtn = document.getElementById('publish-btn');

  function publish() {
    var text = composerInput.value.trim();
    if (!text) {
      composerInput.focus();
      toast('Escreva algo antes de publicar ✍️');
      return;
    }

    var newPost = {
      id: Date.now(),
      user: { name: 'Você', initials: 'VC', g1: '#5b6cff', g2: '#8b5cf6', verified: false },
      time: 'agora',
      text: text,
      image: null,
      likes: 0,
      shares: 0,
      liked: false,
      comments: []
    };

    posts.unshift(newPost);
    feedEl.insertAdjacentHTML('afterbegin', postHTML(newPost));
    composerInput.value = '';
    toast('Publicado com sucesso 🎉');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  publishBtn.addEventListener('click', publish);

  composerInput.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      publish();
    }
  });

  /* ================= BUSCA ================= */
  var searchInput = document.getElementById('search');

  searchInput.addEventListener('input', function () {
    var q = searchInput.value.toLowerCase().trim();

    Array.prototype.forEach.call(feedEl.querySelectorAll('.post'), function (el) {
      var post = posts.filter(function (p) { return p.id === Number(el.dataset.id); })[0];
      if (!post) return;

      var match = !q ||
        post.text.toLowerCase().indexOf(q) !== -1 ||
        post.user.name.toLowerCase().indexOf(q) !== -1;

      el.style.display = match ? '' : 'none';
    });
  });

  /* ================= SEGUIR ================= */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-follow]');
    if (!btn) return;

    var following = btn.classList.toggle('following');
    btn.textContent = following ? 'Seguindo' : 'Seguir';
    toast(following
      ? 'Você começou a seguir ' + btn.dataset.follow + ' 👥'
      : 'Você deixou de seguir ' + btn.dataset.follow);
  });

  /* ================= TEMA ================= */
  var themeBtn = document.getElementById('theme-toggle');
  var moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
  var sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="3.5"/><line x1="12" y1="20.5" x2="12" y2="22.5"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1.5" y1="12" x2="3.5" y2="12"/><line x1="20.5" y1="12" x2="22.5" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>';

  themeBtn.addEventListener('click', function () {
    var dark = document.body.classList.toggle('dark');
    themeBtn.innerHTML = dark ? sunIcon : moonIcon;
  });

  /* ================= NAV (visual) ================= */
  document.addEventListener('click', function (e) {
    var navBtn = e.target.closest('.nav-item, .bottom-nav button');
    if (!navBtn) return;

    var group = navBtn.parentElement.querySelectorAll('.nav-item, button');
    Array.prototype.forEach.call(group, function (b) { b.classList.remove('active'); });
    navBtn.classList.add('active');
  });

  /* ================= INICIAR ================= */
  renderFeed();
})();
</script>
</body>
</html>
