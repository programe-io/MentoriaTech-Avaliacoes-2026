
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8f1f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #0002;
        }

        h1 {
            text-align: center;
            color: #1769aa;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #104d80;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background: #e8f1f8;
            border-radius: 8px;
            display: none;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Calculadora de IMC</h1>

        <label>Nome do paciente:</label>
        <input type="text" id="nome" placeholder="Digite o nome">

        <label>Peso (kg):</label>
        <input type="number" id="peso" placeholder="Ex: 60">

        <label>Altura (m):</label>
        <input type="number" id="altura" placeholder="Ex: 1.65" step="0.01">

        <button onclick="calcular()">Calcular IMC</button>

        <div id="resultado"></div>

    </div>

    <script>
        function calcular() {

            let nome = document.getElementById("nome").value.trim();
            let peso = Number(document.getElementById("peso").value);
            let altura = Number(document.getElementById("altura").value);

            if (nome === "" || peso <= 0 || altura <= 0 ||
                !Number.isFinite(peso) || !Number.isFinite(altura)) {
                alert("Preencha todos os campos corretamente!");
                return;
            }

            let imc = peso / (altura * altura);

            let resultado = document.getElementById("resultado");

            resultado.style.display = "block";

            resultado.innerHTML = `
                <h3>Resultado do paciente</h3>
                <p><b>Nome:</b> ${nome.replace(/[&<>"']/g, "")}</p>
                <p><b>Peso:</b> ${peso} kg</p>
                <p><b>Altura:</b> ${altura} m</p>
                <p><b>IMC:</b> ${imc.toFixed(2)}</p>
                <hr>
                <p>O IMC é um indicador que relaciona peso e altura.
                Sua interpretação depende da idade e de outros fatores.</p>
            `;
        }
    </script>

<script src="script.js"></script></body>
</html>
