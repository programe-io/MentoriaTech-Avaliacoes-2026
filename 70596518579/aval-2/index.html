<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <style>
        /* RESET E VARIÁVEIS DE ESTILO */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 10px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* CABEÇALHO */
        header {
            text-align: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        /* CARDS E FORMULÁRIOS */
        .grid-forms {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--text-main);
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background-color: #ffffff;
        }

        /* BOTOES */
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: auto;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        .btn-update {
            background-color: var(--accent);
        }

        .btn-update:hover {
            background-color: var(--accent-hover);
        }

        /* TABELA */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
            font-style: italic;
        }

        .price-badge {
            font-weight: 600;
            color: #059669;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <header>
        <h1>Painel de Controle de Estoque</h1>
        <p>Gerencie produtos, altere quantidades e atualize valores em tempo real</p>
    </header>

    <div class="grid-forms">
        <!-- FORMULÁRIO 1: Cadastrar Produto -->
        <div class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="formCadastro">
                <div class="form-group">
                    <label for="cadCodigo">Código</label>
                    <input type="text" id="cadCodigo" placeholder="Ex: P001" required>
                </div>
                <div class="form-group">
                    <label for="cadDescricao">Descrição</label>
                    <input type="text" id="cadDescricao" placeholder="Ex: Teclado Mecânico" required>
                </div>
                <div class="form-group">
                    <label for="cadQtd">Quantidade Inicial</label>
                    <input type="number" id="cadQtd" min="0" placeholder="0" required>
                </div>
                <div class="form-group">
                    <label for="cadValor">Valor Unitário (R$)</label>
                    <input type="number" id="cadValor" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <button type="submit">Cadastrar Produto</button>
            </form>
        </div>

        <!-- FORMULÁRIO 2: Alterar Valor -->
        <div class="card">
            <h2>Alterar Valor</h2>
            <form id="formValor">
                <div class="form-group">
                    <label for="valCodigo">Código do Produto</label>
                    <input type="text" id="valCodigo" placeholder="Ex: P001" required>
                </div>
                <div class="form-group">
                    <label for="novoValor">Novo Valor Unitário (R$)</label>
                    <input type="number" id="novoValor" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <button type="submit" class="btn-update">Atualizar Valor</button>
            </form>
        </div>

        <!-- FORMULÁRIO 3: Alterar Quantidade -->
        <div class="card">
            <h2>Alterar Quantidade</h2>
            <form id="formQtd">
                <div class="form-group">
                    <label for="qtdCodigo">Código do Produto</label>
                    <input type="text" id="qtdCodigo" placeholder="Ex: P001" required>
                </div>
                <div class="form-group">
                    <label for="novaQtd">Nova Quantidade</label>
                    <input type="number" id="novaQtd" min="0" placeholder="0" required>
                </div>
                <button type="submit" class="btn-update">Atualizar Quantidade</button>
            </form>
        </div>
    </div>

    <!-- LISTA DE PRODUTOS CADASTRADOS -->
    <div class="card">
        <h2>Produtos no Estoque</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Qtd em Estoque</th>
                        <th>Valor Un.</th>
                        <th>Total em Estoque</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo">
                    <!-- Gerado pelo JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const estoque = [];

    function listarProdutos() {
        const tbody = document.getElementById('tabelaCorpo');
        tbody.innerHTML = '';

        if (estoque.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">Nenhum produto cadastrado no momento.</td></tr>';
            return;
        }

        estoque.forEach(produto => {
            const tr = document.createElement('tr');
            const subtotal = produto.quantidade * produto.valor;
            tr.innerHTML = `
                <td><strong>${produto.codigo}</strong></td>
                <td>${produto.descricao}</td>
                <td>${produto.quantidade}</td>
                <td class="price-badge">R$ ${produto.valor.toFixed(2)}</td>
                <td class="price-badge">R$ ${subtotal.toFixed(2)}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 1. Cadastrar produto
    document.getElementById('formCadastro').addEventListener('submit', function(e) {
        e.preventDefault();

        const codigo = document.getElementById('cadCodigo').value.trim();
        const descricao = document.getElementById('cadDescricao').value.trim();
        const quantidade = parseInt(document.getElementById('cadQtd').value, 10);
        const valor = parseFloat(document.getElementById('cadValor').value);

        if (estoque.some(p => p.codigo === codigo)) {
            alert('Erro: Já existe um produto cadastrado com este código!');
            return;
        }

        estoque.push({ codigo, descricao, quantidade, valor });
        listarProdutos();
        this.reset();
    });

    // 2. Alterar valor
    document.getElementById('formValor').addEventListener('submit', function(e) {
        e.preventDefault();

        const codigo = document.getElementById('valCodigo').value.trim();
        const novoValor = parseFloat(document.getElementById('novoValor').value);

        const produto = estoque.find(p => p.codigo === codigo);
        if (!produto) {
            alert('Erro: Produto não encontrado!');
            return;
        }

        produto.valor = novoValor;
        listarProdutos();
        alert('Valor do produto atualizado com sucesso!');
        this.reset();
    });

    // 3. Alterar quantidade
    document.getElementById('formQtd').addEventListener('submit', function(e) {
        e.preventDefault();

        const codigo = document.getElementById('qtdCodigo').value.trim();
        const novaQtd = parseInt(document.getElementById('novaQtd').value, 10);

        const produto = estoque.find(p => p.codigo === codigo);
        if (!produto) {
            alert('Erro: Produto não encontrado!');
            return;
        }

        produto.quantidade = novaQtd;
        listarProdutos();
        alert('Quantidade atualizada com sucesso!');
        this.reset();
    });

    // Inicialização
    listarProdutos();
</script>

<script src="script.js"></script></body>
</html>
