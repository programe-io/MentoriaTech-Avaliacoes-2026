<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Interativo</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="feed-wrapper">
        <header class="feed-header">
            <h1>Timeline</h1>
        </header>
        
        <!-- Formulário de publicação rápida -->
        <form id="feed-form" class="compose-box">
            <input type="text" id="post-input" placeholder="No que você está pensando agora?" autocomplete="off">
            <button type="submit">Enviar</button>
        </form>

        <!-- Container dinâmico dos cards -->
        <section id="posts-container">
            <!-- Os cards de posts entrarão aqui via JS -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
