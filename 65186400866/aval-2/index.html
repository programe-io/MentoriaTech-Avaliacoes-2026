<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mini Feed</title>
    <!-- Esta linha abaixo conecta o HTML ao arquivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="feed-container">
        
        <!-- Cabeçalho do Feed -->
        <header class="feed-header">
            <h1>✨ Minhas Atualizações</h1>
        </header>

        <!-- Post 1 -->
        <article class="feed-card">
            <div class="card-header">
                <div class="avatar-placeholder">EU</div>
                <div class="user-info">
                    <span class="username">Yude </span>
                    <span class="timestamp">Há 10 minutos</span>
                </div>
            </div>
            <p class="card-content">
                Acabei de organizar meu código separando o HTML do CSS! Ficou muito mais limpo e fácil de entender. 🚀
            </p>
            <div class="card-footer">
                <button class="action-btn">👍 Curtir</button>
                <button class="action-btn">💬 Comentar</button>
            </div>
        </article>

        <!-- Post 2 -->
        <article class="feed-card">
            <div class="card-header">
                <div class="avatar-placeholder">EU</div>
                <div class="user-info">
                    <span class="username">Yan vieira</span>
                    <span class="timestamp">Ontem</span>
                </div>
            </div>
            <p class="card-content">
                "O sucesso é a soma de pequenos esforços repetidos dia após dia." Focando nos estudos de desenvolvimento web hoje! ☕💻
            </p>
            <div class="card-footer">
                <button class="action-btn">👍 Curtir</button>
                <button class="action-btn">💬 Comentar</button>
            </div>
        </article>

    </div>

</body>
</html>
