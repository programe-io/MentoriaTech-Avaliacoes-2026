<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Básico</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="feed-container">
        <h2>Mini Feed</h2>
        
        <!-- Área para criar nova publicação -->
        <div class="post-box">
            <textarea id="post-text" placeholder="O que você está pensando?"></textarea>
            <button id="post-btn">Publicar</button>
        </div>

        <!-- Área onde os posts serão inseridos -->
        <div id="feed-posts">
            <!-- Posts antigos ou novos vão aparecer aqui -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
