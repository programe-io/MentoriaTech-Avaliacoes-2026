<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed de Cartões e Humor</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="app-container">
        <!-- Painel de Criação -->
        <aside class="creator-panel">
            <h2>Criar Card</h2>
            <textarea id="card-text" placeholder="Escreva o pensamento do dia..."></textarea>
            
            <div class="selector-group">
                <label>Escolha o Humor:</label>
                <div class="emoji-selector">
                    <input type="radio" name="emoji" value="🚀" id="e1" checked><label for="e1">🚀 Focado</label>
                    <input type="radio" name="emoji" value="☕" id="e2"><label for="e2">☕ Relaxado</label>
                    <input type="radio" name="emoji" value="💡" id="e3"><label for="e3">💡 Ideia</label>
                    <input type="radio" name="emoji" value="🔥" id="e4"><label for="e4">🔥 Animado</label>
                </div>
            </div>

            <div class="selector-group">
                <label>Cor do Card:</label>
                <div class="color-selector">
                    <input type="radio" name="color" value="bg-blue" id="c1" checked><label for="c1" class="dot blue"></label>
                    <input type="radio" name="color" value="bg-purple" id="c2"><label for="c2" class="dot purple"></label>
                    <input type="radio" name="color" value="bg-amber" id="c3"><label for="c3" class="dot amber"></label>
                    <input type="radio" name="color" value="bg-emerald" id="c4"><label for="c4" class="dot emerald"></label>
                </div>
            </div>

            <button id="publish-btn">Adicionar ao Mural</button>
        </aside>

        <!-- Mural do Feed -->
        <main class="feed-mural">
            <h2>Mural da Comunidade</h2>
            <div id="mural-grid" class="grid-container">
                <!-- Os cartões coloridos vão entrar aqui -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
