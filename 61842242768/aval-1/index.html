<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fernanda Marisa | Mentoria Tech</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#6a11cb,#2575fc,#ff4ecd);
    background-size:400% 400%;
    animation:fundo 12s ease infinite;
    padding:20px;
}

@keyframes fundo{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
    width:900px;
    max-width:100%;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:40px;
    text-align:center;
    color:white;
    box-shadow:0 10px 35px rgba(0,0,0,.35);
}

h1{
    font-size:3rem;
    margin-bottom:10px;
}

h2{
    color:#ffe066;
    margin-bottom:20px;
}

p{
    font-size:18px;
    line-height:1.8;
    margin-bottom:25px;
}

.video{
    position:relative;
    width:100%;
    padding-bottom:56.25%;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:25px;
}

.video iframe{
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
}

button{
    background:#ffe066;
    color:#222;
    border:none;
    padding:15px 40px;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:white;
}

footer{
    margin-top:30px;
    opacity:.9;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

<h1>Fernanda Marisa 💜</h1>

<h2>Mentoria Tech 2</h2>

<p>
Bem-vindo(a)! Este projeto foi desenvolvido para apresentar a
Mentoria Tech 2, proporcionando aprendizado em tecnologia,
programação e desenvolvimento de habilidades digitais.
</p>

<div class="video">
<iframe src="https://www.youtube.com/embed/hZFjLm5j2zc"
allowfullscreen></iframe>
</div>

<button onclick="alert('Bem-vindo(a) à Mentoria Tech! 🚀')">
Entrar
</button>

<footer>
✨ Desenvolvido por Fernanda Marisa • 2026 ✨
</footer>

</div>

</body>
</html>
