<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <!-- Formulário de Cadastro -->
        <form id="task-form">
            <div class="input-group">
                <label for="titulo">Título da Tarefa:</label>
                <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript (mín. 5 caracteres)" required>
            </div>

            <div class="input-group">
                <label for="prioridade">Prioridade (1 a 3):</label>
                <select id="prioridade" required>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>
            </div>

            <button type="submit" class="btn-cadastrar">Cadastrar Tarefa</button>
        </form>

        <!-- Mensagem de Feedback/Erro -->
        <div id="mensagem" class="mensagem oculto"></div>

        <!-- Lista de Tarefas -->
        <div class="tasks-section">
            <h2>Tarefas Cadastradas</h2>
            <ul id="task-list">
                <!-- As tarefas aparecerão aqui dinamicamente -->
            </ul>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>$0
