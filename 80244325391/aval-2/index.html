
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SocialFeed</title>
<link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topbar">
    <h2>SocialFeed ✨</h2>
    <input type="search" placeholder="Pesquisar...">
    <div>🔔　👤</div>
</header>

<div class="layout">

    <aside class="sidebar">
        <h3>Menu</h3>
        <a href="#">🏠 Início</a>
        <a href="#">👥 Amigos</a>
        <a href="#">💬 Mensagens</a>
        <a href="#">❤️ Curtidas</a>
        <a href="#">⚙️ Configurações</a>
    </aside>

    <main class="feed">

        <section class="stories">
            <h3>Stories</h3>
            <div class="story-list">
                <div>😀<small>Você</small></div>
                <div>😎<small>Lucas</small></div>
                <div>🥰<small>Ana</small></div>
                <div>🤩<small>Maria</small></div>
            </div>
        </section>

        <section class="create">
            <h3>Criar publicação</h3>
            <textarea id="postText"
                placeholder="O que você está pensando?"></textarea>

            <input type="file" id="postImage" accept="image/*">

            <button onclick="publish()">Publicar</button>
        </section>

        <section id="posts"></section>

    </main>

    <aside class="rightbar">
        <h3>Sugestões de amigos</h3>
        <div class="friend">👨 Lucas <button>Adicionar</button></div>
        <div class="friend">👩 Ana <button>Adicionar</button></div>
        <div class="friend">👩 Maria <button>Adicionar</button></div>
    </aside>

</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
