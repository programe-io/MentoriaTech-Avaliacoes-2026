<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clone Instagram</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body class="bg-gray-50 text-slate-900 pb-16 md:pb-0">
  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
    <div class="max-w-4xl mx-auto h-14 md:h-16 px-4 flex items-center justify-between">
      <h1 class="text-xl font-bold italic">Instagram</h1>
      <input type="text" placeholder="Pesquisar" class="hidden md:block w-64 h-9 bg-gray-100 px-4 rounded-lg text-sm">
      <i class="bx bx-menu md:hidden text-2xl"></i>
    </div>
  </header>

  <!-- Main Feed -->
  <main class="max-w-4xl mx-auto md:py-8 flex gap-8 justify-center">
    <div class="w-full md:max-w-[470px]">
      <article class="bg-white border-y md:border border-gray-200 md:rounded-lg mt-4">
        <div class="flex items-center justify-between p-3">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-yellow-400 to-purple-600 p-[2px]">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80" alt="User" class="w-full h-full object-cover rounded-full border border-white">
            </div>
            <div>
              <p class="text-sm font-semibold">frojo_dev</p>
              <p class="text-xs text-gray-500">Parnaíba-PI</p>
            </div>
          </div>
          <i class="bx bx-dots-horizontal-rounded text-xl"></i>
        </div>
        <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=800&q=80" alt="Post" class="w-full object-cover">
        <div class="p-3">
          <div class="flex gap-4 text-2xl mb-2">
            <i class="bx bx-heart"></i> <i class="bx bx-message-rounded"></i> <i class="bx bx-send"></i>
          </div>
          <p class="font-semibold text-sm">mil e poucas curtidas</p>
          <p class="text-sm"><span class="font-semibold">frojo_dev</span> Layout responsivo com Tailwind! 🚀</p>
        </div>
      </article>
    </div>
    
    <!-- Sidebar Desktop -->
    <aside class="hidden md:block w-80">
      <div class="sticky top-20">
        <div class="flex items-center gap-3 mb-4">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80" alt="User" class="w-12 h-12 rounded-full object-cover">
          <p class="text-sm font-semibold">frojo_dev</p>
        </div>
        <p class="text-xs text-gray-400">&copy; 2026 INSTAGRAM FROM META</p>
      </div>
    </aside>
  </main>

  <!-- Mobile Nav -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 md:hidden flex justify-around p-3 text-2xl">
    <i class="bx bx-home-alt-2"></i> <i class="bx bx-search"></i> <i class="bx bx-plus-circle"></i> <i class="bx bx-user"></i>
  </nav>
</body>
</html>
