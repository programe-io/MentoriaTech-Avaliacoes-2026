<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Princesinha Sofia</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(to bottom,#f7d8ff,#ffe9f8);
    text-align:center;
}

header{
    background:#b84dff;
    color:white;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

h1{
    margin:0;
}

img{
    width:300px;
    margin-top:20px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    transition:0.5s;
}

img:hover{
    transform:scale(1.05);
}

button{
    margin:15px;
    padding:15px 25px;
    font-size:18px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    background:#a64dff;
    color:white;
    transition:.3s;
}

button:hover{
    background:#7d2cff;
    transform:scale(1.08);
}

#mensagem{
    margin-top:20px;
    font-size:22px;
    color:#7a1fa2;
    font-weight:bold;
}

footer{
    margin-top:40px;
    padding:15px;
    background:#d9a7ff;
    color:white;
}
</style>

<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>👑 Bem-vindo ao Reino da Princesinha Sofia 👑</h1>
</header>

<img
src="https://via.placeholder.com/300x400?text=Princesinha+Sofia"
alt="Princesinha Sofia">

<div>

<button onclick="amizade()">
💜 Amizade
</button>

<button onclick="magia()">
✨ Magia
</button>

<button onclick="castelo()">
🏰 Castelo
</button>

</div>

<p id="mensagem">
Clique em um botão para descobrir uma surpresa!
</p>

<footer>
Feito com 💜 para os fãs da Princesinha Sofia.
</footer>

<script>

function amizade(){
    document.getElementById("mensagem").innerHTML =
    "💜 A verdadeira princesa trata todos com carinho e amizade!";
}

function magia(){
    document.getElementById("mensagem").innerHTML =
    "✨ A magia acontece quando fazemos o bem!";
}

function castelo(){
    document.getElementById("mensagem").innerHTML =
    "🏰 Bem-vindo ao lindo castelo da Princesinha Sofia!";
}

</script>

<script src="script.js"></script></body>
</html>
