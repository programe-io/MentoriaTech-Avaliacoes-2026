```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Cadastro e controle de produtos</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Cadastrar Produto</h2>

            <div class="form-grid">
                <div>
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" placeholder="Ex: 001">
                </div>

                <div>
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" placeholder="Nome do produto">
                </div>

                <div>
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="0" placeholder="0">
                </div>

                <div>
                    <label for="valor">Valor</label>
                    <input type="number" id="valor" min="0" step="0.01" placeholder="0,00">
                </div>
            </div>

            <button onclick="cadastrarProduto()">Cadastrar Produto</button>
        </section>

        <section class="card">
            <h2>Produtos Cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Produtos aparecerão aqui -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>Sistema de Estoque &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
```
