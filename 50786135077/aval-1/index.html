
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Estoque</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <h1>Sistema de Estoque</h1>
    <p>Cadastro e controle de produtos</p>
  </header>

  <main class="container">
    <section class="painel">
      <h2>Cadastrar produto</h2>

      <form id="formProduto">
        <label for="descricao">Descrição</label>
        <input id="descricao" type="text" minlength="5" required>

        <label for="quantidade">Quantidade</label>
        <input id="quantidade" type="number" min="1" step="1" required>

        <label for="valor">Valor (R$)</label>
        <input id="valor" type="number" min="0" step="0.01" required>

        <button type="submit">Cadastrar produto</button>
      </form>
      <p id="mensagem"></p>
    </section>

    <section class="painel">
      <h2>Produtos cadastrados</h2>
      <p>Produtos: <strong id="totalProdutos">0</strong></p>
      <p>Unidades: <strong id="totalUnidades">0</strong></p>

      <input id="pesquisa" type="search" placeholder="Buscar produto">

      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Quantidade</th>
            <th>Valor</th>
          </tr>
        </thead>
        <tbody id="listaProdutos"></tbody>
      </table>
    </section>

    <section class="painel">
      <h2>Atualizar produto</h2>

      <label for="codigoAtualizar">Código do produto</label>
      <input id="codigoAtualizar" type="number" min="1">

      <label for="novoValor">Novo valor (R$)</label>
      <input id="novoValor" type="number" min="0" step="0.01">
      <button id="botaoValor" type="button">Atualizar valor</button>

      <label for="entradaQuantidade">Quantidade a adicionar</label>
      <input id="entradaQuantidade" type="number" min="1" step="1">
      <button id="botaoQuantidade" type="button">Adicionar quantidade</button>
    </section>
  </main>
<script src="script.js"></script></body>
</html>
