<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram</title>
    <!-- Script do Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Cabeçalho (Navbar) -->
    <header class="bg-white border-b border-gray-300 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold font-serif">Instagram</h1>
            
            <input type="text" placeholder="Pesquisar" class="bg-gray-100 border border-gray-300 rounded px-3 py-1 text-sm text-center focus:outline-none focus:border-gray-400">
            
            <nav class="flex items-center space-x-4">
                <a href="#" class="font-semibold">Início</a>
                <a href="#" class="text-gray-600">Perfil</a>
            </nav>
        </div>
    </header>

    <!-- Estrutura Principal -->
    <main class="max-w-4xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Coluna Esquerda: Feed de Publicações -->
        <section class="md:col-span-2 space-y-6">
            <article class="bg-white border border-gray-300 rounded-lg">
                <!-- Cabeçalho do Post -->
                <div class="p-3 flex items-center space-x-3 border-b border-gray-200">
                    <div class="w-8 h-8 bg-gray-300 rounded-full"></div>
                    <span class="font-semibold text-sm">usuario_exemplo</span>
                </div>
                
                <!-- Imagem / Mídia do Post -->
                <div class="w-full h-80 bg-gray-200"></div>
                
                <!-- Ações e Legenda -->
                <div class="p-3 space-y-2">
                    <div class="flex space-x-4">
                        <button class="font-bold cursor-pointer">Curtir</button>
                        <button class="font-bold cursor-pointer">Comentar</button>
                    </div>
                    <p class="text-sm font-semibold">1.234 curtidas</p>
                    <p class="text-sm"><strong>usuario_exemplo</strong> Primeira postagem do nosso clone do Instagram com Tailwind! 🚀</p>
                </div>
            </article>
        </section>

        <!-- Coluna Direita: Perfil e Sugestões -->
        <aside class="hidden md:block space-y-4">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-gray-300 rounded-full"></div>
                <div>
                    <p class="font-semibold text-sm">seu_usuario</p>
                    <p class="text-gray-500 text-xs">Seu Nome</p>
                </div>
            </div>
            <div>
                <p class="text-sm font-bold text-gray-500 mb-2">Sugestões para você</p>
                <!-- Lista de sugestões simulada -->
                <div class="space-y-3">
                    <div class="flex items-center justify-between text-sm">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 bg-gray-300 rounded-full"></div>
                            <span>amigo_dev</span>
                        </div>
                        <button class="text-blue-500 font-semibold text-xs">Seguir</button>
                    </div>
                </div>
            </div>
        </aside>

    </main>

</body>
</html>
