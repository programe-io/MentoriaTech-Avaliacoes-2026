<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineGram</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
   {
    <link rel="stylesheet" href="style.css">$0
   }

<style>
  {
    box-sizing: border-box;
  }

body {
    margin: 0;
    background: #202820;
    color: white;
    font-family: monospace;
 }

header {
    background: #386b32;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 5px solid #244b22;
    position: sticky;
    top: 0;
 }

.logo {
    font-size: 27px;
    color: #a9ff83;
    font-weight: bold;
    text-shadow: 3px 3px #193a19;
 }

header input {
    width: 220px;
    padding: 10px;
    background: #253e25;
    border: 2px solid #91ce76;
    color: white;
 }

.container {
    max-width: 600px;
    margin: 25px auto;
    padding: 10px;
 }

.stories {
    display: flex;
    gap: 18px;
    overflow-x: auto;
    background: #303c2c;
    padding: 15px;
    border: 3px solid #55794a;
 }

.story {
    text-align: center;
    min-width: 65px;
 }

.avatar {
    width: 58px;
    height: 58px;
    background: #79a84d;
    border: 4px solid #b1ef75;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
 }

.post {
    background: #303c2c;
    margin-top: 25px;
    border: 3px solid #55794a;
 }

.post-header {
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
 }

.post-image {
    height: 350px;
    background: linear-gradient(#71b9e9 55%, #5d963b 55%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 100px;
    position: relative;
 }

.post-image span {
    filter: drop-shadow(4px 4px #333);
 }

.post-actions {
    padding: 12px;
 }

button {
    background: #579b3e;
    color: white;
    border: 2px solid #9ad76b;
    padding: 9px 14px;
    cursor: pointer;
    font-family: monospace;
    font-weight: bold;
 }

button:hover {
    background: #76c84c;
 }

.like {
    font-size: 24px;
    background: transparent;
    border: none;
    padding: 5px;
 }

.liked {
    color: #ff4545;
 }

.caption {
    padding: 0 14px 14px;
 }

.comment {
    padding: 10px;
    width: 75%;
    background: #1e2b1d;
    color: white;
    border: 2px solid #55794a;
 }

.comments {
    padding: 0 14px;
 }

.create {
    margin-top: 20px;
    padding: 15px;
    background: #303c2c;
    border: 3px solid #55794a;
 }

.create input {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    background: #1e2b1d;
    color: white;
    border: 2px solid #55794a;
 }

footer {
    text-align: center;
    padding: 30px;
    color: #a9ff83;
 }
</style>
</head>

<body>

<header>
    <div class="logo">⛏ MINEGRAM</div>
    <input id="search" placeholder="Pesquisar jogadores...">
</header>

<div class="container">

    <h3>🌟 Histórias</h3>

    <div class="stories">
        <div class="story">
            <div class="avatar">🧑</div>
            Steve
        </div>
        <div class="story">
            <div class="avatar">🧟</div>
            Zumbi
        </div>
        <div class="story">
            <div class="avatar">🐷</div>
            Pig
        </div>
        <div class="story">
            <div class="avatar">🐺</div>
            Wolf
        </div>
        <div class="story">
            <div class="avatar">🐉</div>
            Dragon
        </div>
    </div>

    <div class="create">
        <h3>➕ Criar publicação</h3>
        <input id="username" placeholder="Seu nickname">
        <input id="description" placeholder="O que você construiu?">
        <input id="emoji" placeholder="Emoji da publicação (ex: 🏰)">
        <button onclick="createPost()">PUBLICAR</button>
    </div>

    <div id="feed">

        <div class="post">
            <div class="post-header">
                <div class="avatar">🧑</div>
                <b>Steve_oficial</b>
            </div>

            <div class="post-image">
                <span>🏰</span>
            </div>

            <div class="post-actions">
                <button class="like" onclick="likePost(this)">♡</button>
                <span class="likes">120 curtidas</span>
                <button onclick="commentPost(this)">💬 Comentar</button>
            </div>

            <div class="caption">
                <b>Steve_oficial</b>
                Minha nova casa no Minecraft! 🏡
            </div>

            <div class="comments"></div>
        </div>

        <div class="post">
            <div class="post-header">
                <div class="avatar">🐉</div>
                <b>EnderDragon</b>
            </div>

            <div class="post-image" style="background:linear-gradient(#211c44 55%,#352b53 55%)">
                <span>🐉</span>
            </div>

            <div class="post-actions">
                <button class="like" onclick="likePost(this)">♡</button>
                <span class="likes">350 curtidas</span>
                <button onclick="commentPost(this)">💬 Comentar</button>
            </div>

            <div class="caption">
                <b>EnderDragon</b>
                Dominando o The End! 💜
            </div>

            <div class="comments"></div>
        </div>

    </div>
</div>

<footer>
    ⛏ MINEGRAM - A rede social dos minecrafters!
</footer>

<script>
function likePost(button) {
    const likes = button.nextElementSibling;
    let count = parseInt(likes.textContent);

    if (button.classList.contains("liked")) {
        count--;
        button.classList.remove("liked");
        button.textContent = "♡";
     } else {
        count++;
        button.classList.add("liked");
        button.textContent = "♥";
     }

    likes.textContent = count + " curtidas";
 }

function commentPost(button) {
    const post = button.closest(".post");
    const comments = post.querySelector(".comments");

    const comment = prompt("Digite seu comentário:");

    if (comment && comment.trim()) {
        const p = document.createElement("p");
        p.textContent = "🧑 Jogador: " + comment;
        comments.appendChild(p);
     }
 }

function createPost() {
    const username = document.getElementById("username").value.trim();
    const description = document.getElementById("description").value.trim();
    const emoji = document.getElementById("emoji").value.trim() || "⛏";

    if (!username || !description) {
        alert("Preencha seu nickname e sua publicação!");
        return;
     }

    const post = document.createElement("div");
    post.className = "post";

    const header = document.createElement("div");
    header.className = "post-header";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "🧑";

    const name = document.createElement("b");
    name.textContent = username;

    header.append(avatar, name);

    const image = document.createElement("div");
    image.className = "post-image";
    image.textContent = emoji;

    const actions = document.createElement("div");
    actions.className = "post-actions";

    const like = document.createElement("button");
    like.className = "like";
    like.textContent = "♡";
    like.onclick = () => likePost(like);

    const likes = document.createElement("span");
    likes.className = "likes";
    likes.textContent = "0 curtidas";

    const comment = document.createElement("button");
    comment.textContent = "💬 Comentar";
    comment.onclick = () => commentPost(comment);

    actions.append(like, likes, comment);

    const caption = document.createElement("div");
    caption.className = "caption";

    const bold = document.createElement("b");
    bold.textContent = username + " ";

    caption.append(bold, document.createTextNode(description));

    const comments = document.createElement("div");
    comments.className = "comments";

    post.append(header, image, actions, caption, comments);

    document.getElementById("feed").prepend(post);

    document.getElementById("description").value = "";
    document.getElementById("emoji").value = "";
 }

document.getElementById("search").addEventListener("input", function() {
    const search = this.value.toLowerCase();

    document.querySelectorAll(".post").forEach(post => {
        post.style.display =
            post.textContent.toLowerCase().includes(search)
            ? "block" : "none"; 
   });
 });
<script src="script.js"></script>;

<script src="script.js"></script></body>
