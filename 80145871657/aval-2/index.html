<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed Social</title>
  <!-- Link para o arquivo CSS externo ou você pode colar o CSS dentro de <style> -->
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Container principal que segura todo o Feed -->
  <div class="feed-container">

    <!-- POST 1: Publicação com Imagem -->
    <article class="post-card">
      <!-- Cabeçalho com dados do usuário -->
      <div class="post-header">
        <img class="avatar" src="https://picsum.photos" alt="Foto de Perfil">
        <div class="user-info">
          <span class="username">Amanda Silva</span>
          <span class="post-time">Há 2 horas</span>
        </div>
      </div>

      <!-- Texto da publicação -->
      <div class="post-content">
        Belo dia para caminhar no parque e registrar essa paisagem incrível! 🌳☀️ #natureza #fotografia
      </div>

      <!-- Imagem do post -->
      <img class="post-image" src="https://picsum.photos" alt="Imagem da publicação">

      <!-- Botões de ação -->
      <div class="post-actions">
        <button class="action-btn">👍 Curtir</button>
        <button class="action-btn">💬 Comentar</button>
        <button class="action-btn">🔄 Compartilhar</button>
      </div>
    </article>

    <!-- POST 2: Publicação apenas com Texto -->
    <article class="post-card">
      <div class="post-header">
        <img class="avatar" src="https://picsum.photos" alt="Foto de Perfil">
        <div class="user-info">
          <span class="username">Carlos Eduardo</span>
          <span class="post-time">Há 5 horas</span>
        </div>
      </div>

      <div class="post-content">
        Acabei de finalizar a primeira etapa do meu novo projeto de desenvolvimento web usando HTML e CSS puro. Muito feliz com o progresso! 💻🚀
      </div>

      <div class="post-actions">
        <button class="action-btn">👍 Curtir</button>
        <button class="action-btn">💬 Comentar</button>
        <button class="action-btn">🔄 Compartilhar</button>
      </div>
    </article>

  </div>

</body>
</html>$0
