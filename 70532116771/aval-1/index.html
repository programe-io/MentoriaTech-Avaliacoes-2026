<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Cadastro de Produtos</title> <link rel="stylesheet" href="style.css"> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head> <body>
<header>
    <h1>📦 Cadastro de Produtos</h1>
    <p>Gerencie seus produtos</p>
</header>

<main class="container">

    <!-- CADASTRO -->
    <section class="card">
        <h2>Cadastrar Produto</h2>

        <form id="formProduto">

            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" placeholder="Ex: Arroz 5kg">

            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" placeholder="Ex: 10">

            <label for="valor">Valor</label>
            <input type="number" id="valor" step="0.01" placeholder="Ex: 25.90">

            <button type="submit">Cadastrar Produto</button>

        </form>

        <p id="mensagem"></p>
    </section>


    <!-- LISTA -->
    <section class="card">

        <h2>Produtos Cadastrados</h2>

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                </tr>
            </thead>

            <tbody id="listaProdutos">
            </tbody>
        </table>

    </section>


    <!-- ATUALIZAR VALOR -->
    <section class="card">

        <h2>Atualizar Valor</h2>

        <label for="codigoValor">Código do Produto</label>
        <input type="number" id="codigoValor">

        <label for="novoValor">Novo Valor</label>
        <input type="number" id="novoValor" step="0.01">

        <button id="btnAtualizarValor">
            Atualizar Valor
        </button>

    </section>


    <!-- ATUALIZAR QUANTIDADE -->
    <section class="card">

        <h2>Atualizar Quantidade</h2>

        <label for="codigoQuantidade">Código do Produto</label>
        <input type="number" id="codigoQuantidade">

        <label for="novaQuantidade">Quantidade a adicionar</label>
        <input type="number" id="novaQuantidade">

        <button id="btnAtualizarQuantidade">
            Adicionar Quantidade
        </button>

    </section>

</main>

<footer>
    Sistema de Cadastro de Produtos
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body> </html>
