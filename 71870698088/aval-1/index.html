<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto CRUD e Estoque</title>
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <header>
        <h1>Controle de Estoque (CRUD)</h1>
        <p>Painel Administrativo de Produtos</p>
    </header>

    <!-- FORMULÁRIO DE CADASTRO / ATUALIZAÇÃO -->
    <div class="card">
        <h2 id="form-title">Cadastrar Novo Produto</h2>
        <form id="product-form">
            <!-- Campo oculto para armazenar o ID quando for editar -->
            <input type="hidden" id="product-id">
            
            <div class="grid-inputs">
                <div class="form-group">
                    <label for="desc">Descrição do Produto</label>
                    <input type="text" id="desc" placeholder="Ex: Teclado Mecânico">
                    <span class="error-msg" id="err-desc">Descrição inválida.</span>
                </div>
                
                <div class="form-group">
                    <label for="qtd">Quantidade</label>
                    <input type="number" id="qtd" min="0" placeholder="Ex: 10">
                    <span class="error-msg" id="err-qtd">Quantidade inválida.</span>
                </div>
                
                <div class="form-group">
                    <label for="val">Valor Unitário (R$)</label>
                    <input type="number" id="val" step="0.01" min="0.01" placeholder="Ex: 199.90">
                    <span class="error-msg" id="err-val">Valor inválido.</span>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-success" id="btn-save">Salvar Produto</button>
                <button type="button" class="btn btn-secondary" id="btn-cancel">Cancelar</button>
            </div>
        </form>
    </div>

    <!-- BOX DE BUSCA E FILTROS -->
    <div class="card">
        <h2>Buscar no Inventário</h2>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Digite o ID do produto ou o nome...">
            <button class="btn btn-primary" onclick="buscarProduto()">Buscar</button>
            <button class="btn btn-secondary" onclick="limparBusca()">Limpar</button>
        </div>
    </div>

    <!-- TABELA DE EXIBIÇÃO DO ESTOQUE -->
    <div class="card">
        <h2>Produtos em Estoque</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Código (ID)</th>
                        <th>Descrição</th>
                        <th>Qtd.</th>
                        <th>Valor (R$)</th>
                        <th>Total (R$)</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="product-list">
                    <!-- JavaScript insere as linhas aqui -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Link para o arquivo Javascript se for separar depois -->
<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
