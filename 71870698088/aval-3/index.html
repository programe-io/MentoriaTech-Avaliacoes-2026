<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Projeto - Gerenciador de Tarefas</h1>
        
        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2>Cadastrar Nova Tarefa</h2>
            <div class="form-group">
                <input type="text" id="tituloTarefa" placeholder="Digite o título da tarefa...">
                <button onclick="cadastrarTarefa()">Adicionar</button>
            </div>
            <p id="mensagemErro" class="error"></p>
        </div>

        <!-- Busca de Tarefas -->
        <div class="card">
            <h2>Buscar Tarefa (por ID)</h2>
            <div class="form-group">
                <input type="number" id="buscaId" placeholder="Digite o ID da tarefa...">
                <button onclick="buscarTarefa()">Buscar</button>
            </div>
            <div id="resultadoBusca"></div>
        </div>

        <!-- Listagem de Tarefas -->
        <div class="card">
            <h2>Lista de Tarefas</h2>
            <ul id="listaTarefas">
                <!-- As tarefas serão inseridas aqui via JavaScript -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
