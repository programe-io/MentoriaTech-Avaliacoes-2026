
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
    <h1>Tabela de IMC</h1>

    <form id="form">
        <input id="nome" placeholder="Nome" required>
        <input id="peso" type="number" step="0.1" min="1" placeholder="Peso (kg)" required>
        <input id="altura" type="number" step="0.01" min="0.1" placeholder="Altura (m)" required>
        <button type="submit">Calcular IMC</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Peso</th>
                <th>Altura</th>
                <th>IMC</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
