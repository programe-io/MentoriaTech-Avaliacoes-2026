
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
    <h1>Sistema de Estoque</h1>

    <form id="form">
        <input id="codigo" placeholder="Código" required>
        <input id="descricao" placeholder="Descrição" required>
        <input id="quantidade" type="number" min="0" placeholder="Quantidade" required>
        <input id="valor" type="number" min="0" step="0.01" placeholder="Valor" required>
        <button>Cadastrar</button>
    </form>

    <h2>Produtos cadastrados</h2>
    <table>
        <thead>
            <tr>
                <th>Código</th><th>Descrição</th>
                <th>Quantidade</th><th>Valor</th><th>Ações</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
