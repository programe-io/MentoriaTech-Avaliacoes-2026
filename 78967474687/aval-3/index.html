
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Instagram Clone</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>Instagram</h1>
                                    <input type="text" placeholder="Pesquisar">
                                            <div class="icones">🏠 ❤️ 👤</div>
                                                </header>

                                                    <main>

                                                            <section class="stories">
                                                                        <div class="story">
                                                                                        <img src="https://i.pravatar.cc/100?img=12">
                                                                                                        <p>Seu story</p>
                                                                                                                    </div>

                                                                                                                                <div class="story">
                                                                                                                                                <img src="https://i.pravatar.cc/100?img=5">
                                                                                                                                                                <p>Maria</p>
                                                                                                                                                                            </div>

                                                                                                                                                                                        <div class="story">
                                                                                                                                                                                                        <img src="https://i.pravatar.cc/100?img=8">
                                                                                                                                                                                                                        <p>Pedro</p>
                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                <div class="story">
                                                                                                                                                                                                                                                                <img src="https://i.pravatar.cc/100?img=9">
                                                                                                                                                                                                                                                                                <p>Ana</p>
                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                            <section class="criar-post">
                                                                                                                                                                                                                                                                                                                        <h2>Nova publicação</h2>
                                                                                                                                                                                                                                                                                                                                    <input type="text" id="nome" placeholder="Seu nome">
                                                                                                                                                                                                                                                                                                                                                <textarea id="mensagem" placeholder="Escreva uma legenda..."></textarea>
                                                                                                                                                                                                                                                                                                                                                            <input type="url" id="imagem" placeholder="Link da imagem (opcional)">
                                                                                                                                                                                                                                                                                                                                                                        <button onclick="publicar()">Compartilhar</button>
                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                        <section id="feed">

                                                                                                                                                                                                                                                                                                                                                                                                    <article class="post">
                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="usuario">
                                                                                                                                                                                                                                                                                                                                                                                                                                        <img src="https://i.pravatar.cc/100?img=12">
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <strong>Jhuan Kennedy</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <img class="foto-post"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            src="https://picsum.photos/600/400?random=30">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="acoes">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="curtir(this)">❤️ <span>12</span></button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="mostrarComentario(this)">💬</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button>📤</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p><strong>Jhuan Kennedy</strong> Aproveitando a vida! ✨</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="comentarios"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="campo-comentario">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" placeholder="Adicione um comentário...">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="comentar(this)">Enviar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </article>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <article class="post">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="usuario">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <img src="https://i.pravatar.cc/100?img=5">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <strong>Maria Silva</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <img class="foto-post"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                src="https://picsum.photos/600/400?random=31">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="acoes">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="curtir(this)">❤️ <span>25</span></button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="mostrarComentario(this)">💬</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button>📤</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p><strong>Maria Silva</strong> Um dia especial! ❤️</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="comentarios"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="campo-comentario">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" placeholder="Adicione um comentário...">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="comentar(this)">Enviar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </article>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>Instagram Clone - Projeto escolar 2026</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
