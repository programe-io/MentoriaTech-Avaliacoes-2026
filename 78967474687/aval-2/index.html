
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mini Feed</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>
                <body>

                <header>
                    <h1>Meu Feed</h1>
                        <p>Compartilhe seus melhores momentos!</p>
                        </header>

                        <main>

                            <section class="perfil">
                                    <div class="foto">👤</div>
                                            <div>
                                                        <h2>Meu Perfil</h2>
                                                                    <p>Bem-vindo ao meu mini feed!</p>
                                                                            </div>
                                                                                </section>

                                                                                    <section class="criar">
                                                                                            <h2>Criar publicação</h2>

                                                                                                    <input type="text" id="nome" placeholder="Seu nome">

                                                                                                            <textarea id="mensagem"
                                                                                                                    placeholder="O que você está pensando?"></textarea>

                                                                                                                            <button onclick="publicar()">Publicar</button>
                                                                                                                                </section>

                                                                                                                                    <h2>Publicações</h2>

                                                                                                                                        <section id="feed">

                                                                                                                                                <article class="post">
                                                                                                                                                            <h3>Jhuan Kennedy</h3>
                                                                                                                                                                        <p>Aproveitando os bons momentos! ❤️</p>
                                                                                                                                                                                    <img src="https://picsum.photos/500/300?random=20">
                                                                                                                                                                                                <button onclick="curtir(this)">
                                                                                                                                                                                                                ❤️ Curtir <span>0</span>
                                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                                        <p>Comentários: Que momento incrível!</p>
                                                                                                                                                                                                                                                </article>

                                                                                                                                                                                                                                                        <article class="post">
                                                                                                                                                                                                                                                                    <h3>Maria</h3>
                                                                                                                                                                                                                                                                                <p>Um dia especial! ✨</p>
                                                                                                                                                                                                                                                                                            <img src="https://picsum.photos/500/300?random=21">
                                                                                                                                                                                                                                                                                                        <button onclick="curtir(this)">
                                                                                                                                                                                                                                                                                                                        ❤️ Curtir <span>0</span>
                                                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                                                <p>Comentários: Muito lindo!</p>
                                                                                                                                                                                                                                                                                                                                                        </article>

                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                            <footer>
                                                                                                                                                                                                                                                                                                                                                                <p>© 2026 - Meu Mini Feed</p>
                                                                                                                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                </html>
