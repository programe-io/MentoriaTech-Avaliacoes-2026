<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas - Mentoria Tech</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones via FontAwesome para o lixeira e check -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-list-check"></i> Meu Gerenciador</h1>
            <p>Organize suas tarefas do dia a dia com facilidade</p>
        </header>

        <div class="form-task">
            <input type="text" id="input-tarefa" placeholder="Digite uma nova tarefa..." autocomplete="off">
            <button id="btn-adicionar"><i class="fa-solid fa-plus"></i> Adicionar</button>
        </div>

        <div class="tasks-container">
            <ul id="lista-tarefas">
                <!-- As tarefas inseridas via JS aparecerão aqui -->
            </ul>
        </div>
        
        <footer>
            <span id="contador-tarefas">Nenhuma tarefa pendente</span>
        </footer>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
