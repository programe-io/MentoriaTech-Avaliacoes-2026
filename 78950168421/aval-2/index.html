<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed Social</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Barra Superior -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">face<span>mini</span></div>
      <div class="user-badge">
        <img src="https://i.pravatar.cc/150?img=11" alt="Avatar">
        <span>Você</span>
      </div>
    </div>
  </header>

  <!-- Container Central do Feed -->
  <main class="feed-container">

    <!-- Caixa de Criar Nova Publicação -->
    <section class="create-post-card">
      <div class="create-top">
        <img src="https://i.pravatar.cc/150?img=11" alt="Seu avatar" class="avatar">
        <textarea id="post-text" rows="2" placeholder="No que você está pensando hoje?"></textarea>
      </div>
      
      <input type="url" id="post-image" placeholder="URL de uma imagem (opcional)">
      
      <div class="create-actions">
        <button id="publish-btn" class="btn-primary">Publicar</button>
      </div>
    </section>

    <!-- Lista de Postagens -->
    <section id="feed-list" class="feed-list">
      <!-- Os posts serão renderizados via JavaScript -->
    </section>

  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
