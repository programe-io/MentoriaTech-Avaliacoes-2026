<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram • Juan_244_Rei/delas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Barra Superior -->
  <header class="topbar">
    <div class="topbar-content">
      <div class="logo">Instagram</div>
      <div class="topbar-actions">
        <button id="new-post-btn" class="icon-btn" title="Nova publicação">➕</button>
        <button id="theme-toggle" class="icon-btn" title="Alternar tema">🌙</button>
        <span class="active-user">@Juan_244_Rei/delas</span>
      </div>
    </div>
  </header>

  <!-- Container Principal -->
  <main class="main-container">
    
    <!-- Barra de Stories -->
    <section class="stories-bar" id="stories-bar">
      <!-- Stories renderizados via JavaScript -->
    </section>

    <!-- Feed de Publicações -->
    <section class="feed" id="feed-container">
      <!-- Posts renderizados via JavaScript -->
    </section>

  </main>

  <!-- Modal para Nova Publicação -->
  <div class="modal-overlay" id="post-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Criar nova publicação</h3>
        <button id="close-modal" class="close-btn">&times;</button>
      </div>
      <form id="new-post-form">
        <input type="url" id="img-url" placeholder="Cole a URL da imagem aqui..." required>
        <input type="text" id="post-location" placeholder="Localização (ex: Rio de Janeiro, Brasil)">
        <textarea id="post-caption" rows="3" placeholder="Escreva uma legenda..."></textarea>
        <button type="submit" class="btn-submit">Compartilhar</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
