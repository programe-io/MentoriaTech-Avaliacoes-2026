<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="app">

        <header>
            <h1>Task Manager</h1>
            <p>Organize suas tarefas</p>
        </header>

        <div class="entrada">
            <input type="text" id="titulo" placeholder="Nome da tarefa">

            <select id="prioridade">
                <option value="1">Prioridade alta</option>
                <option value="2">Prioridade média</option>
                <option value="3">Prioridade baixa</option>
            </select>

            <button onclick="criarTarefa()">+ Adicionar</button>
        </div>

        <h2>Tarefas</h2>

        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
