
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <h1>Sistema de Estoque</h1>
        <p>Gerenciamento de produtos</p>

        <h2>Cadastrar Produto</h2>

        <input type="text" id="codigo" placeholder="Código">
        <input type="text" id="descricao" placeholder="Descrição">
        <input type="number" id="quantidade" placeholder="Quantidade" min="0">
        <input type="number" id="valor" placeholder="Valor" min="0" step="0.01">

        <button id="btnCadastrar">Cadastrar Produto</button>

        <h2>Alterar Produto</h2>

        <input type="text" id="codigoAlterar" placeholder="Código do produto">
        <input type="number" id="novoValor" placeholder="Novo valor" min="0" step="0.01">

        <button id="btnValor">Alterar Valor</button>

        <input type="number" id="novaQuantidade" placeholder="Nova quantidade" min="0">

        <button id="btnQuantidade">Alterar Quantidade</button>

        <h2>Produtos Cadastrados</h2>

        <button id="btnListar">Listar Produtos</button>

        <div id="listaProdutos"></div>
    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
