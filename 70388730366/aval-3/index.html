<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>
    <main class="app-card">
        <header class="app-header">
            <i class="fa-solid fa-list-check logo-icon"></i>
            <h1>Gerenciador de Tarefas</h1>
            <p>Renderização dinâmica com JavaScript</p>
        </header>

        <!-- Formulário de cadastro de tarefas -->
        <form id="form-tarefa" class="task-form">
            <div class="input-group">
                <input type="text" id="input-titulo" placeholder="O que você precisa fazer hoje?" autocomplete="off" required>
                <button type="submit" id="btn-adicionar">
                    <i class="fa-solid fa-plus"></i> Adicionar
                </button>
            </div>
        </form>

        <!-- Lista de tarefas no HTML (Container visual) -->
        <section class="task-section">
            <ul id="lista-tarefas" class="task-list"></ul>
        </section>
    </main>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
