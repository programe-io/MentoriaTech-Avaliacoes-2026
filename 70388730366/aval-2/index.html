<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <h1>Gerenciador de Tarefas</h1>


    <!-- Formulário de Cadastro -->
    <section class="card">
      <h2>Nova Tarefa</h2>
      <form id="form-tarefa">
        <div class="form-group">
          <label for="codigo">Código</label>
          <input type="text" id="codigo" placeholder="Ex: TSK-01" required>
        </div>
        <div class="form-group">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" placeholder="Descrição da tarefa..." required>
        </div>
        <div class="form-group">
          <label for="prioridade">Prioridade</label>
          <select id="prioridade">
            <option value="Baixa">Baixa</option>
            <option value="Média" selected>Média</option>
            <option value="Alta">Alta</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Cadastrar</button>
      </form>
    </section>


    <!-- Lista de Tarefas -->
    <section class="card">
      <div class="header-lista">
        <h2>Tarefas Cadastradas</h2>
        <div class="filtro-group">
          <label for="filtro-prioridade">Filtrar por Prioridade:</label>
          <select id="filtro-prioridade">
            <option value="Todas">Todas</option>
            <option value="Alta">Alta</option>
            <option value="Média">Média</option>
            <option value="Baixa">Baixa</option>
          </select>
        </div>
      </div>


      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Status</th>
              <th>Código</th>
              <th>Título</th>
              <th>Prioridade Atual</th>
              <th>Alterar Prioridade</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-tarefas"></tbody>
        </table>
      </div>
    </section>
  </div>


  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
