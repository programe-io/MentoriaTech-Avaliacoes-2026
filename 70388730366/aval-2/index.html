<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h1>Gerenciador de Tarefas</h1>

    <!-- Formularos -->
    <div class="form-group">
      <input type="text" id="taskTitle" placeholder="Título da tarefa (mín. 5 caracteres)">
      <select id="taskPriority">
        <option value="1">1 - Alta Prioridade</option>
        <option value="2" selected>2 - Média Prioridade</option>
        <option value="3">3 - Baixa Prioridade</option>
      </select>
      <button onclick="cadastrarTarefa()">Adicionar Tarefa</button>
    </div>
    
    <div id="errorMsg" class="error-msg"></div>

    <!-- Tabela de Tarefas -->
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Título</th>
          <th>Prioridade</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="taskList">
        <!-- Renderizado dinamicamente pelo JavaScript -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
