<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Minha Página Web</title>
                <style>
                        body {
                                    font-family: Arial, sans-serif;
                                                background-color: #f4f4f9;
                                                            color: #333;
                                                                        margin: 0;
                                                                                    padding: 0;
                                                                                                display: flex;
                                                                                                            flex-direction: column;
                                                                                                                        align-items: center;
                                                                                                                                    justify-content: center;
                                                                                                                                                min-height: 100vh;
                                                                                                                                                        }
                                                                                                                                                                header {
                                                                                                                                                                            background-color: #4A90E2;
                                                                                                                                                                                        color: white;
                                                                                                                                                                                                    padding: 20px;
                                                                                                                                                                                                                width: 100%;
                                                                                                                                                                                                                            text-align: center;
                                                                                                                                                                                                                                        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                        main {
                                                                                                                                                                                                                                                                    background: white;
                                                                                                                                                                                                                                                                                padding: 30px;
                                                                                                                                                                                                                                                                                            margin-top: 20px;
                                                                                                                                                                                                                                                                                                        border-radius: 8px;
                                                                                                                                                                                                                                                                                                                    box-shadow: 0 4px 8px rgba(0,0,0,0.05);
                                                                                                                                                                                                                                                                                                                                max-width: 500px;
                                                                                                                                                                                                                                                                                                                                            width: 90%;
                                                                                                                                                                                                                                                                                                                                                        text-align: center;
                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                        button {
                                                                                                                                                                                                                                                                                                                                                                                    background-color: #2ECC71;
                                                                                                                                                                                                                                                                                                                                                                                                color: white;
                                                                                                                                                                                                                                                                                                                                                                                                            border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                        padding: 12px 24px;
                                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                border-radius: 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        transition: background 0.3s;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        button:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    background-color: #27AE60;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h1>Bem-vindo ao Meu Site!</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <main>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>Estrutura Básica de HTML</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Este é um parágrafo de exemplo demonstrando como criar uma interface limpa utilizando tags semânticas do HTML5 e estilos CSS embutidos.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="alert('Incrível! Você clicou no botão.')">Clique Aqui</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
