<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed de Publicações</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="feed-container">

    <!-- Caixa para Criar Publicação -->
    <div class="card create-post">
      <h2>Novo Post</h2>
      <textarea id="postContent" placeholder="Compartilhe algo com a sua rede..."></textarea>
      <div class="create-post-footer">
        <button id="btnPublish">Publicar</button>
      </div>
    </div>

    <!-- Lista do Feed -->
    <main id="feedList">

      <!-- Post de Exemplo -->
      <article class="card post">
        <header class="post-header">
          <img src="https://picsum.photos/45/45?random=1" alt="Avatar" class="avatar">
          <div class="author-details">
            <strong>Lucas Mendes</strong>
            <span class="timestamp">Há 15 minutos</span>
          </div>
        </header>

        <p class="post-text">
          Construindo componentes de interface responsivos e dinâmicos com HTML, CSS e JavaScript puro! 🚀💻
        </p>

        <div class="post-actions">
          <button class="action-btn btn-like">
            <span class="icon">❤️</span> 
            <span class="like-count">0</span>
          </button>
          <button class="action-btn btn-share">
            <span class="icon">🔗</span> Compartilhar
          </button>
        </div>
      </article>

    </main>

  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>$0
