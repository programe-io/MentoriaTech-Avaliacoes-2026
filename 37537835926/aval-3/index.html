<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <h1>Prática - Tabela de IMC</h1>

        <section class="formulario">

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Digite o nome">
            </div>

            <div class="campo">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" step="0.1" min="1" placeholder="Ex: 72">
            </div>

            <div class="campo">
                <label for="altura">Altura (m)</label>
                <input type="number" id="altura" step="0.01" min="0.5" placeholder="Ex: 1.65">
            </div>

            <button id="btnAdicionar">Adicionar pessoa</button>

        </section>

        <section class="tabela-container">

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Peso</th>
                        <th>Altura</th>
                        <th>IMC</th>
                        <th>Situação</th>
                    </tr>
                </thead>

                <tbody id="tabelaPessoas">
                    <!-- Os dados serão inseridos pelo JavaScript -->
                </tbody>
            </table>

        </section>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
