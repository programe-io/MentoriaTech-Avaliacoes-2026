<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Produtos</title>
    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Gerenciador de Produtos</h1>

        <!-- Formulário de Cadastro -->
        <section class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-cadastrar">
                <div class="input-group">
                    <label for="descricao">Descrição (mín. 5 caracteres):</label>
                    <input type="text" id="descricao" required minlength="5">
                </div>
                <div class="input-group">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" required min="1" value="1">
                </div>
                <div class="input-group">
                    <label for="valor">Valor (R$):</label>
                    <input type="number" id="valor" required min="0" step="0.01" value="0">
                </div>
                <button type="submit">Cadastrar Produto</button>
            </form>
            <p id="mensagem-erro" class="erro"></p>
        </section>

        <!-- Listagem de Produtos -->
        <section class="card">
            <h2>Lista de Produtos</h2>
            <div id="lista-produtos" class="tabela-container">
                <!-- Os produtos serão injetados aqui via JavaScript -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
