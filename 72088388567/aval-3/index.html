<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação de Estilos com JS</title>
    <!-- Link para o arquivo CSS externo (Item 8) -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <h1>Painel de Situações de Alunos</h1>
        
        <!-- Botão global para alternar o tema da página -->
        <button id="btn-tema" class="btn">Alternar Tema Escuro</button>

        <!-- Tabela de Situações (Item 9) -->
        <table class="tabela-alunos">
            <thead>
                <tr>
                    <th>Aluno</th>
                    <th>Nota Final</th>
                    <th>Situação</th>
                </tr>
            </thead>
            <tbody>
                <!-- Classes 'linha-aluno' usadas para seleção múltipla (Item 10) -->
                <tr class="linha-aluno">
                    <td>Ana Silva</td>
                    <td class="nota">8.5</td>
                    <td class="situacao">Pendente</td>
                </tr>
                <tr class="linha-aluno">
                    <td>Bruno Costa</td>
                    <td class="nota">4.2</td>
                    <td class="situacao">Pendente</td>
                </tr>
                <tr class="linha-aluno">
                    <td>Carlos Souza</td>
                    <td class="nota">7.0</td>
                    <td class="situacao">Pendente</td>
                </tr>
                <tr class="linha-aluno">
                    <td>Diana Lima</td>
                    <td class="nota">5.8</td>
                    <td class="situacao">Pendente</td>
                </tr>
            </tbody>
        </table>

        <!-- Botão para acionar a verificação via JS -->
        <button id="btn-verificar" class="btn-principal">Avaliar Situações</button>
    </main>

    <!-- Link para o arquivo JavaScript externo -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
