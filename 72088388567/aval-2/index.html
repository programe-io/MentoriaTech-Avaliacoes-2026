<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <h1>Gerenciador de Tarefas</h1>
        
        <!-- Formulário de Cadastro (Itens 5 e 6 do Sumário) -->
        <form id="form-tarefa" class="form-container">
            <div class="input-group">
                <label for="titulo">Título da Tarefa:</label>
                <input type="text" id="titulo" placeholder="Digite o título da tarefa..." required>
            </div>
            
            <div class="input-group">
                <label for="prioridade">Prioridade:</label>
                <select id="prioridade">
                    <option value="Baixa">Baixa</option>
                    <option value="Média" selected>Média</option>
                    <option value="Alta">Alta</option>
                </select>
            </div>
            
            <button type="submit" class="btn-adicionar">Adicionar Tarefa</button>
        </form>

        <!-- Barra de Busca (Item 9 do Sumário) -->
        <div class="busca-container">
            <input type="text" id="input-busca" placeholder="Buscar tarefa por ID ou título...">
            <button id="btn-busca" class="btn-secundario">Buscar</button>
        </div>

        <!-- Listagem das Tarefas (Item 8 do Sumário) -->
        <section class="lista-container">
            <h2>Suas Tarefas</h2>
            <ul id="lista-tarefas">
                <!-- As tarefas serão inseridas aqui dinamicamente pelo JavaScript -->
            </ul>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
