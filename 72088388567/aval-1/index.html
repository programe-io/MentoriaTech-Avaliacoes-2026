<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto CRUD e Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Gerenciamento de Estoque</h1>

        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2>Cadastrar Produto</h2>
            <div class="form-group">
                <label for="desc">Descrição:</label>
                <input type="text" id="desc" placeholder="Ex: Teclado Mecânico">
            </div>
            <div class="form-group">
                <label for="qtd">Quantidade:</label>
                <input type="number" id="qtd" placeholder="Ex: 10">
            </div>
            <div class="form-group">
                <label for="valor">Valor (R$):</label>
                <input type="number" step="0.01" id="valor" placeholder="Ex: 150.00">
            </div>
            <button onclick="acaoCadastrar()">Cadastrar Produto</button>
            <p id="msg-erro" class="error"></p>
        </div>

        <!-- Listagem de Produtos -->
        <div class="card">
            <h2>Produtos em Estoque</h2>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-produtos">
                    <!-- Inserido via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script href="script.js" src="script.js"></script>
<script src="script.js"></script></body>
</html>
