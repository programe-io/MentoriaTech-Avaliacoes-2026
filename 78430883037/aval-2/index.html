<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Runner Ultimate 2.0</title>

<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<canvas id="bg"></canvas>
<canvas id="game"></canvas>

<div id="hud">
    <div>⭐ Score: <span id="score">0</span></div>
    <div>🪙 Coins: <span id="coins">0</span></div>
    <div>⚡ Level: <span id="level">1</span></div>
    <div>❤️ Lives: <span id="lives">3</span></div>
    <div>🔥 Combo: <span id="combo">0</span></div>
    <div>🚀 Speed: <span id="speed">8</span></div>
    <div>✨ Power: <span id="power">Nenhum</span></div>
</div>

<div id="menu">

    <div class="card">

        <h1>⚡ NEON RUNNER ULTIMATE ⚡</h1>

        <div class="group">
            <label>Cor do Jogador</label>
            <input type="color" id="playerColor" value="#00ffff">
        </div>

        <div class="group">
            <label>Forma</label>

            <select id="playerShape">
                <option value="square">Quadrado</option>
                <option value="circle">Círculo</option>
                <option value="triangle">Triângulo</option>
                <option value="diamond">Diamante</option>
            </select>
        </div>

        <div class="group">
            <label>Tema</label>

            <select id="theme">
                <option value="neon">Neon</option>
                <option value="space">Espaço</option>
                <option value="cyber">Cyberpunk</option>
                <option value="lava">Lava</option>
            </select>
        </div>

        <button id="startBtn">
            JOGAR
        </button>

        <p class="help">
            ← → Trocar pista<br>
            ↑ ou Espaço para pular
        </p>

    </div>

</div>

<div id="gameOver">

    <div class="card">

        <h1>GAME OVER</h1>

        <p>
            Score:
            <span id="finalScore">0</span>
        </p>

        <p>
            Coins:
            <span id="finalCoins">0</span>
        </p>

        <button onclick="location.reload()">
            Jogar Novamente
        </button>

    </div>

</div>

<script src="game.js"></script>
<header> </header> <nav> </nav> <a> </a> <aside> </aside> <h3> </h3>
<main> </main> <article> </article> <img> </img> <footer> </footer>
<script src="script.js"></script></body>
</html>
