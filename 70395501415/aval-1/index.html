<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Sistema de Estoque</h1>

    <section>
        <h2>Cadastrar Produto</h2>

        <form id="formProduto">
            <input type="text" id="descricao" placeholder="Descrição do produto" required>
            <input type="number" id="quantidade" placeholder="Quantidade" min="1" required>
            <input type="number" id="valor" placeholder="Valor" min="0" step="0.01" required>

            <button type="submit">Cadastrar</button>
        </form>
    </section>

    <section>
        <h2>Produtos Cadastrados</h2>

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                </tr>
            </thead>

            <tbody id="listaProdutos"></tbody>
        </table>
    </section>

    <section>
        <h2>Alterar Valor</h2>

        <input type="number" id="codigoValor" placeholder="Código do produto">
        <input type="number" id="novoValor" placeholder="Novo valor" min="0" step="0.01">

        <button onclick="alterarValor()">Alterar Valor</button>
    </section>

    <section>
        <h2>Alterar Quantidade</h2>

        <input type="number" id="codigoQuantidade" placeholder="Código do produto">
        <input type="number" id="novaQuantidade" placeholder="Quantidade a adicionar" min="1">

        <button onclick="alterarQuantidade()">Adicionar Quantidade</button>
    </section>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
