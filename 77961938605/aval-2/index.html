
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>

        <section class="new-post">
            <div class="user">
                <div class="avatar">L</div>

                <div>
                    <strong>craquewill</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>

            <button>Publicar</button>
        </section>
        <article class="post">

            <div class="post-header">
                <div class="avatar">A</div>

                <div>
                    <strong>Ana Carolina</strong>
                    <span>Há 5 minutos</span>
                </div>
            </div>

            <div class="post-text">
                <p>
                    Que lugar lindo! Já quero voltar 😍🌴
                </p>
            </div>

            <img
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1000"
                alt="Paisagem com lago e montanhas"
                class="post-image"
            >

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>
        <article class="post">

            <div class="post-header">
                <div class="avatar">R</div>

                <div>
                    <strong>Rafael Costa</strong>
                    <span>Há 20 minutos</span>
                </div>
            </div>

            <div class="post-text">
                <p>
                    Mais um projetinho finalizado! 🚀💻
                </p>
            </div>

            <img
                src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1000"
                alt="Computador em uma mesa de trabalho"
                class="post-image"
            >

            <div class="post-actions">
                <button>curtir</button>
                <button>comentar</button>
            </div>

        </article>

        <article class="post">

            <div class="post-header">
                <div class="avatar">M</div>

                <div>
                    <strong>Mariana Souza</strong>
                    <span>Há 45 minutos</span>
                </div>
            </div>

            <div class="post-text">
                <p>
                    Cafézinho e paz. Tem coisa melhor? ☕❤️
                </p>
            </div>

            <img
                src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1000"
                alt="Xícara de café sobre uma mesa"
                class="post-image"
            >

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>

    </main>

</body>
</html>
