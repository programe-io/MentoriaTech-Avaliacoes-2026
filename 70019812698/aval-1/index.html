<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Arena Online</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }

    canvas {
      display: block;
      background: #1b1b1b;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 18px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 8px;
    }
  </style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div id="hud">
  VIDA: <span id="vida">100</span><br>
  INIMIGOS: <span id="inimigos">5</span>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const vidaTxt = document.getElementById("vida");
const inimigosTxt = document.getElementById("inimigos");

const player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  size: 25,
  color: "cyan",
  speed: 5,
  vida: 100
};

const bullets = [];
const enemies = [];

for(let i = 0; i < 5; i++) {
  enemies.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: 25,
    color: "red",
    speed: 1.5
  });
}

const keys = {};

window.addEventListener("keydown", e => {
  keys[e.key] = true;
});

window.addEventListener("keyup", e => {
  keys[e.key] = false;
});

window.addEventListener("click", e => {
  const angle = Math.atan2(
    e.clientY - player.y,
    e.clientX - player.x
  );

  bullets.push({
    x: player.x,
    y: player.y,
    radius: 5,
    speed: 8,
    dx: Math.cos(angle),
    dy: Math.sin(angle)
  });
});

function movePlayer() {
  if(keys["w"]) player.y -= player.speed;
  if(keys["s"]) player.y += player.speed;
  if(keys["a"]) player.x -= player.speed;
  if(keys["d"]) player.x += player.speed;

  // limites
  if(player.x < 0) player.x = 0;
  if(player.y < 0) player.y = 0;
  if(player.x > canvas.width) player.x = canvas.width;
  if(player.y > canvas.height) player.y = canvas.height;
}

function updateBullets() {
  bullets.forEach((b, index) => {
    b.x += b.dx * b.speed;
    b.y += b.dy * b.speed;

    if(
      b.x < 0 || b.x > canvas.width ||
      b.y < 0 || b.y > canvas.height
    ) {
      bullets.splice(index, 1);
    }
  });
}

function updateEnemies() {
  enemies.forEach((enemy, eIndex) => {

    const angle = Math.atan2(
      player.y - enemy.y,
      player.x - enemy.x
    );

    enemy.x += Math.cos(angle) * enemy.speed;
    enemy.y += Math.sin(angle) * enemy.speed;

    // colisão com jogador
    const distPlayer = Math.hypot(
      player.x - enemy.x,
      player.y - enemy.y
    );

    if(distPlayer < player.size + enemy.size) {
      player.vida -= 1;
      vidaTxt.innerText = player.vida;

      if(player.vida <= 0) {
        alert("GAME OVER");
        location.reload();
      }
    }

    // colisão bala
    bullets.forEach((bullet, bIndex) => {
      const dist = Math.hypot(
        bullet.x - enemy.x,
        bullet.y - enemy.y
      );

      if(dist < enemy.size) {
        enemies.splice(eIndex, 1);
        bullets.splice(bIndex, 1);

        inimigosTxt.innerText = enemies.length;

        // novo inimigo
        enemies.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: 25,
          color: "red",
          speed: 1.5
        });

        inimigosTxt.innerText = enemies.length;
      }
    });
  });
}

function drawPlayer() {
  ctx.fillStyle = player.color;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
  ctx.fill();
}

function drawBullets() {
  ctx.fillStyle = "yellow";

  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawEnemies() {
  enemies.forEach(enemy => {
    ctx.fillStyle = enemy.color;

    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, enemy.size, 0, Math.PI * 2);
    ctx.fill();
  });
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  movePlayer();
  updateBullets();
  updateEnemies();

  drawPlayer();
  drawBullets();
  drawEnemies();

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

<script src="script.js"></script></body>
</html>
