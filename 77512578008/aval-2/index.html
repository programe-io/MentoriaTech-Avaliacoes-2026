<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topo">
  <div class="topo__interno">
    <a class="logo" href="#">mini<span>feed</span></a>
    <nav class="abas">
      <a href="#" class="aba aba--ativa">Início</a>
      <a href="#" class="aba">Perfil</a>
    </nav>
  </div>
</header>

<main class="layout">
  <section class="coluna">

    <form class="novo" id="formPost">
      <div class="avatar avatar--grande">L</div>
      <div class="novo__corpo">
        <label class="sr" for="texto">Escreva uma publicação</label>
        <textarea id="texto" maxlength="240" rows="2" placeholder="O que você está pensando, Luzinéia?"></textarea>
        <div class="novo__rodape">
          <span class="contador" id="contador">240</span>
          <button type="submit" class="btn btn--principal" id="btnPublicar" disabled>Publicar</button>
        </div>
      </div>
    </form>

    <div id="feed" class="feed" aria-live="polite">
      <article class="post" data-id="1">
        <div class="avatar">S</div>
        <div class="post__corpo">
          <header class="post__cab">
            <strong>Sávio Boiba</strong>
            <time class="tempo" data-min="20">há 20 minutos</time>
          </header>
          <p class="post__texto">Filme muito gostoso de assistir, com momentos emocionantes.</p>
          <img class="post__img" src="https://media.fstatic.com/UfUyt6uTpBRbxb6W5j6whIOvHF8=/350x525/smart/filters:format(webp)/media/movies/covers/2026/03/hp4LEEsgY9K6mBqKVsnpe8SrKFz.jpg" alt="Capa do filme">
          <div class="acoes">
            <button class="acao btn-curtir" aria-pressed="false">Curtir <b>0</b></button>
            <button class="acao btn-comentar" aria-expanded="false">Comentar <b>0</b></button>
          </div>
          <div class="comentarios" hidden>
            <ul class="lista-com"></ul>
            <form class="form-com">
              <input type="text" placeholder="Escreva um comentário" maxlength="120" aria-label="Comentário">
              <button class="btn btn--leve" type="submit">Enviar</button>
            </form>
          </div>
        </div>
      </article>
    </div>

    <p class="vazio" id="vazio" hidden>Nenhuma publicação por aqui. Escreva a primeira acima.</p>
  </section>

  <aside class="lateral">
    <div class="perfil">
      <div class="avatar avatar--grande">L</div>
      <h2>Luzinéia Boiba</h2>
      <dl>
        <div><dt>Publicações</dt><dd id="totalPosts">1</dd></div>
        <div><dt>Curtidas</dt><dd id="totalCurtidas">0</dd></div>
      </dl>
    </div>
  </aside>
</main>

<div class="aviso" id="aviso" role="status"></div>
<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
