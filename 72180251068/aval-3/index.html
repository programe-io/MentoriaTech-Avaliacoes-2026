
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 4px 12px #0002;
        }

        h1 {
            text-align: center;
            color: #2471a3;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2471a3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1a5276;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #eaf2f8;
            display: none;
            line-height: 1.6;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Controle de IMC</h1>

        <label>Nome do Paciente:</label>
        <input type="text" id="nome" placeholder="Digite seu nome">

        <label>Peso (kg):</label>
        <input type="number" id="peso" placeholder="Ex: 80" step="any">

        <label>Altura (m):</label>
        <input type="number" id="altura" placeholder="Ex: 1.80" step="any">

        <button onclick="calcularIMC()">Calcular IMC</button>

        <div id="resultado"></div>

    </div>

    <script>
        function calcularIMC() {

            let nome = document.getElementById("nome").value;
            let peso = parseFloat(document.getElementById("peso").value);
            let altura = parseFloat(document.getElementById("altura").value);

            if (nome.trim() === "" || !Number.isFinite(peso) ||
                !Number.isFinite(altura) || peso <= 0 || altura <= 0) {

                alert("Preencha todos os campos corretamente!");
                return;
            }

            // Cálculo do IMC
            let imc = peso / (altura * altura);

            let classificacao = "";

            // Classificação do IMC
            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            } else if (imc < 25) {
                classificacao = "Peso normal";
            } else if (imc < 30) {
                classificacao = "Sobrepeso";
            } else if (imc < 35) {
                classificacao = "Obesidade grau I";
            } else if (imc < 40) {
                classificacao = "Obesidade grau II";
            } else {
                classificacao = "Obesidade grau III";
            }

            // Exibir resultado
            let resultado = document.getElementById("resultado");

            resultado.style.display = "block";

            resultado.innerHTML = `
                <h3>Resultado do Paciente</h3>
                <strong>Nome:</strong> ${nome.replace(/[&<>"']/g, c => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;',
                    '"': '&quot;', "'": '&#39;'
                })[c])}<br>
                <strong>Peso:</strong> ${peso} kg<br>
                <strong>Altura:</strong> ${altura} m<br>
                <strong>IMC:</strong> ${imc.toFixed(2)}<br>
                <strong>Classificação:</strong> ${classificacao}
            `;
        }
    </script>

<script src="script.js"></script></body>
</html>
