
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <h1>Gerenciamento de Tarefas</h1>

    <h3>Cadastrar Nova Tarefa</h3>

    <input type="number" id="codigo" placeholder="Código">
    <input type="text" id="titulo" placeholder="Título da tarefa">
    <input type="number" id="prioridade" placeholder="Prioridade (1 a 3)">

    <button onclick="cadastrarTarefa()">Cadastrar Tarefa</button>

    <hr>

    <h3>Marcar Tarefa como Concluída</h3>

    <input type="number" id="codigoConcluir" placeholder="Código da tarefa">

    <button onclick="concluirTarefa()">Concluir Tarefa</button>

    <hr>

    <h3>Alterar Prioridade</h3>

    <input type="number" id="codigoAlterar" placeholder="Código da tarefa">
    <input type="number" id="novaPrioridade" placeholder="Nova prioridade (1 a 3)">

    <button onclick="alterarPrioridade()">Alterar Prioridade</button>

    <hr>

    <h3>Lista de Tarefas</h3>

    <button onclick="listarTarefas()">Listar Tarefas</button>

    <div id="listaTarefas"></div>

    <script>

        let tarefas = [];

        // CADASTRAR TAREFA
        function cadastrarTarefa() {

            let codigo = Number(document.getElementById("codigo").value);
            let titulo = document.getElementById("titulo").value;
            let prioridade = Number(document.getElementById("prioridade").value);

            if (!codigo || codigo <= 0) {
                alert("Digite um código válido!");
                return;
            }

            if (titulo.trim().length < 5) {
                alert("O título deve ter no mínimo 5 caracteres!");
                return;
            }

            if (!Number.isInteger(prioridade) || prioridade < 1 || prioridade > 3) {
                alert("A prioridade deve ser entre 1 e 3!");
                return;
            }

            if (tarefas.some(t => t.codigo === codigo)) {
                alert("Esse código já está cadastrado!");
                return;
            }

            let tarefa = {
                codigo: codigo,
                titulo: titulo.trim(),
                prioridade: prioridade,
                concluida: false
            };

            tarefas.push(tarefa);

            alert("Tarefa cadastrada com sucesso!");

            document.getElementById("codigo").value = "";
            document.getElementById("titulo").value = "";
            document.getElementById("prioridade").value = "";

            listarTarefas();
        }

        // LISTAR TAREFAS
        function listarTarefas() {

            let lista = document.getElementById("listaTarefas");

            lista.innerHTML = "";

            if (tarefas.length === 0) {
                lista.innerHTML = "<p>Nenhuma tarefa cadastrada.</p>";
                return;
            }

            tarefas.forEach(function(tarefa) {

                lista.innerHTML += `
                    <div>
                        <p><strong>Código:</strong> ${tarefa.codigo}</p>
                        <p><strong>Título:</strong> ${tarefa.titulo}</p>
                        <p><strong>Prioridade:</strong> ${tarefa.prioridade}
                        ${tarefa.prioridade === 1 ? "(Alta)" :
                          tarefa.prioridade === 2 ? "(Média)" : "(Baixa)"}</p>
                        <p><strong>Status:</strong>
                        ${tarefa.concluida ? "Concluída" : "Pendente"}</p>
                        <hr>
                    </div>
                `;

            });
        }

        // MARCAR TAREFA COMO CONCLUÍDA
        function concluirTarefa() {

            let codigo = Number(document.getElementById("codigoConcluir").value);

            let tarefa = tarefas.find(t => t.codigo === codigo);

            if (!tarefa) {
                alert("Tarefa não encontrada!");
                return;
            }

            tarefa.concluida = true;

            alert("Tarefa marcada como concluída!");

            document.getElementById("codigoConcluir").value = "";

            listarTarefas();
        }

        // ALTERAR PRIORIDADE
        function alterarPrioridade() {

            let codigo = Number(document.getElementById("codigoAlterar").value);
            let novaPrioridade = Number(document.getElementById("novaPrioridade").value);

            let tarefa = tarefas.find(t => t.codigo === codigo);

            if (!tarefa) {
                alert("Tarefa não encontrada!");
                return;
            }

            if (!Number.isInteger(novaPrioridade) ||
                novaPrioridade < 1 || novaPrioridade > 3) {

                alert("A prioridade deve ser entre 1 e 3!");
                return;
            }

            tarefa.prioridade = novaPrioridade;

            alert("Prioridade alterada com sucesso!");

            document.getElementById("codigoAlterar").value = "";
            document.getElementById("novaPrioridade").value = "";

            listarTarefas();
        }

    </script>

<script src="script.js"></script></body>
</html>
