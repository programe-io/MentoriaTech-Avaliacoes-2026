
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input, select, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input {
            width: 95%;
        }

        select {
            width: 100%;
        }

        button {
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
        }

        button:hover {
            background: #1d4ed8;
        }

        .tarefa {
            background: #eee;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
        }

        .concluida {
            background: #d1fae5;
        }

        .tarefa button {
            margin-right: 5px;
        }

        .excluir {
            background: #dc2626;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Gerenciador de Tarefas</h1>

    <h3>Cadastrar nova tarefa</h3>

    <input type="text" id="titulo"
        placeholder="Digite o título da tarefa">

    <select id="prioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="cadastrarTarefa()">
        Cadastrar Tarefa
    </button>

    <h3>Lista de tarefas</h3>

    <div id="listaTarefas"></div>

</div>

<script>

    let tarefas = [];
    let proximoCodigo = 1;

    // Cadastrar tarefa
    function cadastrarTarefa() {

        let titulo = document.getElementById("titulo").value.trim();
        let prioridade = Number(
            document.getElementById("prioridade").value
        );

        if (titulo.length < 5) {
            alert("O título deve ter no mínimo 5 caracteres!");
            return;
        }

        if (!Number.isInteger(prioridade) ||
            prioridade < 1 || prioridade > 3) {
            alert("A prioridade deve ser entre 1 e 3!");
            return;
        }

        let tarefa = {
            codigo: proximoCodigo,
            titulo: titulo,
            prioridade: prioridade,
            concluida: false
        };

        tarefas.push(tarefa);
        proximoCodigo++;

        document.getElementById("titulo").value = "";

        listarTarefas();

        alert("Tarefa cadastrada com sucesso!");
    }

    // Listar tarefas
    function listarTarefas() {

        let lista = document.getElementById("listaTarefas");

        lista.innerHTML = "";

        if (tarefas.length === 0) {
            lista.innerHTML = "<p>Nenhuma tarefa cadastrada.</p>";
            return;
        }

        tarefas.forEach(function(tarefa) {

            let div = document.createElement("div");

            div.className = tarefa.concluida
                ? "tarefa concluida"
                : "tarefa";

            div.innerHTML = `
                <strong>Código:</strong> ${tarefa.codigo}<br>
                <strong>Título:</strong> ${tarefa.titulo}<br>
                <strong>Prioridade:</strong> ${tarefa.prioridade}
                (${tarefa.prioridade == 1 ? "Alta" :
                  tarefa.prioridade == 2 ? "Média" : "Baixa"})<br>
                <strong>Status:</strong>
                ${tarefa.concluida ? "Concluída" : "Pendente"}
                <br><br>

                <button onclick="concluirTarefa(${tarefa.codigo})">
                    Concluir
                </button>

                <button onclick="alterarPrioridade(${tarefa.codigo})">
                    Alterar Prioridade
                </button>

                <button class="excluir"
                    onclick="excluirTarefa(${tarefa.codigo})">
                    Excluir
                </button>
            `;

            lista.appendChild(div);

        });
    }

    // Marcar tarefa como concluída
    function concluirTarefa(codigo) {

        let tarefa = tarefas.find(t => t.codigo === codigo);

        if (!tarefa) {
            alert("Tarefa não encontrada!");
            return;
        }

        tarefa.concluida = true;

        listarTarefas();

    }

    // Alterar prioridade
    function alterarPrioridade(codigo) {

        let tarefa = tarefas.find(t => t.codigo === codigo);

        if (!tarefa) {
            alert("Tarefa não encontrada!");
            return;
        }

        let novaPrioridade = Number(
            prompt("Digite a nova prioridade (1, 2 ou 3):")
        );

        if (![1, 2, 3].includes(novaPrioridade)) {
            alert("Prioridade inválida!");
            return;
        }

        tarefa.prioridade = novaPrioridade;

        listarTarefas();

    }

    // Excluir tarefa
    function excluirTarefa(codigo) {

        tarefas = tarefas.filter(t => t.codigo !== codigo);

        listarTarefas();

    }

</script>

<script src="script.js"></script></body>
</html>
