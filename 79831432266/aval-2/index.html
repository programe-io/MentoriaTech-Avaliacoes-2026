
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorrane - Rede Social</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
  <h1>Lorrane</h1>
  <input type="text" id="pesquisa" placeholder="Pesquisar...">
  <button onclick="mostrarAba('inicio')">Início</button>
  <button onclick="mostrarAba('mensagens')">Mensagens</button>
  <button onclick="mostrarAba('perfil')">Meu perfil</button>
</header>

<main>
  <section id="inicio" class="aba">
    <div class="perfil">
      <div class="avatar">L</div>
      <h2>Lorrane</h2>
      <p>Bem-vindo à minha rede social!</p>
      <p><strong id="seguidores">120</strong> seguidores</p>
      <button onclick="seguir()">Seguir</button>
    </div>

    <h2>Publicar conteúdo</h2>
    <textarea id="legenda" placeholder="O que você está pensando?"></textarea>
    <input type="file" id="arquivo" accept="image/*,video/*">
    <button onclick="publicar()">Publicar</button>

    <h2>Para você</h2>
    <div id="feed"></div>
  </section>

  <section id="mensagens" class="aba escondido">
    <h2>Mensagens</h2>
    <div id="conversa">
      <p><strong>Ana:</strong> Oi, tudo bem?</p>
    </div>
    <input id="mensagem" placeholder="Digite uma mensagem...">
    <button onclick="enviarMensagem()">Enviar</button>
  </section>

  <section id="perfil" class="aba escondido">
    <h2>Meu perfil</h2>
    <div class="avatar grande">L</div>
    <h2>Lorrane</h2>
    <p>Minha página pessoal</p>
    <p><strong id="seguidoresPerfil">120</strong> seguidores</p>
    <p id="totalPosts">0 publicações</p>
  </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
