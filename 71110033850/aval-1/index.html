<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Rotina Escolar</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>📚 Minha Rotina Escolar</h1>
        <p>Organize suas atividades escolares para fazer em casa!</p>
    </header>

    <main>

        <section class="resumo">
            <div class="card">
                <span>📋</span>
                <h3>Total</h3>
                <strong id="total">0</strong>
            </div>

            <div class="card">
                <span>✅</span>
                <h3>Concluídas</h3>
                <strong id="concluidas">0</strong>
            </div>

            <div class="card">
                <span>⏳</span>
                <h3>Pendentes</h3>
                <strong id="pendentes">0</strong>
            </div>
        </section>

        <section class="formulario">
            <h2>➕ Adicionar atividade</h2>

            <form id="formAtividade">

                <div class="campo">
                    <label for="atividade">Atividade</label>
                    <input
                        type="text"
                        id="atividade"
                        placeholder="Ex.: Fazer exercícios de matemática"
                        required
                    >
                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="materia">Matéria</label>

                        <select id="materia">
                            <option value="Matemática">Matemática</option>
                            <option value="Português">Português</option>
                            <option value="Ciências">Ciências</option>
                            <option value="História">História</option>
                            <option value="Geografia">Geografia</option>
                            <option value="Inglês">Inglês</option>
                            <option value="Artes">Artes</option>
                            <option value="Outra">Outra</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="horario">Horário</label>
                        <input type="time" id="horario">
                    </div>

                </div>

                <div class="campo">
                    <label for="observacao">Observação</label>
                    <textarea
                        id="observacao"
                        placeholder="Ex.: Fazer páginas 20 a 25..."
                    ></textarea>
                </div>

                <button type="submit">
                    Adicionar atividade
                </button>

            </form>
        </section>

        <section class="lista-section">

            <div class="titulo-lista">
                <h2>📝 Atividades de hoje</h2>

                <button id="limparConcluidas" class="btn-secundario">
                    Limpar concluídas
                </button>
            </div>

            <div id="listaAtividades">
                <!-- As atividades serão adicionadas pelo JavaScript -->
            </div>

            <div id="mensagemVazia" class="vazio">
                <div>🎉</div>
                <h3>Nenhuma atividade cadastrada</h3>
                <p>Adicione uma atividade para começar sua rotina!</p>
            </div>

        </section>

        <section class="progresso">
            <div class="progresso-topo">
                <h2>📊 Progresso</h2>
                <span id="porcentagem">0%</span>
            </div>

            <div class="barra">
                <div id="barraProgresso"></div>
            </div>
        </section>

    </main>

    <footer>
        <p>📚 Minha Rotina Escolar &copy; 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
