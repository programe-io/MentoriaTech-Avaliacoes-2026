
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>MiniFeed</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>MiniFeed</h1>
                                    <p>Compartilhe seus momentos!</p>
                                        </header>

                                            <main>
                                                    <section class="publicar">
                                                                <h2>Criar publicação</h2>

                                                                            <input type="text" id="nome"
                                                                                            placeholder="Seu nome">

                                                                                                        <textarea id="mensagem"
                                                                                                                        placeholder="O que você está pensando?"></textarea>

                                                                                                                                    <button onclick="publicar()">Publicar</button>
                                                                                                                                            </section>

                                                                                                                                                    <section class="feed">
                                                                                                                                                                <h2>Publicações recentes</h2>

                                                                                                                                                                            <div id="postagens">
                                                                                                                                                                                            <div class="post">
                                                                                                                                                                                                                <h3>Maria</h3>
                                                                                                                                                                                                                                    <p>Olá! Bem-vindos ao MiniFeed!</p>
                                                                                                                                                                                                                                                        <button onclick="curtir(this)">
                                                                                                                                                                                                                                                                                ❤️ Curtir <span>0</span>
                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                        </section>
                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                <footer>
                                                                                                                                                                                                                                                                                                                                                        <p>© 2026 MiniFeed - Todos os direitos reservados.</p>
                                                                                                                                                                                                                                                                                                                                                            </footer>

                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                </html>
