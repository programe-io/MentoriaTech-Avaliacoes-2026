<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cartão de Visitas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Gerador de Cartão de Visitas</h1>
        <p>Preencha os campos abaixo para ver o seu cartão atualizar em tempo real!</p>

        <div class="app-layout">
            <!-- Formulário de Entrada -->
            <form id="cardForm" class="form-section">
                <div class="input-group">
                    <label for="inputName">Nome Completo</label>
                    <input type="text" id="inputName" placeholder="Ex: João Silva" value="João Silva">
                </div>

                <div class="input-group">
                    <label for="inputRole">Cargo / Profissão</label>
                    <input type="text" id="inputRole" placeholder="Ex: Desenvolvedor Front-End" value="Desenvolvedor Front-End">
                </div>

                <div class="input-group">
                    <label for="inputPhone">Telefone</label>
                    <input type="tel" id="inputPhone" placeholder="Ex: (11) 99999-9999" value="(11) 99999-9999">
                </div>

                <div class="input-group">
                    <label for="inputEmail">E-mail</label>
                    <input type="email" id="inputEmail" placeholder="Ex: joao@email.com" value="joao@email.com">
                </div>

                <div class="input-group">
                    <label for="themeColor">Cor de Destaque</label>
                    <input type="color" id="themeColor" value="#4f46e5">
                </div>
            </form>

            <!-- Pré-visualização do Cartão -->
            <div class="preview-section">
                <div class="business-card" id="businessCard">
                    <div class="card-header">
                        <div class="avatar-placeholder" id="avatarDecoration">JS</div>
                        <div>
                            <h2 id="cardName">João Silva</h2>
                            <p id="cardRole">Desenvolvedor Front-End</p>
                        </div>
                    </div>
                    <div class="card-body">
                        <p><strong>📞 Tel:</strong> <span id="cardPhone">(11) 99999-9999</span></p>
                        <p><strong>✉️ E-mail:</strong> <span id="cardEmail">joao@email.com</span></p>
                    </div>
                    <div class="card-footer">
                        <span>Conecte-se comigo</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="script.js"></script></body>
</html>
