<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="todo-container">
        <header>
            <h1>Minhas Tarefas</h1>
            <p>Organize seu dia de forma simples</p>
        </header>

        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Digite uma nova tarefa..." required autocomplete="off">
            <button type="submit" id="add-btn">Adicionar</button>
        </form>

        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="pending">Pendentes</button>
            <button class="filter-btn" data-filter="completed">Concluídas</button>
        </div>

        <ul id="todo-list">
            <!-- As tarefas serão inseridas aqui via JavaScript -->
        </ul>
    </div>
<script src="script.js"></script></body>
</html>
