<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="login-container">
        <h2>Acessar Sistema</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
                <span class="error-message" id="emailError">E-mail inválido</span>
            </div>
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" required>
                <span class="error-message" id="passwordError">A senha deve ter pelo menos 6 caracteres</span>
            </div>
            
            <button type="submit" class="btn-submit">Entrar</button>
        </form>
        <div id="successMessage" class="success-message">Login realizado com sucesso! 🎉</div>
    </div>
<script src="script.js"></script></body>
</html>
