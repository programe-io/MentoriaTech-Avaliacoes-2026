

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de IMC</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Controle de IMC</h1>
        <p>Sistema de avaliação do Índice de Massa Corporal</p>
    </header>

    <main class="container">

        <section class="formulario">

            <h2>Dados do Paciente</h2>

            <form id="formIMC">

                <div class="campo">
                    <label for="nome">Nome completo:</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome do paciente"
                        maxlength="80"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg):</label>
                    <input
                        type="number"
                        id="peso"
                        placeholder="Ex: 70"
                        min="0.1"
                        max="500"
                        step="0.1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="altura">Altura (m):</label>
                    <input
                        type="number"
                        id="altura"
                        placeholder="Ex: 1.75"
                        min="0.1"
                        max="2.5"
                        step="0.01"
                        required
                    >
                </div>

                <div class="botoes">
                    <button type="submit" class="btn-calcular">
                        Calcular IMC
                    </button>

                    <button type="reset" class="btn-limpar">
                        Limpar
                    </button>
                </div>

            </form>

        </section>

        <section id="resultado" class="resultado" aria-live="polite" hidden>

            <h2>Resultado da Avaliação</h2>

            <div id="dadosPaciente"></div>

            <div class="imc-destaque">
                <span>Seu IMC é:</span>
                <strong id="valorIMC">0.00</strong>
            </div>

            <div class="classificacao">
                <p>Classificação:</p>
                <h3 id="classificacaoIMC"></h3>
                <p id="mensagem"></p>
            </div>

        </section>

        <section class="historico">

            <h2>Histórico de Avaliações</h2>

            <div id="listaHistorico">
                <p>Nenhuma avaliação realizada.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>Projeto Prático - Controle de IMC</p>
        <p>Desenvolvido com HTML, CSS e JavaScript</p>
    </footer>

<script src="script.js"></script></body>
</html>
