<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        \}

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(120deg, #4158D0, #C850C0, #FFCC70);
            min-height: 100vh;
            padding: 2rem;
        \}

        .cartao-perfil {
            background: white;
            max-width: 420px;
            margin: 0 auto;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
        \}

        .foto-perfil {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4158D0, #C850C0);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
        \}

        h1 {
            color: #2d3748;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        \}

        .titulo {
            color: #718096;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        \}

        .descricao {
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 2rem;
        \}

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        \}

        .botao {
            padding: 0.9rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease;
        \}

        .botao-principal {
            background: linear-gradient(90deg, #4158D0, #C850C0);
            color: white;
        \}

        .botao-secundario {
            background: #f7fafc;
            color: #2d3748;
            border: 2px solid #e2e8f0;
        \}

        .botao:hover {
            transform: scale(1.03);
        \}

        .redes {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        \}

        .rede {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #edf2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.2rem;
            transition: background 0.2s;
        \}

        .rede:hover {
            background: #e2e8f0;
        \}

        .habilidades {
            margin-top: 2rem;
            text-align: left;
        \}

        .habilidades h3 {
            color: #2d3748;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        \}

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        \}

        .tag {
            background: #edf2f7;
            color: #2d3748;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
        \}
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="cartao-perfil">
        <div class="foto-perfil">👤</div>
        
        <h1>Maria Silva</h1>
        <p class="titulo">Desenvolvedora Web & Designer</p>
        <p class="descricao">
            Criando páginas bonitas e funcionais com HTML, CSS e JavaScript. 
            Apaixonada por tecnologia e por transformar ideias em realidade! ✨
        </p>

        <div class="botoes">
            <a href="#" class="botao botao-principal">📧 Ver Portfólio</a>
            <a href="#" class="botao botao-secundario">📩 Enviar Mensagem</a>
        </div>

        <div class="habilidades">
            <h3>🛠️ Habilidades</h3>
            <div class="tags">
                <span class="tag">HTML</span>
                <span class="tag">CSS</span>
                <span class="tag">JavaScript</span>
                <span class="tag">Design</span>
                <span class="tag">Responsivo</span>
            </div>
        </div>

        <div class="redes">
            <a href="#" class="rede">📘</a>
            <a href="#" class="rede">🐦</a>
            <a href="#" class="rede">💼</a>
            <a href="#" class="rede">📷</a>
        </div>
    </div>

<script src="script.js"></script></body>
</html>$0
