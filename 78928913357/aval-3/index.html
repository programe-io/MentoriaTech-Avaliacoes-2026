<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Interativo</title>
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="card">
        <h1>Meu Contador</h1>
        <div id="valor" class="numero">0</div>
        
        <div class="botoes">
            <button id="diminuir" class="btn">Diminuir</button>
            <button id="zerar" class="btn reset">Zerar</button>
            <button id="aumentar" class="btn">Aumentar</button>
        </div>
    </div>

    <!-- Link para o arquivo JavaScript externo (no final do body) -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
