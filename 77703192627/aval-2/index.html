```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniSocial - Carlos</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- CABEÇALHO -->
    <header>

        <div class="logo">
            MiniSocial
        </div>

        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar..."
        >

        <button id="modoBtn">
            🌙
        </button>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <!-- PERFIL -->
        <aside class="perfil">

            <div class="foto">
                👤
            </div>

            <h2>Carlos</h2>

            <p>@carlos</p>

            <p class="idade">
                15 anos
            </p>

            <div class="estatisticas">

                <div>
                    <strong>120</strong>
                    <span>Seguidores</span>
                </div>

                <div>
                    <strong>85</strong>
                    <span>Seguindo</span>
                </div>

            </div>

            <button class="editar">
                Editar perfil
            </button>

        </aside>


        <!-- PUBLICAÇÕES -->
        <section class="conteudo">

            <!-- CRIAR POST -->
            <div class="criar-post">

                <div class="usuario">

                    <div class="mini-foto">
                        👤
                    </div>

                    <textarea
                        id="textoPost"
                        placeholder="O que você está pensando?"
                    ></textarea>

                </div>


                <div class="post-opcoes">

                    <span>📷 Foto</span>

                    <span>🎥 Vídeo</span>

                    <span>😊 Sentimento</span>

                    <button id="publicar">
                        Publicar
                    </button>

                </div>

            </div>


            <!-- POSTS -->
            <div id="listaPosts"></div>

        </section>


        <!-- TENDÊNCIAS -->
        <aside class="direita">

            <h3>🔥 Tendências</h3>

            <div class="tendencia">
                <strong>#Tecnologia</strong>
                <span>2,4 mil publicações</span>
            </div>

            <div class="tendencia">
                <strong>#Jogos</strong>
                <span>1,8 mil publicações</span>
            </div>

            <div class="tendencia">
                <strong>#Programação</strong>
                <span>980 publicações</span>
            </div>

            <div class="tendencia">
                <strong>#Música</strong>
                <span>750 publicações</span>
            </div>

        </aside>

    </main>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
