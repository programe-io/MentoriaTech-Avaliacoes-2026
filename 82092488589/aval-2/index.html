<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed Social</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>Mini Feed</h1>
    <p>Compartilhe suas ideias em tempo real</p>
  </header>

  <main class="container">
    <!-- Formulário para criar nova postagem -->
    <section class="criar-post">
      <h2>Nova Publicação</h2>
      <input type="text" id="autor" placeholder="Seu nome (ex: Maria Silva)" maxlength="40">
      <textarea id="mensagem" rows="3" placeholder="No que você está pensando?" maxlength="280"></textarea>
      <button onclick="publicarPost()">Publicar</button>
    </section>

    <!-- Área onde os posts vão aparecer -->
    <section id="feed" class="lista-posts">
      <!-- Post inicial de exemplo -->
      <article class="post">
        <div class="post-header">
          <strong>Equipe Mini Feed</strong>
          <span class="data">Agora mesmo</span>
        </div>
        <p class="post-texto">Bem-vindo ao Mini Feed! Escreva uma mensagem acima para publicar no mural.</p>
        <div class="post-acoes">
          <button class="btn-curtir" onclick="curtirPost(this)">❤️ Curtir (<span>0</span>)</button>
          <button class="btn-excluir" onclick="excluirPost(this)">🗑️ Excluir</button>
        </div>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
