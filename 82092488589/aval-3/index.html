<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaClone - Feed Social</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Barra Superior -->
  <header class="navbar">
    <div class="nav-container">
      <h1 class="logo">InstaClone</h1>
      <div class="nav-icons">
        <span>🏠</span>
        <span>➕</span>
        <span>❤️</span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Barra de Stories -->
    <section class="stories">
      <div class="story">
        <div class="avatar-borda"><img src="https://picsum.photos" alt="Avatar"></div>
        <span>ana.dev</span>
      </div>
      <div class="story">
        <div class="avatar-borda"><img src="https://picsum.photos" alt="Avatar"></div>
        <span>carlos_js</span>
      </div>
      <div class="story">
        <div class="avatar-borda"><img src="https://picsum.photos" alt="Avatar"></div>
        <span>julia.css</span>
      </div>
      <div class="story">
        <div class="avatar-borda"><img src="https://picsum.photos" alt="Avatar"></div>
        <span>pedro.web</span>
      </div>
    </section>

    <!-- Formulário para Nova Publicação -->
    <section class="novo-post">
      <h3>Criar nova publicação</h3>
      <input type="text" id="usuario" placeholder="Seu @usuario (ex: lucas.code)" maxlength="30">
      <input type="url" id="imagem-url" placeholder="Cole o link de uma imagem (opcional)">
      <input type="text" id="legenda" placeholder="Escreva uma legenda..." maxlength="150">
      <button onclick="adicionarPost()">Compartilhar</button>
    </section>

    <!-- Feed de Postagens -->
    <section id="feed">
      <!-- Post de Exemplo 1 -->
      <article class="post">
        <div class="post-header">
          <img class="avatar-mini" src="https://picsum.photos" alt="Avatar">
          <strong>ana.dev</strong>
        </div>
        <img class="post-imagem" src="https://picsum.photos" alt="Foto da publicação">
        <div class="post-conteudo">
          <div class="post-acoes">
            <button class="btn-like" onclick="alternarCurtida(this)">🤍</button>
            <span>💬</span>
          </div>
          <p class="curtidas">Curtido por <strong class="contador">124</strong> pessoas</p>
          <p class="legenda-texto"><strong>ana.dev</strong> Codando um novo projeto em HTML, CSS e JS! 💻✨</p>
          
          <div class="lista-comentarios"></div>
          
          <div class="form-comentario">
            <input type="text" placeholder="Adicione um comentário...">
            <button onclick="comentar(this)">Publicar</button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
