<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC e Registo</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Calculadora de IMC e Registo de Pessoas</h1>

    <form id="form-pessoa" class="form-pessoa">
      <div id="erro" class="erro" hidden></div>

      <div class="campo">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>
      </div>

      <div class="campo">
        <label for="idade">Idade:</label>
        <input type="number" id="idade" required>
      </div>

      <div class="campo">
        <label for="altura">Altura (m):</label>
        <input type="number" step="0.01" id="altura" required>
      </div>

      <div class="campo">
        <label for="peso">Peso (kg):</label>
        <input type="number" step="0.1" id="peso" required>
      </div>

      <div class="botoes">
        <button type="submit" class="btn btn-salvar">Salvar</button>
        <button type="button" id="btn-cancelar" class="btn btn-cancelar">Cancelar</button>
      </div>
    </form>

    <section class="secao-tabela">
      <h2>Pessoas Cadastradas</h2>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Altura</th>
            <th>Peso</th>
            <th>IMC</th>
            <th>Classificação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-pessoas">
          <!-- Preenchido dinamicamente pelo JavaScript -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="javascript.js"></script>
<script src="script.js"></script></body>
</html>
