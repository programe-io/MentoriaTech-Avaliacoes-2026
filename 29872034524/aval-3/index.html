
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - Meu Perfil</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
  <div class="logo">Instagram</div>
  <input class="search" placeholder="Pesquisar">
  <nav>
    <span>🏠</span>
    <span onclick="document.getElementById('photo').click()">➕</span>
    <span>💬</span>
    <span>❤️</span>
    <span onclick="document.getElementById('profile').scrollIntoView()">👤</span>
  </nav>
</header>

<div class="container">

  <main>
    <section class="profile-page" id="profile">
      <img id="profilePhoto"
        src="https://i.pravatar.cc/200?img=12">

      <div class="profile-info">
        <div class="profile-top">
          <h2 id="username">meu_perfil</h2>
          <button onclick="editProfile()">Editar perfil</button>
          <button>Ver arquivo</button>
        </div>

        <div class="stats">
          <span><strong id="postCount">3</strong> publicações</span>
          <span><strong>1.250</strong> seguidores</span>
          <span><strong>580</strong> seguindo</span>
        </div>

        <h3 id="fullName">Meu Nome</h3>
        <p id="bio">Bem-vindo ao meu Instagram! 📸✨</p>
      </div>
    </section>

    <section class="stories" id="stories"></section>

    <section class="create">
      <h3>Nova publicação</h3>
      <input id="photo" type="text" placeholder="URL da imagem">
      <input id="description" type="text" placeholder="Escreva uma legenda...">
      <button onclick="createPost()">Publicar</button>
    </section>

    <div class="tabs">
      <span>▦ PUBLICAÇÕES</span>
      <span>🎬 REELS</span>
      <span>🔖 SALVOS</span>
    </div>

    <section id="feed" class="grid-feed"></section>
  </main>

</div>

<script src="script.js"></script>
<script src="motos.js"></script>
<script src="script.js"></script></body>
</html>
