<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Cadastro de Produtos</h1>

        <div id="mensagem" class="mensagem"></div>

        <h2>Cadastrar Produto</h2>

        <div class="formulario">
            <input type="text" id="descricao" placeholder="Descrição">

            <input type="number" id="quantidade"
                placeholder="Quantidade" min="1">

            <input type="number" id="valor"
                placeholder="Valor" min="0" step="0.01">

            <button onclick="cadastrarProduto()">
                Cadastrar
            </button>
        </div>

        <h2>Atualizar Valor</h2>

        <div class="atualizacao">
            <input type="number" id="codigo"
                placeholder="Código do produto" min="1">

            <input type="number" id="novoValor"
                placeholder="Novo valor" min="0" step="0.01">

            <button onclick="atualizarValor()">
                Atualizar Valor
            </button>
        </div>

        <h2>Atualizar Quantidade</h2>

        <div class="atualizacao">
            <input type="number" id="codigoQuantidade"
                placeholder="Código do produto" min="1">

            <input type="number" id="novaQuantidade"
                placeholder="Nova quantidade" min="1">

            <button onclick="atualizarQuantidade()">
                Atualizar Quantidade
            </button>
        </div>

        <h2>Lista de Produtos</h2>

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                </tr>
            </thead>

            <tbody id="listaProdutos">
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
