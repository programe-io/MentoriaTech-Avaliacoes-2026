
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1, h2 {
            text-align: center;
            color: #174ea6;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .painel {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 14px;
            margin-top: 15px;
            margin-right: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #174ea6;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .alterar {
            background: #e6a700;
            color: #222;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #174ea6;
            color: white;
        }

        .mensagem {
            margin-top: 12px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .painel {
                padding: 12px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 6px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Sistema de Estoque</h1>

    <div class="painel">
        <h2>Cadastrar Produto</h2>

        <form id="formProduto">
            <label for="codigo">Código:</label>
            <input type="number" id="codigo" min="1" step="1" required>

            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" required>

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" min="0" step="1" required>

            <label for="valor">Valor (R$):</label>
            <input type="number" id="valor" min="0" step="0.01" required>

            <button type="submit">Cadastrar Produto</button>
        </form>

        <p id="mensagem" class="mensagem"></p>
    </div>

    <div class="painel">
        <h2>Produtos Cadastrados</h2>

        <button type="button" onclick="listarProdutos()">
            Listar Produtos
        </button>

        <div style="overflow-x:auto">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaProdutos"></tbody>
            </table>
        </div>
    </div>

    <div class="painel">
        <h2>Alterar Valor do Produto</h2>

        <label for="codigoValor">Código do produto:</label>
        <input type="number" id="codigoValor" min="1" step="1">

        <label for="novoValor">Novo valor (R$):</label>
        <input type="number" id="novoValor" min="0" step="0.01">

        <button type="button" onclick="alterarValor()">
            Alterar Valor
        </button>
    </div>

    <div class="painel">
        <h2>Alterar Quantidade do Produto</h2>

        <label for="codigoQuantidade">Código do produto:</label>
        <input type="number" id="codigoQuantidade" min="1" step="1">

        <label for="novaQuantidade">Nova quantidade:</label>
        <input type="number" id="novaQuantidade" min="0" step="1">

        <button type="button" onclick="alterarQuantidade()">
            Alterar Quantidade
        </button>
    </div>

</div>

<script>
    // Lista que armazena os produtos
    let produtos = [];

    // 1. Cadastrar um novo produto
    document.getElementById("formProduto").addEventListener(
        "submit", function(evento) {
            evento.preventDefault();

            const codigo = Number(
                document.getElementById("codigo").value
            );

            const descricao = document.getElementById(
                "descricao"
            ).value.trim();

            const quantidade = Number(
                document.getElementById("quantidade").value
            );

            const valor = Number(
                document.getElementById("valor").value
            );

            if (
                !Number.isSafeInteger(codigo) || codigo <= 0 ||
                descricao === "" ||
                !Number.isSafeInteger(quantidade) || quantidade < 0 ||
                !Number.isFinite(valor) || valor < 0
            ) {
                mostrarMensagem("Preencha os dados corretamente.", true);
                return;
            }

            // Verifica se o código já existe
            const existe = produtos.some(
                produto => produto.codigo === codigo
            );

            if (existe) {
                mostrarMensagem("Código já cadastrado!", true);
                return;
            }

            const produto = {
                codigo: codigo,
                descricao: descricao,
                quantidade: quantidade,
                valor: valor
            };

            produtos.push(produto);

            document.getElementById("formProduto").reset();

            mostrarMensagem("Produto cadastrado com sucesso!");
            listarProdutos();
        }
    );

    // Exibe mensagens para o usuário
    function mostrarMensagem(texto, erro = false) {
        const elemento = document.getElementById("mensagem");
        elemento.textContent = texto;
        elemento.style.color = erro ? "red" : "green";
    }

    // 2. Listar os produtos cadastrados
    function listarProdutos() {
        const tabela = document.getElementById("tabelaProdutos");
        tabela.replaceChildren();

        if (produtos.length === 0) {
            const linha = document.createElement("tr");
            const celula = document.createElement("td");

            celula.colSpan = 5;
            celula.textContent = "Nenhum produto cadastrado.";

            linha.appendChild(celula);
            tabela.appendChild(linha);
            return;
        }

        produtos.forEach(function(produto) {
            const linha = document.createElement("tr");

            const dados = [
                produto.codigo,
                produto.descricao,
                produto.quantidade,
                produto.valor.toLocaleString("pt-BR", {
                    style: "currency",
                    currency: "BRL"
                })
            ];

            dados.forEach(function(dado) {
                const celula = document.createElement("td");
                celula.textContent = dado;
                linha.appendChild(celula);
            });

            const celulaAcao = document.createElement("td");

            const botaoValor = document.createElement("button");
            botaoValor.textContent = "Alterar valor";
            botaoValor.className = "alterar";
            botaoValor.onclick = function() {
                document.getElementById("codigoValor").value =
                    produto.codigo;

                document.getElementById("codigoValor").scrollIntoView({
                    behavior: "smooth"
                });
            };

            const botaoQuantidade = document.createElement("button");
            botaoQuantidade.textContent = "Alterar quantidade";
            botaoQuantidade.className = "alterar";
            botaoQuantidade.onclick = function() {
                document.getElementById("codigoQuantidade").value =
                    produto.codigo;

                document.getElementById(
                    "codigoQuantidade"
                ).scrollIntoView({ behavior: "smooth" });
            };

            celulaAcao.append(botaoValor, botaoQuantidade);
            linha.appendChild(celulaAcao);
            tabela.appendChild(linha);
        });
    }

    // 3. Alterar o valor de um produto
    function alterarValor() {
        const codigo = Number(
            document.getElementById("codigoValor").value
        );

        const novoValorTexto = document.getElementById(
            "novoValor"
        ).value;

        const novoValor = Number(novoValorTexto);

        const produto = produtos.find(
            p => p.codigo === codigo
        );

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (
            novoValorTexto === "" ||
            !Number.isFinite(novoValor) ||
            novoValor < 0
        ) {
            alert("Digite um valor válido!");
            return;
        }

        produto.valor = novoValor;

        alert("Valor alterado com sucesso!");
        document.getElementById("novoValor").value = "";

        listarProdutos();
    }

    // 4. Alterar a quantidade de um produto
    function alterarQuantidade() {
        const codigo = Number(
            document.getElementById("codigoQuantidade").value
        );

        const quantidadeTexto = document.getElementById(
            "novaQuantidade"
        ).value;

        const novaQuantidade = Number(quantidadeTexto);

        const produto = produtos.find(
            p => p.codigo === codigo
        );

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (
            quantidadeTexto === "" ||
            !Number.isSafeInteger(novaQuantidade) ||
            novaQuantidade < 0
        ) {
            alert("Digite uma quantidade válida!");
            return;
        }

        produto.quantidade = novaQuantidade;

        alert("Quantidade alterada com sucesso!");
        document.getElementById("novaQuantidade").value = "";

        listarProdutos();
    }

    // Exibe a tabela inicialmente
    listarProdutos();
</script>

<script src="script.js"></script></body>
</html>
