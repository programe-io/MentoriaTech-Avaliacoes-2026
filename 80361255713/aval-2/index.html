<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sla.css">
    <title>MiniFeed</title>

    <style>
       
    </style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- Cabeçalho -->
    <header>
        <h1>MiniFeed</h1>

        <nav>
            <a href="#">Início</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <main>

        <!-- Caixa para publicar -->
        <section class="publicar">

            <div class="avatar">J</div>

            <div class="informacoes">
                <h3>matheus</h3>
                <p>você está fazendo o que?</p>
            </div>

            <button onclick="publicar()">Publicar</button>

        </section>

        <!-- Publicação de Maria -->
        <article class="post">

            <div class="usuario">

                <div class="avatar">M</div>

                <div>
                    <h3>Luyde</h3>
                    <p>Há 10 minutos</p>
                </div>

            </div>

            <p class="texto-post">
                Hoje eu assisti o lancamento do GTA6 :D
            </p>

            <!-- Imagem do post -->
            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSklCQqVMjY6x98C-RunoiwUdx2bQ0EXvQAnxSgOKd67Q&s=10"
                alt="assistindo uma gameplay de GTA6"
                class="imagem-post"
            >

            <!-- Botões -->
            <div class="acoes">

                <button onclick="curtir(this)">
                    Curtir
                </button>

                <button onclick="comentar(this)">
                    Comentar
                </button>

            </div>

            <!-- Área de comentários -->
            <div class="comentarios">

               

                

                <div class="lista-comentarios"></div>

            </div>

        </article>

    </main>

    <script>
        // Função para curtir a publicação
        function curtir(botao) {
            if (botao.innerText === "Curtir") {
                botao.innerText = "Curtido";
                botao.style.backgroundColor = "#4b20a5";
            } else {
                botao.innerText = "Curtir";
                botao.style.backgroundColor = "#6230c9";
            }
        }

        // Função para mostrar os comentários
        function comentar(botao) {
            const post = botao.closest(".post");
            const comentarios = post.querySelector(".comentarios");

            if (comentarios.style.display === "block") {
                comentarios.style.display = "none";
            } else {
                comentarios.style.display = "block";
            }
        }

        // Função para enviar um comentário
        function enviarComentario(botao) {
            const area = botao.parentElement;
            const texto = area.querySelector("textarea");
            const lista = area.querySelector(".lista-comentarios");

            if (texto.value.trim() === "") {
                alert("Digite um comentário primeiro!");
                return;
            }

            const comentario = document.createElement("p");

            comentario.className = "comentario-enviado";
            comentario.innerText = texto.value;

            lista.appendChild(comentario);

            texto.value = "";
        }

        // Função para publicar
        function publicar() {
            alert("Sua publicação foi enviada!");
        }
    </script>

</body>
</html>
