<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo completo de jogos do Sonic the Hedgehog com datas de lançamento, sinopses e curiosidades.">
  <title>Sonic Game Vault - Catálogo Completo</title>
  
  <!-- Fonte Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Cabeçalho & Controles -->
  <header class="header">
    <div class="header-container">
      <div class="logo-area">
        <h1 class="logo-title">SONIC <span>VAULT</span></h1>
        <p class="logo-subtitle">O catálogo definitivo da franquia Sonic the Hedgehog</p>
      </div>

      <!-- Barra de Ferramentas (Filtros e Busca) -->
      <div class="controls-bar">
        <div class="search-box">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Buscar por título ou curiosidade..." 
            aria-label="Buscar jogo"
          >
        </div>

        <div class="filters-group">
          <select id="era-filter" aria-label="Filtrar por era">
            <option value="all">Todas as Eras</option>
            <option value="classic">Era Clássica (2D)</option>
            <option value="dreamcast">Era Dreamcast</option>
            <option value="modern">Era Moderna</option>
          </select>

          <select id="sort-order" aria-label="Ordenar jogos">
            <option value="oldest">Mais Antigos Primeiro</option>
            <option value="newest">Mais Recentes Primeiro</option>
            <option value="alpha">Ordem Alfabética (A-Z)</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal / Grid de Jogos -->
  <main class="main-container">
    <div id="games-grid" class="games-grid">
      <!-- Cards serão inseridos dinamicamente via JS -->
    </div>
    
    <div id="no-results" class="no-results hidden">
      <p>Nenhum jogo encontrado para a sua busca.</p>
    </div>
  </main>

  <!-- Modal de Detalhes do Jogo -->
  <div id="game-modal" class="modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="modal-close" aria-label="Fechar modal">&times;</button>
      
      <div class="modal-body">
        <div class="modal-image-container">
          <img id="modal-image" src="" alt="">
          <span id="modal-era-badge" class="era-badge"></span>
        </div>
        
        <div class="modal-info">
          <h2 id="modal-title" class="modal-title"></h2>
          
          <div class="modal-meta">
            <p><strong>Lançamento:</strong> <span id="modal-date"></span></p>
            <p><strong>Plataforma:</strong> <span id="modal-platform"></span></p>
          </div>

          <div class="modal-section">
            <h3>Sinopse</h3>
            <p id="modal-synopsis" class="modal-synopsis"></p>
          </div>

          <div class="modal-section">
            <h3>Curiosidades</h3>
            <ul id="modal-curiosities" class="curiosities-list"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Rodapé -->
  <footer class="footer">
    <p>&copy; Catálogo de Jogos do Sonic — Desenvolvido em HTML5, CSS3 e JavaScript</p>
  </footer>

  <!-- JavaScript -->
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
