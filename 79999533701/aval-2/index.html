
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main>

        <!-- Nova publicação -->
        <section class="new-post">

            <div class="user">
                <div class="avatar">N</div>

                <div class="user-info">
                    <strong>Noemi</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>

            <button>Publicar</button>

        </section>

        <!-- Primeira postagem -->
        <article class="post">

            <div class="post-header">
                <div class="user">
                    <div class="avatar">M</div>

                    <div class="user-info">
                        <strong>Maria Silva</strong>
                        <span>Há 10 minutos</span>
                    </div>
                </div>
            </div>

            <div class="post-text">
                <p>
                    Hoje foi um dia incrível!
                    Aproveitei bastante com meus amigos.
                </p>
            </div>

            <img
                class="post-image"
                src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=900&q=80"
                alt="Amigos reunidos em um momento especial"
            >

            <div class="post-actions">
                <button>♡ Curtir</button>
                <button>💬 Comentar</button>
            </div>

        </article>

        <!-- Segunda postagem -->
        <article class="post">

            <div class="post-header">
                <div class="user">
                    <div class="avatar">J</div>

                    <div class="user-info">
                        <strong>João Santos</strong>
                        <span>Há 30 minutos</span>
                    </div>
                </div>
            </div>

            <div class="post-text">
                <p>
                    Um momento especial para guardar
                    na memória! 🌟
                </p>
            </div>

            <img
                class="post-image"
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
                alt="Paisagem natural com montanhas e céu"
            >

            <div class="post-actions">
                <button>♡ Curtir</button>
                <button>💬 Comentar</button>
            </div>

        </article>

    </main>

    <!-- Rodapé -->
    <footer>
        <p>© 2026 Mini Feed - Todos os direitos reservados.</p>
    </footer>

<script src="script.js"></script></body>
</html>
