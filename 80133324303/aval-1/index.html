<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelForge — Blog de Games</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="header">
    <div class="container header-content">
      <a href="#" class="logo">Pixel<span>Forge</span></a>
      <nav class="nav-filters" id="categoryFilters">
        <button class="filter-btn active" data-category="Todos">Todos</button>
        <button class="filter-btn" data-category="RPG">RPG</button>
        <button class="filter-btn" data-category="Indie">Indie</button>
        <button class="filter-btn" data-category="WebDev">WebDev</button>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Notícias, reviews e bastidores do mundo gamer</h1>
      <p>Explore análises, dicas de desenvolvimento e novidades do universo dos jogos.</p>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar artigos por título ou tema..." />
      </div>
    </div>
  </section>

  <main class="container">
    <div class="posts-grid" id="postsGrid"></div>
  </main>

  <div class="modal" id="postModal" aria-hidden="true">
    <div class="modal-content">
      <button class="modal-close" id="closeModal" aria-label="Fechar artigo">&times;</button>
      <span class="badge" id="modalCategory"></span>
      <h2 id="modalTitle"></h2>
      <p class="post-meta" id="modalMeta"></p>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>PixelForge Blog — Feito com HTML, CSS e JavaScript.</p>
    </div>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
