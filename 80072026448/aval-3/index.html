<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InstaClone</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="navbar">
    <div class="navbar-content">
      <h1 class="logo">InstaClone</h1>
      <input type="text" id="searchInput" class="search-box" placeholder="Pesquisar usuário..." />
      <button id="openModalBtn" class="btn-primary">+ Nova postagem</button>
    </div>
  </header>

  <main class="container">
    <section class="stories" id="storiesBar"></section>
    <section class="feed" id="feedContainer"></section>
  </main>

  <div id="postModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Criar nova postagem</h2>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      <form id="newPostForm">
        <label for="postImage">URL da imagem</label>
        <input type="url" id="postImage" placeholder="https://..." required />

        <label for="postCaption">Legenda</label>
        <textarea id="postCaption" rows="3" placeholder="Escreva uma legenda..." required></textarea>

        <button type="submit" class="btn-primary full-width">Publicar</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
