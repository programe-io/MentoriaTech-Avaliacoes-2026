<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque Simples</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <h1>Sistema de Controle de Estoque</h1>
    <p>Utilize os formulários abaixo para interagir com o array de produtos em tempo real.</p>
    <hr>

    <div class="flex-container">
        <div class="custom-card">
            <h2>1. Cadastrar Produto</h2>
            <div class="form-group">
                <label>Descrição (mín. 5 caract.):</label>
                <input type="text" id="cadDescricao" placeholder="Ex: Cadeira Gamer">
            </div>
            <div class="form-group">
                <label>Quantidade Inicial:</label>
                <input type="number" id="cadQuantidade" placeholder="Ex: 10">
            </div>
            <div class="form-group">
                <label>Valor Unitário (R$):</label>
                <input type="number" id="cadValor" step="0.01" placeholder="Ex: 699.90">
            </div>
            <button onclick="interfaceCadastrar()">Cadastrar Produto</button>
        </div>

        <div class="custom-card">
            <h2>2. Atualizar Dados</h2>
            <div class="form-group">
                <label>Código do Produto:</label>
                <input type="number" id="altCodigo" placeholder="Ex: 1">
            </div>
            <div class="form-group">
                <label>Novo Valor (Substitui o atual):</label>
                <input type="number" id="altValor" step="0.01" placeholder="Deixe em branco se for atualizar apenas qtd">
            </div>
            <button class="alt-btn" onclick="interfaceAtualizarValor()" style="margin-bottom: 15px;">Atualizar Valor</button>
                        
            <div class="form-group">
                <label>Quantidade a Somar (Entrada):</label>
                <input type="number" id="altQuantidade" placeholder="Deixe em branco se for atualizar apenas valor">
            </div>
            <button class="alt-btn" onclick="interfaceAtualizarQuantidade()">Somar Quantidade</button>
        </div>
    </div>

    <br>

    <div class="flex-container">
        <div class="custom-card" style="min-width: 100%;">
            <h2>Console do Sistema (Logs)</h2>
            <div id="output">Pronto para receber comandos...</div>
        </div>
                
        <div class="custom-card" style="min-width: 100%;">
            <h2>Estoque Atual (JSON)</h2>
            <div id="estoqueLista">[]</div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
