<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Relatório de Monitoramento Pedagógico</title>
                <style>
                        body {
                                    font-family: Arial, sans-serif;
                                                background-color: #f4f4f4;
                                                            margin: 20px;
                                                                    }

                                                                            .container {
                                                                                        max-width: 800px;
                                                                                                    margin: auto;
                                                                                                                background: #fff;
                                                                                                                            padding: 25px;
                                                                                                                                        border-radius: 10px;
                                                                                                                                                    box-shadow: 0 0 10px rgba(0,0,0,0.1);
                                                                                                                                                            }

                                                                                                                                                                    h1 {
                                                                                                                                                                                text-align: center;
                                                                                                                                                                                            color: #006633;
                                                                                                                                                                                                    }

                                                                                                                                                                                                            label {
                                                                                                                                                                                                                        font-weight: bold;
                                                                                                                                                                                                                                    display: block;
                                                                                                                                                                                                                                                margin-top: 15px;
                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                input, textarea {
                                                                                                                                                                                                                                                                            width: 100%;
                                                                                                                                                                                                                                                                                        padding: 10px;
                                                                                                                                                                                                                                                                                                    margin-top: 5px;
                                                                                                                                                                                                                                                                                                                border: 1px solid #ccc;
                                                                                                                                                                                                                                                                                                                            border-radius: 5px;
                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                            textarea {
                                                                                                                                                                                                                                                                                                                                                        resize: vertical;
                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                        button {
                                                                                                                                                                                                                                                                                                                                                                                    margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                background-color: #006633;
                                                                                                                                                                                                                                                                                                                                                                                                            color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                        border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                    padding: 12px 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                border-radius: 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            button:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        background-color: #004d26;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h1>Relatório de Monitoramento Pedagógico</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h3>Período de Acompanhamento Escolar</h3>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <form action="#" method="post">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Nome do Coordenador(a):</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" name="coordenador" value="Roque" readonly>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Unidade de Ensino:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" name="unidade" value="CETI Aprígio Pereira Bezerra" readonly>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Localidade:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" name="localidade" value="São Julião" readonly>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Descrição das ações executadas:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <textarea rows="5" readonly>Vídeos de ensino assistido e práticas computacionais.</textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Impactos e conquistas observadas:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <textarea rows="5" readonly>Evolução no aprendizado e melhoria nas práticas de programação.</textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Pontos que demandaram maior atenção:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <textarea rows="5" readonly>Necessidade de maior tempo para consolidação do aprendizado e ampliação das atividades práticas.</textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Comentários adicionais e recomendações:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <textarea rows="5" readonly>Foram observadas diversas melhorias ao longo do período. Recomenda-se maior atenção à praticidade e à organização do processo de aprendizagem, visando facilitar a assimilação dos conteúdos e otimizar o desenvolvimento dos estudantes.</textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="submit">Finalizar Relatório</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
