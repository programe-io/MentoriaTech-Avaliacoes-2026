<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Minha Loja Online</h1>
    <p>Produtos com os melhores preços</p>
</header>

<div class="container">
    <div class="produto">
        <img src="https://via.placeholder.com/250x150" alt="Produto">
        <h2>Tênis Esportivo</h2>
        <p class="preco">R$ 199,90</p>
        <button onclick="comprar('Tênis Esportivo')">Comprar</button>
    </div>

    <div class="produto">
        <img src="https://via.placeholder.com/250x150" alt="Produto">
        <h2>Relógio Digital</h2>
        <p class="preco">R$ 149,90</p>
        <button onclick="comprar('Relógio Digital')">Comprar</button>
    </div>

    <div class="produto">
        <img src="https://via.placeholder.com/250x150" alt="Produto">
        <h2>Fone Bluetooth</h2>
        <p class="preco">R$ 89,90</p>
        <button onclick="comprar('Fone Bluetooth')">Comprar</button>
    </div>
</div>
  <script src="script.js"></script>
  
</body>
</html>
