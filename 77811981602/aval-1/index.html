
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed - Futebol</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>⚽ Mini Feed Futebol</h1>
        <p>Compartilhe sua paixão pelo futebol!</p>
    </header>

    <main class="container">

        <section class="nova-postagem">
            <h2>Criar publicação</h2>

            <textarea id="textoPost"
                placeholder="O que aconteceu no futebol hoje?"></textarea>

            <button onclick="adicionarPost()">
                Publicar
            </button>
        </section>

        <section>
            <h2>Feed de publicações</h2>
            <div id="feed"></div>
        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
