<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-feed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>MINI-FEED</h1>
        <div class="links">
            <a href="">INÍCIO</a>
            <a href="">PERFIL</a>
        </div>
    </header>

    <main class="container">
        <section class="add-feed">
            <textarea rows="10" placeholder="Digite oque você esta pensando"></textarea>
            <button class="btn-add">PUBLICAR</button>
        </section>
        <section>
            <div class="post">
                <div class="avatar">
                    <div class="perfil">FT</div>
                    <div class="infs"><p>onefootball</p> <span>há 1 semana</span></div>
                </div>
                <div class="conteudo">
                    <img src="https://dynamo.kiev.ua/media/posts/2023/06/14/5.jpg" alt="">
                    <div class="btn-post">
                        <button>❤️</button>
                        <button>💬</button>
                        <button>⌯⌲</button>
                    </div>
                </div>
                
            </div>
        </section>
        <section>
            <div class="post">
                <div class="avatar">
                    <div class="perfil">FT</div>
                    <div class="infs"><p>onefootball</p> <span>há 7 minutos</span></div>
                </div>
                <div class="conteudo">
                    <img src="https://i-invdn-com.investing.com/trkd-images/LYNXMPEJ560U4_L.jpg" alt="">
                    <div class="btn-post">
                        <button>❤️</button>
                        <button>💬</button>
                        <button>⌯⌲</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
