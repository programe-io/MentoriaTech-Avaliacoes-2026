<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Escolar - Gerenciador de Tarefas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <header>
      <div class="icone-escola">🎓</div>
      <h1>Agenda Escolar</h1>
      <p>Organize seus deveres de casa e trabalhos</p>
    </header>

    <main>
      <!-- Formulário de Cadastro -->
      <section class="form-section">
        <h2>📝 Nova Atividade</h2>
        <form id="form-tarefa">
          <div class="input-group">
            <label for="titulo">Descrição da Tarefa (mín. 5 letras):</label>
            <input type="text" id="titulo" placeholder="Ex: Trabalho de História" required>
          </div>
          
          <div class="input-group">
            <label for="prioridade">Nível de Urgência:</label>
            <select id="prioridade" required>
              <option value="" disabled selected>Selecione a urgência...</option>
              <option value="1">1 - Urgente (Para Amanhã)</option>
              <option value="2">2 - Média (Para esta semana)</option>
              <option value="3">3 - Tranquila (Para o mês)</option>
            </select>
          </div>

          <button type="submit" class="btn-cadastrar">Adicionar à Agenda</button>
        </form>
        <div id="mensagem-erro" class="erro oculto"></div>
      </section>

      <!-- Listagem de Tarefas -->
      <section class="list-section">
        <h2>📚 Meus Deveres</h2>
        <ul id="lista-tarefas">
          <!-- As tarefas serão inseridas aqui via JavaScript -->
          <li class="vazio">Nenhum dever cadastrado. Aproveite o tempo livre!</li>
        </ul>
      </section>
    </main>
  </div>

<script src="script.js"></script></body>
</html>
