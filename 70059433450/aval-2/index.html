<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseSocial — Feed Interativo</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <!-- Cabeçalho -->
  <header class="topbar">
    <div class="container topbar-content">
      <a href="#" class="brand">
        <span class="brand-dot"></span>
        <span>Pulse<span class="accent">Social</span></span>
      </a>

      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Pesquisar no feed ou @usuário..." />
      </div>

      <div class="topbar-actions">
        <button id="themeBtn" class="icon-btn" title="Alternar tema">🌙</button>
        <div class="user-chip">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Alex" alt="Seu avatar" />
          <span>Alex Silva</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Layout Principal -->
  <main class="container app-layout">
    <!-- Coluna Esquerda: Menu -->
    <aside class="left-sidebar">
      <nav class="side-menu">
        <button class="menu-item active" data-tab="all">🏠 Página Inicial</button>
        <button class="menu-item" data-tab="following">👥 Seguindo</button>
        <button class="menu-item" data-tab="saved">🔖 Salvos</button>
      </nav>
    </aside>

    <!-- Coluna Central: Stories + Composer + Feed -->
    <section class="feed-column">
      <!-- Stories -->
      <div class="stories-bar" id="storiesBar"></div>

      <!-- Caixa de Nova Postagem -->
      <div class="card composer-card">
        <div class="composer-top">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Alex" alt="Avatar" class="avatar" />
          <textarea id="postText" rows="3" placeholder="No que você está pensando agora, Alex?"></textarea>
        </div>

        <div id="imageInputBox" class="image-url-box hidden">
          <input type="url" id="postImageUrl" placeholder="Cole a URL de uma imagem (opcional)..." />
        </div>

        <div class="composer-footer">
          <div class="composer-tools">
            <button type="button" id="toggleImageBtn" class="tool-btn">🖼️ Adicionar Foto</button>
          </div>
          <button type="button" id="publishBtn" class="btn-primary">Publicar</button>
        </div>
      </div>

      <!-- Lista de Posts -->
      <div id="feedContainer" class="feed-list"></div>
    </section>

    <!-- Coluna Direita: Em Alta e Sugestões -->
    <aside class="right-sidebar">
      <div class="card widget">
        <h3>🔥 Assuntos em Alta</h3>
        <ul class="trending-list">
          <li><strong>#WebDevelopment</strong><span>14,2 mil posts</span></li>
          <li><strong>#DesignUI</strong><span>8,9 mil posts</span></li>
          <li><strong>#TechBrasil</strong><span>6,4 mil posts</span></li>
          <li><strong>#SetupGamer</strong><span>4,1 mil posts</span></li>
        </ul>
      </div>

      <div class="card widget">
        <h3>✨ Quem Seguir</h3>
        <div id="suggestionsList" class="suggestions-list"></div>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
