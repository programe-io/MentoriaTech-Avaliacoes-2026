<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="header-content">
      <h1>Mini Feed</h1>
      <nav>
        <a href="#">Início</a>
        <a href="#">Perfil</a>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main>
    <!-- Área de Nova Publicação -->
    <section class="new-post-card">
      <div class="user">
        <div class="avatar">M</div>
        <div class="user-info">
          <strong>Murilo</strong>
          <span>O que você está pensando?</span>
        </div>
      </div>
      <button type="button">Publicar</button>
    </section>

    <!-- Feed de Postagens -->
    <section class="feed">
      
      <!-- Postagem 1 -->
      <article class="post">
        <div class="post-header">
          <div class="user">
            <div class="avatar">M</div>
            <div class="user-info">
              <strong>marcos melo</strong>
              <span>há 10 minutos</span>
            </div>
          </div>
        </div>

        <p class="post-text">
          acabei de assistir o filme do deadpool e wolverine
        </p>

        <img 
          src=https://screamyell.com.br/site/wp-content/uploads/2024/07/deadpool2.jpg
          alt="Homem-Aranha em pose de ação" 
          class="post-image"
        >

        <div class="post-actions">
          <button type="button">Curtir</button>
          <button type="button">Comentar</button>
        </div>
      </article>

      <!-- Postagem 2 (Duplicada para exemplificar a sequência do feed) -->
      <article class="post">
        <div class="post-header">
          <div class="user">
            <div class="avatar">I</div>
            <div class="user-info">
              <strong>ithalo nunes</strong>
              <span>há 45 minutos</span>
            </div>
          </div>
        </div>

        <p class="post-text">
          jogando free fire ▄︻テ══━一💥
        </p>

        <img 
          src=https://i.ytimg.com/vi/vgAoSIwQkHQ/sddefault.jpg
          alt="Notebook exibindo código de programação na tela" 
          class="post-image"
        >

        <div class="post-actions">
          <button type="button">Curtir</button>
          <button type="button">Comentar</button>
        </div>
      </article>

    </section>
  </main>

  <!-- Rodapé -->
  <footer>
    <p>&copy; 2026 Mini Feed. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
