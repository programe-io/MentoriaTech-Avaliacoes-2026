
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram SVG</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
<div class="layout">

<aside class="sidebar">
<div>
<h1 class="logo">Instagram</h1>
<nav class="menu">

<button class="menu-item active" onclick="navigate('home')">
<span class="icon"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5.5 9v11h13V9M9.5 20v-6h5v6"/></svg></span>
<span class="label">Página inicial</span></button>

<button class="menu-item" onclick="navigate('search')">
<span class="icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.2 16.2 4.3 4.3"/></svg></span>
<span class="label">Pesquisar</span></button>

<button class="menu-item" onclick="navigate('explore')">
<span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/></svg></span>
<span class="label">Explorar</span></button>

<button class="menu-item" onclick="navigate('reels')">
<span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m10 8 5 4-5 4zM3 8l5-5M11 3l5 5M19 3l2 5"/></svg></span>
<span class="label">Reels</span></button>

<button class="menu-item" onclick="navigate('messages')">
<span class="icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-9 8.5 9.8 9.8 0 0 1-4-.8L3 21l1.8-4.2A8.3 8.3 0 0 1 3 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 0 9 8.5Z"/><path d="M7 12h10M7 8.5h7"/></svg></span>
<span class="label">Mensagens</span></button>

<button class="menu-item" onclick="navigate('notifications')">
<span class="icon"><svg viewBox="0 0 24 24"><path d="M20.8 8.8c0-4.2-2.7-6.3-6.2-6.3S8.4 4.6 8.4 8.8c0 5-2.1 6.1-4.1 8.2h16.6c-2-2.1-4.1-3.2-4.1-8.2"/><path d="M9.5 20.3a5 5 0 0 0 5 0"/></svg></span>
<span class="label">Notificações</span></button>

<button class="menu-item" onclick="openCreate()">
<span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 7v10M7 12h10"/></svg></span>
<span class="label">Criar</span></button>

<button class="menu-item" onclick="navigate('profile')">
<img id="sidebarAvatar" alt="Perfil">
<span class="label">Perfil</span></button>

</nav>
</div>

<div class="sidebar-bottom">
<button class="menu-item" onclick="navigate('more')">
<span class="icon"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>
<span class="label">Mais</span></button>
</div>
</aside>

<main class="main">
<div class="feed-area">
<section class="stories" id="stories"></section>
<section id="feed"></section>
</div>

<aside class="right-panel">
<div class="my-account">
<img id="accountAvatar" alt="Perfil">
<div class="account-info"><strong>seu_perfil</strong><small>Seu nome</small></div>
<button class="switch" onclick="alert('Perfil selecionado')">Mudar</button>
</div>

<div class="suggestions-title"><span>Sugestões para você</span><strong>Ver tudo</strong></div>
<div id="suggestions"></div>

<div class="footer">
Sobre · Ajuda · Imprensa · API · Carreiras · Privacidade · Termos<br><br>
© 2026 INSTAGRAM
</div>
</aside>
</main>
</div>

<!-- MODAL DE PUBLICAÇÃO -->
<div class="modal" id="createModal">
<div class="modal-box">
<div class="modal-header">
<span>Nova publicação</span>
<button class="modal-close" onclick="closeCreate()"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</div>
<div class="modal-body">
<p>Compartilhe uma ilustração SVG</p>
<input type="file" id="imageFile" accept="image/svg+xml">
<img id="imagePreview" class="preview-image" style="display:none">
<textarea id="captionInput" placeholder="Escreva uma legenda..."></textarea>
<button class="publish-button" onclick="publishPost()">Compartilhar</button>
</div>
</div>
</div>

<!-- STORY MODAL -->
<div class="modal" id="storyModal">
<div class="story-view">
<button class="story-close" onclick="closeStory()">×</button>
<img id="storyImage" alt="Story ilustrado">
<div class="story-overlay">
<div class="story-progress"><div class="story-progress-inner"></div></div>
<strong id="storyUser"></strong>
</div>
</div>
</div>

<!-- PESQUISA -->
<div class="modal" id="searchModal">
<div class="modal-box">
<div class="modal-header">
<span>Pesquisar</span>
<button class="modal-close" onclick="closeSearch()"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</div>
<div class="modal-body">
<input type="text" id="searchInput" placeholder="Pesquisar perfis ou publicações">
<button class="search-button" onclick="performSearch()">Pesquisar</button>
<div id="searchResults"></div>
</div>
</div>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
