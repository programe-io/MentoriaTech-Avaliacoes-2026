<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <title>Feed de Amigos</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <h1>Feed de Amigos</h1>

    <nav>
        <a href="#">Início</a>
        <a href="#">Amigos</a>
    </nav>
</header>

<main>

    <section class="publicar">
        <p>O que você está pensando?</p>
        <button>Publicar</button>
    </section>

    <article>

        <h2>👤 Edna</h2>

        <p>
            Hoje foi um dia muito divertido com meus amigos!
        </p>

        <img
            src="https://picsum.photos/500/250?random=20"
            alt="Imagem da publicação"
        >

        <div class="botoes">
            <button>👍 Curtir</button>
            <button>💬 Comentar</button>
        </div>

    </article>

</main>

<footer>
    <p>Feed de Amigos © 2026</p>
</footer>

</body>

</html>
