<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>FitLife Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>⚡ FitLife Tracker</h1>
            <p>Monitore suas metas diárias e esmague seus treinos!</p>
        </header>

        <main class="dashboard">
            <!-- Seção Hidratação -->
            <section class="card water-card">
                <h2>💧 Hidratação</h2>
                <div class="water-progress">
                    <span id="water-count">0</span> / 2000 ml
                </div>
                <div class="progress-bar">
                    <div id="water-bar" class="progress-fill"></div>
                </div>
                <button id="add-water" class="btn">+ 250ml</button>
                <button id="reset-water" class="btn btn-secondary">Resetar</button>
            </section>

            <!-- Seção Treino -->
            <section class="card workout-card">
                <h2>🏋️ Checklist do Treino</h2>
                <ul class="workout-list">
                    <li>
                        <label>
                            <input type="checkbox" class="workout-check">
                            <span>Aquecimento (5 min Esteira)</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox" class="workout-check">
                            <span>Agachamento Livre (4x10)</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox" class="workout-check">
                            <span>Supino Reto (4x10)</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox" class="workout-check">
                            <span>Abdominais (3x15)</span>
                        </label>
                    </li>
                </ul>
                <p id="motivational-msg" class="hidden">🎉 Parabéns! Treino concluído!</p>
            </section>
        </main>
    </div>
</body>
</html>$0
