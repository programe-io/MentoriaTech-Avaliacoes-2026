<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Interativo em CSS Puro</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h2>Lista Interativa (CSS Puro)</h2>
        <p>Clique nos itens abaixo para marcar como concluído ou alternar o painel.</p>

        <!-- ITEM 1: Alternador de Painel usando Checkbox -->
        <div class="box-interativa">
            <input type="checkbox" id="toggle-painel" class="disparador">
            <label for="toggle-painel" class="botao-label">📂 Clique para abrir/fechar conteúdo</label>
            
            <div class="conteudo-oculto">
                <p>Este bloco de texto foi exibido utilizando apenas o seletor <code>:checked</code> do CSS, sem JavaScript!</p>
            </div>
        </div>

        <!-- LISTA DE TAREFAS: Interatividade individual por item -->
        <ul class="lista-tarefas">
            <li>
                <input type="checkbox" id="tarefa1">
                <label for="tarefa1">Estudar Estruturas de Repetição</label>
            </li>
            <li>
                <input type="checkbox" id="tarefa2">
                <label for="tarefa2">Aprender Arrow Functions</label>
            </li>
            <li>
                <input type="checkbox" id="tarefa3">
                <label for="tarefa3">Dominar Métodos de Array (Push/Pop)</label>
            </li>
        </ul>
    </div>

</body>
</html>
