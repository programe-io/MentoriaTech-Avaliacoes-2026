<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="app-container">
    <header>
      <div aria-hidden="true" class="icon-logo"></div>
      <h1>Lista de tarefas</h1>
      <p>cadastre, acompanhe e conclua</p>
    </header>

    <!-- Resumo das Tarefas -->
    <section aria-label="Resumo das tarefas" class="summary-section">
      <div class="card">
        <span id="total-tarefas">0</span>
        <span>tarefas</span>
      </div>
      <div class="card">
        <span id="tarefas-concluidas">0</span>
        <span>concluídas</span>
      </div>
      <div class="card">
        <span id="tarefas-pendentes">0</span>
        <span>pendentes</span>
      </div>
    </section>

    <div class="content-grid">
      <!-- Formulário de Cadastro -->
      <section aria-label="Cadastrar nova tarefa" class="form-section">
        <h2>Nova tarefa</h2>
        <form id="todo-form">
          <div class="field">
            <input type="text" id="task-input" placeholder="Digite a descrição da tarefa..." required>
          </div>
          <button type="submit">Adicionar tarefa</button>
        </form>
      </section>

      <!-- Lista de Tarefas -->
      <section aria-label="Tarefas cadastradas" class="list-section">
        <div class="list-header">
          <h2>Tarefas cadastradas</h2>
          <div aria-label="Filtrar tarefas" role="group" class="filter-group">
            <button type="button" class="filter-btn active" data-filter="all">Todas</button>
            <button type="button" class="filter-btn" data-filter="pending">Pendentes</button>
            <button type="button" class="filter-btn" data-filter="completed">Concluídas</button>
          </div>
        </div>

        <ul id="task-list" class="task-list"></ul>

        <div id="empty-state" class="empty-state">
          <span>NADA POR AQUI</span>
          <p>Nenhuma tarefa cadastrada ainda.<br>Adicione a primeira ao lado.</p>
        </div>
      </section>
    </div>
  </div>

  <div aria-live="polite" role="status" id="status-message"></div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
