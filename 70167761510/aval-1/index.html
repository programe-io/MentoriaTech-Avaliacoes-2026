<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flor Bonita</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(#87CEEB, #E0F7FA);
    overflow:hidden;
}

.flor{
    position:relative;
    width:200px;
    height:300px;
}

.petala{
    position:absolute;
    width:80px;
    height:80px;
    background:#ff69b4;
    border-radius:50%;
}

.petala1{ top:30px; left:60px; }
.petala2{ top:70px; left:20px; }
.petala3{ top:70px; left:100px; }
.petala4{ top:110px; left:60px; }

.centro{
    position:absolute;
    width:70px;
    height:70px;
    background:gold;
    border-radius:50%;
    top:75px;
    left:65px;
    z-index:2;
}

.caule{
    position:absolute;
    width:12px;
    height:140px;
    background:green;
    top:140px;
    left:94px;
}

.folha{
    position:absolute;
    width:50px;
    height:25px;
    background:green;
    border-radius:50px 0;
}

.folha1{
    top:190px;
    left:55px;
    transform:rotate(-30deg);
}

.folha2{
    top:230px;
    left:95px;
    transform:rotate(150deg);
}

h1{
    position:absolute;
    top:20px;
    color:#333;
    font-family:Arial, sans-serif;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

<h1>🌸 Minha Flor 🌸</h1>

<div class="flor">
    <div class="petala petala1"></div>
    <div class="petala petala2"></div>
    <div class="petala petala3"></div>
    <div class="petala petala4"></div>

    <div class="centro"></div>

    <div class="caule"></div>

    <div class="folha folha1"></div>
    <div class="folha folha2"></div>
</div>

<script src="script.js"></script></body>
</html>
