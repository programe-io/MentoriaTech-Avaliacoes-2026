
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Connect</title>
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>💗 Social Connect</h1>
    <p>Compartilhe momentos, conecte pessoas!</p>
</header>

<main>
    <section class="criar">
        <h2>Nova publicação</h2>
        <input type="text" id="nome" placeholder="Seu nome">
        <textarea id="texto" placeholder="O que você está pensando?"></textarea>
        <button onclick="publicar()">Publicar</button>
    </section>

    <h2 class="titulo">🌟 Feed de publicações</h2>

    <div id="feed">

        <article class="post">
            <h3>👩 Ana Silva</h3>
            <p>Hoje foi um dia incrível! 💕</p>
            <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
        </article>

        <article class="post">
            <h3>🧑 Pedro Santos</h3>
            <p>Aproveitando cada momento! ☀️</p>
            <button onclick="curtir(this)">❤️ Curtir <span>0</span></button>
        </article>

    </div>
</main>

<footer>
    <p>Social Connect © 2026</p>
    <p>Projeto Escolar</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
