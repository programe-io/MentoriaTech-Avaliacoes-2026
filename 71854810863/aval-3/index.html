
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaConnect</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">

    <aside class="menu">
        <h1>InstaConnect</h1>
        <a href="#inicio">🏠 Início</a>
        <a href="#stories">⭕ Stories</a>
        <a href="#criar">➕ Criar publicação</a>
        <a href="#perfil">👤 Perfil</a>
    </aside>

    <main id="inicio">

        <section class="stories" id="stories">
            <div class="story">
                <div class="foto">👩🏻</div>
                <p>Seu story</p>
            </div>
            <div class="story">
                <div class="foto">👨🏽</div>
                <p>Lucas</p>
            </div>
            <div class="story">
                <div class="foto">👩🏽</div>
                <p>Maria</p>
            </div>
            <div class="story">
                <div class="foto">👩🏼</div>
                <p>Ana</p>
            </div>
        </section>

        <section id="criar" class="criar">
            <h2>Compartilhe seu momento!</h2>
            <input id="usuario" placeholder="Seu nome">
            <textarea id="legenda" placeholder="Escreva uma legenda..."></textarea>
            <button id="publicar">Publicar</button>
        </section>

        <section id="feed">

            <article class="post">
                <h3>👩🏻 Maria Oliveira</h3>
                <img src="https://picsum.photos/id/1011/600/400" alt="Paisagem natural">
                <div class="acoes">
                    <button class="curtir">❤️ Curtir</button>
                    <span class="contador">0 curtidas</span>
                </div>
                <p><strong>Maria</strong> Aproveitando a vida! ✨</p>
                <input class="comentario" placeholder="Adicione um comentário...">
                <button class="comentar">Enviar</button>
                <div class="comentarios"></div>
            </article>

            <article class="post">
                <h3>🧑🏽 Pedro Santos</h3>
                <img src="https://picsum.photos/id/1015/600/400" alt="Montanhas e natureza">
                <div class="acoes">
                    <button class="curtir">❤️ Curtir</button>
                    <span class="contador">0 curtidas</span>
                </div>
                <p><strong>Pedro</strong> Que lugar incrível! 🌎</p>
                <input class="comentario" placeholder="Adicione um comentário...">
                <button class="comentar">Enviar</button>
                <div class="comentarios"></div>
            </article>

        </section>

    </main>
</div>

<footer>
    <p>InstaConnect © 2026 - Projeto Escolar</p>
</footer>

<script src="script.js"></script></body>
</html>
