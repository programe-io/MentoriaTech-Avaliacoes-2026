<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Gerenciador de Tarefas</h1>
    <p class="sub">Prioridade 1 é a mais alta e 3 a mais baixa. O título precisa ter pelo menos 5 caracteres.</p>

    <section class="card">
      <form id="form">
        <div>
          <label for="titulo">Título da tarefa</label>
          <input id="titulo" autocomplete="off">
        </div>
        <div>
          <label for="prioridade">Prioridade</label>
          <select id="prioridade">
            <option value="1">1 (alta)</option>
            <option value="2" selected>2 (média)</option>
            <option value="3">3 (baixa)</option>
          </select>
        </div>
        <button type="submit">Cadastrar tarefa</button>
      </form>
      <div id="erro" role="alert"></div>
    </section>

    <section class="card">
      <ul id="lista"></ul>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
