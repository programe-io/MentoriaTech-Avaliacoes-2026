<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depósito — Sistema de Cadastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="wrap">

  <header class="topbar">
      <div class="brand">
            <span class="brand-mark">◈</span>
                  <div>
                          <h1>Depósito</h1>
                                  <p>cadastro e controle de produtos</p>
                                        </div>
                                            </div>
                                              </header>

                                                <section class="stats" id="stats">
                                                    <div class="stat-pill">
                                                          <span class="stat-value" id="stat-total">0</span>
                                                                <span class="stat-label">produtos</span>
                                                                    </div>
                                                                        <div class="stat-pill">
                                                                              <span class="stat-value" id="stat-itens">0</span>
                                                                                    <span class="stat-label">itens em estoque</span>
                                                                                        </div>
                                                                                            <div class="stat-pill">
                                                                                                  <span class="stat-value" id="stat-valor">R$ 0,00</span>
                                                                                                        <span class="stat-label">valor total</span>
                                                                                                            </div>
                                                                                                                <div class="stat-pill warn" id="stat-baixo-pill">
                                                                                                                      <span class="stat-value" id="stat-baixo">0</span>
                                                                                                                            <span class="stat-label">estoque baixo</span>
                                                                                                                                </div>
                                                                                                                                  </section>

                                                                                                                                    <div class="grid">

                                                                                                                                        <section class="glass form-card">
                                                                                                                                              <h2>Cadastrar produto</h2>
                                                                                                                                                    <form id="form-produto">

                                                                                                                                                            <div class="field">
                                                                                                                                                                      <input type="text" id="codigo" placeholder=" " required>
                                                                                                                                                                                <label for="codigo">Código</label>
                                                                                                                                                                                        </div>

                                                                                                                                                                                                <div class="field">
                                                                                                                                                                                                          <input type="text" id="descricao" placeholder=" " required>
                                                                                                                                                                                                                    <label for="descricao">Descrição</label>
                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                    <div class="field-row">
                                                                                                                                                                                                                                              <div class="field">
                                                                                                                                                                                                                                                          <input type="number" id="quantidade" min="0" step="1" placeholder=" " required>
                                                                                                                                                                                                                                                                      <label for="quantidade">Quantidade</label>
                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                          <div class="field">
                                                                                                                                                                                                                                                                                                      <input type="text" inputmode="decimal" id="valor" placeholder=" " required>
                                                                                                                                                                                                                                                                                                                  <label for="valor">Valor (R$)</label>
                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                            <button type="submit" class="btn-primary">
                                                                                                                                                                                                                                                                                                                                                      <span>Cadastrar produto</span>
                                                                                                                                                                                                                                                                                                                                                              </button>
                                                                                                                                                                                                                                                                                                                                                                      <div id="form-msg"></div>
                                                                                                                                                                                                                                                                                                                                                                            </form>
                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                    <section class="list-section">
                                                                                                                                                                                                                                                                                                                                                                                          <div class="list-head">
                                                                                                                                                                                                                                                                                                                                                                                                  <h2>Produtos cadastrados</h2>
                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                              <div id="lista-container"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                  </section>

                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                    </html>

                                                                                                                                                                                                                                                                                                                                                                                                                    Html
