
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>SocialHub</h1>
    <nav>
        <a href="#">Início</a>
        <a href="#publicar">Publicar</a>
        <a href="#feed">Feed</a>
    </nav>
</header>

<main>

    <section id="publicar" class="criar-post">
        <h2>Criar publicação</h2>

        <input type="text" id="nome" placeholder="Seu nome">

        <textarea id="mensagem"
        placeholder="O que você está pensando?"></textarea>

        <button onclick="publicar()">Publicar</button>
    </section>

    <section id="feed">
        <h2>Feed de publicações</h2>

        <div id="lista-posts">

            <article class="post">
                <h3>João Silva</h3>
                <p>Hoje foi um ótimo dia para aprender programação!</p>
                <button onclick="curtir(this)">♡ Curtir</button>
                <span>0 curtidas</span>
            </article>

            <article class="post">
                <h3>Maria Oliveira</h3>
                <p>Desenvolvendo novos projetos e aprendendo coisas novas!</p>
                <button onclick="curtir(this)">♡ Curtir</button>
                <span>0 curtidas</span>
            </article>

        </div>
    </section>

</main>

<footer>
    <p>© 2026 SocialHub - Mini Feed Social</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
