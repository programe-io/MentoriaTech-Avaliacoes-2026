<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Sistema de Controle de Estoque</h1>

        <!-- Seção de Cadastro -->
        <section class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-cadastro">
                <div class="form-group">
                    <label for="descricao">Descrição do Produto:</label>
                    <input type="text" id="descricao" required placeholder="Ex: Teclado Mecânico">
                </div>
                <div class="form-group-row">
                    <div class="form-group">
                        <label for="quantidade">Quantidade Inicial:</label>
                        <input type="number" id="quantidade" required min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="valor">Valor Unitário (R$):</label>
                        <input type="number" id="valor" required min="0.01" step="0.01" placeholder="0.00">
                    </div>
                </div>
                <button type="submit" class="btn-primary">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Seção de Operações / Atualizações -->
        <section class="card row-actions">
            <div>
                <h2>Atualizar Valor</h2>
                <form id="form-valor">
                    <input type="text" id="alt-valor-codigo" placeholder="Cód: PROD-1" required>
                    <input type="number" id="alt-valor-novo" placeholder="Novo Preço R$" step="0.01" required>
                    <button type="submit" class="btn-secondary">Alterar</button>
                </form>
            </div>
            <div>
                <h2>Somar Estoque</h2>
                <form id="form-qtd">
                    <input type="text" id="alt-qtd-codigo" placeholder="Cód: PROD-1" required>
                    <input type="number" id="alt-qtd-nova" placeholder="Qtd a somar" required>
                    <button type="submit" class="btn-secondary">Somar</button>
                </form>
            </div>
        </section>

        <!-- Mensagens de Feedback do Sistema -->
        <div id="mensagem" class="feedback"></div>

        <!-- Seção de Listagem -->
        <section class="card">
            <h2>Produtos Cadastrados</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor Unitário</th>
                            <th>Total em Estoque</th>
                        </tr>
                    </thead>
                    <tbody id="lista-produtos-corpo">
                        <!-- Inserido dinamicamente via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
