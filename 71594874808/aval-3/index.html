<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <!-- 6. Cadastro e Modelagem de Tarefa -->
        <section class="card">
            <h2>Nova Tarefa</h2>
            <form id="form-tarefa">
                <div class="form-group">
                    <label for="titulo">Título / Descrição:</label>
                    <input type="text" id="titulo" required placeholder="Ex: Estudar métodos de Array em JS">
                </div>
                <div class="form-group">
                    <label for="prioridade">Nível de Prioridade:</label>
                    <select id="prioridade" required>
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Adicionar Tarefa</button>
            </form>
        </section>

        <!-- 11. Alteração da Prioridade (Painel de Ações Rápidas) -->
        <section class="card row-actions">
            <div>
                <h2>Mudar Prioridade</h2>
                <form id="form-alterar-prioridade">
                    <input type="text" id="alt-prioridade-codigo" placeholder="Cód: TASK-1" required>
                    <select id="alt-prioridade-nova" required>
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                    <button type="submit" class="btn-secondary">Alterar</button>
                </form>
            </div>
        </section>

        <!-- Mensagens de Feedback do Sistema -->
        <div id="mensagem" class="feedback"></div>

        <!-- 8. Listagem das Tarefas Cadastradas -->
        <section class="card">
            <h2>Lista de Atividades</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Tarefa</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-tarefas-corpo">
                        <!-- Inserido dinamicamente via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
