<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <h1>📦 Cadastro de Produtos</h1>
            <p>Cadastre, visualize e atualize seus produtos.</p>
        </header>

        <main>

            <!-- Cadastro -->
            <section class="card">
                <h2>Cadastrar Produto</h2>

                <form id="formProduto">

                    <div class="campo">
                        <label for="descricao">Descrição</label>
                        <input
                            type="text"
                            id="descricao"
                            placeholder="Digite a descrição do produto"
                            required
                        >
                    </div>

                    <div class="linha">

                        <div class="campo">
                            <label for="quantidade">Quantidade</label>
                            <input
                                type="number"
                                id="quantidade"
                                min="1"
                                placeholder="Ex: 10"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="valor">Valor</label>
                            <input
                                type="number"
                                id="valor"
                                min="0"
                                step="0.01"
                                placeholder="Ex: 49.90"
                                required
                            >
                        </div>

                    </div>

                    <button type="submit" class="btn btn-primary">
                        Cadastrar Produto
                    </button>

                </form>
            </section>


            <!-- Atualização -->
            <section class="card">
                <h2>Atualizar Produto</h2>

                <div class="linha">

                    <div class="campo">
                        <label for="codigoAtualizar">Código do Produto</label>
                        <input
                            type="number"
                            id="codigoAtualizar"
                            min="1"
                            placeholder="Código"
                        >
                    </div>

                    <div class="campo">
                        <label for="novoValor">Novo Valor</label>
                        <input
                            type="number"
                            id="novoValor"
                            min="0"
                            step="0.01"
                            placeholder="Novo valor"
                        >
                    </div>

                </div>

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="atualizarValorTela()"
                >
                    Atualizar Valor
                </button>
            </section>


            <!-- Quantidade -->
            <section class="card">
                <h2>Atualizar Quantidade</h2>

                <div class="linha">

                    <div class="campo">
                        <label for="codigoQuantidade">Código do Produto</label>
                        <input
                            type="number"
                            id="codigoQuantidade"
                            min="1"
                            placeholder="Código"
                        >
                    </div>

                    <div class="campo">
                        <label for="novaQuantidade">Quantidade</label>
                        <input
                            type="number"
                            id="novaQuantidade"
                            min="1"
                            placeholder="Quantidade"
                        >
                    </div>

                </div>

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="atualizarQuantidadeTela()"
                >
                    Atualizar Quantidade
                </button>
            </section>


            <!-- Lista -->
            <section class="card">
                <div class="titulo-lista">
                    <div>
                        <h2>Produtos Cadastrados</h2>
                        <p>Lista de produtos cadastrados no sistema.</p>
                    </div>

                    <span id="contador">0 produtos</span>
                </div>

                <div class="tabela-container">

                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descrição</th>
                                <th>Quantidade</th>
                                <th>Valor</th>
                            </tr>
                        </thead>

                        <tbody id="listaProdutos">
                            <tr>
                                <td colspan="4" class="vazio">
                                    Nenhum produto cadastrado.
                                </td>
                            </tr>
                        </tbody>
                    </table>

                </div>
            </section>

        </main>

        <footer>
            Sistema de Cadastro de Produtos
        </footer>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
