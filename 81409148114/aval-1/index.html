v<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elenco do Flamengo</title>
    <style>
        /* --- ESTILIZAÇÃO CSS --- */
        
        /* Reset de margens e fontes */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #121212; /* Fundo escuro para destacar o Rubro-Negro */
            color: #ffffff;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #e53935; /* Vermelho Flamengo */
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        .subtitle {
            text-align: center;
            color: #fdd835; /* Dourado para os detalhes */
            font-style: italic;
            margin-bottom: 40px;
        }

        /* Container dos Jogadores (Grid Responsivo) */
        .grid-jogadores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Card Individual do Jogador */
        .card-jogador {
            background: linear-gradient(145deg, #1c1c1c, #252525);
            border-top: 5px solid #e53935; /* Detalhe em vermelho no topo */
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Efeito de Hover (Passar o mouse) */
        .card-jogador:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 24px rgba(229, 57, 53, 0.3); /* Brilho vermelho */
        }

        /* Container da Imagem para controlar o zoom */
        .foto-container {
            width: 100%;
            height: 300px;
            overflow: hidden;
            background-color: #0a0a0a;
            position: relative;
        }

        /* Imagem do Jogador */
        .foto-jogador {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta a foto sem distorcer */
            object-position: top center; /* Foca no rosto/corpo do jogador */
            transition: transform 0.3s ease;
        }

        /* Zoom na foto ao passar o mouse */
        .card-jogador:hover .foto-jogador {
            transform: scale(1.05);
        }

        /* Informações do Jogador */
        .info-jogador {
            padding: 20px;
        }

        .numero-camisa {
            display: inline-block;
            background-color: #e53935;
            color: white;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .nome-jogador {
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .posicao-jogador {
            font-size: 0.9rem;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Manto Sagrado</h1>
    <p class="subtitle">Craques do Elenco Rubro-Negro</p>

    <div class="grid-jogadores">

        <div class="card-jogador">
            <div class="foto-container">
                <img src="https://s.sde.globo.com/atleta/00/00/70/42/70420_80x80.png" alt="Arrascaeta" class="foto-jogador" onerror="this.src='https://placehold.co/300x300/222/fff?text=CRF'">
            </div>
            <div class="info-jogador">
                <span class="numero-camisa">N° 14</span>
                <h2 class="nome-jogador">De Arrascaeta</h2>
                <p class="posicao-jogador">Meio-Campista</p>
            </div>
        </div>

        <div class="card-jogador">
            <div class="foto-container">
                <img src="https://s.sde.globo.com/atleta/00/00/87/11/87114_80x80.png" alt="Pedro" class="foto-jogador" onerror="this.src='https://placehold.co/300x300/222/fff?text=CRF'">
            </div>
            <div class="info-jogador">
                <span class="numero-camisa">N° 9</span>
                <h2 class="nome-jogador">Pedro</h2>
                <p class="posicao-jogador">Atacante</p>
            </div>
        </div>

        <div class="card-jogador">
            <div class="foto-container">
                <img src="https://s.sde.globo.com/atleta/00/00/81/25/81255_80x80.png" alt="Gerson" class="foto-jogador" onerror="this.src='https://placehold.co/300x300/222/fff?text=CRF'">
            </div>
            <div class="info-jogador">
                <span class="numero-camisa">N° 8</span>
                <h2 class="nome-jogador">Gerson</h2>
                <p class="posicao-jogador">Meio-Campista</p>
            </div>
        </div>

    </div>

</body>
</html>
