<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unificação: HTML, CSS e JS</title>
    
    <!-- 🎨 PARTE 1: CSS (Estilização da Página) -->
    <style>
        /* Estilo global herdado pelo corpo da página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Estilo do cartão principal */
        .cartao-ativacao {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }

        h2 {
            color: #333333;
            margin-bottom: 20px;
        }

        /* Estilo do campo de recebimento de texto */
        .campo-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #cccccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        /* Efeito visual quando o usuário clica no input */
        .campo-input:focus {
            border-color: #4a90e2;
            outline: none;
        }

        /* Estilo do botão moderno */
        .botao-enviar {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }

        .botao-enviar:hover {
            background-color: #357abd;
        }

        /* Área onde o resultado será exibido */
        .resultado-mensagem {
            margin-top: 20px;
            font-size: 15px;
            font-weight: bold;
            color: #555555;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- 🧱 PARTE 2: HTML (Estrutura dos Elementos) -->
    <div class="cartao-ativacao">
        <h2>Ativação de Sistema</h2>
        
        <!-- Input para o recebimento do código digitado -->
        <input type="text" id="codigoUsuario" class="campo-input" placeholder="Digite seu código aqui...">
        
        <button id="botaoValidar" class="botao-enviar">Validar Código</button>
        
        <!-- Parágrafo que receberá o texto dinâmico do JavaScript -->
        <p id="mensagemStatus" class="resultado-mensagem">Aguardando envio...</p>
    </div>

    <!-- ⚡ PARTE 3: JAVASCRIPT (Lógica e Interatividade) -->
    <script>
        // Seleção dos elementos do HTML utilizando seus IDs
        const botao = document.getElementById("botaoValidar");
        const inputCodigo = document.getElementById("codigoUsuario");
        const statusTexto = document.getElementById("mensagemStatus");

        // Evento que escuta o clique do botão
        botao.addEventListener("click", function() {
            // let recebe o valor atual digitado dentro do input
            let codigoDigitado = inputCodigo.value.trim();

            // Validação simples do dado recebido
            if (codigoDigitado === "") {
                statusTexto.innerText = "❌ Erro: O campo não pode ficar vazio!";
                statusTexto.style.color = "#e74c3c"; // Altera a cor do texto para vermelho
            } else {
                // Exibe de forma dinâmica o código que foi coletado
                statusTexto.innerText = "🚀 Sucesso! Código [" + codigoDigitado + "] recebido e validado.";
                statusTexto.style.color = "#2ecc71"; // Altera a cor do texto para verde
            }
        });
    </script>

<script src="script.js"></script></body>
</html>
