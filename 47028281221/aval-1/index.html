<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🛍️ Minha Loja</h1>
  <input type="text" id="busca" placeholder="Buscar produtos...">
  <button id="abrirCarrinho">🛒 Carrinho (<span id="quantidade">0</span>)</button>
</header>

<main>
  <h2>Produtos</h2>
  <section id="produtos" class="produtos"></section>
</main>

<div id="carrinho" class="carrinho">
  <div class="carrinho-conteudo">
    <button id="fecharCarrinho" class="fechar">✕</button>
    <h2>Seu Carrinho</h2>
    <div id="itensCarrinho"></div>
    <h3>Total: R$ <span id="total">0,00</span></h3>
    <button id="finalizar" class="finalizar">Finalizar compra</button>
  </div>
</div>

<script src="script.js"></script>
  <script src="script.js"></script>
  
</body>
</html>
