<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>

        <div class="header-content">

            <h1> Mini Feed</h1>

            <nav>
                <a href="#">Inicio</a>
                <a href="#">Perfil</a>
            </nav>

        </div>

    </header>

        
    <main>

       <section class="new-post">

        <div class="user">

            <div class="avatar">
                LO
            </div>

            <div>

                <strong> Luis Otavio </strong>
                <span> O que voçe esta pençando? </span>

            </div>

        </div>

        <button>Publicar</button>


       </section>

       <article class="post">
           
        <div class="post-header">
            
             <div class="avatar">
                P 
             </div> 

        </div>

            <div>
                <strong>Paula</strong>
                <span>Há 10 minutos</span>
            </div>

            <div class="post-text">
                Eu amo essa musica !
            </div>
            
            
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxZaFGvh0LXeFEh3v9dyDKcShgXHIwVgvZ9iQR1iJgfQ&s=10">

            <div clas="post-actions">                
                <button>Curtir</button>
                <button>Comentar</button>
            </div>


       </article>
    
    </main>

    <footer>
        <p>Mini Feed - Luis Otavio - Todos os Direitos Reservados | 2026</p>
    </footer>
    
</body>
</html>
