<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felipe Oliveira</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#050505,#111,#001b33,#0044aa,#000);
background-size:500% 500%;
animation:bg 15s ease infinite;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

.card{

position:relative;
width:400px;
padding:45px;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.15);
box-shadow:
0 0 20px rgba(0,191,255,.2),
0 0 60px rgba(0,191,255,.1);

overflow:hidden;
text-align:center;

}

.card::before{

content:'';
position:absolute;
top:-2px;
left:-2px;
right:-2px;
bottom:-2px;

background:linear-gradient(
45deg,
#00bfff,
#0066ff,
#00ffff,
#0044ff,
#00bfff
);

background-size:400%;
border-radius:28px;
z-index:-1;

animation:border 8s linear infinite;

}

@keyframes border{

0%{background-position:0%;}
100%{background-position:400%;}

}

.avatar{

width:150px;
height:150px;
margin:auto;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;

font-size:60px;
font-weight:bold;

background:linear-gradient(135deg,#00bfff,#0044ff);

box-shadow:
0 0 20px #00bfff,
0 0 40px #00bfff,
0 0 80px #00bfff;

animation:pulse 2s infinite;

}

@keyframes pulse{

0%{
transform:scale(1);
box-shadow:0 0 20px #00bfff;
}

50%{
transform:scale(1.08);
box-shadow:
0 0 40px #00ffff,
0 0 80px #00bfff;
}

100%{
transform:scale(1);
box-shadow:0 0 20px #00bfff;
}

}

h1{

margin-top:25px;
font-size:38px;
letter-spacing:2px;

text-shadow:
0 0 10px #00bfff,
0 0 20px #00bfff;

}

h3{

margin-top:10px;
font-weight:300;
color:#00d9ff;

}

p{

margin-top:20px;
line-height:1.8;
color:#ddd;

}

button{

margin-top:30px;
padding:15px 40px;
border:none;
border-radius:40px;

background:linear-gradient(90deg,#00bfff,#005eff);

color:white;
font-size:17px;
cursor:pointer;

transition:.4s;

}

button:hover{

transform:scale(1.08);

box-shadow:
0 0 20px #00bfff,
0 0 50px #00bfff;

}

</style>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<canvas id="canvas"></canvas>

<div class="card">

<div class="avatar">
FO
</div>

<h1>Felipe Oliveira</h1>

<h3>DESIGN • TECNOLOGIA • ESTILO</h3>

<p>

Bem-vindo ao meu espaço digital.
Criatividade, elegância e tecnologia
em um visual futurista.

</p>

<button onclick="alert('Bem-vindo Felipe Oliveira!')">

ENTRAR

</button>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

for(let i=0;i<120;i++){

particles.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,

r:Math.random()*3,

dx:(Math.random()-0.5),
dy:(Math.random()-0.5)

});

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{

ctx.beginPath();

ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

ctx.fillStyle="rgba(0,191,255,.8)";
ctx.fill();

p.x+=p.dx;
p.y+=p.dy;

if(p.x<0)p.x=canvas.width;
if(p.x>canvas.width)p.x=0;

if(p.y<0)p.y=canvas.height;
if(p.y>canvas.height)p.y=0;

});

requestAnimationFrame(animate);

}

animate();

window.onresize=()=>{

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

</script>

</body>
</html>
