<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="container">
    <h1>Controle de IMC</h1>
    <p class="subtitle">Preencha os dados do paciente para calcular o índice.</p>

    <form id="imc-form">
      <div class="input-group">
        <label for="nome">Nome do Paciente</label>
        <input type="text" id="nome" placeholder="Ex: João Silva" required>
      </div>

      <div class="input-row">
        <div class="input-group">
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" step="0.1" min="1" placeholder="Ex: 75.5" required>
        </div>

        <div class="input-group">
          <label for="altura">Altura (m)</label>
          <input type="number" id="altura" step="0.01" min="0.5" max="3" placeholder="Ex: 1.75" required>
        </div>
      </div>

      <button type="submit">Calcular IMC</button>
    </form>

    <!-- Área de exibição do resultado (oculta inicialmente) -->
    <section id="resultado" class="resultado-box hidden" aria-live="polite">
      <h2>Resultado</h2>
      <p id="mensagem-paciente"></p>
      <div class="imc-destaque">
        <span>IMC: <strong id="valor-imc">0.00</strong></span>
        <span id="classificacao-badge" class="badge"></span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
