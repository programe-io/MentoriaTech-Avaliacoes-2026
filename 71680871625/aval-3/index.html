<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média Escolar</title>
    <!-- Link para o CSS externo -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="card">
        <h1>Média Bimestral</h1>
        <p>Insira as 4 notas do aluno (0 a 10):</p>
        
        <div class="form-group">
            <input type="number" id="nota1" placeholder="Nota 1º Bimestre" min="0" max="10" step="0.1">
            <input type="number" id="nota2" placeholder="Nota 2º Bimestre" min="0" max="10" step="0.1">
            <input type="number" id="nota3" placeholder="Nota 3º Bimestre" min="0" max="10" step="0.1">
            <input type="number" id="nota4" placeholder="Nota 4º Bimestre" min="0" max="10" step="0.1">
        </div>

        <button onclick="calcularMedia()">Calcular Média</button>

        <!-- Container para o resultado -->
        <div id="resultado-container" class="hidden">
            <h2>Média Final: <span id="valor-media">0.0</span></h2>
            <p id="status-aluno"></p>
        </div>
    </div>

    <!-- Link para o JS externo -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
