<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas Pro</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Gerenciador de Tarefas</h1>
      <p>Organize suas atividades com controle de prioridade e status</p>
    </header>

    <main>
      <!-- Formulário de Cadastro -->
      <section class="card form-section">
        <h2>Nova Tarefa</h2>
        <form id="task-form" novalidate>
          <div class="form-group">
            <label for="task-title">Título da Tarefa</label>
            <input 
              type="text" 
              id="task-title" 
              placeholder="Ex: Estudar manipulação do DOM (mín. 5 caracteres)" 
              required
            >
          </div>

          <div class="form-group">
            <label for="task-priority">Prioridade</label>
            <select id="task-priority" required>
              <option value="1">1 - Alta</option>
              <option value="2" selected>2 - Média</option>
              <option value="3">3 - Baixa</option>
            </select>
          </div>

          <button type="submit" class="btn-primary">Cadastrar Tarefa</button>
        </form>
        <div id="feedback-message" class="feedback" aria-live="polite"></div>
      </section>

      <!-- Listagem de Tarefas -->
      <section class="card list-section">
        <div class="list-header">
          <h2>Tarefas Cadastradas</h2>
          <span id="task-counter" class="badge">0 tarefas</span>
        </div>
        
        <ul id="task-list" class="task-list">
          <!-- Os itens serão inseridos dinamicamente via JavaScript -->
        </ul>
        <p id="empty-state" class="empty-state">Nenhuma tarefa cadastrada no momento.</p>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
