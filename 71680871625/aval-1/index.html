<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h1>Controle de Estoque</h1>

    <!-- Formulário de Cadastro -->
    <div class="card">
        <h2>Cadastrar Novo Produto</h2>
        <div class="form-group">
            <input type="text" id="p-codigo" placeholder="Código (Ex: 001)">
            <input type="text" id="p-descricao" placeholder="Descrição">
            <input type="number" id="p-quantidade" placeholder="Quantidade" min="0">
            <input type="number" id="p-valor" placeholder="Valor (R$)" step="0.01" min="0">
        </div>
        <button onclick="cadastrarProduto()">Adicionar Produto</button>
    </div>

    <!-- Listagem de Produtos -->
    <div class="card">
        <h2>Produtos Cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor Unitário</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-produtos">
                <!-- Linhas inseridas dinamicamente via JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- Link para o arquivo JavaScript externo -->
<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
