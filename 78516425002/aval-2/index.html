<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"><link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <div class="header-content">
            <h1>BFeed</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="new-post">
            <div class="user">
                <div class="avatar">F</div>
                <div>
                    <strong>Fulano</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>
            <button>Publicar</button>
        </section>
        <article class="post">
            <div class="post-header">
                <div class="avatar">B</div>
                <div>
                    <strong>Beltrano</strong>
                    <span>Há 5 minutos</span>
                </div>
            </div>
            <div class="post-text">Maratonei todos os episódios de SÉRIE, ABSOLUTE CINEMA!</div>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR29RdEPY3x74GsbuPotl_hZp2yXBxFbJGqjeXabr37Xw&s=10" alt="Imagem de uma mão fazendo o gesto Legal">
            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>
        </article>
    </main>
    <footer>
        <p>&copy; BFeed - Todos os direitos reservados 2026</p>
    </footer>
</body>
</html>
