
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexão Piauí</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h1>🌵 Conexão Piauí</h1>
    <p>Nosso estado, nossa história!</p>
  </header>

  <main>
    <section class="nova-publicacao">
      <h2>Compartilhe o Piauí!</h2>
      <input id="autor" placeholder="Seu nome">
      <textarea id="mensagem"
        placeholder="O que você quer compartilhar?"></textarea>
      <button id="publicar">Publicar</button>
    </section>

    <section id="feed">
      <article class="post">
        <h3>@turismopiauiense</h3>
        <img
          src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800"
          alt="Paisagem natural">
        <p>🌄 As belezas naturais do nosso Piauí!</p>
        <button class="curtir">❤️ Curtir <span>12</span></button>
        <div class="comentarios">
          <input placeholder="Escreva um comentário...">
          <button class="comentar">Enviar</button>
          <div class="lista-comentarios"></div>
        </div>
      </article>

      <article class="post">
        <h3>@cultura_piaui</h3>
        <p>💚 Orgulho de ser piauiense!
          Nossa cultura e nossas tradições são únicas.</p>
        <button class="curtir">❤️ Curtir <span>25</span></button>
        <div class="comentarios">
          <input placeholder="Escreva um comentário...">
          <button class="comentar">Enviar</button>
          <div class="lista-comentarios"></div>
        </div>
      </article>
    </section>
  </main>

  <footer>Feito com ❤️ no Piauí</footer>
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
