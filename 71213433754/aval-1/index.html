
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Tarefas</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 30px 15px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #0001;
}

h1 {
    text-align: center;
    color: #1e293b;
}

.form {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

input {
    flex: 1;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
    min-width: 0;
}

button {
    padding: 12px 15px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px;
    background: #f8fafc;
    border-radius: 7px;
    margin-bottom: 10px;
}

li.concluida span {
    text-decoration: line-through;
    color: #94a3b8;
}

.acoes {
    display: flex;
    gap: 5px;
}

.concluir {
    background: #16a34a;
}

.excluir {
    background: #dc2626;
}

.contador {
    color: #64748b;
    text-align: center;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">
    <h1>📝 Gerenciador de Tarefas</h1>

    <div class="form">
        <input
            type="text"
            id="tarefa"
            placeholder="Digite uma tarefa..."
        >
        <button onclick="adicionarTarefa()">Adicionar</button>
    </div>

    <ul id="lista"></ul>

    <p class="contador" id="contador">
        Nenhuma tarefa cadastrada
    </p>
</div>

<script>
let tarefas = JSON.parse(
    localStorage.getItem("tarefas")
) || [];

function salvar() {
    localStorage.setItem(
        "tarefas",
        JSON.stringify(tarefas)
    );
}

function adicionarTarefa() {
    const input = document.getElementById("tarefa");
    const texto = input.value.trim();

    if (texto === "") {
        alert("Digite uma tarefa!");
        return;
    }

    tarefas.push({
        id: Date.now(),
        texto: texto,
        concluida: false
    });

    input.value = "";
    salvar();
    renderizar();
}

function concluirTarefa(id) {
    tarefas = tarefas.map(tarefa => {
        if (tarefa.id === id) {
            tarefa.concluida = !tarefa.concluida;
        }
        return tarefa;
    });

    salvar();
    renderizar();
}

function excluirTarefa(id) {
    tarefas = tarefas.filter(
        tarefa => tarefa.id !== id
    );

    salvar();
    renderizar();
}

function renderizar() {
    const lista = document.getElementById("lista");
    const contador = document.getElementById("contador");

    lista.innerHTML = "";

    tarefas.forEach(tarefa => {
        const li = document.createElement("li");

        if (tarefa.concluida) {
            li.classList.add("concluida");
        }

        const span = document.createElement("span");
        span.textContent = tarefa.texto;

        const acoes = document.createElement("div");
        acoes.className = "acoes";

        const concluir = document.createElement("button");
        concluir.textContent = tarefa.concluida
            ? "Desfazer"
            : "Concluir";
        concluir.className = "concluir";
        concluir.onclick = () => concluirTarefa(tarefa.id);

        const excluir = document.createElement("button");
        excluir.textContent = "Excluir";
        excluir.className = "excluir";
        excluir.onclick = () => excluirTarefa(tarefa.id);

        acoes.append(concluir, excluir);
        li.append(span, acoes);
        lista.appendChild(li);
    });

    const concluidas = tarefas.filter(
        t => t.concluida
    ).length;

    contador.textContent =
        `${tarefas.length} tarefas | ${concluidas} concluídas | ${tarefas.length - concluidas} pendentes`;
}

document.getElementById("tarefa").addEventListener(
    "keydown",
    event => {
        if (event.key === "Enter") {
            adicionarTarefa();
        }
    }
);

renderizar();
</script>

</body>
</html>
