
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Estoque</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    color: #1e293b;
}

.resumo {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin: 20px 0;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #0001;
}

.card h3 {
    color: #64748b;
    font-size: 14px;
}

.card p {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 0;
}

.formulario, .tabela {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px #0001;
}

.campos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
}

input, select {
    width: 100%;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
}

button {
    padding: 11px 15px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

button:hover {
    opacity: .85;
}

.btn-adicionar {
    margin-top: 15px;
}

.btn-excluir {
    background: #dc2626;
}

.btn-editar {
    background: #d97706;
}

.btn-entrada {
    background: #16a34a;
}

.btn-saida {
    background: #7c3aed;
}

.tabela-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 13px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
}

th {
    background: #f8fafc;
}

.baixo {
    color: #dc2626;
    font-weight: bold;
}

.normal {
    color: #16a34a;
    font-weight: bold;
}

.acoes {
    display: flex;
    gap: 5px;
}

.acoes button {
    padding: 8px;
}

#pesquisa {
    margin-bottom: 15px;
}

@media(max-width: 500px) {
    body {
        padding: 12px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

<h1>📦 Sistema de Estoque</h1>
<p>Controle de produtos, entradas e saídas.</p>

<div class="resumo">

    <div class="card">
        <h3>Total de produtos</h3>
        <p id="totalProdutos">0</p>
    </div>

    <div class="card">
        <h3>Unidades em estoque</h3>
        <p id="totalUnidades">0</p>
    </div>

    <div class="card">
        <h3>Valor do estoque</h3>
        <p id="valorEstoque">R$ 0,00</p>
    </div>

    <div class="card">
        <h3>Estoque baixo</h3>
        <p id="estoqueBaixo">0</p>
    </div>

</div>

<div class="formulario">

<h2 id="tituloFormulario">Cadastrar Produto</h2>

<div class="campos">

    <input id="nome" placeholder="Nome do produto">

    <input id="categoria" placeholder="Categoria">

    <input id="quantidade" type="number" min="0" placeholder="Quantidade">

    <input id="preco" type="number" min="0" step="0.01" placeholder="Preço (R$)">

    <input id="minimo" type="number" min="0" placeholder="Estoque mínimo">

</div>

<button class="btn-adicionar" onclick="salvarProduto()">
    Salvar Produto
</button>

<button onclick="cancelarEdicao()" id="cancelar" style="display:none;background:#64748b">
    Cancelar
</button>

</div>

<div class="tabela">

<h2>Lista de Produtos</h2>

<input
    id="pesquisa"
    placeholder="🔎 Pesquisar produto..."
    oninput="renderizar()"
>

<div class="tabela-container">

<table>
<thead>
<tr>
    <th>Produto</th>
    <th>Categoria</th>
    <th>Quantidade</th>
    <th>Preço</th>
    <th>Status</th>
    <th>Ações</th>
</tr>
</thead>

<tbody id="listaProdutos"></tbody>
</table>

</div>

</div>
</div>

<script>

let produtos = JSON.parse(
    localStorage.getItem("estoque")
) || [];

let editando = null;

function salvarDados() {
    localStorage.setItem(
        "estoque",
        JSON.stringify(produtos)
    );
}

function salvarProduto() {

    const nome = document.getElementById("nome").value.trim();
    const categoria = document.getElementById("categoria").value.trim();
    const quantidade = Number(document.getElementById("quantidade").value);
    const preco = Number(document.getElementById("preco").value);
    const minimo = Number(document.getElementById("minimo").value);

    if (!nome || !categoria ||
        document.getElementById("quantidade").value === "" ||
        document.getElementById("preco").value === "" ||
        document.getElementById("minimo").value === "") {
        alert("Preencha todos os campos!");
        return;
    }

    if (
        !Number.isFinite(quantidade) ||
        !Number.isFinite(preco) ||
        !Number.isFinite(minimo) ||
        quantidade < 0 ||
        preco < 0 ||
        minimo < 0 ||
        !Number.isInteger(quantidade) ||
        !Number.isInteger(minimo)
    ) {
        alert("Informe valores válidos!");
        return;
    }

    if (editando !== null) {

        const produto = produtos.find(p => p.id === editando);

        produto.nome = nome;
        produto.categoria = categoria;
        produto.quantidade = quantidade;
        produto.preco = preco;
        produto.minimo = minimo;

        editando = null;

    } else {

        produtos.push({
            id: Date.now(),
            nome,
            categoria,
            quantidade,
            preco,
            minimo
        });

    }

    limparFormulario();
    salvarDados();
    renderizar();
}

function editarProduto(id) {

    const produto = produtos.find(p => p.id === id);

    document.getElementById("nome").value = produto.nome;
    document.getElementById("categoria").value = produto.categoria;
    document.getElementById("quantidade").value = produto.quantidade;
    document.getElementById("preco").value = produto.preco;
    document.getElementById("minimo").value = produto.minimo;

    editando = id;

    document.getElementById("tituloFormulario").textContent =
        "Editar Produto";

    document.getElementById("cancelar").style.display = "inline-block";
}

function cancelarEdicao() {
    editando = null;
    limparFormulario();
}

function excluirProduto(id) {

    if (!confirm("Deseja excluir este produto?")) return;

    produtos = produtos.filter(p => p.id !== id);

    salvarDados();
    renderizar();
}

function movimentar(id, tipo) {

    const produto = produtos.find(p => p.id === id);

    const quantidade = Number(
        prompt("Informe a quantidade:")
    );

    if (
        !Number.isInteger(quantidade) ||
        quantidade <= 0
    ) {
        alert("Quantidade inválida!");
        return;
    }

    if (tipo === "entrada") {

        produto.quantidade += quantidade;

    } else {

        if (quantidade > produto.quantidade) {
            alert("Estoque insuficiente!");
            return;
        }

        produto.quantidade -= quantidade;
    }

    salvarDados();
    renderizar();
}

function limparFormulario() {

    document.getElementById("nome").value = "";
    document.getElementById("categoria").value = "";
    document.getElementById("quantidade").value = "";
    document.getElementById("preco").value = "";
    document.getElementById("minimo").value = "";

    document.getElementById("tituloFormulario").textContent =
        "Cadastrar Produto";

    document.getElementById("cancelar").style.display = "none";
}

function renderizar() {

    const lista = document.getElementById("listaProdutos");

    const pesquisa = document.getElementById("pesquisa")
        .value.toLowerCase();

    lista.innerHTML = "";

    const filtrados = produtos.filter(p =>
        p.nome.toLowerCase().includes(pesquisa) ||
        p.categoria.toLowerCase().includes(pesquisa)
    );

    filtrados.forEach(p => {

        const status = p.quantidade <= p.minimo
            ? '<span class="baixo">Estoque baixo</span>'
            : '<span class="normal">Normal</span>';

        const linha = document.createElement("tr");

        const valores = [
            p.nome,
            p.categoria,
            p.quantidade,
            p.preco.toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL"
            })
        ];

        valores.forEach(valor => {
            const td = document.createElement("td");
            td.textContent = valor;
            linha.appendChild(td);
        });

        const tdStatus = document.createElement("td");
        tdStatus.innerHTML = status;
        linha.appendChild(tdStatus);

        const tdAcoes = document.createElement("td");
        const acoes = document.createElement("div");
        acoes.className = "acoes";

        const botoes = [
            ["Editar", "btn-editar", () => editarProduto(p.id)],
            ["Entrada", "btn-entrada", () => movimentar(p.id, "entrada")],
            ["Saída", "btn-saida", () => movimentar(p.id, "saida")],
            ["Excluir", "btn-excluir", () => excluirProduto(p.id)]
        ];

        botoes.forEach(([texto, classe, funcao]) => {
            const botao = document.createElement("button");
            botao.textContent = texto;
            botao.className = classe;
            botao.onclick = funcao;
            acoes.appendChild(botao);
        });

        tdAcoes.appendChild(acoes);
        linha.appendChild(tdAcoes);

        lista.appendChild(linha);

    });

    document.getElementById("totalProdutos").textContent =
        produtos.length;

    document.getElementById("totalUnidades").textContent =
        produtos.reduce((soma, p) => soma + p.quantidade, 0);

    const valor = produtos.reduce(
        (soma, p) => soma + p.quantidade * p.preco, 0
    );

    document.getElementById("valorEstoque").textContent =
        valor.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });

    document.getElementById("estoqueBaixo").textContent =
        produtos.filter(p => p.quantidade <= p.minimo).length;
}

renderizar();

</script>

</body>
</html>
