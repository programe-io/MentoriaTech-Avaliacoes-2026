
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gerenciador de Tarefas</title>

<style>
body {
    font-family: Arial;
    background: #e9eef5;
    padding: 20px;
}

.container {
    background: white;
    max-width: 650px;
    margin: auto;
    padding: 25px;
    border-radius: 10px;
}

h1, h2 {
    color: #174a7e;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    box-sizing: border-box;
}

button {
    padding: 10px;
    margin: 5px;
    background: #1769aa;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.tarefa {
    background: #f1f4f8;
    padding: 15px;
    margin-top: 12px;
    border-left: 5px solid #1769aa;
}

.concluida {
    border-left-color: green;
}

.alta { color: red; }
.media { color: orange; }
.baixa { color: green; }

#mensagem {
    font-weight: bold;
}
</style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

<h1>Gerenciador de Tarefas</h1>

<h2>Cadastrar Tarefa</h2>

<label>Código:</label>
<input type="number" id="codigo" placeholder="Digite o código">

<label>Título:</label>
<input type="text" id="titulo" placeholder="Digite o título">

<label>Prioridade:</label>
<select id="prioridade">
    <option value="">Selecione</option>
    <option value="1">1 - Alta</option>
    <option value="2">2 - Média</option>
    <option value="3">3 - Baixa</option>
</select>

<button type="button" onclick="cadastrarTarefa()">
Cadastrar Tarefa
</button>

<p id="mensagem"></p>

<h2>Lista de Tarefas</h2>

<div id="listaTarefas">
Nenhuma tarefa cadastrada.
</div>

<h2>Resumo</h2>

<p>Total: <span id="total">0</span></p>
<p>Pendentes: <span id="pendentes">0</span></p>
<p>Concluídas: <span id="concluidas">0</span></p>

</div>

<script>

let tarefas = [];

function cadastrarTarefa() {

    let codigo = Number(document.getElementById("codigo").value);

    let titulo = document.getElementById("titulo").value.trim();

    let prioridade = document.getElementById("prioridade").value;

    let mensagem = document.getElementById("mensagem");

    if (!Number.isInteger(codigo) || codigo <= 0) {
        mensagem.style.color = "red";
        mensagem.innerHTML = "Digite um código válido!";
        return;
    }

    if (titulo.length < 5) {
        mensagem.style.color = "red";
        mensagem.innerHTML = "O título precisa ter pelo menos 5 caracteres!";
        return;
    }

    if (!["1", "2", "3"].includes(prioridade)) {
        mensagem.style.color = "red";
        mensagem.innerHTML = "Selecione uma prioridade válida!";
        return;
    }

    if (tarefas.some(t => t.codigo === codigo)) {
        mensagem.style.color = "red";
        mensagem.innerHTML = "Este código já existe!";
        return;
    }

    let tarefa = {
        codigo: codigo,
        titulo: titulo,
        prioridade: Number(prioridade),
        concluida: false
    };

    tarefas.push(tarefa);

    mensagem.style.color = "green";
    mensagem.innerHTML = "Tarefa cadastrada com sucesso!";

    document.getElementById("codigo").value = "";
    document.getElementById("titulo").value = "";
    document.getElementById("prioridade").value = "";

    listarTarefas();

}

function listarTarefas() {

    let lista = document.getElementById("listaTarefas");

    lista.innerHTML = "";

    tarefas.forEach(function(tarefa) {

        let div = document.createElement("div");

        div.className = tarefa.concluida
            ? "tarefa concluida"
            : "tarefa";

        let nomes = {
            1: "Alta",
            2: "Média",
            3: "Baixa"
        };

        let classes = {
            1: "alta",
            2: "media",
            3: "baixa"
        };

        div.innerHTML = `
            <h3>${tarefa.titulo}</h3>

            <p>Código: ${tarefa.codigo}</p>

            <p class="${classes[tarefa.prioridade]}">
                Prioridade: ${nomes[tarefa.prioridade]}
            </p>

            <p>Status: ${tarefa.concluida ? "Concluída" : "Pendente"}</p>

            <button type="button" onclick="marcarConcluida(${tarefa.codigo})">
                Concluir
            </button>

            <button type="button" onclick="alterarPrioridade(${tarefa.codigo})">
                Alterar Prioridade
            </button>
        `;

        lista.appendChild(div);

    });

    atualizarResumo();

}

function marcarConcluida(codigo) {

    let tarefa = tarefas.find(t => t.codigo === codigo);

    if (tarefa) {
        tarefa.concluida = true;
        listarTarefas();
    }

}

function alterarPrioridade(codigo) {

    let tarefa = tarefas.find(t => t.codigo === codigo);

    let nova = prompt("Digite 1 (Alta), 2 (Média) ou 3 (Baixa):");

    if (nova === null) return;

    if (!["1", "2", "3"].includes(nova)) {
        alert("Prioridade inválida!");
        return;
    }

    tarefa.prioridade = Number(nova);

    listarTarefas();

}

function atualizarResumo() {

    let concluidas = tarefas.filter(t => t.concluida).length;

    document.getElementById("total").innerHTML = tarefas.length;

    document.getElementById("pendentes").innerHTML =
        tarefas.length - concluidas;

    document.getElementById("concluidas").innerHTML = concluidas;

}

</script>

<script src="script.js"></script></body>
</html>
