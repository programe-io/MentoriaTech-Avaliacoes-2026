
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <header>
            <div>
                <h1>TaskFlow <span>✓</span></h1>
                <p>Organize suas tarefas e alcance seus objetivos.</p>
            </div>
            <div class="user-icon">👤</div>
        </header>

        <section class="dashboard">

            <div class="stat-card">
                <span>📋</span>
                <h3 id="total">0</h3>
                <p>Total de tarefas</p>
            </div>

            <div class="stat-card">
                <span>⏳</span>
                <h3 id="pending">0</h3>
                <p>Pendentes</p>
            </div>

            <div class="stat-card">
                <span>✅</span>
                <h3 id="completed">0</h3>
                <p>Concluídas</p>
            </div>

        </section>

        <section class="progress-section">
            <div class="progress-info">
                <h3>Seu progresso</h3>
                <strong id="percentage">0%</strong>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>
        </section>

        <section class="task-section">

            <h2>Minhas tarefas</h2>

            <div class="add-task">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Digite uma nova tarefa..."
                >

                <select id="priority">
                    <option value="baixa">Baixa</option>
                    <option value="media" selected>Média</option>
                    <option value="alta">Alta</option>
                </select>

                <input type="date" id="dateInput">

                <button onclick="addTask()">+ Adicionar</button>
            </div>

            <div class="filters">

                <button class="filter active" data-filter="todas">
                    Todas
                </button>

                <button class="filter" data-filter="pendentes">
                    Pendentes
                </button>

                <button class="filter" data-filter="concluidas">
                    Concluídas
                </button>

            </div>

            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Pesquisar tarefa..."
            >

            <div id="taskList"></div>

        </section>

        <footer>
            <p>TaskFlow © 2026 - Organize seu dia!</p>
        </footer>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
