<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="topo">
        <h1>📦 Sistema de Estoque</h1>
        <p>Gerencie seus produtos de forma simples</p>
    </header>

    <main class="container">

        <section class="resumo">
            <div class="card">
                <h3>Total de produtos</h3>
                <p id="totalProdutos">0</p>
            </div>

            <div class="card">
                <h3>Itens em estoque</h3>
                <p id="totalItens">0</p>
            </div>

            <div class="card">
                <h3>Valor do estoque</h3>
                <p id="valorEstoque">R$ 0,00</p>
            </div>
        </section>

        <section class="formulario">
            <h2 id="tituloFormulario">Cadastrar produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="codigo">Código</label>
                    <input type="number" id="codigo"
                        placeholder="Ex: 1" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao"
                        placeholder="Nome do produto" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade"
                        min="1" placeholder="Ex: 10" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor unitário</label>
                    <input type="number" id="valor"
                        min="0" step="0.01"
                        placeholder="Ex: 50.00" required>
                </div>

                <button type="submit" id="botaoSalvar">
                    Cadastrar produto
                </button>

                <button type="button" id="botaoCancelar"
                    class="cancelar" hidden>
                    Cancelar edição
                </button>

            </form>
        </section>

        <section class="lista">
            <div class="cabecalhoLista">
                <h2>Produtos cadastrados</h2>

                <input type="text" id="pesquisa"
                    placeholder="Pesquisar produto...">
            </div>

            <div class="tabelaContainer">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaProdutos">
                    </tbody>
                </table>
            </div>

            <p id="mensagemVazia">
                Nenhum produto cadastrado.
            </p>
        </section>

    </main>

    <footer>
        <p>Sistema de Estoque &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
