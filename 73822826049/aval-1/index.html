<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque — Projeto CRUD</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="app">

    <header class="app-header">
      <span class="app-header__mark">#</span>
      <div>
        <h1>Estoque</h1>
        <p>Cadastro, listagem e atualização de produtos</p>
      </div>
    </header>

    <main class="layout">

      <!-- Cadastro de produto -->
      <section class="panel" aria-labelledby="titulo-cadastro">
        <h2 id="titulo-cadastro">Cadastrar produto</h2>
        <p class="dica">O código é gerado automaticamente pelo sistema.</p>

        <form id="form-cadastro" novalidate>
          <div class="campo">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" placeholder="Mínimo de 5 caracteres" required>
          </div>

          <div class="campo-linha">
            <div class="campo">
              <label for="quantidade">Quantidade inicial</label>
              <input type="number" id="quantidade" min="1" step="1" placeholder="0" required>
            </div>

            <div class="campo">
              <label for="valor">Valor (R$)</label>
              <input type="number" id="valor" min="0" step="0.01" placeholder="0,00" required>
            </div>
          </div>

          <button type="submit" class="botao botao--principal">Cadastrar produto</button>
          <p id="mensagem-cadastro" class="mensagem" role="status"></p>
        </form>
      </section>

      <!-- Listagem -->
      <section class="panel panel--lista" aria-labelledby="titulo-lista">
        <div class="painel-topo">
          <h2 id="titulo-lista">Produtos em estoque</h2>
          <span id="contador" class="contador">0 itens</span>
        </div>

        <div id="lista-vazia" class="vazio">
          Nenhum produto cadastrado ainda. Use o formulário ao lado para começar.
        </div>

        <div class="tabela-wrap">
          <table id="tabela-estoque" class="tabela" hidden>
            <thead>
              <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
                <th>Total</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="corpo-tabela">
              <!-- linhas geradas via JavaScript -->
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- Modal de atualização -->
  <div id="modal-atualizacao" class="modal" hidden>
    <div class="modal__caixa" role="dialog" aria-labelledby="titulo-modal" aria-modal="true">
      <h2 id="titulo-modal">Atualizar produto</h2>
      <p id="modal-produto-info" class="modal__info"></p>

      <!-- Valor: substitui o valor atual -->
      <div class="bloco-acao">
        <label for="novo-valor">Novo valor (substitui o atual)</label>
        <div class="campo-acao">
          <input type="number" id="novo-valor" min="0" step="0.01" placeholder="0,00">
          <button type="button" id="botao-atualizar-valor" class="botao botao--pequeno">Atualizar valor</button>
        </div>
        <p id="mensagem-valor" class="mensagem" role="status"></p>
      </div>

      <!-- Quantidade: soma ao estoque existente -->
      <div class="bloco-acao">
        <label for="quantidade-adicionar">Quantidade a adicionar (soma ao estoque)</label>
        <div class="campo-acao">
          <input type="number" id="quantidade-adicionar" min="1" step="1" placeholder="0">
          <button type="button" id="botao-adicionar-quantidade" class="botao botao--pequeno">Adicionar ao estoque</button>
        </div>
        <p id="mensagem-quantidade" class="mensagem" role="status"></p>
      </div>

      <div class="modal__acoes">
        <button type="button" class="botao botao--secundario" id="botao-fechar-modal">Fechar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
