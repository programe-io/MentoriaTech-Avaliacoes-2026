<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="topo">
  <div class="topo-conteudo">
    <h1>Gerenciador de Tarefas</h1>
    <p class="sub">Cadastre, liste, conclua e altere a prioridade das suas tarefas.</p>
  </div>
</header>

<main>
  <section class="card">
    <div id="form" class="form">
      <div class="campo">
        <label for="titulo">Título (mínimo 5 caracteres)</label>
        <input id="titulo" type="text" autocomplete="off" placeholder="Ex.: Estudar JavaScript">
      </div>
      <div class="campo pequeno">
        <label for="prioridade">Prioridade</label>
        <select id="prioridade">
          <option value="1">1 – Alta</option>
          <option value="2" selected>2 – Média</option>
          <option value="3">3 – Baixa</option>
        </select>
      </div>
      <button type="button" id="cadastrar">Cadastrar</button>
    </div>
    <div id="erro" class="erro" role="alert"></div>
  </section>

  <section class="card lista-card">
    <div class="filtros">
      <button class="sec" data-filtro="todas">Todas</button>
      <button class="sec" data-filtro="pendentes">Pendentes</button>
      <button class="sec" data-filtro="concluidas">Concluídas</button>
    </div>
    <ul id="lista"></ul>
  </section>
</main>
  <script src="script.js"></script>
  
</body>
</html>
