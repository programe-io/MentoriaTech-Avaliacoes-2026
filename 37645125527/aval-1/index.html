<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Controle de Estoque</h1>

        <!-- Mensagens de Feedback (Sucesso / Erro) -->
        <div id="mensagem" class="mensagem oculto"></div>

        <!-- Formulário de Cadastro -->
        <section class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="formCadastro">
                <div class="form-group">
                    <label for="descricao">Descrição (Mín. 5 caracteres):</label>
                    <input type="text" id="descricao" required placeholder="Ex: Cadeira gamer">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="quantidade">Quantidade (Mín. 1):</label>
                        <input type="number" id="quantidade" min="1" required placeholder="Ex: 10">
                    </div>
                    <div class="form-group">
                        <label for="valor">Valor (R$):</label>
                        <input type="number" id="valor" step="0.01" min="0" required placeholder="Ex: 699.00">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Ações e Listagem de Produtos -->
        <section class="card">
            <div class="header-listagem">
                <h2>Produtos no Estoque</h2>
                <button id="btnAtualizarLista" class="btn btn-secondary">Atualizar Lista</button>
            </div>
            
            <table id="tabelaProdutos">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Qtd. Estoque</th>
                        <th>Valor (R$)</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <!-- Produtos cadastrados serão renderizados aqui -->
                </tbody>
            </table>
        </section>
    </div>

    <!-- Modal para Atualizar Valor -->
    <div id="modalValor" class="modal oculto">
        <div class="modal-conteudo">
            <h3>Atualizar Valor do Produto</h3>
            <form id="formAtualizarValor">
                <input type="hidden" id="modalValorCodigo">
                <div class="form-group">
                    <label for="novoValorInput">Novo Valor (R$):</label>
                    <input type="number" id="novoValorInput" step="0.01" min="0" required>
                </div>
                <div class="modal-acoes">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <button type="button" class="btn btn-cancelar" onclick="fecharModais()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para Adicionar Quantidade -->
    <div id="modalQuantidade" class="modal oculto">
        <div class="modal-conteudo">
            <h3>Somar Quantidade ao Estoque</h3>
            <form id="formAtualizarQuantidade">
                <input type="hidden" id="modalQtdCodigo">
                <div class="form-group">
                    <label for="novaQtdInput">Quantidade a adicionar (Mín. 1):</label>
                    <input type="number" id="novaQtdInput" min="1" required>
                </div>
                <div class="modal-acoes">
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                    <button type="button" class="btn btn-cancelar" onclick="fecharModais()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
