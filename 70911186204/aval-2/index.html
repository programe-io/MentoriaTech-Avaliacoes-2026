<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
        }

        .calculadora {
            width: 300px;
            background-color: #22252d;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        #visor {
            width: 100%;
            height: 70px;
            background-color: #2a2d37;
            color: #fff;
            text-align: right;
            padding: 20px;
            font-size: 1.8rem;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow-x: auto;
        }

        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            background-color: #2a2d37;
            color: #fff;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #3b3f4c;
        }

        .operador {
            background-color: #30313d;
            color: #ff9500;
        }

        .igual {
            background-color: #ff9500;
            color: #fff;
        }

        .limpar {
            background-color: #a5a5a5;
            color: #000;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="calculadora">
        <div id="visor">0</div>
        <div class="botoes">
            <button class="limpar" onclick="limparVisor()">C</button>
            <button class="operador" onclick="adicionar('/')">÷</button>
            <button class="operador" onclick="adicionar('*')">×</button>
            <button class="operador" onclick="apagarUltimo()">⌫</button>

            <button onclick="adicionar('7')">7</button>
            <button onclick="adicionar('8')">8</button>
            <button onclick="adicionar('9')">9</button>
            <button class="operador" onclick="adicionar('-')">−</button>

            <button onclick="adicionar('4')">4</button>
            <button onclick="adicionar('5')">5</button>
            <button onclick="adicionar('6')">6</button>
            <button class="operador" onclick="adicionar('+')">+</button>

            <button onclick="adicionar('1')">1</button>
            <button onclick="adicionar('2')">2</button>
            <button onclick="adicionar('3')">3</button>
            <button class="igual" onclick="calcular()">=</button>

            <button onclick="adicionar('0')" style="grid-column: span 2;">0</button>
            <button onclick="adicionar('.')">.</button>
        </div>
    </div>

    <script>
        const visor = document.getElementById('visor');

        function adicionar(valor) {
            if (visor.innerText === '0' && valor !== '.') {
                visor.innerText = valor;
            } else {
                visor.innerText += valor;
            }
        }

        function limparVisor() {
            visor.innerText = '0';
        }

        function apagarUltimo() {
            if (visor.innerText.length > 1) {
                visor.innerText = visor.innerText.slice(0, -1);
            } else {
                visor.innerText = '0';
            }
        }

        function calcular() {
            try {
                // Substitui os símbolos visuais pelos operadores do JS
                let expressao = visor.innerText.replace(/÷/g, '/').replace(/×/g, '*');
                visor.innerText = eval(expressao);
            } catch (e) {
                visor.innerText = 'Erro';
            }
        }
    </script>

<script src="script.js"></script></body>
</html>
