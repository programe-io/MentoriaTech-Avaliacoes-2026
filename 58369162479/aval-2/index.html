<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SportFeed</title>

    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="logo">
            🏆 SportFeed
        </div>

        <p>O seu feed de notícias e opiniões sobre esportes!</p>
    </header>

    <main>

        <!-- Criar publicação -->
        <section class="criar-post">

            <h2>🏅 Compartilhe seu momento esportivo</h2>

            <input
                type="text"
                id="nome"
                placeholder="Seu nome"
            >

            <select id="esporte">
                <option value="⚽ Futebol">⚽ Futebol</option>
                <option value="🏀 Basquete">🏀 Basquete</option>
                <option value="🏐 Vôlei">🏐 Vôlei</option>
                <option value="🏎️ Fórmula 1">🏎️ Fórmula 1</option>
                <option value="🎾 Tênis">🎾 Tênis</option>
                <option value="🏃 Corrida">🏃 Corrida</option>
                <option value="🏊 Natação">🏊 Natação</option>
            </select>

            <textarea
                id="textoPost"
                placeholder="O que você está pensando sobre esporte?"
            ></textarea>

            <button onclick="publicar()">
                📢 Publicar
            </button>

        </section>


        <!-- Feed -->
        <section class="feed">

            <h2>🔥 Feed esportivo</h2>

            <div id="listaPosts">

                <!-- Post inicial -->
                <article class="post">

                    <div class="post-topo">

                        <div class="avatar">
                            J
                        </div>

                        <div>
                            <strong>João</strong>

                            <small>
                                ⚽ Futebol • Agora
                            </small>
                        </div>

                    </div>

                    <p>
                        Hoje foi dia de acompanhar aquele jogão!
                        ⚽🔥 Qual foi o melhor momento da partida?
                    </p>

                    <div class="acoes">

                        <button onclick="curtir(this)">
                            ❤️ Curtir <span>0</span>
                        </button>

                        <button onclick="excluirPost(this)">
                            🗑️ Excluir
                        </button>

                    </div>

                </article>

            </div>

        </section>

    </main>

    <footer>
        <p>🏆 SportFeed © 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
