
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <aside class="sidebar">
        <h2 class="logo">Instagram</h2>

        <nav>
            <a href="#">🏠 Início</a>
            <a href="#">🔍 Pesquisa</a>
            <a href="#">🧭 Explorar</a>
            <a href="#">🎬 Reels</a>
            <a href="#">💬 Mensagens</a>
            <a href="#">❤️ Notificações</a>
            <a href="#">➕ Criar</a>
            <a href="#">👤 Perfil</a>
        </nav>
    </aside>

    <main class="container">

        <section class="stories">
            <div class="story">
                <img src="https://i.pravatar.cc/100?img=1">
                <span>Seu story</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=2">
                <span>Maria</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=3">
                <span>Pedro</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=4">
                <span>Ana</span>
            </div>

            <div class="story">
                <img src="https://i.pravatar.cc/100?img=5">
                <span>Lucas</span>
            </div>
        </section>

        <section class="feed">

            <article class="post">
                <div class="post-header">
                    <img src="https://i.pravatar.cc/100?img=2">
                    <strong>maria_dev</strong>
                    <span>•••</span>
                </div>

                <img class="post-image"
                src="https://picsum.photos/id/1011/600/600">

                <div class="post-actions">
                    <button class="like">♡</button>
                    <button>💬</button>
                    <button>➤</button>
                    <button class="save">♧</button>
                </div>

                <div class="post-content">
                    <strong class="likes">120 curtidas</strong>
                    <p><strong>maria_dev</strong> Aproveitando a natureza! 🌳❤️</p>

                    <div class="comments"></div>

                    <form class="comment-form">
                        <input type="text" placeholder="Adicione um comentário...">
                        <button type="submit">Publicar</button>
                    </form>
                </div>
            </article>

            <article class="post">
                <div class="post-header">
                    <img src="https://i.pravatar.cc/100?img=3">
                    <strong>pedro_fotografia</strong>
                    <span>•••</span>
                </div>

                <img class="post-image"
                src="https://picsum.photos/id/1015/600/600">

                <div class="post-actions">
                    <button class="like">♡</button>
                    <button>💬</button>
                    <button>➤</button>
                    <button class="save">♧</button>
                </div>

                <div class="post-content">
                    <strong class="likes">85 curtidas</strong>
                    <p><strong>pedro_fotografia</strong> Um dia incrível! 📸</p>

                    <div class="comments"></div>

                    <form class="comment-form">
                        <input type="text" placeholder="Adicione um comentário...">
                        <button type="submit">Publicar</button>
                    </form>
                </div>
            </article>

        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
