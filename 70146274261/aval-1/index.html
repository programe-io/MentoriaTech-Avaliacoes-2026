<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sistema de Estoque - Desafio Geral</title>
<style>
  body{font-family:Arial;padding:20px;background:#f4f6f8}
    .box{background:white;padding:20px;border-radius:10px;max-width:600px;margin:auto;box-shadow:0 2px 10px #ccc}
      input,button{padding:8px;margin:5px;width:90%;border-radius:5px;border:1px solid #ccc}
        button{background:#0d2a54;color:white;cursor:pointer;font-weight:bold}
          button:hover{background:#1a4a8a}
            table{width:100%;border-collapse:collapse;margin-top:15px}
              th,td{border:1px solid #ddd;padding:8px;text-align:left}
                th{background:#0d2a54;color:white}
                </style>
                <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                <div class="box">
                  <h2>DESAFIO GERAL - Sistema de Estoque</h2>
                    
                      <h3>Cadastrar Produto</h3>
                        <input id="codigo" type="number" placeholder="Código">
                          <input id="descricao" type="text" placeholder="Descrição">
                            <input id="quantidade" type="number" placeholder="Quantidade">
                              <input id="valor" type="number" step="0.01" placeholder="Valor">
                                <button onclick="cadastrar()">Cadastrar um novo produto</button>

                                  <h3>Alterar Produto</h3>
                                    <input id="codigoAlt" type="number" placeholder="Código do produto">
                                      <input id="novoValor" type="number" step="0.01" placeholder="Novo valor">
                                        <button onclick="alterarValor()">Alterar o valor de um produto</button>
                                          <input id="novaQtd" type="number" placeholder="Nova quantidade">
                                            <button onclick="alterarQtd()">Alterar a quantidade de um produto</button>

                                              <button onclick="listar()" style="background:#00b894;margin-top:15px">Listar os produtos cadastrados</button>

                                                <table id="tabela">
                                                    <thead><tr><th>Código</th><th>Descrição</th><th>Qtd</th><th>Valor</th></tr></thead>
                                                        <tbody></tbody>
                                                          </table>
                                                          </div>

                                                          <script>
                                                          // Simulando um sistema de estoque de produtos (código, descrição, quantidade e valor)
                                                          let estoque = [];

                                                          function cadastrar(){
                                                            let codigo = Number(document.getElementById('codigo').value);
                                                              let descricao = document.getElementById('descricao').value;
                                                                let quantidade = Number(document.getElementById('quantidade').value);
                                                                  let valor = Number(document.getElementById('valor').value);

                                                                    if(!codigo || !descricao){ alert("Preencha código e descrição!"); return; }
                                                                      if(estoque.find(p=>p.codigo===codigo)){ alert("Código já existe!"); return; }

                                                                        estoque.push({codigo, descricao, quantidade, valor});
                                                                          alert("Produto cadastrado!");
                                                                            listar();
                                                                              document.getElementById('codigo').value='';
                                                                                document.getElementById('descricao').value='';
                                                                                  document.getElementById('quantidade').value='';
                                                                                    document.getElementById('valor').value='';
                                                                                    }

                                                                                    function listar(){
                                                                                      let tbody = document.querySelector('#tabela tbody');
                                                                                        tbody.innerHTML='';
                                                                                          estoque.forEach(p=>{
                                                                                              tbody.innerHTML+=`<tr><td>${p.codigo}</td><td>${p.descricao}</td><td>${p.quantidade}</td><td>R$ ${p.valor.toFixed(2)}</td></tr>`;
                                                                                                });
                                                                                                }

                                                                                                function alterarValor(){
                                                                                                  let codigo = Number(document.getElementById('codigoAlt').value);
                                                                                                    let novoValor = Number(document.getElementById('novoValor').value);
                                                                                                      let prod = estoque.find(p=>p.codigo===codigo);
                                                                                                        if(prod){ prod.valor = novoValor; alert("Valor alterado!"); listar(); }
                                                                                                          else alert("Produto não encontrado!");
                                                                                                          }

                                                                                                          function alterarQtd(){
                                                                                                            let codigo = Number(document.getElementById('codigoAlt').value);
                                                                                                              let novaQtd = Number(document.getElementById('novaQtd').value);
                                                                                                                let prod = estoque.find(p=>p.codigo===codigo);
                                                                                                                  if(prod){ prod.quantidade = novaQtd; alert("Quantidade alterada!"); listar(); }
                                                                                                                    else alert("Produto não encontrado!");
                                                                                                                    }
                                                                                                                    </script>
                                                                                                                    <script src="script.js"></script></body>
                                                                                                                    </html>
