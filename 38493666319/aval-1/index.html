<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sistema simples para cadastrar e atualizar produtos em estoque." />
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
  <body>
    <main class="container">
      <header class="cabecalho">
        <p class="sobretitulo">CONTROLE DE PRODUTOS</p>
        <h1>Gerenciador de estoque</h1>
        <p class="descricao">Cadastre produtos e mantenha os valores e quantidades atualizados.</p>
      </header>

      <section class="painel" aria-labelledby="titulo-cadastro">
        <h2 id="titulo-cadastro">Cadastrar produto</h2>
        <form id="form-produto">
          <div class="campo campo-descricao">
            <label for="descricao">Descrição do produto</label>
            <input id="descricao" name="descricao" type="text" maxlength="120" placeholder="Ex.: Teclado sem fio" required />
          </div>
          <div class="campo">
            <label for="quantidade">Quantidade</label>
            <input id="quantidade" name="quantidade" type="number" min="0" step="1" placeholder="0" required />
          </div>
          <div class="campo">
            <label for="valor">Valor unitário (R$)</label>
            <input id="valor" name="valor" type="number" min="0" step="0.01" placeholder="0,00" required />
          </div>
          <button class="botao botao-principal" type="submit">Adicionar produto</button>
          <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="painel painel-lista" aria-labelledby="titulo-lista">
        <div class="lista-cabecalho">
          <div>
            <h2 id="titulo-lista">Produtos cadastrados</h2>
            <p id="resumo" class="resumo">0 produtos</p>
          </div>
        </div>
        <ul id="lista-produtos" class="lista-produtos" aria-live="polite"></ul>
      </section>

      <footer>Os produtos ficam salvos neste navegador.</footer>
    </main>
  <script src="script.js"></script></body>
</html>
