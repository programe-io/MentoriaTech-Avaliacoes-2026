<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Aplicativo simples para organizar tarefas por prioridade e status." />
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
  <body>
    <main class="container">
      <header class="cabecalho">
        <p class="sobretitulo">ORGANIZAÇÃO PESSOAL</p>
        <h1>Gerenciador de tarefas</h1>
        <p class="descricao">Cadastre suas tarefas, acompanhe o andamento e ajuste as prioridades.</p>
      </header>

      <section class="painel" aria-labelledby="titulo-cadastro">
        <h2 id="titulo-cadastro">Nova tarefa</h2>
        <form id="form-tarefa">
          <div class="campo">
            <label for="titulo">Título</label>
            <input
              id="titulo"
              name="titulo"
              type="text"
              minlength="5"
              maxlength="120"
              placeholder="Ex.: Preparar apresentação"
              required
            />
            <small>O título deve ter pelo menos 5 caracteres.</small>
          </div>

          <div class="campo campo-prioridade">
            <label for="prioridade">Prioridade</label>
            <select id="prioridade" name="prioridade" required>
              <option value="1">1 — Alta</option>
              <option value="2" selected>2 — Média</option>
              <option value="3">3 — Baixa</option>
            </select>
          </div>

          <button class="botao botao-principal" type="submit">Adicionar tarefa</button>
          <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="painel painel-lista" aria-labelledby="titulo-lista">
        <div class="lista-cabecalho">
          <div>
            <h2 id="titulo-lista">Minhas tarefas</h2>
            <p id="resumo" class="resumo">0 tarefas</p>
          </div>
        </div>
        <ul id="lista-tarefas" class="lista-tarefas" aria-live="polite"></ul>
      </section>

      <footer>As tarefas ficam salvas neste navegador.</footer>
    </main>
  <script src="script.js"></script></body>
</html>
