<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaFeed - Rede Social</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="container">
      <div class="logo">InstaFeed</div>
      <div class="nav-icons">
        <i class="fas fa-home"></i>
        <i class="fas fa-paper-plane"></i>
        <i class="fas fa-plus-square"></i>
        <i class="fas fa-compass"></i>
        <i class="fas fa-heart"></i>
        <img src="https://i.pravatar.cc/150?img=12" alt="Perfil" class="profile-pic">
      </div>
    </div>
  </header>

  <!-- Stories -->
  <section class="stories-container">
    <div class="stories" id="stories">
      <!-- Stories serão gerados pelo JS -->
    </div>
  </section>

  <!-- Feed -->
  <main class="feed" id="feed">
    <!-- Posts serão gerados pelo JS -->
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
