<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceBook - Rede Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>facebook</h1>
    <input type="text" placeholder="Pesquisar no Facebook">
</header>

<main>
    <section class="perfil">
        <h2>Bem-vindo à sua rede social!</h2>
        <p>Conecte-se com seus amigos e compartilhe momentos.</p>
    </section>

    <section class="criar-post">
        <h3>Criar publicação</h3>
        <textarea id="mensagem" placeholder="No que você está pensando?"></textarea>
        <button onclick="publicar()">Publicar</button>
    </section>

    <section id="publicacoes">
        <article class="post">
            <h3>Maria Silva</h3>
            <p>Olá, pessoal! Bem-vindos à minha página!</p>
            <button onclick="curtir(this)">👍 Curtir</button>
            <span>0 curtidas</span>
        </article>
    </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
