<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="card">
            <div class="user">
                <div class="avatar">C</div>
                <div>
                    <strong>Piettro</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>
            <button>Publicar</button>
        </section>

        <article class="card">
            <div class="post-header">
                <div class="avatar">M</div>
                <div>
                    <strong>Piettro</strong>
                    <span>Há 10 minutos</span>
                </div>
            </div>

            <p class="post-text">
                Hoje é um ótimo dia para aprender coisas novas!
            </p>

            <img src="https://picsum.photos/600/300"
                 alt="Imagem de paisagem">

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>
        </article>

    </main>

    <footer>
        <p>© 2026 - Mini Feed. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
