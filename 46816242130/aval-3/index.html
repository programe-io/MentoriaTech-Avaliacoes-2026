<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTGRAM - Rede Social de Futebol</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>FUT<span>GRAM</span></h1>
        <input type="text" id="pesquisa" placeholder="Pesquisar publicações...">
    </header>

    <main>
        <section class="stories">
            <div class="story">⚽<p>Futebol</p></div>
            <div class="story">🏆<p>Campeões</p></div>
            <div class="story">🥅<p>Goleiros</p></div>
            <div class="story">🔥<p>Torcida</p></div>
        </section>

        <section class="criar-post">
            <h2>Nova publicação</h2>
            <form id="formPost">
                <input type="text" id="nome" placeholder="Seu nome" required>
                <textarea id="legenda" placeholder="O que está acontecendo no futebol?" required></textarea>
                <input type="url" id="imagem" placeholder="Link de uma imagem (opcional)">
                <button type="submit">Publicar</button>
            </form>
        </section>

        <section id="publicacoes">
            <article class="post">
                <h3>futebol_br</h3>
                <img src="https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=900" alt="Estádio de futebol">
                <p>Que espetáculo! A paixão pelo futebol nunca acaba! ⚽</p>
                <button class="curtir">♡ Curtir</button>
                <span class="contador">0 curtidas</span>
                <div class="comentarios"></div>
                <form class="form-comentario">
                    <input type="text" placeholder="Escreva um comentário..." required>
                    <button type="submit">Enviar</button>
                </form>
            </article>

            <article class="post">
                <h3>craques_news</h3>
                <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=900" alt="Bola de futebol no gramado">
                <p>Dia de jogo é dia de emoção. Quem está preparado?</p>
                <button class="curtir">♡ Curtir</button>
                <span class="contador">0 curtidas</span>
                <div class="comentarios"></div>
                <form class="form-comentario">
                    <input type="text" placeholder="Escreva um comentário..." required>
                    <button type="submit">Enviar</button>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>© 2026 FUTGRAM - Comunidade de Futebol</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
