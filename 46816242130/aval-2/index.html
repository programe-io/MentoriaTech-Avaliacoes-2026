
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Futebol</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>⚽ FUTEBOL FEED</h1>
    <p>Compartilhe sua paixão pelo futebol!</p>
</header>

<main>

    <section class="criar">
        <h2>Nova publicação</h2>
        <input type="text" id="nome" placeholder="Seu nome">
        <textarea id="texto" placeholder="Escreva sua publicação..."></textarea>
        <input type="text" id="foto" placeholder="Cole o link da foto">
        <button onclick="publicar()">Publicar</button>
    </section>

    <section id="feed">

        <article class="post">
            <h3>João Silva</h3>
            <p>O futebol é uma paixão mundial!</p>
            <img src="https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=800" alt="Estádio de futebol">
            <button onclick="curtir(this)">❤️ Curtir <span>15</span></button>
        </article>

        <article class="post">
            <h3>Pedro Santos</h3>
            <p>Uma partida emocionante!</p>
            <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=800" alt="Bola de futebol">
            <button onclick="curtir(this)">❤️ Curtir <span>28</span></button>
        </article>

    </section>

</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
