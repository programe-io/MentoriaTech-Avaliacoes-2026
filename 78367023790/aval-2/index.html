<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>

        <div class="header-content">

            <h1>MiniFeed</h1>

            <nav>
                <a href="#">Inicio</a>
                <a href="#">Perfil</a>
            </nav>


        </div>

    </header>

    <main>

        <section class="new-post">

            <div class="user">

                <div class="avatar">
                    P
                </div>

                <div>
                  <strong>pressão</strong>
                  <span>o que voce está pensando?</span>
                </div>

            </div>

            <button>Publicar</button>


        </section>

        <article class="post">

            <div class="post-header">

             <div class="avatar">
                    G
                </div>

                <div>
                  <strong>Guilherme</strong>
                  <span>Há 10 minutos</span>
                </div>

            </div>

            <div class="post-text">
                Hoje eu vi a serie de la casa de papel
            </div>
            <img src="https://th.bing.com/th/id/R.f7fa61e6c9a8fec26c7363f908a10f97?rik=WXLyAGaMBpz6tw&pid=ImgRaw&r=0" alt="Imagem do la casa de papel">

            <div class="post-actions">

                <button>Curtir</button>
                <button>Comentar</button>

            </div>


        </article>



    </main>

    <footer>
        <p>MiniFeed - Todos os Direitos Reservados guilherme silva - 2026</p>
    </footer>

    </body>
</html>
