
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Sistema de Estoque</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <header>
                            <h1>📦 Sistema de Estoque</h1>
                                    <p>Cadastro e controle de produtos</p>
                                        </header>

                                            <main>
                                                    <section class="card">
                                                                <h2>Cadastrar Produto</h2>

                                                                            <form id="formProduto">
                                                                                            <input type="number" id="codigo"
                                                                                                                placeholder="Código do produto" required min="1">

                                                                                                                                <input type="text" id="descricao"
                                                                                                                                                    placeholder="Descrição do produto" required>

                                                                                                                                                                    <input type="number" id="quantidade"
                                                                                                                                                                                        placeholder="Quantidade" required min="0">

                                                                                                                                                                                                        <input type="number" id="valor"
                                                                                                                                                                                                                            placeholder="Valor (R$)" required min="0" step="0.01">

                                                                                                                                                                                                                                            <button type="submit">Cadastrar Produto</button>
                                                                                                                                                                                                                                                        </form>
                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                        <section class="card">
                                                                                                                                                                                                                                                                                    <h2>Produtos Cadastrados</h2>

                                                                                                                                                                                                                                                                                                <div class="tabela">
                                                                                                                                                                                                                                                                                                                <table>
                                                                                                                                                                                                                                                                                                                                    <thead>
                                                                                                                                                                                                                                                                                                                                                            <tr>
                                                                                                                                                                                                                                                                                                                                                                                        <th>Código</th>
                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Descrição</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <th>Quantidade</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Valor</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <th>Ações</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <tbody id="listaProdutos"></tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p id="mensagem"></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>Sistema de Estoque © 2026</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
