
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>TaskFlow - Gerenciador de Tarefas</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <header>
              <h1>✓ TaskFlow</h1>
                  <p>Gerenciador de tarefas</p>
                    </header>

                      <main class="container">
                          <section class="boas-vindas">
                                <h2>Organize suas tarefas.</h2>
                                      <p>Cadastre, acompanhe e conclua suas atividades.</p>
                                          </section>

                                              <section class="estatisticas">
                                                    <div class="card">
                                                            <p>Total de tarefas</p>
                                                                    <strong id="totalTarefas">0</strong>
                                                                          </div>
                                                                                <div class="card">
                                                                                        <p>Concluídas</p>
                                                                                                <strong id="totalConcluidas">0</strong>
                                                                                                      </div>
                                                                                                            <div class="card">
                                                                                                                    <p>Pendentes</p>
                                                                                                                            <strong id="totalPendentes">0</strong>
                                                                                                                                  </div>
                                                                                                                                        <div class="card">
                                                                                                                                                <p>Progresso</p>
                                                                                                                                                        <strong id="progresso">0%</strong>
                                                                                                                                                              </div>
                                                                                                                                                                  </section>

                                                                                                                                                                      <section class="painel">
                                                                                                                                                                            <h2>Cadastrar tarefa</h2>
                                                                                                                                                                                  <form id="formTarefa">
                                                                                                                                                                                          <label for="titulo">Título da tarefa</label>
                                                                                                                                                                                                  <input id="titulo" type="text"
                                                                                                                                                                                                            placeholder="Ex.: Estudar JavaScript" required>

                                                                                                                                                                                                                    <label for="prioridade">Prioridade</label>
                                                                                                                                                                                                                            <select id="prioridade">
                                                                                                                                                                                                                                      <option value="1">1 - Baixa</option>
                                                                                                                                                                                                                                                <option value="2" selected>2 - Média</option>
                                                                                                                                                                                                                                                          <option value="3">3 - Alta</option>
                                                                                                                                                                                                                                                                  </select>

                                                                                                                                                                                                                                                                          <button type="submit">+ Adicionar tarefa</button>
                                                                                                                                                                                                                                                                                  <p id="mensagem"></p>
                                                                                                                                                                                                                                                                                        </form>
                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                <section class="painel">
                                                                                                                                                                                                                                                                                                      <h2>Minhas tarefas</h2>

                                                                                                                                                                                                                                                                                                            <input id="buscaCodigo" type="search"
                                                                                                                                                                                                                                                                                                                    placeholder="Buscar pelo código (T-001)">

                                                                                                                                                                                                                                                                                                                          <select id="filtroStatus">
                                                                                                                                                                                                                                                                                                                                  <option value="todas">Todas as tarefas</option>
                                                                                                                                                                                                                                                                                                                                          <option value="pendente">Pendentes</option>
                                                                                                                                                                                                                                                                                                                                                  <option value="concluida">Concluídas</option>
                                                                                                                                                                                                                                                                                                                                                        </select>

                                                                                                                                                                                                                                                                                                                                                              <div id="listaTarefas"></div>
                                                                                                                                                                                                                                                                                                                                                                    <div id="vazio">
                                                                                                                                                                                                                                                                                                                                                                            <p>Nenhuma tarefa cadastrada.</p>
                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                        <button id="limparConcluidas" class="secundario">
                                                                                                                                                                                                                                                                                                                                                                                                Limpar concluídas
                                                                                                                                                                                                                                                                                                                                                                                                      </button>
                                                                                                                                                                                                                                                                                                                                                                                                          </section>

                                                                                                                                                                                                                                                                                                                                                                                                              <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                    Projeto de revisão em JavaScript
                                                                                                                                                                                                                                                                                                                                                                                                                        </footer>
                                                                                                                                                                                                                                                                                                                                                                                                                          </main>

                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
