<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaliação Ninja</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9800,#ff5722,#ffcc80);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,.95);
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
    animation:entrada .8s;
}

@keyframes entrada{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.gif{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.gif img{
    width:180px;
    border-radius:15px;
}

h1{
    text-align:center;
    color:#ff6f00;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.pergunta{
    margin-bottom:20px;
}

label{
    font-weight:bold;
    color:#333;
}

textarea{
    width:100%;
    margin-top:10px;
    border:2px solid #ddd;
    border-radius:10px;
    padding:10px;
    resize:none;
}

.opcoes{
    margin-top:10px;
}

.opcoes label{
    display:block;
    margin:8px 0;
    cursor:pointer;
    font-weight:normal;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#ff6f00;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#e65100;
    transform:scale(1.02);
}
</style>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="card">

    <div class="gif">
        <!-- Troque o link pelo GIF do Naruto que você preferir -->
        <img src="https://media.tenor.com/0AVbKGY_MxMAAAAC/naruto.gif" alt="Naruto">
    </div>

    <h1>🍥 Avaliação Ninja 🍥</h1>
    <p>Sua missão é responder às perguntas abaixo!</p>

    <form>

        <div class="pergunta">
            <label>Como você avalia esta página?</label>

            <div class="opcoes">
                <label><input type="radio" name="nota"> ⭐⭐⭐⭐⭐ Excelente</label>
                <label><input type="radio" name="nota"> ⭐⭐⭐⭐ Muito boa</label>
                <label><input type="radio" name="nota"> ⭐⭐⭐ Boa</label>
                <label><input type="radio" name="nota"> ⭐⭐ Regular</label>
                <label><input type="radio" name="nota"> ⭐ Ruim</label>
            </div>
        </div>

        <div class="pergunta">
            <label>Qual personagem de Naruto você mais gosta?</label>
            <input type="text" style="width:100%;padding:10px;border:2px solid #ddd;border-radius:10px;margin-top:10px;">
        </div>

        <div class="pergunta">
            <label>Deixe um comentário:</label>
            <textarea rows="5" placeholder="Escreva aqui..."></textarea>
        </div>

        <button type="submit">🍜 Enviar Missão</button>

    </form>

</div>

</body>
</html>
