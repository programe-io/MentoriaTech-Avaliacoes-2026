<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Controle de IMC</h1>
        <p class="subtitulo">Sistema de avaliação do paciente</p>

        <form id="imc-form">

            <label for="nome">Nome do paciente:</label>
            <input type="text" id="nome"
                placeholder="Digite o nome do paciente" required>

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso"
                placeholder="Exemplo: 65" step="0.1" required>

            <label for="altura">Altura (m):</label>
            <input type="number" id="altura"
                placeholder="Exemplo: 1.70" step="0.01" required>

            <button type="submit">Calcular IMC</button>

        </form>

        <div id="resultado" class="resultado oculto">

            <h2>Resultado do paciente</h2>

            <p><strong>Nome:</strong>
                <span id="nome-paciente"></span>
            </p>

            <p><strong>Peso:</strong>
                <span id="peso-paciente"></span>
            </p>

            <p><strong>Altura:</strong>
                <span id="altura-paciente"></span>
            </p>

            <p><strong>IMC:</strong>
                <span id="valor-imc"></span>
            </p>

            <p><strong>Classificação:</strong>
                <span id="classificacao-imc"></span>
            </p>

            <p id="situacao-peso"></p>

        </div>

        <footer>
            Projeto Prático - Controle de IMC
        </footer>
    </div>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
