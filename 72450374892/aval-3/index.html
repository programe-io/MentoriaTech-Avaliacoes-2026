<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos no JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #btn-unico {
            background-color: #28a745;
        }
        #btn-unico:hover {
            background-color: #218838;
        }
    </style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Exemplo 1: Botão de clique único (Itens 6 e 7) -->
    <div class="container">
        <h2>Exemplo 1: Evento Único</h2>
        <button id="btn-unico">Acionar ação (Apenas uma vez)</button>
    </div>

    <!-- Exemplo 2: Projeto Prático - Soma de Dois Valores (Itens 8, 9, 10 e 11) -->
    <div class="container">
        <h2>Exemplo 2: Soma de Valores</h2>
        <form id="meu-formulario" onsubmit="event.preventDefault();">
            <div class="campo">
                <label biographies for="valor1">Primeiro Valor:</label>
                <input type="text" id="valor1" placeholder="Digite o primeiro número">
            </div>
            
            <div class="campo">
                <label for="valor2">Segundo Valor:</label>
                <input type="text" id="valor2" placeholder="Digite o segundo número">
            </div>

            <button type="button" id="btn-somar">Somar valores</button>
        </form>
    </div>

    <!-- Lógica JavaScript integrada (Item 1) -->
    <script>
        /* -------------------------------------------------------------
           6 e 7. PRIMEIRO EXEMPLO COM EVENTO DE CLIQUE (APENAS UMA VEZ)
           ------------------------------------------------------------- */
        // Selecionando o elemento com querySelector
        const botaoUnico = document.querySelector("#btn-unico");

        // Adicionando escuta com a opção { once: true }
        botaoUnico.addEventListener("click", () => {
            console.log("O botão foi acionado");
            alert("O botão foi acionado! Esta mensagem não aparecerá de novo.");
        }, { once: true });


        /* -------------------------------------------------------------
           9, 10 e 11. PROJETO PRÁTICO: SOMA DE DOIS VALORES
           ------------------------------------------------------------- */
        // Capturando os elementos do formulário pelo DOM usando getElementById
        const inputValor1 = document.getElementById("valor1");
        const inputValor2 = document.getElementById("valor2");
        const botaoSomar = document.getElementById("btn-somar");

        // Associando a ação de soma ao clique do botão
        botaoSomar.addEventListener("click", () => {
            // Acessando os valores dos inputs (retornam como texto)
            const texto1 = inputValor1.value;
            const texto2 = inputValor2.value;

            // Convertendo os textos em números com parseFloat
            const num1 = parseFloat(texto1);
            const num2 = parseFloat(texto2);

            // Validação simples para garantir que o usuário digitou números válidos
            if (isNaN(num1) || !texto1 || isNaN(num2) || !texto2) {
                alert("Por favor, digite valores numéricos válidos nos dois campos.");
                return;
            }

            // Realizando a soma
            const resultado = num1 + num2;

            // Demonstrando as saídas solicitadas no resumo (console e alert)
            console.log("Resultado da soma: " + resultado);
            alert("O resultado da soma é: " + resultado);
        });
    </script>

<script src="script.js"></script></body>
</html>
