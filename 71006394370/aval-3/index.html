<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista Interativa</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>📋 Lista Interativa</h1>

        <p>
            Projeto utilizando DOM, eventos, criação de elementos
            e classes com JavaScript.
        </p>


        <!-- Área de entrada -->

        <div class="entrada">

            <input
                type="text"
                id="atividadeInput"
                placeholder="Digite uma atividade..."
            >

            <button id="adicionarBtn">
                Adicionar
            </button>

        </div>


        <!-- Botão de tema -->

        <button id="temaBtn">
            🌙 Mudar tema
        </button>


        <!-- Contador -->

        <h2>
            Atividades:
            <span id="contador">0</span>
        </h2>


        <!-- Lista criada pelo JavaScript -->

        <ul id="lista"></ul>


        <p id="mensagem">
            Nenhuma atividade adicionada.
        </p>

    </div>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
