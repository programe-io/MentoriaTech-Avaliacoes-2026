
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Site Profissional</title>

    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <h1>MEU SITE</h1>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#sobre">Sobre</a>
            <a href="#cadastro">Cadastro</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <!-- INÍCIO -->
    <section id="inicio">
        <h2>Bem-vindo ao meu site!</h2>

        <p>
            Este site foi desenvolvido com HTML,
            CSS e JavaScript.
        </p>

        <button onclick="mensagem()">
            Clique aqui
        </button>
    </section>

    <!-- SOBRE -->
    <section id="sobre">
        <h2>Sobre nós</h2>

        <p>
            Nosso objetivo é criar experiências
            incríveis na internet.
        </p>
    </section>

    <!-- CADASTRO -->
    <section id="cadastro">
        <h2>Faça seu cadastro</h2>

        <form onsubmit="cadastrar(event)">
            <input
                type="text"
                id="nome"
                placeholder="Seu nome"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Seu email"
                required
            >

            <button type="submit">
                Cadastrar
            </button>
        </form>

        <p id="resultado"></p>
    </section>

    <!-- CONTATO -->
    <section id="contato">
        <h2>Contato</h2>

        <p>Email: contato@meusite.com</p>
    </section>

    <!-- RODAPÉ -->
    <footer>
        <p>© 2026 - Meu Site</p>
        <p>Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
