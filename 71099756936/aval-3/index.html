
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <h1>📚 Minha Biblioteca</h1>
        <p>Organize seus livros e acompanhe suas leituras.</p>

        <section class="resumo">
            <div class="card">
                <strong id="total">0</strong>
                <span>Total de livros</span>
            </div>

            <div class="card">
                <strong id="lendo">0</strong>
                <span>Lendo</span>
            </div>

            <div class="card">
                <strong id="lidos">0</strong>
                <span>Concluídos</span>
            </div>
        </section>

        <section class="formulario">
            <h2>Cadastrar livro</h2>

            <form id="formulario">
                <label for="titulo">Título do livro</label>
                <input type="text" id="titulo" placeholder="Digite o título">

                <label for="autor">Autor</label>
                <input type="text" id="autor" placeholder="Digite o autor">

                <label for="status">Situação da leitura</label>
                <select id="status">
                    <option value="Quero ler">Quero ler</option>
                    <option value="Lendo">Lendo</option>
                    <option value="Concluído">Concluído</option>
                </select>

                <p id="erro" class="erro" hidden></p>

                <button type="submit">Cadastrar livro</button>
            </form>
        </section>

        <section class="biblioteca">
            <h2>Meus livros</h2>

            <input
                type="text"
                id="busca"
                placeholder="Pesquisar livro..."
            >

            <div class="filtros">
                <button type="button" data-filtro="Todos">Todos</button>
                <button type="button" data-filtro="Quero ler">Quero ler</button>
                <button type="button" data-filtro="Lendo">Lendo</button>
                <button type="button" data-filtro="Concluído">Concluídos</button>
            </div>

            <p id="progresso">0% concluído</p>

            <div class="barra">
                <div id="barraPreenchida"></div>
            </div>

            <div id="listaLivros"></div>
        </section>
    </main>

<script src="script.js"></script></body>
</html>
