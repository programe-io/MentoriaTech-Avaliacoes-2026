
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas atividades e acompanhe seu progresso</p>
    </header>

    <main>
        <section class="cadastro">
            <h2>Nova tarefa</h2>

            <label for="titulo">Título da tarefa</label>
            <input type="text" id="titulo" placeholder="Digite sua tarefa">

            <label for="prioridade">Prioridade</label>
            <select id="prioridade">
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button onclick="adicionarTarefa()">Cadastrar tarefa</button>
        </section>

        <section class="tarefas">
            <h2>Minhas tarefas</h2>
            <div id="listaTarefas">
                <p>Nenhuma tarefa cadastrada.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto desenvolvido para estudos de JavaScript</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
