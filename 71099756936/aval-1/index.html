
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Controle de Estoque</h1>
        <p>Gerencie seus produtos de maneira simples</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <label for="descricao">Nome do produto</label>
            <input type="text" id="descricao" placeholder="Ex: Mouse Logitech">

            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" placeholder="Ex: 10">

            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" placeholder="Ex: 99.90" step="0.01">

            <button onclick="cadastrarPelaTela()">Cadastrar Produto</button>
        </section>

        <section class="estoque">
            <h2>Produtos cadastrados</h2>

            <div id="listaProdutos">
                <p>Nenhum produto cadastrado.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto desenvolvido para estudos de JavaScript</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
