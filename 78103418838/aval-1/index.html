<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Mundinho da Lua — v3.9</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="game">
    <header class="topo">
      <div>
        <h1>🐾 O Mundinho da Lua</h1>
        <p>Cuide da sua gatinha mágica!</p>
      </div>
      <span class="versao">v3.9</span>
    </header>

    <section class="painel">
      <div class="status-topo">
        <span>⭐ Nível <b id="nivel">1</b></span>
        <span>💖 Carinho: <b id="carinho">0</b></span>
      </div>

      <div class="casa" id="casa">
        <div class="janela">
          <span>☁️</span>
          <span>☀️</span>
        </div>

        <div class="quadro">🌙</div>
        <div class="prateleira">🪴 📚 🧸</div>
        <div class="tapete"></div>
        <div class="caminha">🧺</div>

        <div class="gatinha-area">
          <div id="efeito" class="efeito" aria-live="polite"></div>

          <div id="lua" class="lua">
            <div class="orelha orelha-esquerda"></div>
            <div class="orelha orelha-direita"></div>

            <div class="corpo"></div>
            <div class="rabo"></div>

            <div class="cabeca">
              <div class="olho olho-esquerdo">
                <span class="pupila"></span>
              </div>
              <div class="olho olho-direito">
                <span class="pupila"></span>
              </div>

              <div class="sobrancelha sobrancelha-esquerda"></div>
              <div class="sobrancelha sobrancelha-direita"></div>

              <div class="focinho">
                <span class="nariz"></span>
                <span class="boca"></span>
              </div>

              <div class="bigode bigode-esquerdo"></div>
              <div class="bigode bigode-direito"></div>
              <div class="bochecha bochecha-esquerda"></div>
              <div class="bochecha bochecha-direita"></div>
            </div>

            <div class="pata pata-esquerda"></div>
            <div class="pata pata-direita"></div>
          </div>

          <div id="comida" class="comida">🍗</div>
          <div id="brinquedo" class="brinquedo">🧶</div>
          <div id="agua" class="agua">🥣</div>
        </div>

        <div class="chao"></div>
      </div>

      <div class="fala">
        <span id="emoji-fala">😺</span>
        <p id="fala">Miau! Oi! Vamos brincar?</p>
      </div>

      <div class="necessidades">
        <div class="necessidade">
          <div class="barra-titulo"><span>🍗 Fome</span><b id="fome-num">80%</b></div>
          <div class="barra"><div id="fome-barra" class="preenchimento fome"></div></div>
        </div>

        <div class="necessidade">
          <div class="barra-titulo"><span>💧 Sede</span><b id="sede-num">80%</b></div>
          <div class="barra"><div id="sede-barra" class="preenchimento sede"></div></div>
        </div>

        <div class="necessidade">
          <div class="barra-titulo"><span>⚡ Energia</span><b id="energia-num">80%</b></div>
          <div class="barra"><div id="energia-barra" class="preenchimento energia"></div></div>
        </div>

        <div class="necessidade">
          <div class="barra-titulo"><span>🧼 Higiene</span><b id="higiene-num">80%</b></div>
          <div class="barra"><div id="higiene-barra" class="preenchimento higiene"></div></div>
        </div>

        <div class="necessidade">
          <div class="barra-titulo"><span>🥰 Felicidade</span><b id="felicidade-num">80%</b></div>
          <div class="barra"><div id="felicidade-barra" class="preenchimento felicidade"></div></div>
        </div>
      </div>

      <h2>✨ O que vamos fazer?</h2>

      <div class="botoes">
        <button data-acao="comer">🍗 Alimentar</button>
        <button data-acao="beber">💧 Dar água</button>
        <button data-acao="banho">🛁 Dar banho</button>
        <button data-acao="brincar">🧶 Brincar</button>
        <button data-acao="dormir">😴 Dormir</button>
        <button data-acao="carinho">❤️ Carinho</button>
        <button data-acao="acordar" id="botao-acordar" hidden>☀️ Acordar</button>
      </div>

      <div class="rodape">
        <span>🏡 Casinha da Lua</span>
        <button id="reiniciar" class="botao-reiniciar">🔄 Recomeçar</button>
      </div>
    </section>

    <footer>
      <p>Feito com carinho para a Lua 💚 · Versão 3.9</p>
    </footer>
  </main>
<script src="script.js"></script></body>
</html>
