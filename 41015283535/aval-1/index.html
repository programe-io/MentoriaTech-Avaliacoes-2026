<!DOCTYPE html>
<html lang='pt-BR'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>StockPro | Gestão de Estoque</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0001;
        }

        .card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .card strong {
            font-size: 25px;
            color: #2563eb;
        }

        .barra {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }

        #pesquisa {
            flex: 1;
            min-width: 200px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 11px 15px;
            cursor: pointer;
            color: white;
            background: #2563eb;
        }

        button:hover {
            opacity: .9;
        }

        .verde {
            background: #16a34a;
        }

        .vermelho {
            background: #dc2626;
        }

        .cinza {
            background: #6b7280;
        }

        .tabela {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px #0001;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8fafc;
        }

        .acoes button {
            padding: 7px 10px;
            margin-right: 4px;
        }

        .baixo {
            color: #dc2626;
            font-weight: bold;
        }

        .normal {
            color: #16a34a;
            font-weight: bold;
        }

        .vazio {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: #0008;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.ativo {
            display: flex;
        }

        .janela {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 10px;
        }

        .janela h2 {
            margin-bottom: 20px;
        }

        .campo {
            margin-bottom: 15px;
        }

        .campo label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .campo input {
            width: 100%;
        }

        .botoes {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            table {
                font-size: 13px;
            }
        }

        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .tabela {
                overflow-x: auto;
            }

            table {
                min-width: 700px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <header>
        <h1>StockPro</h1>
        <p>Sistema de Gestão de Estoque</p>
    </header>

    <main class='container'>

        <section class='cards'>
            <div class='card'>
                <h3>Total de Produtos</h3>
                <strong id='total'>0</strong>
            </div>

            <div class='card'>
                <h3>Quantidade em Estoque</h3>
                <strong id='quantidade'>0</strong>
            </div>

            <div class='card'>
                <h3>Estoque Baixo</h3>
                <strong id='baixo'>0</strong>
            </div>

            <div class='card'>
                <h3>Valor do Estoque</h3>
                <strong id='valor'>R$ 0,00</strong>
            </div>
        </section>

        <section class='barra'>
            <input
                type='text'
                id='pesquisa'
                placeholder='Pesquisar produto...'
                oninput='mostrarProdutos()'
            >

            <button onclick='abrirModal()'>Novo Produto</button>
            <button class='verde' onclick='mostrarBaixo()'>Estoque Baixo</button>
            <button class='cinza' onclick='mostrarProdutos()'>Todos</button>
            <button onclick='exportar()'>Exportar</button>
        </section>

        <section class='tabela'>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                        <th>Valor Total</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id='lista'></tbody>
            </table>
        </section>

    </main>

    <div class='modal' id='modal'>
        <div class='janela'>
            <h2 id='titulo'>Novo Produto</h2>

            <input type='hidden' id='id'>

            <div class='campo'>
                <label>Código</label>
                <input type='text' id='codigo'>
            </div>

            <div class='campo'>
                <label>Descrição</label>
                <input type='text' id='descricao'>
            </div>

            <div class='campo'>
                <label>Quantidade</label>
                <input type='number' id='qtd' min='0'>
            </div>

            <div class='campo'>
                <label>Preço</label>
                <input type='number' id='preco' min='0' step='0.01'>
            </div>

            <div class='botoes'>
                <button class='cinza' onclick='fecharModal()'>Cancelar</button>
                <button onclick='salvar()'>Salvar</button>
            </div>
        </div>
    </div>

    <script>
        let produtos = JSON.parse(localStorage.getItem('stockpro_produtos')) || [];

        function salvarStorage() {
            localStorage.setItem('stockpro_produtos', JSON.stringify(produtos));
        }

        function abrirModal(id = '') {
            document.getElementById('modal').classList.add('ativo');

            document.getElementById('id').value = id;
            document.getElementById('codigo').value = '';
            document.getElementById('descricao').value = '';
            document.getElementById('qtd').value = '';
            document.getElementById('preco').value = '';

            document.getElementById('titulo').textContent = id
                ? 'Editar Produto'
                : 'Novo Produto';

            if (id) {
                let produto = produtos.find(p => p.id == id);

                if (produto) {
                    document.getElementById('codigo').value = produto.codigo;
                    document.getElementById('descricao').value = produto.descricao;
                    document.getElementById('qtd').value = produto.quantidade;
                    document.getElementById('preco').value = produto.valor;
                }
            }
        }

        function fecharModal() {
            document.getElementById('modal').classList.remove('ativo');
        }

        function salvar() {
            let id = document.getElementById('id').value;
            let codigo = document.getElementById('codigo').value.trim();
            let descricao = document.getElementById('descricao').value.trim();
            let quantidade = Number(document.getElementById('qtd').value);
            let valor = Number(document.getElementById('preco').value);

            if (!codigo || !descricao || quantidade < 0 || valor < 0) {
                alert('Preencha todos os campos corretamente.');
                return;
            }

            if (id) {
                let produto = produtos.find(p => p.id == id);

                produto.codigo = codigo;
                produto.descricao = descricao;
                produto.quantidade = quantidade;
                produto.valor = valor;
            } else {
                produtos.push({
                    id: Date.now(),
                    codigo: codigo,
                    descricao: descricao,
                    quantidade: quantidade,
                    valor: valor
                });
            }

            salvarStorage();
            fecharModal();
            mostrarProdutos();
            atualizarResumo();
        }

        function excluir(id) {
            if (confirm('Deseja excluir este produto?')) {
                produtos = produtos.filter(p => p.id != id);
                salvarStorage();
                mostrarProdutos();
                atualizarResumo();
            }
        }

        function dinheiro(valor) {
            return valor.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });
        }

        function mostrarProdutos(filtro = '') {
            let busca = document.getElementById('pesquisa').value.toLowerCase();
            let lista = document.getElementById('lista');

            let filtrados = produtos.filter(p =>
                p.codigo.toLowerCase().includes(busca) ||
                p.descricao.toLowerCase().includes(busca)
            );

            if (filtro === 'baixo') {
                filtrados = filtrados.filter(p => p.quantidade <= 5);
            }

            if (filtrados.length === 0) {
                lista.innerHTML = '<tr><td colspan="7" class="vazio">Nenhum produto encontrado.</td></tr>';
                return;
            }

            lista.innerHTML = filtrados.map(p => {
                let total = p.quantidade * p.valor;
                let status = p.quantidade <= 5 ? 'Baixo' : 'Normal';
                let classe = p.quantidade <= 5 ? 'baixo' : 'normal';

                return `
                    <tr>
                        <td>${p.codigo}</td>
                        <td>${p.descricao}</td>
                        <td>${p.quantidade}</td>
                        <td>${dinheiro(p.valor)}</td>
                        <td>${dinheiro(total)}</td>
                        <td class='${classe}'>${status}</td>
                        <td class='acoes'>
                            <button onclick='abrirModal(${p.id})'>Editar</button>
                            <button class='vermelho' onclick='excluir(${p.id})'>Excluir</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function mostrarBaixo() {
            mostrarProdutos('baixo');
        }

        function atualizarResumo() {
            let total = produtos.length;

            let quantidade = produtos.reduce(
                (soma, p) => soma + p.quantidade,
                0
            );

            let baixo = produtos.filter(
                p => p.quantidade <= 5
            ).length;

            let valor = produtos.reduce(
                (soma, p) => soma + p.quantidade * p.valor,
                0
            );

            document.getElementById('total').textContent = total;
            document.getElementById('quantidade').textContent = quantidade;
            document.getElementById('baixo').textContent = baixo;
            document.getElementById('valor').textContent = dinheiro(valor);
        }

        function exportar() {
            if (produtos.length === 0) {
                alert('Não existem produtos para exportar.');
                return;
            }

            let csv = 'Código;Produto;Quantidade;Preço;Valor Total\n';

            produtos.forEach(p => {
                csv += p.codigo + ';';
                csv += p.descricao + ';';
                csv += p.quantidade + ';';
                csv += p.valor + ';';
                csv += (p.quantidade * p.valor) + '\n';
            });

            let arquivo = new Blob([csv], {
                type: 'text/csv;charset=utf-8;'
            });

            let url = URL.createObjectURL(arquivo);
            let link = document.createElement('a');

            link.href = url;
            link.download = 'estoque.csv';
            link.click();

            URL.revokeObjectURL(url);
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                fecharModal();
            }
        });

        mostrarProdutos();
        atualizarResumo();
    </script>

</body>
</html>
