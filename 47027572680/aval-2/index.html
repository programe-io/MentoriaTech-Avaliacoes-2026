<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header class="topo">
        <div class="container">
            <h1>TaskFlow</h1>
            <p>Organize suas tarefas de forma simples.</p>
        </div>
    </header>

    <main class="container">

        <section class="painel">

            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <div class="campo">
                    <label for="tarefa">Tarefa</label>
                    <input
                        type="text"
                        id="tarefa"
                        placeholder="Digite uma tarefa..."
                        required
                    >
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>

                    <select id="categoria">
                        <option value="Estudos">Estudos</option>
                        <option value="Trabalho">Trabalho</option>
                        <option value="Pessoal">Pessoal</option>
                    </select>
                </div>

                <button type="submit">
                    Adicionar tarefa
                </button>

            </form>

        </section>


        <section class="resumo">

            <div class="card">
                <span>Total</span>
                <strong id="total">0</strong>
            </div>

            <div class="card">
                <span>Pendentes</span>
                <strong id="pendentes">0</strong>
            </div>

            <div class="card">
                <span>Concluídas</span>
                <strong id="concluidas">0</strong>
            </div>

        </section>


        <section class="lista-section">

            <div class="lista-topo">

                <h2>Minhas tarefas</h2>

                <select id="filtro">
                    <option value="todas">Todas</option>
                    <option value="pendentes">Pendentes</option>
                    <option value="concluidas">Concluídas</option>
                </select>

            </div>

            <div id="listaTarefas" class="lista-tarefas">

                <div class="vazio" id="mensagemVazia">
                    <p>Nenhuma tarefa cadastrada.</p>
                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>TaskFlow &copy; 2026 - Projeto HTML, CSS e JavaScript</p>
    </footer>


    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
