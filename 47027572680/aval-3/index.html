<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Tarefas</title>

    <link rel="stylesheet" href="css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <header class="header">
            <h1>Minha Lista de Tarefas</h1>
            <p>Organize suas atividades de forma simples e rápida.</p>
        </header>

        <section class="task-box">

            <form id="taskForm" class="task-form">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Digite uma nova tarefa..."
                    autocomplete="off"
                >

                <button type="submit">
                    Adicionar
                </button>

            </form>

            <div class="task-info">
                <span id="taskCounter">0 tarefas</span>

                <button id="clearCompleted" class="clear-button">
                    Limpar concluídas
                </button>
            </div>

            <ul id="taskList" class="task-list">
                <!-- As tarefas serão adicionadas pelo JavaScript -->
            </ul>

            <div id="emptyMessage" class="empty-message">
                <div class="empty-icon">✓</div>
                <h2>Nenhuma tarefa</h2>
                <p>Adicione uma tarefa para começar.</p>
            </div>

        </section>

        <footer>
            <p>Projeto desenvolvido com HTML, CSS e JavaScript.</p>
        </footer>

    </main>

    <script src="js/script.js"></script>

<script src="script.js"></script></body>
</html>
