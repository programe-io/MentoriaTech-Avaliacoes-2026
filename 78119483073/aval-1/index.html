
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 380px;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .opcoes {
            margin: 5px 0 20px;
            font-size: 13px;
            color: #555;
        }

        .opcoes input {
            width: auto;
            margin-right: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .rodape {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #555;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">
        <h1>Bem-vindo!</h1>
        <p class="subtitulo">Entre na sua conta</p>

        <form id="formLogin">
            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                    minlength="6"
                >
            </div>

            <div class="opcoes">
                <label>
                    <input type="checkbox" id="mostrarSenha">
                    Mostrar senha
                </label>
            </div>

            <button type="submit">Entrar</button>

            <p id="mensagem" role="status"></p>
        </form>

        <p class="rodape">
            Não tem uma conta?
            <a href="#" id="criarConta">Criar conta</a>
        </p>
    </main>

    <script>
        const formulario = document.getElementById("formLogin");
        const senha = document.getElementById("senha");
        const mostrarSenha = document.getElementById("mostrarSenha");
        const mensagem = document.getElementById("mensagem");

        mostrarSenha.addEventListener("change", function () {
            senha.type = this.checked ? "text" : "password";
        });

        formulario.addEventListener("submit", function (evento) {
            evento.preventDefault();

            mensagem.style.color = "#2563eb";
            mensagem.textContent =
                "Interface demonstrativa: conecte um sistema de autenticação para entrar.";
        });

        document.getElementById("criarConta")
            .addEventListener("click", function (evento) {
                evento.preventDefault();
                mensagem.style.color = "#555";
                mensagem.textContent =
                    "A função de criar conta ainda precisa ser implementada.";
            });
    </script>

<script src="script.js"></script></body>
</html>
