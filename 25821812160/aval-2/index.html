
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <title>Minha Calculadora</title>
            <link rel="stylesheet" href="style.css">
            <link href="style.css" rel="stylesheet"></head>
            <body>

            <div class="calculadora">
                <h1>Calculadora</h1>

                    <input type="number" id="numero1" placeholder="Primeiro número">
                        <input type="number" id="numero2" placeholder="Segundo número">

                            <div class="botoes">
                                    <button onclick="calcular('+')">+</button>
                                            <button onclick="calcular('-')">-</button>
                                                    <button onclick="calcular('*')">×</button>
                                                            <button onclick="calcular('/')">÷</button>
                                                                </div>

                                                                    <h2 id="resultado">Resultado: 0</h2>

                                                                        <button class="limpar" onclick="limpar()">Limpar</button>
                                                                        </div>

                                                                        <script src="script.js"></script>
                                                                        <script src="script.js"></script></body>
                                                                        </html>
