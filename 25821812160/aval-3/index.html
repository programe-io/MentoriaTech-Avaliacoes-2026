
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Ficha de Anamnese</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <div class="container">
                            <h1>Ficha de Anamnese</h1>
                                    <p>Preencha seus dados abaixo</p>

                                            <form id="formulario">

                                                        <label>Nome completo:</label>
                                                                    <input type="text" id="nome" placeholder="Digite seu nome" required>

                                                                                <label>Idade:</label>
                                                                                            <input type="number" id="idade" placeholder="Digite sua idade" required>

                                                                                                        <label>Telefone:</label>
                                                                                                                    <input type="tel" id="telefone" placeholder="Digite seu telefone">

                                                                                                                                <label>Motivo da consulta:</label>
                                                                                                                                            <textarea id="motivo" placeholder="Descreva o motivo"></textarea>

                                                                                                                                                        <label>Possui alguma alergia?</label>
                                                                                                                                                                    <select id="alergia">
                                                                                                                                                                                    <option value="">Selecione</option>
                                                                                                                                                                                                    <option>Sim</option>
                                                                                                                                                                                                                    <option>Não</option>
                                                                                                                                                                                                                                </select>

                                                                                                                                                                                                                                            <label>Usa algum medicamento?</label>
                                                                                                                                                                                                                                                        <select id="medicamento">
                                                                                                                                                                                                                                                                        <option value="">Selecione</option>
                                                                                                                                                                                                                                                                                        <option>Sim</option>
                                                                                                                                                                                                                                                                                                        <option>Não</option>
                                                                                                                                                                                                                                                                                                                    </select>

                                                                                                                                                                                                                                                                                                                                <button type="submit">Enviar ficha</button>
                                                                                                                                                                                                                                                                                                                                        </form>

                                                                                                                                                                                                                                                                                                                                                <div id="resultado"></div>
                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                        </html>
