<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicFeed 🎵</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f0f0f;
            color: white;
        }

        header {
            background: #181818;
            padding: 20px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #292929;
        }

        header h1 {
            color: #1db954;
        }

        .search {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            width: 250px;
            outline: none;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .feed {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .music-card {
            background: #181818;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .music-card:hover {
            transform: translateY(-5px);
            background: #202020;
        }

        .cover {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .content {
            padding: 18px;
        }

        .artist {
            color: #aaa;
            margin: 6px 0 15px;
        }

        .buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 25px;
            padding: 10px 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        .play {
            background: #1db954;
            color: black;
        }

        .play:hover {
            background: #1ed760;
            transform: scale(1.05);
        }

        .like {
            background: #303030;
            color: white;
            font-size: 18px;
        }

        .like.liked {
            color: #ff3b6b;
        }

        .counter {
            color: #999;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .search {
                width: 100%;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>🎵 MusicFeed</h1>

        <input
            type="text"
            id="search"
            class="search"
            placeholder="🔎 Procurar música..."
            onkeyup="buscarMusica()"
        >
    </header>

    <main>

        <section class="welcome">
            <h2>Descubra novas músicas 🎧</h2>
            <p>Confira algumas músicas que estão no feed.</p>
        </section>

        <section class="feed" id="feed">

            <!-- Música 1 -->
            <article class="music-card">
                <img
                    class="cover"
                    src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=800&q=80"
                    alt="Cantora no palco"
                >

                <div class="content">
                    <h3>Midnight Dreams</h3>
                    <p class="artist">Luna Sky</p>

                    <div class="buttons">
                        <button class="play" onclick="tocar(this)">
                            ▶ Play
                        </button>

                        <button class="like" onclick="curtir(this)">
                            ♡
                        </button>

                        <span class="counter">124 curtidas</span>
                    </div>
                </div>
            </article>


            <!-- Música 2 -->
            <article class="music-card">
                <img
                    class="cover"
                    src="https://images.unsplash.com/photo-1524368535928-5b5e00ddc76b?auto=format&fit=crop&w=800&q=80"
                    alt="Show com iluminação"
                >

                <div class="content">
                    <h3>Electric Night</h3>
                    <p class="artist">The Waves</p>

                    <div class="buttons">
                        <button class="play" onclick="tocar(this)">
                            ▶ Play
                        </button>

                        <button class="like" onclick="curtir(this)">
                            ♡
                        </button>

                        <span class="counter">98 curtidas</span>
                    </div>
                </div>
            </article>


            <!-- Música 3 -->
            <article class="music-card">
                <img
                    class="cover"
                    src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=800&q=80"
                    alt="Microfone de estúdio"
                >

                <div class="content">
                    <h3>Lost in Sound</h3>
                    <p class="artist">Alex Moon</p>

                    <div class="buttons">
                        <button class="play" onclick="tocar(this)">
                            ▶ Play
                        </button>

                        <button class="like" onclick="curtir(this)">
                            ♡
                        </button>

                        <span class="counter">256 curtidas</span>
                    </div>
                </div>
            </article>


            <!-- Música 4 -->
            <article class="music-card">
                <img
                    class="cover"
                    src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80"
                    alt="Público em um show"
                >

                <div class="content">
                    <h3>Feel the Beat</h3>
                    <p class="artist">DJ Nova</p>

                    <div class="buttons">
                        <button class="play" onclick="tocar(this)">
                            ▶ Play
                        </button>

                        <button class="like" onclick="curtir(this)">
                            ♡
                        </button>

                        <span class="counter">341 curtidas</span>
                    </div>
                </div>
            </article>

        </section>

    </main>

    <footer>
        <p>🎵 MusicFeed © 2026 — Seu feed de músicas</p>
    </footer>


    <script>

        // Botão Play/Pause
        function tocar(botao) {

            // Para todos os outros botões
            document.querySelectorAll(".play").forEach(function(btn) {
                if (btn !== botao) {
                    btn.innerHTML = "▶ Play";
                }
            });

            if (botao.innerHTML.includes("Play")) {
                botao.innerHTML = "⏸ Pausar";
            } else {
                botao.innerHTML = "▶ Play";
            }
        }


        // Botão Curtir
        function curtir(botao) {

            const contador = botao.nextElementSibling;

            let numero = parseInt(
                contador.textContent.replace(/\D/g, "")
            );

            if (botao.classList.contains("liked")) {

                botao.classList.remove("liked");
                botao.innerHTML = "♡";
                numero--;

            } else {

                botao.classList.add("liked");
                botao.innerHTML = "♥";
                numero++;
            }

            contador.textContent = numero + " curtidas";
        }


        // Pesquisa de músicas
        function buscarMusica() {

            const pesquisa = document
                .getElementById("search")
                .value
                .toLowerCase();

            const cards = document.querySelectorAll(".music-card");

            cards.forEach(function(card) {

                const texto = card.textContent.toLowerCase();

                if (texto.includes(pesquisa)) {
                    card.style.display = "";
                } else {
                    card.style.display = "none";
                }

            });
        }

    </script>

</body>
</html>
