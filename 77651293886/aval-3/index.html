
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Perfil</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h2>Instagram</h2>
        <i class='bx bx-compass'></i>
    </header>

    <main>
        <section class="perfil">
            <img class="foto-perfil" src="https://i.pravatar.cc/150?img=12" alt="Foto de perfil">

            <div class="info">
                <div class="usuario">
                    <h2>frojo_dev</h2>
                    <button>Editar perfil</button>
                    <i class='bx bx-cog'></i>
                </div>

                <div class="estatisticas">
                    <p><strong>2</strong> publicações</p>
                    <p><strong>1mi</strong> seguidores</p>
                    <p><strong>1200</strong> seguindo</p>
                </div>

                <div class="bio">
                    <strong>William_Oliver_Dev</strong>
                    <p>💻 Desenvolvedor em formação</p>
                    <p>"I'll see you on the dark side of the moon"- Pink Floyd</p>
                </div>
            </div>
        </section>

        <section class="publicacoes">
            <div class="titulo">
                <i class='bx bx-grid-alt'></i>
                <span>PUBLICAÇÕES</span>
            </div>

            <div class="fotos">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=500" alt="Tecnologia">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=500" alt="Programação">
            </div>
        </section>
    </main>

<script src="script.js"></script></body>
</html>
