
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petgram</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Petgram 🐾</h1>
    <input type="text" placeholder="Pesquisar">
    <div class="menu">
        <span>🏠</span>
        <span>💬</span>
        <span>➕</span>
        <span>❤️</span>
        <span>🐶</span>
    </div>
</header>

<main>
    <section class="stories">
        <div class="story">
            <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=100">
            <p>Seu story</p>
        </div>

        <div class="story">
            <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=100">
            <p>Rex</p>
        </div>

        <div class="story">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=100">
            <p>Mel</p>
        </div>

        <div class="story">
            <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=100">
            <p>Bolinha</p>
        </div>
    </section>

    <section class="feed" id="feed">

        <article class="post">
            <div class="post-header">
                <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=100">
                <strong>rex_oficial 🐶</strong>
            </div>

            <img class="post-image"
            src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=700">

            <div class="post-actions">
                <button class="like">♡</button>
                <button>💬</button>
                <button>➤</button>
            </div>

            <p class="likes">120 curtidas</p>
            <p><strong>rex_oficial</strong> Bom dia, pessoal! 🐾</p>

            <div class="comments"></div>

            <form class="comment-form">
                <input type="text" placeholder="Adicione um comentário...">
                <button type="submit">Publicar</button>
            </form>
        </article>

        <article class="post">
            <div class="post-header">
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=100">
                <strong>gatinha_mel 🐱</strong>
            </div>

            <img class="post-image"
            src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=700">

            <div class="post-actions">
                <button class="like">♡</button>
                <button>💬</button>
                <button>➤</button>
            </div>

            <p class="likes">85 curtidas</p>
            <p><strong>gatinha_mel</strong> Hoje é dia de preguiça! 😻</p>

            <div class="comments"></div>

            <form class="comment-form">
                <input type="text" placeholder="Adicione um comentário...">
                <button type="submit">Publicar</button>
            </form>
        </article>

    </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
