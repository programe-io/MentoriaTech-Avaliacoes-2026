<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="painel">
    <h1>Gerenciador de Tarefas</h1>

    <form id="form-cadastro" class="cadastro" novalidate>
      <div class="campo campo-titulo">
        <label for="titulo">Título (mínimo 5 caracteres)</label>
        <input id="titulo" type="text" autocomplete="off" placeholder="Ex.: Estudar arrays">
      </div>
      <div class="campo">
        <label for="prioridade">Prioridade</label>
        <select id="prioridade">
          <option value="1">1 – Alta</option>
          <option value="2" selected>2 – Média</option>
          <option value="3">3 – Baixa</option>
        </select>
      </div>
      <button type="submit" class="botao">Cadastrar tarefa</button>
    </form>

    <p id="mensagem" class="mensagem" role="alert" hidden></p>

    <ul id="lista" class="lista" aria-label="Tarefas cadastradas"></ul>
    <p id="vazio" class="vazio">Nenhuma tarefa ainda. Cadastre a primeira acima.</p>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
