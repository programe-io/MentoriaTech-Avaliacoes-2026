<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones externos (FontAwesome) para os botões -->
    <link rel="stylesheet" href="https://cloudflare.com">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Barra Superior -->
    <header class="top-bar">
        <div class="logo">Instagram</div>
        <div class="top-icons">
            <i class="fa-regular fa-heart"></i>
            <i class="fa-regular fa-paper-plane"></i>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-container">
        
        <!-- Seção de Stories (Contas) -->
        <section class="stories-container" id="stories-wrapper">
            <!-- Gerado dinamicamente pelo JavaScript -->
        </section>

        <!-- Feed de Publicações -->
        <section class="feed-container" id="feed-wrapper">
            <!-- Gerado dinamicamente pelo JavaScript -->
        </section>

    </main>

    <!-- Barra de Navegação Inferior -->
    <nav class="bottom-nav">
        <i class="fa-solid fa-house active"></i>
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-regular fa-square-plus"></i>
        <i class="fa-solid fa-clapperboard"></i>
        <img src="https://picsum.photos" alt="Perfil" class="nav-profile-pic">
    </nav>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
