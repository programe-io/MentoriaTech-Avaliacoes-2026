<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed - GTA 6</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="mini-feed-container">
        <div class="feed-header">
            <h3>⚡ Giro GTA 6</h3>
            <span class="count-badge" id="feed-count">3 posts</span>
        </div>

        <div class="mini-feed-list">
            <!-- Item 1 -->
            <div class="mini-card novo">
                <div class="mini-meta">
                    <span class="tag-status">Agora</span>
                    <span class="tempo">1 min atrás</span>
                </div>
                <h4>Pré-venda bate recordes mundiais no PS5</h4>
                <button class="btn-ver" data-id="1">Espiar</button>
            </div>

            <!-- Item 2 -->
            <div class="mini-card">
                <div class="mini-meta">
                    <span class="tag-categoria">Mecânica</span>
                    <span class="tempo">20 min atrás</span>
                </div>
                <h4>Porta-malas dos carros funcionará como arsenal físico</h4>
                <button class="btn-ver" data-id="2">Espiar</button>
            </div>

            <!-- Item 3 -->
            <div class="mini-card">
                <div class="mini-meta">
                    <span class="tag-categoria">Mapa</span>
                    <span class="tempo">2 horas atrás</span>
                </div>
                <h4>Pântanos de Leonida terão ecossistema dinâmico de jacarés</h4>
                <button class="btn-ver" data-id="3">Espiar</button>
            </div>
        </div>

        <!-- Mini Interação -->
        <div class="mini-footer">
            <button id="btn-atualizar">🔄 Atualizar Feed</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
