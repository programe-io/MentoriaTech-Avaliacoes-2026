<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="app">
    <header class="topo">
      <h1>Gerenciador de Tarefas</h1>
      <p class="resumo" id="resumo" aria-live="polite"></p>
    </header>

    <section class="painel" aria-labelledby="titulo-cadastro">
      <h2 id="titulo-cadastro">Nova tarefa</h2>
      <form id="formulario-tarefa" novalidate>
        <div class="campo campo-titulo">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" placeholder="Mínimo de 5 caracteres" autocomplete="off">
        </div>
        <div class="campo campo-prioridade">
          <label for="prioridade">Prioridade</label>
          <select id="prioridade">
            <option value="1">1 – Alta</option>
            <option value="2" selected>2 – Média</option>
            <option value="3">3 – Baixa</option>
          </select>
        </div>
        <button type="submit" class="botao botao-principal">Adicionar tarefa</button>
      </form>
      <p class="mensagem" id="mensagem" role="alert" hidden></p>
    </section>

    <section class="painel" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Tarefas cadastradas</h2>
      <ul class="lista" id="lista-tarefas"></ul>
      <p class="vazio" id="vazio">Nenhuma tarefa cadastrada. Preencha o formulário acima para adicionar a primeira.</p>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
