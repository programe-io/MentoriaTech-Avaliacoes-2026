<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha de Anamnese - Controle de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <h1>Ficha de <span>Anamnese</span></h1>
    <p>Controle de IMC</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Novo registro</h2>
      <form id="formulario" novalidate>
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Ex.: Maria Silva" required>

        <div class="linha">
          <div>
            <label for="idade">Idade</label>
            <input type="number" id="idade" placeholder="Anos" min="1" max="120" required>
          </div>
          <div>
            <label for="altura">Altura (m)</label>
            <input type="text" id="altura" inputmode="decimal" placeholder="1.75" required>
          </div>
          <div>
            <label for="peso">Peso (kg)</label>
            <input type="text" id="peso" inputmode="decimal" placeholder="70" required>
          </div>
        </div>

        <p id="mensagem" class="mensagem" role="alert"></p>
        <button type="submit">Salvar</button>
      </form>
    </section>

    <section class="card">
      <div class="titulo-tabela">
        <h2>Registros</h2>
        <button type="button" id="limpar" class="secundario">Limpar tudo</button>
      </div>
      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Idade</th>
              <th>Altura</th>
              <th>Peso</th>
              <th>IMC</th>
              <th>Classificação</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo"></tbody>
        </table>
      </div>
      <p id="vazio" class="vazio">Nenhum registro ainda.</p>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
