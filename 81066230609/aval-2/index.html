<!DOCTYPE html>
<html lang="pt-BR">
  <head>
      <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="theme-color" content="#f4f6fb" />
                  <title>Conecta — seu feed</title>
                      <link rel="stylesheet" href="styles.css" />
                        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                          <body>
                              <header class="topbar">
                                    <a class="brand" href="#inicio" aria-label="Conecta, início">
                                            <span class="brand-mark">c</span> conecta
                                                  </a>
                                                        <span class="topbar-note">Um lugar para compartilhar</span>
                                                              <div class="profile-badge" aria-label="Seu perfil">V</div>
                                                                  </header>

                                                                      <main class="layout" id="inicio">
                                                                            <aside class="sidebar">
                                                                                    <div class="welcome-card">
                                                                                              <div class="welcome-avatar">V</div>
                                                                                                        <h2>Olá, visitante!</h2>
                                                                                                                  <p>Que bom ter você por aqui.</p>
                                                                                                                          </div>
                                                                                                                                  <nav class="navigation" aria-label="Navegação principal">
                                                                                                                                            <a class="nav-link active" href="#feed"><span>⌂</span> Meu feed</a>
                                                                                                                                                      <a class="nav-link" href="#composer"><span>＋</span> Nova publicação</a>
                                                                                                                                                              </nav>
                                                                                                                                                                      <p class="sidebar-footer">Feito para boas conexões <span>♡</span></p>
                                                                                                                                                                            </aside>

                                                                                                                                                                                  <section class="feed-column" id="feed" aria-label="Feed de publicações">
                                                                                                                                                                                          <div class="section-heading">
                                                                                                                                                                                                    <div>
                                                                                                                                                                                                                <p class="eyebrow">SUA COMUNIDADE</p>
                                                                                                                                                                                                                            <h1>Feed</h1>
                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                <span class="online-indicator">● Ao vivo</span>
                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                <form class="composer card" id="postForm">
                                                                                                                                                                                                                                                                          <div class="composer-top">
                                                                                                                                                                                                                                                                                      <div class="avatar avatar-you">V</div>
                                                                                                                                                                                                                                                                                                  <label class="sr-only" for="postText">O que você está pensando?</label>
                                                                                                                                                                                                                                                                                                              <textarea id="postText" maxlength="500" placeholder="O que você está pensando?" required></textarea>
                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                  <div class="composer-bottom" id="composer">
                                                                                                                                                                                                                                                                                                                                              <label class="name-field" for="authorName">Publicar como</label>
                                                                                                                                                                                                                                                                                                                                                          <input id="authorName" type="text" maxlength="30" placeholder="Seu nome" aria-label="Seu nome" />
                                                                                                                                                                                                                                                                                                                                                                      <span class="char-count" id="charCount">0/500</span>
                                                                                                                                                                                                                                                                                                                                                                                  <button class="publish-button" type="submit"><span>＋</span> Publicar</button>
                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                    </form>

                                                                                                                                                                                                                                                                                                                                                                                                            <div class="feed-list" id="feedList" aria-live="polite"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                  </section>
                                                                                                                                                                                                                                                                                                                                                                                                                      </main>

                                                                                                                                                                                                                                                                                                                                                                                                                          <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
