<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <header>
            <h1>📦 Sistema de Estoque</h1>
            <p>Cadastre e gerencie seus produtos</p>
        </header>

        <section class="card">
            <h2>Cadastrar novo produto</h2>

            <div class="form-group">
                <label for="codigo">Código</label>
                <input type="text" id="codigo" placeholder="Ex: 001">
            </div>

            <div class="form-group">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" placeholder="Nome do produto">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="0" placeholder="0">
                </div>

                <div class="form-group">
                    <label for="valor">Valor (R$)</label>
                    <input type="number" id="valor" min="0" step="0.01" placeholder="0,00">
                </div>
            </div>

            <button onclick="cadastrarProduto()">Cadastrar Produto</button>
        </section>

        <section class="card">
            <h2>Alterar produto</h2>

            <div class="form-group">
                <label for="codigoAlteracao">Código do produto</label>
                <input type="text" id="codigoAlteracao" placeholder="Digite o código">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="novoValor">Novo valor</label>
                    <input type="number" id="novoValor" min="0" step="0.01" placeholder="Opcional">
                </div>

                <div class="form-group">
                    <label for="novaQuantidade">Nova quantidade</label>
                    <input type="number" id="novaQuantidade" min="0" placeholder="Opcional">
                </div>
            </div>

            <div class="buttons">
                <button class="btn-valor" onclick="alterarValor()">
                    Alterar Valor
                </button>

                <button class="btn-quantidade" onclick="alterarQuantidade()">
                    Alterar Quantidade
                </button>
            </div>
        </section>

        <section class="card">
            <div class="titulo-lista">
                <h2>Produtos cadastrados</h2>
                <span id="totalProdutos">0 produtos</span>
            </div>

            <div id="listaProdutos">
                <p class="vazio">Nenhum produto cadastrado.</p>
            </div>
        </section>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
