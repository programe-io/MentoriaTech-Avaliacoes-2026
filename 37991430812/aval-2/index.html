<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo: Dia de Jogador de Futebol</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Carreira de Jogador: O Dia do Jogo</h1>
        <p id="subtitulo">Tome as decisões certas para chegar pronto para a partida!</p>
    </header>

    <main>
        <!-- Painel de Status -->
        <section id="status-container">
            <h2>Atributos do Atleta</h2>
            <div class="status-grid">
                <div class="status-card">
                    <span>⚡ Energia:</span>
                    <strong id="val-energia">100%</strong>
                </div>
                <div class="status-card">
                    <span>🧠 Tática:</span>
                    <strong id="val-tatica">50%</strong>
                </div>
                <div class="status-card">
                    <span>🎯 Foco:</span>
                    <strong id="val-foco">50%</strong>
                </div>
            </div>
        </section>

        <!-- Área de Ação/Jogo -->
        <section id="jogo-container">
            <h2 id="titulo-etapa">Manhã: Preparação Inicial</h2>
            <p id="descricao-etapa">É hora de começar o dia. O que você faz logo ao acordar?</p>
            
            <div id="opcoes-container">
                <button class="btn-opcao" data-opcao="1">Café reforçado e treino de academia</button>
                <button class="btn-opcao" data-opcao="2">Dormir mais 1 hora e pular o café</button>
                <button class="btn-opcao" data-opcao="3">Estudar vídeos do time adversário</button>
            </div>

            <p id="mensagem-retorno"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Jogo de Futebol. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
