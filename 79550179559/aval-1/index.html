<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo, Professor!</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* CONFIGURAÇÕES ESTILO MINECRAFT */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
        }

        body {
            background-color: #2c2c2c;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                url('https://transparenttextures.com');
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .minecraft-container {
            background-color: #4c4c4c;
            border: 6px solid #000000;
            box-shadow: 
                inset -6px -6px 0px #2c2c2c, 
                inset 6px 6px 0px #7c7c7c,
                0px 12px 0px rgba(0,0,0,0.5);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .title-minecraft {
            color: #ffff55;
            font-size: 24px;
            line-height: 1.5;
            margin-bottom: 40px;
            text-shadow: 3px 3px 0px #3f3f00;
        }

        /* TEXTO SPLASH (AMARELO INCLINADO QUE PULSA) */
        .splash-text {
            position: absolute;
            color: #ffaa00;
            font-size: 11px;
            text-shadow: 2px 2px 0px #3f2a00;
            top: 65px;
            right: 20px;
            transform: rotate(-15px);
            display: inline-block;
            animation: pulse 0.5s infinite alternate;
        }

        .subtitle-minecraft {
            color: #aaffaa;
            font-size: 12px;
            line-height: 1.8;
            margin-bottom: 35px;
            text-shadow: 2px 2px 0px #003f00;
        }

        .btn-minecraft {
            display: inline-block;
            width: 100%;
            background-color: #9e9e9e;
            color: #e0e0e0;
            border: 4px solid #000000;
            box-shadow: 
                inset -4px -4px 0px #5c5c5c, 
                inset 4px 4px 0px #dfdfdf;
            padding: 15px 20px;
            font-size: 14px;
            cursor: pointer;
            text-shadow: 2px 2px 0px #373737;
            margin-bottom: 25px;
        }

        .btn-minecraft:hover {
            background-color: #5c8e32;
            color: #ffffff;
            box-shadow: 
                inset -4px -4px 0px #34521a, 
                inset 4px 4px 0px #82be4b;
            text-shadow: 2px 2px 0px #1d3010;
        }

        /* CONTADORES DE XP */
        .xp-container {
            margin-top: 15px;
        }

        .xp-text {
            color: #55ff55;
            font-size: 14px;
            text-shadow: 2px 2px 0px #003f00;
            margin-bottom: 5px;
        }

        .exp-bar {
            height: 12px;
            background-color: #000;
            border: 2px solid #7c7c7c;
            position: relative;
            width: 100%;
        }

        .exp-progress {
            width: 0%; /* Controlado pelo JavaScript */
            height: 100%;
            background-color: #55ff55;
            box-shadow: inset 0px 2px 0px #aaffaa;
            transition: width 0.3s ease;
        }

        /* ANIMAÇÃO DO TEXTO SPLASH */
        @keyframes pulse {
            from { transform: rotate(-15deg) scale(1); }
            to { transform: rotate(-15deg) scale(1.1); }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="minecraft-container">
        <!-- Texto amarelo dinâmico do Minecraft -->
        <div class="splash-text" id="splash">Carregando chunks...</div>

        <h1 class="title-minecraft">BEM-VINDO,<br>PROFESSOR!</h1>
        
        <p class="subtitle-minecraft" id="status-text">Pronto para iniciar a jornada de hoje?</p>
        
        <!-- Botões de ação -->
        <button class="btn-minecraft" id="btn-play">JOGAR NO MUNDO</button>
        <button class="btn-minecraft" id="btn-xp">ESTUDAR (+10 XP)</button>
        
        <!-- Sistema de Nível / XP -->
        <div class="xp-container">
            <div class="xp-text">NÍVEL <span id="xp-level">0</span></div>
            <div class="exp-bar">
                <div class="exp-progress" id="xp-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- CÓDIGO JAVASCRIPT -->
    <script>
        // 1. GERADOR DE FRASES ALEATÓRIAS (SPLASH TEXTS)
        const frasesSplash = [
            "100% Educativo!",
            "Melhor que Redstone!",
            "Nota 10 garantida!",
            "Cuidado com o Creeper!",
            "Ferramentas de ferro prontas!",
            "Construindo conhecimento!"
        ];

        // Escolhe uma frase aleatória ao carregar a página
        const splashElement = document.getElementById('splash');
        const fraseAleatoria = frasesSplash[Math.floor(Math.random() * frasesSplash.length)];
        splashElement.innerText = fraseAleatoria;

        // 2. LOGICA DO BOTÃO "JOGAR"
        const btnPlay = document.getElementById('btn-play');
        const statusText = document.getElementById('status-text');

        btnPlay.addEventListener('click', () => {
            statusText.innerText = "Mundo carregado! Boa aula, Professor! 🚀";
            statusText.style.color = "#ffff55"; // Muda para amarelo
            btnPlay.innerText = "MUNDO ATIVO";
            btnPlay.style.backgroundColor = "#5c8e32";
        });

        // 3. SISTEMA DE EXPERIÊNCIA (XP)
        const btnXp = document.getElementById('btn-xp');
        const xpBarFill = document.getElementById('xp-bar-fill');
        const xpLevelElement = document.getElementById('xp-level');

        let progressoXp = 0;
        let nivelAtual = 0;

        btnXp.addEventListener('click', () => {
            progressoXp += 20; // Adiciona 20% à barra de progresso

            // Se a barra encher (100%), sobe de nível
            if (progressoXp >= 100) {
                progressoXp = 0;
                nivelAtual += 1;
                xpLevelElement.innerText = nivelAtual;
                alert(`✨ Ding! Você subiu para o Nível ${nivelAtual} de conhecimento!`);
            }

            // Atualiza visualmente a barra verde
            xpBarFill.style.width = progressoXp + '%';
        });
    </script>

<script src="script.js"></script></body>
</html>
