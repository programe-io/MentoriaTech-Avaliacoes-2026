<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Calculadora de IMC</h1>

    <section class="card">
      <h2>Nova pessoa</h2>
      <div id="form-pessoa">
        <div class="campos">
          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Ex.: Maria Silva" autocomplete="off">
          </div>
          <div class="campo">
            <label for="idade">Idade (anos)</label>
            <input type="text" id="idade" inputmode="numeric" placeholder="Ex.: 30" autocomplete="off">
          </div>
          <div class="campo">
            <label for="altura">Altura (m)</label>
            <input type="text" id="altura" inputmode="decimal" placeholder="Ex.: 1.75" autocomplete="off">
          </div>
          <div class="campo">
            <label for="peso">Peso (kg)</label>
            <input type="text" id="peso" inputmode="decimal" placeholder="Ex.: 70" autocomplete="off">
          </div>
        </div>
        <p id="erro" class="erro"></p>
        <button type="button" id="btn-salvar" class="btn-salvar">Salvar</button>
      </div>
    </section>

    <section class="card">
      <h2>Pessoas cadastradas</h2>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Altura</th>
            <th>Peso</th>
            <th>IMC</th>
            <th>Classificação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-pessoas"></tbody>
      </table>
      <p id="vazio" class="vazio">Nenhuma pessoa cadastrada ainda.</p>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
