
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store</title>

    <style>
        body {
            background: #151525;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background: #7025c9;
            padding: 25px;
            text-align: center;
        }

        nav {
            background: #25253b;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        h2 {
            text-align: center;
            margin-top: 30px;
        }

        .produtos {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 30px;
        }

        .produto {
            background: #25253b;
            width: 220px;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
        }

        .produto img {
            width: 100%;
            border-radius: 8px;
        }

        button {
            background: #8b35e8;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #a65cff;
        }

        footer {
            background: #25253b;
            text-align: center;
            padding: 20px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>GAME STORE</h1>
        <p>O universo dos jogos está aqui!</p>
    </header>

    <nav>
        <a href="#inicio">Início</a>
        <a href="#produtos">Produtos</a>
        <a href="#contato">Contato</a>
    </nav>

    <main id="inicio">

        <h2>Conheça nossos produtos</h2>

        <section class="produtos" id="produtos">

            <div class="produto">
                <img src="https://placehold.co/220x150/25253b/ffffff?text=Controle"
                alt="Controle de videogame">
                <h3>Controle Gamer</h3>
                <p>R$ 150,00</p>
                <button onclick="alert('Produto selecionado!')">
                    Comprar
                </button>
            </div>

            <div class="produto">
                <img src="https://placehold.co/220x150/25253b/ffffff?text=Headset"
                alt="Headset gamer">
                <h3>Headset Gamer</h3>
                <p>R$ 200,00</p>
                <button onclick="alert('Produto selecionado!')">
                    Comprar
                </button>
            </div>

            <div class="produto">
                <img src="https://placehold.co/220x150/25253b/ffffff?text=Teclado"
                alt="Teclado gamer">
                <h3>Teclado Gamer</h3>
                <p>R$ 180,00</p>
                <button onclick="alert('Produto selecionado!')">
                    Comprar
                </button>
            </div>

        </section>
    </main>

    <footer id="contato">
        <p>© 2026 Game Store - Todos os direitos reservados.</p>
    </footer>

<script src="script.js"></script></body>
</html>
