
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC Neon</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <header>
            <span class="icone">✧</span>
            <p class="tag">HEALTH SYSTEM / 2026</p>
            <h1>IMC <span>NEON</span></h1>
            <p class="descricao">Sistema inteligente de cálculo</p>
        </header>

        <form id="imcForm">
            <div class="campo">
                <label for="nome">IDENTIFICAÇÃO</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label for="peso">PESO (KG)</label>
                <input type="number" id="peso" placeholder="Ex: 60" min="0.1" step="any" required>
            </div>

            <div class="campo">
                <label for="altura">ALTURA (M)</label>
                <input type="number" id="altura" placeholder="Ex: 1.70" min="0.1" step="any" required>
            </div>

            <button type="submit">EXECUTAR CÁLCULO →</button>
        </form>

        <section id="resultado" class="resultado" aria-live="polite">
            <p class="status">AGUARDANDO DADOS...</p>
            <h2>Resultado aparecerá aqui</h2>
        </section>

        <footer>IMC NEON • INTERFACE DIGITAL</footer>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
