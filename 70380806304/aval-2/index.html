
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitControl | Academia</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h1>FitControl</h1>
    <p>Gerencie alunos, planos e frequência.</p>
  </header>

  <main>
    <section>
      <h2>Cadastrar aluno</h2>
      <form id="alunoForm">
        <input id="nome" placeholder="Nome do aluno" required minlength="3">
        <input id="idade" type="number" min="12" max="100" placeholder="Idade" required>

        <select id="plano" required>
          <option value="">Selecione um plano</option>
          <option>Mensal</option>
          <option>Trimestral</option>
          <option>Anual</option>
        </select>

        <button type="submit">Cadastrar aluno</button>
      </form>
    </section>

    <section>
      <h2>Registrar frequência</h2>
      <form id="frequenciaForm">
        <select id="alunoEscolhido" required>
          <option value="">Selecione um aluno</option>
        </select>

        <button type="submit">Registrar entrada</button>
      </form>

      <p id="mensagem" role="status"></p>
    </section>

    <section>
      <h2>Alunos cadastrados</h2>
      <div id="alunos"></div>
    </section>

    <section>
      <h2>Histórico de frequência</h2>
      <div id="historico"></div>
    </section>
  </main>

  <footer>
    <p>FitControl © 2026</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
