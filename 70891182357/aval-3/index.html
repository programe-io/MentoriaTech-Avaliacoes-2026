<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sistema de Tarefas</title>

    <!-- Conecta o CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <!-- TÍTULO -->
        <h1>📋 Sistema de Tarefas</h1>

        <p class="subtitulo">
            Gerencie suas tarefas de forma simples
        </p>


        <!-- FORMULÁRIO -->
        <div class="formulario">

            <input
                type="text"
                id="titulo"
                placeholder="Digite o título da tarefa"
            >

            <select id="prioridade">

                <option value="1">
                    Prioridade 1
                </option>

                <option value="2">
                    Prioridade 2
                </option>

                <option value="3">
                    Prioridade 3
                </option>

            </select>

            <button onclick="adicionarTarefa()">
                Adicionar
            </button>

        </div>


        <!-- TÍTULO DAS TAREFAS -->

        <h2>Minhas tarefas</h2>


        <!-- ONDE AS TAREFAS SERÃO MOSTRADAS -->

        <div
            id="listaTarefas"
            class="tarefas">
        </div>


        <!-- ESTATÍSTICAS -->

        <div class="estatisticas">

            <div class="estatistica">

                <h3 id="totalTarefas">
                    0
                </h3>

                <p>
                    Total
                </p>

            </div>


            <div class="estatistica">

                <h3 id="tarefasPendentes">
                    0
                </h3>

                <p>
                    Pendentes
                </p>

            </div>


            <div class="estatistica">

                <h3 id="tarefasConcluidas">
                    0
                </h3>

                <p>
                    Concluídas
                </p>

            </div>

        </div>

    </div>


    <!--
        IMPORTANTE:
        Coloque seu código JavaScript em um arquivo
        chamado script.js
    -->

    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
