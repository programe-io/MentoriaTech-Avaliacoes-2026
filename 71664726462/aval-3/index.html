<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Games</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Loja de Games</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Produtos</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </nav>

    <main>

        <section>
            <h2>Jogos em Destaque</h2>

            <div class="container">

                <article>
                    <img src="https://via.placeholder.com/250x150" alt="Jogo de Aventura">

                    <h3>Jogo de Aventura</h3>

                    <p>
                        Preço:
                        <span>R$ 99,90</span>
                    </p>

                    <button onclick="comprar()">
                        Comprar
                    </button>
                </article>

                <article>
                    <img src="https://via.placeholder.com/250x150" alt="Jogo de Corrida">

                    <h3>Jogo de Corrida</h3>

                    <p>
                        Preço:
                        <span>R$ 149,90</span>
                    </p>

                    <button onclick="comprar()">
                        Comprar
                    </button>
                </article>

            </div>

        </section>

        <aside>
            <h3>Promoção da Semana</h3>

            <p>
                Desconto de
                <span>20%</span>
                em todos os jogos.
            </p>
        </aside>

        <section>

            <h2>Cadastro</h2>

            <form>

                <label for="nome">Nome:</label>
                <input type="text" id="nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email">

                <button type="submit">
                    Enviar
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 Loja de Games</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
