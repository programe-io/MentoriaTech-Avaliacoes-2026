<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socialgram</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Socialgram</h1>

        <nav>
            <a href="#">Início</a>
            <a href="#">Explorar</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main>
        <section class="feed" aria-label="Publicações">

            <article class="post">
                <header class="post-header">
                    <img src="https://i.pravatar.cc/50?img=12" alt="Foto de perfil de Ana">
                    <strong>Ana Silva</strong>
                </header>

                <img
                    class="post-image"
                    src="https://picsum.photos/600/400?random=1"
                    alt="Paisagem publicada por Ana"
                >

                <div class="post-content">
                    <button class="like">♡ Curtir</button>
                    <p><strong>Ana Silva</strong> Aproveitando o dia! ☀️</p>
                </div>
            </article>

            <article class="post">
                <header class="post-header">
                    <img src="https://i.pravatar.cc/50?img=5" alt="Foto de perfil de Carlos">
                    <strong>Carlos Santos</strong>
                </header>

                <img
                    class="post-image"
                    src="https://picsum.photos/600/400?random=2"
                    alt="Foto publicada por Carlos"
                >

                <div class="post-content">
                    <button class="like">♡ Curtir</button>
                    <p><strong>Carlos Santos</strong> Um lugar incrível! 🌄</p>
                </div>
            </article>

        </section>

        <aside>
            <h2>Sugestões</h2>
            <p>Mariana Costa</p>
            <p>João Oliveira</p>
            <p>Pedro Lima</p>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 Socialgram</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
