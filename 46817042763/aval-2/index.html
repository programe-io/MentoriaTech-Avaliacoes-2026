<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de tarefas</title>
  <link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Gerenciador de tarefas</h1>
    <p class="intro">Cadastre, organize e conclua suas tarefas.</p>

    <section class="summary" aria-label="Resumo">
      <div class="card"><span>Total</span><strong id="total">0</strong></div>
      <div class="card"><span>Em andamento</span><strong id="andamento">0</strong></div>
      <div class="card"><span>Concluídas</span><strong id="concluidas">0</strong></div>
    </section>

    <section class="panel">
      <h2>Nova tarefa</h2>

      <label for="titulo">Título (mínimo 5 caracteres)</label>
      <input id="titulo" type="text" placeholder="Ex.: Estudar JavaScript">

      <label for="prioridade">Prioridade</label>
      <select id="prioridade">
        <option value="1">1 — Alta</option>
        <option value="2" selected>2 — Média</option>
        <option value="3">3 — Baixa</option>
      </select>

      <button
        id="botao-adicionar"
        type="button"
        onclick="adicionarTarefa()"
      >
        Adicionar tarefa
      </button>

      <p id="mensagem" role="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <div class="list-head">
        <h2>Tarefas</h2>

        <label for="filtro" style="display:none">Filtrar tarefas</label>
        <select id="filtro" onchange="desenharTarefas()">
          <option value="todas">Todas</option>
          <option value="andamento">Em andamento</option>
          <option value="concluidas">Concluídas</option>
        </select>
      </div>

      <ul id="lista"></ul>
      <p id="vazia">Nenhuma tarefa cadastrada ainda.</p>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
