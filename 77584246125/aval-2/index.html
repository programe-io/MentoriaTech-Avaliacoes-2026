<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="topo">
  <h1>Meu Feed</h1>
  <p>Um espaço para compartilhar ideias</p>
</header>

<main class="container">
  <section class="criador">
    <h2>O que você está pensando?</h2>

    <form id="post-form">
      <textarea
        id="texto-post"
        maxlength="280"
        placeholder="Escreva uma publicação..."
        required
      ></textarea>

      <button type="submit">Publicar</button>
    </form>
  </section>

  <section class="feed">
    <h2>Publicações</h2>

    <div id="lista-posts">
      <article class="post">
        <div class="post-cabecalho">
          <div class="avatar">D</div>
          <div>
            <strong>Dallyson</strong>
            <span class="data">Uma publicação de exemplo</span>
          </div>
        </div>

        <p class="mensagem">Bem-vindo ao meu feed social!</p>

        <button class="botao-curtir" type="button" aria-pressed="false">
          <span class="texto-curtir">♡ Curtir</span>
          <span class="contagem-curtidas">0</span>
        </button>
      </article>
    </div>
  </section>
</main>

<footer>
  <p>Feed criado por Dallyson</p>
</footer>

  <script src="script.js"></script>
  
</body>
</html>
