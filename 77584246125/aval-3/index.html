<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="barra-topo">
  <h1>FotoFeed</h1>
  <span>Projeto escolar</span>
</header>

<main class="pagina">
  <section class="conteudo">
    <div class="stories">
      <div class="story"><span>🌻</span><small>ana</small></div>
      <div class="story"><span>🏀</span><small>lucas</small></div>
      <div class="story"><span>🐶</span><small>bia</small></div>
      <div class="story"><span>🎨</span><small>rafa</small></div>
    </div>

    <article class="publicacao">
      <div class="autor"><span class="avatar">A</span><strong>ana.fotos</strong></div>
      <div class="foto foto-paisagem" role="img" aria-label="Ilustração de uma paisagem">🌄</div>
      <div class="acoes">
        <button class="curtir" type="button">♡ Curtir</button>
      </div>
      <p><strong>ana.fotos</strong> Um dia lindo para aproveitar a natureza!</p>
      <div class="comentarios"></div>
      <form class="form-comentario">
        <input type="text" placeholder="Escreva um comentário..." required>
        <button type="submit">Enviar</button>
      </form>
    </article>

    <article class="publicacao">
      <div class="autor"><span class="avatar avatar-azul">L</span><strong>lucas.joga</strong></div>
      <div class="foto foto-esporte" role="img" aria-label="Ilustração de uma bola de basquete">🏀</div>
      <div class="acoes">
        <button class="curtir" type="button">♡ Curtir</button>
      </div>
      <p><strong>lucas.joga</strong> Treino de hoje concluído!</p>
      <div class="comentarios"></div>
      <form class="form-comentario">
        <input type="text" placeholder="Escreva um comentário..." required>
        <button type="submit">Enviar</button>
      </form>
    </article>
  </section>

  <aside class="perfil">
    <div class="autor"><span class="avatar">D</span><strong>Dallyson</strong></div>
    <p>Bem-vindo ao meu FotoFeed!</p>
    <small>Projeto inspirado em redes sociais de fotos.</small>
  </aside>
</main>

<footer>Projeto criado por Dallyson</footer>

  <script src="script.js"></script>
