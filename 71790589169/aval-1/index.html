<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <!-- CABEÇALHO -->
        <header>
            <h1>📦 Sistema de Estoque</h1>

            <p>
                Gerenciamento de produtos, quantidades e valores
            </p>
        </header>


        <!-- CADASTRO DE PRODUTO -->
        <section class="card">

            <h2>Cadastrar Novo Produto</h2>

            <div class="formulario">

                <div class="campo">
                    <label for="codigo">
                        Código do Produto
                    </label>

                    <input
                        type="text"
                        id="codigo"
                        placeholder="Ex: 001"
                    >
                </div>


                <div class="campo">
                    <label for="descricao">
                        Descrição
                    </label>

                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: Notebook"
                    >
                </div>


                <div class="campo">
                    <label for="quantidade">
                        Quantidade
                    </label>

                    <input
                        type="number"
                        id="quantidade"
                        min="0"
                        placeholder="Ex: 10"
                    >
                </div>


                <div class="campo">
                    <label for="valor">
                        Valor (R$)
                    </label>

                    <input
                        type="number"
                        id="valor"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 2500.00"
                    >
                </div>

            </div>


            <button onclick="cadastrarProduto()">
                Cadastrar Produto
            </button>

        </section>


        <!-- ALTERAÇÕES -->
        <section class="card">

            <h2>Alterar Produto</h2>

            <div class="formulario">

                <div class="campo">

                    <label for="codigoAlteracao">
                        Código do Produto
                    </label>

                    <input
                        type="text"
                        id="codigoAlteracao"
                        placeholder="Digite o código"
                    >

                </div>


                <div class="campo">

                    <label for="novoValor">
                        Novo Valor (R$)
                    </label>

                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        placeholder="Digite o novo valor"
                    >

                </div>


                <div class="campo">

                    <label for="novaQuantidade">
                        Nova Quantidade
                    </label>

                    <input
                        type="number"
                        id="novaQuantidade"
                        min="0"
                        placeholder="Digite a nova quantidade"
                    >

                </div>

            </div>


            <div class="botoes">

                <button onclick="alterarValor()">
                    Alterar Valor
                </button>

                <button onclick="alterarQuantidade()">
                    Alterar Quantidade
                </button>

            </div>

        </section>


        <!-- LISTAGEM -->
        <section class="card">

            <div class="titulo-lista">

                <h2>Produtos Cadastrados</h2>

                <span id="totalProdutos">
                    0 produtos
                </span>

            </div>


            <div id="listaProdutos">

                <div class="mensagem-vazia">
                    Nenhum produto cadastrado.
                </div>

            </div>

        </section>


        <!-- MENSAGEM -->
        <div id="mensagem"></div>


        <!-- RODAPÉ -->
        <footer>

            <p>
                Sistema de Estoque - Projeto Prático
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
