
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Sistema de Estoque</h1>

        <h2>Cadastrar Produto</h2>

        <form id="formProduto">
            <input type="number" id="codigo" placeholder="Código do produto" required>

            <input type="text" id="descricao" placeholder="Descrição do produto" required>

            <input type="number" id="quantidade" placeholder="Quantidade" min="0" step="1" required>

            <input type="number" id="valor" placeholder="Valor do produto (R$)" min="0" step="0.01" required>

            <button type="submit">Cadastrar Produto</button>
        </form>

        <h2>Alterar Produto</h2>

        <input type="number" id="codigoAlterar" placeholder="Código do produto">

        <input type="number" id="novoValor" placeholder="Novo valor (R$)" min="0" step="0.01">

        <button type="button" id="btnValor">Alterar Valor</button>

        <input type="number" id="novaQuantidade" placeholder="Nova quantidade" min="0" step="1">

        <button type="button" id="btnQuantidade">Alterar Quantidade</button>

        <h2>Produtos Cadastrados</h2>

        <button type="button" id="btnListar">Listar Produtos</button>

        <div id="listaProdutos">
            <p>Nenhum produto listado.</p>
        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
