<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <!-- CABEÇALHO -->
        <header>
            <h1>✓ Gerenciador de Tarefas</h1>

            <p>
                Cadastre, organize e acompanhe suas tarefas.
            </p>
        </header>


        <!-- CADASTRO -->
        <section class="card">

            <h2>Nova Tarefa</h2>

            <div class="formulario">

                <!-- TÍTULO -->
                <div class="campo">

                    <label for="titulo">
                        Título da tarefa
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título da tarefa"
                    >

                    <small>
                        O título deve ter no mínimo 5 caracteres.
                    </small>

                </div>


                <!-- PRIORIDADE -->
                <div class="campo">

                    <label for="prioridade">
                        Prioridade
                    </label>

                    <select id="prioridade">

                        <option value="">
                            Selecione a prioridade
                        </option>

                        <option value="1">
                            1 - Alta
                        </option>

                        <option value="2">
                            2 - Média
                        </option>

                        <option value="3">
                            3 - Baixa
                        </option>

                    </select>

                </div>

            </div>


            <button onclick="cadastrarTarefa()">
                + Cadastrar Tarefa
            </button>

        </section>


        <!-- ALTERAR PRIORIDADE -->
        <section class="card">

            <h2>Alterar Prioridade</h2>

            <div class="formulario">

                <div class="campo">

                    <label for="codigoAlteracao">
                        Código da tarefa
                    </label>

                    <input
                        type="number"
                        id="codigoAlteracao"
                        placeholder="Digite o código"
                        min="1"
                    >

                </div>


                <div class="campo">

                    <label for="novaPrioridade">
                        Nova prioridade
                    </label>

                    <select id="novaPrioridade">

                        <option value="">
                            Selecione a prioridade
                        </option>

                        <option value="1">
                            1 - Alta
                        </option>

                        <option value="2">
                            2 - Média
                        </option>

                        <option value="3">
                            3 - Baixa
                        </option>

                    </select>

                </div>

            </div>


            <button onclick="alterarPrioridade()">
                Alterar Prioridade
            </button>

        </section>


        <!-- LISTAGEM -->
        <section class="card">

            <div class="titulo-lista">

                <div>
                    <h2>Tarefas Cadastradas</h2>

                    <p class="descricao-lista">
                        Acompanhe todas as tarefas do sistema.
                    </p>
                </div>

                <span id="totalTarefas">
                    0 tarefas
                </span>

            </div>


            <!-- LISTA -->
            <div id="listaTarefas">

                <div class="mensagem-vazia">
                    Nenhuma tarefa cadastrada.
                </div>

            </div>

        </section>


        <!-- MENSAGEM -->
        <div id="mensagem"></div>


        <!-- RODAPÉ -->
        <footer>

            <p>
                Sistema de Gerenciamento de Tarefas
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
