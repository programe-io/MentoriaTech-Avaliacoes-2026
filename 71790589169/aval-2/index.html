<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #263a5b;
        }

        input, select, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .tarefa {
            background: #f8fafc;
            padding: 15px;
            margin-top: 12px;
            border-left: 5px solid #2563eb;
            border-radius: 5px;
        }

        .concluida {
            border-left-color: green;
            opacity: 0.7;
        }

        .concluida strong {
            text-decoration: line-through;
        }

        .acoes button {
            margin-right: 5px;
        }

        .excluir {
            background: #dc2626;
        }

        .excluir:hover {
            background: #b91c1c;
        }

        .mensagem {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Gerenciador de Tarefas</h1>

    <h3>Cadastrar nova tarefa</h3>

    <input
        type="text"
        id="titulo"
        placeholder="Digite o título da tarefa"
    >

    <select id="prioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="cadastrarTarefa()">
        Cadastrar tarefa
    </button>

    <p id="mensagem" class="mensagem"></p>

    <hr>

    <h3>Lista de tarefas</h3>

    <div id="listaTarefas"></div>

</div>

<script>

    let tarefas = [];
    let proximoCodigo = 1;

    // 1. Cadastrar tarefa
    function cadastrarTarefa() {

        let titulo = document.getElementById("titulo").value.trim();
        let prioridade = Number(document.getElementById("prioridade").value);

        if (titulo.length < 5) {
            mostrarMensagem("O título deve ter no mínimo 5 caracteres!");
            return;
        }

        if (prioridade < 1 || prioridade > 3) {
            mostrarMensagem("A prioridade deve ser entre 1 e 3!");
            return;
        }

        let tarefa = {
            codigo: proximoCodigo,
            titulo: titulo,
            prioridade: prioridade,
            concluida: false
        };

        tarefas.push(tarefa);
        proximoCodigo++;

        document.getElementById("titulo").value = "";

        mostrarMensagem("Tarefa cadastrada com sucesso!");

        listarTarefas();
    }

    // 2. Listar tarefas
    function listarTarefas() {

        let lista = document.getElementById("listaTarefas");

        lista.innerHTML = "";

        if (tarefas.length === 0) {
            lista.innerHTML = "<p>Nenhuma tarefa cadastrada.</p>";
            return;
        }

        tarefas.forEach(tarefa => {

            let div = document.createElement("div");

            div.className = tarefa.concluida
                ? "tarefa concluida"
                : "tarefa";

            let titulo = document.createElement("strong");
            titulo.textContent = tarefa.titulo;

            let informacoes = document.createElement("p");
            informacoes.textContent =
                "Código: " + tarefa.codigo +
                " | Prioridade: " + tarefa.prioridade +
                " | Status: " +
                (tarefa.concluida ? "Concluída" : "Pendente");

            div.appendChild(titulo);
            div.appendChild(informacoes);

            let acoes = document.createElement("div");
            acoes.className = "acoes";

            // Botão concluir
            let botaoConcluir = document.createElement("button");
            botaoConcluir.textContent = "Concluir";
            botaoConcluir.disabled = tarefa.concluida;
            botaoConcluir.onclick = function() {
                concluirTarefa(tarefa.codigo);
            };

            // Botão alterar prioridade
            let botaoPrioridade = document.createElement("button");
            botaoPrioridade.textContent = "Alterar prioridade";
            botaoPrioridade.onclick = function() {
                alterarPrioridade(tarefa.codigo);
            };

            acoes.appendChild(botaoConcluir);
            acoes.appendChild(botaoPrioridade);

            div.appendChild(acoes);
            lista.appendChild(div);

        });
    }

    // 3. Marcar tarefa como concluída
    function concluirTarefa(codigo) {

        let tarefa = tarefas.find(t => t.codigo === codigo);

        if (!tarefa) {
            mostrarMensagem("Tarefa não encontrada!");
            return;
        }

        tarefa.concluida = true;

        mostrarMensagem("Tarefa concluída com sucesso!");

        listarTarefas();
    }

    // 4. Alterar prioridade
    function alterarPrioridade(codigo) {

        let novaPrioridade = Number(
            prompt("Digite a nova prioridade: 1 (Alta), 2 (Média) ou 3 (Baixa)")
        );

        if (![1, 2, 3].includes(novaPrioridade)) {
            mostrarMensagem("Prioridade inválida!");
            return;
        }

        let tarefa = tarefas.find(t => t.codigo === codigo);

        if (!tarefa) {
            mostrarMensagem("Tarefa não encontrada!");
            return;
        }

        tarefa.prioridade = novaPrioridade;

        mostrarMensagem("Prioridade alterada com sucesso!");

        listarTarefas();
    }

    // Exibir mensagens
    function mostrarMensagem(texto) {
        document.getElementById("mensagem").textContent = texto;
    }

    // Exibir lista inicial
    listarTarefas();

</script>

<script src="script.js"></script></body>
</html>
