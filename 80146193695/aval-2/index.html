<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Social</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Barra de Navegação -->
    <header class="navbar">
        <div class="logo">SocialNet</div>
        <input type="text" placeholder="Pesquisar no feed..." class="search-bar">
        <div class="user-profile-nav">Meu Perfil</div>
    </header>

    <!-- Container Principal do Feed -->
    <main class="feed-container">
        
        <!-- Caixa de Criação de Post -->
        <div class="create-post">
            <div class="post-header">
                <div class="avatar"></div>
                <input type="text" placeholder="No que você está pensando?" class="post-input">
            </div>
            <div class="post-actions-create">
                <button class="btn-media">📷 Foto/Vídeo</button>
                <button class="btn-submit">Publicar</button>
            </div>
        </div>

        <!-- Card de Postagem -->
        <article class="post-card">
            <!-- Cabeçalho do Post -->
            <div class="post-user-info">
                <div class="avatar"></div>
                <div>
                    <h3 class="username">Nome do Usuário</h3>
                    <span class="post-time">Há 2 horas</span>
                </div>
            </div>
            
            <!-- Conteúdo do Post -->
            <div class="post-content">
                <p>Acabei de finalizar o desenvolvimento dessa interface de feed usando apenas HTML e CSS! O que acharam do visual? 🚀💻 #programacao #webdev</p>
                <div class="post-image-placeholder">🎨 [Imagem do Post]</div>
            </div>

            <!-- Botões de Interação -->
            <div class="post-interactions">
                <button class="interaction-btn">👍 Curtir</button>
                <button class="interaction-btn">💬 Comentar</button>
                <button class="interaction-btn">🔁 Compartilhar</button>
            </div>
        </article>

    </main>

</body>
</html>$0
