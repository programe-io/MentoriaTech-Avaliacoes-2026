<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HTML Completo</title>

  <style>
    body { font-family: Arial; }

    .destaque { color: red; font-weight: bold; }

    header, footer, main, section, article, aside {
      border: 1px solid #ccc;
      margin: 5px;
      padding: 10px;
    }
  </style>
<link href="style.css" rel="stylesheet"></head>

<body>

  <!-- HEADER -->
  <header>
    <h1>Título principal</h1>
    <h3>Subtítulo com <span class="destaque">SPAN</span></h3>

    <nav>
      <a href="#">Home</a>
      <a href="#">Sobre</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <!-- MAIN -->
  <main>

    <section>
      <h2>Seção</h2>

      <article>
        <h3>Artigo</h3>
        <p>Texto normal com <span class="destaque">destaque</span>.</p>
      </article>

      <aside>
        <p>Conteúdo lateral</p>
      </aside>
    </section>

    <!-- LISTAS -->
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
    </ul>

    <ol>
      <li>Item ordenado</li>
      <li>Outro item</li>
    </ol>

    <!-- IMAGEM -->
    <figure>
      <img src="https://via.placeholder.com/150" alt="Imagem">
      <figcaption>Legenda</figcaption>
    </figure>

    <!-- TABELA -->
    <table border="1">
      <tr>
        <th>Nome</th>
        <th>Idade</th>
      </tr>
      <tr>
        <td>João</td>
        <td>15</td>
      </tr>
    </table>

    <!-- FORMULÁRIO -->
    <form>
      <label>Nome:</label>
      <input type="text">

      <br>

      <label>Email:</label>
      <input type="email">

      <br>

      <label>Senha:</label>
      <input type="password">

      <br>

      <select>
        <option>Opção 1</option>
        <option>Opção 2</option>
      </select>

      <br>

      <button type="submit">Enviar</button>
    </form>

    <!-- MÍDIA -->
    <video controls>
      <source src="video.mp4" type="video/mp4">
    </video>

    <audio controls>
      <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <!-- OUTROS ELEMENTOS -->
    <div>
      <p>Div genérica com <span class="destaque">span</span></p>
    </div>

    <hr>

    <p>Texto com <br> quebra de linha</p>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>Rodapé do site</p>
  </footer>

<script src="script.js"></script></body>
</html>
