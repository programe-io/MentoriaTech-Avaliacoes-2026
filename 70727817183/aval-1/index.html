```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <!-- Formulário de cadastro -->
        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">
                <label for="descricao">Descrição do produto:</label>
                <input type="text" id="descricao" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="1" required>

                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor" min="0" step="0.01" required>

                <button type="submit">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Formulário de atualização -->
        <section class="formulario">
            <h2>Atualizar Produto</h2>

            <label for="codigoAtualizar">Código do produto:</label>
            <input type="number" id="codigoAtualizar" min="1">

            <label for="novoValor">Novo valor (R$):</label>
            <input type="number" id="novoValor" min="0" step="0.01">

            <button type="button" id="btnAtualizarValor">
                Atualizar Valor
            </button>

            <label for="novaQuantidade">Adicionar quantidade:</label>
            <input type="number" id="novaQuantidade" min="1">

            <button type="button" id="btnAtualizarQuantidade">
                Atualizar Quantidade
            </button>
        </section>

        <!-- Lista de produtos -->
        <section class="lista-produtos">
            <h2>Produtos Cadastrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                    <!-- Os produtos aparecerão aqui -->
                </tbody>
            </table>
        </section>

        <p id="mensagem"></p>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
```
