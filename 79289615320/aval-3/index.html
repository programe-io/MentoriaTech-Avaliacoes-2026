<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@ofilhos_z • Instagram</title>
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #262626;
      --muted: #737373;
      --border: #dbdbdb;
      --btn-bg: #efefef;
      --btn-hover: #dbdbdb;
      --primary: #0095f6;
      --primary-hover: #1877f2;
    }

    body.dark {
      --bg: #000000;
      --card: #121212;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --border: #262626;
      --btn-bg: #363636;
      --btn-hover: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s, color 0.2s;
    }

    /* Barra superior */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .theme-btn {
      background: var(--btn-bg);
      color: var(--text);
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .theme-btn:hover { background: var(--btn-hover); }

    /* Container principal */
    main {
      max-width: 935px;
      margin: 28px auto;
      padding: 0 16px 60px;
    }

    /* Cabeçalho do perfil */
    .profile-header {
      display: flex;
      gap: 48px;
      align-items: center;
      margin-bottom: 36px;
    }

    .avatar-ring {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      flex-shrink: 0;
      cursor: pointer;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      font-weight: 800;
      border: 4px solid var(--bg);
    }

    .profile-info { flex: 1; }

    .profile-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 18px;
    }

    .username {
      font-size: 1.4rem;
      font-weight: 400;
    }

    .btn {
      border: none;
      padding: 7px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn-follow {
      background: var(--primary);
      color: #fff;
    }

    .btn-follow:hover { background: var(--primary-hover); }

    .btn-follow.following {
      background: var(--btn-bg);
      color: var(--text);
    }

    .btn-secondary {
      background: var(--btn-bg);
      color: var(--text);
    }

    .btn-secondary:hover { background: var(--btn-hover); }

    .stats {
      display: flex;
      gap: 32px;
      margin-bottom: 16px;
      font-size: 1rem;
    }

    .stats span strong { font-weight: 600; }

    .bio {
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .bio a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    /* Destaques */
    .highlights {
      display: flex;
      gap: 24px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    .highlight {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      min-width: 78px;
    }

    .highlight-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      transition: transform 0.15s;
    }

    .highlight:hover .highlight-circle { transform: scale(1.05); }

    .highlight span {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
    }

    /* Abas */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 48px;
      border-top: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .tab {
      background: none;
      border: none;
      border-top: 2px solid transparent;
      color: var(--muted);
      padding: 14px 4px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: -1px;
    }

    .tab.active {
      color: var(--text);
      border-top-color: var(--text);
    }

    /* Grade de posts */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .post-thumb {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      background: #222;
    }

    .post-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s;
    }

    .post-thumb:hover img { transform: scale(1.04); }

    .post-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .post-thumb:hover .post-overlay { opacity: 1; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
    }

    .modal-img {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-img img {
      width: 100%;
      height: 100%;
      max-height: 85vh;
      object-fit: cover;
    }

    .modal-side {
      display: flex;
      flex-direction: column;
      max-height: 85vh;
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .modal-comments {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.9rem;
    }

    .modal-actions {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
    }

    .action-icons {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      margin-right: 10px;
    }

    .likes-count {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .comment-form {
      display: flex;
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      gap: 8px;
    }

    .comment-form input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
      font-size: 0.9rem;
    }

    .comment-form button {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
    }

    /* Story modal */
    .story-box {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      color: #fff;
      width: 340px;
      height: 540px;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      text-align: center;
    }

    .story-bar {
      height: 3px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      overflow: hidden;
    }

    .story-progress {
      height: 100%;
      width: 100%;
      background: #fff;
    }

    @media (max-width: 700px) {
      .profile-header {
        flex-direction: column;
        text-align: center;
        gap: 20px;
      }
      .profile-top, .stats { justify-content: center; }
      .modal { grid-template-columns: 1fr; }
      .modal-img img { max-height: 300px; }
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <header>
    <div class="logo">Instagram</div>
    <button class="theme-btn" id="themeBtn">🌙 Modo Escuro</button>
  </header>

  <main>
    <!-- Cabeçalho do Perfil -->
    <section class="profile-header">
      <div class="avatar-ring" onclick="openStory('Perfil @ofilhos_z', '🔥 Bem-vindo ao perfil oficial de @ofilhos_z!')">
        <div class="avatar">OZ</div>
      </div>

      <div class="profile-info">
        <div class="profile-top">
          <h1 class="username">ofilhos_z</h1>
          <button class="btn btn-follow" id="followBtn">Seguir</button>
          <button class="btn btn-secondary" onclick="alert('Mensagem enviada para @ofilhos_z!')">Mensagem</button>
        </div>

        <div class="stats">
          <span><strong id="postCount">6</strong> publicações</span>
          <span><strong id="followerCount">1.240</strong> seguidores</span>
          <span><strong>312</strong> seguindo</span>
        </div>

        <div class="bio">
          <strong>O Filhos Z</strong><br />
          Criador de conteúdo • Lifestyle & Projetos 🚀<br />
          📍 Brasil<br />
          <a href="https://www.instagram.com/ofilhos_z/" target="_blank">instagram.com/ofilhos_z</a>
        </div>
      </div>
    </section>

    <!-- Destaques -->
    <section class="highlights">
      <div class="highlight" onclick="openStory('Novidades', '🚀 Novos projetos chegando em breve!')">
        <div class="highlight-circle">🚀</div>
        <span>Novidades</span>
      </div>
      <div class="highlight" onclick="openStory('Bastidores', '🎬 Um pouco do dia a dia nos bastidores.')">
        <div class="highlight-circle">🎬</div>
        <span>Bastidores</span>
      </div>
      <div class="highlight" onclick="openStory('Viagens', '✈️ Melhores momentos na estrada.')">
        <div class="highlight-circle">✈️</div>
        <span>Viagens</span>
      </div>
      <div class="highlight" onclick="openStory('Contato', '📩 Parcerias via Direct!')">
        <div class="highlight-circle">📩</div>
        <span>Contato</span>
      </div>
    </section>

    <!-- Abas -->
    <nav class="tabs">
      <button class="tab active" onclick="switchTab('posts', this)">Publicações</button>
      <button class="tab" onclick="switchTab('reels', this)">Reels</button>
      <button class="tab" onclick="switchTab('tagged', this)">Marcados</button>
    </nav>

    <!-- Grade -->
    <section class="grid" id="postGrid"></section>
  </main>

  <!-- Modal de Post -->
  <div class="modal-backdrop" id="postModal">
    <div class="modal">
      <div class="modal-img">
        <img id="modalImg" src="" alt="Post" />
      </div>
      <div class="modal-side">
        <div class="modal-header">
          <span>@ofilhos_z</span>
          <button class="close-btn" onclick="closePostModal()">×</button>
        </div>
        <div class="modal-comments" id="modalComments"></div>
        <div class="modal-actions">
          <div class="action-icons">
            <div>
              <button class="icon-btn" id="likeBtn" onclick="toggleLike()">🤍</button>
              <button class="icon-btn" onclick="document.getElementById('commentInput').focus()">💬</button>
            </div>
            <button class="icon-btn" id="saveBtn" onclick="toggleSave()">🔖</button>
          </div>
          <div class="likes-count" id="modalLikes">0 curtidas</div>
        </div>
        <form class="comment-form" onsubmit="addComment(event)">
          <input type="text" id="commentInput" placeholder="Adicione um comentário..." required />
          <button type="submit">Publicar</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal de Story -->
  <div class="modal-backdrop" id="storyModal" onclick="closeStory()">
    <div class="story-box" onclick="event.stopPropagation()">
      <div>
        <div class="story-bar"><div class="story-progress"></div></div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
          <strong id="storyTitle">@ofilhos_z</strong>
          <button class="close-btn" style="color:#fff" onclick="closeStory()">×</button>
        </div>
      </div>
      <p id="storyText" style="font-size:1.3rem; line-height:1.5;"></p>
      <small style="opacity:0.7;">Toque fora para fechar</small>
    </div>
  </div>

  <script>
    const data = {
      posts: [
        {
          id: 1,
          img: "https://picsum.photos/id/1015/600/600",
          caption: "Mais um dia incrível! 🔥 #ofilhos_z",
          likes: 128,
          liked: false,
          saved: false,
          comments: [{ user: "amigo_01", text: "Brabo demais! 👏" }]
        },
        {
          id: 2,
          img: "https://picsum.photos/id/1025/600/600",
          caption: "Foco total nos novos objetivos. 🚀",
          likes: 94,
          liked: false,
          saved: false,
          comments: [{ user: "maria.silva", text: "Amei essa foto!" }]
        },
        {
          id: 3,
          img: "https://picsum.photos/id/1039/600/600",
          caption: "Energia boa sempre. ✨",
          likes: 215,
          liked: false,
          saved: false,
          comments: []
        },
        {
          id: 4,
          img: "https://picsum.photos/id/1043/600/600",
          caption: "Bastidores de hoje 🎬",
          likes: 76,
          liked: false,
          saved: false,
          comments: []
        },
        {
          id: 5,
          img: "https://picsum.photos/id/1050/600/600",
          caption: "Paisagem de respeito 🌊",
          likes: 183,
          liked: false,
          saved: false,
          comments: []
        },
        {
          id: 6,
          img: "https://picsum.photos/id/1062/600/600",
          caption: "Seguimos firmes! 💪",
          likes: 142,
          liked: false,
          saved: false,
          comments: []
        }
      ],
      reels: [
        {
          id: 7,
          img: "https://picsum.photos/id/1074/600/600",
          caption: "🎬 Reel novo no ar! Confere aí.",
          likes: 430,
          liked: false,
          saved: false,
          comments: [{ user: "lucas_dev", text: "Edição insana!" }]
        }
      ],
      tagged: [
        {
          id: 8,
          img: "https://picsum.photos/id/1084/600/600",
          caption: "Marcado pela galera! 🙌",
          likes: 89,
          liked: false,
          saved: false,
          comments: []
        }
      ]
    };

    let currentTab = "posts";
    let activePost = null;
    let isFollowing = false;
    let followers = 1240;

    // Renderizar grade
    function renderGrid() {
      const grid = document.getElementById("postGrid");
      const items = data[currentTab];
      grid.innerHTML = "";

      items.forEach(post => {
        const div = document.createElement("div");
        div.className = "post-thumb";
        div.onclick = () => openPostModal(post);
        div.innerHTML = `
          <img src="${post.img}" alt="Post">
          <div class="post-overlay">
            <span>❤️ ${post.likes}</span>
            <span>💬 ${post.comments.length}</span>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      renderGrid();
    }

    // Seguir / Seguindo
    const followBtn = document.getElementById("followBtn");
    followBtn.onclick = () => {
      isFollowing = !isFollowing;
      followers += isFollowing ? 1 : -1;
      document.getElementById("followerCount").textContent = followers.toLocaleString("pt-BR");
      followBtn.textContent = isFollowing ? "Seguindo" : "Seguir";
      followBtn.classList.toggle("following", isFollowing);
    };

    // Modal de Post
    function openPostModal(post) {
      activePost = post;
      document.getElementById("modalImg").src = post.img;
      updateModalUI();
      document.getElementById("postModal").classList.add("open");
    }

    function closePostModal() {
      document.getElementById("postModal").classList.remove("open");
      renderGrid();
    }

    function updateModalUI() {
      document.getElementById("likeBtn").textContent = activePost.liked ? "❤️" : "🤍";
      document.getElementById("saveBtn").textContent = activePost.saved ? "✅" : "🔖";
      document.getElementById("modalLikes").textContent = `${activePost.likes} curtidas`;

      const commentsDiv = document.getElementById("modalComments");
      commentsDiv.innerHTML = `<p><strong>ofilhos_z</strong> ${activePost.caption}</p>`;
      activePost.comments.forEach(c => {
        commentsDiv.innerHTML += `<p><strong>${c.user}</strong> ${c.text}</p>`;
      });
    }

    function toggleLike() {
      activePost.liked = !activePost.liked;
      activePost.likes += activePost.liked ? 1 : -1;
      updateModalUI();
    }

    function toggleSave() {
      activePost.saved = !activePost.saved;
      updateModalUI();
    }

    function addComment(e) {
      e.preventDefault();
      const input = document.getElementById("commentInput");
      if (!input.value.trim()) return;
      activePost.comments.push({ user: "voce", text: input.value.trim() });
      input.value = "";
      updateModalUI();
    }

    // Stories
    function openStory(title, text) {
      document.getElementById("storyTitle").textContent = title;
      document.getElementById("storyText").textContent = text;
      document.getElementById("storyModal").classList.add("open");
    }

    function closeStory() {
      document.getElementById("storyModal").classList.remove("open");
    }

    // Modo Escuro
    const themeBtn = document.getElementById("themeBtn");
    themeBtn.onclick = () => {
      document.body.classList.toggle("dark");
      themeBtn.textContent = document.body.classList.contains("dark")
        ? "☀️ Modo Claro"
        : "🌙 Modo Escuro";
    };

    renderGrid();
  </script>
</body>
</html>
