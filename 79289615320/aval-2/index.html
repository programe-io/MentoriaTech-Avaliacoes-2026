<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mengão</title>
  <!-- Aqui conectamos o arquivo CSS separado -->
  <link rel="stylesheet" href="estilo.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <h1> Feed do Mengão do filhão</h1>
    <p>O espaço simples da Nação Rubro-Negra</p>
  </header>

  <div class="container">
    
    <!-- FORMULÁRIO PARA POSTAR -->
    <div class="caixa-postar">
      <textarea id="textoPost" placeholder="O que você está achando do Flamengo hoje?"></textarea>
      <button onclick="adicionarPost()">Publicar</button>
    </div>

    <!-- ONDE OS POSTS VÃO APARECER -->
    <div id="listaPosts">
      
      <!-- Post 1 -->
      <div class="post">
        <div class="autor">@urubu_rei</div>
        <p>Hoje tem Mengão no Maracanã! Vai pra cima deles! </p>
        <button class="btn-curtir" onclick="curtir(this)">❤️ Curtir (<span>12</span>)</button>
      </div>

      <!-- Post 2 -->
      <div class="post">
        <div class="autor">@nacao1895</div>
        <p>Que golaço no último jogo, a torcida foi à loucura!</p>
        <button class="btn-curtir" onclick="curtir(this)">❤️ Curtir (<span>8</span>)</button>
      </div>

    </div>

  </div>

  <!-- LÓGICA (JAVASCRIPT) -->
  <script>
    function adicionarPost() {
      let campoTexto = document.getElementById("textoPost");
      let mensagem = campoTexto.value;

      if (mensagem.trim() === "") {
        alert("Escreva alguma coisa antes de publicar!");
        return;
      }

      let novoPost = `
        <div class="post">
          <div class="autor">@torcedor_flamengo</div>
          <p>${mensagem}</p>
          <button class="btn-curtir" onclick="curtir(this)">❤️ Curtir (<span>0</span>)</button>
        </div>
      `;

      let lista = document.getElementById("listaPosts");
      lista.innerHTML = novoPost + lista.innerHTML;
      campoTexto.value = "";
    }

    function curtir(botao) {
      let spanNumero = botao.querySelector("span");
      let curtidasAtuais = Number(spanNumero.innerText);
      spanNumero.innerText = curtidasAtuais + 1;
    }
  </script>

</body>
</html>
