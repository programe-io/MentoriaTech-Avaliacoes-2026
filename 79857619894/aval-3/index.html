<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gray-100 text-slate-900">

    <!-- CABEÇALHO -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <h1 class="text-xl font-bold">Instagram</h1>
                <button type="button">
                    <i class="bx bx-menu text-2xl"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-4 pb-20">
        <div class="flex gap-8">
            <div class="flex-1 max-w-lg mx-auto">

                <!-- STORIES -->
                <section class="bg-white border border-gray-200 rounded-lg p-4 mb-5">
                    <div class="flex gap-4 overflow-x-auto pb-2">

                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gray-200 relative overflow-hidden">
                                <img src="https://i.pinimg.com/736x/73/ae/7c/73ae7c3c954d0738cad096b40021d819.jpg"
                                     alt="Seu story"
                                     class="w-full h-full rounded-full object-cover border-2 border-white">
                                <span class="absolute bottom-0 right-0 bg-blue-500 text-white rounded-full w-5 h-5 flex items-center justify-center border-2 border-white text-lg">+</span>
                            </div>
                            <span class="text-xs mt-1">Seu story</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 overflow-hidden">
                                <img src="https://i.pinimg.com/736x/6c/0d/ab/6c0dabdafcfcf613001afd0fdde729a5.jpg"
                                     class="w-full h-full rounded-full object-cover border-2 border-white" alt="Story 2">
                            </div>
                            <span class="text-xs mt-1">Luzivania</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 overflow-hidden">
                                <img src="https://i.pinimg.com/736x/aa/3b/06/aa3b0604ce00290af896e5164a8f4963.jpg"
                                     class="w-full h-full rounded-full object-cover border-2 border-white" alt="Story 3">
                            </div>
                            <span class="text-xs mt-1">Rafaela</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 overflow-hidden">
                                <img src="https://i.pinimg.com/736x/14/ab/94/14ab94ad4c5321f0fafc3c6afe671aa7.jpg"
                                     class="w-full h-full rounded-full object-cover border-2 border-white" alt="Story 4">
                            </div>
                            <span class="text-xs mt-1">amelia</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 overflow-hidden">
                                <img src="https://i.pinimg.com/736x/af/b9/f0/afb9f0a9c27fded0fd05ed605fef67f2.jpg"
                                     class="w-full h-full rounded-full object-cover border-2 border-white" alt="Story 5">
                            </div>
                            <span class="text-xs mt-1">Samyra</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 overflow-hidden">
                                <img src="https://i.pinimg.com/736x/06/31/69/063169c409f475434e557233cf526c2e.jpg"
                                     class="w-full h-full rounded-full object-cover border-2 border-white" alt="Story 6">
                            </div>
                            <span class="text-xs mt-1">kellen</span>
                        </div>

                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 overflow-hidden">
                                <img src="https://i.pinimg.com/1200x/16/cc/53/16cc531f56bbdca1b843e440264cc24f.jpg"
                                     class="w-full h-full rounded-full object-cover border-2 border-white" alt="Story 7">
                            </div>
                            <span class="text-xs mt-1">julia</span>
                        </div>

                    </div>
                </section>

                <!-- PUBLICAÇÃO 1 -->
                <article class="bg-white border border-gray-200 rounded-lg mb-5">

                    <div class="flex items-center justify-between p-3">
                        <div class="flex items-center gap-2">
                            <div class="w-9 h-9 rounded-full overflow-hidden bg-gray-200">
                                <img src="https://i.pinimg.com/736x/87/db/ea/87dbea1739ef3b6f41e3f9daedb21bdc.jpg"
                                     alt="Foto de perfil"
                                     class="w-full h-full object-cover">
                            </div>
                            <strong>kamila_oliveira</strong>
                        </div>
                        <i class="bx bx-dots-horizontal-rounded text-2xl"></i>
                    </div>

                    <div class="w-full aspect-square bg-gray-200 overflow-hidden">
                        <img src="https://i.pinimg.com/736x/26/ce/36/26ce36dca928ff26fb69d39cb1f31120.jpg"
                             alt="Publicação de Kamila"
                             class="w-full h-full object-cover">
                    </div>

                    <div class="p-3">
                        <div class="flex justify-between text-2xl">
                            <div class="flex gap-4">
                                <button type="button" onclick="curtir(this)">
                                    <i class="bx bx-heart"></i>
                                </button>

                                <button type="button" onclick="focarComentario(this)">
                                    <i class="bx bx-message-rounded"></i>
                                </button>

                                <i class="bx bx-send"></i>
                            </div>

                            <button type="button" onclick="salvar(this)">
                                <i class="bx bx-bookmark"></i>
                            </button>
                        </div>

                        <p class="text-sm mt-2">
                            <strong class="curtidas">120</strong> curtidas
                        </p>

                        <p class="text-sm mt-2">
                            <strong>kamila</strong>
                        </p>

                        <div class="comentarios text-sm mt-2"></div>

                        <div class="flex border-t mt-3 pt-3 gap-2">
                            <input type="text"
                                   placeholder="Adicione um comentário..."
                                   class="flex-1 outline-none text-sm">

                            <button type="button"
                                    onclick="comentar(this)"
                                    class="text-blue-500 font-semibold text-sm">
                                Publicar
                            </button>
                        </div>
                    </div>
                </article>

                <!-- PUBLICAÇÃO 2 -->
                <article class="bg-white border border-gray-200 rounded-lg mb-5">

                    <div class="flex items-center justify-between p-3">
                        <div class="flex items-center gap-2">
                            <div class="w-9 h-9 rounded-full overflow-hidden bg-gray-200">
                                <img src="https://i.pinimg.com/1200x/16/cc/53/16cc531f56bbdca1b843e440264cc24f.jpg"
                                     alt="post"
                                     class="w-full h-full object-cover">
                            </div>
                            <strong>maria_leal</strong>
                        </div>

                        <i class="bx bx-dots-horizontal-rounded text-2xl"></i>
                    </div>

                    <!-- ESPAÇO PARA COLOCAR FOTO NO SEGUNDO POST -->
                    <div class="w-full aspect-square bg-gray-200 overflow-hidden relative flex items-center justify-center">

                        <img id="fotoPublicacao"
                             src="https://i.pinimg.com/1200x/16/cc/53/16cc531f56bbdca1b843e440264cc24f.jpg"
                             alt="Minha publicação"
                             class="w-full h-full object-cover hidden">

                        <label id="espacoFoto"
                               for="escolherFoto"
                               class="cursor-pointer flex flex-col items-center justify-center text-gray-500">
                            <i class="bx bx-image-add text-6xl"></i>
                            <span class="text-sm">Clique para adicionar uma foto</span>
                        </label>

                        <input type="file"
                               id="escolherFoto"
                               accept="image/*"
                               class="hidden"
                               onchange="adicionarFoto(event)">
                    </div>

                    <div class="p-3">
                        <div class="flex justify-between text-2xl">
                            <div class="flex gap-4">
                                <button type="button" onclick="curtir(this)">
                                    <i class="bx bx-heart"></i>
                                </button>

                                <button type="button" onclick="focarComentario(this)">
                                    <i class="bx bx-message-rounded"></i>
                                </button>

                                <i class="bx bx-send"></i>
                            </div>

                            <button type="button" onclick="salvar(this)">
                                <i class="bx bx-bookmark"></i>
                            </button>
                        </div>

                        <p class="text-sm mt-2">
                            <strong class="curtidas">85</strong> curtidas
                        </p>

                        <p class="text-sm mt-2">
                            <strong>kamila</strong>
                        </p>

                        <div class="comentarios text-sm mt-2"></div>

                        <div class="flex border-t mt-3 pt-3 gap-2">
                            <input type="text"
                                   placeholder="Adicione um comentário..."
                                   class="flex-1 outline-none text-sm">

                            <button type="button"
                                    onclick="comentar(this)"
                                    class="text-blue-500 font-semibold text-sm">
                                Publicar
                            </button>
                        </div>
                    </div>
                </article>

            </div>
        </div>
    </main>

    <!-- MENU INFERIOR -->
    <footer class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200">
        <div class="max-w-lg mx-auto flex justify-around py-3 text-2xl">
            <i class="bx bx-home"></i>
            <i class="bx bx-search"></i>
            <i class="bx bx-plus-square"></i>
            <i class="bx bx-video"></i>
            <i class="bx bx-user-circle"></i>
        </div>
    </footer>

    <!-- FUNÇÕES -->
    <script>

        // CURTIR PUBLICAÇÃO
        function curtir(botao) {
            const icone = botao.querySelector("i");
            const artigo = botao.closest("article");
            const numero = artigo.querySelector(".curtidas");

            let curtido = botao.dataset.curtido === "true";

            if (!curtido) {
                icone.className = "bx bxs-heart text-red-500";
                numero.textContent = Number(numero.textContent) + 1;
                botao.dataset.curtido = "true";
            } else {
                icone.className = "bx bx-heart";
                numero.textContent = Number(numero.textContent) - 1;
                botao.dataset.curtido = "false";
            }
        }

        // COMENTAR
        function comentar(botao) {
            const artigo = botao.closest("article");
            const input = artigo.querySelector('input[type="text"]');
            const comentarios = artigo.querySelector(".comentarios");

            if (input.value.trim() !== "") {
                const novoComentario = document.createElement("p");
                const nome = document.createElement("strong");

                nome.textContent = "kamila ";

                novoComentario.appendChild(nome);
                novoComentario.appendChild(
                    document.createTextNode(input.value.trim())
                );

                comentarios.appendChild(novoComentario);
                input.value = "";
            }
        }

        // ABRIR CAMPO DE COMENTÁRIO
        function focarComentario(botao) {
            botao.closest("article")
                 .querySelector('input[type="text"]').focus();
        }

        // SALVAR PUBLICAÇÃO
        function salvar(botao) {
            const icone = botao.querySelector("i");

            if (icone.classList.contains("bxs-bookmark")) {
                icone.className = "bx bx-bookmark";
            } else {
                icone.className = "bx bxs-bookmark";
            }
        }

        // ADICIONAR FOTO NO SEGUNDO POST
        function adicionarFoto(event) {
            const arquivo = event.target.files[0];

            if (arquivo && arquivo.type.startsWith("image/")) {
                const imagem = document.getElementById("fotoPublicacao");
                const espaco = document.getElementById("espacoFoto");

                imagem.src = URL.createObjectURL(arquivo);
                imagem.classList.remove("hidden");
                espaco.classList.add("hidden");
            }
        }

    </script>

</body>
</html>
