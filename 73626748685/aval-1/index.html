
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Calculadora de IMC</h1>
        <p>Descubra seu Índice de Massa Corporal</p>

        <label>Seu peso (kg):</label>
        <input type="number" id="peso" placeholder="Ex: 70">

        <label>Sua altura (m):</label>
        <input type="number" id="altura" step="0.01"
               placeholder="Ex: 1.75">

        <button onclick="calcularIMC()">Calcular IMC</button>
        <button class="limpar" onclick="limpar()">Limpar</button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
