
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pink Social 💗</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #fff4f8;
  color: #543747;
}

header {
  background: #f5a9c8;
  padding: 20px;
  text-align: center;
  color: white;
  font-size: 25px;
  font-weight: bold;
}

.container {
  max-width: 550px;
  margin: 20px auto;
  padding: 15px;
}

.stories {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding: 15px;
  background: white;
  border-radius: 15px;
}

.story {
  text-align: center;
  min-width: 65px;
}

.story img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 3px solid #f5a9c8;
  object-fit: cover;
}

.story p {
  font-size: 12px;
}

.post-box, .post {
  background: white;
  padding: 18px;
  border-radius: 15px;
  margin-top: 20px;
  box-shadow: 0 3px 10px #e9c6d5;
}

textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #f5a9c8;
  border-radius: 10px;
  resize: vertical;
}

button {
  background: #ec82af;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
  cursor: pointer;
  margin-top: 10px;
}

button:hover {
  background: #d85c91;
}

.post img {
  width: 100%;
  border-radius: 12px;
  margin-top: 12px;
}

.user {
  font-weight: bold;
  color: #d85c91;
}

.actions {
  display: flex;
  gap: 15px;
  align-items: center;
}

.actions button {
  background: transparent;
  color: #d85c91;
  font-size: 17px;
}

</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>🌸 Pink Social 💗</header>

<div class="container">

  <div class="stories">
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=47">
      <p>Mariana</p>
    </div>
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=44">
      <p>Camila</p>
    </div>
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=49">
      <p>Juliana</p>
    </div>
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=45">
      <p>Beatriz</p>
    </div>
  </div>

  <div class="post-box">
    <h3>✨ Compartilhe seu momento!</h3>
    <br>
    <textarea id="texto"
      placeholder="O que você está pensando hoje? 💕"></textarea>
    <button onclick="publicar()">Publicar 💗</button>
  </div>

  <div id="feed">

    <div class="post">
      <p class="user">🌷 Mariana Oliveira</p>
      <p>Um dia lindo para florescer! 🌸</p>
      <div class="actions">
        <button onclick="curtir(this)">♡ Curtir</button>
        <button onclick="comentar(this)">💬 Comentar</button>
      </div>
    </div>

    <div class="post">
      <p class="user">💖 Camila Santos</p>
      <p>Seja sua própria inspiração! ✨</p>
      <div class="actions">
        <button onclick="curtir(this)">♡ Curtir</button>
        <button onclick="comentar(this)">💬 Comentar</button>
      </div>
    </div>

  </div>

</div>

<script>

function publicar() {
  const texto = document.getElementById("texto");
  const feed = document.getElementById("feed");

  if (texto.value.trim() === "") {
    alert("Escreva alguma coisa! 💗");
    return;
  }

  const post = document.createElement("div");
  post.className = "post";

  const usuario = document.createElement("p");
  usuario.className = "user";
  usuario.textContent = "🌸 Você";

  const conteudo = document.createElement("p");
  conteudo.textContent = texto.value;

  const acoes = document.createElement("div");
  acoes.className = "actions";

  const like = document.createElement("button");
  like.textContent = "♡ Curtir";
  like.onclick = function() {
    curtir(this);
  };

  const comment = document.createElement("button");
  comment.textContent = "💬 Comentar";
  comment.onclick = function() {
    comentar(this);
  };

  acoes.append(like, comment);
  post.append(usuario, conteudo, acoes);

  feed.prepend(post);
  texto.value = "";
}

function curtir(botao) {
  if (botao.dataset.liked === "true") {
    botao.textContent = "♡ Curtir";
    botao.dataset.liked = "false";
  } else {
    botao.textContent = "❤️ Curtido";
    botao.dataset.liked = "true";
  }
}

function comentar(botao) {
  const comentario = prompt("Escreva seu comentário 💬");

  if (comentario && comentario.trim()) {
    const novo = document.createElement("p");
    novo.textContent = "💬 " + comentario;
    botao.parentElement.parentElement.appendChild(novo);
  }
}

</script>

<script src="script.js"></script></body>
</html>
