<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <header>
      <h1>🌸 Minhas Tarefas</h1>
      <p>Organize seu dia com carinho</p>
    </header>

    <section class="card">
      <h2>Nova tarefa</h2>
      <div id="form-tarefa">
        <div class="campo">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" placeholder="Mínimo de 5 caracteres">
        </div>
        <div class="campo">
          <label for="prioridade">Prioridade</label>
          <select id="prioridade">
            <option value="1">1 - Alta</option>
            <option value="2" selected>2 - Média</option>
            <option value="3">3 - Baixa</option>
          </select>
        </div>
        <button type="button" id="btn-cadastrar" class="btn-principal">Cadastrar</button>
      </div>
      <p id="mensagem" class="mensagem" role="alert"></p>
    </section>

    <section class="card">
      <div class="topo-lista">
        <h2>Tarefas cadastradas</h2>
        <span id="contador" class="contador">0</span>
      </div>
      <ul id="lista" class="lista"></ul>
      <p id="vazio" class="vazio">Nenhuma tarefa cadastrada ainda 🌷</p>
      <p id="aviso-storage" class="mensagem erro"></p>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
