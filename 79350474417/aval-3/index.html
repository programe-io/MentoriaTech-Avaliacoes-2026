
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram - Meu Social</title>
<link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<div id="login">
    <div class="login-box">
            <h1>Instagram</h1>
                    <input id="nome" placeholder="Nome de usuário">
                            <input id="senha" type="password" placeholder="Senha">
                                    <button onclick="entrar()">Entrar</button>
                                            <p>Não tem conta? <a onclick="cadastrar()">Cadastre-se</a></p>
                                                    <small id="aviso"></small>
                                                        </div>
                                                        </div>

                                                        <div id="app" class="hidden">

                                                        <header>
                                                            <h2>Instagram</h2>
                                                                <input id="pesquisa" placeholder="Pesquisar usuários" oninput="pesquisar()">
                                                                    <button onclick="mostrarPerfil()">👤</button>
                                                                        <button onclick="sair()">Sair</button>
                                                                        </header>

                                                                        <nav>
                                                                            <button onclick="mostrarPagina('inicio')">🏠 Início</button>
                                                                                <button onclick="mostrarPagina('explorar')">🔍 Explorar</button>
                                                                                    <button onclick="mostrarPagina('criar')">➕ Publicar</button>
                                                                                        <button onclick="mostrarPerfil()">👤 Perfil</button>
                                                                                        </nav>

                                                                                        <main>

                                                                                        <section id="inicio">
                                                                                            <h2>Feed de publicações</h2>
                                                                                                <div id="feed"></div>
                                                                                                </section>

                                                                                                <section id="explorar" class="hidden">
                                                                                                    <h2>Explorar</h2>
                                                                                                        <div id="resultados"></div>
                                                                                                        </section>

                                                                                                        <section id="criar" class="hidden">
                                                                                                            <h2>Nova publicação</h2>
                                                                                                                <div class="form">
                                                                                                                        <input type="file" id="foto" accept="image/*">
                                                                                                                                <textarea id="legenda" placeholder="Escreva uma legenda..."></textarea>
                                                                                                                                        <button onclick="publicar()">Compartilhar</button>
                                                                                                                                            </div>
                                                                                                                                            </section>

                                                                                                                                            <section id="perfil" class="hidden">
                                                                                                                                                <h2>Meu perfil</h2>
                                                                                                                                                    <div id="dadosPerfil"></div>
                                                                                                                                                        <div id="minhasPublicacoes"></div>
                                                                                                                                                        </section>

                                                                                                                                                        </main>
                                                                                                                                                        </div>

                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                        </html>
