
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Feedback | Instagram</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                <div class="container">

                    <div class="logo">
                            <h1>Instagram</h1>
                                </div>

                                    <div class="card">

                                            <div class="icone">💬</div>

                                                    <h2>Queremos sua opinião!</h2>

                                                            <p class="descricao">
                                                                        Sua opinião é muito importante.
                                                                                    Conte para nós como foi sua experiência.
                                                                                            </p>

                                                                                                    <h3>Como você avalia sua experiência?</h3>

                                                                                                            <div class="estrelas" id="estrelas">
                                                                                                                        <span data-nota="1">★</span>
                                                                                                                                    <span data-nota="2">★</span>
                                                                                                                                                <span data-nota="3">★</span>
                                                                                                                                                            <span data-nota="4">★</span>
                                                                                                                                                                        <span data-nota="5">★</span>
                                                                                                                                                                                </div>

                                                                                                                                                                                        <h3>Como você se sentiu?</h3>

                                                                                                                                                                                                <div class="reacoes">
                                                                                                                                                                                                            <button type="button" data-reacao="Muito feliz">😍</button>
                                                                                                                                                                                                                        <button type="button" data-reacao="Feliz">😊</button>
                                                                                                                                                                                                                                    <button type="button" data-reacao="Neutro">😐</button>
                                                                                                                                                                                                                                                <button type="button" data-reacao="Insatisfeito">😕</button>
                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                <h3>Deixe seu comentário</h3>

                                                                                                                                                                                                                                                                        <input type="text" id="nome"
                                                                                                                                                                                                                                                                                placeholder="Seu nome">

                                                                                                                                                                                                                                                                                        <textarea id="comentario"
                                                                                                                                                                                                                                                                                                placeholder="Escreva seu feedback..."></textarea>

                                                                                                                                                                                                                                                                                                        <button class="enviar" onclick="enviarFeedback()">
                                                                                                                                                                                                                                                                                                                    Enviar feedback
                                                                                                                                                                                                                                                                                                                            </button>

                                                                                                                                                                                                                                                                                                                                    <p id="mensagem"></p>

                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                            <div class="resultados">
                                                                                                                                                                                                                                                                                                                                                    <h2>Opiniões recebidas</h2>
                                                                                                                                                                                                                                                                                                                                                            <div id="lista-feedbacks"></div>
                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                <footer>
                                                                                                                                                                                                                                                                                                                                                                    <p>© 2026 - Página de Feedback</p>
                                                                                                                                                                                                                                                                                                                                                                    </footer>

                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                    </html>
