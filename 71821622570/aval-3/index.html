<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <canvas id="c"></canvas>

<div id="hud" style="display:none">
  <div id="hudTop"></div>
  <div id="hudHint"></div>
</div>
<div id="toast"></div>

<div id="menu">
  <h1>HIDE &amp; SEEK<br><span>CASA DO MISTÉRIO</span></h1>
  <p class="coins">🪙 Moedas: <b id="coins">0</b></p>

  <h3>Escolha o mapa</h3>
  <div id="maps">
    <button data-map="sala">Sala de Estar</button>
    <button data-map="cozinha">Cozinha</button>
    <button data-map="quarto">Quarto</button>
    <button data-map="quintal">Quintal</button>
    <button data-map="casa">🏠 Casa inteira</button>
  </div>

  <h3>Loja</h3>
  <div id="shop"></div>

  <button id="play" class="big">▶ JOGAR</button>
  <p class="small">WASD andar • Shift correr • Ctrl/C agachar • Espaço pular • E esconder/revelar<br>
  Mouse: clique na tela e mova (ou arraste) • Setas ←/→ giram a câmera</p>
</div>

<div id="end" style="display:none">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <button id="again" class="big">Voltar ao menu</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
  
</body>
</html>
