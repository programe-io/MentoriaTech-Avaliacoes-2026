<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>📦 Controle de Estoque</h1>
        
        <!-- Formulário de Cadastro / Alteração -->
        <div class="form-container">
            <h2>Gerenciar Produto</h2>
            <div class="input-group">
                <input type="text" id="codigo" placeholder="Código do Produto">
                <input type="text" id="descricao" placeholder="Descrição / Nome">
                <input type="number" id="quantidade" placeholder="Quantidade" min="0">
                <input type="number" id="valor" placeholder="Valor (R$)" step="0.01" min="0">
            </div>
            <div class="button-group">
                <button onclick="cadastrar()" class="btn-success">Cadastrar Novo</button>
                <button onclick="atualizarPreco()" class="btn-warning">Alterar Preço</button>
                <button onclick="atualizarQtd()" class="btn-info">Alterar Qtd</button>
            </div>
        </div>

        <!-- Tabela de Exibição -->
        <div class="table-container">
            <h2>Produtos Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Preço Unitário</th>
                    </tr>
                </thead>
                <tbody id="lista-produtos">
                    <!-- Linhas inseridas dinamicamente via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
