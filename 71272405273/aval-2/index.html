<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <!-- Vinculando o arquivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <!-- Formulário de cadastro de tarefas -->
        <div class="form-grupo">
            <input type="text" id="inputTitulo" placeholder="Digite a tarefa (mínimo 5 caracteres)...">
            <select id="selectPrioridade">
                <option value="1">Alta</option>
                <option value="2" selected>Média</option>
                <option value="3">Baixa</option>
            </select>
            <button id="btnAdicionar">Adicionar</button>
        </div>
        <div id="mensagemErro" class="erro">O título deve ter no mínimo 5 caracteres.</div>

        <!-- Lista onde as tarefas serão exibidas -->
        <ul id="listaTarefas" class="lista-tarefas"></ul>
    </div>

    <!-- Vinculando o arquivo de lógica JavaScript -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
