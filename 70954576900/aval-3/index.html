
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook - VINI_FIGS</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="facebook-logo">f</span>
    <input id="search" placeholder="Pesquisar no Facebook">
  </div>

  <nav class="topnav">
    <button data-page="home" class="active">⌂</button>
    <button data-page="friends">♙</button>
    <button data-page="groups">♧</button>
    <button data-page="videos">▣</button>
  </nav>

  <div class="top-right">
    <button id="themeBtn">☾</button>
    <button id="notificationsBtn">♢</button>
    <button data-page="profile" class="my-avatar">V</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <button data-page="profile"><span class="avatar">V</span> VINI_FIGS</button>
    <button data-page="friends">♙ <span>Amigos</span></button>
    <button data-page="groups">♧ <span>Grupos</span></button>
    <button data-page="videos">▣ <span>Vídeos</span></button>
    <button data-page="saved">🔖 <span>Salvos</span></button>
    <button data-page="marketplace">🛒 <span>Marketplace</span></button>
    <button id="sideTheme">☾ <span>Alternar tema</span></button>
    <hr>
    <h4>Seus atalhos</h4>
    <button data-page="groups">🎮 Colecionadores de Action Figures</button>
    <button data-page="groups">🦸 Marvel Figures Brasil</button>
    <button data-page="groups">🎲 Universo Geek</button>
  </aside>

  <main id="app"></main>

  <aside class="rightbar">
    <h3>Contatos</h3>
    <div class="contact"><span class="avatar raven">R</span> Raven <i></i></div>
    <div class="contact"><span class="avatar">G</span> Gambit <i></i></div>
    <div class="contact"><span class="avatar blue">P</span> Pedro <i></i></div>
    <div class="contact"><span class="avatar pink">M</span> Maria <i></i></div>
    <hr>
    <h3>Conversas recentes</h3>
    <p class="muted">Você está conectado!</p>
  </aside>
</div>

<div class="modal hidden" id="modal">
  <div class="modal-card">
    <button id="closeModal" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast"></div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
