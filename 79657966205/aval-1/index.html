```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turbo Toys - Carros de Brinquedo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

/* CABEÇALHO */
header{
    background:linear-gradient(135deg,#e60000,#8b0000);
    color:white;
    padding:18px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 15px #0005;
}

.logo{
    font-size:27px;
    font-weight:bold;
}

.logo span{
    color:#ffd000;
}

.menu{
    display:flex;
    gap:15px;
    align-items:center;
}

.menu button{
    border:0;
    background:white;
    color:#c40000;
    padding:10px 15px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
}

.menu button:hover{
    transform:scale(1.05);
}

/* BANNER */
.hero{
    min-height:330px;
    background:
    linear-gradient(#0008,#0008),
    url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1400&q=80");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    padding:30px;
}

.hero h1{
    font-size:45px;
    margin-bottom:12px;
}

.hero p{
    font-size:19px;
    margin-bottom:20px;
}

.hero button{
    background:#ffd000;
    border:0;
    padding:14px 28px;
    border-radius:30px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

/* BUSCA */
.controles{
    max-width:1200px;
    margin:25px auto;
    padding:0 20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

#pesquisa{
    flex:1;
    min-width:230px;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.filtro{
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    background:white;
}

/* PRODUTOS */
.container{
    max-width:1200px;
    margin:auto;
    padding:10px 20px 50px;
}

.titulo{
    text-align:center;
    margin:20px 0 25px;
    font-size:30px;
}

.produtos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:22px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 20px #0001;
    transition:.3s;
}

.card:hover{
    transform:translateY(-7px);
    box-shadow:0 10px 25px #0003;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.info{
    padding:17px;
}

.info h3{
    margin-bottom:8px;
}

.categoria{
    font-size:13px;
    color:#777;
    margin-bottom:10px;
}

.preco{
    font-size:23px;
    font-weight:bold;
    color:#d40000;
    margin:10px 0;
}

.btn-comprar{
    width:100%;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#e00000;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-comprar:hover{
    background:#a90000;
}

/* CARRINHO */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:200;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal-box{
    background:white;
    width:100%;
    max-width:550px;
    max-height:90vh;
    overflow:auto;
    border-radius:20px;
    padding:25px;
    animation:abrir .3s;
}

@keyframes abrir{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.fechar{
    float:right;
    border:0;
    background:#eee;
    border-radius:50%;
    width:35px;
    height:35px;
    cursor:pointer;
    font-size:18px;
}

.item-carrinho{
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid #ddd;
    padding:15px 0;
}

.item-carrinho img{
    width:70px;
    height:55px;
    object-fit:cover;
    border-radius:8px;
}

.item-info{
    flex:1;
}

.quantidade button{
    border:0;
    background:#ddd;
    width:28px;
    height:28px;
    border-radius:5px;
    cursor:pointer;
}

.total{
    text-align:right;
    font-size:24px;
    font-weight:bold;
    margin:20px 0;
}

.finalizar{
    width:100%;
    background:#00a63c;
    color:white;
    border:0;
    padding:15px;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.limpar{
    width:100%;
    background:#eee;
    border:0;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
    cursor:pointer;
}

/* CHECKOUT */
.formulario{
    display:none;
    margin-top:20px;
}

.formulario input,
.formulario select{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

.confirmar{
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#e00000;
    color:white;
    border:0;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* RODAPÉ */
footer{
    background:#171717;
    color:white;
    text-align:center;
    padding:30px;
}

.badge{
    background:#ffd000;
    color:#111;
    padding:3px 8px;
    border-radius:10px;
    font-size:12px;
}

/* RESPONSIVO */
@media(max-width:600px){
    header{
        flex-direction:column;
        gap:12px;
    }

    .hero h1{
        font-size:32px;
    }

    .hero{
        min-height:300px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <div class="logo">🚗 Turbo <span>Toys</span></div>

    <div class="menu">
        <button onclick="abrirCarrinho()">
            🛒 Carrinho (<span id="contador">0</span>)
        </button>
    </div>
</header>

<section class="hero">
    <div>
        <h1>Carros de Brinquedo</h1>
        <p>Escolha seu carrinho favorito e acelere na diversão!</p>
        <button onclick="document.getElementById('produtos').scrollIntoView()">
            🏁 Comprar agora
        </button>
    </div>
</section>

<div class="controles">
    <input 
        type="text" 
        id="pesquisa" 
        placeholder="🔎 Procurar carro..."
        oninput="mostrarProdutos()"
    >

    <select class="filtro" id="categoria" onchange="mostrarProdutos()">
        <option value="todos">Todas as categorias</option>
        <option value="esportivo">Esportivo</option>
        <option value="policia">Polícia</option>
        <option value="corrida">Corrida</option>
        <option value="offroad">Off-road</option>
    </select>
</div>

<main class="container" id="produtos">

    <h2 class="titulo">🔥 Nossos Carrinhos</h2>

    <div class="produtos" id="listaProdutos"></div>

</main>

<footer>
    <h3>🚗 Turbo Toys</h3>
    <p>Os melhores carros de brinquedo para sua coleção.</p>
    <br>
    <p>© 2026 Turbo Toys</p>
</footer>

<!-- MODAL CARRINHO -->
<div class="modal" id="modalCarrinho">

    <div class="modal-box">

        <button class="fechar" onclick="fecharCarrinho()">×</button>

        <h2>🛒 Meu Carrinho</h2>

        <div id="listaCarrinho"></div>

        <div class="total">
            Total: R$ <span id="total">0,00</span>
        </div>

        <button class="finalizar" onclick="abrirCheckout()">
            💳 Finalizar compra
        </button>

        <button class="limpar" onclick="limparCarrinho()">
            🗑️ Limpar carrinho
        </button>

        <div class="formulario" id="checkout">

            <h3>📦 Dados da entrega</h3>

            <input id="nome" type="text" placeholder="Nome completo">

            <input id="telefone" type="tel" placeholder="Telefone">

            <input id="endereco" type="text" placeholder="Endereço">

            <input id="cidade" type="text" placeholder="Cidade">

            <select id="pagamento">
                <option value="">Forma de pagamento</option>
                <option>Pix</option>
                <option>Cartão de crédito</option>
                <option>Cartão de débito</option>
                <option>Dinheiro</option>
            </select>

            <button class="confirmar" onclick="confirmarCompra()">
                ✅ Confirmar pedido
            </button>

        </div>

    </div>

</div>

<script>

const produtos = [

{
    id:1,
    nome:"Ferrari Vermelha",
    categoria:"esportivo",
    preco:49.90,
    imagem:"https://images.unsplash.com/photo-1592198084033-aade902d1aae?auto=format&fit=crop&w=700&q=80"
},

{
    id:2,
    nome:"Carro de Polícia",
    categoria:"policia",
    preco:39.90,
    imagem:"https://images.unsplash.com/photo-1580273916550-e323be2ae537?auto=format&fit=crop&w=700&q=80"
},

{
    id:3,
    nome:"Carro de Corrida",
    categoria:"corrida",
    preco:59.90,
    imagem:"https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?auto=format&fit=crop&w=700&q=80"
},

{
    id:4,
    nome:"Jipe Off-Road",
    categoria:"offroad",
    preco:54.90,
    imagem:"https://images.unsplash.com/photo-1519245659620-e859806a8d3b?auto=format&fit=crop&w=700&q=80"
},

{
    id:5,
    nome:"Carro Esportivo Azul",
    categoria:"esportivo",
    preco:44.90,
    imagem:"https://images.unsplash.com/photo-1504215680853-026ed2a45def?auto=format&fit=crop&w=700&q=80"
},

{
    id:6,
    nome:"Super Carro",
    categoria:"corrida",
    preco:69.90,
    imagem:"https://images.unsplash.com/photo-1553440569-bcc63803a83d?auto=format&fit=crop&w=700&q=80"
},

{
    id:7,
    nome:"Jipe Aventura",
    categoria:"offroad",
    preco:47.90,
    imagem:"https://images.unsplash.com/photo-1519641471654-76ce0107ad1b?auto=format&fit=crop&w=700&q=80"
},

{
    id:8,
    nome:"Viatura Especial",
    categoria:"policia",
    preco:42.90,
    imagem:"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=700&q=80"
}

];

let carrinho = [];

function mostrarProdutos(){

    const lista = document.getElementById("listaProdutos");

    const pesquisa = document
        .getElementById("pesquisa")
        .value
        .toLowerCase();

    const categoria = document
        .getElementById("categoria")
        .value;

    lista.innerHTML = "";

    const filtrados = produtos.filter(produto => {

        const nomeOK = produto.nome
            .toLowerCase()
            .includes(pesquisa);

        const categoriaOK =
            categoria === "todos" ||
            produto.categoria === categoria;

        return nomeOK && categoriaOK;
    });

    filtrados.forEach(produto => {

        lista.innerHTML += `

        <div class="card">

            <img src="${produto.imagem}" alt="${produto.nome}">

            <div class="info">

                <h3>${produto.nome}</h3>

                <div class="categoria">
                    <span class="badge">${produto.categoria}</span>
                </div>

                <div class="preco">
                    R$ ${produto.preco.toFixed(2).replace(".",",")}
                </div>

                <button class="btn-comprar"
                    onclick="adicionarCarrinho(${produto.id})">
                    🛒 Adicionar ao carrinho
                </button>

            </div>

        </div>

        `;
    });

    if(filtrados.length === 0){

        lista.innerHTML = `
            <p style="grid-column:1/-1;text-align:center;padding:40px">
                😕 Nenhum carrinho encontrado.
            </p>
        `;
    }
}

function adicionarCarrinho(id){

    const produto = produtos.find(p => p.id === id);

    const item = carrinho.find(p => p.id === id);

    if(item){
        item.quantidade++;
    }else{
        carrinho.push({
            ...produto,
            quantidade:1
        });
    }

    atualizarCarrinho();

    alert("🚗 Carrinho adicionado à compra!");
}

function atualizarCarrinho(){

    document.getElementById("contador").innerText =
        carrinho.reduce((total,item) => total + item.quantidade,0);

    const lista = document.getElementById("listaCarrinho");

    lista.innerHTML = "";

    let total = 0;

    carrinho.forEach(item => {

        total += item.preco * item.quantidade;

        lista.innerHTML += `

        <div class="item-carrinho">

            <img src="${item.imagem}">

            <div class="item-info">
                <strong>${item.nome}</strong>
                <br>
                R$ ${item.preco.toFixed(2).replace(".",",")}
            </div>

            <div class="quantidade">

                <button onclick="alterarQuantidade(${item.id},-1)">
                    −
                </button>

                ${item.quantidade}

                <button onclick="alterarQuantidade(${item.id},1)">
                    +
                </button>

            </div>

        </div>

        `;
    });

    document.getElementById("total").innerText =
        total.toFixed(2).replace(".",",");

}

function alterarQuantidade(id,valor){

    const item = carrinho.find(p => p.id === id);

    if(!item) return;

    item.quantidade += valor;

    if(item.quantidade <= 0){
        carrinho = carrinho.filter(p => p.id !== id);
    }

    atualizarCarrinho();
}

function abrirCarrinho(){

    document.getElementById("modalCarrinho").style.display="flex";

    document.getElementById("checkout").style.display="none";

    atualizarCarrinho();
}

function fecharCarrinho(){

    document.getElementById("modalCarrinho").style.display="none";
}

function limparCarrinho(){

    carrinho = [];

    atualizarCarrinho();
}

function abrirCheckout(){

    if(carrinho.length === 0){

        alert("Seu carrinho está vazio!");

        return;
    }

    document.getElementById("checkout").style.display="block";
}

function confirmarCompra(){

    const nome = document.getElementById("nome").value;
    const endereco = document.getElementById("endereco").value;
    const pagamento = document.getElementById("pagamento").value;

    if(!nome || !endereco || !pagamento){

        alert("⚠️ Preencha nome, endereço e forma de pagamento.");

        return;
    }

    const numero =
        Math.floor(100000 + Math.random()*900000);

    alert(
        "🎉 PEDIDO REALIZADO!\n\n" +
        "Cliente: " + nome + "\n" +
        "Pedido nº: " + numero + "\n" +
        "Pagamento: " + pagamento + "\n\n" +
        "Obrigado por comprar na Turbo Toys! 🚗"
    );

    carrinho = [];

    atualizarCarrinho();

    fecharCarrinho();
}

mostrarProdutos();
atualizarCarrinho();

</script>

<script src="script.js"></script></body>
</html>
```
