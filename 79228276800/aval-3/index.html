<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
  <link href="https://cloudflare.com" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Barra de Navegação -->
  <header class="navbar">
    <div class="nav-container">
      <div class="logo">Instagram</div>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Pesquisar usuário...">
      </div>
      <div class="nav-icons">
        <i class="fas fa-home active" title="Início"></i>
        <i class="far fa-plus-square" id="openModalBtn" title="Nova Publicação"></i>
        <i class="far fa-heart" title="Notificações"></i>
        <img src="https://unsplash.com" alt="Perfil" class="nav-avatar">
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="main-container">
    <div class="feed-column">
      
      <!-- Barra de Stories -->
      <section class="stories-container" id="storiesContainer"></section>

      <!-- Feed de Postagens -->
      <section class="posts-container" id="postsContainer"></section>

    </div>

    <!-- Barra Lateral (Sugestões) -->
    <aside class="sidebar">
      <div class="user-profile-summary">
        <img src="https://unsplash.com" alt="Seu Perfil">
        <div class="user-info">
          <strong>dev.criativo</strong>
          <span>Desenvolvedor Web</span>
        </div>
        <button class="text-btn">Mudar</button>
      </div>

      <div class="suggestions-header">
        <span>Sugestões para você</span>
        <button class="text-btn dark">Ver tudo</button>
      </div>

      <div id="suggestionsList"></div>
    </aside>
  </main>

  <!-- Modal: Visualizador de Stories -->
  <div class="story-viewer" id="storyViewer">
    <div class="story-content">
      <div class="story-progress-bar">
        <div class="story-progress-fill" id="storyProgressFill"></div>
      </div>
      <div class="story-header">
        <img id="storyUserImg" src="" alt="">
        <span id="storyUsername"></span>
        <button id="closeStoryBtn"><i class="fas fa-times"></i></button>
      </div>
      <img id="storyMainImg" src="" alt="Story">
    </div>
  </div>

  <!-- Modal: Criar Nova Postagem -->
  <div class="modal-overlay" id="createPostModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Criar nova publicação</h3>
        <button id="closeModalBtn"><i class="fas fa-times"></i></button>
      </div>
      <form id="newPostForm">
        <label>URL da Imagem:</label>
        <input type="url" id="postImageUrl" placeholder="https://exemplo.com" required>
        <label>Legenda:</label>
        <textarea id="postCaption" rows="3" placeholder="Escreva uma legenda..." required></textarea>
        <button type="submit" class="primary-btn">Compartilhar</button>
      </form>
    </div>
  </div>

<script src="script.js"></script></body>
</html>$0
