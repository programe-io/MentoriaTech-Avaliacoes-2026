<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="app-container" id="app">
  <!-- Barra de Navegação Superior -->
  <header class="navbar">
    <div class="nav-content">
      <div class="logo" onclick="window.scrollTo({top: 0, behavior: 'smooth'\})">
        <span class="logo-icon">📸</span>
        <span class="logo-text">InstaDev</span>
      </div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Pesquisar usuários ou legendas...">
      </div>

      <nav class="nav-actions">
        <button class="icon-btn" id="openModalBtn" title="Nova Publicação">➕</button>
        <button class="icon-btn" id="themeToggleBtn" title="Alternar Tema">🌙</button>
        <div class="user-avatar-nav" title="Seu Perfil">
          <img src="https://unsplash.com" alt="Perfil">
        </div>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="main-layout">
    <section class="feed-column">
      <!-- Barra de Stories -->
      <div class="stories-container" id="storiesContainer"></div>

      <!-- Feed de Publicações -->
      <div class="feed-posts" id="feedContainer"></div>
    </section>

    <!-- Barra Lateral (Sugestões) -->
    <aside class="sidebar-column">
      <div class="current-user-card">
        <img src="https://unsplash.com" alt="Avatar">
        <div class="user-info">
          <strong>dev_ana</strong>
          <span>Ana Clara • Front-End</span>
        </div>
      </div>

      <div class="suggestions-header">
        <span>Sugestões para você</span>
        <small>Ver tudo</small>
      </div>

      <div class="suggestions-list" id="suggestionsContainer"></div>

      <footer class="sidebar-footer">
        <p>Projeto desenvolvido com HTML5, CSS3 & Vanilla JS • 2026</p>
      </footer>
    </aside>
  </main>

  <!-- Modal para Nova Publicação -->
  <div class="modal-overlay" id="postModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Criar nova publicação</h3>
        <button class="close-btn" id="closeModalBtn">✖</button>
      </div>
      <form id="newPostForm" class="modal-body">
        <label>URL da Imagem:</label>
        <input type="url" id="postImageUrl" placeholder="https://exemplo.com" required>
        
        <label>Localização (opcional):</label>
        <input type="text" id="postLocation" placeholder="Ex: São Paulo, Brasil">

        <label>Legenda:</label>
        <textarea id="postCaption" rows="3" placeholder="Escreva uma legenda criativa..." required></textarea>

        <div class="preset-images">
          <small>Ou escolha uma foto rápida:</small>
          <div class="preset-btns">
            <button type="button" onclick="setPresetImage('https://unsplash.com')">💻 Setup</button>
            <button type="button" onclick="setPresetImage('https://unsplash.com')">🏖️ Praia</button>
            <button type="button" onclick="setPresetImage('https://unsplash.com')">🐱 Gato</button>
          </div>
        </div>

        <button type="submit" class="submit-post-btn">Compartilhar</button>
      </form>
    </div>
  </div>

  <!-- Visualizador de Story -->
  <div class="story-viewer" id="storyViewer">
    <div class="story-content">
      <div class="story-progress-bar"><div class="story-progress-fill" id="storyProgress"></div></div>
      <div class="story-header">
        <div class="story-user">
          <img id="storyUserImg" src="" alt="">
          <span id="storyUserName"></span>
        </div>
        <button class="close-story" id="closeStoryBtn">✖</button>
      </div>
      <img id="storyMainImg" class="story-image" src="" alt="Story">
    </div>
  </div>
</div>$0
  <script src="script.js"></script>
  
</body>
</html>
