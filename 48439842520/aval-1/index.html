<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfólio pessoal e profissional.">
  <title>Meu Portfólio | Desenvolvedor</title>

  <style>
    /* CONFIGURAÇÕES GERAIS */
    :root {
      --bg: #080b14;
      --surface: #111827;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #8b5cf6;
      --secondary: #22d3ee;
      --border: rgba(255,255,255,.10);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(1100px, 90%);
      margin: auto;
    }

    .gradient-text {
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .section {
      padding: 100px 0;
      scroll-margin-top: 75px;
    }

    .section-title {
      font-size: clamp(2rem, 5vw, 3rem);
      text-align: center;
      margin-bottom: 12px;
    }

    .section-description {
      text-align: center;
      color: var(--muted);
      margin-bottom: 48px;
    }

    /* MENU */
    header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 100;
      background: rgba(8,11,20,.82);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    nav {
      min-height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      transition: color .25s;
    }

    .nav-links a:hover {
      color: var(--secondary);
    }

    .menu-toggle {
      display: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* BOTÕES */
    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 700;
      transition: transform .25s, box-shadow .25s, background .25s;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      background: linear-gradient(100deg, var(--primary), #6d5dfc);
      color: white;
      box-shadow: 0 8px 28px rgba(139,92,246,.22);
    }

    .btn-primary:hover
  <script src="script.js"></script>
  
</body>
</html>
