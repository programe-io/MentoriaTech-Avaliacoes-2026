
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mini Feed Social</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                <header class="header">
                    <h1>Mini<span>Feed</span></h1>
                        <nav>
                                <a href="#">Início</a>
                                        <a href="#perfil">Perfil</a>
                                            </nav>
                                            </header>

                                            <main class="container">

                                                <section class="perfil" id="perfil">
                                                        <img src="https://i.pravatar.cc/150?img=47" alt="Foto de perfil">
                                                                <div>
                                                                            <h2>Seu Nome</h2>
                                                                                        <p>@seuusuario</p>
                                                                                                    <span>Compartilhando momentos ✨</span>
                                                                                                            </div>
                                                                                                                </section>

                                                                                                                    <section class="novo-post">
                                                                                                                            <h3>O que você está pensando?</h3>

                                                                                                                                    <textarea id="textoPost" placeholder="Escreva uma publicação..."></textarea>

                                                                                                                                            <button id="publicar">Publicar</button>
                                                                                                                                                </section>

                                                                                                                                                    <section id="feed">

                                                                                                                                                            <article class="post">
                                                                                                                                                                        <div class="post-header">
                                                                                                                                                                                        <img src="https://i.pravatar.cc/150?img=12" alt="Foto de Ana">
                                                                                                                                                                                                        <div>
                                                                                                                                                                                                                            <h3>Ana Clara</h3>
                                                                                                                                                                                                                                                <span>@anaclara · há 2 horas</span>
                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                        <p class="texto-post">
                                                                                                                                                                                                                                                                                                        Hoje foi um dia lindo! 🌸
                                                                                                                                                                                                                                                                                                                        Aproveitando cada momento.
                                                                                                                                                                                                                                                                                                                                    </p>

                                                                                                                                                                                                                                                                                                                                                <img class="imagem-post"
                                                                                                                                                                                                                                                                                                                                                                 src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=800"
                                                                                                                                                                                                                                                                                                                                                                                  alt="Flores">

                                                                                                                                                                                                                                                                                                                                                                                              <div class="acoes">
                                                                                                                                                                                                                                                                                                                                                                                                              <button class="curtir">♡ Curtir <span>15</span></button>
                                                                                                                                                                                                                                                                                                                                                                                                                              <button class="comentar">💬 Comentar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="comentarios"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                              </article>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <article class="post">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="post-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <img src="https://i.pravatar.cc/150?img=33" alt="Foto de Lucas">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h3>Lucas Mendes</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <span>@lucasmendes · há 4 horas</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p class="texto-post">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  Um pouco de paz e natureza 🌿
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <img class="imagem-post"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=800"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alt="Paisagem natural">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="acoes">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="curtir">♡ Curtir <span>8</span></button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="comentar">💬 Comentar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="comentarios"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </article>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>MiniFeed © 2026</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
