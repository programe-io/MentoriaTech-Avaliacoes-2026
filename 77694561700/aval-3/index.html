    { id: 'p15', userId: 'vitor', image: F.vocaloid, caption: 'Projeto novo saindo do forno 🚀 Em breve mostro por aqui.', date: '2026-11-14T23:15:00.000Z', likes: 203, comments: [{ id: 'c10', userId: 'samuel', text: 'Ansioso pra ver 🎮' }] },
    { id: 'p16', userId: 'emily', image: F.floresta, caption: 'Fim de tarde na floresta, sem filtro. 🌿', date: '2026-11-14T16:45:00.000Z', likes: 122, comments: [] }
  ];

  /* ===========================================================
     4. ESTADO E PERSISTÊNCIA (localStorage)
     =========================================================== */
  const SEMENTE_INTERACOES = {
    vitor: { likes: ['p2', 'p7'], saves: ['p5'], following: ['samuel', 'emily', 'hugo'] },
    samuel: { likes: ['p1', 'p5'], saves: ['p3'], following: ['vitor', 'hugo'] },
    emily: { likes: ['p1', 'p6', 'p8'], saves: [], following: ['vitor', 'maria'] },
    sabryna: { likes: ['p10', 'p14'], saves: ['p11'], following: ['emily', 'rebeca'] },
    rebeca: { likes: ['p6', 'p2'], saves: ['p12'], following: ['maria'] },
    hugo: { likes: ['p1', 'p13'], saves: [], following: ['vitor', 'samuel'] },
    maria: { likes: ['p2', 'p7'], saves: ['p14'], following: ['emily', 'rebeca'] }
  };

  function seedInteractions() {
    const out = {};
    USERS.forEach((u) => {
      const s = SEMENTE_INTERACOES[u.id] || { likes: [], saves: [], following: [] };
      out[u.id] = { likes: s.likes.slice(), saves: s.saves.slice(), following: s.following.slice() };
    });
    return out;
  }

  function seedNotifications() {
    const out = {};
    USERS.forEach((u) => {
      const outros = USERS.filter((o) => o.id !== u.id);
      out[u.id] = [
        { id: u.id + '-n1', actorId: outros[0].id, text: 'curtiu sua publicação', date: '2026-11-20T12:40:00.000Z', read: false },
        { id: u.id + '-n2', actorId: outros[1].id, text: 'começou a seguir você', date: '2026-11-20T09:12:00.000Z', read: false },
        { id: u.id + '-n3', actorId: outros[2].id, text: 'comentou: “Que foto incrível!”', date: '2026-11-19T21:05:00.000Z', read: true },
        { id: u.id + '-n4', actorId: outros[3].id, text: 'salvou sua publicação', date: '2026-11-18T18:20:00.000Z', read: true }
      ];
    });
    return out;
  }

  function estadoInicial() {
    return {
      version: VERSION, theme: 'dark', activeId: 'vitor',
      users: USERS, posts: POSTS,
      interactions: seedInteractions(), notifications: seedNotifications()
    };
  }

  function carregar() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const salvo = JSON.parse(raw);
        if (salvo && salvo.version === VERSION) return salvo;
      }
    } catch (e) { /* dados corrompidos: começa do zero */ }
    return estadoInicial();
  }

  let state = carregar();
  let view = 'feed';
  let perfilAlvo = null;
  const expandidos = new Set();
  let story = null;
  let storyTimer = null;

  function salvar() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage cheio */ }
  }

  /* ===========================================================
     5. ATALHOS DE ESTADO
     =========================================================== */
  const userById = (id) => state.users.find((u) => u.id === id) || state.users[0];
  const eu = () => userById(state.activeId);
  const minhas = () => state.interactions[state.activeId] || { likes: [], saves: [], following: [] };
  const postsOrdenados = () => state.posts.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  const naoLidas = () => (state.notifications[state.activeId] || []).filter((n) => !n.read).length;

  function alternar(lista, id) {
    return lista.includes(id) ? lista.filter((i) => i !== id) : lista.concat([id]);
  }

  function atualizarMinhas(patch) {
    const atuais = minhas();
    state.interactions[state.activeId] = Object.assign({}, atuais, patch);
    salvar();
  }

  /* ===========================================================
     6. TEMA
     =========================================================== */
  function aplicarTema() {
    const escuro = state.theme === 'dark';
    document.documentElement.classList.toggle('dark', escuro);
    const icone = escuro ? 'bx-moon' : 'bx-sun';
    const rotulo = escuro ? 'Modo escuro' : 'Modo claro';
    const i1 = document.getElementById('theme-icon');
    const i2 = document.getElementById('theme-icon-mobile');
    if (i1) i1.className = 'bx ' + icone + ' text-lg';
    if (i2) i2.className = 'bx ' + icone + ' text-lg';
    const label = document.getElementById('theme-label');
    if (label) label.textContent = rotulo;
    const knob = document.getElementById('theme-knob');
    if (knob) knob.style.left = escuro ? '18px' : '2px';
  }

  /* ===========================================================
     7. COMPONENTES
     =========================================================== */
  function renderNavLateral() {
    const itens = [
      { v: 'feed', label: 'Início', icon: 'bx-home' },
      { v: 'search', label: 'Busca', icon: 'bx-search' },
      { v: 'create', label: 'Criar', icon: 'bx-plus' },
      { v: 'notifications', label: 'Notificações', icon: 'bx-bell' },
      { v: 'profile', label: 'Perfil', icon: 'bx-user' }
    ];
    document.getElementById('nav-lateral').innerHTML = itens.map((i) => {
      const ativo = view === i.v;
      return '<button data-action="nav" data-view="' + i.v + '" class="flex w-full items-center gap-3 rounded-2xl px-3.5 py-2.5 text-sm font-medium transition ' +
        (ativo ? 'bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300' : 'text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/5') + '">' +
        '<i class="bx ' + i.icon + ' text-lg"></i>' + i.label + '</button>';
    }).join('');

    const perfil = document.getElementById('perfil-lateral');
    const u = eu();
    perfil.dataset.user = u.username;
    perfil.innerHTML = avatar(u, 40) +
      '<span class="min-w-0 flex-1"><span class="block truncate text-sm font-semibold">' + esc(u.name) + '</span>' +
      '<span class="block truncate text-xs text-slate-500 dark:text-slate-400">@' + esc(u.username) + '</span></span>';

    document.querySelectorAll('[data-nav]').forEach((btn) => {
      const ativo = btn.dataset.nav === view;
      btn.className = btn.className.replace(/(text-violet-600|text-slate-500)/g, '').trim();
      btn.classList.add(ativo ? 'text-violet-600' : 'text-slate-500', 'dark:text-slate-400');
      if (ativo) { btn.classList.remove('dark:text-slate-400'); btn.classList.add('dark:text-violet-400'); }
    });

    const badge = document.getElementById('badge-mobile');
    const total = naoLidas();
    if (badge) {
      badge.textContent = total;
      badge.classList.toggle('hidden', total === 0);
    }
  }

  function cartaoPost(post) {
    const autor = userById(post.userId);
    const curtido = minhas().likes.includes(post.id);
    const salvo = minhas().saves.includes(post.id);
    const comentarios = post.comments || [];
    const lista = expandidos.has(post.id) ? comentarios : comentarios.slice(-2);
    const total = post.likes + (curtido ? 1 : 0);

    const verTodos = comentarios.length > 2 && !expandidos.has(post.id)
      ? '<button data-action="show-comments" data-post="' + post.id + '" class="mt-2 text-xs font-medium text-slate-500 hover:text-violet-600 dark:text-slate-400">Ver todos os ' + comentarios.length + ' comentários</button>'
      : '';

    return '<article class="card fade-up overflow-hidden soft">' +
      '<header class="flex items-center gap-3 px-4 py-3.5">' +
        '<button data-action="profile" data-user="' + esc(autor.username) + '">' + avatar(autor, 40) + '</button>' +
        '<div class="min-w-0 flex-1">' +
          '<button data-action="profile" data-user="' + esc(autor.username) + '" class="block max-w-full truncate text-sm font-semibold">' + esc(autor.name) + '</button>' +
          '<p class="truncate text-[11px] text-slate-500 dark:text-slate-400">@' + esc(autor.username) + ' · ' + formatDate(post.date) + '</p>' +
        '</div><i class="bx bx-dots-horizontal-rounded text-xl text-slate-400"></i>' +
      '</header>' +
      '<div class="aspect-[4/5] w-full overflow-hidden bg-slate-100 dark:bg-white/5 sm:aspect-[5/4]">' +
        '<img src="' + post.image + '" alt="' + esc(post.caption) + '" class="h-full w-full object-cover transition-transform duration-700 hover:scale-105" loading="lazy" />' +
      '</div>' +
      '<div class="px-4 pb-4 pt-2.5">' +
        '<div class="flex items-center">' +
          '<button data-action="like" data-post="' + post.id + '" class="icon-btn ' + (curtido ? 'text-rose-500 dark:text-rose-400' : '') + '"><i class="bx ' + (curtido ? 'bxs-heart' : 'bx-heart') + '"></i></button>' +
          '<button data-action="focus-comment" data-post="' + post.id + '" class="icon-btn"><i class="bx bx-comment"></i></button>' +
          '<button data-action="share" data-post="' + post.id + '" class="icon-btn"><i class="bx bx-send"></i></button>' +
          '<div class="ml-auto"><button data-action="save" data-post="' + post.id + '" class="icon-btn ' + (salvo ? 'text-violet-600 dark:text-violet-400' : '') + '"><i class="bx ' + (salvo ? 'bxs-bookmark' : 'bx-bookmark') + '"></i></button></div>' +
        '</div>' +
      '<div class="px-4 pb-4">' +
        '<p class="text-sm font-semibold">' + total.toLocaleString('pt-BR') + ' curtidas</p>' +
        '<p class="mt-1.5 text-sm leading-relaxed"><button data-action="profile" data-user="' + esc(autor.username) + '" class="mr-1.5 font-semibold">' + esc(autor.username) + '</button>' + esc(post.caption) + '</p>' +
        verTodos +
        '<div class="mt-2 space-y-1.5">' + lista.map((c) =>
          '<p class="text-sm leading-snug"><span class="mr-1.5 font-semibold">' + esc(userById(c.userId).username) + '</span>' + esc(c.text) + '</p>'
        ).join('') + '</div>' +
        '<form data-form="comentario" data-post="' + post.id + '" class="mt-3 flex items-center gap-2 border-t border-slate-200 pt-3 dark:border-white/10">' +
          avatar(eu(), 28, false) +
          '<input name="texto" id="comment-' + post.id + '" placeholder="Escreva um comentário..." class="flex-1 bg-transparent text-sm outline-none placeholder:text-slate-400" />' +
          '<button type="submit" class="text-sm font-semibold text-violet-600 dark:text-violet-400">Publicar</button>' +
        '</form>' +
      '</div></article>';
  }

  function sugestoes() {
    const seguindo = minhas().following;
    const lista = state.users.filter((u) => u.id !== state.activeId && !seguindo.includes(u.id)).slice(0, 4);
    const conteudo = lista.length === 0
      ? '<p class="text-xs leading-relaxed text-slate-500 dark:text-slate-400">Você já segue todo mundo por aqui. Que tal publicar algo novo?</p>'

          '<li class="flex items-center gap-2.5">' +

              '<span class="block truncate text-[11px] text-slate-500 dark:text-slate-400">@' + esc(u.username) + '</span></button>' +
            '<button data-action="follow" data-user="' + u.id + '" class="btn-primary">Seguir</button>' +

    return '<div class="card p-4 soft">' +
      '<div class="mb-3 flex items-center gap-2"><i class="bx bx-star text-lg text-orange-400"></i><h2 class="text-sm font-semibold">Sugestões para você</h2></div>' +
      conteudo + '</div>' +

  }

  function renderListaBusca() {
    const termo = (window.__busca || '').trim().toLowerCase();
    const lista = state.users.filter((u) => !termo || u.name.toLowerCase().includes(termo) || u.username.toLowerCase().includes(termo));
    const alvo = document.getElementById('lista-busca');
    if (!alvo) return;

    if (lista.length === 0) {
      alvo.innerHTML = '<p class="p-8 text-center text-sm text-slate-500 dark:text-slate-400">Ninguém encontrado para “' + esc(window.__busca) + '”.</p>';
      return;
    }

    alvo.innerHTML = '<ul class="divide-y divide-slate-200 dark:divide-white/10">' + lista.map((u) => {
      const proprio = u.id === state.activeId;
      const seguindo = minhas().following.includes(u.id);
      return '<li class="flex items-center gap-3 px-4 py-3">' +
        '<button data-action="profile" data-user="' + esc(u.username) + '">' + avatar(u, 44, !proprio) + '</button>' +

  function telaPerfil(username) {
    const user = state.users.find((u) => u.username === username) || eu();
    const proprio = user.id === state.activeId;
    const posts = postsOrdenados().filter((p) => p.userId === user.id);
    const seguindo = minhas().following.includes(user.id);
    const totalSeguindo = proprio ? minhas().following.length : user.following;

    const destaques = user.highlights.map((h) =>
      '<div class="flex w-[68px] shrink-0 flex-col items-center gap-1.5">' +
        '<span class="ring-story flex h-16 w-16 items-center justify-center rounded-full p-[2.5px]">' +
          '<span class="relative h-full w-full overflow-hidden rounded-full border-2 border-white dark:border-[#12121a]">' +
            '<img src="' + h.cover + '" alt="' + esc(h.label) + '" class="h-full w-full object-cover" />' +
            '<span class="absolute inset-0 flex items-end justify-center bg-black/25 pb-1 text-xs">' + h.emoji + '</span>' +
          '</span></span>' +
        '<span class="w-full truncate text-center text-[11px] text-slate-500 dark:text-slate-400">' + esc(h.label) + '</span></div>'
    ).join('');

    const grade = posts.map((p) =>
      '<button data-action="post" data-post="' + p.id + '" class="group relative aspect-square overflow-hidden rounded-xl bg-slate-100 dark:bg-white/5">' +
        '<img src="' + p.image + '" alt="' + esc(p.caption) + '" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" loading="lazy" />' +
        '<span class="absolute inset-0 flex items-center justify-center gap-4 bg-black/45 text-xs font-semibold text-white opacity-0 transition group-hover:opacity-100">' +
          '<span><i class="bx bxs-heart"></i> ' + p.likes + '</span><span><i class="bx bxs-comment"></i> ' + (p.comments || []).length + '</span>' +
        '</span></button>'
    ).join('');

    const acoes = proprio
      ? '<button data-action="editar" class="btn-ghost flex items-center gap-1.5"><i class="bx bx-edit"></i> Editar perfil</button>' +
        '<button data-action="share-profile" data-user="' + esc(user.username) + '" class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 dark:border-white/10"><i class="bx bx-share-alt"></i></button>'
      : '<button data-action="follow" data-user="' + user.id + '" class="' + (seguindo ? 'btn-ghost' : 'btn-primary') + ' flex items-center gap-1.5"><i class="bx ' + (seguindo ? 'bx-check' : 'bx-user-plus') + '"></i>' + (seguindo ? 'Seguindo' : 'Seguir') + '</button>';

    return '<div class="mx-auto w-full max-w-[860px] space-y-5">' +
      '<section class="card overflow-hidden soft">' +
        '<div class="h-32 bg-gradient-to-br from-violet-400/40 via-rose-400/30 to-orange-300/40 sm:h-40"></div>' +
        '<div class="px-4 pb-4">' +
          '<div class="-mt-12 flex items-end justify-between gap-3">' + avatar(user, 96) + '<div class="mb-1 flex gap-2">' + acoes + '</div></div>' +
          '<div class="mt-3"><h1 class="font-heading text-xl font-bold tracking-tight sm:text-2xl">' + esc(user.name) + '</h1>' +
          '<p class="text-sm text-slate-500 dark:text-slate-400">@' + esc(user.username) + '</p>' +
          '<p class="mt-2.5 max-w-xl text-sm leading-relaxed">' + esc(user.bio) + '</p></div>' +
          '<div class="mt-4 flex gap-6 border-t border-slate-200 pt-3.5 text-sm dark:border-white/10">' +
            '<span><strong class="font-heading text-base">' + posts.length + '</strong> <span class="text-slate-500 dark:text-slate-400">publicações</span></span>' +
            '<span><strong class="font-heading text-base">' + user.followers.toLocaleString('pt-BR') + '</strong> <span class="text-slate-500 dark:text-slate-400">seguidores</span></span>' +
            '<span><strong class="font-heading text-base">' + totalSeguindo + '</strong> <span class="text-slate-500 dark:text-slate-400">seguindo</span></span>' +
          '</div>' +
        '</div>' +
      '</section>' +
      '<section class="card px-4 py-4 soft sm:px-5">' +
        '<h2 class="mb-3 text-xs font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Destaques</h2>' +
        '<div class="no-scrollbar flex gap-4 overflow-x-auto pb-1">' + destaques + '</div></section>' +
      '<section>' +
        '<div class="mb-3 flex items-center gap-2 px-1"><i class="bx bx-camera text-slate-500 dark:text-slate-400"></i>' +
        '<h2 class="text-xs font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Publicações</h2></div>' +
        (posts.length === 0
          ? '<div class="rounded-[24px] border border-dashed border-slate-300 p-10 text-center text-sm text-slate-500 dark:border-white/10 dark:text-slate-400">Nenhuma publicação ainda.</div>'
          : '<div class="grid grid-cols-3 gap-1.5 sm:gap-2.5">' + grade + '</div>') +
      '</section></div>';
  }

  /* ===========================================================
     9. MODAIS
     =========================================================== */
  function renderModais() {
    const raiz = document.getElementById('modal-root');
    let html = '';

    // --- Trocar de conta ---
    if (window.__modal === 'troca') {
      html += '<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm" data-action="fechar-modal">' +
        '<div class="card w-full max-w-md overflow-hidden" data-stop="1">' +
          '<div class="border-b border-slate-200 px-6 pb-4 pt-6 dark:border-white/10">' +
            '<h2 class="font-heading text-lg font-bold">Trocar de conta</h2>' +
            '<p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Cada perfil tem suas próprias publicações, curtidas e comentários.</p>' +
          '</div>' +
          '<div class="max-h-[60vh] space-y-1 overflow-y-auto p-3">' +
            state.users.map((u) => {
              const ativo = u.id === state.activeId;
              return '<button data-action="trocar" data-user="' + u.id + '" class="flex w-full items-center gap-3 rounded-2xl px-3 py-2.5 text-left transition ' +
                (ativo ? 'bg-violet-100 dark:bg-violet-500/15' : 'hover:bg-slate-100 dark:hover:bg-white/5') + '">' +
                avatar(u, 44, ativo) +
                '<span class="min-w-0 flex-1"><span class="block truncate text-sm font-semibold">' + esc(u.name) + '</span>' +
                '<span class="block truncate text-xs text-slate-500 dark:text-slate-400">@' + esc(u.username) + '</span></span>' +
                (ativo ? '<i class="bx bx-check text-lg text-violet-600 dark:text-violet-400"></i>' : '') +
              '</button>';
            }).join('') +
          '</div>' +
        '</div></div>';
    }

    // --- Editar perfil ---
    if (window.__modal === 'editar') {
      const u = eu();
      html += '<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm" data-action="fechar-modal">' +
        '<div class="card w-full max-w-md p-6" data-stop="1">' +
          '<h2 class="font-heading text-lg font-bold">Editar perfil</h2>' +
          '<form id="form-editar" class="mt-4 space-y-4">' +
            '<div class="flex items-center gap-3">' + avatar(u, 56) +
              '<p class="text-xs leading-relaxed text-slate-500 dark:text-slate-400">Cole o endereço de uma imagem para trocar a foto do perfil.</p></div>' +
            '<div><label class="text-xs font-medium text-slate-500 dark:text-slate-400">Nome</label>' +
              '<input name="nome" value="' + esc(u.name) + '" class="field mt-1" /></div>' +
            '<div><label class="text-xs font-medium text-slate-500 dark:text-slate-400">Usuário</label>' +
              '<input name="usuario" value="' + esc(u.username) + '" class="field mt-1" /></div>' +
            '<div><label class="text-xs font-medium text-slate-500 dark:text-slate-400">Biografia</label>' +
              '<textarea name="bio" rows="3" class="field mt-1 resize-none">' + esc(u.bio) + '</textarea></div>' +
            '<div><label class="text-xs font-medium text-slate-500 dark:text-slate-400">Foto (URL)</label>' +
              '<input name="avatar" value="' + esc(u.avatar) + '" class="field mt-1" /></div>' +
            '<div class="flex justify-end gap-2 pt-1">' +
              '<button type="button" data-action="fechar" class="btn-ghost">Cancelar</button>' +
              '<button type="submit" class="btn-primary">Salvar</button>' +
            '</div>' +
          '</form>' +
        '</div></div>';
    }

    // --- Publicação aberta pela grade do perfil ---
    if (window.__modal === 'post') {
      const post = state.posts.find((p) => p.id === window.__post);
      if (post) {
        html += '<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/60 p-4 backdrop-blur-sm" data-action="fechar-modal">' +
          '<div class="w-full max-w-[560px] py-6" data-stop="1">' +
            '<div class="mb-2 flex justify-end"><button data-action="fechar" class="flex h-9 w-9 items-center justify-center rounded-full bg-white/90 text-slate-700 dark:bg-white/10 dark:text-white"><i class="bx bx-x text-xl"></i></button></div>' +
            cartaoPost(post) +
          '</div></div>';
      }
    }

    // --- Story em tela cheia ---
    if (story) {
      const user = state.users[story.u];
      const stories = user.stories;
      const barras = stories.map((_, i) => {
        const cheia = i < story.s ? 'width:100%' : '';
        const animando = i === story.s ? 'story-bar' : '';
        return '<span class="h-[3px] flex-1 overflow-hidden rounded-full bg-white/30"><span class="block h-full rounded-full bg-white ' + animando + '" style="' + cheia + '"></span></span>';
      }).join('');

      html += '<div class="fixed inset-0 z-[60] flex items-center justify-center bg-black/95 p-3">' +
        '<button data-action="fechar-story" class="absolute right-4 top-4 z-10 flex h-10 w-10 items-center justify-center rounded-full bg-white/10 text-white hover:bg-white/20"><i class="bx bx-x text-xl"></i></button>' +
        '<div class="relative flex h-full w-full max-w-[420px] flex-col overflow-hidden rounded-[26px] bg-black shadow-2xl">' +
          '<div class="absolute inset-x-0 top-0 z-10 flex gap-1.5 px-3 pt-3">' + barras + '</div>' +
          '<div class="absolute inset-x-0 top-7 z-10 flex items-center gap-3 px-4 pt-3">' + avatar(user, 36, false) +
            '<div class="min-w-0 flex-1"><p class="truncate text-sm font-semibold text-white">' + esc(user.name) + '</p>' +
            '<p class="truncate text-[11px] text-white/60">@' + esc(user.username) + '</p></div></div>' +
          '<img src="' + stories[story.s] + '" alt="Story de ' + esc(user.name) + '" class="h-full w-full object-cover" />' +
          '<button data-action="story-anterior" class="absolute inset-y-0 left-0 w-1/3" aria-label="Anterior"></button>' +
          '<button data-action="story-proximo" class="absolute inset-y-0 right-0 w-1/3" aria-label="Próximo"></button>' +
        '</div></div>';
    }

    raiz.innerHTML = html;
  }

  /* ===========================================================
     10. RENDERIZAÇÃO
     =========================================================== */
  function render() {
    aplicarTema();
    renderNavLateral();

    const alvo = document.getElementById('view');
    if (view === 'feed') alvo.innerHTML = telaFeed();
    else if (view === 'search') { alvo.innerHTML = telaBusca(); renderListaBusca(); }
    else if (view === 'create') alvo.innerHTML = telaCriar();
    else if (view === 'notifications') alvo.innerHTML = telaNotificacoes();
    else if (view === 'profile') alvo.innerHTML = telaPerfil(perfilAlvo || eu().username);

    renderModais();
    controlarStory();
  }

  function navegar(novaView) {
    view = novaView;
    if (novaView === 'profile') perfilAlvo = eu().username;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  }

  function abrirPerfil(username) {
    perfilAlvo = username;
    view = 'profile';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  }

  /* ===========================================================
     11. STORIES
     =========================================================== */
  function abrirStory(index) {
    story = { u: index, s: 0 };
    render();
  }

  function proximoStory() {
    if (!story) return;
    const user = state.users[story.u];
    if (story.s + 1 < user.stories.length) story = { u: story.u, s: story.s + 1 };
    else if (story.u + 1 < state.users.length) story = { u: story.u + 1, s: 0 };
    else { story = null; render(); return; }
    render();
  }

  function storyAnterior() {
    if (!story) return;
    if (story.s > 0) story = { u: story.u, s: story.s - 1 };
    else if (story.u > 0) {
      const anterior = story.u - 1;
      story = { u: anterior, s: state.users[anterior].stories.length - 1 };
    }
    render();
  }

  function controlarStory() {
    if (storyTimer) { clearTimeout(storyTimer); storyTimer = null; }
    if (story) storyTimer = setTimeout(proximoStory, 5000);
  }

  /* ===========================================================
     12. AÇÕES
     =========================================================== */
  function fecharModais() {
    window.__modal = null;
    window.__post = null;
    render();
  }

  function curtir(id) {
    atualizarMinhas({ likes: alternar(minhas().likes, id) });
    render();
  }

  function salvarPost(id) {
    atualizarMinhas({ saves: alternar(minhas().saves, id) });
    render();
  }

  function seguir(id) {
    atualizarMinhas({ following: alternar(minhas().following, id) });
    render();
  }

  function comentar(postId, texto) {
    const limpo = texto.trim();
    if (!limpo) return;
    state.posts = state.posts.map((p) => p.id === postId
      ? Object.assign({}, p, { comments: (p.comments || []).concat([{ id: 'c-' + Date.now(), userId: state.activeId, text: limpo }]) })
      : p);
    expandidos.add(postId);
    salvar();
    render();
  }

  function publicar(legenda, imagem) {
    if (!imagem.trim()) { alert('Escolha uma imagem para publicar'); return; }
    state.posts = [{
      id: 'p-' + Date.now(),
      userId: state.activeId,
      image: imagem.trim(),
      caption: legenda.trim(),
      date: new Date().toISOString(),
      likes: 0,
      comments: []
    }].concat(state.posts);
    salvar();
    navegar('feed');
  }

  function trocarConta(id) {
    state.activeId = id;
    salvar();
    window.__modal = null;
    navegar('feed');
  }

  function marcarLidas() {
    state.notifications[state.activeId] = (state.notifications[state.activeId] || []).map((n) => Object.assign({}, n, { read: true }));
    salvar();
    render();
  }

  function compartilhar(post) {
    const autor = userById(post.userId);
    const url = location.href.split('#')[0] + '#' + autor.username;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(
        () => alert('Link da publicação copiado!'),
        () => alert('Link: ' + url)
      );
    } else { alert('Link: ' + url); }
  }

  /* ===========================================================
     13. EVENTOS (delegação)
     =========================================================== */
  document.addEventListener('click', (event) => {
    const alvo = event.target.closest('[data-action]');
    if (!alvo) return;
    if (alvo.dataset.stop) return;
    const action = alvo.dataset.action;
    const id = alvo.dataset.post;
    const userId = alvo.dataset.user;

    if (action === 'nav') { window.__modal = null; navegar(alvo.dataset.view); }
    else if (action === 'theme') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; salvar(); render(); }
    else if (action === 'abrir-troca') { window.__modal = 'troca'; renderModais(); }
    else if (action === 'trocar') { trocarConta(userId); }
    else if (action === 'editar') { window.__modal = 'editar'; renderModais(); }
    else if (action === 'fechar-modal') {
      // clique dentro do cartão não fecha a janela
      if (event.target.closest('[data-stop]')) return;
      fecharModais();
    }
    else if (action === 'fechar') { fecharModais(); }
    else if (action === 'profile') { window.__modal = null; abrirPerfil(userId); }
    else if (action === 'follow') { seguir(userId); }
    else if (action === 'like') { curtir(id); }
    else if (action === 'save') { salvarPost(id); }
    else if (action === 'show-comments') { expandidos.add(id); render(); }
    else if (action === 'focus-comment') { const campo = document.getElementById('comment-' + id); if (campo) campo.focus(); }
    else if (action === 'share') { const post = state.posts.find((p) => p.id === id); if (post) compartilhar(post); }
    else if (action === 'pick-image') {
      const campo = document.getElementById('campo-imagem');
      const previa = document.getElementById('previa');
      const previaImg = document.getElementById('previa-img');
      if (campo) campo.value = alvo.dataset.url;
      if (previa && previaImg) { previaImg.src = alvo.dataset.url; previa.classList.remove('hidden'); }
    }
    else if (action === 'story') { abrirStory(Number(alvo.dataset.index)); }
    else if (action === 'story-proximo') { proximoStory(); }
    else if (action === 'story-anterior') { storyAnterior(); }
    else if (action === 'fechar-story') { story = null; render(); }
    else if (action === 'mark-read') { marcarLidas(); }
    else if (action === 'share-profile') {
      const url = location.href.split('#')[0] + '#' + userId;
      if (navigator.clipboard) navigator.clipboard.writeText(url);
      alert('Link do perfil copiado!');
    }
    else if (action === 'post') { window.__post = id; window.__modal = 'post'; renderModais(); }
  });

  // Envio de formulários (comentário, criar, editar perfil)
  document.addEventListener('submit', (event) => {
    const form = event.target;
    event.preventDefault();

    if (form.dataset.form === 'comentario') {
      const input = form.querySelector('input[name="texto"]');
      comentar(form.dataset.post, input.value);
    } else if (form.id === 'form-criar') {
      publicar(form.legenda.value, form.imagem.value);
    } else if (form.id === 'form-editar') {
      const nome = form.nome.value.trim();
      const usuario = form.usuario.value.trim().replace(/^@/, '').replace(/\s+/g, '.');
      if (!nome || !usuario) { alert('Nome e usuário são obrigatórios'); return; }
      const bio = form.bio.value.trim();
      const foto = form.avatar.value.trim() || eu().avatar;
      state.users = state.users.map((u) => u.id === state.activeId ? Object.assign({}, u, { name: nome, username: usuario, bio: bio, avatar: foto }) : u);
      salvar();
      window.__modal = null;
      perfilAlvo = usuario;
      render();
    }
  });

  // Busca em tempo real
  document.addEventListener('input', (event) => {
    if (event.target.id === 'campo-busca') {
      window.__busca = event.target.value;
      renderListaBusca();
    }
    if (event.target.id === 'campo-imagem') {
      const previa = document.getElementById('previa');
      const previaImg = document.getElementById('previa-img');
      const valor = event.target.value.trim();
      if (previa && previaImg) {
        if (valor) { previaImg.src = valor; previa.classList.remove('hidden'); }
        else previa.classList.add('hidden');
      }
    }
  });

  // Teclado nos stories
  document.addEventListener('keydown', (event) => {
    if (!story) return;
    if (event.key === 'Escape') { story = null; render(); }
    if (event.key === 'ArrowRight') proximoStory();
    if (event.key === 'ArrowLeft') storyAnterior();
  });

  /* ===========================================================
     14. INÍCIO
     =========================================================== */
  window.__busca = '';
  aplicarTema();
  render();
  </script>
</body>
</html>
