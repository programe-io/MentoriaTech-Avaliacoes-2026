<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Sistema de Estoque</title>
                <link rel="stylesheet" href="main.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>📦 EstoquePro</h1>
                                    <p>Sistema de Controle de Estoque</p>
                                        </header>

                                            <main>
                                                    <section class="resumo">
                                                                <div class="card">
                                                                                <h3>Produtos cadastrados</h3>
                                                                                                <p id="totalProdutos">0</p>
                                                                                                            </div>

                                                                                                                        <div class="card">
                                                                                                                                        <h3>Unidades em estoque</h3>
                                                                                                                                                        <p id="totalUnidades">0</p>
                                                                                                                                                                    </div>

                                                                                                                                                                                <div class="card">
                                                                                                                                                                                                <h3>Valor do estoque</h3>
                                                                                                                                                                                                                <p id="valorEstoque">R$ 0,00</p>
                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                            <section class="painel">
                                                                                                                                                                                                                                                        <h2>Cadastrar produto</h2>

                                                                                                                                                                                                                                                                    <form id="formProduto">
                                                                                                                                                                                                                                                                                    <input id="nome" type="text"
                                                                                                                                                                                                                                                                                                        placeholder="Nome do produto" required>

                                                                                                                                                                                                                                                                                                                        <input id="codigo" type="text"
                                                                                                                                                                                                                                                                                                                                            placeholder="Código do produto" required>

                                                                                                                                                                                                                                                                                                                                                            <input id="preco" type="number"
                                                                                                                                                                                                                                                                                                                                                                                placeholder="Preço (R$)" min="0"
                                                                                                                                                                                                                                                                                                                                                                                                    step="0.01" required>

                                                                                                                                                                                                                                                                                                                                                                                                                    <input id="quantidade" type="number"
                                                                                                                                                                                                                                                                                                                                                                                                                                        placeholder="Quantidade" min="0"
                                                                                                                                                                                                                                                                                                                                                                                                                                                            step="1" required>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button type="submit">Cadastrar produto</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <section class="painel">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2>Produtos em estoque</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input id="pesquisa" type="search"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                placeholder="Pesquisar por nome ou código...">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="tabela-container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Nome</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <th>Código</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Preço</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <th>Quantidade</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Ações</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </thead>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <tbody id="listaProdutos"></tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p id="aviso"></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>EstoquePro © 2026</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="javascript.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ```
