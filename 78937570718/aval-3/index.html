
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaWeb</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>InstaWeb 📸</h1>
        <input type="text" placeholder="Pesquisar">
        <span>🏠 ❤️ 👤</span>
    </header>

    <main>
        <section class="stories">
            <div> <img src="https://i.pravatar.cc/60?img=1"> <p>Ana</p></div>
            <div> <img src="https://i.pravatar.cc/60?img=2"> <p>Pedro</p></div>
            <div> <img src="https://i.pravatar.cc/60?img=3"> <p>Maria</p></div>
            <div> <img src="https://i.pravatar.cc/60?img=4"> <p>Lucas</p></div>
        </section>

        <section class="post">
            <div class="user">
                <img src="https://i.pravatar.cc/60?img=5">
                <strong>Gabriel</strong>
            </div>

            <img class="photo"
            src="https://picsum.photos/id/10/600/400">

            <div class="actions">
                <button onclick="curtir(this)">🤍 Curtir</button>
                <button onclick="comentar()">💬 Comentar</button>
            </div>

            <p class="likes">0 curtidas</p>
            <p><strong>Gabriel:</strong> Aproveitando a natureza! 🌳</p>
        </section>

        <section class="post">
            <div class="user">
                <img src="https://i.pravatar.cc/60?img=8">
                <strong>Mariana</strong>
            </div>

            <img class="photo"
            src="https://picsum.photos/id/29/600/400">

            <div class="actions">
                <button onclick="curtir(this)">🤍 Curtir</button>
                <button onclick="comentar()">💬 Comentar</button>
            </div>

            <p class="likes">0 curtidas</p>
            <p><strong>Mariana:</strong> Mais um dia especial! ❤️</p>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
