
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Social Feed</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    color: #222;
}

header {
    background: #1877f2;
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 23px;
    font-weight: bold;
}

.container {
    max-width: 600px;
    margin: 25px auto;
    padding: 10px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px #00000012;
}

.profile {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
}

.name {
    font-weight: bold;
}

.time {
    color: gray;
    font-size: 12px;
    margin-top: 4px;
}

textarea {
    width: 100%;
    border: none;
    background: #f0f2f5;
    border-radius: 10px;
    padding: 15px;
    resize: none;
    outline: none;
    font-size: 15px;
}

button {
    border: none;
    cursor: pointer;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: bold;
}

.publish {
    background: #1877f2;
    color: white;
    margin-top: 10px;
    width: 100%;
}

.post-text {
    margin: 12px 0;
    line-height: 1.5;
}

.post-image {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
}

.actions {
    display: flex;
    justify-content: space-around;
    border-top: 1px solid #eee;
    margin-top: 15px;
    padding-top: 12px;
}

.actions button {
    background: transparent;
    color: #555;
    font-size: 14px;
}

.actions button:hover {
    background: #f0f2f5;
}

.liked {
    color: #1877f2 !important;
}

.comments {
    margin-top: 12px;
    display: none;
}

.comments input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 20px;
    outline: none;
}

.comment-list {
    font-size: 14px;
    margin-top: 10px;
}

</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>🌐 Feed</header>

<div class="container">

    <!-- Criar publicação -->
    <div class="card">
        <h3 style="margin-bottom:15px">Criar publicação</h3>
        <textarea id="newPost" rows="3"
        placeholder="O que você está pensando?"></textarea>
        <button class="publish" onclick="publishPost()">
            Publicar
        </button>
    </div>

    <!-- Feed -->
    <div id="feed">

        <div class="card">
            <div class="profile">
                <img class="avatar"
                src="https://i.pravatar.cc/100?img=12">
                <div>
                    <div class="name">Lucas Silva</div>
                    <div class="time">Há 10 minutos</div>
                </div>
            </div>

            <p class="post-text">
                Aproveitando o dia! ☀️
                Que todos tenham uma ótima semana!
            </p>

            <img class="post-image"
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800">

            <div class="actions">
                <button onclick="likePost(this)">
                    ❤️ Curtir <span>12</span>
                </button>
                <button onclick="toggleComments(this)">
                    💬 Comentar
                </button>
                <button onclick="sharePost(this)">
                    ↗ Compartilhar
                </button>
            </div>

            <div class="comments">
                <input placeholder="Escreva um comentário..."
                onkeydown="addComment(event, this)">
                <div class="comment-list"></div>
            </div>
        </div>

        <div class="card">
            <div class="profile">
                <img class="avatar"
                src="https://i.pravatar.cc/100?img=32">
                <div>
                    <div class="name">Mariana Costa</div>
                    <div class="time">Há 1 hora</div>
                </div>
            </div>

            <p class="post-text">
                Nunca deixe de acreditar nos seus sonhos! ✨❤️
            </p>

            <div class="actions">
                <button onclick="likePost(this)">
                    ❤️ Curtir <span>25</span>
                </button>
                <button onclick="toggleComments(this)">
                    💬 Comentar
                </button>
                <button onclick="sharePost(this)">
                    ↗ Compartilhar
                </button>
            </div>

            <div class="comments">
                <input placeholder="Escreva um comentário..."
                onkeydown="addComment(event, this)">
                <div class="comment-list"></div>
            </div>
        </div>

    </div>
</div>

<script>

function publishPost() {
    const input = document.getElementById("newPost");
    const text = input.value.trim();

    if (!text) {
        alert("Escreva algo antes de publicar!");
        return;
    }

    const post = document.createElement("div");
    post.className = "card";

    const profile = document.createElement("div");
    profile.className = "profile";
    profile.innerHTML = `
        <img class="avatar"
        src="https://i.pravatar.cc/100?img=11">
        <div>
            <div class="name">Você</div>
            <div class="time">Agora</div>
        </div>
    `;

    const paragraph = document.createElement("p");
    paragraph.className = "post-text";
    paragraph.textContent = text;

    const actions = document.createElement("div");
    actions.className = "actions";
    actions.innerHTML = `
        <button onclick="likePost(this)">
            ❤️ Curtir <span>0</span>
        </button>
        <button onclick="toggleComments(this)">
            💬 Comentar
        </button>
        <button onclick="sharePost(this)">
            ↗ Compartilhar
        </button>
    `;

    const comments = document.createElement("div");
    comments.className = "comments";
    comments.innerHTML = `
        <input placeholder="Escreva um comentário..."
        onkeydown="addComment(event, this)">
        <div class="comment-list"></div>
    `;

    post.append(profile, paragraph, actions, comments);

    document.getElementById("feed")
        .prepend(post);

    input.value = "";
}

function likePost(button) {
    const count = button.querySelector("span");

    if (button.classList.contains("liked")) {
        button.classList.remove("liked");
        count.textContent = Number(count.textContent) - 1;
    } else {
        button.classList.add("liked");
        count.textContent = Number(count.textContent) + 1;
    }
}

function toggleComments(button) {
    const comments = button.closest(".card")
        .querySelector(".comments");

    comments.style.display =
        comments.style.display === "block"
        ? "none" : "block";
}

function addComment(event, input) {
    if (event.key === "Enter" && input.value.trim()) {
        const comment = document.createElement("p");
        comment.textContent = "👤 Você: " + input.value;
        comment.style.marginBottom = "8px";

        input.nextElementSibling.appendChild(comment);
        input.value = "";
    }
}

function sharePost(button) {
    const text = button.closest(".card")
        .querySelector(".post-text").textContent;

    if (navigator.share) {
        navigator.share({
            title: "Meu Social",
            text: text
        });
    } else {
        navigator.clipboard.writeText(text)
            .then(() => alert("Publicação copiada!"));
    }
}

</script>

<script src="script.js"></script></body>
</html>
