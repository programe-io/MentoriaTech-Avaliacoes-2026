
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gerenciador de Tarefas</title>

                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <div class="container">

                            <header>
                                        <h1>✓ Gerenciador de Tarefas</h1>
                                                    <p>Organize suas atividades e acompanhe seu progresso.</p>
                                                            </header>

                                                                    <section class="resumo">
                                                                                <div class="indicador">
                                                                                                <strong id="total">0</strong>
                                                                                                                <span>Total de tarefas</span>
                                                                                                                            </div>

                                                                                                                                        <div class="indicador">
                                                                                                                                                        <strong id="pendentes">0</strong>
                                                                                                                                                                        <span>Pendentes</span>
                                                                                                                                                                                    </div>

                                                                                                                                                                                                <div class="indicador">
                                                                                                                                                                                                                <strong id="concluidas">0</strong>
                                                                                                                                                                                                                                <span>Concluídas</span>
                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                            <section class="painel">
                                                                                                                                                                                                                                                                        <h2>Cadastrar nova tarefa</h2>

                                                                                                                                                                                                                                                                                    <form id="formulario">
                                                                                                                                                                                                                                                                                                    <label for="titulo">Título da tarefa</label>
                                                                                                                                                                                                                                                                                                                    <input
                                                                                                                                                                                                                                                                                                                                        type="text"
                                                                                                                                                                                                                                                                                                                                                            id="titulo"
                                                                                                                                                                                                                                                                                                                                                                                placeholder="Digite o título da tarefa"
                                                                                                                                                                                                                                                                                                                                                                                                    minlength="5"
                                                                                                                                                                                                                                                                                                                                                                                                                        required
                                                                                                                                                                                                                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label for="prioridade">Prioridade</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <select id="prioridade">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="1">Alta</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="2" selected>Média</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="3">Baixa</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button type="submit" class="btn-adicionar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        + Cadastrar tarefa
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p id="mensagem"></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <section class="painel">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>Minhas tarefas</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label for="filtro">Filtrar tarefas</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <select id="filtro">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="todas">Todas as tarefas</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="pendentes">Pendentes</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="concluidas">Concluídas</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="listaTarefas">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p class="vazio">Nenhuma tarefa cadastrada.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
