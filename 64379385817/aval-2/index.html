<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <header>
      <h1>Gerenciador de Tarefas</h1>
      <p>Sistema de gestão e acompanhamento de tarefas</p>
    </header>

    <!-- Formulário de Cadastro -->
    <section class="card">
      <h2>Cadastrar Nova Tarefa</h2>
      <form id="taskForm">
        <div class="form-group">
          <label for="title">Título da Tarefa (mínimo 5 caracteres):</label>
          <input type="text" id="title" placeholder="Ex.: Elaborar relatório mensal" required minlength="5">
        </div>

        <div class="form-group">
          <label for="priority">Prioridade (1 - Alta, 2 - Média, 3 - Baixa):</label>
          <select id="priority" required>
            <option value="">Selecione...</option>
            <option value="1">1 - Alta</option>
            <option value="2">2 - Média</option>
            <option value="3">3 - Baixa</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar Tarefa</button>
      </form>
    </section>

    <!-- Listagem de Tarefas -->
    <section class="card">
      <h2>Lista de Tarefas</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Título</th>
              <th>Prioridade</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="taskList">
            <!-- As tarefas cadastradas serão inseridas aqui via JS -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
