<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <header>
            <h1>Gerenciador de Tarefas</h1>
            <p>Cadastre e organize suas tarefas de forma simples.</p>
        </header>

        <section class="formulario">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título da tarefa"
                        maxlength="100"
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade">
                        <option value="">Selecione</option>
                        <option value="1">1 - Alta</option>
                        <option value="2">2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit">Cadastrar tarefa</button>

                <p id="mensagem"></p>

            </form>
        </section>

        <section class="lista">
            <div class="titulo-lista">
                <h2>Minhas tarefas</h2>
                <span id="contador">0 tarefas</span>
            </div>

            <div id="listaTarefas">
                <p class="vazio">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>

    </main>

    <script>
        const form = document.getElementById("formTarefa");
        const titulo = document.getElementById("titulo");
        const prioridade = document.getElementById("prioridade");
        const listaTarefas = document.getElementById("listaTarefas");
        const mensagem = document.getElementById("mensagem");
        const contador = document.getElementById("contador");

        let tarefas = [];

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const nomeTarefa = titulo.value.trim();
            const valorPrioridade = prioridade.value;

            // Validação do título
            if (nomeTarefa.length < 5) {
                mostrarMensagem("O título deve ter no mínimo 5 caracteres.", "erro");
                titulo.focus();
                return;
            }

            // Validação da prioridade
            if (valorPrioridade !== "1" &&
                valorPrioridade !== "2" &&
                valorPrioridade !== "3") {

                mostrarMensagem("A prioridade deve ser 1 (alta), 2 (média) ou 3 (baixa).", "erro");
                prioridade.focus();
                return;
            }

            const tarefa = {
                id: Date.now(),
                titulo: nomeTarefa,
                prioridade: Number(valorPrioridade),
                concluida: false
            };

            tarefas.push(tarefa);

            atualizarLista();

            form.reset();

            mostrarMensagem("Tarefa cadastrada com sucesso!", "sucesso");
        });

        function atualizarLista() {
            listaTarefas.innerHTML = "";

            if (tarefas.length === 0) {
                listaTarefas.innerHTML =
                    '<p class="vazio">Nenhuma tarefa cadastrada.</p>';

                atualizarContador();
                return;
            }

            tarefas.forEach(function(tarefa) {

                const item = document.createElement("div");
                item.className = "tarefa";

                if (tarefa.concluida) {
                    item.classList.add("concluida");
                }

                const informacoes = document.createElement("div");
                informacoes.className = "informacoes";

                const tituloTarefa = document.createElement("h3");
                tituloTarefa.textContent = tarefa.titulo;

                const prioridadeTarefa = document.createElement("span");
                prioridadeTarefa.className =
                    "prioridade prioridade-" + tarefa.prioridade;

                prioridadeTarefa.textContent =
                    obterNomePrioridade(tarefa.prioridade);

                informacoes.appendChild(tituloTarefa);
                informacoes.appendChild(prioridadeTarefa);

                const botoes = document.createElement("div");
                botoes.className = "acoes";

                const concluir = document.createElement("button");
                concluir.className = "btn-concluir";
                concluir.textContent =
                    tarefa.concluida ? "Desmarcar" : "Concluir";

                concluir.addEventListener("click", function() {
                    marcarConcluida(tarefa.id);
                });

                const alterar = document.createElement("button");
                alterar.className = "btn-prioridade";
                alterar.textContent = "Alterar prioridade";

                alterar.addEventListener("click", function() {
                    alterarPrioridade(tarefa.id);
                });

                botoes.appendChild(concluir);
                botoes.appendChild(alterar);

                item.appendChild(informacoes);
                item.appendChild(botoes);

                listaTarefas.appendChild(item);
            });

            atualizarContador();
        }

        function marcarConcluida(id) {
            tarefas = tarefas.map(function(tarefa) {

                if (tarefa.id === id) {
                    return {
                        ...tarefa,
                        concluida: !tarefa.concluida
                    };
                }

                return tarefa;
            });

            atualizarLista();
        }

        function alterarPrioridade(id) {
            tarefas = tarefas.map(function(tarefa) {

                if (tarefa.id === id) {

                    let novaPrioridade = tarefa.prioridade + 1;

                    if (novaPrioridade > 3) {
                        novaPrioridade = 1;
                    }

                    return {
                        ...tarefa,
                        prioridade: novaPrioridade
                    };
                }

                return tarefa;
            });

            atualizarLista();
        }

        function obterNomePrioridade(valor) {

            if (valor === 1) {
                return "Alta";
            }

            if (valor === 2) {
                return "Média";
            }

            return "Baixa";
        }

        function atualizarContador() {

            const quantidade = tarefas.length;

            if (quantidade === 1) {
                contador.textContent = "1 tarefa";
            } else {
                contador.textContent = quantidade + " tarefas";
            }
        }

        function mostrarMensagem(texto, tipo) {

            mensagem.textContent = texto;
            mensagem.className = tipo;

            setTimeout(function() {
                mensagem.textContent = "";
                mensagem.className = "";
            }, 3000);
        }

        atualizarLista();
    </script>

</body>
</html>
