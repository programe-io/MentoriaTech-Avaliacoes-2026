<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de estoque de produtos">
    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header class="cabecalho">
        <div class="container">
            <h1>Sistema de Estoque</h1>
            <p>Cadastre e gerencie seus produtos</p>
        </div>
    </header>

    <main class="container">

        <!-- Cadastro -->
        <section class="card">
            <h2>Cadastrar novo produto</h2>

            <form id="formProduto">

                <div class="form-grid">

                    <div class="campo">
                        <label for="codigo">Código</label>
                        <input
                            type="text"
                            id="codigo"
                            name="codigo"
                            placeholder="Ex.: P001"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="descricao">Descrição</label>
                        <input
                            type="text"
                            id="descricao"
                            name="descricao"
                            placeholder="Nome do produto"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="quantidade">Quantidade</label>
                        <input
                            type="number"
                            id="quantidade"
                            name="quantidade"
                            placeholder="0"
                            min="0"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="valor">Valor (R$)</label>
                        <input
                            type="number"
                            id="valor"
                            name="valor"
                            placeholder="0,00"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                </div>

                <button type="submit" class="btn btn-principal">
                    Cadastrar produto
                </button>

            </form>
        </section>

        <!-- Produtos -->
        <section class="card">
            <div class="titulo-lista">
                <div>
                    <h2>Produtos cadastrados</h2>
                    <p>Confira os produtos disponíveis no estoque.</p>
                </div>

                <span class="contador" id="contador">
                    0 produtos
                </span>
            </div>

            <div class="tabela-container">

                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <tr id="mensagemVazia">
                            <td colspan="5">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </section>

    </main>

    <footer>
        <p>Sistema de Estoque &copy; 2026</p>
    </footer>

</body>
</html>
