<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Mini Feed</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>

          <header class="topo">
              <h1>⚡ Mini Feed</h1>
                </header>

                  <main class="feed-container">

                      <!-- Caixa para publicar -->
                          <form id="form-publicar" class="publicar">
                                <input type="text" id="nome" placeholder="Seu nome" maxlength="20" required>
                                      <textarea id="mensagem" placeholder="O que está acontecendo?" maxlength="200" rows="3" required></textarea>
                                            <div class="publicar-rodape">
                                                    <span id="contador">200</span>
                                                            <button type="submit">Publicar</button>
                                                                  </div>
                                                                      </form>

                                                                          <!-- Lista de publicações (inseridas pelo JavaScript) -->
                                                                              <section id="feed"></section>
                                                                                  <p id="vazio" class="vazio" hidden>Nenhuma publicação ainda. Seja o primeiro! 🚀</p>

                                                                                    </main>

                                                                                      <script src="script.js"></script>
                                                                                      <script src="script.js"></script></body>
                                                                                      </html>
