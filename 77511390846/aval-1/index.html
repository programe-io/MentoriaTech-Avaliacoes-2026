
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Introdução ao HTML e CSS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h1>Introdução ao HTML e CSS</h1>
    <p>Aprenda a criar páginas para a internet!</p>
  </header>

  <main>
    <section class="card">
      <h2>O que é HTML?</h2>
      <p>
        HTML é uma linguagem de marcação que organiza
        os elementos de uma página.
      </p>
    </section>

    <section class="card">
      <h2>O que é CSS?</h2>
      <p>
        CSS é usado para definir as cores, fontes,
        espaçamentos e o layout de uma página.
      </p>
    </section>

    <button id="botao">Clique aqui</button>
    <p id="mensagem"></p>
  </main>

  <footer>
    <p>Minha primeira página web</p>
  </footer>
<script src="script.js"></script></body>
</html>
