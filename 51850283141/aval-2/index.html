<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MiniFeed</title>
<link href="style.css" rel="stylesheet"></head>
<body>
    
    <header>

        <div class="header-content">

            <h1>MiniFeed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>

        </div>

    </header>

    <main>

        <section class="new-post">

            <div class="user">

                <div class="avatar">
                    A
                </div>

                <div>
                    <strong>Ana Letícia:</strong>
                    <span>O que você está pensando?</span>
                </div>

            </div>

            <button>Publicar</button>

        </section>

        <article class="post">

            <div class="post-header">
                <div class="avatar">
                    J
                </div>

                <div>
                    <strong>João:</strong>
                    <span>Há 5 minutos</span>
                </div>
            </div>

            <div class="post-text">
                Hoje vi o novo filme do homem-aranha,
                top! Estou muito feliz.
            </div>

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSS1ohT-OR3WinZvPwN8VZupvPVOKpLMII-y6OpuPL95g&s=10" alt="Imagem do Filme Homem-Aranha">

            <div class="post-actions">

                <button>Curtir</button>
                <button>Comentar</button>

            </div>

        </article>

        <article class="post">

            <div class="post-header">
                <div class="avatar">
                    M
                </div>

                <div>
                    <strong>Maria:</strong>
                    <span>Há 10 minutos</span>
                </div>
            </div>

            <div class="post-text">
                O filme do homem-aranha atendeu as minhas
                expectativas. Ótimo filme!
            </div>

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBLda6ICy_gHywSvKVeLyN4G1kBAzQGgzNSBAfXTHnTA&s=10" alt="Imagem do Filme Homem-Aranha">

            <div class="post-actions">

                <button>Curtir</button>
                <button>Comentar</button>

            </div>

        </article>

    </main>

    <footer>
        <p>MiniFeed - Todos os direitos reservados - 2026</p>

    </footer>

</body>
</html>
