<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background:#f4f4f4;
        }

        header{
            background:#1e90ff;
            color:white;
            text-align:center;
            padding:20px;
        }

        nav{
            background:#333;
            padding:10px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:15px;
        }

        main{
            padding:30px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
        }

        footer{
            background:#222;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:20px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header>
    <h1>Meu Site em HTML</h1>
    <p>Exemplo simples de página web</p>
</header>

<nav>
    <a href="#">Início</a>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
</nav>

<main>
    <div class="card">
        <h2>Bem-vindo!</h2>

        <p>
            Este é um programa simples em HTML com CSS.
            Você pode editar o texto, cores e adicionar imagens.
        </p>

        <button onclick="alert('Olá! Você clicou no botão.')">
            Clique aqui
        </button>
    </div>
</main>

<footer>
    © 2026 - Criado em HTML
</footer>

</body>
</html>
