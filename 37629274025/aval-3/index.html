<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prática - Tabela de IMC</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Prática</h1>

        <p class="descricao">
            Simulando uma tabela com dados sobre pessoas (nome, peso e altura),
            informando o IMC e o status com cores distintas para resultados diferentes.
        </p>

        <div class="card">

            <h2>Adicionar pessoa</h2>

            <div class="formulario">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome"
                    >
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg)</label>
                    <input
                        type="number"
                        id="peso"
                        placeholder="Ex: 72"
                        step="0.1"
                    >
                </div>

                <div class="campo">
                    <label for="altura">Altura (m)</label>
                    <input
                        type="number"
                        id="altura"
                        placeholder="Ex: 1.75"
                        step="0.01"
                    >
                </div>

                <button id="btnAdicionar">
                    Adicionar
                </button>

            </div>

        </div>

        <div class="card">

            <h2>Tabela de pessoas</h2>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Peso</th>
                            <th>Altura</th>
                            <th>IMC</th>
                            <th>Situação</th>
                            <th>Ação</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaCorpo">

                        <!-- Os dados serão inseridos pelo JavaScript -->

                    </tbody>

                </table>

            </div>

            <p id="mensagemVazia" class="mensagem-vazia">
                Nenhuma pessoa cadastrada.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
