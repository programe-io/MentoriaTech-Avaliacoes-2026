<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Moderno Interativo</title>
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <header>
            <h1>Painel de Controle</h1>
            <p>Um site moderno, responsivo e interativo.</p>
        </header>

        <!-- Cards de Estatísticas -->
        <div class="dashboard-grid">
            <div class="card">
                <h3>Cliques Totais</h3>
                <div class="value" id="click-counter">0</div>
            </div>
            <div class="card">
                <h3>Status do Sistema</h3>
                <div class="value" id="status-text" style="font-size: 1.5rem; color: #34d399;">Ativo</div>
            </div>
        </div>

        <!-- Seção de Ações com Botões -->
        <div class="actions-section">
            <h2>Área de Interação</h2>
            <div class="button-group">
                <button class="btn" id="btn-click">Clique Aqui</button>
                <button class="btn btn-secondary" id="btn-toggle">Alternar Status</button>
                <button class="btn btn-secondary" id="btn-reset">Zerar Tudo</button>
            </div>
            <div id="feedback-message">Seja bem-vindo! Interaja com os botões acima.</div>
        </div>
    </div>

    <!-- Link para o arquivo JavaScript externo -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
