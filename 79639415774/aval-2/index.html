
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatCat | Rede Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topo">
    <h1>🐱 ChatCat</h1>
    <span>Sua conexão começa aqui!</span>
</header>

<div class="layout">

    <aside class="menu">
        <div class="usuario">
            <img id="fotoMenu"
            src="https://i.pravatar.cc/100?img=47">
            <div>
                <strong id="nomeMenu">Meu perfil</strong>
                <small>Online</small>
            </div>
        </div>

        <button onclick="mostrarTela('conversas')">💬 Conversas</button>
        <button onclick="mostrarTela('status')">🟢 Status</button>
        <button onclick="mostrarTela('ligacoes')">📞 Ligações</button>
        <button onclick="mostrarTela('favoritos')">⭐ Favoritos</button>
        <button onclick="mostrarTela('perfil')">👤 Meu perfil</button>
    </aside>

    <main>

        <!-- CONVERSAS -->
        <section id="conversas" class="tela">

            <h2>Mensagens</h2>

            <div class="barra">
                <input id="pesquisa"
                placeholder="🔎 Pesquisar conversas..."
                oninput="pesquisarContatos()">

                <button onclick="adicionarContato()">
                    + Novo contato
                </button>
            </div>

            <div class="areaChat">

                <div id="listaContatos"></div>

                <div class="conversa">

                    <div class="cabecalhoChat">
                        <img id="fotoContato"
                        src="https://i.pravatar.cc/100?img=47">

                        <div>
                            <h3 id="nomeContato">
                                Selecione uma conversa
                            </h3>
                            <small id="statusContato">ChatCat</small>
                        </div>
                    </div>

                    <div id="mensagens">
                        <p class="inicio">
                            Escolha alguém para conversar 🐱
                        </p>
                    </div>

                    <div class="opcoes">
                        <input id="arquivoMensagem"
                        type="file" accept="image/*"
                        hidden onchange="enviarFoto(event)">

                        <button onclick="document.getElementById('arquivoMensagem').click()">
                            📷
                        </button>

                        <button onclick="inserirEmoji()">😊</button>

                        <input id="textoMensagem"
                        placeholder="Digite uma mensagem..."
                        onkeydown="if(event.key==='Enter') enviarMensagem()">

                        <button onclick="enviarMensagem()">Enviar ➤</button>
                    </div>

                </div>
            </div>
        </section>

        <!-- STATUS -->
        <section id="status" class="tela escondido">
            <h2>Meu Status 🟢</h2>

            <input id="textoStatus"
            placeholder="Compartilhe uma novidade...">

            <input type="file" id="fotoStatus"
            accept="image/*">

            <button onclick="publicarStatus()">Publicar status</button>

            <div id="listaStatus"></div>
        </section>

        <!-- LIGAÇÕES -->
        <section id="ligacoes" class="tela escondido">
            <h2>Histórico de ligações 📞</h2>

            <button onclick="registrarLigacao()">
                + Registrar ligação
            </button>

            <div id="historicoLigacoes"></div>
        </section>

        <!-- FAVORITOS -->
        <section id="favoritos" class="tela escondido">
            <h2>Mensagens favoritas ⭐</h2>
            <div id="listaFavoritos"></div>
        </section>

        <!-- PERFIL -->
        <section id="perfil" class="tela escondido">
            <h2>Meu perfil 👤</h2>

            <img id="fotoPerfil"
            class="fotoPerfil"
            src="https://i.pravatar.cc/150?img=47">

            <label>Escolher foto de perfil</label>
            <input type="file" accept="image/*"
            onchange="alterarFoto(event)">

            <label>Nome</label>
            <input id="nomeUsuario"
            placeholder="Seu nome">

            <label>Sobre mim</label>
            <input id="sobreUsuario"
            placeholder="Escreva algo sobre você">

            <button onclick="salvarPerfil()">Salvar alterações</button>

            <p id="resultadoPerfil"></p>
        </section>

    </main>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
