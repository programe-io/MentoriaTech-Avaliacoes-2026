<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="header-content">
            <h1>Mini Feed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main>

        <!-- Área de nova publicação -->
        <section class="new-post">
            <div class="user">
                <div class="avatar">U</div>

                <div>
                    <strong>Usuário</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>

            <button>Publicar</button>
        </section>

        <!-- Primeira postagem -->
        <article class="post">

            <div class="post-header">
                <div class="avatar">P</div>

                <div>
                    <strong>Pedro</strong>
                    <span>Há 10 minutos</span>
                </div>
            </div>

            <div class="post-text">
                <p>
                    Acabei de assistir a um filme incrível do
                    Homem-Aranha! Recomendo muito!
                </p>
            </div>

            <img
                src="https://images.unsplash.com/photo-1531259683007-016a7b628fc3?w=900"
                alt="Imagem ilustrativa de uma cidade"
            >

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>

        <!-- Segunda postagem -->
        <article class="post">

            <div class="post-header">
                <div class="avatar">M</div>

                <div>
                    <strong>Maria</strong>
                    <span>Há 30 minutos</span>
                </div>
            </div>

            <div class="post-text">
                <p>
                    Olá, pessoal! Sejam bem-vindos ao meu Mini Feed!
                </p>
            </div>

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </article>

    </main>

    <!-- Rodapé -->
    <footer>
        <p>© 2026 Mini Feed - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
