<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <aside class="sidebar">
    <h1>Instagram</h1>
    <nav>
      <a href="#">🏠 Início</a>
      <a href="#">🔍 Pesquisa</a>
      <a href="#">🎬 Reels</a>
      <a href="#">✉️ Mensagens</a>
      <a href="#">❤️ Notificações</a>
      <a href="#" id="createBtn">➕ Criar publicação</a>
      <a href="#">👤 Perfil</a>
    </nav>
  </aside>

  <main>
    <section class="stories" id="stories">
      <div class="story">
        <img src="https://i.pravatar.cc/100?img=12">
        <span>Seu story</span>
      </div>
      <div class="story">
        <img src="https://i.pravatar.cc/100?img=5">
        <span>Maria</span>
      </div>
      <div class="story">
        <img src="https://i.pravatar.cc/100?img=8">
        <span>Lucas</span>
      </div>
      <div class="story">
        <img src="https://i.pravatar.cc/100?img=9">
        <span>Ana</span>
      </div>
      <div class="story">
        <img src="https://i.pravatar.cc/100?img=11">
        <span>Pedro</span>
      </div>
    </section>

    <section class="feed" id="feed">

      <article class="post">
        <header class="post-header">
          <img src="https://i.pravatar.cc/100?img=5">
          <strong>maria_oficial</strong>
          <span>•••</span>
        </header>

        <img class="post-image"
          src="https://picsum.photos/id/1015/700/700">

        <div class="actions">
          <button class="like">♡</button>
          <button class="commentBtn">💬</button>
          <button>➤</button>
          <button class="save">♧</button>
        </div>

        <p class="likes">1.250 curtidas</p>
        <p><strong>maria_oficial</strong> Aproveitando a vida! ❤️</p>

        <div class="comments"></div>

        <form class="comment-form">
          <input placeholder="Adicione um comentário..." required>
          <button>Publicar</button>
        </form>
      </article>

      <article class="post">
        <header class="post-header">
          <img src="https://i.pravatar.cc/100?img=8">
          <strong>lucas_fotos</strong>
          <span>•••</span>
        </header>

        <img class="post-image"
          src="https://picsum.photos/id/1018/700/700">

        <div class="actions">
          <button class="like">♡</button>
          <button class="commentBtn">💬</button>
          <button>➤</button>
          <button class="save">♧</button>
        </div>

        <p class="likes">850 curtidas</p>
        <p><strong>lucas_fotos</strong> Que lugar incrível! 🌎</p>

        <div class="comments"></div>

        <form class="comment-form">
          <input placeholder="Adicione um comentário..." required>
          <button>Publicar</button>
        </form>
      </article>

    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
