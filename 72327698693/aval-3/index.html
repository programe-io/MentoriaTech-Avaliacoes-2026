<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Meu Gerenciador de Tarefas</h1>
        <p>Organize suas tarefas de maneira simples!</p>

        <div class="formulario">
            <input type="text" id="tarefaInput" placeholder="Digite uma tarefa">

            <button id="adicionarBtn">Adicionar</button>
        </div>

        <p id="mensagem"></p>

        <div class="resumo">
            <span>Total: <strong id="total">0</strong></span>
            <span>Concluídas: <strong id="concluidas">0</strong></span>
        </div>

        <h2>Minhas tarefas</h2>

        <ul id="listaTarefas"></ul>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
