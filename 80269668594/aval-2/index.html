<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Hub - Feed da Comunidade</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="navbar">
        <div class="logo">FF <span>HUB</span></div>
        <div class="player-status">Patente: <strong>Mestre</strong></div>
    </header>

    <main class="container">
        <!-- Caixa para criar nova postagem -->
        <section class="create-post">
            <input type="text" id="playerNick" placeholder="Seu Nick no jogo (ex: Nobru_apelao)">
            <select id="postCategory">
                <option value="Highlight">Highlight / Clipada</option>
                <option value="Recrutamento">Recrutamento de Guilda</option>
                <option value="Dica">Dica / Sensibilidade</option>
            </select>
            <textarea id="postContent" rows="3" placeholder="Compartilhe seu Booyah, sensi ou vaga na guilda..."></textarea>
            <button id="btnPublish">PUBLICAR NO FEED</button>
        </section>

        <!-- Filtros -->
        <nav class="filters">
            <button class="filter-btn active" data-filter="Todos">Todos</button>
            <button class="filter-btn" data-filter="Highlight">Highlights</button>
            <button class="filter-btn" data-filter="Recrutamento">Guildas</button>
            <button class="filter-btn" data-filter="Dica">Dicas</button>
        </nav>

        <!-- Onde os posts vão aparecer -->
        <section id="feedContainer" class="feed"></section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
