<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Zona - Blog de Free Fire</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <h1 class="logo">FF <span>ZONA</span></h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="#" class="active" data-category="todos">Todos</a></li>
                    <li><a href="#" data-category="dicas">Dicas & Capa</a></li>
                    <li><a href="#" data-category="atualizacoes">Atualizações</a></li>
                    <li><a href="#" data-category="armas">Armas & Meta</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h2>Domine a ilha e garanta o seu BOOYAH!</h2>
            <p>As melhores notícias, configurações de sensibilidade e dicas competitivas de Free Fire.</p>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar artigos (ex: sensibilidade, gelo, atualização)...">
            </div>
        </div>
    </section>

    <main class="container">
        <div id="postsContainer" class="posts-grid">
            <!-- Os artigos serão inseridos dinamicamente pelo JavaScript -->
        </div>
    </main>

    <!-- Modal para ler o artigo completo -->
    <div id="articleModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <span id="modalCategory" class="badge"></span>
            <h2 id="modalTitle"></h2>
            <p id="modalDate" class="date"></p>
            <img id="modalImage" src="" alt="Imagem do post">
            <div id="modalBody" class="modal-text"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 FF Zona Blog. Feito para sobreviventes. Não afiliado à Garena.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
