<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="app-wrapper">
        <!-- Menu Lateral Esquerdo -->
        <aside class="sidebar">
            <div class="sidebar-logo">Instagram</div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active"><span>🏠</span> <p>Página Inicial</p></a>
                <a href="#" class="nav-item"><span>🔍</span> <p>Pesquisa</p></a>
                <a href="#" class="nav-item"><span>🧭</span> <p>Explorar</p></a>
                <a href="#" class="nav-item"><span>🎬</span> <p>Reels</p></a>
                <a href="#" class="nav-item"><span>💬</span> <p>Mensagens</p></a>
                <a href="#" class="nav-item"><span>❤️</span> <p>Notificações</p></a>
                <button id="open-create-modal" class="nav-item create-btn"><span>➕</span> <p>Criar</p></button>
                <a href="#" class="nav-item">
                    <img src="https://pravatar.cc" alt="Perfil" class="mini-avatar">
                    <p>Perfil</p>
                </a>
            </nav>
        </aside>

        <!-- Área Central (Stories + Feed) -->
        <main class="main-feed">
            <div class="feed-column">
                <!-- Barra de Stories -->
                <section class="stories-bar" id="stories-bar"></section>

                <!-- Publicações -->
                <section class="posts-list" id="posts-list"></section>
            </div>

            <!-- Coluna Direita (Sugestões) -->
            <aside class="right-panel">
                <div class="user-profile-switch">
                    <div class="user-info">
                        <img src="https://pravatar.cc" alt="Você">
                        <div>
                            <strong>dev.teresina</strong>
                            <span>Desenvolvedor Web</span>
                        </div>
                    </div>
                    <button class="text-btn">Mudar</button>
                </div>

                <div class="suggestions-header">
                    <span>Sugestões para você</span>
                    <a href="#">Ver tudo</a>
                </div>

                <div id="suggestions-list" class="suggestions-list"></div>
            </aside>
        </main>
    </div>

    <!-- Modal: Visualizador de Stories -->
    <div id="story-viewer" class="modal-overlay hidden">
        <div class="story-modal-box">
            <div class="story-progress-bar">
                <div id="story-progress-fill" class="story-progress-fill"></div>
            </div>
            <div class="story-modal-header">
                <div class="story-modal-user">
                    <img id="story-viewer-avatar" src="" alt="">
                    <span id="story-viewer-user"></span>
                </div>
                <button id="close-story" class="close-white-btn">&times;</button>
            </div>
            <img id="story-viewer-img" src="" alt="Story" class="story-full-img">
        </div>
    </div>

    <!-- Modal: Criar Nova Publicação -->
    <div id="create-modal" class="modal-overlay hidden">
        <div class="create-modal-box">
            <div class="create-header">
                <h3>Criar nova publicação</h3>
                <button id="close-create" class="close-dark-btn">&times;</button>
            </div>
            <form id="create-post-form" class="create-body">
                <label class="file-upload-label">
                    <span>📷 Selecionar foto do computador</span>
                    <input type="file" id="post-file-input" accept="image/*" required>
                </label>
                <img id="image-preview" class="image-preview hidden" alt="Pré-visualização">
                <input type="text" id="post-location-input" placeholder="Adicionar localização (ex: Teresina, PI)">
                <textarea id="post-caption-input" rows="3" placeholder="Escreva uma legenda..." required></textarea>
                <button type="submit" class="submit-post-btn">Compartilhar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
