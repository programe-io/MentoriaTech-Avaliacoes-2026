<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Barra Superior -->
    <header class="navbar">
        <div class="nav-container">
            <h1 class="logo">Instagram</h1>
            <input type="text" class="search-bar" placeholder="Pesquisar">
            <div class="nav-icons">
                <button id="openModalBtn" class="btn-new-post" title="Nova Publicação">+ Criar</button>
                <img src="https://pravatar.cc" alt="Perfil" class="nav-avatar">
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-container">
        <!-- Barra de Stories -->
        <section class="stories-container" id="storiesContainer"></section>

        <!-- Feed de Posts -->
        <section class="feed-container" id="feedContainer"></section>
    </main>

    <!-- Modal para Nova Publicação -->
    <div id="postModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Criar nova publicação</h3>
                <span id="closeModalBtn" class="close-btn">&times;</span>
            </div>
            <div class="modal-body">
                <input type="text" id="newPostImage" placeholder="Cole a URL da imagem (ex: https://...)">
                <textarea id="newPostCaption" rows="3" placeholder="Escreva uma legenda..."></textarea>
                <button id="publishPostBtn" class="btn-publish">Compartilhar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
