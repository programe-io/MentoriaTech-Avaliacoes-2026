<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clone Instagram</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body class="min-h-screen bg-muted text-foreground font-sans antialiased">

<header class="sticky top-0 bg-card border-b border-border z-50">
  <div class="max-w-5xl mx-auto px-4">
    <div class="flex items-center justify-between h-14 md:h-16">

      <h1 class="font-semibold text-lg md:text-xl">Instagram</h1>

      <div class="hidden md:flex items-center relative">
        <i class="bx bx-search absolute left-3"></i>
        <input type="text" placeholder="Pesquisar"
          class="bg-gray-100 pl-9 pr-4 py-2 rounded-lg text-sm w-64 h-9" />
      </div>

      <div class="hidden md:flex items-center gap-5">
        <i class="bx bx-home text-xl cursor-pointer"></i>
        <i class="bx bx-search text-xl cursor-pointer"></i>
        <i class="bx bx-plus text-xl cursor-pointer"></i>
        <i class="bx bx-heart text-xl cursor-pointer"></i>
      </div>

      <button class="md:hidden text-2xl">
        <i class="bx bx-menu"></i>
      </button>

    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-4 md:py-8 pb-20">
<div class="flex gap-8">

<div class="flex-1 max-w-lg mx-auto">

<!-- STORIES -->
<section class="bg-card border rounded-lg p-4 mb-4 w-full">
<div class="flex items-start gap-5 overflow-x-auto flex-nowrap no-scrollbar">

<div class="flex flex-col items-center flex-shrink-0">
<div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center">
<span class="text-2xl">+</span>
</div>
<span class="text-xs mt-1">seu_story</span>
</div>

<div class="flex flex-col items-center flex-shrink-0">
<img src="https://i.pinimg.com/236x/33/43/6f/33436f4ec9cbabb06a8c7d198fa8d8ff.jpg"
class="w-16 h-16 rounded-full object-cover" />
<span class="text-xs mt-1">adrii</span>
</div>

<div class="flex flex-col items-center flex-shrink-0">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWB_0mFI46VyFy8In1_F-_T7_imFuaDvWXxXFV8T94TtyT8LrQo9XlX_U&s=10"
class="w-16 h-16 rounded-full object-cover" />
<span class="text-xs mt-1">yas.ribeiroo</span>
</div>

<div class="flex flex-col items-center flex-shrink-0">
<img src="https://i.pinimg.com/236x/62/b1/b1/62b1b115827b8a6c3ce91e344e8369a5.jpg"
class="w-16 h-16 rounded-full object-cover" />
<span class="text-xs mt-1">julia.macena</span>
</div>

</div>
</section>

<!-- POSTAGEM 1 -->
<article class="bg-card border rounded-lg mb-4">

<div class="flex justify-between items-center p-4">
<div class="flex items-center gap-3">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQthNBYlC4v1CTPoHT0TbPlkDPkfteFzhtikNePVBnHbqm4RF3nAwmOj0oL&s=10"
class="w-10 h-10 rounded-full object-cover" />

<div>
<span class="font-semibold text-sm block">paola.pin</span>
<span class="text-xs text-gray-500">fortaleza</span>
</div>
</div>

<i class="bx bx-dots-horizontal text-xl"></i>
</div>

<div>
<img src="https://i.pinimg.com/736x/a5/9c/3a/a59c3a54dd780fc2ac899ffecd2a0da8.jpg"
class="w-full object-cover" />
</div>

<div class="p-4">

<div class="flex justify-between items-center mb-2">
<div class="flex gap-4">
<i class="bx bx-heart text-2xl cursor-pointer"
onclick="toggleLike(this, 'likes-1')"></i>

<i class="bx bx-message-rounded text-2xl"></i>
<i class="bx bx-send text-2xl"></i>
</div>

<i class="bx bx-bookmark text-2xl cursor-pointer"
onclick="toggleBookmark(this)"></i>
</div>

<p id="likes-1" data-count="112"
class="text-sm font-semibold mb-2">323 curtidas</p>

<p class="text-sm">
<strong>paola.pin</strong>
dia de shopping
</p>

<button class="text-sm text-gray-500 mt-1">
Ver todos os 68 comentários
</button>

<p class="text-xs text-gray-500 mt-2">HÁ DUAS HORAS</p>
</div>
</article>

<!-- POSTAGEM 2 -->
<article class="bg-card border rounded-lg mb-4">

<div class="flex justify-between items-center p-4">
<div class="flex items-center gap-3">

<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWB_0mFI46VyFy8In1_F-_T7_imFuaDvWXxXFV8T94TtyT8LrQo9XlX_U&s=10"
class="w-10 h-10 rounded-full object-cover" />

<div>
<p class="text-sm font-semibold">yass.ribeiro</p>
<p class="text-xs text-gray-500">Parnaíba-PI</p>
</div>

</div>
<i class="bx bx-dots-horizontal text-xl"></i>
</div>

<div>
<img src="https://st3.depositphotos.com/1518767/14956/i/1600/depositphotos_149569674-stock-photo-female-friends-in-bikinis-enjoying.jpg"
class="w-full object-cover" />
</div>

<div class="p-4">

<div class="flex justify-between items-center mb-2">
<div class="flex gap-4">

<i class="bx bx-heart text-2xl cursor-pointer"
onclick="toggleLike(this, 'likes-2')"></i>

<i class="bx bx-message-rounded text-2xl"></i>
<i class="bx bx-send text-2xl"></i>
</div>

<i class="bx bx-bookmark text-2xl cursor-pointer"
onclick="toggleBookmark(this)"></i>
</div>

<p id="likes-2" data-count="2005"
class="text-sm font-semibold mb-2">297 curtidas</p>

<p class="text-sm">
<strong>yass.ribeiro</strong>
com as girls
dia de praia ✨
</p>

<button class="text-sm text-gray-500 mt-1">
Ver todos os 54 comentários
</button>

<p class="text-xs text-gray-500 mt-2">HÁ DUAS HORAS</p>
</div>
</article>

</div>


  <script src="script.js"></script>
  
</body>
</html>
