
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaPro - Rede Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<!-- TELA DE LOGIN -->
<div id="login-screen" class="login-screen">
    <div class="login-box">
        <h1>Insta<span>Pro</span></h1>
        <p>Compartilhe seus melhores momentos.</p>

        <form id="login-form">
            <input id="login-user" placeholder="Seu nome de usuário" required>
            <input id="login-password" type="password"
                   placeholder="Sua senha" required>
            <button type="submit">Entrar</button>
        </form>

        <p>Ainda não tem conta?</p>
        <button id="show-register" class="link-button">
            Criar uma conta
        </button>
    </div>
</div>

<!-- CADASTRO -->
<div id="register-screen" class="login-screen hidden">
    <div class="login-box">
        <h1>Insta<span>Pro</span></h1>
        <p>Crie sua conta gratuitamente.</p>

        <form id="register-form">
            <input id="register-name" placeholder="Nome completo" required>
            <input id="register-user" placeholder="Nome de usuário" required>
            <input id="register-password" type="password"
                   placeholder="Crie uma senha" required minlength="4">
            <button type="submit">Cadastrar</button>
        </form>

        <button id="show-login" class="link-button">
            Já tenho uma conta
        </button>
    </div>
</div>

<!-- APLICAÇÃO -->
<div id="app" class="hidden">

    <header class="topbar">
        <h1>Insta<span>Pro</span></h1>
        <input id="search" placeholder="Pesquisar usuários...">
        <button id="theme-button">🌙</button>
        <button id="logout">Sair</button>
    </header>

    <div class="layout">

        <aside class="sidebar">
            <button data-page="home">🏠 Início</button>
            <button data-page="explore">🔎 Explorar</button>
            <button data-page="create">➕ Criar publicação</button>
            <button data-page="messages">💬 Mensagens</button>
            <button data-page="notifications">❤️ Notificações</button>
            <button data-page="profile">👤 Meu perfil</button>
        </aside>

        <main id="content">

            <!-- INÍCIO -->
            <section id="page-home" class="page">
                <div class="stories">
                    <div class="story" id="my-story">
                        <button id="add-story">+</button>
                        <span>Seu story</span>
                    </div>
                    <div id="stories-list"></div>
                </div>

                <div id="feed"></div>
            </section>

            <!-- EXPLORAR -->
            <section id="page-explore" class="page hidden">
                <h2>Explorar</h2>
                <div id="explore-feed" class="explore-grid"></div>
            </section>

            <!-- CRIAR PUBLICAÇÃO -->
            <section id="page-create" class="page hidden">
                <div class="panel">
                    <h2>Criar publicação</h2>
                    <form id="post-form">
                        <input id="post-image"
                               placeholder="URL da imagem (opcional)">
                        <textarea id="post-text"
                                  placeholder="O que você está pensando?"
                                  required></textarea>
                        <button type="submit">Publicar</button>
                    </form>
                </div>
            </section>

            <!-- PERFIL -->
            <section id="page-profile" class="page hidden">
                <div id="profile-content"></div>
            </section>

            <!-- NOTIFICAÇÕES -->
            <section id="page-notifications" class="page hidden">
                <div class="panel">
                    <h2>Notificações</h2>
                    <div id="notifications-list"></div>
                </div>
            </section>

            <!-- MENSAGENS -->
            <section id="page-messages" class="page hidden">
                <div class="panel">
                    <h2>Mensagens</h2>
                    <select id="message-user">
                        <option value="">Escolha um usuário</option>
                    </select>
                    <div id="chat"></div>
                    <form id="message-form">
                        <input id="message-text"
                               placeholder="Escreva uma mensagem..."
                               required>
                        <button>Enviar</button>
                    </form>
                </div>
            </section>

        </main>

        <aside class="rightbar">
            <h3>Sugestões para você</h3>
            <div id="suggestions"></div>
        </aside>

    </div>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
