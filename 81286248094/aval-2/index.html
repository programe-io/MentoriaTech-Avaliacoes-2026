<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="temas">
    <button class="btn-tema" onclick="mudarTema('padrao')">Padrão</button>
    <button class="btn-tema" onclick="mudarTema('rosa')">Rosinha</button>
    <button class="btn-tema" onclick="mudarTema('roxo')">Roxinho</button>
  </div>

  <div class="calculadora">
    <input type="text" id="visor" readonly>

    <div class="botoes">
      <button onclick="limpar()" class="operador">C</button>
      <button onclick="apagar()" class="operador">⌫</button>
      <button onclick="adicionar('/')" class="operador">÷</button>
      <button onclick="adicionar('*')" class="operador">×</button>

      <button onclick="adicionar('7')">7</button>
      <button onclick="adicionar('8')">8</button>
      <button onclick="adicionar('9')">9</button>
      <button onclick="adicionar('-')" class="operador">-</button>

      <button onclick="adicionar('4')">4</button>
      <button onclick="adicionar('5')">5</button>
      <button onclick="adicionar('6')">6</button>
      <button onclick="adicionar('+')" class="operador">+</button>

      <button onclick="adicionar('1')">1</button>
      <button onclick="adicionar('2')">2</button>
      <button onclick="adicionar('3')">3</button>
      <button onclick="calcular()" class="igual">=</button>

      <button onclick="adicionar('0')" class="zero">0</button>
      <button onclick="adicionar('.')">.</button>
    </div>
  </div>
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
