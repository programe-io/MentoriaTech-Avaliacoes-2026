<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bovino Brasas</title>
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Bovino Brasas</h1>
        <p>Cadastro de Clientes</p>
    </header>

    <main>

        <section class="cadastro">

            <h2>Faça seu Cadastro</h2>

            <form>

                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>

                <label for="data">Data de Nascimento</label>
                <input type="date" id="data" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha" required>

                <label for="confirmar">Confirmar Senha</label>
                <input type="password" id="confirmar" placeholder="Confirme a senha" required>

                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" placeholder="Sua cidade">

                <label for="estado">Estado</label>
                <select id="estado">
                    <option>Selecione</option>
                    <option>AC</option>
                    <option>AL</option>
                    <option>AM</option>
                    <option>AP</option>
                    <option>BA</option>
                    <option>CE</option>
                    <option>DF</option>
                    <option>ES</option>
                    <option>GO</option>
                    <option>MA</option>
                    <option>MG</option>
                    <option>MS</option>
                    <option>MT</option>
                    <option>PA</option>
                    <option>PB</option>
                    <option>PE</option>
                    <option>PI</option>
                    <option>PR</option>
                    <option>RJ</option>
                    <option>RN</option>
                    <option>RO</option>
                    <option>RR</option>
                    <option>RS</option>
                    <option>SC</option>
                    <option>SE</option>
                    <option>SP</option>
                    <option>TO</option>
                </select>

                <button type="submit">Cadastrar</button>

            </form>

        </section>

        <aside>
            <h3>Vantagens do Cadastro</h3>

            <ul>
                <li>Reservas rápidas.</li>
                <li>Promoções exclusivas.</li>
                <li>Descontos especiais.</li>
                <li>Novidades do restaurante.</li>
            </ul>
        </aside>

    </main>

    <footer>
        <p>© 2026 Bovino Brasas - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
