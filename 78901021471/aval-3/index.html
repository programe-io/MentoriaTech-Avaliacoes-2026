
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutTok - Futebol em vídeos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topbar">
    <h1>⚽ Fut<span>Tok</span></h1>

    <input type="search" id="search"
        placeholder="Pesquisar jogador, time ou vídeo...">

    <label class="upload-btn">
        + Publicar
        <input type="file" id="uploadVideo" accept="video/*" hidden>
    </label>
</header>

<nav class="mobile-menu">
    <button onclick="filterFeed('todos')">🏠 Início</button>
    <button onclick="filterFeed('gols')">⚽ Gols</button>
    <button onclick="filterFeed('dribles')">🔥 Dribles</button>
    <button onclick="filterFeed('skills')">🎯 Skills</button>
</nav>

<main>
    <aside class="sidebar">
        <h3>MENU</h3>
        <button onclick="filterFeed('todos')">🏠 Para você</button>
        <button onclick="filterFeed('gols')">⚽ Gols</button>
        <button onclick="filterFeed('dribles')">🔥 Dribles</button>
        <button onclick="filterFeed('skills')">🎯 Habilidades</button>
        <button onclick="filterFeed('todos')">👥 Seguindo</button>
        <button onclick="filterFeed('todos')">❤️ Curtidos</button>

        <div class="sidebar-bottom">
            <p>FutTok © 2026</p>
            <small>O futebol nunca para!</small>
        </div>
    </aside>

    <section class="feed" id="feed">
        <!-- Os vídeos serão criados pelo JavaScript -->
    </section>

    <aside class="right-panel">
        <h3>🔥 Futebol em alta</h3>
        <p>#ChampionsLeague</p>
        <p>#Neymar</p>
        <p>#CristianoRonaldo</p>
        <p>#Messi</p>
        <p>#Gols</p>

        <hr>
        <h3>⚽ Sobre o FutTok</h3>
        <p>Seu lugar para assistir e compartilhar os melhores vídeos de futebol.</p>
    </aside>
</main>

<!-- Janela de comentários -->
<div class="modal" id="commentModal">
    <div class="modal-box">
        <button class="close" onclick="closeComments()">✕</button>
        <h2>Comentários ⚽</h2>

        <div id="commentsList"></div>

        <div class="comment-form">
            <input id="commentInput"
                placeholder="Escreva seu comentário...">
            <button id="sendComment">Enviar</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
