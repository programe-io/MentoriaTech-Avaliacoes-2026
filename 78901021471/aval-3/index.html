
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FutebolTok - Vídeos de Futebol</title>

  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

  <header>
    <h2>⚽ FUTEBOLTOK</h2>
    <span>Para quem ama futebol</span>
  </header>

  <main id="feed">

    <section class="video-card">
      <video src="videos/gol.mp4" loop muted playsinline></video>

      <div class="info">
        <h3>@futebol_mundial</h3>
        <p>⚽ Que golaço incrível! 🔥</p>
        <p>#futebol #gol #craque</p>
      </div>

      <div class="actions">
        <button class="like">❤️ <small>120</small></button>
        <button onclick="comentar()">💬 <small>Comentários</small></button>
        <button onclick="compartilhar()">↗️ <small>Enviar</small></button>
        <button onclick="alternarSom(this)">🔇 <small>Som</small></button>
      </div>
    </section>

    <section class="video-card">
      <video src="videos/drible.mp4" loop muted playsinline></video>

      <div class="info">
        <h3>@dribles_br</h3>
        <p>🔥 Dribles que parecem mágicos!</p>
        <p>#skills #futebol</p>
      </div>

      <div class="actions">
        <button class="like">❤️ <small>250</small></button>
        <button onclick="comentar()">💬 <small>Comentários</small></button>
        <button onclick="compartilhar()">↗️ <small>Enviar</small></button>
        <button onclick="alternarSom(this)">🔇 <small>Som</small></button>
      </div>
    </section>

    <section class="video-card">
      <video src="videos/futebol.mp4" loop muted playsinline></video>

      <div class="info">
        <h3>@craque_da_bola</h3>
        <p>🏆 A paixão pelo futebol!</p>
        <p>#futebol #esporte</p>
      </div>

      <div class="actions">
        <button class="like">❤️ <small>500</small></button>
        <button onclick="comentar()">💬 <small>Comentários</small></button>
        <button onclick="compartilhar()">↗️ <small>Enviar</small></button>
        <button onclick="alternarSom(this)">🔇 <small>Som</small></button>
      </div>
    </section>

  </main>

  <input type="file" id="upload" accept="video/*" hidden>

  <nav>
    <button onclick="inicio()">🏠<small>Início</small></button>
    <button onclick="abrirUpload()">➕<small>Publicar</small></button>
    <button onclick="perfil()">👤<small>Perfil</small></button>
  </nav>

  <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
