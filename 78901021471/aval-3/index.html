
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutTok - Rede Social de Futebol</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="topo">
    <h1>⚽ FutTok</h1>

    <input type="text" id="pesquisa"
        placeholder="Pesquisar pessoas...">

    <nav>
        <a href="#inicio">Início</a>
        <a href="#stories">Stories</a>
        <a href="#videos">Vídeos</a>
        <a href="#perfis">Perfis</a>
    </nav>
</header>

<main id="inicio">

    <section class="stories" id="stories">
        <h2>Stories masculinos</h2>
        <div class="lista-stories" id="listaStories"></div>
    </section>

    <section class="feed" id="videos">
        <h2>Vídeos de futebol ⚽</h2>
        <div id="listaVideos"></div>
    </section>

    <section class="perfis" id="perfis">
        <h2>Conheça os jogadores</h2>
        <div class="lista-perfis" id="listaPerfis"></div>
    </section>

</main>

<!-- Janela dos stories -->
<div class="janela-story" id="janelaStory">
    <button class="fechar-story" onclick="fecharStory()">✖</button>
    <img id="fotoStory" src="" alt="Story">
    <h3 id="nomeStory"></h3>
</div>

<footer>
    <p>⚽ FutTok - Compartilhando a paixão pelo futebol</p>
    <p>© 2026 - Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
