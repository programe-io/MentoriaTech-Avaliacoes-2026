
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d0a">
    <title>FUTTOK - Rede Social de Futebol</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="header">
    <a href="#" class="logo">⚽ FUT<span>TOK</span></a>

    <input id="search" type="search"
        placeholder="Pesquisar gols, dribles, jogadores...">

    <label class="publish-button">
        ＋ Publicar
        <input id="upload" type="file"
            accept="video/mp4,video/webm,video/ogg" hidden>
    </label>
</header>

<main class="layout">

    <aside class="sidebar">
        <h3>MENU</h3>
        <button data-filter="todos">🏠 Para você</button>
        <button data-filter="gols">⚽ Gols</button>
        <button data-filter="dribles">🔥 Dribles</button>
        <button data-filter="skills">🎯 Habilidades</button>
        <button data-filter="defesas">🧤 Defesas</button>
        <button data-filter="treino">🏃 Treinamentos</button>

        <div class="sidebar-footer">
            <p>FUTTOK © 2026</p>
            <small>O futebol conecta o mundo.</small>
        </div>
    </aside>

    <section class="feed-area">

        <div class="feed-tabs">
            <button class="active" data-sort="recomendados">
                Para você
            </button>
            <button data-sort="recentes">
                Seguindo / Recentes
            </button>
            <button data-sort="populares">
                Em alta 🔥
            </button>
        </div>

        <div id="feed" class="feed"></div>

    </section>

    <aside class="right-sidebar">
        <h3>🔥 ASSUNTOS EM ALTA</h3>
        <p>#Futebol</p>
        <p>#Golaço</p>
        <p>#Dribles</p>
        <p>#ChampionsLeague</p>
        <p>#FutebolBrasileiro</p>

        <hr>

        <h3>⚽ FUTTOK</h3>
        <p>Compartilhe sua paixão pelo futebol!</p>

        <a href="https://www.pexels.com/search/videos/football/"
           target="_blank">Encontrar vídeos de futebol</a>
    </aside>

</main>

<!-- Modal de comentários -->
<div class="modal" id="commentModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Comentários 💬</h2>
            <button id="closeModal">✕</button>
        </div>

        <div id="commentsList"></div>

        <form id="commentForm">
            <input id="commentInput"
                placeholder="Escreva um comentário..."
                maxlength="300" required>
            <button type="submit">Enviar</button>
        </form>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
