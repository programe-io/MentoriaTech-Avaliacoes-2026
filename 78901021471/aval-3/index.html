
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTTOK ⚽</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>⚽ FUT<span>TOK</span></h1>

    <input type="search" id="search"
        placeholder="Pesquisar jogadores...">

    <button class="publish">+ Publicar</button>
</header>

<nav class="menu">
    <button onclick="filterPlayers('todos')">🏠 Para você</button>
    <button onclick="filterPlayers('atacante')">⚽ Atacantes</button>
    <button onclick="filterPlayers('meio-campo')">🎯 Meio-campo</button>
    <button onclick="filterPlayers('defensor')">🛡️ Defensores</button>
</nav>

<main>
    <aside class="sidebar">
        <h3>MENU</h3>
        <button onclick="filterPlayers('todos')">🏠 Início</button>
        <button onclick="filterPlayers('atacante')">⚽ Jogadores</button>
        <button onclick="filterPlayers('todos')">🔥 Em alta</button>
        <button onclick="filterPlayers('todos')">❤️ Curtidos</button>
        <button onclick="filterPlayers('todos')">👥 Seguindo</button>
    </aside>

    <section class="feed" id="feed">
        <!-- Publicações criadas pelo JavaScript -->
    </section>

    <aside class="trending">
        <h3>🔥 Jogadores populares</h3>
        <p>🇦🇷 Lionel Messi</p>
        <p>🇵🇹 Cristiano Ronaldo</p>
        <p>🇧🇷 Neymar Jr.</p>
        <p>🇫🇷 Mbappé</p>
        <p>🇧🇷 Vinícius Júnior</p>
        <hr>
        <h3>⚽ FUTTOK</h3>
        <p>O mundo do futebol em um só lugar!</p>
    </aside>
</main>

<div class="modal" id="commentModal">
    <div class="modal-content">
        <button class="close" onclick="closeModal()">✖</button>
        <h2>Comentários ⚽</h2>
        <div id="commentsList"></div>
        <input id="commentInput" placeholder="Digite seu comentário...">
        <button id="sendComment">Enviar</button>
    </div>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
