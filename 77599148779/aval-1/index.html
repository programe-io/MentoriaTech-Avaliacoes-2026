
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Básico</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f2;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      width: 100%;
      max-width: 520px;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
    }

    .tag {
      color: #777;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .description {
      color: #777;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      color: #777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .progress-bar {
      height: 5px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #222;
      transition: width 0.3s ease;
    }

    h2 {
      font-size: 21px;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      width: 100%;
      padding: 15px;
      text-align: left;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      color: #222;
    }

    .option:hover:not(:disabled) {
      border-color: #222;
      background: #fafafa;
    }

    .option.correct {
      background: #e5f5e9;
      border-color: #29834b;
    }

    .option.wrong {
      background: #fff0ef;
      border-color: #d9534f;
    }

    .option:disabled {
      cursor: default;
    }

    .feedback {
      min-height: 25px;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 15px;
    }

    .primary {
      border: none;
      background: #222;
      color: #fff;
      border-radius: 9px;
      padding: 14px 22px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .primary:hover {
      background: #444;
    }

    .primary:focus-visible,
    .option:focus-visible {
      outline: 3px solid #999;
      outline-offset: 3px;
    }

    .hidden {
      display: none;
    }

    .result {
      text-align: center;
    }

    .result .emoji {
      font-size: 48px;
      margin: 15px 0;
    }

    .result h2 {
      font-size: 26px;
      margin-bottom: 12px;
    }

    .score {
      font-size: 42px;
      font-weight: bold;
      margin: 20px 0;
    }

    .result p {
      color: #777;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .result .primary {
      width: 100%;
    }

    @media (max-width: 480px) {
      .container {
        padding: 25px 20px;
      }

      h1 {
        font-size: 26px;
      }

      h2 {
        font-size: 19px;
      }
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
  <main class="container">
    <section id="quiz">
      <p class="tag">Conhecimentos gerais</p>
      <h1>Quiz Básico</h1>
      <p class="description">
        Responda às perguntas e descubra quantas você consegue acertar.
      </p>

      <div class="progress-info">
        <span id="questionCount">Pergunta 1 de 5</span>
        <span id="scoreLabel">Pontos: 0</span>
      </div>

      <div
        class="progress-bar"
        role="progressbar"
        aria-label="Progresso do quiz"
        aria-valuemin="0"
        aria-valuemax="5"
        aria-valuenow="0"
        id="progressBar"
      >
        <div class="progress" id="progress"></div>
      </div>

      <h2 id="question">Carregando pergunta...</h2>

      <div class="options" id="options"></div>

      <p class="feedback" id="feedback" aria-live="polite"></p>

      <div class="actions">
        <button class="primary hidden" id="nextButton">
          Próxima pergunta →
        </button>
      </div>
    </section>

    <section id="result" class="result hidden" aria-live="polite">
      <p class="tag">Quiz finalizado</p>
      <div class="emoji" id="resultEmoji">🎉</div>
      <h2 id="resultTitle">Muito bem!</h2>
      <div class="score" id="finalScore">0/5</div>
      <p id="resultMessage"></p>
      <button class="primary" id="restartButton">
        Jogar novamente
      </button>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Qual é a capital do Brasil?",
        options: ["São Paulo", "Brasília", "Rio de Janeiro", "Salvador"],
        answer: 1
      },
      {
        question: "Quanto é 5 + 7?",
        options: ["10", "11", "12", "13"],
        answer: 2
      },
      {
        question: "Qual planeta é conhecido como Planeta Vermelho?",
        options: ["Vênus", "Marte", "Júpiter", "Saturno"],
        answer: 1
      },
      {
        question: "Quantos dias tem uma semana?",
        options: ["5 dias", "6 dias", "7 dias", "8 dias"],
        answer: 2
      },
      {
        question: "Qual animal é conhecido como rei da selva?",
        options: ["Tigre", "Elefante", "Leão", "Lobo"],
        answer: 2
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const quiz = document.getElementById("quiz");
    const result = document.getElementById("result");
    const questionElement = document.getElementById("question");
    const optionsElement = document.getElementById("options");
    const feedbackElement = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");
    const progress = document.getElementById("progress");
    const progressBar = document.getElementById("progressBar");

    function showQuestion() {
      answered = false;

      const q = questions[currentQuestion];

      document.getElementById("questionCount").textContent =
        `Pergunta ${currentQuestion + 1} de ${questions.length}`;

      document.getElementById("scoreLabel").textContent =
        `Pontos: ${score}`;

      questionElement.textContent = q.question;
      optionsElement.replaceChildren();
      feedbackElement.textContent = "";
      nextButton.classList.add("hidden");

      progress.style.width =
        `${(currentQuestion / questions.length) * 100}%`;

      progressBar.setAttribute("aria-valuenow", currentQuestion);

      q.options.forEach((option, index) => {
        const button = document.createElement("button");

        button.className = "option";
        button.textContent = option;
        button.addEventListener("click", () => selectAnswer(index));

        optionsElement.appendChild(button);
      });
    }

    function selectAnswer(index) {
      if (answered) return;

      answered = true;

      const q = questions[currentQuestion];
      const buttons = optionsElement.querySelectorAll(".option");

      buttons.forEach((button, i) => {
        button.disabled = true;

        if (i === q.answer) {
          button.classList.add("correct");
        }

        if (i === index && index !== q.answer) {
          button.classList.add("wrong");
        }
      });

      if (index === q.answer) {
        score++;
        feedbackElement.textContent = "Correto! Muito bem.";
      } else {
        feedbackElement.textContent =
          `Resposta incorreta. A resposta certa é: ${q.options[q.answer]}.`;
      }

      document.getElementById("scoreLabel").textContent =
        `Pontos: ${score}`;

      nextButton.textContent =
        currentQuestion === questions.length - 1
          ? "Ver resultado →"
          : "Próxima pergunta →";

      nextButton.classList.remove("hidden");
    }

    function showResult() {
      quiz.classList.add("hidden");
      result.classList.remove("hidden");

      const percentage = Math.round((score / questions.length) * 100);

      document.getElementById("finalScore").textContent =
        `${score}/${questions.length}`;

      document.getElementById("resultEmoji").textContent =
        percentage === 100 ? "🏆" :
        percentage >= 60 ? "🎉" : "💪";

      document.getElementById("resultTitle").textContent =
        percentage === 100 ? "Perfeito!" :
        percentage >= 60 ? "Muito bem!" : "Continue praticando!";

      document.getElementById("resultMessage").textContent =
        `Você acertou ${score} de ${questions.length} perguntas, ` +
        `alcançando ${percentage}% de aproveitamento.`;
    }

    nextButton.addEventListener("click", () => {
      if (!answered) return;

      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        progress.style.width = "100%";
        progressBar.setAttribute("aria-valuenow", questions.length);
        showResult();
      }
    });

    document.getElementById("restartButton").addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;

      result.classList.add("hidden");
      quiz.classList.remove("hidden");

      showQuestion();
    });

    showQuestion();
  </script>
<script src="script.js"></script></body>
</html>
