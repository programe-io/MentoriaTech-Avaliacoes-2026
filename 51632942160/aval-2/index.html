<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style2.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <div class="header-content">

            <h1>MiniFeed</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>

        </div>
    </header>

    <main>

        <section class="new-post">

            <div class="user">

                <div class="avatar">
                    K
                </div>

                <div>
                    <strong>Kassia Rebeka</strong>
                    <span>Como foi seu dia hoje?</span>
                </div>

            </div>

            <button>Publicar</button>

        </section>

        <article class="post">

            <div class="post-header">

                <div class="avatar">
                    A
                </div>

                <div>
                    <strong>Ana</strong>
                    <span>Há 10 minutos</span>
                </div>

            </div>

            <div class="post-text">
                Tranquilidade!
            </div>

            <img
    src="https://previews.123rf.com/images/simpleline/simpleline2302/simpleline230212916/198861346-single-continuous-line-drawing-sick-girl-with-high-fever-child-is-sick-with-flu-or-coronavirus-kid.jpg"
    alt="Descansando"
         >      

         <style>
    .post img {
        width: 100%;
        max-width: 500px;
        display: block;
    }
</style>

         
         <div class="post-actions">

            <button>Curtir</button>
            <button>Comentar</button>


         </div>
            

        </article>

    </main>

    <footer>
        <p>MiniFeed - Simples e direto</p>
    </footer>

</body>
</html>
