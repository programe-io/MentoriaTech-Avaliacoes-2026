<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="app">
    <header class="topo">
      <h1>Gerenciador de tarefas</h1>
      <p class="resumo" id="resumo" aria-live="polite"></p>
    </header>

    <div class="colunas">
      <section class="painel" aria-labelledby="titulo-form">
        <h2 id="titulo-form">Nova tarefa</h2>
        <form id="form-tarefa" novalidate>
          <label for="titulo">Título</label>
          <input type="text" id="titulo" name="titulo" placeholder="Ex.: Revisar arrays" autocomplete="off">
          <span class="dica">Mínimo de 5 caracteres.</span>

          <label for="prioridade">Prioridade</label>
          <select id="prioridade" name="prioridade">
            <option value="1">1 - Alta</option>
            <option value="2" selected>2 - Média</option>
            <option value="3">3 - Baixa</option>
          </select>

          <button type="submit" class="botao-principal">Cadastrar tarefa</button>
        </form>

        <p class="mensagem" id="mensagem" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="titulo-lista">
        <h2 id="titulo-lista" class="visualmente-oculto">Tarefas cadastradas</h2>
        <ul class="lista" id="lista-tarefas"></ul>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
