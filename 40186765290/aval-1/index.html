
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- O nome deve ser index.html pra funcionar corretamente-->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Estoque</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <h1>Controle de Estoque</h1>
    <p>Cadastre, edite e exclua produtos.</p>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="titulo-form">Novo produto</h2>
      <form id="form-produto">
        <input type="hidden" id="codigo">

        <div class="campo">
          <label for="descricao">Descrição do produto</label>
          <input type="text" id="descricao" placeholder="Ex.: Cadeira gamer"
                 maxlength="100" required>
        </div>

        <div class="linha">
          <div class="campo">
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="0" step="1"
                   placeholder="0" required>
          </div>
          <div class="campo">
            <label for="valor">Valor unitário (R$)</label>
            <input type="number" id="valor" min="0" step="0.01"
                   placeholder="0.00" required>
          </div>
        </div>

        <p id="mensagem" class="mensagem" role="status" hidden></p>

        <div class="acoes">
          <button type="submit" id="btn-salvar" class="btn btn-primario">Cadastrar produto</button>
          <button type="button" id="btn-cancelar" class="btn btn-secundario" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="cabecalho-lista">
        <h2>Produtos cadastrados</h2>
        <span id="resumo" class="resumo"></span>
      </div>

      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Código</th><th>Descrição</th><th class="num">Qtd.</th>
              <th class="num">Valor</th><th class="num">Total</th><th class="col-acoes">Ações</th>
            </tr>
          </thead>
          <tbody id="lista-produtos"></tbody>
        </table>
      </div>
      <p id="vazio" class="vazio">Nenhum produto cadastrado ainda.</p>
    </section>
  </main>

  <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
