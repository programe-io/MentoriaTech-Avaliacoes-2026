<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Ficha de Anamnese - IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <h1>Controle de IMC - Ficha de Anamnese</h1>

        <!-- Formulário de Cadastro -->
        <form id="form-pessoa">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite o nome completo">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" placeholder="Ex: 30">
                </div>
                <div class="form-group">
                    <label for="altura">Altura (m):</label>
                    <input type="number" step="0.01" id="altura" placeholder="Ex: 1.70">
                </div>
                <div class="form-group">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" step="0.1" id="peso" placeholder="Ex: 65.5">
                </div>
            </div>

            <!-- Mensagem de Erro -->
            <p id="erro" class="mensagem-erro" hidden></p>

            <button type="submit" id="btn-salvar">Salvar Registro</button>
        </form>

        <!-- Tabela de Exibição -->
        <section class="table-container">
            <h2>Pessoas Cadastradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Cód</th>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Altura</th>
                        <th>Peso</th>
                        <th>IMC</th>
                        <th>Classificação</th>
                    </tr>
                </thead>
                <tbody id="tabela-pessoas">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
