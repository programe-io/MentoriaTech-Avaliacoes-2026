
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fafafa;
    }

    .story-gradient {
      background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      scrollbar-width: none;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="text-gray-900">

  <div class="min-h-screen">

    <!-- MENU LATERAL -->
    <aside class="hidden md:flex fixed left-0 top-0 h-screen w-64 border-r bg-white px-6 py-8 flex-col z-20">

      <h1 class="text-3xl font-bold tracking-tight mb-10">
        Instagram
      </h1>

      <nav class="space-y-7">

        <a href="#" class="flex items-center gap-4 font-semibold">
          <i data-lucide="house" class="w-6 h-6"></i>
          Página inicial
        </a>

        <a href="#" class="flex items-center gap-4 hover:font-semibold">
          <i data-lucide="search" class="w-6 h-6"></i>
          Pesquisa
        </a>

        <a href="#" class="flex items-center gap-4 hover:font-semibold">
          <i data-lucide="compass" class="w-6 h-6"></i>
          Explorar
        </a>

        <a href="#" class="flex items-center gap-4 hover:font-semibold">
          <i data-lucide="clapperboard" class="w-6 h-6"></i>
          Reels
        </a>

        <a href="#" class="flex items-center gap-4 hover:font-semibold">
          <i data-lucide="send" class="w-6 h-6"></i>
          Mensagens
        </a>

        <a href="#" class="flex items-center gap-4 hover:font-semibold">
          <i data-lucide="heart" class="w-6 h-6"></i>
          Notificações
        </a>

        <a href="#" class="flex items-center gap-4 hover:font-semibold">
          <i data-lucide="square-plus" class="w-6 h-6"></i>
          Criar
        </a>

        <a href="#" class="flex items-center gap-4 hover:font-semibold">
          <img
            src="https://i.pravatar.cc/100?img=12"
            class="w-7 h-7 rounded-full"
          >
          Perfil
        </a>

      </nav>

      <div class="mt-auto">
        <a href="#" class="flex items-center gap-4">
          <i data-lucide="menu" class="w-6 h-6"></i>
          Mais
        </a>
      </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="md:ml-64 flex justify-center">

      <div class="w-full max-w-6xl flex justify-center gap-12 px-4 md:px-8">

        <!-- FEED -->
        <section class="w-full max-w-[470px] pt-8 pb-20">

          <!-- STORIES -->
          <div class="bg-white border rounded-lg p-4 mb-6">

            <div id="stories" class="flex gap-5 overflow-x-auto hide-scrollbar">
              <!-- Gerado pelo JavaScript -->
            </div>

          </div>

          <!-- PUBLICAÇÕES -->
          <div id="feed" class="space-y-8">
            <!-- Gerado pelo JavaScript -->
          </div>

        </section>

        <!-- SUGESTÕES -->
        <aside class="hidden lg:block w-80 pt-10">

          <div class="flex items-center justify-between mb-7">

            <div class="flex items-center gap-3">

              <img
                src="https://i.pravatar.cc/100?img=12"
                class="w-12 h-12 rounded-full"
              >

              <div>
                <p class="font-semibold text-sm">meu_perfil</p>
                <p class="text-gray-500 text-sm">Meu perfil</p>
              </div>

            </div>

            <button class="text-blue-500 text-xs font-semibold">
              Mudar
            </button>

          </div>

          <div class="flex justify-between mb-5">
            <p class="text-sm text-gray-500 font-semibold">
              Sugestões para você
            </p>

            <button class="text-xs font-semibold">
              Ver tudo
            </button>
          </div>

          <div id="suggestions" class="space-y-5">
            <!-- Gerado pelo JavaScript -->
          </div>

          <div class="text-xs text-gray-400 mt-10 leading-6">
            Sobre · Ajuda · Imprensa · API · Carreiras ·
            Privacidade · Termos · Localizações
            <br><br>
            © 2026 INSTAGRAM CLONE
          </div>

        </aside>

      </div>
    </main>

    <!-- MENU MOBILE -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t flex justify-around py-3 z-30">

      <i data-lucide="house" class="w-6 h-6"></i>
      <i data-lucide="search" class="w-6 h-6"></i>
      <i data-lucide="square-plus" class="w-6 h-6"></i>
      <i data-lucide="clapperboard" class="w-6 h-6"></i>

      <img
        src="https://i.pravatar.cc/100?img=12"
        class="w-6 h-6 rounded-full"
      >

    </nav>

  </div>

  <script src="./js/app.js"></script>
  <script>
    lucide.createIcons();
  </script>

<script src="script.js"></script></body>
</html>
