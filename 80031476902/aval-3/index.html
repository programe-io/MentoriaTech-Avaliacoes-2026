<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="app-layout">
    <!-- Barra Lateral (Desktop) / Barra Inferior (Mobile) -->
    <aside class="sidebar">
      <div class="brand">Instagram</div>
      <nav class="nav-menu">
        <button class="nav-item active" data-tab="feed">
          <span class="icon">🏠</span> <span class="label">Página inicial</span>
        </button>
        <button class="nav-item" data-tab="explore">
          <span class="icon">🧭</span> <span class="label">Explorar</span>
        </button>
        <button class="nav-item" id="openCreateModal">
          <span class="icon">➕</span> <span class="label">Criar</span>
        </button>
        <button class="nav-item" data-tab="saved">
          <span class="icon">🔖</span> <span class="label">Salvos</span>
        </button>
      </nav>
    </aside>

    <!-- Área Principal -->
    <main class="main-content">
      <!-- Aba Feed -->
      <div id="feedTab" class="tab-view">
        <div class="feed-column">
          <!-- Carrossel de Stories -->
          <section class="stories-container" id="storiesBar"></section>

          <!-- Lista de Postagens -->
          <section id="postsFeed"></section>
        </div>

        <!-- Painel Direito de Sugestões (Desktop) -->
        <aside class="suggestions-panel">
          <div class="current-user">
            <img src="https://unsplash.com" alt="Avatar">
            <div>
              <strong>seu_perfil</strong>
              <span>Você</span>
            </div>
          </div>
          <div class="suggestions-header">
            <span>Sugestões para você</span>
          </div>
          <div id="suggestionsList"></div>
        </aside>
      </div>

      <!-- Aba Explorar / Salvos (Grade de Fotos) -->
      <div id="gridTab" class="tab-view hidden">
        <h2 id="gridTitle" class="grid-title">Explorar</h2>
        <div class="photo-grid" id="photoGrid"></div>
      </div>
    </main>
  </div>

  <!-- Modal: Criar Publicação -->
  <div class="modal hidden" id="createModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Criar nova publicação</h3>
        <button class="close-btn" id="closeCreateModal">&times;</button>
      </div>
      <form id="createPostForm" class="modal-body">
        <input type="url" id="newImageUrl" placeholder="Cole a URL da imagem (ex: https://...)" required>
        <input type="text" id="newLocation" placeholder="Localização (opcional)">
        <textarea id="newCaption" rows="3" placeholder="Escreva uma legenda..." required></textarea>
        <button type="submit" class="primary-btn">Compartilhar</button>
      </form>
    </div>
  </div>

  <!-- Visualizador de Story -->
  <div class="story-viewer hidden" id="storyViewer">
    <div class="story-content">
      <div class="story-progress"><div class="story-progress-fill" id="storyProgressFill"></div></div>
      <div class="story-top">
        <div class="story-user-info">
          <img id="storyViewerAvatar" src="" alt="">
          <strong id="storyViewerUser"></strong>
        </div>
        <button id="closeStoryViewer">&times;</button>
      </div>
      <img id="storyViewerImage" src="" alt="Story">
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
