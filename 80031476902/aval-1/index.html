<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miaublog — Tudo sobre o universo felino</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="header">
    <div class="container header-content">
      <h1>🐾 Miaublog</h1>
      <p>Curiosidades, cuidados e comportamento dos nossos amigos felinos</p>
    </div>
  </header>

  <main class="container">
    <!-- Controles de Busca e Filtro -->
    <section class="controls">
      <input type="text" id="searchInput" placeholder="Buscar artigos sobre gatos...">
      <div class="filters" id="categoryFilters">
        <button class="filter-btn active" data-category="todos">Todos</button>
        <button class="filter-btn" data-category="Cuidados">Cuidados</button>
        <button class="filter-btn" data-category="Comportamento">Comportamento</button>
        <button class="filter-btn" data-category="Curiosidades">Curiosidades</button>
      </div>
    </section>

    <!-- Grid de Postagens -->
    <section class="posts-grid" id="postsContainer"></section>
  </main>

  <!-- Modal para leitura do artigo completo -->
  <div class="modal" id="postModal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <img id="modalImage" src="" alt="Imagem do gato">
      <span class="badge" id="modalCategory"></span>
      <h2 id="modalTitle"></h2>
      <p class="date" id="modalDate"></p>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Miaublog — Feito para apaixonados por gatos 🐱</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
