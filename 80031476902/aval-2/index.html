<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatGram — Feed Felino</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Barra de Navegação Superior -->
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">🐱 CatGram</h1>
      <button id="openNewPostBtn" class="new-post-btn">+ Nova Foto</button>
    </div>
  </nav>

  <main class="feed-wrapper">
    <!-- Barra de Stories -->
    <section class="stories-bar" id="storiesContainer"></section>

    <!-- Formulário Oculto para Novo Post -->
    <section class="create-post-card hidden" id="createPostCard">
      <h3>Publicar no Feed</h3>
      <form id="newPostForm">
        <input type="text" id="postUser" placeholder="Nome do gato (ex: @mingau_oficial)" required>
        <input type="url" id="postImage" placeholder="URL da foto do gato (ex: https://...)" required>
        <input type="text" id="postCaption" placeholder="Escreva uma legenda fofa..." required>
        <div class="form-actions">
          <button type="button" id="cancelPostBtn" class="cancel-btn">Cancelar</button>
          <button type="submit" class="submit-btn">Publicar</button>
        </div>
      </form>
    </section>

    <!-- Lista de Postagens do Feed -->
    <section id="feedContainer"></section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
