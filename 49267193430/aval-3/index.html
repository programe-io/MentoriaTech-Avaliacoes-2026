<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Cabeçalho (Navbar) -->
    <header class="navbar">
        <div class="nav-container">
            <h1 class="logo">Instagram</h1>
            <div class="nav-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Pesquisar">
            </div>
            <div class="nav-icons">
                <i class="fa-solid fa-house active"></i>
                <i class="fa-regular fa-paper-plane"></i>
                <i class="fa-regular fa-square-plus"></i>
                <i class="fa-regular fa-compass"></i>
                <i class="fa-regular fa-heart"></i>
                <div class="mini-avatar" onclick="alert('Perfil do Usuário')"></div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-container">
        
        <!-- Coluna da Esquerda (Feed e Stories) -->
        <section class="feed-section">
            
            <!-- Barra de Stories -->
            <div class="stories-container" id="storiesContainer">
                <!-- Gerado via JavaScript -->
            </div>

            <!-- Feed de Publicações -->
            <div class="posts-feed" id="postsFeed">
                <!-- Gerado via JavaScript -->
            </div>
        </section>

        <!-- Coluna da Direita (Sugestões e Perfil) -->
        <aside class="sidebar">
            <div class="sidebar-profile">
                <div class="profile-pic"></div>
                <div class="profile-info">
                    <h4>dev_junior</h4>
                    <span>Seu Perfil • Desenvolvedor</span>
                </div>
                <a href="#" class="switch-btn">Mudar</a>
            </div>

            <div class="suggestions-header">
                <span>Sugestões para você</span>
                <a href="#">Ver tudo</a>
            </div>

            <div class="suggestions-list">
                <div class="suggestion-item">
                    <div class="sugg-avatar" style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80')"></div>
                    <div class="sugg-info">
                        <h4>julia_code</h4>
                        <span>Seguido(a) por carlos_dev + 5 outros</span>
                    </div>
                    <a href="#" class="follow-btn">Seguir</a>
                </div>
                <div class="suggestion-item">
                    <div class="sugg-avatar" style="background-image: url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80')"></div>
                    <div class="sugg-info">
                        <h4>tech_daily</h4>
                        <span>Novo no Instagram</span>
                    </div>
                    <a href="#" class="follow-btn">Seguir</a>
                </div>
            </div>

            <div class="footer-links">
                <p>&copy; 2026 INSTAGRAM CLONE DE VÍDEO & SOCIAL</p>
            </div>
        </aside>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
