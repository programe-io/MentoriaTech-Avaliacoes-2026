<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <div class="feed-container">
        <!-- Caixa de Criação de Post -->
        <div class="create-post-card">
            <h3>Criar Publicação</h3>
            <textarea id="postInput" placeholder="No que você está pensando?"></textarea>
            <div class="create-post-actions">
                <button id="publishBtn"><i class="fa-solid fa-paper-plane"></i> Publicar</button>
            </div>
        </div>

        <!-- Lista Onde os Posts Serão Injetados via JS -->
        <div id="postsList" class="posts-list">
            <!-- Os posts aparecerão aqui dinamicamente -->
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
