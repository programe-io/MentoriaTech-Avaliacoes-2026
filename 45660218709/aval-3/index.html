<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PyGram</title>
                <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
                    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
                    <body>

                        <nav class="navbar">
                                <div class="nav-container">
                                            <a href="/" class="logo">PyGram</a>
                                                        <a href="/upload" class="btn-new-post">+ Novo Post</a>
                                                                </div>
                                                                    </nav>

                                                                        <main class="container">
                                                                                {% if request.path == '/upload' %}
                                                                                            <div class="upload-box">
                                                                                                            <h2>Criar Nova Publicação</h2>
                                                                                                                            <form action="/upload" method="POST" enctype="multipart/form-data">
                                                                                                                                                <div class="form-group">
                                                                                                                                                                        <label>Nome de usuário</label>
                                                                                                                                                                                                <input type="text" name="username" required placeholder="seu_usuario">
                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                        <div class="form-group">
                                                                                                                                                                                                                                                                <label>Escolher foto</label>
                                                                                                                                                                                                                                                                                        <input type="file" name="file" accept="image/*" required>
                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                        <label>Legenda</label>
                                                                                                                                                                                                                                                                                                                                                                                <textarea name="caption" rows="3" placeholder="Escreva uma legenda..."></textarea>
                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="form-actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                <a href="/" class="btn-cancel">Cancelar</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="submit" class="btn-submit">Compartilhar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                {% else %}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            {% for post in posts %}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <article class="post-card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="post-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="avatar">{{ post.username[0]|upper }}</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <span class="username">{{ post.username }}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <img src="{{ post.image_url }}" alt="Foto do post" class="post-image">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="post-footer">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <a href="/like/{{ post.id }}" class="like-btn"><i class="fa-solid fa-heart"></i></a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <i class="fa-regular fa-comment"></i>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="likes-count">{{ post.likes }} curtidas</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p class="caption"><strong>{{ post.username }}</strong>{{ post.caption }}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </article>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        {% endfor %}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                {% endif %}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
