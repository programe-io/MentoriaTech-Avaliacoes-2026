
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - Rede Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <aside class="sidebar">
        <h1>Connect<span>.</span></h1>

        <nav>
            <a href="#">🏠 Início</a>
            <a href="#">🔍 Explorar</a>
            <a href="#">💬 Mensagens</a>
            <a href="#">🔔 Notificações</a>
            <a href="#">👤 Meu perfil</a>
        </nav>

        <button class="new-post" onclick="openPost()">
            + Nova publicação
        </button>
    </aside>

    <main>
        <header>
            <h2>Feed</h2>
            <div class="profile">👤</div>
        </header>

        <section class="stories">
            <div class="story">
                <div class="story-avatar add">+</div>
                <small>Seu story</small>
            </div>

            <div class="story">
                <div class="story-avatar">👩🏻</div>
                <small>Mariana</small>
            </div>

            <div class="story">
                <div class="story-avatar">👨🏽</div>
                <small>Lucas</small>
            </div>

            <div class="story">
                <div class="story-avatar">👩🏽</div>
                <small>Julia</small>
            </div>

            <div class="story">
                <div class="story-avatar">🧑🏻</div>
                <small>Pedro</small>
            </div>
        </section>

        <section id="feed" class="feed"></section>

    </main>

    <div id="postModal" class="modal">
        <div class="modal-content">
            <h2>Nova publicação</h2>

            <input id="newName" placeholder="Seu nome">

            <textarea id="newText"
                placeholder="Compartilhe alguma coisa..."></textarea>

            <input id="newImage"
                placeholder="URL de uma imagem (opcional)">

            <div class="modal-buttons">
                <button onclick="closePost()" class="cancel">
                    Cancelar
                </button>

                <button onclick="publishPost()">
                    Publicar
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
