
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>Controle de Produtos</h1>
            <p>Gerencie seu estoque de forma simples</p>
        </header>

        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao"
                        placeholder="Ex.: Cadeira Gamer" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade"
                        min="1" placeholder="0" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input type="number" id="valor"
                        min="0" step="0.01"
                        placeholder="0,00" required>
                </div>

                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section class="resumo">
            <div class="resumo-card">
                <span>Total de produtos</span>
                <strong id="totalProdutos">0</strong>
            </div>

            <div class="resumo-card">
                <span>Unidades em estoque</span>
                <strong id="totalUnidades">0</strong>
            </div>

            <div class="resumo-card">
                <span>Valor do estoque</span>
                <strong id="valorEstoque">R$ 0,00</strong>
            </div>
        </section>

        <section class="card">
            <h2>Produtos cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor unitário</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="6" class="vazio">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
