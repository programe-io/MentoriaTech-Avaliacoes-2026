<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Simples</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .calc {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      width: 260px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    #display {
      width: 100%;
      height: 50px;
      font-size: 1.6rem;
      text-align: right;
      margin-bottom: 12px;
      padding: 8px;
      box-sizing: border-box;
      border: none;
      border-radius: 6px;
      background: #fff;
      color: #111;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    button {
      height: 48px;
      font-size: 1.1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #3a3a3a;
      color: #fff;
    }
    button:hover {
      background: #505050;
    }
    .op {
      background: #ff9500;
    }
    .op:hover {
      background: #e08300;
    }
    .clear {
      background: #d9534f;
      grid-column: span 2;
    }
    .equal {
      background: #28a745;
      grid-column: span 2;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="calc">
    <input type="text" id="display" readonly />
    <div class="grid">
      <button class="clear" onclick="limpar()">C</button>
      <button class="op" onclick="adicionar('/')">÷</button>
      <button class="op" onclick="adicionar('*')">×</button>

      <button onclick="adicionar('7')">7</button>
      <button onclick="adicionar('8')">8</button>
      <button onclick="adicionar('9')">9</button>
      <button class="op" onclick="adicionar('-')">−</button>

      <button onclick="adicionar('4')">4</button>
      <button onclick="adicionar('5')">5</button>
      <button onclick="adicionar('6')">6</button>
      <button class="op" onclick="adicionar('+')">+</button>

      <button onclick="adicionar('1')">1</button>
      <button onclick="adicionar('2')">2</button>
      <button onclick="adicionar('3')">3</button>
      <button onclick="adicionar('.')">.</button>

      <button onclick="adicionar('0')">0</button>
      <button class="equal" onclick="calcular()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    function adicionar(valor) {
      display.value += valor;
    }

    function limpar() {
      display.value = "";
    }

    function calcular() {
      try {
        if (!/^[0-9+\-*/.()\s]+$/.test(display.value)) {
          display.value = "Erro";
          return;
        }
        const resultado = Function('"use strict"; return (' + display.value + ')')();
        display.value = Number.isFinite(resultado) ? resultado : "Erro";
      } catch {
        display.value = "Erro";
      }
    }
  </script>
<script src="script.js"></script></body>
</html>
