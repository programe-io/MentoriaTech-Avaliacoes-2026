<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Primeira Página HTML</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.5;
    }
    button {
      padding: 8px 14px;
      cursor: pointer;
    }
  </style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h1>Olá, mundo!</h1>
    <p>Este é um exemplo básico de estrutura em HTML.</p>
  </header>

  <main>
    <h2>Itens de exemplo</h2>
    <ul>
      <li>Estrutura com <code>&lt;html&gt;</code>, <code>&lt;head&gt;</code> e <code>&lt;body&gt;</code></li>
      <li>Links com a tag <code>&lt;a&gt;</code></li>
      <li>Interatividade simples com JavaScript</li>
    </ul>

    <p>
      Acesse a documentação em
      <a href="https://mozilla.org" target="_blank" rel="noopener noreferrer">MDN Web Docs</a>.
    </p>

    <button id="btn-acao">Clique aqui</button>
    <p id="mensagem"></p>
  </main>

  <script>
    const botao = document.getElementById("btn-acao");
    const mensagem = document.getElementById("mensagem");

    botao.addEventListener("click", () => {
      mensagem.textContent = "Botão clicado com sucesso!";
    });
  </script>
<script src="script.js"></script></body>
</html>
