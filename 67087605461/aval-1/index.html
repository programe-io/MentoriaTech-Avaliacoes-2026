<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <header>
        <h1>Controle de Estoque</h1>
        <p>Gerencie produtos, quantidades e preços de forma simples e rápida.</p>
    </header>

    <!-- Formulário de Cadastro/Edição -->
    <div class="card">
        <h2 id="form-title" style="margin-bottom: 1rem; font-size: 1.25rem;">Adicionar Novo Produto</h2>
        <form id="product-form">
            <input type="hidden" id="product-id">
            <div class="form-grid">
                <div class="input-group">
                    <label for="name">Nome do Produto</label>
                    <input type="text" id="name" required placeholder="Ex: Camiseta Básica">
                </div>
                <div class="input-group">
                    <label for="quantity">Quantidade</label>
                    <input type="number" id="quantity" min="0" required placeholder="0">
                </div>
                <div class="input-group">
                    <label for="price">Preço Unitário (R\$)</label>
                    <input type="number" id="price" step="0.01" min="0" required placeholder="0.00">
                </div>
            </div>
            <button type="submit" id="save-btn">Salvar Produto</button>
        </form>
    </div>

    <!-- Tabela de Produtos -->
    <div class="card">
        <h2 style="margin-bottom: 1rem; font-size: 1.25rem;">Lista de Produtos</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Qtd.</th>
                        <th>Preço Unitário</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="product-table-body">
                    <!-- Dinâmico via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>$0
