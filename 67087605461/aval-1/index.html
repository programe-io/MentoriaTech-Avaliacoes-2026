<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque - CRUD</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Controle de Estoque</h1>
            <p>Gerencie seus produtos de forma simples e rápida</p>
        </header>

        <!-- Estatísticas Rápidas -->
        <div class="stats">
            <div class="stat-card">
                <h3>Total de Produtos</h3>
                <p id="totalProdutos">0</p>
            </div>
            <div class="stat-card">
                <h3>Itens em Estoque</h3>
                <p id="totalItens">0</p>
            </div>
        </div>

        <!-- Formulário de Cadastro/Edição -->
        <div class="card">
            <form id="produtoForm">
                <input type="hidden" id="produtoId">
                
                <div class="input-group">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" required placeholder="Ex: Camiseta Básica">
                </div>

                <div class="input-group">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="0" required placeholder="0">
                </div>

                <div class="input-group">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" step="0.01" min="0" required placeholder="0.00">
                </div>

                <button type="submit" class="btn-primary" id="btnSalvar">Adicionar</button>
            </form>
        </div>

        <!-- Tabela de Produtos -->
        <div class="card">
            <h2>Lista de Produtos</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Quantidade</th>
                            <th>Preço Unitário</th>
                            <th>Valor Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaProdutos">
                        <!-- Os dados serão inseridos via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
