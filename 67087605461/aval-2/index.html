<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Gerenciador de Tarefas</h1>
        
        <form id="taskForm" class="task-form">
            <input type="text" id="taskInput" placeholder="Adicionar uma nova tarefa..." required autocomplete="off">
            <button type="submit">Adicionar</button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="pending">Pendentes</button>
            <button class="filter-btn" data-filter="completed">Concluídas</button>
        </div>

        <ul id="taskList"></ul>
        <div id="emptyState" class="empty-state" style="display: none;">Nenhuma tarefa encontrada.</div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>$0
