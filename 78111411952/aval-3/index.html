<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>LoveGram</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>♡ LoveGram</h1>
    <p>Compartilhe momentos e sentimentos!</p>
</header>

<main>
    <h2>Nova publicação 💌</h2>

    <input id="nome" placeholder="Seu nome">
    <textarea id="mensagem" placeholder="Escreva sua legenda..."></textarea>
    <button onclick="publicar()">Publicar</button>

    <h2>Feed de romance ♡</h2>

    <div id="feed">
        <article>
            <b>Mariana</b>
            <p>O amor está nos pequenos detalhes. 💙</p>
            <button onclick="curtir(this)">♡ Curtir</button>
        </article>

        <article>
            <b>Lucas</b>
            <p>Todo amor começa com uma boa história.</p>
            <button onclick="curtir(this)">♡ Curtir</button>
        </article>

        <article>
            <b>Isabella</b>
            <p>Flores, cartas e momentos inesquecíveis. 🌷</p>
            <button onclick="curtir(this)">♡ Curtir</button>
        </article>
    </div>
</main>

<footer>
    <p>LoveGram © 2026 ♡</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
