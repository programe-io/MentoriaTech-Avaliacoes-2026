<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaMini</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>InstaMini</h1>
    <input type="text" placeholder="Pesquisar">
</header>

<main>

    <section class="stories">
        <div>🔵<p>Seu story</p></div>
        <div>🌸<p>Ana</p></div>
        <div>🌻<p>Lucas</p></div>
        <div>🌷<p>Maria</p></div>
        <div>🌈<p>Pedro</p></div>
    </section>

    <section class="novo-post">
        <h3>Nova publicação</h3>
        <input id="nome" placeholder="Seu nome">
        <textarea id="mensagem" placeholder="Escreva uma legenda..."></textarea>
        <button onclick="publicar()">Compartilhar</button>
    </section>

    <section id="feed">

        <article class="post">
            <h3>ana.silva</h3>
            <img src="https://picsum.photos/id/1011/600/400">
            <button onclick="curtir(this)">♡ Curtir</button>
            <p><b>ana.silva</b> Aproveitando os momentos bons! 🌸</p>
        </article>

        <article class="post">
            <h3>lucas.m</h3>
            <img src="https://picsum.photos/id/1015/600/400">
            <button onclick="curtir(this)">♡ Curtir</button>
            <p><b>lucas.m</b> Que lugar incrível! 🌎</p>
        </article>

        <article class="post">
            <h3>maria.clara</h3>
            <img src="https://picsum.photos/id/1025/600/400">
            <button onclick="curtir(this)">♡ Curtir</button>
            <p><b>maria.clara</b> Um dia especial! 💗</p>
        </article>

    </section>

</main>

<footer>
    <p>⌂ Início　♡ Curtidas　＋ Publicar　♙ Perfil</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
