<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Produtos</title>
    <link rel="stylesheet" href="style.css">
   
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <header>
            <h1>Gerenciador de Produtos</h1>
            <p>Cadastre e controle seus produtos e estoques.</p>
        </header>

        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <label for="descricao">Descrição do produto</label>
                <input
                    type="text"
                    id="descricao"
                    minlength="5"
                    placeholder="Ex.: Teclado sem fio"
                    required
                >

                <label for="quantidade">Quantidade inicial</label>
                <input
                    type="number"
                    id="quantidade"
                    min="1"
                    step="1"
                    placeholder="Digite a quantidade"
                    required
                >

                <label for="valor">Valor unitário (R$)</label>
                <input
                    type="number"
                    id="valor"
                    min="0"
                    step="0.01"
                    placeholder="Ex.: 59.90"
                    required
                >

                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section class="card">
            <h2>Buscar produto</h2>

            <div class="linha">
                <div class="campo">
                    <label for="codigoBusca">Código do produto</label>
                    <input
                        type="number"
                        id="codigoBusca"
                        min="1"
                        step="1"
                        placeholder="Digite o código"
                    >
                </div>

                <button type="button" id="btnBuscar">Buscar</button>
                <button type="button" id="btnListar" class="secundario">
                    Listar todos
                </button>
            </div>
        </section>

        <section class="card">
            <h2>Atualizar produto</h2>

            <form id="formValor">
                <label for="codigoValor">Código do produto</label>
                <input
                    type="number"
                    id="codigoValor"
                    min="1"
                    step="1"
                    required
                >

                <label for="novoValor">Novo valor unitário (R$)</label>
                <input
                    type="number"
                    id="novoValor"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">Atualizar valor</button>
            </form>

            <hr>

            <form id="formQuantidade">
                <label for="codigoQuantidade">Código do produto</label>
                <input
                    type="number"
                    id="codigoQuantidade"
                    min="1"
                    step="1"
                    required
                >

                <label for="novaQuantidade">Quantidade a adicionar</label>
                <input
                    type="number"
                    id="novaQuantidade"
                    min="1"
                    step="1"
                    required
                >

                <button type="submit">Adicionar ao estoque</button>
            </form>
        </section>

        <div id="mensagem" role="status" aria-live="polite"></div>

        <section class="card">
            <h2>Produtos cadastrados</h2>
            <div id="listaProdutos"></div>
        </section>

        <footer>
            Projeto desenvolvido com HTML, CSS e JavaScript.
        </footer>
    </main>
     <script src="app.js" defer></script>
<script src="script.js"></script></body>
</html>
