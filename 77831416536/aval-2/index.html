<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header>
    <h1>🍔 Lanchonete Sabor da Maria</h1>
    <p>O melhor lanche da cidade!</p>
    </header>
    <main>
    <section class="card">
    <h2>Cardápio</h2>
    <div class="item"><span>X-Burger - R$ 18</span><button onclick="adicionar('X-Burger',18)">Adicionar</button></div>
    <div class="item"><span>X-Salada - R$ 22</span><button onclick="adicionar('X-Salada',22)">Adicionar</button></div>
    <div class="item"><span>Batata Frita - R$ 12</span><button onclick="adicionar('Batata Frita',12)">Adicionar</button></div>
    <div class="item"><span>Refrigerante - R$ 6</span><button onclick="adicionar('Refrigerante',6)">Adicionar</button></div>
    </section>
    <section class="card">
    <h2>🛒 Seu Pedido</h2>
    <ul id="lista"></ul>
    <h3>Total: R$ <span id="total">0</span>,00</h3>
    <input type="text" id="nomeCliente" placeholder="Seu nome">
    <button id="btnFinalizar">Finalizar Pedido</button>
    <p id="msgPedido"></p>
    </section>
    </main>
    <footer><p>Feito por Maria Humildes | Avaliação 2026</p></footer>
  <script src="script.js"></script>
  
</body>
</html>
