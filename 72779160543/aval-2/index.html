<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="container">
    <h1>Sistema de Cálculo de IMC</h1>

    <form id="form-imc">
      <div class="input-group">
        <label for="nome">Nome (opcional)</label>
        <input type="text" id="nome" placeholder="Ex: João">
      </div>

      <div class="row">
        <div class="input-group">
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" step="0.1" placeholder="Ex: 72.5" required>
        </div>

        <div class="input-group">
          <label for="altura">Altura (m ou cm)</label>
          <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75" required>
        </div>
      </div>

      <div class="botoes">
        <button type="submit" class="btn-calcular">Calcular IMC</button>
        <button type="button" class="btn-limpar" id="btn-limpar">Limpar</button>
      </div>
    </form>

    <section id="resultado" class="resultado"></section>

    <section class="tabela-section">
      <h3>Tabela de Classificação (OMS)</h3>
      <table>
        <thead>
          <tr>
            <th>IMC</th>
            <th>Classificação</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Menor que 18,5</td><td>Abaixo do peso</td></tr>
          <tr><td>18,5 a 24,9</td><td>Peso normal</td></tr>
          <tr><td>25,0 a 29,9</td><td>Sobrepeso</td></tr>
          <tr><td>30,0 a 34,9</td><td>Obesidade Grau I</td></tr>
          <tr><td>35,0 a 39,9</td><td>Obesidade Grau II</td></tr>
          <tr><td>40,0 ou mais</td><td>Obesidade Grau III</td></tr>
        </tbody>
      </table>
    </section>

    <section class="historico-section">
      <div class="historico-header">
        <h3>Histórico de Cálculos</h3>
        <button type="button" id="btn-limpar-historico" class="btn-mini">Apagar histórico</button>
      </div>
      <ul id="lista-historico"></ul>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
