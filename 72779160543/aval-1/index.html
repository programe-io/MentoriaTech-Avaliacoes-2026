<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">
    <h1>Calculadora de IMC</h1>

    <form id="form-imc">
      <div class="input-group">
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" step="0.1" placeholder="Ex: 70.5" required>
      </div>

      <div class="input-group">
        <label for="altura">Altura (m ou cm)</label>
        <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75 ou 175" required>
      </div>

      <div class="botoes">
        <button type="submit" class="btn-calcular">Calcular</button>
        <button type="button" class="btn-limpar" id="btn-limpar">Limpar</button>
      </div>
    </form>

    <div id="resultado"></div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
