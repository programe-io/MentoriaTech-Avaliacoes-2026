<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <h1>Cadastro de Alunos</h1>
        <p>Gerencie os alunos cadastrados.</p>

        <form id="alunoForm">
            <label for="nome">Nome do aluno</label>
            <input type="text" id="nome" placeholder="Digite o nome" required>

            <label for="turma">Turma</label>
            <input type="text" id="turma" placeholder="Ex: 2º Ano A" required>

            <label for="nota">Nota</label>
            <input type="number" id="nota" min="0" max="10" step="any" placeholder="Ex: 8.5" required>

            <button type="submit">Cadastrar aluno</button>
        </form>

        <section class="lista">
            <h2>Alunos cadastrados</h2>
            <div id="alunosLista"></div>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
