
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoVida - Projeto Sustentável</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header class="cabecalho">
        <h1>🌱 EcoVida</h1>
        <p>Juntos podemos construir um planeta melhor!</p>
    </header>

    <main>

        <section class="painel-resumo">
            <h2>Ações sustentáveis registradas</h2>
            <span id="totalAcoes">0</span>
        </section>

        <section class="cadastro">
            <h2>Adicionar nova ação</h2>

            <form id="acaoForm">

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome da ação"
                    required
                >

                <select id="categoria" required>
                    <option value="">Escolha uma categoria</option>
                    <option value="Reciclagem">Reciclagem</option>
                    <option value="Economia de água">Economia de água</option>
                    <option value="Economia de energia">Economia de energia</option>
                    <option value="Plantio">Plantio</option>
                    <option value="Outros">Outros</option>
                </select>

                <input
                    type="number"
                    id="quantidade"
                    placeholder="Quantidade de ações"
                    min="1"
                    step="1"
                    required
                >

                <button type="submit">Cadastrar ação</button>

            </form>
        </section>

        <section class="lista-acoes">
            <h2>Minhas ações sustentáveis</h2>
            <div id="listaAcoes">
                <p>Nenhuma ação cadastrada ainda.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>EcoVida © 2026 - Cuidar do meio ambiente é responsabilidade de todos!</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
