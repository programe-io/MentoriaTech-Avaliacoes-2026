
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <header>
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas atividades diárias!</p>
        </header>

        <section class="resumo">
            <div class="card">
                <h3>Total</h3>
                <span id="total">0</span>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <span id="pendentes">0</span>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <span id="concluidas">0</span>
            </div>
        </section>

        <section class="formulario">
            <h2>Adicionar tarefa</h2>

            <form id="formTarefa">

                <input
                    type="text"
                    id="nomeTarefa"
                    placeholder="Digite sua tarefa..."
                    required
                >

                <select id="prioridade">
                    <option value="Baixa">Baixa</option>
                    <option value="Média" selected>Média</option>
                    <option value="Alta">Alta</option>
                </select>

                <input type="date" id="dataTarefa">

                <button type="submit" id="btnAdicionar">
                    Adicionar
                </button>

            </form>
        </section>

        <section class="lista">
            <h2>Minhas tarefas</h2>

            <div class="filtros">
                <button type="button" data-filtro="todas" class="ativo">
                    Todas
                </button>

                <button type="button" data-filtro="pendentes">
                    Pendentes
                </button>

                <button type="button" data-filtro="concluidas">
                    Concluídas
                </button>
            </div>

            <ul id="listaTarefas"></ul>
        </section>

    </div>

<script src="script.js"></script></body>
</html>
