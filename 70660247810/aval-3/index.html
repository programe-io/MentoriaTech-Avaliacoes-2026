
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese - Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">

        <header>
            <h1>Ficha de Anamnese</h1>
            <p>Cadastro e controle de IMC dos pacientes</p>
        </header>

        <section class="formulario">
            <h2>Cadastrar paciente</h2>

            <form id="form-pessoa">

                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome">

                <label for="idade">Idade</label>
                <input type="number" id="idade" placeholder="Ex: 30">

                <label for="altura">Altura (metros)</label>
                <input type="number" id="altura" step="0.01" placeholder="Ex: 1.70">

                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" step="0.1" placeholder="Ex: 65">

                <p id="erro" hidden></p>

                <button type="submit">Salvar paciente</button>

            </form>
        </section>

        <section class="tabela">
            <h2>Pacientes cadastrados</h2>

            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ação</th>
                        </tr>
                    </thead>

                    <tbody id="lista-pessoas"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
