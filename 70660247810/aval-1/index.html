<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff; /* Texto geral em branco */
            margin: 0;
            padding: 0;
        }

        .header-sistema {
            background-color: #1e1e1e;
            border-bottom: 3px solid #00adb5;
            text-align: center;
            padding: 20px;
        }

        .header-sistema h1 {
            margin: 0;
            color: #00adb5;
            font-size: 1.6rem;
        }

        .header-sistema p {
            color: #aaaaaa;
            margin: 5px 0 0 0;
            font-size: 0.9rem;
        }

        .container {
            max-width: 750px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #2b2b2b;
            border-top: 4px solid #00adb5;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        h2 {
            color: #00adb5;
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 1px solid #2b2b2b;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Estilo dos campos onde você digita */
        input {
            width: 100%;
            padding: 12px;
            background-color: #2c2c2c; /* Fundo mais claro que o painel */
            border: 2px solid #555555; /* Borda bem visível */
            color: #ffffff !important; /* COR DA LETRA QUE VOCÊ ESCREVE: Branco Puro! */
            font-size: 1.1rem;
            border-radius: 5px;
            box-sizing: border-box;
        }

        /* Cor do texto de exemplo (placeholder) para não sumir */
        input::placeholder {
            color: #888888;
        }

        input:focus {
            outline: none;
            border-color: #00adb5;
            background-color: #333333;
            box-shadow: 0 0 8px rgba(0, 173, 181, 0.6);
        }

        .btn {
            background-color: #00adb5;
            color: #121212;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #00818a;
            color: #ffffff;
        }

        .erro {
            color: #ff6b6b;
            margin-top: 10px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .produto-item {
            background-color: #252525;
            border-left: 5px solid #00adb5;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            color: #ffffff;
        }

        .lista-vazia {
            color: #888888;
            font-style: italic;
            text-align: center;
            padding: 15px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="header-sistema">
        <h1>📦 Sistema de Controle de Estoque</h1>
        <p>Gerenciamento de Produtos e Mercadorias</p>
    </header>

    <div class="container">
        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="formCadastro">
                <div class="form-group">
                    <label for="descricao">Descrição do Produto:</label>
                    <input type="text" id="descricao" placeholder="Ex: Notebook Ultrafino (mín. 5 caracteres)" required>
                </div>
                <div class="form-group">
                    <label for="quantidade">Quantidade em Estoque:</label>
                    <input type="number" id="quantidade" placeholder="Ex: 10" min="1" required>
                </div>
                <div class="form-group">
                    <label for="valor">Valor Unitário (R$):</label>
                    <input type="number" id="valor" placeholder="Ex: 2500.00" step="0.01" min="0" required>
                </div>
                <button type="submit" class="btn">Cadastrar Produto</button>
            </form>
            <div id="mensagemErro" class="erro"></div>
        </div>

        <!-- Lista de Produtos -->
        <div class="card">
            <h2>📦 Produtos Cadastrados</h2>
            <div id="listaProdutos" class="lista-vazia">Nenhum produto cadastrado no momento.</div>
        </div>
    </div>

    <!-- Script JavaScript integrando a lógica de CRUD e Validação -->
    <script>
        let produtos = [];

        function validarProduto(descricao, quantidade, valor) {
            if (descricao.length < 5) {
                throw new Error("A descrição deve ter, no mínimo, cinco caracteres.");
            }
            if (quantidade < 1) {
                throw new Error("A quantidade em estoque deve ser maior que zero.");
            }
            if (valor < 0) {
                throw new Error("O valor deve ser maior ou igual a zero.");
            }
        }

        function renderizarTabela() {
            const divLista = document.getElementById("listaProdutos");
            
            if (produtos.length === 0) {
                divLista.innerHTML = "Nenhum produto cadastrado no momento.";
                divLista.className = "lista-vazia";
                return;
            }

            divLista.className = "";
            let htmlConteudo = "";

            produtos.forEach((prod) => {
                htmlConteudo += `
                    <div class="produto-item">
                        <strong>Código:</strong> #${prod.codigo} | 
                        <strong>Produto:</strong> ${prod.descricao} | 
                        <strong>Qtd:</strong> ${prod.quantidade} un. | 
                        <strong>Valor:</strong> R$ ${prod.valor.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </div>
                `;
            });

            divLista.innerHTML = htmlConteudo;
        }

        document.getElementById("formCadastro").addEventListener("submit", function(event) {
            event.preventDefault();

            const descricaoInput = document.getElementById("descricao").value;
            const quantidadeInput = Number(document.getElementById("quantidade").value);
            const valorInput = Number(document.getElementById("valor").value);
            const divErro = document.getElementById("mensagemErro");

            divErro.innerHTML = "";

            try {
                validarProduto(descricaoInput, quantidadeInput, valorInput);

                let novoProduto = {
                    codigo: produtos.length + 1,
                    descricao: descricaoInput,
                    quantidade: quantidadeInput,
                    valor: valorInput
                };

                produtos.push(novoProduto);
                renderizarTabela();
                document.getElementById("formCadastro").reset();

            } catch (erro) {
                divErro.innerHTML = erro.message;
            }
        });

        produtos.push({
            codigo: 1,
            descricao: "Notebook Ultrafino Core i5",
            quantidade: 4,
            valor: 3499.90
        });

        renderizarTabela();
    </script>
<script src="script.js"></script></body>
</html>
