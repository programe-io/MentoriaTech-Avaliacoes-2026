
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="sidebar">
    <h2>📦 EstoquePro</h2>
    <a href="#dashboard">Dashboard</a>
    <a href="#produtos">Produtos</a>
    <a href="#cadastro">Cadastrar produto</a>
</div>

<main class="main">

    <header>
        <div>
            <h1>Controle de Estoque</h1>
            <p>Gerencie seus produtos facilmente.</p>
        </div>
        <button onclick="abrirCadastro()">+ Novo produto</button>
    </header>

    <section class="cards" id="dashboard">
        <div class="card">
            <p>Total de produtos</p>
            <h2 id="totalProdutos">0</h2>
        </div>

        <div class="card">
            <p>Unidades em estoque</p>
            <h2 id="totalUnidades">0</h2>
        </div>

        <div class="card">
            <p>Estoque baixo</p>
            <h2 id="estoqueBaixo">0</h2>
        </div>

        <div class="card">
            <p>Valor em estoque</p>
            <h2 id="valorEstoque">R$ 0,00</h2>
        </div>
    </section>

    <section class="painel" id="produtos">
        <div class="titulo">
            <h2>Lista de produtos</h2>
            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar produto..."
                oninput="listarProdutos()">
        </div>

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaProdutos"></tbody>
            </table>
        </div>
    </section>

    <section class="painel formulario" id="cadastro">
        <h2 id="tituloFormulario">Cadastrar produto</h2>

        <form id="formProduto">
            <input type="hidden" id="produtoId">

            <label>Nome do produto</label>
            <input type="text" id="nome" required>

            <label>Código</label>
            <input type="text" id="codigo" required>

            <label>Categoria</label>
            <input type="text" id="categoria" required>

            <label>Preço (R$)</label>
            <input type="number" id="preco" min="0" step="0.01" required>

            <label>Quantidade</label>
            <input type="number" id="quantidade" min="0" required>

            <label>Estoque mínimo</label>
            <input type="number" id="minimo" min="0" value="5" required>

            <div class="botoes">
                <button type="submit">Salvar produto</button>
                <button type="button" class="cancelar"
                    onclick="limparFormulario()">Limpar</button>
            </div>
        </form>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
