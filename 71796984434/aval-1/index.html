
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Sistema de Estoque</h1>
        <p>Cadastre e gerencie seus produtos.</p>

        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" placeholder="Nome do produto">

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" placeholder="Quantidade">

            <label for="valor">Valor:</label>
            <input type="number" id="valor" placeholder="Valor do produto" step="0.01">

            <button type="button">Cadastrar Produto</button>
        </section>

        <section class="formulario">
            <h2>Alterar Produto</h2>

            <label for="codigo">Código do produto:</label>
            <input type="number" id="codigo" placeholder="Código">

            <label for="novoValor">Novo valor:</label>
            <input type="number" id="novoValor" placeholder="Novo valor" step="0.01">

            <button type="button">Alterar Valor</button>

            <label for="novaQuantidade">Quantidade a adicionar:</label>
            <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

            <button type="button">Alterar Quantidade</button>
        </section>

        <section class="produtos">
            <h2>Produtos Cadastrados</h2>
            <button type="button">Listar Produtos</button>

            <div id="listaProdutos">
                <p>Os produtos aparecerão aqui.</p>
            </div>
        </section>
    </div>

<script src="script.js"></script></body>
</html>
