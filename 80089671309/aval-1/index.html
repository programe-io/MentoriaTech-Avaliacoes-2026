<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniGram - Feed Social</title>
    <!-- Tailwind CSS CDN para estilização base -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        insta: {
                            pink: '#E1306C',
                            purple: '#833AB4',
                            orange: '#F56040',
                            yellow: '#FCAF45'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body class="bg-gray-50 dark:bg-zinc-950 text-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen">

    <!-- CABEÇALHO / HEADER -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-md border-b border-gray-200 dark:border-zinc-800 transition-colors">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center gap-2 cursor-pointer">
                <i class="fa-brands fa-instagram text-3xl text-gradient"></i>
                <h1 class="font-bold text-2xl tracking-wider text-gradient hidden sm:block">MiniGram</h1>
            </div>

            <!-- Barra de Busca -->
            <div class="relative w-48 sm:w-64">
                <input type="text" id="searchInput" placeholder="Pesquisar perfis..." 
                    class="w-full bg-gray-100 dark:bg-zinc-800 text-sm px-9 py-2 rounded-lg border border-transparent focus:border-gray-300 dark:focus:border-zinc-700 focus:outline-none transition-all">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-sm"></i>
            </div>

            <!-- Botões de Ação -->
            <div class="flex items-center gap-4 text-xl">
                <button id="openCreateModalBtn" class="hover:text-insta-pink transition-colors p-1" title="Criar Publicação">
                    <i class="fa-regular fa-square-plus"></i>
                </button>
                <button id="themeToggleBtn" class="hover:text-amber-500 transition-colors p-1" title="Alternar Tema">
                    <i class="fa-regular fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
                </button>
                <div class="w-8 h-8 rounded-full overflow-hidden border-2 border-insta-pink">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=150" alt="Meu Perfil" class="w-full h-full object-cover">
                </div>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-2xl mx-auto px-4 py-6 space-y-6">

        <!-- CARROSSEL DE STORIES -->
        <section class="bg-white dark:bg-zinc-900 p-4 rounded-xl border border-gray-200 dark:border-zinc-800 shadow-sm overflow-x-auto no-scrollbar transition-colors">
            <div class="flex items-center gap-4" id="storiesContainer">
                <!-- Preenchido via JS -->
            </div>
        </section>

        <!-- FEED DE PUBLICAÇÕES -->
        <section id="feedContainer" class="space-y-6">
            <!-- Cards de Posts renderizados via JS -->
        </section>
    </main>

    <!-- MODAL DE CRIAR POST -->
    <div id="createModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-zinc-900 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl border border-gray-200 dark:border-zinc-800 animate-scaleUp">
            <div class="flex justify-between items-center p-4 border-b border-gray-200 dark:border-zinc-800">
                <h3 class="font-bold text-lg">Nova Publicação</h3>
                <button id="closeCreateModalBtn" class="text-gray-500 hover:text-gray-800 dark:hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <form id="createPostForm" class="p-4 space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">URL da Imagem</label>
                    <input type="url" id="imageUrlInput" required placeholder="https://exemplo.com/imagem.jpg" 
                        class="w-full bg-gray-50 dark:bg-zinc-800 border border-gray-300 dark:border-zinc-700 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-insta-pink">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Localização</label>
                    <input type="text" id="locationInput" placeholder="Ex: São Paulo, Brasil" 
                        class="w-full bg-gray-50 dark:bg-zinc-800 border border-gray-300 dark:border-zinc-700 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-insta-pink">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Legenda</label>
                    <textarea id="captionInput" rows="3" placeholder="Escreva uma legenda..." 
                        class="w-full bg-gray-50 dark:bg-zinc-800 border border-gray-300 dark:border-zinc-700 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-insta-pink resize-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-insta-purple via-insta-pink to-insta-orange text-white font-semibold py-2.5 rounded-lg shadow-lg hover:opacity-95 transition-opacity">
                    Compartilhar
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL DE VISUALIZAR STORY -->
    <div id="storyModal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col items-center justify-center">
        <button id="closeStoryModalBtn" class="absolute top-4 right-4 text-white text-2xl z-10">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="relative w-full max-w-sm h-[80vh] bg-zinc-900 rounded-2xl overflow-hidden shadow-2xl flex flex-col justify-between">
            <!-- Barra de Progresso -->
            <div class="absolute top-0 left-0 right-0 p-2 z-10 flex items-center gap-2">
                <div class="w-full bg-gray-600/50 h-1 rounded-full overflow-hidden">
                    <div id="storyProgressBar" class="bg-white h-full w-0 transition-all duration-[5000ms] ease-linear"></div>
                </div>
            </div>
            <!-- Header do Story -->
            <div class="absolute top-4 left-0 right-0 p-4 z-10 flex items-center gap-3">
                <img id="storyUserAvatar" class="w-8 h-8 rounded-full border border-white object-cover" src="" alt="">
                <span id="storyUsername" class="text-white text-sm font-semibold shadow-text"></span>
            </div>
            <!-- Imagem do Story -->
            <img id="storyImage" class="w-full h-full object-cover" src="" alt="Story">
        </div>
    </div>

    <!-- Arquivo JavaScript externo -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
