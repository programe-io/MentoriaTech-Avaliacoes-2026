
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Minhas Tarefas</title>

    <link rel="stylesheet" href="estilo.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="painel">

        <header class="cabecalho">
            <div>
                <h1>TaskFlow</h1>
                <p>Organize suas atividades e acompanhe seu progresso.</p>
            </div>

            <span class="icone">✓</span>
        </header>

        <section class="resumo">

            <article class="cartao">
                <span>Total de tarefas</span>
                <strong id="quantidadeTotal">0</strong>
            </article>

            <article class="cartao">
                <span>Em andamento</span>
                <strong id="quantidadePendentes">0</strong>
            </article>

            <article class="cartao">
                <span>Finalizadas</span>
                <strong id="quantidadeConcluidas">0</strong>
            </article>

        </section>

        <section class="progresso">
            <div class="progresso-texto">
                <strong>Seu progresso</strong>
                <span id="porcentagem">0%</span>
            </div>

            <div class="barra">
                <div id="barraPreenchida"></div>
            </div>
        </section>

        <section class="cadastro">

            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <input
                    type="text"
                    id="nomeTarefa"
                    placeholder="O que você precisa fazer?"
                    required
                >

                <select id="nivelPrioridade">
                    <option value="baixa">Prioridade baixa</option>
                    <option value="media">Prioridade média</option>
                    <option value="alta">Prioridade alta</option>
                </select>

                <select id="categoria">
                    <option value="Pessoal">Pessoal</option>
                    <option value="Estudos">Estudos</option>
                    <option value="Trabalho">Trabalho</option>
                    <option value="Outros">Outros</option>
                </select>

                <button type="submit" id="botaoSalvar">
                    + Adicionar tarefa
                </button>

                <button type="button" id="cancelarEdicao" hidden>
                    Cancelar edição
                </button>

            </form>

        </section>

        <section class="lista">

            <div class="titulo-lista">
                <h2>Minhas tarefas</h2>
                <span id="totalExibido">0 tarefas</span>
            </div>

            <div class="ferramentas">

                <input
                    type="search"
                    id="campoPesquisa"
                    placeholder="Pesquisar..."
                >

                <select id="situacao">
                    <option value="todas">Todas as situações</option>
                    <option value="pendente">Em andamento</option>
                    <option value="concluida">Finalizadas</option>
                </select>

                <select id="ordem">
                    <option value="recentes">Mais recentes</option>
                    <option value="antigas">Mais antigas</option>
                    <option value="prioridade">Maior prioridade</option>
                    <option value="alfabetica">Ordem alfabética</option>
                </select>

            </div>

            <div id="tarefasContainer"></div>

        </section>

        <footer>
            <p>TaskFlow © 2026 - Gerenciador de Tarefas</p>
        </footer>

    </main>

    <script src="app.js"></script>

<script src="script.js"></script></body>
</html>
