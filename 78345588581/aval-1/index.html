<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏁 Corrida Maluca</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(#69c5ff, #dff7ff);
    min-height: 100vh;
    overflow: hidden;
}

/* TELA INICIAL */
#menu {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff512f, #dd2476);
    color: white;
    z-index: 20;
    text-align: center;
}

#menu h1 {
    font-size: clamp(45px, 8vw, 90px);
    text-shadow: 5px 5px #222;
    animation: pula 1s infinite alternate;
}

#menu p {
    font-size: 22px;
    margin: 20px;
}

button {
    border: none;
    padding: 16px 35px;
    border-radius: 15px;
    background: #ffd400;
    color: #222;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 0 #a77e00;
}

button:hover {
    transform: translateY(2px);
    box-shadow: 0 4px 0 #a77e00;
}

@keyframes pula {
    from { transform: rotate(-2deg); }
    to { transform: rotate(2deg) scale(1.04); }
}

/* JOGO */
#game {
    display: none;
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

/* CÉU */
.sky {
    position: absolute;
    inset: 0 0 50% 0;
    background: linear-gradient(#49b9ff, #bdeaff);
}

/* NUVENS */
.cloud {
    position: absolute;
    width: 100px;
    height: 35px;
    background: white;
    border-radius: 50px;
    opacity: .8;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 45px;
    height: 45px;
    left: 15px;
    top: -22px;
}

.cloud::after {
    width: 55px;
    height: 55px;
    right: 12px;
    top: -28px;
}

.c1 { top: 12%; left: 10%; }
.c2 { top: 22%; left: 65%; transform: scale(.7); }
.c3 { top: 8%; left: 40%; transform: scale(.5); }

/* PISTA */
#road {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(650px, 85vw);
    height: 75vh;
    background: #444;
    border-left: 12px solid #fff;
    border-right: 12px solid #fff;
    overflow: hidden;
}

/* LINHAS DA PISTA */
.line {
    position: absolute;
    width: 12px;
    height: 80px;
    background: white;
    left: 50%;
    transform: translateX(-50%);
}

.line:nth-child(1) { top: -100px; }
.line:nth-child(2) { top: 50px; }
.line:nth-child(3) { top: 200px; }
.line:nth-child(4) { top: 350px; }
.line:nth-child(5) { top: 500px; }
.line:nth-child(6) { top: 650px; }

/* HUD */
#hud {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 10;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.info {
    background: rgba(0,0,0,.75);
    color: white;
    padding: 10px 15px;
    border-radius: 12px;
    font-weight: bold;
}

/* CARROS */
.car {
    position: absolute;
    width: 60px;
    height: 100px;
    border-radius: 15px 15px 10px 10px;
    border: 4px solid #111;
    z-index: 5;
}

.car::before {
    content: "";
    position: absolute;
    width: 38px;
    height: 35px;
    left: 7px;
    top: 12px;
    background: #9eeaff;
    border: 3px solid #111;
    border-radius: 8px;
}

.car::after {
    content: "🏎️";
    position: absolute;
    left: 5px;
    top: 42px;
    font-size: 34px;
}

/* JOGADOR */
#player {
    background: #e91e1e;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
}

/* ADVERSÁRIOS */
.enemy {
    background: #1976d2;
}

/* OBSTÁCULOS */
.obstacle {
    position: absolute;
    width: 55px;
    height: 55px;
    font-size: 45px;
    z-index: 4;
}

/* CONTROLES */
#controls {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    display: flex;
    gap: 20px;
}

.control {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: rgba(0,0,0,.65);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    user-select: none;
}

/* GAME OVER */
#gameOver {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: rgba(0,0,0,.85);
    color: white;
    z-index: 30;
    text-align: center;
}

#gameOver h2 {
    font-size: 60px;
    color: #ff3333;
    text-shadow: 4px 4px #000;
}

#gameOver p {
    font-size: 25px;
    margin: 20px;
}

/* TURBO */
#turboBar {
    width: 150px;
    height: 15px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
}

#turbo {
    height: 100%;
    width: 100%;
    background: #00eaff;
}

/* RESPONSIVO */
@media (max-width: 600px) {
    #road {
        width: 90vw;
    }

    .car {
        width: 52px;
        height: 90px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

<!-- MENU -->
<div id="menu">
    <h1>🏁 CORRIDA MALUCA 🏎️</h1>
    <p>Desvie dos obstáculos, ultrapasse os adversários e seja o campeão!</p>
    <p>⬅️ ➡️ Use as setas ou os botões na tela</p>
    <button onclick="startGame()">COMEÇAR A CORRIDA!</button>
</div>

<!-- JOGO -->
<div id="game">

    <div class="sky"></div>

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div id="hud">
        <div class="info">🏆 Pontos: <span id="score">0</span></div>
        <div class="info">⚡ Velocidade: <span id="speed">1</span></div>
        <div class="info">
            🚀 Turbo
            <div id="turboBar">
                <div id="turbo"></div>
            </div>
        </div>
    </div>

    <div id="road">

        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>

        <div id="player" class="car"></div>

    </div>

    <div id="controls">
        <div class="control" id="left">⬅️</div>
        <div class="control" id="turboButton">🚀</div>
        <div class="control" id="right">➡️</div>
    </div>
</div>

<!-- GAME OVER -->
<div id="gameOver">
    <h2>💥 BATEU!</h2>
    <p>Sua pontuação: <strong id="finalScore">0</strong></p>
    <button onclick="restartGame()">CORRER NOVAMENTE</button>
</div>

<script>
const game = document.getElementById("game");
const menu = document.getElementById("menu");
const road = document.getElementById("road");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const speedText = document.getElementById("speed");
const turboBar = document.getElementById("turbo");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

let playerX = 0;
let score = 0;
let speed = 5;
let turbo = 100;
let running = false;
let turboActive = false;

let enemies = [];
let obstacles = [];

const keys = {
    left: false,
    right: false
};

/* COMEÇAR */
function startGame() {
    menu.style.display = "none";
    game.style.display = "block";

    resetGame();
    running = true;

    requestAnimationFrame(gameLoop);
}

/* RESET */
function resetGame() {

    score = 0;
    speed = 5;
    turbo = 100;

    scoreText.textContent = score;
    speedText.textContent = speed;

    enemies.forEach(e => e.remove());
    obstacles.forEach(o => o.remove());

    enemies = [];
    obstacles = [];

    playerX = road.clientWidth / 2 - player.offsetWidth / 2;

    player.style.left = playerX + "px";

    for (let i = 0; i < 3; i++) {
        createEnemy(i);
    }

    for (let i = 0; i < 4; i++) {
        createObstacle(i);
    }
}

/* INIMIGO */
function createEnemy(index) {

    const enemy = document.createElement("div");

    enemy.className = "car enemy";

    enemy.style.left =
        Math.random() * (road.clientWidth - 70) + 5 + "px";

    enemy.style.top =
        -150 - index * 250 + "px";

    road.appendChild(enemy);

    enemies.push(enemy);
}

/* OBSTÁCULO */
function createObstacle(index) {

    const obstacle = document.createElement("div");

    obstacle.className = "obstacle";

    const objects = ["🪨", "🛢️", "🚧", "💣"];

    obstacle.textContent =
        objects[Math.floor(Math.random() * objects.length)];

    obstacle.style.left =
        Math.random() * (road.clientWidth - 70) + 5 + "px";

    obstacle.style.top =
        -100 - index * 200 + "px";

    road.appendChild(obstacle);

    obstacles.push(obstacle);
}

/* MOVIMENTO */
function movePlayer() {

    const moveSpeed = turboActive ? 9 : 6;

    if (keys.left) {
        playerX -= moveSpeed;
    }

    if (keys.right) {
        playerX += moveSpeed;
    }

    const maxX =
        road.clientWidth - player.offsetWidth - 5;

    if (playerX < 5) playerX = 5;
    if (playerX > maxX) playerX = maxX;

    player.style.left = playerX + "px";
}

/* COLISÃO */
function collision(a, b) {

    const r1 = a.getBoundingClientRect();
    const r2 = b.getBoundingClientRect();

    return !(
        r1.bottom < r2.top ||
        r1.top > r2.bottom ||
        r1.right < r2.left ||
        r1.left > r2.right
    );
}

/* LOOP PRINCIPAL */
function gameLoop() {

    if (!running) return;

    movePlayer();

    moveEnemies();

    moveObstacles();

    updateTurbo();

    score++;

    scoreText.textContent = Math.floor(score / 10);

    if (score % 1000 === 0) {
        speed++;
        speedText.textContent = speed;
    }

    requestAnimationFrame(gameLoop);
}

/* INIMIGOS */
function moveEnemies() {

    enemies.forEach(enemy => {

        let y = parseFloat(enemy.style.top);

        y += turboActive ? speed * 1.7 : speed;

        if (y > road.clientHeight + 100) {

            y = -150 - Math.random() * 300;

            enemy.style.left =
                Math.random() *
                (road.clientWidth - 70) + 5 + "px";
        }

        enemy.style.top = y + "px";

        if (collision(player, enemy)) {
            endGame();
        }
    });
}

/* OBSTÁCULOS */
function moveObstacles() {

    obstacles.forEach(obstacle => {

        let y = parseFloat(obstacle.style.top);

        y += turboActive ? speed * 1.7 : speed;

        if (y > road.clientHeight + 100) {

            y = -100 - Math.random() * 300;

            obstacle.style.left =
                Math.random() *
                (road.clientWidth - 70) + 5 + "px";
        }

        obstacle.style.top = y + "px";

        if (collision(player, obstacle)) {
            endGame();
        }
    });
}

/* TURBO */
function updateTurbo() {

    if (turboActive) {

        turbo -= 0.8;

        if (turbo <= 0) {
            turbo = 0;
            turboActive = false;
        }

    } else {

        turbo += 0.15;

        if (turbo > 100) turbo = 100;
    }

    turboBar.style.width = turbo + "%";
}

/* ATIVAR TURBO */
function activateTurbo() {

    if (turbo > 20 && running) {
        turboActive = true;
    }
}

/* GAME OVER */
function endGame() {

    running = false;

    finalScore.textContent =
        Math.floor(score / 10);

    gameOver.style.display = "flex";
}

/* REINICIAR */
function restartGame() {

    gameOver.style.display = "none";

    resetGame();

    running = true;

    requestAnimationFrame(gameLoop);
}

/* TECLADO */
document.addEventListener("keydown", event => {

    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
        keys.left = true;
    }

    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
        keys.right = true;
    }

    if (event.code === "Space") {
        activateTurbo();
    }
});

document.addEventListener("keyup", event => {

    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
        keys.left = false;
    }

    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
        keys.right = false;
    }
});

/* BOTÕES TOUCH */
function pressButton(button, direction) {

    button.addEventListener("pointerdown", () => {
        keys[direction] = true;
    });

    button.addEventListener("pointerup", () => {
        keys[direction] = false;
    });

    button.addEventListener("pointerleave", () => {
        keys[direction] = false;
    });
}

pressButton(
    document.getElementById("left"),
    "left"
);

pressButton(
    document.getElementById("right"),
    "right"
);

document
    .getElementById("turboButton")
    .addEventListener("pointerdown", activateTurbo);

</script>

<script src="script.js"></script></body>
</html>
