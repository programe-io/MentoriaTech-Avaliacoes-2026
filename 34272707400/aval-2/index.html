
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <h1>GERENCIADOR DE TAREFAS</h1>

    <h2>Cadastrar Nova Tarefa</h2>

    <form id="formTarefa">

        <label>Nome da tarefa:</label>
        <input type="text" id="nome" placeholder="Digite a tarefa" required>
        <br><br>

        <label>Descrição:</label>
        <textarea id="descricao" placeholder="Descreva a tarefa"></textarea>
        <br><br>

        <label>Data:</label>
        <input type="date" id="data" required>
        <br><br>

        <label>Prioridade:</label>
        <select id="prioridade">
            <option value="Baixa">Baixa</option>
            <option value="Média">Média</option>
            <option value="Alta">Alta</option>
        </select>
        <br><br>

        <button type="submit">Cadastrar Tarefa</button>

    </form>

    <hr>

    <h2>Pesquisar Tarefa</h2>

    <input type="text" id="pesquisa" placeholder="Pesquisar tarefa">

    <button onclick="pesquisarTarefas()">Pesquisar</button>
    <button onclick="listarTarefas()">Mostrar Todas</button>

    <hr>

    <h2>Filtrar Tarefas</h2>

    <button onclick="filtrarTarefas('Todas')">Todas</button>
    <button onclick="filtrarTarefas('Pendente')">Pendentes</button>
    <button onclick="filtrarTarefas('Concluída')">Concluídas</button>

    <hr>

    <h2>Lista de Tarefas</h2>

    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Tarefa</th>
                <th>Descrição</th>
                <th>Data</th>
                <th>Prioridade</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="listaTarefas"></tbody>

    </table>

    <hr>

    <h2>Relatório</h2>

    <p id="totalTarefas">Total de tarefas: 0</p>
    <p id="pendentes">Tarefas pendentes: 0</p>
    <p id="concluidas">Tarefas concluídas: 0</p>

    <script src="tarefas.js"></script>

<script src="script.js"></script></body>
</html>
