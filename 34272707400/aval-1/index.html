
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
<link href="style.css" rel="stylesheet"></head>

<body>

    <h1>SISTEMA DE CONTROLE DE ESTOQUE</h1>

    <h2>Cadastro de Produtos</h2>

    <form id="formProduto">

        <label>Nome do produto:</label>
        <input type="text" id="nome" required>
        <br><br>

        <label>Preço:</label>
        <input type="number" id="preco" step="0.01" min="0.01" required>
        <br><br>

        <label>Quantidade:</label>
        <input type="number" id="quantidade" min="0" step="1" required>
        <br><br>

        <button type="submit">Cadastrar Produto</button>

    </form>

    <hr>

    <h2>Pesquisar Produto</h2>

    <input type="text" id="pesquisa"
        placeholder="Digite o nome do produto">

    <button onclick="pesquisarProduto()">Pesquisar</button>
    <button onclick="listarProdutos()">Mostrar Todos</button>

    <hr>

    <h2>Produtos Cadastrados</h2>

    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th>Total</th>
                <th>Situação</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="listaProdutos"></tbody>

    </table>

    <hr>

    <h2>Movimentação de Estoque</h2>

    <label>ID do produto:</label>
    <input type="number" id="idMovimento">
    <br><br>

    <label>Quantidade:</label>
    <input type="number" id="quantidadeMovimento" min="1">
    <br><br>

    <button onclick="adicionarEstoque()">Adicionar Estoque</button>
    <button onclick="retirarEstoque()">Retirar Estoque</button>

    <hr>

    <h2>Relatório do Estoque</h2>

    <p id="totalProdutos">Quantidade de produtos: 0</p>
    <p id="valorEstoque">Valor total: R$ 0,00</p>
    <p id="estoqueBaixo">Produtos com estoque baixo: 0</p>

    <button onclick="relatorio()">Atualizar Relatório</button>

    <hr>

    <button onclick="limparEstoque()">Limpar Todo o Estoque</button>

    <script src="estoque.js"></script>

<script src="script.js"></script></body>
</html>
