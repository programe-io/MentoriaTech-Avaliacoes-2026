<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow Pro — Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cabeçalho -->
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <div class="brand-icon">✓</div>
        <div>
          <h1>TaskFlow Pro</h1>
          <span>Gestão Ágil & Produtividade</span>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="btnExportCsv" class="btn btn-outline" title="Exportar planilha CSV">Exportar CSV</button>
        <button id="btnBackupJson" class="btn btn-outline" title="Baixar backup JSON">Backup JSON</button>
        <label class="btn btn-outline" title="Restaurar backup JSON">
          Restaurar
          <input type="file" id="inputRestoreJson" accept=".json" hidden />
        </label>
        <button id="btnOpenNewTask" class="btn btn-primary">+ Nova Tarefa</button>
      </div>
    </div>
  </header>

  <main class="container main-content">

    <!-- Indicadores (KPIs) -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <span class="kpi-label">Total de Tarefas</span>
        <strong id="kpiTotal" class="kpi-value">0</strong>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">Concluídas</span>
        <strong id="kpiCompleted" class="kpi-value text-green">0</strong>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">Em Andamento</span>
        <strong id="kpiProgress" class="kpi-value text-blue">0</strong>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">Atrasadas</span>
        <strong id="kpiOverdue" class="kpi-value text-red">0</strong>
      </div>
      <div class="kpi-card">
        <div class="kpi-row">
          <span class="kpi-label">Progresso Geral</span>
          <strong id="kpiPercent" class="kpi-percent">0%</strong>
        </div>
        <div class="progress-bar">
          <div id="kpiProgressBar" class="progress-fill"></div>
        </div>
      </div>
    </section>

    <!-- Criação Rápida -->
    <section class="card quick-add-card">
      <form id="quickAddForm" class="quick-add-form">
        <input type="text" id="quickTitle" placeholder="O que precisa ser feito agora? (Ex: Enviar relatório mensal...)" required />
        <select id="quickCategory">
          <option value="Trabalho">Trabalho</option>
          <option value="Pessoal">Pessoal</option>
          <option value="Estudos">Estudos</option>
          <option value="Financeiro">Financeiro</option>
          <option value="Saúde">Saúde</option>
          <option value="Urgente">Urgente</option>
        </select>
        <select id="quickPriority">
          <option value="media">Prioridade Média</option>
          <option value="alta">Prioridade Alta</option>
          <option value="baixa">Prioridade Baixa</option>
        </select>
        <input type="date" id="quickDueDate" />
        <button type="submit" class="btn btn-primary">Adicionar</button>
      </form>
    </section>

    <!-- Filtros e Alternador de Visualização -->
    <section class="toolbar">
      <div class="filters">
        <input type="search" id="searchInput" placeholder="Buscar por título ou descrição..." />
        <select id="filterStatus">
          <option value="todos">Todos os Status</option>
          <option value="pendente">A Fazer</option>
          <option value="em_andamento">Em Andamento</option>
          <option value="concluida">Concluída</option>
        </select>
        <select id="filterPriority">
          <option value="todas">Todas Prioridades</option>
          <option value="alta">Alta</option>
          <option value="media">Média</option>
          <option value="baixa">Baixa</option>
        </select>
        <select id="filterCategory">
          <option value="todas">Todas Categorias</option>
          <option value="Trabalho">Trabalho</option>
          <option value="Pessoal">Pessoal</option>
          <option value="Estudos">Estudos</option>
          <option value="Financeiro">Financeiro</option>
          <option value="Saúde">Saúde</option>
          <option value="Urgente">Urgente</option>
        </select>
      </div>

      <div class="view-switcher">
        <button id="btnViewList" class="view-btn active">Lista</button>
        <button id="btnViewKanban" class="view-btn">Quadro Kanban</button>
      </div>
    </section>

    <!-- Visualização em Lista -->
    <section id="listView" class="list-view"></section>

    <!-- Visualização Kanban -->
    <section id="kanbanView" class="kanban-grid hidden">
      <div class="kanban-col" data-status="pendente">
        <div class="kanban-col-header">
          <h3><span class="dot dot-gray"></span> A Fazer</h3>
          <span id="countPendente" class="badge-count">0</span>
        </div>
        <div id="colPendente" class="kanban-dropzone" data-status="pendente"></div>
      </div>

      <div class="kanban-col" data-status="em_andamento">
        <div class="kanban-col-header">
          <h3><span class="dot dot-blue"></span> Em Andamento</h3>
          <span id="countAndamento" class="badge-count">0</span>
        </div>
        <div id="colAndamento" class="kanban-dropzone" data-status="em_andamento"></div>
      </div>

      <div class="kanban-col" data-status="concluida">
        <div class="kanban-col-header">
          <h3><span class="dot dot-green"></span> Concluída</h3>
          <span id="countConcluida" class="badge-count">0</span>
        </div>
        <div id="colConcluida" class="kanban-dropzone" data-status="concluida"></div>
      </div>
    </section>

  </main>

  <!-- Modal de Criação / Edição Detalhada -->
  <div id="taskModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Nova Tarefa</h2>
        <button id="btnCloseModal" class="btn-icon">×</button>
      </div>

      <form id="taskForm" class="modal-
  <script src="script.js"></script>
  
</body>
</html>
