
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS Mini Feed 💜</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>💜 BTS MINI FEED</h1>
        <p>Um cantinho especial para o ARMY!</p>
    </header>

    <main class="container">

        <section class="postar">
            <h2>Compartilhe seu amor pelo BTS!</h2>
            <textarea id="texto" placeholder="O que você está pensando, ARMY?"></textarea>
            <button onclick="publicar()">Publicar 💜</button>
        </section>

        <section id="feed">

            <article class="post">
                <h3>BTS Official 💜</h3>
                <p>Sete estrelas, um só coração! Borahae, ARMY! 💜</p>
                <img src="https://images.unsplash.com/photo-1506157786151-b8491531f063?w=800"
                     alt="Show musical">

                <div class="acoes">
                    <button onclick="curtir(this)">🤍 Curtir <span>0</span></button>
                </div>

                <div class="comentario">
                    <input type="text" placeholder="Comente...">
                    <button onclick="comentar(this)">Enviar</button>
                </div>

                <div class="lista-comentarios"></div>
            </article>

        </section>

    </main>

    <footer>
        Feito com 💜 por uma ARMY!
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
