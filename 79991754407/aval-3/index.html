<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Clone</title>
  <link rel="preconnect" href="https://googleapis.com" />
  <link rel="preconnect" href="https://gstatic.com" crossorigin />
  <link href="https://googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="app-shell">
    <!-- Navegação Lateral / Inferior -->
    <aside class="sidebar">
      <a href="#" class="brand-logo" id="nav-brand">Instagram</a>
      <nav class="nav-menu" aria-label="Menu principal">
        <button class="nav-item active" data-view="feed">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M9.005 16.545a2.997 2.997 0 0 1 2.997-2.997A2.997 2.997 0 0 1 15 16.545V22h7V11.543L12 2 2 11.543V22h7.005Z"/></svg>
          <span>Página inicial</span>
        </button>
        <button class="nav-item" id="open-create-btn">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
          <span>Criar</span>
        </button>
        <button class="nav-item" data-view="profile">
          <img src="https://unsplash.com" alt="Seu perfil" class="nav-avatar" />
          <span>Perfil</span>
        </button>
      </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-area">
      <!-- Visão do Feed -->
      <section id="feed-view" class="feed-view">
        <div class="feed-column">
          <!-- Stories -->
          <div id="stories-bar" class="stories-bar" aria-label="Stories"></div>

          <!-- Posts -->
          <div id="posts-list" class="posts-list" aria-live="polite"></div>
        </div>

        <!-- Sugestões (Desktop) -->
        <aside class="suggestions-column">
          <div class="user-row">
            <img src="https://unsplash.com" alt="Seu avatar" class="avatar-md" />
            <div class="user-meta">
              <strong>camila.style</strong>
              <span>Camila Martins</span>
            </div>
          </div>

          <div class="suggestions-header">
            <span>Sugestões para você</span>
          </div>
          <div id="suggestions-list" class="suggestions-list"></div>
        </aside>
      </section>

      <!-- Visão do Perfil -->
      <section id="profile-view" class="profile-view" hidden>
        <header class="profile-header">
          <img src="https://unsplash.com" alt="Camila Martins" class="profile-avatar" />
          <div class="profile-info">
            <div class="profile-top">
              <h2>camila.style</h2>
            </div>
            <ul class="profile-stats">
              <li><strong id="profile-posts-count">0</strong> publicações</li>
              <li><strong>1.480</strong> seguidores</li>
              <li><strong>412</strong> seguindo</li>
            </ul>
            <div class="profile-bio">
              <strong>Camila Martins</strong>
              <p>Moda, fotografia urbana e curadoria visual.</p>
            </div>
          </div>
        </header>

        <div class="profile-tabs">
          <button class="tab-btn active" data-tab="all">PUBLICAÇÕES</button>
          <button class="tab-btn" data-tab="saved">SALVOS</button>
        </div>

        <div id="profile-grid" class="profile-grid"></div>
      </section>
    </main>
  </div>

  <!-- Modal Visualizador de Story -->
  <div id="story-modal" class="story-modal" hidden>
    <div class="story-viewer">
      <div class="story-progress-track">
        <div id="story-progress-fill" class="story-progress-fill"></div>
      </div>
      <div class="story-top">
        <div class="story-user">
          <img id="story-user-avatar" src="" alt="" />
          <span id="story-user-name"></span>
        </div>
        <button id="close-story-btn" class="story-close" aria-label="Fechar story">&times;</button>
      </div>
      <img id="story-image" src="" alt="Story" class="story-photo" />
    </div>
  </div>

  <!-- Modal Criar Publicação -->
  <div id="create-modal" class="modal" role="dialog" aria-modal="true" hidden>
    <div class="modal-backdrop" id="create-backdrop"></div>
    <div class="modal-box">
      <div class="modal-box-header">
        <h3>Criar nova publicação</h3>
        <button id="close-create-btn" class="icon-close" aria-label="Fechar">&times;</button>
      </div>
      <form id="create-post-form" class="create-form">
        <label>
          <span>URL da imagem</span>
          <input type="url" id="new-image-url" placeholder="https://unsplash.com..." required />
        </label>
        <label>
          <span>Localização (opcional)</span>
          <input type="text" id="new-location" placeholder="São Paulo, Brasil" />
        </label>
        <label>
          <span>Legenda</span>
          <textarea id="new-caption" rows="3" placeholder="Escreva uma legenda..." required></textarea>
        </label>
        <button type="submit" class="btn-primary">Compartilhar</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
