<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LookFeed — Moda Feminina</title>
  <link rel="preconnect" href="https://googleapis.com" />
  <link rel="preconnect" href="https://gstatic.com" crossorigin />
  <link href="https://googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#" class="logo">LookFeed</a>
      <div class="topbar-actions">
        <button id="saved-filter-btn" class="btn-outline" aria-pressed="false">Salvos (<span id="saved-count">0</span>)</button>
        <button id="open-new-post" class="btn-primary">+ Postar Look</button>
      </div>
    </div>
  </header>

  <main class="container feed-layout">
    <section class="stories-bar" aria-label="Destaques de estilo">
      <button class="story-chip active" data-tag="todos">Todos os Looks</button>
      <button class="story-chip" data-tag="alfaiataria">#Alfaiataria</button>
      <button class="story-chip" data-tag="casual">#CasualChic</button>
      <button class="story-chip" data-tag="noite">#Noite</button>
      <button class="story-chip" data-tag="acessorios">#Acessórios</button>
    </section>

    <div id="feed-container" class="feed-list" aria-live="polite"></div>
  </main>

  <!-- Modal para adicionar novo look -->
  <div id="new-post-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="new-post-title" hidden>
    <div class="modal-backdrop" id="close-modal-backdrop"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="new-post-title">Publicar novo look</h2>
        <button id="close-new-post" class="icon-btn" aria-label="Fechar">&times;</button>
      </div>
      <form id="new-post-form" class="post-form">
        <label>
          <span>Seu perfil (@usuario)</span>
          <input type="text" id="post-author" placeholder="@camila.estilo" required />
        </label>
        <label>
          <span>Estilo</span>
          <select id="post-tag" required>
            <option value="alfaiataria">Alfaiataria</option>
            <option value="casual">Casual Chic</option>
            <option value="noite">Noite</option>
            <option value="acessorios">Acessórios</option>
          </select>
        </label>
        <label>
          <span>URL da foto do look</span>
          <input type="url" id="post-image" placeholder="https://..." required />
        </label>
        <label>
          <span>Descrição e peças usadas</span>
          <textarea id="post-caption" rows="3" placeholder="Ex: Blazer de linho off-white + calça reta..." required></textarea>
        </label>
        <button type="submit" class="btn-primary full-width">Publicar no feed</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
