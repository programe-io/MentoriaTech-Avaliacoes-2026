<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Feed - Instagram Rosa Bebê</title>

<!-- Fontes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Ícones -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- CSS -->
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>

<body>

<div class="phone-container">

    <!-- CABEÇALHO -->
    <header>
        <div class="instagram-logo">Instagram</div>

        <div class="header-icons">
            <i class="far fa-heart" onclick="alert('Notificações ♡')"></i>
            <i class="far fa-paper-plane" onclick="alert('Mensagens')"></i>
        </div>
    </header>

    <!-- STORIES -->
    <div class="stories-container">

        <div class="story">
            <div class="story-ring" style="background:#ddd;">
                <img src="C:\Users\me074\Downloads\foto duda!!!.jpeg" class="story-img" alt="Seu story">
            </div>
            <span class="stoCry-name">Seu story</span>
        </div>

        <div class="story">
            <div class="story-ring">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="story-img" alt="Story">
            </div>
            <span class="story-name">aninha</span>
        </div>

        <div class="story">
            <div class="story-ring">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150" class="story-img" alt="Story">
            </div>
            <span class="story-name">beatriz</span>
        </div>

        <div class="story">
            <div class="story-ring">
                <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150" class="story-img" alt="Story">
            </div>
            <span class="story-name">julia_f</span>
        </div>

        <div class="story">
            <div class="story-ring">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" class="story-img" alt="Story">
            </div>
            <span class="story-name">mariana</span>
        </div>

    </div>

    <!-- FEED -->
    <div class="feed-content">

        <div class="post">

            <!-- USUÁRIO -->
            <div class="post-header">
                <div class="post-user">
                    <img src= "C:\Users\me074\Downloads\foto duda!!!.jpeg" class="post-user-img" alt="Perfil">
                    <span class="post-username">dudaaraujo_v</span>
                </div>

                <div class="post-more">
                    <i class="fas fa-ellipsis-h"></i>
                </div>
            </div>

            <!-- FOTO PRINCIPAL -->
            <div class="post-image-container">
                <img src= "C:\Users\me074\Downloads\foto duda!!!.jpeg"
                     class="post-image"
                     alt="Foto principal">
            </div>

            <!-- BOTÕES -->
            <div class="post-actions">
                <div class="post-actions-left">
                    <i id="like-btn" class="far fa-heart"
                       onclick="toggleLike()"></i>

                    <i class="far fa-comment"
                       onclick="document.getElementById('comment-input').focus()"></i>

                    <i class="far fa-paper-plane"
                       onclick="alert('Compartilhar publicação ♡')"></i>
                </div>

                <i class="far fa-bookmark"
                   onclick="alert('Publicação salva! ♡')"></i>
            </div>

            <!-- CURTIDAS -->
            <div class="post-likes">
                <span id="likes-count">1.248</span> curtidas
            </div>

            <!-- LEGENDA -->
            <div class="post-caption">
                <span>dudaaraujo_v</span>
                dia de cuidados e autocuidado por aqui ✨🤍
            </div>

            <!-- COMENTÁRIOS -->
            <div class="comments-section" id="comments-list">

                <div class="comment">
                    <span>amiga_linda</span>
                    Simplesmente perfeita! Maravilhosa demais 💖✨
                </div>

            </div>

            <div class="post-time">Há 2 horas</div>

            <!-- CAMPO DE COMENTÁRIO -->
            <div class="add-comment-box">
                <input type="text"
                       id="comment-input"
                       placeholder="Adicione um comentário..."
                       onkeydown="if(event.key==='Enter') addComment()">

                <button onclick="addComment()">Publicar</button>
            </div>

        </div>

        <!-- RODAPÉ -->
        <div class="rights-footer">
            ©️ 2026 Direitos Reservados | Eduarda
        </div>

    </div>

    <!-- NAVEGAÇÃO -->
    <nav class="bottom-nav">
        <i class="fas fa-home active" onclick="irInicio()"></i>
        <i class="fas fa-search" onclick="alert('Pesquisar')"></i>
        <i class="far fa-plus-square" onclick="alert('Nova publicação')"></i>
        <i class="far fa-play-circle" onclick="alert('Reels')"></i>
        <img src="C:\Users\me074\Downloads\foto duda!!!.jpeg"
             class="profile-nav-img"
             alt="Perfil">
    </nav>

</div>

<!-- JavaScript -->
<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
