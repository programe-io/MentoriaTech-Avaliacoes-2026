<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed - Maria</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="navbar">
        <div class="logo">MiniFeed</div>
        <div class="nav-links">
            <a href="#">Início</a>
            <a href="#">Perfil</a>
        </div>
    </header>

    <main class="container">

        <div class="post-box">
            <div class="user-info-small">
                <div class="avatar">M</div>
                <span>Maria</span>
            </div>

            <input type="text" id="postInput"
            placeholder="O que você está pensando?">

            <button class="btn-publicar" id="btnPublicar">
                Publicar
            </button>
        </div>

        <div id="feedContainer">

            <div class="feed-card">
                <div class="feed-header">
                    <div class="avatar">M</div>
                    <div class="feed-user-details">
                        <strong>Maria</strong>
                        <span class="time">Há 10 minutos</span>
                    </div>
                </div>

                <p class="feed-text">
                    Um dos melhores lugares do mundo!!
                </p>

                <div class="feed-image">
                    <img src="C:\Users\me074\Desktop\imagens\9d834464348fe5107d9f666913835208.jpg"
                    alt="Foto da praia">
                </div>

                <div class="feed-actions">
                    <button class="action-btn">Curtir</button>
                    <button class="action-btn">Comentar</button>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>MiniFeed - Todos os Direitos Reservados - 2026</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
