<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Cadastro de <span>Usuário</span></h1>
    </header>

    <nav>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Cadastro</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </nav>

    <main>
        <section class="conteudo">

            <article>
                <h2>Preencha os dados</h2>

                <img src="https://via.placeholder.com/150" alt="Imagem de cadastro">

                <div class="form-box">
                    <form onsubmit="return validarForm()">
                        <input type="text" id="nome" placeholder="Seu nome"><br><br>
                        <input type="email" id="email" placeholder="Seu email"><br><br>
                        <button type="submit">Enviar</button>
                    </form>
                </div>

                <p id="mensagem">
                    <span></span>
                </p>
            </article>

            <aside>
                <h3>Dica</h3>
                <p>Preencha todos os campos corretamente.</p>
            </aside>

        </section>
    </main>

    <footer>
        <p>© <span>2026</span> - Meu Projeto</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
