
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha de Anamnese</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <h1>🩺 Ficha de Anamnese</h1>
            <p>Cadastro e histórico de saúde do paciente</p>
        </header>

        <form id="formAnamnese">

            <!-- DADOS PESSOAIS -->

            <section class="form-section">

                <h2>1. Identificação do Paciente</h2>

                <div class="form-grid">

                    <div class="campo">
                        <label>Nome completo *</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="campo">
                        <label>Data de nascimento *</label>
                        <input type="date" id="nascimento" required>
                    </div>

                    <div class="campo">
                        <label>CPF</label>
                        <input type="text" id="cpf"
                               placeholder="000.000.000-00">
                    </div>

                    <div class="campo">
                        <label>Telefone *</label>
                        <input type="tel" id="telefone"
                               placeholder="(00) 00000-0000"
                               required>
                    </div>

                    <div class="campo">
                        <label>E-mail</label>
                        <input type="email" id="email">
                    </div>

                    <div class="campo">
                        <label>Profissão</label>
                        <input type="text" id="profissao">
                    </div>

                    <div class="campo">
                        <label>Sexo</label>
                        <select id="sexo">
                            <option value="">Selecione</option>
                            <option>Feminino</option>
                            <option>Masculino</option>
                            <option>Outro</option>
                            <option>Prefiro não informar</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label>Estado civil</label>
                        <select id="estadoCivil">
                            <option value="">Selecione</option>
                            <option>Solteiro(a)</option>
                            <option>Casado(a)</option>
                            <option>Divorciado(a)</option>
                            <option>Viúvo(a)</option>
                            <option>União estável</option>
                        </select>
                    </div>

                    <div class="campo campo-completo">
                        <label>Endereço</label>
                        <input type="text" id="endereco">
                    </div>

                </div>

            </section>

            <!-- HISTÓRICO DE SAÚDE -->

            <section class="form-section">

                <h2>2. Histórico de Saúde</h2>

                <div class="campo">
                    <label>Possui alguma doença diagnosticada?</label>
                    <select id="doenca">
                        <option value="">Selecione</option>
                        <option>Sim</option>
                        <option>Não</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Se sim, qual(is)?</label>
                    <textarea id="detalhesDoenca"
                        placeholder="Descreva as doenças..."></textarea>
                </div>

                <div class="campo">
                    <label>Possui alergias?</label>
                    <select id="alergia">
                        <option value="">Selecione</option>
                        <option>Sim</option>
                        <option>Não</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Quais alergias?</label>
                    <textarea id="detalhesAlergia"></textarea>
                </div>

                <div class="campo">
                    <label>Faz uso de medicamentos?</label>
                    <select id="medicamento">
                        <option value="">Selecione</option>
                        <option>Sim</option>
                        <option>Não</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Quais medicamentos?</label>
                    <textarea id="detalhesMedicamento"></textarea>
                </div>

                <div class="campo">
                    <label>Já realizou alguma cirurgia?</label>
                    <select id="cirurgia">
                        <option value="">Selecione</option>
                        <option>Sim</option>
                        <option>Não</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Descreva as cirurgias realizadas</label>
                    <textarea id="detalhesCirurgia"></textarea>
                </div>

            </section>

            <!-- HISTÓRICO FAMILIAR -->

            <section class="form-section">

                <h2>3. Histórico Familiar</h2>

                <div class="campo">
                    <label>Existe histórico de doenças na família?</label>
                    <select id="historicoFamiliar">
                        <option value="">Selecione</option>
                        <option>Sim</option>
                        <option>Não</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Quais doenças?</label>
                    <textarea id="detalhesFamiliar"
                        placeholder="Ex.: diabetes, hipertensão..."></textarea>
                </div>

            </section>

            <!-- HÁBITOS DE VIDA -->

            <section class="form-section">

                <h2>4. Hábitos de Vida</h2>

                <div class="campo">
                    <label>Pratica atividade física?</label>
                    <select id="atividade">
                        <option value="">Selecione</option>
                        <option>Sim</option>
                        <option>Não</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Frequência de atividade física</label>
                    <input type="text" id="frequencia"
                        placeholder="Ex.: 3 vezes por semana">
                </div>

                <div class="campo">
                    <label>Faz uso de bebidas alcoólicas?</label>
                    <select id="alcool">
                        <option value="">Selecione</option>
                        <option>Sim</option>
                        <option>Não</option>
                        <option>Ocasionalmente</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Faz uso de tabaco?</label>
                    <select id="tabaco">
                        <option value="">Selecione</option>
                        <option>Sim</option>
                        <option>Não</option>
                        <option>Ex-fumante</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Como considera sua alimentação?</label>
                    <select id="alimentacao">
                        <option value="">Selecione</option>
                        <option>Saudável</option>
                        <option>Regular</option>
                        <option>Não saudável</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Quantas horas costuma dormir?</label>
                    <input type="number" id="sono"
                        min="0" max="24" placeholder="Ex.: 8">
                </div>

            </section>

            <!-- AVALIAÇÃO CLÍNICA -->

            <section class="form-section">

                <h2>5. Avaliação Clínica</h2>

                <div class="form-grid">

                    <div class="campo">
                        <label>Peso (kg)</label>
                        <input type="number" id="peso"
                            step="0.1" min="0">
                    </div>

                    <div class="campo">
                        <label>Altura (cm)</label>
                        <input type="number" id="altura"
                            step="0.1" min="0">
                    </div>

                    <div class="campo">
                        <label>Pressão arterial</label>
                        <input type="text" id="pressao"
                            placeholder="Ex.: 120/80">
                    </div>

                    <div class="campo">
                        <label>Temperatura (°C)</label>
                        <input type="number" id="temperatura"
                            step="0.1">
                    </div>

                </div>

                <div class="campo">
                    <label>Queixa principal</label>
                    <textarea id="queixa"
                        placeholder="Descreva a queixa principal..."></textarea>
                </div>

                <div class="campo">
                    <label>Observações adicionais</label>
                    <textarea id="observacoes"></textarea>
                </div>

            </section>

            <!-- CONSENTIMENTO -->

            <section class="form-section">

                <h2>6. Consentimento</h2>

                <label class="consentimento">
                    <input type="checkbox" id="consentimento" required>
                    Declaro que as informações fornecidas são verdadeiras
                    e autorizo seu tratamento para a finalidade de
                    atendimento informada, conforme a LGPD.
                </label>

            </section>

            <!-- BOTÕES -->

            <div class="botoes">

                <button type="submit" class="btn-salvar">
                    Salvar ficha
                </button>

                <button type="button" class="btn-imprimir"
                    onclick="imprimirFicha()">
                    Imprimir ficha
                </button>

                <button type="reset" class="btn-limpar">
                    Limpar formulário
                </button>

            </div>

        </form>

        <footer>
            <p>Ficha de Anamnese Digital © 2026</p>
        </footer>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
