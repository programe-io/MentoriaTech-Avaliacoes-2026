<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <h1 class="logo">Instagram</h1>
      <input type="text" placeholder="Pesquisar..." class="search-bar">
      <div class="nav-icons">
        <span>🏠</span>
        <span>💬</span>
        <span>➕</span>
        <span>❤️</span>
      </div>
    </div>
  </header>

  <main class="main-container">
    <!-- Barra de Stories -->
    <section class="stories">
      <div class="story">
        <div class="story-ring"><img src="https://picsum.photos" alt="User"></div>
        <span>ana_silva</span>
      </div>
      <div class="story">
        <div class="story-ring"><img src="https://picsum.photos" alt="User"></div>
        <span>carlos.dev</span>
      </div>
      <div class="story">
        <div class="story-ring"><img src="https://picsum.photos" alt="User"></div>
        <span>mari_viaja</span>
      </div>
      <div class="story">
        <div class="story-ring"><img src="https://picsum.photos" alt="User"></div>
        <span>lucas_foto</span>
      </div>
    </section>

    <!-- Postagem 1 -->
    <article class="post">
      <div class="post-header">
        <img src="https://picsum.photos" alt="Avatar" class="avatar">
        <strong>ana_silva</strong>
      </div>

      <img src="https://picsum.photos" alt="Paisagem" class="post-image">

      <div class="post-actions">
        <button class="like-btn" onclick="toggleLike(this)">🤍</button>
        <button>💬</button>
        <button>🚀</button>
      </div>

      <div class="post-info">
        <p><strong class="likes-count">124</strong> curtidas</p>
        <p><strong>ana_silva</strong> Aproveitando o fim de semana na natureza! 🌲✨</p>
        <div class="comments-list"></div>
      </div>

      <form class="comment-form" onsubmit="addComment(event, this)">
        <input type="text" placeholder="Adicione um comentário..." required>
        <button type="submit">Publicar</button>
      </form>
    </article>

    <!-- Postagem 2 -->
    <article class="post">
      <div class="post-header">
        <img src="https://picsum.photos" alt="Avatar" class="avatar">
        <strong>carlos.dev</strong>
      </div>

      <img src="https://picsum.photos" alt="Setup" class="post-image">

      <div class="post-actions">
        <button class="like-btn" onclick="toggleLike(this)">🤍</button>
        <button>💬</button>
        <button>🚀</button>
      </div>

      <div class="post-info">
        <p><strong class="likes-count">89</strong> curtidas</p>
        <p><strong>carlos.dev</strong> Finalizando o projeto da faculdade com HTML, CSS e JS! 💻🔥</p>
        <div class="comments-list"></div>
      </div>

      <form class="comment-form" onsubmit="addComment(event, this)">
        <input type="text" placeholder="Adicione um comentário..." required>
        <button type="submit">Publicar</button>
      </form>
    </article>
  </main>

<script src="script.js"></script></body>
</html>
