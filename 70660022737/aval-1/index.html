
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>✨ SocialGram</h1>
    <p>Compartilhe seus momentos!</p>
</header>

<main>
    <section class="criar">
        <h2>Nova publicação</h2>
        <input type="text" id="nome" placeholder="Seu nome">
        <textarea id="texto" placeholder="O que você está pensando?"></textarea>
        <input type="url" id="imagem" placeholder="Link da imagem (URL)">
        <button onclick="publicar()">Publicar</button>
    </section>

    <section id="feed">

        <article class="post">
            <div class="perfil">
                <img src="https://i.pravatar.cc/100?img=12">
                <h3>Maria Oliveira</h3>
            </div>

            <p>Um dia incrível! ❤️✨</p>

            <img class="foto" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800">

            <button onclick="curtir(this)">❤️ Curtir <span>15</span></button>
            <input type="text" placeholder="Escreva um comentário...">
            <button onclick="comentar(this)">Comentar</button>
            <div class="comentarios"></div>
        </article>

        <article class="post">
            <div class="perfil">
                <img src="https://i.pravatar.cc/100?img=15">
                <h3>Pedro Santos</h3>
            </div>

            <p>A natureza é maravilhosa! 🌿</p>

            <img class="foto" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800">

            <button onclick="curtir(this)">❤️ Curtir <span>23</span></button>
            <input type="text" placeholder="Escreva um comentário...">
            <button onclick="comentar(this)">Comentar</button>
            <div class="comentarios"></div>
        </article>

    </section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
