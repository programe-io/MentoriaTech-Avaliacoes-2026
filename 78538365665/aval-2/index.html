<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
    <header>
        <div class="header-content">
            <h1>MiniFeed</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>

            </nav>
        </div>
    </header>
    <main>
        <section class="new-post">
            <div class="user">
                <div class="avatar">
                    J<!-- Letra do Avatar ou Imagem de Perfil -->
                </div>
                <div>
                    <strong>Jonathan<!-- Nome do Perfil --></strong>
                    <span>O que você está pensando?<!-- Frase genérica --></span>
                </div>
            </div>
            <textarea id="postInput" placeholder="O que você está pensando?"></textarea>
            <button>Publicar</button>
        </section>
        <article class="post">
            <div class="post-header">
                <div class="avatar">
                    M<!-- Letra do Avatar ou Imagem de Perfil -->
                </div>
                <div>
                    <strong>Maria<!-- Nome do Perfil --></strong>
                    <span>Há 10 minutos<!-- Tempo da postagem --></span>
                </div>
            </div>
            <div class="post-text">
                Sabiam que a terceira temporada de Frieren sai em outubro do ano que vem?!
            </div>
            <img src="https://www.crunchyroll.com/imgsrv/display/thumbnail/480x720/catalog/crunchyroll/6528adbf0a4e59a5bd22ee3779887838.png"
                alt="Poster de Frieren da Crunchyroll" class="post-img"><!-- Imagem do Post -->
            <div class="post-actions">
                <button class="likeBtn">Curtir (0)</button>
                <button class="commentBtn">Comentar</button>
            </div>

            <div class="comments"></div>
        </article>
        <article class="post">
            <div class="post-header">
                <div class="avatar">
                    L<!-- Letra do Avatar ou Imagem de Perfil -->
                </div>
                <div>
                    <strong>Luana<!-- Nome do Perfil --></strong>
                    <span>Há 10 minutos<!-- Tempo da postagem --></span>
                </div>
            </div>
            <div class="post-text">
                4ª Temporada confirmada! UHUW!
            </div>
            <img src="https://diariodamidia.com.br/uploads/artigos/c8e68fc254a9571ac6bdea4ce903d9cb.webp"
                alt="Imagem promocional de Oshi no Ko" class="post-img"><!-- Imagem do Post -->
            <div class="post-actions">
                <button class="likeBtn">Curtir (0)</button>
                <button class="commentBtn">Comentar</button>
            </div>

            <div class="comments"></div>
        </article>
    </main>
    <footer>
        <p>MiniFeed - todos os Direitos Reservados - 2026</p>
    </footer>
</body>
<script>
    // Curtir e comentar
    document.addEventListener("click", function (event) {

        // Botão Curtir
        if (event.target.classList.contains("likeBtn")) {
            let botao = event.target;

            let curtidas = Number(
                botao.textContent.match(/\d+/)?.[0] || 0
            );

            if (botao.classList.contains("curtido")) {
                curtidas--;
                botao.classList.remove("curtido");
            } else {
                curtidas++;
                botao.classList.add("curtido");
            }

            botao.textContent = `Curtir (${curtidas})`;
        }

        // Botão Comentar
        if (event.target.classList.contains("commentBtn")) {
            let post = event.target.closest(".post");
            let comentario = prompt("Digite seu comentário:");

            if (comentario && comentario.trim() !== "") {
                let novoComentario = document.createElement("p");
                comentario = "@Jonathan135: " + comentario
                novoComentario.textContent = comentario;

                post.querySelector(".comments")
                    .appendChild(novoComentario);
            }
        }
    });

    // Botão Publicar
    document.querySelector(".new-post button")
        .addEventListener("click", function () {

            let texto = document.querySelector("#postInput");

            if (texto.value.trim() === "") {
                alert("Digite algo antes de publicar!");
                return;
            }

            let novaPostagem = document.createElement("article");
            novaPostagem.classList.add("post");

            novaPostagem.innerHTML = `
            <div class="post-header">
                <div class="avatar">J</div>
                <div>
                    <strong>Jonathan</strong>
                    <span>Agora mesmo</span>
                </div>
            </div>

            <div class="post-text"></div>

            <div class="post-actions">
                <button class="likeBtn">Curtir (0)</button>
                <button class="commentBtn">Comentar</button>
            </div>

            <div class="comments"></div>
        `;

            novaPostagem.querySelector(".post-text")
                .textContent = texto.value;

            document.querySelector("main")
                .appendChild(novaPostagem);

            texto.value = "";
        });
</script>

</html>
