<!DOCTYPE html
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Avaliacao1</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <h1>Estoque 2ano</h1>
    <div class="section">
        <h2>Gerenciar produtos</h2>
        <div class="input-group">
            <label for="nomeP">Nome do produto:</label>
            <input type="text" id="nomeP" placeholder="digite o nome do poduto">
        </div>
        <div class="input-group">
            <label for="qtdP">Quantidade:</label>
            <input type="number" id="qtdP" placeholder="Digite a quantidade do produto">
        </div>
        <div class="input-group">
            <label for="valorP">Valor:</label>
            <input type="number" id="valorP" placeholder="Digite o valor do produto">
        </div>

    </div>
    <button id="btAdd" class="btn-update">Adicionar Produto</button>
    <button id="btAtualizar" class="btn-update">Atualizar produto</button>
    <button id="btExcluir" class="btn-update">Excluir produto</button>

  </div>
  <div class="section">

    <h2>lista de Produtos</h2>
    <ul id="listaProdutos"class="lista-produtos">
    
    </ul>
  </div>
</div>


  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
