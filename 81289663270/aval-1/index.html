<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca</title>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffff5;--panel:#e0ded3;--ink:#1c1c1a;--card:#fffff5;--gold:#c8962b;--dim:#b9b6a6;--muted:#6b6a60;--field:#fffff5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141412;--panel:#252420;--ink:#efede0;--card:#1c1c1a;--dim:#4a483f;--muted:#a29f90;--field:#1c1c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141412;--panel:#252420;--ink:#efede0;--card:#1c1c1a;--dim:#4a483f;--muted:#a29f90;--field:#1c1c1a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,sans-serif}
.app{max-width:560px;margin:0 auto;background:var(--bg);min-height:100vh}
header{background:#1c1c1a;text-align:center;padding:6px 0 4px}
header h1{margin:0;font:400 clamp(40px,12vw,64px)/1.1 "Poiret One",Roboto,sans-serif;color:#fffff5;letter-spacing:.01em}
.banner{display:block;width:100%;height:auto;margin-top:4px}
.hero{position:relative;height:150px}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:62px;background:#1c1c1a}
.catwrap{position:absolute;left:1%;top:-54px;width:46%;border:0;background:none;padding:0;cursor:pointer}
.catwrap img{display:block;width:100%;height:auto}
.catwrap .awake{position:absolute;inset:0;opacity:0;transition:opacity .25s}
.catwrap.up .awake{opacity:1}
.catwrap:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:12px}
.bubble{position:absolute;left:52%;bottom:calc(100% + 6px);width:min(62vw,300px);background:#fffff5;color:#8a0f0f;border-radius:6px;padding:16px 18px;font:500 15px/1.4 Roboto,sans-serif;text-align:center;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .3s,transform .3s}
.bubble::after{content:"";position:absolute;left:8%;top:100%;border:10px solid transparent;border-top-color:#fffff5;border-left-color:#fffff5}
.catwrap.up .bubble{opacity:1;transform:none}
.criar{position:absolute;right:6%;top:78px;background:#1c1c1a;color:#fffff5;border:0;border-radius:999px;padding:8px 34px;font:400 34px/1.2 "Poiret One",Roboto,sans-serif;cursor:pointer}
.criar:focus-visible,.arrow:focus-visible,.cover:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.shelf{background:var(--panel);border-radius:44px 44px 0 0;margin:0 8% ;padding:22px 0 40px;min-height:50vh}
.shelf h2{margin:18px 0 12px 12%;font:700 28px/1.2 Roboto,sans-serif}
.row{display:flex;align-items:center}
.arrow{flex:0 0 12%;background:none;border:0;color:var(--ink);font:900 28px Roboto,sans-serif;cursor:pointer;padding:0;height:80px}
.track{flex:1;display:flex;gap:3.5%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.cover{flex:0 0 31%;aspect-ratio:2/3;scroll-snap-align:start;background:#1c1c1a;border:0;border-radius:6px;padding:0;overflow:hidden;cursor:pointer;color:#fffff5;font:700 14px/1.3 Roboto,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover span{padding:8px}
.empty{margin:30px 12%;color:var(--muted);font-size:17px;line-height:1.5}
.stars{position:relative;display:inline-block;font-size:26px;line-height:1;letter-spacing:2px;white-space:nowrap;color:var(--dim)}
.stars .fg{position:absolute;left:0;top:0;overflow:hidden;color:var(--gold)}
.stars.in{cursor:pointer;font-size:38px;touch-action:none}
dialog{width:min(92vw,520px);max-height:90vh;border:0;border-radius:18px;padding:0;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(10,10,8,.65)}
.sheet{padding:22px}
.sheet h3{margin:0 0 16px;font:400 30px "Poiret One",Roboto,sans-serif}
label{display:block;margin:14px 0 5px;font-weight:700;font-size:15px}
label small{font-weight:400;color:var(--muted)}
input[type=text],textarea{width:100%;background:var(--field);color:var(--ink);border:1.5px solid var(--dim);border-radius:10px;padding:10px 12px;font:400 16px/1.4 Roboto,sans-serif}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--gold);border-color:transparent}
.pick{display:flex;gap:14px;align-items:center}
.thumb{width:76px;aspect-ratio:2/3;background:#1c1c1a;border-radius:6px;object-fit:cover;flex:none}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.btn{border:1.5px solid #1c1c1a;background:transparent;color:var(--ink);border-radius:999px;padding:10px 22px;font:700 15px Roboto,sans-serif;cursor:pointer}
:root:not([data-theme="light"]) .btn{border-color:var(--ink)}
.btn.main{background:#1c1c1a;color:#fffff5;border-color:#1c1c1a}
.btn.danger{border-color:#9b1c1c;color:#9b1c1c}
.btn.danger.sure{background:#9b1c1c;color:#fff}
.err{color:#9b1c1c;font-size:14px;min-height:18px;margin-top:8px}
.det{display:flex;gap:16px}
.det img,.det .nocover{width:36%;aspect-ratio:2/3;border-radius:6px;object-fit:cover;background:#1c1c1a;flex:none}
.det h3{font-size:34px;margin-bottom:4px}
.meta{color:var(--muted);margin:2px 0 8px}
.tag{display:inline-block;border:1.5px solid var(--dim);border-radius:999px;padding:2px 12px;font-size:14px;margin:0 6px 8px 0}
.det h4{margin:20px 0 4px;font-size:16px}
.det p{margin:0;line-height:1.55;white-space:pre-wrap}
@media (prefers-reduced-motion:reduce){.bubble,.catwrap .awake{transition:none}}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

"O silêncio da biblioteca é só o barulho dos mortos esperando para serem lidos.",
"Você procura respostas, mas as perguntas já se cansaram de você.",
"Nada permanece. Nem as páginas, nem quem as vira.",
"Todo final já estava escrito na primeira página. Você só não quis ler.",
"O tempo é um gato: finge dormir enquanto te observa.",
"Ninguém é esquecido de uma vez. Primeiro vão os rostos, depois os nomes.",
"O abismo também lê, e ele nunca perde a página.",
"Viver é folhear um livro cujo autor já foi embora.",
"A vida é uma constante oscilação entre a ânsia de ter e o tédio de possuir.",
"Nossos pensamentos são as sombras de nossos sentimentos, sempre mais obscuros, mais vazios, mais simples que estes.",
"O melhor trabalho político, social e espiritual que podemos fazer é parar de projetar nossas sombras nos outros.",
"Amo-te como se amam certas coisas obscuras, secretamente, entre a sombra e a alma.",
"Você nunca vai aceitar as mudanças da sua vida.",
"As pessoas tem coisas belas para dizer sobre você, mas você tem que morrer primeiro."
];
const $=id=>document.getElementById(id);
let books=[],editing=null,rating=0,cover="",lastQ=-1,busy=false;
try{books=JSON.parse(localStorage.getItem("biblioteca-livros")||"[]")}catch(e){books=[]}
function persist(){try{localStorage.setItem("biblioteca-livros",JSON.stringify(books));return true}catch(e){return false}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function stars(r){return `<span class="stars" role="img" aria-label="Nota ${r} de 5"><span>★★★★★</span><span class="fg" style="width:${r/5*100}%">★★★★★</span></span>`}
function fmt(r){return String(r).replace(".",",")}

/* gato */
$("cat").addEventListener("click",()=>{
  if(busy)return;busy=true;
  let i;do{i=Math.floor(Math.random()*QUOTES.length)}while(i===lastQ);lastQ=i;
  $("bubble").textContent="“"+QUOTES[i]+"”";
  $("cat").classList.add("up");
  setTimeout(()=>{$("cat").classList.remove("up");setTimeout(()=>busy=false,400)},6000);
});

/* estante */
function render(){
  const sh=$("shelf");
  if(!books.length){sh.innerHTML='<p class="empty">A estante está vazia. Toque em CRIAR para cadastrar o primeiro livro que você leu.</p>';return}
  const groups={};
  books.forEach(b=>{const k=b.genero.trim().toLowerCase();(groups[k]=groups[k]||{name:b.genero.trim(),items:[]}).items.push(b)});
  sh.innerHTML=Object.values(groups).sort((a,b)=>a.name.localeCompare(b.name,"pt-BR")).map(g=>`
    <h2>${esc(g.name)}</h2>
    <div class="row"><button class="arrow" data-d="-1" aria-label="Anterior">&lt;</button>
    <div class="track">${g.items.map(b=>`<button class="cover" data-id="${b.id}" aria-label="${esc(b.nome)}">${b.capa?`<img src="${b.capa}" alt="Capa de ${esc(b.nome)}">`:`<span>${esc(b.nome)}</span>`}</button>`).join("")}</div>
    <button class="arrow" data-d="1" aria-label="Próximo">&gt;</button></div>`).join("");
  const dl=$("genList");dl.innerHTML=Object.values(groups).map(g=>`<option value="${esc(g.name)}">`).join("");
}
$("shelf").addEventListener("click",e=>{
  const a=e.target.closest(".arrow");
  if(a){const t=a.parentElement.querySelector(".track");t.scrollBy({left:a.dataset.d*t.clientWidth*.8,behavior:"smooth"});return}
  const c=e.target.closest(".cover");if(c)openDetail(c.dataset.id);
});

/* detalhe */
function openDetail(id){
  const b=books.find(x=>x.id===id);if(!b)return;
  $("det").innerHTML=`<div class="det">${b.capa?`<img src="${b.capa}" alt="Capa de ${esc(b.nome)}">`:'<div class="nocover"></div>'}
    <div><h3>${esc(b.nome)}</h3><div class="meta">${esc(b.autor)}</div>
    <span class="tag">${esc(b.genero)}</span>${b.sub?`<span class="tag">${esc(b.sub)}</span>`:""}
    <div>${stars(b.nota)} <b style="margin-left:6px">${fmt(b.nota)}</b></div></div></div>
    <div class="det"><div style="width:100%"><h4>Sinopse</h4><p>${esc(b.sinopse)}</p><h4>Minha opinião</h4><p>${esc(b.opiniao)}</p></div></div>
    <div class="actions"><button class="btn danger" id="del">Excluir</button><button class="btn" id="edit">Editar</button><button class="btn main" id="close">Fechar</button></div>`;
  $("close").onclick=()=>$("detDlg").close();
  $("edit").onclick=()=>{$("detDlg").close();openForm(b)};
  const d=$("del");d.onclick=()=>{
    if(!d.classList.contains("sure")){d.classList.add("sure");d.textContent="Confirmar exclusão";return}
    books=books.filter(x=>x.id!==id);persist();render();$("detDlg").close()};
  $("detDlg").showModal();
}

/* formulário */
const rateIn=$("rateIn");
function setRate(r){rating=r;rateIn.innerHTML=`<span>★★★★★</span><span class="fg" style="width:${r/5*100}%">★★★★★</span>`;rateIn.setAttribute("aria-valuenow",r);$("rateTxt").textContent=r?fmt(r)+" de 5":""}
function rateFrom(e){const rc=rateIn.getBoundingClientRect();const x=Math.min(Math.max(e.clientX-rc.left,1),rc.width);setRate(Math.max(.5,Math.ceil(x/rc.width*10)/2))}
rateIn.addEventListener("pointerdown",e=>{rateFrom(e);rateIn.setPointerCapture(e.pointerId)});
rateIn.addEventListener("pointermove",e=>{if(e.buttons)rateFrom(e)});
rateIn.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowUp"){e.preventDefault();setRate(Math.min(5,rating+.5))}
  if(e.key==="ArrowLeft"||e.key==="ArrowDown"){e.preventDefault();setRate(Math.max(.5,rating-.5))}});
function setCover(src){cover=src;const t=$("thumb");if(src){t.src=src;t.style.visibility="visible"}else{t.removeAttribute("src");t.style.visibility="hidden"}}
$("file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const w=Math.min(400,im.width),h=im.height*w/im.width,c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(im,0,0,w,h);setCover(c.toDataURL("image/jpeg",.82))};im.src=r.result};r.readAsDataURL(f)});
function openForm(b){
  editing=b?b.id:null;$("formTitle").textContent=b?"Editar livro":"Novo livro";
  $("f-nome").value=b?b.nome:"";$("f-autor").value=b?b.autor:"";$("f-gen").value=b?b.genero:"";
  $("f-sub").value=b?b.sub:"";$("f-sin").value=b?b.sinopse:"";$("f-op").value=b?b.opiniao:"";
  $("file").value="";setCover(b?b.capa:"");setRate(b?b.nota:0);$("err").textContent="";
  $("formDlg").showModal();
}
$("criar").onclick=()=>openForm(null);
$("cancel").onclick=()=>$("formDlg").close();
$("save").onclick=()=>{
  const d={nome:$("f-nome").value.trim(),autor:$("f-autor").value.trim(),genero:$("f-gen").value.trim(),sub:$("f-sub").value.trim(),sinopse:$("f-sin").value.trim(),opiniao:$("f-op").value.trim(),nota:rating,capa:cover};
  const miss=[];if(!d.capa)miss.push("a capa");if(!d.nome)miss.push("o nome");if(!d.autor)miss.push("o autor");if(!d.genero)miss.push("o gênero");if(!d.sinopse)miss.push("a sinopse");if(!d.opiniao)miss.push("sua opinião");if(!d.nota)miss.push("a nota");
  if(miss.length){$("err").textContent="Falta preencher: "+miss.join(", ")+".";return}
  if(editing){books=books.map(b=>b.id===editing?{...b,...d}:b)}else{books.push({id:"b"+Date.now(),...d})}
  if(!persist()){$("err").textContent="Não foi possível salvar no navegador. Tente uma capa menor.";if(!editing)books.pop();return}
  render();$("formDlg").close();
};
setRate(0);setCover("");render();
</script>
</body>
</html>
