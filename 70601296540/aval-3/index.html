<div>
  <section id="tipos">
    <h2>O que é uma função?</h2>
    <p>
      Uma função relaciona cada valor de entrada a um único valor de saída.
      Um exemplo é f(x) = 2x + 1.
    </p>
  </section>
<span>
  <section id="calculadora">
    <h2>Calcule f(x) = 2x + 1</h2>
    <input type="number" id="x" placeholder="Digite o valor de x">
    <button onclick="calcular()">Calcular</button>
    <h3 id="resultado"></h3>
  </sectionfunction calcular() {
  let x = Number(document.getElementById("x").value);
  let y = 2 * x + 1;

  document.getElementById("resultado").innerHTML =
    "Resultado: f(" + x + ") = " + y;
}
