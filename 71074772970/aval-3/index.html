
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #a5b4fc);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #4f46e5;
        }

        p {
            color: #666;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #c7d2fe;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #eef2ff;
            color: #312e81;
            display: none;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>💜 Calculadora de IMC</h1>
        <p>Informe os dados do paciente</p>

        <input type="text" id="nome" placeholder="Nome do paciente">

        <input type="number" id="peso" placeholder="Peso (kg)" step="0.1">

        <input type="number" id="altura" placeholder="Altura (m)" step="0.01">

        <button onclick="calcularIMC()">Calcular IMC</button>

        <div id="resultado"></div>

    </div>

    <script>
        function calcularIMC() {

            let nome = document.getElementById("nome").value;
            let peso = parseFloat(document.getElementById("peso").value);
            let altura = parseFloat(document.getElementById("altura").value);

            if (nome === "" || isNaN(peso) || isNaN(altura) ||
                peso <= 0 || altura <= 0) {

                alert("Preencha todos os campos corretamente!");
                return;
            }

            let imc = peso / (altura * altura);

            let classificacao;

            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            } 
            else if (imc < 25) {
                classificacao = "Peso normal";
            } 
            else if (imc < 30) {
                classificacao = "Sobrepeso";
            } 
            else if (imc < 35) {
                classificacao = "Obesidade grau I";
            } 
            else if (imc < 40) {
                classificacao = "Obesidade grau II";
            } 
            else {
                classificacao = "Obesidade grau III";
            }

            let resultado = document.getElementById("resultado");

            resultado.style.display = "block";

            resultado.innerHTML = `
                <h2>Resultado do Paciente</h2>
                <p><strong>Nome:</strong> ${nome}</p>
                <p><strong>Peso:</strong> ${peso} kg</p>
                <p><strong>Altura:</strong> ${altura} m</p>
                <h2>IMC: ${imc.toFixed(2)}</h2>
                <h3>${classificacao}</h3>
                <p>Esta classificação é uma referência geral.
                Procure um profissional de saúde para avaliação individual.</p>
            `;
        }
    </script>

<script src="script.js"></script></body>
</html>
