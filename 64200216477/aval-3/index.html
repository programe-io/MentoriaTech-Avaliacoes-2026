<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
        <div class="logo">🎬</div>
        <h1>CineMax</h1>
        <p>Encontre seu próximo filme favorito</p>
    </header>

    <div class="busca">
        <input type="text" id="campoBusca" placeholder="Digite o nome de um filme...">
        <button id="buscar">Buscar</button>
    </div>

    <div class="filtros">
        <button class="filtro ativo" data-genero="Todos">Todos</button>
        <button class="filtro" data-genero="Ação">Ação</button>
        <button class="filtro" data-genero="Comédia">Comédia</button>
        <button class="filtro" data-genero="Drama">Drama</button>
        <button class="filtro" data-genero="Ficção">Ficção</button>
    </div>

    <main id="filmes"></main>

    <div id="mensagem" class="mensagem">
        Nenhum filme encontrado.
    </div>
</div>

  <script src="script.js"></script>
  
</body>
</html>
