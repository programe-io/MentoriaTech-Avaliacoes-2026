<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header>
        <div class="logo">☕</div>
        <h1>Café & Aroma</h1>
        <p>Seu cantinho favorito para um bom café</p>
    </header>

    <section class="card">
        <h2>Monte seu pedido</h2>

        <label for="bebida">Escolha sua bebida:</label>
        <select id="bebida">
            <option value="Café Expresso" data-preco="6">Café Expresso - R$ 6,00</option>
            <option value="Cappuccino" data-preco="10">Cappuccino - R$ 10,00</option>
            <option value="Café com Leite" data-preco="8">Café com Leite - R$ 8,00</option>
            <option value="Chocolate Quente" data-preco="9">Chocolate Quente - R$ 9,00</option>
        </select>

        <label for="tamanho">Tamanho:</label>
        <select id="tamanho">
            <option value="Pequeno" data-adicional="0">Pequeno</option>
            <option value="Médio" data-adicional="2">Médio (+ R$ 2)</option>
            <option value="Grande" data-adicional="4">Grande (+ R$ 4)</option>
        </select>

        <label>Adicionais:</label>

        <div class="adicionais">
            <label>
                <input type="checkbox" value="Chantilly" data-preco="2">
                Chantilly (+ R$ 2)
            </label>

            <label>
                <input type="checkbox" value="Canela" data-preco="1">
                Canela (+ R$ 1)
            </label>

            <label>
                <input type="checkbox" value="Chocolate" data-preco="3">
                Chocolate (+ R$ 3)
            </label>
        </div>

        <button id="pedidoBtn">Fazer Pedido ☕</button>

        <div id="resultado"></div>
    </section>
</div>

  <script src="script.js"></script>
  
</body>
</html>
