<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <div>
                <h1>✅ Gerenciador de Tarefas</h1>
                <p>Organize suas atividades de forma simples.</p>
            </div>

            <button class="btn-primary" onclick="abrirModal()">
                + Nova Tarefa
            </button>
        </header>


        <!-- RESUMO -->

        <section class="cards">

            <div class="card">
                <span>Total</span>
                <strong id="totalTarefas">0</strong>
            </div>

            <div class="card">
                <span>Pendentes</span>
                <strong id="tarefasPendentes">0</strong>
            </div>

            <div class="card">
                <span>Concluídas</span>
                <strong id="tarefasConcluidas">0</strong>
            </div>

            <div class="card">
                <span>Alta prioridade</span>
                <strong id="tarefasAlta">0</strong>
            </div>

        </section>


        <!-- FILTROS -->

        <section class="filtros">

            <input
                type="text"
                id="pesquisa"
                placeholder="🔎 Pesquisar tarefa..."
                oninput="listarTarefas()"
            >

            <select id="filtroStatus" onchange="listarTarefas()">
                <option value="todas">Todas</option>
                <option value="pendentes">Pendentes</option>
                <option value="concluidas">Concluídas</option>
            </select>

            <select id="filtroPrioridade" onchange="listarTarefas()">
                <option value="todas">Todas as prioridades</option>
                <option value="alta">Alta</option>
                <option value="media">Média</option>
                <option value="baixa">Baixa</option>
            </select>

        </section>


        <!-- LISTA DE TAREFAS -->

        <section class="lista">

            <div class="lista-header">
                <h2>Minhas tarefas</h2>
            </div>

            <div id="listaTarefas"></div>

        </section>

    </div>


    <!-- MODAL -->

    <div id="modal" class="modal escondido">

        <div class="modal-content">

            <div class="modal-header">
                <h2 id="tituloModal">Nova Tarefa</h2>

                <button onclick="fecharModal()">×</button>
            </div>


            <form id="formTarefa">

                <input type="hidden" id="tarefaId">

                <label>Título</label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Ex: Estudar JavaScript"
                    required
                >


                <label>Descrição</label>

                <textarea
                    id="descricao"
                    placeholder="Descreva a tarefa..."
                ></textarea>


                <div class="form-grid">

                    <div>
                        <label>Prioridade</label>

                        <select id="prioridade">

                            <option value="baixa">
                                Baixa
                            </option>

                            <option value="media" selected>
                                Média
                            </option>

                            <option value="alta">
                                Alta
                            </option>

                        </select>
                    </div>


                    <div>
                        <label>Data</label>

                        <input
                            type="date"
                            id="data"
                        >
                    </div>

                </div>


                <div class="modal-buttons">

                    <button
                        type="button"
                        class="btn-cancel"
                        onclick="fecharModal()"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Salvar tarefa
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
