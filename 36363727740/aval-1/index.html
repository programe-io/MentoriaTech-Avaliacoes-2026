<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Controle de Estoque</h1>
        <p>Gerencie seus produtos</p>
    </header>

    <main>

        <section class="form-container">
            <h2 id="form-title">Cadastrar Produto</h2>

            <form id="produto-form">

                <input type="hidden" id="produto-id">

                <div class="form-group">
                    <label for="nome">Nome do produto</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Ex: Teclado Mecânico"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <input
                        type="text"
                        id="categoria"
                        placeholder="Ex: Informática"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="preco">Preço</label>
                    <input
                        type="number"
                        id="preco"
                        placeholder="0.00"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        placeholder="0"
                        min="0"
                        required
                    >
                </div>

                <div class="buttons">
                    <button type="submit" class="btn-primary" id="btn-salvar">
                        Cadastrar
                    </button>

                    <button
                        type="button"
                        class="btn-cancelar"
                        id="btn-cancelar"
                        onclick="cancelarEdicao()"
                        hidden
                    >
                        Cancelar
                    </button>
                </div>

            </form>
        </section>

        <section class="estoque">

            <div class="topo-estoque">
                <div>
                    <h2>Produtos</h2>
                    <p id="total-produtos">0 produtos cadastrados</p>
                </div>

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="🔎 Pesquisar produto..."
                >
            </div>

            <div class="cards">

                <div class="card">
                    <span>Total de produtos</span>
                    <strong id="card-produtos">0</strong>
                </div>

                <div class="card">
                    <span>Quantidade em estoque</span>
                    <strong id="card-estoque">0</strong>
                </div>

                <div class="card">
                    <span>Estoque baixo</span>
                    <strong id="card-baixo">0</strong>
                </div>

                <div class="card">
                    <span>Valor do estoque</span>
                    <strong id="card-valor">R$ 0,00</strong>
                </div>

            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-produtos">
                    </tbody>

                </table>

                <div id="sem-produtos" class="sem-produtos">
                    Nenhum produto cadastrado.
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
