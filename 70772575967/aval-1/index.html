<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Página</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      text-align:center;
    }

    header{
      background:#0077ff;
      color:white;
      padding:20px;
    }

    main{
      padding:40px;
    }

    button{
      background:#0077ff;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#005fcc;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>Meu Primeiro Site</h1>
  </header>

  <main>
    <h2>Olá, mundo!</h2>
    <p>Este é um exemplo simples em HTML, CSS e JavaScript.</p>

    <button onclick="mostrarMensagem()">
      Clique Aqui
    </button>
  </main>

  <script>
    function mostrarMensagem(){
      alert("Você clicou no botão!");
    }
  </script>

<script src="script.js"></script></body>
</html>
