<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
  <header class="topo">
    <button class="btn-voltar" onclick="alert('Voltando para o início...')">Voltar para o início</button>
    <h1>Área de Entrega - Avaliações</h1>
    <p>Aqui você envia seus códigos para correção. Revise antes de publicar e garanta que sua avaliação esteja completa.</p>
  </header>

  <main class="editores">
    <div class="box-editor" id="box-html">
      <div class="header-editor">
        <h2>HTML</h2>
        <button class="btn-max" onclick="alternarMaximizar('box-html')">Maximizar</button>
      </div>
      <textarea id="code-html" placeholder="Digite seu HTML aqui..."><h1>Olá, Professor!</h1>
<p>Esta é a minha avaliação pronta.</p>
<button id="btn-teste">Clique aqui</button></textarea>
    </div>

    <div class="box-editor" id="box-css">
      <div class="header-editor">
        <h2>CSS</h2>
        <button class="btn-max" onclick="alternarMaximizar('box-css')">Maximizar</button>
      </div>
      <textarea id="code-css" placeholder="Digite seu CSS aqui...">body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
  background-color: #f4f4f9;
\}
h1 { color: #059669; \}
button {
  background: #059669;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 5px;
  cursor: pointer;
\}</textarea>
    </div>

    <div class="box-editor" id="box-js">
      <div class="header-editor">
        <h2>JavaScript</h2>
        <button class="btn-max" onclick="alternarMaximizar('box-js')">Maximizar</button>
      </div>
      <textarea id="code-js" placeholder="Digite seu JavaScript aqui...">document.getElementById('btn-teste').addEventListener('click', () => {
  alert('Código funcionando perfeitamente!');
\});</textarea>
    </div>
  </main>

  <section class="preview-area">
    <div class="preview-header">
      <h2>Pré-visualização do Código</h2>
      <button class="btn-publicar" onclick="enviarAvaliacao()">Publicar Avaliação</button>
    </div>
    <iframe id="preview-frame"></iframe>
  </section>
</div>
$0
  <script src="script.js"></script>
  
</body>
</html>
