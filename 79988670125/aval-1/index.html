  <div class="container">
  <h1>Calculadora de Média Escolar</h1>
  <p>Digite suas notas para verificar sua aprovação na avaliação.</p>

  <div class="input-group">
    <label for="nota1">Nota 1:</label>
    <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Ex: 8.5">
  </div>

  <div class="input-group">
    <label for="nota2">Nota 2:</label>
    <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="Ex: 7.0">
  </div>

  <button id="btnCalcular">Calcular Média</button>

  <div id="resultado" class="resultado-box oculto"></div>
</div>
