<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
  <header class="cabecalho">
    <span class="badge">Avaliação Front-end</span>
    <h1>Portal de Entrega de Atividades</h1>
    <p>Preencha os dados abaixo e confira os requisitos antes de enviar ao professor.</p>
  </header>

  <main class="card">
    <form id="form-entrega">
      <div class="campo">
        <label for="nome">Nome Completo do Aluno:</label>
        <input type="text" id="nome" placeholder="Ex: Maria Silva" required>
      </div>

      <div class="campo">
        <label for="link">Link do Repositório ou GitHub Pages:</label>
        <input type="url" id="link" placeholder="https://github.io" required>
      </div>

      <div class="checklist">
        <h3>Checklist de Revisão:</h3>
        <label class="item-check">
          <input type="checkbox" class="req" value="HTML Semântico"> Estrutura HTML organizada
        </label>
        <label class="item-check">
          <input type="checkbox" class="req" value="CSS Responsivo"> Estilização CSS aplicada
        </label>
        <label class="item-check">
          <input type="checkbox" class="req" value="JavaScript Funcional"> Interatividade JavaScript testada
        </label>
      </div>

      <button type="submit" class="btn-enviar">Validar e Gerar Comprovante</button>
    </form>

    <div id="resultado" class="resultado oculto"></div>
  </main>
</div>

</body>
</html>
