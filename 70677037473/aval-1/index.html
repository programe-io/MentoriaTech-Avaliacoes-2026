
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Red | Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>STOCK RED</h1>
        <p>Sistema de Gerenciamento de Estoque</p>
    </header>

    <main>

        <section class="resumo">
            <h2>TOTAL DE PRODUTOS CADASTRADOS</h2>
            <p id="total">0</p>
        </section>

        <section class="container">
            <h2>+ Cadastrar Produto</h2>

            <form class="formulario" id="formProduto">

                <input type="text" id="codigo"
                    placeholder="Código do produto" required>

                <input type="text" id="descricao"
                    placeholder="Descrição do produto" required>

                <input type="number" id="quantidade"
                    placeholder="Quantidade" min="0" step="1" required>

                <input type="number" id="valor"
                    placeholder="Valor (R$)" min="0" step="0.01" required>

                <button type="submit">CADASTRAR PRODUTO</button>

            </form>
        </section>

        <section class="container">
            <h2>Produtos em Estoque</h2>

            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="5" class="vazio">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        STOCK RED © 2026 - Sistema de Controle de Estoque
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
