
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Prático - Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <h1>Controle de IMC</h1>

        <form id="formulario">

            <label for="nome">Nome do paciente:</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite o nome do paciente"
                required
            >

            <label for="peso">Peso (kg):</label>
            <input
                type="number"
                id="peso"
                placeholder="Ex: 70"
                min="0.01"
                step="any"
                required
            >

            <label for="altura">Altura (m):</label>
            <input
                type="number"
                id="altura"
                placeholder="Ex: 1.70"
                min="0.01"
                step="any"
                required
            >

            <button type="submit">Calcular IMC</button>

        </form>

        <section id="resultado" aria-live="polite"></section>

        <section class="informacoes">

            <h2>Sobre o IMC</h2>

            <p>
                O IMC (Índice de Massa Corporal) é uma medida
                calculada utilizando o peso e a altura.
            </p>

            <p>
                <strong>Fórmula:</strong>
                IMC = Peso / (Altura × Altura)
            </p>

            <p>
                O resultado é uma medida de referência e deve
                ser interpretado considerando outros fatores,
                como idade e sexo.
            </p>

        </section>

    </main>

<script src="script.js"></script></body>
</html>
