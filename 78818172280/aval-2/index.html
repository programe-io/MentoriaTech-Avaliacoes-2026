<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", Arial, sans-serif;
            height: 100vh;
            background: #111;
        }

        .container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.65)
                ),
                url("SUA-IMAGEM-AQUI.jpg");

            background-size: cover;
            background-position: center;
        }

        .conteudo {
            color: white;
            padding: 30px;
        }

        h1 {
            font-size: 60px;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        }

        p {
            font-size: 22px;
            margin-top: 15px;
            color: #f1f1f1;
        }

        .botao {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 35px;
            border-radius: 30px;
            background: #ffffff;
            color: #111;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .botao:hover {
            transform: scale(1.08);
            background: #ffcc00;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.6);
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">
        <div class="conteudo">
            <h1>Meu Site</h1>

            <p>
                Um texto bonito sobre o seu projeto ✨
            </p>

            <a href="#" class="botao">
                Saiba mais
            </a>
        </div>
    </div>

<script src="script.js"></script></body>
</html>
