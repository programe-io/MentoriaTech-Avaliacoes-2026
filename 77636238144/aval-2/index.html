<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Links</title>
<style>
body {
  background: #0f0f0f;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  padding-top: 40px;
}
.container { width: 350px; text-align: center; }
.foto {
  width: 90px; height: 90px;
  border-radius: 50%;
  background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  margin: 0 auto 15px;
}
h1 { font-size: 20px; margin: 0; }
p { color: #aaa; font-size: 14px; }
.link {
  display: block;
  background: white;
  color: black;
  text-decoration: none;
  padding: 16px;
  border-radius: 30px;
  margin: 15px 0;
  font-weight: bold;
  transition: 0.2s;
}
.link:hover { transform: scale(1.03); background: #eee; }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
<div class="container">
  <div class="foto"></div>
  <h1>@seu.nome</h1>
  <p>Cílios | Beleza | Autoestima</p>

  <a class="link" href="#">💬 Meu WhatsApp</a>
  <a class="link" href="#">📸 Meu Instagram</a>
  <a class="link" href="#">📍 Onde me encontrar</a>
  <a class="link" href="#">💖 Agendar horário</a>
</div>
<script src="script.js"></script></body>
</html>
