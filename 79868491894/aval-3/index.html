
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #fafafa;
  color: #262626;
}

header {
  background: white;
  padding: 15px;
  border-bottom: 1px solid #ddd;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-family: cursive;
  font-size: 28px;
  font-weight: bold;
}

.container {
  max-width: 600px;
  margin: auto;
}

.stories {
  display: flex;
  padding: 18px;
  background: white;
  border-bottom: 1px solid #ddd;
}

.story {
  text-align: center;
  margin-right: 20px;
}

.story img {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  padding: 3px;
  border: 3px solid #e1306c;
  object-fit: cover;
}

.story p {
  font-size: 12px;
  margin-top: 5px;
}

.post {
  background: white;
  margin-top: 15px;
  border: 1px solid #ddd;
}

.post-header {
  display: flex;
  align-items: center;
  padding: 12px;
  gap: 10px;
}

.post-header img {
  width: 38px;
  height: 38px;
  border-radius: 50%;
}

.post-image {
  width: 100%;
  height: 350px;
  object-fit: cover;
}

.actions {
  padding: 12px;
  font-size: 25px;
}

.actions span {
  cursor: pointer;
  margin-right: 12px;
}

.description {
  padding: 0 12px 15px;
  font-size: 14px;
}

.suggestions {
  background: white;
  margin-top: 15px;
  padding: 18px;
}

.profile {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 18px;
}

.profile img {
  width: 45px;
  height: 45px;
  border-radius: 50%;
}

.profile-info {
  flex: 1;
  margin-left: 10px;
  font-size: 13px;
}

.follow {
  border: none;
  color: #0095f6;
  background: none;
  font-weight: bold;
  cursor: pointer;
}

nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  padding: 15px;
  font-size: 23px;
}

nav a {
  text-decoration: none;
  color: #222;
}

</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header>
  <div class="logo">Instagram</div>
  <div>♡　✉</div>
</header>

<div class="container">

  <!-- STORIES -->
  <section class="stories">
    <div class="story">
      <img src="https://i.pravatar.cc/100?img=12">
      <p>Seu story</p>
    </div>
  </section>

  <!-- POST -->
  <section class="post">
    <div class="post-header">
      <img src="https://i.pravatar.cc/100?img=5">
      <strong>mariana.oficial</strong>
    </div>

    <img class="post-image"
      src="https://picsum.photos/600/500">

    <div class="actions">
      <span onclick="curtir(this)">♡</span>
      <span>💬</span>
      <span>➤</span>
      <span style="float:right">♧</span>
    </div>

    <div class="description">
      <strong>mariana.oficial</strong>
      Um dia especial! ✨❤️
      <p>Ver todos os comentários</p>
    </div>
  </section>

  <!-- SUGESTÕES -->
  <section class="suggestions">
    <strong>Sugestões para você</strong>

    <div class="profile">
      <img src="https://i.pravatar.cc/100?img=20">
      <div class="profile-info">
        <strong>ana.silva</strong>
        <p>Sugerido para você</p>
      </div>
      <button class="follow" onclick="seguir(this)">Seguir</button>
    </div>

    <div class="profile">
      <img src="https://i.pravatar.cc/100?img=33">
      <div class="profile-info">
        <strong>pedro.oliveira</strong>
        <p>Novidade para você</p>
      </div>
      <button class="follow" onclick="seguir(this)">Seguir</button>
    </div>
  </section>

</div>

<!-- ABAS -->
<nav>
  <a href="#">⌂</a>
  <a href="#">⌕</a>
  <a href="#">＋</a>
  <a href="#">▶</a>
  <a href="#">●</a>
</nav>

<script>
function curtir(elemento) {
  elemento.innerHTML =
    elemento.innerHTML === "♡" ? "❤️" : "♡";
}

function seguir(botao) {
  botao.innerText =
    botao.innerText === "Seguir" ? "Seguindo" : "Seguir";
}
</script>

</body>
</html>
