
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Ghost</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>🐍 Snake Ghost 👻</h1>

        <div class="informacoes">
            <div>Pontos: <span id="score">0</span></div>
            <div>Recorde: <span id="recorde">0</span></div>
        </div>

        <div class="game-container">

            <canvas id="game" width="400" height="400"></canvas>

            <!-- Tela inicial -->
            <div id="mensagem" class="overlay">
                <h2>Snake Ghost</h2>
                <p>Coma as frutas e fuja dos fantasmas!</p>
                <button onclick="iniciarJogo()">Iniciar Jogo</button>
            </div>

            <!-- Tela de Game Over -->
            <div id="gameOver" class="overlay escondido">
                <h2>💀 GAME OVER!</h2>

                <p>Sua pontuação:</p>

                <h3 id="pontuacaoFinal">0</h3>

                <button onclick="iniciarJogo()">
                    🔄 Tentar Novamente
                </button>
            </div>

        </div>

        <div class="status">
            👻 Fantasmas: <span id="fantasmas">0</span>
        </div>

        <div class="controles">
            <button onclick="mover('UP')">⬆️</button>

            <div>
                <button onclick="mover('LEFT')">⬅️</button>
                <button onclick="mover('DOWN')">⬇️</button>
                <button onclick="mover('RIGHT')">➡️</button>
            </div>
        </div>

        <p class="instrucoes">
            Use WASD ou as setas do teclado para jogar!
        </p>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
