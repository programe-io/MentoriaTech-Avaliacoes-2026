
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>🐍 Jogo da Cobrinha</h1>

        <div class="pontuacao">
            Pontuação: <span id="score">0</span>
        </div>

        <canvas id="game" width="400" height="400"></canvas>

        <div id="mensagem">
            <h2>Jogo da Cobrinha</h2>
            <p>Pressione iniciar para jogar!</p>
            <button onclick="iniciarJogo()">Iniciar Jogo</button>
        </div>

        <div class="controles">
            <button onclick="mover('UP')">⬆️</button>
            <div>
                <button onclick="mover('LEFT')">⬅️</button>
                <button onclick="mover('DOWN')">⬇️</button>
                <button onclick="mover('RIGHT')">➡️</button>
            </div>
        </div>

        <p class="instrucoes">
            Use as setas do teclado para movimentar a cobrinha.
        </p>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
