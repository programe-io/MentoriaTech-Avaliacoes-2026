
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>🐦 Flappy Bird</h1>

        <div class="pontuacao">
            Pontuação: <span id="score">0</span>
        </div>

        <div class="game-container">
            <canvas id="gameCanvas" width="400" height="600"></canvas>

            <div id="telaInicial" class="overlay">
                <h2>Flappy Bird</h2>
                <p>Toque ou pressione espaço para voar!</p>
                <button onclick="iniciarJogo()">Jogar</button>
            </div>

            <div id="gameOver" class="overlay escondido">
                <h2>Game Over!</h2>
                <p>Sua pontuação: <span id="finalScore">0</span></p>
                <button onclick="iniciarJogo()">Jogar Novamente</button>
            </div>
        </div>

        <p class="instrucoes">
            Pressione ESPAÇO ou clique na tela para voar!
        </p>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
