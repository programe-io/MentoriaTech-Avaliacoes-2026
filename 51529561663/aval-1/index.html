
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gerenciador de Tarefas</title>
                <link rel="stylesheet" href="style.css">
                    <script src="script.js" defer></script>
                    <link href="style.css" rel="stylesheet"></head>
                    <body>
                        <header>
                                <h1>Gerenciador de Tarefas</h1>
                                        <p>Organize suas atividades de forma simples!</p>
                                            </header>

                                                <main>
                                                        <section class="cadastro">
                                                                    <h2>Cadastrar nova tarefa</h2>

                                                                                <form id="formTarefa">
                                                                                                <label for="titulo">Título da tarefa:</label>
                                                                                                                <input
                                                                                                                                    type="text"
                                                                                                                                                        id="titulo"
                                                                                                                                                                            placeholder="Digite uma tarefa (mínimo 5 caracteres)"
                                                                                                                                                                                                required
                                                                                                                                                                                                                >

                                                                                                                                                                                                                                <label for="prioridade">Prioridade:</label>
                                                                                                                                                                                                                                                <select id="prioridade" required>
                                                                                                                                                                                                                                                                    <option value="">Selecione a prioridade</option>
                                                                                                                                                                                                                                                                                        <option value="1">1 - Baixa</option>
                                                                                                                                                                                                                                                                                                            <option value="2">2 - Média</option>
                                                                                                                                                                                                                                                                                                                                <option value="3">3 - Alta</option>
                                                                                                                                                                                                                                                                                                                                                </select>

                                                                                                                                                                                                                                                                                                                                                                <button type="submit">Cadastrar tarefa</button>
                                                                                                                                                                                                                                                                                                                                                                            </form>

                                                                                                                                                                                                                                                                                                                                                                                        <p id="mensagem" role="status"></p>
                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                        <section class="tarefas">
                                                                                                                                                                                                                                                                                                                                                                                                                    <h2>Minhas tarefas</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="listaTarefas">
                                                                                                                                                                                                                                                                                                                                                                                                                                                <p class="vazio">Nenhuma tarefa cadastrada.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Projeto desenvolvido para a aula de JavaScript</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
