<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Gerenciador de Tarefas</title> <link rel="stylesheet" href="style.css"> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head> <body>
<main class="container">

    <h1>Gerenciador de Tarefas</h1>
    <p class="subtitulo">Organize suas tarefas de forma simples</p>

    <section class="formulario">
        <h2>Nova tarefa</h2>

        <form id="formTarefa">

            <div class="campo">
                <label for="titulo">Título da tarefa</label>
                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite a tarefa"
                >
            </div>

            <div class="campo">
                <label for="prioridade">Prioridade</label>
                <select id="prioridade">
                    <option value="">Selecione</option>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>
            </div>

            <button type="submit">Cadastrar tarefa</button>

        </form>

        <p id="mensagem"></p>
    </section>

    <section class="lista">
        <div class="cabecalho-lista">
            <h2>Tarefas cadastradas</h2>
            <span id="contador">0 tarefas</span>
        </div>

        <div id="listaTarefas"></div>
    </section>

</main>

<script src="script.js"></script>

<script src="script.js"></script></body> </html>
