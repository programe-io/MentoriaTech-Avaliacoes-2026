!DOCTYPE html>

<html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Sistema de Estoque</title>

<link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head> <body>

<header class="cabecalho">
    <div class="container">
        <h1>📦 Sistema de Estoque</h1>
        <p>Controle seus produtos de forma simples e rápida.</p>
    </div>
</header>

<main class="container">

    <!-- Cadastro -->
    <section class="card">
        <h2>Cadastrar Produto</h2>

        <form id="formProduto">

            <div class="form-grid">

                <div class="campo">
                    <label for="codigo">Código</label>
                    <input
                        type="text"
                        id="codigo"
                        placeholder="Ex.: P001"
                        required
                    >
                </div>

                <div class="campo campo-descricao">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Nome do produto"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="0"
                        placeholder="0"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input
                        type="number"
                        id="valor"
                        min="0"
                        step="0.01"
                        placeholder="0,00"
                        required
                    >
                </div>

            </div>

            <button type="submit" class="btn btn-primary">
                Cadastrar Produto
            </button>

        </form>

        <div id="mensagem" class="mensagem"></div>
    </section>


    <!-- Lista de produtos -->
    <section class="card">
        <div class="titulo-lista">
            <div>
                <h2>Produtos Cadastrados</h2>
                <p id="totalProdutos">0 produto(s) cadastrado(s)</p>
            </div>
        </div>

        <div class="tabela-container">

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                    <!-- Produtos inseridos pelo JavaScript -->
                </tbody>
            </table>

        </div>

        <div id="estoqueVazio" class="estoque-vazio">
            <span>📦</span>
            <p>Nenhum produto cadastrado.</p>
        </div>

    </section>

</main>

<footer>
    <p>Sistema de Estoque &copy; 2026</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body> </html>
