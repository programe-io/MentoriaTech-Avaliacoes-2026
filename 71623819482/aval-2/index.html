<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="container">
    <header class="cabecalho">
      <div>
        <h1>✅ Minhas Tarefas</h1>
        <p id="dataAtual" class="subtitulo"></p>
      </div>
      <div class="resumo-progresso">
        <span id="contadorProgresso">0 de 0 concluídas</span>
        <div class="barra-progresso">
          <div id="barraPreenchimento" class="barra-preenchimento"></div>
        </div>
      </div>
    </header>

    <!-- Formulário para adicionar tarefa -->
    <form id="formTarefa" class="form-tarefa">
      <input 
        type="text" 
        id="inputTitulo" 
        placeholder="O que precisa ser feito?" 
        required 
        autocomplete="off"
      >
      <select id="inputCategoria" title="Categoria">
        <option value="Trabalho">Trabalho</option>
        <option value="Pessoal">Pessoal</option>
        <option value="Estudos">Estudos</option>
        <option value="Urgente">Urgente</option>
      </select>
      <select id="inputPrioridade" title="Prioridade">
        <option value="baixa">Prioridade Baixa</option>
        <option value="media" selected>Prioridade Média</option>
        <option value="alta">Prioridade Alta</option>
      </select>
      <input type="date" id="inputData" title="Data limite">
      <button type="submit" class="btn-adicionar">+ Adicionar</button>
    </form>

    <!-- Barra de Busca e Filtros -->
    <section class="controles">
      <div class="abas-filtro">
        <button class="aba ativa" data-filtro="todas">Todas</button>
        <button class="aba" data-filtro="pendentes">Pendentes</button>
        <button class="aba" data-filtro="concluidas">Concluídas</button>
      </div>

      <div class="filtros-extras">
        <input type="text" id="inputBusca" placeholder="Buscar tarefa...">
        <select id="filtroPrioridade">
          <option value="">Todas prioridades</option>
          <option value="alta">Alta</option>
          <option value="media">Média</option>
          <option value="baixa">Baixa</option>
        </select>
      </div>
    </section>

    <!-- Lista de Tarefas -->
    <ul id="listaTarefas" class="lista-tarefas">
      <!-- Preenchido via JavaScript -->
    </ul>

    <div id="estadoVazio" class="estado-vazio oculto">
      <p>Nenhuma tarefa encontrada por aqui. 🎉</p>
    </div>

    <!-- Rodapé de ações -->
    <footer class="rodape">
      <span id="itensRestantes">0 tarefas pendentes</span>
      <button id="btnLimparConcluidas" class="btn-limpar">Limpar concluídas</button>
    </footer>
  </main>

  <!-- Modal de Edição -->
  <div id="modalEditar" class="modal-fundo oculto">
    <div class="modal">
      <div class="modal-topo">
        <h3>Editar Tarefa</h3>
        <button type="button" id="btnFecharModal" class="btn-fechar">&times;</button>
      </div>
      <form id="formEditar">
        <input type="hidden" id="editId">
        <div class="campo">
          <label for="editTitulo">Título da tarefa</label>
          <input type="text" id="editTitulo" required>
        </div>
        <div class="campo-duplo">
          <div class="campo">
            <label for="editCategoria">Categoria</label>
            <select id="editCategoria">
              <option value="Trabalho">Trabalho</option>
              <option value="Pessoal">Pessoal</option>
              <option value="Estudos">Estudos</option>
              <option value="Urgente">Urgente</option>
            </select>
          </div>
          <div class="campo">
            <label for="editPrioridade">Prioridade</label>
            <select id="editPrioridade">
              <option value="baixa">Baixa</option>
              <option value="media">Média</option>
              <option value="alta">Alta</option>
            </select>
          </div>
        </div>
        <div class="campo">
          <label for="editData">Data limite</label>
          <input type="date" id="editData">
        </div>
        <div class="modal-acoes">
          <button type="button" id="btnCancelarModal" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-adicionar">Salvar Alterações</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
