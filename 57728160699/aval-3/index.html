<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria da Mizilene</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fce4ec;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #ad1457;
        }

        .galeria {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .galeria img {
            width: 250px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .item {
            background: white;
            padding: 10px;
            border-radius: 15px;
        }

        .item p {
            color: #880e4f;
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

    <h1>Galeria da Mizilene 🐾</h1>

    <div class="galeria">

        <div class="item">
            <img src="https://placecats.com/300/200" alt="Gato">
            <p>🐱 Gato</p>
        </div>

        <div class="item">
            <img src="https://placedog.net/300/200" alt="Cachorro">
            <p>🐶 Cachorro</p>
        </div>

        <div class="item">
            <img src="https://loremflickr.com/300/200/rabbit" alt="Coelho">
            <p>🐰 Coelho</p>
        </div>

    </div>

<script src="script.js"></script></body>
</html>
