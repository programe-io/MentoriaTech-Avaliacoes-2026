<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODA.FEED | Inspiração & Street Style</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Barra Superior -->
    <header class="topbar">
        <div class="container topbar-content">
            <h1 class="logo">MODA<span>.FEED</span></h1>
            
            <div class="filter-pills">
                <button class="pill active" data-filter="todos">Explorar</button>
                <button class="pill" data-filter="streetwear">Streetwear</button>
                <button class="pill" data-filter="alfaiataria">Alfaiataria</button>
                <button class="pill" data-filter="vintage">Vintage</button>
                <button class="pill" data-filter="salvos">Salvos (<span id="saved-count">0</span>)</button>
            </div>

            <button class="btn-new-post" onclick="abrirModalPost()">+ Postar Look</button>
        </div>
    </header>

    <!-- Barra de Stories / Destaques -->
    <section class="stories-bar container">
        <div class="story-item">
            <div class="story-ring"><img src="https://unsplash.com" alt="Perfil"></div>
            <span>@camila.style</span>
        </div>
        <div class="story-item">
            <div class="story-ring"><img src="https://unsplash.com" alt="Perfil"></div>
            <span>@lucas.urbano</span>
        </div>
        <div class="story-item">
            <div class="story-ring"><img src="https://unsplash.com" alt="Perfil"></div>
            <span>@brecho.chic</span>
        </div>
        <div class="story-item">
            <div class="story-ring"><img src="https://unsplash.com" alt="Perfil"></div>
            <span>@spfw.drops</span>
        </div>
    </section>

    <!-- Feed Principal -->
    <main class="feed-container" id="feed-stream">
        <!-- Os posts do feed serão renderizados aqui via JavaScript -->
    </main>

    <!-- Modal para Criar Nova Publicação -->
    <div id="new-post-modal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Compartilhar Novo Look</h3>
                <button class="close-modal" onclick="fecharModalPost()">&times;</button>
            </div>
            <form id="create-post-form">
                <label>Seu @usuário</label>
                <input type="text" id="post-user" placeholder="ex: @seu.estilo" required>

                <label>Categoria</label>
                <select id="post-category">
                    <option value="streetwear">Streetwear</option>
                    <option value="alfaiataria">Alfaiataria</option>
                    <option value="vintage">Vintage</option>
                </select>

                <label>URL da Imagem do Look</label>
                <input type="url" id="post-img" placeholder="https://..." value="https://unsplash.com" required>

                <label>Legenda & Detalhes das Peças</label>
                <textarea id="post-caption" rows="3" placeholder="Conte onde encontrou as peças..." required></textarea>

                <button type="submit" class="btn-submit">Publicar no Feed</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
