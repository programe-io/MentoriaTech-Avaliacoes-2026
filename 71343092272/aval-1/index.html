<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <header>
      <div>
        <p class="eyebrow">ORGANIZAÇÃO PESSOAL</p>
        <h1>Gerenciador de Tarefas</h1>
        <p class="subtitle">Planeje seu dia e acompanhe seu progresso.</p>
      </div>
      <div class="progress-card">
        <span id="progressText">0% concluído</span>
        <div class="progress-bar"><div id="progressFill"></div></div>
      </div>
    </header>

    <section class="task-form">
      <input id="taskInput" type="text" placeholder="Digite uma nova tarefa..." maxlength="120">
      <select id="priorityInput" aria-label="Prioridade">
        <option value="baixa">Baixa</option>
        <option value="media" selected>Média</option>
        <option value="alta">Alta</option>
      </select>
      <button id="addButton">Adicionar</button>
    </section>

    <section class="toolbar">
      <div class="filters">
        <button class="filter active" data-filter="todas">Todas</button>
        <button class="filter" data-filter="pendentes">Pendentes</button>
        <button class="filter" data-filter="concluidas">Concluídas</button>
      </div>
      <button id="clearCompleted" class="ghost">Limpar concluídas</button>
    </section>

    <section id="taskList" class="task-list"></section>
    <div id="emptyState" class="empty hidden">
      <div class="empty-icon">✓</div>
      <h2>Nenhuma tarefa encontrada</h2>
      <p>Adicione uma tarefa para começar.</p>
    </div>
  </main>

  <template id="taskTemplate">
    <article class="task">
      <label class="check-wrap">
        <input type="checkbox" class="task-check">
        <span class="custom-check"></span>
      </label>
      <div class="task-content">
        <span class="task-title"></span>
        <span class="priority"></span>
      </div>
      <button class="delete" title="Excluir tarefa">×</button>
    </article>
  </template>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
