
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Controle de IMC</title>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

            <body>

                <main class="container">

                        <header class="cabecalho">
                                    <div class="icone">✚</div>
                                                <h1>CONTROLE DE IMC</h1>
                                                            <p>SAÚDE E BEM-ESTAR</p>
                                                                        <span>Cuide da sua saúde com informação</span>
                                                                                </header>

                                                                                        <section class="formulario">

                                                                                                    <h2 id="tituloFormulario">Dados do paciente</h2>

                                                                                                                <p class="descricao">
                                                                                                                                Preencha os campos abaixo para calcular o IMC.
                                                                                                                                            </p>

                                                                                                                                                        <label for="nome">Nome do paciente</label>
                                                                                                                                                                    <input type="text" id="nome" placeholder="Digite seu nome">

                                                                                                                                                                                <label for="idade">Idade (anos)</label>
                                                                                                                                                                                            <input type="number" id="idade" placeholder="Ex: 25" min="1">

                                                                                                                                                                                                        <div class="campos">

                                                                                                                                                                                                                        <div>
                                                                                                                                                                                                                                            <label for="peso">Peso (kg)</label>
                                                                                                                                                                                                                                                                <input type="text" id="peso"
                                                                                                                                                                                                                                                                                        inputmode="decimal" placeholder="Ex: 70">
                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                        <div>
                                                                                                                                                                                                                                                                                                                                            <label for="altura">Altura (m ou cm)</label>
                                                                                                                                                                                                                                                                                                                                                                <input type="text" id="altura"
                                                                                                                                                                                                                                                                                                                                                                                        inputmode="decimal" placeholder="Ex: 1.70">
                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                <button
                                                                                                                                                                                                                                                                                                                                                                                                                                                type="button"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                id="botaoCadastrar"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                class="btn-cadastrar"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                onclick="calcularIMC()">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                CADASTRAR PACIENTE →

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        type="button"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        id="botaoCancelar"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        class="btn-cancelar"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        onclick="cancelarEdicao()"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        style="display:none;">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        CANCELAR EDIÇÃO

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <section id="resultado" class="resultado"></section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <section class="lista-container">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="lista-cabecalho">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h2>Pacientes cadastrados</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span id="contador">0 pacientes</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="listaPacientes">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p class="vazio">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Nenhum paciente cadastrado ainda.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>CONTROLE DE IMC</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span>Seu bem-estar é importante.</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
