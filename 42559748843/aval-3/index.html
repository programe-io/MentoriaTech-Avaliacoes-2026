<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  
<div class="container">
  <header>
    <h1>📚 Biblioteca Escolar</h1>
    <p>Sistema de cadastro e gerenciamento de livros</p>
  </header>

  <section class="resumo">
    <div class="card-resumo">
      <span>Livros cadastrados</span>
      <h2 id="totalLivros">0</h2>
    </div>
  </section>

  <section class="painel">
    <h2>➕ Cadastrar novo livro</h2>

    <div class="campo">
      <label>Nome do livro</label>
      <input type="text" id="titulo" placeholder="Digite o título do livro">
    </div>

    <div class="campo">
      <label>Autor</label>
      <input type="text" id="autor" placeholder="Digite o nome do autor">
    </div>

    <div class="campo">
      <label>Categoria</label>
      <select id="categoria">
        <option value="">Selecione uma categoria</option>
        <option>Romance</option>
        <option>Ficção</option>
        <option>Fantasia</option>
        <option>Suspense</option>
        <option>História</option>
        <option>Ciências</option>
        <option>Outros</option>
      </select>
    </div>

    <div class="campo">
      <label>Quantidade de exemplares</label>
      <input type="number" id="quantidade" min="1" placeholder="Ex: 5">
    </div>

    <button type="button" onclick="cadastrarLivro()">
      Cadastrar livro
    </button>

    <p id="mensagem"></p>
  </section>

  <section class="painel">
    <h2>📖 Livros da biblioteca</h2>

    <input
      type="text"
      id="pesquisa"
      placeholder="Pesquisar por título ou autor..."
      oninput="listarLivros()"
    >

    <div id="listaLivros">
      <p class="vazio">Nenhum livro cadastrado.</p>
    </div>
  </section>

  <footer>
    Sistema de Biblioteca Escolar • 2026
  </footer>
</div>

  <script src="script.js"></script>
  
</body>
</html>
