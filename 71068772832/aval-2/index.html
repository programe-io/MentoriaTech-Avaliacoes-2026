<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-cookie/3.0.5/js.cookie.min.js" integrity="sha512-nlp9/l96/EpjYBx7EP7pGASVXNe80hGhYAUrjeXnu/fyF5Py0/RXav4BBNs7n5Hx1WFhOEOWSAVjGeC3oKxDVQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>
   <div class="principal">
    <h1>-Formulario de Sing Up-</h1>
    <div class="formulario">
        <form  id="cadastro">

            <div class="campo">
                <label for="nome">Digite o seu Nome:</label>
                <input type="text" id="nome" placeholder="Ex: Maria da Silva">
            </div>
            <div class="campo">
                <label for="e-mail">Digite o seu E-mail:</label>
                <input type="e-mail" id="email" placeholder="Ex: Mariadasilva@gmail.com">
            </div>
            <div class="campo">
                <label for="idade">Digite o seu Nome:</label>
                <input type="number" id="idade" placeholder="Ex: 18">
            </div>
            <div class="campo">
                <label for="telefone">Digite o seu Telefone:</label>
                <input type="tel" id="telefone" placeholder="Ex: (89)98100-2345">
            </div>

            <div class="campo">
                <label for="senha"> Digite sua senha: </label>
                <input type="password" id="senha">
            </div>

            <div class="btn">
                <input type="Submit" value="Faça seu Cadatro">
            </div>

       </form>
<script src="script.js"></script></body>
</html>
