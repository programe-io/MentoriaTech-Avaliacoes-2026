```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AulaPlay - Aulas & Quizzes</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="logo">
            Aula<span>Play</span> 🎓
        </div>

        <button onclick="openLessonModal()">
            + Nova Aula
        </button>
    </header>


    <main class="container">

        <!-- DASHBOARD -->
        <section class="dashboard">

            <div class="card">
                <h3>Total de aulas</h3>
                <strong id="totalLessons">0</strong>
            </div>

            <div class="card">
                <h3>Aulas concluídas</h3>
                <strong id="completedLessons">0</strong>
            </div>

            <div class="card">
                <h3>Quizzes realizados</h3>
                <strong id="quizCount">0</strong>
            </div>

            <div class="card">
                <h3>Média dos quizzes</h3>
                <strong id="averageScore">0%</strong>
            </div>

        </section>


        <!-- PESQUISA -->
        <section class="search-area">

            <input
                type="text"
                id="search"
                placeholder="🔎 Pesquisar aula..."
                oninput="renderLessons()"
            >

            <select
                id="filter"
                onchange="renderLessons()"
            >
                <option value="all">
                    Todas as disciplinas
                </option>

                <option value="Matemática">
                    Matemática
                </option>

                <option value="Português">
                    Português
                </option>

                <option value="História">
                    História
                </option>

                <option value="Geografia">
                    Geografia
                </option>

                <option value="Ciências">
                    Ciências
                </option>

                <option value="Programação">
                    Programação
                </option>
            </select>

        </section>


        <!-- LISTA DE AULAS -->
        <h2 class="section-title">
            📚 Minhas aulas
        </h2>

        <section
            class="lessons"
            id="lessons">
        </section>

    </main>


    <!-- MODAL DE NOVA AULA -->
    <div
        class="modal"
        id="lessonModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    📚 Cadastrar nova aula
                </h2>

                <span
                    class="close"
                    onclick="closeLessonModal()">
                    ×
                </span>

            </div>


            <div class="form-group">

                <label>
                    Título da aula
                </label>

                <input
                    id="lessonTitle"
                    placeholder="Ex.: Função Quadrática">

            </div>


            <div class="form-group">

                <label>
                    Disciplina
                </label>

                <input
                    id="lessonSubject"
                    placeholder="Ex.: Matemática">

            </div>


            <div class="form-group">

                <label>
                    Link do YouTube
                </label>

                <input
                    id="lessonUrl"
                    placeholder="https://www.youtube.com/watch?v=...">

            </div>


            <div class="form-group">

                <label>
                    Descrição
                </label>

                <textarea
                    id="lessonDescription"
                    placeholder="Digite uma breve descrição da aula...">
                </textarea>

            </div>


            <button
                class="btn btn-primary"
                onclick="addLesson()">

                Salvar aula

            </button>

        </div>

    </div>


    <!-- MODAL DO QUIZ -->
    <div
        class="modal"
        id="quizModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="quizTitle">
                    🧠 Quiz
                </h2>

                <span
                    class="close"
                    onclick="closeQuiz()">
                    ×
                </span>

            </div>


            <div id="quizContent"></div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
```
