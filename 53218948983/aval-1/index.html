<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Produtos</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Gerenciamento de Produtos</h1>
        <p>Cadastre e gerencie os produtos do seu estoque.</p>
    </header>

    <main>

        <!-- Cadastro de produtos -->
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formCadastro">
                <div class="campo">
                    <label for="descricao">Descrição do produto</label>
                    <input
                        type="text"
                        id="descricao"
                        name="descricao"
                        placeholder="Ex.: Cadeira Gamer"
                        required
                        minlength="5"
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        placeholder="Digite a quantidade"
                        min="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input
                        type="number"
                        id="valor"
                        name="valor"
                        placeholder="Ex.: 699.00"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Lista de produtos -->
        <section class="card">
            <h2>Produtos Cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Os produtos serão inseridos pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Atualizar valor -->
        <section class="card">
            <h2>Atualizar Valor do Produto</h2>

            <form id="formAtualizarValor">
                <div class="campo">
                    <label for="codigoValor">Código do produto</label>
                    <input
                        type="number"
                        id="codigoValor"
                        name="codigoValor"
                        placeholder="Digite o código"
                        min="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">Novo valor (R$)</label>
                    <input
                        type="number"
                        id="novoValor"
                        name="novoValor"
                        placeholder="Digite o novo valor"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit">Atualizar Valor</button>
            </form>
        </section>

        <!-- Atualizar quantidade -->
        <section class="card">
            <h2>Adicionar ao Estoque</h2>

            <form id="formAtualizarQuantidade">
                <div class="campo">
                    <label for="codigoQuantidade">Código do produto</label>
                    <input
                        type="number"
                        id="codigoQuantidade"
                        name="codigoQuantidade"
                        placeholder="Digite o código"
                        min="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="novaQuantidade">Quantidade a adicionar</label>
                    <input
                        type="number"
                        id="novaQuantidade"
                        name="novaQuantidade"
                        placeholder="Digite a quantidade"
                        min="1"
                        required
                    >
                </div>

                <button type="submit">Adicionar Quantidade</button>
            </form>
        </section>

        <!-- Mensagens do sistema -->
        <div id="mensagem" role="status" aria-live="polite"></div>

    </main>

    <footer>
        <p>&copy; 2026 - Sistema de Gerenciamento de Produtos</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
