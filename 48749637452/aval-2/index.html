<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header>

    <div class="logo">MiniFeed</div>

    <input
        type="text"
        class="pesquisa"
        id="pesquisa"
        placeholder="Pesquisar..."
        onkeyup="pesquisar()"
    >

    <div class="menu">
        <span>⌂</span>
        <span>♡</span>
        <span>✉</span>
        <span>👤</span>
    </div>

</header>


<main>

    <!-- STORIES -->

    <section class="stories">

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=1">
            <p>Lucas</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=2">
            <p>Ana</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=3">
            <p>Pedro</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=4">
            <p>Julia</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=5">
            <p>Marcos</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=6">
            <p>Maria</p>
        </div>

    </section>


    <!-- POST 1 -->

    <article class="post">

        <div class="post-header">

            <div class="usuario">
                <img
                    class="avatar"
                    src="https://i.pravatar.cc/100?img=12"
                >

                <span>joaosilva</span>
            </div>

            <button
                class="seguir"
                onclick="seguir(this)"
            >
                Seguir
            </button>

        </div>


        <img
            class="post-imagem"
            src="https://picsum.photos/700/700?random=10"
        >


        <div class="acoes">

            <div class="acoes-esquerda">

                <span
                    class="icone"
                    onclick="curtir(this)"
                >
                    ♡
                </span>

                <span class="icone">
                    💬
                </span>

                <span class="icone">
                    ➤
                </span>

            </div>

            <span class="icone">
                🔖
            </span>

        </div>


        <div class="legenda">

            <strong>
                joaosilva
            </strong>

            Um dia incrível! 🌅
            Aproveitando cada momento.

        </div>

        <div class="comentarios">
            Ver todos os comentários
        </div>


        <div class="comentario-area">

            <input
                type="text"
                placeholder="Adicione um comentário..."
                id="comentario1"
            >

            <button
                onclick="comentar('comentario1', 'comentarios1')"
            >
                Publicar
            </button>

        </div>

        <div
            class="comentarios"
            id="comentarios1"
        ></div>

    </article>


    <!-- POST 2 -->

    <article class="post">

        <div class="post-header">

            <div class="usuario">

                <img
                    class="avatar"
                    src="https://i.pravatar.cc/100?img=20"
                >

                <span>carolzinha</span>

            </div>

            <button
                class="seguir"
                onclick="seguir(this)"
            >
                Seguir
            </button>

        </div>


        <img
            class="post-imagem"
            src="https://picsum.photos/700/700?random=20"
        >


        <div class="acoes">

            <div class="acoes-esquerda">

                <span
                    class="icone"
                    onclick="curtir(this)"
                >
                    ♡
                </span>

                <span class="icone">
                    💬
                </span>

                <span class="icone">
                    ➤
                </span>

            </div>

            <span class="icone">
                🔖
            </span>

        </div>


        <div class="legenda">

            <strong>
                carolzinha
            </strong>

            Explorando novos lugares ✨
            Qual seria o seu destino?

        </div>

        <div class="comentarios">
            Ver todos os comentários
        </div>


        <div class="comentario-area">

            <input
                type="text"
                placeholder="Adicione um comentário..."
                id="comentario2"
            >

            <button
                onclick="comentar('comentario2', 'comentarios2')"
            >
                Publicar
            </button>

        </div>

        <div
            class="comentarios"
            id="comentarios2"
        ></div>

    </article>

</main>


<script>

    // CURTIR POST
    function curtir(elemento) {

        if (elemento.classList.contains("curtido")) {

            elemento.classList.remove("curtido");
            elemento.innerHTML = "♡";

        } else {

            elemento.classList.add("curtido");
            elemento.innerHTML = "♥";

        }
    }


    // SEGUIR USUÁRIO
    function seguir(botao) {

        if (botao.classList.contains("seguindo")) {

            botao.classList.remove("seguindo");
            botao.innerText = "Seguir";

        } else {

            botao.classList.add("seguindo");
            botao.innerText = "Seguindo";

        }
    }


    // COMENTAR
    function comentar(inputId, comentariosId) {

        const input =
            document.getElementById(inputId);

        const area =
            document.getElementById(comentariosId);

        const texto =
            input.value.trim();

        if (texto === "") {
            alert("Digite um comentário.");
            return;
        }

        const novoComentario =
            document.createElement("p");

        novoComentario.innerHTML =
            "<strong>Você:</strong> " + texto;

        novoComentario.style.marginTop = "8px";
        novoComentario.style.color = "#333";

        area.appendChild(novoComentario);

        input.value = "";
    }


    // PESQUISA
    function pesquisar() {

        const pesquisa =
            document
            .getElementById("pesquisa")
            .value
            .toLowerCase();

        const posts =
            document.querySelectorAll(".post");

        posts.forEach(function(post) {

            const texto =
                post.innerText.toLowerCase();

            if (texto.includes(pesquisa)) {

                post.style.display = "block";

            } else {

                post.style.display = "none";

            }

        });
    }

</script>

  
  
</body>
</html>
