<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show do Milhão</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="quiz-container">
        <header>
            <h1>💰 SHOW DO MILHÃO</h1>
            <div class="placar-container">
                <div class="item-placar">Acertar: <span id="val-acerto">R$ 1.000</span></div>
                <div class="item-placar destaque">Parar: <span id="val-parar">R$ 0</span></div>
                <div class="item-placar alerta">Errar: <span id="val-erro">R$ 0</span></div>
            </div>
        </header>

        <!-- Botões de Ajuda -->
        <div class="ajudas-container" id="ajudas-container">
            <button id="btn-pular" class="btn-ajuda">⏭️ Pular (<span id="pulos-restantes">3</span>)</button>
            <button id="btn-eliminar" class="btn-ajuda">🎴 Cartas (Eliminar 2)</button>
            <button id="btn-parar" class="btn-parar">🛑 Parar e Levar</button>
        </div>

        <main id="area-quiz">
            <h2 id="pergunta">Carregando pergunta...</h2>
            
            <div id="caixa-opcoes" class="grid-opcoes">
                <!-- Botões das alternativas são gerados via JavaScript -->
            </div>
        </main>

        <!-- Tela de Fim de Jogo -->
        <div id="tela-fim" class="escondido">
            <h2 id="mensagem-fim">Fim de Jogo!</h2>
            <p id="premio-final">Prêmio: R$ 0</p>
            <button id="btn-reiniciar" class="btn-reiniciar">Jogar Novamente 🔄</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
