<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Jogo da Memória</h1>
        <p>Encontre todos os pares no menor número de jogadas!</p>
    </header>

    <main class="container-jogo">
        <div class="painel-info">
            <div class="status-item">
                <span>Jogadas:</span>
                <strong id="contador-jogadas">0</strong>
            </div>
            <div class="status-item">
                <span>Pares:</span>
                <strong id="contador-pares">0 / 8</strong>
            </div>
        </div>

        <p id="status-jogo">Clique em uma carta para começar!</p>

        <div class="tabuleiro-memoria" id="tabuleiro">
            <!-- Gerado dinamicamente pelo JS -->
        </div>

        <button id="btn-reiniciar">Novo Jogo</button>
    </main>

    <footer>
        <p>&copy; 2026 Jogo da Memória. Desenvolvido em JavaScript Vanilla.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
