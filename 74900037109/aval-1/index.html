<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
</head>
<body>

    <header>
        <h1>Controle de Estoque</h1>
        <button type="button" onclick="exportarCSV()">Exportar CSV</button>
        <button type="button" onclick="limparTudo()">Limpar Tudo</button>
    </header>

    <hr>

    <section>
        <h2>Resumo</h2>
        <p>Total de Produtos: <strong id="stat-produtos">0</strong></p>
        <p>Itens em Estoque: <strong id="stat-itens">0</strong></p>
        <p>Valor Total: <strong id="stat-valor">R$ 0,00</strong></p>
        <p>Alertas (Estoque Baixo/Zerado): <strong id="stat-alertas">0</strong></p>
    </section>

    <hr>

    <section>
        <h2 id="form-title">Cadastrar Produto</h2>
        <form id="produto-form">
            <input type="hidden" id="produto-id">

            <div>
                <label for="codigo">Código:</label><br>
                <input type="text" id="codigo" required>
            </div><br>

            <div>
                <label for="nome">Nome do Produto:</label><br>
                <input type="text" id="nome" required>
            </div><br>

            <div>
                <label for="categoria">Categoria:</label><br>
                <input type="text" id="categoria" required>
            </div><br>

            <div>
                <label for="quantidade">Quantidade:</label><br>
                <input type="number" id="quantidade" min="0" value="1" required>
            </div><br>

            <div>
                <label for="minimo">Estoque Mínimo:</label><br>
                <input type="number" id="minimo" min="0" value="5" required>
            </div><br>

            <div>
                <label for="preco">Preço Unitário (R$):</label><br>
                <input type="number" id="preco" step="0.01" min="0" required>
            </div><br>

            <button type="submit" id="btn-submit">Salvar</button>
            <button type="button" id="btn-cancelar" hidden onclick="cancelarEdicao()">Cancelar</button>
        </form>
    </section>

    <hr>

    <section>
        <h2>Produtos</h2>
        <div>
            <input type="text" id="busca" placeholder="Buscar produto..." oninput="renderizarTabela()">
            <select id="filtro-status" onchange="renderizarTabela()">
                <option value="todos">Todos</option>
                <option value="ok">Normal</option>
                <option value="baixo">Estoque Baixo</option>
                <option value="zerado">Sem Estoque</option>
            </select>
        </div>
        <br>

        <table border="1" cellpadding="8" cellspacing="0" width="100%">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Produto
  <script src="script.js"></script>
  
</body>
</html>
