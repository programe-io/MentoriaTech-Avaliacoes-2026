<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
<link href="style.css" rel="stylesheet"></head>
<body>

  <main>
    <header>
      <h1>Gerenciador de Tarefas</h1>
      <p>Organize suas atividades diárias de forma simples.</p>
    </header>

    <section aria-label="Adicionar nova tarefa">
      <form id="form-tarefa">
        <label for="titulo-tarefa">Tarefa:</label>
        <input type="text" id="titulo-tarefa" name="titulo" placeholder="Ex: Estudar HTML semântico" required>

        <label for="prioridade-tarefa">Prioridade:</label>
        <select id="prioridade-tarefa" name="prioridade">
          <option value="baixa">Baixa</option>
          <option value="media" selected>Média</option>
          <option value="alta">Alta</option>
        </select>

        <label for="data-tarefa">Prazo:</label>
        <input type="date" id="data-tarefa" name="data">

        <button type="submit">Adicionar Tarefa</button>
      </form>
    </section>

    <hr>

    <section aria-label="Filtros">
      <fieldset>
        <legend>Filtrar tarefas</legend>
        <label><input type="radio" name="filtro" value="todas" checked> Todas</label>
        <label><input type="radio" name="filtro" value="pendentes"> Pendentes</label>
        <label><input type="radio" name="filtro" value="concluidas"> Concluídas</label>
      </fieldset>
    </section>

    <hr>

    <section aria-label="Lista de tarefas">
      <h2>Minhas Tarefas</h2>
      <ul>
        <li>
          <input type="checkbox" id="tarefa-1">
          <label for="tarefa-1"><strong>[Alta]</strong> Revisar estrutura do projeto — <time datetime="2026-11-25">25/11/2026</time></label>
          <button type="button" aria-label="Excluir tarefa">Excluir</button>
        </li>
        <li>
          <input type="checkbox" id="tarefa-2" checked>
          <label for="tarefa-2"><del><strong>[Média]</strong> Enviar relatório semanal — <time datetime="2026-11-24">24/11/2026</time></del></label>
          <button type="button" aria-label="Excluir tarefa">Excluir</button>
        </li>
        <li>
          <input type="checkbox" id="tarefa-3">
          <label for="tarefa-3"><strong>[Baixa]</strong> Organizar arquivos da pasta downloads</label>
          <button type="button" aria-label="Excluir tarefa">Excluir</button>
        </li>
      </ul>
    </section>

    <hr>

    <footer>
      <p>Total: 3 tarefas | Concluídas: 1 | Pendentes: 2</p>
      <button type="button">Limpar tarefas concluídas</button>
    </footer>
  </main>

<script src="script.js"></script></body>
</html>
