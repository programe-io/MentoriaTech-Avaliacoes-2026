
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Controle de Estoque</h1>
        <p>Gerenciamento de produtos</p>
    </header>

    <main>
        <section class="dashboard">

            <div class="card">
                <h3>Produtos cadastrados</h3>
                <p id="totalProdutos">0</p>
            </div>

            <div class="card">
                <h3>Unidades em estoque</h3>
                <p id="totalUnidades">0</p>
            </div>

            <div class="card">
                <h3>Valor do estoque</h3>
                <p id="valorEstoque">R$ 0,00</p>
            </div>

            <div class="card">
                <h3>Estoque baixo</h3>
                <p id="estoqueBaixo">0</p>
            </div>

        </section>

        <section class="cadastro">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">

                <input type="text" id="nome"
                    placeholder="Nome do produto" required>

                <input type="text" id="categoria"
                    placeholder="Categoria" required>

                <input type="number" id="quantidade"
                    placeholder="Quantidade" min="0" step="1" required>

                <input type="number" id="preco"
                    placeholder="Preço (R$)" min="0" step="0.01" required>

                <button type="submit">Cadastrar produto</button>

            </form>
        </section>

        <section class="estoque">
            <h2>Produtos em estoque</h2>

            <input type="text" id="pesquisa"
                placeholder="Pesquisar produto...">

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
