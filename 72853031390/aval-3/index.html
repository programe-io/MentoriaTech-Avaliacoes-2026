

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="game-container">

        <header>
            <h1>JOGO DA <span>VELHA</span></h1>
            <p class="subtitle">Escolha seu modo de jogo</p>
        </header>

        <!-- MODOS -->
        <div class="mode-selector">
            <button id="modeCPU" class="mode-btn active" onclick="setMode('cpu')">
                🤖 P1 vs CPU
            </button>

            <button id="modePVP" class="mode-btn" onclick="setMode('pvp')">
                👥 P1 vs P2
            </button>
        </div>

        <!-- DIFICULDADE -->
        <div class="difficulty" id="difficultyBox">
            <label for="difficultySelect">Dificuldade da CPU</label>

            <select id="difficultySelect" onchange="changeDifficulty()">
                <option value="easy">Fácil</option>
                <option value="medium">Médio</option>
                <option value="hard">Impossível</option>
            </select>
        </div>

        <!-- PLACAR -->
        <div class="scoreboard">

            <div class="player player-x active" id="playerX">
                <span class="symbol">X</span>
                <span class="player-name" id="nameX">Jogador 1</span>
                <span class="score" id="scoreX">0</span>
            </div>

            <div class="player player-o" id="playerO">
                <span class="symbol">O</span>
                <span class="player-name" id="nameO">CPU</span>
                <span class="score" id="scoreO">0</span>
            </div>

        </div>

        <!-- STATUS -->
        <div class="status" id="status">
            Vez do jogador X
        </div>

        <!-- TABULEIRO -->
        <div class="board" id="board">

            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>

        </div>

        <!-- BOTÕES -->
        <div class="buttons">

            <button class="restart-btn" onclick="restartGame()">
                ↻ Nova partida
            </button>

            <button class="reset-score-btn" onclick="resetScore()">
                Zerar placar
            </button>

        </div>

        <footer>
            Jogo da Velha • Divirta-se!
        </footer>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
