
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Bloco de Notas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="app">

        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">✎</span>
                <h1>Notas</h1>
            </div>

            <button class="new-note-btn" onclick="createNote()">
                + Nova Nota
            </button>

            <div class="search-box">
                <input
                    type="text"
                    id="search"
                    placeholder="Buscar notas..."
                    oninput="renderNotes()"
                >
            </div>

            <div class="notes-list" id="notesList"></div>

            <div class="sidebar-footer">
                Todas as notas são salvas automaticamente.
            </div>
        </aside>

        <main class="editor">

            <div class="editor-header">
                <span id="saveStatus">Todas as alterações salvas</span>

                <button class="delete-btn" onclick="deleteNote()">
                    🗑 Excluir
                </button>
            </div>

            <div class="editor-content" id="editorContent">
                <input
                    type="text"
                    id="noteTitle"
                    placeholder="Título da nota..."
                >

                <div class="note-date" id="noteDate"></div>

                <textarea
                    id="noteText"
                    placeholder="Comece a escrever aqui..."
                ></textarea>
            </div>

            <div class="empty-state" id="emptyState">
                <div class="empty-icon">📝</div>
                <h2>Seu espaço de ideias</h2>
                <p>Crie uma nota para começar a escrever.</button>
                <button onclick="createNote()">Criar minha primeira nota</button>
            </div>

        </main>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
