
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitStock | Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>FIT<span>STOCK</span></h1>
    <p>CONTROLE DE ESTOQUE FITNESS</p>
</header>

<main>
    <section class="dashboard">
        <div class="card">
            <h3>Total de produtos</h3>
            <p id="totalProdutos">0</p>
        </div>

        <div class="card">
            <h3>Unidades em estoque</h3>
            <p id="totalUnidades">0</p>
        </div>

        <div class="card">
            <h3>Estoque baixo</h3>
            <p id="estoqueBaixo">0</p>
        </div>

        <div class="card">
            <h3>Valor em estoque</h3>
            <p id="valorEstoque">R$ 0,00</p>
        </div>
    </section>

    <section class="formulario">
        <h2>Cadastrar produto</h2>

        <form id="formProduto">
            <input type="text" id="nome"
                placeholder="Nome do produto" required>

            <select id="categoria" required>
                <option value="">Categoria</option>
                <option>Suplementos</option>
                <option>Roupas Fitness</option>
                <option>Acessórios</option>
                <option>Equipamentos</option>
            </select>

            <input type="number" id="preco"
                placeholder="Preço (R$)" min="0.01"
                step="0.01" required>

            <input type="number" id="quantidade"
                placeholder="Quantidade" min="0" required>

            <button type="submit">Adicionar produto</button>
        </form>
    </section>

    <section class="estoque">
        <h2>Produtos em estoque</h2>

        <input type="text" id="pesquisa"
            placeholder="Pesquisar produto...">

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos"></tbody>
            </table>
        </div>
    </section>
</main>

<footer>
    <p>FITSTOCK © 2026 - Sistema de Controle de Estoque</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
