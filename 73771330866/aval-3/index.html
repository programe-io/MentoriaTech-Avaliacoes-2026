
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Ficha de Anamnese - IMC</title>
                <link rel="stylesheet" href="style.css">
                    <script src="script.js" defer></script>
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                    <body>

                        <main class="container">

                                <header>
                                            <h1>Ficha de Anamnese</h1>
                                                        <p>Cadastro e controle de Índice de Massa Corporal</p>
                                                                </header>

                                                                        <section class="formulario">
                                                                                    <h2>Cadastrar paciente</h2>

                                                                                                <form id="form-pessoa">

                                                                                                                <div class="campo">
                                                                                                                                    <label for="nome">Nome completo:</label>
                                                                                                                                                        <input type="text" id="nome" placeholder="Digite o nome">
                                                                                                                                                                        </div>

                                                                                                                                                                                        <div class="campo">
                                                                                                                                                                                                            <label for="idade">Idade:</label>
                                                                                                                                                                                                                                <input type="number" id="idade" placeholder="Ex: 30">
                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                <div class="campo">
                                                                                                                                                                                                                                                                                    <label for="altura">Altura (metros):</label>
                                                                                                                                                                                                                                                                                                        <input type="number" id="altura"
                                                                                                                                                                                                                                                                                                                                placeholder="Ex: 1.70" step="0.01">
                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                <div class="campo">
                                                                                                                                                                                                                                                                                                                                                                                    <label for="peso">Peso (kg):</label>
                                                                                                                                                                                                                                                                                                                                                                                                        <input type="number" id="peso"
                                                                                                                                                                                                                                                                                                                                                                                                                                placeholder="Ex: 65" step="0.1">
                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p id="erro" class="erro" hidden></p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button type="submit">Salvar paciente</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <section class="tabela">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h2>Pacientes cadastrados</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="tabela-responsiva">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Código</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <th>Nome</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Idade</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <th>Altura</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Peso</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <th>IMC</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <th>Classificação</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <th>Ação</th>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </thead>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <tbody id="tabela-pessoas"></tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p id="vazio">Nenhum paciente cadastrado.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Projeto Ficha de Anamnese - Controle de IMC</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
