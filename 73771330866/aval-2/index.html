
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <header>
            <h1>Gerenciador de Tarefas</h1>
            <p>Organize suas atividades de forma simples.</p>
        </header>

        <section class="painel">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">
                <label for="titulo">Título da tarefa:</label>
                <input type="text" id="titulo"
                    placeholder="Digite sua tarefa" required>

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade" required>
                    <option value="">Selecione</option>
                    <option value="1">1 - Alta</option>
                    <option value="2">2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit">Cadastrar tarefa</button>
            </form>

            <p id="mensagem"></p>
        </section>

        <section class="painel">
            <h2>Minhas tarefas</h2>

            <label for="filtroStatus">Filtrar tarefas:</label>
            <select id="filtroStatus">
                <option value="todas">Todas</option>
                <option value="andamento">Em andamento</option>
                <option value="concluidas">Concluídas</option>
            </select>

            <div id="listaTarefas"></div>
        </section>

        <section class="painel">
            <h2>Buscar tarefa</h2>

            <form id="formBusca">
                <input type="number" id="codigoBusca"
                    placeholder="Digite o código" min="1" required>
                <button type="submit">Buscar</button>
            </form>

            <div id="resultadoBusca"></div>
        </section>
    </main>

<script src="script.js"></script></body>
</html>
