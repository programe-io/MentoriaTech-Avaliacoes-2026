
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Controle de produtos e quantidades</p>
    </header>

    <main>
        <section class="resumo">
            <div class="card">
                <h3>Produtos cadastrados</h3>
                <p id="totalProdutos">0</p>
            </div>

            <div class="card">
                <h3>Unidades em estoque</h3>
                <p id="totalUnidades">0</p>
            </div>

            <div class="card">
                <h3>Valor total</h3>
                <p id="valorEstoque">R$ 0,00</p>
            </div>
        </section>

        <section class="container">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">
                <label>Descrição:</label>
                <input type="text" id="descricao"
                    placeholder="Nome do produto" required>

                <label>Quantidade:</label>
                <input type="number" id="quantidade"
                    placeholder="Quantidade" min="1" step="1" required>

                <label>Valor:</label>
                <input type="number" id="valor"
                    placeholder="Valor do produto" min="0"
                    step="0.01" required>

                <button type="submit">Cadastrar Produto</button>
            </form>
        </section>

        <section class="container">
            <h2>Produtos cadastrados</h2>

            <input type="search" id="busca"
                placeholder="Buscar produto...">

            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
