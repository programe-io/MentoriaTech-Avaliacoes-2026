
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futebol</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101820;
      color: white;
    }

    .bloco-futebol {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
      text-align: center;
      background: #1c2b24;
      border-radius: 15px;
      box-shadow: 0 5px 20px #0008;
    }

    .bloco-futebol img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 10px;
    }

    h1 {
      color: #55ff88;
    }

    button {
      padding: 12px 22px;
      background: #20c45a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #159642;
    }

    #mensagem {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>
  <div class="bloco-futebol">
    <h1>⚽ Mundo do Futebol</h1>

    <img
      src="https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=1000&q=80"
      alt="Campo de futebol"
    >

    <h2>Paixão pelo futebol</h2>
    <p>Entre em campo e viva a emoção do jogo!</p>

    <button onclick="mostrarMensagem()">
      Vamos jogar!
    </button>

    <p id="mensagem"></p>
  </div>

  <script>
    function mostrarMensagem() {
      document.getElementById("mensagem").textContent =
        "⚽ O jogo começou! Boa sorte!";
    }
  </script>
<script src="script.js"></script></body>
</html>
