
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Calculadora de IMC</h1>

        <div class="card">

            <h2>Nova pessoa</h2>

            <form id="formulario">

                <div class="formulario">

                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" placeholder="Ex.: Maria Silva" required>
                    </div>

                    <div class="campo">
                        <label for="idade">Idade (anos)</label>
                        <input type="number" id="idade" placeholder="Ex.: 30" min="1" max="120" required>
                    </div>

                    <div class="campo">
                        <label for="altura">Altura (m)</label>
                        <input type="number" id="altura" placeholder="Ex.: 1.75" min="0.5" max="2.5" step="0.01" required>
                    </div>

                    <div class="campo">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" id="peso" placeholder="Ex.: 70" min="1" max="500" step="0.1" required>
                    </div>

                </div>

                <button type="submit">Salvar</button>

            </form>

        </div>

        <div class="card">

            <h2>Pessoas cadastradas</h2>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaPessoas">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
