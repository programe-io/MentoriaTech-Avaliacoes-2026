<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoSpeed - Motos Novas e Seminovas</title>
    <link rel="stylesheet" href="motos-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <header class="header">
        <div class="container nav-container">
            <a href="#" class="brand"><i class="fa-solid fa-motorcycle"></i> MotoSpeed</a>
            <ul class="menu">
                <li><a href="#">Catálogo</a></li>
                <li><a href="#simulador">Simulador</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </div>
    </header>

    <section class="hero-motos">
        <div class="container">
            <h1>Liberdade em Duas Rodas</h1>
            <p>Descubra cilindradas potentes e estilo incomparável.</p>
        </div>
    </section>

    <main class="container">
        <h2>Motos em Destaque</h2>
        <div class="motos-grid" id="motosGrid">
            <!-- Injetado via JS -->
        </div>

        <!-- SIMULADOR DE FINANCIAMENTO -->
        <section id="simulador" class="simulator-box">
            <h2>Simule Seu Financiamento</h2>
            <div class="sim-form">
                <div class="input-group">
                    <label>Valor da Moto (R$):</label>
                    <input type="number" id="valorMoto" value="45000">
                </div>
                <div class="input-group">
                    <label>Entrada (R$):</label>
                    <input type="number" id="valorEntrada" value="10000">
                </div>
                <div class="input-group">
                    <label>Número de Parcelas:</label>
                    <select id="parcelas">
                        <option value="12">12x</option>
                        <option value="24" selected>24x</option>
                        <option value="36">36x</option>
                        <option value="48">48x</option>
                    </select>
                </div>
                <button onclick="calcularFinanciamento()" class="calc-btn">Calcular Parcelas</button>
                <div id="resultadoSimulacao" class="sim-result"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MotoSpeed. Velocidade e Segurança.</p>
    </footer>

    <script src="motos-script.js"></script>
<script src="script.js"></script></body>
</html>
