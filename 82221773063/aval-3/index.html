<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@seu.perfil • Instagram</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;}
    body{background:#fff;color:#000;}
      .topo{position:sticky;top:0;background:#fff;border-bottom:1px solid #dbdbdb;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10;}
        .topo b{font-family: cursive;font-size:22px;font-weight:400;}
          .perfil{padding:20px 16px;display:flex;gap:20px;align-items:center;}
            .foto-perfil{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid #d62976;padding:2px;}
              .numeros{display:flex;gap:18px;text-align:center;flex:1;}
                .numeros b{display:block;font-size:16px;}
                  .numeros span{font-size:13px;color:#262626;}
                    .bio{padding:0 16px 16px;}
                      .bio b{font-size:14px;}
                        .bio p{font-size:14px;line-height:1.4;}
                          .botoes{padding:0 16px;display:flex;gap:8px;}
                            .botoes button{flex:1;padding:7px;border-radius:8px;border:none;background:#efefef;font-weight:600;font-size:14px;cursor:pointer;}
                              .botoes button.azul{background:#0095f6;color:#fff;}
                                .destaques{padding:16px;display:flex;gap:14px;overflow-x:auto;}
                                  .destaque{text-align:center;font-size:12px;}
                                    .destaque div{width:62px;height:62px;border-radius:50%;background:#f0f0f0;border:1px solid #dbdbdb;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:4px;}
                                      .abas{display:flex;border-top:1px solid #dbdbdb;margin-top:10px;}
                                        .abas div{flex:1;text-align:center;padding:12px;font-size:20px;border-top:1px solid #000;}
                                          .grade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;}
                                            .grade img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
                                              .rodape{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dbdbdb;display:flex;justify-content:space-around;padding:12px;font-size:22px;}
                                              </style>
                                              <script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
                                              <body>

                                              <div class="topo">
                                                <b>Instagram</b>
                                                  <div>♡ ✉️</div>
                                                  </div>

                                                  <div class="perfil">
                                                    <!-- TROQUE O SRC PELA SUA FOTO -->
                                                      <img class="foto-perfil" src="sua-foto.jpg" alt="foto de perfil">
                                                        <div class="numeros">
                                                            <div><b>128</b><span>publicações</span></div>
                                                                <div><b>2.340</b><span>seguidores</span></div>
                                                                    <div><b>890</b><span>seguindo</span></div>
                                                                      </div>
                                                                      </div>

                                                                      <div class="bio">
                                                                        <b>Seu Nome ❤️</b>
                                                                          <p>Ruivinha bem clarinha ✨<br>
                                                                            Cacheada e linda 🥰<br>
                                                                              Oeiras - PI 📍</p>
                                                                              </div>

                                                                              <div class="botoes">
                                                                                <button class="azul">Seguir</button>
                                                                                  <button>Mensagem</button>
                                                                                  </div>

                                                                                  <div class="destaques">
                                                                                    <div class="destaque"><div>✨</div>Eu</div>
                                                                                      <div class="destaque"><div>💇‍♀️</div>Cabelo</div>
                                                                                        <div class="destaque"><div>❤️</div>Favs</div>
                                                                                          <div class="destaque"><div>📍</div>Viagens</div>
                                                                                          </div>

                                                                                          <div class="abas">
                                                                                            <div>⊞</div><div>🎬</div><div>👤</div>
                                                                                            </div>

                                                                                            <div class="grade">
                                                                                              <img src="sua-foto.jpg">
                                                                                                <img src="sua-foto.jpg">
                                                                                                  <img src="sua-foto.jpg">
                                                                                                    <img src="sua-foto.jpg">
                                                                                                      <img src="sua-foto.jpg">
                                                                                                        <img src="sua-foto.jpg">
                                                                                                        </div>

                                                                                                        <div class="rodape">
                                                                                                          <span>🏠</span><span>🔍</span><span>➕</span><span>🎬</span><span>👤</span>
                                                                                                          </div>

                                                                                                          <script src="script.js"></script></body>
                                                                                                          </html>
