<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARMYS CAPINHAS - Picos e Araguaína</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
:root{--bg:#FAFAF9;--line:#E7E5E4;--black:#0C0A09;--lime:#D4FF00}
body{background:var(--bg);color:var(--black)}
header{position:sticky;top:0;z-index:10;background:rgba(250,250,249,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:19px;letter-spacing:-1px;text-transform:lowercase}
.logo b{background:var(--black);color:#fff;padding:3px 10px;border-radius:10px;margin-left:4px}
.cart{background:var(--black);color:#fff;padding:10px 16px;border-radius:100px;font-weight:700;font-size:13px;border:none;cursor:pointer;display:flex;gap:6px;align-items:center}
.cart i{background:var(--lime);color:#000;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px}
.banner{max-width:1100px;margin:0 auto;padding:20px}
.banner-box{background:var(--black);color:#fff;border-radius:24px;padding:22px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden}
.banner-box h1{font-size:24px;line-height:.95}
.banner-box h1 b{color:var(--lime)}
.grid{max-width:1100px;margin:10px auto;padding:0 20px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.product{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;transition:.2s}
.product:hover{border-color:var(--black)}
.img{aspect-ratio:1;background:#F5F5F4;border-radius:14px;display:grid;place-items:center;font-size:42px;position:relative}
.img span{font-size:10px;position:absolute;top:8px;left:8px;background:var(--lime);color:#000;padding:4px 8px;border-radius:100px;font-weight:800}
.info h3{font-size:13px;margin-top:8px;line-height:1.2}
.model{font-size:11px;color:#A8A29E}
.price{margin-top:4px;display:flex;gap:6px;align-items:center}
.price b{font-size:14px}
.add{width:100%;background:#0C0A09;color:#fff;border:none;padding:10px;border-radius:12px;font-weight:700;font-size:13px;margin-top:8px;cursor:pointer}
#cartModal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);z-index:20;display:none;align-items:end;justify-content:center;padding:20px}
.cart-box{background:#fff;width:100%;max-width:400px;border-radius:28px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="logo">armys<b>capinhas</b></div>
    <button class="cart" onclick="document.getElementById('cartModal').style.display='flex'">🛒 <i id="qtd">0</i></button>
    </header>

    <div class="banner">
      <div class="banner-box">
          <div>
                <h1>ARMYS<br><b>3 POR R$99</b></h1>
                      <p style="color:#A8A29E;font-size:12px;margin-top:4px">Zap: (63) 99112-7028 • Entrega 24h</p>
                          </div>
                              <div style="font-size:48px">💜</div>
                                </div>
                                </div>

                                <div class="grid" id="grid">
                                  <div class="product" data-price="39.90"><div class="img"><span>-30%</span>🧸</div><div class="info"><h3
  <script src="script.js"></script>
  
</body>
</html>
