<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mamãe SOS</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',sans-serif}
body{background:#FFF6F9;display:flex;justify-content:center}
.app{width:100%;max-width:400px;background:white;min-height:100vh;box-shadow:0 0 30px rgba(0,0,0,.1)}
.header{background:linear-gradient(135deg,#FF7EB3,#FF758C);padding:25px;border-radius:0 0 30px 30px;color:white;text-align:center}
.header h1{font-size:22px}
.header p{opacity:.9;font-size:14px;margin-top:5px}
.card{margin:15px;background:#fff;border-radius:20px;padding:15px;display:flex;align-items:center;gap:15px;box-shadow:0 5px 15px rgba(255,120,150,.15);cursor:pointer;border:1px solid #ffe0ea}
.card .icon{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px}
.c1 .icon{background:#FFE5EC} .c2 .icon{background:#E0F2FF} .c3 .icon{background:#FFF3CD} .c4 .icon{background:#E2F5E9}
.card b{font-size:16px;color:#444}
.card span{font-size:12px;color:#999;display:block}
.timer{margin:15px;background:#2D2A32;color:white;border-radius:20px;padding:20px;text-align:center}
.timer h3{color:#FF7EB3}
.btn{width:100%;margin-top:15px;background:#FF758C;border:none;padding:15px;border-radius:15px;color:white;font-weight:800;font-size:16px}
.lista{padding:0 15px 100px 15px}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
<div class="app">
  <div class="header">
      <h1>🤱 Olá, Mamãe Wall</h1>
          <p>Seu bebê tem 2 meses e 3 dias hoje</p>
            </div>

              <div class="timer">
                  <h3>⏰ Última mamada</h3>
                      <p id="tempo" style="font-size:28px;font-weight:800;margin:10px 0">02:15:30</p>
                          <p style="font-size:12px;opacity:.7">O pediatra recomenda amamentar a cada 3h</p>
                              <button class="btn" onclick="zerar()">MAMEI AGORA</button>
                                </div>

                                  <div class="lista">
                                      <div class="card c1" onclick="alert('Dica: Segure o bebê em posição de cavalinho por 10 min após mamar')">
                                            <div class="icon">🍼</div><div><b>Amamentação</b><span>Guia, pega correta e dicas</span></div>
                                                </div>
                                                    <div class="card c2" onclick="alert('Dica: Bebês de 2 meses dormem 14-17h por dia. Banho morno ajuda!')">
                                                          <div class="icon">😴</div><div><b>Sono do Bebê</b><span>Rotina e sons para dormir</span></div>
                                                              </div>
                                                                  <div class="card c3" onclick="alert('Próxima vacina: 4 meses - Pentavalente')">
                                                                        <div class="icon">💉</div><div><b>Vacinas & Saúde</b><span>Carteirinha e alertas</span></div>
                                                                            </div>
                                                                                <div class="card c4" onclick="alert('Chamando SOS Vovó / Pediatra... (link para WhatsApp)')">
                                                                                      <div class="icon">🆘</div><div><b>SOS Choro</b><span>O que fazer quando não para?</span></div>
                                                                                          </div>
                                                                                            </div>
                                                                                            </div>

                                                                                            <script>
                                                                                            let seg=8130;
                                                                                            setInterval(()=>{seg++;let h=String(Math.floor(seg/3600)).padStart(2,'0');let m=String(Math.floor(seg%3600/60)).padStart(2,'0');let s=String(seg%60).padStart(2,'0');document.getElementById('tempo').innerText=`${h}:${m}:${s}`},1000);
                                                                                            function zerar(){seg=0;alert('Registrado! Ótimo trabalho, mamãe ❤️')}
                                                                                            </script>
                                                                                            </div>
                                                                                            <script src="script.js"></script></body>
                                                                                            </html>
