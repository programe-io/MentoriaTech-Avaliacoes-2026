
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #234;
        }

        h2 {
            color: #234;
        }

        input {
            padding: 10px;
            margin: 5px 0;
            width: 95%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            background: #007bff;
        }

        button:hover {
            opacity: 0.8;
        }

        .excluir {
            background: #dc3545;
        }

        .editar {
            background: #28a745;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #234;
            color: white;
        }

        .total {
            background: #e9f5ff;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>📦 Sistema de Controle de Estoque</h1>

    <h2>Cadastrar Novo Produto</h2>

    <input type="text" id="nome" placeholder="Nome do produto">

    <input type="number" id="preco" placeholder="Preço do produto" min="0" step="0.01">

    <input type="number" id="quantidade" placeholder="Quantidade em estoque" min="0" step="1">

    <button onclick="cadastrarProduto()">
        Cadastrar Produto
    </button>

    <hr>

    <h2>Produtos Cadastrados</h2>

    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="listaProdutos">
        </tbody>
    </table>

    <div class="total" id="total">
        Total de produtos: 0
    </div>

</div>

<script>

    let produtos = [];

    function cadastrarProduto() {

        let nome = document.getElementById("nome").value.trim();
        let preco = Number(document.getElementById("preco").value);
        let quantidade = Number(document.getElementById("quantidade").value);

        if (nome === "" ||
            document.getElementById("preco").value === "" ||
            document.getElementById("quantidade").value === "" ||
            !Number.isFinite(preco) ||
            !Number.isInteger(quantidade) ||
            preco < 0 || quantidade < 0) {

            alert("Preencha todos os campos corretamente!");
            return;
        }

        produtos.push({
            nome: nome,
            preco: preco,
            quantidade: quantidade
        });

        document.getElementById("nome").value = "";
        document.getElementById("preco").value = "";
        document.getElementById("quantidade").value = "";

        listarProdutos();
    }

    function listarProdutos() {

        let tabela = document.getElementById("listaProdutos");

        tabela.innerHTML = "";

        produtos.forEach((produto, index) => {

            tabela.innerHTML += `
                <tr>
                    <td>${escaparHTML(produto.nome)}</td>
                    <td>${produto.preco.toLocaleString("pt-BR", {
                        style: "currency",
                        currency: "BRL"
                    })}</td>
                    <td>${produto.quantidade}</td>

                    <td>
                        <button class="editar"
                            onclick="alterarPreco(${index})">
                            Alterar Preço
                        </button>

                        <button onclick="alterarQuantidade(${index})">
                            Alterar Quantidade
                        </button>

                        <button class="excluir"
                            onclick="excluirProduto(${index})">
                            Excluir
                        </button>
                    </td>
                </tr>
            `;

        });

        document.getElementById("total").innerHTML =
            "Total de produtos cadastrados: " + produtos.length;
    }

    function alterarPreco(index) {

        let novoPreco = prompt("Digite o novo preço:");

        if (novoPreco === null || novoPreco.trim() === "") return;

        let valor = Number(novoPreco.replace(",", "."));

        if (!Number.isFinite(valor) || valor < 0) {
            alert("Digite um preço válido!");
            return;
        }

        produtos[index].preco = valor;

        listarProdutos();
    }

    function alterarQuantidade(index) {

        let novaQuantidade = prompt("Digite a nova quantidade:");

        if (novaQuantidade === null || novaQuantidade.trim() === "") return;

        let quantidade = Number(novaQuantidade);

        if (!Number.isInteger(quantidade) || quantidade < 0) {
            alert("Digite uma quantidade inteira válida!");
            return;
        }

        produtos[index].quantidade = quantidade;

        listarProdutos();
    }

    function excluirProduto(index) {

        if (confirm("Deseja realmente excluir este produto?")) {

            produtos.splice(index, 1);

            listarProdutos();
        }
    }

    function escaparHTML(texto) {
        return texto.replace(/[&<>"']/g, caractere => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[caractere]);
    }

</script>

<script src="script.js"></script></body>
</html>
