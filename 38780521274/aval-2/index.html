
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Tarefas</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    padding: 30px;
    color: #1e293b;
}

.container {
    max-width: 1100px;
    margin: auto;
}

header {
    margin-bottom: 30px;
}

header h1 {
    color: #1e3a8a;
    margin-bottom: 8px;
}

header p {
    color: #64748b;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #00000010;
}

.card h3 {
    font-size: 14px;
    color: #64748b;
}

.card strong {
    font-size: 28px;
    display: block;
    margin-top: 10px;
}

.formulario, .lista {
    background: white;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px #00000010;
}

h2 {
    margin-bottom: 20px;
    font-size: 19px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    gap: 15px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    outline: none;
}

input:focus, select:focus {
    border-color: #2563eb;
}

button {
    border: none;
    padding: 11px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.btn-primary {
    background: #2563eb;
    color: white;
    margin-top: 18px;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.filtros {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.filtros input {
    flex: 2;
}

.filtros select {
    flex: 1;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 14px 10px;
    text-align: left;
    border-bottom: 1px solid #e2e8f0;
    font-size: 14px;
}

th {
    background: #f8fafc;
    color: #475569;
}

.prioridade, .status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.alta {
    background: #fee2e2;
    color: #b91c1c;
}

.media {
    background: #fef3c7;
    color: #92400e;
}

.baixa {
    background: #dcfce7;
    color: #166534;
}

.pendente {
    background: #dbeafe;
    color: #1d4ed8;
}

.concluida {
    background: #dcfce7;
    color: #15803d;
}

.btn-edit {
    background: #e0e7ff;
    color: #3730a3;
}

.btn-delete {
    background: #fee2e2;
    color: #b91c1c;
}

.btn-status {
    background: #dcfce7;
    color: #166534;
    margin-right: 5px;
}

.acoes {
    display: flex;
    gap: 5px;
}

.vazio {
    text-align: center;
    padding: 25px;
    color: #94a3b8;
}

@media(max-width: 700px) {
    body {
        padding: 15px;
    }

    .dashboard {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .filtros {
        flex-direction: column;
    }

    .lista {
        overflow-x: auto;
    }

    table {
        min-width: 750px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

<header>
    <h1>📋 Gerenciador de Tarefas</h1>
    <p>Sistema de controle e acompanhamento de atividades</p>
</header>

<!-- INDICADORES -->
<div class="dashboard">

    <div class="card">
        <h3>Total de Tarefas</h3>
        <strong id="total">0</strong>
    </div>

    <div class="card">
        <h3>Tarefas Pendentes</h3>
        <strong id="pendentes">0</strong>
    </div>

    <div class="card">
        <h3>Tarefas Concluídas</h3>
        <strong id="concluidas">0</strong>
    </div>

</div>

<!-- FORMULÁRIO -->
<div class="formulario">

    <h2 id="tituloFormulario">Cadastrar Nova Tarefa</h2>

    <div class="form-grid">

        <div>
            <label>Código</label>
            <input type="text" id="codigo" placeholder="Ex: T001">
        </div>

        <div>
            <label>Título da Tarefa</label>
            <input type="text" id="titulo" placeholder="Digite a tarefa">
        </div>

        <div>
            <label>Prioridade</label>
            <select id="prioridade">
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>
            </select>
        </div>

    </div>

    <button class="btn-primary" onclick="salvarTarefa()">
        Salvar Tarefa
    </button>

    <button class="btn-delete" onclick="cancelarEdicao()" id="cancelar" style="display:none">
        Cancelar
    </button>

</div>

<!-- LISTAGEM -->
<div class="lista">

    <h2>Lista de Tarefas</h2>

    <div class="filtros">

        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar por código ou título..."
            oninput="renderizar()">

        <select id="filtroStatus" onchange="renderizar()">
            <option value="">Todos os status</option>
            <option value="Pendente">Pendente</option>
            <option value="Concluída">Concluída</option>
        </select>

    </div>

    <table>

        <thead>
            <tr>
                <th>Código</th>
                <th>Título</th>
                <th>Prioridade</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="tabela"></tbody>

    </table>

</div>

</div>

<script>

// Banco de dados inicial
let tarefas = [
    {
        codigo: "T001",
        titulo: "Desenvolver sistema",
        prioridade: "Alta",
        status: "Pendente"
    },
    {
        codigo: "T002",
        titulo: "Elaborar documentação",
        prioridade: "Média",
        status: "Concluída"
    },
    {
        codigo: "T003",
        titulo: "Realizar testes",
        prioridade: "Baixa",
        status: "Pendente"
    }
];

let indiceEdicao = null;

// Salvar tarefa
function salvarTarefa() {

    const codigo = document.getElementById("codigo").value.trim();
    const titulo = document.getElementById("titulo").value.trim();
    const prioridade = document.getElementById("prioridade").value;

    if (!codigo || !titulo) {
        alert("Preencha o código e o título da tarefa!");
        return;
    }

    const codigoDuplicado = tarefas.some((t, i) =>
        t.codigo.toLowerCase() === codigo.toLowerCase() &&
        i !== indiceEdicao
    );

    if (codigoDuplicado) {
        alert("Este código já está cadastrado!");
        return;
    }

    const tarefa = {
        codigo,
        titulo,
        prioridade,
        status: indiceEdicao !== null
            ? tarefas[indiceEdicao].status
            : "Pendente"
    };

    if (indiceEdicao !== null) {
        tarefas[indiceEdicao] = tarefa;
    } else {
        tarefas.push(tarefa);
    }

    cancelarEdicao();
    renderizar();
}

// Renderizar tabela
function renderizar() {

    const tabela = document.getElementById("tabela");

    const pesquisa = document
        .getElementById("pesquisa")
        .value.toLowerCase();

    const filtro = document
        .getElementById("filtroStatus").value;

    tabela.innerHTML = "";

    const filtradas = tarefas.filter(t => {

        const correspondePesquisa =
            t.codigo.toLowerCase().includes(pesquisa) ||
            t.titulo.toLowerCase().includes(pesquisa);

        const correspondeStatus =
            filtro === "" || t.status === filtro;

        return correspondePesquisa && correspondeStatus;
    });

    if (filtradas.length === 0) {
        tabela.innerHTML = `
            <tr>
                <td colspan="5" class="vazio">
                    Nenhuma tarefa encontrada.
                </td>
            </tr>`;
    }

    filtradas.forEach(t => {

        const prioridadeClasse = {
            "Alta": "alta",
            "Média": "media",
            "Baixa": "baixa"
        }[t.prioridade];

        const statusClasse =
            t.status === "Concluída"
                ? "concluida"
                : "pendente";

        const indice = tarefas.indexOf(t);

        tabela.innerHTML += `
            <tr>
                <td>${escapar(t.codigo)}</td>

                <td>${escapar(t.titulo)}</td>

                <td>
                    <span class="prioridade ${prioridadeClasse}">
                        ${t.prioridade}
                    </span>
                </td>

                <td>
                    <span class="status ${statusClasse}">
                        ${t.status}
                    </span>
                </td>

                <td>
                    <div class="acoes">

                        <button class="btn-status"
                            onclick="alternarStatus(${indice})">
                            ✓
                        </button>

                        <button class="btn-edit"
                            onclick="editarTarefa(${indice})">
                            ✎
                        </button>

                        <button class="btn-delete"
                            onclick="excluirTarefa(${indice})">
                            ✕
                        </button>

                    </div>
                </td>
            </tr>
        `;
    });

    atualizarIndicadores();
}

// Evitar inserir HTML digitado pelo usuário
function escapar(valor) {
    return String(valor).replace(/[&<>"']/g, caractere => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[caractere]);
}

// Atualizar indicadores
function atualizarIndicadores() {

    document.getElementById("total").textContent =
        tarefas.length;

    document.getElementById("pendentes").textContent =
        tarefas.filter(t => t.status === "Pendente").length;

    document.getElementById("concluidas").textContent =
        tarefas.filter(t => t.status === "Concluída").length;
}

// Alternar status
function alternarStatus(indice) {

    tarefas[indice].status =
        tarefas[indice].status === "Pendente"
            ? "Concluída"
            : "Pendente";

    renderizar();
}

// Editar tarefa
function editarTarefa(indice) {

    const tarefa = tarefas[indice];

    document.getElementById("codigo").value = tarefa.codigo;
    document.getElementById("titulo").value = tarefa.titulo;
    document.getElementById("prioridade").value = tarefa.prioridade;

    indiceEdicao = indice;

    document.getElementById("tituloFormulario").textContent =
        "Editar Tarefa";

    document.getElementById("cancelar").style.display =
        "inline-block";

    window.scrollTo({ top: 0, behavior: "smooth" });
}

// Excluir tarefa
function excluirTarefa(indice) {

    if (confirm("Deseja realmente excluir esta tarefa?")) {

        tarefas.splice(indice, 1);

        if (indiceEdicao === indice) {
            cancelarEdicao();
        }

        renderizar();
    }
}

// Cancelar edição
function cancelarEdicao() {

    indiceEdicao = null;

    document.getElementById("codigo").value = "";
    document.getElementById("titulo").value = "";
    document.getElementById("prioridade").value = "Baixa";

    document.getElementById("tituloFormulario").textContent =
        "Cadastrar Nova Tarefa";

    document.getElementById("cancelar").style.display =
        "none";
}

// Inicialização
renderizar();

</script>

<script src="script.js"></script></body>
</html>
