
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Controle de IMC</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            padding: 30px;
            color: #1e293b;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        header p {
            color: #64748b;
        }

        .formulario, .resultado {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px #00000010;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .resultado {
            display: none;
            text-align: center;
        }

        .resultado h2 {
            color: #2563eb;
        }

        .valor-imc {
            font-size: 45px;
            font-weight: bold;
            color: #1e3a8a;
            margin: 20px 0;
        }

        .classificacao {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .baixo {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .normal {
            background: #dcfce7;
            color: #166534;
        }

        .sobrepeso {
            background: #fef3c7;
            color: #92400e;
        }

        .obesidade {
            background: #fee2e2;
            color: #b91c1c;
        }

        .dados {
            text-align: left;
            margin-top: 15px;
            line-height: 2;
        }

        .aviso {
            font-size: 12px;
            color: #64748b;
            margin-top: 20px;
        }

        @media(max-width: 600px) {
            body {
                padding: 15px;
            }

            .formulario, .resultado {
                padding: 20px;
            }
        }

    </style>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <header>

        <h1>⚕ Controle de IMC</h1>

        <p>Sistema de cálculo do Índice de Massa Corporal</p>

    </header>


    <!-- FORMULÁRIO -->

    <div class="formulario">

        <h2>Dados do Paciente</h2>

        <div class="campo">

            <label for="nome">Nome do Paciente</label>

            <input
                type="text"
                id="nome"
                placeholder="Digite o nome do paciente">

        </div>


        <div class="campo">

            <label for="peso">Peso (kg)</label>

            <input
                type="number"
                id="peso"
                placeholder="Ex: 70"
                step="0.1"
                min="0.1">

        </div>


        <div class="campo">

            <label for="altura">Altura (metros)</label>

            <input
                type="number"
                id="altura"
                placeholder="Ex: 1.75"
                step="0.01"
                min="0.1">

        </div>


        <button onclick="calcularIMC()">

            Calcular IMC

        </button>

    </div>


    <!-- RESULTADO -->

    <div class="resultado" id="resultado">

        <h2>Resultado do IMC</h2>

        <div class="dados">

            <p><strong>Paciente:</strong> <span id="resultadoNome"></span></p>

            <p><strong>Peso:</strong> <span id="resultadoPeso"></span> kg</p>

            <p><strong>Altura:</strong> <span id="resultadoAltura"></span> m</p>

        </div>


        <div class="valor-imc" id="valorIMC">

            0.00

        </div>


        <div class="classificacao" id="classificacao">

            Classificação

        </div>


        <p id="mensagem"></p>

        <p class="aviso">
            Resultado informativo. A avaliação clínica deve considerar
            idade, condições individuais e outros fatores de saúde.
        </p>

    </div>

</div>


<script>

// FUNÇÃO PARA CALCULAR O IMC

function calcularIMC() {

    // Receber os dados do paciente

    const nome = document.getElementById("nome").value.trim();

    const peso = parseFloat(document.getElementById("peso").value);

    const altura = parseFloat(document.getElementById("altura").value);


    // Validar os campos

    if (nome === "" || !Number.isFinite(peso) ||
        !Number.isFinite(altura) || peso <= 0 || altura <= 0) {

        alert("Preencha todos os campos com valores válidos!");

        return;

    }


    // Calcular IMC

    const imc = peso / (altura * altura);


    // Definir classificação

    let classificacao = "";

    let classe = "";

    let mensagem = "";


    if (imc < 18.5) {

        classificacao = "Abaixo do peso";

        classe = "baixo";

        mensagem = "O resultado está abaixo da faixa de referência para adultos.";

    }

    else if (imc < 25) {

        classificacao = "Peso adequado";

        classe = "normal";

        mensagem = "O resultado está dentro da faixa de referência para adultos.";

    }

    else if (imc < 30) {

        classificacao = "Sobrepeso";

        classe = "sobrepeso";

        mensagem = "O resultado está na faixa de sobrepeso para adultos.";

    }

    else {

        classificacao = "Obesidade";

        classe = "obesidade";

        mensagem = "O resultado está na faixa de obesidade para adultos.";

    }


    // Exibir os dados do paciente

    document.getElementById("resultadoNome").textContent = nome;

    document.getElementById("resultadoPeso").textContent = peso.toFixed(1);

    document.getElementById("resultadoAltura").textContent = altura.toFixed(2);


    // Exibir o resultado do IMC

    document.getElementById("valorIMC").textContent = imc.toFixed(2);


    // Exibir classificação

    const elementoClassificacao =
        document.getElementById("classificacao");

    elementoClassificacao.textContent = classificacao;

    elementoClassificacao.className = "classificacao " + classe;


    // Exibir mensagem

    document.getElementById("mensagem").textContent = mensagem;


    // Mostrar painel de resultado

    document.getElementById("resultado").style.display = "block";

}

</script>

<script src="script.js"></script></body>

</html>
