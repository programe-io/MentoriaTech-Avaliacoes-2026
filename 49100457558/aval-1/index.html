<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #34495e;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-primary { background-color: #3498db; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-warning { background-color: #e67e22; }
        .btn-warning:hover { background-color: #d35400; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
        }

        th {
            background-color: #f8f9fa;
            color: #2c3e50;
        }

        tr:hover {
            background-color: #f1f2f6;
        }

        .empty-msg {
            text-align: center;
            color: #7f8c8d;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Simulador de Sistema de Estoque</h1>

    <div class="grid">
        <!-- LADO ESQUERDO: FORMULÁRIOS DEAÇÃO -->
        <div class="actions-column">
            
            <!-- CADASTRAR -->
            <div class="card">
                <h2>Cadastrar Novo Produto</h2>
                <div class="form-group">
                    <label>Código do Produto</label>
                    <input type="number" id="cad-codigo" placeholder="Ex: 101">
                </div>
                <div class="form-group">
                    <label>Descrição / Nome</label>
                    <input type="text" id="cad-descricao" placeholder="Ex: Mouse Gamer">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Quantidade</label>
                        <input type="number" id="cad-qtd" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="number" step="0.01" id="cad-valor" placeholder="0.00">
                    </div>
                </div>
                <button class="btn-success" onclick="uiCadastrar()">Cadastrar Produto</button>
            </div>

            <!-- ALTERAR VALOR -->
            <div class="card">
                <h2>Alterar Valor de um Produto</h2>
                <div class="form-group">
                    <label>Código do Produto</label>
                    <input type="number" id="alt-val-codigo" placeholder="Código do item">
                </div>
                <div class="form-group">
                    <label>Novo Valor (R$)</label>
                    <input type="number" step="0.01" id="alt-val-novo" placeholder="0.00">
                </div>
                <button class="btn-primary" onclick="uiAlterarValor()">Atualizar Preço</button>
            </div>

            <!-- ALTERAR QUANTIDADE -->
            <div class="card">
                <h2>Alterar Quantidade de um Produto</h2>
                <div class="form-group">
                    <label>Código do Produto</label>
                    <input type="number" id="alt-qtd-codigo" placeholder="Código do item">
                </div>
                <div class="form-group">
                    <label>Nova Quantidade</label>
                    <input type="number" id="alt-qtd-nova" placeholder="0">
                </div>
                <button class="btn-warning" onclick="uiAlterarQuantidade()">Atualizar Estoque</button>
            </div>

        </div>

        <!-- LADO DIREITO: LISTAGEM DO ESTOQUE -->
        <div class="list-column">
            <div class="card" style="height: 100%;">
                <h2>📋 Produtos Cadastrados (Listar)</h2>
                <div id="tabela-container">
                    <p class="empty-msg">Nenhum produto cadastrado no estoque ainda.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // LÓGICA DO BACKEND (ARRAY DE OBJETOS)
    const estoque = [];

    // Função interna para renderizar/atualizar a tabela na tela
    function atualizarTabelaUIRender() {
        const container = document.getElementById('tabela-container');
        
        if (estoque.length === 0) {
            container.innerHTML = '<p class="empty-msg">Nenhum produto cadastrado no estoque ainda.</p>';
            return;
        }

        let htmlHtmlTable = `
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor Unitário</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
        `;

        estoque.forEach(prod => {
            const totalItem = prod.quantidade * prod.valor;
            htmlHtmlTable += `
                <tr>
                    <td><strong>${prod.codigo}</strong></td>
                    <td>${prod.descricao}</td>
                    <td>${prod.quantidade} un</td>
                    <td>R$ ${prod.valor.toFixed(2)}</td>
                    <td>R$ ${totalItem.toFixed(2)}</td>
                </tr>
            `;
        });

        htmlHtmlTable += `
                </tbody>
            </table>
        `;
        
        container.innerHTML = htmlHtmlTable;
    }

    // Ação 1: Cadastrar
    function uiCadastrar() {
        const codigo = parseInt(document.getElementById('cad-codigo').value);
        const descricao = document.getElementById('cad-descricao').value.trim();
        const quantidade = parseInt(document.getElementById('cad-qtd').value);
        const valor = parseFloat(document.getElementById('cad-valor').value);

        if (!codigo || !descricao || isNaN(quantidade) || isNaN(valor)) {
            alert("⚠️ Por favor, preencha todos os campos do cadastro corretamente.");
            return;
        }

        const existe = estoque.find(p => p.codigo === codigo);
        if (existe) {
            alert(`❌ Erro: O código ${codigo} já pertence ao produto "${existe.descricao}".`);
            return;
        }

        estoque.push({ codigo, descricao, quantidade, valor });
        
        // Limpa campos
        document.getElementById('cad-codigo').value = '';
        document.getElementById('cad-descricao').value = '';
        document.getElementById('cad-qtd').value = '';
        document.getElementById('cad-valor').value = '';

        atualizarTabelaUIRender();
    }

    // Ação 3: Alterar Valor
    function uiAlterarValor() {
        const codigo = parseInt(document.getElementById('alt-val-codigo').value);
        const novoValor = parseFloat(document.getElementById('alt-val-novo').value);

        if (!codigo || isNaN(novoValor)) {
            alert("⚠️ Preencha o código do produto e o novo preço.");
            return;
        }

        const produto = estoque.find(p => p.codigo === codigo);
        if (!produto) {
            alert(`❌ Produto com o código ${codigo} não foi encontrado.`);
            return;
        }

        produto.valor = novoValor;
        
        document.getElementById('alt-val-codigo').value = '';
        document.getElementById('alt-val-novo').value = '';
        
        atualizarTabelaUIRender();
    }

    // Ação 4: Alterar Quantidade
    function uiAlterarQuantidade() {
        const codigo = parseInt(document.getElementById('alt-qtd-codigo').value);
        const novaQtd = parseInt(document.getElementById('alt-qtd-nova').value);

        if (!codigo || isNaN(novaQtd)) {
            alert("⚠️ Preencha o código do produto e a nova quantidade.");
            return;
        }

        const produto = estoque.find(p => p.codigo === codigo);
  <script src="script.js"></script>
  
</body>
</html>
