
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de IMC</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="cabecalho">
        <h1>Painel de Índice de Massa Corporal</h1>
        <p>Cadastre pessoas e consulte os resultados do IMC.</p>
    </header>

    <main class="conteudo">

        <section class="formulario">
            <h2>Cadastrar pessoa</h2>

            <form id="formPessoa">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome"
                    required
                >

                <label for="peso">Peso (kg)</label>
                <input
                    type="number"
                    id="peso"
                    min="0.1"
                    step="0.1"
                    placeholder="Ex.: 70.5"
                    required
                >

                <label for="altura">Altura (m)</label>
                <input
                    type="number"
                    id="altura"
                    min="0.1"
                    step="0.01"
                    placeholder="Ex.: 1.75"
                    required
                >

                <button type="submit">Calcular e adicionar</button>
            </form>
        </section>

        <section class="resultados">
            <h2>Resultados cadastrados</h2>

            <div class="indicadores">
                <div class="indicador">
                    <span>Pessoas cadastradas</span>
                    <strong id="totalPessoas">0</strong>
                </div>

                <div class="indicador">
                    <span>IMC médio</span>
                    <strong id="imcMedio">--</strong>
                </div>
            </div>

            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Peso</th>
                            <th>Altura</th>
                            <th>IMC</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="corpoTabela">
                        <tr>
                            <td colspan="5">Nenhuma pessoa cadastrada.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <h3>Legenda de cores</h3>

            <div class="legenda">
                <span class="abaixo">Abaixo do peso</span>
                <span class="normal">Peso normal</span>
                <span class="sobrepeso">Sobrepeso</span>
                <span class="obesidade">Obesidade</span>
            </div>
        </section>

    </main>

<script src="script.js"></script></body>
</html>
