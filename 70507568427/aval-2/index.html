
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Meu Gerenciador de Tarefas</h1>
        <p>Organize suas atividades e acompanhe seu progresso.</p>
    </header>

    <main class="painel">

        <section class="cadastro">
            <h2>Nova tarefa</h2>

            <form id="formTarefa">
                <label for="codigo">Código da tarefa</label>
                <input type="number" id="codigo" min="1" required>

                <label for="titulo">Título da tarefa</label>
                <input
                    type="text"
                    id="titulo"
                    placeholder="Ex.: Estudar JavaScript"
                    required
                >

                <label for="prioridade">Nível de prioridade</label>
                <select id="prioridade" required>
                    <option value="1">1 - Alta</option>
                    <option value="2" selected>2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit">Adicionar tarefa</button>
            </form>

            <p class="dica">O título deve conter pelo menos 5 caracteres.</p>
        </section>

        <section class="tarefas">
            <h2>Lista de tarefas</h2>

            <div class="resumo">
                <span id="totalTarefas">Total: 0</span>
                <span id="totalConcluidas">Concluídas: 0</span>
            </div>

            <div id="listaTarefas">
                <p class="vazio">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>

    </main>

<script src="script.js"></script></body>
</html>
