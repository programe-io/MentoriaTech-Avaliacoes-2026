<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Cadastro e gerenciamento de produtos</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar produto</h2>
            <form id="formProduto" class="formulario" novalidate>
                <label class="campo">
                    <span>Descrição</span>
                    <input type="text" id="descricao" placeholder="Ex.: Teclado mecânico" autocomplete="off" required>
                </label>
                <label class="campo">
                    <span>Quantidade</span>
                    <input type="number" id="quantidade" placeholder="0" min="1" step="1" required>
                </label>
                <label class="campo">
                    <span>Valor (R$)</span>
                    <input type="number" id="valor" placeholder="0,00" min="0" step="0.01" required>
                </label>
                <button type="submit">Cadastrar</button>
            </form>
            <p id="erroForm" class="erro" role="alert" hidden></p>
        </section>

        <section class="card">
            <div class="topo-lista">
                <h2>Produtos cadastrados</h2>
                <input type="search" id="busca" placeholder="Buscar por descrição ou código" aria-label="Buscar produto">
            </div>

            <div class="resumo">
                <div><strong id="totalItens">0</strong><span>itens em estoque</span></div>
                <div><strong id="totalValor">R$ 0,00</strong><span>valor total</span></div>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <dialog id="dialogEditar">
        <form method="dialog" id="formEditar">
            <h3 id="tituloEditar"></h3>
            <input type="number" id="campoEditar" required>
            <p id="erroEditar" class="erro" role="alert" hidden></p>
            <div class="dialog-acoes">
                <button type="button" id="cancelarEditar" class="btn-secundario">Cancelar</button>
                <button type="submit">Salvar</button>
            </div>
        </form>
    </dialog>

    <dialog id="dialogExcluir">
        <form method="dialog">
            <h3 id="tituloExcluir"></h3>
            <div class="dialog-acoes">
                <button value="cancelar" class="btn-secundario">Cancelar</button>
                <button value="confirmar" class="btn-excluir">Excluir</button>
            </div>
        </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
