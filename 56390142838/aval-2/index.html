<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerenciador de tarefas simples com prioridades e filtros.">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas tarefas de forma simples e prática.</p>
    </header>

    <main>
        <section class="card" aria-labelledby="tituloCadastro">
            <h2 id="tituloCadastro">Cadastrar nova tarefa</h2>

            <form id="formTarefa" novalidate>
                <label for="titulo">Título da tarefa</label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Ex.: Estudar JavaScript"
                    required
                    minlength="5"
                    maxlength="100"
                    autocomplete="off"
                    aria-describedby="erroTitulo"
                >

                <small id="erroTitulo" class="erro" role="alert"></small>

                <label for="prioridade">Prioridade</label>

                <select id="prioridade" required>
                    <option value="1">1 - Alta</option>
                    <option value="2" selected>2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit">Cadastrar tarefa</button>
            </form>

            <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
        </section>

        <section class="card" aria-labelledby="tituloLista">
            <h2 id="tituloLista">Minhas tarefas</h2>

            <div id="resumo"></div>

            <div class="barra">
                <div class="filtros" role="group" aria-label="Filtrar tarefas">
                    <button type="button" class="filtro ativo"
                        data-filtro="todas" aria-pressed="true">
                        Todas
                    </button>

                    <button type="button" class="filtro"
                        data-filtro="pendentes" aria-pressed="false">
                        Pendentes
                    </button>

                    <button type="button" class="filtro"
                        data-filtro="concluidas" aria-pressed="false">
                        Concluídas
                    </button>
                </div>

                <div class="ordem">
                    <label for="ordenar">Ordenar por</label>

                    <select id="ordenar">
                        <option value="recentes">Mais recentes</option>
                        <option value="antigas">Mais antigas</option>
                        <option value="prioridade">Prioridade</option>
                    </select>
                </div>
            </div>

            <div id="listaTarefas"></div>

            <button type="button" id="limparConcluidas"
                class="secundario" hidden>
                Limpar tarefas concluídas
            </button>
        </section>
    </main>

    <footer>
        <p>Projeto escolar - Desenvolvimento de Sistemas</p>
    </footer>

<script src="script.js"></script></body>
</html>
