
<!DOCTYPE html>
<html lang="pt-BR">
<head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>InstaClone</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>
                <body>

                <header>
                    <h1>InstaClone</h1>
                        <nav>

                                                <a href="#publicar">➕</a>
                                                        <a href="#feed">❤️</a>
                                                                <a href="#perfil">👤</a>
                                                                    </nav>
                                                                    </header>

                                                                    <main id="inicio">

                                                                        <section class="stories" id="stories">
                                                                                <div class="story">
                                                                                            <div class="story-img">L</div>
                                                                                                        <p>Seu story</p>
                                                                                                                </div>

                                                                                                                        <div class="story">
                                                                                                                                    <div class="story-img">M</div>
                                                                                                                                                <p>Maria</p>
                                                                                                                                                        </div>

                                                                                                                                                                <div class="story">
                                                                                                                                                                            <div class="story-img">J</div>

                                                                                                                                                                                                </div>

                                                                                                                                                                                                        <div class="story">
                                                                                                                                                                                                                    <div class="story-img">A</div>
                                                                                                                                                                                                                                <p>Ana</p>
                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                <div class="story">
                                                                                                                                                                                                                                                            <div class="story-img">P</div>
                                                                                                                                                                                                                                                                        <p>Pedro</p>
                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                        <section class="criar" id="publicar">
                                                                                                                                                                                                                                                                                                <h2>Nova publicação</h2>

                                                                                                                                                                                                                                                                                                        <input type="text" id="nome" placeholder="Seu nome">

                                                                                                                                                                                                                                                                                                                <textarea id="legenda"
                                                                                                                                                                                                                                                                                                                        placeholder="Escreva uma legenda..."></textarea>

                                                                                                                                                                                                                                                                                                                                <input type="text" id="imagem"
                                                                                                                                                                                                                                                                                                                                        placeholder="URL da imagem">

                                                                                                                                                                                                                                                                                                                                                <button onclick="publicar()">Compartilhar</button>
                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                        <section id="feed">
                                                                                                                                                                                                                                                                                                                                                                <h2>Feed</h2>
                                                                                                                                                                                                                                                                                                                                                                        <div id="posts"></div>
                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                                            <footer id="perfil">
