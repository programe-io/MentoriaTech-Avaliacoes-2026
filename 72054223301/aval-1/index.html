
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Produtos</title>
    <link rel="stylesheet" href="style.css">
    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Gerenciamento de Produtos</h1>
        <p>Cadastre e controle seus produtos e estoques.</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formCadastro">
                <label for="descricao">Descrição</label>
                <input
                    type="text"
                    id="descricao"
                    placeholder="Nome do produto"
                    required
                >

                <label for="quantidade">Quantidade inicial</label>
                <input
                    type="number"
                    id="quantidade"
                    min="1"
                    step="1"
                    placeholder="Ex.: 10"
                    required
                >

                <label for="valor">Valor unitário (R$)</label>
                <input
                    type="number"
                    id="valor"
                    min="0"
                    step="0.01"
                    placeholder="Ex.: 29.90"
                    required
                >

                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section class="card">
            <h2>Buscar produto</h2>

            <form id="formBusca">
                <label for="codigoBusca">Código do produto</label>
                <div class="linha">
                    <input
                        type="number"
                        id="codigoBusca"
                        min="1"
                        step="1"
                        placeholder="Digite o código"
                        required
                    >
                    <button type="submit">Buscar</button>
                </div>
            </form>

            <div id="resultadoBusca" aria-live="polite"></div>
        </section>

        <section class="card">
            <h2>Atualizar preço</h2>

            <form id="formPreco">
                <label for="codigoPreco">Código do produto</label>
                <input
                    type="number"
                    id="codigoPreco"
                    min="1"
                    step="1"
                    required
                >

                <label for="novoValor">Novo valor (R$)</label>
                <input
                    type="number"
                    id="novoValor"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">Atualizar preço</button>
            </form>
        </section>

        <section class="card">
            <h2>Adicionar ao estoque</h2>

            <form id="formEstoque">
                <label for="codigoEstoque">Código do produto</label>
                <input
                    type="number"
                    id="codigoEstoque"
                    min="1"
                    step="1"
                    required
                >

                <label for="novaQuantidade">Quantidade a adicionar</label>
                <input
                    type="number"
                    id="novaQuantidade"
                    min="1"
                    step="1"
                    required
                >

                <button type="submit">Adicionar quantidade</button>
            </form>
        </section>

        <section class="card tabela-card">
            <h2>Lista de produtos</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor unitário</th>
                            <th>Total em estoque</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="5">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <div id="mensagem" class="mensagem" role="status"
             aria-live="polite"></div>
    </main>
    <script src="script.js" defer></script>
<script src="script.js"></script></body>
</html>
