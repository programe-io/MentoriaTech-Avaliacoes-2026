
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <header class="header">
            <span class="tag">PRODUTIVIDADE</span>
            <h1>Minhas tarefas<span>.</span></h1>
            <p>Organize seu dia, uma tarefa de cada vez.</p>
        </header>

        <section class="task-card">
            <form id="task-form">
                <input
                    type="text"
                    id="task-input"
                    placeholder="O que você precisa fazer?"
                    maxlength="150"
                    required
                >
                <button type="submit" class="add-btn">
                    + Adicionar
                </button>
            </form>

            <div class="task-info">
                <span id="task-counter">0 tarefas</span>
                <button id="clear-completed" class="text-btn">
                    Limpar concluídas
                </button>
            </div>

            <nav class="filters" aria-label="Filtrar tarefas">
                <button class="filter active" data-filter="all">
                    Todas
                </button>
                <button class="filter" data-filter="pending">
                    Pendentes
                </button>
                <button class="filter" data-filter="completed">
                    Concluídas
                </button>
            </nav>

            <ul id="task-list" aria-live="polite"></ul>

            <div id="empty-state" class="empty-state">
                <div class="empty-icon">✦</div>
                <h2>Nenhuma tarefa por aqui</h2>
                <p>Adicione uma tarefa e comece a organizar seu dia.</p>
            </div>
        </section>

        <footer>
            Feito para você produzir mais, sem complicação.
        </footer>
    </main>

    <script src="script.js" defer></script>
<script src="script.js"></script></body>
</html>
