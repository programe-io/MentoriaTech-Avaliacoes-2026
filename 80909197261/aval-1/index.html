
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrida de Carros</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🏁 CORSA RACING</h1>
        <p>Prepare-se para a velocidade!</p>
    </header>

    <main>
        <section class="menu">
            <h2>Corrida de Carros</h2>
            <p>Escolha seu carro e entre na pista!</p>

            <div class="carro">
                <img
                    src="https://placehold.co/600x300/222222/ffffff?text=CARRO+DE+CORRIDA"
                    alt="Carro de corrida">
            </div>

            <button onclick="iniciarCorrida()">
                INICIAR CORRIDA
            </button>
        </section>

        <section class="informacoes">
            <h2>Informações da Corrida</h2>
            <p>Pista: Circuito Corsa</p>
            <p>Modo: Corrida livre</p>
            <p id="status">Status: Aguardando largada</p>
        </section>
    </main>

    <footer>
        <p>© 2026 Corsa Racing - Projeto de corrida</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
