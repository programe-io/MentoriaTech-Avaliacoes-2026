<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clone Instagram - Projeto Tailwind & JS</title>
  
  <!-- Tailwind CSS via CDN (conforme Slide 2) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <!-- Ícones Boxicons (conforme Slide 2) -->
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <!-- CSS Externo -->
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="min-h-screen bg-muted text-slate-900">

  <!-- CABEÇALHO (TOP HEADER) -->
  <header class="sticky top-0 z-40 bg-card border-b border-border">
    <div class="max-w-5xl mx-auto px-4">
      <div class="flex items-center justify-between h-14 md:h-16">
        
        <!-- Logo -->
        <a href="#" class="font-semibold text-xl tracking-tight italic font-serif">
          Instagram
        </a>

        <!-- Campo de Pesquisa (Desktop) -->
        <div class="hidden md:flex items-center relative">
          <i class='bx bx-search absolute left-3 text-muted text-lg'></i>
          <input
            id="searchInput"
            type="text"
            placeholder="Pesquisar por usuário ou legenda..."
            class="w-64 h-9 bg-muted pl-10 pr-4 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-gray-300"
          />
        </div>

        <!-- Menu de Opções (Desktop) -->
        <div class="hidden md:flex items-center gap-5">
          <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="hover:text-muted transition-colors cursor-pointer" title="Início">
            <i class='bx bx-home text-xl'></i>
          </button>
          <button onclick="openNewPostModal()" class="hover:text-muted transition-colors cursor-pointer" title="Nova Publicação">
            <i class='bx bx-plus-circle text-xl'></i>
          </button>
          <button class="hover:text-muted transition-colors cursor-pointer relative" title="Notificações">
            <i class='bx bx-heart text-xl'></i>
            <span class="w-2 h-2 bg-red-500 rounded-full absolute top-0 right-0"></span>
          </button>
          <!-- Ícone de Perfil com Gradiente -->
          <button title="Seu Perfil" class="w-7 h-7 rounded-full bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 p-0.5 cursor-pointer">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=60" alt="Perfil" class="w-full h-full object-cover rounded-full border border-white">
          </button>
        </div>

        <!-- Ícones Mobile no Topo -->
        <div class="flex md:hidden items-center gap-4">
          <button onclick="openNewPostModal()" aria-label="Nova postagem">
            <i class='bx bx-plus-square text-2xl'></i>
          </button>
          <button aria-label="Notificações">
            <i class='bx bx-heart text-2xl'></i>
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL (FEED + SIDEBAR) -->
  <main class="max-w-5xl mx-auto px-4 py-4 md:py-8 pb-20 md:pb-8">
    <div class="flex gap-8 justify-center">
      
      <!-- COLUNA DO FEED -->
      <div class="flex-1 max-w-lg w-full">
        
        <!-- Barra de Stories Horizontal -->
        <section class="bg-card border border-border rounded-lg p-4 mb-4">
          <div id="storiesContainer" class="flex gap-4 overflow-x-auto no-scrollbar">
            <!-- Renderizado via script.js -->
          </div>
        </section>

        <!-- Lista de Postagens -->
        <div id="feedContainer">
          <!-- Renderizado via script.js -->
        </div>

      </div>

      <!-- BARRA LATERAL / ASIDE (Desktop) -->
      <aside class="hidden lg:block w-80 flex-shrink-0">
        <div class="sticky top-20">
          
          <!-- Bloco 1: Perfil do Usuário Atual -->
          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
              <img 
                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" 
                alt="frojo_dev" 
                class="w-14 h-14 object-cover rounded-full border border-border"
              />
              <div>
                <p class="font-semibold text-sm">frojo_dev</p>
                <p class="text-xs text-muted">Jonathan William</p>
              </div>
            </div>
            <button class="text-blue-500 hover:text-blue-700 text-xs font-semibold cursor-pointer">
              Trocar
            </button>
          </div>

          <!-- Bloco 2: Sugestões para você -->
          <div>
            <div class="flex items-center justify-between mb-4">
              <span class="text-sm font-semibold text-muted">Sugestões para você</span>
              <button class="text-xs font-semibold hover:text-muted cursor-pointer">Ver tudo</button>
            </div>

            <div id="suggestionsContainer" class="space-y-3">
              <!-- Renderizado via script.js -->
            </div>
          </div>

          <!-- Bloco 3: Rodapé Informativo -->
          <div class="mt-8">
            <p class="text-xs text-gray-400 leading-relaxed">
              Sobre · Ajuda · Imprensa · API · Carreiras · Privacidade · Termos · Localizações · Idioma
            </p>
            <p class="text-xs text-gray-400 mt-4 uppercase">
              © 2026 INSTAGRAM CLONE - AULA TAILWIND
            </p>
          </div>

        </div>
      </aside>

    </div>
  </main>

  <!-- MENU DE NAVEGAÇÃO INFERIOR (MOBILE ONLY) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-card border-t border-border z-50">
    <div class="flex items-center justify-around h-14 px-4">
      <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="p-2 hover:text-muted transition-colors" aria-label="Home">
        <i class='bx bx-home text-2xl'></i>
      </button>
      <button onclick="toggleMobileSearch()" class="p-2 hover:text-muted transition-colors" aria-label="Search">
        <i class='bx bx-search text-2xl'></i>
      </button>
      <button onclick="openNewPostModal()" class="p-2 hover:text-muted transition-colors" aria-label="New post">
        <i class='bx bx-plus text-2xl'></i>
      </button>
      <button class="p-2 hover:text-muted transition-colors" aria-label="Activity">
        <i class='bx bx-heart text-2xl'></i>
      </button>
      <button class="p-2 hover:text-muted transition-colors" aria-label="Profile">
        <i class='bx bx-user text-2xl'></i>
      </button>
    </div>
  </nav>

  <!-- MODAL: CRIAR NOVA POSTAGEM -->
  <div id="newPostModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
    <div class="bg-card rounded-xl max-w-md w-full p-6 shadow-xl">
      <div class="flex justify-between items-center border-b border-border pb-3 mb-4">
        <h3 class="font-semibold text-base">Criar nova publicação</h3>
        <button onclick="closeNewPostModal()" class="text-muted hover:text-black cursor-pointer">
          <i class='bx bx-x text-2xl'></i>
        </button>
      </div>
      <form id="newPostForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-muted mb-1">Localização</label>
          <input type="text" id="postLocation" placeholder="Ex: Parnaíba-PI" class="w-full bg-muted px-3 py-2 rounded-lg text-sm focus:outline-none" required>
        </div>
        <div>
          <label class="block text-xs font-semibold text-muted mb-1">URL da Imagem (Unsplash)</label>
          <input type="url" id="postImage" value="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=800&auto=format&fit=crop&q=80" class="w-full bg-muted px-3 py-2 rounded-lg text-sm focus:outline-none" required>
        </div>
        <div>
          <label class="block text-xs font-semibold text-muted mb-1">Legenda</label>
          <textarea id="postCaption" rows="3" placeholder="Escreva uma legenda..." class="w-full bg-muted px-3 py-2 rounded-lg text-sm focus:outline-none" required></textarea>
        </div>
        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-lg text-sm transition-colors cursor-pointer">
          Compartilhar
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL: VISUALIZAR STORY -->
  <div id="storyModal" onclick="closeStoryModal()" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center p-4 cursor-pointer">
    <div class="relative max-w-sm w-full h-[75vh] rounded-2xl overflow-hidden bg-gray-900 shadow-2xl" onclick="event.stopPropagation()">
      <div class="absolute top-3 left-3 right-3 h-1 bg-white/30 rounded-full overflow-hidden">
        <div id="storyProgress" class="h-full bg-white w-0 transition-all duration-[3000ms] ease-linear"></div>
      </div>
      <div class="absolute top-6 left-4 right-4 flex items-center justify-between text-white">
        <div class="flex items-center gap-2">
          <img id="storyAvatar" src="" class="w-8 h-8 rounded-full object-cover border border-white">
          <span id="storyUsername" class="text-sm font-semibold shadow-sm"></span>
        </div>
        <button onclick="closeStoryModal()" class="text-white text-2xl cursor-pointer"><i class='bx bx-x'></i></button>
      </div>
      <img id="storyFullImg" src="" class="w-full h-full object-cover">
    </div>
  </div>

  <!-- JavaScript Externo -->
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
