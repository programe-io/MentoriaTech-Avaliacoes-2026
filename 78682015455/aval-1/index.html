<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Driving 3D | Realistic Luxury Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #030508;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Interface HUD Superior */
        .hud {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 10;
            background: linear-gradient(135deg, rgba(10, 14, 22, 0.9) 0%, rgba(5, 7, 10, 0.95) 100%);
            border: 1px solid rgba(197, 160, 89, 0.4);
            padding: 20px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }
        .hud h1 {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #fff, #c5a059);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hud p {
            font-size: 13px;
            color: #a0aec0;
            margin-top: 5px;
        }
        .hud span {
            color: #c5a059;
            font-weight: bold;
        }

        /* Velocímetro Realista */
        .speedometer {
            position: absolute;
            bottom: 35px;
            right: 35px;
            z-index: 10;
            background: radial-gradient(circle, rgba(16, 24, 40, 0.95) 0%, rgba(4, 6, 10, 0.98) 100%);
            border: 2px solid rgba(197, 160, 89, 0.7);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.25);
        }
        .speedometer .number {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        .speedometer .unit {
            font-size: 11px;
            color: #c5a059;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: -2px;
        }

        /* Menu de Seleção de Hipercarros */
        .garage-menu {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .garage-menu button {
            background: rgba(10, 14, 22, 0.85);
            color: #e2e8f0;
            border: 1px solid #3a4759;
            padding: 12px 24px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }
        .garage-menu button:hover, .garage-menu button.active {
            border-color: #c5a059;
            color: #c5a059;
            background: rgba(197, 160, 89, 0.15);
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.3);
            transform: translateX(-5px);
        }

        /* Painel de Controlos */
        .controls-card {
            position: absolute;
            bottom: 35px;
            left: 35px;
            z-index: 10;
            background: rgba(4, 6, 10, 0.75);
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 12px;
            color: #cbd5e1;
            border: 1px solid rgba(255,255,255,0.08);
            line-height: 1.8;
            backdrop-filter: blur(5px);
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <div id="canvas-3d"></div>

    <div class="hud">
        <h1>Apex Luxury Driving</h1>
        <p>Veículo: <span id="lbl-modelo">Centenario Sport</span></p>
        <p>Motorização: <span id="lbl-motor">V12 Atmosférico — 770 cv</span></p>
    </div>

    <div class="garage-menu">
        <button class="active" onclick="trocarVeiculo(0, this)">Centenario Rosso</button>
        <button onclick="trocarVeiculo(1, this)">Chiron Vert</button>
        <button onclick="trocarVeiculo(2, this)">Pure Gold Concept</button>
    </div>

    <div class="speedometer">
        <div class="number" id="lbl-velocidade">0</div>
        <div class="unit">km/h</div>
    </div>

    <div class="controls-card">
        <strong>SIMULADOR REALISTA:</strong><br>
        • Acelerar / Direção: WASD ou Setas<br>
        • Travão de Mão: Barra de Espaço<br>
        • Recuperar Posição: R
    </div>

<script>
    // --- VARIÁVEIS GLOBAIS DA ENGINE ---
    let cena, camera, renderizador;
    let veiculo3D, componentesRodas = [];
    let obstaculosMundo = [];

    // Modelos realistas com comportamentos físicos distintos
    const garagemElite = [
        { nome: "Centenario Rosso", motor: "V12 Atmosférico — 770 cv", cor: 0x990000, maxVel: 0.95, aceleracao: 0.016, grip: 0.045 },
        { nome: "Chiron Vert Mamba", motor: "W16 Quad-Turbo — 1500 cv", cor: 0x005c29, maxVel: 1.20, aceleracao: 0.024, grip: 0.038 },
        { nome: "Pure Gold Concept", motor: "Eletro-Indução — 2000 cv", cor: 0xb89000, maxVel: 1.40, aceleracao: 0.032, grip: 0.032 }
    ];

    // Propriedades físicas dinâmicas do carro
    let fisicaInercial = {
        posX: 0, posZ: 0, posY: 0.25,
        velocidadeAtual: 0,
        anguloDirecao: 0,
        maxVelocidade: 0.95,
        taxaAceleracao: 0.016,
        friccaoAsfalto: 0.007,
        forcaTravao: 0.025,
        velocidadeCurva: 0.042
    };

    // Estado das entradas (Input)
    let comandoAcelerar = false;
    let comandoRe = false;
    let virarEsquerda = false;
    let virarDireita = false;
    let travaoMaoActive = false;

    // --- INICIALIZAÇÃO E AMBIENTE 3D ---
    function iniciarEngine() {
        const stage = document.getElementById("canvas-3d");

        // Inicializar a Cena com atmosfera escura (Estilo simulador noturno)
        cena = new THREE.Scene();
        cena.background = new THREE.Color(0x04060a);
        cena.fog = new THREE.FogExp2(0x04060a, 0.02);

        // Câmara de Perseguição Realista
        camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Renderizador Avançado com Antialiasing e Sombras Soft ativas
        renderizador = new THREE.WebGLRenderer({ antialias: true });
        renderizador.setSize(window.innerWidth, window.innerHeight);
        renderizador.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderizador.shadowMap.enabled = true;
        renderizador.shadowMap.type = THREE.PCFSoftShadowMap;
        stage.appendChild(renderizador.domElement);

        // ILUMINAÇÃO ESTÚDIO AVANÇADA
        const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.15);
        cena.add(luzAmbiente);

        // Luz Direcional (Simulação de reflexo da lua/iluminação geral do céu)
        const solLuz = new THREE.DirectionalLight(0xffffff, 1.0);
        solLuz.position.set(30, 60, 30);
        solLuz.castShadow = true;
        solLuz.shadow.mapSize.width = 2048;
        solLuz.shadow.mapSize.height = 2048;
        solLuz.shadow.camera.near = 0.5;
        solLuz.shadow.camera.far = 200;
        const d = 50;
        solLuz.shadow.camera.left = -d;
        solLuz.shadow.camera.right = d;
        solLuz.shadow.camera.top = d;
        solLuz.shadow.camera.bottom = -d;
        cena.add(solLuz);

        // Construção do circuito / mapa do simulador
        criarAmbienteMapa();

        // Carregar o modelo padrão
        construirVeiculoLuxo(garagemElite[0].cor);

        // Ativar listeners
        mapearEntradasTeclado();

        // Inicializar o loop de frames
        loopGraficoFisico();
    }

    // --- CONSTRUÇÃO DO CENÁRIO ESPELHADO / CIRCUITO ---
    function criarAmbienteMapa() {
        // Chão/Asfalto Molhado Reflexivo de Alta Performance (Visual Realista)
        const asfaltoGeo = new THREE.PlaneGeometry(400, 400);
        const asfaltoMat = new THREE.MeshStandardMaterial({ 
            color: 0x0b0e14, 
            roughness: 0.25,  // Baixo roughness simula pista molhada com reflexos bonitos
            metalness: 0.7 
        });
        const pistaMesh = new THREE.Mesh(asfaltoGeo, asfaltoMat);
        pistaMesh.rotation.x = -Math.PI / 2;
        pistaMesh.receiveShadow = true;
        cena.add(pistaMesh);

        // Malha de Linhas Guia Tecnológicas / Neon
        const gridLinhas = new THREE.GridHelper(400, 80, 0xc5a059, 0x161d2a);
        gridLinhas.position.y = 0.005;
        cena.add(gridLinhas);

        // Obstáculos de Teste Físico
        adicionarEstruturaMundo(new THREE.BoxGeometry(16, 2, 25), 0x1f2736, 0, 0, -50, 0.06); // Rampa Realista suave
        adicionarEstruturaMundo(new THREE.BoxGeometry(30, 4, 6), 0xc5a059, 30, 0, 40, 0);     // Barreira Metálica
        adicionarEstruturaMundo(new THREE.BoxGeometry(10, 6, 10), 0x0f141f, -40, 0, -10, 0);   // Bloco Arquitetónico

        // Torres de Iluminação Neon (Gera reflexos verticais na lataria dos carros)
        for(let z = -150; z <= 150; z += 50) {
            if(z === 0) continue;
            criarPosteIluminacao(25, z, 0xff0055);
            criarPosteIluminacao(-25, z, 0x00e5ff);
        }
    }

    function adicionarEstruturaMundo(geometria, cor, x, y, z, rotX = 0) {
        const mat = new THREE.MeshStandardMaterial({ color: cor, roughness: 0.3, metalness: 0.4 });
        const mesh = new THREE.Mesh(geometria, mat);
        mesh.position.set(x, y + geometria.parameters.height/2, z);
        mesh.rotation.x = rotX;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        cena.add(mesh);
        obstaculosMundo.push(mesh);
    }

    function criarPosteIluminacao(x, z, corNeon) {
        const posteGrupo = new THREE.Group();
        
        const posteGeo = new THREE.CylinderGeometry(0.08, 0.12, 7, 8);
        const posteMat = new THREE.MeshStandardMaterial({ color: 0x242d38, metalness: 0.8 });
        const poste = new THREE.Mesh(posteGeo, posteMat);
        poste.position.y = 3.5;
        posteGrupo.add(poste);

        const barraGeo = new THREE.BoxGeometry(0.5, 0.15, 1.5);
        const barraMat = new THREE.MeshBasicMaterial({ color: corNeon });
        const barra = new THREE.Mesh(barraGeo, barraMat);
        barra.position.set(x > 0 ? -0.6 : 0.6, 7, 0);
        posteGrupo.add(barra);

        // Luz dinâmica real projetada na pista e no carro
        const luzSpot = new THREE.PointLight(corNeon, 1.2, 20);
        luzSpot.position.set(x > 0 ? -0.6 : 0.6, 6.7, 0);
        posteGrupo.add(luzSpot);

        posteGrupo.position.set(x, 0, z);
        cena.add(posteGrupo);
    }

    // --- MODELAÇÃO 3D REALISTA DE LUXO (PBR MATERIALS) ---
    function construirVeiculoLuxo(corPinturaHex) {
        if (veiculo3D) cena.remove(veiculo3D);
        componentesRodas = [];

        veiculo3D = new THREE.Group();

        // Materiais com propriedades realistas automotivas (Metalização e Verniz Líquido)
        const materialLataria = new THREE.MeshStandardMaterial({
            color: corPinturaHex,
            metalness: 0.95,
            roughness: 0.05,
            clearcoat: 1.0,         // Camada extra de verniz automotivo brilhante
            clearcoatRoughness: 0.02
        });

        const materialVidros = new THREE.MeshStandardMaterial({ color: 0x05070a, roughness: 0.0, metalness: 1.0 });
        const materialBorracha = new THREE.MeshStandardMaterial({ color: 0x0e0e0e, roughness: 0.85 });
        const materialJanteCromo = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.95, roughness: 0.1 });
        const materialFarolLed = new THREE.MeshBasicMaterial({ color: 0xffffff });

        // Chassi Principal - Curvas Desportivas Aerodinâmicas
        const chassiGeo = new THREE.BoxGeometry(1.45, 0.32, 3.1);
        const chassiMesh = new THREE.Mesh(chassiGeo, materialLataria);
        chassiMesh.position.y = 0.28;
        chassiMesh.castShadow = true;
        chassiMesh.receiveShadow = true;
        veiculo3D.add(chassiMesh);

        // Cabine Estilo GTR/Supercar Hyper-Aero
        const cabineGeo = new THREE.SphereGeometry(0.44, 24, 24);
        const cabineMesh = new THREE.Mesh(cabineGeo, materialVidros);
        cabineMesh.position.set(0, 0.42, -0.05);
        cabineMesh.scale.set(1.1, 0.75, 2.3);
        cabineMesh.castShadow = true;
        veiculo3D.add(cabineMesh);

        // Spoiler de Fibra / Deflector Traseiro Ativo
        const suporteAileron = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.25, 0.08), materialVidros);
        suporteAileron.position.set(0.52, 0.45, 1.35);
        const suporteAileronR = suporteAileron.clone();
        suporteAileronR.position.x = -0.52;
        veiculo3D.add(suporteAileron, suporteAileronR);

        const asaAsa = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.03, 0.35), materialLataria);
        asaAsa.position.set(0, 0.58, 1.35);
        asaAsa.castShadow = true;
        veiculo3D.add(asaAsa);

        // Faróis em Barra LED Dianteira Realista
        const ledMeshL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.04, 0.08), materialFarolLed);
        ledMeshL.position.set(0.5, 0.24, -1.55);
        const ledMeshR = ledMeshL.clone();
        ledMeshR.position.x = -0.5;
        veiculo3D.add(ledMeshL, ledMeshR);

        // Rodas Liga Leve com Jantes Cromadas Detalhadas
        const geometriaPneu = new THREE.CylinderGeometry(0.3, 0.3, 0.26, 32);
        geometriaPneu.rotateZ(Math.PI / 2); // Alinhamento

        const coordenadasEixos = [
            { x: 0.78, y: 0.2, z: -0.92 }, { x: -0.78, y: 0.2, z: -0.92 }, // Dianteiras
            { x: 0.78, y: 0.2, z: 0.95 },  { x: -0.78, y: 0.2, z: 0.95 }   // Traseiras
        ];

        coordenadasEixos.forEach((eixo, i) => {
            const pneu = new THREE.Mesh(geometriaPneu, materialBorracha);
            
            // Núcleo / Jante de Alumínio Escovado Cromado
            const jante = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.28, 12), materialJanteCromo);
            jante.rotateZ(Math.PI / 2);
            pneu.add(jante);

            pneu.position.set(eixo.x, eixo.y, eixo.z);
            pneu.castShadow = true;
            veiculo3D.add(pneu);
            componentesRodas.push(pneu); // Para animação dinâmica rotativa
        });

        cena.add(veiculo3D);
        veiculo3D.position.set(fisicaInercial.posX, fisicaInercial.posY, fisicaInercial.posZ);
    }

    // Troca de carros em tempo real através da Garagem Lateral
    function trocarVeiculo(indice, botaoNode) {
        document.querySelectorAll('.garage-menu button').forEach(b => b.classList.remove('active'));
        botaoNode.classList.add('active');

        // Modificar interface de dados
        document.getElementById("lbl-modelo").innerText = garagemElite[indice].nome;
        document.getElementById("lbl-motor").innerText = garagemElite[indice].motor;

        // Modificar parâmetros da simulação física
        let carroSel = garagemElite[indice];
        fisicaInercial.maxVelocidade = carroSel.maxVel;
        fisicaInercial.taxaAceleracao = carroSel.aceleracao;
        fisicaInercial.velocidadeCurva = carroSel.grip;

        // Resetar posições para segurança física e instanciar novo modelo 3D
        construirVeiculoLuxo(carroSel.cor);
    }

    // --- CAPTAÇÃO E MAPEAMENTO DOS INPUTS ---
    function mapearEntradasTeclado() {
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'arrowup' || key === 'w') comandoAcelerar = true;
            if (key === 'arrowdown' || key === 's') comandoRe = true;
            if (key === 'arrowleft' || key === 'a') virarEsquerda = true;
            if (key === 'arrowright' || key === 'd') virarDireita = true;
            if (e.key === ' ') travaoMaoActive = true;
            if (key === 'r') forcarResetPosicao();
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'arrowup' || key === 'w') comandoAcelerar = false;
            if (key === 'arrowdown' || key === 's') comandoRe = false;
            if (key === 'arrowleft' || key === 'a') virarEsquerda = false;
            if (key === 'arrowright' || key === 'd') virarDireita = false;
            if (e.key === ' ') travaoMaoActive = false;
        });
    }

    function forcarResetPosicao() {
        fisicaInercial.posX = 0;
        fisicaInercial.posZ = 0;
        fisicaInercial.posY = 0.25;
        fisicaInercial.velocidadeAtual = 0;
        fisicaInercial.anguloDirecao = 0;
        veiculo3D.rotation.set(0, 0, 0);
    }

    // --- LOOP DE FÍSICA INERCIAL E CONDUÇÃO ---
    function loopGraficoFisico() {
        requestAnimationFrame(loopGraficoFisico);

        // 1. Equações de Inércia e Desaceleração Progressiva
        if (comandoAcelerar) {
            fisicaInercial.velocidadeAtual += fisicaInercial.taxaAceleracao;
            if (fisicaInercial.velocidadeAtual > fisicaInercial.maxVelocidade) {
                fisicaInercial.velocidadeAtual = fisicaInercial.maxVelocidade;
            }
        } else if (comandoRe) {
            fisicaInercial.velocidadeAtual -= fisicaInercial.taxaAceleracao * 0.5;
            if (fisicaInercial.velocidadeAtual < -fisicaInercial.maxVelocidade * 0.3) {
                fisicaInercial.velocidadeAtual = -fisicaInercial.maxVelocidade * 0.3;
            }
        } else {
            // Atrito de rolamento natural do pneu no asfalto
            if (fisicaInercial.velocidadeAtual > 0) fisicaInercial.velocidadeAtual -= fisicaInercial.friccaoAsfalto;
            if (fisicaInercial.velocidadeAtual < 0) fisicaInercial.velocidadeAtual += fisicaInercial.friccaoAsfalto;
            if (Math.abs(fisicaInercial.velocidadeAtual) < 0.004) fisicaInercial.velocidadeAtual = 0;
        }

        // Aplicação do Travão de Mão (Efeito Desaceleração Instantânea)
        if (travaoMaoActive) {
            if (fisicaInercial.velocidadeAtual > 0) fisicaInercial.velocidadeAtual -= fisicaInercial.forcaTravao;
            if (fisicaInercial.velocidadeAtual < 0) fisicaInercial.velocidadeAtual += fisicaInercial.forcaTravao;
        }

        // Direção e Ângulo de viragem baseados no movimento real (Carro estático não vira)
        if (Math.abs(fisicaInercial.velocidadeAtual) > 0.03) {
            const sentidoMarchar = fisicaInercial.velocidadeAtual > 0 ? 1 : -1;
            if (virarEsquerda) fisicaInercial.anguloDirecao += fisicaInercial.velocidadeCurva * sentidoMarchar;
            if (virarDireita) fisicaInercial.anguloDirecao -= fisicaInercial.velocidadeCurva * sentidoMarchar;
        }

        // Transposição de vetores trigonométricos para o plano cartesiano X e Z
        fisicaInercial.posX -= Math.sin(fisicaInercial.anguloDirecao) * fisicaInercial.velocidadeAtual;
        fisicaInercial.posZ -= Math.cos(fisicaInercial.anguloDirecao) * fisicaInercial.velocidadeAtual;

        // Barreiras de Limite do Mundo Aberto (Prevenir Queda Livre no Vazio)
        fisicaInercial.posX = Math.max(-195, Math.min(195, fisicaInercial.posX));
        fisicaInercial.posZ = Math.max(-195, Math.min(195, fisicaInercial.posZ));

        // Atualizar transformações no Objeto 3D do veículo
        if (veiculo3D) {
            veiculo3D.position.x = fisicaInercial.posX;
            veiculo3D.position.z = fisicaInercial.posZ;
            veiculo3D.rotation.y = fisicaInercial.anguloDirecao;

            // Animação mecânica das jantes em movimento
            componentesRodas.forEach((rodaMesh, indice) => {
                rodaMesh.rotation.x -= fisicaInercial.velocidadeAtual * 1.8;
                
                // Viragem física visual das duas rodas frontais da direção
                if (indice < 2) {
                    if (virarEsquerda) rodaMesh.rotation.y = 0.35;
                    else if (virarDireita) rodaMesh.rotation.y = -0.35;
                    else rodaMesh.rotation.y = 0;
                }
            });
        }

        // 2. Sistema Inteligente de Câmara Cinemática Dinâmica (Suave)
        const recuoDistancia = 5.8;
        const elevacaoCam = 2.1;

        const cameraIdealX = fisicaInercial.posX + Math.sin(fisicaInercial.anguloDirecao) * recuoDistancia;
        const cameraIdealZ = fisicaInercial.posZ + Math.cos(fisicaInercial.anguloDirecao) * recuoDistancia;

        // Interpolação Linear (Lerp) para simular o peso real e atraso fluido da câmara de jogo
        camera.position.x += (cameraIdealX - camera.position.x) * 0.08;
        camera.position.z += (cameraIdealZ - camera.position.z) * 0.08;
        camera.position.y += ((fisicaInercial.posY + elevacaoCam) - camera.position.y) * 0.08;

        // Focar à frente da frente do carro para dar sensação de velocidade realista
        camera.lookAt(fisicaInercial.posX, fisicaInercial.posY + 0.35, fisicaInercial.posZ);

        // 3. Atualizar Painel Digital Speedometer (Escala Real de KMH)
        const conversaoKmh = Math.round(Math.abs(fisicaInercial.velocidadeAtual) * 340);
        document.getElementById("lbl-velocidade").innerText = conversaoKmh;

        // Renderizar frame
        renderizador.render(cena, camera);
    }

    // Auto-ajuste adaptável caso a janela mude de resolução
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderizador.setSize(window.innerWidth, window.innerHeight);
    });

    // Iniciar tudo ao carregar o DOM
