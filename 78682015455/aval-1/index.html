<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jogo de Damas</title>
<style>
body{
    margin:0;
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
}

#container{
    text-align:center;
    color:white;
}

canvas{
    border:4px solid white;
    background:#fff;
    cursor:pointer;
}

h2{
    margin-bottom:10px;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div id="container">
<h2 id="status">Vez: Vermelho</h2>
<canvas id="board" width="640" height="640"></canvas>
</div>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

const SIZE = 80;
let currentPlayer = "red";
let selected = null;

const board = [];

for(let y=0;y<8;y++){
    board[y]=[];
    for(let x=0;x<8;x++){

        board[y][x]=null;

        if((x+y)%2==1){

            if(y<3){
                board[y][x]={
                    color:"black",
                    king:false
                };
            }

            if(y>4){
                board[y][x]={
                    color:"red",
                    king:false
                };
            }

        }

    }
}

function draw(){

ctx.clearRect(0,0,640,640);

for(let y=0;y<8;y++){
for(let x=0;x<8;x++){

ctx.fillStyle=((x+y)%2==0)?"#EEE":"#654321";
ctx.fillRect(x*SIZE,y*SIZE,SIZE,SIZE);

if(selected &&
selected.x==x &&
selected.y==y){

ctx.strokeStyle="yellow";
ctx.lineWidth=5;
ctx.strokeRect(x*SIZE+2,y*SIZE+2,SIZE-4,SIZE-4);

}

let p=board[y][x];

if(p){

ctx.beginPath();

ctx.fillStyle=p.color;
ctx.arc(
x*SIZE+40,
y*SIZE+40,
28,
0,
Math.PI*2
);

ctx.fill();

if(p.king){
ctx.fillStyle="gold";
ctx.font="30px Arial";
ctx.fillText("★",x*SIZE+28,y*SIZE+50);
}

}

}
}

}

function inside(x,y){
return x>=0 && x<8 && y>=0 && y<8;
}

canvas.onclick=e=>{

const rect=canvas.getBoundingClientRect();

const x=Math.floor((e.clientX-rect.left)/SIZE);
const y=Math.floor((e.clientY-rect.top)/SIZE);

const piece=board[y][x];

if(piece && piece.color==currentPlayer){
selected={x,y};
draw();
return;
}

if(!selected)return;

move(selected.x,selected.y,x,y);

};

function move(sx,sy,tx,ty){

const piece=board[sy][sx];

if(!piece)return;

if(board[ty][tx])return;

let dir=piece.color=="red"?-1:1;

let dx=tx-sx;
let dy=ty-sy;

let ok=false;

// Movimento simples
if(piece.king){

if(Math.abs(dx)==1 && Math.abs(dy)==1)
ok=true;

}else{

if(Math.abs(dx)==1 && dy==dir)
ok=true;

}

// Captura
if(piece.king){

if(Math.abs(dx)==2 && Math.abs(dy)==2){

let mx=sx+dx/2;
let my=sy+dy/2;

let enemy=board[my][mx];

if(enemy && enemy.color!=piece.color){

board[my][mx]=null;
ok=true;

}

}

}else{

if(Math.abs(dx)==2 && dy==dir*2){

let mx=sx+dx/2;
let my=sy+dy/2;

let enemy=board[my][mx];

if(enemy && enemy.color!=piece.color){

board[my][mx]=null;
ok=true;

}

}

}

if(!ok)return;

board[ty][tx]=piece;
board[sy][sx]=null;

// Promoção
if(piece.color=="red" && ty==0)
piece.king=true;

if(piece.color=="black" && ty==7)
piece.king=true;

selected=null;

currentPlayer=currentPlayer=="red"?"black":"red";

document.getElementById("status").innerHTML=
"Vez: "+(currentPlayer=="red"?"Vermelho":"Preto");

draw();

}

draw();
</script>

<script src="script.js"></script></body>
</html>
