
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Gerenciador de Tarefas</h1>
        <p class="subtitle">Organize suas atividades!</p>

        <form id="taskForm">
            <input type="text" id="taskInput"
                placeholder="Digite uma tarefa..." required>

            <button type="submit">Adicionar</button>
        </form>

        <input type="text" id="searchInput"
            placeholder="Pesquisar tarefa...">

        <div class="filters">
            <button class="filter active" data-filter="all">Todas</button>
            <button class="filter" data-filter="pending">Pendentes</button>
            <button class="filter" data-filter="completed">Concluídas</button>
        </div>

        <div class="counters">
            <p>Total: <span id="total">0</span></p>
            <p>Pendentes: <span id="pending">0</span></p>
            <p>Concluídas: <span id="completed">0</span></p>
        </div>

        <ul id="taskList"></ul>

        <button id="clearAll" class="clear">
            Excluir todas as tarefas
        </button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
