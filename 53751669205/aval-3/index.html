<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Racing</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>🏎️ TURBO RACING</h1>

        <div class="painel">
            <h2>Pontos: <span id="pontos">0</span></h2>
            <h2>Recorde: <span id="recorde">0</span></h2>
        </div>

        <div id="jogo">
            <div id="estrada"></div>
            <div id="carro"></div>

            <div id="menu">
                <h2>TURBO RACING</h2>
                <p>Desvie dos carros inimigos!</p>
                <button id="iniciar">JOGAR</button>
            </div>
        </div>

        <div class="controles">
            <button id="esquerda">⬅️</button>
            <button id="direita">➡️</button>
        </div>

        <p class="instrucoes">
            Use ← → ou A e D para dirigir.
        </p>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
