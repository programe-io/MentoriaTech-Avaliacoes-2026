<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Tiro</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div id="menu">
        <h1>🔫 ARENA DE TIRO</h1>
        <p>WASD para mover • Mouse para mirar • Clique para atirar</p>
        <button onclick="iniciarJogo()">JOGAR</button>
    </div>

    <div id="hud">
        <div>❤️ Vida: <span id="vida">100</span></div>
        <div>🎯 Pontos: <span id="pontos">0</span></div>
        <div>👾 Inimigos: <span id="inimigos">0</span></div>
    </div>

    <canvas id="game"></canvas>

    <div id="gameOver">
        <h1>GAME OVER</h1>
        <p>Pontuação: <span id="pontuacaoFinal">0</span></p>
        <button onclick="iniciarJogo()">JOGAR NOVAMENTE</button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
