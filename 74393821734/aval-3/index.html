
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Gerenciador de Tarefas</h1>

        <section class="formulario">
            <h2>Cadastrar Nova Tarefa</h2>

            <label for="titulo">Título:</label>
            <input
                type="text"
                id="titulo"
                placeholder="Digite o título da tarefa"
            >

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade">
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
            </select>

            <button type="button">Cadastrar Tarefa</button>
        </section>

        <section class="lista">
            <h2>Minhas Tarefas</h2>

            <div id="tarefas">

                <div class="tarefa">
                    <h3>Estudar JavaScript</h3>
                    <p><strong>Código:</strong> 1</p>
                    <p><strong>Prioridade:</strong> Alta</p>
                    <p><strong>Status:</strong> Pendente</p>

                    <div class="acoes">
                        <button class="concluir">Concluir</button>
                        <button class="alterar">Alterar prioridade</button>
                    </div>
                </div>

                <div class="tarefa">
                    <h3>Fazer atividade</h3>
                    <p><strong>Código:</strong> 2</p>
                    <p><strong>Prioridade:</strong> Média</p>
                    <p><strong>Status:</strong> Concluída</p>

                    <div class="acoes">
                        <button class="concluir">Concluir</button>
                        <button class="alterar">Alterar prioridade</button>
                    </div>
                </div>

            </div>
        </section>

    </div>

<script src="script.js"></script></body>
</html>
