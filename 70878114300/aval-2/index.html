<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            width: 260px;
        }
        #display {
            width: 100%;
            height: 50px;
            background-color: #fff;
            font-size: 24px;
            text-align: right;
            padding: 5px 10px;
            box-sizing: border-box;
            border: none;
            border-radius: 5px;
            margin-bottom: 15px;
            color: #333;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #e0e0e0;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #d4d4d4;
        }
        .operator {
            background-color: #ff9500;
            color: white;
        }
        .operator:hover {
            background-color: #e08500;
        }
        .equal {
            background-color: #34c759;
            color: white;
            grid-column: span 2;
        }
        .equal:hover {
            background-color: #2db84d;
        }
        .clear {
            background-color: #ff3b30;
            color: white;
            grid-column: span 2;
        }
        .clear:hover {
            background-color: #e03229;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="limparDisplay()">C</button>
            <button class="operator" onclick="adicionarCaractere('/')">/</button>
            <button class="operator" onclick="adicionarCaractere('*')">×</button>
            
            <button onclick="adicionarCaractere('7')">7</button>
            <button onclick="adicionarCaractere('8')">8</button>
            <button onclick="adicionarCaractere('9')">9</button>
            <button class="operator" onclick="adicionarCaractere('-')">-</button>
            
            <button onclick="adicionarCaractere('4')">4</button>
            <button onclick="adicionarCaractere('5')">5</button>
            <button onclick="adicionarCaractere('6')">6</button>
            <button class="operator" onclick="adicionarCaractere('+')">+</button>
            
            <button onclick="adicionarCaractere('1')">1</button>
            <button onclick="adicionarCaractere('2')">2</button>
            <button onclick="adicionarCaractere('3')">3</button>
            <button class="equal" onclick="calcular()">=</button>
            
            <button onclick="adicionarCaractere('0')" style="grid-column: span 2;">0</button>
            <button onclick="adicionarCaractere('.')">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        // Adiciona números ou operadores ao visor
        function adicionarCaractere(caractere) {
            display.value += caractere;
        }

        // Limpa todo o visor
        function limparDisplay() {
            display.value = '';
        }

        // Realiza o cálculo matemático usando a função eval()
        function calcular() {
            try {
                // Substitui o símbolo de multiplicação visual para o padrão do JS
                let expressao = display.value.replace(/×/g, '*');
                display.value = eval(expressao);
            } catch (error) {
                display.value = 'Erro';
            }
        }
    </script>

<script src="script.js"></script></body>
</html>
