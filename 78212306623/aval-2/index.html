<DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8"><!

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NOLL</title>

<style>

/* ==============================
   CORES DO LIVE
================================ */

:root {

    --blue: #1683ff;
    --blue-dark: #0966d5;

    --green: #18d477;
    --green-dark: #0caf5d;

    --bg: #071019;
    --surface: #0e1925;
    --surface-light: #142333;

    --text: #f4f8fc;
    --muted: #8998a8;

    --border: rgba(255,255,255,.08);

    --danger: #ff5574;

}


/* ==============================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #102b42 0,
            var(--bg) 38%
        );

    color:
        var(--text);

    min-height: 100vh;

}


/* ==============================
   CABEÇALHO
================================ */

.header {

    height: 70px;

    position: sticky;

    top: 0;

    z-index: 100;

    background:
        rgba(7,16,25,.88);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid var(--border);

}


.header-inner {

    width: 100%;

    max-width: 950px;

    height: 100%;

    margin: auto;

    padding:
        0 18px;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


.logo {

    font-size: 27px;

    font-weight: 900;

    letter-spacing:
        -1.5px;

}


.logo-blue {
    color: var(--blue);
}

.logo-green {
    color: var(--green);
}


.online {

    display: flex;

    align-items: center;

    gap: 7px;

    font-size: 12px;

    color: var(--green);

    font-weight: bold;

}


.online-dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 12px var(--green);

}


/* ==============================
   CONTAINER
================================ */

.container {

    width: 100%;

    max-width: 760px;

    margin: auto;

    padding:
        35px 15px 80px;

}


/* ==============================
   HERO
================================ */

.hero {

    margin-bottom: 25px;

}


.hero-label {

    color:
        var(--green);

    font-size:
        12px;

    font-weight:
        bold;

    letter-spacing:
        1.5px;

    margin-bottom:
        8px;

}


.hero h1 {

    font-size:
        clamp(30px, 7vw, 48px);

    line-height:
        1.05;

    letter-spacing:
        -2px;

    margin-bottom:
        12px;

}


.hero h1 span {

    color:
        var(--blue);

}


.hero p {

    color:
        var(--muted);

    line-height:
        1.6;

    max-width:
        620px;

}


/* ==============================
   ÁREA DE PUBLICAÇÃO
================================ */

.publisher {

    background:
        linear-gradient(
            145deg,
            var(--surface-light),
            var(--surface)
        );

    border:
        1px solid var(--border);

    border-radius:
        22px;

    padding:
        20px;

    margin-bottom:
        28px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.22);

}


.publisher-top {

    display:
        flex;

    gap:
        13px;

}


.avatar {

    width:
        43px;

    height:
        43px;

    min-width:
        43px;

    border-radius:
        50%;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--green)
        );

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-weight:
        900;

    color:
        white;

}


.fields {

    width:
        100%;

}


.title-input {

    width:
        100%;

    background:
        transparent;

    border:
        none;

    outline:
        none;

    color:
        var(--text);

    font-size:
        18px;

    font-weight:
        bold;

    margin-bottom:
        10px;

}


.title-input::placeholder,
.message-input::placeholder {

    color:
        #607082;

}


.message-input {

    width:
        100%;

    min-height:
        85px;

    resize:
        vertical;

    background:
        transparent;

    border:
        none;

    outline:
        none;

    color:
        var(--text);

    font-family:
        inherit;

    font-size:
        15px;

    line-height:
        1.6;

}


/* ==============================
   PREVIEW
================================ */

.preview {

    margin-top:
        15px;

}


.preview img,
.preview video {

    width:
        100%;

    max-height:
        400px;

    object-fit:
        contain;

    background:
        #020609;

    border-radius:
        15px;

    display:
        block;

}


/* ==============================
   CONTROLES
================================ */

.publisher-footer {

    border-top:
        1px solid var(--border);

    margin-top:
        15px;

    padding-top:
        14px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

}


.attach {

    background:
        rgba(255,255,255,.05);

    color:
        var(--muted);

    border:
        1px solid var(--border);

    border-radius:
        11px;

    padding:
        10px 13px;

    cursor:
        pointer;

    font-size:
        13px;

}


.attach:hover {

    color:
        white;

    border-color:
        var(--blue);

}


#mediaInput {

    display:
        none;

}


.publish {

    border:
        none;

    color:
        white;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            #1265dc
        );

    padding:
        11px 20px;

    border-radius:
        11px;

    font-weight:
        bold;

    cursor:
        pointer;

    box-shadow:
        0 5px 20px rgba(22,131,255,.25);

}


.publish:hover {

    transform:
        translateY(-1px);

}


/* ==============================
   CABEÇALHO DO FEED
================================ */

.feed-header {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        14px;

}


.feed-title {

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

}


.feed-title h2 {

    font-size:
        18px;

}


.live-badge {

    color:
        var(--green);

    border:
        1px solid rgba(24,212,119,.25);

    background:
        rgba(24,212,119,.08);

    border-radius:
        30px;

    padding:
        5px 8px;

    font-size:
        10px;

    font-weight:
        bold;

}


/* ==============================
   POST
================================ */

.post {

    background:
        rgba(14,25,37,.92);

    border:
        1px solid var(--border);

    border-radius:
        20px;

    overflow:
        hidden;

    margin-bottom:
        17px;

    animation:
        postIn .35s ease;

}


@keyframes postIn {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


.post-header {

    padding:
        17px 18px 9px;

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

}


.post-avatar {

    width:
        39px;

    height:
        39px;

    border-radius:
        50%;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--green)
        );

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-weight:
        bold;

}


.author strong {

    display:
        block;

    font-size:
        14px;

}


.author small {

    color:
        var(--muted);

    font-size:
        11px;

}


.post-title {

    padding:
        7px 18px 7px;

    font-size:
        20px;

    font-weight:
        bold;

    line-height:
        1.35;

}


.post-text {

    padding:
        0 18px 17px;

    color:
        #c2ccd7;

    line-height:
        1.65;

    white-space:
        pre-wrap;

}


.post-media img,
.post-media video {

    display:
        block;

    width:
        100%;

    max-height:
        550px;

    object-fit:
        contain;

    background:
        #000;

}


/* ==============================
   AÇÕES
================================ */

.actions {

    display:
        flex;

    border-top:
        1px solid var(--border);

    border-bottom:
        1px solid var(--border);

}


.actions button {

    flex:
        1;

    border:
        none;

    background:
        transparent;

    color:
        var(--muted);

    padding:
        13px 8px;

    cursor:
        pointer;

    font-size:
        13px;

}


.actions button:hover {

    background:
        rgba(255,255,255,.035);

    color:
        white;

}


.actions .liked {

    color:
        var(--danger);

}


/* ==============================
   COMENTÁRIOS
================================ */

.comments {

    padding:
        13px 18px 18px;

}


.comment {

    background:
        rgba(255,255,255,.035);

    border:
        1px solid var(--border);

    border-radius:
        12px;

    padding:
        9px 12px;

    margin-bottom:
        7px;

}


.comment strong {

    display:
        block;

    color:
        var(--green);

    font-size:
        12px;

    margin-bottom:
        3px;

}


.comment p {

    color:
        #cbd3dc;

    font-size:
        13px;

    line-height:
        1.4;

}


.comment-form {

    display:
        flex;

    gap:
        7px;

    margin-top:
        10px;

}


.comment-form input {

    flex:
        1;

    min-width:
        0;

    background:
        #0a131d;

    border:
        1px solid var(--border);

    color:
        white;

    outline:
        none;

    padding:
        10px 12px;

    border-radius:
        11px;

}


.comment-form button {

    border:
        none;

    background:
        var(--green);

    color:
        #03140b;

    font-weight:
        bold;

    padding:
        0 15px;

    border-radius:
        11px;

    cursor:
        pointer;

}


/* ==============================
   MOBILE
================================ */

@media(max-width:600px) {

    .container {

        padding:
            25px 10px 70px;

    }


    .publisher,
    .post {

        border-radius:
            16px;

    }


    .publisher-footer {

        align-items:
            stretch;

    }


    .attach,
    .publish {

        flex:
            1;

        text-align:
            center;

    }


    .hero h1 {

        letter-spacing:
            -1px;

    }

}

</style>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>


<body>


<!-- ==============================
     HEADER
================================ -->

<header class="header">

    <div class="header-inner">

        <div class="logo">

            <span class="logo-blue">
                LI
            </span><span class="logo-green">
                VE
            </span>

        </div>


        <div class="online">

            <span class="online-dot"></span>

            ONLINE

        </div>

    </div>

</header>


<!-- ==============================
     CONTEÚDO
================================ -->

<main class="container">


    <section class="hero">

        <div class="hero-label">
            ESPAÇO ABERTO
        </div>

        <h1>
            Compartilhe.
            <span>Comente.</span>
        </h1>

        <p>
            Publique o que quiser, compartilhe
            fotos e vídeos e participe das
            conversas do LIVE.
        </p>

    </section>


    <!-- PUBLICAR -->

    <section class="publisher">

        <div class="publisher-top">

            <div class="avatar">
                V
            </div>


            <div class="fields">

                <input
                    id="title"
                    class="title-input"
                    type="text"
                    maxlength="100"
                    placeholder="Qual é o assunto?"
                >


                <textarea
                    id="message"
                    class="message-input"
                    placeholder="Escreva sua publicação..."
                ></textarea>

            </div>

        </div>


        <div
            id="preview"
            class="preview"
        ></div>


        <div class="publisher-footer">

            <label
                class="attach"
                for="mediaInput"
            >

                📎 Foto / Vídeo

            </label>


            <input
                id="mediaInput"
                type="file"
                accept="image/*,video/*"
            >


            <button
                class="publish"
                onclick="publish()"
            >

                Publicar

            </button>

        </div>

    </section>


    <!-- FEED -->

    <div class="feed-header">

        <div class="feed-title">

            <h2>
                Conversas
            </h2>

            <span class="live-badge">
                ● LIVE
            </span>

        </div>

    </div>


    <section id="feed"></section>


</main>


<script>

/* ==============================
   DADOS
================================ */

let selectedFile = null;

let posts = [];


/* ==============================
   ARQUIVO
================================ */

const mediaInput =
    document.getElementById(
        "mediaInput"
    );


mediaInput.addEventListener(
    "change",
    function() {

        selectedFile =
            this.files[0];

        const preview =
            document.getElementById(
                "preview"
            );


        preview.innerHTML = "";


        if (!selectedFile)
            return;


        const url =
            URL.createObjectURL(
                selectedFile
            );


        if (
            selectedFile.type
                .startsWith("image/")
        ) {

            const img =
                document.createElement(
                    "img"
                );

            img.src = url;

            preview.appendChild(img);

        }


        if (
            selectedFile.type
                .startsWith("video/")
        ) {

            const video =
                document.createElement(
                    "video"
                );

            video.src = url;

            video.controls = true;

            preview.appendChild(video);

        }

    }
);


/* ==============================
   PUBLICAR
================================ */

function publish() {

    const title =
        document
            .getElementById("title")
            .value
            .trim();


    const message =
        document
            .getElementById("message")
            .value
            .trim();


    if (
        !title &&
        !message &&
        !selectedFile
    ) {

        alert(
            "Escreva algo ou adicione uma foto/vídeo."
        );

        return;

    }


    const post = {

        id:
            Date.now(),

        title:
            title || "Nova publicação",

        message:
            message,

        file:
            selectedFile,

        date:
            new Date(),

        likes:
            0,

        liked:
            false,

        comments:
            []

    };


    posts.unshift(post);


    render();


    document
        .getElementById("title")
        .value = "";


    document
        .getElementById("message")
        .value = "";


    document
        .getElementById("preview")
        .innerHTML = "";


    mediaInput.value = "";

    selectedFile = null;

}


/* ==============================
   RENDER
================================ */

function render() {

    const feed =
        document.getElementById(
            "feed"
        );


    feed.innerHTML = "";


    posts.forEach(
        post => {

            feed.appendChild(
                createPost(post)
            );

        }
    );

}


/* ==============================
   POST
================================ */

function createPost(post) {

    const article =
        document.createElement(
            "article"
        );


    article.className =
        "post";


    article.innerHTML = `

        <div class="post-header">

            <div class="post-avatar">
                V
            </div>

            <div class="author">

                <strong>
                    Visitante
                </strong>

                <small>
                    ${formatDate(post.date)}
                </small>

            </div>

        </div>


        <div class="post-title">

            ${escapeHTML(post.title)}

        </div>

    `;


    if (post.message) {

        const text =
            document.createElement(
                "div"
            );


        text.className =
            "post-text";


        text.textContent =
            post.message;


        article.appendChild(text);

    }


    if (post.file) {

        const media =
            document.createElement(
                "div"
            );


        media.className =
            "post-media";


        const url =
            URL.createObjectURL(
                post.file
            );


        if (
            post.file.type
                .startsWith("image/")
        ) {

            const image =
                document.createElement(
                    "img"
                );

            image.src = url;

            media.appendChild(image);

        }


        if (
            post.file.type
                .startsWith("video/")
        ) {

            const video =
                document.createElement(
                    "video"
                );

            video.src = url;

            video.controls = true;

            media.appendChild(video);

        }


        article.appendChild(media);

    }


    /* AÇÕES */

    const actions =
        document.createElement(
            "div"
        );


    actions.className =
        "actions";


    actions.innerHTML = `

        <button class="like-button">

            ❤️ Curtir
            <span>${post.likes}</span>

        </button>


        <button>

            💬 Comentários
            <span>${post.comments.length}</span>

        </button>


        <button class="share-button">

            🔗 Compartilhar

        </button>

    `;


    article.appendChild(actions);


    /* CURTIDA */

    const likeButton =
        actions.querySelector(
            ".like-button"
        );


    likeButton.addEventListener(
        "click",
        function() {

            post.liked =
                !post.liked;


            if (post.liked) {

                post.likes++;

                likeButton.classList.add(
                    "liked"
                );

            } else {

                post.likes--;

                likeButton.classList.remove(
                    "liked"
                );

            }


            render();

        }
    );


    if (post.liked) {

        likeButton.classList.add(
            "liked"
        );

    }


    /* COMENTÁRIOS */

    const comments =
        document.createElement(
            "div"
        );


    comments.className =
        "comments";


    post.comments.forEach(
        comment => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "comment";


            item.innerHTML = `

                <strong>
                    ${escapeHTML(comment.name)}
                </strong>

                <p>
                    ${escapeHTML(comment.text)}
                </p>

            `;


            comments.appendChild(
                item
            );

        }
    );


    /* FORM */

    const form =
        document.createElement(
            "div"
        );


    form.className =
        "comment-form";


    form.innerHTML = `

        <input
            type="text"
            placeholder="Escreva um comentário..."
        >

        <button>
            Enviar
        </button>

    `;


    comments.appendChild(form);

    article.appendChild(comments);


    const input =
        form.querySelector("input");


    const button =
        form.querySelector("button");


    function comment() {

        const value =
            input.value.trim();


        if (!value)
            return;


        post.comments.push({

            name:
                "Visitante",

            text:
                value

        });


        render();

    }


    button.addEventListener(
        "click",
        comment
    );


    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                comment();

            }

        }
    );


    /* COMPARTILHAR */

    const share =
        actions.querySelector(
            ".share-button"
        );


    share.addEventListener(
        "click",
        function() {

            sharePost(post);

        }
    );


    return article;

}


/* ==============================
   COMPARTILHAR
================================ */

function sharePost(post) {

    const data = {

        title:
            post.title,

        text:
            "Confira esta publicação no LIVE.",

        url:
            window.location.href

    };


    if (
        navigator.share
    ) {

        navigator.share(data);

    } else {

        navigator.clipboard
            .writeText(
                window.location.href
            )
            .then(
                () => {

                    alert(
                        "Link copiado!"
                    );

                }
            );

    }

}


/* ==============================
   DATA
================================ */

function formatDate(date) {

    return date.toLocaleString(
        "pt-BR",
        {

            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }
    );

}


/* ==============================
   SEGURANÇA
================================ */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* ==============================
   PUBLICAÇÃO INICIAL
================================ */

posts.push({

    id:
        1,

    title:
        "Bem-vindo ao LIVE",

    message:
        "Este é o espaço do LIVE. Publique uma ideia, foto ou vídeo e participe da conversa.",

    file:
        null,

    date:
        new Date(),

    likes:
        3,

    liked:
        false,

    comments:
        [

            {
                name:
                    "LIVE",

                text:
                    "O espaço está aberto. 🚀"

            }

        ]

});


render();

</script>

</body>

</html>
