
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Clone</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #fafafa;
    color: #262626;
}

.sidebar {
    position: fixed;
    width: 240px;
    height: 100vh;
    border-right: 1px solid #ddd;
    padding: 30px 20px;
    background: white;
}

.logo {
    font-size: 29px;
    font-weight: bold;
    margin-bottom: 45px;
}

.menu div {
    padding: 16px 8px;
    font-size: 16px;
    cursor: pointer;
}

.menu div:hover {
    background: #f2f2f2;
    border-radius: 8px;
}

.main {
    margin-left: 240px;
    display: flex;
    justify-content: center;
    padding: 30px;
}

.content {
    width: 470px;
}

.stories {
    display: flex;
    gap: 17px;
    overflow-x: auto;
    padding: 15px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 25px;
}

.story {
    text-align: center;
    font-size: 12px;
    min-width: 60px;
}

.story img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 3px solid #e1306c;
    padding: 2px;
    object-fit: cover;
    margin-bottom: 5px;
}

.post {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 25px;
}

.post-header {
    display: flex;
    align-items: center;
    padding: 12px;
    gap: 10px;
}

.post-header img {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    object-fit: cover;
}

.username {
    font-weight: bold;
    font-size: 14px;
}

.post-image {
    width: 100%;
    display: block;
    object-fit: cover;
}

.actions {
    padding: 12px;
    font-size: 25px;
    display: flex;
    gap: 15px;
}

.actions span {
    cursor: pointer;
}

.caption {
    padding: 0 12px 15px;
    font-size: 14px;
}

@media(max-width: 750px) {
    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
        padding: 10px;
    }

    .content {
        width: 100%;
        max-width: 470px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

<aside class="sidebar">
    <div class="logo">Instagram</div>

    <div class="menu">
        <div>🏠 Início</div>
        <div>🔍 Pesquisa</div>
        <div>🧭 Explorar</div>
        <div>🎬 Reels</div>
        <div>✉️ Mensagens</div>
        <div>❤️ Notificações</div>
        <div>➕ Criar</div>
        <div>👤 Perfil</div>
        <div>☰ Mais</div>
    </div>
</aside>

<main class="main">
<div class="content">

    <div class="stories">
        <div class="story">
            <img src="https://i.pravatar.cc/100?img=12">
            Seu story
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=5">
            maria
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=8">
            pedro
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=15">
            julia
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=20">
            carlos
        </div>
    </div>

    <article class="post">
        <div class="post-header">
            <img src="https://i.pravatar.cc/100?img=12">
            <span class="username">pedro.lucas</span>
        </div>

        <img class="post-image"
        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900">

        <div class="actions">
            <span>♡</span>
            <span>💬</span>
            <span>➤</span>
            <span style="margin-left:auto">♧</span>
        </div>

        <div class="caption">
            <strong>pedro.lucas</strong>
            Aproveitando a vida! 🌅
        </div>
    </article>

    <article class="post">
        <div class="post-header">
            <img src="https://i.pravatar.cc/100?img=5">
            <span class="username">maria.silva</span>
        </div>

        <img class="post-image"
        src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900">

        <div class="actions">
            <span>♡</span>
            <span>💬</span>
            <span>➤</span>
            <span style="margin-left:auto">♧</span>
        </div>

        <div class="caption">
            <strong>maria.silva</strong>
            Que dia incrível! ❤️
        </div>
    </article>

</div>
</main>

</body>
</html>
