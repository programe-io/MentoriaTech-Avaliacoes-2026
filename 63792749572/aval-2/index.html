<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="feed-container">
  <h2>Mini Feed Social</h2>
  
  <div class="post-box">
    <textarea id="postInput" placeholder="O que você está pensando agora?"></textarea>
    <button id="postButton">Publicar</button>
  </div>

  <div id="feedTimeline" class="timeline">
    <!-- Os posts publicados vão aparecer aqui -->
    <div class="post">
      <p class="post-text">Este é um exemplo de postagem inicial no seu mini feed!</p>
      <span class="post-time">Postado agora mesmo</span>
    </div>
  </div>
</div>
  <script src="script.js"></script>
  
</body>
</html>
