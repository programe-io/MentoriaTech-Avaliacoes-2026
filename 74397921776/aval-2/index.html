<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>
        
        <div class="form-group">
            <input type="text" id="tituloTarefa" placeholder="Título da Tarefa">
            <input type="number" id="prioridadeTarefa" placeholder="Prioridade (Ex: 1)" min="1">
            <button onclick="adicionarTarefaDOM()">Cadastrar</button>
        </div>

        <ul id="listaTarefas">
            <!-- As tarefas serão inseridas aqui via JavaScript -->
        </ul>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
