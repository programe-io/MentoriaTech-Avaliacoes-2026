
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clone Instagram</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body class="min-h-screen bg-gray-100 text-slate-900">

    <header class="sticky top-0 z-50 bg-white border-b border-gray-200 p-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Instagram</h1>

            <input
                type="text"
                placeholder="Pesquisar"
                class="border rounded-lg px-3 py-2"
            >

            <nav class="flex gap-4 text-xl">
                <i class="bx bx-home"></i>
                <i class="bx bx-message"></i>
                <i class="bx bx-plus-circle"></i>
                <i class="bx bx-user"></i>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4">
        <h2 class="text-xl font-semibold mb-4">Feed de publicações</h2>

        <section class="bg-white rounded-xl shadow p-4 max-w-md">
            <h3 class="font-bold mb-2">Meu primeiro post</h3>

            <p class="text-gray-600 mb-3">
                Bem-vindo ao meu clone do Instagram!
            </p>

            <div class="bg-gray-200 rounded-lg p-12 text-center">
                📷 Imagem da publicação
            </div>

            <div class="flex gap-4 mt-4 text-xl">
                <i class="bx bx-heart"></i>
                <i class="bx bx-message-rounded"></i>
                <i class="bx bx-share"></i>
            </div>
        </section>
    </main>

<script src="script.js"></script></body>
</html>
