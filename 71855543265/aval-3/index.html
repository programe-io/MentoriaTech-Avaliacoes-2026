<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <header>
            <h1>Controle de IMC</h1>
            <p>Informe os dados do paciente para calcular o índice</p>
        </header>

        <form id="form-imc">
            <div class="input-group">
                <label for="nome">Nome do Paciente</label>
                <input type="text" id="nome" placeholder="Ex: Maria Silva" required>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" step="0.1" min="1" max="500" placeholder="Ex: 70.5" required>
                </div>

                <div class="input-group">
                    <label for="altura">Altura (m)</label>
                    <input type="number" id="altura" step="0.01" min="0.5" max="2.5" placeholder="Ex: 1.75" required>
                </div>
            </div>

            <button type="submit">Calcular IMC</button>
        </form>

        <section id="resultado" class="resultado-box oculto">
            <h2>Resultado da Avaliação</h2>
            <p><strong>Paciente:</strong> <span id="res-nome"></span></p>
            <p><strong>IMC Calculado:</strong> <span id="res-imc"></span></p>
            <p><strong>Classificação:</strong> <span id="res-classificacao" class="badge"></span></p>
            <p id="res-mensagem" class="mensagem-orientacao"></p>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
