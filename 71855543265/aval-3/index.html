
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <h1>Controle de IMC</h1>
            <p>Calculadora de Índice de Massa Corporal</p>
        </header>

        <main class="card">

            <h2>Dados do Paciente</h2>

            <form id="formIMC">

                <label for="nome">Nome do paciente:</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="peso">Peso (kg):</label>
                <input
                    type="number"
                    id="peso"
                    placeholder="Ex: 70"
                    step="0.1"
                    min="1"
                    required
                >

                <label for="altura">Altura (m):</label>
                <input
                    type="number"
                    id="altura"
                    placeholder="Ex: 1.75"
                    step="0.01"
                    min="0.5"
                    required
                >

                <button type="submit">Calcular IMC</button>

                <button type="reset" class="limpar">
                    Limpar dados
                </button>

            </form>

            <div id="resultado" class="resultado" aria-live="polite">
            </div>

        </main>

        <footer>
            <p>Projeto Prático - Controle de IMC</p>
        </footer>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
