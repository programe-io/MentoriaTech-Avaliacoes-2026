<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed - Rede Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <!-- Cabeçalho -->
        <header class="header">
            <h1>🌐 MiniFeed</h1>
            <div class="perfil-mini">
                <img src="https://i.pravatar.cc/40?img=12" alt="Meu perfil">
                <span>Você</span>
            </div>
        </header>

        <!-- Área de criar post -->
        <section class="criar-post">
            <img src="https://i.pravatar.cc/40?img=12" alt="avatar" class="avatar">
            <div class="campo-post">
                <textarea id="texto-post" placeholder="No que você está pensando?"></textarea>
                <button id="btn-publicar">Publicar</button>
            </div>
        </section>

        <!-- Feed -->
        <main id="feed">
            <!-- Posts gerados via JavaScript -->
        </main>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
