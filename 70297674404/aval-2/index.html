<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Celulares</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>📱 Estoque de Celulares</h1>

        <section class="formulario">
            <h2>Cadastrar Celular</h2>

            <input type="number" id="codigo" placeholder="Código">
            <input type="text" id="descricao" placeholder="Nome do celular">
            <input type="number" id="quantidade" placeholder="Quantidade">
            <input type="number" id="valor" placeholder="Valor" step="0.01">

            <button onclick="cadastrarProduto()">Cadastrar</button>
        </section>

        <section class="produtos">
            <h2>Celulares cadastrados</h2>
            <div id="listaProdutos"></div>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
