<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed de Jogos de Futebol</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <div class="container">
      <h1>Central de Jogos</h1>
      <p>Placares, horários e status das partidas</p>
    </div>
  </header>

  <main class="container">
    <section class="controles">
      <div class="filtros" role="group" aria-label="Filtrar partidas">
        <button class="filtro-btn ativo" data-status="todos">Todos</button>
        <button class="filtro-btn" data-status="ao-vivo">Ao vivo</button>
        <button class="filtro-btn" data-status="encerrado">Encerrados</button>
        <button class="filtro-btn" data-status="agendado">Agendados</button>
      </div>
      <input
        type="search"
        id="busca"
        class="busca"
        placeholder="Buscar time ou campeonato..."
        aria-label="Buscar time ou campeonato"
      />
    </section>

    <section id="feed-jogos" class="feed-jogos" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
