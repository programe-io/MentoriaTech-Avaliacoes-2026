<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Clone</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topbar">
    <div class="topbar-content">
      <h1 class="logo">Instagram</h1>
      <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar" />
      <nav class="nav-icons">
        <button type="button" title="Início">🏠</button>
        <button type="button" title="Mensagens">✉️</button>
        <button type="button" id="newPostBtn" title="Nova publicação">➕</button>
        <button type="button" title="Notificações">🔔</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="feed-column">
      <div class="stories-bar" id="storiesBar"></div>
      <div id="feedContainer"></div>
    </section>

    <aside class="sidebar">
      <div class="profile-card">
        <img src="https://picsum.photos" alt="Seu perfil" class="avatar-lg" />
        <div>
          <strong>voce.dev</strong>
          <p>Desenvolvedor Front-End</p>
        </div>
      </div>
      <div class="suggestions">
        <span>Sugestões para você</span>
        <div class="suggestion-item">
          <img src="https://picsum.photos" alt="Sugestão 1" class="avatar-sm" />
          <div>
            <strong>ana.design</strong>
            <small>Segue você</small>
          </div>
          <button type="button" class="follow-btn">Seguir</button>
        </div>
        <div class="suggestion-item">
          <img src="https://picsum.photos" alt="Sugestão 2" class="avatar-sm" />
          <div>
            <strong>lucas.code</strong>
            <small>Novo no Instagram</small>
          </div>
          <button type="button" class="follow-btn">Seguir</button>
        </div>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
