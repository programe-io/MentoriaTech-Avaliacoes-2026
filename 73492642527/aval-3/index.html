<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <textarea
                        id="codigo"
                        name="codigo"
                        placeholder="Cole seu código HTML, CSS ou JavaScript aqui..."
                        spellcheck="false"
                        required
                    ></textarea>
                    <p class="helper">
                        Confira o conteúdo antes de preparar sua entrega.
                    </p>
                </div>

                <div class="review-box">
                    <h3>Checklist de revisão</h3>
                    <label class="check-item">
                        <input type="checkbox" id="checkCodigo">
                        Revisei o código e corrigi os erros.
                    </label>
                    <label class="check-item">
                        <input type="checkbox" id="checkAtividade">
                        Completei os requisitos da atividade.
                    </label>
                </div>

                <div class="actions">
                    <button type="button" class="btn btn-secondary" id="btnRevisar">
                        Revisar entrega
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Preparar entrega
                        <span aria-hidden="true">→</span>
                    </button>
                </div>

                <p id="mensagem" class="message" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="result-card hidden" id="resultado">
            <div class="result-icon">✓</div>
            <div class="result-content">
                <h2>Entrega preparada!</h2>
                <p id="resumo"></p>
                <div class="result-actions">
                    <button type="button" class="btn btn-primary" id="btnBaixar">
                        Baixar entrega (.json)
                    </button>
                    <button type="button" class="btn btn-secondary" id="btnCopiar">
                        Copiar código
                    </button>
                </div>
            </div>
        </section>

        <footer>
            <p>Área de Entrega de Avaliações</p>
            <p>Confira sua solução antes de enviá-la ao professor.</p>
        </footer>
    </main>
</body>
</html>
  <script src="script.js"></script>
  
</body>
</html>
