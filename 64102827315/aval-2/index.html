<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site com Estrutura HTML5</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        header, nav, footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        main {
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        aside {
            width: 25%;
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        article {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        img {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }

        h3 {
            color: #333;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Meu Site HTML5</h1>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
    </nav>

    <main>

        <aside>
            <h3>Menu Lateral</h3>
            <p>Links importantes:</p>
            <ul>
                <li>Notícias</li>
                <li>Blog</li>
                <li>Suporte</li>
            </ul>
        </aside>

        <article>
            <h3>Artigo Principal</h3>
            <p>
                Este é um exemplo de página usando HTML semântico com imagem.
            </p>

            <img src="https://via.placeholder.com/600x300" alt="Imagem de exemplo">
        </article>

    </main>

    <footer>
        <p>&copy; 2026 Meu Site - Todos os direitos reservados.</p>
    </footer>

<script src="script.js"></script></body>
</html>
