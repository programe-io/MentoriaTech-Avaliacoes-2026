<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto CRUD e Estoque em JavaScript</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { padding: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { margin-bottom: 20px; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        form { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 30px; background: #f9f9f9; padding: 15px; border-radius: 6px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 3; }
        label { margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { background-color: #2ecc71; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #27ae60; }
        .btn-search { background-color: #3498db; }
        .btn-search:hover { background-color: #2980b9; }
        .actions-section { display: flex; gap: 15px; margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 6px; align-items: flex-end; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        th { background-color: #34495e; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .msg { font-size: 14px; font-weight: bold; margin-top: 10px; color: #e74c3c; }
        .success { color: #27ae60; }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h1>Projeto CRUD e Estoque</h1>

    <!-- 10. Função para cadastrar produto -->
    <h2>1. Cadastrar Novo Produto</h2>
    <form id="productForm">
        <div class="form-group full-width">
            <label for="desc">Descrição do Produto</label>
            <input type="text" id="desc" placeholder="Ex: Teclado Mecânico" required>
        </div>
        <div class="form-group">
            <label for="qtd">Quantidade Inicial</label>
            <input type="number" id="qtd" min="0" placeholder="Ex: 10" required>
        </div>
        <div class="form-group">
            <label for="val">Valor Unitário (R\$)</label>
            <input type="number" id="val" min="0" step="0.01" placeholder="Ex: 150.00" required>
        </div>
        <div class="form-group" style="justify-content: flex-end;">
            <button type="submit">Adicionar ao Estoque</button>
        </div>
    </form>
    <div id="cadastroMsg" class="msg"></div>

    <!-- 17. Busca e Gerenciamento de Estoque -->
    <h2>2. Operações e Busca</h2>
    <div class="actions-section">
        <div class="form-group">
            <label for="searchId">Código (ID) do Produto</label>
            <input type="number" id="searchId" placeholder="Ex: 1">
        </div>
        <div class="form-group">
            <label for="newValue">Novo Valor ou Qtd (para atualizar)</label>
            <input type="number" id="newValue" step="0.01" placeholder="Valor ou Quantidade">
        </div>
        <button class="btn-search" onclick="buscarProduto()">Buscar</button>
        <button class="btn-search" style="background-color: #e67e22;" onclick="atualizarValor()">Atualizar Preço</button>
        <!-- 20. Diferença entre alterar valor e somar quantidade -->
        <button class="btn-search" style="background-color: #9b59b6;" onclick="atualizarQuantidade(true)">Somar Qtd</button>
        <button class="btn-search" style="background-color: #c0392b;" onclick="atualizarQuantidade(false)">Subtrair Qtd</button>
    </div>
    <div id="operacoesMsg" class="msg"></div>

    <!-- 14. Função para listar produtos -->
    <h2>3. Lista de Produtos em Estoque</h2>
    <table>
        <thead>
            <tr>
                <th>Código (ID)</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor Unitário</th>
                <th>Total em Estoque</th>
            </tr>
        </thead>
        <tbody id="listaProdutos">
            <!-- Inserido via JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // 4. Criação da lista de produtos (Array Global)
    let estoque = [];
    let proximoId = 1; // 12. Geração automática do código do produto

    const form = document.getElementById('productForm');
    const cadastroMsg = document.getElementById('cadastroMsg');
    const operacoesMsg = document.getElementById('operacoesMsg');

    // 6, 7, 8, 9. Funções de Validação
    function validarProduto(descricao, quantidade, valor) {
        if (!descricao || descricao.trim().length < 3) {
            mostrarMensagem(cadastroMsg, "A descrição deve ter pelo menos 3 caracteres.", false);
            return false;
        }
        if (isNaN(quantidade) || quantidade < 0) {
            mostrarMensagem(cadastroMsg, "A quantidade não pode ser negativa.", false);
            return false;
        }
        if (isNaN(valor) || valor <= 0) {
            mostrarMensagem(cadastroMsg, "O valor do produto deve ser maior que zero.", false);
            return false;
        }
        return true;
    }

    function mostrarMensagem(elemento, texto, status) {
        elemento.innerText = texto;
        elemento.className = status ? "msg success" : "msg";
    }

    // 10. Cadastrar produto
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const desc = document.getElementById('desc').value;
        const qtd = parseInt(document.getElementById('qtd').value);
        const val = parseFloat(document.getElementById('val').value);

        if (!validarProduto(desc, qtd, val)) return;

        // 11. Criação do objeto produto
        const novoProduto = {
            id: proximoId++, // ID automático
            descricao: desc,
            quantidade: qtd,
            valor: val
        };

        // 13. Adição de produtos ao array
        estoque.push(novoProduto);
        
        mostrarMensagem(cadastroMsg, "Produto cadastrado com sucesso!", true);
        form.reset();
        listarProdutos();
    });

    // 14. Função para listar produtos
    function listarProdutos() {
        const tbody = document.getElementById('listaProdutos');
        tbody.innerHTML = "";

        estoque.forEach(produto => {
            const tr = document.createElement('tr');
            const totalItem = produto.quantidade * produto.valor;

            tr.innerHTML = `
                <td>#${produto.id}</td>
                <td>${produto.descricao}</td>
                <td>${produto.quantidade}</td>
                <td>R$ ${produto.valor.toFixed(2)}</td>
                <td>R$ ${totalItem.toFixed(2)}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 17. Busca de produto com find
    function buscarProduto() {
        const idBusca = parseInt(document.getElementById('searchId').value);
        
        const produtoEncontrado = estoque.find(p => p.id === idBusca);

        // 18. Tratamento de produto não encontrado
        if (!produtoEncontrado) {
            mostrarMensagem(operacoesMsg, `Erro: Produto com Código #${idBusca} não foi encontrado.`, false);
            return null;
        }

        mostrarMensagem(operacoesMsg, `Encontrado: ${produtoEncontrado.descricao} | Qtd: ${produtoEncontrado.quantidade} | Preço: R$ ${produtoEncontrado.valor.toFixed(2)}`, true);
        return produtoEncontrado;
    }

    // 16. Função para atualizar o valor do produto
    function atualizarValor() {
        const produto = buscarProduto();
        if (!produto) return;

        const novoPreco = parseFloat(document.getElementById('newValue').value);
        if (isNaN(novoPreco) || novoPreco <= 0) {
            mostrarMensagem(operacoesMsg, "Insira um valor numérico válido maior que zero.", false);
            return;
        }

        produto.valor = novoPreco; // Altera diretamente o valor antigo
        mostrarMensagem(operacoesMsg, `Preço do produto #${produto.id} atualizado para R$ ${novoPreco.toFixed(2)}`, true);
        listarProdutos();
    }

    // 19 e 20. Atualizar quantidade (Diferença entre alterar valor e somar/subtrair quantidade)
    function atualizarQuantidade(deveSomar) {
        const produto = buscarProduto();
        if (!produto) return;

        const qtdInput = parseInt(document.getElementById('newValue').value);
        if (isNaN(qtdInput) || qtdInput <= 0) {
            mostrarMensagem(operacoesMsg, "Insira uma quantidade válida maior que zero.", false);
            return;
        }

        if (deveSomar) {
            produto.quantidade += qtdInput; // Soma à quantidade atual
            mostrarMensagem(operacoesMsg, `Adicionadas ${qtdInput} unidades ao produto #${produto.id}`, true);
        } else {
            if (produto.quantidade - qtdInput < 0) {
                mostrarMensagem(operacoesMsg, "Erro: Saldo de estoque não pode ficar negativo.", false);
                return;
            }
            produto.quantidade -= qtdInput; // Subtrai da quantidade atual
            mostrarMensagem(operacoesMsg, `Removidas ${qtdInput} unidades do produto #${produto.id}`, true);
        }

        listarProdutos();
    }
</script>

<script src="script.js"></script></body>
</html>
