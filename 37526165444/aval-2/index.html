<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Gerenciador de Tarefas</h1>

    <input id="codigo" placeholder="Código">
    <input id="titulo" placeholder="Título">
    
    <select id="prioridade">
        <option value="">Prioridade</option>
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="listar()">Listar</button>

    <br><br>

    <input id="codigoAlterar" placeholder="Código da tarefa">

    <select id="novaPrioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="alterarPrioridade()">Alterar prioridade</button>
    <button onclick="concluir()">Concluir</button>

    <div id="lista"></div>

    <script>
        let tarefas = [];

        function cadastrar() {
            let titulo = document.getElementById("titulo").value;
            let prioridade = document.getElementById("prioridade").value;

            if (titulo.length < 5) {
                alert("O título deve ter no mínimo 5 caracteres!");
                return;
            }

            if (prioridade == "") {
                alert("Escolha uma prioridade!");
                return;
            }

            tarefas.push({
                codigo: document.getElementById("codigo").value,
                titulo: titulo,
                prioridade: prioridade,
                concluida: false
            });

            listar();
        }

        function listar() {
            document.getElementById("lista").innerHTML = "";

            tarefas.forEach(t => {
                document.getElementById("lista").innerHTML +=
                    `<p>
                    Código: ${t.codigo} |
                    Título: ${t.titulo} |
                    Prioridade: ${t.prioridade} |
                    Status: ${t.concluida ? "Concluída" : "Pendente"}
                    </p>`;
            });
        }

        function concluir() {
            let codigo = document.getElementById("codigoAlterar").value;
            let tarefa = tarefas.find(t => t.codigo == codigo);

            if (tarefa) {
                tarefa.concluida = true;
                listar();
            }
        }

        function alterarPrioridade() {
            let codigo = document.getElementById("codigoAlterar").value;
            let tarefa = tarefas.find(t => t.codigo == codigo);

            if (tarefa) {
                tarefa.prioridade =
                    document.getElementById("novaPrioridade").value;
                listar();
            }
        }
    </script>

</body>
</html>
