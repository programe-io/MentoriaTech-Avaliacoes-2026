<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="feed-container">
        <!-- Cabeçalho do Feed -->
        <header class="feed-header">
            <h2>Página Inicial</h2>
        </header>

        <!-- Caixa de Nova Publicação -->
        <div class="tweet-box">
            <div class="avatar">👤</div>
            <form id="tweetForm" class="tweet-form">
                <textarea id="tweetInput" maxlength="280" placeholder="O que está acontecendo?" required></textarea>
                <div class="tweet-box-footer">
                    <span id="charCounter" class="counter">280</span>
                    <button type="submit" id="submitBtn">Postar</button>
                </div>
            </form>
        </div>

        <!-- Área dos Posts -->
        <div id="feedPosts">
            <!-- Post de Exemplo 1 -->
            <div class="post">
                <div class="avatar">🚀</div>
                <div class="post-body">
                    <div class="post-header">
                        <span class="post-author">Dev Aprendiz</span>
                        <span class="post-username">@dev_junior</span>
                    </div>
                    <p class="post-text">Acabei de criar a interface do meu mini feed usando HTML puro e CSS Flexbox! Rumo ao JavaScript. 💻🔥</p>
                    <div class="post-actions">
                        <button class="like-btn" onclick="toggleLike(this)">❤️ <span class="like-count">5</span></button>
                        <button class="delete-btn" onclick="deletePost(this)">🗑️ Excluir</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
