  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    input, select, button {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
    }

    button {
      background-color: #27ae60;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #219150;
    }

    .erro-msg {
      color: #e74c3c;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #2c3e50;
      color: white;
    }

    .concluida {
      text-decoration: line-through;
      color: #7f8c8d;
      background-color: #f9f9f9;
    }

    .prio-1 { color: #e74c3c; font-weight: bold; } /* Alta */
    .prio-2 { color: #e67e22; font-weight: bold; } /* Média */
    .prio-3 { color: #27ae60; font-weight: bold; } /* Baixa */

    .btn-acao {
      padding: 5px 8px;
      font-size: 12px;
      margin-right: 5px;
      background-color: #2980b9;
    }

    .btn-acao:hover {
      background-color: #1f6391;
    }

    .select-prio-inline {
      padding: 3px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gerenciador de Tarefas</h1>

    <div class="form-group">
      <input type="text" id="tituloInput" placeholder="Título da tarefa (mín. 5 caracteres)">
      <select id="prioridadeSelect">
        <option value="1">1 - Alta</option>
        <option value="2" selected>2 - Média</option>
        <option value="3">3 - Baixa</option>
      </select>
      <button onclick="cadastrarTarefa()">Cadastrar</button>
    </div>

</body>
</html>
