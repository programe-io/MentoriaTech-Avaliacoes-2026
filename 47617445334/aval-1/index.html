<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Controle seus produtos de forma simples</p>
    </header>

    <main>

        <!-- Cadastro -->
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="0" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input type="number" id="valor" min="0" step="0.01" required>
                </div>

                <button type="submit">
                    Cadastrar Produto
                </button>

            </form>
        </section>


        <!-- Alterações -->
        <section class="card">

            <h2>Alterar Produto</h2>

            <div class="campo">
                <label for="codigoAlterar">Código do Produto</label>
                <input type="text" id="codigoAlterar">
            </div>

            <div class="botoes">

                <button id="btnValor" class="btn-secundario">
                    Alterar Valor
                </button>

                <button id="btnQuantidade" class="btn-secundario">
                    Alterar Quantidade
                </button>

            </div>

        </section>


        <!-- Lista -->
        <section class="card">

            <h2>Produtos Cadastrados</h2>

            <div id="listaProdutos">
                <p class="vazio">
                    Nenhum produto cadastrado.
                </p>
            </div>

        </section>

    </main>

    <footer>
        <p>Sistema de Estoque © 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
