<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <header>
            <h1>Gerenciamento de Tarefas</h1>
            <p>Cadastre, organize e acompanhe suas tarefas.</p>
        </header>

        <section class="formulario">
            <h2>Cadastrar nova tarefa</h2>

            <form id="formTarefa">
                <div class="campo">
                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título da tarefa"
                        minlength="5"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" required>
                        <option value="1">1 - Alta</option>
                        <option value="2" selected>2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>
                </div>

                <button type="submit">Cadastrar tarefa</button>
            </form>
        </section>

        <section class="lista-tarefas">
            <h2>Tarefas cadastradas</h2>

            <p id="contador">Total de tarefas: 0</p>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaTarefas">
                        <!-- As tarefas serão inseridas pelo JavaScript -->
                    </tbody>
                </table>
            </div>

            <p id="mensagemVazia">Nenhuma tarefa cadastrada.</p>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>$0
