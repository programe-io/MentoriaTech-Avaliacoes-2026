
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodReview - Avalie Restaurantes</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🍽️ FoodReview</h1>
    <p>Descubra, avalie e compartilhe experiências gastronômicas!</p>
</header>

<nav>
    <button onclick="mostrarInicio()">Início</button>
    <button onclick="mostrarCadastro()">Cadastrar restaurante</button>
    <button onclick="mostrarFavoritos()">❤️ Favoritos</button>
</nav>

<main>

<section id="inicio">
    <h2>Encontre os melhores restaurantes!</h2>

    <input
        type="text"
        id="pesquisa"
        placeholder="Pesquisar restaurante..."
        oninput="pesquisarRestaurantes()"
    >

    <div id="listaRestaurantes" class="restaurantes"></div>
</section>

<section id="cadastro" class="escondido">
    <h2>🍴 Cadastrar restaurante</h2>

    <input id="nome" placeholder="Nome do restaurante">
    <input id="categoria" placeholder="Categoria (Pizza, Hambúrguer...)">
    <input id="endereco" placeholder="Endereço">
    <textarea id="descricao" placeholder="Descrição do restaurante"></textarea>

    <button onclick="cadastrarRestaurante()">
        Cadastrar restaurante
    </button>
</section>

<section id="detalhes" class="escondido">
    <button onclick="mostrarInicio()">← Voltar</button>

    <div id="informacoes"></div>

    <h3>⭐ Avalie este restaurante</h3>

    <input id="nomeCliente" placeholder="Seu nome">

    <select id="nota">
        <option value="5">⭐⭐⭐⭐⭐ - Excelente</option>
        <option value="4">⭐⭐⭐⭐ - Muito bom</option>
        <option value="3">⭐⭐⭐ - Bom</option>
        <option value="2">⭐⭐ - Regular</option>
        <option value="1">⭐ - Ruim</option>
    </select>

    <textarea id="comentario" placeholder="Conte sua experiência..."></textarea>

    <button onclick="enviarAvaliacao()">
        Enviar avaliação
    </button>

    <h3>💬 Comentários dos clientes</h3>

    <div id="listaComentarios"></div>
</section>

<section id="favoritos" class="escondido">
    <h2>❤️ Restaurantes favoritos</h2>
    <div id="listaFavoritos" class="restaurantes"></div>
</section>

</main>

<footer>
    <p>© 2026 FoodReview - Sua opinião faz a diferença!</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
