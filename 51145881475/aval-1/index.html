
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookSpace - Leia e Publique</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>📚 BookSpace</h1>
    <p>Seu mundo de histórias começa aqui.</p>
</header>

<nav>
    <button onclick="mostrarInicio()">Início</button>
    <button onclick="mostrarPublicacao()">Publicar livro</button>
    <button onclick="mostrarFavoritos()">Favoritos ❤️</button>
</nav>

<main>
    <section id="inicio">
        <h2>Explore livros</h2>
        <input type="text" id="pesquisa"
        placeholder="Pesquisar livros..."
        oninput="pesquisarLivros()">

        <div id="listaLivros" class="livros"></div>
    </section>

    <section id="publicar" class="escondido">
        <h2>Publique seu livro ✍️</h2>

        <input id="titulo" placeholder="Título do livro">
        <input id="autor" placeholder="Nome do autor">
        <textarea id="descricao" placeholder="Descrição do livro"></textarea>
        <textarea id="conteudo" placeholder="Escreva o conteúdo do seu livro..."></textarea>

        <button onclick="publicarLivro()">Publicar livro</button>
    </section>

    <section id="leitura" class="escondido">
        <button onclick="mostrarInicio()">← Voltar</button>
        <h2 id="tituloLeitura"></h2>
        <p id="autorLeitura"></p>
        <p id="descricaoLeitura"></p>
        <article id="conteudoLeitura"></article>
    </section>

    <section id="favoritos" class="escondido">
        <h2>Meus favoritos ❤️</h2>
        <div id="listaFavoritos" class="livros"></div>
    </section>
</main>

<footer>
    <p>© 2026 BookSpace - Compartilhe suas histórias.</p>
</footer>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
