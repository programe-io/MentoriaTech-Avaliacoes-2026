
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mini Feed</title>

    <style>
        body {
            background: #10051f;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background: #260b45;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            color: #c77dff;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
        }

        .perfil {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #260b45;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .foto-perfil {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #963ce0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .post {
            background: #260b45;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .post h3 {
            color: #c77dff;
        }

        .post img {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }

        .acoes {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .acoes button {
            background: #963ce0;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        .acoes button:hover {
            background: #c77dff;
        }

        .comentario {
            margin-top: 15px;
            border-top: 1px solid #7136a5;
            padding-top: 10px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #260b45;
            color: #c77dff;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>💜 Mini Feed</h1>
        <p>Compartilhe seus melhores momentos!</p>
    </header>

    <main class="container">

        <section class="perfil">
            <div class="foto-perfil">👤</div>
            <div>
                <h3>Vtzinx7_00</h3>
                <p>Bem-vindo ao meu perfil!</p>
            </div>
        </section>

        <article class="post">
            <h3>👤 Vtzinx7_00</h3>
            <p>Olá pessoal! Essa é minha primeira publicação! 💜</p>

            <div class="acoes">
                <button onclick="curtir(this)">❤️ Curtir</button>
                <button onclick="comentar()">💬 Comentar</button>
            </div>

            <p class="comentario">Comentários aparecerão aqui.</p>
        </article>

        <article class="post">
            <h3>👤 Vtzinx7_00</h3>
            <p>Vivendo e aprendendo coisas novas! 🚀</p>

            <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=600"
                 alt="Paisagem com céu estrelado">

            <div class="acoes">
                <button onclick="curtir(this)">❤️ Curtir</button>
                <button onclick="comentar()">💬 Comentar</button>
            </div>

            <p class="comentario">Comentários aparecerão aqui.</p>
        </article>

    </main>

    <footer>
        <p>© 2026 - Mini Feed | Vtzinx7_00</p>
    </footer>

    <script>
        function curtir(botao) {
            if (botao.innerHTML.includes("Curtir")) {
                botao.innerHTML = "❤️ Curtido!";
            } else {
                botao.innerHTML = "❤️ Curtir";
            }
        }

        function comentar() {
            let comentario = prompt("Digite seu comentário:");

            if (comentario) {
                alert("Comentário enviado: " + comentario);
            }
        }
    </script>

</body>
</html>
