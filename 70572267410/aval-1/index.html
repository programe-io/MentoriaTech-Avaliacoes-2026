<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Anamnese Digital</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>Ficha de Anamnese</h1>
      <p>Sistema de Avaliação e Prontuário Inicial</p>
    </div>
  </header>

  <main class="container layout">
    <!-- Formulário Principal -->
    <section class="card form-section">
      <div class="card-header">
        <h2>Novo Atendimento</h2>
        <button type="button" id="btnLimpar" class="btn btn-outline">Limpar Campos</button>
      </div>

      <form id="anamneseForm">
        <!-- 1. Dados Pessoais -->
        <fieldset>
          <legend>1. Identificação do Paciente</legend>
          <div class="grid-2">
            <div class="form-group">
              <label for="nome">Nome Completo *</label>
              <input type="text" id="nome" name="nome" required placeholder="Ex: Maria da Silva">
            </div>
            <div class="form-group">
              <label for="dataNascimento">Data de Nascimento *</label>
              <input type="date" id="dataNascimento" name="dataNascimento" required>
            </div>
          </div>

          <div class="grid-3">
            <div class="form-group">
              <label for="cpf">CPF *</label>
              <input type="text" id="cpf" name="cpf" maxlength="14" required placeholder="000.000.000-00">
            </div>
            <div class="form-group">
              <label for="telefone">Telefone / WhatsApp *</label>
              <input type="tel" id="telefone" name="telefone" maxlength="15" required placeholder="(00) 00000-0000">
            </div>
            <div class="form-group">
              <label for="sexo">Sexo Biológico</label>
              <select id="sexo" name="sexo">
                <option value="Feminino">Feminino</option>
                <option value="Masculino">Masculino</option>
                <option value="Outro">Outro</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="profissao">Profissão / Ocupação</label>
            <input type="text" id="profissao" name="profissao" placeholder="Ex: Professor(a), Analista...">
          </div>
        </fieldset>

        <!-- 2. Queixa Principal -->
        <fieldset>
          <legend>2. Queixa Principal e Histórico Atual</legend>
          <div class="form-group">
            <label for="queixa">Motivo da Consulta / Queixa Principal *</label>
            <textarea id="queixa" name="queixa" rows="3" required placeholder="Descreva os sintomas, início e duração..."></textarea>
          </div>
        </fieldset>

        <!-- 3. Histórico Médico -->
        <fieldset>
          <legend>3. Histórico Clínico</legend>
          <div class="checkbox-grid">
            <label class="checkbox-item"><input type="checkbox" name="condicoes" value="Hipertensão"> Hipertensão</label>
            <label class="checkbox-item"><input type="checkbox" name="condicoes" value="Diabetes"> Diabetes</label>
            <label class="checkbox-item"><input type="checkbox" name="condicoes" value="Cardiopatia"> Cardiopatia</label>
            <label class="checkbox-item"><input type="checkbox" name="condicoes" value="Asma/Bronquite"> Asma / Bronquite</label>
            <label class="checkbox-item"><input type="checkbox" name="condicoes" value="Distúrbio Renal"> Distúrbio Renal</label>
            <label class="checkbox-item"><input type="checkbox" name="condicoes" value="Gestante"> Gestante / Lactante</label>
          </div>

          <div class="grid-2 mt-1">
            <div class="form-group">
              <label for="alergias">Alergias (Medicamentos, alimentos, etc.)</label>
              <input type="text" id="alergias" name="alergias" placeholder="Nenhuma ou especifique">
            </div>
            <div class="form-group">
              <label for="medicamentos">Medicamentos em Uso Contínuo</label>
              <input type="text" id="medicamentos" name="medicamentos" placeholder="Nome e dosagem, se houver">
            </div>
          </div>

          <div class="form-group">
            <label for="cirurgias">Cirurgias Prévias ou Internações</label>
            <input type="text" id="cirurgias" name="cirurgias" placeholder="Descreva procedimento e ano aproximado">
          </div>
        </fieldset>

        <!-- 4. Hábitos de Vida -->
        <fieldset>
          <legend>4. Hábitos de Vida</legend>
          <div class="grid-3">
            <div class="form-group">
              <label for="tabagismo">Tabagismo</label>
              <select id="tabagismo" name="tabagismo">
                <option value="Não">Não</option>
                <option value="Sim">Sim</option>
                <option value="Ex-fumante">Ex-fumante</option>
              </select>
            </div>
            <div class="form-group">
              <label for="etilismo">Consumo de Álcool</label>
              <select id="etilismo" name="etilismo">
                <option value="Não">Não</option>
                <option value="Socialmente">Socialmente</option>
                <option value="Frequente">Frequente</option>
              </select>
            </div>
            <div class="form-group">
              <label for="atividadeFisica">Atividade Física</label>
              <select id="atividadeFisica" name="atividadeFisica">
                <option value="Sedentário">Sedentário</option>
                <option value="1 a 2x na semana">1 a 2x na semana</option>
                <option value="3x ou mais na semana">3x ou mais na semana</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="observacoes">Observações Gerais / Notas do Profissional</label>
            <textarea id="observacoes" name="observacoes" rows="2" placeholder="Informações complementares..."></textarea>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="button" id="btnImprimir" class="btn btn-secondary">Imprimir / PDF</button>
          <button type="submit" class="btn btn-primary">Salvar Ficha</button>
        </div>
      </form>
    </section>

    <!-- Lista de Fichas Salvas -->
    <aside class="card history-section">
      <div class="card-header">
        <h2>Fichas Salvas</h2>
        <span id="contadorFichas" class="badge">0</span>
      </div>
      <div class="form-group">
        <input type="search" id="buscaPaciente" placeholder="Buscar por nome ou CPF...">
      </div>
      <ul id="listaFichas" class="record-list">
        <!-- Preenchido via JavaScript -->
      </ul>
    </aside>
  </main>

  <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
