
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>📋 Gerenciador de Tarefas</h1>
        <p>Organize suas tarefas de maneira simples e prática!</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar nova tarefa</h2>

            <form id="formTarefa">
                <label for="titulo">Título da tarefa:</label>
                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título da tarefa"
                    required
                >

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade" required>
                    <option value="1">1 - Alta</option>
                    <option value="2" selected>2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit">Cadastrar tarefa</button>
            </form>

            <p id="mensagem"></p>
        </section>

        <section class="lista">
            <h2>Minhas tarefas</h2>

            <div class="resumo">
                <div>
                    <strong id="total">0</strong>
                    <span>Total</span>
                </div>
                <div>
                    <strong id="pendentes">0</strong>
                    <span>Pendentes</span>
                </div>
                <div>
                    <strong id="concluidas">0</strong>
                    <span>Concluídas</span>
                </div>
            </div>

            <div id="listaTarefas">
                <p class="vazio">Nenhuma tarefa cadastrada.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto Gerenciador de Tarefas - JavaScript</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
