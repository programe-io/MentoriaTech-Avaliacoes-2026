<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger-Monkey</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="header">
        <h1>Burger-Monkey</h1>
        <button class="carrinho-btn" onclick="abrirCarrinho()">
            🛒 R$ <span id="total-carrinho">0,00</span>
        </button>
    </header>

    <section class="busca">
        <input type="text" id="busca-input" placeholder="Buscar: feijão tropeiro, galinha..." onkeyup="filtrarProdutos()">
    </section>

    <nav class="categorias">
        <button class="categoria ativa" onclick="filtrarCategoria('todos', event)">Todos</button>
        <button class="categoria" onclick="filtrarCategoria('pf', event)">PFs</button>
        <button class="categoria" onclick="filtrarCategoria('bebidas', event)">Bebidas</button>
        <button class="categoria" onclick="filtrarCategoria('promocao', event)">Promoções</button>
    </nav>

    <main class="produtos" id="lista-produtos">
        <h2 class="secao-titulo">Mais Pedidos</h2>
    </main>

    <div class="carrinho-fixo" id="carrinho-fixo">
        <button class="finalizar-btn" onclick="finalizarPedido()">
            Finalizar no WhatsApp - R$ <span id="total-final">0,00</span>
        </button>
    </div>

    <div class="modal" id="modal-carrinho">
        <div class="modal-conteudo">
            <span class="fechar" onclick="fecharCarrinho()">&times;</span>
            <h2>Seu Pedido</h2>
            
            <div id="itens-carrinho"></div>
            
            <div class="modal-info-entrega">
                <p><span>Subtotal:</span> <span id="modal-subtotal">R$ 0,00</span></p>
                <p><span>Taxa de entrega:</span> <span>R$ 5,00</span></p>
                <h3><span>Total:</span> <span id="modal-total">R$ 5,00</span></h3>
            </div>
            
            <button class="finalizar-btn" onclick="finalizarPedido()">Mande seu pedido pelo WhatsApp</button>
        </div>
    
    </div>
 
<script src="script.js"></script></body>
</html>
