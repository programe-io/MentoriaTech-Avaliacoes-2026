<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLONE INSTAGRAM</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gray-100 text-slate-900">

    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <h1 class="text-xl font-semibold">Instagram</h1>

                <button aria-label="Menu">
                    <i class="bx bx-menu text-2xl"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-4 pb-20">
        <div class="flex gap-8">

            <div class="flex-1 max-w-lg mx-auto">

                <!-- STORIES -->
                <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">

                    <div class="flex gap-4 overflow-x-auto">

                        <div class="flex flex-col items-center flex-shrink-0">
                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                <img
                                    class="w-full h-full object-cover rounded-full border-2 border-white"
                                    src="https://i.pinimg.com/736x/eb/d0/b0/ebd0b078a9b156c5b0c2d9dacbcce006.jpg"
                                    alt="Foto de perfil">
                            </div>

                            <span class="text-sm mt-1">lele</span>
                        </div>

                    </div>

                </section>

                <!-- PUBLICAÇÃO -->
                <article class="bg-white border border-gray-200 rounded-lg mb-4">

                    <header class="flex items-center justify-between p-3">

                        <div class="flex items-center gap-3">

                            <div class="w-10 h-10 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">
                                <img
                                    class="w-full h-full object-cover rounded-full border-2 border-white"
                                    src="https://i.pinimg.com/736x/eb/d0/b0/ebd0b078a9b156c5b0c2d9dacbcce006.jpg"
                                    alt="Foto de perfil">
                            </div>

                            <div>
                                <p class="text-sm font-semibold">lele</p>
                                <p class="text-xs text-gray-500">lele</p>
                            </div>

                        </div>

                        <button aria-label="Mais opções">
                            <i class="bx bx-dots-vertical text-xl"></i>
                        </button>

                    </header>

                    <!-- FOTO DA PUBLICAÇÃO -->
                    <div class="bg-gray-100">
                        <img
                            class="w-full object-cover"
                            src="https://i.pinimg.com/736x/57/07/61/5707618c4d70ea9a2b6ea13c3279d99a.jpg"
                            alt="Publicação">
                    </div>

                    <!-- INTERAÇÕES -->
                    <div class="p-3">

                        <div class="flex items-center justify-between mb-3">

                            <div class="flex items-center gap-4">

                                <button aria-label="Curtir">
                                    <i class="bx bx-heart text-2xl"></i>
                                </button>

                                <button aria-label="Comentar">
                                    <i class="bx bx-message-circle-reply text-2xl"></i>
                                </button>

                                <button aria-label="Compartilhar">
                                    <i class="bx bx-send text-2xl"></i>
                                </button>

                            </div>

                            <button aria-label="Salvar">
                                <i class="bx bx-bookmark text-2xl"></i>
                            </button>


                        </div>

                        
                              <p class="font-semibold text-sm mb-2">
                            100000 curtidas
                        </p>

                        <p class="text-sm">
                            <span class="font-semibold"></span>
                        </p>

                        <p>
                            <span class="font-semibold">lele</span>
                            <span class="text-slate-900/90"></span>
                            me and my baddies
                        </p>

                        <button class="text-sm text-gray-500 mt-1">
                            Ver todos os 15000 comentários
                        </button>

                        <p class="text-xs text-gray-500 mt-2 uppercase">
                            ha 2 segundos
                        </p>

                      

                    

                    </div>

                </article>

            </div>

            <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50">
              <div class="flex items-center jusify-around px-4">
                
                <button class="p-2">
                    <i class="bx bx-home text-2xl"></i>
                </button>

                <button class="p-2">
                    <i class="bx bx-search text-2xl"></i>
                </button>

                <button class="p-2">
                    <i class="bx bx-plus text-2xl"></i>
                </button>

                <button class="p-2">
                    <i class="bx bx-heart text-2xl"></i>
                </button>

                <button class="p-2">
                    <i class="bx bx-user text-2xl"></i>
                </button>

              </div>  

            </nav>

        </div>
    </main>

</body>
</html>
