
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h2>MiniFeed</h2>
        <span>🏠 Início</span>
    </header>

    <main>
        <section class="feed">

            <div class="post">
                <div class="usuario">
                    <img src="https://i.pravatar.cc/100?img=12">
                    <div>
                        <strong>Lucas Silva</strong>
                        <small>@lucassilva</small>
                    </div>
                </div>

                <p>Um dia incrível para correr atrás dos meus sonhos! 🚀</p>

                <img class="foto" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800">

                <div class="acoes">
                    <button class="curtir" onclick="curtir(this)">
                        ❤️ Curtir <span>125</span>
                    </button>
                    <span>💬 <span class="total-comentarios">0</span> comentários</span>
                </div>

                <div class="comentarios">
                    <div class="lista-comentarios"></div>

                    <div class="novo-comentario">
                        <input type="text" placeholder="Escreva um comentário...">
                        <button onclick="comentar(this)">Enviar</button>
                    </div>
                </div>
            </div>

            <div class="post">
                <div class="usuario">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAwANfO1hOzbTaI1YyRWXYuSa0lt3zUHIHpAeTQ9rr1w&s=10">
                    <div>
                        <strong>carlos</strong>
                        <small>@marianacosta</small>
                    </div>
                </div>

                <p>Aproveitando cada momento da vida! ☀️</p>

                <img class="foto" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800">

                <div class="acoes">
                    <button class="curtir" onclick="curtir(this)">
                        ❤️ Curtir <span>230</span>
                    </button>
                    <span>💬 <span class="total-comentarios">0</span> comentários</span>
                </div>

                <div class="comentarios">
                    <div class="lista-comentarios"></div>

                    <div class="novo-comentario">
                        <input type="text" placeholder="Escreva um comentário...">
                        <button onclick="comentar(this)">Enviar</button>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
