<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NEON DRONE — Night City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
<div id="jogo">
  <canvas id="tela"></canvas>

  <div id="hud" class="oculto">
    <div class="chip">RECORDE<b id="hud-recorde">0</b></div>
    <div class="chip">NÍVEL<b id="hud-nivel">1</b></div>
  </div>
  <div id="pontos" class="oculto">0</div>
  <div id="aviso"></div>

  <section id="menu" class="painel">
    <div class="holo">
      <h1>NEON<br>DRONE</h1>
      <p>RECORDE <b id="recorde-menu">0</b></p>
      <p class="chamada piscante">Clique para começar</p>
    </div>
    <div class="opcoes">
      <button class="botao" id="btn-tremor">Tremor: ON</button>
      <button class="botao" id="btn-glitch">Glitch: ON</button>
      <button class="botao" id="btn-som">Som: ON</button>
    </div>
    <p class="ajuda">Clique, toque ou espaço para voar. P ou Esc pausa. M liga e desliga o som.</p>
  </section>

  <section id="pausa" class="painel veu oculto">
    <div class="holo"><h2>PAUSADO</h2><p>Pressione P ou Esc para continuar</p></div>
  </section>

  <section id="fim" class="painel veu oculto">
    <div class="holo">
      <h2>SISTEMA PERDIDO</h2>
      <p>PONTOS <b id="fim-pontos">0</b></p>
      <p>RECORDE <b id="fim-recorde">0</b></p>
      <p id="fim-novo" class="piscante oculto">NOVO RECORDE!</p>
      <p id="fim-dica" class="chamada oculto">Clique ou espaço para reiniciar</p>
    </div>
  </section>

  <div id="crt"></div>
</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
