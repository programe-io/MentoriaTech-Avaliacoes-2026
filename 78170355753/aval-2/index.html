
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Jumperman - Aventura</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="game-container">

        <h1>🎮 JUMPERMAN</h1>

        <div class="hud">
            <div>🏆 Pontos: <span id="score">0</span></div>
            <div>❤️ Vidas: <span id="lives">3</span></div>
        </div>

        <canvas id="gameCanvas" width="800" height="450">
            Seu navegador não suporta Canvas.
        </canvas>

        <p id="message">
            Atravesse o mapa e encontre o portal!
        </p>

        <button id="restart">
            🔄 REINICIAR JOGO
        </button>

        <!-- CONTROLES PARA CELULAR -->
        <div id="mobileControls">

            <div class="movement-buttons">
                <button id="leftBtn" class="control-btn">
                    ◀
                </button>

                <button id="rightBtn" class="control-btn">
                    ▶
                </button>
            </div>

            <button id="jumpBtn" class="control-btn jump-btn">
                ⬆ PULAR
            </button>

        </div>

        <div class="instructions">
            <p>PC: ← → ou A/D para andar</p>
            <p>ESPAÇO ou ↑ para pular</p>
            <p>Celular: utilize os botões na tela</p>
        </div>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
