<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow Fighters Arena</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div class="side"><b id="n1"></b><div class="bar hp"><i id="h1"></i></div><div class="bar en"><i id="e1"></i></div><div id="r1" class="pips"></div></div>
  <div id="mid"><div id="tm">60</div></div>
  <div class="side r"><b id="n2"></b><div class="bar hp"><i id="h2"></i></div><div class="bar en"><i id="e2"></i></div><div id="r2" class="pips"></div></div>
</div>
<div id="msg"></div>
<div id="combo"></div>

<div id="menu" class="panel">
  <h1>SHADOW <span>FIGHTERS</span> ARENA</h1>
  <div class="dock">
    <p>Escolha seu lutador</p>
    <div class="row">
      <button class="pick sel" data-f="kai">KAI<small>Fogo · mais força</small></button>
      <button class="pick" data-f="frost">FROST<small>Gelo · mais velocidade</small></button>
    </div>
    <div class="row"><button id="play">JOGAR</button><button id="train">TREINO</button></div>
    <div class="row"><button id="snd" class="mini">Som: ON</button><button id="gfx" class="mini">Gráficos: ALTO</button></div>
    <pre>WASD mover · Espaço pular · J soco · K chute · L defender · Shift esquivar · Q especial (30 energia) · E superataque (energia cheia)</pre>
  </div>
</div>

<div id="end" class="panel hide">
  <h1 id="et"></h1>
  <div class="row"><button id="again">JOGAR NOVAMENTE</button><button id="tomenu">MENU</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
