
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Cadastro de Produtos</h1>

        <div class="section">
            <h2>Adicionar Produto</h2>

            <div class="input-group">
                <label for="nomeP">Nome do Produto:</label>
                <input type="text" id="nomeP" placeholder="Digite o nome">
            </div>

            <div class="input-group">
                <label for="qtdP">Quantidade:</label>
                <input type="number" id="qtdP" placeholder="Digite a quantidade">
            </div>

            <div class="input-group">
                <label for="precoP">Preço:</label>
                <input type="number" id="precoP" placeholder="Digite o preço">
            </div>

            <button type="button" id="btAdd">
                Adicionar Produto
            </button>

            <button type="button" id="btAtualizar">
                Atualizar
            </button>

            <button type="button" id="btExcluir">
                Excluir
            </button>

        </div>

        <div class="section">
            <h2>Lista de Produtos</h2>

            <ul class="lista-produtos" id="listaProdutos">
            </ul>
        </div>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
