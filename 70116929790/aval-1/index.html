
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Controle de Estoque</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #172554;
    color: white;
    padding: 22px;
    text-align: center;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 15px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #0001;
}

.card h3 {
    color: #64748b;
    font-size: 14px;
}

.card p {
    font-size: 27px;
    font-weight: bold;
    margin-top: 10px;
    color: #2563eb;
}

.section {
    background: white;
    padding: 22px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px #0001;
}

h2 {
    margin-bottom: 18px;
}

.form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

input, select {
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    width: 100%;
    outline: none;
}

button {
    border: none;
    padding: 12px 16px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
    background: #2563eb;
    font-weight: bold;
}

button:hover {
    opacity: 0.85;
}

.btn-danger {
    background: #dc2626;
}

.btn-edit {
    background: #d97706;
}

.btn-entry {
    background: #16a34a;
}

.btn-exit {
    background: #dc2626;
}

.search {
    margin-bottom: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 13px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
}

th {
    background: #f8fafc;
}

.table-container {
    overflow-x: auto;
}

.status {
    padding: 5px 9px;
    border-radius: 15px;
    font-size: 12px;
    font-weight: bold;
}

.ok {
    background: #dcfce7;
    color: #166534;
}

.low {
    background: #fee2e2;
    color: #991b1b;
}

.actions {
    display: flex;
    gap: 5px;
}

.actions button {
    padding: 8px;
    font-size: 12px;
}

@media(max-width:600px) {
    header h1 {
        font-size: 21px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <h1>📦 Sistema de Controle de Estoque</h1>
    <p>Gerenciamento de produtos e mercadorias</p>
</header>

<div class="container">

    <div class="dashboard">
        <div class="card">
            <h3>Total de Produtos</h3>
            <p id="totalProdutos">0</p>
        </div>

        <div class="card">
            <h3>Itens em Estoque</h3>
            <p id="totalItens">0</p>
        </div>

        <div class="card">
            <h3>Estoque Baixo</h3>
            <p id="estoqueBaixo">0</p>
        </div>

        <div class="card">
            <h3>Valor do Estoque</h3>
            <p id="valorEstoque">R$ 0,00</p>
        </div>
    </div>

    <div class="section">
        <h2 id="tituloForm">Cadastrar Produto</h2>

        <form id="produtoForm" class="form">
            <input id="nome" placeholder="Nome do produto" required>

            <input id="codigo" placeholder="Código do produto" required>

            <input id="categoria" placeholder="Categoria">

            <input id="quantidade" type="number"
                placeholder="Quantidade" min="0" required>

            <input id="preco" type="number"
                placeholder="Preço unitário" min="0" step="0.01" required>

            <input id="minimo" type="number"
                placeholder="Estoque mínimo" min="0" value="5" required>

            <button type="submit" id="btnSalvar">
                Cadastrar Produto
            </button>
        </form>
    </div>

    <div class="section">
        <h2>📋 Lista de Produtos</h2>

        <input class="search" id="pesquisa"
            placeholder="Pesquisar por nome ou código..."
            oninput="listarProdutos()">

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaProdutos"></tbody>
            </table>
        </div>
    </div>

    <div class="section">
        <h2>📊 Movimentação de Estoque</h2>

        <div class="form">
            <select id="produtoMovimento">
                <option value="">Selecione um produto</option>
            </select>

            <input type="number" id="quantidadeMovimento"
                placeholder="Quantidade" min="1">

            <select id="tipoMovimento">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
            </select>

            <button onclick="movimentar()">Registrar Movimentação</button>
        </div>
    </div>

</div>

<script>
let produtos = JSON.parse(
    localStorage.getItem("estoqueProdutos")
) || [];

let editando = null;

const moeda = valor => valor.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
});

function salvarDados() {
    localStorage.setItem(
        "estoqueProdutos",
        JSON.stringify(produtos)
    );
}

document.getElementById("produtoForm")
.addEventListener("submit", function(e) {
    e.preventDefault();

    const produto = {
        nome: document.getElementById("nome").value.trim(),
        codigo: document.getElementById("codigo").value.trim(),
        categoria: document.getElementById("categoria").value.trim(),
        quantidade: Number(document.getElementById("quantidade").value),
        preco: Number(document.getElementById("preco").value),
        minimo: Number(document.getElementById("minimo").value)
    };

    if (produto.quantidade < 0 || produto.preco < 0 ||
        produto.minimo < 0) {
        alert("Informe valores válidos.");
        return;
    }

    const codigoExiste = produtos.some((p, i) =>
        p.codigo.toLowerCase() === produto.codigo.toLowerCase()
        && i !== editando
    );

    if (codigoExiste) {
        alert("Este código já está cadastrado!");
        return;
    }

    if (editando !== null) {
        produtos[editando] = produto;
        editando = null;
    } else {
        produtos.push(produto);
    }

    salvarDados();
    this.reset();

    document.getElementById("minimo").value = 5;
    document.getElementById("tituloForm").textContent =
        "Cadastrar Produto";

    document.getElementById("btnSalvar").textContent =
        "Cadastrar Produto";

    atualizar();
});

function listarProdutos() {
    const busca = document.getElementById("pesquisa")
        .value.toLowerCase();

    const lista = document.getElementById("listaProdutos");

    lista.innerHTML = "";

    produtos.forEach((p, i) => {
        if (
            !p.nome.toLowerCase().includes(busca) &&
            !p.codigo.toLowerCase().includes(busca)
        ) return;

        const status = p.quantidade <= p.minimo
            ? '<span class="status low">Estoque Baixo</span>'
            : '<span class="status ok">Normal</span>';

        lista.innerHTML += `
        <tr>
            <td>${escapar(p.codigo)}</td>
            <td>${escapar(p.nome)}</td>
            <td>${escapar(p.categoria)}</td>
            <td>${p.quantidade}</td>
            <td>${moeda(p.preco)}</td>
            <td>${status}</td>
            <td>
                <div class="actions">
                    <button class="btn-edit"
                        onclick="editar(${i})">Editar</button>

                    <button class="btn-danger"
                        onclick="excluir(${i})">Excluir</button>
                </div>
            </td>
        </tr>`;
    });
}

function escapar(valor) {
    return String(valor).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[c]);
}

function editar(i) {
    const p = produtos[i];

    document.getElementById("nome").value = p.nome;
    document.getElementById("codigo").value = p.codigo;
    document.getElementById("categoria").value = p.categoria;
    document.getElementById("quantidade").value = p.quantidade;
    document.getElementById("preco").value = p.preco;
    document.getElementById("minimo").value = p.minimo;

    editando = i;

    document.getElementById("tituloForm").textContent =
        "Editar Produto";

    document.getElementById("btnSalvar").textContent =
        "Salvar Alterações";

    window.scrollTo({top: 0, behavior: "smooth"});
}

function excluir(i) {
    if (confirm("Deseja excluir este produto?")) {
        produtos.splice(i, 1);
        salvarDados();
        atualizar();
    }
}

function movimentar() {
    const i = document.getElementById("produtoMovimento").value;
    const quantidade = Number(
        document.getElementById("quantidadeMovimento").value
    );

    const tipo = document.getElementById("tipoMovimento").value;

    if (i === "" || !Number.isInteger(quantidade) ||
        quantidade <= 0) {
        alert("Selecione um produto e informe uma quantidade válida.");
        return;
    }

    if (tipo === "saida") {
        if (produtos[i].quantidade < quantidade) {
            alert("Estoque insuficiente!");
            return;
        }

        produtos[i].quantidade -= quantidade;
    } else {
        produtos[i].quantidade += quantidade;
    }

    salvarDados();

    document.getElementById("quantidadeMovimento").value = "";

    atualizar();

    alert("Movimentação registrada com sucesso!");
}

function atualizar() {
    const totalProdutos = produtos.length;

    const totalItens = produtos.reduce(
        (s, p) => s + p.quantidade, 0
    );

    const baixo = produtos.filter(
        p => p.quantidade <= p.minimo
    ).length;

    const valor = produtos.reduce(
        (s, p) => s + p.quantidade * p.preco, 0
    );

    document.getElementById("totalProdutos").textContent =
        totalProdutos;

    document.getElementById("totalItens").textContent =
        totalItens;

    document.getElementById("estoqueBaixo").textContent =
        baixo;

    document.getElementById("valorEstoque").textContent =
        moeda(valor);

    listarProdutos();

    const select = document.getElementById("produtoMovimento");
    const selecionado = select.value;

    select.innerHTML =
        '<option value="">Selecione um produto</option>';

    produtos.forEach((p, i) => {
        select.innerHTML += `
        <option value="${i}">
            ${escapar(p.nome)} - ${escapar(p.codigo)}
        </option>`;
    });

    if (selecionado !== "" && produtos[selecionado]) {
        select.value = selecionado;
    }
}

atualizar();
</script>

<script src="script.js"></script></body>
</html>
