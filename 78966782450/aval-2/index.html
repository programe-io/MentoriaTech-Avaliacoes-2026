
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix - MiniFeed</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #101018;
            color: white;
            font-family: Arial;
        }

        header {
            background: #191923;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
        }

        header h1 {
            color: #e50914;
        }

        header input {
            padding: 12px;
            border: 0;
            border-radius: 20px;
            width: 250px;
        }

        .layout {
            display: grid;
            grid-template-columns: 200px minmax(300px, 600px) 220px;
            gap: 25px;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        aside {
            background: #191923;
            padding: 20px;
            border-radius: 12px;
            height: max-content;
        }

        aside p {
            padding: 13px 5px;
            cursor: pointer;
            color: #ddd;
        }

        aside p:hover {
            color: #e50914;
        }

        .post {
            background: #191923;
            border-radius: 12px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .post-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        .post-header span {
            color: #e50914;
        }

        .poster {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .post-content {
            padding: 15px;
        }

        .post-content h3 {
            margin-bottom: 10px;
        }

        .post-content p {
            color: #bbb;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .actions {
            display: flex;
            gap: 15px;
        }

        button {
            background: none;
            border: 0;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            color: #e50914;
        }

        .comment {
            margin-top: 12px;
            display: none;
        }

        .comment input {
            padding: 10px;
            width: 75%;
            border: 0;
            border-radius: 5px;
        }

        .comment button {
            background: #e50914;
            padding: 10px;
            border-radius: 5px;
        }

        .popular {
            color: #bbb;
            font-size: 14px;
            line-height: 2;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 25px;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .left,
            .right {
                display: none;
            }

            .poster {
                height: 280px;
            }

            header input {
                width: 170px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>🎬 CineFlix</h1>
        <input id="pesquisa" placeholder="🔎 Buscar filmes...">
    </header>

    <div class="layout">

        <aside class="left">
            <h3>Menu</h3>

            <p onclick="mostrarTudo()">🏠 Início</p>
            <p onclick="mostrarFavoritos()">⭐ Favoritos</p>
            <p onclick="mostrarTudo()">🎥 Explorar</p>
            <p onclick="alert('Bem-vindo ao CineFlix!')">👤 Meu perfil</p>
        </aside>

        <main>
            <h2 style="margin-bottom:20px">🎬 Feed de filmes</h2>
            <div id="feed"></div>
        </main>

        <aside class="right">
            <h3>🔥 Populares</h3>

            <div class="popular">
                <p>Interestelar</p>
                <p>Vingadores</p>
                <p>Homem-Aranha</p>
                <p>A Origem</p>
                <p>Coringa</p>
            </div>
        </aside>

    </div>

    <footer>
        © 2026 CineFlix | MiniFeed de Filmes
    </footer>

    <script>
        const filmes = [
            {
                nome: "Interestelar",
                ano: 2014,
                nota: "8.7",
                genero: "Ficção",
                img: "gEU2QniE6E77NI6lCU6MxlNBvIx",
                desc: "Uma viagem pelo espaço em busca de um novo lar para a humanidade."
            },
            {
                nome: "A Origem",
                ano: 2010,
                nota: "8.8",
                genero: "Ação",
                img: "oYuLEt3zVCKq57qu2F8dT7NIa6f",
                desc: "Um ladrão invade os sonhos para roubar segredos."
            },
            {
                nome: "Homem-Aranha",
                ano: 2021,
                nota: "8.2",
                genero: "Ação",
                img: "1g0dhYtq4irTY1GPXvft6k4YLjm",
                desc: "Peter Parker enfrenta grandes desafios."
            },
            {
                nome: "Vingadores",
                ano: 2019,
                nota: "8.4",
                genero: "Aventura",
                img: "or06FN3Dka5tukK1e9sl16pB3iy",
                desc: "Os heróis se unem para salvar o universo."
            },
            {
                nome: "Coringa",
                ano: 2019,
                nota: "8.1",
                genero: "Drama",
                img: "udDclJoHjfjb8Ekgsd4FDteOkCU",
                desc: "A história de transformação de Arthur Fleck."
            }
        ];

        let curtidas = JSON.parse(localStorage.getItem("curtidas") || "[]");
        let favoritos = JSON.parse(localStorage.getItem("favoritos") || "[]");

        function render(lista) {
            document.getElementById("feed").innerHTML = lista.map(f => {
                let i = filmes.indexOf(f);

                return `
                    <article class="post">

                        <div class="post-header">
                            <strong>🎬 CineFlix</strong>
                            <span>⭐ ${f.nota}</span>
                        </div>

                        <img
                            class="poster"
                            src="https://image.tmdb.org/t/p/w500/${f.img}.jpg"
                            alt="${f.nome}"
                        >

                        <div class="post-content">

                            <h3>${f.nome} (${f.ano})</h3>

                            <p>${f.desc}</p>
                            <p>🎭 ${f.genero}</p>

                            <div class="actions">
                                <button onclick="curtir(${i})">
                                    ❤️ ${curtidas.includes(i) ? "Curtido" : "Curtir"}
                                </button>

                                <button onclick="comentar(${i})">
                                    💬 Comentar
                                </button>

                                <button onclick="favoritar(${i})">
                                    ⭐ ${favoritos.includes(i) ? "Salvo" : "Salvar"}
                                </button>
                            </div>

                            <div class="comment" id="comment${i}">
                                <input
                                    id="texto${i}"
                                    placeholder="Escreva um comentário..."
                                >

                                <button onclick="enviar(${i})">
                                    Enviar
                                </button>

                                <div id="comentarios${i}"></div>
                            </div>

                        </div>
                    </article>
                `;
            }).join("") || "<p>Nenhum filme encontrado.</p>";
        }

        function curtir(i) {
            curtidas = curtidas.includes(i)
                ? curtidas.filter(x => x !== i)
                : [...curtidas, i];

            localStorage.setItem("curtidas", JSON.stringify(curtidas));

            render(filmes.filter(f =>
                document.getElementById("pesquisa").value.toLowerCase().trim() === "" ||
                f.nome.toLowerCase().includes(
                    document.getElementById("pesquisa").value.toLowerCase()
                )
            ));
        }

        function favoritar(i) {
            favoritos = favoritos.includes(i)
                ? favoritos.filter(x => x !== i)
                : [...favoritos, i];

            localStorage.setItem("favoritos", JSON.stringify(favoritos));

            mostrarTudo();
        }

        function comentar(i) {
            let c = document.getElementById("comment" + i);

            c.style.display = c.style.display === "block"
                ? "none"
                : "block";
        }

        function enviar(i) {
            let texto = document.getElementById("texto" + i).value.trim();

            if (!texto) return;

            document.getElementById("comentarios" + i).innerHTML +=
                `<p>💬 ${texto}</p>`;

            document.getElementById("texto" + i).value = "";
        }

        function mostrarTudo() {
            render(filmes);
        }

        function mostrarFavoritos() {
            render(filmes.filter((f, i) => favoritos.includes(i)));
        }

        document.getElementById("pesquisa").addEventListener("input", e => {
            let busca = e.target.value.toLowerCase();

            render(filmes.filter(f =>
                f.nome.toLowerCase().includes(busca)
            ));
        });

        render(filmes);
    </script>

</body>
</html>
