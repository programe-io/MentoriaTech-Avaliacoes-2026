<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="navbar">
  <div class="nav-content">
    <h1 class="logo">Instagram</h1>
    <input type="text" placeholder="Pesquisar" class="search-bar">
    <div class="nav-icons">
      <button id="btn-new-post" title="Criar novo post">➕</button>
      <span title="Notificações">❤️</span>
      <span title="Mensagens">✈️</span>
    </div>
  </div>
</header>

<main class="container">
  <section class="stories-container" id="stories"></section>

  <section class="feed" id="feed"></section>
</main>

<!-- Modal para Novo Post -->
<div class="modal" id="post-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Criar nova publicação</h3>
      <button id="close-modal">✖</button>
    </div>
    <input type="text" id="post-img-url" placeholder="Cole a URL de uma imagem (ex: https://picsum.photos)">
    <textarea id="post-caption" placeholder="Escreva uma legenda..."></textarea>
    <button id="publish-post" class="btn-primary">Compartilhar</button>
  </div>
</div>

<!-- Modal para Visualizar Story -->
<div class="modal" id="story-modal">
  <div class="story-viewer">
    <div class="story-progress"><div class="progress-bar" id="story-progress-bar"></div></div>
    <div class="story-header">
      <img id="story-user-avatar" src="" alt="">
      <span id="story-user-name"></span>
      <button id="close-story">✖</button>
    </div>
    <img id="story-image" src="" alt="">
  </div>
</div>$0
  <script src="script.js"></script>
  
</body>
</html>
