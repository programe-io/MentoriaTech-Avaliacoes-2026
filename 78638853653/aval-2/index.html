!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Eventos Escolares</title>

<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

<h1>🏫 Gestão de Eventos Escolares</h1>

<div class="formulario">

<input type="text" id="nome" placeholder="Nome do Evento">

<input type="date" id="data">

<input type="text" id="local" placeholder="Local">

<input type="text" id="responsavel" placeholder="Responsável">

<button onclick="cadastrarEvento()">
Cadastrar Evento
</button>

</div>

<div class="pesquisa">

<input
type="text"
id="pesquisa"
placeholder="Pesquisar Evento..."
onkeyup="pesquisarEvento()">

</div>

<div class="contador">

<h2>Total de Eventos:
<span id="total">0</span>
</h2>

</div>

<div id="listaEventos"></div>

</div>

<script src="script.js"></script>

</body>
</html>
