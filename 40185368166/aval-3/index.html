<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Calculadora de IMC</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <main class="container">
              <h1>Calculadora de IMC</h1>

                  <!-- Formulário de cadastro -->
                      <section class="card">
                            <h2>Nova pessoa</h2>
                                  <form id="form-imc">
                                          <div class="form-grid">
                                                    <div class="input-group">
                                                                <label for="nome">Nome</label>
                                                                            <input type="text" id="nome" placeholder="Ex: Maria Silva" required>
                                                                                      </div>

                                                                                                <div class="input-group">
                                                                                                            <label for="idade">Idade (anos)</label>
                                                                                                                        <input type="number" id="idade" placeholder="Ex: 30" min="1" max="120" required>
                                                                                                                                  </div>

                                                                                                                                            <div class="input-group">
                                                                                                                                                        <label for="altura">Altura (m)</label>
                                                                                                                                                                    <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01" min="0.5" max="2.5" required>
                                                                                                                                                                              </div>

                                                                                                                                                                                        <div class="input-group">
                                                                                                                                                                                                    <label for="peso">Peso (kg)</label>
                                                                                                                                                                                                                <input type="number" id="peso" placeholder="Ex: 70" step="0.1" min="1" max="500" required>
                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                          <button type="submit" class="btn-salvar">Salvar</button>
                                                                                                                                                                                                                                                </form>
                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                        <!-- Tabela de resultados -->
                                                                                                                                                                                                                                                            <section class="card">
                                                                                                                                                                                                                                                                  <h2>Pessoas cadastradas</h2>
                                                                                                                                                                                                                                                                        <div class="table-wrapper">
                                                                                                                                                                                                                                                                                <table>
                                                                                                                                                                                                                                                                                          <thead>
                                                                                                                                                                                                                                                                                                      <tr>
                                                                                                                                                                                                                                                                                                                    <th>Nome</th>
                                                                                                                                                                                                                                                                                                                                  <th>Idade</th>
                                                                                                                                                                                                                                                                                                                                                <th>Altura</th>
                                                                                                                                                                                                                                                                                                                                                              <th>Peso</th>
                                                                                                                                                                                                                                                                                                                                                                            <th>IMC</th>
                                                                                                                                                                                                                                                                                                                                                                                          <th>Classificação</th>
                                                                                                                                                                                                                                                                                                                                                                                                        <th>Ações</th>
                                                                                                                                                                                                                                                                                                                                                                                                                    </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                              </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                        <tbody id="lista-pessoas">
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Linhas inseridas via JavaScript -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                              </tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
