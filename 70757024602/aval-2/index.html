<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <header>
            <h1>Gerenciador de Tarefas</h1>
            <p>Cadastre, organize e acompanhe suas tarefas.</p>
        </header>


        <!-- CADASTRO -->

        <section class="card">

            <h2>Cadastrar Tarefa</h2>

            <form id="formTarefa">

                <div class="campo">

                    <label for="titulo">
                        Título da tarefa
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex: Estudar JavaScript"
                    >

                </div>


                <div class="campo">

                    <label for="prioridade">
                        Prioridade
                    </label>

                    <select id="prioridade">

                        <option value="">
                            Selecione
                        </option>

                        <option value="1">
                            1 - Alta
                        </option>

                        <option value="2">
                            2 - Média
                        </option>

                        <option value="3">
                            3 - Baixa
                        </option>

                    </select>

                </div>


                <button type="submit">
                    Cadastrar Tarefa
                </button>

            </form>


            <p id="mensagem"></p>

        </section>



        <!-- LISTAGEM -->

        <section class="card">

            <div class="titulo-lista">

                <h2>Minhas Tarefas</h2>

                <span id="contador">
                    0 tarefas
                </span>

            </div>


            <div class="tabela-container">

                <table>

                    <thead>

                        <tr>

                            <th>Código</th>

                            <th>Título</th>

                            <th>Prioridade</th>

                            <th>Status</th>

                            <th>Ações</th>

                        </tr>

                    </thead>


                    <tbody id="listaTarefas">

                        <!-- Tarefas inseridas pelo JavaScript -->

                    </tbody>

                </table>

            </div>

        </section>



        <!-- ALTERAR PRIORIDADE -->

        <section class="card">

            <h2>Alterar Prioridade</h2>

            <form id="formPrioridade">

                <div class="campo">

                    <label for="codigoPrioridade">
                        Código da tarefa
                    </label>

                    <input
                        type="number"
                        id="codigoPrioridade"
                        min="1"
                        placeholder="Ex: 1"
                    >

                </div>


                <div class="campo">

                    <label for="novaPrioridade">
                        Nova prioridade
                    </label>

                    <select id="novaPrioridade">

                        <option value="">
                            Selecione
                        </option>

                        <option value="1">
                            1 - Alta
                        </option>

                        <option value="2">
                            2 - Média
                        </option>

                        <option value="3">
                            3 - Baixa
                        </option>

                    </select>

                </div>


                <button type="submit">
                    Alterar Prioridade
                </button>

            </form>

        </section>

    </main>


    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
