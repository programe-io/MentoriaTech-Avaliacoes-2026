<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Sistema de Estoque</title>
                <link rel="stylesheet" href="estilo.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <div class="container">
                            <h1>📦 Sistema de Estoque</h1>

                                    <div class="secao-cadastro">
                                                <h2>Cadastrar Produto</h2>
                                                            <input type="text" id="descricao" placeholder="Descrição (mínimo 5 caracteres)">
                                                                        <input type="number" id="quantidade" placeholder="Quantidade" min="1">
                                                                                    <input type="number" id="valor" placeholder="Valor" min="0" step="0.01">
                                                                                                <button onclick="cadastrar()">Cadastrar</button>
                                                                                                        </div>

                                                                                                                <div class="secao-lista">
                                                                                                                            <h2>Produtos Cadastrados</h2>
                                                                                                                                        <button onclick="listarProdutos()">Listar Produtos</button>
                                                                                                                                                    <div id="resultado"></div>
                                                                                                                                                            </div>

                                                                                                                                                                    <div class="secao-atualizar">
                                                                                                                                                                                <h2>Atualizar Produto</h2>
                                                                                                                                                                                            <h3>Alterar Valor</h3>
                                                                                                                                                                                                        <input type="number" id="codigoValor" placeholder="Código do Produto">
                                                                                                                                                                                                                    <input type="number" id="novoValor" placeholder="Novo Valor" min="0" step="0.01">
                                                                                                                                                                                                                                <button onclick="atualizarValor()">Atualizar Valor</button>

                                                                                                                                                                                                                                            <h3>Adicionar Quantidade</h3>
                                                                                                                                                                                                                                                        <input type="number" id="codigoQtd" placeholder="Código do Produto">
                                                                                                                                                                                                                                                                    <input type="number" id="novaQuantidade" placeholder="Quantidade a adicionar" min="1">
                                                                                                                                                                                                                                                                                <button onclick="atualizarQuantidade()">Adicionar</button>
                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                </html>
