<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <main class="instagram-container">
        <!-- Esquerda: Barra de Navegação Lateral -->
        <aside class="sidebar">
            <h1 class="logo">Instagram</h1>
            <nav class="nav-links">
                <a href="#" class="active"><i class="fa-solid fa-house">></i> Página Inicial</a>
                <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Pesquisa</a>
                <a href="#"><i class="fa-regular fa-compass"></i> Explorar</a>
                <a href="#"><i class="fa-regular fa-heart"></i> Notificações</a>
                <a href="#"><i class="fa-regular fa-square-plus"></i> Criar</a>
            </nav>
        </aside>

        <!-- Centro: Stories e Feed -->
        <section class="main-content">
            <!-- Stories -->
            <div class="stories-container">
                <div class="story">
                    <div class="story-ring"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmx0C7nsMQv3lob9bzjhF0i_czEADH5BnMywTUBHv1tQ&s=10" alt="Perfil"></div>
                    <span>seu_story</span>
                </div>
                <div class="story">
                    <div class="story-ring"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSflZDIIrtSoPpvxdUueC1zC_dv1sQvF4wxGrImmVq34g&s=10" alt="Perfil"></div>
                    <span>gustavo</span>
                </div>
                <div class="story">
                    <div class="story-ring"><img src="https://images.pexels.com/photos/35177517/pexels-photo-35177517/free-photo-of-mulher-confiante-em-traje-com-tematica-brasileira.png?cs=tinysrgb&dpr=1&w=500" alt="Perfil"></div>
                    <span>maria</span>
                </div>
            </div>

            <!-- Feed de Posts -->
            <div class="feed">
                <article class="post">
                    <header class="post-header">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSflZDIIrtSoPpvxdUueC1zC_dv1sQvF4wxGrImmVq34g&s=10" alt="Avatar">
                        <span class="username">gustavo</span>
                    </header>
                    <div class="post-img">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmSx8kLtF-7vftnFvqhp4zSE-AdpEJQhNoZmWBWP7rCQ&s=10" alt="Postagem">
                    </div>
                    <div class="post-actions">
                        <i class="fa-regular fa-heart like-btn" onclick="toggleLike(this)"></i>
                        <i class="fa-regular fa-comment"></i>
                        <i class="fa-regular fa-paper-plane"></i>
                    </div>
                    <div class="post-body">
                        <p><strong>gustavo</strong> Criando um clone do Instagram com HTML, CSS e JS! 🚀</p>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
<script src="script.js"></script></body>
</html>
