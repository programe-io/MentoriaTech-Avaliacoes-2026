<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Cadastro de Alunos</title>

    <!-- Conectando o CSS -->
    <link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>


<body>

    <div class="container">

        <!-- Cabeçalho -->
        <header>

            <h1>🎓 Sistema de Cadastro de Alunos</h1>

            <p>
                Cadastre e gerencie os alunos de forma simples e organizada.
            </p>

        </header>


        <!-- Imagem principal -->
        <div class="imagem-topo">

            <img 
                src="https://images.unsplash.com/photo-1523240795612-9a054b0db644"
                alt="Estudantes em uma sala de aula"
            >

        </div>


        <!-- Formulário -->
        <div class="card">

            <h2>📝 Cadastrar Aluno</h2>

            <label>Nome do aluno</label>

            <input 
                type="text" 
                id="nome" 
                placeholder="Digite o nome do aluno"
            >


            <label>Turma</label>

            <input 
                type="text" 
                id="turma" 
                placeholder="Exemplo: 2º Ano A"
            >


            <label>Idade</label>

            <input 
                type="number" 
                id="idade" 
                placeholder="Digite a idade"
            >


            <button onclick="cadastrarAluno()">

                ➕ Cadastrar Aluno

            </button>

        </div>


        <!-- Total de alunos -->
        <div class="card total-card">

            <h2>📊 Informações</h2>

            <div class="total">

                Total de alunos cadastrados:

                <span id="total">0</span>

            </div>

        </div>


        <!-- Lista -->
        <div class="card">

            <h2>👥 Alunos Cadastrados</h2>

            <div id="listaAlunos">

                <p class="mensagem">
                    Nenhum aluno cadastrado ainda.
                </p>

            </div>

        </div>


        <!-- Rodapé -->
        <footer>

            <p>
                Sistema de Cadastro de Alunos © 2026
            </p>

        </footer>

    </div>


    <!-- Conectando o JavaScript -->

    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
