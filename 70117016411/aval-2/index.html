
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e2e8f0;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #999;
        }

        input, button {
            padding: 10px;
            margin: 5px;
            width: 85%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #2563eb;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .produto {
            background-color: #f1f5f9;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>📦 Sistema de Estoque</h1>

    <h3>Cadastrar Produto</h3>

    <input type="number" id="codigo" placeholder="Código do produto">
    <input type="text" id="descricao" placeholder="Descrição">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor">

    <button onclick="cadastrar()">Cadastrar Produto</button>

    <h3>Produtos Cadastrados</h3>

    <div id="lista"></div>

    <h3>Alterar Produto</h3>

    <input type="number" id="codigoAlterar" placeholder="Código do produto">

    <input type="number" id="novoValor" placeholder="Novo valor">
    <button onclick="alterarValor()">Alterar Valor</button>

    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">
    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

</div>

<script>

    let produtos = [];

    function cadastrar() {
        let codigo = document.getElementById("codigo").value;
        let descricao = document.getElementById("descricao").value;
        let quantidade = document.getElementById("quantidade").value;
        let valor = document.getElementById("valor").value;

        if (codigo === "" || descricao === "" ||
            quantidade === "" || valor === "") {
            alert("Preencha todos os campos!");
            return;
        }

        if (produtos.some(p => p.codigo === codigo)) {
            alert("Esse código já está cadastrado!");
            return;
        }

        produtos.push({
            codigo: codigo,
            descricao: descricao,
            quantidade: Number(quantidade),
            valor: Number(valor)
        });

        alert("Produto cadastrado com sucesso!");

        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";

        listar();
    }

    function listar() {
        let lista = document.getElementById("lista");

        lista.innerHTML = "";

        produtos.forEach(function(produto) {
            lista.innerHTML += `
                <div class="produto">
                    <strong>Código:</strong> ${produto.codigo}<br>
                    <strong>Descrição:</strong> ${produto.descricao}<br>
                    <strong>Quantidade:</strong> ${produto.quantidade}<br>
                    <strong>Valor:</strong> R$ ${produto.valor.toFixed(2)}
                </div>
            `;
        });
    }

    function alterarValor() {
        let codigo = document.getElementById("codigoAlterar").value;
        let valor = document.getElementById("novoValor").value;

        let produto = produtos.find(p => p.codigo === codigo);

        if (!produto || valor === "" || Number(valor) < 0) {
            alert("Produto não encontrado ou valor inválido!");
            return;
        }

        produto.valor = Number(valor);

        alert("Valor alterado com sucesso!");
        listar();
    }

    function alterarQuantidade() {
        let codigo = document.getElementById("codigoAlterar").value;
        let quantidade = document.getElementById("novaQuantidade").value;

        let produto = produtos.find(p => p.codigo === codigo);

        if (!produto || quantidade === "" || Number(quantidade) < 0) {
            alert("Produto não encontrado ou quantidade inválida!");
            return;
        }

        produto.quantidade = Number(quantidade);

        alert("Quantidade alterada com sucesso!");
        listar();
    }

</script>

</body>
</html>
