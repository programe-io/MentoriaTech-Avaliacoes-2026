
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e6f0ff;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px #aaa;
        }

        h1 {
            color: #2563a6;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #aaa;
            border-radius: 8px;
        }

        button {
            background: #2563a6;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">
        <h1>Controle de IMC</h1>
        <p>Preencha seus dados para calcular seu IMC.</p>

        <input type="text" id="nome" placeholder="Nome do paciente">

        <input type="number" id="peso" placeholder="Peso em kg" step="any">

        <input type="number" id="altura" placeholder="Altura em metros" step="any">

        <br><br>

        <button onclick="calcularIMC()">Calcular IMC</button>

        <div id="resultado"></div>
    </div>

    <script>
        function calcularIMC() {

            let nome = document.getElementById("nome").value;
            let peso = Number(document.getElementById("peso").value);
            let altura = Number(document.getElementById("altura").value);

            if (nome === "" || peso <= 0 || altura <= 0) {
                document.getElementById("resultado").innerHTML =
                    "Preencha todos os campos corretamente!";
                return;
            }

            let imc = peso / (altura * altura);
            let classificacao = "";

            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            } else if (imc < 25) {
                classificacao = "Peso normal";
            } else if (imc < 30) {
                classificacao = "Sobrepeso";
            } else {
                classificacao = "Obesidade";
            }

            document.getElementById("resultado").innerHTML =
                "Paciente: " + nome +
                "<br>IMC: " + imc.toFixed(2) +
                "<br>Classificação: " + classificacao;
        }
    </script>

</body>
</html>
