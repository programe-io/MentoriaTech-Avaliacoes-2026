<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Mistério no Fundo do Mar</title>
        <link rel="stylesheet" href="style.css">
        <link href="style.css" rel="stylesheet"></head>
        <body>
          <main class="game">
              <h1>🌊 Mistério no Fundo do Mar</h1>
                  <p>Explore o oceano e encontre os tesouros perdidos!</p>

                      <div class="stats">
                            <span>💎 Pontos: <strong id="score">0</strong></span>
                                  <span>⏱️ Tempo: <strong id="time">30</strong>s</span>
                                      </div>

                                          <div class="ocean" id="ocean">
                                                <div class="fish">🐠</div>
                                                      <div class="fish fish2">🐟</div>
                                                            <div class="coral">🪸</div>
                                                                  <button class="treasure" id="treasure">🪙</button>
                                                                      </div>

                                                                          <h2 id="message">Encontre os tesouros!</h2>

                                                                              <button id="start">Começar aventura 🚀</button>
                                                                                  <button id="restart">Jogar novamente 🔄</button>
                                                                                    </main>

                                                                                      <script src="script.js"></script>
                                                                                      <script src="script.js"></script></body>
                                                                                      </html>
