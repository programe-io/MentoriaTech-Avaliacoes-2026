<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Batalha dos Heróis</title>
        <link rel="stylesheet" href="style.css">
        <link href="style.css" rel="stylesheet"></head>

        <body>

          <header>
              <h1>⚔️ Batalha dos Heróis ⚔️</h1>
                  <p>Escolha seu herói e prepare-se para o desafio!</p>
                    </header>

                      <main>

                          <section class="herois">

                                <div class="heroi">
                                        <div class="icone">🦸</div>
                                                <h2>Herói da Luz</h2>
                                                        <p>Força: ⭐⭐⭐⭐⭐</p>
                                                                <button onclick="escolherHeroi('Herói da Luz')">
                                                                          Escolher
                                                                                  </button>
                                                                                        </div>

                                                                                              <div class="heroi">
                                                                                                      <div class="icone">🧙</div>
                                                                                                              <h2>Mestre da Magia</h2>
                                                                                                                      <p>Magia: ⭐⭐⭐⭐⭐</p>
                                                                                                                              <button onclick="escolherHeroi('Mestre da Magia')">
                                                                                                                                        Escolher
                                                                                                                                                </button>
                                                                                                                                                      </div>

                                                                                                                                                            <div class="heroi">
                                                                                                                                                                    <div class="icone">⚔️</div>
                                                                                                                                                                            <h2>Guerreiro</h2>
                                                                                                                                                                                    <p>Coragem: ⭐⭐⭐⭐⭐</p>
                                                                                                                                                                                            <button onclick="escolherHeroi('Guerreiro')">
                                                                                                                                                                                                      Escolher
                                                                                                                                                                                                              </button>
                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                            <section class="batalha">
                                                                                                                                                                                                                                  <h2>🏆 Arena da Batalha</h2>

                                                                                                                                                                                                                                        <p id="mensagem">
                                                                                                                                                                                                                                                Escolha um herói para começar!
                                                                                                                                                                                                                                                      </p>

                                                                                                                                                                                                                                                            <button class="batalhar" onclick="iniciarBatalha()">
                                                                                                                                                                                                                                                                    ⚔️ INICIAR BATALHA
                                                                                                                                                                                                                                                                          </button>

                                                                                                                                                                                                                                                                                <div id="resultado"></div>
                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                      </main>

                                                                                                                                                                                                                                                                                        <footer>
                                                                                                                                                                                                                                                                                            <p>⚔️ Batalha dos Heróis - Projeto Escolar ⚔️</p>
                                                                                                                                                                                                                                                                                              </footer>

                                                                                                                                                                                                                                                                                                <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                </html>
