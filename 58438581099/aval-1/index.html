
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro | Gestão de Estoque</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>

<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-boxes-stacked"></i>
            </div>
            <h2>StockPro</h2>
        </div>

        <ul class="menu">
            <li>
                <button class="ativo" onclick="mostrarTodos()">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </button>
            </li>

            <li>
                <button onclick="mostrarTodos()">
                    <i class="fa-solid fa-box"></i>
                    Produtos
                </button>
            </li>

            <li>
                <button onclick="mostrarBaixo()">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Estoque Baixo
                </button>
            </li>
        </ul>
    </aside>

    <div class="principal">

        <header class="topbar">
            <h1>Gestão de Estoque</h1>

            <div class="usuario">
                <span>Administrador</span>
                <i class="fa-solid fa-circle-user"></i>
            </div>
        </header>

        <main class="conteudo">

            <section class="cards">

                <div class="card">
                    <div class="card-topo">
                        <h3>Total de Produtos</h3>
                        <i class="fa-solid fa-box"></i>
                    </div>
                    <strong id="totalProdutos">0</strong>
                </div>

                <div class="card">
                    <div class="card-topo">
                        <h3>Quantidade em Estoque</h3>
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <strong id="totalQuantidade">0</strong>
                </div>

                <div class="card">
                    <div class="card-topo">
                        <h3>Estoque Baixo</h3>
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <strong id="totalBaixo">0</strong>
                </div>

                <div class="card">
                    <div class="card-topo">
                        <h3>Valor do Estoque</h3>
                        <i class="fa-solid fa-dollar-sign"></i>
                    </div>
                    <strong id="valorEstoque">R$ 0,00</strong>
                </div>

            </section>

            <section class="toolbar">

                <div class="pesquisa">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                        type="text"
                        id="pesquisa"
                        placeholder="Pesquisar produto..."
                        oninput="filtrar()"
                    >
                </div>

                <button class="btn azul" onclick="abrirCadastro()">
                    <i class="fa-solid fa-plus"></i>
                    Novo Produto
                </button>

                <button class="btn verde" onclick="atualizar()">
                    <i class="fa-solid fa-rotate"></i>
                    Atualizar
                </button>

                <button class="btn cinza" onclick="exportar()">
                    <i class="fa-solid fa-file-export"></i>
                    Exportar
                </button>

            </section>

            <section class="tabela">

                <div class="tabela-header">
                    <h2>Produtos cadastrados</h2>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>
                </table>

            </section>

        </main>
    </div>
</div>

<!-- Modal de cadastro -->
<div class="modal" id="modalCadastro">

    <div class="modal-box">

        <div class="modal-topo">
            <h2 id="tituloModal">Novo Produto</h2>

            <button class="fechar" onclick="fecharCadastro()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="modal-corpo">

            <input type="hidden" id="produtoId">

            <div class="campo">
                <label for="codigo">Código</label>
                <input type="text" id="codigo" placeholder="Ex: P001">
            </div>

            <div class="campo">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" placeholder="Nome do produto">
            </div>

            <div class="campo">
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" min="0" step="1" placeholder="0">
            </div>

            <div class="campo">
                <label for="valor">Valor unitário</label>
                <input type="number" id="valor" min="0" step="0.01" placeholder="0,00">
            </div>

        </div>

        <div class="modal-botoes">
            <button class="btn cinza" onclick="fecharCadastro()">
                Cancelar
            </button>

            <button class="btn azul" onclick="salvarProduto()">
                <i class="fa-solid fa-check"></i>
                Salvar
            </button>
        </div>

    </div>
</div>

<!-- Modal de QR Code -->
<div class="modal" id="modalQR">

    <div class="modal-box">

        <div class="modal-topo">
            <h2>QR Code do Produto</h2>

            <button class="fechar" onclick="fecharQR()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="qr-box">
            <h3 id="nomeQR"></h3>

            <div id="qrcode"></div>

            <button class="btn azul" onclick="imprimirQR()">
                <i class="fa-solid fa-print"></i>
                Imprimir
            </button>
        </div>

    </div>
</div>

<script src="script.js"></script></body>
</html>
