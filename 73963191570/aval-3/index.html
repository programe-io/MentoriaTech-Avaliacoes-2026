
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Controle de IMC</title>

  <!-- Conexão com o CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Conexão com JavaScript -->
  <script src="script.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<main class="container">

  <header class="header">

    <div class="icon">♡</div>

    <h1>Controle de IMC</h1>

    <p>Cuide da sua saúde com informação!</p>

  </header>

  <form id="formIMC">

    <!-- Nome do paciente -->
    <div class="form-group">

      <label for="nome">Nome do paciente</label>

      <input
        type="text"
        id="nome"
        placeholder="Digite seu nome completo"
        required
      >

    </div>

    <!-- Peso -->
    <div class="form-group">

      <label for="peso">Peso (kg)</label>

      <input
        type="number"
        id="peso"
        placeholder="Ex: 70"
        min="0.1"
        step="any"
        required
      >

    </div>

    <!-- Altura -->
    <div class="form-group">

      <label for="altura">Altura (cm ou metros)</label>

      <input
        type="number"
        id="altura"
        placeholder="Ex: 183 ou 1.83"
        min="0.1"
        step="any"
        required
      >

    </div>

    <!-- Botão -->
    <button type="submit">
      Calcular meu IMC
    </button>

    <!-- Mensagem de erro -->
    <p id="erro" class="erro" role="alert"></p>

  </form>

  <!-- Resultado -->
  <section class="resultado" id="resultado" aria-live="polite">

    <h2>Resultado do paciente</h2>

    <p id="nomeResultado"></p>

    <div class="imc-valor" id="valorIMC">
      0,00
    </div>

    <span class="classificacao" id="classificacao">
                Resultado
            </span>

    <p class="mensagem" id="mensagem"></p>

  </section>

  <footer class="footer">

    Projeto Prático • Controle de IMC

  </footer>

</main>

<script src="script.js"></script></body>
</html>
