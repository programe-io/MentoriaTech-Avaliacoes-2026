<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed Culinário | Sabores da Casa</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="topo">
    <div class="container">
      <h1>🍽️ Feed Sabores</h1>
      <span>Compartilhe o que você está cozinhando hoje</span>
    </div>
  </header>

  <main class="container feed-layout">
    <!-- Caixa para criar nova postagem -->
    <section class="caixa-postar">
      <h2>Nova Receita no Feed</h2>
      <form id="form-post">
        <input type="text" id="autor" placeholder="Seu nome (ex: Ana Paula)" required>
        <input type="text" id="titulo" placeholder="Nome do prato (ex: Lasanha de Berinjela)" required>
        <input type="url" id="imagem" placeholder="URL da foto do prato (opcional)">
        <textarea id="descricao" rows="3" placeholder="Conte os ingredientes principais ou o segredo dessa receita..." required></textarea>
        <button type="submit" class="btn-publicar">Publicar no Feed</button>
      </form>
    </section>

    <!-- Lista de postagens (Feed) -->
    <section id="feed-posts" class="feed-lista">
      <!-- Os posts serão renderizados aqui via JavaScript -->
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
