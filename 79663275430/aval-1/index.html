<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabores da Casa | Blog de Receitas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="cabecalho">
    <div class="container">
      <h1>🍳 Sabores da Casa</h1>
      <p>Receitas práticas, testadas e cheias de sabor para o seu dia a dia.</p>
    </div>
  </header>

  <main class="container">
    <!-- Barra de Busca e Filtros -->
    <section class="controles">
      <input 
        type="text" 
        id="campo-busca" 
        placeholder="Buscar receita ou ingrediente (ex: bolo, frango)..."
      >
      <div class="filtros" id="botoes-filtro">
        <button class="btn-filtro ativo" data-categoria="todas">Todas</button>
        <button class="btn-filtro" data-categoria="doces">Doces</button>
        <button class="btn-filtro" data-categoria="salgados">Salgados</button>
        <button class="btn-filtro" data-categoria="rapidas">Rápidas</button>
      </div>
    </section>

    <!-- Grade de Receitas -->
    <section class="grade-receitas" id="lista-receitas">
      <!-- Os cards são inseridos via JavaScript -->
    </section>
  </main>

  <!-- Modal para ler a receita completa -->
  <div class="modal-fundo" id="modal-receita">
    <div class="modal-conteudo">
      <button class="btn-fechar" id="fechar-modal" aria-label="Fechar">&times;</button>
      <div id="detalhes-receita"></div>
    </div>
  </div>

  <footer class="rodape">
    <p>&copy; 2026 Sabores da Casa — Feito com HTML, CSS e JavaScript.</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
