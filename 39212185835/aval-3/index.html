<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flor de Primavera</title>

    <link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>

    <div class="logo">
        <h1>🌸 Flor de Primavera</h1>
    </div>

    <nav>
        <a href="#">Início</a>
        <a href="#">Buquês</a>
        <a href="#">Presentes</a>
        <a href="#">Contato</a>
    </nav>

</header>

<main>

<section class="produtos">

<h2>Buquês Especiais</h2>

<div class="cards">

<article class="card">

<img src="https://images.unsplash.com/photo-1525310072745-f49212b5ac6d?w=800" alt="Buquê de Rosas">

<div class="conteudo">

<h3>Buquê de Rosas</h3>

<p><span class="preco">R$ 89,90</span></p>

<button onclick="comprar('Buquê de Rosas')">Comprar</button>

</div>

</article>

<article class="card">

<img src="https://images.unsplash.com/photo-1468327768560-75b778cbb551?w=800" alt="Girassóis">

<div class="conteudo">

<h3>Girassóis</h3>

<p><span class="preco">R$ 69,90</span></p>

<button onclick="comprar('Girassóis')">Comprar</button>

</div>

</article>

<article class="card">

<img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=800" alt="Lírios">

<div class="conteudo">

<h3>Lírios</h3>

<p><span class="preco">R$ 99,90</span></p>

<button onclick="comprar('Lírios')">Comprar</button>

</div>

</article>

</div>

</section>

<aside>

<h2>🌷 Promoção</h2>

<p><span class="destaque">Frete grátis</span> para compras acima de R$ 150,00.</p>

<h2>⏰ Horário</h2>

<p>Segunda a Sábado</p>

<p><span class="destaque">08h às 19h</span></p>

</aside>

</main>

<footer>

<div class="rodape">

<p>© 2026 <span class="destaque">Flor de Primavera</span></p>

</div>

</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>

</html>
