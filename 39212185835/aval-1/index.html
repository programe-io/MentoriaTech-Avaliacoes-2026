<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Simples</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🛍️ Loja Simples</h1>
</header>

<main>

<div class="produtos">

    <div class="produto">
        <h2>Camiseta</h2>
        <p>R$ 50,00</p>
        <button onclick="adicionar('Camiseta',50)">Comprar</button>
    </div>

    <div class="produto">
        <h2>Tênis</h2>
        <p>R$ 200,00</p>
        <button onclick="adicionar('Tênis',200)">Comprar</button>
    </div>

    <div class="produto">
        <h2>Boné</h2>
        <p>R$ 40,00</p>
        <button onclick="adicionar('Boné',40)">Comprar</button>
    </div>

</div>

<div class="carrinho">
    <h2>Carrinho</h2>

    <ul id="lista"></ul>

    <h3>Total: R$ <span id="total">0</span></h3>

    <button onclick="finalizar()">Finalizar Compra</button>
</div>

</main>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
