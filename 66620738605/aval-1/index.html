<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog</title>
    <link rel="stylesheet" href="css/styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <!-- Cabeçalho -->
    <header class="header">
        <div class="container">
            <h1 class="logo">Meu<span>Blog</span></h1>
            <nav class="navbar">
                <a href="#home" class="active">Home</a>
                <a href="#sobre">Sobre</a>
                <a href="#contato">Contato</a>
                <button id="darkModeToggle" class="btn-toggle">🌙</button>
            </nav>
        </div>
    </header>

    <!-- Seção Hero -->
    <section class="hero" id="home">
        <div class="container">
            <h2>Bem-vindo ao meu blog! ✨</h2>
            <p>Aqui compartilho ideias, tutoriais e pensamentos sobre tecnologia.</p>
            <input type="text" id="searchBar" placeholder="Buscar artigos...">
        </div>
    </section>

    <!-- Área dos Posts -->
    <main class="container">
        <section id="postsContainer" class="posts-grid">
            <!-- Posts carregados via JavaScript -->
        </section>
    </main>

    <!-- Modal do Post -->
    <div id="postModal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Meu Blog. Feito com ❤️ e código.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
<script src="script.js"></script></body>
</html>
