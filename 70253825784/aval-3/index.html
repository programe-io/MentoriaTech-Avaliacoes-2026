
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Ficha de Anamnese</title>

                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>

                <body>

                    <header>
                            <h1>🩺 Ficha de Anamnese</h1>
                                    <p>Cadastro e informações do paciente</p>
                                        </header>

                                            <main>

                                                    <form id="formAnamnese">

                                                                <section>
                                                                                <h2>Dados pessoais</h2>

                                                                                                <label>Nome completo:</label>
                                                                                                                <input type="text" id="nome" required>

                                                                                                                                <label>Data de nascimento:</label>
                                                                                                                                                <input type="date" id="nascimento" required>

                                                                                                                                                                <label>Telefone:</label>
                                                                                                                                                                                <input type="tel" id="telefone" required>

                                                                                                                                                                                                <label>E-mail:</label>
                                                                                                                                                                                                                <input type="email" id="email">

                                                                                                                                                                                                                                <label>Endereço:</label>
                                                                                                                                                                                                                                                <input type="text" id="endereco">
                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                        <section>
                                                                                                                                                                                                                                                                                        <h2>Informações de saúde</h2>

                                                                                                                                                                                                                                                                                                        <label>Possui alguma alergia?</label>
                                                                                                                                                                                                                                                                                                                        <select id="alergia">
                                                                                                                                                                                                                                                                                                                                            <option value="">Selecione</option>
                                                                                                                                                                                                                                                                                                                                                                <option>Sim</option>
                                                                                                                                                                                                                                                                                                                                                                                    <option>Não</option>
                                                                                                                                                                                                                                                                                                                                                                                                    </select>

                                                                                                                                                                                                                                                                                                                                                                                                                    <label>Possui alguma doença?</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                    <select id="doenca">
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="">Selecione</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option>Sim</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option>Não</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Utiliza algum medicamento?</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <select id="medicamento">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="">Selecione</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option>Sim</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option>Não</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label>Já realizou alguma cirurgia?</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <select id="cirurgia">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="">Selecione</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option>Sim</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option>Não</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Observações:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <textarea id="observacoes" rows="4"></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h2>Informações adicionais</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Motivo da consulta:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <textarea id="motivo" rows="4" required></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Data do atendimento:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="date" id="dataAtendimento" required>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="submit">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Salvar Ficha
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button type="reset" class="limpar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Limpar Formulário
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <section class="resultado">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h2>Fichas cadastradas</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="listaFichas"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
