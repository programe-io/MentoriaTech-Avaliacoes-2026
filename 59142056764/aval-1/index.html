
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Controle de Produtos</h1>

        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <input type="text" id="descricao"
                placeholder="Descrição do produto">

            <input type="number" id="quantidade"
                placeholder="Quantidade">

            <input type="number" id="valor"
                placeholder="Valor">

            <button onclick="cadastrarProdutoHTML()">
                Cadastrar Produto
            </button>
        </section>

        <section class="produtos">
            <h2>Lista de Produtos</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                </tbody>
            </table>
        </section>

        <section class="atualizar">
            <h2>Atualizar Produto</h2>

            <input type="number" id="codigo"
                placeholder="Código do produto">

            <input type="number" id="novoValor"
                placeholder="Novo valor">

            <button onclick="atualizarValorHTML()">
                Atualizar Valor
            </button>

            <input type="number" id="novaQuantidade"
                placeholder="Quantidade para adicionar">

            <button onclick="atualizarQuantidadeHTML()">
                Atualizar Quantidade
            </button>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
