
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        🌐 Meu Mini Feed
    </header>

    <main class="container">

        <section class="post-box">
            <textarea id="texto" placeholder="O que você está pensando?"></textarea>
            <button onclick="publicar()">Publicar</button>
        </section>

        <section id="feed">

            <div class="post">
                <div class="user">
                    <div class="avatar">JS</div>
                    <div class="user-info">
                        <strong>lucas</strong>
                        <span>Há 10 minutos</span>
                    </div>
                </div>

                <p>Olá pessoal! Bem-vindos ao meu mini feed! 😃</p>

                <div class="actions">
                    <button onclick="curtir(this)">❤️ Curtir (0)</button>
                    <button onclick="comentar()">💬 Comentar</button>
                    <button onclick="compartilhar()">↗ Compartilhar</button>
                </div>
            </div>

            <div class="post">
                <div class="user">
                    <div class="avatar">MA</div>
                    <div class="user-info">
                        <strong>julia</strong>
                        <span>Há 30 minutos</span>
                    </div>
                </div>

                <p>Hoje é um ótimo dia para aprender algo novo! 🚀</p>

                <div class="actions">
                    <button onclick="curtir(this)">❤️ Curtir (0)</button>
                    <button onclick="comentar()">💬 Comentar</button>
                    <button onclick="compartilhar()">↗ Compartilhar</button>
                </div>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
