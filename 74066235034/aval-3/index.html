<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMonitor Pro</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <img src="https://cdn-icons-png.flaticon.com/512/2917/2917995.png" alt="Logo de Ecologia" class="logo">
        <h1>EcoMonitor Pro</h1>
        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- ARTICLE: Conteúdo Principal -->
        <article>
            <h2>Analisador de Qualidade do Ar</h2>
            <p>Status atual do sistema: <span class="status-online">Online</span></p>
            
            <div class="form-container">
                <label for="indice">Digite o índice de poluição:</label>
                <input type="number" id="indice" step="0.1" placeholder="Ex: 45.0">
                <button onclick="analisar()">Verificar</button>
            </div>

            <!-- SPAN sendo usado para destacar o resultado dentro da div -->
            <div id="resultado" class="hidden">
                Resultado: <span id="valorResultado"></span>
            </div>
        </article>

        <!-- ASIDE: Informação Lateral -->
        <aside>
            <h3>Resumo das Faixas</h3>
            <p><span class="label-agradavel">Agradável:</span> Abaixo de 35</p>
            <p><span class="label-desagradavel">Desagradável:</span> 35 a 60</p>
            <p><span class="label-perigoso">Perigoso:</span> Acima de 60</p>
            <img src="https://cdn-icons-png.flaticon.com/512/1585/1585218.png" alt="Ícone de Nuvem" class="img-aside">
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 - <span class="highlight">Prática 03</span> - Algoritmos e Front-end</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
