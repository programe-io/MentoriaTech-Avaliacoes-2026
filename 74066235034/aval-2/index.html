<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMonitor - Prática 03</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <img src="https://via.placeholder.com/40" alt="Logo" class="logo">
        <h1>EcoMonitor</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Dados</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- ARTICLE: Conteúdo principal e independente -->
        <article class="card">
            <h2>Classificador de Poluição</h2>
            <p>Algoritmo para classificação de qualidade do ar.</p>
            
            <div class="input-group">
                <label for="indice">Índice Medido:</label>
                <input type="number" id="indice" step="0.1" placeholder="Ex: 42.5">
                <button onclick="classificar()">Analisar</button>
            </div>

            <div id="resultado" class="hidden"></div>
        </article>

        <!-- ASIDE: Conteúdo relacionado/auxiliar -->
        <aside>
            <h3>Legenda</h3>
            <ul>
                <li><strong>< 35:</strong> Agradável</li>
                <li><strong>35 - 60:</strong> Desagradável</li>
                <li><strong>> 60:</strong> Perigoso</li>
            </ul>
            <img src="https://via.placeholder.com/120x80" alt="Icone Ambiental">
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 - Desenvolvido para Prática de Algoritmos</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
