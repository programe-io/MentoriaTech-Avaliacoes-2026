<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #333;
            text-align: center;
        }
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        input, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #bd2130;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            color: #333;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .actions {
            display: flex;
            gap: 5px;
        }
        .actions input {
            width: 70px;
            padding: 5px;
        }
        .actions button {
            padding: 5px 10px;
            font-size: 12px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
    <h1>📦 Sistema de Controle de Estoque</h1>
    
    <!-- Formulário de Cadastro -->
    <h2>Cadastrar Novo Produto</h2>
    <div class="form-group">
        <input type="text" id="codigo" placeholder="Código">
        <input type="text" id="descricao" placeholder="Descrição/Nome">
        <input type="number" id="quantidade" placeholder="Quantidade" min="0">
        <input type="number" id="valor" placeholder="Valor (R$)" step="0.01" min="0">
        <button onclick="cadastrarProduto()">Cadastrar</button>
    </div>

    <!-- Tabela de Listagem e Alteração -->
    <h2>Produtos Cadastrados</h2>
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor (R$)</th>
                <th>Ações de Alteração</th>
            </tr>
        </thead>
        <tbody id="tabelaEstoque">
            <!-- Os produtos cadastrados aparecerão aqui -->
        </tbody>
    </table>
</div>

<script>
    // Array para armazenar o estoque de produtos
    let estoque = [];

    // Função para renderizar/atualizar a tabela na tela
    function atualizarTabela() {
        const tbody = document.getElementById("tabelaEstoque");
        tbody.innerHTML = ""; // Limpa a tabela antes de redesenhar

        if (estoque.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#777;">Nenhum produto cadastrado.</td></tr>`;
            return;
        }

        estoque.forEach((produto, index) => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td><strong>${produto.codigo}</strong></td>
                <td>${produto.descricao}</td>
                <td>${produto.quantidade}</td>
                <td>R$ ${produto.valor.toFixed(2)}</td>
                <td class="actions">
                    <!-- Alterar Quantidade -->
                    <input type="number" id="novaQtd-${index}" placeholder="Nova Qtd" min="0">
                    <button onclick="alterarQuantidade(${index})">Qtd</button>
                    
                    <!-- Alterar Valor -->
                    <input type="number" id="novoVal-${index}" placeholder="Novo Val" step="0.01" min="0">
                    <button onclick="alterarValor(${index})">$"</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Função para cadastrar um novo produto
    function cadastrarProduto() {
        const codigo = document.getElementById("codigo").value.trim();
        const descricao = document.getElementById("descricao").value.trim();
        const quantidade = parseInt(document.getElementById("quantidade").value, 10);
        const valor = parseFloat(document.getElementById("valor").value);

        // Validações básicas
        if (!codigo || !descricao || isNaN(quantidade) || isNaN(valor)) {
            alert("Por favor, preencha todos os campos corretamente.");
            return;
        }

        // Verifica duplicidade de código
        const existe = estoque.find(p => p.codigo === codigo);
        if (existe) {
            alert("Erro: Já existe um produto com este código!");
            return;
        }

        // Adiciona ao array
        estoque.push({ codigo, descricao, quantidade, valor });

        // Limpa os campos do formulário
        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";

        atualizarTabela();
    }

    // Função para alterar a quantidade de um produto específico
    function alterarQuantidade(index) {
        const inputQtd = document.getElementById(`novaQtd-${index}`);
        const novaQuantidade = parseInt(inputQtd.value, 10);

        if (isNaN(novaQuantidade) || novaQuantidade < 0) {
            alert("Digite uma quantidade válida (maior ou igual a 0).");
            return;
        }

        estoque[index].quantidade = novaQuantidade;
        atualizarTabela();
    }

    // Função para alterar o valor de um produto específico
    function alterarValor(index) {
        const inputVal = document.getElementById(`novoVal-${index}`);
        const novoValor = parseFloat(inputVal.value);

        if (isNaN(novoValor) || novoValor < 0) {
            alert("Digite um valor válido (maior ou igual a 0).");
            return;
        }

        estoque[index].valor = novoValor;
        atualizarTabela();
    }

    // Inicializa a tabela vazia ao carregar a página
    atualizarTabela();
</script>

<script src="script.js"></script></body>
</html>
