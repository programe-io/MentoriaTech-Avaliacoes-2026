<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="weekly-blog">
  <!-- Cabeçalho -->
  <header class="header">
    <div class="logo">
      📅 <span>PlanoSemanal</span> Dev
    </div>
    <button id="theme-toggle" class="theme-btn">🌙 Modo Escuro</button>
  </header>

  <div class="main-layout">
    <!-- Cronograma Semanal -->
    <main class="schedule-feed">
      
      <!-- Segunda-Feira -->
      <section class="day-card">
        <div class="day-header">
          <h2>Segunda-Feira</h2>
          <span class="day-tag">HTML & Estrutura</span>
        </div>
        <div class="topic-list">
          <label class="topic-item">
            <input type="checkbox" class="task-check">
            <span>Semântica HTML5 (header, main, footer, section)</span>
          </label>
          <label class="topic-item">
            <input type="checkbox" class="task-check">
            <span>Formulários e acessibilidade básica</span>
          </label>
        </div>
      </section>

      <!-- Terça-Feira -->
      <section class="day-card">
        <div class="day-header">
          <h2>Terça-Feira</h2>
          <span class="day-tag css-tag">CSS Layouts</span>
        </div>
        <div class="topic-list">
          <label class="topic-item">
            <input type="checkbox" class="task-check">
            <span>Flexbox: Alinhamento e eixos principais</span>
          </label>
          <label class="topic-item">
            <input type="checkbox" class="task-check">
            <span>CSS Grid: Criando layouts responsivos</span>
          </label>
        </div>
      </section>

      <!-- Quarta-Feira -->
      <section class="day-card">
        <div class="day-header">
          <h2>Quarta-Feira</h2>
          <span class="day-tag js-tag">JavaScript Básico</span>
        </div>
        <div class="topic-list">
          <label class="topic-item">
            <input type="checkbox" class="task-check">
            <span>Variáveis (const, let) e Tipos de Dados</span>
          </label>
          <label class="topic-item">
            <input type="checkbox" class="task-check">
            <span>Funções e Arrow Functions</span>
          </label>
        </div>
      </section>

      <!-- Quinta-Feira -->
      <section class="day-card">
        <div class="day-header">
          <h2>Quinta-Feira</h2>
          <span class="day-tag js-tag">JavaScript DOM</span>
        </div>
        <div class="topic-list">
          <label class="topic-item">
            <input type="checkbox" class="task-check">
            <span>Manipulação do DOM (querySelector, addEventListener)</span>
          </label>
          <label class="topic-item">
            <input type="checkbox" class="task-check">
            <span>Uso do LocalStorage para salvar dados no navegador</span>
          </label>
        </div>
      </section>

      <!-- Sexta-Feira -->
      <section class="day-card">
        <div class="day-header">
          <h2>Sexta-Feira</h2>
          <span class="day-tag proj-tag">Projeto Prático</span>
        </div>
        <div class="topic-list">
          <label class="topic-item">
            <input type="checkbox" class="task-check">
            <span>Unir HTML, CSS e JS para criar um projeto real</span>
          </label>
          <label class="topic-item">
            <input type="checkbox" class="task-check">
            <span>Revisão geral do que foi aprendido no decorrer da semana</span>
          </label>
        </div>
      </section>

    </main>

    <!-- Barra Lateral -->
    <aside class="sidebar">
      <div class="widget">
        <h3>📊 Progresso da Semana</h3>
        <p class="progress-text">Matérias Concluídas: <strong id="completed-count">0</strong> / <span id="total-count">0</span></p>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="widget">
        <h3>📝 Metas & Observações</h3>
        <textarea id="weekly-notes" placeholder="Ex: Focar 1 hora por dia sem distrações..."></textarea>
        <button id="save-notes-btn" class="save-btn">Salvar Anotação</button>
        <span id="save-status" class="save-status">Salvo com sucesso!</span>
      </div>
    </aside>
  </div>
</div>
  <script src="script.js"></script>
  
</body>
</html>
