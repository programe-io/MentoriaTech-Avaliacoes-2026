
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de IMC</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main class="container">

        <header>
            <h1>Ficha de Anamnese</h1>
            <p>Cadastro de pacientes e controle de IMC</p>
        </header>

        <!-- CARD DO FORMULÁRIO -->

        <section class="card">

            <h2>Cadastro de Paciente</h2>

            <form id="formPessoa">

                <div class="campo">
                    <label for="nome">Nome completo</label>

                    <input
                        type="text"
                        id="nome"
                        maxlength="50"
                        placeholder="Digite o nome do paciente"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>

                    <input
                        type="number"
                        id="idade"
                        min="1"
                        max="120"
                        step="1"
                        placeholder="Ex: 30"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="altura">Altura (metros)</label>

                    <input
                        type="number"
                        id="altura"
                        min="0.5"
                        max="2.5"
                        step="0.01"
                        placeholder="Ex: 1.70"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg)</label>

                    <input
                        type="number"
                        id="peso"
                        min="2"
                        max="500"
                        step="0.1"
                        placeholder="Ex: 65"
                        required
                    >
                </div>

                <p id="erro" class="erro" hidden></p>

                <div class="botoes">

                    <button type="submit" class="btn-salvar">
                        Salvar Paciente
                    </button>

                    <button type="reset" class="btn-cancelar">
                        Cancelar
                    </button>

                </div>

            </form>

        </section>

        <!-- CARD DA TABELA -->

        <section class="card">

            <h2>Pacientes Cadastrados</h2>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Altura</th>
                            <th>Peso</th>
                            <th>IMC</th>
                            <th>Classificação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaPessoas">

                        <!-- Dados inseridos pelo JavaScript -->

                    </tbody>

                </table>

            </div>

        </section>

        <footer>
            <p>Sistema de Cadastro e Controle de IMC</p>
        </footer>

    </main>

    <script src="app.js"></script>

<script src="script.js"></script></body>

</html>
