<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Exemplo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #0066cc;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #004c99;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }

        .conteudo {
            display: flex;
        }

        aside {
            width: 25%;
            background-color: #f0f0f0;
            padding: 15px;
        }

        main {
            width: 75%;
            padding: 15px;
        }

        article {
            background-color: #e8e8e8;
            padding: 15px;
            border-radius: 8px;
        }

        img {
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Meu Site</h1>
        <h3>Exemplo com tags semânticas HTML5</h3>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#">Produtos</a>
        <a href="#">Contato</a>
    </nav>

    <div class="conteudo">

        <aside>
            <h3>Menu Lateral</h3>
            <ul>
                <li>Notícias</li>
                <li>Galeria</li>
                <li>Ajuda</li>
            </ul>
        </aside>

        <main>
            <article>
                <h3>Artigo Principal</h3>

                <img src="https://via.placeholder.com/500x250"
                     alt="Imagem de exemplo">

                <p>
                    Este é um exemplo de conteúdo dentro da tag
                    <strong>article</strong>. A imagem acima foi inserida
                    usando a tag <strong>img</strong>.
                </p>
            </article>
        </main>

    </div>

    <footer>
        <p>&copy; 2026 - Todos os direitos reservados.</p>
    </footer>

<script src="script.js"></script></body>
</html>
