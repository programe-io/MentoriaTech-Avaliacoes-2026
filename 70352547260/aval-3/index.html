<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo HTML</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        main {
            padding: 20px;
        }

        div {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 8px;
        }

        span {
            color: #4CAF50;
            font-weight: bold;
        }

        img {
            width: 300px;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h2>Meu Site</h2>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
    </nav>

    <main>
        <div>
            <p>
                Este é um exemplo usando as tags
                <span>span</span>,
                <span>div</span>,
                <span>nav</span>,
                <span>main</span>,
                <span>img</span>,
                <span>header</span> e
                <span>h2</span>.
            </p>

            <img src="https://via.placeholder.com/300x200" alt="Imagem de exemplo">
        </div>
    </main>

<script src="script.js"></script></body>
</html>
