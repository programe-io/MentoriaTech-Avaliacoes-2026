    <script>

       
        
function likePost(button) {
    const icon = button.querySelector('i');
    const post = button.closest('article');
    const likes = post.querySelector('.likes');

    if (likes.dataset.count === undefined) {
        const original = likes.textContent.trim();

        let initialCount = 0;

        if (original.includes('K')) {
            initialCount = parseFloat(original) * 1000;
        } else if (original.toLowerCase().includes('mil')) {
            initialCount = parseFloat(original) * 1000;
        } else {
            initialCount = parseInt(original.replace(/\D/g, '')) || 0;
        }

        likes.dataset.count = initialCount;
    }

    let count = Number(likes.dataset.count);

    if (icon.dataset.liked !== 'true') {
        
        icon.dataset.liked = 'true';
        icon.className = 'heart-symbol heart-active';
        icon.textContent = '❤️';
        count++;
    } else {
       
        icon.dataset.liked = 'false';
        icon.className = 'heart-symbol';
        icon.textContent = '♡';
        count = Math.max(0, count - 1);
    }

    likes.dataset.count = count;
    likes.textContent = count.toLocaleString('pt-BR') + ' curtidas';
}

       
        function commentPost(button) {
            const post = button.closest('article');
            post.querySelector('input').focus();
        }

       
        function newPost(event) {
            const file = event.target.files[0];

            if (!file) return;

            const url = URL.createObjectURL(file);
            const post = document.createElement('article');

            post.className = 'border-b border-gray-200 pb-5 mb-5';

            post.innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-3">
                        <img class="w-9 h-9 rounded-full object-cover" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100">
                        <span class="font-semibold text-sm">seu_usuario</span>
                    </div>

                    <button>•••</button>
                </div>

                <img class="post-image rounded-sm" src="${url}">

                <div class="flex justify-between text-2xl mt-3">
                    <div class="flex gap-4">
                        <button onclick="likePost(this)">
                            <i class="bx bx-heart"></i>
                        </button>

                        <button onclick="commentPost(this)">
                            <i class="bx bx-message-rounded"></i>
                        </button>

                        <button><i class="bx bx-send"></i></button>
                    </div>

                    <button onclick="savePost(this)">
                        <i class="bx bx-bookmark"></i>
                    </button>
                </div>

                <p class="font-semibold text-sm mt-2 likes" data-count="0">0 curtidas</p>
                <p class="text-sm mt-1"><b>seu_usuario</b> Minha nova publicação! ❤️</p>

                <input class="w-full mt-3 text-sm outline-none" placeholder="Adicione um comentário...">
            `;

            document.getElementById('posts').prepend(post);
            event.target.value = '';
        }

    </script>
