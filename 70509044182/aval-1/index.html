
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <header>
            <h1>📦 Sistema de Estoque</h1>
            <p>Controle seus produtos de maneira fácil!</p>
        </header>

        <section class="resumo">
            <div class="card">
                <h2 id="totalProdutos">0</h2>
                <p>Produtos</p>
            </div>

            <div class="card">
                <h2 id="totalQuantidade">0</h2>
                <p>Itens no estoque</p>
            </div>

            <div class="card">
                <h2 id="valorEstoque">R$ 0,00</h2>
                <p>Valor total</p>
            </div>
        </section>

        <section class="cadastro">
            <h2>Adicionar Produto</h2>

            <input type="text" id="nome"
                placeholder="Nome do produto">

            <input type="number" id="quantidade"
                placeholder="Quantidade" min="1">

            <input type="number" id="preco"
                placeholder="Preço (R$)" min="0" step="0.01">

            <button onclick="adicionarProduto()">
                + Cadastrar Produto
            </button>
        </section>

        <section class="estoque">
            <h2>Produtos Cadastrados</h2>

            <input type="text" id="pesquisa"
                placeholder="🔎 Pesquisar produto..."
                oninput="mostrarProdutos()">

            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
        </section>

        <footer>
            <p>📊 Sistema de Controle de Estoque</p>
        </footer>

    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
