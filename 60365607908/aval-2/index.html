<!DOCTYPE html>
<html lang="pt-br">
    <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mini Feed</title>
	<link rel="stylesheet" href="style.css">
    <link href="style.css" rel="stylesheet"></head>
    <body>
	<header>
	    <div class="header-contente">
		<h1>Mini Feed</h1>
		<nav>
		    <a href="#">Início</a>
		    <a href="#">Perfil</a>
		</nav>
	    </div>
	</header>
	<main>
	    <section class="new-post">
		<div class="user">
		    <div class="avatar>
			I
		    </div>
		    <div>
			<strong>Isabel</strong>
			<span>O que está pensando?</span>
		    </div>
		</div>
		<button>Publicar</button>
	    </section>
	    <section>
		<article class="post">
		<div class="post-header">
		    <div class="avatar>
			M
		    </div>
		    <div>
			<strong>Maria</strong>
			<span>Há 10 min</span>
		    </div>
		</div>
		<div class="post-text">
		    <p>Hoje eu vi o novo filme to miranha, top, tô feliz :D</p>
		</div>
		<figure>
		    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSun9l5yAh3YQ1GEsF8XfsN7cS-_3043buwXEosD_RObQ&s=10" alt="Homem aranha">
		</figure>
		<div class="post-actions">
		   <button>Curtir</button>
		   <button>Comentar</button>
		</article>
	</main>
	<footer>
	    <p>&copy; Mini Feed &mdash; Direitos Autorais</p>
	</footer>
    </body>
</html>
