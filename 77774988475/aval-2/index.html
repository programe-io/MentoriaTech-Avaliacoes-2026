<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Top-Down Shooter - 10 Fases</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div id="hud">
        <div>FASE: <span id="ui-wave">1</span>/10</div>
        <div>VIDA: <span id="ui-hp" style="color: #ff4757;">100</span></div>
        <div>INIMIGOS: <span id="ui-enemies">0</span></div>
        <div>PONTOS: <span id="ui-score">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="weapon-menu">
        <button class="weapon-btn active" id="btn-0">1: Pistola</button>
        <button class="weapon-btn" id="btn-1">2: Escopeta</button>
        <button class="weapon-btn" id="btn-2">3: Metralhadora</button>
        <button class="weapon-btn" id="btn-3">4: Sniper</button>
        <button class="weapon-btn" id="btn-4">5: Plasma</button>
    </div>

    <div id="screen-overlay">
        <h1 id="overlay-title">SURVIVOR 2D</h1>
        <p id="overlay-desc">
            Mova com W,A,S,D. Mire e Atire com o Mouse.<br>
            Troque de arma pelas teclas 1 a 5 ou clique nos botões.
        </p>
        <button id="start-btn">JOGAR</button>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
