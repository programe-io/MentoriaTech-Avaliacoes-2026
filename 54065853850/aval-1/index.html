<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="prancheta">

    <header class="cabecalho">
      <div class="carimbo">
        <span class="carimbo-titulo">ESTOQUE</span>
        <span class="carimbo-sub">controle de mercadorias</span>
      </div>
      <div class="ficha-numero" id="totalItens">000 ITENS</div>
    </header>

    <nav class="abas" id="abas">
      <button class="aba ativa" data-aba="cadastrar">01 · Cadastrar</button>
      <button class="aba" data-aba="listar">02 · Ver estoque</button>
    </nav>

    <!-- ===== ABA: CADASTRAR ===== -->
    <section class="painel ativa" id="painel-cadastrar">
      <p class="instrucao">Preencha a ficha para registrar um novo item no estoque.</p>

      <form id="formCadastro" class="formulario" autocomplete="off">
        <div class="campo">
          <label for="codigo">Código</label>
          <input type="text" id="codigo" placeholder="EX: 0042" required>
        </div>
        <div class="campo campo-larga">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Nome do produto" required>
        </div>
        <div class="campo">
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" min="0" placeholder="0" required>
        </div>
        <div class="campo">
          <label for="valor">Valor (R$)</label>
          <input type="number" id="valor" min="0" step="0.01" placeholder="0,00" required>
        </div>

        <button type="submit" class="botao botao-primario">Cadastrar produto</button>
      </form>

      <p class="aviso" id="avisoCadastro"></p>
    </section>

    <!-- ===== ABA: LISTAR / ALTERAR ===== -->
    <section class="painel" id="painel-listar">
      <p class="instrucao">Toque no valor ou na quantidade de um item para alterá-lo.</p>

      <div id="listaVazia" class="vazio">
        <span class="vazio-selo">SEM REGISTROS</span>
        <p>Nenhum produto cadastrado ainda. Use a aba "Cadastrar" para começar.</p>
      </div>

      <div class="tabela-envoltorio" id="tabelaEnvoltorio" style="display:none;">
        <table class="tabela">
          <thead>
            <tr>
              <th>Código</th>
              <th>Descrição</th>
              <th>Quantidade</th>
              <th>Valor</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="corpoTabela"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
