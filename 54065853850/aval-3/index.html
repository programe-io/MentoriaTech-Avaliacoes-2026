<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
<link href="style.css" rel="stylesheet"></head>
<body>

  <h1>Gerenciador de Tarefas</h1>

  <section>
    <h2>Nova Tarefa</h2>
    <form id="task-form">
      <div>
        <label for="task-title">Título da Tarefa:</label><br>
        <input 
          type="text" 
          id="task-title" 
          name="titulo" 
          minlength="5" 
          placeholder="Mínimo 5 caracteres" 
          required
        >
      </div>
      <br>
      <div>
        <label for="task-priority">Prioridade:</label><br>
        <select id="task-priority" name="prioridade" required>
          <option value="1">1 - Alta</option>
          <option value="2">2 - Média</option>
          <option value="3">3 - Baixa</option>
        </select>
      </div>
      <br>
      <button type="submit">Cadastrar Tarefa</button>
    </form>
  </section>

  <hr>

  <section>
    <h2>Tarefas Cadastradas</h2>
    
    <ul>
      <li>
        <strong>#1 - Estudar JavaScript</strong> | 
        <span>Prioridade: </span>
        <select name="alterar-prioridade">
          <option value="1" selected>1 (Alta)</option>
          <option value="2">2 (Média)</option>
          <option value="3">3 (Baixa)</option>
        </select> | 
        <span>Status: Pendente</span>
        <button type="button">Marcar como Concluída</button>
      </li>

      <li>
        <strong>#2 - Criar estrutura HTML</strong> | 
        <span>Prioridade: </span>
        <select name="alterar-prioridade">
          <option value="1">1 (Alta)</option>
          <option value="2" selected>2 (Média)</option>
          <option value="3">3 (Baixa)</option>
        </select> | 
        <span>Status: Concluída</span>
        <button type="button">Refazer</button>
      </li>
    </ul>
  </section>

<script src="script.js"></script></body>
</html>
