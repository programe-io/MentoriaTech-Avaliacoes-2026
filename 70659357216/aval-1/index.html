<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <title>avaliacao 1</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
    <div class="container">
        <h1>estoque 2 ano</h1>

        <div class="section">
            <h2>gerenciar produtos</h2>

            <div class="input-group">
                <label for="nomep">nome do produto:</label>
                <input type="text" id="nomep" placeholder="digite o nome do produto">

            </div>

            <div class="input-group">
                <label for="qtdp">quantidade:</label>
                <input type="number" id="qtdp" placeholder="digite a quantidade do produto">
            </div>

            <div class="input-group">
                <label for="precop">preco do produto:</label>
                <input type="number" id="qtdp" placeholder="digite o preco do produto">
            </div>
            <button id="btadd" class="btn-update">adicionar produto</button>
            <button id="btatualizar" class="btn-update">atualizar produto</button>
            <button id="btexcluir" class="btn-update">excluir produto</button>
        </div>

        <div class="section">
            <h2>lista de produtos</h2>
            <ul id="listaprodutos" class="lista-produtos">
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
<script src="script.js"></script></body>

</html>
