<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike Store</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<!-- NAV -->
<nav>
  <h2>🚲 Bike Store</h2>
  <span>As melhores bikes do Brasil</span>

  <a href="#">Início</a>
  <a href="#">Modelos</a>
  <a href="#">Contato</a>
</nav>

<header>
  <h1>Bem-vindo à Bike Store</h1>
  <p>Encontre sua bicicleta ideal</p>
</header>

<main>

  <!-- ARTICLE -->
  <article>

    <section class="produtos">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1544191696-102dbdaeeaa2" alt="Bike Speed">
        <h3>Bike Speed <span>Nova</span></h3>
        <p>R$ 1.299</p>
        <button>Comprar</button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1520975922203-bb2f6c3a5b4c" alt="Mountain Bike">
        <h3>Mountain Bike <span>Top</span></h3>
        <p>R$ 1.899</p>
        <button>Comprar</button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1508609349937-5ec4ae374ebf" alt="Bike Urbana">
        <h3>Bike Urbana <span>Promo</span></h3>
        <p>R$ 999</p>
        <button>Comprar</button>
      </div>

    </section>

  </article>

  <!-- ASIDE -->
  <aside>
    <h3>🛒 Carrinho</h3>
    <ul id="carrinho"></ul>
  </aside>

</main>

<footer>
  <p>© 2026 Bike Store</p>
</footer>

<script>
function comprar(produto) {
  const carrinho = document.getElementById("carrinho");

  const item = document.createElement("li");
  item.textContent = produto + " adicionado ao carrinho 🛒";

  carrinho.appendChild(item);
}
</script>

<script src="script.js"></script></body>
</html>
