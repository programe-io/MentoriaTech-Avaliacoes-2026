<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram | Paulimho o Loko</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

.sidebar {
  position: fixed;
  width: 240px;
  height: 100vh;
  border-right: 1px solid #262626;
  padding: 30px 20px;
}

.logo {
  font-family: cursive;
  font-size: 30px;
  margin-bottom: 40px;
}

.menu a {
  display: block;
  padding: 17px 10px;
  color: white;
  text-decoration: none;
  font-size: 17px;
  border-radius: 10px;
}

.menu a:hover {
  background: #222;
}

main {
  margin-left: 240px;
  display: flex;
  justify-content: center;
  padding: 35px 15px;
}

.content {
  width: 470px;
  max-width: 100%;
}

.profile {
  text-align: center;
  margin-bottom: 25px;
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 3px solid #e1306c;
  object-fit: cover;
}

.profile h2 {
  margin: 12px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 18px;
}

.stories {
  display: flex;
  gap: 18px;
  overflow-x: auto;
  padding: 20px 5px;
  margin-bottom: 20px;
}

.story {
  text-align: center;
  font-size: 12px;
  min-width: 65px;
}

.story img {
  width: 62px;
  height: 62px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #e1306c;
  padding: 2px;
}

.post {
  border: 1px solid #292929;
  border-radius: 10px;
  margin-bottom: 25px;
  overflow: hidden;
}

.post-header {
  padding: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-header img {
  width: 38px;
  height: 38px;
  object-fit: cover;
  border-radius: 50%;
}

.post-image {
  width: 100%;
  height: 440px;
  object-fit: cover;
  background: #222;
}

.actions {
  padding: 12px;
  font-size: 25px;
}

.actions span {
  cursor: pointer;
  margin-right: 12px;
}

.liked {
  color: #ff3040;
}

.caption {
  padding: 0 13px 15px;
  font-size: 14px;
}

.comment-box {
  display: flex;
  padding: 10px;
  border-top: 1px solid #292929;
}

.comment-box input {
  flex: 1;
  background: transparent;
  color: white;
  border: none;
  outline: none;
}

.comment-box button {
  background: transparent;
  border: none;
  color: #0095f6;
  font-weight: bold;
  cursor: pointer;
}

@media(max-width:700px) {
  .sidebar {
    position: fixed;
    bottom: 0;
    top: auto;
    width: 100%;
    height: 60px;
    padding: 5px;
    background: #080808;
    border-top: 1px solid #292929;
    border-right: none;
    z-index: 10;
  }

  .logo {
    display: none;
  }

  .menu {
    display: flex;
    justify-content: space-around;
  }

  .menu a {
    padding: 12px 5px;
    font-size: 20px;
  }

  .menu a span {
    display: none;
  }

  main {
    margin: 0;
    padding: 20px 10px 80px;
  }

  .post-image {
    height: auto;
    aspect-ratio: 1;
  }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

<aside class="sidebar">
  <div class="logo">Instagram</div>
  <nav class="menu">
    <a href="#">🏠 <span>Início</span></a>
    <a href="#">🔍 <span>Pesquisar</span></a>
    <a href="#">🎬 <span>Reels</span></a>
    <a href="#">✉️ <span>Mensagens</span></a>
    <a href="#">❤️ <span>Notificações</span></a>
    <a href="#perfil">👤 <span>Perfil</span></a>
  </nav>
</aside>

<main>
<div class="content">

<section class="profile" id="perfil">
  <img class="avatar"
  src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=300"
  alt="Perfil">
  <h2>Paulimho o Loko 🔥</h2>
  <p>@paulimho_oloko</p>

  <div class="stats">
    <div><strong>125</strong><br>Publicações</div>
    <div><strong>15,8 mil</strong><br>Seguidores</div>
    <div><strong>890</strong><br>Seguindo</div>
  </div>

  <p>😈 O ORIGINAL É DIFERENTE!</p>
  <p>🔥 Vivendo do meu jeito.</p>
</section>

<div class="stories">
  <div class="story">
    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150">
    <p>Meu dia</p>
  </div>
  <div class="story">
    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150">
    <p>Resenha</p>
  </div>
  <div class="story">
    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=150">
    <p>Amigos</p>
  </div>
  <div class="story">
    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150">
    <p>Rolezin</p>
  </div>
</div>

<div id="feed"></div>

</div>
</main>

<script>
const posts = [
  {
    image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=900",
    caption: "O estilo é meu, a história também! 😎🔥"
  },
  {
    image: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=900",
    caption: "Quem é de verdade sabe! 💯"
  },
  {
    image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=900",
    caption: "Só progresso, tropa! 🚀"
  }
];

const feed = document.getElementById("feed");

posts.forEach((post, index) => {
  const article = document.createElement("article");
  article.className = "post";

  article.innerHTML = `
    <div class="post-header">
      <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100">
      <strong>paulimho_oloko 🔥</strong>
    </div>

    <img class="post-image" src="${post.image}">

    <div class="actions">
      <span class="like">♡</span>
      <span>💬</span>
      <span>➤</span>
    </div>

    <div class="caption">
      <strong>${index === 0 ? "1.250" : "980"} curtidas</strong>
      <p><strong>paulimho_oloko</strong> ${post.caption}</p>
    </div>

    <div class="comment-box">
      <input placeholder="Adicione um comentário...">
      <button>Publicar</button>
    </div>
  `;

  feed.appendChild(article);

  const like = article.querySelector(".like");
  like.addEventListener("click", () => {
    like.classList.toggle("liked");
    like.textContent = like.classList.contains("liked") ? "♥" : "♡";
  });

  const input = article.querySelector("input");
  const button = article.querySelector("button");

  button.addEventListener("click", () => {
    if(input.value.trim()) {
      const comment = document.createElement("p");
      comment.textContent = "Você: " + input.value;
      article.querySelector(".caption").appendChild(comment);
      input.value = "";
    }
  });
});
</script>

<script src="script.js"></script></body>
</html>
