<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="feed-container">
  <header class="feed-header">
    <h1>Mini Feed Social</h1>
  </header>

  <!-- Área para criar nova publicação -->
  <div class="new-post-box">
    <textarea id="post-input" placeholder="O que está acontecendo?" maxlength="280"></textarea>
    <div class="box-actions">
      <span id="char-counter">280</span>
      <button id="post-btn">Publicar</button>
    </div>
  </div>

  <!-- Container onde as publicações vão aparecer -->
  <div id="posts-container">
    <!-- Exemplo de post estático -->
    <div class="post">
      <div class="post-header">
        <span class="user-name">Dev Aprendiz</span>
        <span class="post-time">há 2 min</span>
      </div>
      <p class="post-content">Acabei de criar a estrutura do meu mini feed social! 🚀 #WebDev</p>
      <div class="post-actions">
        <button class="like-btn" onclick="toggleLike(this)">❤️ <span class="like-count">0</span></button>
      </div>
    </div>
  </div>
</div>
  <script src="script.js"></script>
  
</body>
</html>
