<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Caixa Principal de Login -->
    <div class="login-box">
        <h1 class="instagram-logo">Instagram</h1>
        
        <form id="login-form">
            <input type="text" id="username" placeholder="Telefone, nome de usuário ou email" required>
            <input type="password" id="password" placeholder="Senha" required>
            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div class="divisor">
            <div class="linha"></div>
            <div class="ou">OU</div>
            <div class="linha"></div>
        </div>

        <div class="facebook-login">
            <a href="#">Entrar com o Facebook</a>
        </div>

        <a href="#" class="esqueceu-senha">Esqueceu a senha?</a>
    </div>

    <!-- Caixa de Cadastro -->
    <div class="signup-box">
        <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
    </div>
</div>
  <script src="script.js"></script>
  
</body>
</html>
