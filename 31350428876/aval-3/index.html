<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Ficha de Anamnese - IMC</title>
        <link rel="stylesheet" href="style.css">
        <link href="style.css" rel="stylesheet"></head>
        <body>
          <main>
              <h1>Ficha de Anamnese - Controle de IMC</h1>

                  <form id="form-pessoa">
                        <input type="text" id="nome" placeholder="Nome do paciente">
                              <input type="number" id="peso" placeholder="Peso (kg)" step="0.1">
                                    <input type="number" id="altura" placeholder="Altura (m)" step="0.01">
                                          <button type="submit">Salvar</button>
                                                <p id="erro" hidden></p>
                                                    </form>

                                                        <table>
                                                              <thead>
                                                                      <tr>
                                                                                <th>Código</th>
                                                                                          <th>Nome</th>
                                                                                                    <th>Peso</th>
                                                                                                              <th>Altura</th>
                                                                                                                        <th>IMC</th>
                                                                                                                                  <th>Classificação</th>
                                                                                                                                          </tr>
                                                                                                                                                </thead>
                                                                                                                                                      <tbody id="tbody-pessoas"></tbody>
                                                                                                                                                          </table>
                                                                                                                                                            </main>
                                                                                                                                                              <script src="script.js"></script>
                                                                                                                                                              <script src="script.js"></script></body>
                                                                                                                                                              </html>
