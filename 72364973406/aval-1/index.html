<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dia e Mês</title>
  <link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="card" role="main" aria-live="polite">
    <div class="title">Data de hoje</div>

    <div class="date">
      <div class="day" id="day">--</div>
      <div>
        <div class="month" id="month">Carregando</div>
        <div class="small" id="weekday">--</div>
      </div>
    </div>

    <div class="meta" id="time-desc">Atualizado automaticamente.</div>
  </main>

  <script>
    const meses = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
    const diasSemana = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];

    function atualizarData(){
      const agora = new Date();
      const dia = agora.getDate();
      const mes = agora.getMonth();
      const diaSemana = agora.getDay();

      document.getElementById('day').textContent = dia;
      document.getElementById('month').textContent = meses[mes];
      document.getElementById('weekday').textContent = diasSemana[diaSemana];

      const hh = String(agora.getHours()).padStart(2,'0');
      const mm = String(agora.getMinutes()).padStart(2,'0');
      document.getElementById('time-desc').textContent = `Última atualização: ${hh}:${mm}`;
    }

    atualizarData();
    setInterval(atualizarData, 60000);
  </script>
</body>
</html>
