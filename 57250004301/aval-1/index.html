<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>listaUI</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <div class="container">
                            <h1>listaUI</h1>

                                    <div class="section">
                                                <h2>Adicionar Produto</h2>

                                                            <div class="input-group">
                                                                            <label for="nome">Nome do produto</label>
                                                                                            <input type="text" id="nome" placeholder="Ex: Arroz">
                                                                                                        </div>

                                                                                                                    <div class="input-group">
                                                                                                                                    <label for="preco">Preço</label>
                                                                                                                                                    <input type="text" id="preco" placeholder="Ex: 10,00">
                                                                                                                                                                </div>

                                                                                                                                                                            <button>Adicionar</button>
                                                                                                                                                                                        <button>Limpar</button>
                                                                                                                                                                                                </div>

                                                                                                                                                                                                        <div class="section">
                                                                                                                                                                                                                    <h2>Minha Lista</h2>
                                                                                                                                                                                                                                <ul class="lista-produtos">
                                                                                                                                                                                                                                                <li class="item-produto">Arroz - R$ 10,00</li>
                                                                                                                                                                                                                                                                <li class="item-produto">Feijão - R$ 8,00</li>
                                                                                                                                                                                                                                                                                <li class="item-produto">Macarrão - R$ 5,00</li>
                                                                                                                                                                                                                                                                                            </ul>
                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                        </html>
