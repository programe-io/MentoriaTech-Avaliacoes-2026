<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>listaUI</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <div class="container">
                            <h1>listaUI</h1>

                                    <div class="section">
                                                <h2>Adicionar Produto</h2>

                                                            <div class="input-group">
                                                                            <label>Descrição</label>
                                                                                            <input type="text" id="nomeP" placeholder="Ex: Arroz">
                                                                                                        </div>

                                                                                                                    <div class="input-group">
                                                                                                                                    <label>Quantidade</label>
                                                                                                                                                    <input type="number" id="qtdP" placeholder="Ex: 2">
                                                                                                                                                                </div>

                                                                                                                                                                            <div class="input-group">
                                                                                                                                                                                            <label>Preço</label>
                                                                                                                                                                                                            <input type="number" id="precoP" placeholder="Ex: 10">
                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                    <button id="btAdd">Adicionar</button>
                                                                                                                                                                                                                                                <button id="btAtualizar">Atualizar</button>
                                                                                                                                                                                                                                                            <button id="btExcluir">Excluir</button>
                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                            <div class="section">
                                                                                                                                                                                                                                                                                        <h2>Minha Lista</h2>
                                                                                                                                                                                                                                                                                                    <ul id="listaProdutos"></ul>
                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                    </html>
