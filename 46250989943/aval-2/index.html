<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>POPPI! - Mini Feed</title>

    <link rel="stylesheet" href="style.css">

<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- CABEÇALHO -->
    <header>

        <div class="header-content">

            <h1>POPPI!</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Perfil</a>
                <a href="#">Explorar</a>
            </nav>

        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <!-- ÁREA DE NOVA PUBLICAÇÃO -->
        <section class="new-post">

            <div class="user">

                <div class="avatar">J</div>

                <div>
                    <strong>Jully</strong>
                    <span>O que você está pensando?</span>
                </div>

            </div>

            <button>Publicar +</button>

        </section>


        <!-- FEED DE PUBLICAÇÕES -->
        <section class="feed">

            <!-- PRIMEIRA POSTAGEM -->
            <article class="post">

                <div class="post-header">

                    <div class="user">

                        <div class="avatar">M</div>

                        <div>
                            <strong>Mariana</strong>
                            <span>Há 10 minutos</span>
                        </div>

                    </div>

                </div>

                <div class="post-text">

                    <p>
                        Simplesmente apaixonada por essa estética!
                        💗✨ O Y2K nunca sai de moda!
                    </p>

                </div>

                <img
                    src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=900"
                    alt="Flores coloridas em um jardim">

                <div class="post-actions">

                    <button>♡ Curtir</button>
                    <button>✧ Comentar</button>

                </div>

            </article>


            <!-- SEGUNDA POSTAGEM -->
            <article class="post">

                <div class="post-header">

                    <div class="user">

                        <div class="avatar">L</div>

                        <div>
                            <strong>Laura</strong>
                            <span>Há 30 minutos</span>
                        </div>

                    </div>

                </div>

                <div class="post-text">

                    <p>
                        Um pouquinho de natureza para deixar
                        o dia mais bonito! 🌿🦋
                    </p>

                </div>

                <img
                    src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900"
                    alt="Paisagem natural com vegetação e luz do sol">

                <div class="post-actions">

                    <button>♡ Curtir</button>
                    <button>✧ Comentar</button>

                </div>

            </article>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer>

        <p>© 2026 POPPI! — Your little digital world ♡</p>

    </footer>

</body>

</html>
