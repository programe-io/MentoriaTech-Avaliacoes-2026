
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mini Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="feed">
        <h2>🌐 Meu Mini Feed</h2>

        <section class="criar-post">
            <textarea id="mensagem"
                placeholder="O que você está pensando?"></textarea>

            <button class="publicar" id="btnPublicar">
                Publicar
            </button>
        </section>

        <section id="lista-posts">
            <article class="post">
                <div class="cabecalho">
                    <span class="autor">Maria Silva</span>
                    <span class="data">Agora</span>
                </div>

                <p class="texto">
                    Olá, pessoal! Bem-vindos ao meu mini feed! 👋
                </p>

                <button class="curtir">
                    ❤️ Curtir <span>0</span>
                </button>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
