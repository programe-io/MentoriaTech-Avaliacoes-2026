<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h2>MiniFeed</h2>

        <nav>
            <a href="#">Inicio</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main>

        <!-- Área de publicação -->
        <section class="publicar">

            <div class="avatar">J</div>

            <div class="usuario">
                <strong>Jonathan</strong>
                <p>O que você esta pensando?</p>
            </div>

            <button>Publicar</button>

        </section>

        <!-- Postagem -->
        <section class="post">

            <div class="post-header">

                <div class="avatar">M</div>

                <div class="usuario">
                    <strong>Maria</strong>
                    <p>Há 10 minutos</p>
                </div>

            </div>

            <p class="post-texto">
                joguei free fire hj
            </p>

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYwMZte_1IJQ9tlxLPYDnRL6WNc22n9S9enKQg4eYpYQ&s" alt="jogando ff">

            <div class="acoes">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>

        </section>

    </main>
