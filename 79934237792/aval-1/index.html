<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #050505;
        color: white;
    }

    header {
        height: 90vh;
        background:
            linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.8)),
            url("https://images.unsplash.com/photo-1531259683007-016a7b628fc3?auto=format&fit=crop&w=1600&q=80")
            center/cover;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .hero {
        max-width: 800px;
        padding: 30px;
    }

    .hero h1 {
        font-size: 80px;
        color: #e50914;
        text-shadow: 4px 4px 0 #111;
        text-transform: uppercase;
    }

    .hero p {
        font-size: 22px;
        margin: 20px 0;
    }

    .btn {
        display: inline-block;
        padding: 15px 30px;
        background: #e50914;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        transition: .3s;
    }

    .btn:hover {
        background: #b00008;
        transform: scale(1.05);
    }

    nav {
        position: absolute;
        top: 0;
        width: 100%;
        padding: 25px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,.65);
    }

    nav h2 {
        color: #e50914;
        font-size: 28px;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-left: 25px;
    }

    nav a:hover {
        color: #e50914;
    }

    section {
        padding: 70px 8%;
    }

    section h2 {
        text-align: center;
        font-size: 40px;
        margin-bottom: 40px;
        color: #e50914;
    }

    .sobre {
        display: flex;
        gap: 40px;
        align-items: center;
        max-width: 1100px;
        margin: auto;
    }

    .sobre img {
        width: 45%;
        border-radius: 15px;
        box-shadow: 0 0 25px rgba(229,9,20,.5);
    }

    .sobre p {
        font-size: 18px;
        line-height: 1.8;
        color: #ddd;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
    }

    .card {
        background: #151515;
        border: 2px solid #e50914;
        border-radius: 15px;
        overflow: hidden;
        transition: .3s;
    }

    .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 30px rgba(229,9,20,.4);
    }

    .card img {
        width: 100%;
        height: 280px;
        object-fit: cover;
    }

    .card-content {
        padding: 20px;
    }

    .card h3 {
        color: #e50914;
        margin-bottom: 10px;
    }

    .card p {
        color: #ccc;
        line-height: 1.5;
    }

    footer {
        background: #e50914;
        text-align: center;
        padding: 25px;
        font-weight: bold;
    }

    @media (max-width: 800px) {
        .hero h1 {
            font-size: 50px;
        }

        .sobre {
            flex-direction: column;
        }

        .sobre img {
            width: 100%;
        }

        .cards {
            grid-template-columns: 1fr;
        }

        nav {
            flex-direction: column;
            gap: 10px;
        }
    }
</style>

  <script src="script.js"></script>
  
</body>
</html>
