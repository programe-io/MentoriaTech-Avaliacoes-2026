
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram - Lara</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="min-h-screen bg-gray-100 text-slate-900">

    <!-- CABEÇALHO -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">

        <div class="max-w-5xl mx-auto px-4">

            <div class="flex items-center justify-between h-14">

                <!-- Logo -->
                <h1 class="text-xl font-semibold">
                    Instagram
                </h1>

                <!-- Botão de menu -->
                <button class="text-2xl" aria-label="Abrir menu">
                    <i class="bx bx-menu"></i>
                </button>

            </div>

        </div>

    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-5xl mx-auto px-4 py-4 pb-20">

        <div class="flex gap-8">

            <!-- FEED PRINCIPAL -->
            <div class="flex-1 max-w-lg mx-auto w-full">

                <!-- SEÇÃO DE STORIES -->
                <section class="bg-white border border-gray-200 rounded-lg p-4 mb-4">

                    <div class="flex gap-4 overflow-x-auto">

                        <!-- ADICIONAR STORY -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gray-100">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">

                                        <span class="text-2xl text-gray-500">+</span>

                                    </div>

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                Seu story
                            </span>

                        </div>

                        <!-- STORY JOÃO -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=12"
                                        alt="Foto de perfil de João"
                                        class="w-full h-full object-cover rounded-full"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                João
                            </span>

                        </div>

                        <!-- STORY MARIA -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=47"
                                        alt="Foto de perfil de Maria"
                                        class="w-full h-full object-cover rounded-full"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                Maria
                            </span>

                        </div>

                        <!-- STORY PEDRO -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=11"
                                        alt="Foto de perfil de Pedro"
                                        class="w-full h-full object-cover rounded-full"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                Pedro
                            </span>

                        </div>

                        <!-- STORY ANA -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=44"
                                        alt="Foto de perfil de Ana"
                                        class="w-full h-full object-cover rounded-full"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                Ana
                            </span>

                        </div>

                        <!-- STORY CARLOS -->
                        <div class="flex flex-col items-center flex-shrink-0">

                            <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-1">

                                    <img
                                        src="https://i.pravatar.cc/150?img=13"
                                        alt="Foto de perfil de Carlos"
                                        class="w-full h-full object-cover rounded-full"
                                    >

                                </div>

                            </div>

                            <span class="text-xs mt-1 w-16 text-center">
                                Carlos
                            </span>

                        </div>

                    </div>

                </section>

                <!-- FEED DE POSTAGENS -->

                <article class="bg-white border border-gray-200 rounded-lg mb-4">

                    <!-- CABEÇALHO DA POSTAGEM -->
                    <header class="flex items-center justify-between p-3">

                        <div class="flex items-center gap-3">

                            <!-- FOTO DO PERFIL -->
                            <div class="w-10 h-10 rounded-full p-0.5 bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500">

                                <div class="w-full h-full rounded-full bg-white p-0.5">

                                    <img
                                        src="https://i.pravatar.cc/150?img=12"
                                        alt="Foto do perfil de João"
                                        class="w-full h-full object-cover rounded-full"
                                    >

                                </div>

                            </div>

                            <!-- NOME DO USUÁRIO -->
                            <div>
                                <h2 class="text-sm font-semibold">
                                    joao.oficial
                                </h2>

                                <p class="text-xs text-gray-500">
                                    São Paulo, Brasil
                                </p>
                            </div>

                        </div>

                        <!-- MENU DA POSTAGEM -->
                        <button class="text-xl" aria-label="Opções da postagem">
                            <i class="bx bx-dots-horizontal-rounded"></i>
                        </button>

                    </header>

                    <!-- IMAGEM DA POSTAGEM -->
                    <img
                        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800"
                        alt="Paisagem de natureza"
                        class="w-full object-cover"
                    >

                    <!-- AÇÕES DA POSTAGEM -->
                    <div class="p-3">

                        <div class="flex items-center justify-between text-2xl">

                            <div class="flex gap-4">

                                <button aria-label="Curtir">
                                    <i class="bx bx-heart"></i>
                                </button>

                                <button aria-label="Comentar">
                                    <i class="bx bx-message-rounded"></i>
                                </button>

                                <button aria-label="Compartilhar">
                                    <i class="bx bx-send"></i>
                                </button>

                            </div>

                            <button aria-label="Salvar postagem">
                                <i class="bx bx-bookmark"></i>
                            </button>

                        </div>

                        <!-- LEGENDA -->
                        <p class="text-sm mt-3">
                            <strong>joao.oficial</strong>
                            Aproveitando os melhores momentos da vida! 🌎❤️
                        </p>

                        <p class="text-xs text-gray-500 mt-2">
                            Ver todos os comentários
                        </p>

                        <p class="text-xs text-gray-400 mt-2">
                            HÁ 2 HORAS
                        </p>

                    </div>

                </article>

            </div>

        </div>

    </main>

</body>
</html>
