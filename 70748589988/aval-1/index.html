<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Controle de Estoque</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="container">
    <h1>📦 Controle de Estoque</h1>

    <div id="mensagem" class="alert"></div>

    <!-- FORMULÁRIO DE CADASTRO -->
    <section class="card">
      <h2>Cadastrar Novo Produto</h2>
      <form id="form-produto">
        <div class="input-group">
          <label for="codigo">Código</label>
          <input type="text" id="codigo" placeholder="Ex: P001" required>
        </div>

        <div class="input-group">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Teclado Mecânico" required>
        </div>

        <div class="input-group">
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" min="0" placeholder="Ex: 10" required>
        </div>

        <div class="input-group">
          <label for="valor">Valor (R$)</label>
          <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 150.00" required>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
      </form>
    </section>

    <!-- TABELA DE EXIBIÇÃO -->
    <section class="card">
      <h2>Produtos Cadastrados</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Descrição</th>
              <th>Quantidade</th>
              <th>Valor Unitário</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo"></tbody>
        </table>
        <p id="estoque-vazio" class="empty-msg">Nenhum produto cadastrado no estoque.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
