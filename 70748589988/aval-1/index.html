<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Estoque</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="container">
    <header class="header">
      <div>
        <h1>📦 Sistema de Estoque</h1>
        <p class="subtitle">Gerenciamento dinâmico de produtos e inventário</p>
      </div>
      <div class="stats">
        <div class="stat-card">
          <span class="stat-title">Produtos</span>
          <span id="total-produtos" class="stat-val">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">Itens em Estoque</span>
          <span id="total-itens" class="stat-val accent">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">Valor Total</span>
          <span id="valor-total" class="stat-val success">R$ 0,00</span>
        </div>
      </div>
    </header>

    <div id="mensagem" class="alert"></div>

    <!-- FORMULÁRIO DE CADASTRO -->
    <section class="card">
      <h2>Cadastrar Novo Produto</h2>
      <form id="form-produto">
        <div class="input-group">
          <label for="codigo">Código do Produto</label>
          <input type="text" id="codigo" placeholder="Ex: PROD-101" required>
        </div>

        <div class="input-group">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Monitor Full HD 24''" required>
        </div>

        <div class="input-group">
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" min="0" placeholder="Ex: 15" required>
        </div>

        <div class="input-group">
          <label for="valor">Valor Unitário (R$)</label>
          <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 850.00" required>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
      </form>
    </section>

    <!-- LISTAGEM DE PRODUTOS -->
    <section class="card">
      <h2>Produtos em Estoque</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Descrição</th>
              <th>Quantidade</th>
              <th>Valor Unitário</th>
              <th>Valor Total</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo"></tbody>
        </table>
        <p id="estoque-vazio" class="empty-msg">Nenhum produto cadastrado no estoque.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
