<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster - Gestão de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="app-layout">
    <!-- CABEÇALHO COM MÉTRICAS -->
    <header class="app-header">
      <div>
        <h1>⚡ TaskMaster</h1>
        <p class="subtitle">Gerenciador dinâmico de tarefas</p>
      </div>

      <div class="stats-container">
        <div class="stat-card">
          <span class="stat-label">Total</span>
          <span id="stat-total" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Pendentes</span>
          <span id="stat-pendentes" class="stat-value warning">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Concluídas</span>
          <span id="stat-concluidas" class="stat-value success">0</span>
        </div>
      </div>
    </header>

    <!-- PAINEL NOTIFICAÇÃO -->
    <div id="toast-mensagem" class="toast"></div>

    <div class="main-grid">
      <!-- FORMULÁRIO DE CADASTRO -->
      <aside class="panel-card">
        <h2>Nova Tarefa</h2>
        <form id="form-tarefa" novalidate>
          <div class="field-group">
            <label for="codigo">Código do Item</label>
            <input type="text" id="codigo" placeholder="Ex: TSK-101" required>
          </div>

          <div class="field-group">
            <label for="titulo">Título da Tarefa</label>
            <input type="text" id="titulo" placeholder="Mínimo 5 caracteres..." required>
            <small class="field-hint">Mínimo de 5 caracteres</small>
          </div>

          <div class="field-group">
            <label for="prioridade">Nível de Prioridade</label>
            <select id="prioridade" required>
              <option value="">Selecione a prioridade...</option>
              <option value="1">1 - Prioridade Alta</option>
              <option value="2">2 - Prioridade Média</option>
              <option value="3">3 - Prioridade Baixa</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary">Adicionar à Lista</button>
        </form>
      </aside>

      <!-- PAINEL DE LISTAGEM -->
      <section class="panel-card">
        <h2>Painel de Tarefas</h2>
        
        <div class="table-responsive">
          <table class="task-table">
            <thead>
              <tr>
                <th>Código</th>
                <th>Descrição / Título</th>
                <th>Prioridade</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
          </table>
          
          <div id="lista-vazia" class="empty-state">
            <div class="empty-icon">📂</div>
            <p>Nenhuma tarefa registrada no momento.</p>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
