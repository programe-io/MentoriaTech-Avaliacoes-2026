<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="container">
    <header class="header">
      <h1>📋 Gerenciador de Tarefas</h1>
      <div class="stats">
        <span class="stat-badge">Total: <strong id="total-tarefas">0</strong></span>
        <span class="stat-badge stat-pending">Pendentes: <strong id="pendentes-tarefas">0</strong></span>
        <span class="stat-badge stat-done">Concluídas: <strong id="concluidas-tarefas">0</strong></span>
      </div>
    </header>

    <div id="mensagem" class="alert"></div>

    <!-- FORMULÁRIO DE CADASTRO -->
    <section class="card">
      <h2>Cadastrar Nova Tarefa</h2>
      <form id="form-tarefa">
        <div class="input-group">
          <label for="codigo">Código</label>
          <input type="text" id="codigo" placeholder="Ex: T001" required>
        </div>

        <div class="input-group">
          <label for="titulo">Título (Mín. 5 caracteres)</label>
          <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript" required>
        </div>

        <div class="input-group">
          <label for="prioridade">Prioridade</label>
          <select id="prioridade" required>
            <option value="">Selecione...</option>
            <option value="1">1 - Alta</option>
            <option value="2">2 - Média</option>
            <option value="3">3 - Baixa</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar Tarefa</button>
      </form>
    </section>

    <!-- LISTAGEM DE TAREFAS -->
    <section class="card">
      <h2>Lista de Tarefas</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Título</th>
              <th>Prioridade</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo"></tbody>
        </table>
        <p id="lista-vazia" class="empty-msg">Nenhuma tarefa cadastrada.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
