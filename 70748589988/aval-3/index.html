<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renderização de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="card-container">
        <header class="card-header">
            <h1>Lista de tarefas diárias</h1>
            <p>Gerenciamento dinâmico em JavaScript</p>
        </header>

        <form id="form-tarefa" class="form-tarefa">
            <input type="text" id="input-titulo" placeholder="Digite o título da tarefa..." autocomplete="off" />
            <button type="submit">adicionar</button>
        </form>

        <ul id="lista-tarefas" class="lista-tarefas"></ul>
    </main>

    <script src="app.js" defer></script>
<script src="script.js"></script></body>
</html>
