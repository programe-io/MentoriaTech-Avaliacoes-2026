
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Controle de Estoque</title>
  <!-- Importando o arquivo CSS -->
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">
  <h1>📦 Controle de Estoque</h1>

  <!-- Área para exibir os erros lançados pelo throw new Error -->
  <div id="caixaErro" class="mensagem-erro"></div>

  <!-- Formulário de Cadastro -->
  <h2>Cadastrar Novo Produto</h2>
  <div class="form-group">
    <input type="text" id="descricao" placeholder="Descrição (mín. 5 letras)">
    <input type="number" id="quantidade" placeholder="Quantidade (mín. 1)">
    <input type="number" id="valor" step="0.01" placeholder="Valor (R$)">
    <button onclick="acaoCadastrar()">Cadastrar</button>
  </div>

  <!-- Tabela de Listagem -->
  <h2>Produtos Cadastrados</h2>
  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Descrição</th>
        <th>Quantidade</th>
        <th>Valor Unitário</th>
        <th>Ações (Atualizar)</th>
      </tr>
    </thead>
    <tbody id="tabelaProdutos">
      <!-- Os produtos serão inseridos aqui pelo JavaScript -->
    </tbody>
  </table>
</div>

<!-- Importando o arquivo JavaScript -->
<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
