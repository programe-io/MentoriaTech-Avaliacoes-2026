<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <h1>📋 Gerenciador de Tarefas</h1>

    <!-- Cadastro -->
    <section class="card">
      <h2>Cadastrar Tarefa</h2>
      <input type="text" id="inputTitulo" placeholder="Título (mín. 5 caracteres)" />
      <input type="number" id="inputPrioridade" placeholder="Prioridade (1 a 3)" min="1" max="3" />
      <button id="btnCadastrar">Cadastrar</button>
      <p id="msgCadastro" class="mensagem"></p>
    </section>

    <!-- Listagem -->
    <section class="card">
      <h2>Tarefas Cadastradas</h2>
      <button id="btnListar">Listar Tarefas</button>
      <ul id="listaTarefas"></ul>
    </section>

    <!-- Concluir -->
    <section class="card">
      <h2>Concluir Tarefa</h2>
      <input type="number" id="inputCodigoConcluir" placeholder="Código da tarefa" />
      <button id="btnConcluir">Concluir</button>
      <p id="msgConcluir" class="mensagem"></p>
    </section>

    <!-- Alterar Prioridade -->
    <section class="card">
      <h2>Alterar Prioridade</h2>
      <input type="number" id="inputCodigoPrioridade" placeholder="Código da tarefa" />
      <input type="number" id="inputNovaPrioridade" placeholder="Nova prioridade (1 a 3)" min="1" max="3" />
      <button id="btnAlterarPrioridade">Alterar</button>
      <p id="msgPrioridade" class="mensagem"></p>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
