
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora GSM</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Calculadora GSM</h1>
        <p>Calculadora de Gramatura de Materiais</p>

        <div class="campo">
            <label>Peso da amostra (gramas)</label>
            <input type="number" id="peso" placeholder="Ex: 5">
        </div>

        <div class="campo">
            <label>Largura (cm)</label>
            <input type="number" id="largura" placeholder="Ex: 10">
        </div>

        <div class="campo">
            <label>Comprimento (cm)</label>
            <input type="number" id="comprimento" placeholder="Ex: 10">
        </div>

        <button onclick="calcularGSM()">Calcular GSM</button>

        <div class="resultado">
            <h3>Resultado:</h3>
            <span id="resultado">0 GSM</span>
        </div>
    </div>

    <script>
        function calcularGSM() {
            let peso = parseFloat(document.getElementById("peso").value);
            let largura = parseFloat(document.getElementById("largura").value);
            let comprimento = parseFloat(document.getElementById("comprimento").value);

            if (peso <= 0 || largura <= 0 || comprimento <= 0 ||
                isNaN(peso) || isNaN(largura) || isNaN(comprimento)) {
                alert("Informe valores válidos!");
                return;
            }

            let area = (largura * comprimento) / 10000;
            let gsm = peso / area;

            document.getElementById("resultado").innerText =
                gsm.toFixed(2) + " GSM";
        }
    </script>

<script src="script.js"></script></body>
</html>
