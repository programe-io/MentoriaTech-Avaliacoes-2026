<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação de Classes e Estilos via JS</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="card" id="meuCard">
        <h1 id="tituloCard">Exemplo Prático</h1>
        <p>Este card muda de aparência dinamicamente usando JavaScript para alterar suas classes CSS e propriedades de estilo inline.</p>
        
        <div class="botoes-container">
            <!-- Botões para manipular Classes -->
            <button id="btnAlternarTema" class="btn">Alternar Tema Escuro</button>
            <button id="btnDestacar" class="btn">Destacar Borda</button>
            
            <!-- Botão para manipular Estilos Inline -->
            <button id="btnAumentarFonte" class="btn">Aumentar Fonte (Style Inline)</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
