<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo da Velha</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main class="container">
        <h1>Jogo da Velha</h1>

        <p id="mensagem">Vez do jogador X</p>

        <section class="tabuleiro" aria-label="Tabuleiro do jogo da velha">
            <button class="celula" data-indice="0" aria-label="Célula 1"></button>
            <button class="celula" data-indice="1" aria-label="Célula 2"></button>
            <button class="celula" data-indice="2" aria-label="Célula 3"></button>
            <button class="celula" data-indice="3" aria-label="Célula 4"></button>
            <button class="celula" data-indice="4" aria-label="Célula 5"></button>
            <button class="celula" data-indice="5" aria-label="Célula 6"></button>
            <button class="celula" data-indice="6" aria-label="Célula 7"></button>
            <button class="celula" data-indice="7" aria-label="Célula 8"></button>
            <button class="celula" data-indice="8" aria-label="Célula 9"></button>
        </section>

        <button id="reiniciar">Reiniciar jogo</button>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
