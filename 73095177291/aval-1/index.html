
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
<link href="style.css" rel="stylesheet"></head>
<body>

    <h1>Cadastro de Produtos</h1>

    <div class="formulario">
        <input type="text" id="descricao" placeholder="Descrição do produto">
        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="number" id="valor" placeholder="Valor">

        <button onclick="cadastrar()">Cadastrar Produto</button>
    </div>

    <h2>Atualizar Produto</h2>

    <input type="number" id="codigo" placeholder="Código do produto">
    <input type="number" id="novoValor" placeholder="Novo valor">
    <button onclick="atualizarPreco()">Atualizar Valor</button>

    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">
    <button onclick="atualizarEstoque()">Atualizar Quantidade</button>

    <h2>Lista de Produtos</h2>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
            </tr>
        </thead>

        <tbody id="listaProdutos"></tbody>
    </table>

<script src="script.js"></script></body>
</html>
