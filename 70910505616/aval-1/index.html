<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 90px; }
        button { margin-top: 5px; margin-right: 5px; padding: 5px 10px; cursor: pointer; }
        #listaEstoque { margin-top: 20px; white-space: pre-line; background: #f4f4f4; padding: 10px; border-radius: 5px; }
    </style>
<link href="style.css" rel="stylesheet"></head>
<body>

    <h2>Desafio Geral - Sistema de Estoque</h2>

    <!-- Campos para cadastro e alteração -->
    <div class="form-group">
        <label>Código:</label>
        <input type="number" id="codigo">
    </div>
    <div class="form-group">
        <label>Descrição:</label>
        <input type="text" id="descricao">
    </div>
    <div class="form-group">
        <label>Quantidade:</label>
        <input type="number" id="quantidade">
    </div>
    <div class="form-group">
        <label>Valor (R$):</label>
        <input type="number" step="0.01" id="valor">
    </div>

    <!-- Botões de Ação -->
    <button onclick="executarCadastro()">Cadastrar Produto</button>
    <button onclick="listarProdutos()">Listar Produtos</button>
    <button onclick="executarAlterarValor()">Alterar Valor</button>
    <button onclick="executarAlterarQuantidade()">Alterar Quantidade</button>

    <h3>Produtos Cadastrados:</h3>
    <div id="listaEstoque">Nenhum produto listado ainda.</div>

    <!-- Vínculo com o arquivo JavaScript -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
