<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eef0f4;
            color: #222;
            padding: 20px 10px;
        }

        /* Contentor principal estilo feed */
        .feed-container {
            max-width: 680px;
            margin: 0 auto;
            background-color: #f7f8fa;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Cabeçalho superior */
        .topbar {
            background-color: #ffffff;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            color: #4a35d8;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links a {
            color: #374151;
            text-decoration: none;
            margin-left: 18px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: #4a35d8;
        }

        /* Área de criação de publicação */
        .nova-publicacao {
            background-color: #f3f4f6;
            padding: 20px 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .post-form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #2944c6;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .autor-meta {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .autor-nome {
            font-weight: bold;
            font-size: 0.95rem;
            color: #1f2937;
        }

        .input-pensamento {
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 3px;
            outline: none;
            width: 100%;
        }

        .btn-roxo {
            background-color: #4a35d8;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 9px 18px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-roxo:hover {
            background-color: #3825b8;
        }

        /* Cartão de publicação */
        .post-card {
            background-color: #ffffff;
            margin: 18px 20px;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .tempo-post {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 2px;
        }

        .post-texto {
            font-size: 0.98rem;
            color: #1f2937;
            margin-bottom: 16px;
        }

        /* Moldura da imagem da publicação */
        .post-midia {
            width: 100%;
            max-width: 460px;
            margin: 0 auto 18px auto;
            background-color: #050505;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 360px;
        }

        .post-midia img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Botões Curtir e Comentar */
        .post-acoes {
            display: flex;
            gap: 10px;
        }

        .btn-acao {
            background-color: #4a35d8;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-acao:hover {
            background-color: #3825b8;
        }

        .btn-acao.curtido {
            background-color: #25188a;
        }

        /* Rodapé */
        .footer-bar {
            background-color: #9ca3af;
            color: #1f2937;
            text-align: center;
            padding: 14px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 24px;
        }

        @media (max-width: 520px) {
            .post-form-row {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-roxo {
                width: 100%;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="feed-container">
        <!-- Cabeçalho -->
        <header class="topbar">
            <a href="#" class="logo">MiniFeed</a>
            <nav class="nav-links">
                <a href="#">Início</a>
                <a href="#">Perfil</a>
            </nav>
        </header>

        <!-- Caixa de nova publicação -->
        <section class="nova-publicacao">
            <div class="post-form-row">
                <div class="user-info">
                    <div class="avatar">J</div>
                    <div class="autor-meta">
                        <span class="autor-nome">Jonathan</span>
                        <input type="text" class="input-pensamento" placeholder="O que você está pensando?">
                    </div>
                </div>
                <button type="button" class="btn-roxo" onclick="alert('Publicação enviada no modelo!')">Publicar</button>
            </div>
        </section>

        <!-- Publicação no feed -->
        <article class="post-card">
            <div class="post-header">
                <div class="avatar">M</div>
                <div class="autor-meta">
                    <span class="autor-nome">Maria</span>
                    <span class="tempo-post">Há 10 minutos</span>
                </div>
            </div>

            <p class="post-texto">Hoje eu vi o novo filme do homiranha, top, to feliz :D</p>

            <div class="post-midia">
                <!-- Substitui o src abaixo pelo caminho da imagem que quiseres usar -->
                <img src="homiranha.jpg" alt="Imagem da publicação">
            </div>

            <div class="post-acoes">
                <button type="button" class="btn-acao" id="btnCurtir" onclick="toggleCurtir()">Curtir</button>
                <button type="button" class="btn-acao" onclick="alert('Área de comentários!')">Comentar</button>
            </div>
        </article>

        <!-- Rodapé -->
        <footer class="footer-bar">
            MiniFeed - Todos os Direitos Reservados
        </footer>
    </div>

    <script>
        let curtido = false;
        function toggleCurtir() {
            const btn = document.getElementById("btnCurtir");
            curtido = !curtido;
            if (curtido) {
                btn.textContent = "Curtido (1)";
                btn.classList.add("curtido");
            } else {
                btn.textContent = "Curtir";
                btn.classList.remove("curtido");
            }
        }
    </script>

</body>
</html>
