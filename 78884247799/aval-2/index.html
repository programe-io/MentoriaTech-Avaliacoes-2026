<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div style="text-align:center;margin-bottom:10px;">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="170" height="170" role="img" aria-label="Estudante levantando um troféu">
    <!-- brilho de fundo -->
    <circle cx="100" cy="100" r="92" fill="#415a77" stroke="#f77f00" stroke-width="4"/>

    <!-- troféu -->
    <path d="M78 14 H122 V40 Q122 60 100 62 Q78 60 78 40 Z" fill="#ffd166" stroke="#c98a00" stroke-width="3"/>
    <path d="M78 22 Q62 22 64 38 Q66 48 80 48" fill="none" stroke="#c98a00" stroke-width="4"/>
    <path d="M122 22 Q138 22 136 38 Q134 48 120 48" fill="none" stroke="#c98a00" stroke-width="4"/>
    <rect x="95" y="62" width="10" height="10" fill="#c98a00"/>
    <rect x="80" y="72" width="40" height="8" rx="2" fill="#ffd166" stroke="#c98a00" stroke-width="3"/>

    <!-- braços levantados -->
    <polyline points="82,126 76,102 85,82" fill="none" stroke="#f1c27d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="118,126 124,102 115,82" fill="none" stroke="#f1c27d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- pernas -->
    <line x1="92" y1="160" x2="90" y2="188" stroke="#1b263b" stroke-width="12" stroke-linecap="round"/>
    <line x1="108" y1="160" x2="110" y2="188" stroke="#1b263b" stroke-width="12" stroke-linecap="round"/>

    <!-- corpo (camisa laranja) -->
    <rect x="78" y="116" width="44" height="50" rx="10" fill="#f77f00" stroke="#a84f00" stroke-width="3"/>

    <!-- cabeça -->
    <circle cx="100" cy="100" r="15" fill="#f1c27d" stroke="#c9985a" stroke-width="2"/>
    <path d="M85 98 Q86 82 100 82 Q114 82 115 98 Q108 90 100 90 Q92 90 85 98 Z" fill="#2b1b0e"/>

    <!-- rosto feliz -->
    <circle cx="94" cy="102" r="2" fill="#1a1a1a"/>
    <circle cx="106" cy="102" r="2" fill="#1a1a1a"/>
    <path d="M93 108 Q100 115 107 108" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  </svg>
</div>
  <script src="script.js"></script>
  
</body>
</html>
