<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Tarefas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <main class="quadro">

    <header class="topo">
      <h1 class="titulo">Gerenciador de tarefas</h1>
      <p class="subtitulo">código · título · prioridade · status</p>
    </header>

    <nav class="abas" id="abas">
      <button class="aba ativa" data-aba="nova">Nova tarefa</button>
      <button class="aba" data-aba="lista">Tarefas <span id="contador" class="contador">0</span></button>
    </nav>

    <!-- ===== PAINEL: NOVA TAREFA ===== -->
    <section class="painel ativa" id="painel-nova">

      <form id="formTarefa" class="formulario" autocomplete="off">

        <div class="campo">
          <label for="titulo">Título da tarefa</label>
          <input type="text" id="titulo" placeholder="Mínimo de 5 caracteres" required>
          <span class="dica">O título precisa ter pelo menos 5 caracteres.</span>
        </div>

        <div class="campo">
          <label>Prioridade</label>
          <div class="chips" id="chipsPrioridade" role="radiogroup" aria-label="Prioridade da tarefa">
            <button type="button" class="chip chip-alta" data-valor="1">
              <span class="chip-marcador"></span> Alta
            </button>
            <button type="button" class="chip chip-media" data-valor="2">
              <span class="chip-marcador"></span> Média
            </button>
            <button type="button" class="chip chip-baixa" data-valor="3">
              <span class="chip-marcador"></span> Baixa
            </button>
          </div>
          <span class="dica">Escala de 1 (alta) a 3 (baixa).</span>
        </div>

        <button type="submit" class="botao botao-primario">Cadastrar tarefa</button>
      </form>

      <p class="aviso" id="aviso"></p>
    </section>

    <!-- ===== PAINEL: LISTA DE TAREFAS ===== -->
    <section class="painel" id="painel-lista">

      <div class="vazio" id="vazio">
        <p>Nenhuma tarefa cadastrada ainda.</p>
        <p class="vazio-sub">Use a aba "Nova tarefa" para começar sua lista.</p>
      </div>

      <ul class="lista-tarefas" id="listaTarefas"></ul>

    </section>

  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
