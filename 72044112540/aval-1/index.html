<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Estoque</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Controle de estoque</h1>

    <section class="painel">
      <h2>Cadastrar produto</h2>
      <form id="form-produto">
        <label>Código
          <input type="text" id="codigo" required>
        </label>
        <label>Descrição
          <input type="text" id="descricao" required>
        </label>
        <label>Quantidade
          <input type="number" id="quantidade" min="0" step="1" required>
        </label>
        <label>Valor (R$)
          <input type="number" id="valor" min="0" step="0.01" required>
        </label>
        <button type="submit">Cadastrar produto</button>
      </form>
      <p id="mensagem" role="status"></p>
    </section>

    <section class="painel">
      <h2>Produtos cadastrados</h2>
      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>Código</th><th>Descrição</th><th>Quantidade</th><th>Valor</th><th>Alterar</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <p id="vazio">Nenhum produto cadastrado. Use o formulário acima para começar.</p>
    </section>
  </main>
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
