<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Feed Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="app-bar">
      <span class="app-bar__mark">feed<span class="app-bar__mark-dot">.</span></span>
          <span class="app-bar__tag">mini social</span>
            </header>

              <main class="feed">

                  <!-- POST — Kilson -->
                      <article class="post" style="--ring-a:#E4145B; --ring-b:#1B1B1F;">
                            <div class="post__head">
                                    <div class="avatar-ring avatar-ring--initial">
                                              <span class="avatar avatar--initial">K</span>
                                                      </div>
                                                              <div class="post__who">
                                                                        <span class="post__name">Kelvison</span>
                                                                                  <span class="post__meta">@Kelvison &middot; 2 h</span>
                                                                                          </div>
                                                                                                  <button class="post__more" aria-label="Mais opções">&#8942;</button>
                                                                                                        </div>

                                                                                                              <p class="post__text">
                                                                                                                      Round 6 mexeu comigo de novo 🔺🔴⬛ — a tensão de cada episódio
                                                                                                                              é surreal, impossível parar de assistir. Quem mais tá
                                                                                                                                      maratonando?
                                                                                                                                            </p>

                                                                                                                                                  <div class="post__media">
                                                                                                                                                          <!-- Substitua o src abaixo pelo link do pôster de Round 6 (Squid Game) -->
                                                                                                                                                                  <img src="https://i.postimg.cc/fTJ4M7nR/5442347.jpg" alt="Pôster da série Round 6">
                                                                                                                                                                        </div>

                                                                                                                                                                              <div class="post__actions">
                                                                                                                                                                                      <button class="action action--like">
                                                                                                                                                                                                <span class="action__icon">&#9825;</span>
                                                                                                                                                                                                          <span class="action__count">245</span>
                                                                                                                                                                                                                  </button>
                                                                                                                                                                                                                          <button class="action">
                                                                                                                                                                                                                                    <span class="action__icon">&#9998;</span>
                                                                                                                                                                                                                                              <span class="action__count">20</span>
                                                                                                                                                                                                                                                      </button>
                                                                                                                                                                                                                                                              <button class="action">
                                                                                                                                                                                                                                                                        <span class="action__icon">&#8635;</span>
                                                                                                                                                                                                                                                                                  <span class="action__count">14</span>
                                                                                                                                                                                                                                                                                          </button>
                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                    </article>

                                                                                                                                                                                                                                                                                                      </main>

                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                      </html>
