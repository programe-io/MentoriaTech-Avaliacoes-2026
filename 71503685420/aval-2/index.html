
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas atividades de maneira simples!</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar nova tarefa</h2>

            <form id="formTarefa">
                <label for="titulo">Título da tarefa:</label>
                <input type="text" id="titulo"
                    placeholder="Digite o título da tarefa" required>

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade">
                    <option value="1">1 - Alta</option>
                    <option value="2" selected>2 - Média</option>
                    <option value="3">3 - Baixa</option>
                </select>

                <button type="submit">Cadastrar tarefa</button>
            </form>
        </section>

        <section class="lista">
            <h2>Tarefas cadastradas</h2>

            <p id="contador">Total de tarefas: 0</p>

            <div id="listaTarefas">
                <p>Nenhuma tarefa cadastrada.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Sistema de Gerenciamento de Tarefas</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
