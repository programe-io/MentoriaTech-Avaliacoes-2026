
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Escolar</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>📚 Biblioteca Escolar</h1>
    <p>Sistema de Cadastro e Gerenciamento de Livros</p>
</header>

<main>

    <section class="resumo">
        <div class="card">
            <h3>Total de livros</h3>
            <p id="totalLivros">0</p>
        </div>

        <div class="card">
            <h3>Disponíveis</h3>
            <p id="disponiveis">0</p>
        </div>

        <div class="card">
            <h3>Emprestados</h3>
            <p id="emprestados">0</p>
        </div>
    </section>

    <section class="painel">
        <h2>Cadastrar novo livro</h2>

        <form id="formLivro">

            <label for="titulo">Título do livro:</label>
            <input type="text" id="titulo"
                placeholder="Digite o título" required>

            <label for="autor">Autor:</label>
            <input type="text" id="autor"
                placeholder="Digite o autor" required>

            <label for="categoria">Categoria:</label>
            <select id="categoria" required>
                <option value="">Selecione</option>
                <option>Literatura</option>
                <option>História</option>
                <option>Matemática</option>
                <option>Ciências</option>
                <option>Geografia</option>
                <option>Informática</option>
                <option>Outros</option>
            </select>

            <label for="quantidade">Quantidade de exemplares:</label>
            <input type="number" id="quantidade"
                min="1" step="1" value="1" required>

            <button type="submit">Cadastrar livro</button>
        </form>
    </section>

    <section class="painel">
        <h2>Consultar biblioteca</h2>

        <input type="text" id="pesquisa"
            placeholder="Pesquisar por título ou autor...">

        <div id="listaLivros">
            <p>Nenhum livro cadastrado.</p>
        </div>
    </section>

</main>

<footer>
    <p>Biblioteca Escolar - Sistema de Gerenciamento</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
