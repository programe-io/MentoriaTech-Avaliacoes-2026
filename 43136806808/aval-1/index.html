<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="header">
        <div>
            <h1>📦 Sistema de Estoque</h1>
            <p>Controle seus produtos de forma simples</p>
        </div>
    </header>

    <main class="container">

        <!-- Dashboard -->
        <section class="dashboard">
            <div class="card">
                <span>Total de produtos</span>
                <strong id="totalProdutos">0</strong>
            </div>

            <div class="card">
                <span>Itens em estoque</span>
                <strong id="totalItens">0</strong>
            </div>

            <div class="card warning">
                <span>Estoque baixo</span>
                <strong id="estoqueBaixo">0</strong>
            </div>

            <div class="card danger">
                <span>Sem estoque</span>
                <strong id="semEstoque">0</strong>
            </div>
        </section>

        <!-- Cadastro -->
        <section class="form-section">
            <h2 id="formTitulo">Cadastrar produto</h2>

            <form id="produtoForm">

                <input type="hidden" id="produtoId">

                <div class="form-grid">

                    <div class="campo">
                        <label for="nome">Nome do produto</label>
                        <input
                            type="text"
                            id="nome"
                            placeholder="Ex.: Teclado"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="categoria">Categoria</label>
                        <input
                            type="text"
                            id="categoria"
                            placeholder="Ex.: Informática"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="quantidade">Quantidade</label>
                        <input
                            type="number"
                            id="quantidade"
                            min="0"
                            placeholder="0"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="minimo">Estoque mínimo</label>
                        <input
                            type="number"
                            id="minimo"
                            min="0"
                            value="5"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="preco">Preço</label>
                        <input
                            type="number"
                            id="preco"
                            min="0"
                            step="0.01"
                            placeholder="0,00"
                            required
                        >
                    </div>

                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn-primary" id="btnSalvar">
                        Cadastrar produto
                    </button>

                    <button
                        type="button"
                        class="btn-secondary hidden"
                        id="btnCancelar"
                    >
                        Cancelar
                    </button>
                </div>

            </form>
        </section>

        <!-- Lista -->
        <section class="table-section">

            <div class="table-header">
                <h2>Produtos</h2>

                <input
                    type="search"
                    id="busca"
                    placeholder="🔎 Buscar produto..."
                >
            </div>

            <div class="table-container">
                <table>

                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Produtos inseridos pelo JavaScript -->
                    </tbody>

                </table>
            </div>

            <div id="semProdutos" class="empty">
                Nenhum produto cadastrado.
            </div>

        </section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
