<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header class="header">
        <div class="header-content">
            <div>
                <h1>✓ Minhas Tarefas</h1>
                <p>Organize suas atividades de forma simples</p>
            </div>

            <div class="data-atual" id="dataAtual"></div>
        </div>
    </header>

    <main class="container">

        <!-- Estatísticas -->
        <section class="estatisticas">

            <div class="stat-card">
                <span>Total</span>
                <strong id="totalTarefas">0</strong>
            </div>

            <div class="stat-card">
                <span>Pendentes</span>
                <strong id="tarefasPendentes">0</strong>
            </div>

            <div class="stat-card concluida">
                <span>Concluídas</span>
                <strong id="tarefasConcluidas">0</strong>
            </div>

            <div class="stat-card atrasada">
                <span>Atrasadas</span>
                <strong id="tarefasAtrasadas">0</strong>
            </div>

        </section>

        <!-- Formulário -->
        <section class="form-card">

            <div class="section-title">
                <h2 id="tituloFormulario">Nova tarefa</h2>
            </div>

            <form id="tarefaForm">

                <input type="hidden" id="tarefaId">

                <div class="form-grid">

                    <div class="campo campo-titulo">
                        <label for="titulo">Título</label>

                        <input
                            type="text"
                            id="titulo"
                            placeholder="Ex.: Fazer relatório"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="categoria">Categoria</label>

                        <select id="categoria">
                            <option value="Trabalho">Trabalho</option>
                            <option value="Pessoal">Pessoal</option>
                            <option value="Estudos">Estudos</option>
                            <option value="Compras">Compras</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="prioridade">Prioridade</label>

                        <select id="prioridade">
                            <option value="baixa">Baixa</option>
                            <option value="media" selected>Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="prazo">Prazo</label>

                        <input
                            type="date"
                            id="prazo"
                        >
                    </div>

                </div>

                <div class="campo descricao">
                    <label for="descricao">Descrição</label>

                    <textarea
                        id="descricao"
                        rows="3"
                        placeholder="Adicione detalhes da tarefa..."
                    ></textarea>
                </div>

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="btnSalvar"
                    >
                        + Adicionar tarefa
                    </button>

                    <button
                        type="button"
                        class="btn btn-secondary hidden"
                        id="btnCancelar"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </section>

        <!-- Lista -->
        <section class="tarefas-section">

            <div class="lista-header">

                <h2>Lista de tarefas</h2>

                <div class="ferramentas">

                    <input
                        type="search"
                        id="busca"
                        placeholder="🔎 Buscar tarefa..."
                    >

                    <select id="filtroStatus">
                        <option value="todas">Todas</option>
                        <option value="pendentes">Pendentes</option>
                        <option value="concluidas">Concluídas</option>
                        <option value="atrasadas">Atrasadas</option>
                    </select>

                    <select id="filtroPrioridade">
                        <option value="todas">Todas as prioridades</option>
                        <option value="alta">Alta</option>
                        <option value="media">Média</option>
                        <option value="baixa">Baixa</option>
                    </select>

                </div>

            </div>

            <div id="listaTarefas" class="lista-tarefas"></div>

            <div id="listaVazia" class="lista-vazia">
                <div class="icone-vazio">✓</div>

                <h3>Nenhuma tarefa encontrada</h3>

                <p>
                    Adicione uma nova tarefa para começar.
                </p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
