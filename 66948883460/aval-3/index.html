
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        .selo {
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .normal {
            background: #c8f7c5;
            color: #176b20;
        }

        .sobrepeso {
            background: #fff0a6;
            color: #856404;
        }

        .obesidade {
            background: #ffcccc;
            color: #a00000;
        }

        .abaixo {
            background: #d6eaff;
            color: #07518a;
        }

        .excluir {
            background: #dc3545;
        }

        .excluir:hover {
            background: #a71d2a;
        }

        #erro {
            color: red;
            font-weight: bold;
        }

        .tabela-container {
            overflow-x: auto;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <main class="container">

        <h1>Ficha de Anamnese</h1>

        <form id="formPessoa">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="idade">Idade:</label>
            <input type="number" id="idade" placeholder="Digite sua idade">

            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" step="0.01" placeholder="Ex: 1.70">

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1" placeholder="Ex: 65">

            <p id="erro" hidden></p>

            <button type="submit">Salvar Pessoa</button>

        </form>

        <h2>Pessoas cadastradas</h2>

        <div class="tabela-container">

            <table>

                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Altura</th>
                        <th>Peso</th>
                        <th>IMC</th>
                        <th>Classificação</th>
                        <th>Ação</th>
                    </tr>
                </thead>

                <tbody id="tabelaPessoas"></tbody>

            </table>

        </div>

    </main>

    <script>

        // =================================
        // REFERÊNCIAS DO HTML
        // =================================

        const formPessoa = document.getElementById("formPessoa");

        const inputNome = document.getElementById("nome");
        const inputIdade = document.getElementById("idade");
        const inputAltura = document.getElementById("altura");
        const inputPeso = document.getElementById("peso");

        const tabelaPessoas = document.getElementById("tabelaPessoas");

        const mensagemDeErro = document.getElementById("erro");


        // =================================
        // VARIÁVEIS
        // =================================

        const chavePessoas = "pessoas";

        let pessoas = [];

        let proximoId = 0;


        // =================================
        // CALCULAR IMC
        // =================================

        function calcularIMC(peso, altura) {

            return peso / (altura * altura);

        }


        // =================================
        // CLASSIFICAR IMC
        // =================================

        function classificarIMC(imc) {

            if (imc < 18.5) {

                return {
                    texto: "Abaixo do peso",
                    classe: "abaixo"
                };

            } else if (imc < 25) {

                return {
                    texto: "Peso normal",
                    classe: "normal"
                };

            } else if (imc < 30) {

                return {
                    texto: "Sobrepeso",
                    classe: "sobrepeso"
                };

            } else {

                return {
                    texto: "Obesidade",
                    classe: "obesidade"
                };

            }

        }


        // =================================
        // FORMATAR NÚMEROS
        // =================================

        function formatar(valor, casas) {

            return valor.toFixed(casas);

        }


        // =================================
        // CRIAR LINHA DA TABELA
        // =================================

        function criarLinha(pessoa) {

            const tr = document.createElement("tr");

            const imc = calcularIMC(pessoa.peso, pessoa.altura);

            const classificacao = classificarIMC(imc);


            const nome = document.createElement("td");
            nome.textContent = pessoa.nome;

            const idade = document.createElement("td");
            idade.textContent = pessoa.idade;

            const altura = document.createElement("td");
            altura.textContent = formatar(pessoa.altura, 2) + " m";

            const peso = document.createElement("td");
            peso.textContent = formatar(pessoa.peso, 1) + " KG";

            const tdIMC = document.createElement("td");
            tdIMC.textContent = formatar(imc, 1);

            const tdClassificacao = document.createElement("td");

            const selo = document.createElement("span");

            selo.classList.add("selo", classificacao.classe);

            selo.textContent = classificacao.texto;

            tdClassificacao.appendChild(selo);


            // Botão excluir

            const tdAcao = document.createElement("td");

            const botaoExcluir = document.createElement("button");

            botaoExcluir.textContent = "Excluir";

            botaoExcluir.classList.add("excluir");

            botaoExcluir.addEventListener("click", function() {

                excluirPessoa(pessoa.id);

            });

            tdAcao.appendChild(botaoExcluir);


            // Adicionar elementos à linha

            tr.appendChild(nome);
            tr.appendChild(idade);
            tr.appendChild(altura);
            tr.appendChild(peso);
            tr.appendChild(tdIMC);
            tr.appendChild(tdClassificacao);
            tr.appendChild(tdAcao);

            return tr;

        }


        // =================================
        // RENDERIZAR TABELA
        // =================================

        function render() {

            tabelaPessoas.innerHTML = "";

            pessoas.forEach(function(pessoa) {

                const linha = criarLinha(pessoa);

                tabelaPessoas.appendChild(linha);

            });

        }


        // =================================
        // LER FORMULÁRIO
        // =================================

        function lerFormulario() {

            return {

                nome: inputNome.value.trim(),

                idade: Number(inputIdade.value),

                altura: Number(inputAltura.value),

                peso: Number(inputPeso.value)

            };

        }


        // =================================
        // VALIDAR DADOS
        // =================================

        function validarDados(dados) {

            if (dados.nome.length < 2) {

                return "Informe o nome com no mínimo duas letras.";

            }

            if (
                !Number.isInteger(dados.idade) ||
                dados.idade < 1 ||
                dados.idade > 120
            ) {

                return "A idade deve ser um número inteiro entre 1 e 120.";

            }

            if (
                !Number.isFinite(dados.altura) ||
                dados.altura < 0.5 ||
                dados.altura > 2.5
            ) {

                return "A altura deve estar entre 0.5 e 2.5 metros.";

            }

            if (
                !Number.isFinite(dados.peso) ||
                dados.peso < 2 ||
                dados.peso > 500
            ) {

                return "O peso deve estar entre 2 e 500 KG.";

            }

            return "";

        }


        // =================================
        // MOSTRAR ERRO
        // =================================

        function mostrarErro(mensagem) {

            mensagemDeErro.textContent = mensagem;

            mensagemDeErro.hidden = false;

        }


        // =================================
        // LIMPAR ERRO
        // =================================

        function limparErro() {

            mensagemDeErro.hidden = true;

            mensagemDeErro.textContent = "";

        }


        // =================================
        // ADICIONAR PESSOA
        // =================================

        function adicionarPessoa(dados) {

            proximoId++;

            const pessoa = {

                id: proximoId,

                nome: dados.nome,

                idade: dados.idade,

                altura: dados.altura,

                peso: dados.peso

            };

            pessoas.push(pessoa);

            return pessoa;

        }


        // =================================
        // SALVAR NO LOCALSTORAGE
        // =================================

        function salvar() {

            localStorage.setItem(
                chavePessoas,
                JSON.stringify(pessoas)
            );

        }


        // =================================
        // CARREGAR PESSOAS
        // =================================

        function carregarPessoas() {

            const dadosSalvos = localStorage.getItem(chavePessoas);

            if (dadosSalvos === null) {

                return [];

            }

            try {

                const dados = JSON.parse(dadosSalvos);

                if (Array.isArray(dados)) {

                    return dados;

                }

                return [];

            } catch (erro) {

                console.error("Erro ao carregar pessoas:", erro);

                return [];

            }

        }


        // =================================
        // AJUSTAR CONTADOR DE ID
        // =================================

        function ajustarContadorCodigo() {

            let maior = 0;

            pessoas.forEach(function(pessoa) {

                if (
                    Number.isSafeInteger(pessoa.id) &&
                    pessoa.id > maior
                ) {

                    maior = pessoa.id;

                }

            });

            proximoId = maior;

        }


        // =================================
        // EXCLUIR PESSOA
        // =================================

        function excluirPessoa(id) {

            pessoas = pessoas.filter(function(pessoa) {

                return pessoa.id !== id;

            });

            salvar();

            render();

        }


        // =================================
        // EVENTO SUBMIT
        // =================================

        formPessoa.addEventListener("submit", function(e) {

            e.preventDefault();

            const dados = lerFormulario();

            const erro = validarDados(dados);

            if (erro !== "") {

                mostrarErro(erro);

                return;

            }

            limparErro();

            adicionarPessoa(dados);

            salvar();

            formPessoa.reset();

            inputNome.focus();

            render();

        });


        // =================================
        // INICIALIZAR A APLICAÇÃO
        // =================================

        pessoas = carregarPessoas();

        ajustarContadorCodigo();

        render();

    </script>

</body>
</html>
