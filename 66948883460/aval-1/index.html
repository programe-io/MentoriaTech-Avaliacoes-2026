<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Estoque - CRUD JS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      color: #1e293b;
      font-size: 2rem;
    }

    header p {
      color: #64748b;
      margin-top: 4px;
    }

    /* Alertas de Erro e Sucesso */
    .mensagem {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-weight: 500;
      text-align: center;
    }

    .oculto {
      display: none;
    }

    .erro {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #f87171;
    }

    .sucesso {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #4ade80;
    }

    /* Layout em Grid */
    .grid-formularios {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .coluna-atualizacoes {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .card h2 {
      font-size: 1.2rem;
      color: #0f172a;
      margin-bottom: 16px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 8px;
    }

    /* Inputs e Botões */
    .campo {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
    }

    .linha-dupla {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 12px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }

    input {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primario {
      background-color: #2563eb;
      color: white;
    }

    .btn-primario:hover {
      background-color: #1d4ed8;
    }

    .btn-secundario {
      background-color: #0f172a;
      color: white;
    }

    .btn-secundario:hover {
      background-color: #334155;
    }

    /* Tabela */
    .tabela-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background-color: #f8fafc;
      color: #475569;
      font-weight: 600;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .vazio {
      text-align: center;
      color: #94a3b8;
      font-style: italic;
    }

    /* Responsividade para celulares */
    @media (max-width: 768px) {
      .grid-formularios {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Controle de Estoque</h1>
      <p>Projeto prático de fundamentos em JavaScript</p>
    </header>

    <!-- Mensagens de erro ou sucesso -->
    <div id="mensagem" class="mensagem oculto"></div>

    <div class="grid-formularios">
      <!-- Formulário de Cadastro -->
      <section class="card">
        <h2>Cadastrar Produto</h2>
        <form id="form-cadastro">
          <div class="campo">
            <label for="descricao">Descrição (mín. 5 caracteres)</label>
            <input type="text" id="descricao" placeholder="Ex: Cadeira gamer" required>
          </div>
          <div class="campo">
            <label for="quantidade">Quantidade Inicial</label>
            <input type="number" id="quantidade" placeholder="Ex: 12" required>
          </div>
          <div class="campo">
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" step="0.01" placeholder="Ex: 699.00" required>
          </div>
          <button type="submit" class="btn-primario">Cadastrar Produto</button>
        </form>
      </section>

      <!-- Formulários de Atualização -->
      <div class="coluna-atualizacoes">
        <section class="card">
          <h2>Atualizar Valor</h2>
          <form id="form-valor">
            <div class="linha-dupla">
              <div class="campo">
                <label for="cod-valor">Código</label>
                <input type="number" id="cod-valor" placeholder="ID" required>
              </div>
              <div class="campo">
                <label for="novo-valor">Novo Valor (R$)</label>
                <input type="number" id="novo-valor" step="0.01" placeholder="Ex: 97.00" required>
              </div>
            </div>
            <button type="submit" class="btn-secundario">Alterar Valor</button>
          </form>
        </section>

        <section class="card">
          <h2>Entrada de Estoque</h2>
          <form id="form-quantidade">
            <div class="linha-dupla">
              <div class="campo">
                <label for="cod-qtd">Código</label>
                <input type="number" id="cod-qtd" placeholder="ID" required>
              </div>
              <div class="campo">
                <label for="nova-qtd">Adicionar Qtd.</label>
                <input type="number" id="nova-qtd" placeholder="Ex: 3" required>
              </div>
            </div>
            <button type="submit" class="btn-secundario">Somar Quantidade</button>
          </form>
        </section>
      </div>
    </div>

    <!-- Tabela de Listagem -->
    <section class="card tabela-section">
      <h2>Produtos Cadastrados</h2>
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Descrição</th>
              <th>Quantidade</th>
              <th>Valor Unitário</th>
            </tr>
          </thead>
          <tbody id="lista-produtos">
            <tr>
              <td colspan="4" class="vazio">Nenhum produto cadastrado no estoque.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    let produtos = [];

    // 1. Funções principais da aula
    function validarProduto(descricao, quantidade, valor) {
      if (descricao.length < 5) {
        throw new Error("Descrição deve ter, no mínimo, cinco caracteres");
      }
      if (quantidade < 1) {
        throw new Error("Quantidade deve ser maior que zero");
      }
      if (valor < 0) {
        throw new Error("Valor deve ser maior ou igual a zero");
      }
    }

    function cadastrarProduto(descricao, quantidade, valor) {
      validarProduto(descricao, quantidade, valor);

      let novoProduto = {
        codigo: produtos.length + 1,
        descricao: descricao,
        quantidade: quantidade,
        valor: valor
      };

      produtos.push(novoProduto);
    }

    function atualizarValor(codigoProduto, novoValor) {
      if (novoValor < 0) {
        throw new Error("Valor deve ser maior ou igual a zero");
      }

      const produto = produtos.find((prod) => prod.codigo === codigoProduto);

      if (produto) {
        produto.valor = novoValor;
      } else {
        throw new Error("Produto não encontrado");
      }
    }

    function atualizarQuantidade(codigoProduto, novaQuantidade) {
      if (novaQuantidade < 1) {
        throw new Error("Quantidade deve ser maior que zero");
      }

      const produto = produtos.find((prod) => prod.codigo === codigoProduto);

      if (produto) {
        produto.quantidade = produto.quantidade + novaQuantidade;
      } else {
        throw new Error("Produto não encontrado");
      }
    }

    // 2. Funções para atualizar a tela e exibir mensagens
    function listarProdutos() {
      const tbody = document.getElementById("lista-produtos");
      tbody.innerHTML = "";

      if (produtos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="vazio">Nenhum produto cadastrado no estoque.</td></tr>`;
        return;
      }

      produtos.forEach((prod) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>#${prod.codigo}</strong></td>
          <td>${prod.descricao}</td>
          <td>${prod.quantidade} un.</td>
          <td>R$ ${prod.valor.toFixed(2).replace(".", ",")}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exibirMensagem(texto, tipo) {
      const box = document.getElementById("mensagem");
      box.textContent = texto;
      box.className = `mensagem ${tipo}`;

      setTimeout(() => {
        box.className = "mensagem oculto";
      }, 4000);
    }

    // 3. Eventos dos formulários
    document.getElementById("form-cadastro").addEventListener("submit", function (e) {
      e.preventDefault();
      const descricao = document.getElementById("descricao").value.trim();
      const quantidade = Number(document.getElementById("quantidade").value);
      const valor = Number(document.getElementById("valor").value);

      try {
        cadastrarProduto(descricao, quantidade, valor);
        listarProdutos();
        exibirMensagem("Produto cadastrado com sucesso!", "sucesso");
        this.reset();
      } catch (erro) {
        exibirMensagem(erro.message, "erro");
      }
    });

</body>
</html>
