
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Anamnese</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Ficha de Anamnese</h1>
    <p>Cadastro e histórico de informações do paciente</p>
</header>

<main>
    <form id="formAnamnese">

        <section>
            <h2>1. Identificação do Paciente</h2>

            <label>Nome completo:</label>
            <input type="text" id="nome" required>

            <label>Data de nascimento:</label>
            <input type="date" id="nascimento" required>

            <label>Telefone:</label>
            <input type="tel" id="telefone" required>

            <label>E-mail:</label>
            <input type="email" id="email">

            <label>Endereço:</label>
            <input type="text" id="endereco">
        </section>

        <section>
            <h2>2. Histórico de Saúde</h2>

            <label>Possui alguma doença ou condição de saúde?</label>
            <textarea id="doencas"
                placeholder="Descreva, se houver..."></textarea>

            <label>Faz uso de medicamentos?</label>
            <textarea id="medicamentos"
                placeholder="Informe os medicamentos..."></textarea>

            <label>Possui alergias?</label>
            <textarea id="alergias"
                placeholder="Informe as alergias conhecidas..."></textarea>

            <label>Já realizou alguma cirurgia?</label>
            <textarea id="cirurgias"></textarea>
        </section>

        <section>
            <h2>3. Histórico Familiar</h2>

            <label>Existem doenças na família?</label>
            <textarea id="familia"
                placeholder="Descreva o histórico familiar..."></textarea>
        </section>

        <section>
            <h2>4. Hábitos de Vida</h2>

            <label>Pratica atividades físicas?</label>
            <select id="atividade">
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
                <option value="Às vezes">Às vezes</option>
            </select>

            <label>Como considera sua alimentação?</label>
            <select id="alimentacao">
                <option value="Saudável">Saudável</option>
                <option value="Regular">Regular</option>
                <option value="Pouco saudável">Pouco saudável</option>
            </select>

            <label>Como considera a qualidade do sono?</label>
            <select id="sono">
                <option value="Boa">Boa</option>
                <option value="Regular">Regular</option>
                <option value="Ruim">Ruim</option>
            </select>
        </section>

        <section>
            <h2>5. Queixa Principal</h2>

            <label>Qual o principal motivo da consulta?</label>
            <textarea id="queixa" required></textarea>

            <label>Observações adicionais:</label>
            <textarea id="observacoes"></textarea>
        </section>

        <button type="submit">Salvar Anamnese</button>
    </form>

    <section>
        <h2>Pacientes Cadastrados</h2>
        <div id="listaPacientes"></div>
    </section>
</main>

<footer>
    <p>Sistema de Ficha de Anamnese</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
