

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Sistema de Controle de Estoque</h1>
        <p>Gerencie seus produtos de maneira simples!</p>
    </header>

    <main>
        <section class="cadastro">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">
                <input type="text" id="nome"
                    placeholder="Nome do produto" required>

                <input type="number" id="quantidade"
                    placeholder="Quantidade" min="1" required>

                <input type="number" id="preco"
                    placeholder="Preço (R$)" min="0.01"
                    step="0.01" required>

                <button type="submit">Cadastrar Produto</button>
            </form>
        </section>

        <section class="estoque">
            <h2>Produtos em Estoque</h2>

            <input type="text" id="pesquisa"
                placeholder="Pesquisar produto...">

            <div class="resumo">
                <p>Total de produtos: <span id="total">0</span></p>
                <p>Unidades em estoque: <span id="unidades">0</span></p>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto Sistema de Controle de Estoque</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
