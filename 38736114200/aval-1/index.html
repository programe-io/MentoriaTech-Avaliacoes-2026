
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <label>Descrição:</label>
            <input type="text" id="descricao" placeholder="Nome do produto">

            <label>Quantidade:</label>
            <input type="number" id="quantidade" placeholder="Quantidade">

            <label>Valor:</label>
            <input type="number" id="valor" step="0.01" placeholder="Valor do produto">

            <button onclick="cadastrarPelaTela()">Cadastrar Produto</button>
        </section>

        <section class="formulario">
            <h2>Atualizar Produto</h2>

            <label>Código do produto:</label>
            <input type="number" id="codigo" placeholder="Código">

            <label>Novo valor:</label>
            <input type="number" id="novovalor" step="0.01" placeholder="Novo valor">

            <button onclick="atualizarValorPelaTela()">
                Atualizar Valor
            </button>

            <label>Adicionar quantidade:</label>
            <input type="number" id="novaquantidade" placeholder="Quantidade">

            <button onclick="atualizarQuantidadePelaTela()">
                Atualizar Quantidade
            </button>
        </section>

        <p id="mensagem"></p>

        <section class="lista">
            <h2>Lista de Produtos</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
