
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <h1>Gerenciador de Tarefas</h1>
        <p class="subtitulo">Organize suas tarefas e acompanhe seu progresso.</p>

        <section class="formulario">
            <h2>Cadastrar Nova Tarefa</h2>

            <label for="titulo">Título da tarefa:</label>
            <input
                type="text"
                id="titulo"
                placeholder="Digite o título da tarefa"
            >

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade">
                <option value="1">1 - Baixa</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Alta</option>
            </select>

            <button onclick="cadastrarPelaTela()">
                Cadastrar Tarefa
            </button>
        </section>

        <section class="formulario">
            <h2>Gerenciar Tarefas</h2>

            <label for="codigo">Código da tarefa:</label>
            <input
                type="number"
                id="codigo"
                placeholder="Digite o código"
            >

            <button onclick="concluirPelaTela()">
                Concluir Tarefa
            </button>

            <label for="novaprioridade">Nova prioridade:</label>
            <select id="novaprioridade">
                <option value="1">1 - Baixa</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Alta</option>
            </select>

            <button onclick="alterarPrioridadePelaTela()">
                Alterar Prioridade
            </button>
        </section>

        <p id="mensagem"></p>

        <section class="lista">
            <h2>Lista de Tarefas</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Título</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="listaTarefas">
                </tbody>
            </table>
        </section>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
