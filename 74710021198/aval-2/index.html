<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Gerenciador de Tarefas</title>
        <link rel="stylesheet" href="style.css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <main class="container">
              <h1>Gerenciador de Tarefas</h1>

                  <!-- Cadastro de nova tarefa -->
                      <section class="card">
                            <h2>Nova Tarefa</h2>
                                  <form id="form-tarefa">
                                          <div class="campo">
                                                    <label for="titulo">Título (mín. 5 caracteres)</label>
                                                              <input type="text" id="titulo" placeholder="Ex.: Revisar código do projeto" required />
                                                                      </div>

                                                                              <div class="campo">
                                                                                        <label for="prioridade">Prioridade (1 = Alta, 2 = Média, 3 = Baixa)</label>
                                                                                                  <select id="prioridade">
                                                                                                              <option value="1">1 - Alta</option>
                                                                                                                          <option value="2" selected>2 - Média</option>
                                                                                                                                      <option value="3">3 - Baixa</option>
                                                                                                                                                </select>
                                                                                                                                                        </div>

                                                                                                                                                                <button type="submit">Cadastrar Tarefa</button>
                                                                                                                                                                      </form>
                                                                                                                                                                          </section>

                                                                                                                                                                              <!-- Alterar prioridade ou concluir tarefa -->
                                                                                                                                                                                  <section class="card">
                                                                                                                                                                                        <h2>Gerenciar Tarefa Existente</h2>
                                                                                                                                                                                              <div class="acoes-grid">
                                                                                                                                                                                                      <div class="campo">
                                                                                                                                                                                                                <label for="codigo-alvo">Código da tarefa</label>
                                                                                                                                                                                                                          <input type="number" id="codigo-alvo" min="1" placeholder="Ex.: 1" />
                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                          <div class="campo">
                                                                                                                                                                                                                                                    <label for="nova-prioridade">Nova prioridade (1 a 3)</label>
                                                                                                                                                                                                                                                              <select id="nova-prioridade">
                                                                                                                                                                                                                                                                          <option value="1">1 - Alta</option>
                                                                                                                                                                                                                                                                                      <option value="2">2 - Média</option>
                                                                                                                                                                                                                                                                                                  <option value="3">3 - Baixa</option>
                                                                                                                                                                                                                                                                                                            </select>
                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                <div class="botoes-acao">
                                                                                                                                                                                                                                                                                                                                        <button type="button" id="btn-alterar-prioridade" class="secundario">
                                                                                                                                                                                                                                                                                                                                                  Alterar Prioridade
                                                                                                                                                                                                                                                                                                                                                          </button>
                                                                                                                                                                                                                                                                                                                                                                  <button type="button" id="btn-concluir" class="sucesso">
                                                                                                                                                                                                                                                                                                                                                                            Marcar como Concluída
                                                                                                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                              </section>

                                                                                                                                                                                                                                                                                                                                                                                                  <!-- Feedback de erro ou sucesso -->
                                                                                                                                                                                                                                                                                                                                                                                                      <p id="mensagem" class="mensagem" aria-live="polite"></p>

                                                                                                                                                                                                                                                                                                                                                                                                          <!-- Listagem de tarefas -->
                                                                                                                                                                                                                                                                                                                                                                                                              <section class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="cabecalho-lista">
                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>Tarefas Cadastradas</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                    <button type="button" id="btn-listar" class="neutro">Atualizar Lista</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <ul id="lista-tarefas" class="lista-tarefas"></ul>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                      </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
