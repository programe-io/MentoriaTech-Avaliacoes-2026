<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Projeto CRUD e Estoque</title>
        <link rel="stylesheet" href="style.css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <main class="container">
              <h1>Controle de Estoque</h1>

                  <!-- Cadastrar produto -->
                      <section class="card">
                            <h2>Cadastrar Produto</h2>
                                  <form id="form-cadastro">
                                          <div class="campo">
                                                    <label for="descricao">Descrição (mín. 5 caracteres)</label>
                                                              <input type="text" id="descricao" placeholder="Ex.: Cadeira gamer" required />
                                                                      </div>

                                                                              <div class="linha">
                                                                                        <div class="campo">
                                                                                                    <label for="quantidade">Quantidade inicial (mín. 1)</label>
                                                                                                                <input type="number" id="quantidade" min="1" placeholder="Ex.: 12" required />
                                                                                                                          </div>

                                                                                                                                    <div class="campo">
                                                                                                                                                <label for="valor">Valor unitário (mín. 0)</label>
                                                                                                                                                            <input type="number" id="valor" step="0.01" min="0" placeholder="Ex.: 699" required />
                                                                                                                                                                      </div>
                                                                                                                                                                              </div>

                                                                                                                                                                                      <button type="submit">Cadastrar</button>
                                                                                                                                                                                            </form>
                                                                                                                                                                                                </section>

                                                                                                                                                                                                    <!-- Atualizar valor e quantidade -->
                                                                                                                                                                                                        <section class="card">
                                                                                                                                                                                                              <h2>Atualizar Estoque</h2>
                                                                                                                                                                                                                    <div class="campo">
                                                                                                                                                                                                                            <label for="codigo-produto">Código do produto</label>
                                                                                                                                                                                                                                    <input type="number" id="codigo-produto" min="1" placeholder="Ex.: 1" />
                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                <div class="linha">
                                                                                                                                                                                                                                                        <div class="campo">
                                                                                                                                                                                                                                                                  <label for="novo-valor">Novo valor (substitui o atual)</label>
                                                                                                                                                                                                                                                                            <input type="number" id="novo-valor" step="0.01" min="0" placeholder="Ex.: 599" />
                                                                                                                                                                                                                                                                                      <button type="button" id="btn-atualizar-valor" class="secundario">
                                                                                                                                                                                                                                                                                                  Atualizar Valor
                                                                                                                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                            <div class="campo">
                                                                                                                                                                                                                                                                                                                                      <label for="nova-quantidade">Quantidade a adicionar (soma)</label>
                                                                                                                                                                                                                                                                                                                                                <input type="number" id="nova-quantidade" min="1" placeholder="Ex.: 3" />
                                                                                                                                                                                                                                                                                                                                                          <button type="button" id="btn-atualizar-quantidade" class="sucesso">
                                                                                                                                                                                                                                                                                                                                                                      Adicionar Quantidade
                                                                                                                                                                                                                                                                                                                                                                                </button>
                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                  </section>

                                                                                                                                                                                                                                                                                                                                                                                                      <!-- Mensagens de retorno -->
                                                                                                                                                                                                                                                                                                                                                                                                          <p id="mensagem" class="mensagem" aria-live="polite"></p>

                                                                                                                                                                                                                                                                                                                                                                                                              <!-- Listagem de produtos -->
                                                                                                                                                                                                                                                                                                                                                                                                                  <section class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="cabecalho-lista">
                                                                                                                                                                                                                                                                                                                                                                                                                                <h2>Produtos Cadastrados</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="button" id="btn-listar" class="neutro">Listar Produtos</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <ul id="lista-produtos" class="lista-produtos"></ul>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                          </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
