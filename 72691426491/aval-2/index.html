<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <h1>Gerenciador de Tarefas</h1>
      <p class="description">Cadastre tarefas, acompanhe o que falta e conclua o que já foi feito.</p>

      <form id="task-form">
        <div class="form-group">
          <label for="task-title">Descrição da Tarefa</label>
          <input type="text" id="task-title" placeholder="Digite a tarefa..." autocomplete="off">
          <span class="hint">Mínimo de 5 caracteres</span>
        </div>

        <div class="form-group">
          <label for="task-priority">Prioridade</label>
          <select id="task-priority">
            <option value="1">1 – Alta</option>
            <option value="2" selected>2 – Média</option>
            <option value="3">3 – Baixa</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">Adicionar Tarefa</button>
      </form>

      <p id="alert-message" class="alert" aria-live="polite" role="alert"></p>
    </aside>

    <main class="main-content">
      <header class="main-header">
        <h2>Tarefas cadastradas</h2>
        <p id="task-counter">Total: 0 | Pendentes: 0 | Concluídas: 0</p>
      </header>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty-state">Nenhuma tarefa ainda. Preencha o formulário para cadastrar a primeira.</p>
    </main>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
