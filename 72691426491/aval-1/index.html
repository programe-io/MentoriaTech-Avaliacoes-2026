<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
  <h1>Controle de Estoque</h1>

  <section class="card">
    <h2>Cadastrar Produto</h2>
    <input type="text" id="descricao" placeholder="Descrição (mín. 5 caracteres)">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor">
    <button onclick="handleCadastrar()">Cadastrar</button>
  </section>

  <section class="card">
    <h2>Atualizar Valor</h2>
    <input type="number" id="codigoValor" placeholder="Código do produto">
    <input type="number" id="novoValor" placeholder="Novo valor">
    <button onclick="handleAtualizarValor()">Atualizar Valor</button>
  </section>

  <section class="card">
    <h2>Atualizar Quantidade (soma)</h2>
    <input type="number" id="codigoQuantidade" placeholder="Código do produto">
    <input type="number" id="novaQuantidade" placeholder="Quantidade a adicionar">
    <button onclick="handleAtualizarQuantidade()">Atualizar Quantidade</button>
  </section>

  <section class="card">
    <h2>Excluir Produto</h2>
    <input type="number" id="codigoExcluir" placeholder="Código do produto">
    <button onclick="handleExcluir()">Excluir</button>
  </section>

  <p id="mensagem"></p>

  <h2>Produtos Cadastrados</h2>
  <table id="tabelaProdutos">
    <thead>
      <tr>
        <th>Código</th>
        <th>Descrição</th>
        <th>Quantidade</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody id="corpoTabela"></tbody>
  </table>
</div>
  <script src="script.js"></script>
  
</body>
</html>
