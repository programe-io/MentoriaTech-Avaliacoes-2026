<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="topo">
  <div>
    <p>MINI FEED • ANDRESSA RIBEIRO</p>
    <h1>Vale a Dica<span>!</span></h1>
    <p>Uma boa descoberta merece ser compartilhada.</p>
  </div>
  <span class="avatar">AR</span>
</header>

<main class="container">
  <section class="form-card">
    <h2>Compartilhe uma recomendação</h2>

    <form id="form">
      <div class="campos">
        <div>
          <label for="titulo">Nome da indicação</label>
          <input
            id="titulo"
            maxlength="70"
            placeholder="Título do livro, filme ou música"
            required
          >
        </div>

        <div>
          <label for="categoria">Categoria</label>
          <select id="categoria">
            <option value="livro">Livro</option>
            <option value="filme">Filme</option>
            <option value="musica">Música</option>
          </select>
        </div>
      </div>

      <label for="descricao">Por que vale a dica?</label>
      <textarea
        id="descricao"
        rows="3"
        maxlength="240"
        placeholder="Conte o que torna essa indicação interessante..."
        required
      ></textarea>

      <div class="acoes">
        <span id="contador">0/240</span>
        <button type="submit">Publicar indicação +</button>
      </div>
    </form>

    <p id="aviso" role="status"></p>
  </section>

  <section class="area-feed">
    <div class="feed-topo">
      <h2>Últimas dicas</h2>

      <label>
        <span class="sr-only">Filtrar por categoria</span>
        <select id="filtro">
          <option value="todas">Todas</option>
          <option value="livro">Livros</option>
          <option value="filme">Filmes</option>
          <option value="musica">Músicas</option>
        </select>
      </label>
    </div>

    <div id="feed"></div>
    <p id="vazio" hidden>Ainda não há dicas nesta categoria.</p>
  </section>
</main>

<footer>Andressa Ribeiro • Mini Feed Social</footer>
  <script src="script.js"></script>
  
</body>
</html>
