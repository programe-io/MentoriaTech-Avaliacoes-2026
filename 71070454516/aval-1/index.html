<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <main class="container">
        <h1>Cadastro de Produtos</h1>

        <section class="card">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex.: Cadeira Gamer"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input
                        type="number"
                        id="valor"
                        min="0.01"
                        step="0.01"
                        placeholder="0,00"
                        required
                    >
                </div>

                <button type="submit">Cadastrar produto</button>
            </form>

            <p id="mensagem"></p>
        </section>

        <section class="card">
            <h2>Produtos cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                    </tbody>
                </table>
            </div>
        </section>

        <section class="card">
            <h2>Atualizar produto</h2>

            <div class="atualizacao">
                <div class="campo">
                    <label for="codigo">Código do produto</label>
                    <input type="number" id="codigo" min="1">
                </div>

                <div class="campo">
                    <label for="novoValor">Novo valor</label>
                    <input type="number" id="novoValor" min="0" step="0.01">
                </div>

                <button type="button" id="btnValor">
                    Atualizar valor
                </button>
            </div>

            <div class="atualizacao">
                <div class="campo">
                    <label for="novaQuantidade">Quantidade a adicionar</label>
                    <input type="number" id="novaQuantidade" min="1">
                </div>

                <button type="button" id="btnQuantidade">
                    Adicionar quantidade
                </button>
            </div>

            <p id="mensagemAtualizacao"></p>
        </section>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
