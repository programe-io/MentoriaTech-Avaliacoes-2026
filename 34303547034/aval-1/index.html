<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Controle seus produtos de forma simples</p>
    </header>

    <main>

        <!-- Cadastro -->
        <section class="card">
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="codigo">Código:</label>
                    <input
                        type="text"
                        id="codigo"
                        placeholder="Ex: 001"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descricao">Descrição:</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Nome do produto"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade:</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="0"
                        placeholder="Ex: 10"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$):</label>
                    <input
                        type="number"
                        id="valor"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 25.90"
                        required
                    >
                </div>

                <button type="submit" class="btn cadastrar">
                    Cadastrar Produto
                </button>

            </form>
        </section>


        <!-- Alterações -->
        <section class="card">
            <h2>Alterar Produto</h2>

            <div class="alteracao">

                <div class="campo">
                    <label for="codigoAlterar">Código do produto:</label>
                    <input
                        type="text"
                        id="codigoAlterar"
                        placeholder="Digite o código"
                    >
                </div>

                <div class="campo">
                    <label for="novoValor">Novo valor (R$):</label>
                    <input
                        type="number"
                        id="novoValor"
                        min="0"
                        step="0.01"
                        placeholder="Novo valor"
                    >
                </div>

                <button
                    type="button"
                    class="btn valor"
                    onclick="alterarValor()">
                    Alterar Valor
                </button>

                <div class="campo">
                    <label for="novaQuantidade">Nova quantidade:</label>
                    <input
                        type="number"
                        id="novaQuantidade"
                        min="0"
                        placeholder="Nova quantidade"
                    >
                </div>

                <button
                    type="button"
                    class="btn quantidade"
                    onclick="alterarQuantidade()">
                    Alterar Quantidade
                </button>

            </div>
        </section>


        <!-- Lista -->
        <section class="card">

            <div class="titulo-lista">
                <h2>Produtos Cadastrados</h2>
                <span id="totalProdutos">0 produtos</span>
            </div>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                        <!-- Os produtos aparecerão aqui -->
                    </tbody>

                </table>

            </div>

            <p id="mensagemVazia" class="mensagem">
                Nenhum produto cadastrado.
            </p>

        </section>

    </main>

    <footer>
        <p>Sistema de Estoque &copy; 2026</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
