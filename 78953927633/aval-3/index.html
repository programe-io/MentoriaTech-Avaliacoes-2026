<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🎮 Gamer Feed</h1>

    <nav>
        <a href="#">Feed</a>
        <a href="#">Jogos</a>
        <a href="#">Perfil</a>
    </nav>
</header>

<main>

    <section class="publicar">
        <span>Compartilhe sua jogada!</span>
        <button>Publicar</button>
    </section>

    <article class="post">

        <div class="jogador">
            <div class="avatar">E</div>

            <div>
                <strong>Eloá</strong>
                <small>Online</small>
            </div>
        </div>

        <p>Finalmente terminei aquele jogo que estava jogando!</p>

        <img src="https://picsum.photos/600/350?random=4"
             alt="Publicação gamer">

        <div class="acoes">
            <button>🔥 Curtir</button>
            <button>💬 Comentar</button>
        </div>

    </article>

</main>

<footer>Gamer Feed © 2026</footer>

</body>
</html>
