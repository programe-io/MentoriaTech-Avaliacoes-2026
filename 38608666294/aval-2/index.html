<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="css/style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Gerenciador de Tarefas</h1>

    <form id="formulario">
      <input type="text" id="titulo" placeholder="Título (mín. 5 caracteres)" required>
      <select id="prioridade">
        <option value="1">Prioridade 1 (alta)</option>
        <option value="2">Prioridade 2 (média)</option>
        <option value="3">Prioridade 3 (baixa)</option>
      </select>
      <button type="submit">Adicionar</button>
    </form>

    <p id="mensagem"></p>

    <ul id="lista"></ul>
  </main>

  <script src="js/gerenciador.js"></script>
  <script src="js/app.js"></script>
<script src="script.js"></script></body>
</html>
