<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Calculadora de IMC Tartarugas Ninja</h1>

    <section class="card">
      <h2>Cadastrar tartaruga</h2>

      <form id="form-pessoa">
        <div class="campo">
          <label for="input-nome">Nome</label>
          <input type="text" id="input-nome" placeholder="Ex.: Leonardo" maxlength="50">
        </div>

        <div class="campo">
          <label for="input-idade">Idade</label>
          <input type="number" id="input-idade" placeholder="Ex.: 15" min="1" max="120">
        </div>

        <div class="campo">
          <label for="input-altura">Altura (m)</label>
          <input type="number" id="input-altura" placeholder="Ex.: 1,70" min="0.5" max="2.5" step="0.01">
        </div>

        <div class="campo">
          <label for="input-peso">Peso (kg)</label>
          <input type="number" id="input-peso" placeholder="Ex.: 65" min="2" max="500" step="0.1">
        </div>

        <div class="botoes">
          <button type="submit" class="salvar">Salvar</button>
          <button type="reset" class="cancelar">Cancelar</button>
        </div>

        <p id="erro" class="erro" hidden></p>
      </form>
    </section>

    <section class="card">
      <h2>Tartarugas cadastradas</h2>

      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Idade</th>
              <th>Altura</th>
              <th>Peso</th>
              <th>IMC</th>
              <th>Classificação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-pessoas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
