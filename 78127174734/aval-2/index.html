<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    
    <header class="main-header">
        <div class="logo">MiniFeed</div>
        <nav class="navigation">
            <a href="#">Inicio</a>
            <a href="#">Perfil</a>
        </nav>
    </header>


    <main>

        <div class="publish-box">
            <div class="user-info">
                <div class="avatar">J</div>
                <div class="user-details">
                    <span class="username">eduardo</span>
                    <p class="placeholder-text">O que você está pensando?</p>
                </div>
            </div>
            <button class="btn-publish">Publicar</button>
        </div>

        
        <article class="article.post">
            <div class="post-header">
                <div class="avatar">M</div>
                <div class="post-meta">
                    <span class="username">maria</span>
                    <span class="time">Há 10 minutos</span>
                </div>
            </div>

            <div class="post-text">
                Hoje eu vi o novo filme do homem de ferro,
                top, to feliz :D
            </div>

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSd84as5KJSOZhy-QAYI7epViICfDv7gfUSkWd9We25mWNN7kkNp-LQFHY&s=10" alt="imagem do homen de ferro">

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>
        </article>

    </main>


    <footer>
        <p>&copy; MiniFeed - Todos os Direitos Reservados - 2026</p>
    </footer>

</body>
</html>
