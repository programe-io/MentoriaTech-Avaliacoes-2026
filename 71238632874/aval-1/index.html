<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - CRUD</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .form-group { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .form-control { display: flex; flex-direction: column; flex: 1; min-width: 150px; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background-color: #2ecc71; color: white; align-self: flex-end; height: 40px; }
        .btn-add:hover { background-color: #27ae60; }
        .btn-action { padding: 5px 10px; font-size: 12px; margin-right: 5px; }
        .btn-price { background-color: #3498db; color: white; }
        .btn-price:hover { background-color: #2980b9; }
        .btn-qty { background-color: #e67e22; color: white; }
        .btn-qty:hover { background-color: #d35400; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; }
        th { background-color: #34495e; color: white; }
        tr:hover { background-color: #f9f9f9; }
        .alert { padding: 12px; border-radius: 4px; margin-bottom: 20px; font-weight: bold; display: none; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>📦 Controle de Estoque (CRUD)</h1>
    
    <!-- Alertas visuais de validação -->
    <div id="alertBox" class="alert"></div>

    <!-- 10. Formuário de Cadastro -->
    <h2>Cadastrar Novo Produto</h2>
    <div class="form-group">
        <div class="form-control">
            <label for="descricao">Descrição (mín. 5 carac.):</label>
            <input type="text" id="descricao" placeholder="Ex: Cadeira Gamer">
        </div>
        <div class="form-control">
            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" placeholder="Ex: 10" min="1">
        </div>
        <div class="form-control">
            <label for="valor">Valor (R$):</label>
            <input type="number" id="valor" placeholder="Ex: 599.90" min="0" step="0.01">
        </div>
        <button class="btn-add" onclick="dispararCadastro()">Cadastrar</button>
    </div>

    <!-- 14. Listagem de Produtos -->
    <h2>Produtos no Estoque</h2>
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor (R$)</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaProdutos">
            <tr>
                <td colspan="5" style="text-align: center; color: #7f8c8d;">Nenhum produto cadastrado.</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // 4. Criação da lista de produtos
    let produtos = [];

    // 6. Função para validar produto
    function validarProduto(descricao, quantidade, valor) {
        if (descricao.trim().length < 5) {
            throw new Error("Descrição deve ter, no mínimo, cinco caracteres");
        }
        if (quantidade < 1) {
            throw new Error("Quantidade deve ser maior que zero");
        }
        if (valor < 0) {
            throw new Error("Valor deve ser maior ou igual a zero");
        }
    }

    // 10. Função para cadastrar produto
    function cadastrarProduto(descricao, quantidade, valor) {
        validarProduto(descricao, quantidade, valor);
        
        // 11, 12. Criação do objeto e Código automático
        let novoProduto = {
            codigo: produtos.length + 1,
            descricao: descricao,
            quantidade: Number(quantidade),
            valor: Number(valor)
        };
        
        // 13. Adição ao array
        produtos.push(novoProduto);
    }

    // 14. Função para listar produtos na tabela HTML
    function listarProdutos() {
        const tbody = document.getElementById("tabelaProdutos");
        tbody.innerHTML = "";

        if (produtos.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #7f8c8d;">Nenhum produto cadastrado.</td></tr>`;
            return;
        }

        produtos.forEach(prod => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>#${prod.codigo}</strong></td>
                    <td>${prod.descricao}</td>
                    <td>${prod.quantidade} un</td>
                    <td>R$ ${prod.valor.toFixed(2)}</td>
                    <td>
                        <button class="btn-action btn-price" onclick="dispararAtualizarValor(${prod.codigo})">Alterar Preço</button>
                        <button class="btn-action btn-qty" onclick="dispararAtualizarQuantidade(${prod.codigo})">Somar Estoque</button>
                    </td>
                </tr>
            `;
        });
    }

    // 16. Função para atualizar o valor
    function atualizarValor(codigoProduto, novoValor) {
        let produto = produtos.find(prod => prod.codigo === codigoProduto); // 17. Busca com find
        if (!produto) throw new Error("Produto não encontrado."); // 18. Tratamento
        if (novoValor < 0) throw new Error("O valor não pode ser negativo.");
        
        produto.valor = Number(novoValor);
    }

    // 19. Função para atualizar a quantidade
    function atualizarQuantidade(codigoProduto, quantidadeAAdicionar) {
        let produto = produtos.find(prod => prod.codigo === codigoProduto);
        if (!produto) throw new Error("Produto não encontrado.");
        if (quantidadeAAdicionar < 1) throw new Error("A quantidade a adicionar deve ser maior que zero.");
        
        produto.quantidade += Number(quantidadeAAdicionar); // 20. Soma ao estoque existente
    }

    // --- FUNÇÕES DE INTERAÇÃO COM A INTERFACE INTERATIVA ---
    
    function exibirMensagem(texto, tipo) {
        const box = document.getElementById("alertBox");
        box.innerText = texto;
        box.className = `alert alert-${tipo}`;
        box.style.display = "block";
        if (tipo === "success") {
            setTimeout(() => box.style.display = "none", 4000);
        }
    }

    function dispararCadastro() {
        const desc = document.getElementById("descricao").value;
        const qtd = document.getElementById("quantidade").value;
        const val = document.getElementById("valor").value;

        try {
            cadastrarProduto(desc, qtd, val);
            exibirMensagem("Produto cadastrado com sucesso!", "success");
            
            // Limpa os campos
            document.getElementById("descricao").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("valor").value = "";
            
            listarProdutos();
        } catch (error) {
            exibirMensagem(error.message, "error");
        }
    }

    function dispararAtualizarValor(codigo) {
        const novoPreco = prompt("Digite o novo valor do produto (R$):");
        if (novoPreco === null || novoPreco === "") return; // Cancelado
        
        try {
            atualizarValor(codigo, novoPreco);
            exibirMensagem("Preço atualizado com sucesso!", "success");
            listarProdutos();
        } catch (error) {
            alert(error.message);
        }
    }

    function dispararAtualizarQuantidade(codigo) {
        const qtdSoma = prompt("Digite a quantidade de novas unidades a adicionar ao estoque:");
        if (qtdSoma === null || qtdSoma === "") return; // Cancelado
        
        try {
            atualizarQuantidade(codigo, qtdSoma);
            exibirMensagem("Estoque incrementado com sucesso!", "success");
            listarProdutos();
        } catch (error) {
            alert(error.message);
        }
    }
</script>
</body>
</html>
