<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes e Estilos via JavaScript</title>
    <style>
        /* 8. Classes definidas em um bloco/arquivo CSS */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Classe de formatação genérica controlada por classList */
        .formatacao-titulo { font-family: "Courier New", Courier, monospace; letter-spacing: 2px; text-transform: uppercase; }
        
        /* Classes de estilização condicional para a tabela */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #34495e; color: white; }
        
        /* Classes CSS para serem aplicadas dinamicamente via JS */
        .status-normal { background-color: #d4edda; font-weight: bold; }
        .status-sobrepeso { background-color: #f8d7da; font-weight: bold; }
        
        button { margin-top: 15px; padding: 10px 15px; border: none; border-radius: 4px; background-color: #3498db; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #2980b9; }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <!-- 2. Título que receberá manipulação direta de style -->
    <h3 id="meu-titulo">Relatório de Situações</h3>
    <button onclick="alternarEstiloTitulo()">Alternar Fonte do Título (Toggle)</button>

    <!-- 9. Exemplo prático com uma tabela de situações -->
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Peso (kg)</th>
                <th>Altura (m)</th>
                <th>Situação</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana Silva</td>
                <td>62</td>
                <td>1.65</td>
                <!-- 9. As células recebem a classe comum "situacao" -->
                <td class="situacao">normal</td>
            </tr>
            <tr>
                <td>Carlos Souza</td>
                <td>95</td>
                <td>1.75</td>
                <td class="situacao">sobrepeso</td>
            </tr>
            <tr>
                <td>Mariana Costa</td>
                <td>55</td>
                <td>1.60</td>
                <td class="situacao">normal</td>
            </tr>
            <tr>
                <td>Roberto Alves</td>
                <td>110</td>
                <td>1.80</td>
                <td class="situacao">sobrepeso</td>
            </tr>
        </tbody>
    </table>
    
    <button onclick="aplicarEstilosCondicionais()">Analisar e Estilizar Tabela</button>
</div>

<script>
    // =========================================================================
    // 2, 3, 4. ESTILIZAÇÃO DIRETA VIA PROPERTY STYLE (CSS INLINE)
    // =========================================================================
    // Seleciona o elemento pelo ID
    const titulo = document.querySelector("#meu-titulo");

    // 4. Aplicando propriedades CSS (com nomes em camelCase)
    titulo.style.color = "#2c3e50";
    titulo.style.backgroundColor = "#ecf0f1"; // background-color vira backgroundColor
    titulo.style.padding = "10px";
    titulo.style.borderLeft = "5px solid #3498db";

    // 7. Função demonstrando o método toggle de classList
    function alternarEstiloTitulo() {
        // Se a classe não existir, adiciona; se existir, remove.
        titulo.classList.toggle("formatacao-titulo");
    }

    // =========================================================================
    // 9, 10, 11. SELEÇÃO MÚLTIPLA E ESTILIZAÇÃO CONDICIONAL
    // =========================================================================
    function aplicarEstilosCondicionais() {
        // 10. Selecionando vários elementos e retornando uma HTMLCollection
        const celulasSituacao = document.getElementsByClassName("situacao");

        // 11. Percorrendo elementos da coleção com a estrutura for...of
        for (const celula of celulasSituacao) {
            // Obtendo o conteúdo de texto limpo de cada célula
            const texto = celula.textContent.trim();

            // Lógica condicional baseada no texto do elemento
            if (texto === "normal") {
                // Estratégia A: Alterando a cor do texto diretamente via .style (Item 11)
                celula.style.color = "green";
                
                // Estratégia B: Adicionando uma classe CSS externa via classList (Item 6 e 7)
                celula.classList.add("status-normal");
                celula.classList.remove("status-sobrepeso"); // Garante a remoção da oposta
            } 
            else if (texto === "sobrepeso") {
                // Estratégia A: Alterando a cor diretamente
                celula.style.color = "red";
                
                // Estratégia B: Manipulando classes
                celula.classList.add("status-sobrepeso");
                celula.classList.remove("status-normal");
            }
        }
    }
</script>
</body>
</html>
