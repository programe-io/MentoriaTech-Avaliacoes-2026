<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Mundo Digital</title>
  <style>
    body {
      background-color: #e8e0ff;
      color: #302052;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    .cartao {
      background-color: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 500px;
      margin: 20px auto;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }

    button {
      background-color: #7048e8;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="cartao">
    <h1>Meu Mundo Digital</h1>
    <p>Estou aprendendo a criar páginas com HTML, CSS e JavaScript!</p>

    <img
      src="https://placehold.co/500x250/7048e8/ffffff?text=Meu+Projeto"
      alt="Imagem ilustrativa roxa representando meu projeto digital">

    <p id="mensagem">Clique no botão para ver uma mensagem.</p>
    <button onclick="mostrarMensagem()">Clique aqui</button>
  </div>

  <script>
    function mostrarMensagem() {
      document.getElementById("mensagem").textContent =
        "Parabéns! Você está aprendendo programação!";
    }
  </script>
<script src="script.js"></script></body>
</html>
