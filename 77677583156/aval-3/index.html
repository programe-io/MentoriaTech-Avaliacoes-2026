<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Entrega - Avaliações</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Área de Entrega</h1>
        <p>Avaliações e envio de atividades</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Envie sua avaliação</h2>

            <p>
                Finalize seu trabalho, revise seu código e
                compartilhe sua solução com o professor.
            </p>

            <form id="formulario">
                <label for="aluno">Nome do aluno:</label>
                <input type="text" id="aluno"
                       placeholder="Digite seu nome" required>

                <label for="atividade">Nome da atividade:</label>
                <input type="text" id="atividade"
                       placeholder="Digite o nome da atividade" required>

                <label for="html">Código HTML:</label>
                <textarea id="html" rows="5"
                          placeholder="Cole seu código HTML aqui"
                          required></textarea>

                <label for="css">Código CSS:</label>
                <textarea id="css" rows="5"
                          placeholder="Cole seu código CSS aqui"
                          required></textarea>

                <label for="javascript">Código JavaScript:</label>
                <textarea id="javascript" rows="5"
                          placeholder="Cole seu código JavaScript aqui"
                          required></textarea>

                <button type="submit">Publicar avaliação
  <script src="script.js"></script>
  
</body>
</html>
