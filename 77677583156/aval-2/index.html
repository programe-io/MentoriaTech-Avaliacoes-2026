<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <!-- Responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Descrição da página -->
    <meta name="description" content="Exemplo de página HTML com CSS e JavaScript">

    <!-- Autor -->
    <meta name="author" content="Seu Nome">

    <!-- Título -->
    <title>Minha Página</title>

    <!-- CSS externo -->
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- Cabeçalho -->
    <header>
        <h1>Minha Página</h1>

        <!-- Menu de navegação -->
        <nav>
            <a href="#inicio">Início</a>
            <a href="#sobre">Sobre</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <main>

        <!-- Seção inicial -->
        <section id="inicio">
            <h2>Início</h2>
            <p>Bem-vindo à minha página!</p>

            <a href="https://www.google.com" target="_blank">
                Acessar Google
            </a>
        </section>

        <!-- Artigo -->
        <article id="sobre">
            <h2>Sobre</h2>
            <p>Este é um exemplo de artigo HTML.</p>

            <h3>Lista</h3>

            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>

            <ol>
                <li>Primeiro</li>
                <li>Segundo</li>
                <li>Terceiro</li>
            </ol>
        </article>

        <!-- Imagem -->
        <section>
            <h2>Imagem</h2>

            <img
                src="https://via.placeholder.com/300"
                alt="Imagem de exemplo"
                width="300"
            >
        </section>

        <!-- Formulário -->
        <section id="contato">
            <h2>Contato</h2>

            <form>
                <label for="nome">Nome:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                >

                <br><br>

                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                >

                <br><br>

                <label for="mensagem">Mensagem:</label>
                <br>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="5"
                    cols="30"
                ></textarea>

                <br><br>

                <button type="button" id="botao">
                    Enviar
                </button>
            </form>
        </section>

    </main>

    <!-- Barra lateral -->
    <aside>
        <h2>Informações</h2>
        <p>Conteúdo adicional da página.</p>
    </aside>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 - Minha Página</p>
    </footer>

    <!-- JavaScript externo -->
    <script src="script.js"></script>

<script src="script.js"></script></body>

</html>
