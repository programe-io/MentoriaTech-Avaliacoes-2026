```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizzaria Delivery</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>🍕 Bella Pizza <button onclick="verCarrinho()">🛒 Carrinho (<span id="qtdCart">0</span>)</button></header>

<section class="hero">
<h1>Pizza Delivery 🍕</h1>
<p>Escolha sua pizza e peça agora!</p>
</section>

<main>
<h2>Cardápio</h2>

<div class="pizzas">
<div class="pizza" onclick="selecionar(this,'Calabresa',29.90)">
<img src="https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=600&q=80">
<h3>Calabresa</h3><p>R$ 29,90</p>
</div>

<div class="pizza" onclick="selecionar(this,'Frango com Catupiry',32.90)">
<img src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=600&q=80">
<h3>Frango com Catupiry</h3><p>R$ 32,90</p>
</div>

<div class="pizza" onclick="selecionar(this,'Quatro Queijos',36.90)">
<img src="https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?auto=format&fit=crop&w=600&q=80">
<h3>Quatro Queijos</h3><p>R$ 36,90</p>
</div>
</div>

<section id="pedido">
<h2>Seu Pedido</h2>

<select id="tamanho">
<option value="0">Escolha o tamanho</option>
<option value="0">Pequena</option>
<option value="10">Média + R$10</option>
<option value="20">Grande + R$20</option>
</select>

<input id="nome" placeholder="Seu nome">
<input id="endereco" placeholder="Endereço">
<button onclick="adicionar()">Adicionar ao carrinho</button>

<div id="carrinho"></div>
<h2 id="total">Total: R$ 0,00</h2>

<button onclick="finalizar()">✅ Finalizar pedido</button>

<div id="comprovante"></div>
</section>
</main>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
