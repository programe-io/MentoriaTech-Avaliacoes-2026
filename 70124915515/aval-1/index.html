<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Estoque</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <h1>Sistema de Estoque</h1>

    <!-- Formulário de Cadastro -->
    <section class="card">
      <h2>Cadastrar Novo Produto</h2>
      <form id="form-cadastro" onsubmit="return false;">
        <div class="input-group">
          <input type="text" id="codigo" placeholder="Código (ex: P01)">
          <input type="text" id="descricao" placeholder="Descrição do produto">
          <input type="number" id="quantidade" placeholder="Quantidade" min="0">
          <input type="text" id="valor" placeholder="Valor (ex: 19,90)">
        </div>
        <button type="button" onclick="cadastrarProduto()" class="btn-primario">Cadastrar Produto</button>
      </form>
    </section>

    <!-- Seção de Alterações -->
    <section class="grid-alteracoes">
      <!-- Alterar Valor -->
      <div class="card">
        <h2>Alterar Valor</h2>
        <form id="form-valor" onsubmit="return false;">
          <input type="text" id="cod-valor" placeholder="Código do produto">
          <input type="text" id="novo-valor" placeholder="Novo valor (ex: 25,50)">
          <button type="button" onclick="alterarValor()" class="btn-secundario">Atualizar Valor</button>
        </form>
      </div>

      <!-- Alterar Quantidade -->
      <div class="card">
        <h2>Alterar Quantidade</h2>
        <form id="form-quantidade" onsubmit="return false;">
          <input type="text" id="cod-qtd" placeholder="Código do produto">
          <input type="number" id="nova-qtd" placeholder="Nova quantidade" min="0">
          <button type="button" onclick="alterarQuantidade()" class="btn-secundario">Atualizar Quantidade</button>
        </form>
      </div>
    </section>

    <!-- Listagem de Produtos -->
    <section class="card">
      <div class="header-lista">
        <h2>Produtos Cadastrados</h2>
        <button type="button" onclick="listarProdutos()" class="btn-outline">Atualizar Lista</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Quantidade</th>
            <th>Valor Unitário</th>
          </tr>
        </thead>
        <tbody id="tabela-produtos">
          <tr>
            <td colspan="4" class="vazio">Nenhum produto cadastrado.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
