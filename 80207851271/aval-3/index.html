<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Interativo</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>Meu <span class="destaque">Blog</span></h1>
    <button onclick="mudarTema()">🌙 Tema</button>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Artigos</a>
    <a href="#">Contato</a>
  </nav>

  <div class="container">

    <main>

      <article>
        <h2 id="titulo">Título do Post</h2>

        <img src="https://via.placeholder.com/400" alt="Imagem do post">

        <p id="texto">
          Este é um <span class="destaque">conteúdo importante</span> do blog.
        </p>

        <button onclick="mudarConteudo()">Mudar Conteúdo</button>
      </article>

      <section>
        <h2>Contato</h2>

        <label>Nome:</label>
        <input type="text" id="nome" placeholder="Seu nome">

        <button onclick="enviar()">Enviar</button>

        <p id="resposta"></p>
      </section>

    </main>

    <aside>
      <h3>Menu Lateral</h3>

      <img src="https://via.placeholder.com/150" alt="Imagem lateral">

      <p><span class="destaque">Dica:</span> Estude HTML todos os dias!</p>

      <ul>
        <li>Link 1</li>
        <li>Link 2</li>
      </ul>
    </aside>

  </div>

  <footer>
    <p>&copy; 2026 <span class="destaque">Meu Blog</span></p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
