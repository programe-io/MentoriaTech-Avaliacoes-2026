<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }

        header {
            background: #0078ff;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        button {
            background: #0078ff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #005ecc;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Minha Página HTML</h1>
    </header>

    <main>
        <h2>Bem-vindo!</h2>
        <p>Este é um exemplo simples de página HTML com CSS e JavaScript.</p>

        <button onclick="mostrarMensagem()">
            Clique aqui
        </button>
    </main>

    <script>
        function mostrarMensagem() {
            alert("Olá! Você clicou no botão.");
        }
    </script>

<script src="script.js"></script></body>
</html>
