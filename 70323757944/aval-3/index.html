
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Controle de IMC</h1>
        <p>Sistema de avaliação do Índice de Massa Corporal</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Cadastro do Paciente</h2>
            <p class="descricao">
                Preencha os dados abaixo para calcular o IMC.
            </p>

            <form id="formIMC">

                <div class="campo">
                    <label for="nome">Nome do paciente</label>
                    <input type="text" id="nome"
                    placeholder="Digite o nome completo" required>
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso"
                    placeholder="Ex: 65" step="0.1" min="0.1" required>
                </div>

                <div class="campo">
                    <label for="altura">Altura (metros)</label>
                    <input type="number" id="altura"
                    placeholder="Ex: 1.70" step="0.01" min="0.1" required>
                </div>

                <button type="submit">Calcular IMC</button>

            </form>

            <div id="resultado" class="resultado"></div>

        </section>

    </main>

    <footer>
        <p>Projeto Prático - Controle de IMC</p>
        <p>Desenvolvido com HTML, CSS e JavaScript</p>
    </footer>

    <script src="app.js"></script>

<script src="script.js"></script></body>
</html>
