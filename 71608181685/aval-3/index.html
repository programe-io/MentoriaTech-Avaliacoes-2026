<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de IMC</title>

    <link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <main>

        <h1>Ficha de Anamnese</h1>

        <!-- CARD DO FORMULÁRIO -->

        <section class="card">

            <h2>Cadastro de Paciente</h2>

            <form id="form-pessoa">

                <!-- NOME -->

                <div class="campo">

                    <label for="nome">Nome:</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome do paciente"
                        maxlength="50"
                        required
                    >

                </div>

                <!-- IDADE -->

                <div class="campo">

                    <label for="idade">Idade:</label>

                    <input
                        type="number"
                        id="idade"
                        placeholder="Digite a idade"
                        min="1"
                        max="120"
                        required
                    >

                </div>

                <!-- ALTURA -->

                <div class="campo">

                    <label for="altura">Altura (metros):</label>

                    <input
                        type="number"
                        id="altura"
                        placeholder="Exemplo: 1.70"
                        min="0.5"
                        max="2.5"
                        step="0.01"
                        required
                    >

                </div>

                <!-- PESO -->

                <div class="campo">

                    <label for="peso">Peso (KG):</label>

                    <input
                        type="number"
                        id="peso"
                        placeholder="Exemplo: 65"
                        min="2"
                        max="500"
                        step="0.1"
                        required
                    >

                </div>

                <!-- BOTÕES -->

                <div class="botoes">

                    <button type="submit">
                        Salvar
                    </button>

                    <button type="reset">
                        Cancelar
                    </button>

                </div>

                <!-- MENSAGEM DE ERRO -->

                <p id="erro" hidden></p>

            </form>

        </section>


        <!-- CARD DA TABELA -->

        <section class="card">

            <h2>Pacientes Cadastrados</h2>

            <div class="tabela-container">

                <table>

                    <thead>

                        <tr>

                            <th>Nome</th>

                            <th>Idade</th>

                            <th>Altura</th>

                            <th>Peso</th>

                            <th>IMC</th>

                            <th>Classificação</th>

                            <th>Ações</th>

                        </tr>

                    </thead>

                    <tbody id="tabela-pessoas">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- ARQUIVO JAVASCRIPT -->

    <script src="app.js"></script>

<script src="script.js"></script></body>

</html>
