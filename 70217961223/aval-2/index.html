
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="logo">
            <span>✓</span>
            <h2>TaskManager</h2>
        </div>
        <p>Organize suas tarefas</p>
    </header>

    <main>

        <section class="resumo">
            <div class="card">
                <span>Total de tarefas</span>
                <h2 id="totalTarefas">0</h2>
            </div>

            <div class="card">
                <span>Concluídas</span>
                <h2 id="concluidas">0</h2>
            </div>

            <div class="card">
                <span>Pendentes</span>
                <h2 id="pendentes">0</h2>
            </div>
        </section>

        <section class="container">

            <div class="formulario">
                <h2>Nova tarefa</h2>
                <p>Preencha os dados abaixo.</p>

                <form id="formTarefa">

                    <label for="titulo">Título da tarefa</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título da tarefa"
                        required
                    >

                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade" required>
                        <option value="1">1 - Alta</option>
                        <option value="2" selected>2 - Média</option>
                        <option value="3">3 - Baixa</option>
                    </select>

                    <button type="submit" id="btnCadastrar">
                        Cadastrar tarefa
                    </button>

                </form>
            </div>

            <div class="lista">
                <div class="cabecalho">
                    <div>
                        <h2>Minhas tarefas</h2>
                        <p>Gerencie suas atividades.</p>
                    </div>
                </div>

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar tarefa..."
                >

                <div id="listaTarefas"></div>

                <div id="mensagemVazia">
                    Nenhuma tarefa cadastrada.
                </div>
            </div>

        </section>

    </main>

    <footer>
        <p>TaskManager © 2026 - Gerenciador de Tarefas</p>
    </footer>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
