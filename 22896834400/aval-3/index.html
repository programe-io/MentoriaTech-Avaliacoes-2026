
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriGram</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>NutriGram</h1>
        <input type="text" placeholder="Pesquisar">
        </header>

        <main>

        <div class="stories">
            <div class="story">
                    <div class="foto">👤</div>
                            <p>Seu story</p>
                                </div>
                                    <div class="story">
                                            <div class="foto">🍎</div>
                                                    <p>Ana</p>
                                                        </div>
                                                            <div class="story">
                                                                    <div class="foto">🥗</div>
                                                                            <p>Pedro</p>
                                                                                </div>
                                                                                    <div class="story">
                                                                                            <div class="foto">💚</div>
                                                                                                    <p>Maria</p>
                                                                                                        </div>
                                                                                                        </div>

                                                                                                        <section class="criar">
                                                                                                            <h3>Criar publicação</h3>
                                                                                                                <input id="nome" placeholder="Seu nome">
                                                                                                                    <textarea id="texto" placeholder="O que você está pensando?"></textarea>
                                                                                                                        <input id="imagem" placeholder="URL da imagem (opcional)">
                                                                                                                            <button onclick="publicar()">Compartilhar</button>
                                                                                                                            </section>

                                                                                                                            <div id="feed">

                                                                                                                                <article class="post">
                                                                                                                                        <div class="usuario">🥗 Ana Nutri</div>
                                                                                                                                                <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=700" alt="Salada saudável">
                                                                                                                                                        <div class="acoes">
                                                                                                                                                                    <button onclick="curtir(this)">❤️ <span>10</span></button>
                                                                                                                                                                                <button onclick="focarComentario(this)">💬</button>
                                                                                                                                                                                            <button onclick="alert('Publicação salva!')">🔖</button>
                                                                                                                                                                                                    </div>
                                                                                                                                                                                                            <p><b>Ana Nutri</b> Alimentação colorida é cheia de possibilidades! 🥗</p>
                                                                                                                                                                                                                    <div class="comentarios"></div>
                                                                                                                                                                                                                            <input class="comentario" placeholder="Adicionar comentário...">
                                                                                                                                                                                                                                    <button onclick="comentar(this)">Enviar</button>
                                                                                                                                                                                                                                        </article>

                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                        </html>
