
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriSocial</title>
<link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>🥗 NutriSocial</h1>
        <p>Compartilhe saúde e conhecimento!</p>
        </header>

        <nav>
            <a href="#">Início</a>
                <a href="#publicar">Publicar</a>
                    <a href="#feed">Feed</a>
                    </nav>

                    <main>

                    <section id="publicar" class="criar-post">
                        <h2>Nova publicação</h2>
                            <input id="nome" type="text" placeholder="Seu nome">
                                <textarea id="mensagem" placeholder="Compartilhe uma dica de nutrição..."></textarea>
                                    <button onclick="publicar()">Publicar</button>
                                    </section>

                                    <section id="feed">
                                        <h2>Feed de publicações</h2>
                                            <div id="publicacoes">

                                                    <article class="post">
                                                                <h3>👩 Ana</h3>
                                                                            <p>Comer frutas variadas é uma ótima maneira de consumir vitaminas! 🍎</p>
                                                                                        <button onclick="curtir(this)">❤️ Curtir 0</button>
                                                                                                    <input placeholder="Escreva um comentário..." class="comentario">
                                                                                                                <button onclick="comentar(this)">Comentar</button>
                                                                                                                            <div class="comentarios"></div>
                                                                                                                                    </article>

                                                                                                                                            <article class="post">
                                                                                                                                                        <h3>👨 Pedro</h3>
                                                                                                                                                                    <p>Não esqueça de beber água durante o dia! 💧</p>
                                                                                                                                                                                <button onclick="curtir(this)">❤️ Curtir 0</button>
                                                                                                                                                                                            <input placeholder="Escreva um comentário..." class="comentario">
                                                                                                                                                                                                        <button onclick="comentar(this)">Comentar</button>
                                                                                                                                                                                                                    <div class="comentarios"></div>
                                                                                                                                                                                                                            </article>

                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                <footer>
                                                                                                                                                                                                                                    <p>NutriSocial © 2026</p>
                                                                                                                                                                                                                                        <p>Projeto Educacional de Nutrição</p>
                                                                                                                                                                                                                                        </footer>

                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                        </html>
