<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Instagram</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-100 text-slate-900">

    <!-- Cabeçalho -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <h1 class="text-xl font-semibold tracking-tight">Instagram</h1>
                <div class="flex items-center gap-4">
                    <button type="button" aria-label="Notificações" class="text-2xl text-slate-700 hover:text-slate-900">
                        <i class="bx bx-heart"></i>
                    </button>
                    <button type="button" aria-label="Menu" class="text-2xl text-slate-700 hover:text-slate-900">
                        <i class="bx bx-menu"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="max-w-5xl mx-auto px-4 py-4 pb-24">
        <div class="max-w-lg mx-auto space-y-4">

            <!-- Stories (6 itens) -->
            <section aria-label="Stories" class="bg-white border border-gray-200 rounded-lg p-4">
                <div class="flex items-center gap-4 overflow-x-auto">

                    <!-- 1. Adicionar story -->
                    <button type="button" class="flex flex-col items-center flex-shrink-0 group">
                        <div class="w-16 h-16 rounded-full p-0.5 bg-gray-200">
                            <div class="w-full h-full rounded-full p-0.5 bg-white">
                                <div class="w-full h-full rounded-full bg-gray-100 flex items-center justify-center">
                                    <span class="text-2xl leading-none text-gray-500">+</span>
                                </div>
                            </div>
                        </div>
                        <span class="text-xs mt-1.5 w-16 text-center truncate text-slate-700">Seu story</span>
                    </button>

                    <!-- 2. Story do usuário -->
                    <button type="button" class="flex flex-col items-center flex-shrink-0 group">
                        <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600">
                            <div class="w-full h-full rounded-full p-0.5 bg-white">
                                <img
                                    class="w-full h-full object-cover rounded-full"
                                    src="https://s2-ge.glbimg.com/GM3IVCVAe5XoScxJzd0ja5H55Yc=/0x0:1024x683/984x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_bc8228b6673f488aa253bbcb03c80ec5/internal_photos/bs/2024/w/h/F6VVFwTAiOyMk9sv3BXg/gettyimages-2177109845.jpg"
                                    alt="Breno"
                                >
                            </div>
                        </div>
                        <span class="text-xs mt-1.5 w-16 text-center truncate text-slate-700">Breno</span>
                    </button>

                    <!-- 3. Story duplicado -->
                    <button type="button" class="flex flex-col items-center flex-shrink-0 group">
                        <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600">
                            <div class="w-full h-full rounded-full p-0.5 bg-white">
                                <img
                                    class="w-full h-full object-cover rounded-full"
                                    src="https://s2-ge.glbimg.com/Fyizs4TMh2g-BpGytEFl3ycMDyQ=/0x0:1080x1037/600x0/smart/filters:gifv():strip_icc()/i.s3.glbimg.com/v1/AUTH_bc8228b6673f488aa253bbcb03c80ec5/internal_photos/bs/2023/u/k/AjEeCQSG2iPb2CVilrIg/405823091-18400114807034114-710207394337127994-n.jpg"
                                    alt="Avatar de yuri"
                                >
                            </div>
                        </div>
                        <span class="text-xs mt-1.5 w-16 text-center truncate text-slate-700">Breno</span>
                    </button>

                    <!-- 4. Story duplicado -->
                    <button type="button" class="flex flex-col items-center flex-shrink-0 group">
                        <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600">
                            <div class="w-full h-full rounded-full p-0.5 bg-white">
                                <img
                                    class="w-full h-full object-cover rounded-full"
                                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQ0oEuFkCWEANhNcJD-jTVCV0I-g93Tk3jknS9oxH2Bg&s=10"
                                    alt="Avatar de yuri"
                                >
                            </div>
                        </div>
                        <span class="text-xs mt-1.5 w-16 text-center truncate text-slate-700">Breno</span>
                    </button>

                    <!-- 5. Story duplicado -->
                    <button type="button" class="flex flex-col items-center flex-shrink-0 group">
                        <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600">
                            <div class="w-full h-full rounded-full p-0.5 bg-white">
                                <img
                                    class="w-full h-full object-cover rounded-full"
                                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8whzKGjU3fsIBIv5quGRAFlSp4gj_p-zv0tiQIYfDlQ&s=10"
                                    alt="Avatar de yuri"
                                >
                            </div>
                        </div>
                        <span class="text-xs mt-1.5 w-16 text-center truncate text-slate-700">Breno</span>
                    </button>

                    <!-- 6. Story duplicado -->
                    <button type="button" class="flex flex-col items-center flex-shrink-0 group">
                        <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600">
                            <div class="w-full h-full rounded-full p-0.5 bg-white">
                                <img
                                    class="w-full h-full object-cover rounded-full"
                                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRFdiOVP6rqYZR0c2Z3zJiuu6e2J3qLZe2iU6dkOq-nlQ&s=10"
                                    alt="Breno"
                                >
                            </div>
                        </div>
                        <span class="text-xs mt-1.5 w-16 text-center truncate text-slate-700">Breno</span>
                    </button>

                </div>
            </section>

            <!-- Feed -->
            <section aria-label="Feed de publicações" class="space-y-4">
                <article class="bg-white border border-gray-200 rounded-lg overflow-hidden">
                    <!-- Cabeçalho do post -->
                    <div class="flex items-center justify-between px-4 py-3">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full p-0.5 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600">
                                <img
                                    class="w-full h-full object-cover rounded-full border border-white"
                                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnskHm9N0z-03f-zkLr8J4rI8B36iEf40CZ8_2b_d5Wg&s=10"
                                    alt="Avatar de yuri"
                                >
                            </div>
                            <span class="text-sm font-semibold">Breno</span>
                        </div>
                        <button type="button" aria-label="Mais opções" class="text-xl text-slate-600">
                            <i class="bx bx-dots-horizontal-rounded"></i>
                        </button>
                    </div>

                    <!-- Imagem do post -->
                    <div class="aspect-square bg-gray-100">
                        <img
                            class="w-full h-full object-cover"
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFXJT4mtm_Ru3kP5pb0cFAJkHaV9CG1ZAOz5Z2lFH89w&s=10"
                            alt="Breno"
                        >
                    </div>

                    <!-- Ações e legenda -->
                    <div class="p-4 space-y-2">
                        <div class="flex items-center justify-between text-2xl">
                            <div class="flex items-center gap-4">
                                <button type="button" aria-label="Curtir" class="hover:text-pink-600">
                                    <i class="bx bx-heart"></i>
                                </button>
                                <button type="button" aria-label="Comentar" class="hover:text-slate-600">
                                    <i class="bx bx-message-rounded"></i>
                                </button>
                                <button type="button" aria-label="Compartilhar" class="hover:text-slate-600">
                                    <i class="bx bx-send"></i>
                                </button>
                            </div>
                            <button type="button" aria-label="Salvar" class="hover:text-slate-600">
                                <i class="bx bx-bookmark"></i>
                            </button>
                        </div>

                        <p class="text-sm font-semibold">128 curtidas</p>
                        <p class="text-sm">
                            <span class="font-semibold mr-1">Breno</span>
                            Primeira publicação do feed.
                        </p>
                    </div>
                </article>
            </section>

        </div>
    </main>

    <!-- Barra de navegação inferior -->
    <nav aria-label="Navegação principal" class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200">
        <div class="max-w-lg mx-auto h-14 px-6 flex items-center justify-between text-2xl">
            <button type="button" aria-label="Início"><i class="bx bx-home-alt"></i></button>
            <button type="button" aria-label="Buscar"><i class="bx bx-search"></i></button>
            <button type="button" aria-label="Nova publicação"><i class="bx bx-plus-circle"></i></button>
            <button type="button" aria-label="Reels"><i class="bx bx-movie-play"></i></button>
            <button type="button" aria-label="Perfil"><i class="bx bx-user"></i></button>
        </div>
    </nav>

</body>
</html>
