<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MiniFeed</title>
        <link rel="stylesheet" href="style.css">
    <link href="style.css" rel="stylesheet"></head>
    <body>

        <header>

            <div class="header-content">

                <h1>MiniFeed</h1>

                <nav>
                    <a href="http://">Inicio</a>
                    <a href="http://">Perfil</a>
                </nav>

            </div>

        </header>




        <main>

            <section class="new-post">

                <div class="user">

                    <div class="avatar">
                        J
                    </div>

                    <div>
                        <strong>Joao Pedro</strong>
                        <span>O que voce esta pensado?</span>
                    </div>
                    
                </div>

                    <button>Publicar</button>

            </section>

            <article class="post">

             <div class="post-header">

                <div class="avatar">
                        M
                    </div>

                    <div>
                        <strong>Maria</strong>
                        <span>Há 10 minutos</span>
                    </div>
                    
                </div>

             </div>

             <div class="post-text">
                Hoje será a final da Champions League, estou super animado!!


             </div>

             <img src="https://img.redbull.com/images/c_fill,g_auto,w_450,h_600/q_auto,f_auto/redbullcom/2017/09/12/95af9e88-7cdd-4741-91b2-4dae04d174a5/ta%C3%A7a-champions.jpg" alt="Imagem da taça da Champions">

             <div class="post-actions">

                    <button>Curtir</button>
                    <button>Comentar</button>

             </div>

            </article>


        </main>




        <footer>
            <p>MiniFeed - Todos os Direitos Reservados - 2026</p>
        </footer>
        
    </body>
</html>
