
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PH Social</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
                <body>

                <header>
                    <h1>PH Social</h1>
                        <input type="text" placeholder="Pesquisar">
                            <button>Entrar</button>
                            </header>

                            <main>
                                <section class="stories">
                                        <div class="story">
                                                    <img src="https://i.pravatar.cc/100?img=12">
                                                                <p>Seu story</p>
                                                                        </div>
                                                                                <div class="story">
                                                                                            <img src="https://i.pravatar.cc/100?img=5">
                                                                                                        <p>Lucas</p>
                                                                                                                </div>
                                                                                                                        <div class="story">
                                                                                                                                    <img src="https://i.pravatar.cc/100?img=9">
                                                                                                                                                <p>Maria</p>
                                                                                                                                                        </div>
                                                                                                                                                                <div class="story">
                                                                                                                                                                            <img src="https://i.pravatar.cc/100?img=15">
                                                                                                                                                                                        <p>Pedro</p>
                                                                                                                                                                                                </div>
                                                                                                                                                                                                    </section>

                                                                                                                                                                                                        <section class="feed">
                                                                                                                                                                                                                <article class="post">
                                                                                                                                                                                                                            <div class="user">
                                                                                                                                                                                                                                            <img src="https://i.pravatar.cc/100?img=12">
                                                                                                                                                                                                                                                            <strong>ph_user</strong>
                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                    <img class="photo"
                                                                                                                                                                                                                                                                                                     src="https://picsum.photos/id/1015/600/450">

                                                                                                                                                                                                                                                                                                                 <div class="actions">
                                                                                                                                                                                                                                                                                                                                 <button onclick="curtir(this)">♡ Curtir</button>
                                                                                                                                                                                                                                                                                                                                                 <button onclick="comentar()">Comentar</button>
                                                                                                                                                                                                                                                                                                                                                             </div>

                                                                                                                                                                                                                                                                                                                                                                         <p class="likes">120 curtidas</p>
                                                                                                                                                                                                                                                                                                                                                                                     <p><strong>ph_user</strong> Aproveitando o dia! 🌎</p>
                                                                                                                                                                                                                                                                                                                                                                                             </article>

                                                                                                                                                                                                                                                                                                                                                                                                     <article class="post">
                                                                                                                                                                                                                                                                                                                                                                                                                 <div class="user">
                                                                                                                                                                                                                                                                                                                                                                                                                                 <img src="https://i.pravatar.cc/100?img=5">
                                                                                                                                                                                                                                                                                                                                                                                                                                                 <strong>lucas_oficial</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                             </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                         <img class="photo"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          src="https://picsum.photos/id/1039/600/450">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button onclick="curtir(this)">♡ Curtir</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button onclick="comentar()">Comentar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <p class="likes">85 curtidas</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <p><strong>lucas_oficial</strong> Que lugar incrível!</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </article>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function curtir(botao) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (botao.innerText.includes("♡")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  botao.innerText = "♥ Curtido";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              botao.innerText = "♡ Curtir";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function comentar() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const comentario = prompt("Digite seu comentário:");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (comentario) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  alert("Comentário enviado: " + comentario);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </html>
