
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mini Feedback Social</title>
                <link rel="stylesheet" href="style.css">
                <link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>💬 Mini Feedback Social</h1>
                                    <p>Sua opinião é importante para nós!</p>
                                        </header>

                                            <main>
                                                    <section class="formulario">
                                                                <h2>Deixe seu feedback</h2>

                                                                            <form id="feedbackForm">
                                                                                            <input
                                                                                                                type="text"
                                                                                                                                    id="nome"
                                                                                                                                                        placeholder="Digite seu nome"
                                                                                                                                                                            required
                                                                                                                                                                                            >

                                                                                                                                                                                                            <textarea
                                                                                                                                                                                                                                id="mensagem"
                                                                                                                                                                                                                                                    placeholder="Escreva sua opinião..."
                                                                                                                                                                                                                                                                        required
                                                                                                                                                                                                                                                                                        ></textarea>

                                                                                                                                                                                                                                                                                                        <label for="nota">Sua avaliação:</label>

                                                                                                                                                                                                                                                                                                                        <select id="nota">
                                                                                                                                                                                                                                                                                                                                            <option value="5">⭐⭐⭐⭐⭐ - Excelente</option>
                                                                                                                                                                                                                                                                                                                                                                <option value="4">⭐⭐⭐⭐ - Muito bom</option>
                                                                                                                                                                                                                                                                                                                                                                                    <option value="3">⭐⭐⭐ - Bom</option>
                                                                                                                                                                                                                                                                                                                                                                                                        <option value="2">⭐⭐ - Regular</option>
                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="1">⭐ - Precisa melhorar</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                            </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button type="submit">Enviar feedback</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <section class="comentarios">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2>O que as pessoas estão dizendo?</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="listaFeedbacks"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>© 2026 - Mini Feedback Social</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>Desenvolvido por Marta Carvalho Vieira</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
