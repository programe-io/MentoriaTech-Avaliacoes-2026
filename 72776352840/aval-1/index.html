<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 200px 120px;
            gap: 10px;
            margin-bottom: 30px;
        }

        input,
        select,
        button {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        .mensagem {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .erro {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
        }

        .sucesso {
            display: block;
            background-color: #d4edda;
            color: #155724;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .prioridade-1 {
            color: #dc3545;
            font-weight: bold;
        }

        .prioridade-2 {
            color: #fd7e14;
            font-weight: bold;
        }

        .prioridade-3 {
            color: #28a745;
            font-weight: bold;
        }

        .concluida {
            text-decoration: line-through;
            color: #888;
        }

        .acoes {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .btn-concluir {
            background-color: #28a745;
        }

        .btn-concluir:hover {
            background-color: #1e7e34;
        }

        .btn-prioridade {
            background-color: #6f42c1;
        }

        .btn-prioridade:hover {
            background-color: #59339d;
        }

        @media (max-width: 700px) {
            .formulario {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>📋 Gerenciador de Tarefas</h1>

    <div id="mensagem" class="mensagem"></div>

    <div class="formulario">
        <input
            type="text"
            id="titulo"
            placeholder="Digite o título da tarefa"
        >

        <select id="prioridade">
            <option value="1">Prioridade 1 - Alta</option>
            <option value="2">Prioridade 2 - Média</option>
            <option value="3">Prioridade 3 - Baixa</option>
        </select>

        <button onclick="cadastrarTarefa()">
            Cadastrar
        </button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Tarefa</th>
                <th>Prioridade</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="listaTarefas">
        </tbody>
    </table>

</div>

<script>

    /* Array que vai guardar o conjunto de todas as tarefas */
    let tarefas = [];
    let geradorCodigo = 0;


    /* Valida os dados da tarefa */
    function validarDadosTarefa(titulo, prioridade) {

        if (titulo.length < 5) {
            throw new Error(
                'O título deve ter no mínimo 5 caracteres'
            );
        }

        if (prioridade < 1 || prioridade > 3) {
            throw new Error(
                'Informe uma prioridade entre 1 e 3'
            );
        }
    }


    /* Busca uma tarefa pelo código */
    function buscarTarefa(codigoTarefa) {

        const tarefaBuscada = tarefas.find(
            t => t.codigo === codigoTarefa
        );

        if (!tarefaBuscada) {
            throw new Error(
                'Código de tarefa não encontrado'
            );
        }

        return tarefaBuscada;
    }


    /* Cadastra uma nova tarefa */
    function cadastrarTarefa() {

        try {

            const titulo = document
                .getElementById('titulo')
                .value
                .trim();

            const prioridade = Number(
                document.getElementById('prioridade').value
            );

            validarDadosTarefa(titulo, prioridade);

            let tarefa = {
                codigo: ++geradorCodigo,
                titulo: titulo,
                prioridade: prioridade,
                status: true
            };

            tarefas.push(tarefa);

            document.getElementById('titulo').value = '';

            mostrarMensagem(
                'Tarefa cadastrada com sucesso!',
                'sucesso'
            );

            listarTarefas();

        } catch (erro) {

            mostrarMensagem(
                erro.message,
                'erro'
            );
        }
    }


    /* Retorna todas as tarefas */
    function listarTarefas() {

        const tabela = document.getElementById(
            'listaTarefas'
        );

        tabela.innerHTML = '';

        tarefas.forEach(tarefa => {

            const linha = document.createElement('tr');

            const prioridadeTexto =
                tarefa.prioridade === 1
                    ? 'Alta'
                    : tarefa.prioridade === 2
                        ? 'Média'
                        : 'Baixa';

            const classePrioridade =
                `prioridade-${tarefa.prioridade}`;

            linha.innerHTML = `
                <td>${tarefa.codigo}</td>

                <td class="${tarefa.status ? '' : 'concluida'}">
                    ${tarefa.titulo}
                </td>

                <td class="${classePrioridade}">
                    ${prioridadeTexto}
                </td>

                <td>
                    ${
                        tarefa.status
                            ? '⏳ Pendente'
                            : '✅ Concluída'
                    }
                </td>

                <td>
                    <div class="acoes">

                        ${
                            tarefa.status
                            ? `
                                <button
                                    class="btn-concluir"
                                    onclick="concluirTarefa(${tarefa.codigo})"
                                >
                                    Concluir
                                </button>
                            `
                            : ''
                        }

                        <button
                            class="btn-prioridade"
                            onclick="alterarPrioridade(${tarefa.codigo})"
                        >
                            Prioridade
                        </button>

                    </div>
                </td>
            `;

            tabela.appendChild(linha);
        });

        return tarefas;
    }


    /* Conclui uma tarefa */
    function concluirTarefa(codigo) {

        try {

            let tarefa = buscarTarefa(codigo);

            if (tarefa.status === false) {
                throw new Error(
                    'Tarefa já estava como concluída'
                );
            }

            tarefa.status = false;

            mostrarMensagem(
                'Tarefa concluída com sucesso!',
                'sucesso'
            );

            listarTarefas();

        } catch (erro) {

            mostrarMensagem(
                erro.message,
                'erro'
            );
        }
    }


    /* Altera a prioridade da tarefa */
    function alterarPrioridade(codigo) {

        try {

            let tarefa = buscarTarefa(codigo);

            const novaPrioridade = Number(
                prompt(
                    'Informe a nova prioridade (1, 2 ou 3):'
                )
            );

            validarDadosTarefa(
                tarefa.titulo,
                novaPrioridade
            );

            tarefa.prioridade = novaPrioridade;

            mostrarMensagem(
                'Prioridade alterada com sucesso!',
                'sucesso'
            );

            listarTarefas();

        } catch (erro) {

            mostrarMensagem(
                erro.message,
                'erro'
            );
        }
    }


    /* Exibe mensagens na tela */
    function mostrarMensagem(texto, tipo) {

        const mensagem =
            document.getElementById('mensagem');

        mensagem.textContent = texto;

        mensagem.className =
            `mensagem ${tipo}`;

        setTimeout(() => {
            mensagem.className = 'mensagem';
        }, 3000);
    }


    /*
        Exemplo inicial do código original:
        cadastrarTarefa('Cadastrar Clientes', 1);
        alterarPrioridade(1, 2);
    */

    tarefas.push({
        codigo: ++geradorCodigo,
        titulo: 'Cadastrar Clientes',
        prioridade: 1,
        status: true
    });

    listarTarefas();

</script>

<script src="script.js"></script></body>
</html>
