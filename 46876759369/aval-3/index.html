<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Instagram</title>

    <style>
        body {
            margin: 0;
            background: #fafafa;
            font-family: Arial, sans-serif;
        }

        header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        header h1 {
            font-family: Georgia, serif;
        }

        .stories {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            overflow-x: auto;
        }

        .story {
            text-align: center;
        }

        .story img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #e1306c;
        }

        .post {
            background: white;
            max-width: 450px;
            margin: 20px auto;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .usuario {
            padding: 15px;
            font-weight: bold;
        }

        .post img {
            width: 100%;
        }

        .botoes {
            padding: 15px;
        }

        button {
            border: none;
            background: none;
            font-size: 25px;
            cursor: pointer;
        }

        .legenda {
            padding: 0 15px 15px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Instagram</h1>
    </header>

    <div class="stories">

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=12">
            <p>Seu story</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=32">
            <p>Maria</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=5">
            <p>Pedro</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/100?img=44">
            <p>Julia</p>
        </div>

    </div>

    <div class="post">

        <div class="usuario">
            👤 enzo_oficial
        </div>

        <img src="https://picsum.photos/600/450"
             alt="Foto da publicação">

        <div class="botoes">

            <button onclick="curtir()">❤️</button>
            <button onclick="comentar()">💬</button>
            <button>📤</button>

            <p id="curtidas">0 curtidas</p>

        </div>

        <div class="legenda">
            <strong>enzo_oficial</strong>
            Aproveitando a vida! 😎🔥
        </div>

    </div>

    <script>
        let likes = 0;

        function curtir() {
            likes++;
            document.getElementById("curtidas").innerText =
                likes + " curtidas";
        }

        function comentar() {
            let comentario = prompt("Digite seu comentário:");

            if (comentario) {
                alert("Comentário publicado: " + comentario);
            }
        }
    </script>

<script src="script.js"></script></body>
</html>
