<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog da Valeria</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffeef5;
            color: #333;
        }

        header {
            background-color: #e91e63;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            background-color: #c2185b;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .post {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px #ccc;
        }

        .post h2 {
            color: #e91e63;
        }

        .post img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        footer {
            background-color: #e91e63;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🌸 Blog da Valeria 🌸</h1>
        <p>Um cantinho para compartilhar ideias, histórias e momentos!</p>
    </header>

    <nav>
        <a href="#">Início</a>

    </nav>

            </p>
        </article>
