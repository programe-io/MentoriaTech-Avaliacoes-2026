<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurioFeed - A Rede das Curiosidades</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <h1>⚡ Curio<span>Feed</span></h1>
            <span class="subtitle">Fatos rápidos em tempo real</span>
        </div>
    </header>

    <main class="container feed-layout">
        
        <!-- Caixa para postar nova curiosidade -->
        <section class="composer-card">
            <div class="composer-header">
                <img src="https://dicebear.com" alt="Seu Avatar" class="avatar">
                <textarea id="post-text" rows="3" placeholder="Sabe de alguma curiosidade incrível? Compartilhe aqui..."></textarea>
            </div>
            <div class="composer-footer">
                <select id="post-category">
                    <option value="Ciência">🔬 Ciência</option>
                    <option value="História">🏛️ História</option>
                    <option value="Natureza">🌿 Natureza</option>
                    <option value="Aleatório">🎲 Aleatório</option>
                </select>
                <button id="publish-btn">Publicar Fato</button>
            </div>
        </section>

        <!-- Abas de Filtro -->
        <nav class="feed-tabs">
            <button class="tab active" data-filter="todos">Para Você</button>
            <button class="tab" data-filter="Ciência">Ciência</button>
            <button class="tab" data-filter="História">História</button>
            <button class="tab" data-filter="Natureza">Natureza</button>
            <button class="tab" data-filter="curtidos">❤️ Curtidos</button>
        </nav>

        <!-- Lista de Posts (Feed) -->
        <section id="feed-container" class="feed-list"></section>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
