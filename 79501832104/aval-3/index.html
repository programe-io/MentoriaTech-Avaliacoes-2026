<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurioGram - Curiosidades em Fotos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Barra Superior -->
    <header class="navbar">
        <div class="nav-container">
            <h1 class="logo">CurioGram</h1>
            <div class="nav-actions">
                <button id="open-create-modal" class="icon-btn" title="Nova Curiosidade">➕</button>
                <button id="filter-saved-btn" class="icon-btn" title="Ver Salvos">🔖</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- Barra de Stories (Fatos Rápidos) -->
        <section class="stories-bar" id="stories-bar"></section>

        <!-- Feed de Publicações -->
        <section class="feed" id="feed"></section>
    </main>

    <!-- Modal de Visualização de Story -->
    <div id="story-modal" class="modal story-overlay">
        <div class="story-viewer">
            <div class="story-progress"><div id="story-bar-fill" class="story-fill"></div></div>
            <div class="story-header">
                <span id="story-user"></span>
                <button id="close-story" class="close-story-btn">&times;</button>
            </div>
            <img id="story-img" src="" alt="Story">
            <div class="story-caption" id="story-text"></div>
        </div>
    </div>

    <!-- Modal para Criar Nova Publicação -->
    <div id="create-modal" class="modal">
        <div class="create-box">
            <div class="create-header">
                <h3>Nova Curiosidade</h3>
                <span id="close-create" class="close-btn">&times;</span>
            </div>
            <form id="create-form">
                <input type="url" id="new-img" placeholder="Cole o link de uma imagem (URL)..." required>
                <input type="text" id="new-location" placeholder="Local ou Categoria (ex: Espaço, Egito...)" required>
                <textarea id="new-caption" rows="3" placeholder="Escreva a curiosidade aqui..." required></textarea>
                <button type="submit" class="submit-btn">Compartilhar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
