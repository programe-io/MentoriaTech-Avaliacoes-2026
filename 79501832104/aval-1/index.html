<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BichoCurioso - Segredos do Reino Animal</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <div class="container">
            <h1>🌿 Bicho<span>Curioso</span></h1>
            <p>Fatos incríveis sobre as criaturas mais fascinantes da Terra</p>
        </div>
    </header>

    <main class="container">
        <div class="controls">
            <input type="text" id="search" placeholder="Buscar animal...">
            <div class="filters">
                <button class="btn active" data-cat="todos">Todos</button>
                <button class="btn" data-cat="oceanos">Oceanos</button>
                <button class="btn" data-cat="insetos">Insetos</button>
                <button class="btn" data-cat="mamiferos">Mamíferos</button>
            </div>
        </div>

        <section id="grid" class="grid"></section>
    </main>

    <div id="modal" class="modal">
        <div class="modal-box">
            <span class="close">&times;</span>
            <span id="m-cat" class="tag"></span>
            <h2 id="m-title"></h2>
            <img id="m-img" src="" alt="">
            <p id="m-text"></p>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
