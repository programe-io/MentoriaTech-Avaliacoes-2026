
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <title>Sistema de Estoque</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
        <body>
            <h1>Sistema de Estoque</h1>

                <h2>Cadastrar Produto</h2>

                    <input id="codigo" type="number"
                            placeholder="Código"><br><br>

                                <input id="descricao" type="text"
                                        placeholder="Descrição"><br><br>

                                            <input id="quantidade" type="number"
                                                    placeholder="Quantidade"><br><br>

                                                        <input id="valor" type="number"
                                                                placeholder="Valor" step="0.01"><br><br>

                                                                    <button onclick="cadastrar()">Cadastrar</button>

                                                                        <h2>Produtos Cadastrados</h2>

                                                                            <button onclick="listar()">Listar Produtos</button>

                                                                                <div id="lista"></div>

                                                                                    <script>
                                                                                            let produtos = [];

                                                                                                    function cadastrar() {
                                                                                                                let codigo = Number(
                                                                                                                                document.getElementById("codigo").value
                                                                                                                                            );

                                                                                                                                                        let descricao =
                                                                                                                                                                        document.getElementById("descricao").value;

                                                                                                                                                                                    let quantidade = Number(
                                                                                                                                                                                                    document.getElementById("quantidade").value
                                                                                                                                                                                                                );

                                                                                                                                                                                                                            let valor = Number(
                                                                                                                                                                                                                                            document.getElementById("valor").value
                                                                                                                                                                                                                                                        );

                                                                                                                                                                                                                                                                    if (!codigo || !descricao ||
                                                                                                                                                                                                                                                                                    quantidade < 0 || valor < 0) {
                                                                                                                                                                                                                                                                                                    alert("Preencha todos os campos corretamente!");
                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                            if (produtos.some(p => p.codigo === codigo)) {
                                                                                                                                                                                                                                                                                                                                                            alert("Código já cadastrado!");
                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                    produtos.push({
                                                                                                                                                                                                                                                                                                                                                                                                                    codigo,
                                                                                                                                                                                                                                                                                                                                                                                                                                    descricao,
                                                                                                                                                                                                                                                                                                                                                                                                                                                    quantidade,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    valor
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alert("Produto cadastrado!");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("codigo").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("descricao").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("quantidade").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("valor").value = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        listar();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function listar() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let lista = document.getElementById("lista");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                lista.innerHTML = "<h3>Lista de Produtos</h3>";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            produtos.forEach(p => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            lista.innerHTML += `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Código: ${p.codigo}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Descrição: ${p.descricao}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Quantidade: ${p.quantidade}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Valor: R$ ${p.valor.toFixed(2)}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="alterarValor(${p.codigo})">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Alterar Valor
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="alterarQuantidade(${p.codigo})">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Alterar Quantidade
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <hr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function alterarValor(codigo) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let produto = produtos.find(p => p.codigo === codigo);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let novoValor = prompt("Digite o novo valor:");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (novoValor !== null && novoValor.trim() !== "" &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Number(novoValor) >= 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                produto.valor = Number(novoValor);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                listar();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alert("Valor inválido!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function alterarQuantidade(codigo) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let produto = produtos.find(p => p.codigo === codigo);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let novaQuantidade = prompt("Digite a nova quantidade:");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (novaQuantidade !== null &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            novaQuantidade.trim() !== "" &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Number(novaQuantidade) >= 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            produto.quantidade = Number(novaQuantidade);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            listar();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        alert("Quantidade inválida!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
