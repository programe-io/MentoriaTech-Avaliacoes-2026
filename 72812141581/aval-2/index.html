
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .tarefa {
            background: #eeeeee;
            padding: 12px;
            margin-top: 10px;
            border-radius: 5px;
        }

        .concluida {
            background-color: #c8f7c5;
        }

        .acoes {
            display: flex;
            gap: 10px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Gerenciador de Tarefas</h1>

    <h3>Cadastrar nova tarefa</h3>

    <input type="text" id="titulo"
        placeholder="Digite o título da tarefa">

    <select id="prioridade">
        <option value="1">1 - Alta</option>
        <option value="2">2 - Média</option>
        <option value="3">3 - Baixa</option>
    </select>

    <button onclick="cadastrarTarefa()">
        Cadastrar Tarefa
    </button>

    <h3>Lista de tarefas</h3>

    <div id="listaTarefas"></div>

</div>

<script>

    // Lista que armazena as tarefas
    let tarefas = [];

    // Variável para gerar códigos
    let proximoCodigo = 1;

    // Cadastrar uma nova tarefa
    function cadastrarTarefa() {

        let titulo = document.getElementById("titulo").value;
        let prioridade = Number(
            document.getElementById("prioridade").value
        );

        // Validar título
        if (titulo.trim().length < 5) {
            alert("O título deve ter no mínimo 5 caracteres!");
            return;
        }

        // Validar prioridade
        if (prioridade < 1 || prioridade > 3) {
            alert("A prioridade deve ser entre 1 e 3!");
            return;
        }

        // Criar objeto da tarefa
        let tarefa = {
            codigo: proximoCodigo,
            titulo: titulo,
            prioridade: prioridade,
            concluida: false
        };

        // Adicionar tarefa na lista
        tarefas.push(tarefa);

        proximoCodigo++;

        document.getElementById("titulo").value = "";

        alert("Tarefa cadastrada com sucesso!");

        listarTarefas();
    }

    // Listar todas as tarefas
    function listarTarefas() {

        let lista = document.getElementById("listaTarefas");

        lista.innerHTML = "";

        tarefas.forEach(function(tarefa) {

            let status = tarefa.concluida
                ? "Concluída"
                : "Pendente";

            let classe = tarefa.concluida
                ? "concluida"
                : "";

            lista.innerHTML += `
                <div class="tarefa ${classe}">

                    <strong>Código:</strong> ${tarefa.codigo}<br>

                    <strong>Título:</strong> ${tarefa.titulo}<br>

                    <strong>Prioridade:</strong> ${tarefa.prioridade}<br>

                    <strong>Status:</strong> ${status}<br>

                    <div class="acoes">

                        <button onclick="concluirTarefa(${tarefa.codigo})">
                            Concluir
                        </button>

                        <button onclick="alterarPrioridade(${tarefa.codigo})">
                            Alterar Prioridade
                        </button>

                    </div>

                </div>
            `;

        });
    }

    // Marcar tarefa como concluída
    function concluirTarefa(codigo) {

        let tarefa = tarefas.find(function(item) {
            return item.codigo === codigo;
        });

        if (tarefa) {

            tarefa.concluida = true;

            alert("Tarefa concluída com sucesso!");

            listarTarefas();
        }
    }

    // Alterar prioridade da tarefa
    function alterarPrioridade(codigo) {

        let tarefa = tarefas.find(function(item) {
            return item.codigo === codigo;
        });

        if (tarefa) {

            let novaPrioridade = Number(
                prompt("Digite a nova prioridade (1, 2 ou 3):")
            );

            if (
                !Number.isInteger(novaPrioridade) ||
                novaPrioridade < 1 ||
                novaPrioridade > 3
            ) {
                alert("Prioridade inválida! Digite 1, 2 ou 3.");
                return;
            }

            tarefa.prioridade = novaPrioridade;

            alert("Prioridade alterada com sucesso!");

            listarTarefas();
        }
    }

</script>

</body>
</html>
