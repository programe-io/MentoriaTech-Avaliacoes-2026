<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed de Gostos</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
    
    <header>
        <div class="header-content">
            <h1>Feed de Gostos</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Meu Perfil</a>
            </nav>
        </div>
    </header>


    <main>
        <section class="new-post">
            <div class="user">
                <div class="Avatar">
                    v I  <!-- Inicial do nome do aluno -->
                </div>
                <div>
                    <strong>victor </strong>
                    <span>Recomende algo legal para seus amigos!</span>
                </div>
            </div>
            <button>Postar</button>
        </section>

        <article class="post">
            <div class="post-header">
                <div class="Avatar">
                     v 
                </div>
                <div>
                    <strong> victor </strong>
                    <span>Há 5 minutos</span>
                </div>
            </div>

            <div class="post-text">
                futebol 
            </div>

            <img src="https://www.estadao.com.br/resizer/v2/FJSZ5SCE3NAC3LFF72D63HPA34.jpeg?quality=80&auth=1b28e84d3dfba9e054a312d2421fae317bc38fc2de1990af1fb25588c1c70d5f&width=380_DA_RECOMENDACAO ❌" alt="Imagem da indicação">

            <div class="Post-Action">
                <button>Curtir ❤️</button>
                <button>Comentar 💬</button>
            </div>
        </article>
    </main>

    <footer>
        <p>Feed de Gostos - Todos os direitos reservados - 2026</p>            
    </footer>

</body>
</html>
