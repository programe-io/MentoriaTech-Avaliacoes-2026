
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Controle de IMC</title>

                <style>
                        body {
                                    font-family: Arial, sans-serif;
                                                background-color: #e8f0f8;
                                                            display: flex;
                                                                        justify-content: center;
                                                                                    align-items: center;
                                                                                                min-height: 100vh;
                                                                                                        }

                                                                                                                .container {
                                                                                                                            background-color: white;
                                                                                                                                        padding: 30px;
                                                                                                                                                    border-radius: 15px;
                                                                                                                                                                box-shadow: 0 0 10px #aaa;
                                                                                                                                                                            width: 320px;
                                                                                                                                                                                        text-align: center;
                                                                                                                                                                                                }

                                                                                                                                                                                                        h1 {
                                                                                                                                                                                                                    color: #2563eb;
                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                    input {
                                                                                                                                                                                                                                                width: 90%;
                                                                                                                                                                                                                                                            padding: 10px;
                                                                                                                                                                                                                                                                        margin: 8px;
                                                                                                                                                                                                                                                                                    border: 1px solid #ccc;
                                                                                                                                                                                                                                                                                                border-radius: 8px;
                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                button {
                                                                                                                                                                                                                                                                                                                            background-color: #2563eb;
                                                                                                                                                                                                                                                                                                                                        color: white;
                                                                                                                                                                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                                                                                                                                                                                padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                            border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                        cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                margin-top: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                button:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                            background-color: #1d4ed8;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                            #resultado {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h1>Controle de IMC</h1>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="text" id="nome" placeholder="Nome do paciente">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="number" id="peso" placeholder="Peso (kg)" step="0.1">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="number" id="altura" placeholder="Altura (m)" step="0.01">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="calcularIMC()">Calcular IMC</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="resultado"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function calcularIMC() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let nome = document.getElementById("nome").value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let peso = parseFloat(document.getElementById("peso").value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let altura = parseFloat(document.getElementById("altura").value);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (nome === "" || isNaN(peso) || isNaN(altura) || peso <= 0 || altura <= 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert("Preencha todos os campos corretamente!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let imc = peso / (altura * altura);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let classificacao;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (imc < 18.5) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    classificacao = "Abaixo do peso";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else if (imc < 25) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                classificacao = "Peso normal";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else if (imc < 30) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            classificacao = "Sobrepeso";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        classificacao = "Obesidade";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("resultado").innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "<p>Paciente: " + nome + "</p>" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "<p>Peso: " + peso + " kg</p>" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "<p>Altura: " + altura + " m</p>" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "<p>IMC: " + imc.toFixed(2) + "</p>" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "<p>Classificação: " + classificacao + "</p>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
