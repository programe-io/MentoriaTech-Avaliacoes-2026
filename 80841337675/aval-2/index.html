<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Rede Social - Lamine Yamal</title>
                <!-- Vincula o arquivo CSS separado -->
                    <link rel="stylesheet" href="style.css">
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                    <body>

                        <!-- Barra de Navegação Superior -->
                            <header id="main-header">
                                    <div class="header-container">
                                                <a href="#" class="header-logo">BarçaGram</a>
                                                            <button class="header-button">Entrar</button>
                                                                    </div>
                                                                        </header>

                                                                            <!-- Conteúdo Principal da Página -->
                                                                                <main id="main-content">
                                                                                        
                                                                                                <!-- Cabeçalho do Perfil (Foto e Informações) -->
                                                                                                        <section class="profile-section">
                                                                                                                    <div class="profile-image-box">
                                                                                                                                    <img src="https://unsplash.com" alt="Foto de Lamine Yamal" class="profile-image">
                                                                                                                                                </div>
                                                                                                                                                            
                                                                                                                                                                        <div class="profile-details">
                                                                                                                                                                                        <div class="profile-title-container">
                                                                                                                                                                                                            <h1 class="profile-username">lamineyamal</h1>
                                                                                                                                                                                                                                <button class="profile-btn-follow">Seguir</button>
                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                <ul class="profile-stats-list">
                                                                                                                                                                                                                                                                                                    <li><span class="profile-stats-count">42</span> publicações</li>
                                                                                                                                                                                                                                                                                                                        <li><span class="profile-stats-count">22.5M</span> seguidores</li>
                                                                                                                                                                                                                                                                                                                                            <li><span class="profile-stats-count">180</span> seguindo</li>
                                                                                                                                                                                                                                                                                                                                                            </ul>
                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                            <div class="profile-bio-box">
                                                                                                                                                                                                                                                                                                                                                                                                                <p class="profile-full-name">Lamine Yamal</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>⚽ Atleta do @fcbarcelona e da @sefutbol</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>🏆 Campeão da Eurocopa</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>Visca el Barça! 🔵🔴</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- Grade de Fotos (Feed de Publicações) -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <section class="posts-grid">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="post-item"><img src="https://unsplash.com" alt="Foto 1" class="post-image"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="post-item"><img src="https://unsplash.com" alt="Foto 2" class="post-image"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="post-item"><img src="https://unsplash.com" alt="Foto 3" class="post-image"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="post-item"><img src="https://unsplash.com" alt="Foto 4" class="post-image"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="post-item"><img src="https://unsplash.com" alt="Foto 5" class="post-image"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="post-item"><img src="https://unsplash.com" alt="Foto 6" class="post-image"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
