<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Sistema de Estoque</h1>

        <h2>Cadastrar Produto</h2>

        <input id="codigo" type="number" placeholder="Código">
        <input id="descricao" type="text" placeholder="Descrição">
        <input id="quantidade" type="number" placeholder="Quantidade">
        <input id="valor" type="number" placeholder="Valor">

        <button onclick="cadastrar()">Cadastrar</button>

        <h2>Produtos Cadastrados</h2>

        <table>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
            </tr>

            <tbody id="produtos"></tbody>
        </table>

        <h2>Alterar Produto</h2>

        <input id="codigoAlterar" type="number" placeholder="Código">

        <input id="novoValor" type="number" placeholder="Novo valor">
        <button onclick="alterarValor()">Alterar Valor</button>

        <input id="novaQuantidade" type="number" placeholder="Nova quantidade">
        <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
