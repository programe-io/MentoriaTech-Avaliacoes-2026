<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de IMC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #93c5fd);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #1d4ed8;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background: #eff6ff;
            border-radius: 10px;
            display: none;
        }

        .imc {
            font-size: 25px;
            color: #1d4ed8;
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1>Controle de IMC</h1>

        <p>Preencha os dados do paciente:</p>

        <input type="text" id="nome" placeholder="Nome do paciente">

        <input type="number" id="peso" placeholder="Peso (kg)" step="any">

        <input type="number" id="altura" placeholder="Altura (m)" step="any">

        <button onclick="calcularIMC()">Calcular IMC</button>

        <div id="resultado"></div>

    </div>

    <script>
        function calcularIMC() {

            let nome = document.getElementById("nome").value;
            let peso = parseFloat(document.getElementById("peso").value);
            let altura = parseFloat(document.getElementById("altura").value);

            if (nome.trim() === "" || isNaN(peso) ||
                isNaN(altura) || peso <= 0 || altura <= 0) {

                alert("Preencha todos os campos corretamente!");
                return;
            }

            let imc = peso / (altura * altura);

            let classificacao;

            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            } 
            else if (imc < 25) {
                classificacao = "Peso normal";
            } 
            else if (imc < 30) {
                classificacao = "Sobrepeso";
            } 
            else if (imc < 35) {
                classificacao = "Obesidade grau I";
            } 
            else if (imc < 40) {
                classificacao = "Obesidade grau II";
            } 
            else {
                classificacao = "Obesidade grau III";
            }

            let resultado = document.getElementById("resultado");

            resultado.style.display = "block";

            resultado.innerHTML = `
                <h2>Resultado do Paciente</h2>

                <p><strong>Nome:</strong> ${nome}</p>

                <p><strong>Peso:</strong> ${peso} kg</p>

                <p><strong>Altura:</strong> ${altura} m</p>

                <p>Seu IMC é:</p>

                <div class="imc">${imc.toFixed(2)}</div>

                <p><strong>Classificação:</strong></p>

                <h3>${classificacao}</h3>
            `;
        }
    </script>

</body>
</html>
