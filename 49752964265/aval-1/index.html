<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <header>
            <h1>Cadastro de Produtos</h1>
            <p>Gerencie os produtos do seu estoque</p>
        </header>

        <main>

            <section class="form-section">
                <h2>Cadastrar Produto</h2>

                <form id="produtoForm">

                    <input type="hidden" id="produtoId">

                    <div class="campo">
                        <label for="nome">Nome do produto</label>
                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite o nome do produto"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" required>
                            <option value="">Selecione uma categoria</option>
                            <option value="Eletrônicos">Eletrônicos</option>
                            <option value="Informática">Informática</option>
                            <option value="Móveis">Móveis</option>
                            <option value="Roupas">Roupas</option>
                            <option value="Alimentos">Alimentos</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div class="linha">

                        <div class="campo">
                            <label for="preco">Preço</label>
                            <input
                                type="number"
                                id="preco"
                                placeholder="0,00"
                                min="0"
                                step="0.01"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="quantidade">Quantidade</label>
                            <input
                                type="number"
                                id="quantidade"
                                placeholder="0"
                                min="0"
                                required
                            >
                        </div>

                    </div>

                    <div class="botoes">
                        <button type="submit" id="btnSalvar">
                            Cadastrar Produto
                        </button>

                        <button
                            type="button"
                            id="btnCancelar"
                            class="btn-cancelar"
                            onclick="cancelarEdicao()"
                        >
                            Cancelar
                        </button>
                    </div>

                </form>
            </section>


            <section class="lista-section">

                <div class="topo-lista">
                    <div>
                        <h2>Produtos cadastrados</h2>
                        <span id="contador">0 produtos</span>
                    </div>

                    <input
                        type="text"
                        id="pesquisa"
                        placeholder="Pesquisar produto..."
                    >
                </div>


                <div class="resumo">

                    <div class="card-resumo">
                        <span>Total de produtos</span>
                        <strong id="totalProdutos">0</strong>
                    </div>

                    <div class="card-resumo">
                        <span>Total em estoque</span>
                        <strong id="totalEstoque">0</strong>
                    </div>

                    <div class="card-resumo">
                        <span>Valor do estoque</span>
                        <strong id="valorEstoque">R$ 0,00</strong>
                    </div>

                </div>


                <div class="tabela-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Categoria</th>
                                <th>Preço</th>
                                <th>Quantidade</th>
                                <th>Total</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="listaProdutos">
                        </tbody>

                    </table>

                    <div id="mensagemVazia" class="mensagem-vazia">
                        Nenhum produto cadastrado.
                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
