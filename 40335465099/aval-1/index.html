<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h2>Cadastrar Produto</h2>
        
        <!-- Mensagem de erro/sucesso -->
        <div id="mensagem" class="mensagem hidden"></div>

        <!-- Formulário de Cadastro -->
        <form id="form-produto">
            <div class="campo">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" placeholder="Ex: Cadeira gamer Husky" required>
            </div>

            <div class="campo-grupo">
                <div class="campo">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" min="1" placeholder="Ex: 10" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$):</label>
                    <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 699.00" required>
                </div>
            </div>

            <button type="submit">Cadastrar Produto</button>
        </form>

        <h2>Lista de Produtos</h2>
        
        <!-- Tabela para listar os produtos -->
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th>Valor Unitário</th>
                </tr>
            </thead>
            <tbody id="tabela-produtos">
                <!-- Os produtos serão inseridos aqui pelo JavaScript -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
