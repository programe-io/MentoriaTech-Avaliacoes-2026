<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha de Anamnese - Controle de IMC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main>
    <h1>Ficha de Anamnese</h1>
    <p class="sub">Controle de IMC dos pacientes</p>

    <form id="form-pessoa" novalidate>
      <label>Nome
        <input id="nome" type="text" placeholder="Ex.: Francisco" autocomplete="off">
      </label>
      <label>Idade
        <input id="idade" type="number" placeholder="30">
      </label>
      <label>Altura (m)
        <input id="altura" type="number" step="0.01" placeholder="1.70">
      </label>
      <label>Peso (kg)
        <input id="peso" type="number" step="0.1" placeholder="65">
      </label>
      <button type="submit">Salvar</button>
    </form>

    <p id="erro" role="alert" hidden></p>

    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th>Nome</th><th>Idade</th><th>Altura</th><th>Peso</th>
            <th>IMC</th><th>Classificação</th><th>Ação</th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
      <p id="vazio">Nenhum paciente cadastrado. Preencha o formulário acima.</p>
    </div>
  </main>
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
