<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast CETI Paulo Freire</title>

  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="podcast-card">

    <div class="banner">
      <div class="overlay">
        <h1>Podcast Escolar</h1>
      </div>
    </div>

    <div class="content">
      <h2>CETI Paulo Freire</h2>

      <p>
        Bem-vindo ao podcast oficial do CETI Paulo Freire.
        Aqui compartilhamos entrevistas, projetos e novidades da escola.
      </p>

      <audio id="audio" controls>
        <source src="podcast.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
      </audio>

      <div class="controls">
        <button class="play" onclick="tocar()">▶ Tocar</button>
        <button class="pause" onclick="pausar()">⏸ Pausar</button>
      </div>

      <footer>
        Desenvolvido para o CETI Paulo Freire 🎙️
      </footer>
    </div>

  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
