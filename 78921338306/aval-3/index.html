
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp da Fernanda</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="whatsapp">

    <!-- MENU DE CONTATOS -->
    <aside class="sidebar">

        <header class="topo">
            <h2>WhatsApp</h2>
            <span>✉　⋮</span>
        </header>

        <div class="perfil">
            <div class="avatar fernanda">F</div>
            <div>
                <strong>Fernanda</strong>
                <p>Meu WhatsApp 💚</p>
            </div>
        </div>

        <div class="pesquisa">
            <input type="text" id="pesquisar"
            placeholder="Pesquisar ou começar uma nova conversa">
        </div>

        <div class="filtros">
            <button class="ativo">Todas</button>
            <button>Não lidas</button>
            <button>Favoritas</button>
        </div>

        <div class="contatos">

            <div class="contato selecionado" data-nome="Meu Amor ❤️">
                <div class="avatar amor">E</div>
                <div class="info">
                    <strong>Meu Amor ❤️</strong>
                    <p>Oi, meu bem! ❤️</p>
                </div>
                <small>18:30</small>
            </div>

            <div class="contato" data-nome="Marlos">
                <div class="avatar marlos">M</div>
                <div class="info">
                    <strong>Marlos</strong>
                    <p>Vamos conversar?</p>
                </div>
                <small>18:15</small>
            </div>

            <div class="contato" data-nome="Bebela">
                <div class="avatar bebela">B</div>
                <div class="info">
                    <strong>Bebela</strong>
                    <p>kkkkkk 😂</p>
                </div>
                <small>17:50</small>
            </div>

            <div class="contato" data-nome="Belly">
                <div class="avatar belly">B</div>
                <div class="info">
                    <strong>Belly</strong>
                    <p>Até amanhã!</p>
                </div>
                <small>17:20</small>
            </div>

        </div>

    </aside>

    <!-- ÁREA DA CONVERSA -->
    <main class="chat">

        <header class="chat-header">
            <div class="avatar amor" id="avatarChat">E</div>

            <div class="dados-chat">
                <strong id="nomeChat">Meu Amor ❤️</strong>
                <p id="statusChat">online</p>
            </div>

            <div class="opcoes">⌕　📎　⋮</div>
        </header>

        <section class="mensagens" id="mensagens">

            <div class="data-chat">HOJE</div>

            <div class="mensagem recebida">
                Oi, meu bem! ❤️
                <small>18:25</small>
            </div>

            <div class="mensagem enviada">
                Oiii, meu amor! 💗
                <small>18:27 ✓✓</small>
            </div>

            <div class="mensagem recebida">
                Como você está?
                <small>18:30</small>
            </div>

        </section>

        <!-- CAMPO PARA ENVIAR MENSAGENS -->
        <form class="campo-mensagem" id="formMensagem">

            <button type="button" id="emoji">☺</button>

            <input
                type="text"
                id="mensagemInput"
                placeholder="Digite uma mensagem"
                autocomplete="off"
            >

            <button type="submit" class="enviar">➤</button>

        </form>

    </main>

</div>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
