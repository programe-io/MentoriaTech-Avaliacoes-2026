<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor HTML CSS JS</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<div class="container">

    <div class="editor">
        <div class="topo">
            <h3>HTML</h3>
            <button onclick="maximizar('html')">Maximizar</button>
        </div>

        <textarea id="html" placeholder="Digite seu HTML..."></textarea>
    </div>

    <div class="editor">
        <div class="topo">
            <h3>CSS</h3>
            <button onclick="maximizar('css')">Maximizar</button>
        </div>

        <textarea id="css" placeholder="Digite seu CSS..."></textarea>
    </div>

    <div class="editor">
        <div class="topo">
            <h3>JavaScript</h3>
            <button onclick="maximizar('js')">Maximizar</button>
        </div>

        <textarea id="js" placeholder="Digite seu JavaScript..."></textarea>
    </div>

</div>

<h2>Pré-visualização do Código</h2>

<iframe id="preview"></iframe>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
