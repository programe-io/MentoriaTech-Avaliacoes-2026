<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <h1>Gerenciador de Tarefas</h1>
      <p>Projeto em JavaScript - Controle e Priorização</p>
    </header>

    <!-- Área de Alertas / Notificações -->
    <div id="mensagem" class="mensagem hidden"></div>

    <main class="grid-layout">
      <!-- Formulário de Cadastro -->
      <section class="card">
        <h2>Cadastrar Nova Tarefa</h2>
        <form id="form-cadastrar">
          <div class="form-group">
            <label for="cad-titulo">Título (Mínimo 5 caracteres)</label>
            <input type="text" id="cad-titulo" placeholder="Ex: Estudar métodos de Array" required>
          </div>

          <div class="form-group">
            <label for="cad-prioridade">Prioridade</label>
            <select id="cad-prioridade" required>
              <option value="1">1 - Alta</option>
              <option value="2" selected>2 - Média</option>
              <option value="3">3 - Baixa</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary">Cadastrar Tarefa</button>
        </form>
      </section>

      <!-- Operações: Concluir e Alterar Prioridade -->
      <section class="card">
        <h2>Gerenciar Tarefas</h2>

        <!-- Form: Concluir Tarefa -->
        <form id="form-concluir" class="sub-form">
          <h3>Concluir Tarefa</h3>
          <div class="form-group-row">
            <div class="form-group">
              <label for="conc-codigo">Código da Tarefa</label>
              <input type="number" id="conc-codigo" min="1" required placeholder="Ex: 1">
            </div>
            <button type="submit" class="btn btn-success align-end">Concluir</button>
          </div>
        </form>

        <hr>

        <!-- Form: Alterar Prioridade -->
        <form id="form-prioridade" class="sub-form">
          <h3>Alterar Prioridade</h3>
          <div class="form-group-row">
            <div class="form-group">
              <label for="prio-codigo">Código</label>
              <input type="number" id="prio-codigo" min="1" required placeholder="Ex: 1">
            </div>
            <div class="form-group">
              <label for="prio-nova">Nova Prioridade</label>
              <select id="prio-nova" required>
                <option value="1">1 - Alta</option>
                <option value="2">2 - Média</option>
                <option value="3">3 - Baixa</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-secondary">Alterar Prioridade</button>
        </form>
      </section>
    </main>

    <!-- Lista / Tabela de Tarefas -->
    <section class="card full-width">
      <h2>Lista de Tarefas</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Título</th>
              <th>Prioridade</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tabela-tarefas">
            <tr id="linha-vazia">
              <td colspan="4" class="text-center">Nenhuma tarefa cadastrada.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
