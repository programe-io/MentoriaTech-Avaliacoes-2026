<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão de Estoque</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <h1>Gestão de Estoque</h1>
      <p>Projeto CRUD simples em JavaScript</p>
    </header>

    <!-- Mensagens de Alerta (Sucesso / Erro) -->
    <div id="mensagem" class="mensagem hidden"></div>

    <main class="grid-layout">
      <!-- Formulário de Cadastro -->
      <section class="card">
        <h2>Cadastrar Produto</h2>
        <form id="form-cadastrar">
          <div class="form-group">
            <label for="cad-descricao">Descrição (Mínimo 5 caracteres)</label>
            <input type="text" id="cad-descricao" placeholder="Ex: Cadeira gamer" required>
          </div>

          <div class="form-group-row">
            <div class="form-group">
              <label for="cad-quantidade">Quantidade</label>
              <input type="number" id="cad-quantidade" min="1" placeholder="Ex: 10" required>
            </div>
            <div class="form-group">
              <label for="cad-valor">Valor (R$)</label>
              <input type="number" id="cad-valor" step="0.01" min="0" placeholder="Ex: 699.90" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
        </form>
      </section>

      <!-- Atualizações de Estoque -->
      <section class="card">
        <h2>Operações de Estoque</h2>
        
        <!-- Form Atualizar Valor -->
        <form id="form-atualizar-valor" class="sub-form">
          <h3>Atualizar Valor</h3>
          <div class="form-group-row">
            <div class="form-group">
              <label for="val-codigo">Código</label>
              <input type="number" id="val-codigo" min="1" required>
            </div>
            <div class="form-group">
              <label for="val-novo-valor">Novo Valor (R$)</label>
              <input type="number" id="val-novo-valor" step="0.01" min="0" required>
            </div>
          </div>
          <button type="submit" class="btn btn-secondary">Atualizar Valor</button>
        </form>

        <hr>

        <!-- Form Adicionar Quantidade -->
        <form id="form-atualizar-qtd" class="sub-form">
          <h3>Adicionar ao Estoque</h3>
          <div class="form-group-row">
            <div class="form-group">
              <label for="qtd-codigo">Código</label>
              <input type="number" id="qtd-codigo" min="1" required>
            </div>
            <div class="form-group">
              <label for="qtd-adicionar">Qtd. a Somar</label>
              <input type="number" id="qtd-adicionar" min="1" required>
            </div>
          </div>
          <button type="submit" class="btn btn-secondary">Somar Quantidade</button>
        </form>
      </section>
    </main>

    <!-- Tabela de Produtos -->
    <section class="card full-width">
      <h2>Produtos em Estoque</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Descrição</th>
              <th>Quantidade</th>
              <th>Valor Unitário</th>
              <th>Valor Total</th>
            </tr>
          </thead>
          <tbody id="tabela-produtos">
            <tr id="linha-vazia">
              <td colspan="5" class="text-center">Nenhum produto cadastrado.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
