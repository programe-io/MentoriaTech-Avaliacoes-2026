<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Maratona Geek - Blog de Séries & GIFs</title>
                <link rel="stylesheet" href="style.css">
                <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <div class="container">
                                        <h1>🎬 Maratona Geek</h1>
                                                    <p>Cenas épicas, GIFs e análises das melhores séries para maratonar.</p>
                                                                
                                                                            <div class="controles">
                                                                                            <div class="barra-superior">
                                                                                                                <input type="text" id="campo-busca" placeholder="Buscar série (ex: Wandinha, Cobra Kai, Walking Dead)...">
                                                                                                                                    <button id="btn-abrir-cadastro" class="btn-novo">+ Adicionar Série / GIF</button>
                                                                                                                                                    </div>

                                                                                                                                                                    <div class="filtros">
                                                                                                                                                                                        <button class="btn-filtro ativo" data-categoria="Todas">Todas</button>
                                                                                                                                                                                                            <button class="btn-filtro" data-categoria="Terror">Terror</button>
                                                                                                                                                                                                                                <button class="btn-filtro" data-categoria="Ação">Ação</button>
                                                                                                                                                                                                                                                    <button class="btn-filtro" data-categoria="Mistério">Mistério</button>
                                                                                                                                                                                                                                                                        <button class="btn-filtro" data-categoria="Ficção Científica">Ficção Científica</button>
                                                                                                                                                                                                                                                                                            <button class="btn-filtro" data-categoria="Drama">Drama</button>
                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                    </header>

                                                                                                                                                                                                                                                                                                                                        <main class="container">
                                                                                                                                                                                                                                                                                                                                                <div id="lista-posts" class="grid-posts">
                                                                                                                                                                                                                                                                                                                                                            <!-- As séries e GIFs aparecem aqui automaticamente -->
                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                                            <!-- Janela de leitura da resenha com GIF em destaque -->
                                                                                                                                                                                                                                                                                                                                                                                <div id="modal-leitura" class="modal">
                                                                                                                                                                                                                                                                                                                                                                                        <div class="modal-conteudo">
                                                                                                                                                                                                                                                                                                                                                                                                    <span id="fechar-modal" class="fechar">&times;</span>
                                                                                                                                                                                                                                                                                                                                                                                                                <img id="modal-img" src="" alt="Cena ou Pôster da Série">
                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="modal-texto-area">
                                                                                                                                                                                                                                                                                                                                                                                                                                            <span id="modal-categoria" class="tag"></span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span id="modal-nota" class="nota"></span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h2 id="modal-titulo"></h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p id="modal-texto"></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- Janela para cadastrar nova série ou GIF -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="modal-cadastro" class="modal">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="modal-conteudo form-area">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <span id="fechar-cadastro" class="fechar">&times;</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>Adicionar Série ou GIF</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <form id="form-nova-serie">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Nome da Série:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="text" id="novo-titulo" required placeholder="Ex: Wandinha">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Categoria:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <select id="nova-categoria">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="Terror">Terror</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="Ação">Ação</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="Mistério">Mistério</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="Ficção Científica">Ficção Científica</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="Drama">Drama</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label>Nota (0 a 10):</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="nova-nota" required placeholder="Ex: 9.5">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label>Caminho do GIF/Imagem (pasta img/) ou Link da web:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="nova-imagem" required placeholder="Ex: img/wandinha.gif">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label>Resumo curto (aparece no cartão):</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="novo-resumo" required placeholder="Uma frase sobre a série...">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label>Sua resenha completa:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <textarea id="novo-conteudo" rows="4" required placeholder="Escreva o que você achou da série..."></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button type="submit" class="btn-ler">Publicar no Blog</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>&copy; 2026 Maratona Geek - Feito para fãs de séries.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
