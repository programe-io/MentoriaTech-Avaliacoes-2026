<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
  <!-- Ícones do FontAwesome -->
  <link rel="stylesheet" href="https://cloudflare.com">
  <!-- Estilo externo -->
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Barra Superior -->
  <header>
    <div class="nav-container">
      <div class="logo">Instagram</div>
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Pesquisar">
      </div>
      <div class="nav-icons">
        <i class="fa-solid fa-house" title="Página Inicial"></i>
        <i class="fa-regular fa-paper-plane" title="Mensagens"></i>
        <i class="fa-regular fa-square-plus" id="openPostModal" title="Criar Postagem"></i>
        <i class="fa-regular fa-compass" title="Explorar"></i>
        <i class="fa-regular fa-heart" title="Notificações"></i>
        <img src="https://pravatar.cc" alt="Perfil" class="nav-avatar">
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main>
    <div class="feed-column">
      <!-- Stories -->
      <section class="stories-container" id="storiesContainer"></section>

      <!-- Feed de Postagens -->
      <section id="feedContainer"></section>
    </div>

    <!-- Barra Lateral -->
    <aside class="sidebar">
      <div class="user-profile-switch">
        <div class="user-profile-info">
          <img src="https://pravatar.cc" alt="Seu Perfil">
          <div class="user-names">
            <h4>dev_brasil</h4>
            <p>Desenvolvedor Web</p>
          </div>
        </div>
        <span class="switch-btn">Mudar</span>
      </div>

      <div class="suggestions-header">
        <span>Sugestões para você</span>
        <span class="see-all">Ver tudo</span>
      </div>

      <div id="suggestionsContainer"></div>
    </aside>
  </main>

  <!-- Modal de Nova Postagem -->
  <div class="modal" id="postModal">
    <div class="modal-content">
      <div class="modal-header">
        Criar nova publicação
        <span class="close-modal" id="closePostModal">&times;</span>
      </div>
      <div class="modal-body">
        <input type="text" id="newPostImage" placeholder="URL da imagem (ex: https://picsum.photos)" value="https://picsum.photos">
        <textarea id="newPostCaption" rows="3" placeholder="Escreva uma legenda..."></textarea>
        <button id="publishPostBtn">Compartilhar</button>
      </div>
    </div>
  </div>

  <!-- Script externo -->
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
