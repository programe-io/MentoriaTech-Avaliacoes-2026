<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed Estilo TikTok</title>
  <link rel="stylesheet" href="style.css" />
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="feed" id="feed"></main>

  <aside class="comments-drawer" id="commentsDrawer" aria-hidden="true">
    <div class="comments-header">
      <span id="commentsTitle">Comentários</span>
      <button type="button" id="closeComments" aria-label="Fechar comentários">✕</button>
    </div>
    <ul class="comments-list" id="commentsList"></ul>
    <form class="comment-form" id="commentForm">
      <input type="text" id="commentInput" placeholder="Adicione um comentário..." required />
      <button type="submit">Enviar</button>
    </form>
  </aside>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
