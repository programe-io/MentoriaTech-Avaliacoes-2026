<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TokPulse — Blog sobre TikTok</title>
  <link rel="stylesheet" href="style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topo">
    <div class="container topo-conteudo">
      <a href="#" class="logo">Tok<span>Pulse</span></a>
      <p class="subtitulo">Tendências, algoritmo, edição e criação de conteúdo</p>
    </div>
  </header>

  <main class="container">
    <section class="controles">
      <input
        type="search"
        id="campoBusca"
        placeholder="Buscar artigos (ex.: algoritmo, edição, trends)..."
        aria-label="Buscar artigos"
      />
      <div class="filtros" id="filtros">
        <button class="filtro-btn ativo" data-categoria="Todos">Todos</button>
        <button class="filtro-btn" data-categoria="Algoritmo">Algoritmo</button>
        <button class="filtro-btn" data-categoria="Edição">Edição</button>
        <button class="filtro-btn" data-categoria="Trends">Trends</button>
      </div>
    </section>

    <section class="grid-posts" id="gridPosts"></section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <article class="modal">
      <button class="fechar-modal" id="fecharModal" aria-label="Fechar artigo">×</button>
      <span class="badge" id="modalCategoria"></span>
      <h2 id="modalTitulo"></h2>
      <p class="meta" id="modalMeta"></p>
      <div id="modalCorpo" class="modal-corpo"></div>
    </article>
  </div>

  <footer class="rodape">
    <div class="container">
      <p>TokPulse Blog • Feito com HTML, CSS e JavaScript</p>
    </div>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
