
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima App</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <h1>🌤️ Clima App</h1>
        <p>Consulte o clima da sua cidade</p>

        <div class="pesquisa">
            <input type="text" id="cidade"
                placeholder="Digite sua cidade...">
            <button onclick="buscarClima()">🔍</button>
        </div>

        <div class="clima">
            <h2 id="nomeCidade">Minha cidade</h2>
            <div id="icone">🌤️</div>
            <h1 id="temperatura">--°C</h1>
            <p id="descricao">Pesquise uma cidade</p>

            <div class="detalhes">
                <div>
                    <span>💧</span>
                    <p>Umidade</p>
                    <strong id="umidade">--%</strong>
                </div>

                <div>
                    <span>💨</span>
                    <p>Vento</p>
                    <strong id="vento">-- km/h</strong>
                </div>
            </div>
        </div>

        <p class="rodape">Desenvolvido com HTML, CSS e JavaScript</p>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
