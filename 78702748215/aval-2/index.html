<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineFeed</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>

        <div class="header-content">

            <h1>MineFeed</h1>

            <nav>
                <a href="#">Inicio</a>
                <a href="#">Perfil</a>
            </nav>

        </div>

    </header>

    <Main>

        <section class="new-post">

            <div class="user">

                <div class="avatar">
                    R
                </div>

                <div>
                     <strong>Raimundo</strong>
                     <span>O oque voce esta pensando?</span>
                </div>


            </div>

            <button>Publicar</button>


        </section>

        <article class="post">

            <div class="post-header">

                 <div class="avatar">
                    C
                </div>

                <div>
                     <strong>Carlos</strong>
                     <span>Há 10 minutos</span>
                </div>

            </div>

            <div class="post-text">
                Hoje eu vi o novo filme do Batman,
                top, to feliz 😁
             </div>

             <img src="https://skoob.s3.amazonaws.com/livros/122549481/ABSOLUTE_BATMAN_2024_A5_1739553082122549481SK-V11739553083B.jpg" alt="Imagem do Batman">

             <div class="post-actions">

                <button>Curtir</button>
                <button>Comentar</button>


             </div>


        </article>



 </Main>

    <footer>
        <p>MiniFeed - Todos os Direitos Reservados a Raimundo- 2026</p>
    </footer>

</body>
</html>
