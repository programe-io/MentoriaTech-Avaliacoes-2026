
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect - Rede Social</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f5f9;
    color: #252535;
}

header {
    background: white;
    padding: 17px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    color: #7655df;
    font-size: 27px;
    font-weight: bold;
}

header input {
    padding: 11px;
    border: none;
    background: #f1f1f5;
    border-radius: 20px;
    width: 250px;
}

.container {
    max-width: 1000px;
    margin: 25px auto;
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 25px;
    padding: 0 15px;
}

.sidebar, .card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 18px;
}

.sidebar p {
    padding: 13px 5px;
    cursor: pointer;
    font-weight: bold;
}

.sidebar p:hover {
    color: #7655df;
}

main {
    min-width: 0;
}

h2 {
    font-size: 19px;
    margin-bottom: 15px;
}

.create textarea {
    width: 100%;
    height: 75px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    resize: vertical;
    font-family: Arial;
}

button {
    background: #7655df;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #5d3bc0;
}

.post {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 20px;
}

.user {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #e4dafa;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.username {
    font-weight: bold;
}

.date {
    color: gray;
    font-size: 12px;
}

.post-content {
    line-height: 1.5;
    margin-bottom: 15px;
    overflow-wrap: anywhere;
}

.post img {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    border-radius: 10px;
    margin-top: 12px;
}

.actions {
    border-top: 1px solid #eee;
    padding-top: 12px;
    display: flex;
    gap: 25px;
}

.actions button {
    background: none;
    color: #555;
    padding: 5px;
    font-size: 15px;
    margin: 0;
}

.actions button:hover {
    color: #7655df;
}

.comment-area {
    margin-top: 12px;
    display: flex;
    gap: 7px;
}

.comment-area input {
    flex: 1;
    min-width: 0;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 20px;
}

.comment {
    font-size: 14px;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
}

footer {
    text-align: center;
    color: #888;
    padding: 25px;
}

@media(max-width:650px) {
    header {
        padding: 15px;
    }

    header input {
        width: 130px;
    }

    .container {
        display: block;
        margin-top: 15px;
    }

    .sidebar {
        display: flex;
        justify-content: space-around;
        padding: 8px;
    }

    .sidebar p {
        font-size: 13px;
    }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
    <div class="logo">Connect ✨</div>
    <input type="search" id="search" placeholder="Pesquisar..." oninput="searchPosts()">
</header>

<div class="container">

    <aside class="sidebar">
        <p onclick="showAll()">🏠 Início</p>
        <p onclick="document.getElementById('newPost').focus()">✏️ Publicar</p>
        <p onclick="showAll()">❤️ Curtidas</p>
        <p onclick="showProfile()">👤 Perfil</p>
    </aside>

    <main>

        <div class="card create">
            <h2>O que você está pensando? 💜</h2>
            <textarea id="newPost" placeholder="Compartilhe alguma coisa..."></textarea>
            <input type="text" id="imageUrl" placeholder="Link de uma imagem (opcional)"
            style="width:100%;padding:10px;margin-top:10px;border:1px solid #ddd;border-radius:8px">
            <button onclick="publish()">Publicar 🚀</button>
        </div>

        <h2>Seu feed</h2>
        <div id="feed"></div>

    </main>
</div>

<footer>
    Connect © 2026 - Compartilhe momentos, ideias e amizades 💜
</footer>

<script>
let posts = [
    {
        user: "Maria Silva",
        avatar: "👩🏻",
        text: "Bem-vindos ao Connect! 💜 Vamos compartilhar momentos especiais!",
        image: "",
        likes: 12,
        liked: false,
        comments: []
    },
    {
        user: "Pedro Santos",
        avatar: "👨🏻",
        text: "Hoje é um ótimo dia para começar algo novo! ✨",
        image: "",
        likes: 8,
        liked: false,
        comments: []
    },
    {
        user: "Ana Costa",
        avatar: "👩🏽",
        text: "A vida fica melhor quando compartilhamos bons momentos! ❤️",
        image: "",
        likes: 24,
        liked: false,
        comments: []
    }
];

function renderPosts(list = posts) {
    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    list.forEach((post) => {
        const index = posts.indexOf(post);

        feed.innerHTML += `
        <article class="post">
            <div class="user">
                <div class="avatar">${post.avatar}</div>
                <div>
                    <div class="username">${post.user}</div>
                    <div class="date">No Connect</div>
                </div>
            </div>

            <div class="post-content">${escapeHTML(post.text)}</div>

            ${post.image ? `<img src="${escapeHTML(post.image)}" alt="Imagem da publicação" onerror="this.style.display='none'">` : ""}

            <div class="actions">
                <button onclick="likePost(${index})">
                    ${post.liked ? "❤️" : "🤍"} ${post.likes}
                </button>
                <button onclick="focusComment(${index})">💬 ${post.comments.length} Comentários</button>
                <button onclick="sharePost(${index})">↗️ Compartilhar</button>
            </div>

            <div id="comments-${index}">
                ${post.comments.map(c => `<div class="comment"><b>${escapeHTML(c.user)}:</b> ${escapeHTML(c.text)}</div>`).join("")}
            </div>

            <div class="comment-area">
                <input id="comment-${index}" placeholder="Escreva um comentário...">
                <button onclick="addComment(${index})">Enviar</button>
            </div>
        </article>`;
    });
}

function escapeHTML(text) {
    return String(text).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
    }[c]));
}

function publish() {
    const text = document.getElementById("newPost").value.trim();
    const image = document.getElementById("imageUrl").value.trim();

    if (!text && !image) {
        alert("Escreva alguma coisa antes de publicar!");
        return;
    }

    posts.unshift({
        user: "Você",
        avatar: "😊",
        text: text,
        image: image,
        likes: 0,
        liked: false,
        comments: []
    });

    document.getElementById("newPost").value = "";
    document.getElementById("imageUrl").value = "";

    renderPosts();
}

function likePost(index) {
    const post = posts[index];
    post.liked = !post.liked;
    post.likes += post.liked ? 1 : -1;
    renderPosts();
}

function addComment(index) {
    const input = document.getElementById("comment-" + index);
    const text = input.value.trim();

    if (!text) return;

    posts[index].comments.push({
        user: "Você",
        text: text
    });

    renderPosts();
}

function focusComment(index) {
    document.getElementById("comment-" + index).focus();
}

function sharePost(index) {
    const text = posts[index].text;
    if (navigator.share) {
        navigator.share({title: "Connect", text: text});
    } else {
        navigator.clipboard.writeText(text);
        alert("Texto copiado!");
    }
}

function searchPosts() {
    const term = document.getElementById("search").value.toLowerCase();

    const filtered = posts.filter(post =>
        post.text.toLowerCase().includes(term) ||
        post.user.toLowerCase().includes(term)
    );

    renderPosts(filtered);
}

function showAll() {
    document.getElementById("search").value = "";
    renderPosts();
}

function showProfile() {
    const mine = posts.filter(post => post.user === "Você");
    renderPosts(mine);
}

renderPosts();
</script>

<script src="script.js"></script></body>
</html>
