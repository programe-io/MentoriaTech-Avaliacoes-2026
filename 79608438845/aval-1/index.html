<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meu Blog Pessoal</title>
<link rel="stylesheet" href="style.css" />
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
  <h1>Bem-vindo ao Meu Blog Pessoal</h1>
  <p>Compartilhando ideias, pensamentos e histórias</p>
</header>

<main>
  <article>
    <h2>Meu Primeiro Post</h2>
    <p>Olá! Este é o meu blog pessoal onde vou compartilhar várias coisas interessantes. Espero que gostem!</p>

    <div class="comments-section">
      <h3>Comentários</h3>
      <div id="comments"></div>
      <form id="commentForm">
        <input type="text" id="name" placeholder="Seu nome" required />
        <textarea id="comment" rows="3" placeholder="Escreva um comentário" required></textarea>
        <button type="submit">Comentar</button>
      </form>
    </div>
  </article>
</main>

<footer>
  <p>© 2026 Meu Blog Pessoal</p>
</footer>

<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
