  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed do Instagram</title>
    <!-- Ícones via FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            color: #262626;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cabeçalho */
        header {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #dbdbdb;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
        }

        .nav-container {
            width: 100%;
            max-width: 600px;
            height: 60px;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Brush Script MT', cursive;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-icons i {
            font-size: 22px;
            margin-left: 20px;
            cursor: pointer;
        }

        /* Container Principal */
        main {
            width: 100%;
            max-width: 470px;
            margin-top: 20px;
            padding-bottom: 40px;
        }

        /* Stories */
        .stories {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 16px 10px;
            margin-bottom: 24px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
        }

        .stories::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            min-width: 66px;
        }

        .story-ring {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .story-ring img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            object-fit: cover;
        }

        .story-item span {
            font-size: 12px;
            margin-top: 5px;
            max-width: 66px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Postagens */
        .post {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .post-user img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-image-container {
            position: relative;
            width: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .post-image {
            width: 100%;
            max-height: 580px;
            object-fit: cover;
            display: block;
        }

        /* Animação do coração no clique duplo */
        .double-tap-heart {
            position: absolute;
            color: #ffffff;
            font-size: 80px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .double-tap-heart.animate {
            opacity: 0.9;
            transform: scale(1.2);
        }

        /* Ações do Post */
        .post-actions {
            display: flex;
            justify-content: space-between;
            padding: 12px 14px 8px;
        }

        .post-actions i {
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .post-actions i:active {
            transform: scale(1.2);
        }

        .left-actions {
            display: flex;
            gap: 16px;
        }

        .liked {
            color: #ed4956 !important;
        }

        /* Informações e Comentários */
        .post-info {
            padding: 0 14px 12px;
            font-size: 14px;
        }

        .likes-count {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .caption {
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .caption strong {
            margin-right: 5px;
        }

        .comments-list {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .comment-item strong {
            margin-right: 5px;
        }

        .post-time {
            font-size: 10px;
            color: #8e8e8e;
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* Caixa de novo comentário */
        .add-comment {
            border-top: 1px solid #efefef;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .add-comment input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .add-comment button {
            background: none;
            border: none;
            color: #0095f6;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.5;
            pointer-events: none;
        }

        .add-comment button.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
