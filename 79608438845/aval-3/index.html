<head>

  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Completo</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-body: #fafafa;
            --bg-card: #ffffff;
            --text-primary: #262626;
            --text-secondary: #8e8e8e;
            --border-color: #dbdbdb;
            --border-light: #efefef;
            --blue-btn: #0095f6;
        }

        body.dark-mode {
            --bg-body: #000000;
            --bg-card: #121212;
            --text-primary: #f5f5f5;
            --text-secondary: #a8a8a8;
            --border-color: #262626;
            --border-light: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.2s, color 0.2s;
            padding-bottom: 60px;
        }

        /* Cabeçalho */
        header {
            width: 100%;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
        }

        .nav-container {
            width: 100%;
            max-width: 600px;
            height: 60px;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Brush Script MT', cursive;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-icons i {
            font-size: 22px;
            cursor: pointer;
        }

        /* Container Principal */
        main {
            width: 100%;
            max-width: 470px;
            margin-top: 20px;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* Stories */
        .stories {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .stories::-webkit-scrollbar { display: none; }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            min-width: 66px;
        }

        .story-ring {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .story-ring img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            object-fit: cover;
        }

        .story-item span {
            font-size: 12px;
            margin-top: 5px;
            max-width: 66px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Postagens */
        .post {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .post-user img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-image-container {
            position: relative;
            width: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .post-image {
            width: 100%;
            max-height: 580px;
            object-fit: cover;
            display: block;
        }

        .double-tap-heart {
            position: absolute;
            color: #ffffff;
            font-size: 80px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .double-tap-heart.animate {
            opacity: 0.9;
            transform: scale(1.2);
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            padding: 12px 14px 8px;
        }

        .post-actions i {
            font-size: 24px;
            cursor: pointer;
        }

        .left-actions {
            display: flex;
            gap: 16px;
        }

        .liked { color: #ed4956 !important; }

        .post-info {
            padding: 0 14px 12px;
            font-size: 14px;
        }

        .likes-count {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .caption {
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .comments-list {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .post-time {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-top: 6px;
        }

        .add-comment {
            border-top: 1px solid var(--border-light);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .add-comment input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 14px;
        }

        .add-comment button {
            background: none;
            border: none;
            color: var(--blue-btn);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.5;
            pointer-events: none;
        }

        .add-comment button.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Aba Explorar e Perfil (Grid) */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
        }

        .photo-grid img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            cursor: pointer;
        }

        /* Cabeçalho do Perfil */
        .profile-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 16px;
        }

        .profile-top img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-stats {
            display: flex;
            gap: 20px;
            text-align: center;
            font-size: 14px;
        }

        .profile-stats strong {
            display: block;
            font-size: 16px;
        }

        .profile-bio {
            font-size: 14px;
            line-height: 1.4;
        }

        /* Barra Inferior de Navegação */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .bottom-nav-container {
            width: 100%;
            max-width: 470px;
            height: 50px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .bottom-nav i {
            font-size: 22px;
            cursor: pointer;
        }

        /* Modais (Novo Post e Story Viewer) */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            color: var(--text-primary);
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

  <script src="script.js"></script>
  
</body>
</html>
