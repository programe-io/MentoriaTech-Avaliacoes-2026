<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Feed Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="app-bar">
      <span class="app-bar__mark">feed<span class="app-bar__mark-dot">.</span></span>
          <span class="app-bar__tag">mini social</span>
            </header>

              <main class="feed">

                  <!-- POST — Israel -->
                      <article class="post" style="--ring-a:#2E5D4E; --ring-b:#C9A227;">
                            <div class="post__head">
                                    <div class="avatar-ring avatar-ring--initial">
                                              <span class="avatar avatar--initial">I</span>
                                                      </div>
                                                              <div class="post__who">
                                                                        <span class="post__name">Israel</span>
                                                                                  <span class="post__meta">@israel &middot; 5 h</span>
                                                                                          </div>
                                                                                                  <button class="post__more" aria-label="Mais opções">&#8942;</button>
                                                                                                        </div>

                                                                                                              <p class="post__text">
                                                                                                                      Capitão Jack Sparrow aprontando de novo 🏴‍☠️⚓ — maratona de
                                                                                                                              Piratas do Caribe rolando aqui, e o carisma desse personagem
                                                                                                                                      nunca envelhece.
                                                                                                                                            </p>

                                                                                                                                                  <div class="post__media">
                                                                                                                                                          <!-- Substitua o src abaixo pelo link do pôster de Piratas do Caribe -->
                                                                                                                                                                  <img src="https://i.postimg.cc/2Sd3xNHc/250px-Pirates-of-the-Caribbean-On-Stranger-Tides.jpg" alt="Pôster do filme Piratas do Caribe">
                                                                                                                                                                        </div>

                                                                                                                                                                              <div class="post__actions">
                                                                                                                                                                                      <button class="action action--like">
                                                                                                                                                                                                <span class="action__icon">&#9825;</span>
                                                                                                                                                                                                          <span class="action__count">201</span>
                                                                                                                                                                                                                  </button>
                                                                                                                                                                                                                          <button class="action">
                                                                                                                                                                                                                                    <span class="action__icon">&#9998;</span>
                                                                                                                                                                                                                                              <span class="action__count">15</span>
                                                                                                                                                                                                                                                      </button>
                                                                                                                                                                                                                                                              <button class="action">
                                                                                                                                                                                                                                                                        <span class="action__icon">&#8635;</span>
                                                                                                                                                                                                                                                                                  <span class="action__count">11</span>
                                                                                                                                                                                                                                                                                          </button>
                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                    </article>

                                                                                                                                                                                                                                                                                                      </main>

                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                      </html>
