<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Formulário Clínica Veterinária</title>

<style>
body {
  font-family: Arial, sans-serif;
    background: linear-gradient(to right, #d8e3d2, #f4d6d0);
      margin: 0;
        padding: 20px;
        }

        .container {
          width: 400px;
            margin: auto;
              background: white;
                padding: 25px;
                  border-radius: 20px;
                    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
                    }

                    .logo {
                      text-align: center;
                        margin-bottom: 15px;
                        }

                        .logo img {
                          width: 220px;
                            border-radius: 15px;
                            }

                            h2 {
                              text-align: center;
                                color: #8c6f68;
                                }

                                label {
                                  font-weight: bold;
                                    color: #6f7d63;
                                    }

                                    input, textarea {
                                      width: 100%;
                                        margin: 8px 0 15px;
                                          padding: 10px;
                                            border-radius: 8px;
                                              border: 1px solid #ccc;
                                                box-sizing: border-box;
                                                }

                                                textarea {
                                                  height: 70px;
                                                    resize: none;
                                                    }

                                                    .preview {
                                                      text-align: center;
                                                        margin-top: 10px;
                                                        }

                                                        .preview img {
                                                          width: 120px;
                                                            height: 120px;
                                                              border-radius: 50%;
                                                                object-fit: cover;
                                                                  display: none;
                                                                    border: 3px solid #d8b1a5;
                                                                    }

                                                                    .sexo {
                                                                      display: flex;
                                                                        gap: 10px;
                                                                          margin-bottom: 15px;
                                                                            color: #555;
                                                                            }

                                                                            .botoes {
                                                                              display: flex;
                                                                                justify-content: space-between;
                                                                                  margin-top: 20px;
                                                                                  }

                                                                                  button {
                                                                                    width: 48%;
                                                                                      padding: 12px;
                                                                                        border: none;
                                                                                          border-radius: 10px;
                                                                                            cursor: pointer;
                                                                                              font-weight: bold;
                                                                                                transition: 0.3s;
                                                                                                }

                                                                                                .enviar {
                                                                                                  background: #8aa17b;
                                                                                                    color: white;
                                                                                                    }

                                                                                                    .enviar:hover {
                                                                                                      background: #728867;
                                                                                                      }

                                                                                                      .limpar {
                                                                                                        background: #d8a39a;
                                                                                                          color: white;
                                                                                                          }

                                                                                                          .limpar:hover {
                                                                                                            background: #bf857a;
                                                                                                            }
                                                                                                            </style>

                                                                                                            <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
                                                                                                            <body>

                                                                                                            <div class="container">

                                                                                                              <!-- LOGO -->
                                                                                                                <div class="logo">
                                                                                                                    <img src="1000102287.png" alt="Logo Clínica Veterinária">
                                                                                                                      </div>

                                                                                                                        <h2>Formulário de Cadastro</h2>

                                                                                                                          <form onsubmit="return validar()">

                                                                                                                              <label>Nome*</label>
                                                                                                                                  <input type="text" id="nome" required>

                                                                                                                                      <label>CPF*</label>
                                                                                                                                          <input type="text" id="cpf" required>

                                                                                                                                              <label>Sexo*</label>
                                                                                                                                                  <div class="sexo">
                                                                                                                                                        <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
                                                                                                                                                              <label><input type="radio" name="sexo" value="feminino"> Feminino</label>
                                                                                                                                                                    <label><input type="radio" name="sexo" value="outro"> Outro</label>
                                                                                                                                                                        </div>

                                                                                                                                                                            <label>Data de Nascimento</label>
                                                                                                                                                                                <input type="date">

                                                                                                                                                                                    <label>Foto</label>
                                                                                                                                                                                        <input type="file" accept="image/*" onchange="previewImagem(event)">

                                                                                                                                                                                            <div class="preview">
                                                                                                                                                                                                  <img id="imgPreview">
                                                                                                                                                                                                      </div>

                                                                                                                                                                                                          <label>Formação Escolar</label>
                                                                                                                                                                                                              <textarea placeholder="Digite sua formação escolar"></textarea>

                                                                                                                                                                                                                  <label>Experiências Profissionais</label>
                                                                                                                                                                                                                      <textarea placeholder="Digite suas experiências"></textarea>

                                                                                                                                                                                                                          <label>Cursos e Treinamentos</label>
                                                                                                                                                                                                                              <textarea placeholder="Digite seus cursos"></textarea>

                                                                                                                                                                                                                                  <div class="botoes">
                                                                                                                                                                                                                                        <button type="submit" class="enviar">ENVIAR</button>
                                                                                                                                                                                                                                              <button type="reset" class="limpar">LIMPAR</button>
                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                    </form>
                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                    function validar() {
                                                                                                                                                                                                                                                      let nome = document.getElementById("nome").value;
                                                                                                                                                                                                                                                        let cpf = document.getElementById("cpf").value;
                                                                                                                                                                                                                                                          let sexo = document.querySelector('input[name="sexo"]:checked');

                                                                                                                                                                                                                                                            if (nome.length < 3) {
                                                                                                                                                                                                                                                                alert("Nome muito curto!");
                                                                                                                                                                                                                                                                    return false;
                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                        if (cpf.length < 11) {
                                                                                                                                                                                                                                                                            alert("CPF inválido!");
                                                                                                                                                                                                                                                                                return false;
                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                    if (!sexo) {
                                                                                                                                                                                                                                                                                        alert("Selecione o sexo!");
                                                                                                                                                                                                                                                                                            return false;
                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                alert("Formulário enviado com sucesso!");
                                                                                                                                                                                                                                                                                                  return true;
                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                  function previewImagem(event) {
                                                                                                                                                                                                                                                                                                    const img = document.getElementById("imgPreview");
                                                                                                                                                                                                                                                                                                      img.src = URL.createObjectURL(event.target.files[0]);
                                                                                                                                                                                                                                                                                                        img.style.display = "block";
                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                        </html>
