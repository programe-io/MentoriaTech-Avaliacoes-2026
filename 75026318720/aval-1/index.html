<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <h1>Gerenciador de Tarefas</h1>

    <!-- FORMULÁRIO -->
    <h2>Cadastrar Tarefa</h2>
    <input type="number" id="codigo" placeholder="Código"><br><br>
    <input type="text" id="titulo" placeholder="Título"><br><br>
    <input type="number" id="prioridade" placeholder="Prioridade (1 a 3)"><br><br>
    <button onclick="cadastrarTarefa()">Cadastrar</button>

    <hr>

    <!-- AÇÕES -->
    <h2>Ações</h2>
    <input type="number" id="codigoConclusao" placeholder="Código para concluir">
    <button onclick="concluirTarefa()">Concluir</button><br><br>

    <input type="number" id="codigoAlterar" placeholder="Código para alterar">
    <input type="number" id="novaPrioridade" placeholder="Nova prioridade (1 a 3)">
    <button onclick="alterarPrioridade()">Alterar Prioridade</button>

    <hr>

    <!-- LISTA -->
    <h2>Lista de Tarefas</h2>
    <button onclick="listarTarefas()">Atualizar Lista</button>
    <ul id="lista"></ul>

    <script>
        let tarefas = [];

        function cadastrarTarefa() {
            let codigo = Number(document.getElementById("codigo").value);
            let titulo = document.getElementById("titulo").value;
            let prioridade = Number(document.getElementById("prioridade").value);

            if (titulo.length < 5) {
                alert("Título deve ter no mínimo 5 caracteres!");
                return;
            }

            if (prioridade < 1 || prioridade > 3) {
                alert("Prioridade deve ser entre 1 e 3!");
                return;
            }

            let tarefa = {
                codigo,
                titulo,
                prioridade,
                concluida: false
            };

            tarefas.push(tarefa);
            alert("Tarefa cadastrada!");
        }

        function listarTarefas() {
            let lista = document.getElementById("lista");
            lista.innerHTML = "";

            tarefas.forEach(t => {
                let item = document.createElement("li");
                item.textContent = 
                    `Código: ${t.codigo} | Título: ${t.titulo} | Prioridade: ${t.prioridade} | Concluída: ${t.concluida ? "Sim" : "Não"}`;
                lista.appendChild(item);
            });
        }

        function concluirTarefa() {
            let codigo = Number(document.getElementById("codigoConclusao").value);
            let tarefa = tarefas.find(t => t.codigo === codigo);

            if (!tarefa) {
                alert("Tarefa não encontrada!");
                return;
            }

            tarefa.concluida = true;
            alert("Tarefa concluída!");
        }

        function alterarPrioridade() {
            let codigo = Number(document.getElementById("codigoAlterar").value);
            let novaPrioridade = Number(document.getElementById("novaPrioridade").value);

            if (novaPrioridade < 1 || novaPrioridade > 3) {
                alert("Prioridade inválida!");
                return;
            }

            let tarefa = tarefas.find(t => t.codigo === codigo);

            if (!tarefa) {
                alert("Tarefa não encontrada!");
                return;
            }

            tarefa.prioridade = novaPrioridade;
            alert("Prioridade alterada!");
        }
    </script>

</body>
</html>
