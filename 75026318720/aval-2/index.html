
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 600px;
            margin: auto;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 80%;
        }

        button {
            padding: 10px 15px;
            margin: 8px;
            background: #287a50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #185c38;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        th {
            background: #287a50;
            color: white;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<div class="container">

    <h1>Sistema de Estoque</h1>

    <h3>Cadastrar Produto</h3>

    <input type="number" id="codigo" placeholder="Código do produto">
    <input type="text" id="descricao" placeholder="Descrição">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor do produto">

    <br>

    <button onclick="cadastrar()">Cadastrar Produto</button>

    <h3>Alterar Produto</h3>

    <input type="number" id="codigoAlterar" placeholder="Código do produto">

    <input type="number" id="novoValor" placeholder="Novo valor">

    <button onclick="alterarValor()">Alterar Valor</button>

    <input type="number" id="novaQuantidade" placeholder="Nova quantidade">

    <button onclick="alterarQuantidade()">Alterar Quantidade</button>

    <h3>Produtos Cadastrados</h3>

    <button onclick="listar()">Listar Produtos</button>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
            </tr>
        </thead>

        <tbody id="lista"></tbody>
    </table>

</div>

<script>

    let produtos = [];

    function cadastrar() {
        let codigo = document.getElementById("codigo").value;
        let descricao = document.getElementById("descricao").value;
        let quantidade = document.getElementById("quantidade").value;
        let valor = document.getElementById("valor").value;

        if (!codigo || !descricao || !quantidade || !valor) {
            alert("Preencha todos os campos!");
            return;
        }

        if (produtos.some(p => p.codigo == codigo)) {
            alert("Esse código já existe!");
            return;
        }

        produtos.push({
            codigo: codigo,
            descricao: descricao,
            quantidade: Number(quantidade),
            valor: Number(valor)
        });

        alert("Produto cadastrado!");

        listar();
    }

    function listar() {
        let tabela = document.getElementById("lista");

        tabela.innerHTML = "";

        produtos.forEach(produto => {
            tabela.innerHTML += `
                <tr>
                    <td>${produto.codigo}</td>
                    <td>${produto.descricao}</td>
                    <td>${produto.quantidade}</td>
                    <td>R$ ${produto.valor.toFixed(2)}</td>
                </tr>
            `;
        });
    }

    function alterarValor() {
        let codigo = document.getElementById("codigoAlterar").value;
        let valor = document.getElementById("novoValor").value;

        let produto = produtos.find(p => p.codigo == codigo);

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (valor === "" || Number(valor) < 0) {
            alert("Informe um valor válido!");
            return;
        }

        produto.valor = Number(valor);

        alert("Valor alterado!");
        listar();
    }

    function alterarQuantidade() {
        let codigo = document.getElementById("codigoAlterar").value;
        let quantidade = document.getElementById("novaQuantidade").value;

        let produto = produtos.find(p => p.codigo == codigo);

        if (!produto) {
            alert("Produto não encontrado!");
            return;
        }

        if (quantidade === "" || Number(quantidade) < 0) {
            alert("Informe uma quantidade válida!");
            return;
        }

        produto.quantidade = Number(quantidade);

        alert("Quantidade alterada!");
        listar();
    }

</script>

</body>
</html>
