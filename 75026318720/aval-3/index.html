
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cálculo de IMC</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #2563eb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #1e40af;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
            transform: scale(1.02);
        }

        #resultado {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #eff6ff;
            border-radius: 10px;
            text-align: center;
        }

        #resultado h2 {
            color: #1e40af;
            margin-bottom: 15px;
        }

        #valorIMC {
            font-size: 35px;
            font-weight: bold;
            color: #2563eb;
            margin: 10px 0;
        }

        #classificacao {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }

        .aviso {
            margin-top: 15px;
            font-size: 12px;
            color: #64748b;
            line-height: 1.5;
        }

        .erro {
            color: #dc2626;
            text-align: center;
            margin-top: 12px;
        }

    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <div class="container">

        <h1>Calculadora de IMC</h1>

        <p class="subtitulo">
            Sistema de avaliação do paciente
        </p>

        <label for="nome">Nome do Paciente:</label>
        <input type="text" id="nome"
        placeholder="Digite o nome do paciente">

        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso"
        placeholder="Ex: 70" step="0.1">

        <label for="altura">Altura (metros):</label>
        <input type="number" id="altura"
        placeholder="Ex: 1.75" step="0.01">

        <button onclick="calcularIMC()">
            Calcular IMC
        </button>

        <p id="erro" class="erro"></p>

        <div id="resultado">

            <h2>Resultado do Paciente</h2>

            <p id="nomePaciente"></p>

            <p>Seu IMC é:</p>

            <div id="valorIMC"></div>

            <p id="classificacao"></p>

            <p class="aviso">
                O IMC é um indicador geral e não substitui
                uma avaliação profissional de saúde.
            </p>

        </div>

    </div>

    <script>

        function calcularIMC() {

            // Receber os dados do paciente
            let nome = document.getElementById("nome").value;
            let peso = parseFloat(document.getElementById("peso").value);
            let altura = parseFloat(document.getElementById("altura").value);

            let erro = document.getElementById("erro");
            let resultado = document.getElementById("resultado");

            erro.innerHTML = "";
            resultado.style.display = "none";

            // Verificar se os campos foram preenchidos
            if (nome.trim() === "" || isNaN(peso) ||
                isNaN(altura) || peso <= 0 || altura <= 0) {

                erro.innerHTML = "Preencha todos os campos corretamente!";
                return;
            }

            // Calcular o IMC
            let imc = peso / (altura * altura);

            // Definir a classificação para adultos
            let classificacao = "";

            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            }
            else if (imc < 25) {
                classificacao = "Faixa de peso considerada adequada";
            }
            else if (imc < 30) {
                classificacao = "Sobrepeso";
            }
            else if (imc < 35) {
                classificacao = "Obesidade grau I";
            }
            else if (imc < 40) {
                classificacao = "Obesidade grau II";
            }
            else {
                classificacao = "Obesidade grau III";
            }

            // Exibir os resultados
            document.getElementById("nomePaciente").innerHTML =
                "Paciente: " + nome;

            document.getElementById("valorIMC").innerHTML =
                imc.toFixed(2);

            document.getElementById("classificacao").innerHTML =
                classificacao;

            resultado.style.display = "block";

        }

    </script>

<script src="script.js"></script></body>
</html>
