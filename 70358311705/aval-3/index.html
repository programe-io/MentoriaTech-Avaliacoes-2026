<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Calculadora de IMC para cadastrar pessoas, calcular o índice de massa corporal e acompanhar suas classificações.">

    <title>Calculadora de IMC</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <a href="#conteudo" class="pular-conteudo">
        Pular para o conteúdo
    </a>

    <main id="conteudo">

        <header class="cabecalho">
            <h1>Calculadora de IMC</h1>

            <p class="descricao">
                Cadastre pessoas, calcule o Índice de Massa Corporal (IMC)
                e acompanhe a classificação de cada cadastro.
            </p>
        </header>

        <!-- Formulário de cadastro e edição -->
        <section class="card" aria-labelledby="titulo-form">

            <h2 id="titulo-form">Nova pessoa</h2>

            <form id="form-pessoa" novalidate>

                <div class="campo campo-nome">
                    <label for="input-nome">Nome</label>

                    <input
                        type="text"
                        id="input-nome"
                        name="nome"
                        maxlength="50"
                        autocomplete="name"
                        placeholder="Ex.: Maria Silva"
                    >
                </div>

                <div class="campo">
                    <label for="input-idade">Idade (anos)</label>

                    <input
                        type="number"
                        id="input-idade"
                        name="idade"
                        min="1"
                        max="120"
                        step="1"
                        placeholder="Ex.: 30"
                    >
                </div>

                <div class="campo">
                    <label for="input-altura">Altura (m)</label>

                    <input
                        type="number"
                        id="input-altura"


                        name="altura"
                        min="0.5"
                        max="2.5"
                        step="0.01"
                        placeholder="Ex.: 1.75"
                    >
                </div>

                <div class="campo">
                    <label for="input-peso">Peso (kg)</label>

                    <input
                        type="number"
                        id="input-peso"
                        name="peso"
                        min="2"
                        max="500"
                        step="0.1"
                        placeholder="Ex.: 70"
                    >
                </div>

                <div class="botoes">

                    <button type="submit" id="btn-salvar">
                        Salvar
                    </button>

                    <button
                        type="button"
                        id="btn-cancelar"
                        class="secundario"
                        hidden
                    >
                        Cancelar
                    </button>

                </div>

            </form>

            <p id="erro" role="alert" aria-live="assertive" hidden></p>

        </section>

        <!-- Tabela de pessoas cadastradas -->
        <section class="card" aria-labelledby="titulo-tabela">

            <h2 id="titulo-tabela">Pessoas cadastradas</h2>

            <div
                class="tabela-wrapper"
                role="region"
                aria-label="Tabela de pessoas cadastradas"
                tabindex="0"
            >

                <table>

                    <caption class="texto-oculto">
                        Lista de pessoas cadastradas e seus respectivos resultados de IMC.
                    </caption>

                    <thead>
                        <tr>
                            <th scope="col">Nome</th>
                            <th scope="col">Idade</th>
                            <th scope="col">Altura</th>
                            <th scope="col">Peso</th>
                            <th scope="col">IMC</th>
                            <th scope="col">Classificação</th>
                            <th scope="col">Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-pessoas">
                        <!-- Os registros serão inseridos pelo JavaScript -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="script.js" defer></script>

<script src="script.js"></script></body>
</html>
