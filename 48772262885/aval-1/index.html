<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Produtos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input {
            width: 22%;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #174db2;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .editar {
            background: #16a34a;
        }

        .excluir {
            background: #dc2626;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">
    <h1>📦 Sistema de Estoque</h1>

    <h3>Cadastrar Produto</h3>

    <input type="text" id="codigo" placeholder="Código">
    <input type="text" id="descricao" placeholder="Descrição">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valor" placeholder="Valor" step="0.01">

    <button onclick="cadastrarProduto()">Cadastrar</button>

    <h3>Produtos Cadastrados</h3>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Valor</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="listaProdutos"></tbody>
    </table>
</div>

<script>
    // Lista que armazena os produtos
    let produtos = [];

    // Cadastrar um novo produto
    function cadastrarProduto() {
        let codigo = document.getElementById("codigo").value;
        let descricao = document.getElementById("descricao").value;
        let quantidade = Number(document.getElementById("quantidade").value);
        let valor = Number(document.getElementById("valor").value);

        if (codigo === "" || descricao === "" || quantidade < 0 || valor < 0) {
            alert("Preencha todos os campos corretamente!");
            return;
        }

        produtos.push({
            codigo: codigo,
            descricao: descricao,
            quantidade: quantidade,
            valor: valor
        });

        limparCampos();
        listarProdutos();
    }

    // Listar os produtos
    function listarProdutos() {
        let lista = document.getElementById("listaProdutos");

        lista.innerHTML = "";

        produtos.forEach((produto, index) => {
            lista.innerHTML += `
                <tr>
                    <td>${produto.codigo}</td>
                    <td>${produto.descricao}</td>
                    <td>${produto.quantidade}</td>
                    <td>R$ ${produto.valor.toFixed(2)}</td>

                    <td>
                        <button class="editar" onclick="alterarValor(${index})">
                            Alterar Valor
                        </button>

                        <button class="editar" onclick="alterarQuantidade(${index})">
                            Alterar Quantidade
                        </button>

                        <button class="excluir" onclick="excluirProduto(${index})">
                            Excluir
                        </button>
                    </td>
                </tr>
            `;
        });
    }

    // Alterar o valor
    function alterarValor(index) {
        let novoValor = prompt("Digite o novo valor:");

        if (novoValor !== null && novoValor !== "" && Number(novoValor) >= 0) {
            produtos[index].valor = Number(novoValor);
            listarProdutos();
        }
    }

    // Alterar a quantidade
    function alterarQuantidade(index) {
        let novaQuantidade = prompt("Digite a nova quantidade:");

        if (novaQuantidade !== null && novaQuantidade !== "" && Number(novaQuantidade) >= 0) {
            produtos[index].quantidade = Number(novaQuantidade);
            listarProdutos();
        }
    }

    // Excluir produto
    function excluirProduto(index) {
        if (confirm("Deseja excluir este produto?")) {
            produtos.splice(index, 1);
            listarProdutos();
        }
    }

    // Limpar os campos
    function limparCampos() {
        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("valor").value = "";
    }
</script>

</body>
</html>
