<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Gerenciador de Tarefas</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <main class="container">
              <h1>Gerenciador de Tarefas</h1>
                  <p class="subtitulo">Projeto da Aula 17 - Arrays, Objetos e Funções</p>

                      <form id="form-tarefa" class="card">
                            <label for="titulo">Título da tarefa</label>
                                  <input type="text" id="titulo" placeholder="Ex: Estudar JavaScript" required>

                                        <label for="prioridade">Prioridade (1 a 3)</label>
                                              <input type="number" id="prioridade" min="1" max="3" placeholder="1 = mais alta" required>

                                                    <button type="submit">Cadastrar Tarefa</button>
                                                          <p id="mensagem" class="mensagem"></p>
                                                              </form>

                                                                  <section class="card">
                                                                        <h2>Tarefas Cadastradas</h2>
                                                                              <ul id="lista-tarefas"></ul>
                                                                                    <p id="vazio">Nenhuma tarefa cadastrada ainda.</p>
                                                                                        </section>
                                                                                          </main>

                                                                                            <script src="script.js"></script>
                                                                                            <script src="script.js"></script></body>
                                                                                            </html>
