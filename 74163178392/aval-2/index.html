<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciador de Tarefas</title>
<link href="style.css" rel="stylesheet"></head>
<body>

  <h1>Gerenciador de Tarefas</h1>

  <!-- Formulario de Cadastro -->
  <div>
    <label for="inputTitulo">Título:</label>
    <input type="text" id="inputTitulo" placeholder="Título (mín. 5 caracteres)">

    <label for="selectPrioridade">Prioridade:</label>
    <select id="selectPrioridade">
      <option value="1">1 (Alta)</option>
      <option value="2">2 (Média)</option>
      <option value="3">3 (Baixa)</option>
    </select>

    <button onclick="cadastrar()">Cadastrar Tarefa</button>
  </div>

  <!-- Exibicao de Erros -->
  <p id="msgErro" style="color: red;"></p>

  <hr>

  <!-- Lista de Tarefas -->
  <h2>Lista de Tarefas</h2>
  <ul id="listaTarefas"></ul>

  <!-- Importacao do JavaScript -->
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
