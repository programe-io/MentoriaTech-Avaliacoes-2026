<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta+ | Inscrições</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Conecta+</h1>
        <p>Participe dos eventos da sua escola!</p>
    </header>

    <main>
        <section>
            <h2>Cadastrar evento</h2>
            <form id="eventoForm">
                <input id="nomeEvento" placeholder="Nome do evento" required>
                <input id="vagasEvento" type="number" min="1" placeholder="Quantidade de vagas" required>
                <button type="submit">Adicionar evento</button>
            </form>
        </section>

        <section>
            <h2>Inscrever participante</h2>
            <form id="inscricaoForm">
                <input id="nomeAluno" placeholder="Nome do estudante" required>
                <input id="turmaAluno" placeholder="Turma" required>
                <select id="eventoEscolhido" required>
                    <option value="">Selecione um evento</option>
                </select>
                <button type="submit">Realizar inscrição</button>
            </form>
            <p id="mensagem"></p>
        </section>

        <section>
            <h2>Eventos disponíveis</h2>
            <div id="listaEventos"></div>
        </section>

        <section>
            <h2>Participantes inscritos</h2>
            <div id="listaParticipantes"></div>
        </section>
    </main>

    <footer>Conecta+ © 2026</footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
