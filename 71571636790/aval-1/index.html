
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação</title>
  <link rel="stylesheet" href="avaliacao1.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <main class="container">
    <h1>Jogo de Adivinhação</h1>
    <p>Tente descobrir o número secreto entre 1 e 20. Você tem cinco tentativas.</p>
    <form id="formulario">
      <label for="palpite">Seu palpite:</label>
      <input id="palpite" type="number" min="1" max="20" required>
      <button type="submit">Tentar</button>
    </form>
    <p id="mensagem" aria-live="polite">Boa sorte!</p>
    <p>Tentativas restantes: <strong id="restantes">5</strong></p>
    <button id="reiniciar" type="button">Jogar novamente</button>
  </main>
  <script src="avaliacao1.js"></script>
<script src="script.js"></script></body>
</html>
