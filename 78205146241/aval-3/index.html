<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone - Perfil</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones externos para os botões -->
    <link rel="stylesheet" href="https://cloudflare.com">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <!-- Barra de Navegação Superior -->
    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">Instagram</a>
            <div class="search-bar">
                <input type="text" placeholder="Pesquisar">
            </div>
            <nav class="nav-links">
                <a href="#" title="Página Inicial"><i class="fa-solid fa-house"></i></a>
                <a href="#" title="Mensagens"><i class="fa-brands fa-facebook-messenger"></i></a>
                <a href="#" title="Explorar"><i class="fa-regular fa-compass"></i></a>
                <a href="#" title="Notificações"><i class="fa-regular fa-heart"></i></a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="profile-container">
        
        <!-- Cabeçalho do Perfil -->
        <header class="profile-header">
            <div class="profile-image">
                <img src="https://media.istockphoto.com/id/172422750/pt/foto/yum.jpg?s=612x612&w=0&k=20&c=ZSMhlLyFzsc11EeY-ButHLDdgd-lCRMWklsv3JaZfA0=" alt="Foto de perfil do cachorro">
            </div>
            <section class="profile-info">
                <div class="profile-user-settings">
                    <h1 class="username">dog_influencer</h1>
                    <a href="#" class="btn-edit-profile">Editar perfil</a>
                    <a href="#" class="settings-link" title="Configurações"><i class="fa-solid fa-gear"></i></a>
                </div>
                <div class="profile-stats">
                    <ul>
                        <li><span class="profile-stat-count">3</span> publicações</li>
                        <li><span class="profile-stat-count">15.4k</span> seguidores</li>
                        <li><span class="profile-stat-count">482</span> seguindo</li>
                    </ul>
                </div>
                <div class="profile-bio">
                    <h2 class="profile-real-name">Baleia o Cãozinho</h2>
                    <p>Apenas um doguinho espalhando alegria na internet! 🐾</p>
                    <a href="https://unsplash.com" target="_blank" class="bio-link">meus-petiscos-favoritos.com</a>
                </div>
            </section>
        </header>

        <!-- Abas de Navegação do Perfil -->
        <div class="profile-tabs">
            <a href="#" class="tab active"><i class="fa-solid fa-table-cells"></i> PUBLICAÇÕES</a>
            <a href="#" class="tab"><i class="fa-regular fa-bookmark"></i> SALVOS</a>
            <a href="#" class="tab"><i class="fa-id-badge"></i> MARCADOS</a>
        </div>

        <!-- Grade de Fotos (Feed) -->
        <div class="images-grid">
            <div class="grid-item">
                <img src="https://i.pinimg.com/736x/b2/58/8c/b2588ce1e63fbc93c8faa7f4108fd4e8.jpg" alt="Cachorro de óculos escuros">
                <div class="grid-item-overlay">
                    <span><i class="fa-solid fa-heart"></i> 1,240</span>
                    <span><i class="fa-solid fa-comment"></i> 56</span>
                </div>
            </div>
            <div class="grid-item">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0I0TO99nWqTCD55DeFcEjDh9VfpQwqge-74JwsXMe2Q&s=10" alt="Filhote de cachorro deitado">
                <div class="grid-item-overlay">
                    <span><i class="fa-solid fa-heart"></i> 2,890</span>
                    <span><i class="fa-solid fa-comment"></i> 112</span>
                </div>
            </div>
            <div class="grid-item">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT78Sfr0uOwxnzp-SXojOaLgrdztvqhKl1Zld-gjV75vA&s=10" alt="Cachorro feliz sorrindo">
                <div class="grid-item-overlay">
                    <span><i class="fa-solid fa-heart"></i> 945</span>
                    <span><i class="fa-solid fa-comment"></i> 34</span>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
